## RabbitMQ Configuration for FixitLab

# Default user (from environment)
default_user = guest
default_pass = guest

# Loopback users allowed (Docker network)
loopback_users.guest = false

# Memory protection
vm_memory_high_watermark.relative = 0.6

# Disk protection
disk_free_limit.relative = 1.0

# Logging
log.console = true
log.console.level = info

