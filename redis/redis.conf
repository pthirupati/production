# Bind to all interfaces (Docker network)
bind 0.0.0.0

# Default Redis port
port 6379

# Do not daemonize (Docker requirement)
daemonize no

# Persistence (safe defaults)
save 900 1
save 300 10
save 60 10000

# Append-only file (extra safety)
appendonly yes
appendfilename "appendonly.aof"

# Max memory — volatile-lru only evicts keys that have a TTL, so the
# SESSION_TTL=7200 vmware_sim engine state (source of truth for labs) is not
# silently wiped by catalog-cache pressure (audit §Z5-4).
maxmemory 2gb
maxmemory-policy volatile-lru

# Log level
loglevel notice

