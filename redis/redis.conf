# Bind to all interfaces (Docker network)
bind 0.0.0.0

# Default Redis port
port 6379

# Do not daemonize (Docker requirement)
daemonize no

# Persistence (safe defaults)
save 900 1
save 300 10
save 60 10000

# Append-only file (extra safety)
appendonly yes
appendfilename "appendonly.aof"

# Max memory policy (avoid crashes)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Log level
loglevel notice

