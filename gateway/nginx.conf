# ══════════════════════════════════════════════════════════════════════
# FixitLab Production Nginx Configuration — Hardened
# Scale: 10L+ users, High Security, Multi-region ready
# ══════════════════════════════════════════════════════════════════════

# ── Rate limiting zones (per IP address) ──
limit_req_zone $binary_remote_addr zone=api_rate:20m rate=25r/s;
limit_req_zone $binary_remote_addr zone=auth_rate:20m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login_rate:20m rate=15r/m;
limit_req_zone $binary_remote_addr zone=payment_rate:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ws_rate:20m rate=10r/s;

# ── Connection limiting zones ──
limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;
limit_conn_zone $binary_remote_addr zone=ws_conn_per_ip:10m;

# ── Upstream backends (horizontal scaling ready) ──
# In Kubernetes, these would be managed by a service
upstream backend_pool {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# WebSocket terminal — dedicated upstream without keepalive reuse
upstream backend_ws {
    server backend:8000 max_fails=3 fail_timeout=30s;
}

# ── Gzip compression (optimized for fast networks) ──
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types 
    text/plain 
    text/css 
    text/xml 
    text/javascript 
    application/javascript 
    application/json 
    application/xml 
    application/rss+xml 
    image/svg+xml 
    application/atom+xml;

# ── Brotli compression (if available, for better compression) ──
# Uncomment if libbrotli is compiled into nginx
# brotli on;
# brotli_comp_level 4;

# ── Custom error pages ──
error_page 403 /errors/403.html;
error_page 404 /errors/404.html;
error_page 500 502 503 504 /errors/50x.html;

# ── Logging ──
# Access logs disabled by default for high-volume production
# Enable selectively for debugging
access_log off;
error_log /var/log/nginx/error.log warn;

# Redirect HTTP → HTTPS (except ACME challenge)
server {
    listen 80;
    server_name www.fixitlab.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://fixitlab.in$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name fixitlab.in _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://fixitlab.in$request_uri;
    }
}

# www → apex (GitHub OAuth allows only one callback URL on fixitlab.in)
server {
    listen 443 ssl http2;
    server_name www.fixitlab.in;

    ssl_certificate     /etc/letsencrypt/live/fixitlab.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fixitlab.in/privkey.pem;

    return 301 https://fixitlab.in$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name fixitlab.in;

    # ── SSL Certificates (Let's Encrypt) ──
    ssl_certificate     /etc/letsencrypt/live/fixitlab.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fixitlab.in/privkey.pem;

    # ── SSL Configuration (Mozilla Modern) ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers (Comprehensive) ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(self), microphone=(self), geolocation=(), usb=(), payment=(), vr=()" always;
    
    # Content Security Policy (strict for production)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' wss://*.fixitlab.in wss://localhost:* https://api.github.com https://accounts.google.com https://oauth2.googleapis.com https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com; font-src 'self' data: https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Additional security
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Content-Security-Policy "default-src 'self'" always;

    client_max_body_size 10m;
    client_body_buffer_size 128k;
    server_tokens off;

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Performance: Keepalive ──
    keepalive_timeout 65s;
    keepalive_requests 100;

    # ── Caching defaults ──
    # These are overridden per-location
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=general:10m max_size=1g inactive=60m;
    map $request_method $bypass_cache {
        default 1;
        GET 0;
        HEAD 0;
    }

    # ── DJANGO STATIC FILES ──
    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── FRONTEND (production build served by nginx) ──
    location / {
        proxy_pass http://frontend-prod:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── LOGIN/REGISTER (strict rate limit) ──
    location ~ ^/api/auth/(login|register|verify-otp)/ {
        limit_req zone=login_rate burst=10 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 5;
        
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    # ── AUTH ENDPOINTS ──
    location /api/auth/ {
        limit_req zone=auth_rate burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend_pool/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── BILLING & PAYMENTS (strict rate limit) ──
    location ~ ^/api/billing/ {
        limit_req zone=payment_rate burst=5 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 10;
        
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Stripe-Signature $http_stripe_signature;
        
        # Payment requests need longer timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Django Admin (RESTRICTED IN PRODUCTION) ──
    # Django admin should NEVER be publicly accessible!
    # Restrict to internal networks + require basic auth
    location /django-admin/ {
        # Restrict by IP
        allow 127.0.0.1;
        allow 10.0.0.0/8;      # Docker internal
        allow 172.16.0.0/12;   # Kubernetes services
        allow 192.168.0.0/16;  # Private networks
        # ADD YOUR STATIC ADMIN IP(S) HERE:
        # allow 203.0.113.1;
        deny all;

        # Require basic authentication
        auth_basic "Admin Access — Credentials Required";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=auth_rate burst=3 nodelay;
        
        proxy_pass http://backend_pool/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── BACKEND API (general endpoints) ──
    # All API endpoints here are rate-limited and proxied to backend pool
    location /api/ {
        limit_req zone=api_rate burst=50 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 50;
        
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running operations (labs, uploads, etc.)
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        
        # For uploading large files (images, scenario defs)
        proxy_request_buffering off;
    }

    # ── WEBSOCKETS (long-lived connections for terminal) ──
    location /ws/ {
        limit_conn ws_conn_per_ip 10;
        proxy_pass http://backend_ws/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Health Check (INTERNAL ONLY) ──
    # For Docker healthcheck + Kubernetes liveness/readiness probes
    location = /health {
        access_log off;
        
        # Only allow internal Docker/Kubernetes networks
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://backend_pool/api/health/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # ── Redirect root to main frontend ──
    location = / {
        proxy_pass http://frontend-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Security: Block dangerous paths ──
    location ~ /\. {
        return 403;
    }
    
    location ~ /(\.env|\.git|\.gitignore|\.htaccess|composer\.json|composer\.lock|package\.json) {
        return 403;
    }
    
    location ~ ^/(phpMyAdmin|phpmyadmin|wp-admin|wp-login|admin\.php|config\.php) {
        return 404;
    }

    # ── Static files (JS, CSS, images) with aggressive caching ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary "Accept-Encoding";
    }

    # ── Not found handler ──
    location ~ / {
        proxy_pass http://frontend-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
