# ── Rate limiting zones ──
limit_req_zone $binary_remote_addr zone=api_rate:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_rate:20m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login_rate:20m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ws_rate:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=billing_rate:10m rate=30r/m;

# ── Connection limiting zones ──
limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;
limit_conn_zone $binary_remote_addr zone=ws_conn_per_ip:10m;

# ── Upstream backends (add more entries for horizontal scaling) ──
upstream backend_pool {
    least_conn;
    server backend:8000;
    # Add more instances when scaling horizontally:
    # server backend_2:8000;
    # server backend_3:8000;
    keepalive 32;
}

# ── Gzip compression ──
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

server {
    listen 80;
    server_name _;

    # ── Security Headers ──
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # Disable server version disclosure
    server_tokens off;

    # ── DJANGO STATIC FILES ──
    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── FRONTEND (React / Vite) ──
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── LOGIN/REGISTER (stricter rate limit) ──
    location ~ ^/api/auth/(login|register)/ {
        limit_req zone=login_rate burst=15 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 10;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── AUTH ENDPOINTS (profile, password, etc.) ──
    location /api/auth/ {
        limit_req zone=auth_rate burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── DJANGO ADMIN (backend admin panel — protected with basic auth) ──
    location /django-admin/ {
        auth_basic "Admin Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=auth_rate burst=5 nodelay;
        proxy_pass http://backend_pool/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── PAYMENT / BILLING (rate limited) ──
    location ~ ^/api/billing/(razorpay|confirm-payment|subscribe)/ {
        limit_req zone=billing_rate burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── STRIPE / RAZORPAY WEBHOOK (no rate limit, raw body needed) ──
    location /api/billing/webhook/ {
        proxy_pass http://backend_pool/api/billing/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Stripe-Signature $http_stripe_signature;
    }

    # ── BACKEND API ──
    location /api/ {
        limit_req zone=api_rate burst=40 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 30;
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for slower upstream operations
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── WEBSOCKETS ──
    location /ws/ {
        limit_req zone=ws_rate burst=5 nodelay;
        limit_conn ws_conn_per_ip 5;
        proxy_pass http://backend_pool/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── MAILHOG (Admin-only email viewer) ──
    location /mailbox/ {
        auth_basic "Admin Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Rewrite /mailbox/ → / for MailHog
        rewrite ^/mailbox/(.*) /$1 break;
        proxy_pass http://mailhog:8025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── MailHog API (for admin-only programmatic access) ──
    location /api/v2/messages {
        auth_basic "Admin Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://mailhog:8025/api/v2/messages;
        proxy_set_header Host $host;
    }

    # ── Healthcheck ──
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Block common exploit paths ──
    location ~* /(\.env|\.git|wp-admin|phpMyAdmin|phpmyadmin) {
        return 404;
    }
}

