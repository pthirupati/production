# ── Rate limiting zones ──
limit_req_zone $binary_remote_addr zone=api_rate:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_rate:20m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login_rate:20m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ws_rate:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=billing_rate:10m rate=30r/m;

# ── Connection limiting zones ──
limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;
limit_conn_zone $binary_remote_addr zone=ws_conn_per_ip:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Upstream backends (add more instances for horizontal scaling) ──
upstream backend_pool {
    least_conn;
    server backend:8000;
    keepalive 32;
}

# WebSocket terminal — no keepalive pool (reuse breaks Upgrade handshakes)
upstream backend_ws {
    server backend:8000;
}

# ── Gzip compression ──
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

# Redirect HTTP → HTTPS (except ACME challenge)
server {
    listen 80;
    server_name www.fixitlab.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fixitlab.in$request_uri;
    }
}

server {
    listen 80;
    server_name fixitlab.in;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://fixitlab.in$request_uri;
    }

    # Healthcheck (for load balancers / Docker)
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# www → apex (GitHub OAuth allows only one callback URL on fixitlab.in)
server {
    listen 443 ssl;
    server_name www.fixitlab.in;

    ssl_certificate     /etc/letsencrypt/live/fixitlab.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fixitlab.in/privkey.pem;

    return 301 https://fixitlab.in$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name fixitlab.in;

    # ── SSL Certificates (mounted from host or secrets) ──
    # In Docker: mount host path /etc/letsencrypt/live/<domain>/ to the container path
    #   example docker-compose snippet:
    #     volumes:
    #       - /etc/letsencrypt/live/fixitlab.in:/etc/letsencrypt/live/fixitlab.in:ro
    # In Kubernetes: mount TLS secret to /etc/ssl/certs/<domain>/ via projected volume
    # Paths below are the default used by our production manifests and docs.
    ssl_certificate     /etc/letsencrypt/live/fixitlab.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fixitlab.in/privkey.pem;

    # Also allow override via environment-mounted files for multi-tenant deployments
    # (Adjust paths in docker-compose.prod.yml or k8s manifests as needed)

    # ── SSL Configuration (Mozilla Modern) ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com; connect-src 'self' wss://*.fixitlab.in https://api.github.com https://accounts.google.com https://oauth2.googleapis.com https://api.razorpay.com https://lumberjack.razorpay.com; font-src 'self' data: https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none';" always;

    client_max_body_size 10m;
    server_tokens off;

    # ── DJANGO STATIC FILES ──
    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── FRONTEND (production build served by nginx) ──
    location / {
        proxy_pass http://frontend-prod:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── LOGIN/REGISTER (stricter rate limit) ──
    location ~ ^/api/auth/(login|register)/ {
        limit_req zone=login_rate burst=15 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 10;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── AUTH ENDPOINTS ──
    location /api/auth/ {
        limit_req zone=auth_rate burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── DJANGO ADMIN (restricted to admin IP + basic auth) ──
    # In production, Django Admin should NEVER be publicly accessible.
    # Restrict to your admin IP(s) + require basic auth as second factor.
    location /django-admin/ {
        # Allow only known admin IPs (update with your static IP)
        allow 127.0.0.1;
        allow 10.0.0.0/8;      # Internal/VPN network
        allow 172.16.0.0/12;   # Docker internal
        allow 192.168.0.0/16;  # Private network
        # Add your admin IP here:
        # allow YOUR.ADMIN.IP.HERE;
        deny all;

        # Additional basic auth layer
        auth_basic "Admin Access — Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=auth_rate burst=3 nodelay;
        proxy_pass http://backend_pool/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── STRIPE WEBHOOK ──
    location /api/billing/webhook/ {
        proxy_pass http://backend_pool/api/billing/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Stripe-Signature $http_stripe_signature;
    }

    # ── BACKEND API ──
    location /media/ {
        proxy_pass http://backend_pool/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_rate burst=40 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 30;
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── WEBSOCKETS ──
    location /ws/ {
        # Long-lived terminal connections — rate-limiting reconnect bursts causes 503 loops
        limit_conn ws_conn_per_ip 10;
        proxy_pass http://backend_ws/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── MailHog — DISABLED IN PRODUCTION ──
    # MailHog is NOT included in production. Block any access attempts.
    location /mailbox/ {
        return 404;
    }
    location /api/v2/messages {
        return 404;
    }

    # ── Block common exploit paths ──
    location ~* /(\.\.env|\.env|\.git|wp-admin|phpMyAdmin|phpmyadmin|\.well-known/security\.txt) {
        return 404;
    }

    # ── Block direct /api/health/ from external access ──
    # Health checks are done internally by Docker/k8s via container healthcheck.
    # External users should not be able to probe this endpoint.
    location = /api/health/ {
        # Only allow internal Docker/k8s networks
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend_pool/api/health/;
        proxy_set_header Host $host;
    }
}
