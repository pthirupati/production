# HashiCorp Vault for FixitLab secrets (run on production server only)
# Usage:
#   docker compose -f docker-compose.vault.yml up -d
#   ./scripts/vault/bootstrap.sh deploy/production.env
#
# Access via: docker compose -f docker-compose.vault.yml exec vault vault ...

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: fixitlab_vault
    cap_add:
      - IPC_LOCK
    # Bypass docker-entrypoint.sh — it injects dev mode on 0.0.0.0:8200 and duplicates listeners
    entrypoint: ["vault", "server", "-config=/etc/vault/config.hcl"]
    volumes:
      - ./infra/vault/config.hcl:/etc/vault/config.hcl:ro
      - vault_data:/vault/data
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://vault:8200
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD-SHELL", "code=$$(vault status -format=yaml >/dev/null 2>&1; echo $$?); test $$code -eq 0 -o $$code -eq 2"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  fixitlab_net:
    name: fixitlab_net
    external: true

volumes:
  vault_data:
    name: fixitlab_vault_data
