# FixitLab — secret TEMPLATE (DO NOT COMMIT REAL VALUES).
#
# This is an EXAMPLE only. In a real DOKS/EKS deploy, create the Secret from the
# rotated .env.production produced by scripts/ci-generate-secrets.py, e.g.:
#
#   kubectl -n fixitlab create secret generic fixitlab-secrets \
#     --from-env-file=.env.production --dry-run=client -o yaml | kubectl apply -f -
#
# or, better, use Sealed Secrets / External Secrets Operator backed by Vault
# (the platform already runs Vault; see docs/VAULT_SETUP.md). The committed file
# only documents the KEYS the workloads expect — never the values.
apiVersion: v1
kind: Secret
metadata:
  name: fixitlab-secrets
  namespace: fixitlab
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "REPLACE-VIA-SEALED-SECRET-OR-ENV-FILE"
  POSTGRES_DB: "fixitlab"
  POSTGRES_USER: "fixitlab"
  POSTGRES_PASSWORD: "REPLACE"
  REDIS_PASSWORD: "REPLACE"
  RABBITMQ_USER: "fixitlab"
  RABBITMQ_PASS: "REPLACE"
  JWT_HS256_SECRET: "REPLACE"
  SUPERUSER_EMAIL: "admin@fixitlab.in"
  SUPERUSER_PASSWORD: "REPLACE"
