# FixitLab — base kustomization (shared by DOKS + EKS overlays).
#
# Apply directly:   kubectl apply -k infra/k8s/base
# Or via overlay:   kubectl apply -k infra/k8s/overlays/doks
#                   kubectl apply -k infra/k8s/overlays/eks
#
# The secret is NOT listed here — create it out-of-band from the rotated
# .env.production (see secret.example.yaml) or via Sealed/External Secrets.
#
# Image tags: override at deploy time without editing files, e.g.
#   kustomize edit set image \
#     fixitlab/fixitlab-backend=$NS/fixitlab-backend:$TAG \
#     fixitlab/fixitlab-frontend=$NS/fixitlab-frontend:$TAG
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fixitlab

resources:
  - namespace.yaml
  - configmap.yaml
  - backend.yaml
  - celery.yaml
  - frontend.yaml
  - ingress.yaml

images:
  - name: fixitlab/fixitlab-backend
    newTag: latest
  - name: fixitlab/fixitlab-frontend
    newTag: latest
