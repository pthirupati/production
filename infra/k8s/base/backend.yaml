# FixitLab — backend (Django ASGI/uvicorn) Deployment + Service + HPA.
# Modular monolith: ONE backend image serves API + WebSocket + admin.
# Image is pulled from Docker Hub; the tag is substituted at apply time from
# FIXITLAB_IMAGE_NS + IMAGE_TAG (see infra/k8s/overlays + docs/KUBERNETES.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fixitlab
  labels: { app: backend, app.kubernetes.io/part-of: fixitlab }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          # Substituted by the deploy job: ${FIXITLAB_IMAGE_NS}/fixitlab-backend:${IMAGE_TAG}
          image: fixitlab/fixitlab-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: fixitlab-config }
            - secretRef: { name: fixitlab-secrets }
          resources:
            requests: { memory: "384Mi", cpu: "250m" }
            limits: { memory: "1Gi", cpu: "1" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fixitlab
  labels: { app: backend }
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: fixitlab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
