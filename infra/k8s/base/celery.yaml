# FixitLab — Celery worker + beat (same backend image, different command).
# Worker has an HPA; beat is a singleton (replicas: 1, no HPA — only one scheduler).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: fixitlab
  labels: { app: celery-worker, app.kubernetes.io/part-of: fixitlab }
spec:
  replicas: 2
  selector:
    matchLabels: { app: celery-worker }
  template:
    metadata:
      labels: { app: celery-worker }
    spec:
      containers:
        - name: worker
          image: fixitlab/fixitlab-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4"]
          envFrom:
            - configMapRef: { name: fixitlab-config }
            - secretRef: { name: fixitlab-secrets }
          resources:
            requests: { memory: "384Mi", cpu: "250m" }
            limits: { memory: "1Gi", cpu: "1" }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker
  namespace: fixitlab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: fixitlab
  labels: { app: celery-beat, app.kubernetes.io/part-of: fixitlab }
spec:
  replicas: 1
  strategy: { type: Recreate }   # never two schedulers at once
  selector:
    matchLabels: { app: celery-beat }
  template:
    metadata:
      labels: { app: celery-beat }
    spec:
      containers:
        - name: beat
          image: fixitlab/fixitlab-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
          envFrom:
            - configMapRef: { name: fixitlab-config }
            - secretRef: { name: fixitlab-secrets }
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "250m" }
