# One-click START — full FixitLab production platform (preserves user data in Docker volumes)
name: Platform Start

on:
  workflow_dispatch:
    inputs:
      build_scenarios:
        description: "Rebuild scenario Docker images"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      git_ref:
        description: "Git branch or tag to deploy (default: main)"
        required: false
        default: "main"

jobs:
  start:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Start platform on production server
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            if [ ! -d /opt/fixitlab/.git ]; then
              mkdir -p /opt/fixitlab
              git clone "$REPO" /opt/fixitlab
            fi
            cd /opt/fixitlab
            git remote set-url origin "$REPO"
            git fetch origin
            git checkout ${{ inputs.git_ref }}
            git reset --hard "origin/${{ inputs.git_ref }}"
            chmod +x scripts/platform-start.sh scripts/platform-stop.sh scripts/build-scenario-images.sh scripts/startup.sh
            test -f deploy/production.env || { echo "ERROR: deploy/production.env missing in repo"; exit 1; }
            cp deploy/production.env .env.production
            chmod 600 .env.production
            export BUILD_SCENARIOS=${{ inputs.build_scenarios }}
            export COMPOSE_FILE=docker-compose.prod.yml
            export ENV_FILE=.env.production
            ./scripts/platform-start.sh

      - name: Summary
        run: |
          echo "FixitLab production started"
          echo "User data persists in Docker volume: fixitlab_db_data"
