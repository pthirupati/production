# FixitLab — Dependency vulnerability scanning (FREE, advisory).
#
# Quick-win #14 from docs/GAP_ANALYSIS.md. Runs pip-audit on the Python deps and
# `npm audit` on the frontend lockfile. Both steps are advisory only
# (continue-on-error) so a freshly-disclosed CVE surfaces in the Actions log
# without ever blocking a deploy or PR. Tighten to fail-on-high later if desired.
#
# Triggers: manual, weekly, and on changes to dependency manifests.

name: Dependency scan

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    paths:
      - "backend/requirements.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/dependency-scan.yml"
  pull_request:
    paths:
      - "backend/requirements.txt"
      - "frontend/package-lock.json"

permissions:
  contents: read

concurrency:
  group: dependency-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend requirements
        # Advisory: report findings but never fail the workflow.
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --desc

  npm-audit:
    name: npm audit (frontend deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit frontend dependencies
        working-directory: frontend
        # Advisory: surface moderate+ findings without blocking.
        continue-on-error: true
        run: npm audit --audit-level=moderate
