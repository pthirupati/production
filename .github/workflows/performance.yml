# performance.yml — Weekly performance benchmarks
# Covers: Lighthouse CI on key SPA routes, k6 load test on critical APIs,
#         DB query count regression check
#
# Audit Z5-20: schedule was removed and left the suite dormant. Weekly cron is
# restored; jobs no-op cleanly when staging URLs are unset so a missing secret
# does not red-fail every Sunday. k6 remains anonymous-read-only — it cannot
# detect Z5-1…Z5-7 (see scripts/k6/anonymous-read-apis.js).
name: Performance

on:
  schedule:
    - cron: "0 5 * * 0" # Sundays 05:00 UTC (before Monday dependency/security scans)
  workflow_dispatch:
    inputs:
      base_url:
        description: "API base URL"
        required: false
        default: ""
      site_url:
        description: "Public site URL"
        required: false
        default: ""

concurrency:
  group: performance
  cancel-in-progress: false

jobs:
  # ─── Lighthouse CI ────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Resolve site URL
        id: cfg
        env:
          INPUT_SITE: ${{ github.event.inputs.site_url }}
          SECRET_SITE: ${{ secrets.STAGING_SITE_URL }}
        run: |
          SITE="${INPUT_SITE:-$SECRET_SITE}"
          if [ -z "$SITE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "STAGING_SITE_URL / site_url unset — skipping Lighthouse"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "site=$SITE" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-node-frontend
        if: steps.cfg.outputs.skip != 'true'
      - name: Install Lighthouse CI
        if: steps.cfg.outputs.skip != 'true'
        run: npm install -g @lhci/cli
      - name: Build frontend
        if: steps.cfg.outputs.skip != 'true'
        working-directory: frontend
        run: npm run build
      - name: Run Lighthouse CI
        if: steps.cfg.outputs.skip != 'true'
        env:
          SITE_URL: ${{ steps.cfg.outputs.site }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          lhci autorun \
            --upload.target=temporary-public-storage \
            --collect.url="${SITE_URL}/" \
            --collect.url="${SITE_URL}/scenarios" \
            --collect.url="${SITE_URL}/dashboard" \
            --collect.url="${SITE_URL}/leaderboard" \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.performance=warn \
            --assert.assertions.accessibility=error \
            --assert.assertions.best-practices=warn
      - name: Upload Lighthouse results
        if: always() && steps.cfg.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 30

  # ─── k6 load test ─────────────────────────────────────────────────────────
  k6-load:
    name: k6 load test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Resolve API base URL
        id: cfg
        env:
          INPUT_BASE: ${{ github.event.inputs.base_url }}
          SECRET_BASE: ${{ secrets.STAGING_BASE_URL }}
        run: |
          BASE="${INPUT_BASE:-$SECRET_BASE}"
          if [ -z "$BASE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "STAGING_BASE_URL / base_url unset — skipping k6"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi
      - name: Install k6
        if: steps.cfg.outputs.skip != 'true'
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -L | tar xvz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Run k6 load test
        if: steps.cfg.outputs.skip != 'true'
        env:
          BASE_URL: ${{ steps.cfg.outputs.base }}
        run: |
          k6 run scripts/k6/anonymous-read-apis.js \
            -e BASE_URL="${BASE_URL}" \
            --out json=/tmp/k6-results.json \
            --summary-trend-stats="avg,min,med,max,p(90),p(95),p(99)"
      - name: Upload k6 results
        if: always() && steps.cfg.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_id }}
          path: /tmp/k6-results.json
          retention-days: 30

  # ─── DB query count regression ────────────────────────────────────────────
  db-query-count:
    name: DB query count regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-backend
      - name: Install django-zen-queries
        run: pip install django-zen-queries
      - name: Migrate
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
        run: python manage.py migrate --run-syncdb
      - name: Run query-count tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          JIRA_SIMULATION_MODE: "False"
        run: |
          # This step used to end in `|| true`, which made it green in the one
          # case that matters: backend/tests/test_query_counts.py does not
          # exist, so the "N+1 regression guard" has never executed. Masking a
          # missing suite is worse than having no step at all, because the
          # green check actively asserts coverage we do not have.
          #
          # Fail loudly and specifically when the suite is absent, so the gap
          # is fixed rather than re-hidden; run it for real when it exists.
          if [ ! -f tests/test_query_counts.py ]; then
            echo "::error::backend/tests/test_query_counts.py is missing — the query-count/N+1 guard is not implemented. Add it or delete this job; do not mask it with '|| true'."
            exit 1
          fi
          python manage.py test tests.test_query_counts --verbosity=2
