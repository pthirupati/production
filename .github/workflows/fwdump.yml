name: Firewall Dump (in+out rules)

# Pure doctl (no SSH): dump full inbound AND outbound rules for every FixitLab
# cloud firewall as JSON, plus droplet->firewall associations. Root-causes the
# app(10.122.16.3) -> db(10.122.16.4):6432 timeout — prime suspect is a missing
# OUTBOUND allow on the app firewall or an INBOUND gap on the db firewall.
on:
  workflow_dispatch: {}

jobs:
  fwdump:
    name: Dump firewall rules
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Resolve DO API token (masked)
        id: tok
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
        run: |
          TOK="$DO_API_TOKEN"
          if [ -z "$TOK" ] && [ -n "$PRODUCTION_ENV_B64" ]; then
            TOK="$(echo "$PRODUCTION_ENV_B64" | base64 -d 2>/dev/null | grep '^DO_API_TOKEN=' | cut -d= -f2- | tr -d '\r')"
          fi
          [ -z "$TOK" ] && { echo "No DO token"; exit 1; }
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ steps.tok.outputs.token }}
      - name: Dump firewalls (full JSON) + droplet IPs
        run: |
          set +e
          echo "===== droplet tags -> private IPs ====="
          for t in fixitlab-edge fixitlab-app fixitlab-db fixitlab-labs; do
            id=$(doctl compute droplet list --tag-name "$t" --format ID --no-header | head -n1)
            [ -z "$id" ] && { echo "$t: (none)"; continue; }
            priv=$(doctl compute droplet get "$id" --format PrivateIPv4 --no-header)
            pub=$(doctl compute droplet get "$id" --format PublicIPv4 --no-header)
            echo "$t: id=$id priv=$priv pub=$pub"
          done
          echo
          echo "===== firewalls: name + inbound + OUTBOUND + droplet_ids ====="
          doctl compute firewall list -o json 2>&1 | python3 - <<'PY'
import json,sys
raw=sys.stdin.read()
try: fws=json.loads(raw)
except Exception as e:
    print("JSON parse failed:",e); print(raw[:2000]); sys.exit(0)
def fmt(rules,key):
    out=[]
    for r in rules or []:
        proto=r.get("protocol"); ports=r.get("ports")
        srcs=r.get(key,{}) or {}
        addrs=srcs.get("addresses",[]); tags=srcs.get("tags",[]); dids=srcs.get("droplet_ids",[])
        out.append(f"    {proto}/{ports}  <- addrs={addrs} tags={tags} droplet_ids={dids}")
    return "\n".join(out) if out else "    (none)"
for fw in fws:
    print(f"\n# {fw.get('name')}  id={fw.get('id')}")
    print(f"  droplet_ids={fw.get('droplet_ids')}  tags={(fw.get('tags') or [])}")
    print("  INBOUND:");  print(fmt(fw.get('inbound_rules'),'sources'))
    print("  OUTBOUND:"); print(fmt(fw.get('outbound_rules'),'destinations'))
PY
          echo "===== done ====="
