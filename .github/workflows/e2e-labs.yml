# e2e-labs.yml — Lab-specific E2E (on demand + nightly)
# Covers: all-scenarios catalog walk, lab start/stop, terminal connectivity,
#         scenario completion + validation, session replay, multi-user isolation,
#         multi-host labs, SCP/rsync scenarios, time extension
name: E2E — Labs

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to use on production server"
        type: string
        default: main
      run_unit:
        description: "Include Django unit tests before E2E"
        type: boolean
        default: true
      multi_users:
        description: "Number of parallel E2E test users (default 3)"
        type: string
        default: "3"
      skip_cleanup:
        description: "Skip test data cleanup (debug only)"
        type: boolean
        default: false
      isolation_once:
        description: "Only run dual-user isolation on first scenario"
        type: boolean
        default: true
  # schedule removed — all runs are manual only

concurrency:
  group: e2e-labs
  cancel-in-progress: false

jobs:
  # ─── Pre-flight: Django unit tests (optional) ────────────────────────────
  django-unit:
    name: Django unit tests (pre-flight)
    if: github.event.inputs.run_unit != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-backend
      - name: Migrate
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
        run: python manage.py migrate --run-syncdb
      - name: Unit tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          JIRA_SIMULATION_MODE: "False"
          SKIP_EMAIL_TESTS: "true"
        run: python manage.py test tests --verbosity=2 --parallel

  # ─── All-scenarios lab E2E on production server ───────────────────────────
  all-scenarios-e2e:
    name: All-scenarios lab E2E (production SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [django-unit]
    if: always() && (needs.django-unit.result == 'success' || needs.django-unit.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || 'main' }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Pull latest on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }} \
            "cd /opt/fixitlab && git fetch origin && git checkout ${{ github.event.inputs.git_ref || 'main' }} && git pull origin ${{ github.event.inputs.git_ref || 'main' }}"

      - name: Run all-scenarios lab E2E
        timeout-minutes: 100
        env:
          MULTI_USERS: ${{ github.event.inputs.multi_users || '3' }}
          ISOLATION_ONCE: ${{ github.event.inputs.isolation_once == 'false' && '0' || '1' }}
          SKIP_CLEANUP: ${{ github.event.inputs.skip_cleanup == 'true' && '1' || '0' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }} \
            "cd /opt/fixitlab && \
             E2E_MULTI_USERS=${MULTI_USERS} \
             E2E_ISOLATION_ONCE=${ISOLATION_ONCE} \
             E2E_SKIP_CLEANUP=${SKIP_CLEANUP} \
             E2E_SKIP_LAB=0 \
             bash scripts/ci-run-tests.sh 2>&1 | tee /tmp/e2e-labs-$(date +%Y%m%d-%H%M%S).log"

      - name: Fetch E2E logs
        if: always()
        run: |
          scp -i ~/.ssh/id_ed25519 \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }}:/tmp/e2e-labs-*.log" \
            ./e2e-labs-output.log || true

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-labs-logs-${{ github.run_id }}
          path: e2e-labs-output.log
          retention-days: 14
          if-no-files-found: ignore

  # ─── Simulation-only quick validation (no Docker, runs on GitHub) ─────────
  simulation-labs:
    name: Simulation labs E2E (no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [django-unit]
    if: always() && (needs.django-unit.result == 'success' || needs.django-unit.result == 'skipped')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-backend
      - name: Migrate + seed
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          JIRA_SIMULATION_MODE: "False"
        run: |
          python manage.py migrate --run-syncdb
          python manage.py seed_scenarios || true
      - name: Run simulation E2E (E2E_SKIP_LAB=1)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          JIRA_SIMULATION_MODE: "False"
          E2E_SKIP_LAB: "1"
          E2E_MULTI_USERS: "3"
          E2E_ISOLATION_ONCE: "1"
          SKIP_EMAIL_TESTS: "true"
        run: python ../scripts/e2e_all_scenarios_labs.py
      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-labs-results-${{ github.run_id }}
          path: /tmp/e2e-simulation-*.log
          retention-days: 7
          if-no-files-found: ignore

  # ─── Playwright terminal + lab UI tests ──────────────────────────────────
  lab-ui-playwright:
    name: Lab UI (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install chromium --with-deps
      - name: Run lab Playwright suite
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          SITE_URL: ${{ secrets.STAGING_SITE_URL }}
          SUPERUSER_EMAIL: ${{ secrets.STAGING_SUPERUSER_EMAIL }}
          SUPERUSER_PASSWORD: ${{ secrets.STAGING_SUPERUSER_PASSWORD }}
          E2E_SKIP_LAB: "0"
        run: |
          npx playwright test tests/e2e/labs/ \
            --reporter=html \
            --output=playwright-lab-results \
            --timeout=90000
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-lab-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-screenshots-${{ github.run_id }}
          path: playwright-lab-results/
          retention-days: 14

  # ─── Aggregate result + notify ────────────────────────────────────────────
