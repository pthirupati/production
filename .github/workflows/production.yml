# FixitLab Production — manual only (workflow_dispatch)
#
# GitHub → Actions → FixitLab Production → Run workflow
#
#   launch + create_server  →  new DO droplet, secrets, DNS, tests, deploy, verify
#   launch / deploy         →  parallel tests → deploy → parallel verify/e2e → cleanup → summary
#   stop                    →  stop containers (database volume preserved)
#
# Parallel architecture:
#   create-server [optional]
#       ↓
#   test-frontend  ←── parallel ──→  test-backend
#       ↓                                 ↓
#             deploy (git pull + start + build images)
#                         ↓
#   ┌──────────────────────────────────────────────────────────┐
#   │ All run PARALLEL after deploy succeeds:                  │
#   │  verify-health  (docker ps, container health, /health)   │
#   │  test-units     (Django unit tests in backend container) │
#   │  e2e-labs       (all-scenarios lab provisioning test)    │
#   │  e2e-api        (internal + external API E2E)            │
#   │  e2e-interviews (interview studio E2E)                   │
#   └──────────────────────────────────────────────────────────┘
#                         ↓
#   cleanup [if: always() — runs even if parallel jobs fail]
#                         ↓
#   summary [if: always() — collects all job results]

name: FixitLab Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Pipeline action"
        type: choice
        required: true
        default: deploy
        options:
          - launch
          - deploy
          - stop
      create_server:
        description: "Create DigitalOcean droplet (only for launch — skip if server exists)"
        type: boolean
        default: false
      topology:
        description: "Deployment topology (single = existing 1-droplet; four-droplet = D1 edge / D2 app / D3 data / D4 labs)"
        type: choice
        required: true
        default: single
        options:
          - single
          - four-droplet
      cloud_provider:
        description: "Cloud provider (digitalocean = default droplet/DOKS path; aws = SCAFFOLD ONLY, no-op until AWS keys exist)"
        type: choice
        required: true
        default: digitalocean
        options:
          - digitalocean
          - aws
      hosting_target:
        description: "Hosting target (droplets = default green path; doks/eks = SCAFFOLD ONLY managed-k8s jobs, no-op until cluster keys exist)"
        type: choice
        required: true
        default: droplets
        options:
          - droplets
          - doks
          - eks
      wire_existing:
        description: "Four-droplet only: discover existing droplets by tag (fixitlab-edge/app/db/labs) and skip creation"
        type: boolean
        default: false
      credentials_email:
        description: "Four-droplet only: recipient for the deployment credentials email"
        type: string
        default: thirupathi.samu2018@gmail.com
      rotate_secrets:
        description: "Four-droplet only: rotate infra secrets (Django/DB/Redis/Rabbit/JWT/admin/webhooks). Never rotates DO token or SSH key."
        type: boolean
        default: false
      run_tests:
        description: "Run backend and frontend unit tests before deploy"
        type: boolean
        default: true
      build_scenarios:
        description: "Rebuild scenario lab Docker images on server"
        type: choice
        options:
          - "true"
          - "false"
        default: "false"
      run_e2e:
        description: "Run post-deploy health checks + full E2E on server"
        type: boolean
        default: true
      git_ref:
        description: "Git branch or tag to deploy"
        type: string
        default: main
      skip_email:
        description: "Skip email sending during tests (set SKIP_EMAIL_TESTS=true)"
        type: boolean
        default: false
      technologies:
        description: "Comma-separated technology slugs to seed/test (empty = all). e.g. vmware,linux-administration"
        type: string
        default: ""
      merge_seed_only:
        description: "Only add new scenarios from YAML; do not overwrite existing DB scenarios"
        type: boolean
        default: true

concurrency:
  group: fixitlab-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # BUILD-PUSH-IMAGES — Docker Hub image pipeline (P5/P8, ADDITIVE + GATED)
  #
  # GATE:  inputs.hosting_target == 'doks' || inputs.hosting_target == 'eks'
  #        (a managed-Kubernetes target is selected) AND vars.USE_DOCKERHUB == 'true'
  #        (credentials guard — the repo/environment *variable* that signals Docker
  #        Hub is configured, matching the existing vars.DO_REGION / vars.DO_SIZE
  #        pattern). Docker Hub is now ONLY for Kubernetes: k8s pulls images and
  #        cannot build on-node, so doks/eks need pushed images. The droplet AND the
  #        four-droplet cluster paths NEVER push or pull Docker Hub — they build
  #        locally on the server exactly as before. With the default hosting_target
  #        = droplets, THIS JOB IS SKIPPED and NOTHING downstream changes.
  #
  # When ON, this job builds the three images from the SAME Dockerfiles the compose
  # files use (backend/Dockerfile, frontend/Dockerfile.prod, gateway/Dockerfile.prod),
  # tags each <ns>/fixitlab-{backend,frontend,gateway}:<git-sha> + :latest, and pushes
  # to Docker Hub. STANDALONE — nothing `needs` it (transitive-skip safety); the
  # DOKS/EKS scaffold jobs reference the pushed tag opportunistically.
  #
  # Secrets/vars used:
  #   secrets.DOCKERHUB_USERNAME  — Docker Hub user (login)
  #   secrets.DOCKERHUB_TOKEN     — Docker Hub access token (login)
  #   vars.DOCKERHUB_NAMESPACE    — image namespace/org (OPTIONAL; defaults to username)
  # If the gate is on but the secrets are absent, the job logs a notice and exits 0
  # (clean skip — never fails the pipeline).
  # ─────────────────────────────────────────────────────────────
  build-push-images:
    name: Build and push images (Docker Hub)
    # Docker Hub push is ONLY for managed Kubernetes (doks/eks). Droplet + cluster
    # paths build on-node, so this job stays skipped for the green droplet default.
    if: |
      (inputs.hosting_target == 'doks' || inputs.hosting_target == 'eks') &&
      vars.USE_DOCKERHUB == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      namespace: ${{ steps.meta.outputs.namespace }}
      pushed: ${{ steps.meta.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag, namespace, and credential presence
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          HAVE_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' && '1' || '0' }}
        run: |
          # Tag = full commit SHA (matches IMAGE_TAG=github.sha used by the deploy
          # jobs, which derive it without depending on this job).
          TAG="${GITHUB_SHA}"
          NS="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "namespace=${NS}" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ "$HAVE_TOKEN" = "1" ] && [ -n "$NS" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub creds present — will build+push ${NS}/fixitlab-*:${TAG} (+ :latest)"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::USE_DOCKERHUB is on but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set — skipping build/push cleanly. Nodes will build on-node as before."
          fi

      - name: Set up Docker Buildx
        if: steps.meta.outputs.pushed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.meta.outputs.pushed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        if: steps.meta.outputs.pushed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/fixitlab-backend:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.namespace }}/fixitlab-backend:latest
          cache-from: type=gha,scope=fixitlab-backend
          cache-to: type=gha,scope=fixitlab-backend,mode=max

      - name: Build and push frontend
        if: steps.meta.outputs.pushed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/fixitlab-frontend:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.namespace }}/fixitlab-frontend:latest
          cache-from: type=gha,scope=fixitlab-frontend
          cache-to: type=gha,scope=fixitlab-frontend,mode=max

      - name: Build and push gateway
        if: steps.meta.outputs.pushed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/fixitlab-gateway:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.namespace }}/fixitlab-gateway:latest
          cache-from: type=gha,scope=fixitlab-gateway
          cache-to: type=gha,scope=fixitlab-gateway,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "## build-push-images"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Gate (hosting_target k8s + USE_DOCKERHUB) | \`${{ inputs.hosting_target }}\` |"
            echo "| Pushed | \`${{ steps.meta.outputs.pushed }}\` |"
            echo "| Namespace | \`${{ steps.meta.outputs.namespace }}\` |"
            echo "| Tag | \`${{ steps.meta.outputs.image_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # STOP — separate job, only for action == 'stop'
  # ─────────────────────────────────────────────────────────────
  stop:
    name: Stop platform
    if: inputs.action == 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Stop containers on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /opt/fixitlab/.git ]; then
              echo "Nothing to stop — /opt/fixitlab not deployed yet"
              exit 0
            fi
            cd /opt/fixitlab
            chmod +x scripts/ci-remote-platform.sh scripts/platform-stop.sh 2>/dev/null || true
            ./scripts/ci-remote-platform.sh stop

      - run: echo "Platform stopped. Database volume fixitlab_db_data is preserved." >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # CREATE-SERVER — optional, launch + create_server only
  # ─────────────────────────────────────────────────────────────
  create-server:
    name: Create server
    if: inputs.action == 'launch' && inputs.create_server && inputs.topology != 'four-droplet'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    outputs:
      prod_host: ${{ steps.sync.outputs.prod_host }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve DO API token
        id: do_token
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
        run: |
          if [ -n "$DO_API_TOKEN" ]; then
            echo "token=$DO_API_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=$(echo "$PRODUCTION_ENV_B64" | base64 -d | grep '^DO_API_TOKEN=' | cut -d= -f2- | tr -d '\r')" >> "$GITHUB_OUTPUT"
          fi

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ steps.do_token.outputs.token }}

      - name: Create droplet and wait for SSH
        id: droplet
        env:
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          DO_API_TOKEN: ${{ steps.do_token.outputs.token }}
        run: |
          chmod +x scripts/ci-create-production-droplet.sh
          ./scripts/ci-create-production-droplet.sh

      - name: Update GitHub secrets, DNS, and metadata
        id: sync
        env:
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
          PUBLIC_IP: ${{ steps.droplet.outputs.public_ip }}
          DROPLET_ID: ${{ steps.droplet.outputs.droplet_id }}
          SSH_KEY_ID: ${{ steps.droplet.outputs.ssh_key_id }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || github.token }}
          GITHUB_ENVIRONMENT: production
        run: |
          chmod +x scripts/ci-sync-droplet-secrets.sh
          ./scripts/ci-sync-droplet-secrets.sh

      - name: Commit droplet metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/digitalocean/production.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ci: production droplet ${{ steps.droplet.outputs.public_ip }}"
          git push origin HEAD:main || true

  # ─────────────────────────────────────────────────────────────
  # TEST-FRONTEND — parallel with test-backend
  # ─────────────────────────────────────────────────────────────
  test-frontend:
    name: Test frontend
    needs: [create-server]
    if: |
      inputs.topology != 'four-droplet' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.run_tests &&
      always() &&
      (needs.create-server.result == 'skipped' || needs.create-server.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, and build
        # `npm run lint` (eslint) fails the build on no-undef ReferenceErrors —
        # the class of bug (e.g. useLocation used but not imported) that crashes
        # a page at runtime yet slips past a vite build and the E2E smoke tests.
        run: npm ci && npm run build
        working-directory: frontend

  # ─────────────────────────────────────────────────────────────
  # TEST-BACKEND — parallel with test-frontend
  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: Test backend
    needs: [create-server]
    if: |
      inputs.topology != 'four-droplet' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.run_tests &&
      always() &&
      (needs.create-server.result == 'skipped' || needs.create-server.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/check-no-secrets-in-git.sh && ./scripts/check-no-secrets-in-git.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Migrate and test
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          JIRA_SIMULATION_MODE: "False"
        run: |
          python manage.py migrate --run-syncdb
          SKIP_EMAIL_TESTS="${{ inputs.skip_email && 'true' || 'false' }}" \
          python manage.py test tests --verbosity=2
      - name: Validate flagship scenario catalog (real checks, guided hints)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: python manage.py validate_scenario_catalog --flagship-only --fail-on-gaps
      - name: Validate tutorial completeness (rich lessons, quizzes, linked labs)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: |
          python manage.py seed_tutorials
          python manage.py check_tutorial_completeness --all

  # ─────────────────────────────────────────────────────────────
  # DEPLOY — git pull + start platform + build scenario images
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy and start application
    needs: [create-server, test-backend, test-frontend]
    if: |
      inputs.topology != 'four-droplet' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      always() &&
      (needs.create-server.result == 'skipped' || needs.create-server.result == 'success') &&
      (needs.test-backend.result == 'skipped' || needs.test-backend.result == 'success') &&
      (needs.test-frontend.result == 'skipped' || needs.test-frontend.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    outputs:
      prod_host: ${{ steps.host.outputs.host }}
    steps:
      - name: Resolve production host
        id: host
        run: |
          H="${{ needs.create-server.outputs.prod_host }}"
          if [ -z "$H" ]; then H="${{ secrets.PROD_HOST }}"; fi
          if [ -z "$H" ]; then
            echo "ERROR: PROD_HOST not set. Run launch with create_server, or set PROD_HOST in GitHub secrets."
            exit 1
          fi
          echo "host=$H" >> "$GITHUB_OUTPUT"

      - name: Pull and deploy
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
          BUILD_SCENARIOS: ${{ inputs.build_scenarios }}
          VAULT_ENABLED: ${{ secrets.VAULT_ENABLED }}
          VAULT_UNSEAL_KEY: ${{ secrets.VAULT_UNSEAL_KEY }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          # Docker Hub is ONLY for managed Kubernetes (doks/eks). A DROPLET deploy
          # NEVER pulls Docker Hub — it builds on-node exactly as before. So these
          # are always empty here regardless of USE_DOCKERHUB: PULL_IMAGES stays
          # false → ci-remote-platform.sh does NOT export them → on-node build.
          IMAGE_TAG: ""
          FIXITLAB_IMAGE_NS: ""
          PULL_IMAGES: ""
        with:
          host: ${{ steps.host.outputs.host }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GITHUB_TOKEN,PRODUCTION_ENV_B64,BUILD_SCENARIOS,VAULT_ENABLED,VAULT_UNSEAL_KEY,VAULT_ROLE_ID,VAULT_SECRET_ID,IMAGE_TAG,FIXITLAB_IMAGE_NS,PULL_IMAGES
          command_timeout: 50m
          script: |
            set -e
            REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            mkdir -p /opt/fixitlab
            if [ ! -d /opt/fixitlab/.git ]; then
              git clone "$REPO" /opt/fixitlab
            fi
            cd /opt/fixitlab
            git remote set-url origin "$REPO"
            git fetch origin
            git checkout ${{ inputs.git_ref }}
            git reset --hard "origin/${{ inputs.git_ref }}"
            chmod +x scripts/ci-remote-platform.sh scripts/platform-start.sh scripts/sync-production-env.sh \
              scripts/build-scenario-images.sh scripts/validate-scenario-images.sh \
              scripts/ci-post-deploy-verify.sh scripts/run-full-e2e.sh scripts/cleanup-test-data.py \
              scripts/ci-e2e-session-mode.sh scripts/vault/lib.sh scripts/vault/ensure-network.sh
            export BUILD_SCENARIOS="${BUILD_SCENARIOS:-true}"
            ./scripts/ci-remote-platform.sh deploy

      - name: Quick public health
        run: |
          HOST="${{ steps.host.outputs.host }}"
          echo "Checking http://${HOST}/health ..."
          for i in $(seq 1 20); do
            if curl -sf --max-time 10 -H "Host: fixitlab.in" "http://${HOST}/health" | grep -q ok; then
              echo "Public health OK (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i}/20 — retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Public health check failed after 20 attempts on http://${HOST}/health"
          exit 1

  # ─────────────────────────────────────────────────────────────
  # VERIFY-HEALTH — docker ps + container health + log snapshot
  # Runs in parallel with test-units, e2e-* after deploy
  # ─────────────────────────────────────────────────────────────
  verify-health:
    name: Verify container health
    needs: [deploy]
    if: |
      always() &&
      inputs.topology != 'four-droplet' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check container health and collect logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/fixitlab

            echo "=== Container status ==="
            docker compose -f docker-compose.prod.yml --env-file .env.production ps

            echo ""
            echo "=== Checking for unhealthy containers ==="
            UNHEALTHY=$(docker compose -f docker-compose.prod.yml --env-file .env.production ps \
              | grep -i 'unhealthy' || true)

            if [ -n "$UNHEALTHY" ]; then
              echo "ERROR: Unhealthy containers detected:"
              echo "$UNHEALTHY"
              exit 1
            fi
            echo "All containers healthy."

            echo ""
            echo "=== Vault network ==="
            chmod +x scripts/vault/ensure-network.sh scripts/vault/lib.sh 2>/dev/null || true
            ./scripts/vault/ensure-network.sh || echo "WARN: Vault network check failed"

            echo ""
            echo "=== Last 100 log lines per service ==="
            for SVC in backend gateway celery_worker celery_beat celery_provisioning; do
              echo "--- ${SVC} ---"
              docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=100 "$SVC" 2>/dev/null || true
              echo ""
            done

      - name: Write health summary
        if: always()
        run: |
          {
            echo "## verify-health"
            echo "Container health check and log snapshot completed."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # TEST-UNITS — Django unit tests inside the running container
  # ─────────────────────────────────────────────────────────────
  test-units:
    name: Unit tests (production container)
    needs: [deploy]
    if: |
      always() &&
      inputs.topology != 'four-droplet' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Run Django unit tests
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/fixitlab
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              env SKIP_EMAIL_TESTS="${{ inputs.skip_email && 'true' || 'false' }}" \
              python manage.py test \
                tests.test_jira_webhooks \
                tests.test_api_security \
                tests.test_billing_webhooks \
                --settings=config.test_settings \
                --verbosity=2

  # ─────────────────────────────────────────────────────────────
  # PREPARE-E2E — disable JWT session enforcement on live backend
  # (parallel E2E logins otherwise invalidate each other's tokens)
  # ─────────────────────────────────────────────────────────────
  prepare-e2e:
    name: Prepare E2E session mode
    needs: [deploy]
    if: |
      always() &&
      inputs.topology != 'four-droplet' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.run_e2e &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Disable JWT session enforcement for E2E
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/fixitlab
            chmod +x scripts/ci-e2e-session-mode.sh
            ./scripts/ci-e2e-session-mode.sh disable

  # ─────────────────────────────────────────────────────────────
  # E2E-LABS — all-scenarios lab provisioning test
  # ─────────────────────────────────────────────────────────────
  e2e-labs:
    name: E2E — lab provisioning (all scenarios)
    needs: [deploy, prepare-e2e]
    if: |
      always() &&
      inputs.topology != 'four-droplet' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.run_e2e &&
      needs.deploy.result == 'success' &&
      needs.prepare-e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Reseed scenarios and projects
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/fixitlab
            SEED_ARGS="--dir /scenarios"
            if [ "${{ inputs.merge_seed_only }}" = "true" ]; then SEED_ARGS="$SEED_ARGS --merge-only"; fi
            if [ -n "${{ inputs.technologies }}" ]; then SEED_ARGS="$SEED_ARGS --technologies ${{ inputs.technologies }}"; fi
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              python manage.py seed_scenarios $SEED_ARGS
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              python manage.py seed_admin_demo || true
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              python manage.py seed_projects || true
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              python manage.py seed_certifications || true
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              python manage.py seed_tutorials || true
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              python manage.py seed_interview_data || true
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              python /scripts/migrate_jira_to_simulation.py || true
            echo "Scenario count:"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              python -c "import django; django.setup(); from apps.question_bank.models import Scenario; print(Scenario.objects.count(), 'scenarios')" || true

      - name: Run all-scenarios lab E2E
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            cd /opt/fixitlab
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              env E2E_SKIP_LAB=0 E2E_MULTI_USERS=3 E2E_SKIP_CLEANUP=1 E2E_PRESERVE_LAB_USERS=1 \
              E2E_TECH_FILTER="${{ inputs.technologies }}" TERMINAL_MAX_WS_PER_USER=64 \
              python /scripts/e2e_all_scenarios_labs.py

  # ─────────────────────────────────────────────────────────────
  # E2E-API — internal (bypass nginx) + external (through gateway)
  # ─────────────────────────────────────────────────────────────
  e2e-api:
    name: E2E — API (internal + external)
    needs: [deploy, prepare-e2e]
    if: |
      always() &&
      inputs.topology != 'four-droplet' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.run_e2e &&
      needs.deploy.result == 'success' &&
      needs.prepare-e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Internal API E2E (bypass nginx)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/fixitlab
            # Read the deployed (rotated) admin creds from .env.production — the
            # GitHub secret can't be written (403) so it would be stale → admin 401.
            EMAIL="$(grep '^SUPERUSER_EMAIL=' .env.production | head -1 | cut -d= -f2- | tr -d '\r')"
            PASS="$(grep '^SUPERUSER_PASSWORD=' .env.production | head -1 | cut -d= -f2- | tr -d '\r')"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              env SUPERUSER_EMAIL="$EMAIL" SUPERUSER_PASSWORD="$PASS" \
              JWT_SESSION_ENFORCEMENT=0 E2E_SKIP_EMAIL=1 \
              E2E_SKIP_LAB=0 RUN_FULL_E2E=1 E2E_SKIP_DUPLICATE_LABS=1 E2E_SKIP_CLEANUP=1 E2E_PRESERVE_LAB_USERS=1 \
              python /scripts/e2e_production_test.py

      - name: External API E2E (through gateway)
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/fixitlab
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              env BASE_URL=https://fixitlab.in E2E_SKIP_LAB=1 RUN_FULL_E2E=0 \
              python /scripts/e2e_production_test.py

  # ─────────────────────────────────────────────────────────────
  # E2E-INTERVIEWS — interview studio E2E
  # ─────────────────────────────────────────────────────────────
  e2e-interviews:
    name: E2E — interview studio
    needs: [deploy, prepare-e2e]
    if: |
      always() &&
      inputs.topology != 'four-droplet' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.run_e2e &&
      needs.deploy.result == 'success' &&
      needs.prepare-e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Run interview studio E2E
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/fixitlab
            # Read the deployed (rotated) admin creds from .env.production — the
            # GitHub secret can't be written (403) so it would be stale → admin 401.
            EMAIL="$(grep '^SUPERUSER_EMAIL=' .env.production | head -1 | cut -d= -f2- | tr -d '\r')"
            PASS="$(grep '^SUPERUSER_PASSWORD=' .env.production | head -1 | cut -d= -f2- | tr -d '\r')"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              env SUPERUSER_EMAIL="$EMAIL" SUPERUSER_PASSWORD="$PASS" \
              JWT_SESSION_ENFORCEMENT=0 E2E_SKIP_EMAIL=1 \
              python /scripts/e2e_interviews.py

  # ─────────────────────────────────────────────────────────────
  # E2E SMOKE — reusable workflow, runs inline (no separate run)
  # ─────────────────────────────────────────────────────────────
  smoke:
    name: E2E smoke
    needs: [deploy]
    if: >
      always() &&
      inputs.topology != 'four-droplet' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      needs.deploy.result == 'success'
    uses: ./.github/workflows/e2e-smoke.yml
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # CLEANUP — always runs after all post-deploy jobs finish
  # ─────────────────────────────────────────────────────────────
  cleanup:
    name: Cleanup E2E test data
    needs: [deploy, verify-health, test-units, prepare-e2e, e2e-labs, e2e-api, e2e-interviews, smoke]
    if: always() && inputs.topology != 'four-droplet' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Remove E2E test users and data
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /opt/fixitlab
            # Pass SUPERUSER_EMAIL (read from .env.production like the E2E steps) so
            # cleanup-test-data.py always has PROTECTED_EMAIL set — the admin account
            # is never a deletion candidate even if its name looks test-like.
            ADMIN_EMAIL="$(grep '^SUPERUSER_EMAIL=' .env.production | head -1 | cut -d= -f2- | tr -d '\r')"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend \
              env SUPERUSER_EMAIL="$ADMIN_EMAIL" \
              python /scripts/cleanup-test-data.py || echo "WARN: cleanup completed with warnings"

      - name: Restore JWT session enforcement
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /opt/fixitlab
            chmod +x scripts/ci-e2e-session-mode.sh
            ./scripts/ci-e2e-session-mode.sh restore || echo "WARN: could not restore JWT session mode"

  # ─────────────────────────────────────────────────────────────
  # SUMMARY — collects all job results
  # ─────────────────────────────────────────────────────────────
  summary:
    name: Pipeline summary
    needs: [deploy, verify-health, test-units, prepare-e2e, e2e-labs, e2e-api, e2e-interviews, smoke, cleanup]
    if: always() && inputs.topology != 'four-droplet' && (inputs.action == 'launch' || inputs.action == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write pipeline summary
        run: |
          {
            echo "## FixitLab Production — complete"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Action | \`${{ inputs.action }}\` |"
            echo "| Host | \`${{ secrets.PROD_HOST }}\` |"
            echo "| Branch | \`${{ inputs.git_ref }}\` |"
            echo "| Build scenarios | \`${{ inputs.build_scenarios }}\` |"
            echo "| E2E verify | \`${{ inputs.run_e2e }}\` |"
            echo "| Skip email | \`${{ inputs.skip_email }}\` |"
            echo "| Site | https://fixitlab.in |"
            echo ""
            echo "## Job results"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| deploy | \`${{ needs.deploy.result }}\` |"
            echo "| verify-health | \`${{ needs.verify-health.result }}\` |"
            echo "| test-units | \`${{ needs.test-units.result }}\` |"
            echo "| prepare-e2e | \`${{ needs.prepare-e2e.result }}\` |"
            echo "| e2e-labs | \`${{ needs.e2e-labs.result }}\` |"
            echo "| e2e-api | \`${{ needs.e2e-api.result }}\` |"
            echo "| e2e-interviews | \`${{ needs.e2e-interviews.result }}\` |"
            echo "| smoke | \`${{ needs.smoke.result }}\` |"
            echo "| cleanup | \`${{ needs.cleanup.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ════════════════════════════════════════════════════════════════════════
  # FOUR-DROPLET TOPOLOGY — all jobs below are gated on
  # inputs.topology == 'four-droplet'. They never run for the single-droplet
  # path above. Job graph:
  #
  #   create-cluster  (generate-secrets → create/​discover droplets → firewalls →
  #                    wire-env → labs-ssh → sync GitHub secrets → commit cluster.json)
  #        ↓
  #   bootstrap-cluster (parallel SSH bootstrap per role)
  #        ↓
  #   vault-cluster     (init/unseal Vault on D1 + AppRole + seed KV)
  #        ↓
  #   deploy-cluster    (D3 data → D1 edge → D2 app → D4 scenario images)
  #        ↓
  #   email-credentials (SendGrid bundle; DO token redacted; best-effort)
  #        ↓
  #   ┌──────────────────────────────────────────────┐
  #   │ parallel after deploy:                       │
  #   │   verify-health-cluster  (docker ps per node)│
  #   │   test-units-cluster     (Django tests on D2)│
  #   │   prepare-e2e-cluster → e2e-* (on D2 backend)│
  #   └──────────────────────────────────────────────┘
  #        ↓
  #   cleanup-cluster + pg-backup-cluster + summary-cluster (if: always())
  # ════════════════════════════════════════════════════════════════════════

  create-cluster:
    name: "[4D] Create cluster"
    # NOTE: build-push-images is a standalone job (now gated on a managed-Kubernetes
    # hosting_target + USE_DOCKERHUB) that NOTHING in the four-droplet chain `needs`
    # — a skipped job propagates its skip transitively to dependents that lack
    # always() (it once cascaded to bootstrap). The cluster builds images on-node and
    # never pulls Docker Hub, so it does not depend on the build job at all.
    if: |
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.topology == 'four-droplet'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    outputs:
      # Edge PUBLIC IP is NOT exposed as a job output: the raw IP matches a
      # registered secret, so GitHub skips the raw output ("may contain secret")
      # AND skips its base64 form (base64-of-a-secret is masked too), so any
      # cross-job output arrives EMPTY. The edge public IP is instead published
      # as a build artifact (cluster-edge-host) and each consumer downloads it
      # and loads it into $GITHUB_ENV as EDGE_PUBLIC_IP. Private IPs are not
      # secrets and pass through raw on outputs. (D2/D3/D4 are private-only —
      # no public IP is needed.)
      edge_private_ip: ${{ steps.create.outputs.edge_private_ip }}
      app_private_ip: ${{ steps.create.outputs.app_private_ip }}
      db_private_ip: ${{ steps.create.outputs.db_private_ip }}
      labs_private_ip: ${{ steps.create.outputs.labs_private_ip }}
      updated_secrets: ${{ steps.synced.outputs.updated_secrets }}
      # Surfaced to the credentials email so it can STATE the sync outcome.
      secrets_rotated: ${{ steps.secrets.outputs.rotated == 'true' && 'true' || 'false' }}
      gh_sync_status: ${{ steps.synced.outputs.gh_sync || 'failed' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve DO API token (masked)
        id: do_token
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
        run: |
          if [ -n "$DO_API_TOKEN" ]; then
            TOK="$DO_API_TOKEN"
          else
            TOK="$(echo "$PRODUCTION_ENV_B64" | base64 -d | grep '^DO_API_TOKEN=' | cut -d= -f2- | tr -d '\r')"
          fi
          echo "::add-mask::$TOK"
          echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ steps.do_token.outputs.token }}

      - name: Preflight — GitHub secret-write capability (non-fatal)
        id: secretcap
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || github.token }}
        run: |
          # Cluster jobs read droplet IPs from JOB OUTPUTS (not secrets), so the
          # deploy does NOT require writing Environment secrets. And rotated secrets
          # are now PERSISTED TO VAULT (secret/fixitlab/env, by the vault-cluster job)
          # as the cross-deploy source of truth — every later deploy overlays them, so
          # the rotated admin password survives WITHOUT writing the GitHub secret. The
          # GitHub PRODUCTION_ENV_B64 write-back is therefore OPTIONAL (nice-to-have for
          # keeping the GitHub secret fresh), not required for login persistence.
          if gh api "repos/${{ github.repository }}/environments/production/secrets/public-key" >/dev/null 2>&1; then
            echo "secret_write=1" >> "$GITHUB_OUTPUT"
            echo "Environment secret-write OK — rotated secrets will also be persisted to the GitHub secret."
          else
            echo "secret_write=0" >> "$GITHUB_OUTPUT"
            # NOT a ::warning:: — this is expected without a classic PAT and is no
            # longer login-critical now that Vault persists rotated secrets. Stated
            # plainly so the run summary stays green/non-alarming.
            echo "::notice::GH_ADMIN_TOKEN cannot write the GitHub Environment secret (HTTP 403) — expected without a classic 'repo'-scoped PAT. This is NOT login-critical: rotated secrets are persisted to Vault (secret/fixitlab/env) and overlaid on every deploy, so admin login persists. Optionally set GH_ADMIN_TOKEN to a classic PAT to also keep PRODUCTION_ENV_B64 in sync."
          fi

      # Droplets are created/discovered FIRST so the secret step below can decide
      # whether this is a brand-new server. Order is safe: the create script never
      # reads .env.cluster, and the secrets step never reads droplet IPs (those are
      # wired in separately by ci-wire-cluster-env.py). Default path is unchanged.
      - name: Create or discover droplets (one VPC + 4 tagged)
        id: create
        env:
          DO_API_TOKEN: ${{ steps.do_token.outputs.token }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          DO_REGION: ${{ vars.DO_REGION || 'blr1' }}
          DO_SIZE: ${{ vars.DO_SIZE || 's-2vcpu-8gb-160gb-intel' }}
          WIRE_EXISTING: ${{ inputs.wire_existing && '1' || '0' }}
          DO_PROTECTED_DROPLET_IDS: ${{ secrets.DO_PROTECTED_DROPLET_IDS }}
        run: |
          chmod +x scripts/ci-create-cluster-droplets.sh
          ./scripts/ci-create-cluster-droplets.sh

      # SECRET ROTATION POLICY (additive, default-safe):
      #   rotate IFF the operator checked rotate_secrets  OR  a droplet was freshly
      #   created this run (created_any=true → no prior secrets to preserve).
      #   Otherwise ROTATE_SECRETS=0 → ci-generate-secrets.py only fills missing /
      #   placeholder values and PRESERVES every existing secret. The default
      #   four-droplet relaunch against existing droplets keeps ROTATE_SECRETS=0,
      #   exactly as today.
      - name: Generate / rotate cluster secrets
        id: secrets
        env:
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
          ROTATE_SECRETS: ${{ (inputs.rotate_secrets || steps.create.outputs.created_any == 'true') && '1' || '0' }}
          OUT_FILE: .env.cluster
        run: |
          if [ "${{ inputs.rotate_secrets }}" = "true" ]; then
            echo "Rotation reason: rotate_secrets checkbox is ON"
          elif [ "${{ steps.create.outputs.created_any }}" = "true" ]; then
            echo "Rotation reason: a droplet was freshly created this run (auto-rotate)"
          else
            echo "No rotation: existing droplets + rotate_secrets off — secrets preserved"
          fi
          chmod +x scripts/ci-generate-secrets.py
          python3 scripts/ci-generate-secrets.py --out .env.cluster

      - name: Publish edge host + private IPs artifact
        run: |
          mkdir -p _cluster
          printf '%s' '${{ steps.create.outputs.edge_public_ip_b64 }}' | base64 -d > _cluster/edge_host.txt
          echo "edge=$(cat _cluster/edge_host.txt)"  # log only; masked in display, fine
          # Private IPs travel via the artifact, NOT job outputs: the later secret
          # sync ::add-mask::s these values, and GitHub blanks any job output that
          # matches a masked value (also true once PROD_*_HOST become real secrets).
          # The artifact is written here, before any masking, so it always carries
          # the real IPs. Consumers load it into $GITHUB_ENV in their "Load edge host" step.
          {
            echo "EDGE_PRIVATE_IP=${{ steps.create.outputs.edge_private_ip }}"
            echo "APP_PRIVATE_IP=${{ steps.create.outputs.app_private_ip }}"
            echo "DATA_PRIVATE_IP=${{ steps.create.outputs.db_private_ip }}"
            echo "LABS_PRIVATE_IP=${{ steps.create.outputs.labs_private_ip }}"
          } > _cluster/cluster_ips.env
          # Docker Hub is ONLY for managed Kubernetes (doks/eks). The four-droplet
          # cluster is a DROPLET path and NEVER pulls Docker Hub — D1/D2 build their
          # images on-node exactly as before. So we intentionally emit NO
          # USE_DOCKERHUB/IMAGE_TAG/FIXITLAB_IMAGE_NS here: cluster_ips.env never
          # carries pull config, and ci-cluster-deploy.sh leaves IMG_ENV empty.
          echo "wrote _cluster/cluster_ips.env ($(wc -l < _cluster/cluster_ips.env) lines)"
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-edge-host
          path: |
            _cluster/edge_host.txt
            _cluster/cluster_ips.env
          retention-days: 1

      - name: Configure cloud firewalls
        env:
          DO_API_TOKEN: ${{ steps.do_token.outputs.token }}
          EDGE_PRIVATE_IP: ${{ steps.create.outputs.edge_private_ip }}
          APP_PRIVATE_IP: ${{ steps.create.outputs.app_private_ip }}
          DATA_PRIVATE_IP: ${{ steps.create.outputs.db_private_ip }}
          LABS_PRIVATE_IP: ${{ steps.create.outputs.labs_private_ip }}
        run: |
          chmod +x scripts/ci-setup-firewalls.sh
          ./scripts/ci-setup-firewalls.sh

      - name: Wire env for cluster topology
        id: wire
        env:
          EDGE_PRIVATE_IP: ${{ steps.create.outputs.edge_private_ip }}
          APP_PRIVATE_IP: ${{ steps.create.outputs.app_private_ip }}
          DATA_PRIVATE_IP: ${{ steps.create.outputs.db_private_ip }}
          LABS_PRIVATE_IP: ${{ steps.create.outputs.labs_private_ip }}
          EDGE_PUBLIC_IP_B64: ${{ steps.create.outputs.edge_public_ip_b64 }}
          OUT_FILE: .env.cluster
        run: |
          export EDGE_PUBLIC_IP="$(printf '%s' "$EDGE_PUBLIC_IP_B64" | base64 -d)"
          chmod +x scripts/ci-wire-cluster-env.py
          python3 scripts/ci-wire-cluster-env.py --file .env.cluster
          # Stash the rotated+wired env for downstream jobs (masked artifact).
          B64="$(base64 < .env.cluster | tr -d '\n')"
          echo "::add-mask::$B64"
          echo "env_b64=$B64" >> "$GITHUB_OUTPUT"

      - name: Stash wired env for bootstrap (encrypted, run-scoped artifact)
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p _cluster
          # Encrypt with a key derived from PROD_SSH_KEY (also present in the
          # bootstrap job) so the full production env never sits in a plaintext
          # artifact. Job outputs can't carry it (GitHub blanks masked outputs);
          # the encrypted artifact is the reliable run-scoped channel.
          ENC_PASS="$(printf '%s' "$PROD_SSH_KEY" | sha256sum | cut -d' ' -f1)"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass "pass:$ENC_PASS" \
            -in .env.cluster -out _cluster/cluster.env.enc
          echo "Encrypted wired env -> _cluster/cluster.env.enc ($(wc -c < _cluster/cluster.env.enc) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-env-enc
          path: _cluster/cluster.env.enc
          retention-days: 1

      - name: Sync GitHub secrets + commit cluster metadata
        id: synced
        continue-on-error: true   # secret persistence is best-effort; deploy uses job outputs + existing env
        env:
          CLUSTER_MODE: "1"
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || github.token }}
          GITHUB_ENVIRONMENT: production
          EDGE_PUBLIC_IP_B64: ${{ steps.create.outputs.edge_public_ip_b64 }}
          EDGE_PRIVATE_IP: ${{ steps.create.outputs.edge_private_ip }}
          APP_PRIVATE_IP: ${{ steps.create.outputs.app_private_ip }}
          DATA_PRIVATE_IP: ${{ steps.create.outputs.db_private_ip }}
          LABS_PRIVATE_IP: ${{ steps.create.outputs.labs_private_ip }}
          EDGE_ID: ${{ steps.create.outputs.edge_id }}
          APP_ID: ${{ steps.create.outputs.app_id }}
          DATA_ID: ${{ steps.create.outputs.db_id }}
          LABS_ID: ${{ steps.create.outputs.labs_id }}
          VPC_ID: ${{ steps.create.outputs.vpc_id }}
          VAULT_ENABLED: "true"
          CLUSTER_ENV_B64: ${{ steps.wire.outputs.env_b64 }}
        run: |
          export EDGE_PUBLIC_IP="$(printf '%s' "$EDGE_PUBLIC_IP_B64" | base64 -d)"
          chmod +x scripts/ci-sync-droplet-secrets.sh
          # Capture the sync outcome (this step is continue-on-error, but we still
          # want a precise ok/failed flag for the credentials email sync-status note).
          if ./scripts/ci-sync-droplet-secrets.sh; then
            echo "gh_sync=ok" >> "$GITHUB_OUTPUT"
          else
            echo "gh_sync=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub secret sync failed — rotated secrets NOT persisted. The credentials email will flag a manual update."
          fi
          echo "updated_secrets=PROD_HOST,PROD_APP_HOST,PROD_DB_HOST,PROD_LABS_HOST,PRODUCTION_ENV_B64,VAULT_ROLE_ID,VAULT_SECRET_ID,VAULT_UNSEAL_KEY,VAULT_ENABLED" >> "$GITHUB_OUTPUT"

      - name: Commit cluster.json metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/digitalocean/cluster.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ci: four-droplet cluster metadata"
          git push origin HEAD:main || true

  bootstrap-cluster:
    name: "[4D] Bootstrap cluster"
    needs: [create-cluster]
    if: (inputs.action == 'launch' || inputs.action == 'deploy') && inputs.topology == 'four-droplet'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - uses: actions/download-artifact@v4
        with: { name: cluster-env-enc, path: _cluster }
        continue-on-error: true   # absent only on legacy reruns; bootstrap still proceeds
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      - name: Parallel SSH bootstrap per role
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          # EDGE/APP/DATA/LABS_PRIVATE_IP come from _cluster/cluster_ips.env via the
          # "Load edge host" step ($GITHUB_ENV) — job outputs get blanked by masking.
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          export GIT_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          # Decrypt the wired cluster env (encrypted by create-cluster with a key
          # derived from PROD_SSH_KEY) so bootstrap can place it on each node.
          if [ -f _cluster/cluster.env.enc ] && [ -n "${PROD_SSH_KEY:-}" ]; then
            ENC_PASS="$(printf '%s' "$PROD_SSH_KEY" | sha256sum | cut -d' ' -f1)"
            if openssl enc -d -aes-256-cbc -pbkdf2 -pass "pass:$ENC_PASS" \
                 -in _cluster/cluster.env.enc -out .env.cluster 2>/dev/null; then
              export CLUSTER_ENV_FILE="$PWD/.env.cluster"
              echo "Decrypted cluster env ($(wc -l < .env.cluster) lines) for node distribution"
            else
              echo "WARN: could not decrypt cluster env — nodes may lack .env.production"
            fi
          fi
          chmod +x scripts/ci-bootstrap-cluster.sh scripts/ci-setup-labs-ssh.sh scripts/ci-setup-edge-ssh.sh
          ./scripts/ci-bootstrap-cluster.sh
          echo "Provisioning D2->D4 labs SSH key"
          ./scripts/ci-setup-labs-ssh.sh
          echo "Provisioning edge->internal SSH key (post-deploy jobs hop edge->D2/D3/D4)"
          ./scripts/ci-setup-edge-ssh.sh

  vault-cluster:
    name: "[4D] Vault bootstrap (D1)"
    needs: [create-cluster, bootstrap-cluster]
    if: (inputs.action == 'launch' || inputs.action == 'deploy') && inputs.topology == 'four-droplet'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    outputs:
      # REAL, independent Vault-persistence signal for the credentials email
      # (ok|failed|skipped) — distinct from the GitHub-secret sync status.
      vault_overlay_status: ${{ steps.vault.outputs.vault_overlay_status || 'skipped' }}
      # Expose the freshly-bootstrapped AppRole (read off the edge node) so the
      # deploy job can hand it to the app node WITHOUT depending on GitHub secrets
      # (the CI token cannot write them). Masked values; used only via env, never
      # echoed. This is what makes a single trigger self-sufficient.
      vault_role_id: ${{ steps.vault.outputs.vault_role_id }}
      vault_secret_id: ${{ steps.vault.outputs.vault_secret_id }}
      vault_unseal_key: ${{ steps.vault.outputs.vault_unseal_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      - name: Init/unseal Vault + AppRole + seed KV on edge
        id: vault
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          # When this run ROTATED secrets, also persist the rotated env into the
          # stable Vault overlay path (secret/fixitlab/env) so the rotated admin
          # password survives future deploys WITHOUT a GitHub PAT (the 403 fix).
          # No rotation → PERSIST_OVERLAY=0 → overlay path untouched → green path
          # byte-for-byte unchanged.
          PERSIST_OVERLAY: ${{ needs.create-cluster.outputs.secrets_rotated == 'true' && '1' || '0' }}
        run: |
          chmod +x scripts/ci-vault-cluster-bootstrap.sh
          ./scripts/ci-vault-cluster-bootstrap.sh
      - name: Store Vault AppRole as GitHub secrets
        continue-on-error: true   # best-effort: deploy reads the env already on the nodes, not these secrets
        env:
          CLUSTER_MODE: "1"
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || github.token }}
          GITHUB_ENVIRONMENT: production
          # APP/DATA/LABS_PRIVATE_IP + EDGE_PUBLIC_IP come from cluster_ips.env via $GITHUB_ENV.
          VAULT_ROLE_ID: ${{ steps.vault.outputs.vault_role_id }}
          VAULT_SECRET_ID: ${{ steps.vault.outputs.vault_secret_id }}
          VAULT_UNSEAL_KEY: ${{ steps.vault.outputs.vault_unseal_key }}
        run: |
          chmod +x scripts/ci-sync-droplet-secrets.sh
          ./scripts/ci-sync-droplet-secrets.sh

  deploy-cluster:
    name: "[4D] Deploy cluster"
    needs: [create-cluster, bootstrap-cluster, vault-cluster]
    if: |
      always() &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.topology == 'four-droplet' &&
      needs.bootstrap-cluster.result == 'success' &&
      needs.vault-cluster.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      - name: Ordered deploy (data → edge → app → labs images)
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          # EDGE/APP/DATA/LABS_PRIVATE_IP come from cluster_ips.env via $GITHUB_ENV.
          # Docker Hub is ONLY for managed Kubernetes (doks/eks); the four-droplet
          # cluster NEVER pulls — create-cluster emits no USE_DOCKERHUB/IMAGE_TAG into
          # cluster_ips.env, so ci-cluster-deploy.sh leaves IMG_ENV empty → on-node build.
          BUILD_SCENARIOS: ${{ inputs.build_scenarios }}
          # Hand the freshly-bootstrapped Vault AppRole to the deploy so the app
          # node renders .env.production FROM Vault (correct rotated DB password),
          # not the stale baked env. From the vault-cluster job's outputs; falls
          # back to repo secrets, and to empty (legacy baked path) if neither.
          VAULT_ENABLED: "true"
          VAULT_ROLE_ID: ${{ needs.vault-cluster.outputs.vault_role_id || secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ needs.vault-cluster.outputs.vault_secret_id || secrets.VAULT_SECRET_ID }}
          VAULT_UNSEAL_KEY: ${{ needs.vault-cluster.outputs.vault_unseal_key || secrets.VAULT_UNSEAL_KEY }}
        run: |
          chmod +x scripts/ci-cluster-deploy.sh
          ./scripts/ci-cluster-deploy.sh
      - name: Public health (through edge gateway)
        run: |
          HOST="$EDGE_PUBLIC_IP"
          for i in $(seq 1 20); do
            if curl -sf --max-time 10 -H "Host: fixitlab.in" "http://${HOST}/health" | grep -q ok; then
              echo "Public health OK (attempt ${i})"; exit 0
            fi
            echo "attempt ${i}/20 — retrying in 5s..."; sleep 5
          done
          echo "ERROR: public health failed on edge ${HOST}"; exit 1

  email-credentials:
    name: "[4D] Email credentials"
    needs: [create-cluster, vault-cluster, deploy-cluster]
    if: |
      always() &&
      inputs.topology == 'four-droplet' &&
      needs.deploy-cluster.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      - name: Render redacted env from edge and email bundle
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          CRED_TO: ${{ inputs.credentials_email }}
          # APP/DATA/LABS_PRIVATE_IP come from cluster_ips.env via $GITHUB_ENV.
          UPDATED_SECRETS: ${{ needs.create-cluster.outputs.updated_secrets }}
          CREDENTIALS_EMAIL_REQUIRED: ${{ vars.CREDENTIALS_EMAIL_REQUIRED || '0' }}
          # Secret rotation + sync status → stated in the email body so the operator
          # knows where the rotated secrets persisted. These are now TWO INDEPENDENT
          # signals:
          #   GH_SYNC_STATUS    — did the GitHub Environment secret write succeed?
          #                       (optional now; 403 without a classic PAT is fine)
          #   VAULT_SYNC_STATUS — did the rotated env persist to Vault secret/fixitlab/env?
          #                       This is the REAL login-persistence signal (the
          #                       cross-deploy source of truth), from the vault-cluster
          #                       job's overlay outcome — NOT a mirror of GH anymore.
          SECRETS_ROTATED: ${{ needs.create-cluster.outputs.secrets_rotated == 'true' && '1' || '0' }}
          GH_SYNC_STATUS: ${{ needs.create-cluster.outputs.secrets_rotated == 'true' && needs.create-cluster.outputs.gh_sync_status || 'skipped' }}
          VAULT_SYNC_STATUS: ${{ needs.create-cluster.outputs.secrets_rotated == 'true' && (needs.vault-cluster.outputs.vault_overlay_status || 'failed') || 'skipped' }}
        run: |
          # Pull the (DO-token-free) .env.production from the edge node so the
          # attachment matches what is actually deployed; the script strips the
          # DO_API_TOKEN line again as a defence-in-depth measure.
          KEY_FILE="$(mktemp)"; printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          scp -o StrictHostKeyChecking=no -i "$KEY_FILE" \
            "root@${EDGE_PUBLIC_IP}:/opt/fixitlab/.env.production" ./.env.cluster.fetched || cp env.production.example ./.env.cluster.fetched
          rm -f "$KEY_FILE"
          chmod +x scripts/ci-email-credentials.sh
          ENV_FILE=./.env.cluster.fetched ./scripts/ci-email-credentials.sh

  verify-health-cluster:
    name: "[4D] Verify health"
    needs: [create-cluster, deploy-cluster]
    if: |
      always() &&
      inputs.topology == 'four-droplet' &&
      needs.deploy-cluster.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      - name: Container health per node (via edge)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EDGE_PUBLIC_IP }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "=== Edge (D1) ==="
            cd /opt/fixitlab
            docker compose -f docker-compose.edge.yml --env-file .env.production ps
            echo "=== Readiness probe (via edge nginx) ==="
            curl -sf --max-time 15 "http://127.0.0.1/api/health/ready/" \
              || { echo "FAIL: readiness probe did not return 200"; exit 1; }
            for NODE in "${{ needs.create-cluster.outputs.db_private_ip }}:data:docker-compose.data.yml" \
                        "${{ needs.create-cluster.outputs.app_private_ip }}:app:docker-compose.app.yml"; do
              IP="${NODE%%:*}"; REST="${NODE#*:}"; ROLE="${REST%%:*}"; CF="${REST#*:}"
              echo "=== ${ROLE} (${IP}) ==="
              ssh -o StrictHostKeyChecking=no "root@${IP}" \
                "cd /opt/fixitlab && docker compose -f ${CF} --env-file .env.production ps" || echo "WARN: ${ROLE} ps failed"
            done

  test-units-cluster:
    name: "[4D] Unit tests (D2)"
    needs: [create-cluster, deploy-cluster]
    if: |
      always() &&
      inputs.topology == 'four-droplet' &&
      needs.deploy-cluster.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      - name: Django unit tests in backend container on D2 (via edge)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EDGE_PUBLIC_IP }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@${{ needs.create-cluster.outputs.app_private_ip }}" '
              cd /opt/fixitlab
              # Run unit tests in an ISOLATED one-off container (NOT exec/up on the
              # live backend): test_settings uses in-memory sqlite, so it needs no
              # running services, doesnt touch the live containers (so it cannot race
              # the concurrent Prepare-E2E recreate -> no "removal in progress"), and
              # has no cgroup competition with uvicorn (so no OOM / status 137).
              IMG="$(docker compose -f docker-compose.app.yml --env-file .env.production images -q backend 2>/dev/null | head -1)"
              [ -n "$IMG" ] || IMG="fixitlab-backend"
              docker run --rm --env-file /opt/fixitlab/.env.production \
                -e SKIP_EMAIL_TESTS="${{ inputs.skip_email && 'true' || 'false' }}" \
                -e DJANGO_SETTINGS_MODULE=config.test_settings \
                "$IMG" \
                python manage.py test tests.test_jira_webhooks tests.test_api_security tests.test_billing_webhooks \
                --settings=config.test_settings --verbosity=2
            '

  prepare-e2e-cluster:
    name: "[4D] Prepare E2E"
    needs: [create-cluster, deploy-cluster]
    if: |
      always() &&
      inputs.topology == 'four-droplet' &&
      inputs.run_e2e &&
      needs.deploy-cluster.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      - name: Disable JWT session enforcement on D2 backend (via edge)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EDGE_PUBLIC_IP }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@${{ needs.create-cluster.outputs.app_private_ip }}" '
              cd /opt/fixitlab
              chmod +x scripts/ci-e2e-session-mode.sh
              COMPOSE_FILE=docker-compose.app.yml ./scripts/ci-e2e-session-mode.sh disable
            '

  e2e-api-cluster:
    name: "[4D] E2E — API"
    needs: [create-cluster, deploy-cluster, prepare-e2e-cluster]
    if: |
      always() &&
      inputs.topology == 'four-droplet' &&
      inputs.run_e2e &&
      needs.deploy-cluster.result == 'success' &&
      needs.prepare-e2e-cluster.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      - name: Internal API E2E on D2 (via edge)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EDGE_PUBLIC_IP }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@${{ needs.create-cluster.outputs.app_private_ip }}" '
              cd /opt/fixitlab
              # Admin creds come from the deployed .env.production (rotated each run),
              # NOT a GitHub secret — the secret cannot be written (403) so it would be
              # stale and admin login would 401. create_superuser syncs the DB to this.
              EMAIL="$(grep "^SUPERUSER_EMAIL=" .env.production | head -1 | cut -d= -f2- | tr -d "\r")"; PASS="$(grep "^SUPERUSER_PASSWORD=" .env.production | head -1 | cut -d= -f2- | tr -d "\r")"
              docker compose -f docker-compose.app.yml --env-file .env.production exec -T backend \
                env SUPERUSER_EMAIL="$EMAIL" SUPERUSER_PASSWORD="$PASS" \
                JWT_SESSION_ENFORCEMENT=0 E2E_SKIP_EMAIL=1 RUN_FULL_E2E=1 E2E_SKIP_LAB=0 \
                E2E_SKIP_DUPLICATE_LABS=1 E2E_SKIP_CLEANUP=1 E2E_PRESERVE_LAB_USERS=1 \
                python /scripts/e2e_production_test.py
            '

  e2e-labs-cluster:
    name: "[4D] E2E — labs"
    needs: [create-cluster, deploy-cluster, prepare-e2e-cluster]
    if: |
      always() &&
      inputs.topology == 'four-droplet' &&
      inputs.run_e2e &&
      needs.deploy-cluster.result == 'success' &&
      needs.prepare-e2e-cluster.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      # PER-TECHNOLOGY E2E (additive):
      #   technologies EMPTY (default) → full all-tech sweep, sampled at
      #     E2E_MAX_PER_TECH=3 per tech so the suite fits the 40m ssh timeout
      #     (byte-for-byte the current green behaviour).
      #   technologies SET (e.g. "vmware") → scope to those techs AND remove the
      #     per-tech cap (E2E_MAX_PER_TECH=0) so EVERY scenario in the selected
      #     tech is exercised — the fast path for validating one freshly-added
      #     scenario without running all ~1100. E2E_TECH_FILTER makes the script
      #     skip every other tech immediately, so this is also much faster.
      - name: Resolve per-tech E2E scope
        id: labscope
        run: |
          if [ -n "${{ inputs.technologies }}" ]; then
            echo "max_per_tech=0" >> "$GITHUB_OUTPUT"
            echo "Per-tech mode: scoping labs E2E to '${{ inputs.technologies }}' (no cap — all scenarios in those techs run; others skipped fast)"
          else
            echo "max_per_tech=3" >> "$GITHUB_OUTPUT"
            echo "All-tech mode: sampling 3 deployable labs per technology"
          fi
      - name: All-scenarios lab E2E on D2 (labs run on D4 via remote docker)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EDGE_PUBLIC_IP }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@${{ needs.create-cluster.outputs.app_private_ip }}" '
              cd /opt/fixitlab
              # When technologies are selected, reseed ONLY those tech folders first
              # (merge-only, fast — seed_scenarios skips non-matching tech dirs) so a
              # freshly-added scenario.yaml is present before the lab E2E runs.
              if [ -n "${{ inputs.technologies }}" ]; then
                docker compose -f docker-compose.app.yml --env-file .env.production exec -T backend \
                  python manage.py seed_scenarios --dir /scenarios --merge-only --technologies "${{ inputs.technologies }}" || true
              fi
              docker compose -f docker-compose.app.yml --env-file .env.production exec -T backend \
                env E2E_SKIP_LAB=0 E2E_MULTI_USERS=3 E2E_SKIP_CLEANUP=1 E2E_PRESERVE_LAB_USERS=1 \
                E2E_MAX_PER_TECH=${{ steps.labscope.outputs.max_per_tech }} \
                E2E_TECH_FILTER="${{ inputs.technologies }}" TERMINAL_MAX_WS_PER_USER=64 \
                python /scripts/e2e_all_scenarios_labs.py
            '

  cleanup-cluster:
    name: "[4D] Cleanup + pg backup"
    needs: [create-cluster, deploy-cluster, verify-health-cluster, test-units-cluster, prepare-e2e-cluster, e2e-api-cluster, e2e-labs-cluster]
    if: always() && inputs.topology == 'four-droplet' && needs.deploy-cluster.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      - name: Remove E2E data + restore JWT enforcement on D2 (via edge)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EDGE_PUBLIC_IP }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 10m
          envs: APP_PRIVATE_IP
          script: |
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@${APP_PRIVATE_IP}" '
              cd /opt/fixitlab
              # Pass SUPERUSER_EMAIL (read from .env.production like the E2E steps) so
              # cleanup-test-data.py always has PROTECTED_EMAIL set — the admin account
              # is never a deletion candidate even if its name looks test-like.
              ADMIN_EMAIL="$(grep "^SUPERUSER_EMAIL=" .env.production | head -1 | cut -d= -f2- | tr -d "\r")"
              docker compose -f docker-compose.app.yml --env-file .env.production exec -T backend \
                env SUPERUSER_EMAIL="$ADMIN_EMAIL" \
                python /scripts/cleanup-test-data.py || echo "WARN: cleanup warnings"
              chmod +x scripts/ci-e2e-session-mode.sh
              COMPOSE_FILE=docker-compose.app.yml ./scripts/ci-e2e-session-mode.sh restore || echo "WARN: could not restore JWT mode"
            '
      - name: Install daily pg_dump cron on D3
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          # DATA_PRIVATE_IP comes from cluster_ips.env via $GITHUB_ENV (Load edge host).
        run: |
          chmod +x scripts/ci-pg-backup-cron.sh
          ./scripts/ci-pg-backup-cron.sh

  summary-cluster:
    name: "[4D] Cluster summary"
    needs: [create-cluster, bootstrap-cluster, vault-cluster, deploy-cluster, email-credentials, verify-health-cluster, test-units-cluster, prepare-e2e-cluster, e2e-api-cluster, e2e-labs-cluster, cleanup-cluster]
    if: always() && inputs.topology == 'four-droplet' && (inputs.action == 'launch' || inputs.action == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with: { name: cluster-edge-host, path: _cluster }
      - name: Load edge host
        run: |
          echo "EDGE_PUBLIC_IP=$(cat _cluster/edge_host.txt)" >> "$GITHUB_ENV"
          [ -f _cluster/cluster_ips.env ] && cat _cluster/cluster_ips.env >> "$GITHUB_ENV" || true
      - name: Write cluster summary
        run: |
          {
            echo "## FixitLab Production — four-droplet"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Topology | \`four-droplet\` |"
            echo "| Edge (D1) | \`${EDGE_PUBLIC_IP}\` (public) |"
            echo "| App (D2) | \`${{ needs.create-cluster.outputs.app_private_ip }}\` (private) |"
            echo "| Data (D3) | \`${{ needs.create-cluster.outputs.db_private_ip }}\` (private) |"
            echo "| Labs (D4) | \`${{ needs.create-cluster.outputs.labs_private_ip }}\` (private) |"
            echo "| Wire existing | \`${{ inputs.wire_existing }}\` |"
            echo "| Rotate secrets | \`${{ inputs.rotate_secrets }}\` |"
            echo "| Site | https://fixitlab.in |"
            echo ""
            echo "## Job results"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| create-cluster | \`${{ needs.create-cluster.result }}\` |"
            echo "| bootstrap-cluster | \`${{ needs.bootstrap-cluster.result }}\` |"
            echo "| vault-cluster | \`${{ needs.vault-cluster.result }}\` |"
            echo "| deploy-cluster | \`${{ needs.deploy-cluster.result }}\` |"
            echo "| email-credentials | \`${{ needs.email-credentials.result }}\` |"
            echo "| verify-health-cluster | \`${{ needs.verify-health-cluster.result }}\` |"
            echo "| test-units-cluster | \`${{ needs.test-units-cluster.result }}\` |"
            echo "| prepare-e2e-cluster | \`${{ needs.prepare-e2e-cluster.result }}\` |"
            echo "| e2e-api-cluster | \`${{ needs.e2e-api-cluster.result }}\` |"
            echo "| e2e-labs-cluster | \`${{ needs.e2e-labs-cluster.result }}\` |"
            echo "| cleanup-cluster | \`${{ needs.cleanup-cluster.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ════════════════════════════════════════════════════════════════════════
  # MANAGED-KUBERNETES + AWS SCAFFOLD — STANDALONE, GATED, NO-OP WITHOUT KEYS
  #
  # These jobs exist so DOKS/EKS can be enabled later WITHOUT touching the green
  # droplet pipeline. Critical-path safety:
  #   * They are STANDALONE — NOTHING in the droplets chain `needs` them, and they
  #     `needs` nothing on the droplets chain. A skipped scaffold job therefore
  #     cannot transitively skip create-cluster/bootstrap/deploy (the transitive-
  #     skip trap that bit build-push-images). Gating is purely via `if:`.
  #   * With the defaults (cloud_provider=digitalocean, hosting_target=droplets)
  #     every job below is SKIPPED — the pipeline is byte-for-byte unchanged.
  #   * Even when selected, each job is a no-op until the needed secrets exist:
  #     it prints what it WOULD do, checks for creds, and exits 0 cleanly.
  #
  # Enable: docs/KUBERNETES.md (DOKS) and docs/AWS.md (EKS).
  # ════════════════════════════════════════════════════════════════════════

  # DOKS — gated on hosting_target == 'doks' (provider stays digitalocean).
  deploy-doks:
    name: "[DOKS] Deploy (scaffold)"
    if: |
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.hosting_target == 'doks' &&
      inputs.cloud_provider == 'digitalocean'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Provision DOKS cluster (no-op until DO token + APPLY=1)
        env:
          # A DO token is usually available; cluster creation still requires the
          # explicit APPLY=1 inside the script (left unset here = scaffold/dry).
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
          DO_REGION: ${{ vars.DO_REGION || 'blr1' }}
        run: |
          chmod +x infra/k8s/provision-doks.sh
          infra/k8s/provision-doks.sh
      - name: Show k8s manifests that WOULD be applied
        env:
          # Reuse the Docker Hub image pipeline coordinates when present.
          IMAGE_TAG: ${{ vars.USE_DOCKERHUB == 'true' && github.sha || 'latest' }}
          FIXITLAB_IMAGE_NS: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME || 'fixitlab' }}
        run: |
          echo "Would deploy modular-monolith manifests:"
          echo "  kustomize image: ${FIXITLAB_IMAGE_NS}/fixitlab-backend:${IMAGE_TAG}"
          echo "  kustomize image: ${FIXITLAB_IMAGE_NS}/fixitlab-frontend:${IMAGE_TAG}"
          echo "  kubectl apply -k infra/k8s/overlays/doks"
          ls -R infra/k8s | sed 's/^/  /'
      - name: Summary
        if: always()
        run: |
          {
            echo "## [DOKS] scaffold"
            echo "Managed-Kubernetes scaffold ran in NO-OP mode (no cluster created without APPLY=1)."
            echo "Manifests live under \`infra/k8s/\`. See docs/KUBERNETES.md to enable."
          } >> "$GITHUB_STEP_SUMMARY"

  # AWS provisioning — gated on cloud_provider == 'aws'. VPC/subnets/EKS via
  # eksctl or terraform; no-op until AWS creds + APPLY=1.
  provision-aws:
    name: "[AWS] Provision VPC/EKS (scaffold)"
    if: |
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.cloud_provider == 'aws'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Provision AWS/EKS (no-op until AWS creds + APPLY=1)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          EKS_PROVISIONER: ${{ vars.EKS_PROVISIONER || 'eksctl' }}
        run: |
          chmod +x infra/aws/provision-eks.sh
          infra/aws/provision-eks.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "## [AWS] scaffold"
            echo "AWS provisioning scaffold ran in NO-OP mode (no infra created without AWS creds + APPLY=1)."
            echo "Stubs live under \`infra/aws/\` + \`infra/terraform/\`. See docs/AWS.md to enable."
          } >> "$GITHUB_STEP_SUMMARY"

  # EKS deploy — gated on hosting_target == 'eks' AND cloud_provider == 'aws'.
  # Deploys the SAME modular-monolith manifests (eks overlay) once the cluster
  # exists. No-op until AWS creds are present.
  deploy-eks:
    name: "[EKS] Deploy (scaffold)"
    if: |
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.hosting_target == 'eks' &&
      inputs.cloud_provider == 'aws'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check AWS creds + show what WOULD deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          IMAGE_TAG: ${{ vars.USE_DOCKERHUB == 'true' && github.sha || 'latest' }}
          FIXITLAB_IMAGE_NS: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME || 'fixitlab' }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::notice::No AWS credentials — EKS deploy scaffold is a no-op."
            echo "Would, once the EKS cluster exists:"
          else
            echo "AWS credentials present. Would, against the live EKS cluster:"
          fi
          echo "  aws eks update-kubeconfig --name fixitlab-eks --region \${AWS_REGION:-us-east-1}"
          echo "  kustomize image: ${FIXITLAB_IMAGE_NS}/fixitlab-backend:${IMAGE_TAG}"
          echo "  kustomize image: ${FIXITLAB_IMAGE_NS}/fixitlab-frontend:${IMAGE_TAG}"
          echo "  kubectl apply -k infra/k8s/overlays/eks"
          ls -R infra/k8s | sed 's/^/  /'
          # Intentionally NOT applying — scaffold only. Provision the cluster via
          # the provision-aws job (cloud_provider=aws) first; real apply lands when
          # keys exist + the deploy step is wired (see docs/AWS.md).
      - name: Summary
        if: always()
        run: |
          {
            echo "## [EKS] scaffold"
            echo "EKS deploy scaffold ran in NO-OP mode (manifests not applied without keys)."
            echo "Manifests live under \`infra/k8s/\` (eks overlay). See docs/AWS.md to enable."
          } >> "$GITHUB_STEP_SUMMARY"
