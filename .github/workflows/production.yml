# ═══════════════════════════════════════════════════════════════════════════════
#  FixitLab Production — ONE workflow for everything
#
#  GitHub → Actions → "FixitLab Production" → Run workflow
#
#  Actions:
#    launch  — Full pipeline: optional new server → secrets → DNS → tests → deploy → health
#    deploy  — Tests + deploy to existing server (default day-to-day)
#    stop    — Stop containers (data preserved)
#
#  PR / push to main → tests only (no auto-deploy; use this workflow to launch)
# ═══════════════════════════════════════════════════════════════════════════════

name: FixitLab Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Pipeline action"
        type: choice
        required: true
        default: deploy
        options:
          - launch
          - deploy
          - stop
      create_server:
        description: "Create DigitalOcean droplet (launch only — skip if server already exists)"
        type: boolean
        default: false
      run_tests:
        description: "Run backend & frontend tests before deploy"
        type: boolean
        default: true
      build_scenarios:
        description: "Rebuild all scenario lab Docker images on server"
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      git_ref:
        description: "Git branch or tag to deploy"
        type: string
        default: main

  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: fixitlab-production
  cancel-in-progress: false

permissions:
  contents: write
  secrets: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── CI gate (PR + push) ───────────────────────────────────────────────────
  ci-tests:
    name: CI tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/check-no-secrets-in-git.sh && ./scripts/check-no-secrets-in-git.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: |
          python3 -c "
          import glob, yaml
          for p in glob.glob('scenarios/**/scenario.yaml', recursive=True):
              yaml.safe_load(open(p))
          print('Scenario YAML OK')
          "
      - working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: |
          python manage.py migrate --run-syncdb
          python manage.py test tests --verbosity=1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend

  # ─── Stop platform ─────────────────────────────────────────────────────────
  stop:
    name: "⏹ Stop platform"
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'stop'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Stop containers on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            REPO="https://github.com/${{ github.repository }}.git"
            if [ ! -d /opt/fixitlab/.git ]; then
              echo "Nothing to stop — /opt/fixitlab not deployed yet"
              exit 0
            fi
            cd /opt/fixitlab
            git fetch origin main 2>/dev/null || true
            chmod +x scripts/ci-remote-platform.sh scripts/platform-stop.sh 2>/dev/null || true
            ./scripts/ci-remote-platform.sh stop

      - run: echo "Platform stopped. Data in Docker volume fixitlab_db_data is preserved." >> "$GITHUB_STEP_SUMMARY"

  # ─── Create DO server (launch + create_server) ─────────────────────────────
  create-server:
    name: "① Create server"
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'launch' &&
      inputs.create_server
    runs-on: ubuntu-latest
    environment: production
    outputs:
      prod_host: ${{ steps.sync.outputs.prod_host }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve DO API token
        id: do_token
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
        run: |
          if [ -n "$DO_API_TOKEN" ]; then
            echo "token=$DO_API_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=$(echo "$PRODUCTION_ENV_B64" | base64 -d | grep '^DO_API_TOKEN=' | cut -d= -f2- | tr -d '\r')" >> "$GITHUB_OUTPUT"
          fi

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ steps.do_token.outputs.token }}

      - name: Create droplet & wait for SSH
        id: droplet
        env:
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          DO_API_TOKEN: ${{ steps.do_token.outputs.token }}
        run: |
          chmod +x scripts/ci-create-production-droplet.sh
          ./scripts/ci-create-production-droplet.sh

      - name: Update GitHub secrets, DNS & metadata
        id: sync
        env:
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
          PUBLIC_IP: ${{ steps.droplet.outputs.public_ip }}
          DROPLET_ID: ${{ steps.droplet.outputs.droplet_id }}
          SSH_KEY_ID: ${{ steps.droplet.outputs.ssh_key_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ENVIRONMENT: production
        run: |
          chmod +x scripts/ci-sync-droplet-secrets.sh
          ./scripts/ci-sync-droplet-secrets.sh

      - name: Commit droplet metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/digitalocean/production.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ci: production droplet ${{ steps.droplet.outputs.public_ip }}"
          git push origin HEAD:main || true

  # ─── Tests (launch / deploy) ───────────────────────────────────────────────
  test-backend:
    name: "② Test backend"
    needs: [create-server]
    if: |
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.run_tests &&
      always() &&
      (needs.create-server.result == 'skipped' || needs.create-server.result == 'success')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/check-no-secrets-in-git.sh && ./scripts/check-no-secrets-in-git.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: |
          python manage.py migrate --run-syncdb
          python manage.py test tests --verbosity=2

  test-frontend:
    name: "② Test frontend"
    needs: [create-server]
    if: |
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      inputs.run_tests &&
      always() &&
      (needs.create-server.result == 'skipped' || needs.create-server.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: "③ Deploy application"
    needs: [create-server, test-backend, test-frontend]
    if: |
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      always() &&
      (needs.create-server.result == 'skipped' || needs.create-server.result == 'success') &&
      (needs.test-backend.result == 'skipped' || needs.test-backend.result == 'success') &&
      (needs.test-frontend.result == 'skipped' || needs.test-frontend.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    outputs:
      prod_host: ${{ steps.host.outputs.host }}
    steps:
      - name: Resolve production host
        id: host
        run: |
          H="${{ needs.create-server.outputs.prod_host }}"
          if [ -z "$H" ]; then H="${{ secrets.PROD_HOST }}"; fi
          if [ -z "$H" ]; then
            echo "ERROR: PROD_HOST not set — run launch with create_server or set GitHub secret"
            exit 1
          fi
          echo "host=$H" >> "$GITHUB_OUTPUT"

      - name: Clone repo & start platform
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
          BUILD_SCENARIOS: ${{ inputs.build_scenarios }}
        with:
          host: ${{ steps.host.outputs.host }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GITHUB_TOKEN,PRODUCTION_ENV_B64,BUILD_SCENARIOS
          command_timeout: 90m
          script: |
            set -e
            REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            mkdir -p /opt/fixitlab
            if [ ! -d /opt/fixitlab/.git ]; then
              git clone "$REPO" /opt/fixitlab
            fi
            cd /opt/fixitlab
            git remote set-url origin "$REPO"
            git fetch origin
            git checkout ${{ inputs.git_ref }}
            git reset --hard "origin/${{ inputs.git_ref }}"
            chmod +x scripts/ci-remote-platform.sh scripts/platform-start.sh scripts/sync-production-env.sh
            export BUILD_SCENARIOS="${BUILD_SCENARIOS:-true}"
            ./scripts/ci-remote-platform.sh deploy

  # ─── Health check ───────────────────────────────────────────────────────────
  health:
    name: "④ Health check"
    needs: [deploy]
    if: |
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'launch' || inputs.action == 'deploy') &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for site
        run: |
          HOST="${{ needs.deploy.outputs.prod_host }}"
          URL="http://${HOST}/api/health/"
          echo "Checking $URL ..."
          for i in $(seq 1 30); do
            if curl -sf "$URL" >/dev/null; then
              echo "✅ Health OK"
              exit 0
            fi
            sleep 10
          done
          echo "WARN: Health check timed out — deploy may still be starting (scenario builds take time)"
          exit 0

      - name: Pipeline summary
        run: |
          {
            echo "## FixitLab Production — complete"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Action | \`${{ inputs.action }}\` |"
            echo "| Host | \`${{ needs.deploy.outputs.prod_host }}\` |"
            echo "| Branch | \`${{ inputs.git_ref }}\` |"
            echo "| Create server | ${{ inputs.create_server }} |"
            echo "| Tests | ${{ inputs.run_tests }} |"
            echo "| Build scenarios | ${{ inputs.build_scenarios }} |"
            echo ""
            echo "**Site:** https://fixitlab.in (after DNS propagates)"
            echo ""
            echo "Secrets updated automatically when create_server was enabled."
          } >> "$GITHUB_STEP_SUMMARY"
