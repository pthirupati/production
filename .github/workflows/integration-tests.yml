# integration-tests.yml — Django integration tests + API contract checks
# Triggers: every PR + merge to main
name: Integration Tests

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Extended Django tests (real Postgres + Redis) ────────────────────────
  django-integration:
    name: Django integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-backend
      - name: Migrate
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate --run-syncdb
      - name: Run extended tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          REDIS_URL: redis://localhost:6379/0
          JIRA_SIMULATION_MODE: "False"
          SKIP_EMAIL_TESTS: "true"
          RUN_EXTENDED_TESTS: "1"
        run: |
          python manage.py test tests \
            --verbosity=2 \
            --keepdb
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: backend/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  # ─── Migration safety: no squash/destructive changes ─────────────────────
  migration-safety:
    name: Migration safety check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_migrate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so we can compare base branch
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-backend
      - name: Apply migrations from main (base state)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_migrate_test
        run: |
          git stash || true
          python manage.py migrate --run-syncdb
          git stash pop || true
      - name: Apply PR migrations on top
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_migrate_test
        run: python manage.py migrate
      - name: Check no missing migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_migrate_test
        run: python manage.py makemigrations --check --dry-run

  # ─── API contract: key endpoint response shape ────────────────────────────
  api-contract:
    name: API contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [django-integration]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-backend
      - name: Install schemathesis
        run: pip install schemathesis
      - name: Start Django dev server
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
        run: |
          python manage.py migrate --run-syncdb
          python manage.py runserver 0.0.0.0:8001 &
          sleep 5
      - name: Run schemathesis API contract tests
        run: |
          schemathesis run http://localhost:8001/api/schema/ \
            --checks all \
            --max-examples 25 \
            --hypothesis-seed 42 \
            --junit-xml=schemathesis-results.xml || true
      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-results
          path: schemathesis-results.xml
          retention-days: 14
          if-no-files-found: ignore

  notify-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: [django-integration, migration-safety, api-contract]
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-slack
        with:
          status: failure
          workflow: "Integration Tests (${{ github.ref_name }})"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
