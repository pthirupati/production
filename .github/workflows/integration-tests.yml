# integration-tests.yml — Django integration tests + API contract checks
#
# Audit Z6-10. The header used to claim "every PR + merge to main" while the only
# trigger was workflow_dispatch, so none of this had gated a PR in a long time.
#
# It is NOT all re-enabled: `django-integration` largely duplicates ci.yml's suite
# and `api-contract` runs schemathesis, which is slow and fuzz-flaky. Turning both
# on for every PR would roughly double CI time for very little new signal.
# `migration-safety` is different — it is the only check that applies the PR's
# migrations *on top of main's schema*, which is the failure that reaches
# production — so that one job now runs on every PR and the other two stay manual.
name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**/migrations/**"
      - "backend/**/models.py"
      - ".github/workflows/integration-tests.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Extended Django tests (real Postgres + Redis) ────────────────────────
  django-integration:
    name: Django integration tests
    # Manual only: ci.yml already runs `manage.py test tests apps` on every PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-backend
      - name: Migrate
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate --run-syncdb
      - name: Run extended tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          REDIS_URL: redis://localhost:6379/0
          JIRA_SIMULATION_MODE: "False"
          SKIP_EMAIL_TESTS: "true"
          RUN_EXTENDED_TESTS: "1"
        run: |
          python manage.py test tests \
            --verbosity=2 \
            --keepdb
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-coverage
          path: backend/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  # ─── Migration safety: no squash/destructive changes ─────────────────────
  migration-safety:
    name: Migration safety check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_migrate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so we can compare base branch
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-backend
      # The previous version ran `git stash` here to "go back to main". On a clean
      # PR checkout there is nothing to stash, so it was a no-op and the job simply
      # migrated the PR's own state twice — it never tested the thing it is named
      # after. Checking out the base commit is what actually reproduces production's
      # starting schema.
      - name: Build the base schema (target branch)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_migrate_test
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          set -euo pipefail
          git -C .. checkout --detach "$BASE_SHA"
          python manage.py migrate --run-syncdb
      - name: Apply this PR's migrations on top
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_migrate_test
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git -C .. checkout --detach "$HEAD_SHA"
          # No --run-syncdb: a migration that only works because syncdb created the
          # table for it is exactly the migration that fails on the real database.
          python manage.py migrate
      - name: Check no missing migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_migrate_test
        run: python manage.py makemigrations --check --dry-run

  # ─── API contract: key endpoint response shape ────────────────────────────
  api-contract:
    name: API contract tests
    # Manual only: schemathesis fuzzing is slow and its failures are frequently
    # about the fuzzer's expectations rather than the API.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [django-integration]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-backend
      - name: Install schemathesis
        run: pip install schemathesis
      - name: Start Django dev server
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
        run: |
          python manage.py migrate --run-syncdb
          python manage.py runserver 0.0.0.0:8001 &
          sleep 5
      - name: Run schemathesis API contract tests
        run: |
          schemathesis run http://localhost:8001/api/schema/ \
            --checks all \
            --max-examples 25 \
            --hypothesis-seed 42 \
            --junit-xml=schemathesis-results.xml || true
      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-contract-results
          path: schemathesis-results.xml
          retention-days: 14
          if-no-files-found: ignore
