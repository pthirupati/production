# deploy-production.yml — Manual production deploy with required approval
# Steps: all checks gate → build → approval → blue/green deploy → smoke → auto-rollback
name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (tag or SHA recommended)"
        required: true
        default: main
      skip_e2e_gate:
        description: "Skip E2E gate check (emergency deploy only)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/fixitlab

jobs:
  # ─── Gate: all required checks must have passed ───────────────────────────
  gate:
    name: Verify all checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}
      - name: Confirm deployer acknowledgement
        run: |
          echo "Deploying ref: ${{ github.event.inputs.git_ref }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Skip E2E gate: ${{ github.event.inputs.skip_e2e_gate }}"
      - name: Check commit exists on main
        if: github.event.inputs.skip_e2e_gate != 'true'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "ERROR: ${{ github.event.inputs.git_ref }} is not on main branch. Aborting."
            exit 1
          fi

  # ─── Build production Docker images ───────────────────────────────────────
  build:
    name: Build production images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [gate]
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend (prod)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.sha.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:prod-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:prod-latest
          cache-to: type=inline

      - name: Build and push frontend (prod)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.sha.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:prod-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:prod-latest
          cache-to: type=inline

  # ─── Unit test gate (runs on GH, not prod server) ─────────────────────────
  test-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}
      - uses: ./.github/actions/setup-python-backend
      - name: Migrate + test
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          JIRA_SIMULATION_MODE: "False"
          SKIP_EMAIL_TESTS: "true"
        run: |
          python manage.py migrate --run-syncdb
          python manage.py test tests --verbosity=1 --parallel

  test-frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}
      - uses: ./.github/actions/setup-node-frontend
      - name: Build
        working-directory: frontend
        run: npm run build

  # ─── Manual approval checkpoint ───────────────────────────────────────────
  approval:
    name: Awaiting deployment approval
    runs-on: ubuntu-latest
    needs: [build, test-backend, test-frontend]
    environment:
      name: production
      url: ${{ secrets.PROD_SITE_URL }}
    steps:
      - name: Approved
        run: echo "Production deployment approved by ${{ github.actor }}"

  # ─── Blue/green deploy ────────────────────────────────────────────────────
  deploy:
    name: Deploy to production (blue/green)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [approval, build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Record pre-deploy state (for rollback)
        id: pre_deploy
        run: |
          PREV=$(ssh -i ~/.ssh/id_ed25519 ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }} \
            "cd /opt/fixitlab && git rev-parse HEAD")
          echo "prev_sha=$PREV" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }} \
            "cd /opt/fixitlab && \
             git fetch origin && \
             git checkout ${{ github.event.inputs.git_ref }} && \
             IMAGE_TAG=${{ needs.build.outputs.sha_short }} \
             bash scripts/ci-remote-platform.sh deploy"

      - name: Public health check (20 retries × 5s)
        id: health
        env:
          PROD_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_URL}/api/health/" || echo "000")
            [ "$STATUS" = "200" ] && { echo "healthy=true" >> "$GITHUB_OUTPUT"; exit 0; }
            echo "Attempt $i — $STATUS"; sleep 5
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Post-deploy verification
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }} \
            "cd /opt/fixitlab && bash scripts/ci-post-deploy-verify.sh"

      - name: Auto-rollback on failure
        if: failure()
        run: |
          echo "Deploy or health check failed — rolling back to ${{ steps.pre_deploy.outputs.prev_sha }}"
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }} \
            "cd /opt/fixitlab && \
             git checkout ${{ steps.pre_deploy.outputs.prev_sha }} && \
             bash scripts/ci-remote-platform.sh deploy" || true

  # ─── Post-deploy smoke E2E ────────────────────────────────────────────────
  smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install chromium --with-deps
      - name: Run smoke tests
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          SITE_URL: ${{ secrets.PROD_SITE_URL }}
          SUPERUSER_EMAIL: ${{ secrets.PROD_SUPERUSER_EMAIL }}
          SUPERUSER_PASSWORD: ${{ secrets.PROD_SUPERUSER_PASSWORD }}
          E2E_SKIP_EMAIL: "true"
          E2E_SKIP_LAB: "0"
        run: |
          npx playwright test tests/e2e/smoke/ \
            --reporter=html \
            --output=playwright-prod-smoke-results \
            --timeout=60000
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Emergency rollback if smoke fails
        if: failure()
        run: |
          echo "Smoke test failed post-deploy — triggering rollback"
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }} \
            "cd /opt/fixitlab && \
             git checkout ${{ needs.deploy.outputs.prev_sha || 'HEAD~1' }} && \
             bash scripts/ci-remote-platform.sh deploy" || true

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [deploy, smoke]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Determine status
        id: status
        run: |
          RESULTS="${{ needs.deploy.result }} ${{ needs.smoke.result }}"
          echo "$RESULTS" | grep -qE "failure|cancelled" && echo "status=failure" >> "$GITHUB_OUTPUT" || echo "status=success" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/notify-slack
        with:
          status: ${{ steps.status.outputs.status }}
          workflow: "Deploy Production (${{ github.event.inputs.git_ref }})"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
