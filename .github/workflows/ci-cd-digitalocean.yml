# FixitLab CI/CD — production only (DigitalOcean / any VPS)
#
# push main  → test → deploy production
# pull_request → test only

name: CI/CD Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate scenario YAML files
        run: |
          python3 -c "
          import glob, yaml, sys
          for p in glob.glob('scenarios/**/scenario.yaml', recursive=True):
              with open(p) as f:
                  yaml.safe_load(f)
          print('All scenario YAML files valid')
          "

      - name: Run migrations check
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate --run-syncdb

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixitlab_test
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py test tests --verbosity=2

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e-smoke:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 36); do
            curl -sf http://localhost/api/health/ && exit 0
            sleep 5
          done
          exit 1
      - name: Run Playwright smoke tests
        run: |
          pip install playwright
          python test/smoketest_e2e.py

  deploy-production:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GITHUB_TOKEN,PRODUCTION_ENV_B64
          command_timeout: 90m
          script: |
            set -e
            REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            if [ ! -d /opt/fixitlab/.git ]; then
              mkdir -p /opt/fixitlab
              git clone "$REPO" /opt/fixitlab
            fi
            cd /opt/fixitlab
            git remote set-url origin "$REPO"
            git fetch origin
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/platform-start.sh scripts/platform-stop.sh scripts/build-scenario-images.sh scripts/startup.sh scripts/ensure-ssl-certs.sh scripts/sync-production-env.sh
            export COMPOSE_FILE=docker-compose.prod.yml
            export ENV_FILE=.env.production
            export BUILD_SCENARIOS=true
            ./scripts/platform-start.sh
