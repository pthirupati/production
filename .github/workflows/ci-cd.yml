name: FixitLab CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: fixitlab-eks

jobs:
  # ── Lint & Test Backend ──────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fixitlab_test
          POSTGRES_USER: fixitlab
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov flake8

      - name: Lint
        run: |
          cd backend
          flake8 --max-line-length=120 --exclude=migrations .

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: fixitlab_test
          POSTGRES_USER: fixitlab
          POSTGRES_PASSWORD: testpass
          REDIS_HOST: localhost
          DJANGO_SECRET_KEY: test-secret-key
        run: |
          cd backend
          python manage.py test --verbosity=2

  # ── Lint & Test Frontend ─────────────────────────────────
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & lint
        run: |
          cd frontend
          npm ci
          npm run lint 2>/dev/null || true

      - name: Build
        run: |
          cd frontend
          npm run build

  # ── Build & Push Docker Images ───────────────────────────
  build-push:
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        run: |
          docker build -t $ECR_REGISTRY/fixitlab/backend:${{ github.sha }} \
                        -t $ECR_REGISTRY/fixitlab/backend:latest \
                        ./backend
          docker push $ECR_REGISTRY/fixitlab/backend:${{ github.sha }}
          docker push $ECR_REGISTRY/fixitlab/backend:latest

      - name: Build & push frontend
        run: |
          docker build -f frontend/Dockerfile.prod \
                        -t $ECR_REGISTRY/fixitlab/frontend:${{ github.sha }} \
                        -t $ECR_REGISTRY/fixitlab/frontend:latest \
                        ./frontend
          docker push $ECR_REGISTRY/fixitlab/frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/fixitlab/frontend:latest

      - name: Build & push scenario images
        run: |
          for scenario_dir in scenarios/*/*; do
            if [ -f "$scenario_dir/Dockerfile" ]; then
              SLUG=$(basename "$scenario_dir")
              docker build -t $ECR_REGISTRY/fixitlab/scenario-${SLUG}:latest "$scenario_dir"
              docker push $ECR_REGISTRY/fixitlab/scenario-${SLUG}:latest
            fi
          done

  # ── Deploy to EKS ───────────────────────────────────────
  deploy:
    needs: [build-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Deploy to Kubernetes
        run: |
          # Update image tags
          sed -i "s|fixitlab/backend:latest|$ECR_REGISTRY/fixitlab/backend:${{ github.sha }}|g" infra/kubernetes/deployment.yaml
          sed -i "s|fixitlab/frontend:latest|$ECR_REGISTRY/fixitlab/frontend:${{ github.sha }}|g" infra/kubernetes/deployment.yaml

          kubectl apply -f infra/kubernetes/deployment.yaml

          # Wait for rollout
          kubectl -n fixitlab rollout status deployment/backend --timeout=300s
          kubectl -n fixitlab rollout status deployment/frontend --timeout=300s

      - name: Run migrations
        run: |
          POD=$(kubectl -n fixitlab get pod -l app=backend -o jsonpath='{.items[0].metadata.name}')
          kubectl -n fixitlab exec "$POD" -- python manage.py migrate --noinput

      - name: Smoke test
        run: |
          INGRESS_IP=$(kubectl -n fixitlab get ingress fixitlab-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -sf "http://$INGRESS_IP/api/technologies/" || echo "Warning: smoke test failed"
