# Optional: run tests on pull requests only (does not deploy)
name: CI Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_email_tests:
        description: "Skip email sending in tests (uncheck to test real email delivery)"
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/check-no-secrets-in-git.sh && ./scripts/check-no-secrets-in-git.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          JIRA_SIMULATION_MODE: "False"
          SKIP_EMAIL_TESTS: ${{ inputs.skip_email_tests == 'false' && 'false' || 'true' }}
        run: |
          python manage.py migrate --run-syncdb
          python manage.py test tests --verbosity=1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true
