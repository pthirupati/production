name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixitlab
          POSTGRES_PASSWORD: fixitlab
          POSTGRES_DB: fixitlab_test
        ports:
          ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Lint hero scenario YAML
        run: python scripts/lint_scenarios.py --strict-heroes
      - name: Lint full scenario catalog (no banned learner-facing words)
        run: python scripts/lint_scenarios.py --all --max-failures 0
      - name: Django tests
        env:
          DATABASE_URL: postgres://fixitlab:fixitlab@localhost:5432/fixitlab_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: config.test_settings
          SECRET_KEY: ci-test-secret-key-not-for-production
          JIRA_SIMULATION_MODE: "False"
          SKIP_EMAIL_TESTS: "true"
        run: |
          cd backend
          python manage.py migrate --run-syncdb
          # Run BOTH the top-level tests/ suite AND every app-level test package
          # (apps/*/tests/). CI previously ran only `tests`, so the 34 app-level
          # test files — including all the sim-engine tests — never ran in CI and
          # regressions in them shipped green. `tests apps` closes that blind spot.
          python manage.py test tests apps --verbosity=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
