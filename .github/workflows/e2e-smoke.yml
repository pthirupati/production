# e2e-smoke.yml — Critical-path smoke test (~10 min)
# Called as a reusable workflow by production.yml after deploy (runs inline, not as a separate run).
# Can also be triggered manually.
# Covers: login, start lab, complete scenario, payment flow
name: E2E Smoke

on:
  workflow_call:
    inputs:
      base_url:
        description: "Base URL to test against"
        required: false
        type: string
        default: ""
      site_url:
        description: "Public site URL for SPA routes"
        required: false
        type: string
        default: ""
    secrets:
      PRODUCTION_BASE_URL:
        required: false
      PRODUCTION_SITE_URL:
        required: false
      STAGING_BASE_URL:
        required: false
      STAGING_SITE_URL:
        required: false
      PROD_SUPERUSER_EMAIL:
        required: false
      PROD_SUPERUSER_PASSWORD:
        required: false
      STAGING_SUPERUSER_EMAIL:
        required: false
      STAGING_SUPERUSER_PASSWORD:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against (default: production)"
        required: false
        default: ""
      site_url:
        description: "Public site URL for SPA routes"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Critical path E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright + dependencies
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install chromium --with-deps

      - name: Resolve target URLs
        id: urls
        run: |
          BASE="${{ inputs.base_url }}"
          SITE="${{ inputs.site_url }}"
          if [ -z "$BASE" ]; then BASE="${{ secrets.PRODUCTION_BASE_URL }}"; fi
          if [ -z "$SITE" ]; then SITE="${{ secrets.PRODUCTION_SITE_URL }}"; fi
          if [ -z "$BASE" ]; then BASE="${{ secrets.STAGING_BASE_URL }}"; fi
          if [ -z "$SITE" ]; then SITE="${{ secrets.STAGING_SITE_URL }}"; fi
          if [ -z "$BASE" ]; then BASE="https://fixitlab.in"; fi
          if [ -z "$SITE" ]; then SITE="https://fixitlab.in"; fi
          echo "base_url=${BASE}" >> "$GITHUB_OUTPUT"
          echo "site_url=${SITE}" >> "$GITHUB_OUTPUT"
          echo "Resolved BASE=${BASE} SITE=${SITE}"

      - name: Wait for staging health (up to 120s)
        env:
          BASE_URL: ${{ steps.urls.outputs.base_url }}
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then echo "Healthy"; break; fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/api/health/" || echo "000")
            if [ "$STATUS" = "200" ]; then echo "Healthy (api)"; break; fi
            echo "Attempt $i — status $STATUS, retrying in 5s…"
            sleep 5
          done
          [ "$STATUS" = "200" ] || { echo "Staging not healthy after 120s"; exit 1; }

      - name: Resolve superuser credentials
        id: superuser
        run: |
          EMAIL="${{ secrets.PROD_SUPERUSER_EMAIL }}"
          PASS="${{ secrets.PROD_SUPERUSER_PASSWORD }}"
          if [ -z "$EMAIL" ]; then EMAIL="${{ secrets.STAGING_SUPERUSER_EMAIL }}"; fi
          if [ -z "$PASS" ]; then PASS="${{ secrets.STAGING_SUPERUSER_PASSWORD }}"; fi
          echo "email=${EMAIL}" >> "$GITHUB_OUTPUT"
          echo "password=${PASS}" >> "$GITHUB_OUTPUT"
          if [ -z "$EMAIL" ] || [ -z "$PASS" ]; then
            echo "WARN: SUPERUSER credentials not configured — auth smoke tests will fail"
          fi

      - name: Run Playwright smoke tests
        env:
          BASE_URL: ${{ steps.urls.outputs.base_url }}
          SITE_URL: ${{ steps.urls.outputs.site_url }}
          SUPERUSER_EMAIL: ${{ steps.superuser.outputs.email }}
          SUPERUSER_PASSWORD: ${{ steps.superuser.outputs.password }}
          E2E_SKIP_LAB: "0"
          E2E_SKIP_EMAIL: "true"
          E2E_ISOLATION_ONCE: "1"
          PLAYWRIGHT_HTML_REPORT: playwright-report
        run: |
          npx playwright test tests/e2e/smoke/ \
            --reporter=html \
            --output=playwright-results \
            --timeout=60000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ github.run_id }}
          path: playwright-results/
          retention-days: 7

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          status: failure
          workflow: "E2E Smoke"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on success
        if: success()
        uses: ./.github/actions/notify-slack
        with:
          status: success
          workflow: "E2E Smoke"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
