# FixitLab Tests — manual only (run tests without deploy)
#
# GitHub → Actions → FixitLab Tests → Run workflow
#
#   ci          → unit tests on GitHub (PR-quality, no server needed)
#   production  → full E2E on live server via SSH (all tabs, labs, admin)
#
# Recommended order: run **FixitLab Production** (deploy) first so the server has
# migrations + scenario seed, then run FixitLab Tests with target=production.

name: FixitLab Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to run tests"
        type: choice
        required: true
        default: production
        options:
          - production
          - ci
      run_unit:
        description: "Run Django unit tests"
        type: boolean
        default: true
      run_e2e:
        description: "Run full E2E (all tabs, features, admin, labs)"
        type: boolean
        default: true
      run_lab_validation:
        description: "All scenarios lab E2E (every tech/scenario, 3 users, auto catalog)"
        type: boolean
        default: true
      skip_cleanup:
        description: "Skip automatic test data cleanup (debug only)"
        type: boolean
        default: false
      skip_email_tests:
        description: "Skip email sending in tests (uncheck to test real email delivery)"
        type: boolean
        default: true
      git_ref:
        description: "Git ref to use on production server (production target only)"
        type: string
        default: main

concurrency:
  group: fixitlab-tests
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-tests:
    name: GitHub unit tests (target=ci only)
    if: inputs.target == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixitlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/check-no-secrets-in-git.sh && ./scripts/check-no-secrets-in-git.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          JIRA_SIMULATION_MODE: "False"
          SKIP_EMAIL_TESTS: ${{ inputs.skip_email_tests == 'false' && 'false' || 'true' }}
        run: |
          python manage.py migrate --run-syncdb
          python manage.py test tests --verbosity=2
          python manage.py validate_scenario_catalog --flagship-only --fail-on-gaps
          # Second pass: --flagship-only and coding_mode do not overlap at all
          # (70 flagships vs 1334 coding labs, intersection 0), so the gate above
          # validates ZERO coding labs. --rules scopes this pass to the grading
          # -integrity rules (entrypoint/runtime/editable-file/hidden-test
          # quality) so it fails on a real regression without also blocking on
          # the older copy/hint backlog those 1334 labs still carry.
          python manage.py validate_scenario_catalog --coding-only --fail-on-gaps \
            --rules "entrypoint,files[],tautological,preview,grader,missing slug,no server runtime,hidden tests,does not resolve to a scenario"
          python manage.py seed_tutorials
          python manage.py check_tutorial_completeness --all
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend

  production-tests:
    name: Production E2E tests
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Sync test scripts on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_UNIT: ${{ inputs.run_unit }}
          RUN_E2E: ${{ inputs.run_e2e }}
          RUN_LAB_VALIDATION: ${{ inputs.run_lab_validation }}
          E2E_SKIP_CLEANUP: ${{ inputs.skip_cleanup && '1' || '0' }}
          E2E_SKIP_EMAIL: ${{ inputs.skip_email_tests == 'false' && '0' || '1' }}
          SKIP_EMAIL_TESTS: ${{ inputs.skip_email_tests == 'false' && '0' || '1' }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GITHUB_TOKEN,RUN_UNIT,RUN_E2E,RUN_LAB_VALIDATION,E2E_SKIP_CLEANUP,E2E_SKIP_EMAIL,SKIP_EMAIL_TESTS
          command_timeout: 240m
          script: |
            set -e
            REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            mkdir -p /opt/fixitlab
            if [ ! -d /opt/fixitlab/.git ]; then
              git clone "$REPO" /opt/fixitlab
            fi
            cd /opt/fixitlab
            git remote set-url origin "$REPO"
            git fetch origin
            git checkout ${{ inputs.git_ref }}
            git reset --hard "origin/${{ inputs.git_ref }}"
            chmod +x scripts/ci-run-tests.sh scripts/run-full-e2e.sh \
              scripts/cleanup-test-data.py scripts/validate-scenario-*.sh \
              scripts/validate-scenario-labs.py scripts/e2e_all_scenarios_labs.py \
              scripts/e2e_dynamic_catalog.py scripts/e2e_tab_coverage.py 2>/dev/null || true
            export RUN_UNIT="${RUN_UNIT:-true}"
            export RUN_E2E="${RUN_E2E:-true}"
            export RUN_LAB_VALIDATION="${RUN_LAB_VALIDATION:-true}"
            export E2E_SKIP_CLEANUP="${E2E_SKIP_CLEANUP:-0}"
            export E2E_SKIP_EMAIL="${E2E_SKIP_EMAIL:-1}"
            export SKIP_EMAIL_TESTS="${SKIP_EMAIL_TESTS:-1}"
            ./scripts/ci-run-tests.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## FixitLab Tests — complete"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Target | \`${{ inputs.target }}\` |"
            echo "| Unit tests on server | \`${{ inputs.run_unit }}\` |"
            echo "| GitHub unit job | skipped when target=production |"
            echo "| E2E (all tabs) | \`${{ inputs.run_e2e }}\` |"
            echo "| Lab validation | \`${{ inputs.run_lab_validation }}\` |"
            echo "| Cleanup | \`${{ !inputs.skip_cleanup }}\` |"
            echo "| Branch | \`${{ inputs.git_ref }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
