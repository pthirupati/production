# nginx-ephemeral.conf — gateway for the merge-gate stack in e2e-smoke.yml.
#
# The SPA calls the API on relative paths (`/api/...`); frontend/vite.config.js
# only proxies those in `vite dev`, and nothing sets a VITE_API_BASE_URL. So a
# built SPA only works when it is served same-origin with the API — exactly the
# topology gateway/nginx.http.conf gives production. This file reproduces that
# single origin inside a GitHub runner so the smoke specs can point BASE_URL and
# SITE_URL at one host.
#
# Deliberate differences from gateway/nginx.http.conf:
#   * No limit_req zones. Playwright runs specs across parallel workers, so
#     production's 20r/m login limit would fail merges for load, not for defect.
#     Rate limiting is therefore NOT covered by the merge gate.
#   * No TLS, no ACME challenge, no HTTPS redirect — the runner has no cert.
#   * /static/ is proxied to Django (DEBUG=True serves it) instead of being
#     served from a collectstatic volume, so the job skips collectstatic.

upstream backend_pool {
    server 127.0.0.1:8001;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;
    server_tokens off;

    # Matches the production liveness path so smoke/critical-path.spec.js:12
    # exercises the same URL it does against fixitlab.in.
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /static/ {
        proxy_pass http://backend_pool/static/;
        proxy_set_header Host $host;
        access_log off;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend_pool/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA history fallback — /scenarios and /dashboard are client-side routes.
    location / {
        root /srv/spa;
        try_files $uri $uri/ /index.html;
    }
}
