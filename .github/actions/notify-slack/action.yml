name: "Notify Slack"
description: "Post a workflow status message to Slack"

inputs:
  status:
    description: "success | failure | cancelled"
    required: true
  workflow:
    description: "Workflow name for the message title"
    required: true
  slack-webhook-url:
    description: "Slack incoming webhook URL"
    required: true

runs:
  using: "composite"
  steps:
    - name: Send Slack notification
      shell: bash
      env:
        STATUS: ${{ inputs.status }}
        WORKFLOW: ${{ inputs.workflow }}
        WEBHOOK: ${{ inputs.slack-webhook-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BRANCH: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
      run: |
        if [ -z "${WEBHOOK:-}" ]; then
          echo "Slack webhook not configured — skipping notification"
          exit 0
        fi
        if [ "$STATUS" = "success" ]; then
          EMOJI=":white_check_mark:"
          COLOR="good"
        elif [ "$STATUS" = "failure" ]; then
          EMOJI=":x:"
          COLOR="danger"
        else
          EMOJI=":warning:"
          COLOR="warning"
        fi

        PAYLOAD=$(cat <<EOF
        {
          "attachments": [{
            "color": "${COLOR}",
            "title": "${EMOJI} ${WORKFLOW} — ${STATUS}",
            "fields": [
              {"title": "Branch", "value": "${BRANCH}", "short": true},
              {"title": "Actor", "value": "${ACTOR}", "short": true}
            ],
            "actions": [{"type": "button", "text": "View Run", "url": "${RUN_URL}"}]
          }]
        }
        EOF
        )
        curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
