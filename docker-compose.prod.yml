# FixitLab — Production Docker Compose
# Deploy on a single VPS with SSL via Let's Encrypt
# Usage: docker compose -f docker-compose.prod.yml up -d

# HashiCorp Vault — production secrets (127.0.0.1 only, not published to host)
include:
  - path: docker-compose.vault.yml

services:

  vault:
    networks:
      fixitlab_net:
        aliases:
          - vault

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.prod
    # Pinned image name: used as the local build tag AND, when IMAGE_TAG points at a
    # pushed Docker Hub SHA and the deploy passes --pull, pulled instead of rebuilt.
    # Defaults (fixitlab/...:latest) are an inert local tag when building on-node.
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-gateway:${IMAGE_TAG:-latest}
    environment:
      - SSL_DOMAIN=${SSL_DOMAIN:-fixitlab.in}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend-prod:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - static_volume:/static
      - media_volume:/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      # Example host mount (uncomment and adjust for single-host installs):
      # - /etc/letsencrypt/live/fixitlab.in:/etc/letsencrypt/live/fixitlab.in:ro
      # - /var/www/certbot:/var/www/certbot:ro
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  certbot:
    # Pinned by digest (certbot 5.7.0, resolved 2026-08) — same pin as edge.yml.
    # `:latest` auto-tracked ACME changes; this does not, so bump deliberately.
    image: certbot/certbot:latest@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Auto-renew every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200 & wait $${!}; done'"
    restart: unless-stopped

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-frontend:${IMAGE_TAG:-latest}
    networks:
      - fixitlab_net
    restart: unless-stopped

  backend:
    build: ./backend
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      TERMINAL_MAX_WS_PER_USER: ${TERMINAL_MAX_WS_PER_USER:-20}
      # pgBouncer connection — set PGBOUNCER_HOST and PGBOUNCER_PORT in .env.production
      # PGBOUNCER_HOST=pgbouncer
      # PGBOUNCER_PORT=5432
    depends_on:
      vault:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # NOT `:ro` — deliberately. app.yml uses :ro and it reads as the hardened
      # version, but that is cosmetic: `:ro` makes the socket FILE read-only, and
      # the Docker API is spoken over it either way. Measured — a container given
      # `-v /var/run/docker.sock:/var/run/docker.sock:ro` still ran `docker create`
      # AND `docker rm` successfully. So :ro buys nothing here and would only
      # advertise a protection that does not exist.
      #
      # This mount IS host root, and on this single-droplet topology it has to be:
      # apps/labs/provisioner/docker_provisioner.py calls containers.run() against
      # the LOCAL daemon to provision labs (unlike app.yml, where DOCKER_HOST points
      # at the remote D4 engine and the local socket is monitoring-only). Removing
      # or restricting it breaks lab creation at provision time, not at startup.
      # The real fix is a socket proxy with an API allow-list, not a mount flag.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
      - ./scenarios:/scenarios:ro
    # Add the backend to the host docker group so admin monitoring can read the
    # mounted docker.sock even if the image ever runs as a non-root user. The
    # host's docker gid is `getent group docker | cut -d: -f3` (Debian default
    # 999); set DOCKER_GID in .env.production to override. Harmless for root.
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - fixitlab_net
      - fixitlab_labs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready/'); assert r.status==200"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped

  # ── Scale-out: uncomment backend2 + update nginx upstream block to add second server ──
  # backend2:
  #   build: ./backend
  #   container_name: fixitlab_backend2
  #   env_file:
  #     - .env.production
  #   environment:
  #     TERMINAL_MAX_WS_PER_USER: ${TERMINAL_MAX_WS_PER_USER:-20}
  #   depends_on:
  #     pgbouncer:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   volumes:
  #     - static_volume:/app/staticfiles
  #     - media_volume:/app/media
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ./scripts:/scripts
  #     - ./scenarios:/scenarios:ro
  #   networks:
  #     - fixitlab_net
  #     - fixitlab_labs
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health/'); assert r.status==200"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 8
  #     start_period: 180s
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 2G
  #   restart: unless-stopped

  celery_worker:
    build: ./backend
    # Same image as backend (shared ./backend build) — pulled/built once, reused here.
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-backend:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info --concurrency=8 -Q default,notifications -n default@%h
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Host root, same as backend above — see that comment for why `:ro` is
      # cosmetic here (measured: writes still succeed through a :ro socket).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
      - ./scenarios:/scenarios:ro
    networks:
      - fixitlab_net
      - fixitlab_labs
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q 'pong'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  celery_provisioning:
    build: ./backend
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-backend:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info --concurrency=10 -Q provisioning -n provisioning@%h
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Host root, same as backend above — see that comment for why `:ro` is
      # cosmetic here (measured: writes still succeed through a :ro socket).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
      - ./scenarios:/scenarios:ro
    networks:
      - fixitlab_net
      - fixitlab_labs
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q 'pong'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  celery_maintenance:
    build: ./backend
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-backend:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info --concurrency=2 -Q maintenance -n maintenance@%h
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Host root, same as backend above — see that comment for why `:ro` is
      # cosmetic here (measured: writes still succeed through a :ro socket).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
      - ./scenarios:/scenarios:ro
    networks:
      - fixitlab_net
      - fixitlab_labs
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q 'pong'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  celery_beat:
    build: ./backend
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-backend:${IMAGE_TAG:-latest}
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid
    env_file:
      - .env.production
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - fixitlab_net
    # Audit Z5-15. The pidfile half proves the PROCESS is alive; the heartbeat half
    # proves it is still SCHEDULING. Previously only the former was checked, so a
    # wedged-but-running beat meant no expiry cleanup, no orphan cleanup and no
    # retention sweep, with zero alerts.
    #
    # NOT the schedule-file mtime, which is the obvious alternative: measured, it
    # does not advance when the next task is an hour away, so it would report a
    # healthy beat as dead and restart-loop it.
    #
    # 200s = three missed 60s beats: quick enough to catch a wedge, loose enough
    # that one slow tick under load does not restart a healthy scheduler.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) 2>/dev/null && test -f /tmp/celerybeat-heartbeat && [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/celerybeat-heartbeat) )) -lt 200 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  pgbouncer:
    # Pinned by digest (PgBouncer 1.25.2, resolved 2026-08) — same pin as data.yml.
    image: edoburu/pgbouncer:latest@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    container_name: fixitlab_pgbouncer
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-fixitlab}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB:-fixitlab}
      # Keep pgBouncer's userlist PLAINTEXT so it can negotiate scram-sha-256 with a
      # SCRAM-only Postgres role. edoburu md5-hashes only when AUTH_TYPE=md5 (default),
      # which breaks with "cannot do SCRAM authentication: wrong password type".
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - SERVER_IDLE_TIMEOUT=600
      - CLIENT_IDLE_TIMEOUT=0
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    networks:
      - fixitlab_net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  database:
    build: ./database
    container_name: fixitlab_db
    # Postgres 15 puts parallel-query segments in /dev/shm, which Docker caps at
    # 64 MB by default. With shared_buffers raised to 2 GB (audit Z5-12) that cap
    # produces "could not resize shared memory segment" on parallel plans — a
    # failure that only shows up on the larger catalog queries the retune was
    # meant to speed up.
    shm_size: 1gb
    volumes:
      - fixitlab_db_data:/var/lib/postgresql/data
    env_file:
      - .env.production
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fixitlab_redis
    env_file:
      - .env.production
    command: >
      sh -c "redis-server
      --maxmemory 2gb
      --maxmemory-policy volatile-lru
      --requirepass $${REDIS_PASSWORD:-fixitlab_redis_secret}
      --tcp-backlog 511
      --timeout 300"
    networks:
      - fixitlab_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fixitlab_rabbitmq
    env_file:
      - .env.production
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fixitlab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-fixitlab_rabbit_secret}
    networks:
      - fixitlab_net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  fixitlab_db_data:
    name: fixitlab_db_data
  static_volume:
    name: fixitlab_static
  media_volume:
    name: fixitlab_media
  certbot_www:
  certbot_certs:
  redis_data:
    name: fixitlab_redis_data
  rabbitmq_data:
    name: fixitlab_rabbitmq_data

networks:
  fixitlab_net:
    name: fixitlab_net
    driver: bridge
  # External — created by platform-start.sh; avoids compose label conflicts
  fixitlab_labs:
    external: true
    name: fixitlab_labs
