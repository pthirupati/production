version: "3.9"

services:

  gateway:
    build: ./gateway
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - static_volume:/static
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - fixitlab_net
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
    networks:
      - fixitlab_net
      - fixitlab_labs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery_worker:
    build: ./backend
    command: celery -A config worker -l info --concurrency=8 -Q default,notifications -n default@%h
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
    networks:
      - fixitlab_net
      - fixitlab_labs
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  celery_provisioning:
    build: ./backend
    command: celery -A config worker -l info --concurrency=10 -Q provisioning -n provisioning@%h
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
    networks:
      - fixitlab_net
      - fixitlab_labs
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  celery_maintenance:
    build: ./backend
    command: celery -A config worker -l info --concurrency=2 -Q maintenance -n maintenance@%h
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
    networks:
      - fixitlab_net
      - fixitlab_labs
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  celery_beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - fixitlab_net
    restart: unless-stopped

  database:
    build: ./database
    container_name: fixitlab_db
    volumes:
      - fixitlab_db_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fixitlab_redis
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --tcp-backlog 511 --timeout 300
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fixitlab_rabbitmq
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: fixitlab_mailhog
    # No ports exposed externally — accessible only via /mailbox/ through gateway (admin-only)
    networks:
      - fixitlab_net
    restart: unless-stopped

volumes:
  fixitlab_db_data:
  static_volume:

networks:
  fixitlab_net:
    driver: bridge
  fixitlab_labs:
    driver: bridge
    name: fixitlab_labs
