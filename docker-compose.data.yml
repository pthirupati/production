# FixitLab — D3 Data droplet (four-droplet topology)
# Private droplet: PostgreSQL + pgBouncer only.
# Reuses the service definitions from docker-compose.prod.yml (database, pgbouncer).
#
# Usage on D3:
#   COMPOSE_FILE=docker-compose.data.yml ./scripts/platform-start.sh
#   docker compose -f docker-compose.data.yml --env-file .env.production up -d
#
# pgBouncer/Postgres listen on the VPC private interface so D2 (app) can reach
# them on the private network. They are NOT exposed publicly (D3 firewall blocks
# all public inbound except SSH). The published ports below bind 0.0.0.0 inside
# the droplet but the DigitalOcean cloud firewall (scripts/ci-setup-firewalls.sh)
# restricts 5432/6432 to the D2 private IP only.
#
# DATA_BIND_IP (optional): host interface for the published 5432/6432. Unset means
# 0.0.0.0 and the cloud firewall is the only control — set it to this droplet's
# private IP in .env.production to add the kernel as a second one.

services:
  database:
    build: ./database
    container_name: fixitlab_db
    # Postgres 15 puts parallel-query segments in /dev/shm, which Docker caps at
    # 64 MB by default. With shared_buffers raised to 2 GB (audit Z5-12) that cap
    # produces "could not resize shared memory segment" on parallel plans — a
    # failure that only shows up on the larger catalog queries the retune was
    # meant to speed up.
    shm_size: 1gb
    volumes:
      - fixitlab_db_data:/var/lib/postgresql/data
    env_file:
      - .env.production
    # Sized from database/postgresql.conf, NOT picked round: shared_buffers 2G
    # + shm_size 1G + maintenance_work_mem 512M + work_mem 16M × ~25 active
    # backends (~0.4G) ≈ 4G of committed allocation before any per-connection
    # overhead. 6G on the 8G droplet (s-2vcpu-8gb) leaves ~2G for the OS, which
    # is the load-bearing part: effective_cache_size is set to 6G, and that is a
    # planner hint about the page cache. Squeeze the cgroup below the working set
    # and the planner keeps choosing index scans for pages that are no longer
    # cached. A limit under ~4G would OOM-kill Postgres mid-transaction on
    # exactly the parallel-query load the shared_buffers retune targeted.
    # No CPU limit: on 2 vCPU, throttling the DB only moves the queue.
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    ports:
      # Reachable from D2 over the VPC; firewall limits source to D2 private IP.
      # DATA_BIND_IP additionally binds to this droplet's VPC address so the kernel
      # is a second control alongside the DO cloud firewall (audit O5).
      #
      # Opt-in (`:-0.0.0.0`) rather than required (`:?`) unlike app.yml, and the
      # asymmetry is forced, not a preference: the wired cluster env
      # (scripts/ci-wire-cluster-env.py) writes APP_PRIVATE_IP into .env.production
      # but NOT DATA_PRIVATE_IP, and ci-cluster-deploy.sh's deploy_data passes no IP
      # in the environment either. A `:?` here would therefore fail EVERY data-node
      # deploy today. Set DATA_BIND_IP=<D3 private IP> in .env.production — or teach
      # the wiring script to emit it — and this hardens with no further change.
      - "${DATA_BIND_IP:-0.0.0.0}:5432:5432"
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgbouncer:
    # Pinned by digest (PgBouncer 1.25.2, resolved 2026-08). `:latest` meant the
    # connection pooler in front of production Postgres could change underneath a
    # routine redeploy — and the AUTH_TYPE/SCRAM behaviour documented below is
    # exactly the kind of thing that shifts between releases. Bump deliberately.
    image: edoburu/pgbouncer:latest@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    container_name: fixitlab_pgbouncer
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-fixitlab}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB:-fixitlab}
      # Postgres stores the role as scram-sha-256 (PG default password_encryption),
      # so pgBouncer must hold the PLAINTEXT password to negotiate SCRAM with the
      # server. edoburu only md5-hashes the userlist when AUTH_TYPE=md5 (its default),
      # which yields "cannot do SCRAM authentication: wrong password type". Force
      # scram-sha-256 so the userlist stays plaintext and both hops use SCRAM.
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - SERVER_IDLE_TIMEOUT=600
      - CLIENT_IDLE_TIMEOUT=0
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    # pgBouncer is a single-threaded connection proxy — it holds per-client packet
    # buffers, not data. MAX_CLIENT_CONN=1000 above is the sizing input; even at
    # full occupancy that is tens of MB. 256M is generous and exists to bound a
    # leak, not to shape normal use.
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      # pgBouncer transaction pool — D2 backend/celery connect here over the VPC.
      # Same DATA_BIND_IP opt-in as the database port above; see that comment.
      - "${DATA_BIND_IP:-0.0.0.0}:6432:5432"
    networks:
      - fixitlab_net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fixitlab_db_data:
    name: fixitlab_db_data

networks:
  fixitlab_net:
    # External — pre-created per node by ci-bootstrap-cluster.sh so Vault can attach
    # before the app stack comes up. Marking it external avoids the compose
    # "network exists but has incorrect label" conflict on the shared bridge.
    external: true
    name: fixitlab_net
