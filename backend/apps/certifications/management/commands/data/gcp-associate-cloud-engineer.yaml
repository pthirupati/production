# Google Cloud Associate Cloud Engineer track definition.
#
# A track is a weighted, ordered VIEW over scenarios that already exist in the
# library — the `scenarios:` lists below reference existing FixitLab scenario
# slugs grouped by published exam-objective area. Objective titles are generic,
# published exam-domain concepts; all referenced scenario content is original
# FixitLab content. Weights are relative and sum to 100 for readability.
#
# Objectives are shaped around the ten topic families that actually exist under
# scenarios/gcp/ rather than published sub-domains with no live labs behind
# them: an objective with an empty exam pool still counts toward the weight
# total at grading time, so it would silently subtract its full weight from
# every achievable score (see certifications/views.py max_achievable guard).

track:
  slug: gcp-associate-cloud-engineer
  code: GCP-ACE
  name: Google Cloud Certified - Associate Cloud Engineer
  vendor: Google Cloud
  description: >
    Hands-on preparation for the Associate Cloud Engineer exam. Every objective
    maps to live break-fix labs across Compute Engine, persistent disks and
    snapshots, VPC networking and firewall rules, Cloud Storage, GKE, IAM, load
    balancing, and Cloud Monitoring.
  technology_slug: gcp
  exam_duration_minutes: 120
  passing_score: 70
  validity_months: 36
  order: 7

objectives:
  - code: gcp-ace.compute-engine
    title: Deploy and manage Compute Engine resources
    weight: 16
    order: 1
    scenarios:
      - academy-gcp-001-learn-compute-engine
      - academy-gcp-011-learn-compute-engine-2
      - academy-gcp-021-learn-compute-engine-3

  - code: gcp-ace.storage-disks
    title: Manage persistent disks and storage performance
    weight: 12
    order: 2
    scenarios:
      - academy-gcp-002-build-persistent-disks
      - academy-gcp-012-build-persistent-disks-2
      - academy-gcp-022-build-persistent-disks-3

  - code: gcp-ace.object-storage
    title: Configure and manage Cloud Storage
    weight: 12
    order: 3
    scenarios:
      - academy-gcp-007-automation-cloud-storage
      - academy-gcp-017-automation-cloud-storage-2
      - academy-gcp-027-automation-cloud-storage-3

  - code: gcp-ace.vpc-networking
    title: Configure VPC networks and routing
    weight: 14
    order: 4
    scenarios:
      - academy-gcp-003-operate-vpc
      - academy-gcp-013-operate-vpc-2
      - academy-gcp-023-operate-vpc-3

  - code: gcp-ace.firewall
    title: Secure network traffic with firewall rules
    weight: 12
    order: 5
    scenarios:
      - academy-gcp-004-troubleshoot-firewall-rules
      - academy-gcp-014-troubleshoot-firewall-rules-2
      - academy-gcp-024-troubleshoot-firewall-rules-3

  - code: gcp-ace.kubernetes-engine
    title: Deploy and manage Google Kubernetes Engine workloads
    weight: 12
    order: 6
    scenarios:
      - academy-gcp-006-security-gke
      - academy-gcp-016-security-gke-2
      - academy-gcp-026-security-gke-3

  - code: gcp-ace.iam
    title: Manage identity and access management
    weight: 10
    order: 7
    scenarios:
      - academy-gcp-005-production-iam
      - academy-gcp-015-production-iam-2
      - academy-gcp-025-production-iam-3

  - code: gcp-ace.load-balancing
    title: Configure load balancing and traffic distribution
    weight: 6
    order: 8
    scenarios:
      - academy-gcp-008-observability-load-balancing
      - academy-gcp-018-observability-load-balancing-2
      - academy-gcp-028-observability-load-balancing-3

  - code: gcp-ace.monitoring-backup
    title: Monitor resources and manage snapshots
    weight: 6
    order: 9
    scenarios:
      - academy-gcp-009-backup-monitoring
      - academy-gcp-019-backup-monitoring-2
      - academy-gcp-010-integration-snapshots
      - academy-gcp-020-integration-snapshots-2
