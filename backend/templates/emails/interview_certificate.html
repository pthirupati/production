<!DOCTYPE html>
<html>
<body style="font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; padding:24px;">
  <div style="max-width:560px;margin:0 auto;background:#1e293b;border-radius:12px;padding:24px;border:1px solid #334155;">
    <h2 style="color:#4ade80;margin-top:0;">Congratulations — all rounds cleared!</h2>
    <p>{{ holder_name }}, you completed {{ rounds }} rounds for {{ technology }}.</p>
    <p>Overall score: <strong>{{ score }}/100</strong></p>
    <p>Certificate ID: <code>{{ certificate_id }}</code></p>
    <a href="{{ verify_url }}" style="display:inline-block;margin-top:12px;padding:10px 20px;background:#6366f1;color:#fff;text-decoration:none;border-radius:8px;">Verify & share certificate</a>
  </div>
</body>
</html>
