<!DOCTYPE html>
<html>
<body style="font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; padding:24px;">
  <div style="max-width:560px;margin:0 auto;background:#1e293b;border-radius:12px;padding:24px;border:1px solid #334155;">
    <h2 style="color:#38bdf8;margin-top:0;">Round results — {{ round_title }}</h2>
    {% if passed %}
    <p style="color:#4ade80;font-weight:600;">You cleared this round. Score: {{ score }}/100</p>
    <p>Schedule your next round within 48 hours from your interview dashboard.</p>
    {% else %}
    <p style="color:#fbbf24;">This round needs more preparation. Score: {{ score }}/100</p>
    {% endif %}
    <p style="color:#94a3b8;font-size:14px;">{{ summary }}</p>
    <a href="{{ dashboard_url }}" style="display:inline-block;margin-top:12px;padding:10px 20px;background:#6366f1;color:#fff;text-decoration:none;border-radius:8px;">View full report</a>
  </div>
</body>
</html>
