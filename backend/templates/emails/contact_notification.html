<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background-color:#0a0e17;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0e17;padding:40px 20px;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="background-color:#111827;border-radius:16px;border:1px solid #1f2937;overflow:hidden;">
        <!-- Header -->
        <tr><td style="background:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%);padding:32px;text-align:center;">
          <h1 style="margin:0;color:#ffffff;font-size:24px;font-weight:700;">New Contact Message</h1>
        </td></tr>
        <!-- Body -->
        <tr><td style="padding:32px;">
          <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#1f2937;border-radius:12px;margin:0 0 24px;">
            <tr><td style="padding:20px;">
              <p style="color:#9ca3af;font-size:13px;margin:0 0 4px;">From</p>
              <p style="color:#e5e7eb;font-size:15px;font-weight:600;margin:0 0 12px;">{{ name }} &lt;{{ email }}&gt;</p>
              <p style="color:#9ca3af;font-size:13px;margin:0 0 4px;">Subject</p>
              <p style="color:#06b6d4;font-size:15px;font-weight:600;margin:0;">{{ subject }}</p>
            </td></tr>
          </table>
          <p style="color:#9ca3af;font-size:13px;margin:0 0 8px;">Message:</p>
          <div style="background-color:#1f2937;border-radius:12px;padding:20px;margin:0 0 24px;">
            <p style="color:#e5e7eb;font-size:14px;line-height:1.6;margin:0;white-space:pre-wrap;">{{ message }}</p>
          </div>
          <p style="color:#6b7280;font-size:12px;margin:0;">
            Reply directly to <a href="mailto:{{ email }}" style="color:#06b6d4;">{{ email }}</a>
          </p>
        </td></tr>
        <!-- Footer -->
        <tr><td style="padding:24px 32px;border-top:1px solid #1f2937;text-align:center;">
          <p style="color:#4b5563;font-size:12px;margin:0;">&copy; 2026 FixitLab. Contact Form Submission.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
