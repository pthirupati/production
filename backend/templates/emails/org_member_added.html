<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Team access — FixitLab</title></head>
<body style="margin:0;padding:32px;background:#0a0e1a;font-family:'Segoe UI',Roboto,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
<table width="560" style="background:#141b2d;border-radius:16px;border:1px solid #1e293b;padding:32px;">
  <tr><td>
    <h1 style="color:#fff;font-size:22px;margin:0 0 12px;">You've joined {{ org_name }}</h1>
    <p style="color:#94a3b8;font-size:15px;line-height:1.6;margin:0 0 24px;">
      {{ inviter_name }} added you to the <strong style="color:#e2e8f0;">{{ org_name }}</strong> team on FixitLab.
      Open your team dashboard to see shared technology access and progress.
    </p>
    <p style="text-align:center;">
      <a href="{{ team_url }}" style="display:inline-block;background:#06b6d4;color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-weight:700;">Open team dashboard</a>
    </p>
  </td></tr>
</table>
</td></tr></table>
</body>
</html>
