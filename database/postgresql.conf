# FixitLab production PostgreSQL tuning — D3 (data node), s-2vcpu-8gb.
#
# Audit Z5-12: every memory setting below was sized for a ~1 GB box and left
# unchanged when D3 became an 8 GB droplet. The file's own header said "25% of
# total RAM" while shared_buffers sat at 256 MB, which is 3%.
#
# `effective_cache_size` was the damaging one. It is not an allocation — it is
# what the planner *believes* the OS will have cached. At 768 MB the planner
# concluded that most index lookups would miss and fall through to disk, so it
# preferred sequential scans over index scans on tables that are in fact fully
# resident in page cache. Undersizing it does not save memory; it just makes the
# planner choose worse plans.

listen_addresses = '*'

# Left at 100 deliberately, not raised to "use up" the box. PgBouncer runs in
# transaction mode with DEFAULT_POOL_SIZE=25, so ~25 backends do the real work and
# the rest is headroom for migrations, psql, Celery and pg_dump. On 2 vCPU, more
# concurrent backends means more context switching, not more throughput — the
# usual instinct to widen the pool because "75 connections are stranded" would
# make this box slower, not faster.
max_connections = 100

# 25% of 8 GB. The standard starting point for a dedicated database node.
shared_buffers = 2GB

# ~75% of RAM: a planner hint covering shared_buffers plus the OS page cache.
# This is the setting that was actively producing bad plans at 768 MB.
effective_cache_size = 6GB

# Per sort/hash *node*, not per connection, so the true ceiling is roughly
# work_mem × concurrent sort nodes. 16 MB against ~25 active backends is a
# comfortable worst case on 8 GB and stops the catalog's ORDER BY queries
# spilling to disk, which 4 MB did routinely.
work_mem = 16MB

# VACUUM, CREATE INDEX and ALTER TABLE only; few run at once, so this can be far
# larger than work_mem. 64 MB made autovacuum on the append-only tables
# (labs_commandhistory, labs_sessionrecording — see Z5-8) needlessly slow.
maintenance_work_mem = 512MB

# NVMe-backed droplet: random reads cost close to sequential ones.
random_page_cost = 1.1
effective_io_concurrency = 200

min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB

# Raised from the default 100. The scenario/tutorial tables are large and highly
# skewed by technology, and thin statistics were part of why the planner's row
# estimates were poor on the catalog queries.
default_statistics_target = 200

# Log the queries worth looking at. Without this there is no way to tell whether
# the settings above actually helped — the point of the change is measurable plan
# improvement, not a tidier config file.
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
