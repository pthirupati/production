title: 'Bare Metal & IPMI: Raid — Build From Scratch'
slug: academy-baremetal-062-build-raid-7
technology: Bare Metal & IPMI
category: Build Lab
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: baremetal
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Build RAID from scratch in this Bare Metal & IPMI lab. You start from a minimal environment
  and must produce a working configuration that demonstrates RAID levels, rebuilds, and degraded arrays.
  Plan, implement, then prove it works.
objectives:
- A working RAID setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The physical server lab is ready but RAID is not configured yet. Required tools may already
  be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — RAID controller status and array state.

    2. Write down what looks normal versus wrong or missing for RAID.

    3. Recall the core idea: RAID levels, rebuilds, and degraded arrays. Form one hypothesis before you
    act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for RAID.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — RAID controller status and array state.

    2. Create the smallest working slice of RAID first, validate it, then add the remaining pieces one
    at a time.

    3. Verify the result — the array is healthy/rebuilt.

    4. Click Check Solution once `systemctl is-active rsyslog` returns active.'
