description: 'CONTEXT: A team operating bare metal operations needs you to resolve `RHEL Simulation: IPMI
  Power Control` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated HPE DL380 bare-metal host with IPMI tooling available on RHEL. You
  manage chassis power through the BMC; the host can be queried and cycled via ipmitool. Practice out-of-band
  power management on a simulated HPE bare-metal host using ipmitool from RHEL. The goal is to query the
  chassis power state through the BMC, perform a controlled power cycle, and confirm the server comes
  back on — the core workflow for recovering an unresponsive physical host without console access.


  OBJECTIVE: Check chassis power status with ipmitool; Perform a power cycle; Verify power is on after
  cycle. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
