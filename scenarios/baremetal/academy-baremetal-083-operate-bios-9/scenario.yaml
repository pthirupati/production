description: 'CONTEXT: A team operating bare metal operations needs you to resolve `baremetal: Bios/Uefi
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The physical server lab is healthy enough for scheduled work on BIOS/UEFI.
  Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine BIOS/UEFI
  task safely in baremetal. Follow change control — inspect, change, verify — while working with boot
  order, virtualization, and settings.


  OBJECTIVE: Day-2 BIOS/UEFI work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 BIOS/UEFI work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The physical server lab is healthy enough for scheduled work on BIOS/UEFI. Complete the
  maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the physical server lab. For BIOS/UEFI, inspect
    BIOS/UEFI settings and boot order before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with BIOS/UEFI settings and boot order.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. The system remains stable for dependent teams.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
