title: CPU Thermal Throttling
slug: sim-bm-thermal
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating bare metal operations needs you to resolve `CPU Thermal Throttling`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated bare-metal RHEL host. CPU frequency is being throttled because IPMI
  temperature sensors are high; fan readings and/or thermal thresholds indicate a cooling problem. A bare-metal
  server is throttling its CPUs due to high temperature, degrading application performance. IPMI temperature
  sensors are reading near or above their thresholds — typically from failed/spun-down fans, blocked airflow,
  or a fan policy set too low. Read the sensors, find the overheating cause, and restore proper cooling
  so the CPU stops throttling.


  OBJECTIVE: Read IPMI temperature and fan sensor values; Identify the cause of overheating (fans, airflow,
  or fan policy); Restore cooling so the CPUs stop thermal throttling. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated bare-metal RHEL host. CPU frequency is being throttled because IPMI temperature
  sensors are high; fan readings and/or thermal thresholds indicate a cooling problem.
