description: This beginner-friendly Bare Metal & IPMI lab introduces IPMI/BMC. You
  will explore out-of-band management and power control on the physical server lab.
  Read the environment first, then follow the guided steps — no prior production experience
  required.
objectives:
- Understand how IPMI/BMC work in this lab environment
- Identify the main status and configuration signals for IPMI/BMC
- Confirm you can read the current state confidently before changing anything
initial_state: The physical server lab is online with a starter IPMI/BMC setup. Some
  pieces are intentionally incomplete so you can learn how they fit together. Nothing
  is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ipmitool` sensor/power and BMC console.

    2. Write down what looks normal versus wrong or missing for IPMI/BMC.

    3. Recall the core idea: out-of-band management and power control. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for IPMI/BMC.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `ipmitool` sensor/power and BMC console.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — IPMI power and console work out-of-band.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-baremetal-041-learn-ipmi-5.conf`,
    then click Check Solution.'
