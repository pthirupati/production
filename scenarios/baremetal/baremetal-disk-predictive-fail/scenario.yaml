- Apply the documented fix in /etc/smart/policy.cfg
- Verify the configuration is corrected
hints:
- order: 1
  cost: 10
  content: SMART predictive failure unhandled
- order: 2
  cost: 15
  content: Enable SMART alerting and plan replacement.
- order: 3
  cost: 20
  content: /etc/smart/policy.cfg carries the corrected configuration.
