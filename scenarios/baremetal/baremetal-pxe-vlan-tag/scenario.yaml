description: 'CONTEXT: A team operating bare metal operations needs you to resolve `PXE Boot Fails on
  Tagged VLAN` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A server failing PXE due to a VLAN tagging issue. PXE provisioning fails because
  the NIC isn''t tagging the provisioning VLAN.


  OBJECTIVE: Confirm the issue: No DHCP/PXE on the prov VLAN; Apply the documented fix in /etc/pxe/vlan.cfg;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
