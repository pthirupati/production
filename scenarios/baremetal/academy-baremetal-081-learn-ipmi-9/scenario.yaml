description: This beginner-friendly Bare Metal & IPMI lab introduces IPMI / BMC management.
  You will explore out-of-band power, sensors, SOL console, and user accounts on the
  physical server lab. Read the environment first, then complete the guided steps
  — no prior production experience required.
objectives:
- Understand how IPMI / BMC management work in this lab environment
- Identify the main status and configuration signals for IPMI / BMC management
- Confirm you can read the current state confidently before changing anything
initial_state: The physical server lab is online with a starter IPMI / BMC management
  setup. Some pieces are intentionally incomplete so you can learn how the pieces
  fit together. Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: `ipmitool sensor`, `ipmitool sol activate`, and BMC web
    UI. Write down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — out-of-band power, sensors, SOL console, and user accounts.
    Make one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-baremetal-081-learn-ipmi-9.conf`, then click
