description: 'CONTEXT: A team operating bare metal operations needs you to resolve `BMC Clock Drift Misleads
  Logs` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A server whose BMC clock drifts (no NTP). Hardware event timestamps are wrong
  because the BMC clock isn''t synced.


  OBJECTIVE: Confirm the issue: SEL timestamps wrong; Apply the documented fix in /etc/bmc/ntp.cfg; Verify
  the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
