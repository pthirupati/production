title: RAID Array Degraded
slug: sim-bm-raid-degraded
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating bare metal operations needs you to resolve `RAID Array Degraded`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated bare-metal RHEL host. mdadm reports /dev/md0 (RAID-1) as degraded:
  one member is [F]/removed, the array is active on the remaining disk, and redundancy is lost. A software
  RAID-1 array (/dev/md0) is running in a degraded state — one of its member disks has failed and the
  array is operating on a single drive with no redundancy. Identify the failed disk, remove it, add a
  healthy replacement, and let the array rebuild back to a clean redundant state.


  OBJECTIVE: Inspect the array and identify the failed member disk; Remove the failed disk and add a healthy
  replacement; Confirm the array rebuilds and returns to a clean, redundant state. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated bare-metal RHEL host. mdadm reports /dev/md0 (RAID-1) as degraded: one member
  is [F]/removed, the array is active on the remaining disk, and redundancy is lost.'
lab_mode: simulation
simulation_type: baremetal
is_free: false
jira_priority: Medium
