description: 'CONTEXT: A team operating bare metal operations needs you to resolve `Disks Spinning Down
  Under Load` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A server whose disk power policy is too aggressive. Latency spikes occur because
  an aggressive power policy spins disks down under light load.


  OBJECTIVE: Confirm the issue: Latency spikes from spin-up; Apply the documented fix in /etc/storage/power-policy.cfg;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A server whose disk power policy is too aggressive.
objectives:
- 'Confirm the issue: Latency spikes from spin-up'
- Apply the documented fix in /etc/storage/power-policy.cfg
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
