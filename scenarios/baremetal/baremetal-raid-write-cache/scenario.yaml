description: 'CONTEXT: A team operating bare metal operations needs you to resolve `RAID Write Cache Disabled
  (BBU Failed)` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A server whose RAID write cache is off due to BBU state. Write performance
  collapsed because the controller disabled write cache after a BBU failure.


  OBJECTIVE: Confirm the issue: Write IOPS dropped sharply; Apply the documented fix in /etc/raid/cache-policy.cfg;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
