description: 'CONTEXT: A team operating bare metal operations needs you to resolve `baremetal: Nic Teaming
  — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around NIC teaming. Assume
  an auditor or pen test is next week — tighten controls with evidence. Security review: harden NIC teaming
  on this baremetal system. Close unsafe defaults, enforce least privilege, and ensure bonding/teaming
  modes and failover cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to NIC teaming are removed or constrained; Access follows least privilege
  and is auditable; Security checks pass without breaking required functionality. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to NIC teaming are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around NIC teaming. Assume an auditor
  or pen test is next week — tighten controls with evidence.
hints:
