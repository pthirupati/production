description: 'Security review: harden NIC teaming on this Bare Metal & IPMI system.
  Close unsafe defaults, enforce least privilege, and ensure LACP/static teams, failover,
  and VLAN tagging cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to NIC teaming are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around NIC teaming.
  Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Baseline current exposure: teamd/Windows teaming UI and switch config.
    Note world-readable files, open ports, or excessive roles.'
- order: 2
  cost: 15
  content: Apply least privilege incrementally. Prefer explicit allows over broad
    wildcards.
- order: 3
  cost: 20
  content: Re-test legitimate workflows after hardening. Finish with `# FIXED-OK`
    in `/opt/fixitlab/academy/academy-baremetal-006-security-nic-teaming.conf` and
    Check Solution.
