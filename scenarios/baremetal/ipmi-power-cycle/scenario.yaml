category: Bare Metal & IPMI
description: A bare-metal server has become unresponsive (hung OS, no SSH, no console response) and must
  be recovered out-of-band. Using the IPMI/BMC interface, check the current chassis power state and perform
  a controlled power cycle to bring the host back, then confirm it powers on.
difficulty: easy
dual_terminal: false
hints:
- order: 1
  cost: 10
  content: 'Check current state out-of-band: `ipmitool chassis power status` (or `ipmitool power status`).'
- order: 2
  cost: 15
  content: 'Cycle power to recover the hung host: `ipmitool chassis power cycle`. If it''s already off,
    use `ipmitool chassis power on`.'
- order: 3
  cost: 20
  content: Re-query `ipmitool chassis power status` and confirm it reports "on". Watch the SOL console
    (`ipmitool sol activate`) to verify it boots back up.
initial_state: Simulated bare-metal host reachable only via its BMC/IPMI interface. The operating system
  is hung and unreachable in-band; power must be managed through ipmitool.
is_free: false
jira_priority: Medium
lab_mode: simulation
max_score: 100
objectives:
- Query the current chassis power state via IPMI
- Perform a power cycle (or off/on) on the unresponsive host
- Confirm the server powers back on after the cycle
requires_companion_hosts: false
simulation_type: baremetal
slug: sim-baremetal-ipmi
time_limit: 900
title: IPMI Power Cycle
