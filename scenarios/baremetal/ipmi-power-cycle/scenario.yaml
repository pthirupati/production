category: Fix
description: 'CONTEXT: A team operating bare metal operations needs you to resolve `IPMI Power Cycle`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated bare-metal host reachable only via its BMC/IPMI interface. The operating
  system is hung and unreachable in-band; power must be managed through ipmitool. A bare-metal server
  has become unresponsive (hung OS, no SSH, no console response) and must be recovered out-of-band. Using
  the IPMI/BMC interface, check the current chassis power state and perform a controlled power cycle to
  bring the host back, then confirm it powers on.


  OBJECTIVE: Query the current chassis power state via IPMI; Perform a power cycle (or off/on) on the
  unresponsive host; Confirm the server powers back on after the cycle. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the physical server lab. For IPMI Power Cycle,
    inspect IPMI, RAID, BIOS, and out-of-band console before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with IPMI, RAID, BIOS, and out-of-band console.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Confirm the server powers back on after the cycle.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
