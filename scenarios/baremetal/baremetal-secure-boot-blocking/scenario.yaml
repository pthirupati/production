description: 'CONTEXT: A team operating bare metal operations needs you to resolve `Secure Boot Blocking
  Custom Driver` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A bare-metal server where Secure Boot blocks a needed unsigned kernel module.
  A required out-of-tree driver won''t load because Secure Boot rejects the unsigned module. Enroll the
  key (or adjust policy) and confirm the config is corrected.


  OBJECTIVE: Confirm Secure Boot blocks the module; Enroll the signing key / adjust policy; Verify the
  boot config is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
