category: Build
description: 'CONTEXT: A team operating bare metal operations needs you to resolve `VMware Guest Powered
  Off` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL host running libvirt/KVM. A defined guest domain is in the
  "shut off" state and needs to be started; the application it hosts is currently down. A virtual machine
  guest on a KVM/libvirt host is powered off and its service is unavailable. Using virsh, list the defined
  domains, confirm the guest is shut off, start it, and verify it transitions to the running state so
  the workload comes back online.


  OBJECTIVE: List libvirt domains and confirm the guest is shut off; Start the guest domain with virsh;
  Verify the domain transitions to the running state. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the physical server lab. For VMware Guest
    Powered Off, inspect IPMI, RAID, BIOS, and out-of-band console before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with IPMI, RAID, BIOS, and out-of-band console.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Verify the domain transitions to the running state.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
