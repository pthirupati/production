description: 'CONTEXT: A team operating bare metal operations needs you to resolve `baremetal: Smart Disk
  Health — Backup and Recovery` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for SMART disk health. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for SMART
  disk health. Ensure backups run on schedule, retention is correct, and you can restore SMART attributes
  and predictive failure within the lab RTO.


  OBJECTIVE: Backup coverage for SMART disk health is complete and restorable; Retention and encryption
  meet the stated policy; A restore drill proves data integrity. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for SMART disk health is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for SMART disk health. Leadership wants
  proof that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `smartctl -a` output.

    2. Write down what looks normal versus wrong or missing for SMART disk health.

    3. Recall the core idea: SMART attributes and predictive failure. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `smartctl -a` output.

    2. Repair or run the backup job, then perform a controlled restore into a scratch location to prove
    it works.

    3. Verify the result — SMART status is healthy or failing disks are flagged.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
