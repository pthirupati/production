title: PXE Boot Failure
slug: sim-bm-pxe-fail
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating bare metal operations needs you to resolve `PXE Boot Failure`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated bare-metal host managed via IPMI plus a provisioning server (DHCP
  + TFTP). The server fails PXE with "No bootable device"; the boot order, DHCP next-server, or pxelinux
  config is misconfigured. A bare-metal server fails to PXE boot and the console shows "No bootable device".
  The network boot chain is broken at one of its links — the server isn''t configured to boot from the
  NIC, the DHCP/next-server (TFTP) pointer is wrong, or the PXE/pxelinux config file the TFTP server hands
  out is missing. Walk the chain and restore a successful network boot.


  OBJECTIVE: Confirm the server attempts (and fails) a network boot; Verify each link in the PXE chain:
  boot order, DHCP/next-server, TFTP files; Correct the broken link so the host PXE-boots successfully.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
