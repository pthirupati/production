title: Disk SMART Failure Warning
slug: sim-bm-disk-smart
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating bare metal operations needs you to resolve `Disk SMART Failure
  Warning` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated bare-metal RHEL host. smartd has logged a SMART warning for /dev/sda;
  its reallocated/pending sector counts are rising and overall SMART health is marginal. SMART monitoring
  has flagged a disk as pre-failing on a bare-metal server. One or more critical SMART attributes (Reallocated_Sector_Ct,
  Current_Pending_Sector, or Offline_Uncorrectable) have crossed their threshold, signaling imminent drive
  failure. Confirm the failure with a self-test, identify the failing attribute, and prepare the disk
  for replacement.


  OBJECTIVE: Read the disk''s SMART attributes and overall health assessment; Run a self-test and identify
  the specific failing attribute(s); Confirm the disk is pre-failing and outline the replacement steps.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated bare-metal RHEL host. smartd has logged a SMART warning for /dev/sda; its reallocated/pending
  sector counts are rising and overall SMART health is marginal.
lab_mode: simulation
simulation_type: baremetal
is_free: false
jira_priority: Medium
max_score: 100
