title: Disk SMART Failure Warning
slug: sim-bm-disk-smart
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating bare metal operations has raised a ticket for `Disk SMART Failure
  Warning`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab. The architecture is a single
  lab-primary node exposing IPMI, RAID, BIOS, and out-of-band console; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: bare-metal RHEL host. smartd has logged a SMART warning for /dev/sda; its
  reallocated/pending sector counts are rising and overall SMART health is marginal.


  OBJECTIVE: Read the disk''s SMART attributes and overall health assessment; Run a self-test and identify
  the specific failing attribute(s); Confirm the disk is pre-failing and outline the replacement steps.
  Acceptance criteria: the change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant IPMI, RAID, BIOS, and out-of-band console), changing one thing at a time. Check your
  work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: bare-metal RHEL host. smartd has logged a SMART warning for /dev/sda; its reallocated/pending
  sector counts are rising and overall SMART health is marginal.
lab_mode: simulation
simulation_type: baremetal
