description: 'CONTEXT: A team operating bare metal operations needs you to resolve `MAAS PXE VLAN Boot
  Failure` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: PXE discovery fails — wrong VLAN tag on the provisioning fabric. New machines
  cannot PXE boot because the provisioning VLAN tag is wrong. Use the Bare Metal console to fix PXE VLAN
  settings and verify discovery.


  OBJECTIVE: Open Bare Metal console from the lab toolbar; Fix PXE VLAN configuration in the IPMI/MAAS
  view; Verify machines can enter commissioning. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
