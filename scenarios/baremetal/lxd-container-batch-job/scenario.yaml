description: 'CONTEXT: A team operating bare metal operations needs you to resolve `Start Stopped LXD
  Inference Container` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: LXD container batch-job is Stopped with no IPv4 assigned. The batch-job LXD
  container is stopped and blocking the inference pipeline. Start it and verify it receives an IP address.


  OBJECTIVE: Open the Bare Metal console; Navigate to the LXD tab; Start the batch-job container. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Open the Bare Metal console
- Navigate to the LXD tab
- Start the batch-job container
initial_state: LXD container batch-job is Stopped with no IPv4 assigned.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
