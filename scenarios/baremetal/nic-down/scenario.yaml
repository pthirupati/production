title: NIC Not Coming Up
slug: sim-bm-nic-down
category: Build
difficulty: easy
description: 'CONTEXT: A team operating bare metal operations needs you to resolve `NIC Not Coming Up`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated bare-metal RHEL host. eth0 is DOWN after a reboot and has no IP/connectivity;
  the interface needs to be brought up and its configuration made persistent. After a reboot, a bare-metal
  server''s primary network interface (eth0) is administratively DOWN and the host has no network connectivity.
  Bring the interface up to restore connectivity, then make the change persistent so it survives the next
  reboot.


  OBJECTIVE: Confirm eth0 is DOWN and has no connectivity; Bring the interface up and restore its IP;
  Make the configuration persistent across reboots. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated bare-metal RHEL host. eth0 is DOWN after a reboot and has no IP/connectivity;
  the interface needs to be brought up and its configuration made persistent.
lab_mode: simulation
simulation_type: baremetal
is_free: false
jira_priority: Medium
max_score: 100
