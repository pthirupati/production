description: 'CONTEXT: A team operating bare metal operations needs you to resolve `NUMA Disabled Hurting
  Memory Bandwidth` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A bare-metal dual-socket server with memory node interleaving on, masking
  NUMA topology. A dual-socket server has Node Interleaving on (NUMA disabled), hurting memory bandwidth
  for NUMA-aware apps. Disable interleaving and confirm the config is corrected.


  OBJECTIVE: Confirm NUMA is effectively disabled; Disable node interleaving; Verify the BIOS config is
  corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
