description: 'CONTEXT: A team operating bare metal operations has raised a ticket for `Bios/Uefi — Operate
  Lab`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline physical server lab. The architecture is a single
  lab-primary node exposing IPMI, RAID, BIOS, and out-of-band console; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: The physical server lab is healthy enough for scheduled work on BIOS/UEFI.
  Complete the maintenance task without unnecessary downtime.

  OBJECTIVE: Day-2 BIOS/UEFI work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Acceptance criteria: the change is minimal and
  reversible, and success means `check.sh` exits successfully.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant IPMI, RAID, BIOS, and out-of-band console), changing one thing at a time. Check your
  work continuously against the objective — success means `check.sh` exits successfully.

  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 BIOS/UEFI work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The physical server lab is healthy enough for scheduled work on BIOS/UEFI. Complete the
  maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: the host boots wrong or features are off. This
    lab is about BIOS/UEFI — boot order, virtualization, and settings. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For BIOS/UEFI problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    1. Inspect the current state with BIOS/UEFI settings and boot order.

    2. Each command above tells you something specific — status/health, recent errors, and the effective
    configuration. Read them in that order.

    3. Compare what you see to the objectives; the gap points at the fault.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of BIOS/UEFI is at fault.

    2. Re-run the most relevant of BIOS/UEFI settings and boot order focused on just that part to confirm
    it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''the host boots
    wrong or features are off'' toward ''BIOS settings match the build standard''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the smallest reversible change your hypothesis points to. Execute the maintenance in small,
    reversible steps, taking a snapshot or backup first if the change is risky.

    2. Re-run `bash check.sh` and confirm BIOS settings match the build standard.

    3. If it still fails, the hypothesis was wrong — go back to the evidence, do not stack changes.

    WHY: the grader validates real system state, not marker files — a fix only counts when the subsystem
    is actually healthy.'
