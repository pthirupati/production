description: 'CONTEXT: A team operating bare metal operations needs you to resolve `Start Shut-Off KVM
  Training VM` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: KVM VM train-vm-2 is shut off. The train-vm-2 KVM guest is shut off after
  maintenance. Power it on and confirm it is reachable on the libvirt network.


  OBJECTIVE: Open Bare Metal console → KVM tab; Start train-vm-2; Verify the VM state is running with
  an IP. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
