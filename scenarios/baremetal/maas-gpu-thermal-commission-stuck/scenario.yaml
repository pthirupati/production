description: 'CONTEXT: A team operating bare metal operations needs you to resolve `GPU Node Thermal Alert
  — Commission Stuck` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Thermal alert active; MAAS commission stuck on gpu-node-02. A GPU training
  node hit a thermal threshold during MAAS commissioning. Clear the thermal alert, reset stuck commissioning,
  and deploy the node.


  OBJECTIVE: Clear thermal alert in Bare Metal console; Reset stuck commissioning state; Deploy the GPU
  node successfully. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Clear thermal alert in Bare Metal console
- Reset stuck commissioning state
- Deploy the GPU node successfully
initial_state: Thermal alert active; MAAS commission stuck on gpu-node-02.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `nvidia-smi` and `dmesg | grep -i nvidia` for driver visibility.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check if the GPU appears in `lspci | grep -i nvidia`.

    2. Verify the correct driver module is loaded (`lsmod | grep nvidia`).

    3. Look for Xid errors or fallen-off-bus messages in dmesg.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Reload driver, rebind PCI, or fix persistence mode per the scenario.

    2. Re-run `nvidia-smi`.

    3. Confirm GPU name and memory report without errors.


    WHY: workloads need the driver to see the device.'
