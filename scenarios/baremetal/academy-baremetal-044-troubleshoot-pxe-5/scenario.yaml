description: 'CONTEXT: A team operating bare metal operations needs you to resolve `baremetal: Pxe Boot
  — Troubleshooting Drill` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The physical server lab is degraded. The host fails to network boot. Recent
  changes may exist around PXE boot, but do not restart blindly — gather evidence first. Production alert:
  the host fails to network boot. You are on call for baremetal and must troubleshoot PXE boot methodically
  — triage symptoms, isolate root cause, apply the smallest safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: the host fails to network boot; Root cause is isolated with
  evidence, not guesswork; Service behavior returns to normal after the fix. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: the host fails to network boot'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The physical server lab is degraded. The host fails to network boot. Recent changes may
  exist around PXE boot, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the physical server lab. For PXE boot, inspect
    PXE/DHCP/TFTP config and boot logs before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with PXE/DHCP/TFTP config and boot logs.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Service behavior returns to normal after the fix.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
