technology: Bare Metal & IPMI
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: baremetal
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: the host fails to network boot. You are on call for Bare Metal & IPMI
  and must troubleshoot PXE boot methodically — triage symptoms, isolate root cause, apply the smallest
  safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: the host fails to network boot'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The physical server lab is degraded. The host fails to network boot. Recent changes may
  exist around PXE boot, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — PXE/DHCP/TFTP config and boot logs.

    2. Write down what looks normal versus wrong or missing for PXE boot.

    3. Recall the core idea: network boot, DHCP, and TFTP. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for PXE boot.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — PXE/DHCP/TFTP config and boot logs.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — PXE delivers the boot image.

    4. Click Check Solution once `systemctl is-active rsyslog` returns active.'
