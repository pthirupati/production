description: 'CONTEXT: A team operating bare metal operations needs you to resolve `baremetal: Ipmi/Bmc
  — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline physical server lab with IPMI, RAID, BIOS, and out-of-band
  console. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The physical server lab is online with a starter IPMI/BMC setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
  This beginner-friendly baremetal lab introduces IPMI/BMC. You will explore out-of-band management and
  power control on the physical server lab. Read the environment first, then follow the guided steps —
  no prior production experience required.


  OBJECTIVE: Understand how IPMI/BMC work in this lab environment; Identify the main status and configuration
  signals for IPMI/BMC; Confirm you can read the current state confidently before changing anything. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how IPMI/BMC work in this lab environment
- Identify the main status and configuration signals for IPMI/BMC
- Confirm you can read the current state confidently before changing anything
initial_state: The physical server lab is online with a starter IPMI/BMC setup. Some pieces are intentionally
  incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ipmitool` sensor/power and BMC console.

    2. Write down what looks normal versus wrong or missing for IPMI/BMC.

    3. Recall the core idea: out-of-band management and power control. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify the main status and configuration signals for IPMI/BMC

    2. Confirm you can read the current state confidently before changing anything'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `ipmitool` sensor/power and BMC console.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — IPMI power and console work out-of-band.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
