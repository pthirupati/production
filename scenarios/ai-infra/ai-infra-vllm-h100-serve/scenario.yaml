description: 'CONTEXT: AI Infra Engineering brings up inference infra — not the application ML
  course. After MAAS deploy of an ImageDev H100 image, start vLLM with tensor parallel across
  the node GPUs and verify OpenAI-compatible serving on :8000.


  ENVIRONMENT: Lab Terminal on a Deployed H100 node + Bare Metal. Optional Datacenter twin for rack.


  SYMPTOM: Node Deployed with healthy nvidia-smi; vLLM not serving; no /v1 endpoint.


  OBJECTIVE: Confirm GPUs; start `vllm serve` with tensor parallel; verify READY on :8000;
  optional bench; FIXED-OK.'
objectives:
- Confirm H100 GPUs via nvidia-smi
- Start vLLM serve with tensor parallelism
- Verify OpenAI API ready on port 8000
