description: 'CONTEXT: ImageDev — Packer GPU images must finish first boot via cloud-init
  (DataSourceMAAS): netplan, users, nvidia-persistenced, and a post-boot gpu-sanity hook.
  AI Infra Engineering owns this image-factory path (not the application GPU course).


  ENVIRONMENT: Lab Terminal + Packer + Bare Metal. Inspect cloud-init status after deploy.


  SYMPTOM: Deployed node never reaches sshd; cloud-init stuck or missing runcmd for GPU.


  OBJECTIVE: Verify cloud-init status / datasource MAAS; ensure GPU userdata runcmd runs;
  confirm nvidia-smi after final; FIXED-OK.'
objectives:
- Confirm cloud-init DataSourceMAAS and status done
- Validate GPU first-boot runcmd (persistenced / sanity)
- Verify nvidia-smi after cloud-init final
initial_state: Custom GPU image deployed; cloud-init userdata incomplete or failing.
hints:
- order: 1
  cost: 0
  content: On Lab Terminal run cloud-init status and cloud-id — expect DataSourceMAAS and status done.
- order: 2
  cost: 20
  content: Inspect cloud-init output for runcmd enabling nvidia-persistenced and gpu-sanity hooks.
- order: 3
  cost: 45
  content: After cloud-init final, run nvidia-smi -L and leave FIXED-OK when GPUs enumerate.
