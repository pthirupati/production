hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the relevant CLI and configuration for lxd.

    2. Write down what looks normal versus wrong or missing for Lxd.

    3. Review the architecture diagram and objectives. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Lxd.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — the relevant CLI and configuration for lxd.

    2. Create the smallest working slice of Lxd first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — Lxd behaves correctly under normal and failure checks.

    4. Click Check Solution once the objective is met (graded on real state, not a
    marker file).'
