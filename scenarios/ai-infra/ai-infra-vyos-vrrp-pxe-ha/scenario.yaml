description: 'CONTEXT: Networking / Bare Metal ticket — the PXE helper pair should run VRRP so
  either VyOS router can own the virtual IP that serves DHCP/PXE for MAAS enlist. The backup
  router never took over during the last primary reboot, leaving a single point of failure for
  fleet bring-up. AI Infra Engineering owns the VyOS underlay that MAAS PXE depends on.

  ENVIRONMENT: Lab Terminal VyOS CLI (configure/commit/compare/rollback, show vrrp) on both
  routers + Bare Metal for enlist verification.

  SYMPTOM / STARTING STATE: VRRP group for the PXE helper VLAN is misconfigured or absent on
  one peer; only one router answers the virtual IP, with no automatic failover.

  OBJECTIVE: Configure a matching VRRP group on both PXE helper routers; commit; verify one is
  MASTER and the other BACKUP with show vrrp; fail the primary over and confirm the backup
  takes the virtual IP; verify MAAS can still Enlist through the VIP; leave FIXED-OK.'
objectives:
- Configure a matching VRRP group on both PXE helper routers
- Commit and verify MASTER/BACKUP roles with show vrrp
- Fail over and confirm MAAS enlist still works through the VIP
initial_state: VRRP group missing or mismatched between the PXE helper router pair.
hints:
- order: 1
  cost: 0
  content: On each PXE helper router run show vrrp — note which peer, if any, currently owns the virtual IP.
- order: 2
  cost: 20
  content: In configure mode set a matching vrrp group (same vrid, virtual-address) on both peers, then compare before commit.
- order: 3
  cost: 40
  content: commit on both routers; show vrrp should now report one MASTER and one BACKUP for the group.
- order: 4
  cost: 60
  content: Power-cycle or disable the MASTER, confirm BACKUP takes the VIP, and MAAS can still Enlist, then FIXED-OK.
