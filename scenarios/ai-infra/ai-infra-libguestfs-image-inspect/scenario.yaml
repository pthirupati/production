description: 'CONTEXT: ImageDev — before publishing to MAAS, inspect the Packer-built GPU
  qcow2 with libguestfs (guestfish / virt-inspect / virt-customize). Catch missing NVIDIA
  modules or wrong kernel before fleet deploy.


  ENVIRONMENT: Lab Terminal with Packer + libguestfs tools. Bare Metal Images for publish.


  SYMPTOM: Artifact built; not yet published. Must inspect and virt-customize a marker,
  then publish custom/h100-jammy.


  OBJECTIVE: Run virt-inspect/guestfish on the artifact; virt-customize as needed; Publish
  to MAAS; FIXED-OK.'
objectives:
- Inspect Packer GPU image with libguestfs
- Customize/fix if inspect finds gaps
- Publish boot resource to MAAS
initial_state: Packer output present; MAAS missing custom image until inspect passes.
hints:
- order: 1
  cost: 0
  content: After packer build finishes, locate the qcow2 under output-gpu-h100/ and run virt-inspect -a on that artifact before publishing.
- order: 2
  cost: 20
  content: Use guestfish or virt-customize to verify /usr/bin/nvidia-smi exists inside the image; fix gaps before MAAS publish.
- order: 3
  cost: 45
  content: Publish the inspected image to MAAS Images as custom/h100-jammy, confirm it lists under Boot resources, then mark FIXED-OK.
