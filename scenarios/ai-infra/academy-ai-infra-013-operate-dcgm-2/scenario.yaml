hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: GPU health issues go undetected. This lab is
    about DCGM — GPU health and telemetry. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For DCGM problems the reliable method is: (1) reproduce/observe the
    failure, (2) narrow from the whole system down to the one component that owns the symptom, (3) change
    exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking a snapshot
    or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `nvidia-smi` and `dmesg | grep -i nvidia` for driver visibility.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Check if the GPU appears in `lspci | grep -i nvidia`.

    2. Verify the correct driver module is loaded (`lsmod | grep nvidia`).

    3. Look for Xid errors or fallen-off-bus messages in dmesg.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Reload driver, rebind PCI, or fix persistence mode per the scenario.

    2. Re-run `nvidia-smi`.

    3. Confirm GPU name and memory report without errors.


    WHY: workloads need the driver to see the device.'
