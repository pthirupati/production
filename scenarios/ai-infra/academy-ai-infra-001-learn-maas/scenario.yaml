description: 'CONTEXT: Bare Metal / AI Infra — before any GPU node can run a workload, MAAS has to commission
  it: boot it over the network, probe its hardware, and record what it found. This lab walks through that
  first commission end to end on a single New node.

  ENVIRONMENT: Bare Metal (MAAS) + Lab Terminal + Datacenter twin (rack view mirrors power/link state as
  the node boots).

  SYMPTOM / STARTING STATE: gpu-node-01 has just been added to MAAS and shows status New; it has never
  been commissioned, so MAAS has no hardware inventory — CPU, RAM, disks, NICs, GPUs — for it yet.

  OBJECTIVE: Open Bare Metal → Machines; select gpu-node-01; Commission it and watch the PXE/hardware-discovery
  steps run; once status reaches Ready, open the machine detail page and confirm the discovered CPU/RAM/disk/NIC
  inventory is populated; FIXED-OK.'
objectives:
- Open Bare Metal → Machines and select the New node
- Commission the node and watch it progress to Ready
- Confirm the discovered hardware inventory is populated
initial_state: gpu-node-01 is New in MAAS; it has never been commissioned and has no hardware inventory yet.
hints:
- order: 1
  cost: 0
  content: Open Bare Metal → Machines. Find gpu-node-01 with status New — that means MAAS has not commissioned it yet.
- order: 2
  cost: 15
  content: Select gpu-node-01 and choose Commission from the take action menu; watch status move New → Commissioning → Ready.
- order: 3
  cost: 30
  content: Once Ready, open the machine detail page and confirm CPU, RAM, disks, and NICs were discovered, then FIXED-OK.
