description: 'CONTEXT: A team operating AI infrastructure engineering has raised a ticket for `AI Infrastructure
  Engineering: Lxd — Build From Scratch`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline GPU bare-metal lab (MAAS + node + Datacenter twin
  + AWX). The architecture is a single lab-primary node exposing MAAS commissioning, LXD, PXE/BMC, nvidia-smi/DCGM/rocm-smi,
  AWX jobs, and Datacenter twin; treat it as the production host for this incident. All tools run locally
  — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: The lab environment is ready but Lxd is not configured yet. Required tools
  may already be installed; your job is to create the configuration and bring the capability online. Build
  Lxd from scratch in this AI Infrastructure Engineering lab. You start from a minimal environment and
  must produce a working configuration that demonstrates how lxd fits into ai infra. Plan, implement,
  then prove it works.

  OBJECTIVE: A working Lxd setup must exist by the end of this lab; Configuration should follow team conventions
  and be easy to audit; The result should pass validation without manual cleanup. Acceptance criteria:
  the change is minimal and reversible, and success means `check.sh` exits successfully.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant MAAS commissioning, LXD, PXE/BMC, nvidia-smi/DCGM/rocm-smi, AWX jobs, and Datacenter
  twin), changing one thing at a time. Check your work continuously against the objective — success means
  `check.sh` exits successfully.

  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
