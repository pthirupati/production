description: 'CONTEXT: A team operating AI infrastructure engineering has raised a ticket for `Nvidia-Smi
  Monitoring — Troubleshoot`. A customer-facing workflow is degraded and the on-call engineer (you) must
  diagnose and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU bare-metal lab (MAAS + node + Datacenter twin
  + AWX). The architecture is a single lab-primary node exposing MAAS commissioning, LXD, PXE/BMC, nvidia-smi/DCGM/rocm-smi,
  AWX jobs, and Datacenter twin; treat it as the production host for this incident. All tools run locally
  — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The lab environment is degraded. Gpu usage or memory is unexpected. Recent
  changes may exist around nvidia-smi monitoring, but do not restart blindly — gather evidence first.
  Production alert: GPU usage or memory is unexpected. You are on call for AI Infrastructure Engineering
  and must troubleshoot nvidia-smi monitoring methodically — triage symptoms, isolate root cause, apply
  the smallest safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: GPU usage or memory is unexpected; Root cause is isolated
  with evidence, not guesswork; Service behavior returns to normal after the fix. Acceptance criteria:
  the change is minimal and reversible, and success means `nvidia-smi` includes `NVIDIA-SMI`.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant MAAS commissioning, LXD, PXE/BMC, nvidia-smi/DCGM/rocm-smi, AWX jobs, and Datacenter
  twin), changing one thing at a time. Check your work continuously against the objective — success means
  `nvidia-smi` includes `NVIDIA-SMI`.


  VERIFY: Re-run the same check the grader uses and confirm `nvidia-smi` includes `NVIDIA-SMI`. Capture
  the before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
