description: 'CONTEXT: Bare Metal / AI Infra — gpu-node-01 has already been commissioned and is Ready;
  the next step in the MAAS lifecycle is Deploy, which installs an OS image via PXE, Curtin, and cloud-init.


  ENVIRONMENT: Bare Metal (MAAS) + Lab Terminal + Datacenter twin.


  SYMPTOM / STARTING STATE: gpu-node-01 is Ready in MAAS but has no OS installed; nothing has been deployed
  yet.


  OBJECTIVE: Open Bare Metal → Machines; select the Ready node; Deploy the default Ubuntu image; watch
  the PXE → Curtin → cloud-init progress; confirm status reaches Deployed and the node responds on Lab
  Terminal; FIXED-OK.'
objectives:
- Select the Ready node in Bare Metal
- Deploy the default Ubuntu image
- Confirm the node reaches Deployed and responds
initial_state: gpu-node-01 is Ready in MAAS; no OS has been deployed yet.
hints:
- order: 1
  cost: 0
  content: Open Bare Metal → Machines. gpu-node-01 should show status Ready — commissioning already completed.
- order: 2
  cost: 15
  content: Select the node and choose Deploy; pick the default Ubuntu image and confirm PXE/Curtin/cloud-init progress.
- order: 3
  cost: 30
  content: Once status reaches Deployed, confirm the node responds on Lab Terminal, then mark FIXED-OK.
