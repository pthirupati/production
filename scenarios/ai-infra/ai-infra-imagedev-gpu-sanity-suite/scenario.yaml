- order: 1
  cost: 0
  content: On Lab Terminal run gpu-sanity (or deviceQuery then bandwidthTest) against the baked GPU image.
- order: 2
  cost: 20
  content: Run dcgmi diag -r 1 and nvidia-smi -L; confirm Pass for all GPUs before publishing.
- order: 3
  cost: 45
  content: When Result shows ALL PASS, publish to MAAS if needed and leave FIXED-OK.
