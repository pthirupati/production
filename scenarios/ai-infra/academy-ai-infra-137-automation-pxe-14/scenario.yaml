technology: AI Infrastructure Engineering
category: Automation
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: baremetal
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Automation lab: remove toil around PXE boot. Codify repeatable steps
  for network boot, DHCP, and TFTP and prove the automation is idempotent.'
objectives:
- Day-2 PXE boot work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for PXE boot. Automate the boring
  parts without hiding important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — PXE/DHCP/TFTP config and boot logs.

    2. Write down what looks normal versus wrong or missing for PXE boot.

    3. Review the architecture diagram and objectives. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for PXE boot.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — PXE/DHCP/TFTP config and boot logs.

    2. Implement the automation with dry-run / check mode, then run it twice — the
    second run must report no changes.

    3. Verify the result — PXE delivers the boot image.

    4. Click Check Solution once the objective is met (graded on real state, not a
    marker file).'
