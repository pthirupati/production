description: 'CONTEXT: AI Infra Engineering owns LXD on MAAS GPU fleets — cluster members, projects,
  storage pools, and gpu-passthrough profiles for inference containers.


  ENVIRONMENT: Lab Terminal (lxc/lxd) + Bare Metal. Datacenter twin for rack context.


  SYMPTOM: Single-node LXD only; gpu-passthrough profile incomplete; no cluster storage pool.


  OBJECTIVE: Inspect cluster/members; ensure gpu-passthrough profile; launch container with GPU
  profile; FIXED-OK.'
objectives:
- Inspect LXD cluster / members
- Ensure gpu-passthrough profile with physical GPU
- Launch a container using the GPU profile
initial_state: LXD up; cluster/profile incomplete for GPU workloads.
hints:
- order: 1
  cost: 0
  content: Run lxc list and lxc profile show gpu-passthrough to inspect current GPU device mapping.
- order: 2
  cost: 20
  content: Confirm nvidia.runtime true and devices.gpu0 type=gpu gputype=physical on the profile.
- order: 3
  cost: 45
  content: lxc launch with -p gpu-passthrough; confirm RUNNING; leave FIXED-OK.
