description: 'CONTEXT: AI Infra Engineering — after MAAS deploy of an ImageDev H100 image, stand up
  Kubernetes with the NVIDIA GPU Operator / device plugin so nvidia.com/gpu is schedulable.
  This is infrastructure bring-up (not the application GPU course).


  ENVIRONMENT: Lab Terminal (kubectl + nvidia-smi) + Bare Metal + optional Packer. Cross-tech
  consoles for MAAS and Datacenter available from the lab strip.


  SYMPTOM: Cluster up but nodes do not advertise nvidia.com/gpu; GPU pods Pending.


  OBJECTIVE: Confirm GPUs via nvidia-smi; fix/apply GPU Operator or device-plugin DaemonSet;
  verify allocatable nvidia.com/gpu; FIXED-OK.'
objectives:
- Confirm H100 GPUs on the Deployed node
- Install or repair NVIDIA GPU Operator / device plugin
- Verify nvidia.com/gpu is allocatable on the node
initial_state: MAAS-deployed H100 node; K8s present; device plugin misconfigured.
hints:
- order: 1
  cost: 0
  content: Run nvidia-smi -L then kubectl get nodes -o custom-columns=NAME:.metadata.name,GPU:.status.allocatable.nvidia\.com/gpu
- order: 2
  cost: 20
  content: Apply or repair the NVIDIA device-plugin DaemonSet / GPU Operator so the plugin mounts correctly.
- order: 3
  cost: 45
  content: Confirm allocatable nvidia.com/gpu is non-zero and a smoke pod can schedule, then FIXED-OK.
