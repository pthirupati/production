description: 'CONTEXT: ImageDev (PSINFRA/ImageDev) needs a RHEL-based GPU base image for
  AI Infra fleets. Upstream RHEL cloud QCOW is the source; Packer builds the artifact,
  libguestfs may inspect it, then publish into MAAS as custom/rhel-gpu so Bare Metal can
  Deploy Ready nodes.


  ENVIRONMENT: AI Infrastructure Engineering lab — Packer workspace IDE, MAAS Images pane,
  Lab Terminal. No external cloud. Treat Packer→MAAS as the production image factory path.


  SYMPTOM / STARTING STATE: custom/rhel-gpu is missing from MAAS boot-resources. Ready nodes
  still deploy stock Ubuntu. ImageDev ticket blocks RHEL GPU bring-up.


  OBJECTIVE: Open Packer; validate and build the RHEL GPU template; Publish to MAAS;
  confirm Images lists custom/rhel-gpu; Deploy a Ready machine selecting that boot resource;
  leave FIXED-OK.


  VERIFY: MAAS Images shows custom/rhel-gpu; Deployed machine os references custom/rhel-gpu.'
objectives:
- Build Packer RHEL GPU image
- Publish boot resource custom/rhel-gpu to MAAS
- Deploy a Ready node using the custom image
initial_state: Packer RHEL template present; MAAS missing custom/rhel-gpu.
hints:
- order: 1
  cost: 0
  content: Open Packer from the lab strip. Review the RHEL .pkr.hcl template, run validate, then build.
- order: 2
  cost: 15
  content: After a successful build, Publish to MAAS (or maas boot-resources) so Images lists custom/rhel-gpu.
- order: 3
  cost: 35
  content: In Bare Metal → Machines, pick Image custom/rhel-gpu and Deploy a Ready node carefully.
- order: 4
  cost: 55
  content: Confirm the Deployed OS string includes custom/rhel-gpu, then mark FIXED-OK on the lab.
