description: 'CONTEXT: Bare Metal / AI Infra — before commissioning more nodes at scale, the team wants
  to sanity-check the two settings that most often break PXE at volume: DHCP on the PXE VLAN and the global
  NTP/commissioning-distro Settings.


  ENVIRONMENT: Bare Metal (MAAS) + Lab Terminal + Datacenter twin.


  SYMPTOM / STARTING STATE: The PXE VLAN and global Settings have not been reviewed since initial setup;
  DHCP state and the NTP/commissioning distro values need to be confirmed before onboarding new nodes.


  OBJECTIVE: Open Bare Metal → Subnets/VLANs and confirm DHCP is enabled on the PXE VLAN; open Settings
  and confirm the NTP servers are reachable and the commissioning distro series matches the imported image;
  FIXED-OK.'
objectives:
- Confirm DHCP is enabled on the PXE VLAN
- Confirm NTP servers are correctly configured in Settings
- Confirm the commissioning distro series matches imported images
initial_state: The PXE VLAN DHCP state and global Settings (NTP, commissioning distro) have not yet been reviewed.
hints:
- order: 1
  cost: 0
  content: Open Bare Metal → Subnets/VLANs. Locate the PXE-tagged VLAN and check whether DHCP is enabled.
- order: 2
  cost: 15
  content: Open Bare Metal → Settings and review the NTP servers and the Commissioning default distro series.
- order: 3
  cost: 30
  content: Confirm both values are correct for this lab environment, then mark FIXED-OK.
