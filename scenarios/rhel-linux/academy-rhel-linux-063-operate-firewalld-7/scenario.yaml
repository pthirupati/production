    3. Recall the core idea: zones, services, ports, and rich rules. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for firewalld.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `firewall-cmd --list-all` and `--get-active-zones`.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup
    first if the change is risky.

    3. Verify the result — only intended ports are permitted and rules persist after
    reload.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-rhel-linux-063-operate-firewalld-7.conf`,
