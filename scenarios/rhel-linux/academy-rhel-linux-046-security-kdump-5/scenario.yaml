description: 'Security review: harden kernel crash dumps on this RHEL Linux system.
  Close unsafe defaults, enforce least privilege, and ensure crashkernel reservation,
  vmcore, and analysis cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to kernel crash dumps are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around kernel crash
  dumps. Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Baseline current exposure: `kdumpctl status`, `/var/crash`, and `crash`.
    Note world-readable files, open ports, or excessive roles.'
- order: 2
  cost: 15
  content: Apply least privilege incrementally. Prefer explicit allows over broad
    wildcards.
- order: 3
  cost: 20
  content: Re-test legitimate workflows after hardening. Finish with `# FIXED-OK`
    in `/opt/fixitlab/academy/academy-rhel-linux-046-security-kdump-5.conf` and Check
    Solution.
