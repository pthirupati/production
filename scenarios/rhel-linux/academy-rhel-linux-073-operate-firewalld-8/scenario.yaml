description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `rhel-linux: Firewalld
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The RHEL practice host is healthy enough for scheduled work on firewalld.
  Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine firewalld
  task safely in rhel-linux. Follow change control — inspect, change, verify — while working with zones,
  services, ports, and rich rules.


  OBJECTIVE: Day-2 firewalld work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `firewall-cmd --list-ports` includes
  `80/tcp`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 firewalld work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The RHEL practice host is healthy enough for scheduled work on firewalld. Complete the
  maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `firewall-cmd --list-all` and `--get-active-zones`.

    2. Write down what looks normal versus wrong or missing for firewalld.

    3. Recall the core idea: zones, services, ports, and rich rules. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `firewall-cmd --list-all` and `--get-active-zones`.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — only intended ports are permitted and rules persist after reload.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
