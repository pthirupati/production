description: Service operations lab. The `auditd` systemd unit is **failed/inactive** on this host — a
  realistic fault for Automation Practice workflows that depend on it. Diagnose with `systemctl status
  auditd` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active auditd`.
objectives:
- The `auditd` service is active (running)
- '`systemctl is-active auditd` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `auditd` service is not running (`systemctl is-active auditd` → inactive/failed). Dependent
  Automation Practice tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `auditctl -l` and `ausearch`/`aureport`.

    2. Write down what looks normal versus wrong or missing for auditd.

    3. Recall the core idea: audit rules, watches, and the audit log. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for auditd.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `auditctl -l` and `ausearch`/`aureport`.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — audit rules capture the required events and persist.

    4. Click Check Solution once `systemctl is-active auditd` returns active.'
