description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `rhel-linux: Dnf
  Modules — Build From Scratch` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The RHEL practice host is ready but dnf modules is not configured yet. Required
  tools may already be installed; your job is to create the configuration and bring the capability online.
  Build dnf modules from scratch in this rhel-linux lab. You start from a minimal environment and must
  produce a working configuration that demonstrates module streams, profiles, and default versions. Plan,
  implement, then prove it works.


  OBJECTIVE: A working dnf modules setup must exist by the end of this lab; Configuration should follow
  team conventions and be easy to audit; The result should pass validation without manual cleanup. Success
  means `systemctl is-active rsyslog` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working dnf modules setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The RHEL practice host is ready but dnf modules is not configured yet. Required tools may
  already be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `dnf module list` and `dnf module info`.

    2. Write down what looks normal versus wrong or missing for dnf modules.

    3. Recall the core idea: module streams, profiles, and default versions. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status rsyslog` — note Active/Failed and the last log lines.

    2. Read `journalctl -u rsyslog -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `dnf module list` and `dnf module info`.

    2. Create the smallest working slice of dnf modules first, validate it, then add the remaining pieces
    one at a time.

    3. Verify the result — the intended module stream/profile is enabled and installed.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
