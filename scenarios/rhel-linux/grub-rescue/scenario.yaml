category: Fix
description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `GRUB Rescue Mode`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server that drops to the `grub rescue>` prompt at boot. GRUB
  cannot load its normal configuration, so the OS does not start. The system boots into the limited `grub
  rescue>` prompt instead of the OS because the GRUB bootloader can''t find its configuration/modules
  (a damaged install or a moved /boot). You must locate the boot partition, load the OS, and reinstall
  GRUB so the machine boots normally again.


  OBJECTIVE: Identify the boot/root partition from the grub rescue prompt; Boot into the OS (or a rescue
  environment); Reinstall GRUB and regenerate its config so the system boots normally. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.


    WHY: a running service behind a closed firewall still fails health checks.'
