category: Fix
description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `RHEL System Patching
  (Jira change window)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server in a change window. Use the Jira ticket to request
  change-window actions from the @backup, @database, and @application teams (~30s replies), then patch
  and reboot in the terminal. It''s the monthly patching change window. Before touching the server you
  must coordinate in Jira with the @backup, @database, and @application teams to stop services and take
  backups. Then run a pre-check, apply updates with dnf, reboot, and run a post-check — resolving any
  mount problem that appears after reboot before bringing services back via Jira.


  OBJECTIVE: Request stop/backup from the @backup, @database, and @application teams in Jira before patching;
  Run precheck, apply dnf update, reboot, and run postcheck in the terminal; Fix any mount issue reported
  after reboot, then start DB/app via Jira. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.


    WHY: a running service behind a closed firewall still fails health checks.'
