description: 'Production alert: a service is denied despite correct Unix permissions.
  You are on call for RHEL Linux and must troubleshoot SELinux policy methodically
  — triage symptoms, isolate root cause, apply the smallest safe fix, and confirm
  recovery.'
objectives:
- 'The incident symptom is clear: a service is denied despite correct Unix permissions'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The RHEL practice host is degraded. A service is denied despite correct
  unix permissions. Recent changes may exist around SELinux policy, but do not restart
  blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `getenforce`, `ausearch -m avc`, and `semanage`.

    2. Write down what looks normal versus wrong or missing for SELinux policy.

    3. Recall the core idea: contexts, booleans, and audit denials. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for SELinux policy.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `getenforce`, `ausearch -m avc`, and `semanage`.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — the service runs with the right context and no new AVC
    denials.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-rhel-linux-014-troubleshoot-selinux-policy-2.conf`,
    then click Check Solution.'
