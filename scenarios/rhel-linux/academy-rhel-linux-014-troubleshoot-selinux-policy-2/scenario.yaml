description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `rhel-linux: Selinux
  Policy — Troubleshooting Drill` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The RHEL practice host is degraded. A service is denied despite correct unix
  permissions. Recent changes may exist around SELinux policy, but do not restart blindly — gather evidence
  first. Production alert: a service is denied despite correct Unix permissions. You are on call for rhel-linux
  and must troubleshoot SELinux policy methodically — triage symptoms, isolate root cause, apply the smallest
  safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: a service is denied despite correct Unix permissions; Root
  cause is isolated with evidence, not guesswork; Service behavior returns to normal after the fix. Success
  means `systemctl is-active auditd` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: a service is denied despite correct Unix permissions'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The RHEL practice host is degraded. A service is denied despite correct unix permissions.
  Recent changes may exist around SELinux policy, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `getenforce`, `ausearch -m avc`, and `semanage`.

    2. Write down what looks normal versus wrong or missing for SELinux policy.

    3. Recall the core idea: contexts, booleans, and audit denials. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status auditd` — note Active/Failed and the last log lines.

    2. Read `journalctl -u auditd -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `getenforce`, `ausearch -m avc`, and `semanage`.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — the service runs with the right context and no new AVC denials.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
