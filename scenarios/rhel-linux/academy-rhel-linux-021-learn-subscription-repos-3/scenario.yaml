description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `rhel-linux: Subscriptions
  And Repos — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The RHEL practice host is online with a starter subscriptions and repos setup.
  Some pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire
  — focus on observation. This beginner-friendly rhel-linux lab introduces subscriptions and repos. You
  will explore subscription-manager, entitlements, and repo enablement on the RHEL practice host. Read
  the environment first, then follow the guided steps — no prior production experience required.


  OBJECTIVE: Understand how subscriptions and repos work in this lab environment; Identify the main status
  and configuration signals for subscriptions and repos; Confirm you can read the current state confidently
  before changing anything. Success means `systemctl is-active auditd` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how subscriptions and repos work in this lab environment
- Identify the main status and configuration signals for subscriptions and repos
- Confirm you can read the current state confidently before changing anything
initial_state: The RHEL practice host is online with a starter subscriptions and repos setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `subscription-manager status` and `dnf repolist`.

    2. Write down what looks normal versus wrong or missing for subscriptions and repos.

    3. Recall the core idea: subscription-manager, entitlements, and repo enablement. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status auditd` — note Active/Failed and the last log lines.

    2. Read `journalctl -u auditd -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `subscription-manager status` and `dnf repolist`.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — the host is registered and required repos are enabled.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
