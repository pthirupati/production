description: Service operations lab. The `firewalld` systemd unit is **failed/inactive** on this host
  — a realistic fault for Integration Lab workflows that depend on it. Diagnose with `systemctl status
  firewalld` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active
  firewalld`.
objectives:
- The `firewalld` service is active (running)
- '`systemctl is-active firewalld` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `firewalld` service is not running (`systemctl is-active firewalld` → inactive/failed).
  Dependent Integration Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `systemctl get-default` and `systemctl list-units --type=target`.

    2. Write down what looks normal versus wrong or missing for systemd targets.

    3. Recall the core idea: boot targets, default target, and isolation. Form one hypothesis before you
    act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for systemd targets.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `systemctl get-default` and `systemctl list-units --type=target`.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — the default target matches policy.

    4. Click Check Solution once `systemctl is-active firewalld` returns active.'
cross_technology: true
