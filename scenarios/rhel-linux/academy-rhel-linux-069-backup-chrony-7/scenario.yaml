description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `rhel-linux: Chrony
  Time Sync — Backup and Recovery` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for chrony time sync. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for chrony
  time sync. Ensure backups run on schedule, retention is correct, and you can restore NTP sources, drift,
  and step thresholds within the lab RTO.


  OBJECTIVE: Backup coverage for chrony time sync is complete and restorable; Retention and encryption
  meet the stated policy; A restore drill proves data integrity. Success means `systemctl is-active chronyd`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for chrony time sync is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for chrony time sync. Leadership wants proof
  that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `chronyc sources` and `chronyc tracking`.

    2. Write down what looks normal versus wrong or missing for chrony time sync.

    3. Recall the core idea: NTP sources, drift, and step thresholds. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status chronyd` — note Active/Failed and the last log lines.

    2. Read `journalctl -u chronyd -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `chronyc sources` and `chronyc tracking`.

    2. Repair or run the backup job, then perform a controlled restore into a scratch location to prove
    it works.

    3. Verify the result — time is synchronized within tolerance.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
