category: Fix
description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `Kernel Panic on
  Boot` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. Boot ends in a kernel panic: "VFS: Unable to mount
  root fs on unknown-block". The root device can''t be found/mounted as currently configured. The kernel
  panics on boot with "VFS: Unable to mount root fs" because it cannot mount the root filesystem — typically
  a wrong root device/UUID in the boot entry or fstab, or an initramfs missing the storage driver. Correct
  the root reference (and/or rebuild the initramfs) so the kernel mounts root and boots.


  OBJECTIVE: Read the panic and identify that root cannot be mounted; Find the wrong root UUID/device
  or missing initramfs driver; Fix the root reference / rebuild initramfs so the system boots. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.


    WHY: a running service behind a closed firewall still fails health checks.'
