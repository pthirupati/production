category: Fix
description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `Network — Add Secondary
  NIC IP via Jira` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. eth0 has only 10.0.0.10; a secondary IP (10.0.0.20/24)
  is required for the application VIP. Request the @network team in Jira, wait for confirmation (~30s),
  then verify in the terminal. An application needs a secondary IP (10.0.0.20) on eth0 for its VIP, but
  only the primary 10.0.0.10 is configured. Coordinate with the @network team through the Jira ticket
  to have the address assigned, verify it appears on the interface, and confirm the application can bind
  to the new address (configuring routing if needed).


  OBJECTIVE: Request the @network team in Jira to add the secondary IP; Verify the new address with ip
  addr show dev eth0; Confirm the application can bind to the new address (and routing works). Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.


    WHY: a running service behind a closed firewall still fails health checks.'
