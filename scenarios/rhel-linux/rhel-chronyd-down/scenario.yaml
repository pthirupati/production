simulation_type: generic
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `RHEL chronyd Time
  Sync Service Down` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A RHEL host where the chronyd service is failed, stopping time synchronization.
  On a RHEL host the chronyd time service is down, so the clock will drift and Kerberos/TLS may fail.
  Restart chronyd and confirm it''s active.


  OBJECTIVE: Confirm chronyd is down; Resolve and start chronyd; Verify chronyd is active. Success means
  `systemctl is-active chronyd` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A RHEL host where the chronyd service is failed, stopping time synchronization.
objectives:
- Confirm chronyd is down
- Resolve and start chronyd
- Verify chronyd is active
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status chronyd` and `journalctl -u chronyd -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status chronyd` — note Active/Failed and the last log lines.

    2. Read `journalctl -u chronyd -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart chronyd` and confirm `systemctl is-active chronyd` succeeds.


    WHY: the grader checks real service state, not marker files.'
