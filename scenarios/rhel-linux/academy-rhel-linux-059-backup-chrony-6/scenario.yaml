title: 'RHEL Linux: Chrony Time Sync — Backup and Recovery'
slug: academy-rhel-linux-059-backup-chrony-6
technology: RHEL Linux
category: Backup & Recovery
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: rhel
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: RHEL time-service operations. `chronyd` (the NTP client) is not running on this host, so
  the system clock will drift — which breaks TLS validation, log correlation, and Kerberos. Restore the
  time service to an active state and confirm synchronisation. Verify with `systemctl is-active chronyd`.
objectives:
- The chronyd service is active (running)
- Time synchronisation is restored on the host
- systemctl is-active chronyd reports 'active'
initial_state: 'Time synchronisation is broken: the `chronyd` service is stopped, so the clock is free-running
  and will drift out of tolerance.'
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `systemctl status chronyd` and `chronyc tracking`.

    2. Write down what looks normal versus wrong or missing.

    3. Form one hypothesis about the root cause before you change anything.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture command output before the change so you can prove it worked afterward.'
- order: 3
  cost: 20
  content: 'Guided walkthrough:

    1. Re-check the current state — Check the service and sync state: `systemctl status chronyd` and `chronyc
    tracking`.

    2. The configuration is fine — the daemon simply is not running and enabled.

    3. Verify the result — Run `sudo systemctl enable --now chronyd`, confirm with `systemctl is-active
    chronyd`, then Check Solution.

    4. Click Check Solution once every objective is met.'
