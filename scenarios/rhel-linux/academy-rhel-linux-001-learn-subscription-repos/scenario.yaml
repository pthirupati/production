title: 'RHEL Linux: Subscriptions And Repos — Fundamentals Lab'
slug: academy-rhel-linux-001-learn-subscription-repos
technology: RHEL Linux
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: rhel
time_limit: 900
max_score: 100
is_free: true
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly RHEL Linux lab introduces subscriptions and repos.
  You will explore subscription-manager, entitlements, and repo enablement on the
  RHEL practice host. Read the environment first, then complete the guided steps —
  no prior production experience required.
objectives:
- Understand how subscriptions and repos work in this lab environment
- Identify the main status and configuration signals for subscriptions and repos
- Confirm you can read the current state confidently before changing anything
initial_state: The RHEL practice host is online with a starter subscriptions and repos
  setup. Some pieces are intentionally incomplete so you can learn how the pieces
  fit together. Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: `subscription-manager status` and `dnf repolist`. Write
    down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — subscription-manager, entitlements, and repo enablement. Make
    one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-rhel-linux-001-learn-subscription-repos.conf`,
    then click Check Solution.
