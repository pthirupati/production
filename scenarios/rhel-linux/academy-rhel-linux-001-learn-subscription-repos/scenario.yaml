description: This beginner-friendly RHEL Linux lab introduces subscriptions and repos.
  You will explore subscription-manager, entitlements, and repo enablement on the
  RHEL practice host. Read the environment first, then follow the guided steps — no
  prior production experience required.
objectives:
- Understand how subscriptions and repos work in this lab environment
- Identify the main status and configuration signals for subscriptions and repos
- Confirm you can read the current state confidently before changing anything
initial_state: The RHEL practice host is online with a starter subscriptions and repos
  setup. Some pieces are intentionally incomplete so you can learn how they fit together.
  Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `subscription-manager status` and `dnf repolist`.

    2. Write down what looks normal versus wrong or missing for subscriptions and
    repos.

    3. Recall the core idea: subscription-manager, entitlements, and repo enablement.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for subscriptions and
    repos.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `subscription-manager status` and `dnf repolist`.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — the host is registered and required repos are enabled.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-rhel-linux-001-learn-subscription-repos.conf`,
    then click Check Solution.'
