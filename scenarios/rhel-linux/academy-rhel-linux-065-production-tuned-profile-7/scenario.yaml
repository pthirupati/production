description: Service operations lab. The `sssd` systemd unit is **failed/inactive** on this host — a realistic
  fault for Production Readiness workflows that depend on it. Diagnose with `systemctl status sssd` and
  journal logs, apply the smallest reliable fix, then verify with `systemctl is-active sssd`.
objectives:
- The `sssd` service is active (running)
- '`systemctl is-active sssd` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `sssd` service is not running (`systemctl is-active sssd` → inactive/failed). Dependent
  Production Readiness tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `tuned-adm active` and `tuned-adm list`.

    2. Write down what looks normal versus wrong or missing for tuned profiles.

    3. Recall the core idea: performance profiles and tunables. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for tuned profiles.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `tuned-adm active` and `tuned-adm list`.

    2. Apply production standards for tuned profiles: resource limits, monitoring, access controls, and
    a written rollback step.

    3. Verify the result — the correct tuned profile is active.

    4. Click Check Solution once `systemctl is-active sssd` returns active.'
