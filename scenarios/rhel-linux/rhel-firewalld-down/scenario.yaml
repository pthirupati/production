description: 'CONTEXT: A team operating Red Hat Enterprise Linux has raised a ticket for `RHEL firewalld
  Service Not Running`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host. The architecture is a single
  lab-primary node exposing dnf, subscription-manager, firewalld, and SELinux; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A RHEL host where the firewalld service is failed/inactive.


  OBJECTIVE: Confirm firewalld is down; Start firewalld; Verify firewalld is active. Acceptance criteria:
  the change is minimal and reversible, and success means `systemctl is-active firewalld``` returns active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant dnf, subscription-manager, firewalld, and SELinux), changing one thing at a time.
  Check your work continuously against the objective — success means `systemctl is-active firewalld``` returns
  active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active firewalld`` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A RHEL host where the firewalld service is failed/inactive.
objectives:
- Confirm firewalld is down
- Start firewalld
- Verify firewalld is active
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: RHEL firewalld service not running is not behaving
    as the scenario objectives require. This lab is about RHEL firewalld service not running — how RHEL
    firewalld service not running behaves in a Red Hat Enterprise Linux environment. Read the objectives
    and the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For RHEL firewalld service not running problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Create the smallest working slice
    of RHEL firewalld service not running first, validate it, then add the remaining pieces one at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status firewalld` and `journalctl -u firewalld -n 50 --no-pager` before changing
    anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status firewalld` — note Active/Failed and the last log lines.

    2. Read `journalctl -u firewalld -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart firewalld` and confirm `systemctl is-active firewalld` succeeds.


    WHY: the grader checks real service state, not marker files.'
