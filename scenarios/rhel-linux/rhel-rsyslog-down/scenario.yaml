title: RHEL rsyslog Stopped — No System Logs
slug: rhel-rsyslog-down
technology: RHEL Linux
category: Logging
difficulty: medium
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: true
