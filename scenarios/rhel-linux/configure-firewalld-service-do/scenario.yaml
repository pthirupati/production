description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `Open Firewalld
  Service Port` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: RHEL host with firewalld active and the http service not yet allowed. nginx
  may be installed but the firewall blocks inbound web traffic. Build task: serve a web app through firewalld.
  Starting from a host where the firewall does not allow web traffic, permit the http service permanently,
  reload firewalld, start nginx, and verify the port is reachable so the site is accessible from clients.


  OBJECTIVE: Allow the http service in firewalld permanently; Reload firewalld and start/enable nginx;
  Verify HTTP traffic is permitted and the site responds. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Allow the http service in firewalld permanently
- Reload firewalld and start/enable nginx
- Verify HTTP traffic is permitted and the site responds
initial_state: RHEL host with firewalld active and the http service not yet allowed. nginx may be installed
  but the firewall blocks inbound web traffic.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.


    WHY: a running service behind a closed firewall still fails health checks.'
