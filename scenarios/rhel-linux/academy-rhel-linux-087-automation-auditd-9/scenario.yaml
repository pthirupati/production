description: 'Automation lab: remove toil around auditd. Codify repeatable steps for
  audit rules, watches, and the audit log and prove the automation is idempotent.'
objectives:
- Day-2 auditd work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for auditd. Automate the boring
  parts without hiding important safety checks.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `auditctl -l` and `ausearch`/`aureport`.

    2. Write down what looks normal versus wrong or missing for auditd.

    3. Recall the core idea: audit rules, watches, and the audit log. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for auditd.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `auditctl -l` and `ausearch`/`aureport`.

    2. Implement the automation with dry-run / check mode, then run it twice — the
    second run must report no changes.

    3. Verify the result — audit rules capture the required events and persist.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-rhel-linux-087-automation-auditd-9.conf`,
    then click Check Solution.'
