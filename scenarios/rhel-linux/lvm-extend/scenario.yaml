category: Fix
description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `Extend LVM Volume
  Group (Jira storage request)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. The ''rhel'' volume group is out of free extents
  and / is full. A new disk is NOT attached until the @storage team confirms in Jira; after ~30s, /dev/sdb
  appears and you can extend LVM. The root filesystem is full and the volume group has no free space,
  so writes are failing. A new disk must be requested from the @storage team via the Jira ticket; once
  it''s attached, you add it as an LVM physical volume, extend the volume group and root logical volume,
  and grow the XFS filesystem online to reclaim capacity.


  OBJECTIVE: Request a new disk from the @storage team in Jira; Verify the new disk (lsblk/fdisk) and
  add it: pvcreate, vgextend; Extend the logical volume and grow the XFS filesystem (lvextend + xfs_growfs).
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.


    WHY: a running service behind a closed firewall still fails health checks.'
