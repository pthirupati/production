description: Service operations lab. The `rsyslog` systemd unit is **failed/inactive** on this host —
  a realistic fault for Fundamentals Lab workflows that depend on it. Diagnose with `systemctl status
  rsyslog` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active rsyslog`.
objectives:
- The `rsyslog` service is active (running)
- '`systemctl is-active rsyslog` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `rsyslog` service is not running (`systemctl is-active rsyslog` → inactive/failed).
  Dependent Fundamentals Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `subscription-manager status` and `dnf repolist`.

    2. Write down what looks normal versus wrong or missing for subscriptions and repos.

    3. Recall the core idea: subscription-manager, entitlements, and repo enablement. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for subscriptions and repos.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `subscription-manager status` and `dnf repolist`.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — the host is registered and required repos are enabled.

    4. Click Check Solution once `systemctl is-active rsyslog` returns active.'
