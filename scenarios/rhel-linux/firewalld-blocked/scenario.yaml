category: Fix
description: 'CONTEXT: A team operating Red Hat Enterprise Linux needs you to resolve `Open Firewall Port
  80` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline RHEL practice host with dnf, subscription-manager,
  firewalld, and SELinux. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL host. nginx is active and answers on localhost, but firewalld
  does not permit inbound HTTP, so external access to port 80 is blocked. nginx is running and serving
  locally, but remote clients can''t reach it because firewalld is blocking inbound port 80. The web service
  has no firewall exception, so connections from outside time out or are refused. Open port 80 (or the
  http service) in firewalld, reload, and confirm the site becomes reachable.


  OBJECTIVE: Confirm nginx serves locally but port 80 is blocked by firewalld; Open the HTTP port/service
  in firewalld and reload; Verify port 80 is reachable. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
