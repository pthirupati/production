hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `dnf module list` and `dnf module info`.

    2. Write down what looks normal versus wrong or missing for dnf modules.

    3. Recall the core idea: module streams, profiles, and default versions. Form
    one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for dnf modules.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `dnf module list` and `dnf module info`.

    2. Create the smallest working slice of dnf modules first, validate it, then add
    the remaining pieces one at a time.

    3. Verify the result — the intended module stream/profile is enabled and installed.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-rhel-linux-082-build-dnf-modules-9.conf`,
    then click Check Solution.'
