description: GPU host lab. `nvidia-smi` reports the GPU unhealthy — ML/GPU workloads cannot start. Load
  the driver / restore GPU health, then verify with `nvidia-smi`.
objectives:
- GPU reports healthy in nvidia-smi
- '`nvidia-smi` reports a healthy GPU'
initial_state: The NVIDIA driver/GPU is not healthy (`nvidia-smi` fails).
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nvcc --version` and `nvidia-smi`.

    2. Write down what looks normal versus wrong or missing for CUDA toolkit.

    3. Recall the core idea: toolkit/runtime versions and compatibility. Form one hypothesis before you
    act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for CUDA toolkit.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `nvcc --version` and `nvidia-smi`.

    2. Create the smallest working slice of CUDA toolkit first, validate it, then add the remaining pieces
    one at a time.

    3. Verify the result — a sample CUDA workload runs.

    4. Click Check Solution once `nvidia-smi` reports a healthy GPU.'
