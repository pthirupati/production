description: 'CONTEXT: A team operating GPU operations needs you to resolve `gpu: Gpu Scheduling — Backup
  and Recovery` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for GPU scheduling. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for GPU
  scheduling. Ensure backups run on schedule, retention is correct, and you can restore device plugins
  and resource requests within the lab RTO.


  OBJECTIVE: Backup coverage for GPU scheduling is complete and restorable; Retention and encryption meet
  the stated policy; A restore drill proves data integrity. Success means `nvidia-smi` includes `NVIDIA-SMI`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for GPU scheduling is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for GPU scheduling. Leadership wants proof
  that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `nvidia-smi` shows the container Up.


    WHY: the checker validates the container is actually running.'
