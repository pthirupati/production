description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `DCGM Diagnostic Level 1 Fails` during a live incident. Until the underlying hardware/driver state is
  repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: `dcgmi diag -r 1` (quick / software checks) fails on ''Denylist'', ''NVML
  library'', or ''Persistence mode'' — a fast software-only check that gates the node before jobs land.


  OBJECTIVE: Run dcgmi diag -r 1 and read exactly which software check failed; Fix the flagged software
  condition (persistence mode, denylisted module, or driver library); Re-run the level-1 diagnostic and
  confirm it passes. Success means `check.sh` exits successfully after you apply the documented remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: 'A node failing the pre-flight health gate: `dcgmi diag -r 1` reports a deployment/software
  check failure so the scheduler quarantined the host.'
objectives:
- Run dcgmi diag -r 1 and read exactly which software check failed
- Fix the flagged software condition (persistence mode, denylisted module, or driver library)
- Re-run the level-1 diagnostic and confirm it passes
hints:
- order: 1
  cost: 0
  content: 'Where to look: `dcgmi diag -r 1` and read the per-check PASS/FAIL table; the level-1 run is
    software-only and finishes in seconds.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `dcgmi diag -r 1` — note the failing check name (e.g. Persistence Mode, Denylist, Inforom).

    2. `nvidia-smi -q | grep -i persistence` to confirm persistence mode state.

    3. `lsmod | grep -i nouveau` for a conflicting/denylisted module.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Address the specific failure: `nvidia-smi -pm 1` to enable persistence mode, or blacklist nouveau
    and reload nvidia.

    2. Re-run `dcgmi diag -r 1` and confirm every check reports PASS.

    3. Record the remediation in /opt/fixitlab/academy/gpu-dcgm-diag-r1-fail.conf.

    WHY: the checker validates the diagnostic genuinely passes.'
