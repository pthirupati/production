description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `H100 NVLink Lane Down / Degraded` during a live incident. Until the underlying hardware/driver state
  is repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: `nvidia-smi nvlink -s` shows a link ''inactive'' (or reduced lanes) between
  two GPUs, and `nvidia-smi topo -m` no longer shows full NV# connectivity. Collectives fall back to slower
  paths and busbw collapses on this node.


  OBJECTIVE: Read nvidia-smi nvlink status and identify the down/degraded link; Correlate the link fault
  with errors or a device that needs a reset; Recover full NVLink connectivity and confirm topology +
  bandwidth are healthy. Success means `check.sh` exits successfully after you apply the documented remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: An 8x H100 SXM node where one NVLink between two GPUs is inactive; nvidia-smi nvlink shows
  a link down and intra-node all-reduce bandwidth dropped sharply.
objectives:
- Read nvidia-smi nvlink status and identify the down/degraded link
- Correlate the link fault with errors or a device that needs a reset
- Recover full NVLink connectivity and confirm topology + bandwidth are healthy
hints:
- order: 1
  cost: 0
  content: 'Where to look: `nvidia-smi nvlink -s` (per-link state), `nvidia-smi nvlink -e` (error counters),
    and `nvidia-smi topo -m` for the NV# connectivity matrix.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `nvidia-smi nvlink -s` — find the link reported inactive or at reduced width.

    2. `nvidia-smi nvlink -e` — check CRC/replay error counters on that link.

    3. `nvidia-smi topo -m` — confirm the missing NV# path between the two GPUs.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Reset the affected GPU (`nvidia-smi -r -i <id>`) to re-train the NVLink, and confirm the NVSwitch/fabric-manager
    is healthy; reseat if it will not come up.

    2. Re-run `nvidia-smi nvlink -s` and `nvidia-smi topo -m` and confirm all links are active at full
    width.

    3. Record the remediation in /opt/fixitlab/academy/gpu-nvlink-lane-down-h100.conf.

    WHY: the checker validates NVLink genuinely recovered.'
