description: 'CONTEXT: A team operating GPU operations needs you to resolve `gpu: Cuda Toolkit — Build
  From Scratch` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The GPU node is ready but CUDA toolkit is not configured yet. Required tools
  may already be installed; your job is to create the configuration and bring the capability online. Build
  CUDA toolkit from scratch in this gpu lab. You start from a minimal environment and must produce a working
  configuration that demonstrates toolkit/runtime versions and compatibility. Plan, implement, then prove
  it works.


  OBJECTIVE: A working CUDA toolkit setup must exist by the end of this lab; Configuration should follow
  team conventions and be easy to audit; The result should pass validation without manual cleanup. Success
  means `nvidia-smi` includes `NVIDIA-SMI`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working CUDA toolkit setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The GPU node is ready but CUDA toolkit is not configured yet. Required tools may already
  be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nvcc --version` and `nvidia-smi`.

    2. Write down what looks normal versus wrong or missing for CUDA toolkit.

    3. Recall the core idea: toolkit/runtime versions and compatibility. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `nvcc --version` and `nvidia-smi`.

    2. Create the smallest working slice of CUDA toolkit first, validate it, then add the remaining pieces
    one at a time.

    3. Verify the result — a sample CUDA workload runs.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
