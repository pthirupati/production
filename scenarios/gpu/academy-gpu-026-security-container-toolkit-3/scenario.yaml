hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — runtime config and `docker run --gpus`.

    2. Write down what looks normal versus wrong or missing for NVIDIA container toolkit.

    3. Recall the core idea: GPU passthrough to containers. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for NVIDIA container
    toolkit.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — runtime config and `docker run --gpus`.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit
