title: NVIDIA Container Toolkit Not Found
slug: sim-gpu-container-toolkit
category: GPU & NVIDIA
difficulty: medium
description: 'Running a GPU container fails with "could not select device driver with capabilities: [[gpu]]".
  The NVIDIA Container Toolkit is not installed or not wired into the Docker runtime, so `docker run --gpus
  all` can''t expose the GPU to the container. Install/configure the toolkit and runtime so GPU containers
  can access the device.'
initial_state: Linux host with NVIDIA drivers present on the host but the NVIDIA Container Toolkit not
  configured. `docker run --gpus all ... nvidia-smi` fails to select a GPU device driver.
lab_mode: simulation
simulation_type: gpu
is_free: false
jira_priority: Medium
max_score: 100
time_limit: 900
dual_terminal: false
requires_companion_hosts: false
objectives:
- Reproduce the "could not select device driver" error
- Install/configure the NVIDIA Container Toolkit and Docker runtime
- Run a GPU container that successfully sees the GPU via nvidia-smi
hints:
- order: 1
  cost: 10
  content: 'Confirm the host GPU works first: `nvidia-smi` on the host should list the GPU. Then reproduce:
    `docker run --rm --gpus all nvidia/cuda:12.2.0-base nvidia-smi` fails with "could not select device
    driver".'
- order: 2
  cost: 15
  content: 'The container runtime hook is missing. Install/enable the toolkit and register the runtime:
    `sudo nvidia-ctk runtime configure --runtime=docker` then `sudo systemctl restart docker`.'
- order: 3
  cost: 20
  content: Re-run `docker run --rm --gpus all nvidia/cuda:12.2.0-base nvidia-smi` — it now prints the
    GPU table from inside the container.
