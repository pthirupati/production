title: NVIDIA Container Toolkit Not Found
slug: sim-gpu-container-toolkit
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating GPU operations needs you to resolve `NVIDIA Container Toolkit
  Not Found` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux host with NVIDIA drivers present on the host but the NVIDIA Container
  Toolkit not configured. `docker run --gpus all ... nvidia-smi` fails to select a GPU device driver.
  Running a GPU container fails with "could not select device driver with capabilities: [[gpu]]". The
  NVIDIA Container Toolkit is not installed or not wired into the Docker runtime, so `docker run --gpus
  all` can''t expose the GPU to the container. Install/configure the toolkit and runtime so GPU containers
  can access the device.


  OBJECTIVE: Reproduce the "could not select device driver" error; Install/configure the NVIDIA Container
  Toolkit and Docker runtime; Run a GPU container that successfully sees the GPU via nvidia-smi. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Linux host with NVIDIA drivers present on the host but the NVIDIA Container Toolkit not
  configured. `docker run --gpus all ... nvidia-smi` fails to select a GPU device driver.
