description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `H100 HBM3 Uncorrectable ECC Errors` during a live incident. Until the underlying hardware/driver state
  is repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: `nvidia-smi -q -d ECC` shows non-zero Volatile and Aggregate Uncorrectable
  errors on HBM3, and dmesg has an Xid 48/94 (DBE / contained ECC). The GPU keeps poisoning memory pages
  under load.


  OBJECTIVE: Read the ECC error tables and confirm uncorrectable HBM3 errors are present; Check the retired/remapped
  page state and the associated Xid in dmesg; Retire the affected pages (or drain for RMA) and confirm
  the GPU returns to a clean ECC state. Success means `check.sh` exits successfully after you apply the
  documented remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: An H100 SXM node logging uncorrectable (double-bit) HBM3 ECC errors; a training rank crashed
  with an ECC error and the GPU is flagged for possible RMA.
objectives:
- Read the ECC error tables and confirm uncorrectable HBM3 errors are present
- Check the retired/remapped page state and the associated Xid in dmesg
- Retire the affected pages (or drain for RMA) and confirm the GPU returns to a clean ECC state
hints:
- order: 1
  cost: 0
  content: 'Where to look: `nvidia-smi -q -d ECC` for volatile/aggregate uncorrectable counts and `nvidia-smi
    -q -d PAGE_RETIREMENT`; correlate with `dmesg | grep -i xid`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `nvidia-smi -q -d ECC` — confirm Uncorrectable > 0 on the device.

    2. `nvidia-smi -q -d PAGE_RETIREMENT` — check pending vs already-retired pages.

    3. `dmesg -T | grep -i ''Xid''` — an Xid 48 (DBE) or 94/95 confirms uncorrectable HBM.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Trigger page retirement / reset the GPU so pending pages retire; if the count keeps climbing, drain
    the node and open an RMA.

    2. Confirm `nvidia-smi -q -d ECC` shows no new uncorrectable errors and no pending retirements.

    3. Record the remediation in /opt/fixitlab/academy/gpu-h100-hbm3-ecc-uncorrectable.conf.

    WHY: the checker validates the ECC state was genuinely cleared.'
