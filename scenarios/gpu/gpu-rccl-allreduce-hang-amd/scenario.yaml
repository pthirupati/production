description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `RCCL AllReduce Hangs on MI300X` during a live incident. Until the underlying hardware/driver state
  is repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: With `NCCL_DEBUG=INFO` (RCCL honours the same var) the job falls back to sockets
  or fails to init the RDMA HCA, so `rcclAllReduce` stalls. `rocm-smi --showtopo` shows xGMI links present
  but unused.


  OBJECTIVE: Reproduce the RCCL hang and capture the transport selection with NCCL_DEBUG=INFO; Determine
  whether RCCL missed the RDMA HCA or xGMI/peer access is disabled; Set the correct HCA/interface (or
  enable peer access) so the all-reduce completes. Success means `check.sh` exits successfully after you
  apply the documented remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: A multi-node AMD Instinct MI300X run that hangs in RCCL at the first all-reduce; xGMI/InfiniBand
  transport selection is wrong and the collective never finishes.
objectives:
- Reproduce the RCCL hang and capture the transport selection with NCCL_DEBUG=INFO
- Determine whether RCCL missed the RDMA HCA or xGMI/peer access is disabled
- Set the correct HCA/interface (or enable peer access) so the all-reduce completes
hints:
- order: 1
  cost: 0
  content: 'Where to look: rerun with `NCCL_DEBUG=INFO` (RCCL reads it), inspect `rocm-smi --showtopo`
    for xGMI links, and `ibv_devinfo` for the RDMA HCA RCCL should use.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `NCCL_DEBUG=INFO` — check whether RCCL selected ''Socket'' instead of the IB HCA.

    2. `rocm-smi --showtopo` — confirm xGMI (not PCIe) between local MI300X GPUs.

    3. `ibv_devinfo` / `ip -o link` — confirm the intended HCA and interface names.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Export `NCCL_IB_HCA=mlx5_0` and `NCCL_SOCKET_IFNAME=<iface>` (and ensure ROCm peer access), then
    relaunch.

    2. Confirm `rcclAllReduce` completes and `rccl-tests all_reduce_perf` reports expected busbw.

    3. Apply the documented remediation in /opt/fixitlab/academy/gpu-rccl-allreduce-hang-amd.conf.

    WHY: the checker validates the collective genuinely completes.'
