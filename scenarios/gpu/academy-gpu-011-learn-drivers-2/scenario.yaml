hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nvidia-smi`, `dmesg`, and driver package versions.

    2. Write down what looks normal versus wrong or missing for GPU drivers.

    3. Recall the core idea: driver/kernel module versions, persistence mode, and device nodes. Form one
    hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `nvidia-smi`, `dmesg`, and driver package versions.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — nvidia-smi reports healthy devices and sample CUDA jobs run.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
