description: 'CONTEXT: A team operating GPU operations needs you to resolve `gpu: Gpu Drivers — Fundamentals
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The GPU node is online with a starter GPU drivers setup. Some pieces are intentionally
  incomplete so you can learn how they fit together. Nothing is on fire — focus on observation. This beginner-friendly
  gpu lab introduces GPU drivers. You will explore driver/kernel module versions, persistence mode, and
  device nodes on the GPU node. Read the environment first, then follow the guided steps — no prior production
  experience required.


  OBJECTIVE: Understand how GPU drivers work in this lab environment; Identify the main status and configuration
  signals for GPU drivers; Confirm you can read the current state confidently before changing anything.
  Success means `nvidia-smi` includes `NVIDIA-SMI`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how GPU drivers work in this lab environment
- Identify the main status and configuration signals for GPU drivers
- Confirm you can read the current state confidently before changing anything
initial_state: The GPU node is online with a starter GPU drivers setup. Some pieces are intentionally
