description: 'CONTEXT: A team operating GPU operations needs you to resolve `CUDA Toolkit Not on PATH/LD_LIBRARY_PATH`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A GPU host missing CUDA path exports. nvcc and CUDA libs aren''t found because
  the toolkit paths aren''t exported.


  OBJECTIVE: Confirm the issue: nvcc not found; libs missing; Apply the documented fix in /etc/profile.d/cuda.sh;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
