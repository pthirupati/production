title: GPU Out of Memory Error
slug: sim-gpu-oom
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating GPU operations needs you to resolve `GPU Out of Memory Error`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux host with an NVIDIA GPU. A training/inference job aborts with "CUDA
  out of memory: Tried to allocate ...". GPU memory is exhausted, possibly by stale processes. A GPU job
  crashes with "CUDA out of memory". The model/batch is trying to allocate more GPU memory than the device
  has free — often because of an oversized batch size or leftover memory held by zombie processes. Identify
  what''s consuming VRAM, free it or reduce the footprint, and get the job running within the GPU''s memory.


  OBJECTIVE: Confirm GPU memory is exhausted and see what''s holding it; Free leftover/zombie GPU memory
  or reduce the job''s footprint; Run the job within the available GPU memory. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Linux host with an NVIDIA GPU. A training/inference job aborts with "CUDA out of memory:
  Tried to allocate ...". GPU memory is exhausted, possibly by stale processes.'
