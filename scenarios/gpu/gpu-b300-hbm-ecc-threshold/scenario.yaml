description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `B300 HBM ECC Over Retirement Threshold` during a live incident. Until the underlying hardware/driver
  state is repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are
  at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Aggregate correctable HBM ECC errors and retired pages on a B300 GPU exceeded
  the vendor field threshold. The DCGM health watch marks the GPU ''warn/fail'' and the scheduler cordoned
  the node.


  OBJECTIVE: Confirm the B300 GPU crossed the retired-page/ECC field threshold via nvidia-smi and DCGM;
  Decide between page retirement + return-to-service and drain-for-RMA per the threshold; Apply the decision
  and confirm DCGM health reports the GPU healthy or properly drained. Success means `check.sh` exits
  successfully after you apply the documented remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: A Blackwell B300-class node where a GPU crossed the field ECC retired-page threshold; the
  health policy quarantined it and the on-call needs a decision.
objectives:
- Confirm the B300 GPU crossed the retired-page/ECC field threshold via nvidia-smi and DCGM
- Decide between page retirement + return-to-service and drain-for-RMA per the threshold
- Apply the decision and confirm DCGM health reports the GPU healthy or properly drained
hints:
- order: 1
  cost: 0
  content: 'Where to look: `nvidia-smi -q -d PAGE_RETIREMENT,ECC` for the retired-page count and `dcgmi
    health -g 0 -c` for the DCGM health watch verdict.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `nvidia-smi -q -d PAGE_RETIREMENT` — compare retired pages to the field limit.

    2. `dcgmi health -g 0 -c` — read the warn/fail reason string.

    3. `nvidia-smi -q -d ECC` — check whether errors are still accumulating (RMA) or stable (retire +
    return).'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. If under threshold and stable, retire pages and reset to return the GPU; if over the RMA threshold,
    cordon/drain and flag for replacement.

    2. Re-run `dcgmi health -g 0 -c` and confirm Healthy (or a clean, intentional drain).

    3. Record the remediation in /opt/fixitlab/academy/gpu-b300-hbm-ecc-threshold.conf.

    WHY: the checker validates a real health decision was recorded.'
