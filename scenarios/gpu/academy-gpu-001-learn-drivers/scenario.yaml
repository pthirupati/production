tasks:
- id: task_1
  title: Gpu Drivers — Learn Lab
  description: Work down the GPU stack — PCIe bus, kernel module, userspace tooling — to determine why
    nvidia-smi cannot reach the cards, then load the driver and read the resulting device table.
  background: 'This lab teaches the layer model behind every GPU incident: hardware on the PCIe bus, a
    kernel module bound to it, and userspace tools that talk to that module. Checking layers bottom-up
    is what separates "the driver is unloaded" from "the card is dead".'
  validation:
    type: command_output
    command: nvidia-smi
    expected_output: NVIDIA-SMI
    error_message: nvidia-smi still cannot reach a driver. Check `lsmod | grep nvidia` — if it is empty,
      the kernel module is not loaded.
solution:
  summary: The eight H100s are present on the PCIe bus but no NVIDIA kernel module is loaded, so the userspace
    tools have nothing to communicate with. Loading `nvidia` restores the whole stack.
  files_changed: []
  commands_run:
  - lspci | grep -i nvidia
  - lsmod | grep nvidia
  - modinfo nvidia
  - modprobe nvidia
  - nvidia-smi
  reference_docs: gpu-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Observe the failure at the top of the stack
    instruction: Run nvidia-smi and read the error wording before doing anything else.
    command: nvidia-smi
    expected_output: '"NVIDIA-SMI has failed because it couldn''t communicate with the NVIDIA driver"'
    explanation: The tool itself ran, so userspace is installed. "Communicate" means it could not reach
      a kernel driver — that is a different layer from the hardware.
    next_on: command_success
  - step: 2
    title: Check the hardware layer on the PCIe bus
    instruction: List NVIDIA devices on the PCIe bus to prove the cards are physically present.
    command: lspci | grep -i nvidia
    expected_output: Eight 3D controller lines for NVIDIA H100 80GB HBM3
    explanation: PCIe enumeration happens at boot, independent of any driver. Cards listed here are seated
      and powered — so this is not a hardware failure.
    next_on: command_success
  - step: 3
    title: Check the kernel module layer
    instruction: List loaded kernel modules and filter for nvidia.
    command: lsmod | grep nvidia
    expected_output: No output — no NVIDIA module is resident
    explanation: Empty output isolates the fault. The hardware is present and the tools are installed,
      so the missing piece is the driver between them.
    next_on: command_success
  - step: 4
    title: Load the driver
    instruction: Load the NVIDIA kernel module, then confirm it is resident.
    command: modprobe nvidia
    expected_output: No output — modprobe is silent on success
    explanation: modprobe inserts the module and its dependencies (nvidia_uvm for unified memory, nvidia_drm
      for display) into the running kernel. It is reversible with `modprobe -r nvidia`.
    next_on: command_success
  - step: 5
    title: Verify and read the table
    instruction: Re-run the grader's check and read the device table rather than just accepting it.
    command: nvidia-smi
    expected_output: The device table, banner containing `NVIDIA-SMI`, 8 GPUs, ~81559MiB HBM per card
    explanation: Note the driver and CUDA versions in the banner and the per-card HBM usage — that memory
      is on the GPU die, not host RAM. The lab passes only when real device state is healthy.
    next_on: command_success
