what_you_will_learn:
- What the NVIDIA kernel module is, how it differs from userspace tools like nvidia-smi and nvcc, and
  why only one of them can be "missing" at a time
- How to read PCIe evidence with lspci to prove GPUs are physically present before suspecting hardware
  failure
- How to load a kernel module with modprobe and confirm residency with lsmod
- How to read an nvidia-smi table — GPU count, driver and CUDA version, and HBM memory usage per card
