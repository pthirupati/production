description: 'CONTEXT: This is your first GPU lab. Nothing here is an outage — you have been handed a
  freshly imaged 8-GPU training node and asked to certify it before the ML team schedules work on it.
  Read the whole ticket before you type anything; the point of this lab is learning to tell "the hardware
  is missing" apart from "the driver is missing", which is the single most common wrong diagnosis on
  GPU fleets.

  ENVIRONMENT: One node, `lab-primary`, with 8× NVIDIA H100 80GB HBM3 cards. Two pieces of software sit
  between you and those cards, and you must keep them straight:

  • The KERNEL MODULE (`nvidia.ko`) — driver code loaded into the running Linux kernel. It is what actually
  talks to the card over PCIe. `lsmod` lists it; `modprobe` loads it.

  • The USERSPACE tools (`nvidia-smi`, CUDA runtime, `nvcc`) — ordinary programs. They are installed on
  disk whether or not the kernel module is loaded, and they fail with a *communication* error when it
  is not.

  Two more terms you will see in the output: PCIE is the bus the cards are physically attached to, so
  a card shows up on the PCIe bus as soon as it is seated — before any driver exists. HBM (High Bandwidth
  Memory) is the 80GB of memory stacked on each H100 die; `nvidia-smi` reports it as Memory-Usage, and
  it is separate from host RAM.

  SYMPTOM / STARTING STATE: The node boots and is reachable. `nvidia-smi` refuses to report anything.
  Nothing is on fire and no user is affected — this is pre-production certification, so take your time
  and observe before acting.

  OBJECTIVE: Learn to read the GPU software stack from the bottom up, and prove the node is usable. Work
  out for yourself, from evidence, whether the cards are absent or merely unclaimed by a driver, then
  bring the node to a healthy state. Acceptance criteria: `nvidia-smi` returns the device table (its
  banner line contains `NVIDIA-SMI`) instead of the driver-communication error.

  WORK TO DO: Answer these three questions in order, with a command for each, and note the answer before
  moving on. (1) Are the cards physically present on the PCIe bus? (2) Is the kernel module loaded? (3)
  Is the userspace tooling installed? Only after all three answers are in should you change anything —
  and the change is a single command. Do not reinstall drivers or reboot; neither is the answer here,
  and both destroy the evidence you just gathered.

  VERIFY: Re-run the check the grader uses — `nvidia-smi` — and confirm you get the table. Then read the
  table rather than just accepting it: how many GPUs, what driver and CUDA version, how much HBM per card,
  and how much of it is already in use. Confirm with `lsmod | grep nvidia` that the module you loaded
  is now resident. Success criteria: both hold on a repeat check.

  ROLLBACK: Every change in this lab is one `modprobe` away from being undone (`modprobe -r nvidia`).
  If you want to see the failure mode again to confirm cause and effect, unload the module, re-run `nvidia-smi`,
  and load it back. That round trip is the lesson.

  WHAT TO AVOID: Do not skip the observation steps and jump straight to the fix — you will pass the checker
  and learn nothing. Do not conclude "the GPUs are dead" from `nvidia-smi` alone; that error message is
  about the driver, not the hardware. Do not fake completion with marker files — the checker reads real
  device state.'
objectives:
- Distinguish the NVIDIA kernel module from the userspace CUDA tooling, and name which one each command
  inspects
- Prove from PCIe evidence that the GPUs are physically present before blaming the hardware
- Load the driver and read the nvidia-smi table — GPU count, driver and CUDA version, and HBM usage per
  card
initial_state: A freshly imaged 8× H100 training node is up and reachable, but no NVIDIA kernel module
  has been loaded yet, so nvidia-smi cannot reach the cards. The cards themselves are seated and visible
  on the PCIe bus. Nothing is on fire — this is pre-production certification, so focus on observation.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not fix anything yet. Run `nvidia-smi` and read its error carefully: "couldn''t communicate with
    the NVIDIA driver". Note the word *communicate* — the tool ran, so the tool is installed; it could
    not reach a driver. That single sentence already rules out "nvidia-smi is missing" and points at the
    kernel module layer. Write down what you expect to find before you look.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work bottom-up through the stack, because each layer depends on the one below: hardware on the PCIe
    bus → kernel module bound to it → userspace tools talking to the module. Confirm each layer before
    suspecting the next. This ordering is why GPU issues get misdiagnosed: people start at `nvidia-smi`
    (the top) and conclude the cards are dead, when the bottom two layers were never checked.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    One command per layer. `lspci | grep -i nvidia` shows what is on the PCIe bus (hardware). `lsmod |
    grep nvidia` lists loaded kernel modules (driver). `modinfo nvidia` asks whether the module exists
    to be loaded at all. `nvcc --version` shows the installed CUDA toolkit (userspace).'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. `lspci | grep -i nvidia` — eight 3D controller lines means the hardware is present and seated. Hardware
    layer: healthy.

    2. `lsmod | grep nvidia` — empty output means no NVIDIA module is resident in the kernel. Driver layer:
    this is your fault domain.

    3. `modinfo nvidia` — tells you whether the module is merely unloaded versus genuinely not installed.
    An "unloaded but installed" module is a one-command fix; a missing one would mean a driver install.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Load the kernel module: `modprobe nvidia`.

    2. Confirm it is now resident: `lsmod | grep nvidia` should list `nvidia`, plus `nvidia_uvm` (unified
    memory) and `nvidia_drm`.

    3. Re-run `nvidia-smi` and read the table: 8 GPUs, driver and CUDA version in the banner, and per-card
    HBM usage in MiB out of ~81559 MiB.

    WHY: the grader queries real device state through the driver, so it only passes once the module is
    actually loaded — there is no marker file to write.'
summary: Learn the GPU software stack — PCIe hardware, kernel module, and userspace CUDA tooling — by
  diagnosing why nvidia-smi cannot see eight healthy H100s
