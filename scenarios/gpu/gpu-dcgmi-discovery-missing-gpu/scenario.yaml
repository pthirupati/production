description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `DCGM Discovery Shows a Missing GPU` during a live incident. Until the underlying hardware/driver state
  is repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: `dcgmi discovery -l` reports 7 GPUs instead of 8, while `nvidia-smi` intermittently
  shows the 8th. nv-hostengine has a stale device list and DCGM group membership is wrong.


  OBJECTIVE: Run dcgmi discovery and confirm the GPU count mismatch versus nvidia-smi; Determine whether
  nv-hostengine has a stale topology or the GPU is genuinely unhealthy; Restore full discovery so all
  8 GPUs are enumerated by DCGM. Success means `check.sh` exits successfully after you apply the documented
  remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: A node that should expose 8 GPUs but `dcgmi discovery -l` only lists 7; the fleet scheduler
  keeps under-allocating this host.
objectives:
- Run dcgmi discovery and confirm the GPU count mismatch versus nvidia-smi
- Determine whether nv-hostengine has a stale topology or the GPU is genuinely unhealthy
- Restore full discovery so all 8 GPUs are enumerated by DCGM
hints:
- order: 1
  cost: 0
  content: 'Where to look: `dcgmi discovery -l` for the DCGM view and compare with `nvidia-smi -L`; check
    `systemctl status nvidia-dcgm` / nv-hostengine.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `dcgmi discovery -l` — count the GPUs DCGM sees.

    2. `nvidia-smi -L` — count what the driver sees.

    3. `systemctl status nvidia-dcgm nv-hostengine` — a stale or crashed hostengine explains a phantom
    count.

    4. `dcgmi group -l` to inspect the default group membership.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Restart the host engine: `systemctl restart nvidia-dcgm` (or `nv-hostengine -t && nv-hostengine`)
    so it re-scans the topology.

    2. Re-run `dcgmi discovery -l` and confirm all 8 GPUs appear.

    3. Apply the documented remediation in /opt/fixitlab/academy/gpu-dcgmi-discovery-missing-gpu.conf.

    WHY: the checker validates DCGM genuinely re-enumerated the fleet.'
