description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `NCCL AllReduce Hangs Across Nodes` during a live incident. Until the underlying hardware/driver state
  is repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The job stalls in `ncclAllReduce`; with `NCCL_DEBUG=INFO` you see it fall
  back to TCP over the wrong interface or fail IB/NVLink transport init, so the collective never completes
  and a watchdog eventually aborts.


  OBJECTIVE: Reproduce the hang and capture NCCL_DEBUG=INFO transport selection; Determine whether NCCL
  picked the wrong NIC/IB HCA or NVLink/P2P is disabled; Set the correct NCCL_SOCKET_IFNAME/NCCL_IB_HCA
  (or re-enable P2P) so the all-reduce completes. Success means `check.sh` exits successfully after you
  apply the documented remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: A multi-node NVIDIA training run that hangs at the first all-reduce; ranks sit at 100%
  SM util doing nothing while NCCL retries the collective.
objectives:
- Reproduce the hang and capture NCCL_DEBUG=INFO transport selection
- Determine whether NCCL picked the wrong NIC/IB HCA or NVLink/P2P is disabled
- Set the correct NCCL_SOCKET_IFNAME/NCCL_IB_HCA (or re-enable P2P) so the all-reduce completes
hints:
- order: 1
  cost: 0
  content: 'Where to look: rerun with `NCCL_DEBUG=INFO NCCL_DEBUG_SUBSYS=INIT,NET` and read which transport/interface
    NCCL selected; check `nvidia-smi topo -m` for NVLink/P2P paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `NCCL_DEBUG=INFO` — look for ''Using network Socket'' when IB was expected, or ''NET/IB : No device
    found''.

    2. `ibstat` / `ip -o link` — confirm the intended RDMA HCA / NIC name.

    3. `nvidia-smi topo -m` — verify NVLink (NV#) between local GPUs, not just PIX/SYS.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Pin the fabric: export `NCCL_IB_HCA=mlx5_0` and `NCCL_SOCKET_IFNAME=bond0` (or re-enable P2P/NVLink),
    then relaunch.

    2. Confirm `ncclAllReduce` completes and `nccl-tests all_reduce_perf` reports expected busbw.

    3. Record the remediation in /opt/fixitlab/academy/gpu-nccl-allreduce-hang.conf.

    WHY: the checker validates the collective genuinely completes.'
