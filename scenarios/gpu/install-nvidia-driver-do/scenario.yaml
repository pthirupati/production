description: 'CONTEXT: A team operating GPU operations needs you to resolve `Install NVIDIA Driver Stack`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux host with an NVIDIA GPU and no driver installed. `nvidia-smi` fails
  because no kernel module is loaded; the GPU is not usable for CUDA. Build task: this host has an NVIDIA
  GPU but no working driver — nvidia-smi reports "NVIDIA-SMI has failed because it couldn''t communicate
  with the NVIDIA driver". Install the NVIDIA driver stack, load the kernel module, and confirm nvidia-smi
  enumerates the GPU.


  OBJECTIVE: Confirm no NVIDIA driver/module is currently loaded; Install the NVIDIA driver package and
  load the kernel module; Verify nvidia-smi enumerates the GPU successfully. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm no NVIDIA driver/module is currently loaded
- Install the NVIDIA driver package and load the kernel module
- Verify nvidia-smi enumerates the GPU successfully
initial_state: Linux host with an NVIDIA GPU and no driver installed. `nvidia-smi` fails because no kernel
  module is loaded; the GPU is not usable for CUDA.
hints:
