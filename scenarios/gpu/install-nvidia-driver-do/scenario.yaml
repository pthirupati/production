description: 'CONTEXT: A team operating GPU operations has raised a ticket for `Install NVIDIA Driver
  Stack`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node. The architecture is a single lab-primary
  node exposing nvidia-smi, drivers, CUDA, and container toolkit; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux host with an NVIDIA GPU and no driver installed. `nvidia-smi` fails
  because no kernel module is loaded; the GPU is not usable for CUDA.


  OBJECTIVE: Confirm no NVIDIA driver/module is currently loaded; Install the NVIDIA driver package and
  load the kernel module; Verify nvidia-smi enumerates the GPU successfully. Acceptance criteria: the
  change is minimal and reversible, and success means `nvidia-smi` includes `NVIDIA-SMI`.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant nvidia-smi, drivers, CUDA, and container toolkit), changing one thing at a time.
  Check your work continuously against the objective — success means `nvidia-smi` includes `NVIDIA-SMI`.


  VERIFY: Re-run the same check the grader uses and confirm `nvidia-smi` includes `NVIDIA-SMI`. Capture
  the before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm no NVIDIA driver/module is currently loaded
- Install the NVIDIA driver package and load the kernel module
- Verify nvidia-smi enumerates the GPU successfully
initial_state: Linux host with an NVIDIA GPU and no driver installed. `nvidia-smi` fails because no kernel
  module is loaded; the GPU is not usable for CUDA.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: install NVIDIA driver stack is not behaving
    as the scenario objectives require. This lab is about install NVIDIA driver stack — how install NVIDIA
    driver stack behaves in a GPU operations environment. Read the objectives and the current state, and
    note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For install NVIDIA driver stack problems the reliable method is:
    (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component that
    owns the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small, reversible
    steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `nvidia-smi` shows the container Up.


    WHY: the checker validates the container is actually running.'
