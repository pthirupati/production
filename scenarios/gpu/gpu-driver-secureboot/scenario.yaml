title: GPU Driver Unsigned Under Secure Boot
slug: gpu-driver-secureboot
technology: GPU
category: Driver
difficulty: hard
lab_mode: simulation
simulation_type: gpu
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
