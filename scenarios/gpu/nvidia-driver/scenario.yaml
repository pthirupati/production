category: Fix
description: 'CONTEXT: A team operating GPU operations needs you to resolve `NVIDIA Driver Missing` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux host with an NVIDIA GPU. The nvidia kernel module is not loaded, so
  nvidia-smi can''t talk to the driver and the GPU is unavailable to applications. nvidia-smi fails with
  "NVIDIA-SMI has failed because it couldn''t communicate with the NVIDIA driver" even though the GPU
  is in the machine. The kernel module isn''t loaded — the driver was never installed, or a kernel update
  left the module unbuilt. Restore the driver/module so the GPU is detected.


  OBJECTIVE: Confirm the nvidia kernel module is not loaded; Install/rebuild and load the driver module;
  Verify nvidia-smi communicates with the driver and lists the GPU. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `nvidia-smi` shows the container Up.


    WHY: the checker validates the container is actually running.'
