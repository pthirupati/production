title: CUDA Driver Version Mismatch
slug: sim-gpu-driver-mismatch
category: Fix
difficulty: easy
description: 'CONTEXT: A team operating GPU operations needs you to resolve `CUDA Driver Version Mismatch`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux host with NVIDIA GPU. The CUDA runtime/toolkit is newer than the installed
  driver, so GPU programs abort with "CUDA driver version is insufficient for CUDA runtime version". CUDA
  workloads fail with "CUDA driver version is insufficient for CUDA runtime version". The installed NVIDIA
  kernel driver is older than what the CUDA runtime/toolkit in use requires, so applications can''t initialize
  the GPU. Reconcile the driver and runtime versions so CUDA initializes successfully.


  OBJECTIVE: Read the driver and CUDA runtime versions and confirm the mismatch; Determine the minimum
  driver required by the CUDA version in use; Align driver/runtime versions so CUDA programs initialize.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Linux host with NVIDIA GPU. The CUDA runtime/toolkit is newer than the installed driver,
  so GPU programs abort with "CUDA driver version is insufficient for CUDA runtime version".
