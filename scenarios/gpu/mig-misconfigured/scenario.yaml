title: MIG Partition Misconfigured
slug: sim-gpu-mig
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating GPU operations needs you to resolve `MIG Partition Misconfigured`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Host with a MIG-capable NVIDIA GPU (e.g. A100). MIG is either disabled or
  partitioned into the wrong profile sizes, so the requested MIG instance is unavailable to workloads.
  A workload requesting a MIG GPU instance can''t be scheduled or sees the wrong amount of memory because
  MIG is misconfigured. Either MIG mode isn''t enabled, or the GPU instance / compute instance profile
  created doesn''t match what the job requests. Configure the correct MIG layout so the workload gets
  its slice.


  OBJECTIVE: Inspect current MIG mode and existing GPU/compute instances; Determine the required MIG profile
  for the workload; Create the correct MIG instances and verify they are available. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Host with a MIG-capable NVIDIA GPU (e.g. A100). MIG is either disabled or partitioned into
  the wrong profile sizes, so the requested MIG instance is unavailable to workloads.
