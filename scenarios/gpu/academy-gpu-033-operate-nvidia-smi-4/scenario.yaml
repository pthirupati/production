description: 'CONTEXT: A team operating GPU operations needs you to resolve `gpu: Nvidia-Smi Monitoring
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The GPU node is healthy enough for scheduled work on nvidia-smi monitoring.
  Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine nvidia-smi
  monitoring task safely in gpu. Follow change control — inspect, change, verify — while working with
  utilization, memory, and processes.


  OBJECTIVE: Day-2 nvidia-smi monitoring work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `nvidia-smi`
  includes `NVIDIA-SMI`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
