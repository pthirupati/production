hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nvidia-smi` and `nvidia-smi dmon`.

    2. Write down what looks normal versus wrong or missing for nvidia-smi monitoring.

    3. Recall the core idea: utilization, memory, and processes. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `nvidia-smi` and `nvidia-smi dmon`.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — GPU metrics reflect the running workload.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
