description: 'CONTEXT: A team operating GPU operations needs you to resolve `GPU Containers Broken on
  cgroups v2` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A GPU host whose container runtime config is wrong for cgroups v2. GPU containers
  break after the host moved to cgroups v2 with the wrong runtime config.


  OBJECTIVE: Confirm the issue: GPU not visible under cgroups v2; Apply the documented fix in /etc/nvidia-container-runtime/config.toml;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A GPU host whose container runtime config is wrong for cgroups v2.
objectives:
- 'Confirm the issue: GPU not visible under cgroups v2'
- Apply the documented fix in /etc/nvidia-container-runtime/config.toml
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `nvidia-smi` shows the container Up.


    WHY: the checker validates the container is actually running.'
