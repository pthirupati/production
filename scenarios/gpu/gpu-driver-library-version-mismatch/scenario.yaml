description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `Driver / CUDA Library Version Mismatch` during a live incident. Until the underlying hardware/driver
  state is repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are
  at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Apps abort with `CUDA driver version is insufficient for CUDA runtime version`
  (or ''Failed to initialize NVML: Driver/library version mismatch''). The loaded nvidia.ko does not match
  the installed libnvidia-ml / libcuda after a partial upgrade.


  OBJECTIVE: Reproduce the mismatch and read the driver version from the kernel vs userspace libraries;
  Determine whether the kernel module or the userspace libraries are stale; Reconcile the versions (reload
  the matching module or reinstall the driver) so CUDA initializes. Success means `check.sh` exits successfully
  after you apply the documented remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: A node where nvidia-smi works but CUDA apps fail with 'CUDA driver version is insufficient
  for CUDA runtime version'; a partial package upgrade left userspace libraries ahead of the kernel driver.
objectives:
- Reproduce the mismatch and read the driver version from the kernel vs userspace libraries
- Determine whether the kernel module or the userspace libraries are stale
- Reconcile the versions (reload the matching module or reinstall the driver) so CUDA initializes
hints:
- order: 1
  cost: 0
  content: 'Where to look: `nvidia-smi` (driver version), `cat /proc/driver/nvidia/version` (loaded module),
    and `modinfo nvidia | grep version` versus the installed libnvidia-ml package.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `cat /proc/driver/nvidia/version` — the running kernel module version.

    2. `modinfo nvidia | grep ^version` and `rpm -q nvidia-driver` (or dpkg) — the installed version.

    3. A ''Driver/library version mismatch'' from NVML confirms userspace and kernel diverged.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Reload the matching kernel module (`rmmod nvidia* && modprobe nvidia`) or finish the driver upgrade
    so kernel and userspace match; a reboot applies a freshly installed module.

    2. Re-run `nvidia-smi` and a CUDA sample; confirm no version-mismatch error.

    3. Record the remediation in /opt/fixitlab/academy/gpu-driver-library-version-mismatch.conf.

    WHY: the checker validates CUDA genuinely initializes.'
