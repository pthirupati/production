description: 'CONTEXT: A team operating GPU operations needs you to resolve `gpu: Power Management — Automation
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for power management. Automate the boring
  parts without hiding important safety checks. Automation lab: remove toil around power management. Codify
  repeatable steps for power limits and persistence mode and prove the automation is idempotent.


  OBJECTIVE: Day-2 power management work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `nvidia-smi` includes
  `NVIDIA-SMI`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 power management work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for power management. Automate the boring parts without
  hiding important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nvidia-smi -q -d POWER`.

    2. Write down what looks normal versus wrong or missing for power management.

    3. Recall the core idea: power limits and persistence mode. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `nvidia-smi -q -d POWER`.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — power limits are set appropriately.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
