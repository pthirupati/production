title: 'GPU ↔ Kubernetes: Device Plugin Won''t Expose nvidia.com/gpu'
slug: gpu-k8s-device-plugin-daemonset
technology: gpu
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating GPU operations has raised a ticket for `GPU ↔ Kubernetes: Device
  Plugin Won''t Expose nvidia.com/gpu`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node. The architecture is a single lab-primary
  node exposing nvidia-smi, drivers, CUDA, and container toolkit; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A GPU node feeding a Kubernetes cluster. The NVIDIA container runtime is not
  the

  default, and /etc/nvidia-container-runtime/k8s-device-plugin.yaml (the device

  plugin DaemonSet) is misconfigured, so `nvidia.com/gpu` is never advertised.


  OBJECTIVE: Confirm no node advertises nvidia.com/gpu and GPU pods are Pending; Set the NVIDIA runtime
  as default and correct the device-plugin DaemonSet manifest (image, device-plugins mount); Confirm the
  manifest is corrected so the plugin registers and GPUs become schedulable. Acceptance criteria: the
  change is minimal and reversible, and success means `nvidia-smi` includes `NVIDIA-SMI`.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant nvidia-smi, drivers, CUDA, and container toolkit), changing one thing at a time.
  Check your work continuously against the objective — success means `nvidia-smi` includes `NVIDIA-SMI`.


  VERIFY: Re-run the same check the grader uses and confirm `nvidia-smi` includes `NVIDIA-SMI`. Capture
  the before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
