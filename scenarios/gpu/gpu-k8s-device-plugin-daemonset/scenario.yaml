title: 'GPU ↔ Kubernetes: Device Plugin Won''t Expose nvidia.com/gpu'
slug: gpu-k8s-device-plugin-daemonset
technology: gpu
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating GPU operations needs you to resolve `GPU ↔ Kubernetes: Device
  Plugin Won''t Expose nvidia.com/gpu` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A GPU node feeding a Kubernetes cluster. The NVIDIA container runtime is not
  the

  default, and /etc/nvidia-container-runtime/k8s-device-plugin.yaml (the device

  plugin DaemonSet) is misconfigured, so `nvidia.com/gpu` is never advertised. CROSS-TECHNOLOGY task (GPU
  <-> Kubernetes). GPU jobs sit Pending on the cluster

  because no node advertises the `nvidia.com/gpu` resource. The NVIDIA device-plugin

  DaemonSet manifest at /etc/nvidia-container-runtime/k8s-device-plugin.yaml is

  broken: the container runtime is not set to `nvidia` in the runtime config it

  references, the DaemonSet uses the wrong image tag, and it lacks the privileged

  /var/lib/kubelet/device-plugins mount — so the plugin never registers the GPU.

  Reconcile the GPU runtime + device-plugin manifest so the cluster can schedule

  GPU workloads.


  OBJECTIVE: Confirm no node advertises nvidia.com/gpu and GPU pods are Pending; Set the NVIDIA runtime
  as default and correct the device-plugin DaemonSet manifest (image, device-plugins mount); Confirm the
  manifest is corrected so the plugin registers and GPUs become schedulable. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A GPU node feeding a Kubernetes cluster. The NVIDIA container runtime is not the

  default, and /etc/nvidia-container-runtime/k8s-device-plugin.yaml (the device

  plugin DaemonSet) is misconfigured, so `nvidia.com/gpu` is never advertised.

  '
