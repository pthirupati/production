description: 'CONTEXT: A team operating GPU operations needs you to resolve `gpu: Mig Partitioning — Troubleshooting
  Drill` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The GPU node is degraded. Gpu is not partitioned for multi-tenant use. Recent
  changes may exist around MIG partitioning, but do not restart blindly — gather evidence first. Production
  alert: GPU is not partitioned for multi-tenant use. You are on call for gpu and must troubleshoot MIG
  partitioning methodically — triage symptoms, isolate root cause, apply the smallest safe fix, and confirm
  recovery.


  OBJECTIVE: The incident symptom is clear: GPU is not partitioned for multi-tenant use; Root cause is
  isolated with evidence, not guesswork; Service behavior returns to normal after the fix. Success means
  `nvidia-smi` includes `NVIDIA-SMI`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: GPU is not partitioned for multi-tenant use'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The GPU node is degraded. Gpu is not partitioned for multi-tenant use. Recent changes may
  exist around MIG partitioning, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nvidia-smi mig -lgip` and instances.

    2. Write down what looks normal versus wrong or missing for MIG partitioning.

    3. Recall the core idea: multi-instance GPU profiles. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `nvidia-smi mig -lgip` and instances.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — MIG instances are created and schedulable.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
