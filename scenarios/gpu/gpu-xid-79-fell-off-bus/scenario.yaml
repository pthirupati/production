description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `Xid 79 GPU Lost From the Bus` during a live incident. Until the underlying hardware/driver state is
  repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: `dmesg | grep -i xid` shows `NVRM: Xid ... 79, GPU has fallen off the bus`.
  Xid 79 is the driver''s report that it lost PCIe communication with the GPU — usually power delivery,
  thermal, or a seating/link fault.


  OBJECTIVE: Confirm the Xid 79 events in dmesg and map them to the affected GPU; Investigate the likely
  cause (power, thermal, or PCIe link) behind the repeated Xid 79; Recover the GPU and confirm no further
  Xid 79 under load. Success means `check.sh` exits successfully after you apply the documented remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: A node repeatedly logging Xid 79 (GPU has fallen off the bus); the affected GPU disappears
  from nvidia-smi and the run aborts each time it recurs.
objectives:
- Confirm the Xid 79 events in dmesg and map them to the affected GPU
- Investigate the likely cause (power, thermal, or PCIe link) behind the repeated Xid 79
- Recover the GPU and confirm no further Xid 79 under load
hints:
- order: 1
  cost: 0
  content: 'Where to look: `dmesg -T | grep -i xid` and NVIDIA''s Xid reference — Xid 79 = GPU fell off
    the bus; capture the PCIe BDF and any preceding Xid.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `dmesg -T | grep -i ''Xid''` — confirm Xid 79 and the GPU BDF.

    2. `nvidia-smi` — the GPU is missing after the event.

    3. `nvidia-smi -q -d POWER,TEMPERATURE` on siblings and `lspci -vvv -s <bdf> | grep -i lnksta` for
    a link/power cause.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Reset the GPU (`nvidia-smi -r -i <id>`), and address the root cause (reseat, fix power cabling,
    or restore cooling) so Xid 79 does not recur.

    2. Confirm the GPU is back in `nvidia-smi` and `dcgmi diag -r 1` passes with no new Xid.

    3. Record the remediation in /opt/fixitlab/academy/gpu-xid-79-fell-off-bus.conf.

    WHY: the checker validates the GPU genuinely returned.'
