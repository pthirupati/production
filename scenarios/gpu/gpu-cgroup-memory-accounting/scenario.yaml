description: Host memory pressure from GPU jobs is invisible because cgroup memory accounting is off.
initial_state: A GPU host with memory accounting disabled.
objectives:
- 'Confirm the issue: No memory accounting for GPU jobs'
- Apply the documented fix in /etc/gpu/cgroup-accounting.conf
- Verify the configuration is corrected
hints:
- order: 1
  cost: 10
  content: No memory accounting for GPU jobs
- order: 2
  cost: 15
  content: Enable cgroup memory accounting.
- order: 3
  cost: 20
  content: /etc/gpu/cgroup-accounting.conf carries the corrected configuration.
