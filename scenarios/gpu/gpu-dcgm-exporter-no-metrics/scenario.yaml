description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `dcgm-exporter Serving No Metrics` during a live incident. Until the underlying hardware/driver state
  is repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: `curl -s localhost:9400/metrics` returns nothing (or connection refused).
  The dcgm-exporter can''t reach nv-hostengine, or its metrics CSV/config points at fields DCGM isn''t
  collecting, so Prometheus scrapes an empty target.


  OBJECTIVE: Confirm dcgm-exporter is up but /metrics on :9400 is empty or refused; Determine whether
  nv-hostengine is unreachable or the exporter''s field CSV is wrong; Restore metric export and confirm
  DCGM_FI_DEV_GPU_UTIL is scraped. Success means `check.sh` exits successfully after you apply the documented
  remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: A Kubernetes GPU node where Prometheus shows the dcgm-exporter target DOWN; /metrics returns
  empty and GPU dashboards went blank fleet-wide.
objectives:
- Confirm dcgm-exporter is up but /metrics on :9400 is empty or refused
- Determine whether nv-hostengine is unreachable or the exporter's field CSV is wrong
- Restore metric export and confirm DCGM_FI_DEV_GPU_UTIL is scraped
hints:
- order: 1
  cost: 0
  content: 'Where to look: `curl -s http://localhost:9400/metrics | head` and `systemctl status dcgm-exporter
    nvidia-dcgm`; check the exporter''s `-f` CSV of DCGM fields.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `curl -s localhost:9400/metrics | wc -l` — zero lines means no export.

    2. `journalctl -u dcgm-exporter --since ''-10 min''` for ''Failed to connect to nv-hostengine''.

    3. Inspect the metrics CSV referenced by `-f /etc/dcgm-exporter/*.csv` for invalid field IDs.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Start/restart nv-hostengine (`systemctl restart nvidia-dcgm`), then restart dcgm-exporter, and
    correct the field CSV.

    2. Re-run `curl -s localhost:9400/metrics | grep DCGM_FI_DEV_GPU_UTIL` and confirm real samples.

    3. Apply the documented remediation in /opt/fixitlab/academy/gpu-dcgm-exporter-no-metrics.conf.

    WHY: the checker validates metrics genuinely flow again.'
