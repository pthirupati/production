title: NVSwitch Fabric Manager Misconfigured
slug: gpu-fabric-manager-down
technology: gpu
category: Build
difficulty: hard
lab_mode: simulation
simulation_type: gpu
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: 'CONTEXT: A team operating GPU operations needs you to resolve `NVSwitch Fabric Manager Misconfigured`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GPU node with nvidia-smi, drivers, CUDA, and container
  toolkit. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A multi-GPU NVSwitch host whose Fabric Manager configuration is wrong, blocking
  GPU peering. On an NVSwitch system, GPUs can''t form the fabric because Fabric Manager is misconfigured,
  breaking multi-GPU NCCL. Fix the config and confirm it is corrected.


  OBJECTIVE: Confirm the fabric won''t form; Correct the Fabric Manager config; Verify the fabric config
  is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A multi-GPU NVSwitch host whose Fabric Manager configuration is wrong, blocking GPU peering.
objectives:
- Confirm the fabric won't form
- Correct the Fabric Manager config
- Verify the fabric config is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `nvidia-smi` shows the container Up.


    WHY: the checker validates the container is actually running.'
summary: Complete the nvswitch fabric manager misconfigured gpu lab and verify success with the checker
