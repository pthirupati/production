description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `rocm-smi Shows Degraded xGMI Links` during a live incident. Until the underlying hardware/driver state
  is repaired, GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: `rocm-smi --showtopo` shows xGMI links negotiated below full width/speed between
  some accelerators, so intra-node all-reduce falls back to slower paths and busbw collapses.


  OBJECTIVE: Read rocm-smi xGMI topology and identify the links running below full width; Correlate the
  degraded link with reset counts or a marginal device; Restore full xGMI width and confirm topology +
  bandwidth are healthy. Success means `check.sh` exits successfully after you apply the documented remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: An MI300X node where `rocm-smi --showtopo` reports some xGMI links running at reduced width;
  multi-GPU collectives are 3x slower than the sister nodes.
objectives:
- Read rocm-smi xGMI topology and identify the links running below full width
- Correlate the degraded link with reset counts or a marginal device
- Restore full xGMI width and confirm topology + bandwidth are healthy
hints:
- order: 1
  cost: 0
  content: 'Where to look: `rocm-smi --showtopo` and `rocm-smi --shownodesbw` for the fabric matrix; check
    per-GPU reset counts with `rocm-smi -a | grep -i reset`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `rocm-smi --showtopo` — find the accelerator pair with reduced xGMI width.

    2. `rocm-smi --shownodesbw` — measured bandwidth confirms the degraded path.

    3. `dmesg | grep -iE ''xgmi|amdgpu.*reset''` for link-training or reset events.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Reset the marginal accelerator (`amd-smi reset -G <id>`) to re-train xGMI, or reseat if it will
    not renegotiate.

    2. Re-run `rocm-smi --showtopo` and confirm every xGMI link is full width.

    3. Apply the documented remediation in /opt/fixitlab/academy/gpu-rocm-smi-xgmi-degraded.conf.

    WHY: the checker validates the fabric genuinely recovered.'
