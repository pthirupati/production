description: 'CONTEXT: An SRE/GPU-infrastructure team running a datacenter accelerator fleet must resolve
  `H100 Fell Off the PCIe Bus` during a live incident. Until the underlying hardware/driver state is repaired,
  GPU capacity is lost and training/inference jobs fail, so throughput and SLAs are at risk.


  ENVIRONMENT: You are on a FixitLab offline GPU node with nvidia-smi, the NVIDIA driver/CUDA stack, DCGM
  (dcgmi / nv-hostengine / dcgm-exporter), the container toolkit, and — for AMD hosts — the ROCm stack
  (rocm-smi / amd-smi). All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: dmesg shows `NVRM: GPU at 0000:8a:00.0 has fallen off the bus.` GPU4 no longer
  appears in nvidia-smi, `lspci` shows the device but reads return 0xffffffff, and the training job died
  with an unrecoverable ECC/NVLink error.


  OBJECTIVE: Confirm GPU4 has fallen off the PCIe bus and collect the NVRM dmesg evidence; Correlate the
  drop with a power, thermal, or Xid event in the logs; Reset the device (nvidia-smi -r / GPU reset) or
  reseat via the fix, then confirm it returns. Success means `check.sh` exits successfully after you apply
  the documented remediation.


  WHAT TO AVOID: Do not apply broad destructive changes, disable safety limits to mask the fault, skip
  evidence gathering, or fake completion with marker files — the checker validates real system state.'
initial_state: An 8x H100 SXM node where GPU4 dropped off the PCIe bus mid-training; nvidia-smi shows
  'GPU has fallen off the bus' and the run crashed with a NCCL timeout.
objectives:
- Confirm GPU4 has fallen off the PCIe bus and collect the NVRM dmesg evidence
- Correlate the drop with a power, thermal, or Xid event in the logs
- Reset the device (nvidia-smi -r / GPU reset) or reseat via the fix, then confirm it returns
hints:
- order: 1
  cost: 0
  content: 'Where to look: `dmesg -T | grep -i ''fallen off the bus''` and `nvidia-smi -q -i 4` to see
    which physical GPU dropped, and `lspci -vvv -s 8a:00.0` to check the link state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `dmesg -T | grep -iE ''nvrm|fallen off|xid''` — capture the exact PCIe address and Xid.

    2. `nvidia-smi` — note the missing GPU index.

    3. `nvidia-smi -q | grep -iE ''ecc|power|temp''` on the surviving GPUs for a common cause.

    4. `cat /sys/bus/pci/devices/0000:8a:00.0/current_link_speed` for a degraded link.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Attempt an in-band reset: `nvidia-smi -r -i 4` (or drain + `nvidia-smi --gpu-reset`); if the link
    is dead, schedule a reseat/power-cycle.

    2. Confirm all 8 GPUs are back in `nvidia-smi` and `dcgmi diag -r 1` passes.

    3. Record the remediation in /opt/fixitlab/academy/gpu-h100-fallen-off-bus-pcie.conf.

    WHY: the checker validates the GPU genuinely returned to the bus.'
