title: Windows Scheduled Task Not Running
slug: win-scheduled-task-not-running
technology: Windows Server
category: Automation
difficulty: easy
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: A nightly backup scheduled task never runs because its run-as account password expired. Update
  the credentials and confirm the task runs on schedule.
initial_state: A Windows Server scheduled task that fails to start because the stored run-as credentials
  are stale.
objectives:
- Confirm the scheduled task last-run result is a logon failure
- Update the task's run-as credentials
- Run the task on demand and verify success
hints:
- order: 1
  cost: 10
  content: schtasks shows last result 0x4xxxxx logon failure.
- order: 2
  cost: 15
  content: Update the principal password (or use a gMSA).
- order: 3
  cost: 20
  content: Run on demand; result 0x0.
