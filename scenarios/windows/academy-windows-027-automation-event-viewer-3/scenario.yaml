hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — System/Application logs filtered by level and ID.

    2. Write down what looks normal versus wrong or missing for Event Viewer.

    3. Recall the core idea: logs, levels, and event IDs. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Event Viewer.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — System/Application logs filtered by level and
    ID.

    2. Implement the automation with dry-run / check mode, then run it twice — the
    second run must report no changes.

    3. Verify the result — the relevant error events are isolated.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-windows-027-automation-event-viewer-3.conf`,
    then click Check Solution.'
