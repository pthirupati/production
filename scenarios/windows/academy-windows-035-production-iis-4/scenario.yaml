description: 'CONTEXT: A team operating Windows Server needs you to resolve `windows: Iis — Production
  Readiness` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but IIS is not production ready — missing guardrails,
  runbooks, or capacity checks. Production readiness for IIS. Harden, document, and validate sites, bindings,
  app pools, and TLS so the change is safe to run during a maintenance window.


  OBJECTIVE: Day-2 IIS work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 IIS work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but IIS is not production ready — missing guardrails, runbooks,
  or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open Event Viewer (System/Application) and the relevant Services mmc or Server
    Manager role status.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the service state and dependency chain in services.msc.

    2. Read the most recent error in Event Viewer for the failing component.

    3. Use PowerShell (`Get-Service`, `Get-WinEvent`) for scripted evidence.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (service start, GPO, binding, or permission).

    2. Re-test the failing operation.

    3. Confirm Check Solution passes.


    WHY: Windows labs grade real role/service state.'
