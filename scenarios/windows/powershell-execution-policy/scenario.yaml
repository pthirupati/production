title: PowerShell Execution Policy Blocking Scripts
slug: win-ps-execution-policy
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `PowerShell Execution Policy
  Blocking Scripts` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 with PowerShell 5.1 or PowerShell 7. The execution policy
  is set to Restricted or AllSigned, blocking unsigned local scripts from running. Scripts needed for
  system administration and automation are failing with a security warning. PowerShell scripts are blocked
  from running due to a restrictive execution policy. Administrators cannot run automation scripts or
  management tools that rely on PowerShell. The execution policy must be set to an appropriate level to
  allow script execution while maintaining reasonable security.


  OBJECTIVE: Identify the current PowerShell execution policy and scope; Set the execution policy to RemoteSigned
  or Unrestricted as appropriate; Verify scripts can run successfully after the policy change. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 with PowerShell 5.1 or PowerShell 7. The execution policy is set to
