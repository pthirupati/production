title: Remote Desktop Licensing Expired
slug: win-rdp-licensing
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `Remote Desktop Licensing
  Expired` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 with Remote Desktop Services (RDS) role installed. The
  RD Session Host is configured but clients are receiving "Remote Session was disconnected because there
  are no Remote Desktop License Servers available" or similar CAL errors. The licensing server may be
  unconfigured, unreachable, or out of CALs. RDP clients are unable to connect to a Remote Desktop Session
  Host because the RD Licensing server has expired CALs or is unreachable. Users receive a licensing error
  on connection. The license server configuration must be corrected and CALs verified to restore RDP access.


  OBJECTIVE: Identify the RD licensing error and current license server configuration; Fix the license
  server configuration or activate the correct CAL type; Verify RDP clients can successfully connect after
  the licensing fix. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
