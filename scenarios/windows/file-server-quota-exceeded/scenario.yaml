title: File Server Quota Exceeded
slug: win-file-quota-exceeded
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `File Server Quota Exceeded`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 with File Server Resource Manager (FSRM) installed. User
  home directories or shared folders have quota limits applied. One or more quotas are at or over the
  hard limit, blocking writes. Old or large files may be consuming the available space. A file server
  quota has been exceeded, preventing users from saving new files to their network share. Users are receiving
  "disk quota exceeded" errors. You must either increase the quota limit, identify and clean up old or
  large files, or configure quota templates appropriately.


  OBJECTIVE: Identify which quotas are exceeded using FSRM or PowerShell; Increase the quota limit or
  remove old files to free space; Verify users can successfully save files after the fix. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 with File Server Resource Manager (FSRM) installed. User home directories
  or shared folders have quota limits applied. One or more quotas are at or over the hard limit, blocking
  writes. Old or large files may be consuming the available space.
objectives:
- Identify which quotas are exceeded using FSRM or PowerShell
- Increase the quota limit or remove old files to free space
- Verify users can successfully save files after the fix
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: true
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
