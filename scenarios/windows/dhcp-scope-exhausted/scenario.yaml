title: DHCP Scope Exhausted
slug: win-dhcp-exhausted
difficulty: medium
category: Windows Server
description: 'The DHCP server scope has no available IP address leases. New devices
  joining the network are unable to obtain an IP address and fall back to APIPA addressing.
  You must either extend the scope range, reduce the lease duration, or clear stale
  leases to restore network connectivity.'
initial_state: 'Windows Server 2022 running DHCP Server role. The primary scope is
  fully allocated with no free addresses. A number of leases may be stale or expired
  but not yet released. New client connections are failing to obtain addresses.'
objectives:
  - Identify the exhausted DHCP scope and review current lease utilization
  - Clear stale or expired leases and optionally extend the scope range
  - Verify new clients can successfully obtain DHCP leases
lab_mode: simulation
simulation_type: windows
time_limit: 1800
max_score: 100
is_free: false
hints:
  - content: 'Check scope utilization: Get-DhcpServerv4ScopeStatistics -ScopeId
      <ScopeID> to see Free, InUse, and Reserved counts.'
    cost: 10
    order: 1
  - content: 'List active leases: Get-DhcpServerv4Lease -ScopeId <ScopeID> | Where-Object
      {$_.AddressState -eq "ActiveReservation"} to identify stale entries.'
    cost: 15
    order: 2
  - content: 'Extend scope: Set-DhcpServerv4Scope -ScopeId <ScopeID> -EndRange <NewEndIP>
      or reduce lease time: Set-DhcpServerv4Scope -ScopeId <ScopeID> -LeaseDuration
      (New-TimeSpan -Hours 8)'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
