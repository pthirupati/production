description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows GUI: Install the
  DHCP Server Role in Server Manager` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A domain-joined Windows Server 2022. In Server Manager the DHCP Server role

  is listed as available but NOT installed (AD DS, DNS and File Services are

  already installed). The learner passes once the DHCP Server role is installed. Network outage: client
  machines on the LAN are stuck on 169.254.x.x APIPA

  addresses because they are not getting DHCP leases. This server was meant to

  be the DHCP server, but the DHCP Server role was never installed after the

  rebuild. Using Server Manager''s Add Roles and Features wizard in the Windows

  Server simulator, install the DHCP Server role so the service can lease

  addresses again.


  OBJECTIVE: Open Server Manager and start the Add Roles and Features wizard; Locate the DHCP Server role
  in the role list; Install the DHCP Server role on this server. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
