description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows RDS Session Host
  Not Accepting Logons` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Windows RDS session host left in ''drain, deny new logons'' after patching,
  so users get blocked. A Remote Desktop Session Host stays in drain mode after maintenance and refuses
  new logons. Clear drain mode and confirm users can connect.


  OBJECTIVE: Confirm the host is in drain mode denying logons; Re-enable new logons; Verify users can
  connect. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
