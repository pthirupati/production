title: Print Spooler Service Crashed
slug: win-print-spooler
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `Print Spooler Service Crashed`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 acting as a print server. The Print Spooler service is
  stopped or crashing on restart. The print queue has stuck or corrupted jobs. Connected clients are unable
  to print and may be showing offline printer status. The Windows Print Spooler service has crashed, preventing
  all printing on the server and connected clients. The print queue may be stuck with corrupted jobs that
  are preventing the spooler from restarting. You must clear the print queue, restart the spooler service,
  and verify printing is restored.


  OBJECTIVE: Confirm the Print Spooler service is stopped and identify stuck print jobs; Clear the print
  queue and remove corrupted spool files; Restart the Print Spooler and verify printers come back online.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 acting as a print server. The Print Spooler service is stopped or crashing
  on restart. The print queue has stuck or corrupted jobs. Connected clients are unable to print and may
