description: 'CONTEXT: A team operating Windows Server needs you to resolve `windows: Active Directory
  — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Windows Server host is online with a starter Active Directory setup. Some
  pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus
  on observation. This beginner-friendly windows lab introduces Active Directory. You will explore domains,
  OUs, replication, and FSMO roles on the Windows Server host. Read the environment first, then follow
  the guided steps — no prior production experience required.


  OBJECTIVE: Understand how Active Directory work in this lab environment; Identify the main status and
  configuration signals for Active Directory; Confirm you can read the current state confidently before
  changing anything. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how Active Directory work in this lab environment
- Identify the main status and configuration signals for Active Directory
- Confirm you can read the current state confidently before changing anything
initial_state: The Windows Server host is online with a starter Active Directory setup. Some pieces are
  intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — ADUC, `dcdiag`, `repadmin`, and event logs.

    2. Write down what looks normal versus wrong or missing for Active Directory.

    3. Recall the core idea: domains, OUs, replication, and FSMO roles. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the service state and dependency chain in services.msc.

    2. Read the most recent error in Event Viewer for the failing component.

    3. Use PowerShell (`Get-Service`, `Get-WinEvent`) for scripted evidence.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — ADUC, `dcdiag`, `repadmin`, and event logs.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — AD is healthy, replication partners agree, and test logon succeeds.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
