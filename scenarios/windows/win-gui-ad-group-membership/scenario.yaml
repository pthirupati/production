description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows GUI: Grant RDP Access
  via Security Group Membership` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A domain-joined Windows Server 2022. The user jsmith is a member of Domain

  Users only and is NOT in Remote Desktop Users, so RDP logon is denied. The

  learner passes once jsmith is a member of Remote Desktop Users. Access request: John Smith (jsmith)
  needs to connect to this server over

  Remote Desktop, but his login is refused with "you must be granted the Allow

  log on through Remote Desktop Services right". The correct, least-privilege

  fix is to add him to the built-in Remote Desktop Users security group rather

  than to Administrators. Using Active Directory Users and Computers in the

  Windows Server simulator, add jsmith to the Remote Desktop Users group.


  OBJECTIVE: Open Active Directory Users and Computers and review jsmith''s group membership; Identify
  the correct group that grants Remote Desktop logon rights; Add jsmith to the Remote Desktop Users security
  group. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
