description: 'CONTEXT: A team operating Windows Server needs you to resolve `windows: Patching — Integration
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for patching. Downstream
  consumers are waiting on this integration path. Integration lab: connect patching with an adjacent platform
  in the windows stack. Validate authentication, data handoff, and failure behavior for Windows Update,
  WSUS, and reboot windows.


  OBJECTIVE: patching is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- patching is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for patching. Downstream consumers
  are waiting on this integration path.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open Event Viewer (System/Application) and the relevant Services mmc or Server
    Manager role status.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the service state and dependency chain in services.msc.

    2. Read the most recent error in Event Viewer for the failing component.

    3. Use PowerShell (`Get-Service`, `Get-WinEvent`) for scripted evidence.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (service start, GPO, binding, or permission).

    2. Re-test the failing operation.

    3. Confirm Check Solution passes.


    WHY: Windows labs grade real role/service state.'
