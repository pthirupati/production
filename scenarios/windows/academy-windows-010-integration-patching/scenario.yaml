description: 'Integration lab: connect Windows patching with an adjacent platform
  in the Windows Server stack. Validate authentication, data handoff, and failure
  behavior for WSUS/Intune, rings, and reboot compliance.'
objectives:
- Windows patching is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for Windows patching.
  Downstream consumers are waiting on this integration path.
hints:
- order: 1
  cost: 10
  content: 'Map the contract: which endpoints, queues, files, or CRDs connect the
    systems?'
- order: 2
  cost: 15
  content: Configure credentials and networking first, then test a minimal happy-path
    transaction.
- order: 3
  cost: 20
  content: Run an end-to-end check plus one failure case. Mark `/opt/fixitlab/academy/academy-windows-010-integration-patching.conf`
    with `# FIXED-OK` when green.
