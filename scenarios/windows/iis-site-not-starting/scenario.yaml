title: IIS Website Not Starting
slug: win-iis-not-starting
difficulty: easy
category: Windows Server
description: 'An IIS website is failing to start due to a port binding conflict or
  application pool crash. Users are unable to access the web application. You must
  identify the conflicting service or the application pool error, resolve the port
  conflict or reconfigure the app pool, and get the site running again.'
initial_state: 'Windows Server 2022 with IIS (Internet Information Services) installed.
  One or more websites are stopped and fail to start. The application pool may be
  stopped or crashed. Another process may be bound to port 80 or 443, preventing
  IIS from binding to those ports.'
objectives:
  - Identify why the IIS website cannot start (port conflict or app pool failure)
  - Resolve the binding conflict or fix the application pool configuration
  - Verify the website starts and responds to HTTP requests
lab_mode: docker
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: true
hints:
  - content: 'Check IIS site and app pool state: Get-Website | Select Name, State,
      PhysicalPath and Get-WebConfiguration system.applicationHost/applicationPools/add
      | Select name, state'
    cost: 10
    order: 1
  - content: 'Find port conflicts: netstat -ano | findstr :80 then tasklist /fi "PID
      eq <PID>" to identify the process holding the port. Stop or reconfigure it.'
    cost: 15
    order: 2
  - content: 'Restart app pool and site: Start-WebAppPool -Name "DefaultAppPool"
      then Start-Website -Name "Default Web Site". Check Windows Event Log for IIS
      errors: Get-EventLog -LogName Application -Source *IIS* -Newest 10'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: High
