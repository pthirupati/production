title: SMB Share Access Denied
slug: win-smb-access-denied
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `SMB Share Access Denied`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 file server with SMB shares configured. Users with correct
  NTFS permissions are being denied access when connecting via UNC path. The share-level permissions (not
  NTFS) are likely set to Everyone Read-only or missing the required user groups entirely. Users are receiving
  access denied errors when connecting to an SMB network share, even though their NTFS permissions appear
  correct. The problem lies with the share-level permissions being more restrictive than the NTFS permissions.
  You must audit and fix both share permissions and NTFS permissions to restore access.


  OBJECTIVE: Identify the mismatch between share permissions and NTFS permissions; Fix share-level permissions
  to grant the appropriate groups access; Verify SMB connectivity and file access for affected users.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 file server with SMB shares configured. Users with correct NTFS permissions
  are being denied access when connecting via UNC path. The share-level permissions (not NTFS) are likely
