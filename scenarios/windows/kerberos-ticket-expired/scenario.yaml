title: Kerberos Ticket Expired
slug: win-kerberos-expired
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `Kerberos Ticket Expired`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 domain environment with Active Directory. Client machines
  or member servers are experiencing Kerberos authentication errors (KDC_ERR_TKT_EXPIRED or CLOCK_SKEW).
  The time difference between a machine and the domain controller exceeds the Kerberos tolerance of 5
  minutes. Kerberos authentication tickets have expired due to a time skew between a domain controller
  and client machines, causing authentication failures across domain resources. You must synchronize the
  system clocks, renew the Kerberos tickets, and verify authentication is restored.


  OBJECTIVE: Identify the time skew between affected machines and the domain controller; Synchronize system
  clocks using w32tm and restore NTP configuration; Clear and renew Kerberos tickets to restore authentication.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 domain environment with Active Directory. Client machines or member
