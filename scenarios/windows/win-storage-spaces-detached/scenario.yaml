title: Windows Storage Spaces Virtual Disk Detached
slug: win-storage-spaces-detached
technology: Windows Server
category: Storage
difficulty: hard
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: true
