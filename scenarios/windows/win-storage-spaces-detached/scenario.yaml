description: A Storage Spaces virtual disk is detached after a disk replacement and the volume is offline.
  Reattach the virtual disk, repair the pool, and bring the volume online.
initial_state: A Windows Storage Spaces pool whose virtual disk detached after a physical disk swap, taking
  a volume offline.
objectives:
- Confirm the virtual disk is detached and volume offline
- Reattach/repair the virtual disk in the pool
- Verify the volume is online and healthy
hints:
- order: 1
  cost: 10
  content: Get-VirtualDisk shows Detached/Unhealthy.
- order: 2
  cost: 15
  content: Connect-VirtualDisk and Repair-VirtualDisk, bring volume online.
- order: 3
  cost: 20
  content: Volume healthy.
