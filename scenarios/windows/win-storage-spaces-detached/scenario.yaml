description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows Storage Spaces Virtual
  Disk Detached` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Windows Storage Spaces pool whose virtual disk detached after a physical
  disk swap, taking a volume offline. A Storage Spaces virtual disk is detached after a disk replacement
  and the volume is offline. Reattach the virtual disk, repair the pool, and bring the volume online.


  OBJECTIVE: Confirm the virtual disk is detached and volume offline; Reattach/repair the virtual disk
  in the pool; Verify the volume is online and healthy. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A Windows Storage Spaces pool whose virtual disk detached after a physical disk swap, taking
  a volume offline.
objectives:
- Confirm the virtual disk is detached and volume offline
- Reattach/repair the virtual disk in the pool
- Verify the volume is online and healthy
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
