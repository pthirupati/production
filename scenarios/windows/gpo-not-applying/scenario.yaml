title: Group Policy Not Applying
slug: win-gpo-not-applying
difficulty: medium
category: Windows Server
description: 'A Group Policy Object is not applying to computers or users in a target
  Organizational Unit. Policy settings are not being enforced despite the GPO being
  linked. The issue may involve a broken GPO link, WMI filter misconfiguration, security
  filtering, or loopback processing settings.'
initial_state: 'Windows Server 2022 with Active Directory and Group Policy Management
  installed. A GPO is linked to an OU but not applying to target objects. GPResult
  may show the GPO as denied or not applied. WMI filters or security group filters
  may be incorrectly configured.'
objectives:
  - Diagnose why the GPO is not applying to the target OU using gpresult and GPMC
  - Fix the GPO link, security filtering, or WMI filter as appropriate
  - Confirm the policy applies correctly after running gpupdate
lab_mode: docker
simulation_type: windows
time_limit: 1800
max_score: 100
is_free: false
hints:
  - content: 'Run GP diagnostics: gpresult /h C:\gpresult.html /F then open the HTML
      report, or gpresult /r /scope computer to see applied and denied GPOs.'
    cost: 10
    order: 1
  - content: 'Check GPO link status in GPMC: Get-GPInheritance -Target "OU=Target,DC=domain,DC=com"
      and verify the GPO is linked and not blocked or disabled.'
    cost: 15
    order: 2
  - content: 'Fix security filtering: Get-GPPermission -Name "GPOName" -All and
      add Authenticated Users read access: Set-GPPermission -Name "GPOName" -TargetName
      "Authenticated Users" -TargetType Group -PermissionLevel GpoRead'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
