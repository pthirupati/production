title: Hyper-V VM in Paused-Critical State
slug: win-hyperv-vm-paused
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `Hyper-V VM in Paused-Critical
  State` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 with Hyper-V role installed. One or more VMs are in paused-critical
  state. The host volume containing VM files is critically low on space. VM checkpoints, old VHDs, or
  other large files may be consuming excess storage. A Hyper-V virtual machine has entered a paused-critical
  state due to insufficient disk space on the host. The VM is suspended and cannot run until the storage
  issue is resolved. You must free storage space on the host and resume the VM to restore service.


  OBJECTIVE: Identify the paused-critical VM and the root cause storage issue; Free sufficient disk space
  on the host to allow the VM to resume; Resume the VM and verify it returns to a running state. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 with Hyper-V role installed. One or more VMs are in paused-critical
  state. The host volume containing VM files is critically low on space. VM checkpoints, old VHDs, or
  other large files may be consuming excess storage.
objectives:
- Identify the paused-critical VM and the root cause storage issue
- Free sufficient disk space on the host to allow the VM to resume
- Resume the VM and verify it returns to a running state
lab_mode: simulation
simulation_type: windows
time_limit: 1800
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
