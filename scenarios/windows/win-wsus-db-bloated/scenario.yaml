description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows WSUS Database Bloated`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Windows WSUS server whose database is bloated with obsolete updates, slowing
  the console and client check-ins. WSUS is slow and clients time out because the SUSDB is full of superseded/declined
  updates. Run cleanup and reindex, then confirm sync/clients work.


  OBJECTIVE: Confirm WSUS is slow due to DB bloat; Decline superseded updates and run server cleanup +
  reindex; Verify the console and client check-ins are healthy. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
