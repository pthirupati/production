description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows GUI: Restore a Stopped
  and Disabled Critical Service` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A domain-joined Windows Server 2022. In the Services console the Print

  Spooler service shows Status = Stopped and Startup Type = Disabled. The

  learner passes once Spooler is Running AND its startup type is Automatic. Printing is down across the
  office. On this print server the Print Spooler

  (Spooler) service is stopped, and worse, someone set its startup type to

  Disabled, so it will not come back on its own and would not survive a reboot.

  Using the Services console in the Windows Server simulator, set Print

  Spooler''s startup type back to Automatic and start the service so printing

  is restored and stays fixed after a restart.


  OBJECTIVE: Open the Services console and find the Print Spooler service; Change the startup type from
  Disabled to Automatic; Start the Print Spooler service so printing is restored. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
