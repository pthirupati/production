title: Windows Update Stuck at 0%
slug: win-update-stuck
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows Update Stuck at 0%`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 with Windows Update stalled. The update process has been
  running for hours without progress. The WUAUSERV, BITS, and Cryptographic services may be hung. The
  SoftwareDistribution folder may contain corrupted download data. Windows Update has been stuck at 0%
  for several hours and is not progressing. The Windows Update service or its dependencies may be in a
  bad state, or the update cache may be corrupted. You must clear the Windows Update cache and restart
  the relevant services to get updates running again.


  OBJECTIVE: Stop all Windows Update related services; Clear the Windows Update cache (SoftwareDistribution
  folder); Restart services and initiate a fresh Windows Update scan. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 with Windows Update stalled. The update process has been running for
