title: Windows Update Stuck at 0%
slug: win-update-stuck
difficulty: easy
category: Windows Server
description: 'Windows Update has been stuck at 0% for several hours and is not progressing.
  The Windows Update service or its dependencies may be in a bad state, or the update
  cache may be corrupted. You must clear the Windows Update cache and restart the
  relevant services to get updates running again.'
initial_state: 'Windows Server 2022 with Windows Update stalled. The update process
  has been running for hours without progress. The WUAUSERV, BITS, and Cryptographic
  services may be hung. The SoftwareDistribution folder may contain corrupted download
  data.'
objectives:
  - Stop all Windows Update related services
  - Clear the Windows Update cache (SoftwareDistribution folder)
  - Restart services and initiate a fresh Windows Update scan
lab_mode: docker
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: true
hints:
  - content: 'Stop WU services: Stop-Service wuauserv, bits, cryptsvc, msiserver
      -Force. Then rename or clear cache: Rename-Item "$env:SystemRoot\SoftwareDistribution"
      "SoftwareDistribution.old"'
    cost: 10
    order: 1
  - content: 'Restart services: Start-Service cryptsvc, bits, msiserver, wuauserv.
      Then trigger a new scan: (New-Object -ComObject Microsoft.Update.AutoUpdate).DetectNow()'
    cost: 15
    order: 2
  - content: 'Run the Windows Update troubleshooter via command line: sfc /scannow
      to fix corruption, then DISM /Online /Cleanup-Image /RestoreHealth to repair
      the Windows image before retrying updates.'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Low
