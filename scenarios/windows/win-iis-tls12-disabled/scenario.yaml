description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows IIS TLS 1.2 Disabled
  Breaks API` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Windows IIS host where over-aggressive hardening disabled TLS 1.2 in the
  SCHANNEL registry. An API on IIS fails handshakes because TLS 1.2 was disabled during hardening while
  clients require it. Re-enable TLS 1.2 (keep 1.0/1.1 off) and confirm handshakes succeed.


  OBJECTIVE: Confirm TLS 1.2 is disabled in SCHANNEL; Re-enable TLS 1.2 server protocol and reboot; Verify
  clients can complete the handshake. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A Windows IIS host where over-aggressive hardening disabled TLS 1.2 in the SCHANNEL registry.
objectives:
- Confirm TLS 1.2 is disabled in SCHANNEL
- Re-enable TLS 1.2 server protocol and reboot
- Verify clients can complete the handshake
