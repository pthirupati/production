title: 'Windows Server: Dns And Dhcp — Troubleshooting Drill'
slug: academy-windows-054-troubleshoot-dns-dhcp-6
technology: Windows Server
category: Troubleshooting
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: clients get no address or cannot resolve names. You
  are on call for Windows Server and must troubleshoot DNS and DHCP methodically —
  triage symptoms, find root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: clients get no address or cannot resolve names'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Windows Server host is degraded. Clients get no address or cannot
  resolve names. Recent changes may exist around DNS and DHCP, but do not restart
  blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Triage: DNS Manager, DHCP scopes, and `ipconfig /all`. Capture timestamps,
    error messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: clients lease an address and resolve names. Document
    the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-windows-054-troubleshoot-dns-dhcp-6.conf`,
    and rerun Check Solution.'
