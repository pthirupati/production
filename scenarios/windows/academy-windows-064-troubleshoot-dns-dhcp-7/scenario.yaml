description: 'CONTEXT: A team operating Windows Server needs you to resolve `windows: Dns And Dhcp — Troubleshooting
  Drill` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Windows Server host is degraded. Clients get no address or cannot resolve
  names. Recent changes may exist around DNS and DHCP, but do not restart blindly — gather evidence first.
  Production alert: clients get no address or cannot resolve names. You are on call for windows and must
  troubleshoot DNS and DHCP methodically — triage symptoms, isolate root cause, apply the smallest safe
  fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: clients get no address or cannot resolve names; Root cause
  is isolated with evidence, not guesswork; Service behavior returns to normal after the fix. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: clients get no address or cannot resolve names'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Windows Server host is degraded. Clients get no address or cannot resolve names. Recent
  changes may exist around DNS and DHCP, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — DNS Manager, DHCP scopes, and `ipconfig /all`.

    2. Write down what looks normal versus wrong or missing for DNS and DHCP.

    3. Recall the core idea: zones, scopes, reservations, and dynamic updates. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the service state and dependency chain in services.msc.

    2. Read the most recent error in Event Viewer for the failing component.

    3. Use PowerShell (`Get-Service`, `Get-WinEvent`) for scripted evidence.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — DNS Manager, DHCP scopes, and `ipconfig /all`.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — clients lease an address and resolve names.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
