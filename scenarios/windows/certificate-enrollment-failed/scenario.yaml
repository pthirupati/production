title: Certificate Enrollment Failed
slug: win-cert-enrollment-fail
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `Certificate Enrollment Failed`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 with Active Directory Certificate Services (AD CS) installed.
  The CA is online but certificate enrollment is failing for domain users. Certificate templates may have
  incorrect permissions or enrollment settings. Users are unable to enroll certificates from the internal
  Certificate Authority. Enrollment requests are failing with access denied or template not found errors.
  The CA permissions and certificate template configuration need to be diagnosed and repaired.


  OBJECTIVE: Identify why certificate enrollment is failing from the CA; Fix certificate template permissions
  and enrollment rights; Verify successful certificate enrollment for affected users. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 with Active Directory Certificate Services (AD CS) installed. The CA
  is online but certificate enrollment is failing for domain users. Certificate templates may have incorrect
  permissions or enrollment settings.
objectives:
- Identify why certificate enrollment is failing from the CA
- Fix certificate template permissions and enrollment rights
- Verify successful certificate enrollment for affected users
