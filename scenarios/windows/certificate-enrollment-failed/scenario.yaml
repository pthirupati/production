title: Certificate Enrollment Failed
slug: win-cert-enrollment-fail
difficulty: medium
category: Windows Server
description: 'Users are unable to enroll certificates from the internal Certificate
  Authority. Enrollment requests are failing with access denied or template not found
  errors. The CA permissions and certificate template configuration need to be diagnosed
  and repaired.'
initial_state: 'Windows Server 2022 with Active Directory Certificate Services (AD
  CS) installed. The CA is online but certificate enrollment is failing for domain
  users. Certificate templates may have incorrect permissions or enrollment settings.'
objectives:
  - Identify why certificate enrollment is failing from the CA
  - Fix certificate template permissions and enrollment rights
  - Verify successful certificate enrollment for affected users
lab_mode: docker
simulation_type: windows
time_limit: 1800
max_score: 100
is_free: false
hints:
  - content: 'Check CA status and templates: certutil -CAInfo and Get-CATemplate |
      Select Name, Oid to list available templates'
    cost: 10
    order: 1
  - content: 'Review template permissions in Certificate Templates console (certtmpl.msc).
      Ensure Domain Users or target group has Enroll and Autoenroll permissions.'
    cost: 15
    order: 2
  - content: 'Force autoenrollment update: certutil -pulse or via GPO: gpupdate /force
      then check Application event log for enrollment errors (Event ID 13, 64).'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
