description: 'CONTEXT: A team operating Windows Server has raised a ticket for `Powershell Administration
  — Security Lab`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host. The architecture is a single
  lab-primary node exposing PowerShell, Server Manager, and AD tools; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around PowerShell administration.
  Assume an auditor or pen test is next week — tighten controls with evidence.


  OBJECTIVE: Unsafe defaults related to PowerShell administration are removed or constrained; Access follows
  least privilege and is auditable; Security checks pass without breaking required functionality. Acceptance
  criteria: the change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant PowerShell, Server Manager, and AD tools), changing one thing at a time. Check your
  work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to PowerShell administration are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around PowerShell administration. Assume
  an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: an admin task must be automated reliably. This
    lab is about PowerShell administration — cmdlets, pipelines, and remoting. Read the objectives and
    the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For PowerShell administration problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one component that owns
    the symptom, (3) change exactly one thing, (4) re-check. Apply least privilege: remove the unsafe
    default, then grant only the explicit access the workload actually needs.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    1. Inspect the current state with `Get-*` cmdlets and `$Error`.

    2. Each command above tells you something specific — status/health, recent errors, and the effective
    configuration. Read them in that order.

    3. Compare what you see to the objectives; the gap points at the fault.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Note the service state and dependency chain in services.msc.

    2. Read the most recent error in Event Viewer for the failing component.

    3. Use PowerShell (`Get-Service`, `Get-WinEvent`) for scripted evidence.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the smallest reversible change your hypothesis points to. Apply least privilege: remove the
    unsafe default, then grant only the explicit access the workload actually needs.

    2. Re-run `bash check.sh` and confirm the script performs the task idempotently.

    3. If it still fails, the hypothesis was wrong — go back to the evidence, do not stack changes.


    WHY: the grader validates real system state, not marker files — a fix only counts when the subsystem
    is actually healthy.'
