title: Windows Service Dependency Failed
slug: win-service-dependency
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows Service Dependency
  Failed` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 with one or more services in a stopped or failed state.
  The primary service cannot start because it depends on another service that is not running. The Windows
  Event Log shows error 1068 or similar dependency errors. Services may need to be started in a specific
  order. A Windows service is failing to start because one or more of its required dependency services
  are stopped or failed. The error log shows a dependency service failure. You must identify the dependency
  chain, start the required services in the correct order, and verify the main service comes online.


  OBJECTIVE: Identify the failing service and its dependency chain; Start the required dependency services
  in the correct order; Confirm the primary service starts successfully. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 with one or more services in a stopped or failed state. The primary
  service cannot start because it depends on another service that is not running. The Windows Event Log
  shows error 1068 or similar dependency errors. Services may need to be started in a specific order.
objectives:
- Identify the failing service and its dependency chain
- Start the required dependency services in the correct order
- Confirm the primary service starts successfully
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: true
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open Event Viewer (System/Application) and the relevant Services mmc or Server
    Manager role status.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the service state and dependency chain in services.msc.

    2. Read the most recent error in Event Viewer for the failing component.

    3. Use PowerShell (`Get-Service`, `Get-WinEvent`) for scripted evidence.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (service start, GPO, binding, or permission).

    2. Re-test the failing operation.

    3. Confirm Check Solution passes.


    WHY: Windows labs grade real role/service state.'
