description: 'CONTEXT: A team operating Windows Server needs you to resolve `windows: Powershell Administration
  — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around PowerShell administration.
  Assume an auditor or pen test is next week — tighten controls with evidence. Security review: harden
  PowerShell administration on this windows system. Close unsafe defaults, enforce least privilege, and
  ensure cmdlets, pipelines, and remoting cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to PowerShell administration are removed or constrained; Access follows
  least privilege and is auditable; Security checks pass without breaking required functionality. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to PowerShell administration are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around PowerShell administration. Assume
  an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `Get-*` cmdlets and `$Error`.

    2. Write down what looks normal versus wrong or missing for PowerShell administration.

    3. Recall the core idea: cmdlets, pipelines, and remoting. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the service state and dependency chain in services.msc.

    2. Read the most recent error in Event Viewer for the failing component.

    3. Use PowerShell (`Get-Service`, `Get-WinEvent`) for scripted evidence.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `Get-*` cmdlets and `$Error`.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — the script performs the task idempotently.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
