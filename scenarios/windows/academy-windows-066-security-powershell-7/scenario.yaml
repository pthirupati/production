title: 'Windows Server: Powershell Administration — Security Practice'
slug: academy-windows-066-security-powershell-7
technology: Windows Server
category: Security
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Security review: harden PowerShell administration on this Windows Server system. Close unsafe
  defaults, enforce least privilege, and ensure cmdlets, pipelines, and remoting cannot be abused — without
  breaking legitimate use.'
objectives:
- Unsafe defaults related to PowerShell administration are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around PowerShell administration. Assume
  an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `Get-*` cmdlets and `$Error`.

    2. Write down what looks normal versus wrong or missing for PowerShell administration.

    3. Recall the core idea: cmdlets, pipelines, and remoting. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for PowerShell administration.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `Get-*` cmdlets and `$Error`.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — the script performs the task idempotently.

    4. Click Check Solution once `systemctl is-active nginx` returns active.'
