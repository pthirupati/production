description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows Failover Cluster
  CSV Redirected Mode` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Windows Failover Cluster whose CSV is in redirected access mode, funneling
  all I/O through the coordinator node. A Cluster Shared Volume is stuck in redirected I/O mode, slowing
  all VMs on it. Find the cause (backup/filter), clear redirected mode, and confirm direct I/O.


  OBJECTIVE: Confirm the CSV is in redirected mode; Clear the cause and return the CSV to direct I/O;
  Verify direct access is restored. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
