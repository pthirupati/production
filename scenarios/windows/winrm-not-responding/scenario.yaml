title: WinRM Not Responding for Remote PowerShell
slug: win-winrm-not-responding
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `WinRM Not Responding for
  Remote PowerShell` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 with WinRM service installed but not properly configured.
  Remote PowerShell commands are failing with connection refused or timeout errors. The WinRM listener
  may not be created, the service may be stopped, or the Windows Firewall may be blocking the WinRM ports
  (5985 HTTP, 5986 HTTPS). WinRM (Windows Remote Management) is not responding, preventing remote PowerShell
  sessions and remote management tools from connecting. The WinRM service may not be configured, the firewall
  may be blocking port 5985/5986, or the listener may be misconfigured. You must diagnose and fix WinRM
  to restore remote management capability.


  OBJECTIVE: Diagnose the WinRM configuration issue preventing remote connections; Configure WinRM listener
  and ensure the firewall allows WinRM traffic; Verify remote PowerShell sessions work successfully after
  the fix. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 with WinRM service installed but not properly configured. Remote PowerShell
  commands are failing with connection refused or timeout errors. The WinRM listener may not be created,
  the service may be stopped, or the Windows Firewall may be blocking the WinRM ports (5985 HTTP, 5986
  HTTPS).
