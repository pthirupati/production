title: WinRM Not Responding for Remote PowerShell
slug: win-winrm-not-responding
difficulty: medium
category: Windows Server
description: 'WinRM (Windows Remote Management) is not responding, preventing remote
  PowerShell sessions and remote management tools from connecting. The WinRM service
  may not be configured, the firewall may be blocking port 5985/5986, or the listener
  may be misconfigured. You must diagnose and fix WinRM to restore remote management
  capability.'
initial_state: 'Windows Server 2022 with WinRM service installed but not properly
  configured. Remote PowerShell commands are failing with connection refused or timeout
  errors. The WinRM listener may not be created, the service may be stopped, or the
  Windows Firewall may be blocking the WinRM ports (5985 HTTP, 5986 HTTPS).'
objectives:
  - Diagnose the WinRM configuration issue preventing remote connections
  - Configure WinRM listener and ensure the firewall allows WinRM traffic
  - Verify remote PowerShell sessions work successfully after the fix
lab_mode: docker
simulation_type: windows
time_limit: 1800
max_score: 100
is_free: false
hints:
  - content: 'Check WinRM status and config: Get-Service WinRM | Select Status and
      winrm enumerate winrm/config/listener to see existing listeners. Test connectivity:
      Test-WSMan -ComputerName <hostname>'
    cost: 10
    order: 1
  - content: 'Enable and configure WinRM quickly: Enable-PSRemoting -Force which
      starts the service, creates a listener, and adds firewall rules. Or manually:
      winrm quickconfig -force'
    cost: 15
    order: 2
  - content: 'Add trusted hosts if in a workgroup: Set-Item WSMan:\localhost\Client\TrustedHosts
      -Value "*" -Force or specify IP ranges. Then test: Enter-PSSession -ComputerName
      <hostname> -Credential (Get-Credential)'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
