title: 'Windows Server: Iis — Production Readiness'
slug: academy-windows-055-production-iis-6
technology: Windows Server
category: Production
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Production readiness for IIS. Harden, document, and validate sites, bindings,
  app pools, and TLS so the change is safe to run during a maintenance window.
objectives:
- Day-2 IIS work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but IIS is not production ready — missing
  guardrails, runbooks, or capacity checks.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — IIS Manager, app pool state, and bindings.

    2. Write down what looks normal versus wrong or missing for IIS.

    3. Recall the core idea: sites, bindings, app pools, and TLS. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for IIS.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — IIS Manager, app pool state, and bindings.

    2. Apply production standards for IIS: resource limits, monitoring, access controls,
    and a written rollback step.

    3. Verify the result — the site serves over the correct binding and certificate.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-windows-055-production-iis-6.conf`,
    then click Check Solution.'
