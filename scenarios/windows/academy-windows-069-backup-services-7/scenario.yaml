title: 'Windows Server: Kubernetes Services — Backup and Recovery'
slug: academy-windows-069-backup-services-7
technology: Windows Server
category: Backup & Recovery
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Backup and recovery drill for Kubernetes Services. Ensure backups run on schedule, retention
  is correct, and you can restore ClusterIP/NodePort/LoadBalancer, selectors, endpoints, and kube-proxy
  routing within the lab RTO.
objectives:
- Backup coverage for Kubernetes Services is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for Kubernetes Services. Leadership wants
  proof that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get svc,endpoints`, `kubectl describe svc`, and pod labels.

    2. Write down what looks normal versus wrong or missing for Kubernetes Services.

    3. Recall the core idea: ClusterIP/NodePort/LoadBalancer, selectors, endpoints, and kube-proxy routing.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Kubernetes Services.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `kubectl get svc,endpoints`, `kubectl describe svc`, and pod labels.

    2. Repair or run the backup job, then perform a controlled restore into a scratch location to prove
    it works.

    3. Verify the result — Service endpoints match ready pods and probes succeed through the Service IP.

    4. Click Check Solution once `systemctl is-active nginx` returns active.'
