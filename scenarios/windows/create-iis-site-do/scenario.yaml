description: 'CONTEXT: A team operating Windows Server needs you to resolve `Create IIS Website` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server with the IIS role available but no application site configured
  yet. You will create the app pool, site, and content. Build task: publish a website on Windows IIS from
  scratch. Starting with no site configured, create a dedicated application pool and an IIS website bound
  to HTTP, drop in a default document, start the site, and verify it returns HTTP 200.


  OBJECTIVE: Create a dedicated IIS application pool; Create a website bound to HTTP (port 80) with a
  physical path and a default document; Start the site and verify it returns HTTP 200. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Create a dedicated IIS application pool
- Create a website bound to HTTP (port 80) with a physical path and a default document
- Start the site and verify it returns HTTP 200
initial_state: Windows Server with the IIS role available but no application site configured yet. You
  will create the app pool, site, and content.
