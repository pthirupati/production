title: SQL Server Login Failed (Error 18456)
slug: win-sql-login-failed
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Windows Server needs you to resolve `SQL Server Login Failed (Error
  18456)` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Windows Server 2022 running SQL Server 2019 or 2022. Applications or users
  are receiving error 18456 on login. The SQL Server may be configured for Windows Authentication only,
  blocking SQL logins. SQL Server logins may be disabled, have incorrect passwords, or be unmapped from
  database users. SQL Server is rejecting logins with error 18456, indicating authentication failure.
  The server may be in Windows Authentication Only mode while application accounts use SQL authentication,
  or SQL user accounts may be unmapped or disabled. You must fix the authentication mode and user mapping
  to restore database connectivity.


  OBJECTIVE: Identify the 18456 error state to determine the specific authentication failure; Enable Mixed
  Mode authentication and fix SQL login or user mapping as needed; Verify applications can successfully
  authenticate after the fix. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Windows Server 2022 running SQL Server 2019 or 2022. Applications or users are receiving
