description: 'CONTEXT: A team operating Windows Server needs you to resolve `windows: File Shares — Observability
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The system runs, but file shares lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality. Observability task: make file shares visible in logs, metrics,
  or traces. On-call should answer ''what is broken?'' quickly using signals from SMB shares, share vs
  NTFS permissions.


  OBJECTIVE: Day-2 file shares work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 file shares work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but file shares lacks useful telemetry. Dashboards/alerts are blank or
  noisy — improve signal quality.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `Get-SmbShare`, share ACLs, and NTFS ACLs.

    2. Write down what looks normal versus wrong or missing for file shares.

    3. Recall the core idea: SMB shares, share vs NTFS permissions. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the service state and dependency chain in services.msc.

    2. Read the most recent error in Event Viewer for the failing component.

    3. Use PowerShell (`Get-Service`, `Get-WinEvent`) for scripted evidence.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `Get-SmbShare`, share ACLs, and NTFS ACLs.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a sensible threshold.

    3. Verify the result — effective permissions match the access requirement.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
