title: 'Windows Server: Powershell Administration — Security Practice'
slug: academy-windows-006-security-powershell
technology: Windows Server
category: Security
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Security review: harden PowerShell administration on this Windows Server
  system. Close unsafe defaults, enforce least privilege, and ensure cmdlets, pipelines,
  and remoting cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to PowerShell administration are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around PowerShell
  administration. Assume an auditor or pen test is next week — tighten controls with
  evidence.
hints:
- order: 1
  cost: 10
  content: 'Baseline current exposure: `Get-*` cmdlets and `$Error`. Note world-readable
    files, open ports, or excessive roles.'
- order: 2
  cost: 15
  content: Apply least privilege incrementally. Prefer explicit allows over broad
    wildcards.
- order: 3
  cost: 20
  content: Re-test legitimate workflows after hardening. Finish with `# FIXED-OK`
    in `/opt/fixitlab/academy/academy-windows-006-security-powershell.conf` and Check
    Solution.
