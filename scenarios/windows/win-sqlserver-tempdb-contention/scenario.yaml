title: Windows SQL Server tempdb Contention
slug: win-sqlserver-tempdb-contention
technology: Windows Server
category: Database
difficulty: hard
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: SQL Server suffers PAGELATCH contention on tempdb because there is a single data file. Add
  multiple equally-sized tempdb files and confirm contention drops.
initial_state: A Windows SQL Server instance with one tempdb data file, causing allocation-page contention
  under load.
objectives:
- Confirm tempdb PAGELATCH contention
- Add multiple equally-sized tempdb files and restart
- Verify contention is reduced
hints:
- order: 1
  cost: 10
  content: sys.dm_os_waiting_tasks shows PAGELATCH on tempdb.
- order: 2
  cost: 15
  content: Add N equal tempdb files (per core, up to 8) and restart.
- order: 3
  cost: 20
  content: Contention drops.
