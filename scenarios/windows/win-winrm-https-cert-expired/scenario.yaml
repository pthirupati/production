title: Windows WinRM HTTPS Listener Cert Expired
slug: win-winrm-https-cert-expired
technology: Windows Server
category: Remoting
difficulty: medium
lab_mode: simulation
simulation_type: windows
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: Remote management over WinRM HTTPS fails because the listener's certificate expired. Bind
  a new certificate to the HTTPS listener and confirm remoting works.
initial_state: A Windows Server whose WinRM HTTPS listener uses an expired certificate, breaking secure
  remote management.
objectives:
- Confirm the WinRM HTTPS listener cert is expired
- Bind a valid certificate to the listener
- Verify a remote PowerShell session connects
hints:
- order: 1
  cost: 10
  content: winrm enumerate winrm/config/listener shows expired thumbprint.
- order: 2
  cost: 15
  content: Create the HTTPS listener with a valid cert thumbprint.
- order: 3
  cost: 20
  content: Remoting works.
