description: Build users and groups from scratch in this Windows Server lab. You start
  from a minimal environment and must produce a working configuration that demonstrates
  how accounts, UIDs/GIDs, primary groups, and supplementary membership are defined.
  Treat this like a greenfield task — plan, implement, then prove it works.
objectives:
- A working users and groups setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
