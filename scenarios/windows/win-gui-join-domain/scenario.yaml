description: 'CONTEXT: A team operating Windows Server needs you to resolve `Windows GUI: Join a New Server
  to the Active Directory` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Windows Server host with PowerShell, Server Manager,
  and AD tools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A standalone Windows Server 2022 in WORKGROUP (computer name WIN-SRV-NEW01).

  System Properties shows no domain, and the Netlogon service is stopped. The

  learner passes once the server is joined to the corp.fixitlab.local domain. Onboarding task: a freshly
  imaged server (WIN-SRV-NEW01) is still sitting in

  WORKGROUP. Because it is not a domain member it cannot use domain accounts,

  receive Group Policy, or talk to the directory (Netlogon is idle). Using the

  System Properties dialog in the Windows Server simulator, join this server to

  the corp.fixitlab.local Active Directory domain so it becomes a managed member

  server.


  OBJECTIVE: Open System Properties and review the current workgroup membership; Change the membership
  from Workgroup to Domain; Join the server to the corp.fixitlab.local domain. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A standalone Windows Server 2022 in WORKGROUP (computer name WIN-SRV-NEW01).

  System Properties shows no domain, and the Netlogon service is stopped. The

