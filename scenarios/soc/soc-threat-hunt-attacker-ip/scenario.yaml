description: 'CONTEXT: Threat intel just shared a fresh IOC — 203.0.113.55, associated with a known C2
  infrastructure cluster — and asked every SOC to hunt for it proactively, not wait for an alert to fire.
  This is the Threat Hunting track: you are not responding to an existing alert, you are actively
  searching raw logs for evidence that this indicator has already touched your environment.

  ENVIRONMENT: You are working in the SOC/SIEM console''s Log Search panel, which indexes raw
  EDR/firewall/sshd events across every monitored asset. The IOC feed gave you the indicator
  (203.0.113.55) but not a specific host or timeframe — you have to hunt for it.

  SYMPTOM / STARTING STATE: No alert currently references 203.0.113.55 by name in this session''s queue —
  the only way to find it is a proactive log search, exactly like a real threat hunt.

  IMPACT: Threat intel indicators are only useful if someone actually checks for them. If 203.0.113.55
  already reached a host and nobody hunts for it, that foothold sits undetected until it escalates into
  something louder (and harder to contain).

  OBJECTIVE: Search the log index for 203.0.113.55 and confirm which host(s) it has already touched.'
initial_state: SOC console Log Search panel with no active search yet; the raw log index contains
  evidence of 203.0.113.55 touching ws-finance-07, but nothing has surfaced it yet.
objectives:
- Sign in to the SOC console
- Open Log Search
- Search for the threat-intel indicator 203.0.113.55
- Confirm which host the indicator touched from the search results
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why: This is a hunt, not a response to an open alert — start
    from the indicator itself (203.0.113.55) and search the raw logs directly, rather than waiting for
    the alert queue to surface something.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method: A proactive threat hunt starts from an indicator (an
    IP, a hash, a domain) and searches broadly across every asset''s logs — you do not yet know which
    host, if any, was touched.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s): In Log Search, query 203.0.113.55. The results will
    show every log entry across every source (EDR, Firewall, sshd) that mentions that address.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem: The indicator you were given is 203.0.113.55 specifically
    — searching for a different address (like the unrelated brute-force source 198.51.100.23) will not
    satisfy this hunt.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it): Run the search for 203.0.113.55
    and confirm the results show ws-finance-07''s EDR/Firewall entries (PowerShell spawn + outbound C2
    connection). WHY: the grader checks that a search for this specific indicator was actually executed
    in the session state — searching for something else, or not searching at all, does not count.'
