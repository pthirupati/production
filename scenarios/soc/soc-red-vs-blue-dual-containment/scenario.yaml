simulation_type: soc
infrastructure_type: docker
time_limit: 900
max_score: 100
is_free: false
jira_priority: Critical
dual_terminal: false
description: 'CONTEXT: This shift is not one alert, it is a coordinated attack: the same operator behind
  the brute-force SSH storm against web01 (AL-1002, source 198.51.100.23) also planted the C2 beacon on
  ws-finance-07 (AL-1003, contacting a known C2 domain). Blue team containment has to close BOTH footholds
  — closing only one leaves the other one live and gives the attacker a way back in.

  ENVIRONMENT: You are working in the SOC/SIEM console against two simultaneous alerts. AL-1002 (brute
  force, web01, source 198.51.100.23) and AL-1003 (C2 beacon, ws-finance-07) are both open. This is the
  Red vs Blue track: the scenario models an attacker actively probing multiple vectors, and blue team''s
  job is complete containment, not a single quick fix.

  SYMPTOM / STARTING STATE: Neither vector is contained — 198.51.100.23 is not blocked, and
  ws-finance-07 is not quarantined. Fixing only one still leaves an active foothold.

  IMPACT: A partial response to a multi-vector attack is a false sense of security — closing the loud
  brute-force vector while missing the quieter C2 beacon (or vice versa) means the attacker keeps their
  foothold and the "incident" reopens later, worse.

  OBJECTIVE: Contain BOTH vectors — block 198.51.100.23 at the firewall AND quarantine ws-finance-07 from
  the network — before considering this incident closed.'
initial_state: SOC console with two open alerts confirmed by threat intel to be the same coordinated
  attacker — AL-1002 (brute force, web01, unblocked) and AL-1003 (C2 beacon, ws-finance-07, unquarantined).
objectives:
- Sign in to the SOC console
- Recognize both alerts as part of the same coordinated attack
- Block 198.51.100.23 at the firewall
- Quarantine ws-finance-07 from the network
- Confirm BOTH containment actions are complete before considering the incident closed
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why: Open both AL-1002 and AL-1003 and note that fixing only one
    of them is a trap in this lab — threat intel has confirmed both alerts are the same actor''s work, so
    partial containment is not real containment here.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method: Treat this as ONE incident with two required
    containment actions, not two separate single-fix alerts. Plan both actions before executing either,
    so you do not walk away after the first one feeling "done."'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s): 1. Use "Block IP" against 198.51.100.23 (the
    brute-force source). 2. Use "Quarantine" against ws-finance-07 (the C2-beaconing host). Order does
    not matter — both must be done.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem: There are exactly two vectors here — the brute-force
    source IP and the beaconing host. No other asset or IP in this session is part of this attack.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it): Block 198.51.100.23 AND
    quarantine ws-finance-07 — check that BOTH now show as contained before you consider this done. WHY:
    the grader checks that both vectors are cleared in the session state — completing only one still
    fails validation, by design, because a multi-vector attack needs multi-vector containment.'
summary: Contain both vectors of a coordinated multi-vector attack — block the brute-force source IP and
  quarantine the C2-beaconing host — before considering the incident closed.
