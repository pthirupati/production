description: 'CONTEXT: A team operating SOC and cybersecurity operations has raised a ticket for `SOC
  Tier-1: C2 Beacon on ws-finance-07 - Contain Before It`. A customer-facing workflow is degraded and
  the on-call engineer (you) must diagnose and resolve it. Business impact: reduced service reliability
  and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline security operations lab. The architecture is a single
  lab-primary node exposing SIEM, EDR, tickets, and investigation timelines; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: SOC console with a new, unacknowledged critical alert (AL-1003) reporting
  a C2 beacon from ws-finance-07, which remains connected to the network with no containment actions taken
  yet. AL-1003 sits in the queue with status "new" — nobody has acknowledged it yet, ws-finance-07 is
  still fully connected to the network, and the attacker''s C2 channel (source IP 203.0.113.55) is still
  open. Every minute this stays open is a minute the attacker can pull more data out or push a second-stage
  payload in.


  OBJECTIVE: Acknowledge critical alert AL-1003; Escalate AL-1003 into a tracked incident; Run the Malware
  Containment playbook (pb-malware-contain). Acceptance criteria: the change is minimal and reversible,
  and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SIEM, EDR, tickets, and investigation timelines), changing one thing at a time. Check
  your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: SOC console with a new, unacknowledged critical alert (AL-1003) reporting a C2 beacon from
