title: 'SOC / SIEM Analyst: Host Firewall — Automation Practice'
slug: academy-soc-117-automation-firewall-12
technology: soc
category: Automation
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: soc
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Service operations lab. The `firewalld` systemd unit is **failed/inactive** on this host
  — a realistic fault for Automation Practice workflows that depend on it. Diagnose with `systemctl status
  firewalld` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active
  firewalld`.
objectives:
- The `firewalld` service is active (running)
- '`systemctl is-active firewalld`` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `firewalld` service is not running (`systemctl is-active firewalld` → inactive/failed).
  Dependent Automation Practice tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: valid traffic is blocked or unexpected ports
    are exposed. This lab is about host firewall — allow/deny rules, zones, services, and rule persistence.
    Read the objectives and the current state, and note precisely what looks wrong versus healthy before
    you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For host firewall problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Implement the automation with dry-run / check mode, then run
    it twice — the second run must report no changes.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `systemctl status firewalld` and `journalctl -u firewalld -n 50`.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm `firewalld` is failed/inactive.

    2. Read the unit journal for the root cause.

    3. Apply the smallest fix that restores the unit.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Repair the underlying config/cause for `firewalld`.

    2. `systemctl enable --now firewalld`.

    3. Verify with `systemctl is-active firewalld` (expect active).'
