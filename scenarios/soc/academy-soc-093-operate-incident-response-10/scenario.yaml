description: Service operations lab. The `gitlab-runner` systemd unit is **failed/inactive** on this host
  — a realistic fault for Daily Operations workflows that depend on it. Diagnose with `systemctl status
  gitlab-runner` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active
  gitlab-runner`.
objectives:
- The `gitlab-runner` service is active (running)
- '`systemctl is-active gitlab-runner`` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `gitlab-runner` service is not running (`systemctl is-active gitlab-runner` → inactive/failed).
  Dependent Daily Operations tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: incidents are handled ad hoc. This lab is about
    incident response — triage, comms, and postmortem. Read the objectives and the current state, and
    note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For incident response problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Check the runner: `systemctl status gitlab-runner`. Inspect CI config under `/opt/ci/.gitlab-ci.yml`
    and `/opt/ci/Jenkinsfile` for failing stages.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm `gitlab-runner` is failed/inactive.

    2. Read `/opt/ci/.gitlab-ci.yml` for BROKEN_PIPELINE / exit 1 steps.

    3. Check `/root/app/.git/config` for a usable remote/branch setup.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Repair the CI pipeline YAML so the build stage succeeds.

    2. `systemctl enable --now gitlab-runner`.

    3. Verify with `systemctl is-active gitlab-runner` (expect active).'
