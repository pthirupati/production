hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: Backup Plans is misconfigured and dependent
    workflows are failing. This lab is about Backup Plans — how backup plans fits into Commvault backup
    operations. Read the objectives and the current state, and note precisely what looks wrong versus
    healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Backup Plans problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Create the smallest working slice of Backup Plans first, validate
    it, then add the remaining pieces one at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    1. Inspect the current state with the relevant CommServe, MediaAgent, backup plans, and restore jobs
    for backup plans.

    2. Each command above tells you something specific — status/health, recent errors, and the effective
    configuration. Read them in that order.

    3. Compare what you see to the objectives; the gap points at the fault.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of Backup Plans is at fault.

    2. Re-run the most relevant of the relevant CommServe, MediaAgent, backup plans, and restore jobs
    for backup plans focused on just that part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''Backup Plans
    is misconfigured and dependent workflows are failing'' toward ''Backup Plans behaves correctly under
    normal and failure checks''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the smallest reversible change your hypothesis points to. Create the smallest working slice
    of Backup Plans first, validate it, then add the remaining pieces one at a time.

    2. Re-run `bash check.sh` and confirm Backup Plans behaves correctly under normal and failure checks.

    3. If it still fails, the hypothesis was wrong — go back to the evidence, do not stack changes.


    WHY: the grader validates real system state, not marker files — a fix only counts when the subsystem
    is actually healthy.'
