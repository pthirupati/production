description: Topic lab for Observability Practice. The Lab Server has a planted configuration fault under
  `/opt` (and/or `/etc`). Diagnose from evidence, apply the smallest reliable fix, then verify with the
  documented checker (`grep -q FIXED-OK /opt/fixitlab/academy/academy-commvault-018-observability-alerts-2.conf`
  succeeds after the documented fix).
objectives:
- Identify the planted configuration fault from evidence
- Apply the minimal documented remediation
- '`grep -q FIXED-OK /opt/fixitlab/academy/academy-commvault-018-observability-alerts-2.conf` succeeds
  after the documented fix'
initial_state: A topic-specific configuration fault is present on this host; dependent workflows fail
  until repaired.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: alerts misfire or never trigger. This lab is
    about alert rules — expressions, for-duration, and labels. Read the objectives and the current state,
    and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For alert rules problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Add or fix the exporter / dashboard / alert with clear names,
    labels, and a sensible threshold.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    1. Inspect the current state with rule files and the Alerts page.

    2. Each command above tells you something specific — status/health, recent errors, and the effective
    configuration. Read them in that order.

    3. Compare what you see to the objectives; the gap points at the fault.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of alert rules is at fault.

    2. Re-run the most relevant of rule files and the Alerts page focused on just that part to confirm
    it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''alerts misfire
    or never trigger'' toward ''rules evaluate correctly for the condition''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the smallest reversible change your hypothesis points to. Add or fix the exporter / dashboard
    / alert with clear names, labels, and a sensible threshold.

    2. Re-run `bash check.sh` and confirm rules evaluate correctly for the condition.

    3. If it still fails, the hypothesis was wrong — go back to the evidence, do not stack changes.


    WHY: the grader validates real system state, not marker files — a fix only counts when the subsystem
    is actually healthy.'
