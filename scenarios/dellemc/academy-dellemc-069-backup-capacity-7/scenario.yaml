description: 'CONTEXT: A team operating Dell EMC storage has raised a ticket for `Capacity — Backup`.
  A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve it.
  Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PowerStore/Unity practice array. The architecture
  is a single lab-primary node exposing pools, volumes, snapshots, and host mapping; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for Capacity. Leadership wants
  proof that restore works — not just that scripts exit zero. Backup and recovery drill for Capacity.
  Ensure backups run on schedule, retention is correct, and you can restore how capacity fits into Dell
  EMC storage within the lab RTO.


  OBJECTIVE: Backup coverage for Capacity is complete and restorable; Retention and encryption meet the
  stated policy; A restore drill proves data integrity. Acceptance criteria: the change is minimal and
  reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant pools, volumes, snapshots, and host mapping), changing one thing at a time. Check
  your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
