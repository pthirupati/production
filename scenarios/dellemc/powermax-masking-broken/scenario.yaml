objectives:
- Sign in to Unisphere for PowerMax
- Open Storage Groups and confirm SG_db_prod holds volume 0003 with no masking view
- Confirm host db01 and port group PG_db already exist and are available
- Create a masking view binding SG_db_prod, db01, and PG_db
