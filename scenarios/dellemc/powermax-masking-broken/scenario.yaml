  title: Create the missing masking view for SG_db_prod
  description: >-
    Bind SG_db_prod, host db01, and port group PG_db together with a new masking view so db01 can see
    the volume already provisioned in SG_db_prod.
  background: >-
    This lab teaches the PowerMax masking triangle: storage group + host + port group, bound by a
