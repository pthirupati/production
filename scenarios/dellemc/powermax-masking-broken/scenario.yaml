description: 'CONTEXT: A team operating Dell EMC storage has raised a ticket for `PowerMax: Database Host
  Can''t See Its LUN - Masking View`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PowerStore/Unity practice array. The architecture
  is a single lab-primary node exposing pools, volumes, snapshots, and host mapping; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Unisphere for PowerMax showing SG_db_prod provisioned with volume 0003 but
  with zero masking views, while the sibling storage group SG_web_prod is fully masked to web01 via PG_web.
  Host db01 and port group PG_db already exist and are unused. Volume 0003 lives inside SG_db_prod, and
  SG_db_prod has no masking view at all — unlike SG_web_prod, which is fully masked to web01. In PowerMax,
  a storage group being provisioned is necessary but not sufficient: without a masking view tying the
  storage group to a specific host and port group, the array never presents the LUN down the fabric, so
  db01''s HBA never sees it no matter how many times it rescans.


  OBJECTIVE: Sign in to Unisphere for PowerMax; Open Storage Groups and confirm SG_db_prod holds volume
  0003 with no masking view; Confirm host db01 and port group PG_db already exist and are available. Acceptance
  criteria: the change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant pools, volumes, snapshots, and host mapping), changing one thing at a time. Check
  your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
