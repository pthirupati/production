  files_changed: []
  commands_run:
  - "Unisphere: Storage Groups -> confirm SG_db_prod has no masking view"
  - "Unisphere: Create Masking View -> SG_db_prod + db01 + PG_db -> Create"
  reference_docs: dellemc-fundamentals
