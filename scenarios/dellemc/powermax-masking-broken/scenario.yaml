title: "PowerMax: Database Host Can't See Its LUN — Masking View Missing"
slug: powermax-masking-broken
technology: dellemc
category: Fix
difficulty: medium
lab_mode: simulation
simulation_type: dellemc
infrastructure_type: docker
time_limit: 900
max_score: 100
is_free: true
jira_priority: Critical
dual_terminal: false
description: >-
  CONTEXT: The DBA team opened a Sev-1 ticket: db01 was supposed to receive a new 500GB volume from
  the PowerMax array for a database expansion, but the host still shows no new disk after a reboot and
  a rescan. Storage says the volume exists and is provisioned. Server team says the host sees nothing.
  Both are right — and that gap is exactly what a masking view exists to close.


  ENVIRONMENT: You are working in Unisphere for PowerMax against array 000297900123 (PowerMax 2500).
  The array already has two storage groups — SG_web_prod (volumes 0001, 0002) and SG_db_prod (volume
  0003) — each with an existing masking view binding it to its host and a front-end port group
  (MV_web01 binds SG_web_prod to host web01 via PG_web). db01 is a registered host with its own FC
  initiator, and PG_db is an existing, unused port group on FA-2D:4.


  SYMPTOM / STARTING STATE: Volume 0003 lives inside SG_db_prod, and SG_db_prod has no masking view at
  all — unlike SG_web_prod, which is fully masked to web01. In PowerMax, a storage group being
  provisioned is necessary but not sufficient: without a masking view tying the storage group to a
  specific host and port group, the array never presents the LUN down the fabric, so db01's HBA never
  sees it no matter how many times it rescans.


  IMPACT: The database expansion is blocked and the maintenance window is burning. Until db01 can see
  volume 0003, the DBA team cannot extend the filesystem, and the ticket stays open as a Sev-1 storage
  provisioning failure.


  OBJECTIVE: Sign in to Unisphere, open Storage Groups, confirm SG_db_prod holds volume 0003 but has
  no masking view, then create a masking view binding SG_db_prod, host db01, and port group PG_db so
  db01 can finally see its LUN.
initial_state: >-
  Unisphere for PowerMax showing SG_db_prod provisioned with volume 0003 but with zero masking views,
  while the sibling storage group SG_web_prod is fully masked to web01 via PG_web. Host db01 and port
  group PG_db already exist and are unused.
objectives:
- Sign in to Unisphere for PowerMax
- Open Storage Groups and confirm SG_db_prod holds volume 0003 with no masking view
- Confirm host db01 and port group PG_db already exist and are available
- Create a masking view binding SG_db_prod, db01, and PG_db
- Confirm the new masking view appears in Masking Views alongside MV_web01
hints:
- order: 1
  cost: 0
  content: >-
    ORIENT — what to observe and why: Do not create anything yet. Open Storage Groups and compare
    SG_web_prod (which works) against SG_db_prod (which doesn't). The difference isn't the volume or
    the host — it's a third object. Open Masking Views and note that SG_web_prod already has one
    (MV_web01) and SG_db_prod has none.
- order: 2
  cost: 10
  content: >-
    APPROACH — the troubleshooting method: In PowerMax, a host can only see a LUN through the triangle
    of storage group + host + port group, bound together by a masking view. A volume sitting "Ready"
    inside a storage group is fully provisioned on the array side but invisible to any server until
    that triangle exists — this is not a zoning or HBA problem, it is a missing masking view.
- order: 3
  cost: 25
  content: >-
    WHICH TOOL — the diagnostic command(s): 1. In Hosts, confirm db01 is already registered with an FC
    initiator — nothing to create there. 2. In Port Groups, confirm PG_db exists on FA-2D:4 and is not
    already bound to another masking view. 3. You have all three ingredients already (storage group,
    host, port group) — the only missing piece is the masking view that ties them together.
- order: 4
  cost: 40
  content: >-
    NARROW DOWN — isolate the subsystem: Use the "Create Masking View" action, and fill in exactly the
    three names already confirmed: storage group SG_db_prod, host db01, port group PG_db. This mirrors
    how MV_web01 binds SG_web_prod + web01 + PG_web — same shape, different objects.
- order: 5
  cost: 60
  content: >-
    NEAR-SOLUTION — the fix shape + verify (you still apply it): Open Create Masking View, set storage
    group SG_db_prod, host db01, port group PG_db, give it a name, and submit. Refresh Masking Views and
    confirm the new entry appears next to MV_web01. WHY: the grader checks that a masking view now binds
    SG_db_prod in the simulated array state — a storage group or host created without a matching masking
    view does not clear the incident.
summary: Create the missing masking view that finally lets db01 see the volume 0003 LUN already
  provisioned for it inside SG_db_prod.
estimated_minutes: 15
xp_reward: 120
