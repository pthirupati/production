description: 'CONTEXT: A team operating Dell EMC storage has raised a ticket for `Database Replication
  — Troubleshoot`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline PowerStore/Unity practice array. The architecture
  is a single lab-primary node exposing pools, volumes, snapshots, and host mapping; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: The `rsyslog` service is not running (`systemctl is-active rsyslog` → inactive/failed).
  Dependent Troubleshooting Drill tasks cannot succeed until the unit is healthy again. Service operations
  lab. The `rsyslog` systemd unit is **failed/inactive** on this host — a realistic fault for Troubleshooting
  Drill workflows that depend on it. Diagnose with `systemctl status rsyslog` and journal logs, apply
  the smallest reliable fix, then verify with `systemctl is-active rsyslog`.

  OBJECTIVE: The `rsyslog` service is active (running); `systemctl is-active rsyslog`` returns active;
  The fix survives a status re-check (no marker files). Acceptance criteria: the change is minimal and
  reversible, and success means `systemctl is-active rsyslog` returns active.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant pools, volumes, snapshots, and host mapping), changing one thing at a time. Check
  your work continuously against the objective — success means `systemctl is-active rsyslog` returns active.

  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active rsyslog` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- The `rsyslog` service is active (running)
- '`systemctl is-active rsyslog`` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `rsyslog` service is not running (`systemctl is-active rsyslog` → inactive/failed).
  Dependent Troubleshooting Drill tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: replicas lag, break, or promotions fail during
    failover drills. This lab is about database replication — primary/replica topology, lag, failover,
    and consistency. Read the objectives and the current state, and note precisely what looks wrong versus
    healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For database replication problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status rsyslog` and `journalctl -u rsyslog -n 50 --no-pager` before changing
    anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status rsyslog` — note Active/Failed and the last log lines.

    2. Read `journalctl -u rsyslog -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart rsyslog` and confirm `systemctl is-active rsyslog` succeeds.

    WHY: the grader checks real service state, not marker files.'
