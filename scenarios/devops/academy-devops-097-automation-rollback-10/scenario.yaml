title: 'DevOps: Rollback — Automation Practice'
slug: academy-devops-097-automation-rollback-10
technology: DevOps
category: Automation
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Automation lab: remove toil around rollback. Codify repeatable steps
  for safe rollback and versioned deploys and prove the automation is idempotent.'
objectives:
- Day-2 rollback work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for rollback. Automate the boring
  parts without hiding important safety checks.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the rollback procedure.

    2. Write down what looks normal versus wrong or missing for rollback.

    3. Recall the core idea: safe rollback and versioned deploys. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for rollback.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the rollback procedure.

    2. Implement the automation with dry-run / check mode, then run it twice — the
    second run must report no changes.

    3. Verify the result — rollback restores the last good version.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-devops-097-automation-rollback-10.conf`,
    then click Check Solution.'
