title: Register a New GitLab CI Runner
slug: gitlab-ci-runner-stuck
technology: devops
category: Fix
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: High
is_free: false
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Register
  a New GitLab CI Runner` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines,
  artifacts, and runbooks. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Ubuntu server. GitLab CI jobs stuck in pending. The GitLab
  instance is at

  http://gitlab.internal. Registration token is in /etc/gitlab-runner/registration_token.

  gitlab-runner binary may need to be installed. All GitLab CI jobs are stuck in a
  pending state. The existing CI runner has gone

  offline and there are no available runners to pick up jobs. You need to register

  a new GitLab Runner on this server so pipelines can resume.


  OBJECTIVE: Identify why jobs are stuck in pending state; Install gitlab-runner if
  not present; Register a new runner using the registration token. Success means `systemctl
  is-active gitlab-runner` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Identify why jobs are stuck in pending state
- Install gitlab-runner if not present
- Register a new runner using the registration token
- Verify the runner is active and picking up jobs
initial_state: 'Ubuntu server. GitLab CI jobs stuck in pending. The GitLab instance
  is at

  http://gitlab.internal. Registration token is in /etc/gitlab-runner/registration_token.

  gitlab-runner binary may need to be installed.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status gitlab-runner` and `journalctl
    -u gitlab-runner -n 50 --no-pager` before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status gitlab-runner` — note Active/Failed and the last log
    lines.

    2. Read `journalctl -u gitlab-runner -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart gitlab-runner` and confirm `systemctl is-active gitlab-runner`
    succeeds.


    WHY: the grader checks real service state, not marker files.'
summary: Complete the register a new gitlab ci runner devops lab and verify success
