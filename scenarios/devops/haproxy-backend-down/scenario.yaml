description: 'CONTEXT: A team operating DevOps delivery has raised a ticket for `Fix HAProxy Backend Health
  Check Path`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab. The architecture is a single lab-primary
  node exposing git repos, pipelines, artifacts, and runbooks; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server running HAProxy. Config at /etc/haproxy/haproxy.cfg.

  The backend section uses "option httpchk GET /health" but the app

  health endpoint is at /api/health — returns 404 causing health check failure.


  OBJECTIVE: Check HAProxy stats to confirm all backends are DOWN; Identify the incorrect health check
  path in haproxy.cfg; Fix the option httpchk path from /health to /api/health. Acceptance criteria: the
  change is minimal and reversible, and success means `systemctl is-active haproxy` returns active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant git repos, pipelines, artifacts, and runbooks), changing one thing at a time. Check
  your work continuously against the objective — success means `systemctl is-active haproxy` returns active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active haproxy` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Check HAProxy stats to confirm all backends are DOWN
- Identify the incorrect health check path in haproxy.cfg
- Fix the option httpchk path from /health to /api/health
- Reload HAProxy and verify backends show as UP
