is_free: false
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix
  HAProxy Backend Health Check Path` during a realistic incident. The business impact
  is reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines,
  artifacts, and runbooks. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Ubuntu server running HAProxy. Config at /etc/haproxy/haproxy.cfg.

  The backend section uses "option httpchk GET /health" but the app

  health endpoint is at /api/health — returns 404 causing health check failure. HAProxy
  is showing all backend servers as DOWN in the stats page. The health

  checks are sending HTTP requests to /health but the application''s actual

  health endpoint is at /api/health. Fix the health check path in

  haproxy.cfg so backends show as UP and traffic can be served.


  OBJECTIVE: Check HAProxy stats to confirm all backends are DOWN; Identify the incorrect
  health check path in haproxy.cfg; Fix the option httpchk path from /health to /api/health.
  Success means `systemctl is-active haproxy` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Check HAProxy stats to confirm all backends are DOWN
- Identify the incorrect health check path in haproxy.cfg
- Fix the option httpchk path from /health to /api/health
- Reload HAProxy and verify backends show as UP
initial_state: 'Ubuntu server running HAProxy. Config at /etc/haproxy/haproxy.cfg.

  The backend section uses "option httpchk GET /health" but the app

  health endpoint is at /api/health — returns 404 causing health check failure.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status haproxy` and `journalctl -u
    haproxy -n 50 --no-pager` before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status haproxy` — note Active/Failed and the last log lines.

    2. Read `journalctl -u haproxy -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart haproxy` and confirm `systemctl is-active haproxy` succeeds.


    WHY: the grader checks real service state, not marker files.'
