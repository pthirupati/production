  The backend section uses "option httpchk GET /health" but the app

  health endpoint is at /api/health — returns 404 causing health check failure.

  '
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: fix HAProxy backend health check path is not
    behaving as the scenario objectives require. This lab is about fix HAProxy backend health check path
    — how fix HAProxy backend health check path behaves in a DevOps delivery environment. Read the objectives
    and the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For fix HAProxy backend health check path problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Create the smallest working slice
    of fix HAProxy backend health check path first, validate it, then add the remaining pieces one at
    a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status haproxy` and `journalctl -u haproxy -n 50 --no-pager` before changing
    anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status haproxy` — note Active/Failed and the last log lines.

    2. Read `journalctl -u haproxy -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart haproxy` and confirm `systemctl is-active haproxy` succeeds.


    WHY: the grader checks real service state, not marker files.'
