title: Fix ArgoCD Application Sync Failure
slug: argocd-sync-failed
technology: DevOps
category: GitOps
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: High
is_free: false
description: 'An ArgoCD application is stuck in a SyncFailed state. The Kubernetes manifests

  in the Git repository have a validation error that prevents ArgoCD from applying

  them to the cluster. Identify the invalid manifest and fix it so ArgoCD can

  sync successfully.

  '
objectives:
- Identify the ArgoCD application that is in SyncFailed state
- Find the invalid Kubernetes manifest causing the sync failure
- Fix the manifest validation error
- Trigger a new sync and verify the application reaches Synced state
initial_state: 'Kubernetes cluster with ArgoCD installed. Application "myapp" in namespace "argocd"

  is in SyncFailed state. Manifests are at /opt/gitops/myapp/manifests/.

  The deployment manifest has an invalid resource specification.

  '
hints:
- order: 1
  cost: 10
  content: 'Check the app state and error: `argocd app get myapp` (and `--refresh`) shows SyncFailed with
    the failing resource/message.'
- order: 2
  cost: 15
  content: 'Reproduce the validation error locally: `kubectl apply --dry-run=client -f /opt/gitops/myapp/manifests/`
    surfaces the invalid field.'
- order: 3
  cost: 20
  content: The deployment.yaml sets the CPU limit to '0', which is invalid for a resource quantity — change
    it to a real value like '500m'.
- order: 4
  cost: 25
  content: Commit the fix to Git, then `argocd app sync myapp` and confirm the app reaches Synced/Healthy
    with `argocd app get myapp`.
