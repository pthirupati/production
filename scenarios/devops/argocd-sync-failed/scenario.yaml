description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix
  ArgoCD Application Sync Failure` during a realistic incident. The business impact
  is reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines,
  artifacts, and runbooks. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Kubernetes cluster with ArgoCD installed. Application
  "myapp" in namespace "argocd"

  is in SyncFailed state. Manifests are at /opt/gitops/myapp/manifests/.

  The deployment manifest has an invalid resource specification. An ArgoCD application
  is stuck in a SyncFailed state. The Kubernetes manifests

  in the Git repository have a validation error that prevents ArgoCD from applying

  them to the cluster. Identify the invalid manifest and fix it so ArgoCD can

  sync successfully.


  OBJECTIVE: Identify the ArgoCD application that is in SyncFailed state; Find the
  invalid Kubernetes manifest causing the sync failure; Fix the manifest validation
  error. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Identify the ArgoCD application that is in SyncFailed state
- Find the invalid Kubernetes manifest causing the sync failure
- Fix the manifest validation error
- Trigger a new sync and verify the application reaches Synced state
