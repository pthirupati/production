description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `CI Pipeline Failing on Missing
  KUBECONFIG` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A CI/CD pipeline whose deploy job errors with ''KUBECONFIG not set'', failing
  every deploy. The GitLab deploy stage fails because KUBECONFIG is not exported in the runner, so kubectl
  can''t reach the cluster. Fix the pipeline variables and confirm the pipeline goes green.


  OBJECTIVE: Confirm the deploy stage fails on missing KUBECONFIG; Set the KUBECONFIG/cluster credentials
  in the pipeline; Verify the pipeline reaches a passed state. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A CI/CD pipeline whose deploy job errors with 'KUBECONFIG not set', failing every deploy.
objectives:
- Confirm the deploy stage fails on missing KUBECONFIG
- Set the KUBECONFIG/cluster credentials in the pipeline
- Verify the pipeline reaches a passed state
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
