description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Helm Subchart Dependency
  Not Updated` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes helm release left non-deployed because subchart dependencies
  were stale at upgrade time. A helm release is unhealthy because a subchart dependency wasn''t updated
  before upgrade, leaving the release in a bad state. Roll back to the deployed revision and reconcile.


  OBJECTIVE: Confirm the release is not deployed; Roll back to the last good revision; Verify the release
  is deployed. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
