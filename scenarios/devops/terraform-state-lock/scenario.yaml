description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Unlock a Locked Terraform
  State` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server with Terraform installed. Working directory is /opt/terraform/infra.

  The state file is locked by a previous interrupted run. Lock ID is stored

  in the .terraform/lock_id file. A Terraform apply was interrupted mid-run and left the state file locked.

  Now no one on the team can run terraform plan or apply — every command

  returns "Error acquiring the state lock". You need to force-unlock the

  state and restore normal Terraform operations.


  OBJECTIVE: Identify the Terraform state lock ID; Force-unlock the Terraform state; Verify terraform
  plan runs without lock errors. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the Terraform state lock ID
- Force-unlock the Terraform state
- Verify terraform plan runs without lock errors
initial_state: 'Ubuntu server with Terraform installed. Working directory is /opt/terraform/infra.

