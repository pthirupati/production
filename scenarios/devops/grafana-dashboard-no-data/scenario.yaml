description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix Grafana Datasource with
  No Data` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server running Grafana. The Prometheus datasource is configured with

  URL http://old-prometheus:9090 which is unreachable. The correct Prometheus

  URL is http://prometheus:9090. Fix the datasource config. Grafana dashboards are showing "No data" for
  all panels. The Prometheus

  datasource URL in Grafana is misconfigured — it''s pointing to an old

  hostname that no longer resolves. Fix the datasource URL so Grafana

  can connect to Prometheus and display metrics.


  OBJECTIVE: Identify the misconfigured Prometheus datasource in Grafana; Update the datasource URL to
  the correct Prometheus endpoint; Verify dashboards display data after the fix. Success means `systemctl
  is-active grafana-server` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the misconfigured Prometheus datasource in Grafana
- Update the datasource URL to the correct Prometheus endpoint
- Verify dashboards display data after the fix
initial_state: 'Ubuntu server running Grafana. The Prometheus datasource is configured with

  URL http://old-prometheus:9090 which is unreachable. The correct Prometheus

  URL is http://prometheus:9090. Fix the datasource config.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status grafana-server` and `journalctl -u grafana-server
    -n 50 --no-pager` before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status grafana-server` — note Active/Failed and the last log lines.

    2. Read `journalctl -u grafana-server -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart grafana-server` and confirm `systemctl is-active grafana-server` succeeds.


    WHY: the grader checks real service state, not marker files.'
