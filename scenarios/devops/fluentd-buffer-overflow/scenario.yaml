description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Tune Fluentd Buffer to Prevent
  Overflow` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server running Fluentd. Config at /etc/fluent/fluent.conf.

  Current buffer settings are too small: chunk_limit_size 1m, total_limit_size 10m.

  These need to be increased to at least chunk_limit_size 8m, total_limit_size 256m. Fluentd is dropping
  log events because the buffer is overflowing. The buffer

  size limits are too small for the current log volume. Memory buffer chunks

  are being discarded and logs are being lost. Tune the buffer configuration

  in fluent.conf to handle the load without data loss.


  OBJECTIVE: Identify the buffer overflow errors in Fluentd logs; Increase the buffer chunk_limit_size
  and total_limit_size; Tune flush_interval and retry settings. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the buffer overflow errors in Fluentd logs
- Increase the buffer chunk_limit_size and total_limit_size
- Tune flush_interval and retry settings
- Verify Fluentd processes logs without buffer overflow errors
