title: 'CI → Ansible CD: Pipeline Artifact Never Reaches the Release'
slug: devops-ci-to-ansible-cd-handoff
technology: devops
category: Build
difficulty: medium
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `CI → Ansible CD: Pipeline
  Artifact Never Reaches the Release` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A DevOps control host. /home/ansible/cd-playbook.yml references the wrong

  artifact-version variable, a stale artifact URL, and an undefined host group, so

  the CD stage that runs it fails immediately after CI. CROSS-TECHNOLOGY task (DevOps/CI -> Ansible).
  The CI job builds an artifact and

  the deploy stage hands off to an Ansible release play at

  /home/ansible/cd-playbook.yml. The handoff is broken: the play reads an

  artifact-version variable from the wrong fact, downloads from a stale artifact

  URL, and targets a host group the inventory does not define — so the CD stage

  fails and nothing is deployed. Fix the Ansible release play so the CI artifact is

  actually rolled out.


  OBJECTIVE: Trace the failed CD stage to the release play and identify the wrong variable, URL, and host
  group; Correct /home/ansible/cd-playbook.yml so it consumes the CI artifact version/URL and targets
  a real group; Confirm the play is corrected so the CI -> Ansible CD handoff completes. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A DevOps control host. /home/ansible/cd-playbook.yml references the wrong

