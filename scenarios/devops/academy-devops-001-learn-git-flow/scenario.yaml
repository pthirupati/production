title: Git Workflow — Learn Lab
slug: academy-devops-001-learn-git-flow
technology: devops
category: Learn
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: true
infrastructure_type: docker
jira_priority: Low
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `devops: Git Workflow — Fundamentals
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The CI/CD lab is online with a starter Git workflow setup. Some pieces are
  intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
  This beginner-friendly devops lab introduces Git workflow. You will explore branching, merges, and conflict
  resolution on the CI/CD lab. Read the environment first, then follow the guided steps — no prior production
  experience required.


  OBJECTIVE: Understand how Git workflow work in this lab environment; Identify the main status and configuration
  signals for Git workflow; Confirm you can read the current state confidently before changing anything.
  Success means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how Git workflow work in this lab environment
- Identify the main status and configuration signals for Git workflow
- Confirm you can read the current state confidently before changing anything
initial_state: The CI/CD lab is online with a starter Git workflow setup. Some pieces are intentionally
  incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `git status`, `git log --graph`, and branches.

    2. Write down what looks normal versus wrong or missing for Git workflow.

    3. Recall the core idea: branching, merges, and conflict resolution. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify the main status and configuration signals for Git workflow

    2. Confirm you can read the current state confidently before changing anything'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `git status`, `git log --graph`, and branches.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — the branch is merged cleanly.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
summary: Complete the git workflow — learn lab devops lab and verify success with the checker
estimated_minutes: 15
xp_reward: 100
prerequisites:
- Basic devops literacy
tags:
- devops
- do
- hands-on
linked_tutorial: devops-fundamentals
what_you_will_learn:
- Understand how Git workflow work in this lab environment
- Identify the main status and configuration signals for Git workflow
- Confirm you can read the current state confidently before changing anything
environment:
  nodes:
  - role: primary
    os: FixitLab CI/CD lab
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - bash
  - coreutils
  - devops
  - journalctl
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Git Workflow — Learn Lab
  description: Restore healthy behavior for Git Workflow — Learn Lab by investigating the failure, applying
    the smallest safe fix, and validating the outcome.
  background: 'This devops lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: service_active
    command: systemctl is-active nginx
    expected_status: active
    error_message: The nginx service is not active yet. Check `systemctl status nginx` and `journalctl
      -u nginx -n 50`.
solution:
  summary: The root cause is an unhealthy `nginx` service; repair it and verify active state.
  files_changed: []
  commands_run:
  - systemctl is-active nginx
  reference_docs: devops-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
