description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix Istio Sidecar Injection
  Label` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Kubernetes cluster with Istio installed. The "myapp" namespace exists but

  does not have the label istio-injection=enabled. Pods lack the Envoy sidecar.

  The namespace currently has label istio-injection=disabled. Istio sidecar injection is not happening
  for pods in the "myapp" namespace.

  The Envoy proxy is not being injected, so mTLS and traffic management

  policies are not being enforced. The namespace is missing the required

  istio-injection=enabled label. Fix the namespace label to enable

  automatic sidecar injection.


  OBJECTIVE: Verify that pods in the myapp namespace lack the Istio sidecar; Add the istio-injection=enabled
  label to the myapp namespace; Roll out new pods to pick up the sidecar injection. Success means `kubectl
  get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Verify that pods in the myapp namespace lack the Istio sidecar
- Add the istio-injection=enabled label to the myapp namespace
- Roll out new pods to pick up the sidecar injection
- Verify pods have the istio-proxy container running
initial_state: 'Kubernetes cluster with Istio installed. The "myapp" namespace exists but

  does not have the label istio-injection=enabled. Pods lack the Envoy sidecar.

  The namespace currently has label istio-injection=disabled.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
