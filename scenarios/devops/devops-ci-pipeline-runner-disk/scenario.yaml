description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `CI/CD Pipeline Runner Out
  of Disk` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A CI/CD pipeline failing because the build/deploy runner is out of disk space.
  The CI pipeline fails because the runner host filled its disk with build caches and Docker layers, so
  the deploy stage errors. Clean up and fix the pipeline so it passes.


  OBJECTIVE: Confirm the pipeline is failing from a full runner; Reclaim space and re-run the deploy;
  Verify the pipeline passes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A CI/CD pipeline failing because the build/deploy runner is out of disk space.
objectives:
- Confirm the pipeline is failing from a full runner
- Reclaim space and re-run the deploy
- Verify the pipeline passes
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
