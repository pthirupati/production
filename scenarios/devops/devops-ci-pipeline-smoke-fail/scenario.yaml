description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `CI Pipeline Failing Smoke
  Tests on Deploy` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A CI/CD pipeline whose deploy stage fails smoke tests due to a misconfigured
  build. Post-deploy smoke tests fail because the deploy stage shipped a misconfigured build, failing
  the pipeline. Fix the pipeline config and confirm it passes.


  OBJECTIVE: Confirm the pipeline fails at the deploy/smoke stage; Fix the deploy configuration; Verify
  the pipeline passes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
