description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `CI Pipeline Cache Poisoned
  Build` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A CI/CD pipeline whose corrupted cache causes the deploy job to fail every
  run. A poisoned dependency cache makes the CI deploy stage fail consistently. Invalidate the cache and
  fix the pipeline variables so deploys succeed.


  OBJECTIVE: Confirm the deploy stage fails from a bad cache; Invalidate the cache and fix the deploy
  config; Verify the pipeline passes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
