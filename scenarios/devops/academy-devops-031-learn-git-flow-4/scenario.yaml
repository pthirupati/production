title: 'DevOps: Git Workflow — Fundamentals Lab'
slug: academy-devops-031-learn-git-flow-4
technology: DevOps
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly DevOps lab introduces Git workflow. You will explore
  branching, merges, and conflict resolution on the CI/CD lab. Read the environment
  first, then follow the guided steps — no prior production experience required.
objectives:
- Understand how Git workflow work in this lab environment
- Identify the main status and configuration signals for Git workflow
- Confirm you can read the current state confidently before changing anything
initial_state: The CI/CD lab is online with a starter Git workflow setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is
  on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `git status`, `git log --graph`, and branches.

    2. Write down what looks normal versus wrong or missing for Git workflow.

    3. Recall the core idea: branching, merges, and conflict resolution. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Git workflow.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `git status`, `git log --graph`, and branches.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — the branch is merged cleanly.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-devops-031-learn-git-flow-4.conf`,
    then click Check Solution.'
