description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Add Missing GitHub Actions
  Secret` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A GitHub repository with a workflow at .github/workflows/deploy.yml that references

  ${{ secrets.DEPLOY_KEY }} but the secret has not been configured. The deploy key

  value is stored at /opt/deploy/deploy_key.pem on this server. A GitHub Actions workflow is failing because
  it references a secret DEPLOY_KEY

  that has not been added to the repository. The deploy step exits with an error

  about an empty or missing environment variable. Add the required secret so the

  workflow can complete successfully.


  OBJECTIVE: Identify the missing secret referenced in the workflow file; Add the DEPLOY_KEY secret to
  the repository secrets; Verify the workflow can access the secret without errors. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
