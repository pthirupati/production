description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `devops: Change Management
  — Observability Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The system runs, but change management lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality. Observability task: make change management visible in logs,
  metrics, or traces. On-call should answer ''what is broken?'' quickly using signals from approvals,
  windows, and records.


  OBJECTIVE: Day-2 change management work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  crond` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 change management work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but change management lacks useful telemetry. Dashboards/alerts are blank
  or noisy — improve signal quality.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status crond` and `journalctl -u crond -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart crond` and confirm `systemctl is-active crond` succeeds.


    WHY: the grader checks real service state, not marker files.'
