description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix Prometheus Scrape Configuration`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server running Prometheus at /etc/prometheus/prometheus.yml.

  The myapp service is running on port 8080 but prometheus.yml has port 9090.

  The service label "app: myapp-service" doesn''t match the selector "app: myapp". Prometheus is showing
  targets as DOWN and metrics are not being scraped.

  The scrape config in prometheus.yml points to the wrong port and the

  service labels don''t match the scrape selector. Fix the scrape config

  and service labels so Prometheus can discover and scrape the targets.


  OBJECTIVE: Identify why Prometheus targets show as DOWN; Fix the scrape configuration in prometheus.yml;
  Add correct service labels to match the scrape selector. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify why Prometheus targets show as DOWN
- Fix the scrape configuration in prometheus.yml
- Add correct service labels to match the scrape selector
- Verify targets show as UP in Prometheus
initial_state: 'Ubuntu server running Prometheus at /etc/prometheus/prometheus.yml.

  The myapp service is running on port 8080 but prometheus.yml has port 9090.

  The service label "app: myapp-service" doesn''t match the selector "app: myapp".

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open Prometheus → Status → Targets and note which job is DOWN and the last
    scrape error message.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check `up` and `scrape_duration_seconds` for the failing target.

    2. Inspect `/etc/prometheus/prometheus.yml` for wrong host, port, or scheme.

    3. `curl` the exporter endpoint from the lab host to test connectivity.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the scrape target or relabel rule in prometheus.yml.

    2. Reload or restart Prometheus.

    3. Confirm the target is UP and Check Solution passes.


    WHY: Prometheus only collects metrics from correctly configured targets.'
