description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `CI Pipeline Pushing Broken
  Image Tag` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A CI/CD pipeline whose deploy stage references a bad image tag, failing the
  deployment. The pipeline deploys a ''broken'' image tag because a variable was overwritten, so deploys
  fail health checks. Fix the image tag variable and confirm the pipeline succeeds.


  OBJECTIVE: Confirm the deploy stage uses a broken image tag; Restore the correct image tag variable;
  Verify the pipeline passes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
