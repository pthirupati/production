jira_priority: High
is_free: false
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix Nginx Upstream Health
  Check Failure` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server running Nginx as a reverse proxy. Config at /etc/nginx/nginx.conf.

  Upstream app servers (app1.internal, app2.internal) listen on port 8080 but

  the upstream block specifies port 80. The 502 errors confirm all backends are down. Nginx is reporting
  all upstream servers as unavailable. Health checks are

  failing because the upstream port is wrong in the nginx.conf — the app

  servers listen on port 8080 but nginx is configured to forward to port 80.

  Fix the upstream server port so traffic is correctly forwarded.


  OBJECTIVE: Identify the misconfigured upstream server port in nginx.conf; Fix the upstream port from
  80 to 8080; Test the Nginx configuration syntax. Success means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the misconfigured upstream server port in nginx.conf
- Fix the upstream port from 80 to 8080
- Test the Nginx configuration syntax
- Reload Nginx and verify upstreams are healthy
initial_state: 'Ubuntu server running Nginx as a reverse proxy. Config at /etc/nginx/nginx.conf.

  Upstream app servers (app1.internal, app2.internal) listen on port 8080 but

  the upstream block specifies port 80. The 502 errors confirm all backends are down.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
