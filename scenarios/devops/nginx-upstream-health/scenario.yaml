  '
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: fix nginx upstream health check failure is not
    behaving as the scenario objectives require. This lab is about fix nginx upstream health check failure
    — how fix nginx upstream health check failure behaves in a DevOps delivery environment. Read the objectives
    and the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For fix nginx upstream health check failure problems the reliable
    method is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Test the config to get the exact file and line: `nginx -t`. It prints the offending directive (e.g.
    unknown directive "listn").'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix the stream block in nginx config (upstream, listen, proxy_pass).

    2. Run `nginx -t`, then `systemctl enable --now nginx`.

    3. Confirm `systemctl is-active nginx` returns active.


    WHY: stream proxies fail when the TCP upstream or listen directive is wrong.'
