tasks:
- id: task_1
  title: Stop fork PRs from reading DEPLOY_TOKEN
  description: Inspect the workflow trigger, checkout ref, and secret scope; break the combination that
    lets a fork pull request run attacker-controlled code with production credentials available.
  background: 'This lab teaches the single most-exploited GitHub Actions misconfiguration: pairing the
    privileged `pull_request_target` trigger with a checkout of the untrusted fork head. The grader models
    trigger, ref, and secret scope independently so more than one correct fix is accepted.'
  validation:
    type: custom_script
    script: check.sh
    error_message: A fork pull request can still run untrusted code with DEPLOY_TOKEN in scope. Removing
      the trigger name alone is not enough — check the checkout ref and the secret scope too.
solution:
  summary: '`pull_request_target` runs in the base-repo context and therefore has secrets; the workflow
    then checked out the fork head and ran `npm ci`, executing attacker code with DEPLOY_TOKEN available.
    Fix by removing any one leg of the combination — the standard answer is to run untrusted PR code on
    `pull_request` (no secrets), or to keep `pull_request_target` but check out `github.base_ref`.'
  files_changed:
  - .github/workflows/ci.yml
  commands_run:
  - cat .github/workflows/ci.yml
  reference_docs: devops-fundamentals
