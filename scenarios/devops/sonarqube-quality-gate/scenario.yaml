max_score: 100
infrastructure_type: docker
jira_priority: Medium
is_free: false
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix SonarQube Quality Gate
  Code Coverage` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server. Project at /opt/app. sonar-project.properties has

  sonar.python.coverage.reportPaths=coverage/coverage.xml but coverage

  report is actually at /opt/app/reports/coverage.xml. The quality gate

  fails because no coverage data is found. The CI pipeline is blocked by a failing SonarQube quality gate.
  The gate

  requires 80% code coverage but the project is reporting 0% because the

  coverage report path in sonar-project.properties is wrong. Fix the path

  so SonarQube picks up the coverage data.


  OBJECTIVE: Identify the incorrect coverage report path in sonar-project.properties; Fix the sonar.coverage.exclusions
  or sonar.python.coverage.reportPaths; Verify SonarQube analysis reports coverage above the quality gate
  threshold. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the incorrect coverage report path in sonar-project.properties
- Fix the sonar.coverage.exclusions or sonar.python.coverage.reportPaths
- Verify SonarQube analysis reports coverage above the quality gate threshold
initial_state: 'Ubuntu server. Project at /opt/app. sonar-project.properties has

  sonar.python.coverage.reportPaths=coverage/coverage.xml but coverage

  report is actually at /opt/app/reports/coverage.xml. The quality gate

  fails because no coverage data is found.

  '
