- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with git repos, pipelines, artifacts, and runbooks.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy
