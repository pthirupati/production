title: Unseal HashiCorp Vault
slug: vault-sealed
technology: DevOps
category: Secrets Management
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: Critical
is_free: false
description: 'HashiCorp Vault is in a sealed state after a server restart. Applications

  cannot retrieve secrets and are failing to start. The Vault unseal keys are

  stored securely and you need to use them to unseal Vault and restore

  secret access for all dependent services.

  '
objectives:
- Check Vault seal status
- Locate the unseal keys
- Apply the unseal keys to unseal Vault (requires 3 of 5 keys)
- Verify Vault is unsealed and accepting requests
initial_state: 'Ubuntu server running HashiCorp Vault at http://127.0.0.1:8200. Vault is sealed.

  The unseal keys are stored in /opt/vault/unseal_keys.txt (5 keys, need 3 to unseal).

  VAULT_ADDR is set to http://127.0.0.1:8200.

  '
hints:
- order: 1
  cost: 10
  content: 'Check the seal state: `vault status` reports `Sealed: true`, which is why apps can''t read
    secrets.'
- order: 2
  cost: 15
  content: 'Locate the unseal keys (in this lab): `cat /opt/vault/unseal_keys.txt` — you need a quorum
    (3 of 5).'
- order: 3
  cost: 20
  content: 'Apply keys one at a time: `vault operator unseal <KEY_1>`, then `<KEY_2>`, then `<KEY_3>`
    (progress shows 1/3, 2/3, 3/3).'
- order: 4
  cost: 25
  content: 'After the third key, confirm: `vault status` shows `Sealed: false` and Vault serves requests
    again.'
