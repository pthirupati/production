title: Unseal HashiCorp Vault
slug: vault-sealed
technology: devops
category: Fix
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: Critical
is_free: false
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Unseal
  HashiCorp Vault` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines,
  artifacts, and runbooks. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Ubuntu server running HashiCorp Vault at http://127.0.0.1:8200.
  Vault is sealed.

  The unseal keys are stored in /opt/vault/unseal_keys.txt (5 keys, need 3 to unseal).

  VAULT_ADDR is set to http://127.0.0.1:8200. HashiCorp Vault is in a sealed state
  after a server restart. Applications

  cannot retrieve secrets and are failing to start. The Vault unseal keys are

  stored securely and you need to use them to unseal Vault and restore

  secret access for all dependent services.


  OBJECTIVE: Check Vault seal status; Locate the unseal keys; Apply the unseal keys
  to unseal Vault (requires 3 of 5 keys). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Check Vault seal status
- Locate the unseal keys
- Apply the unseal keys to unseal Vault (requires 3 of 5 keys)
- Verify Vault is unsealed and accepting requests
initial_state: 'Ubuntu server running HashiCorp Vault at http://127.0.0.1:8200. Vault
  is sealed.

  The unseal keys are stored in /opt/vault/unseal_keys.txt (5 keys, need 3 to unseal).

  VAULT_ADDR is set to http://127.0.0.1:8200.

  '
