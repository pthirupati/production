title: 'DevOps: Change Management — Observability Practice'
slug: academy-devops-088-observability-change-management-9
technology: DevOps
category: Observability
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Observability task: make change management visible in logs, metrics,
  or traces. On-call should answer ''what is broken?'' quickly using signals from
  approvals, windows, and records.'
objectives:
- Day-2 change management work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but change management lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the change record and process.

    2. Write down what looks normal versus wrong or missing for change management.

    3. Recall the core idea: approvals, windows, and records. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for change management.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the change record and process.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a
    sensible threshold.

    3. Verify the result — changes follow the approval process.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-devops-088-observability-change-management-9.conf`,
    then click Check Solution.'
