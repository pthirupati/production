title: 'DevOps: Artifacts — Troubleshooting Drill'
slug: academy-devops-064-troubleshoot-artifacts-7
technology: DevOps
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: artifacts are missing or unversioned. You are on call
  for DevOps and must troubleshoot artifacts methodically — triage symptoms, isolate
  root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: artifacts are missing or unversioned'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The CI/CD lab is degraded. Artifacts are missing or unversioned. Recent
  changes may exist around artifacts, but do not restart blindly — gather evidence
  first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — artifact storage and versions.

    2. Write down what looks normal versus wrong or missing for artifacts.

    3. Recall the core idea: build artifacts, registries, and versioning. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for artifacts.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — artifact storage and versions.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — artifacts are published and traceable.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-devops-064-troubleshoot-artifacts-7.conf`,
    then click Check Solution.'
