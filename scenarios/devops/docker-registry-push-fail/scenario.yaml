title: Fix Docker Registry Push Authentication
slug: docker-registry-push-fail
technology: devops
category: Build
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: High
is_free: false
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix Docker Registry Push
  Authentication` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server with Docker. Private registry at registry.internal:5000 uses

  self-signed TLS. /etc/docker/daemon.json is missing the insecure-registries

  entry. Docker credentials for the registry: user=ci, password=cipassword123. Docker image pushes to
  the private registry are failing with

  "unauthorized: authentication required". The registry is using self-signed

  TLS but Docker is not configured to trust it. Additionally, the credentials

  are not configured in daemon.json. Fix the Docker daemon configuration

  to allow pushes to the private registry.


  OBJECTIVE: Add the private registry as an insecure-registry in daemon.json; Log in to the private registry
  with docker login; Verify docker push succeeds. Success means `systemctl is-active docker` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Add the private registry as an insecure-registry in daemon.json
- Log in to the private registry with docker login
- Verify docker push succeeds
initial_state: 'Ubuntu server with Docker. Private registry at registry.internal:5000 uses

  self-signed TLS. /etc/docker/daemon.json is missing the insecure-registries

  entry. Docker credentials for the registry: user=ci, password=cipassword123.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status docker` and `journalctl -u docker -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status docker` — note Active/Failed and the last log lines.

    2. Read `journalctl -u docker -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart docker` and confirm `systemctl is-active docker` succeeds.


    WHY: the grader checks real service state, not marker files.'
