description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `devops: Runbooks — Backup
  and Recovery` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for runbooks. Leadership wants
  proof that restore works — not just that scripts exit zero. Backup and recovery drill for runbooks.
  Ensure backups run on schedule, retention is correct, and you can restore documented operational procedures
  within the lab RTO.


  OBJECTIVE: Backup coverage for runbooks is complete and restorable; Retention and encryption meet the
  stated policy; A restore drill proves data integrity. Success means `systemctl is-active rsyslog` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for runbooks is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for runbooks. Leadership wants proof that
  restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status rsyslog` and `journalctl -u rsyslog -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status rsyslog` — note Active/Failed and the last log lines.

    2. Read `journalctl -u rsyslog -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart rsyslog` and confirm `systemctl is-active rsyslog` succeeds.


    WHY: the grader checks real service state, not marker files.'
