description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Helm Release Revision History
  Limit Hit` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes helm release in a non-deployed state needing a rollback to a
  good revision. A helm release cannot roll back cleanly because an upgrade left it in a non-deployed
  state. Roll back to a known deployed revision and confirm the release is healthy.


  OBJECTIVE: Confirm the release is not deployed; Roll back to a deployed revision; Verify helm history
  shows deployed. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A Kubernetes helm release in a non-deployed state needing a rollback to a good revision.
