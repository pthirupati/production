  node exposing git repos, pipelines, artifacts, and runbooks; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: Ubuntu server running Consul agent. Stale service IDs are:

  myapp-pod-abc123 and myapp-pod-def456. These pods no longer exist.

  Consul HTTP API at http://localhost:8500. Use consul CLI or API to deregister.

  OBJECTIVE: List Consul services and identify stale registrations; Deregister the stale service entries
