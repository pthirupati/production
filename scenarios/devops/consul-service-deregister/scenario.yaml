description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix
  Consul Service Deregistration on Pod Deletion` during a realistic incident. The
  business impact is reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines,
  artifacts, and runbooks. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Ubuntu server running Consul agent. Stale service IDs
  are:

  myapp-pod-abc123 and myapp-pod-def456. These pods no longer exist.

  Consul HTTP API at http://localhost:8500. Use consul CLI or API to deregister. Consul
  is holding stale service registrations for pods that have been deleted.

  Health checks are failing for these ghost services, and load balancers are

  routing traffic to non-existent endpoints. You need to deregister the stale

  services and fix the Consul agent configuration to auto-deregister unhealthy services.


  OBJECTIVE: List Consul services and identify stale registrations; Deregister the
  stale service entries via Consul API; Configure enable_tag_override and deregister_critical_service_after.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- List Consul services and identify stale registrations
- Deregister the stale service entries via Consul API
- Configure enable_tag_override and deregister_critical_service_after
- Verify only healthy, running services appear in Consul
