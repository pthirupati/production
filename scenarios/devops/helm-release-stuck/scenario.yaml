title: Helm Release Stuck Pending Upgrade
slug: devops-helm-release-stuck
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Helm Release Stuck Pending
  Upgrade` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Kubernetes cluster with Helm. A release is stuck in pending-upgrade after
  an upgrade failed mid-flight, blocking new upgrades until it''s rolled back or forced to complete. A
  Helm release is stuck in pending-upgrade state after a failed chart/values change, so Helm refuses further
  operations on it ("another operation is in progress" or it stays pending). The release must be recovered
  by rolling back to the last good revision or completing the upgrade. Identify the failed revision and
  restore the release to deployed.


  OBJECTIVE: Run helm history and identify the failed/pending revision; Roll back to the last good revision
  (or force-complete the upgrade); Verify the release returns to deployed and pods are healthy. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
lab_mode: simulation
simulation_type: devops
time_limit: 900
max_score: 100
is_free: false
objectives:
- Run helm history and identify the failed/pending revision
- Roll back to the last good revision (or force-complete the upgrade)
- Verify the release returns to deployed and pods are healthy
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
initial_state: Kubernetes cluster with Helm. A release is stuck in pending-upgrade after an upgrade failed
