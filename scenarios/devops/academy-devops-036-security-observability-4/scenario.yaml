title: 'DevOps: Observability — Security Practice'
slug: academy-devops-036-security-observability-4
technology: DevOps
category: Security
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Security review: harden observability on this DevOps system. Close unsafe
  defaults, enforce least privilege, and ensure logs, metrics, traces, and dashboards
  cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to observability are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around observability.
  Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the telemetry pipeline and dashboards.

    2. Write down what looks normal versus wrong or missing for observability.

    3. Recall the core idea: logs, metrics, traces, and dashboards. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for observability.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the telemetry pipeline and dashboards.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit
    access the workload actually needs.

    3. Verify the result — signals enable fast diagnosis.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-devops-036-security-observability-4.conf`,
    then click Check Solution.'
