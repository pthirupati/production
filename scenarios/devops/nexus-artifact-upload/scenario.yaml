description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix Nexus Repository Artifact
  Upload Permission` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Nexus Repository Manager running at http://localhost:8081. The "deploy" user

  exists but only has the nx-anonymous role. The releases repository requires

  nx-repository-write permission. Admin credentials are in /opt/nexus/admin_creds. CI/CD pipeline artifact
  uploads to Nexus Repository Manager are failing with

  HTTP 403 Forbidden. The deploy user account doesn''t have the correct role

  assigned to upload to the releases repository. Fix the permissions so the

  pipeline can upload artifacts.


  OBJECTIVE: Identify the Nexus user missing upload permissions; Assign the nx-repository-write role to
  the deploy user; Verify artifact upload succeeds after permission fix. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the Nexus user missing upload permissions
- Assign the nx-repository-write role to the deploy user
- Verify artifact upload succeeds after permission fix
