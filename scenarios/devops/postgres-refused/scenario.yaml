description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `PostgreSQL
  Connection Refused` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines,
  artifacts, and runbooks. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Ubuntu server with PostgreSQL 14. Connections to 127.0.0.1
  fail because postgresql.conf (/etc/postgresql/14/main/postgresql.conf) has a bad
  listen_addresses/invalid line, so the server doesn''t listen or won''t start. The
  application team reports database connection failures after a recent PostgreSQL
  config change. Connections to 127.0.0.1 are refused because listen_addresses was
  misconfigured (or an invalid line keeps the service from starting), so Postgres
  isn''t accepting TCP connections. Restore a valid configuration and connectivity.


  OBJECTIVE: Diagnose why PostgreSQL refuses connections; Fix listen_addresses (and
  any invalid line) in postgresql.conf; Restart PostgreSQL and verify psql connects.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Diagnose why PostgreSQL refuses connections
- Fix listen_addresses (and any invalid line) in postgresql.conf
- Restart PostgreSQL and verify psql connects
initial_state: Ubuntu server with PostgreSQL 14. Connections to 127.0.0.1 fail because
  postgresql.conf (/etc/postgresql/14/main/postgresql.conf) has a bad listen_addresses/invalid
  line, so the server doesn't listen or won't start.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status postgresql` and `pg_isready` for
    connection state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check service status and `/var/log/postgresql/` logs.

    2. Verify `pg_hba.conf` and `postgresql.conf` for listen addresses.

    3. Test with `psql -U postgres -c ''SELECT 1''`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix auth rules, data directory permissions, or port conflict.

    2. `systemctl restart postgresql`.

    3. Confirm `pg_isready` reports accepting connections.


    WHY: the database must accept connections, not just start.'
