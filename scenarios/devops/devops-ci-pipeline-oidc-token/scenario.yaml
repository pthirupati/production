description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `CI Deploy Failing on Expired
  OIDC Token` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A CI/CD or Helm environment with the documented ci-pipeline fault. The deploy
  stage fails because the cloud OIDC federation token is misconfigured/expired. Fix the pipeline credentials
  and confirm it passes.


  OBJECTIVE: Confirm the pipeline is failing; Fix the pipeline configuration; Verify the pipeline passes.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
