description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Kubernetes
  Pod CrashLoopBackOff` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines,
  artifacts, and runbooks. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes environment on Ubuntu with a manifest
  at /opt/k8s/deployment.yaml. The Service targetPort (8080) doesn''t match nginx''s
  containerPort (80), and nginx isn''t serving, so the app is down. Production pods
  backing an nginx web service are in CrashLoopBackOff and the site is unreachable.
  In this manifest the Service''s targetPort doesn''t match nginx''s containerPort,
  and the web server isn''t actually serving — so traffic never reaches a working
  backend. Fix the manifest port mapping and get nginx responding.


  OBJECTIVE: Analyze /opt/k8s/deployment.yaml for the port mismatch; Align the Service
  targetPort with nginx''s containerPort (80); Verify the web server responds on the
  correct port. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Analyze /opt/k8s/deployment.yaml for the port mismatch
- Align the Service targetPort with nginx's containerPort (80)
- Verify the web server responds on the correct port
initial_state: Simulated Kubernetes environment on Ubuntu with a manifest at /opt/k8s/deployment.yaml.
  The Service targetPort (8080) doesn't match nginx's containerPort (80), and nginx
  isn't serving, so the app is down.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>`
    for any pod not in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
