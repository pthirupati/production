jira_priority: Medium
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix
  the Broken CI/CD Pipeline` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines,
  artifacts, and runbooks. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Repository at /opt/app with a broken .gitlab-ci.yml: inconsistent
  indentation under the script: block and a typo''d Docker image tag cause the pipeline
  to fail validation/builds. The deployment pipeline has failed since yesterday''s
  merge. GitLab CI rejects the .gitlab-ci.yml with YAML errors (bad indentation under
  script:) and the build references a Docker image whose tag is mistyped, so jobs
  never run. Fix the YAML structure and the image reference so the pipeline parses
  and the build succeeds.


  OBJECTIVE: Validate the .gitlab-ci.yml and find the YAML/indentation errors; Fix
  the indentation under script: and correct the Docker image tag; Confirm the pipeline
  parses and the build job succeeds. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Validate the .gitlab-ci.yml and find the YAML/indentation errors
- 'Fix the indentation under script: and correct the Docker image tag'
- Confirm the pipeline parses and the build job succeeds
initial_state: 'Repository at /opt/app with a broken .gitlab-ci.yml: inconsistent
  indentation under the script: block and a typo''d Docker image tag cause the pipeline
  to fail validation/builds.'
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the
    failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
