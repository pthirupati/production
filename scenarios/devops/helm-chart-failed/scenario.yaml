description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix Helm Chart Missing Required
  Values` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Kubernetes cluster with Helm 3 installed. Chart at /opt/helm/myapp-chart.

  The values.yaml is missing required database.host and database.port entries.

  Database host should be db.internal and port should be 5432. A Helm chart deployment is failing because
  required values are missing from

  the values.yaml file. The chart requires database.host and database.port

  to be set but they are absent. The deployment is blocking the release.

  Add the missing required values and redeploy.


  OBJECTIVE: Identify which required values are missing from values.yaml; Add the missing database.host
  and database.port values; Verify helm install or upgrade succeeds without errors. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
