title: Setup GitLab CI Pipeline
slug: setup-gitlab-pipeline-do
technology: DevOps
category: Build Lab
difficulty: easy
scenario_type: do
time_limit: 900
max_score: 100
infrastructure_type: docker
lab_mode: docker
jira_priority: Low
is_free: false
description: 'Build task: create a working GitLab CI pipeline from scratch. Starting with no CI config,
  author a .gitlab-ci.yml that defines at least a build and test stage, commit it, and confirm the pipeline
  runs to a passing (green) state.'
objectives:
- Create a .gitlab-ci.yml defining build and test stages
- Use a valid image and correct YAML structure
- Confirm the pipeline runs and all jobs pass
initial_state: Repository with no CI configuration yet. You will create a .gitlab-ci.yml and get the pipeline
  passing.
hints:
- order: 1
  cost: 10
  content: 'Create .gitlab-ci.yml with `stages: [build, test]`, a base `image:` (e.g. python:3.12 or node:20),
    and one job per stage with a `script:` block.'
- order: 2
  cost: 15
  content: Keep the YAML valid — consistent indentation under `script:`. Validate with GitLab's CI Lint
    (or `python3 -c "import yaml; yaml.safe_load(open('.gitlab-ci.yml'))"`).
- order: 3
  cost: 20
  content: Commit and push to trigger the pipeline; watch it under CI/CD > Pipelines and confirm both
    the build and test jobs pass (green).
