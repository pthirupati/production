description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Setup GitLab CI Pipeline`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Repository with no CI configuration yet. You will create a .gitlab-ci.yml
  and get the pipeline passing. Build task: create a working GitLab CI pipeline from scratch. Starting
  with no CI config, author a .gitlab-ci.yml that defines at least a build and test stage, commit it,
  and confirm the pipeline runs to a passing (green) state.


  OBJECTIVE: Create a .gitlab-ci.yml defining build and test stages; Use a valid image and correct YAML
  structure; Confirm the pipeline runs and all jobs pass. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Create a .gitlab-ci.yml defining build and test stages
- Use a valid image and correct YAML structure
- Confirm the pipeline runs and all jobs pass
initial_state: Repository with no CI configuration yet. You will create a .gitlab-ci.yml and get the pipeline
  passing.
