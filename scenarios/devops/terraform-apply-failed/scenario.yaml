description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix Terraform Variable Type
  Error` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server with Terraform installed. Working directory is /opt/terraform/infra.

  The variables.tf file declares instance_count as type string but tfvars provides

  a number value, causing a type mismatch error. Terraform plan is failing with a variable type mismatch
  error. A recent change

  to variables.tf introduced an incorrect type constraint. The variable

  "instance_count" is declared as type string but the terraform.tfvars file

  provides a number. Fix the type declaration so terraform plan succeeds.


  OBJECTIVE: Run terraform plan and identify the variable type error; Fix the type constraint in variables.tf;
  Verify terraform plan completes without errors. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
