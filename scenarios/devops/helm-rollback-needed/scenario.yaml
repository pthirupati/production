is_free: false
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Roll
  Back a Broken Helm Deployment` during a realistic incident. The business impact
  is reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines,
  artifacts, and runbooks. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Kubernetes cluster with Helm 3. The "myapp" release in
  the "production" namespace

  was upgraded to revision 3 with a broken image tag. Revision 2 was working.

  Pods are currently in ImagePullBackOff state. A helm upgrade for the "myapp" release
  introduced a broken container image

  that causes all pods to crash with ImagePullBackOff. The application is down.

  You need to roll back the Helm release to the previous working version

  to restore service immediately.


  OBJECTIVE: Check the helm release history to identify the last working revision;
  Roll back the helm release to the previous revision; Verify pods are running after
  the rollback. Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Check the helm release history to identify the last working revision
- Roll back the helm release to the previous revision
- Verify pods are running after the rollback
initial_state: 'Kubernetes cluster with Helm 3. The "myapp" release in the "production"
  namespace

  was upgraded to revision 3 with a broken image tag. Revision 2 was working.

  Pods are currently in ImagePullBackOff state.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>`
    for any pod not in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
