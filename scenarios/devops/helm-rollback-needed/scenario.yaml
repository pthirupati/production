description: 'CONTEXT: A team operating DevOps delivery has raised a ticket for `Roll Back a Broken Helm
  Deployment`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab. The architecture is a single lab-primary
  node exposing git repos, pipelines, artifacts, and runbooks; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: Kubernetes cluster with Helm 3. The "myapp" release in the "production" namespace

  was upgraded to revision 3 with a broken image tag. Revision 2 was working.

  Pods are currently in ImagePullBackOff state.

  OBJECTIVE: Check the helm release history to identify the last working revision; Roll back the helm
  release to the previous revision; Verify pods are running after the rollback. Acceptance criteria: the
  change is minimal and reversible, and success means `kubectl get pods` shows every pod Running.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant git repos, pipelines, artifacts, and runbooks), changing one thing at a time. Check
  your work continuously against the objective — success means `kubectl get pods` shows every pod Running.

  VERIFY: Re-run the same check the grader uses and confirm `kubectl get pods` shows every pod Running.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Check the helm release history to identify the last working revision
- Roll back the helm release to the previous revision
- Verify pods are running after the rollback
initial_state: 'Kubernetes cluster with Helm 3. The "myapp" release in the "production"
  namespace

  was upgraded to revision 3 with a broken image tag. Revision 2 was working.

