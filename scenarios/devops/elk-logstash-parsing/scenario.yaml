description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix
  Logstash Grok Pattern Parsing Failure` during a realistic incident. The business
  impact is reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines,
  artifacts, and runbooks. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Ubuntu server running Logstash. Pipeline config at /etc/logstash/conf.d/app.conf.

  Logs at /var/log/app/app.log use format: [2024-01-15 10:30:45] ERROR myapp - Connection
  timeout

  But the grok pattern uses %{TIMESTAMP_ISO8601:timestamp} which does not match

  the bracket-enclosed date format. The ELK stack Logstash pipeline is generating
  _grokparsefailure tags on

  all incoming log events. The grok pattern in the filter section does not

  match the actual log format. Fix the grok pattern so logs are correctly

  parsed and structured fields are extracted.


  OBJECTIVE: Identify the broken grok pattern in the Logstash pipeline config; Examine
  sample logs to understand the actual format; Fix the grok pattern to correctly parse
  the log entries. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Identify the broken grok pattern in the Logstash pipeline config
- Examine sample logs to understand the actual format
- Fix the grok pattern to correctly parse the log entries
- Verify Logstash processes logs without _grokparsefailure
