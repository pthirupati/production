description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix Alertmanager Routing
  for Wrong Severity` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server running Alertmanager. Config at /etc/alertmanager/alertmanager.yml.

  The routes section has a catch-all route before the severity-specific routes,

  meaning critical alerts match the first catch-all rule and never reach the

  critical severity route. Alertmanager is routing all alerts — including critical ones — to a low-priority

  Slack channel for warnings. The routing tree has a catch-all rule that sends

  everything to the warning receiver before severity-specific rules can match.

  Fix the routing rules so critical alerts go to the critical channel and

  warning alerts go to the warning channel.


  OBJECTIVE: Inspect the Alertmanager routing configuration; Identify why critical alerts are misrouted
  to the warning receiver; Fix the route matchers/ordering in alertmanager.yml. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Inspect the Alertmanager routing configuration
- Identify why critical alerts are misrouted to the warning receiver
- Fix the route matchers/ordering in alertmanager.yml
- Verify critical alerts route to the correct receiver
