description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Fix Jenkins Job Out of Memory`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server with Jenkins installed. Build jobs are failing with OutOfMemoryError.

  Jenkins configuration is at /etc/default/jenkins. The JVM is currently configured

  with -Xmx512m which is too small. Jenkins build jobs are failing with Java OutOfMemoryError. The Jenkins
  master JVM

  is running with default heap settings which are too small for the current workload.

  You need to increase the JVM heap size in the Jenkins startup configuration.


  OBJECTIVE: Identify the current JVM heap settings for Jenkins; Increase the JVM heap to at least 2GB
  (-Xmx2g); Restart Jenkins and verify the new settings are active. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the current JVM heap settings for Jenkins
- Increase the JVM heap to at least 2GB (-Xmx2g)
- Restart Jenkins and verify the new settings are active
