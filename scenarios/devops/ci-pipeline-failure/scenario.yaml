title: CI Pipeline Failure on Deploy Stage
slug: devops-ci-pipeline-failure
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `CI Pipeline Failure on Deploy
  Stage` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: GitLab CI project whose deploy job fails: KUBECONFIG is not provided to the
  job and IMAGE_TAG points at a non-existent image, so deployment errors out with unauthorized / image-not-found.
  A GitLab CI pipeline fails at the deploy stage. The deploy job can''t authenticate to the cluster because
  its KUBECONFIG is missing/empty, and it references an image tag that doesn''t exist, so the rollout
  never happens. Read the failed job log, fix the pipeline variables, and re-run the deploy to a green
  pipeline.


  OBJECTIVE: Identify the failing deploy job and its error in the pipeline logs; Fix the KUBECONFIG and
  IMAGE_TAG variables; Re-run the pipeline and confirm the deploy stage passes. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
lab_mode: simulation
