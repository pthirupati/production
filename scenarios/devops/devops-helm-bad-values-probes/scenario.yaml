title: Helm Values Override Broke Probes on Upgrade
slug: devops-helm-bad-values-probes
technology: DevOps
category: Helm
difficulty: medium
lab_mode: simulation
simulation_type: generic
time_limit: 1500
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: A helm upgrade with bad values set readiness probe paths that always fail, leaving the release
  stuck. Roll back to the deployed revision and confirm health.
initial_state: A Kubernetes helm release stuck after an upgrade applied invalid probe values.
objectives:
- Confirm the release is stuck after the values change
- Roll back to the last deployed revision
- Verify the release is deployed
hints:
- order: 1
  cost: 10
  content: helm history shows pending/failed after the values change.
- order: 2
  cost: 15
  content: helm rollback to the working revision.
- order: 3
  cost: 20
  content: Release deployed.
