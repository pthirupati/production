description: 'CONTEXT: A team operating DevOps delivery needs you to resolve `Helm Values Override Broke
  Probes on Upgrade` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline CI/CD lab with git repos, pipelines, artifacts,
  and runbooks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes helm release stuck after an upgrade applied invalid probe values.
  A helm upgrade with bad values set readiness probe paths that always fail, leaving the release stuck.
  Roll back to the deployed revision and confirm health.


  OBJECTIVE: Confirm the release is stuck after the values change; Roll back to the last deployed revision;
  Verify the release is deployed. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
