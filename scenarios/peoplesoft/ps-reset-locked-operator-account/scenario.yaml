title: Reset a Locked Operator Account
slug: ps-reset-locked-operator-account
category: Fix
description: 'CONTEXT: A team operating PeopleSoft administration needs you to resolve `Reset a Locked
  Operator Account` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab with PIA, Process Scheduler,
  Integration Broker, and app server logs. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: A PeopleSoft environment where the HCMADMIN operator account is locked out
  after 6 failed sign-on attempts. An administrator, HCMADMIN, is locked out of PeopleSoft after repeated
  failed sign-on attempts — the Account Locked Out flag is set on their User Profile. Open the PIA simulator,
  go to User Profiles for HCMADMIN, and clear the lockout so the administrator can sign in again.


  OBJECTIVE: Open the PeopleSoft (PIA) simulator from the lab toolbar; Navigate to PeopleTools > Security
  > User Profiles for HCMADMIN; Confirm the Account Locked Out flag is set. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
