hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — report manager and node config.

    2. Write down what looks normal versus wrong or missing for report distribution.

    3. Recall the core idea: report nodes and distribution. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for report distribution.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — report manager and node config.

    2. Configure credentials and networking, then drive one happy-path transaction
    end to end across both systems.

    3. Verify the result — reports generate and distribute.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-peoplesoft-090-integration-reports-9.conf`,
