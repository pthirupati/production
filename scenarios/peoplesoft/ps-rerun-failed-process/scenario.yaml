title: Rerun a Failed Process Scheduler Job
slug: ps-rerun-failed-process
category: Fix
description: 'CONTEXT: A team operating PeopleSoft administration needs you to resolve `Rerun a Failed
  Process Scheduler Job` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab with PIA, Process Scheduler,
  Integration Broker, and app server logs. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: A PeopleSoft HCM 9.2 environment whose GL_JOURNAL_POST batch run (instance
  1009) is sitting in Error in Process Monitor. A nightly batch in your PeopleSoft HCM environment failed.
  The GL_JOURNAL_POST Application Engine run (instance 1009) ended in Error in Process Monitor, so the
  General Ledger journals were never posted. Open the PeopleSoft Internet Architecture (PIA) simulator,
  find the failed run in Process Monitor, and rerun it from the Process Scheduler so it completes Successfully.


  OBJECTIVE: Open the PeopleSoft (PIA) simulator from the lab toolbar; Navigate to PeopleTools > Process
  Scheduler > Process Monitor; Find the GL_JOURNAL_POST run (instance 1009) that ended in Error. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
