hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — Process Monitor and process logs.

    2. Write down what looks normal versus wrong or missing for Process Monitor.

    3. Recall the core idea: process scheduler, run status, and logs. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Process Monitor.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — Process Monitor and process logs.

    2. Create the smallest working slice of Process Monitor first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — the process runs to Success.

    4. Click Check Solution once `systemctl is-active nginx` returns active.'
