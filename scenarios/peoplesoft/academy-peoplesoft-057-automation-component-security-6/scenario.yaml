description: 'CONTEXT: A team operating PeopleSoft administration needs you to resolve `peoplesoft: Component
  Security — Automation Practice` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab with PIA, Process Scheduler,
  Integration Broker, and app server logs. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for component security. Automate the
  boring parts without hiding important safety checks. Automation lab: remove toil around component security.
  Codify repeatable steps for component/menu access by permission and prove the automation is idempotent.


  OBJECTIVE: Day-2 component security work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
