description: This beginner-friendly Oracle PeopleSoft lab introduces PeopleSoft PIA
  navigation. You will explore PIA domains, menus, components, and user sessions on
  the PeopleSoft app server lab. Read the environment first, then follow the guided
  steps — no prior production experience required.
objectives:
- Understand how PeopleSoft PIA navigation work in this lab environment
- Identify the main status and configuration signals for PeopleSoft PIA navigation
- Confirm you can read the current state confidently before changing anything
initial_state: The PeopleSoft app server lab is online with a starter PeopleSoft PIA
  navigation setup. Some pieces are intentionally incomplete so you can learn how
  they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — PIA access logs, web server status, and app server
    domains.

    2. Write down what looks normal versus wrong or missing for PeopleSoft PIA navigation.

    3. Recall the core idea: PIA domains, menus, components, and user sessions. Form
    one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for PeopleSoft PIA
    navigation.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — PIA access logs, web server status, and app server
    domains.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — PIA login and target component load without server errors.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-peoplesoft-011-learn-pia-navigation-2.conf`,
    then click Check Solution.'
