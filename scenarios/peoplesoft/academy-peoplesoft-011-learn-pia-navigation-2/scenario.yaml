description: This beginner-friendly Oracle PeopleSoft lab introduces PeopleSoft PIA
  navigation. You will explore PIA domains, menus, components, and user sessions on
  the PeopleSoft app server lab. Read the environment first, then complete the guided
  steps — no prior production experience required.
objectives:
- Understand how PeopleSoft PIA navigation work in this lab environment
- Identify the main status and configuration signals for PeopleSoft PIA navigation
- Confirm you can read the current state confidently before changing anything
initial_state: The PeopleSoft app server lab is online with a starter PeopleSoft PIA
  navigation setup. Some pieces are intentionally incomplete so you can learn how
  the pieces fit together. Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: PIA access logs, web server status, and app server domains.
    Write down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — PIA domains, menus, components, and user sessions. Make one
    small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-peoplesoft-011-learn-pia-navigation-2.conf`,
    then click Check Solution.
