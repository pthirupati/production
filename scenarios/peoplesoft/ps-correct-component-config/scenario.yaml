title: Navigate to and Correct a Component Configuration
slug: ps-correct-component-config
category: Fix
description: 'CONTEXT: A team operating PeopleSoft administration needs you to resolve `Navigate to and
  Correct a Component Configuration` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab with PIA, Process Scheduler,
  Integration Broker, and app server logs. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: A PeopleSoft HCM environment where the Position Data component is misconfigured
  (auto_create_position=N, max_head_count=0), blocking new positions. HR cannot create new positions.
  The Position Data component was misconfigured during a recent change — auto_create_position is set to
  N and max_head_count is 0, which blocks every new position. Open the PIA simulator, navigate to the
  Position Data component, and correct its configuration so positions can be created again (auto_create_position
  = Y and max_head_count at least 1).


  OBJECTIVE: Open the PeopleSoft (PIA) simulator from the lab toolbar; Navigate to Workforce Administration
  > Manage Positions > Position Data; Review the component configuration that is blocking new positions.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
