title: Restore a Missing Permission to a Permission List
slug: ps-add-missing-permission-list
category: Fix
description: 'CONTEXT: A team operating PeopleSoft administration needs you to resolve `Restore a Missing
  Permission to a Permission List` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab with PIA, Process Scheduler,
  Integration Broker, and app server logs. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: A PeopleSoft HCM environment where the HCCPPRM permission list is missing
  the HC_POSITION_DATA permission, blocking the Position Data component. After a recent security change,
  HCM administrators can no longer open the Position Data component — PeopleSoft denies access even though
  they hold the HCM Administrator role. The HCCPPRM permission list that backs that role lost its HC_POSITION_DATA
  permission. Open the PIA simulator and add the missing permission back to the HCCPPRM permission list
  so Position Data opens again.


  OBJECTIVE: Open the PeopleSoft (PIA) simulator from the lab toolbar; Navigate to PeopleTools > Security
  > Permission Lists and open HCCPPRM; Identify the permission missing for the Position Data component.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
