title: Restore a Missing Permission to a Permission List
slug: ps-add-missing-permission-list
category: Security
description: >-
  After a recent security change, HCM administrators can no longer open the
  Position Data component — PeopleSoft denies access even though they hold the
  HCM Administrator role. The HCCPPRM permission list that backs that role lost
  its HC_POSITION_DATA permission. Open the PIA simulator and add the missing
  permission back to the HCCPPRM permission list so Position Data opens again.
difficulty: medium
lab_mode: simulation
simulation_type: peoplesoft
technology: peoplesoft
jira_priority: High
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Open the PeopleSoft (PIA) simulator from the lab toolbar
- Navigate to PeopleTools > Security > Permission Lists and open HCCPPRM
- Identify the permission missing for the Position Data component
- Add the HC_POSITION_DATA permission back to the HCCPPRM permission list
initial_state: >-
  A PeopleSoft HCM environment where the HCCPPRM permission list is missing the
  HC_POSITION_DATA permission, blocking the Position Data component.
hints:
- order: 1
  cost: 10
  content: >-
    Access is denied because a permission list lost a permission, not because a
    role is missing. Inspect the HCCPPRM permission list that the HCM
    Administrator role uses.
- order: 2
  cost: 15
  content: >-
    Position Data requires the HC_POSITION_DATA permission. Add that permission
    key to the HCCPPRM permission list (add_permission with permission_list
    HCCPPRM, permission HC_POSITION_DATA).
- order: 3
  cost: 20
  content: >-
    Once HCCPPRM grants HC_POSITION_DATA again, any role that includes HCCPPRM
    (HC_ADMIN) regains Position Data access.
