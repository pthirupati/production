description: 'CONTEXT: A team operating PeopleSoft administration needs you to resolve `peoplesoft: Process
  Scheduler — Backup and Recovery` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab with PIA, Process Scheduler,
  Integration Broker, and app server logs. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for process scheduler. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for process
  scheduler. Ensure backups run on schedule, retention is correct, and you can restore server status,
  queues, and load within the lab RTO.


  OBJECTIVE: Backup coverage for process scheduler is complete and restorable; Retention and encryption
  meet the stated policy; A restore drill proves data integrity. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
