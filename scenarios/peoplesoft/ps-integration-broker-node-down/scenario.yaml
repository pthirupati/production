title: Bring a Down Integration Broker Node Back Active
slug: ps-integration-broker-node-down
category: Build
description: 'CONTEXT: A team operating PeopleSoft administration needs you to resolve `Bring a Down Integration
  Broker Node Back Active` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab with PIA, Process Scheduler,
  Integration Broker, and app server logs. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: A PeopleSoft environment whose PSFT_HR Integration Broker node is Down, halting
  HR publish/subscribe message delivery. HR data is no longer syncing to downstream systems. In Integration
  Broker, the PSFT_HR node is showing Down, so PERSON_BASIC_SYNC messages are queuing and never delivering.
  Open the PIA simulator, go to the Integration Broker Nodes page, and bring the PSFT_HR node back to
  Active.


  OBJECTIVE: Open the PeopleSoft (PIA) simulator from the lab toolbar; Navigate to PeopleTools > Integration
  Broker > Nodes; Identify the PSFT_HR node that is Down. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
lab_mode: simulation
simulation_type: peoplesoft
technology: peoplesoft
jira_priority: High
time_limit: 1200
