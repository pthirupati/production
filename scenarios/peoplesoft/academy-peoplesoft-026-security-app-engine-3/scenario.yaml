description: 'Security review: harden PeopleSoft App Engine on this Oracle PeopleSoft
  system. Close unsafe defaults, enforce least privilege, and ensure AE programs,
  sections, state records, and batch timing cannot be abused — without breaking legitimate
  use.'
objectives:
- Unsafe defaults related to PeopleSoft App Engine are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around PeopleSoft
  App Engine. Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Baseline current exposure: Process Scheduler details, AE traces, and SQL
    for state tables. Note world-readable files, open ports, or excessive roles.'
- order: 2
  cost: 15
  content: Apply least privilege incrementally. Prefer explicit allows over broad
    wildcards.
- order: 3
  cost: 20
  content: Re-test legitimate workflows after hardening. Finish with `# FIXED-OK`
    in `/opt/fixitlab/academy/academy-peoplesoft-026-security-app-engine-3.conf` and
    Check Solution.
