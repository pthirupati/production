description: 'CONTEXT: A team operating PeopleSoft administration needs you to resolve `peoplesoft: Permission
  Lists — Troubleshooting Drill` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab with PIA, Process Scheduler,
  Integration Broker, and app server logs. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: The PeopleSoft app server lab is degraded. Users cannot access required pages.
  Recent changes may exist around permission lists, but do not restart blindly — gather evidence first.
  Production alert: users cannot access required pages. You are on call for peoplesoft and must troubleshoot
  permission lists methodically — triage symptoms, isolate root cause, apply the smallest safe fix, and
  confirm recovery.


  OBJECTIVE: The incident symptom is clear: users cannot access required pages; Root cause is isolated
  with evidence, not guesswork; Service behavior returns to normal after the fix. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: users cannot access required pages'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The PeopleSoft app server lab is degraded. Users cannot access required pages. Recent changes
