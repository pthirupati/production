hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — roles/ tree, `ansible-galaxy list`, and role variable
    precedence.

    2. Write down what looks normal versus wrong or missing for Ansible roles.

    3. Recall the core idea: role layout, defaults/vars, tasks, handlers, and dependencies.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Ansible roles.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — roles/ tree, `ansible-galaxy list`, and role variable
    precedence.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup
    first if the change is risky.

    3. Verify the result — role applies idempotently with the expected variables per
    group.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-peoplesoft-003-operate-roles.conf`,
    then click Check Solution.'
