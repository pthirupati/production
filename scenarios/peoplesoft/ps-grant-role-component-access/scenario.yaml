title: Grant a User the Role to Access a Component
slug: ps-grant-role-component-access
category: Fix
description: 'CONTEXT: A team operating PeopleSoft administration needs you to resolve `Grant a User the
  Role to Access a Component` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab with PIA, Process Scheduler,
  Integration Broker, and app server logs. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: A PeopleSoft HCM/Financials environment where FINUSER holds only FIN_ANALYST
  and is missing the AP_PROCESSOR role needed to open Voucher Entry. A finance user, FINUSER, has raised
  a ticket: they cannot open the Voucher Entry component in Accounts Payable — PeopleSoft returns "You
  are not authorized to access this component." Their account holds only the Financials Analyst role.
  Open the PIA simulator and grant FINUSER the role that carries the FIN_AP_VOUCHER permission so they
  can enter vouchers.


  OBJECTIVE: Open the PeopleSoft (PIA) simulator from the lab toolbar; Navigate to PeopleTools > Security
  > User Profiles for FINUSER; Identify which role grants the FIN_AP_VOUCHER permission for Voucher Entry.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
