  title: Roll Back a Bad Change Package in Production
  description: Identify change package CP-014 as the source of the Accounts Payable
    regression and roll it back out of PROD so PSU_VOUCHER_REC returns to its pre-patch
    definition.
  background: This peoplesoft lab teaches incident response against a managed migration
    — read the apply history, target the affected environment, and restore rather
    than patch over.
  validation:
