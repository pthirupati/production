solution:
  summary: Read the CP-014 apply history to confirm PSU_VOUCHER_REC was version 5
    before the patch, then roll CP-014 back out of the PROD environment. The rollback
    restores the exact definitions the apply overwrote, returning PROD to version
    5 and clearing the Accounts Payable failure.
  files_changed: []
  commands_run:
  - bash check.sh
  reference_docs: peoplesoft-fundamentals
