description: 'CONTEXT: A team operating PeopleSoft administration has raised a ticket
  for `Operator Account Lock — Observability Lab`. A customer-facing workflow is degraded
  and the on-call engineer (you) must diagnose and resolve it. Business impact: reduced
  service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab. The
  architecture is a single lab-primary node exposing PIA, Process Scheduler, Integration
  Broker, and app server logs; treat it as the production host for this incident.
  All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The system runs, but operator account lock lacks useful
  telemetry. Dashboards/alerts are blank or noisy — improve signal quality.


  OBJECTIVE: Day-2 operator account lock work completes safely in this environment;
  Changes are verified with before/after checks; The system remains stable for dependent
  teams. Acceptance criteria: the change is minimal and reversible, and success means
  `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it
  and use the equivalent already on the host. Make the smallest configuration change
  that moves the system toward the objective (edit the relevant PIA, Process Scheduler,
  Integration Broker, and app server logs), changing one thing at a time. Check your
  work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully.
  Capture the before/after output as evidence. Success criteria: the objective''s
  healthy state holds on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately
  (restore the original config file / undo the edit / restart the affected component)
  and re-observe before trying another hypothesis. Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Day-2 operator account lock work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but operator account lock lacks useful telemetry.
  Dashboards/alerts are blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: an operator is locked out.
    This lab is about operator account lock — account lock and password reset. Read
    the objectives and the current state, and note precisely what looks wrong versus
    healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For operator account lock problems the reliable
    method is: (1) reproduce/observe the failure, (2) narrow from the whole system
    down to the one component that owns the symptom, (3) change exactly one thing,
    (4) re-check. Add or fix the exporter / dashboard / alert with clear names, labels,
    and a sensible threshold.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    1. Inspect the current state with the user profile lock status.

    2. Each command above tells you something specific — status/health, recent errors,
    and the effective configuration. Read them in that order.

    3. Compare what you see to the objectives; the gap points at the fault.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of operator account lock
    is at fault.

    2. Re-run the most relevant of the user profile lock status focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state
    from ''an operator is locked out'' toward ''the account is unlocked and usable''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the smallest reversible change your hypothesis points to. Add or fix
    the exporter / dashboard / alert with clear names, labels, and a sensible threshold.

    2. Re-run `bash check.sh` and confirm the account is unlocked and usable.

    3. If it still fails, the hypothesis was wrong — go back to the evidence, do not
    stack changes.


    WHY: the grader validates real system state, not marker files — a fix only counts
    when the subsystem is actually healthy.'
