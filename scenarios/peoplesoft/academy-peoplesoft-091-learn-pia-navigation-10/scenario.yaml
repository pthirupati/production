description: 'CONTEXT: A team operating PeopleSoft administration needs you to resolve `peoplesoft: Peoplesoft
  Pia Navigation — Fundamentals Lab` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PeopleSoft app server lab with PIA, Process Scheduler,
  Integration Broker, and app server logs. All tools run locally; no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: The PeopleSoft app server lab is online with a starter PeopleSoft PIA navigation
  setup. Some pieces are intentionally incomplete so you can learn how they fit together. Nothing is on
  fire — focus on observation. This beginner-friendly peoplesoft lab introduces PeopleSoft PIA navigation.
  You will explore PIA domains, menus, components, and user sessions on the PeopleSoft app server lab.
  Read the environment first, then follow the guided steps — no prior production experience required.


  OBJECTIVE: Understand how PeopleSoft PIA navigation work in this lab environment; Identify the main
  status and configuration signals for PeopleSoft PIA navigation; Confirm you can read the current state
  confidently before changing anything. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
