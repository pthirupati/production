title: "ONTAP Volume Nearing Capacity — Grow Before It Goes Read-Only"
slug: ontap-volume-offline
technology: netapp
category: Fix
difficulty: easy
lab_mode: simulation
simulation_type: netapp
infrastructure_type: docker
time_limit: 600
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: >-
  CONTEXT: The on-call storage rotation just paged you about vol_web_data on the fixitlab-cluster
  ONTAP system. A capacity-monitoring alert fired at 95% utilization, one autosize step away from the
  volume hitting its space guarantee limit and forcing itself read-only — which would take the
  production web tier's uploads directory down mid-shift.


  ENVIRONMENT: You are working in NetApp ONTAP System Manager against a two-node cluster
  (fixitlab-cluster) hosting svm-prod (NFS/CIFS/iSCSI) and svm-dr (NFS, for disaster recovery). Volumes
  live on aggr1 (svm-prod) and aggr2 (svm-dr). vol_web_data sits on aggr1, which itself has 3.2TB of
  headroom free — the aggregate is nowhere near full, only the volume's own size cap is the problem.


  SYMPTOM / STARTING STATE: In Storage > Volumes, vol_web_data shows 100GB provisioned with 95GB used
  (95% utilized) — the red zone on the usage bar. vol_db_data on the same SVM sits at a comfortable
  60% and is not part of this incident. The aggregate hosting both volumes has ample free space, so
  the fix is a volume-level resize, not an aggregate-level rebalance.


  IMPACT: Once a FlexVol crosses its configured space-full threshold, ONTAP forces it read-only to
  protect data integrity — every write from the web tier (image uploads, session cache writes) would
  start failing. This is a proactive-fix ticket: the volume is not offline yet, but will be within
  hours at current write rate if nobody grows it.


  OBJECTIVE: Sign in to ONTAP System Manager, open Storage > Volumes, find vol_web_data's 95%-full
  usage bar, and resize the volume upward (to at least double its current size) so it has real
  headroom again before it hits the read-only threshold.
initial_state: >-
  ONTAP System Manager showing vol_web_data at 95GB used / 100GB provisioned (95% utilization) on
  aggr1, which itself has plenty of free space. No other volume in the cluster is near capacity.
objectives:
- Sign in to ONTAP System Manager
- Open Storage > Volumes and locate vol_web_data's 95%-utilized usage bar
- Resize vol_web_data to a larger provisioned size
- Confirm the volume's usage percentage drops back into the healthy range
hints:
- order: 1
  cost: 0
  content: >-
    ORIENT — what to observe and why: Don't touch anything yet. Open Storage > Volumes and look at
    the usage bar (used/provisioned) for every volume in the list. Exactly one volume is in the red —
    note its name, its current size, and which aggregate it lives on before deciding on a fix.
- order: 2
  cost: 10
  content: >-
    APPROACH — the troubleshooting method: A volume near its space-full threshold has two possible
    fixes in real ONTAP — grow the volume (if the aggregate has headroom) or free space inside it. Check
    the aggregate's own free capacity first: if the aggregate has plenty of room (it does here), growing
    the volume is the correct, minimal, reversible fix — you are not migrating data or touching the
    aggregate.
- order: 3
  cost: 25
  content: >-
    WHICH TOOL — the diagnostic command(s): 1. In Storage > Aggregates, confirm aggr1 has multiple TB
    of free space — this rules out an aggregate-capacity problem. 2. Back in Storage > Volumes, use the
    "Resize" action on the volume showing the 95% usage bar. 3. A resize only ever needs to move the
    provisioned size up, never touch used_gb — used space is what it is until the application deletes
    data.
- order: 4
  cost: 40
  content: >-
    NARROW DOWN — isolate the subsystem: The volume at risk is vol_web_data, currently provisioned at
    100GB with 95GB used. Doubling it to 200GB brings utilization down to roughly 47% — comfortably
    healthy — without needing to guess an exact number. Any new size strictly larger than the current
    provisioned size will clear the "near full" condition the console is tracking.
- order: 5
  cost: 60
  content: >-
    NEAR-SOLUTION — the fix shape + verify (you still apply it): Click "Resize" on vol_web_data, enter a
    new size larger than 100GB (200GB is a safe, realistic choice), and confirm. Refresh Storage >
    Volumes and check the usage bar has dropped out of the red zone. WHY: the grader checks that
    vol_web_data's provisioned size increased and the "volume near full" flag cleared in the simulated
    ONTAP state — a UI click without submitting a larger size does not count.
summary: Resize the ONTAP volume that is about to hit its space-full threshold before it forces itself
  read-only and breaks production writes.
