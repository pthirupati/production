title: 'NetApp ONTAP Storage: Qos — Backup and Recovery'
slug: academy-netapp-089-backup-qos-9
technology: netapp
category: Backup & Recovery
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: netapp
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Service operations lab. The `nginx` systemd unit is **failed/inactive** on this host — a
  realistic fault for Backup and Recovery workflows that depend on it. Diagnose with `systemctl status
  nginx` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active nginx`.
objectives:
- The `nginx` service is active (running)
- '`systemctl is-active nginx`` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `nginx` service is not running (`systemctl is-active nginx` → inactive/failed). Dependent
  Backup and Recovery tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: Qos is misconfigured and dependent workflows
    are failing. This lab is about Qos — how qos fits into NetApp ONTAP storage. Read the objectives and
    the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Qos problems the reliable method is: (1) reproduce/observe the
    failure, (2) narrow from the whole system down to the one component that owns the symptom, (3) change
    exactly one thing, (4) re-check. Repair or run the backup job, then perform a controlled restore into
    a scratch location to prove it works.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `systemctl status nginx` and `journalctl -u nginx -n 50`.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm `nginx` is failed/inactive.

    2. Read the unit journal for the root cause.

    3. Apply the smallest fix that restores the unit.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Repair the underlying config/cause for `nginx`.

    2. `systemctl enable --now nginx`.

    3. Verify with `systemctl is-active nginx` (expect active).'
