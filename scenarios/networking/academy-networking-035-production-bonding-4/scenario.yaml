description: 'CONTEXT: A team operating network operations needs you to resolve `networking: Nic Bonding
  — Production Readiness` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but NIC bonding is not production ready — missing
  guardrails, runbooks, or capacity checks. Production readiness for NIC bonding. Harden, document, and
  validate link aggregation modes and failover so the change is safe to run during a maintenance window.


  OBJECTIVE: Day-2 NIC bonding work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `systemctl is-active named` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 NIC bonding work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but NIC bonding is not production ready — missing guardrails,
  runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `cat /proc/net/bonding/bond0` and link state.

    2. Write down what looks normal versus wrong or missing for NIC bonding.

    3. Recall the core idea: link aggregation modes and failover. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status named` — note Active/Failed and the last log lines.

    2. Read `journalctl -u named -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `cat /proc/net/bonding/bond0` and link state.

    2. Apply production standards for NIC bonding: resource limits, monitoring, access controls, and a
    written rollback step.

    3. Verify the result — the bond is up with the correct mode and members.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
