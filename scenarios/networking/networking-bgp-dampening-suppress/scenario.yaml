description: 'CONTEXT: A team operating network operations needs you to resolve `BGP Route Dampening Suppressing
  Prefixes` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A router where BGP route dampening is suppressing prefixes after upstream
  flaps. Flapping upstream links triggered route dampening and key prefixes are now suppressed. Stabilize
  the link and clear dampening so the BGP session is healthy.


  OBJECTIVE: Confirm prefixes are suppressed by dampening; Stabilize the neighbor and clear dampening;
  Verify the session is Established with full prefixes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
