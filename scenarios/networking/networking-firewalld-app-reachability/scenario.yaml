hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: network ↔ security is not behaving as the scenario
    objectives require. This lab is about network ↔ security — how network ↔ security behaves in a network
    operations environment. Read the objectives and the current state, and note precisely what looks wrong
    versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For network ↔ security problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of network ↔ security is at fault.

    2. Re-run the most relevant of `firewall-cmd --list-ports` output focused on just that part to confirm
    it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''network ↔ security
    is not behaving as the scenario objectives require'' toward ''`firewall-cmd --list-ports` includes
    `80/tcp`''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.


    WHY: a running service behind a closed firewall still fails health checks.'
