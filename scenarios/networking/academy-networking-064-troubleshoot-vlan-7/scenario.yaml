description: Service operations lab. The `named` systemd unit is **failed/inactive** on this host — a
  realistic fault for Troubleshooting Drill workflows that depend on it. Diagnose with `systemctl status
  named` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active named`.
objectives:
- The `named` service is active (running)
- '`systemctl is-active named` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `named` service is not running (`systemctl is-active named` → inactive/failed). Dependent
  Troubleshooting Drill tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ip -d link`, bridge VLAN tables, and switch config.

    2. Write down what looks normal versus wrong or missing for VLANs.

    3. Recall the core idea: tagged interfaces, trunk ports, and segmentation. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for VLANs.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `ip -d link`, bridge VLAN tables, and switch config.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — VLAN tagging is correct end-to-end.

    4. Click Check Solution once `systemctl is-active named` returns active.'
