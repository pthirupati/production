title: 'Networking: Vlans — Troubleshooting Drill'
slug: academy-networking-064-troubleshoot-vlan-7
technology: Networking
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: hosts on a VLAN cannot reach their gateway. You are
  on call for Networking and must troubleshoot VLANs methodically — triage symptoms,
  find root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: hosts on a VLAN cannot reach their gateway'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The network lab is degraded. Hosts on a vlan cannot reach their gateway.
  Recent changes may exist around VLANs, but do not restart blindly — gather evidence
  first.
hints:
- order: 1
  cost: 10
  content: 'Triage: `ip -d link`, bridge VLAN tables, and switch config. Capture timestamps,
    error messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: VLAN tagging is correct end-to-end. Document the fix,
    add `# FIXED-OK` to `/opt/fixitlab/academy/academy-networking-064-troubleshoot-vlan-7.conf`,
    and rerun Check Solution.'
