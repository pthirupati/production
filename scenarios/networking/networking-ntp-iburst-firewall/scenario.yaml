description: 'CONTEXT: A team operating network operations needs you to resolve `NTP Sync Blocked by Egress
  Firewall` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A host whose NTP egress is firewalled, so chrony stays unsynchronized. Chrony
  never synchronizes because an egress firewall blocks UDP 123 to the time servers. Open NTP egress and
  confirm synchronization.


  OBJECTIVE: Confirm the issue: chronyc tracking shows not synchronised.; Apply the documented fix; Verify
  the network is healthy. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
