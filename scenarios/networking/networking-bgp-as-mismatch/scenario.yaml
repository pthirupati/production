description: 'CONTEXT: A team operating network operations needs you to resolve `BGP Neighbor Stuck in
  Idle After AS Mismatch` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A router whose BGP neighbor is misconfigured with the wrong remote-AS, leaving
  the session Idle and no prefixes learned. A BGP session is stuck Idle because the configured remote-AS
  does not match the peer. Correct the neighbor remote-as and confirm the session reaches Established.


  OBJECTIVE: Confirm the BGP session is Idle with an AS mismatch; Correct the neighbor remote-as configuration;
  Verify the session reaches Established and learns prefixes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
