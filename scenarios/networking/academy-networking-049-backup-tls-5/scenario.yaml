description: Service operations lab. The `haproxy` systemd unit is **failed/inactive** on this host —
  a realistic fault for Backup and Recovery workflows that depend on it. Diagnose with `systemctl status
  haproxy` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active haproxy`.
objectives:
- The `haproxy` service is active (running)
- '`systemctl is-active haproxy` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `haproxy` service is not running (`systemctl is-active haproxy` → inactive/failed).
  Dependent Backup and Recovery tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `openssl s_client`, cert file paths, and ingress/listener config.

    2. Write down what looks normal versus wrong or missing for TLS configuration.

    3. Recall the core idea: certificates, chains, ciphers, renewal, and mTLS. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for TLS configuration.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `openssl s_client`, cert file paths, and ingress/listener config.

    2. Repair or run the backup job, then perform a controlled restore into a scratch location to prove
    it works.

    3. Verify the result — handshakes succeed with a trusted chain and modern ciphers.

    4. Click Check Solution once `systemctl is-active haproxy` returns active.'
