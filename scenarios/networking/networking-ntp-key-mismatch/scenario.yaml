description: 'CONTEXT: A team operating network operations needs you to resolve `NTP Authentication Key
  Mismatch` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A host using authenticated NTP whose key does not match the server, leaving
  chrony unsynchronized. Authenticated NTP fails because the symmetric key on the client doesn''t match
  the server, so sync never completes. Fix the key and confirm synchronization.


  OBJECTIVE: Confirm authenticated NTP is not synchronizing; Correct the NTP authentication key; Verify
  chronyc tracking shows synchronized. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
