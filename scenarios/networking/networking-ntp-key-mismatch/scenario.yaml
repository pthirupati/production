title: NTP Authentication Key Mismatch
slug: networking-ntp-key-mismatch
technology: Networking
category: Time / NTP
difficulty: medium
lab_mode: simulation
simulation_type: networking
time_limit: 1500
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: Authenticated NTP fails because the symmetric key on the client doesn't match the server,
  so sync never completes. Fix the key and confirm synchronization.
initial_state: A host using authenticated NTP whose key does not match the server, leaving chrony unsynchronized.
objectives:
- Confirm authenticated NTP is not synchronizing
- Correct the NTP authentication key
- Verify chronyc tracking shows synchronized
hints:
- order: 1
  cost: 10
  content: chronyc tracking shows not synchronised; auth failing.
- order: 2
  cost: 15
  content: Fix the symmetric key (chrony.keys) to match the server.
- order: 3
  cost: 20
  content: Synchronized.
