description: 'CONTEXT: A team operating network operations needs you to resolve `High Packet Loss — Analyze
  pcap and Identify Root Cause` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with tshark and tcpdump installed. Capture file at /tmp/capture.pcap

  shows ~15% packet loss. `ethtool -g eth0` shows txqueuelen=10 (very small).

  The fix is to increase tx queue length: `ip link set eth0 txqueuelen 1000`. Users are reporting intermittent
  connectivity and high packet loss affecting

  a production service. A 30-second packet capture has been collected and saved

  to /tmp/capture.pcap. Analyze the capture using tshark or tcpdump to identify

  the root cause. The capture reveals TCP retransmissions, ICMP host unreachable

  messages, and duplicate ACKs indicating a congested or misconfigured upstream

  link. Document your findings in /tmp/analysis.txt and apply the identified fix.


  OBJECTIVE: Analyze the pcap file to identify packet loss patterns; Identify TCP retransmission rate
  and duplicate ACK count; Determine the root cause (identified as a misconfigured tx queue length). Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Analyze the pcap file to identify packet loss patterns
- Identify TCP retransmission rate and duplicate ACK count
- Determine the root cause (identified as a misconfigured tx queue length)
- Fix the issue and write findings to /tmp/analysis.txt
