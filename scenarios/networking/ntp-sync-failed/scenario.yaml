description: 'CONTEXT: A team operating network operations needs you to resolve `NTP Sync Failed - Fix
  Time Sync to Resolve Certificate` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. systemd-timesyncd configured with NTP=ntp.internal.corp which
  is

  unreachable. System clock shows time from 6 minutes ago. TLS connections to

  public services are failing with CERTIFICATE_VERIFY_FAILED. The server''s clock has drifted over 5 minutes
  from actual time. TLS connections

  are failing because certificates appear expired from the server''s perspective.

  The systemd-timesyncd service is configured to use an unreachable internal NTP

  server (ntp.internal.corp). Update the NTP configuration to use public NTP

  servers, force an immediate sync, and verify time is correct.


  OBJECTIVE: Identify that NTP sync is failing due to misconfigured server; Update /etc/systemd/timesyncd.conf
  with public NTP servers; Force an immediate time sync. Success means `systemctl is-active --quiet` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify that NTP sync is failing due to misconfigured server
- Update /etc/systemd/timesyncd.conf with public NTP servers
- Force an immediate time sync
- Verify system clock is synchronized and within acceptable drift
initial_state: 'Ubuntu 22.04. systemd-timesyncd configured with NTP=ntp.internal.corp which is

  unreachable. System clock shows time from 6 minutes ago. TLS connections to

  public services are failing with CERTIFICATE_VERIFY_FAILED.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
