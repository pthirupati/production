description: 'CONTEXT: A team operating network operations needs you to resolve `Jumbo MTU Mismatch Black-Holing
  Traffic` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A host/switch interface set to MTU 9000 on a 1500-MTU path, causing large
  flows to be dropped. An interface was set to jumbo MTU 9000 while the path only supports 1500, black-holing
  large packets. Align the MTU end-to-end and confirm connectivity.


  OBJECTIVE: Confirm the MTU mismatch is black-holing traffic; Align the interface MTU with the path;
  Verify large packets pass and the network is healthy. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
