description: 'CONTEXT: A team operating network operations needs you to resolve `Bandwidth Throttle Too
  Aggressive — Fix tc qdisc Rate Limit` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. Interface eth0 has a `tc qdisc add dev eth0 root tbf rate 1mbit

  burst 32kbit latency 400ms` rule applied. Throughput is capped at ~1Mbit/s.

  The intended policy is 100Mbit/s. A traffic shaping policy was applied to the uplink interface to limit
  bandwidth

  usage. However, the rate was set to 1Mbit/s instead of the intended 100Mbit/s,

  causing severe throughput degradation for all users. File transfers that should

  complete in seconds are taking minutes. Fix the tc qdisc configuration to apply

  the correct 100Mbit/s rate limit.


  OBJECTIVE: Identify the current tc qdisc configuration on the uplink interface; Remove the over-aggressive
  rate limit; Apply the correct 100Mbit/s rate limit. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the current tc qdisc configuration on the uplink interface
- Remove the over-aggressive rate limit
- Apply the correct 100Mbit/s rate limit
- Verify throughput with iperf3 or similar tool
