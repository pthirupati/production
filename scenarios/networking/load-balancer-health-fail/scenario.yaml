description: 'CONTEXT: A team operating network operations has raised a ticket for `Load Balancer Health
  Check Failing — Fix Endpoint Path`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab. The architecture is a single lab-primary
  node exposing interfaces, routing tables, DNS, and firewall rules; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: HAProxy 2.6 configured with 3 backend servers. Health check is `option httpchk

  GET /health`. All backends return 404 for /health but 200 for /healthz. All 3

  backends show as DOWN, stats page shows 0 active servers.


  OBJECTIVE: Identify the incorrect health check path in the HAProxy configuration; Update the health
  check option to use /healthz; Reload HAProxy and verify backends transition to UP state. Acceptance
  criteria: the change is minimal and reversible, and success means `systemctl is-active --quiet` returns
  active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant interfaces, routing tables, DNS, and firewall rules), changing one thing at a time.
  Check your work continuously against the objective — success means `systemctl is-active --quiet` returns
  active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active --quiet` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the incorrect health check path in the HAProxy configuration
- Update the health check option to use /healthz
- Reload HAProxy and verify backends transition to UP state
- Confirm traffic is being load balanced to healthy backends
initial_state: 'HAProxy 2.6 configured with 3 backend servers. Health check is `option httpchk

  GET /health`. All backends return 404 for /health but 200 for /healthz. All 3

  backends show as DOWN, stats page shows 0 active servers.

  '
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: load balancer health check failing — fix endpoint
    path is not behaving as the scenario objectives require. This lab is about load balancer health check
    failing — fix endpoint path — how load balancer health check failing — fix endpoint path behaves in
    a network operations environment. Read the objectives and the current state, and note precisely what
    looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For load balancer health check failing — fix endpoint path problems
    the reliable method is: (1) reproduce/observe the failure, (2) narrow from the whole system down to
    the one component that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying
    misconfiguration you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager` before changing
    anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
