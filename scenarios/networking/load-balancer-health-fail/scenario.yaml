is_free: false
description: 'CONTEXT: A team operating network operations needs you to resolve `Load Balancer Health
  Check Failing — Fix Endpoint Path` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: HAProxy 2.6 configured with 3 backend servers. Health check is `option httpchk

  GET /health`. All backends return 404 for /health but 200 for /healthz. All 3

  backends show as DOWN, stats page shows 0 active servers. The HAProxy load balancer is marking all backend
  servers as DOWN and returning

  503 to clients. Investigation reveals the health check is configured to probe

  /health but the application exposes its health endpoint at /healthz. This simple

  path mismatch causes every backend to fail the health check and be removed from

  the active pool.


  OBJECTIVE: Identify the incorrect health check path in the HAProxy configuration; Update the health
  check option to use /healthz; Reload HAProxy and verify backends transition to UP state. Success means
  `systemctl is-active --quiet` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the incorrect health check path in the HAProxy configuration
- Update the health check option to use /healthz
- Reload HAProxy and verify backends transition to UP state
- Confirm traffic is being load balanced to healthy backends
initial_state: 'HAProxy 2.6 configured with 3 backend servers. Health check is `option httpchk

  GET /health`. All backends return 404 for /health but 200 for /healthz. All 3

  backends show as DOWN, stats page shows 0 active servers.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
