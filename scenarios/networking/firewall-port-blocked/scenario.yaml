title: Firewall Blocking Web Port
slug: firewall-port-blocked
technology: Networking
category: Firewall
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: High
description: nginx is running and serving locally, but external users can't reach the site on port 80
  because an iptables rule in the INPUT chain is dropping inbound HTTP. The DROP rule shadows the web
  traffic before it ever reaches nginx. Find and remove the blocking rule so port 80 is reachable again.
objectives:
- Confirm nginx is up locally but port 80 is blocked from outside
- Find the iptables DROP rule for port 80
- Remove the rule and verify HTTP is reachable
initial_state: Linux server where nginx listens on port 80 but an iptables INPUT rule drops inbound dpt:80
  traffic, so remote clients can't load the site.
hints:
- order: 1
  cost: 10
  content: 'Local curl works, remote doesn''t. List the firewall with line numbers: `iptables -L INPUT
    -n --line-numbers` and find the DROP rule matching dpt:80.'
- order: 2
  cost: 15
  content: 'Delete that specific rule by its line number: `iptables -D INPUT <line>` (the line number
    from the previous command).'
- order: 3
  cost: 20
  content: Confirm nginx is listening (`ss -tlnp | grep :80`) and the rule is gone; a request to the server's
    IP on port 80 now returns the page. Persist the ruleset so it survives reboot.
