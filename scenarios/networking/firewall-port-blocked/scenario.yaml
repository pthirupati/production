jira_priority: High
description: 'CONTEXT: A team operating network operations needs you to resolve `Firewall Blocking Web
  Port` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where nginx listens on port 80 but an iptables INPUT rule drops
  inbound dpt:80 traffic, so remote clients can''t load the site. nginx is running and serving locally,
  but external users can''t reach the site on port 80 because an iptables rule in the INPUT chain is dropping
  inbound HTTP. The DROP rule shadows the web traffic before it ever reaches nginx. Find and remove the
  blocking rule so port 80 is reachable again.


  OBJECTIVE: Confirm nginx is up locally but port 80 is blocked from outside; Find the iptables DROP rule
  for port 80; Remove the rule and verify HTTP is reachable. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm nginx is up locally but port 80 is blocked from outside
- Find the iptables DROP rule for port 80
- Remove the rule and verify HTTP is reachable
initial_state: Linux server where nginx listens on port 80 but an iptables INPUT rule drops inbound dpt:80
  traffic, so remote clients can't load the site.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
