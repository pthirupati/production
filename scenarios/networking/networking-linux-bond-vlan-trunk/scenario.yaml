title: 'Linux ↔ Network: Bonded VLAN Trunk Brings Down the App'
slug: networking-linux-bond-vlan-trunk
technology: networking
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating network operations has raised a ticket for `Linux ↔ Network: Bonded
  VLAN Trunk Brings Down the App`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab. The architecture is a single lab-primary
  node exposing interfaces, routing tables, DNS, and firewall rules; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Linux host whose two NICs should form an 802.3ad (LACP) bond carrying a
  tagged

  VLAN 30 sub-interface. /etc/sysconfig/network-scripts/ifcfg-bond0 has the wrong

  bonding mode and no VLAN child, so bond0.30 never comes up and 10.30.0.0/24 is

  dark.


  OBJECTIVE: Confirm the switch side is an LACP trunk with VLAN 30 tagged and compare it to the host bond
  config; Correct ifcfg-bond0 to mode 802.3ad and define the tagged bond0.30 VLAN interface on 10.30.0.0/24;
  Confirm the bonding/VLAN config is corrected so the app subnet comes back up. Acceptance criteria: the
  change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant interfaces, routing tables, DNS, and firewall rules), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
