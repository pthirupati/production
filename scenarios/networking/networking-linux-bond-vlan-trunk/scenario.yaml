title: 'Linux ↔ Network: Bonded VLAN Trunk Brings Down the App'
slug: networking-linux-bond-vlan-trunk
technology: networking
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating network operations needs you to resolve `Linux ↔ Network: Bonded
  VLAN Trunk Brings Down the App` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Linux host whose two NICs should form an 802.3ad (LACP) bond carrying a
  tagged

  VLAN 30 sub-interface. /etc/sysconfig/network-scripts/ifcfg-bond0 has the wrong

  bonding mode and no VLAN child, so bond0.30 never comes up and 10.30.0.0/24 is

  dark. CROSS-TECHNOLOGY task (Networking <-> Linux). The switch port for app-host-01

  was reconfigured as an LACP trunk carrying VLAN 30 (the app subnet), but the

  Linux side was never updated to match. The bond config at

  /etc/sysconfig/network-scripts/ifcfg-bond0 uses the wrong bonding mode for LACP

  and is missing the tagged VLAN 30 sub-interface, so the host has no carrier on

  the app subnet and every service on it is unreachable. Align the Linux bonding

  + VLAN configuration with the switch trunk.


  OBJECTIVE: Confirm the switch side is an LACP trunk with VLAN 30 tagged and compare it to the host bond
  config; Correct ifcfg-bond0 to mode 802.3ad and define the tagged bond0.30 VLAN interface on 10.30.0.0/24;
  Confirm the bonding/VLAN config is corrected so the app subnet comes back up. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
