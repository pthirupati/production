description: 'Production alert: hosts on a VLAN cannot reach their gateway. You are
  on call for Networking and must troubleshoot VLANs methodically — triage symptoms,
  isolate root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: hosts on a VLAN cannot reach their gateway'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The network lab is degraded. Hosts on a vlan cannot reach their gateway.
  Recent changes may exist around VLANs, but do not restart blindly — gather evidence
  first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ip -d link`, bridge VLAN tables, and switch config.

    2. Write down what looks normal versus wrong or missing for VLANs.

    3. Recall the core idea: tagged interfaces, trunk ports, and segmentation. Form
    one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for VLANs.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `ip -d link`, bridge VLAN tables, and switch config.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — VLAN tagging is correct end-to-end.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-networking-054-troubleshoot-vlan-6.conf`,
    then click Check Solution.'
