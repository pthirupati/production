description: 'CONTEXT: A team operating network operations needs you to resolve `Container Network Namespace
  Isolated — Fix veth Pair` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Network namespace `container-ns` exists. veth pair `veth0`/`veth1` created
  but

  both ends are in the root namespace. Bridge `br0` exists. Container process

  (pid stored in /var/run/app.pid) is running in container-ns. No IP addresses

  assigned to veth interfaces. A containerized application is running in its own network namespace but
  cannot

  communicate with the host or external network. The veth pair that should connect

  the container''s namespace to the host bridge was created but one end is in the

  wrong namespace and the bridge attachment is missing. The container process is

  running but all network calls fail with ENETUNREACH.


  OBJECTIVE: Identify the misconfigured veth pair and network namespace; Move the correct veth end into
  the container''s network namespace; Attach the host-side veth to the bridge. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the misconfigured veth pair and network namespace
- Move the correct veth end into the container's network namespace
- Attach the host-side veth to the bridge
- Configure IP addressing and verify connectivity
