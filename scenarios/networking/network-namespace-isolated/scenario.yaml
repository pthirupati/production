slug: network-namespace-isolated
title: "Container Network Namespace Isolated — Fix veth Pair"
technology: Networking
category: Network Namespaces
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: High
is_free: false
description: |
  A containerized application is running in its own network namespace but cannot
  communicate with the host or external network. The veth pair that should connect
  the container's namespace to the host bridge was created but one end is in the
  wrong namespace and the bridge attachment is missing. The container process is
  running but all network calls fail with ENETUNREACH.
objectives:
  - Identify the misconfigured veth pair and network namespace
  - Move the correct veth end into the container's network namespace
  - Attach the host-side veth to the bridge
  - Configure IP addressing and verify connectivity
initial_state: |
  Network namespace `container-ns` exists. veth pair `veth0`/`veth1` created but
  both ends are in the root namespace. Bridge `br0` exists. Container process
  (pid stored in /var/run/app.pid) is running in container-ns. No IP addresses
  assigned to veth interfaces.
hints:
  - order: 1
    cost: 10
    content: "`ip netns list` shows existing namespaces. `ip link show` lists all veth interfaces."
  - order: 2
    cost: 20
    content: "Move veth1 into namespace: `ip link set veth1 netns container-ns`"
  - order: 3
    cost: 20
    content: "Attach host side to bridge: `ip link set veth0 master br0 up`"
  - order: 4
    cost: 20
    content: "Configure IP in namespace: `ip netns exec container-ns ip addr add 172.16.0.2/24 dev veth1` and `ip netns exec container-ns ip link set veth1 up`"
