hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: DNS resolution failure — fix /etc/resolv.conf
    is not behaving as the scenario objectives require. This lab is about DNS resolution failure — fix
    /etc/resolv.conf — how DNS resolution failure — fix /etc/resolv.conf behaves in a network operations
    environment. Read the objectives and the current state, and note precisely what looks wrong versus
    healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For DNS resolution failure — fix /etc/resolv.conf problems the reliable
    method is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `cat /etc/resolv.conf` and test with `dig example.com` or `getent hosts example.com`.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Note the configured nameserver IP in resolv.conf.

    2. `ping` or `nc -zv` the nameserver — is it reachable?

    3. Check if NetworkManager or systemd-resolved overwrites the file.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Set a working `nameserver` line (e.g. 8.8.8.8 or the lab''s resolver).

    2. Re-run `dig` or `getent hosts` — lookups should succeed.

    3. Confirm `check.sh` passes.

    WHY: applications use resolv.conf for every hostname lookup.'
