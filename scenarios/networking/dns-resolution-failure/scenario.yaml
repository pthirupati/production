description: 'CONTEXT: A team operating network operations needs you to resolve `DNS Resolution Failure
  — Fix /etc/resolv.conf` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with /etc/resolv.conf containing a single nameserver line pointing

  to 10.0.0.253 (a decommissioned host). `host google.com` and `dig` both fail

  with SERVFAIL or timeout. After a VM migration, all outbound DNS lookups are failing. Applications that

  depend on hostname resolution (package managers, monitoring agents, mail delivery)

  are timing out. Investigation shows /etc/resolv.conf was overwritten with incorrect

  nameserver entries pointing to a decommissioned internal resolver.

  Restore the correct configuration so DNS lookups succeed.


  OBJECTIVE: Diagnose the DNS resolution failure; Correct /etc/resolv.conf with valid nameserver entries;
  Verify hostname lookups succeed. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
