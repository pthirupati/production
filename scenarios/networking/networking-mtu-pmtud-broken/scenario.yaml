description: 'CONTEXT: A team operating network operations needs you to resolve `MTU Path Discovery Broken
  by ICMP Filtering` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A network where PMTUD fails (ICMP filtered) on an interface set to jumbo MTU,
  hanging large transfers. Path MTU Discovery is broken because a firewall drops ICMP ''fragmentation
  needed'', so jumbo-configured flows hang. Restore ICMP/align MTU and confirm connectivity.


  OBJECTIVE: Confirm PMTUD is broken on the jumbo interface; Allow the needed ICMP / align the MTU; Verify
  large flows complete and the network is healthy. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
