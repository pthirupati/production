title: DNS Resolution Failure
slug: dns-resolution-broken
technology: networking
category: Fix
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: High
description: 'CONTEXT: A team operating network operations has raised a ticket for `DNS Resolution Failure`.
  A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve it.
  Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab. The architecture is a single lab-primary
  node exposing interfaces, routing tables, DNS, and firewall rules; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: You have shell access to a Linux server where DNS resolution is broken.

  nslookup and dig commands fail or return no results.


  OBJECTIVE: Diagnose why DNS resolution is failing; DNS lookups succeed for required hostnames; Verify
  hostname resolution works (e.g., ping google.com). Acceptance criteria: the change is minimal and reversible,
  and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant interfaces, routing tables, DNS, and firewall rules), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Diagnose why DNS resolution is failing
- DNS lookups succeed for required hostnames
- Verify hostname resolution works (e.g., ping google.com)
initial_state: 'You have shell access to a Linux server where DNS resolution is broken.

  nslookup and dig commands fail or return no results.

  '
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: DNS resolution failure is not behaving as the
    scenario objectives require. This lab is about DNS resolution failure — how DNS resolution failure
    behaves in a network operations environment. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For DNS resolution failure problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `cat /etc/resolv.conf` and test with `dig example.com` or `getent hosts example.com`.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Note the configured nameserver IP in resolv.conf.

    2. `ping` or `nc -zv` the nameserver — is it reachable?

    3. Check if NetworkManager or systemd-resolved overwrites the file.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Set a working `nameserver` line (e.g. 8.8.8.8 or the lab''s resolver).

    2. Re-run `dig` or `getent hosts` — lookups should succeed.

    3. Confirm `check.sh` passes.


    WHY: applications use resolv.conf for every hostname lookup.'
