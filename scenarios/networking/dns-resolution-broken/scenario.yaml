title: DNS Resolution Failure
slug: dns-resolution-broken
technology: Networking
category: DNS
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: High
description: 'Applications on the server cannot resolve hostnames. curl and

  apt fail with "Temporary failure in name resolution". The

  resolver configuration was changed during a migration. Fix DNS

  so the server can resolve external hostnames again.'
objectives:
- Diagnose why DNS resolution is failing
- DNS lookups succeed for required hostnames
- Verify hostname resolution works (e.g., ping google.com)
initial_state: 'You have shell access to a Linux server where DNS resolution is broken.

  nslookup and dig commands fail or return no results.

  '
hints:
- order: 1
  cost: 10
  content: 'Confirm it''s resolution, not connectivity: `getent hosts google.com` fails with "Temporary
    failure in name resolution". Inspect `/etc/resolv.conf`.'
- order: 2
  cost: 15
  content: 'Check the resolver stack: `resolvectl status` (or `systemd-resolve --status`) shows whether
    systemd-resolved has a usable upstream.'
- order: 3
  cost: 20
  content: 'Fix it: add a valid `nameserver 8.8.8.8` to /etc/resolv.conf, or repair systemd-resolved''s
    DNS= setting and restart it.'
- order: 4
  cost: 25
  content: 'Verify resolution works end to end: `getent hosts google.com` returns an address and `curl
    -sI https://example.com` connects — DNS is restored.'
