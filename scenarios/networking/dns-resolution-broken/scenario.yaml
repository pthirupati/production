infrastructure_type: docker
jira_priority: High
description: 'CONTEXT: A team operating network operations needs you to resolve `DNS Resolution Failure`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: You have shell access to a Linux server where DNS resolution is broken.

  nslookup and dig commands fail or return no results. Applications on the server cannot resolve hostnames.
  curl and

  apt fail with "Temporary failure in name resolution". The

  resolver configuration was changed during a migration. Fix DNS

  so the server can resolve external hostnames again.


  OBJECTIVE: Diagnose why DNS resolution is failing; DNS lookups succeed for required hostnames; Verify
  hostname resolution works (e.g., ping google.com). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Diagnose why DNS resolution is failing
- DNS lookups succeed for required hostnames
- Verify hostname resolution works (e.g., ping google.com)
