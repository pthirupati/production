description: 'CONTEXT: A team operating network operations needs you to resolve `NIC Duplex Mismatch —
  Fix Half/Full Duplex Causing Errors` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. `ethtool eth0` shows Speed=1000Mb/s but Duplex=Half. The upstream

  switch port is Full duplex. `ethtool -S eth0` shows collisions and late_collision

  counters increasing rapidly. Throughput capped at ~15Mbit/s. A server is experiencing high collision
  and error rates on its network interface.

  Throughput is severely degraded — transfers that should run at near-gigabit speeds

  are achieving only 10-20 Mbit/s. The root cause is a duplex mismatch: the NIC is

  forced to half-duplex while the upstream switch port is operating at full-duplex.

  Set the NIC to full-duplex (or enable autonegotiation) to resolve the mismatch.


  OBJECTIVE: Identify the duplex setting on the NIC using ethtool; Detect the high collision/error rate
  caused by the mismatch; Set the interface to full-duplex at the correct speed. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the duplex setting on the NIC using ethtool
- Detect the high collision/error rate caused by the mismatch
- Set the interface to full-duplex at the correct speed
- Verify error counters stop incrementing
