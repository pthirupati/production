description: 'CONTEXT: A team operating network operations needs you to resolve `Missing Static Route`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server missing a static route for 10.50.0.0/24, so traffic to that subnet
  isn''t delivered after a recent network change. Applications can''t reach hosts on the 10.50.0.0/24
  subnet after a network change because the static route to that network is missing from the routing table
  — packets fall through to a default gateway that can''t deliver them (or are dropped). Add the correct
  static route via the proper next-hop and make it persistent.


  OBJECTIVE: Confirm 10.50.0.0/24 is unreachable and the route is missing; Add the static route via the
  correct gateway; Verify connectivity and persist the route. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm 10.50.0.0/24 is unreachable and the route is missing
- Add the static route via the correct gateway
- Verify connectivity and persist the route
initial_state: Linux server missing a static route for 10.50.0.0/24, so traffic to that subnet isn't delivered
