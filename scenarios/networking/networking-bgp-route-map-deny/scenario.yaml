description: 'CONTEXT: A team operating network operations needs you to resolve `BGP Prefixes Filtered
  by Route-Map` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A router dropping BGP prefixes due to a route-map deny. Expected prefixes
  aren''t learned because an inbound route-map denies them. Fix the route-map and confirm a healthy session
  with prefixes.


  OBJECTIVE: Confirm the issue: show ip bgp summary shows the neighbor not Established.; Apply the documented
  fix; Verify the network is healthy. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
