description: 'CONTEXT: A team operating network operations needs you to resolve `WireGuard VPN Tunnel
  Down — Fix Peer Config and Routing` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with WireGuard. wg0 interface is configured. Peer public key
  in

  /etc/wireguard/wg0.conf is stale (old-key-base64). Correct key is in

  /etc/wireguard/new-peer-pubkey.txt. AllowedIPs=10.8.0.0/24 (missing 10.10.0.0/16).

  `wg show` shows no active handshake. Remote VPN subnet is unreachable. The WireGuard VPN tunnel between
  the office and a cloud server is down. Remote

  users cannot reach internal resources. The tunnel interface wg0 is up but the

  peer handshake is failing. Investigation reveals two issues: the remote peer''s

  public key was rotated last week but the local config still has the old key,

  and the AllowedIPs range is missing the 10.10.0.0/16 subnet that users need.

  Fix both the peer configuration and add the missing route.


  OBJECTIVE: Identify the stale public key in the WireGuard peer config; Update /etc/wireguard/wg0.conf
  with the correct peer public key; Add 10.10.0.0/16 to the AllowedIPs for the peer. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the stale public key in the WireGuard peer config
- Update /etc/wireguard/wg0.conf with the correct peer public key
- Add 10.10.0.0/16 to the AllowedIPs for the peer
- Bring the tunnel back up and verify the handshake succeeds
initial_state: 'Ubuntu 22.04 with WireGuard. wg0 interface is configured. Peer public key in

