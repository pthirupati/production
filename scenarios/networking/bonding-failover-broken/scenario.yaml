description: 'CONTEXT: A team operating network operations needs you to resolve `Network Bonding Failover
  Broken — Fix Active-Backup Config` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. Bond interface bond0 in mode=active-backup. miimon=0 (disabled).

  eth0 is active slave, eth1 is backup. Bringing down eth0 leaves bond0 unreachable

  instead of failing over to eth1. A server with two NICs uses Linux bonding in active-backup mode for
  link

  redundancy. When the primary link (eth0) is brought down, traffic does not

  fail over to the backup link (eth1). Investigation reveals miimon (link

  monitoring interval) is set to 0, disabling link detection entirely. Without

  miimon, the bond driver never detects link failures and never promotes the

  backup interface. Fix the bonding configuration and test failover.


  OBJECTIVE: Identify that miimon=0 is disabling link monitoring; Set miimon to 100ms for reliable failover
  detection; Verify that bringing down eth0 causes traffic to shift to eth1. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify that miimon=0 is disabling link monitoring
- Set miimon to 100ms for reliable failover detection
- Verify that bringing down eth0 causes traffic to shift to eth1
- Confirm bond0 remains reachable during the failover test
