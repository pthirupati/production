slug: bonding-failover-broken
title: "Network Bonding Failover Broken — Fix Active-Backup Config"
technology: Networking
category: High Availability
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: High
is_free: false
description: |
  A server with two NICs uses Linux bonding in active-backup mode for link
  redundancy. When the primary link (eth0) is brought down, traffic does not
  fail over to the backup link (eth1). Investigation reveals miimon (link
  monitoring interval) is set to 0, disabling link detection entirely. Without
  miimon, the bond driver never detects link failures and never promotes the
  backup interface. Fix the bonding configuration and test failover.
objectives:
  - Identify that miimon=0 is disabling link monitoring
  - Set miimon to 100ms for reliable failover detection
  - Verify that bringing down eth0 causes traffic to shift to eth1
  - Confirm bond0 remains reachable during the failover test
initial_state: |
  Ubuntu 22.04. Bond interface bond0 in mode=active-backup. miimon=0 (disabled).
  eth0 is active slave, eth1 is backup. Bringing down eth0 leaves bond0 unreachable
  instead of failing over to eth1.
hints:
  - order: 1
    cost: 10
    content: "Check current bonding params: `cat /proc/net/bonding/bond0` — look for MII Status and MII Polling Interval."
  - order: 2
    cost: 20
    content: "Set miimon: edit /etc/network/interfaces or /etc/netplan yaml to add `bond-miimon 100`. Then `ifdown bond0 && ifup bond0`."
  - order: 3
    cost: 20
    content: "Test failover: `ip link set eth0 down` and verify `cat /proc/net/bonding/bond0` shows eth1 as active slave."
  - order: 4
    cost: 10
    content: "Restore: `ip link set eth0 up` and verify bond0 returns to eth0 as active (if primary_reselect=always)."
