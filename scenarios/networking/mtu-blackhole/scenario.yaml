description: 'CONTEXT: A team operating network operations needs you to resolve `MTU Black Hole — Fix
  Path MTU Discovery Settings` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. `sysctl net.ipv4.ip_no_pmtu_disc=1` (PMTUD disabled). An iptables

  rule is blocking all ICMP except ping. Large TCP transfers (>1400 bytes) stall

  after the initial packets. Small pings work fine. Large TCP transfers are silently failing or stalling
  while small packets and

  ICMP pings succeed. This is a classic PMTUD (Path MTU Discovery) black hole

  problem. ICMP "Fragmentation Needed" messages are being dropped by an intermediate

  firewall, so the sending host never learns it needs to reduce packet size.

  Fix the kernel PMTUD settings and add an iptables rule to ensure ICMP type 3

  messages are not filtered, allowing Path MTU Discovery to work correctly.


  OBJECTIVE: Diagnose the PMTUD black hole — small packets work, large ones stall; Enable PMTUD via sysctl
  (net.ipv4.ip_no_pmtu_disc=0); Add iptables rule to allow ICMP type 3 (Destination Unreachable) messages.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Diagnose the PMTUD black hole — small packets work, large ones stall
- Enable PMTUD via sysctl (net.ipv4.ip_no_pmtu_disc=0)
- Add iptables rule to allow ICMP type 3 (Destination Unreachable) messages
- Verify large file transfers complete successfully
