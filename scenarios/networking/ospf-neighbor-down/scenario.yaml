slug: ospf-neighbor-down
title: "OSPF Neighbor Down — Fix MTU Mismatch in ExStart"
technology: Networking
category: Routing
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: High
is_free: false
description: |
  Two routers running OSPF are stuck in the ExStart state and never advance to
  Exchange or Full adjacency. This is a classic MTU mismatch symptom — one router
  has an interface MTU of 1500 while the peer is configured for 9000 (jumbo frames).
  The Database Description (DBD) packets are being dropped. Fix the MTU configuration
  so OSPF adjacency forms correctly and routes are exchanged.
objectives:
  - Identify the OSPF neighbor stuck in ExStart state
  - Determine the interface MTU mismatch between the two routers
  - Correct the MTU configuration to match on both interfaces
  - Confirm OSPF adjacency reaches Full state
initial_state: |
  FRRouting configured with OSPF on two routers. Interface eth1 on router-A has
  MTU=1500, interface eth1 on router-B has MTU=9000. OSPF neighbor remains in
  ExStart indefinitely. DBD exchange fails silently.
hints:
  - order: 1
    cost: 10
    content: "`vtysh -c 'show ip ospf neighbor'` — look for state stuck at ExStart."
  - order: 2
    cost: 15
    content: "Check interface MTU: `ip link show eth1` on both routers — they must match."
  - order: 3
    cost: 20
    content: "Fix MTU: `ip link set eth1 mtu 1500` (or match to 9000 on both). Alternatively set `ip ospf mtu-ignore` in FRR as a workaround."
  - order: 4
    cost: 15
    content: "After fixing, OSPF should advance through Exchange to Full: `vtysh -c 'show ip ospf neighbor'`."
