description: 'CONTEXT: A team operating network operations needs you to resolve `OSPF Neighbor Down —
  Fix MTU Mismatch in ExStart` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: FRRouting configured with OSPF on two routers. Interface eth1 on router-A
  has

  MTU=1500, interface eth1 on router-B has MTU=9000. OSPF neighbor remains in

  ExStart indefinitely. DBD exchange fails silently. Two routers running OSPF are stuck in the ExStart
  state and never advance to

  Exchange or Full adjacency. This is a classic MTU mismatch symptom — one router

  has an interface MTU of 1500 while the peer is configured for 9000 (jumbo frames).

  The Database Description (DBD) packets are being dropped. Fix the MTU configuration

  so OSPF adjacency forms correctly and routes are exchanged.


  OBJECTIVE: Identify the OSPF neighbor stuck in ExStart state; Determine the interface MTU mismatch between
  the two routers; Correct the MTU configuration to match on both interfaces. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the OSPF neighbor stuck in ExStart state
- Determine the interface MTU mismatch between the two routers
- Correct the MTU configuration to match on both interfaces
- Confirm OSPF adjacency reaches Full state
