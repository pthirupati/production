description: 'CONTEXT: A team operating network operations has raised a ticket for `Network Routing —
  Learn Lab`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab. The architecture is a single lab-primary
  node exposing interfaces, routing tables, DNS, and firewall rules; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The network lab is online with a starter network routing setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.


  OBJECTIVE: Understand how network routing work in this lab environment; Identify the main status and
  configuration signals for network routing; Confirm you can read the current state confidently before
  changing anything. Acceptance criteria: the change is minimal and reversible, and success means `systemctl
  is-active named returns active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant interfaces, routing tables, DNS, and firewall rules), changing one thing at a time.
  Check your work continuously against the objective — success means `systemctl is-active named`` returns
  active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active named` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how network routing work in this lab environment
- Identify the main status and configuration signals for network routing
- Confirm you can read the current state confidently before changing anything
initial_state: The network lab is online with a starter network routing setup. Some pieces are intentionally
  incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: some subnets are unreachable or traffic takes
    the wrong path. This lab is about network routing — routing tables, default gateways, static routes,
    and asymmetric paths. Read the objectives and the current state, and note precisely what looks wrong
    versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For network routing problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Make one small, reversible change toward the objective, re-reading
    status after each step so you understand cause and effect.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `systemctl status named` and `journalctl -u named -n 50`.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm `named` is failed/inactive.

    2. Read the unit journal for the root cause.

    3. Apply the smallest fix that restores the unit.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Repair the underlying config/cause for `named`.

    2. `systemctl enable --now named`.

    3. Verify with `systemctl is-active named` (expect active).'
