title: 'Networking: Dns — Build From Scratch'
slug: academy-networking-032-build-dns-4
technology: Networking
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Build DNS from scratch in this Networking lab. You start from a minimal
  environment and must produce a working configuration that demonstrates name resolution,
  records, forward/reverse lookups, and resolver config. Plan, implement, then prove
  it works.
objectives:
- A working DNS setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The network lab is ready but DNS is not configured yet. Required tools
  may already be installed; your job is to create the configuration and bring the
  capability online.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `dig`, `nslookup`, or `Resolve-DnsName` plus zone/config
    files.

    2. Write down what looks normal versus wrong or missing for DNS.

    3. Recall the core idea: name resolution, records, forward/reverse lookups, and
    resolver config. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for DNS.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `dig`, `nslookup`, or `Resolve-DnsName` plus zone/config
    files.

    2. Create the smallest working slice of DNS first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — queries return the expected records from the intended resolver.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-networking-032-build-dns-4.conf`,
    then click Check Solution.'
