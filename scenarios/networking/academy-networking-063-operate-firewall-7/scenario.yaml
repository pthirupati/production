description: 'CONTEXT: A team operating network operations needs you to resolve `networking: Host Firewall
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The network lab is healthy enough for scheduled work on host firewall. Complete
  the maintenance task without unnecessary downtime. Day-2 operations: perform a routine host firewall
  task safely in networking. Follow change control — inspect, change, verify — while working with allow/deny
  rules, zones, services, and rule persistence.


  OBJECTIVE: Day-2 host firewall work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  named` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 host firewall work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The network lab is healthy enough for scheduled work on host firewall. Complete the maintenance
  task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `firewall-cmd --list-all`, `iptables -S`, `ufw status`, or Windows
    firewall cmdlets.

    2. Write down what looks normal versus wrong or missing for host firewall.

    3. Recall the core idea: allow/deny rules, zones, services, and rule persistence. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status named` — note Active/Failed and the last log lines.

    2. Read `journalctl -u named -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `firewall-cmd --list-all`, `iptables -S`, `ufw status`, or Windows
    firewall cmdlets.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — only the intended ports and sources are permitted.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
