description: Service operations lab. The `haproxy` systemd unit is **failed/inactive** on this host —
  a realistic fault for Integration Lab workflows that depend on it. Diagnose with `systemctl status haproxy`
  and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active haproxy`.
objectives:
- The `haproxy` service is active (running)
- '`systemctl is-active haproxy` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `haproxy` service is not running (`systemctl is-active haproxy` → inactive/failed).
  Dependent Integration Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `tcpdump -nni` with BPF filters and the resulting pcap.

    2. Write down what looks normal versus wrong or missing for packet capture.

    3. Recall the core idea: tcpdump filters and reading captures. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for packet capture.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `tcpdump -nni` with BPF filters and the resulting pcap.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — the capture isolates the problem conversation.

    4. Click Check Solution once `systemctl is-active haproxy` returns active.'
cross_technology: true
