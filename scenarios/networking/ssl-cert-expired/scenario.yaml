description: 'CONTEXT: A team operating network operations needs you to resolve `SSL Certificate Expired
  — Replace nginx TLS Certificate` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server running nginx with an expired (or about-to-expire) TLS certificate
  at /etc/nginx/ssl/cert.pem, causing HTTPS validation failures. HTTPS endpoints are failing certificate
  validation because the nginx TLS certificate is expired (or expires within a day). Browsers and clients
  reject the connection. Generate/install a valid certificate, point nginx at it, and reload so secure
  connections work again with a non-expired certificate.


  OBJECTIVE: Confirm the current certificate''s expiry; Generate/install a new valid certificate and key;
  Reload nginx and verify HTTPS serves a non-expired certificate. Success means `systemctl is-active --quiet`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the current certificate's expiry
- Generate/install a new valid certificate and key
- Reload nginx and verify HTTPS serves a non-expired certificate
initial_state: Linux server running nginx with an expired (or about-to-expire) TLS certificate at /etc/nginx/ssl/cert.pem,
  causing HTTPS validation failures.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Reload nginx and verify HTTPS serves a non-expired certificate.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
