title: NTP Time Drift Causing Auth Failures
slug: networking-ntp-drift
difficulty: medium
category: Networking
description: Kerberos authentication and TLS certificate validation are failing across the environment
  because the system clock has drifted more than five minutes from true time. Time-sensitive protocols
  reject the skew. Either NTP isn't syncing (service down or UDP 123 blocked) or the source is unreachable.
  Restore time synchronization so the offset returns to near zero.
initial_state: Linux server whose clock has drifted >5 minutes, breaking Kerberos/TLS. NTP (chrony) is
  not synchronizing — the service is down or UDP 123 is blocked/unreachable.
objectives:
- Confirm the clock offset and that NTP isn't synchronized
- Fix the sync path (start chrony / open UDP 123 / set a reachable source)
- Verify the offset returns to near zero and stays synced
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Check the offset and sync state: `timedatectl status` and `chronyc tracking` — the offset
    is large and ''System clock synchronized: no''.'
- order: 2
  cost: 15
  content: 'NTP needs UDP 123 outbound and a running daemon: `firewall-cmd --list-all` (allow `ntp` if
    missing) and `systemctl status chronyd`. Ensure a reachable source in /etc/chrony.conf.'
- order: 3
  cost: 20
  content: 'Start/restart chrony and step the clock: `systemctl restart chronyd && chronyc makestep`.
    Re-check `chronyc tracking` — offset is near zero and synchronized; Kerberos/TLS recover.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
