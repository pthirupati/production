title: NTP Time Drift Causing Auth Failures
slug: networking-ntp-drift
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating network operations needs you to resolve `NTP Time Drift Causing
  Auth Failures` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server whose clock has drifted >5 minutes, breaking Kerberos/TLS. NTP
  (chrony) is not synchronizing — the service is down or UDP 123 is blocked/unreachable. Kerberos authentication
  and TLS certificate validation are failing across the environment because the system clock has drifted
  more than five minutes from true time. Time-sensitive protocols reject the skew. Either NTP isn''t syncing
  (service down or UDP 123 blocked) or the source is unreachable. Restore time synchronization so the
  offset returns to near zero.


  OBJECTIVE: Confirm the clock offset and that NTP isn''t synchronized; Fix the sync path (start chrony
  / open UDP 123 / set a reachable source); Verify the offset returns to near zero and stays synced. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
