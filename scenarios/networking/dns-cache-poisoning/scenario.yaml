description: 'CONTEXT: A team operating network operations needs you to resolve `DNS Cache Poisoning —
  Flush BIND Named Cache` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: BIND 9 named daemon running. The hostname `app.internal` is cached pointing
  to

  10.66.66.66 (malicious IP). The authoritative server returns 10.0.1.50. The

  cached TTL is set to 86400 so the entry will not expire naturally. The on-premises BIND named resolver
  has been serving stale, incorrect A-record

  answers for a critical internal hostname. A prior cache poisoning attack inserted

  a malicious IP that was never evicted. Users are being routed to the wrong endpoint.

  You must identify the bad cached entry, flush the resolver cache, and verify that

  fresh authoritative answers are now served.


  OBJECTIVE: Confirm that named is caching an incorrect IP for the target hostname; Flush the named cache
  using rndc; Verify the resolver now returns the correct authoritative answer. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm that named is caching an incorrect IP for the target hostname
- Flush the named cache using rndc
- Verify the resolver now returns the correct authoritative answer
