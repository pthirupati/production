description: 'CONTEXT: A team operating network operations needs you to resolve `networking: Dns — Build
  From Scratch` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The network lab is ready but DNS is not configured yet. Required tools may
  already be installed; your job is to create the configuration and bring the capability online. Build
  DNS from scratch in this networking lab. You start from a minimal environment and must produce a working
  configuration that demonstrates name resolution, records, forward/reverse lookups, and resolver config.
  Plan, implement, then prove it works.


  OBJECTIVE: A working DNS setup must exist by the end of this lab; Configuration should follow team conventions
  and be easy to audit; The result should pass validation without manual cleanup. Success means `systemctl
  is-active haproxy` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working DNS setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The network lab is ready but DNS is not configured yet. Required tools may already be installed;
  your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `dig`, `nslookup`, or `Resolve-DnsName` plus zone/config files.

    2. Write down what looks normal versus wrong or missing for DNS.

    3. Recall the core idea: name resolution, records, forward/reverse lookups, and resolver config. Form
    one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status haproxy` — note Active/Failed and the last log lines.

    2. Read `journalctl -u haproxy -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `dig`, `nslookup`, or `Resolve-DnsName` plus zone/config files.

    2. Create the smallest working slice of DNS first, validate it, then add the remaining pieces one
    at a time.

    3. Verify the result — queries return the expected records from the intended resolver.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
