description: 'CONTEXT: A team operating network operations needs you to resolve `Stale ARP Cache — Flush
  Entries to Restore Connectivity` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. The ARP cache has an entry for 192.168.1.1 pointing to the old

  MAC address aa:bb:cc:dd:ee:ff. The replacement device uses MAC 11:22:33:44:55:66.

  Pings to 192.168.1.1 intermittently fail or have high latency. After replacing a network device (a firewall
  appliance was swapped out), some

  hosts on the same subnet are experiencing intermittent packet loss and high

  latency when communicating with the new device''s IP address. The old device''s

  MAC address is still cached in the ARP table, causing frames to be sent to the

  decommissioned hardware. Flush the stale ARP cache so hosts learn the correct

  MAC address of the replacement device.


  OBJECTIVE: Inspect the ARP cache and identify stale entries; Flush the stale ARP entry for the target
  IP; Verify the ARP cache is updated with the correct MAC. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Inspect the ARP cache and identify stale entries
- Flush the stale ARP entry for the target IP
- Verify the ARP cache is updated with the correct MAC
- Confirm connectivity to the replacement device
