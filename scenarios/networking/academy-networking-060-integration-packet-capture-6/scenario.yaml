    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `tcpdump -nni` with BPF filters and the resulting
    pcap.

    2. Configure credentials and networking, then drive one happy-path transaction
    end to end across both systems.

    3. Verify the result — the capture isolates the problem conversation.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-networking-060-integration-packet-capture-6.conf`,
