description: 'CONTEXT: A team operating network operations needs you to resolve `networking: Vlans — Troubleshooting
  Drill` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The network lab is degraded. Hosts on a vlan cannot reach their gateway. Recent
  changes may exist around VLANs, but do not restart blindly — gather evidence first. Production alert:
  hosts on a VLAN cannot reach their gateway. You are on call for networking and must troubleshoot VLANs
  methodically — triage symptoms, isolate root cause, apply the smallest safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: hosts on a VLAN cannot reach their gateway; Root cause is
  isolated with evidence, not guesswork; Service behavior returns to normal after the fix. Success means
  `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: hosts on a VLAN cannot reach their gateway'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The network lab is degraded. Hosts on a vlan cannot reach their gateway. Recent changes
  may exist around VLANs, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ip -d link`, bridge VLAN tables, and switch config.

    2. Write down what looks normal versus wrong or missing for VLANs.

    3. Recall the core idea: tagged interfaces, trunk ports, and segmentation. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `ip -d link`, bridge VLAN tables, and switch config.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — VLAN tagging is correct end-to-end.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
