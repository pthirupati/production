tasks:
- id: task_1
  title: Mtu And Fragmentation — Automation Lab
  description: Restore healthy behavior for Mtu And Fragmentation — Automation Lab by investigating the
    failure, applying the smallest safe fix, and validating the outcome.
  background: 'This networking lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: service_active
    command: systemctl is-active nginx
    expected_status: active
    error_message: The nginx service is not active yet. Check `systemctl status nginx` and `journalctl
      -u nginx -n 50`.
solution:
  summary: The root cause is an unhealthy `nginx` service; repair it and verify active state.
  files_changed: []
  commands_run:
