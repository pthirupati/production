description: 'CONTEXT: A team operating network operations needs you to resolve `NTP Not Failing Over
  to Backup` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A host with a single NTP source that has failed, leaving chrony unsynchronized.
  Time sync is lost because the primary NTP server is down and no backup source is configured. Add a backup
  source and confirm synchronization.


  OBJECTIVE: Confirm the issue: chronyc tracking shows not synchronised.; Apply the documented fix; Verify
  the network is healthy. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
