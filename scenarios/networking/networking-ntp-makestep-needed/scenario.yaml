description: 'CONTEXT: A team operating network operations needs you to resolve `NTP Refusing Large Step
  Correction` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A host whose large time offset prevents chrony from synchronizing. The clock
  is off by minutes and chrony won''t slew it fast enough, so it stays unsynchronized. Apply a step correction
  and confirm sync.


  OBJECTIVE: Confirm the issue: chronyc tracking shows not synchronised.; Apply the documented fix; Verify
  the network is healthy. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
