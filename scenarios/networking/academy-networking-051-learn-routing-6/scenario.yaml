description: This beginner-friendly Networking lab introduces network routing. You
  will explore routing tables, default gateways, static routes, and asymmetric paths
  on the network lab. Read the environment first, then follow the guided steps — no
  prior production experience required.
objectives:
- Understand how network routing work in this lab environment
- Identify the main status and configuration signals for network routing
- Confirm you can read the current state confidently before changing anything
initial_state: The network lab is online with a starter network routing setup. Some
  pieces are intentionally incomplete so you can learn how they fit together. Nothing
  is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ip route`, `traceroute`, and interface addresses.

    2. Write down what looks normal versus wrong or missing for network routing.

    3. Recall the core idea: routing tables, default gateways, static routes, and
    asymmetric paths. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for network routing.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `ip route`, `traceroute`, and interface addresses.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — packets follow the intended next-hop and return path is
    symmetric.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-networking-051-learn-routing-6.conf`,
    then click Check Solution.'
