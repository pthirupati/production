description: 'CONTEXT: A team operating network operations needs you to resolve `BGP Session Reset by
  Hold-Timer Expiry` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A router whose BGP session resets on hold-timer expiry due to mismatched keepalive/hold
  settings. A BGP session keeps resetting because mismatched/too-aggressive hold timers expire under load.
  Align the timers and confirm a stable Established session.


  OBJECTIVE: Confirm the session is not stably Established; Align BGP keepalive/hold timers with the peer;
  Verify the session is Established and stable. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
