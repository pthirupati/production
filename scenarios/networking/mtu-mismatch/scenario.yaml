title: MTU Mismatch Causing Packet Loss
slug: networking-mtu-mismatch
difficulty: hard
category: Networking
description: 'Large TCP transfers and file uploads intermittently fail while small
  requests succeed. The symptom is an MTU mismatch between the host NIC (1500 bytes)
  and a VPN tunnel (1450 bytes). Large packets that cannot be fragmented are silently
  dropped. The fix involves setting the correct MTU on the tunnel interface and enabling
  TCP MSS clamping via iptables.

  '
initial_state: 'Simulated RHEL 9 server with a VPN tunnel. ping with small packets
  succeeds but ping -s 1400 -M do to the remote end times out. Large file transfers
  hang indefinitely.

  '
objectives:
  - Use ping with the DF bit set to discover the effective path MTU
  - Set the correct MTU on the tunnel interface to match the path MTU
  - Apply TCP MSS clamping and confirm large transfers complete successfully
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
hints:
  - content: 'Run: ping -c 3 -s 1400 -M do <remote_ip> to test if large packets with
      the DF bit are getting through.'
    cost: 10
    order: 1
  - content: 'Lower the MTU: ip link set tun0 mtu 1450 and apply MSS clamping with
      iptables -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu'
    cost: 20
    order: 2
requires_companion_hosts: false
dual_terminal: false
jira_priority: High
