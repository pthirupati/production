title: MTU Mismatch Causing Packet Loss
slug: networking-mtu-mismatch
difficulty: hard
category: Networking
description: 'Large TCP transfers and file uploads intermittently fail while small requests succeed. The
  symptom is an MTU mismatch between the host NIC (1500 bytes) and a VPN tunnel (1450 bytes). Large packets
  that cannot be fragmented are silently dropped. The fix involves setting the correct MTU on the tunnel
  interface and enabling TCP MSS clamping via iptables.

  '
initial_state: 'Simulated RHEL 9 server with a VPN tunnel. ping with small packets succeeds but ping -s
  1400 -M do to the remote end times out. Large file transfers hang indefinitely.

  '
objectives:
- Use ping with the DF bit set to discover the effective path MTU
- Set the correct MTU on the tunnel interface to match the path MTU
- Apply TCP MSS clamping and confirm large transfers complete successfully
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Reproduce the MTU problem: small requests work, large ones stall. Test with the DF bit: `ping
    -c3 -s 1400 -M do <remote_ip>` fails while `-s 100` succeeds.'
- order: 2
  cost: 15
  content: 'Lower the tunnel MTU to fit the path: `ip link set tun0 mtu 1450`, and clamp TCP MSS so sessions
    negotiate a safe size: `iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu`.'
- order: 3
  cost: 20
  content: 'Re-test: `ping -s 1400 -M do <remote_ip>` now succeeds and large transfers complete. Persist
    the MTU/MSS settings (interface config + saved iptables) so they survive reboot.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: High
