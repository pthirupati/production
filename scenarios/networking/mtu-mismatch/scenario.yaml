title: MTU Mismatch Causing Packet Loss
slug: networking-mtu-mismatch
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating network operations needs you to resolve `MTU Mismatch Causing
  Packet Loss` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server with a VPN tunnel. ping with small packets succeeds
  but ping -s 1400 -M do to the remote end times out. Large file transfers hang indefinitely. Large TCP
  transfers and file uploads intermittently fail while small requests succeed. The symptom is an MTU mismatch
  between the host NIC (1500 bytes) and a VPN tunnel (1450 bytes). Large packets that cannot be fragmented
  are silently dropped. The fix involves setting the correct MTU on the tunnel interface and enabling
  TCP MSS clamping via iptables.


  OBJECTIVE: Use ping with the DF bit set to discover the effective path MTU; Set the correct MTU on the
  tunnel interface to match the path MTU; Apply TCP MSS clamping and confirm large transfers complete
  successfully. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
