description: 'CONTEXT: A team operating network operations needs you to resolve `networking: Network Routing
  — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The network lab is online with a starter network routing setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
  This beginner-friendly networking lab introduces network routing. You will explore routing tables, default
  gateways, static routes, and asymmetric paths on the network lab. Read the environment first, then follow
  the guided steps — no prior production experience required.


  OBJECTIVE: Understand how network routing work in this lab environment; Identify the main status and
  configuration signals for network routing; Confirm you can read the current state confidently before
  changing anything. Success means `systemctl is-active named` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how network routing work in this lab environment
- Identify the main status and configuration signals for network routing
- Confirm you can read the current state confidently before changing anything
initial_state: The network lab is online with a starter network routing setup. Some pieces are intentionally
  incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ip route`, `traceroute`, and interface addresses.

    2. Write down what looks normal versus wrong or missing for network routing.

    3. Recall the core idea: routing tables, default gateways, static routes, and asymmetric paths. Form
    one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status named` — note Active/Failed and the last log lines.

    2. Read `journalctl -u named -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `ip route`, `traceroute`, and interface addresses.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — packets follow the intended next-hop and return path is symmetric.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
