description: 'CONTEXT: A team operating network operations needs you to resolve `Configure BGP Neighbor`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Router with no BGP configured. You must bring up a BGP session to neighbor
  10.0.0.2 (AS 65001) and exchange routes. Build task: establish a BGP session with peer 10.0.0.2 in AS
  65001. Starting with no BGP configuration, define the local BGP process, configure the neighbor with
  the correct remote AS, advertise the required network, and confirm the session reaches Established.


  OBJECTIVE: Configure the local BGP process and the neighbor 10.0.0.2 with remote-as 65001; Advertise
  the required network into BGP; Verify the session reaches Established and routes are exchanged. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
