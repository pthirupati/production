title: Configure BGP Neighbor
slug: configure-bgp-neighbor-do
technology: Networking
category: Build Lab
difficulty: easy
scenario_type: do
time_limit: 900
max_score: 100
infrastructure_type: docker
lab_mode: docker
jira_priority: Low
is_free: false
description: 'Build task: establish a BGP session with peer 10.0.0.2 in AS 65001. Starting with no BGP
  configuration, define the local BGP process, configure the neighbor with the correct remote AS, advertise
  the required network, and confirm the session reaches Established.'
objectives:
- Configure the local BGP process and the neighbor 10.0.0.2 with remote-as 65001
- Advertise the required network into BGP
- Verify the session reaches Established and routes are exchanged
initial_state: Router with no BGP configured. You must bring up a BGP session to neighbor 10.0.0.2 (AS
  65001) and exchange routes.
hints:
- order: 1
  cost: 10
  content: 'Enter BGP config (FRR/vtysh): `router bgp <local-asn>` then `neighbor 10.0.0.2 remote-as 65001`.'
- order: 2
  cost: 15
  content: 'Advertise the network you need to share: `network <prefix>/<len>` under the address-family.
    Save the config.'
- order: 3
  cost: 20
  content: 'Verify: `show ip bgp summary` shows 10.0.0.2 as Established with a prefix count, and `show
    ip route bgp` lists the learned routes.'
