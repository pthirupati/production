title: NTP Source Unreachable Causing Clock Drift
slug: networking-ntp-source-unreachable
technology: Networking
category: Time / NTP
difficulty: medium
lab_mode: simulation
simulation_type: networking
time_limit: 1500
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: Hosts are drifting because the configured NTP source is unreachable through a firewall change.
  Restore reachability/select a working source and confirm chrony is synchronized.
initial_state: A host whose NTP source became unreachable, so chrony is not synchronized and time is drifting.
objectives:
- Confirm chrony is not synchronized
- Restore reachability or select a working NTP source
- Verify chronyc tracking shows synchronized
hints:
- order: 1
  cost: 10
  content: chronyc tracking shows 'Not synchronised'.
- order: 2
  cost: 15
  content: Open NTP to a reachable server / fix the source.
- order: 3
  cost: 20
  content: chronyc shows synced.
