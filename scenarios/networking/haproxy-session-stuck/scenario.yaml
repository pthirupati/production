description: 'CONTEXT: A team operating network operations needs you to resolve `HAProxy Session Table
  Full — Increase maxconn to Fix Rejects` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: HAProxy 2.6. Global maxconn=200. Frontend maxconn=200. Stats show

  "MaxConn: 200/200" and "Denied: XXX". New connections get TCP reset.

  Backend servers have capacity — the limit is entirely in HAProxy config. During a traffic spike, HAProxy
  started rejecting new connections with the error

  "no server available" even though all backend servers are healthy and have capacity.

  The HAProxy session table is full because maxconn is set to 200 — far too low for

  the current traffic volume of ~2000 concurrent connections. Increase maxconn in

  the global and frontend sections, and increase the per-server connection limit.


  OBJECTIVE: Identify that maxconn is exhausted in the HAProxy stats; Increase global maxconn to at least
  10000; Increase frontend maxconn to match. Success means `systemctl is-active --quiet` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify that maxconn is exhausted in the HAProxy stats
- Increase global maxconn to at least 10000
- Increase frontend maxconn to match
- Increase per-server maxconn in the backend section
- Reload HAProxy and verify it accepts new connections
initial_state: 'HAProxy 2.6. Global maxconn=200. Frontend maxconn=200. Stats show

  "MaxConn: 200/200" and "Denied: XXX". New connections get TCP reset.

  Backend servers have capacity — the limit is entirely in HAProxy config.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
