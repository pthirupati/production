description: 'CONTEXT: A team operating network operations needs you to resolve `Firewall Blocked HTTP
  — Add iptables Allow Rule` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with nginx running. An iptables DROP rule is installed in the
  INPUT

  chain for tcp dpt:80. The service is healthy but completely unreachable. Nginx is running and healthy,
  but all HTTP requests on port 80 are being silently

  dropped by an iptables INPUT rule installed during a recent security hardening pass.

  The rule was too broad — it blocks all traffic on port 80 rather than only external

  traffic. Add a specific ACCEPT rule before the DROP to restore HTTP access.


  OBJECTIVE: Identify the iptables rule dropping port 80 traffic; Insert an ACCEPT rule for tcp/80 before
  the DROP rule; Confirm nginx responds to HTTP requests on port 80. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the iptables rule dropping port 80 traffic
- Insert an ACCEPT rule for tcp/80 before the DROP rule
- Confirm nginx responds to HTTP requests on port 80
initial_state: 'Ubuntu 22.04 with nginx running. An iptables DROP rule is installed in the INPUT

  chain for tcp dpt:80. The service is healthy but completely unreachable.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
