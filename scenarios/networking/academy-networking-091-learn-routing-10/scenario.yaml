description: This beginner-friendly Networking lab introduces network routing. You
  will explore routing tables, default gateways, static routes, and asymmetric paths
  on the network lab. Read the environment first, then complete the guided steps —
  no prior production experience required.
objectives:
- Understand how network routing work in this lab environment
- Identify the main status and configuration signals for network routing
- Confirm you can read the current state confidently before changing anything
initial_state: The network lab is online with a starter network routing setup. Some
  pieces are intentionally incomplete so you can learn how the pieces fit together.
  Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: `ip route`, `traceroute`, and interface addresses. Write
    down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — routing tables, default gateways, static routes, and asymmetric
    paths. Make one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-networking-091-learn-routing-10.conf`, then
    click Check Solution.
