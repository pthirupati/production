description: 'CONTEXT: A team operating network operations needs you to resolve `nginx Upstream Timeout
  - Fix proxy_read_timeout for 504` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with nginx as a reverse proxy. proxy_read_timeout=30s configured
  in

  /etc/nginx/conf.d/app.conf. Backend API at /api/export takes 60+ seconds.

  All requests to /api/export return 504 Gateway Timeout. Users are receiving 504 Gateway Timeout errors
  from nginx when accessing a

  long-running API endpoint. The backend application legitimately takes 45–90

  seconds to process certain requests (data exports, report generation), but

  nginx''s proxy_read_timeout is set to 30 seconds — shorter than the processing

  time. Increase the timeout to allow these slow requests to complete successfully.


  OBJECTIVE: Identify the proxy_read_timeout setting causing 504 errors; Increase proxy_read_timeout to
  120 seconds in the nginx config; Also set proxy_connect_timeout and proxy_send_timeout appropriately.
  Success means `systemctl is-active --quiet` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the proxy_read_timeout setting causing 504 errors
- Increase proxy_read_timeout to 120 seconds in the nginx config
- Also set proxy_connect_timeout and proxy_send_timeout appropriately
- Reload nginx and verify the endpoint no longer returns 504
initial_state: 'Ubuntu 22.04 with nginx as a reverse proxy. proxy_read_timeout=30s configured in

