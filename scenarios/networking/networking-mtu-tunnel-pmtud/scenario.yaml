description: 'CONTEXT: A team operating network operations needs you to resolve `GRE Tunnel MTU Breaking
  Large Flows` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A host whose GRE tunnel MTU is wrong, hanging large transfers. Large flows
  over a GRE tunnel hang because the tunnel MTU is wrong and PMTUD can''t compensate. Set the correct
  tunnel MTU and confirm connectivity.


  OBJECTIVE: Confirm the issue: The interface MTU is wrong for the path.; Apply the documented fix; Verify
  the network is healthy. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
