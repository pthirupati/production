title: NTP Leap Smear Misconfiguration
slug: networking-ntp-leap-smear
technology: Networking
category: Time / NTP
difficulty: medium
lab_mode: simulation
simulation_type: networking
time_limit: 1500
max_score: 100
is_free: true
jira_priority: High
