description: 'Production alert: hosts on same IP range cannot talk due to VLAN mismatch.
  You are on call for Networking and must troubleshoot VLANs methodically — triage
  symptoms, find root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: hosts on same IP range cannot talk due to VLAN mismatch'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The network lab is degraded. Hosts on same ip range cannot talk due
  to vlan mismatch. Recent changes may exist around VLANs, but do not restart blindly
  — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Triage: switch port config, `ip -d link`, and ping across VLAN. Capture
    timestamps, error messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: VLAN tagging consistent end-to-end. Document the fix,
    add `# FIXED-OK` to `/opt/fixitlab/academy/academy-networking-094-troubleshoot-vlan-10.conf`,
    and rerun Check Solution.'
