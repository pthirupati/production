description: 'CONTEXT: A team operating network operations has raised a ticket for `Vlans — Troubleshoot
  Lab`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab. The architecture is a single lab-primary
  node exposing interfaces, routing tables, DNS, and firewall rules; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The network lab is degraded. Hosts on a vlan cannot reach their gateway. Recent
  changes may exist around VLANs, but do not restart blindly — gather evidence first.


  OBJECTIVE: The incident symptom is clear: hosts on a VLAN cannot reach their gateway; Root cause is
  isolated with evidence, not guesswork; Service behavior returns to normal after the fix. Acceptance
  criteria: the change is minimal and reversible, and success means `systemctl is-active named` returns
  active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant interfaces, routing tables, DNS, and firewall rules), changing one thing at a time.
  Check your work continuously against the objective — success means `systemctl is-active named` returns
  active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active named` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: hosts on a VLAN cannot reach their gateway'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The network lab is degraded. Hosts on a vlan cannot reach their gateway. Recent changes
  may exist around VLANs, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: hosts on a VLAN cannot reach their gateway.
    This lab is about VLANs — tagged interfaces, trunk ports, and segmentation. Read the objectives and
    the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For VLANs problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status named` and `journalctl -u named -n 50 --no-pager` before changing anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status named` — note Active/Failed and the last log lines.

    2. Read `journalctl -u named -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart named` and confirm `systemctl is-active named` succeeds.


    WHY: the grader checks real service state, not marker files.'
