description: 'CONTEXT: A team operating network operations needs you to resolve `NAT Masquerade Broken
  - Fix iptables POSTROUTING After` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 router. net.ipv4.ip_forward=0. iptables nat table POSTROUTING
  chain

  is empty. Internal hosts on 192.168.100.0/24 cannot reach the internet. Interface

  eth0 is the WAN interface. After a server reboot, hosts on the internal network (192.168.100.0/24) lost

  internet connectivity. The iptables MASQUERADE rule in the POSTROUTING chain was

  not persisted to the iptables rules file and was lost on reboot. Additionally,

  IP forwarding is disabled in the kernel. Restore both the MASQUERADE rule and

  IP forwarding so internal hosts can reach the internet.


  OBJECTIVE: Enable IP forwarding via sysctl; Restore the iptables MASQUERADE rule in the POSTROUTING
  chain; Persist the iptables rules so they survive future reboots. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Enable IP forwarding via sysctl
- Restore the iptables MASQUERADE rule in the POSTROUTING chain
- Persist the iptables rules so they survive future reboots
- Verify internal hosts can reach external destinations
