title: Nat — Security Lab
slug: academy-networking-056-security-nat-6
technology: networking
category: Harden
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating network operations needs you to resolve `networking: Nat — Security
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around NAT. Assume an
  auditor or pen test is next week — tighten controls with evidence. Security review: harden NAT on this
  networking system. Close unsafe defaults, enforce least privilege, and ensure SNAT/DNAT, masquerade,
  and port forwarding cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to NAT are removed or constrained; Access follows least privilege
  and is auditable; Security checks pass without breaking required functionality. Success means `systemctl
  is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to NAT are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around NAT. Assume an auditor or pen
  test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `iptables -t nat -S` / `nft list ruleset` and conntrack.

    2. Write down what looks normal versus wrong or missing for NAT.

    3. Recall the core idea: SNAT/DNAT, masquerade, and port forwarding. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `iptables -t nat -S` / `nft list ruleset` and conntrack.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — NAT translates the intended flows correctly.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
