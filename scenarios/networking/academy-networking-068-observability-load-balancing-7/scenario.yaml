description: Service operations lab. The `named` systemd unit is **failed/inactive** on this host — a
  realistic fault for Observability Practice workflows that depend on it. Diagnose with `systemctl status
  named` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active named`.
objectives:
- The `named` service is active (running)
- '`systemctl is-active named` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `named` service is not running (`systemctl is-active named` → inactive/failed). Dependent
  Observability Practice tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — LB config, backend health, and connection distribution.

    2. Write down what looks normal versus wrong or missing for load balancing.

    3. Recall the core idea: backends, health checks, and algorithms. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for load balancing.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — LB config, backend health, and connection distribution.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a sensible threshold.

    3. Verify the result — traffic is balanced across healthy backends.

    4. Click Check Solution once `systemctl is-active named` returns active.'
