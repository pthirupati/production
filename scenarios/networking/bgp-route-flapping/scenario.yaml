description: 'CONTEXT: A team operating network operations needs you to resolve `BGP Route Flapping —
  Fix Keepalive Timers` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: FRRouting (vtysh) configured with two BGP peers. One peer has keepalive=3s

  and holdtime=9s — too aggressive for this link. Link latency spikes above

  3s are causing the holdtime to expire and the session to reset. A BGP peer session between two routers
  is oscillating — the peer repeatedly

  transitions between Established and Idle states every 30–60 seconds, causing

  route flapping and instability for all prefixes learned from that peer.

  Analysis shows the holdtime timer is set too low relative to the keepalive

  interval, and the link has intermittent latency spikes. Fix the BGP timer

  configuration so the session remains stable under normal link conditions.


  OBJECTIVE: Identify the BGP peer session that is flapping; Diagnose the timer mismatch (keepalive vs
  holdtime); Set appropriate keepalive (10s) and holdtime (30s) timers. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the BGP peer session that is flapping
- Diagnose the timer mismatch (keepalive vs holdtime)
- Set appropriate keepalive (10s) and holdtime (30s) timers
- Confirm the BGP session reaches and holds Established state
