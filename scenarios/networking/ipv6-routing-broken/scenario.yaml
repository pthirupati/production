description: 'CONTEXT: A team operating network operations needs you to resolve `IPv6 Routing Broken —
  Fix Router Advertisement Config` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with radvd installed. /etc/radvd.conf has AdvSendAdvert off and

  AdvAutonomous off on the prefix block. IPv6 forwarding is enabled. Hosts on

  the LAN have link-local addresses but no global addresses and no default route. IPv6 hosts on the LAN
  are not receiving Router Advertisements (RA) and therefore

  cannot autoconfigure their default gateway via SLAAC. The radvd daemon is installed

  but misconfigured — the AdvSendAdvert flag is off and the prefix advertisement is

  missing the autoconfiguration flags. IPv6 connectivity to the internet is broken

  for all hosts on the segment.


  OBJECTIVE: Identify that radvd is not sending Router Advertisements; Fix the radvd.conf to enable AdvSendAdvert
  and autoconfiguration flags; Restart radvd and verify hosts receive RA and a global IPv6 address. Success
  means `systemctl is-active --quiet` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify that radvd is not sending Router Advertisements
- Fix the radvd.conf to enable AdvSendAdvert and autoconfiguration flags
- Restart radvd and verify hosts receive RA and a global IPv6 address
- Confirm IPv6 default route is installed on a test host
initial_state: 'Ubuntu 22.04 with radvd installed. /etc/radvd.conf has AdvSendAdvert off and

  AdvAutonomous off on the prefix block. IPv6 forwarding is enabled. Hosts on

  the LAN have link-local addresses but no global addresses and no default route.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
