description: 'CONTEXT: A team operating network operations needs you to resolve `VLAN Misconfigured —
  Fix Trunk Port to Pass Traffic` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline network lab with interfaces, routing tables, DNS,
  and firewall rules. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Open vSwitch (OVS) bridge configured. Port eth2 is set as trunk but allowed

  VLAN list is empty. Native VLAN is set to 1 instead of the required 20.

  Hosts on VLAN 20 and 30 cannot communicate. After a switch port was changed from access to trunk mode,
  hosts on VLAN 20 and

  VLAN 30 lost connectivity to each other and to the upstream router. The trunk

  port is not passing the required VLANs. The switchport configuration is missing

  the allowed VLAN list and the native VLAN is misconfigured, causing all tagged

  frames to be dropped.


  OBJECTIVE: Identify the misconfigured trunk port; Add VLAN 20 and VLAN 30 to the allowed VLAN list on
  the trunk; Correct the native VLAN configuration. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the misconfigured trunk port
- Add VLAN 20 and VLAN 30 to the allowed VLAN list on the trunk
- Correct the native VLAN configuration
- Verify inter-VLAN traffic flows through the trunk
