description: Service operations lab. The `httpd` systemd unit is **failed/inactive** on this host — a
  realistic fault for Integration Lab workflows that depend on it. Diagnose with `systemctl status httpd`
  and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active httpd`.
objectives:
- The `httpd` service is active (running)
- '`systemctl is-active httpd` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `httpd` service is not running (`systemctl is-active httpd` → inactive/failed). Dependent
  Integration Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the document head.

    2. Write down what looks normal versus wrong or missing for metadata.

    3. Recall the core idea: head tags, Open Graph, and favicons. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for metadata.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the document head.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — metadata renders correctly across consumers.

    4. Click Check Solution once `systemctl is-active httpd` returns active.'
cross_technology: true
