description: 'CONTEXT: Complete the security coding exercise in the browser IDE.

  ENVIRONMENT: FixitLab HTML practice IDE — edit index.html / styles.css, open Preview,
  then Check Solution.

  SYMPTOM / STARTING STATE: Coding challenge: security. Edit index.html / styles.css
