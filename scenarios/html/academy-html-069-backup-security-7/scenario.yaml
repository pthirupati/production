  kind: impl
  instructions: 'Add a Content-Security-Policy meta http-equiv that includes default-src
    ''self''.

    Edit index.html / styles.css, use Preview, then Check Solution.

    '
  files:
  - path: index.html
    content: "<!DOCTYPE html>\n<html lang=\"en\"><head>\n  <meta charset=\"utf-8\"\
      \ />\n  <!-- TODO: CSP meta http-equiv -->\n  <title>Secure</title>\n  <link\
      \ rel=\"stylesheet\" href=\"styles.css\" />\n</head><body><p>Ok</p></body></html>\n"
    readonly: false
  - path: styles.css
    content: 'p { color: #222; }

      '
    readonly: false
  - path: solution.js
