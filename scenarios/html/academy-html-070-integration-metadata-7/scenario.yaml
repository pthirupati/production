coding_mode: true
coding_spec:
  language: html
  entrypoint: solution.js
  kind: impl
  instructions: 'Add Open Graph og:title meta and a canonical link. Variant 7.

    Edit index.html / styles.css, use Preview, then Check Solution.

    '
  files:
  - path: index.html
    content: "<!DOCTYPE html>\n<html lang=\"en\"><head>\n  <meta charset=\"utf-8\"\
      \ />\n  <title>Meta</title>\n  <!-- TODO: open graph title + canonical link\
      \ -->\n  <link rel=\"stylesheet\" href=\"styles.css\" />\n</head><body><h1>Meta</h1></body></html>\n"
    readonly: false
  - path: styles.css
    content: 'h1 { margin: 0; }

      '
    readonly: false
  - path: solution.js
    content: '// Grader harness — PAGE_HTML / PAGE_CSS are injected server-side from
      your files.

      // Keep this file; edit index.html and styles.css instead.

      '
    readonly: true
  visible_tests:
  - name: og
    code: assert(/property\s*=\s*["']og:title["']/i.test(PAGE_HTML), 'missing og:title');
  hidden_tests:
  - name: canonical
    code: assert(/rel\s*=\s*["']canonical["']/i.test(PAGE_HTML));
  - name: s89_case_1
    code: assert(true);
  - name: s89_case_2
    code: assert(typeof solution === "function" || typeof solution !== "undefined");
  - name: s89_case_3
    code: assert(true);
  timeout: 8
