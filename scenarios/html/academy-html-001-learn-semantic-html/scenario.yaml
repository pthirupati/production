    ip: 127.0.0.1
    specs: local offline lab environment
  pre_installed:
  - bash
  - coreutils
  - html
  - journalctl
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Semantic Html — Learn Lab
  description: Implement the semantic html exercise in the browser IDE and pass all
    tests.
  background: 'This html lab teaches systematic troubleshooting: observe, hypothesize,
    change, verify.'
  validation:
    type: script
    script: hidden_tests
    error_message: Hidden tests still failing — keep iterating in the IDE.
solution:
  summary: Implement the function so visible and hidden tests pass in the coding IDE.
  files_changed:
  - solution.js
  commands_run: []
  reference_docs: html-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx`` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
coding_mode: true
coding_spec:
  language: html
  entrypoint: solution.js
  kind: impl
  instructions: 'Add a landmark <main> containing one <h1> with meaningful page title
    text. Variant 1.

    Edit index.html / styles.css, use Preview, then Check Solution.

    '
  files:
  - path: index.html
    content: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
      \ />\n  <title>Lab</title>\n  <link rel=\"stylesheet\" href=\"styles.css\" />\n\
      </head>\n<body>\n  <!-- TODO: add a landmark region and a top-level heading\
      \ -->\n  <p>Welcome</p>\n</body>\n</html>\n"
    readonly: false
  - path: styles.css
    content: 'body { font-family: system-ui, sans-serif; }

      '
    readonly: false
  - path: solution.js
    content: '// Grader harness — PAGE_HTML / PAGE_CSS are injected server-side from
      your files.

      // Keep this file; edit index.html and styles.css instead.

      '
    readonly: true
  visible_tests:
  - name: main
    code: assert(/<main[\s>][\s\S]*<\/main>/i.test(PAGE_HTML), 'missing main landmark');
  - name: h1
    code: assert(/<h1[\s>][\s\S]*<\/h1>/i.test(PAGE_HTML), 'missing h1');
  hidden_tests:
  - name: h1-text
    code: assert(PAGE_HTML.toLowerCase().indexOf('</h1>') >= 0);
  - name: lang
    code: assert(PAGE_HTML.indexOf('lang=') >= 0);
  - name: s89_case_2
    code: assert(/<h1[^>]*>\s*Welcome\s*<\/h1>/i.test(PAGE_HTML), 'h1 should say Welcome');
  - name: s89_case_3
    code: assert(/<!DOCTYPE\s+html>/i.test(PAGE_HTML), 'missing doctype');
  timeout: 8
