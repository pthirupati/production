category: Fix
description: 'CONTEXT: A team operating HTML and web delivery has raised a ticket for `Nginx Wrong Document
  Root`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline web server lab. The architecture is a single lab-primary
  node exposing HTML pages, nginx/apache config, and browser devtools; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: RHEL host running nginx. The active server block''s `root` points
  to a directory that doesn''t contain the intended site files, so the wrong page (or an error) is returned
  on port 80.


  OBJECTIVE: Confirm nginx is serving the wrong content and find the active server block; Correct the
  root directive to the directory holding the site files; Reload nginx and verify the correct page is
  served. Acceptance criteria: the change is minimal and reversible, and success means HTTP 200 from http://localhost.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant HTML pages, nginx/apache config, and browser devtools), changing one thing at a time.
  Check your work continuously against the objective — success means HTTP 200 from http://localhost.


  VERIFY: Re-run the same check the grader uses and confirm HTTP 200 from http://localhost. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: nginx wrong document root is not behaving as
    the scenario objectives require. This lab is about nginx wrong document root — how nginx wrong document
    root behaves in a HTML and web delivery environment. Read the objectives and the current state, and
    note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For nginx wrong document root problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one component that owns
    the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified
    (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Test the config to get the exact file and line: `nginx -t`. It prints the offending directive (e.g.
    unknown directive "listn").'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
