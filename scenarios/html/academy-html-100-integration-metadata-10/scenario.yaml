description: 'CONTEXT: A team operating HTML and web delivery needs you to resolve `html: Metadata — Integration
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline web server lab with HTML pages, nginx/apache config,
  and browser devtools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for metadata. Downstream
  consumers are waiting on this integration path. Integration lab: connect metadata with an adjacent platform
  in the html stack. Validate authentication, data handoff, and failure behavior for head tags, Open Graph,
  and favicons.


  OBJECTIVE: metadata is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `systemctl
  is-active httpd` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- metadata is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for metadata. Downstream consumers
