description: 'Security review: harden responsive design on this HTML & Web Servers
  system. Close unsafe defaults, enforce least privilege, and ensure breakpoints,
  fluid layouts, and touch targets cannot be abused — without breaking legitimate
  use.'
objectives:
- Unsafe defaults related to responsive design are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around responsive
  design. Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Baseline current exposure: device mode, CSS grid/flex, and viewport meta.
    Note world-readable files, open ports, or excessive roles.'
- order: 2
  cost: 15
  content: Apply least privilege incrementally. Prefer explicit allows over broad
    wildcards.
- order: 3
  cost: 20
  content: Re-test legitimate workflows after hardening. Finish with `# FIXED-OK`
    in `/opt/fixitlab/academy/academy-html-066-security-responsive-7.conf` and Check
    Solution.
