objectives:
- Backup coverage for application security is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for application security.
  Leadership wants proof that restore works — not just that backup scripts exit zero.
hints:
- order: 1
  cost: 10
  content: Inspect backup schedules, last success time, and destination free space.
- order: 2
  cost: 15
  content: Run or repair the backup job, then perform a controlled restore to a scratch
    location.
- order: 3
  cost: 20
  content: Compare restored data to source. Complete the lab via `# FIXED-OK` in `/opt/fixitlab/academy/academy-html-049-backup-security-5.conf`.
