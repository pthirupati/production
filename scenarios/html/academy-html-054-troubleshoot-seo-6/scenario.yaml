hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — head tags and rendered metadata.

    2. Write down what looks normal versus wrong or missing for SEO.

    3. Recall the core idea: titles, meta, canonical, and structured data. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for SEO.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — head tags and rendered metadata.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — metadata is complete and correct.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-html-054-troubleshoot-seo-6.conf`,
    then click Check Solution.'
