description: 'CONTEXT: A team operating HTML and web delivery needs you to resolve `Strict CSP Blocking
  Site Assets` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline web server lab with HTML pages, nginx/apache config,
  and browser devtools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A static page whose embedded CSP blocks its own resources, breaking the UI.
  A new Content-Security-Policy is so strict it blocks the site''s own scripts/styles. Adjust the policy
  to allow legitimate assets and confirm the file is corrected.


  OBJECTIVE: Confirm legitimate assets are CSP-blocked; Adjust the CSP to allow them; Verify the file
  is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
