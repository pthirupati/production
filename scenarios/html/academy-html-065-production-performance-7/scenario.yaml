coding_spec:
  language: html
  entrypoint: solution.js
  kind: impl
  instructions: 'Add loading="lazy" on an <img> and defer on a script tag.

    Edit index.html / styles.css, use Preview, then Check Solution.

    '
  files:
  - path: index.html
    content: "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\" /><title>Perf</title><link\
      \ rel=\"stylesheet\" href=\"styles.css\" /></head><body>\n  <img src=\"hero.jpg\"\
      \ alt=\"Hero\" />\n  <script src=\"app.js\"></script>\n  <!-- TODO: lazy-load\
      \ the image; defer the script -->\n</body></html>\n"
    readonly: false
  - path: styles.css
    content: 'img { max-width: 100%; }

      '
    readonly: false
  - path: solution.js
    content: '// Grader harness — PAGE_HTML / PAGE_CSS are injected server-side from
      your files.

      // Keep this file; edit index.html and styles.css instead.

      '
    readonly: true
  visible_tests:
  - name: lazy
    code: assert(/loading\s*=\s*["']lazy["']/i.test(PAGE_HTML), 'missing loading=lazy');
  hidden_tests:
  - name: defer
    code: assert(/<script[^>]*\sdefer\b/i.test(PAGE_HTML));
  - name: s89_case_1
    code: assert(true);
  - name: s89_case_2
    code: assert(typeof solution === "function" || typeof solution !== "undefined");
  - name: s89_case_3
    code: assert(true);
  timeout: 8
