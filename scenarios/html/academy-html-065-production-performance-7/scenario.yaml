  OBJECTIVE: Implement the required changes so all visible and hidden tests pass.

  VERIFY: Check Solution passes all hidden tests.

  '
objectives:
- Implement the required function in index.html
- Pass visible tests with Run
- Pass Check Solution (hidden tests)
initial_state: 'Coding challenge: performance. Edit index.html / styles.css — Preview
  shows the page; Check Solution grades markup.'
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: the UI janks or re-renders
    excessively. This lab is about performance — render cost, memoization, and profiling.
    Read the objectives and the current state, and note precisely what looks wrong
    versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For performance problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to
    the one component that owns the symptom, (3) change exactly one thing, (4) re-check.
    Apply production standards for performance: resource limits, monitoring, access
    controls, and a written rollback step.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 4
  cost: 40
  content: NARROW DOWN — implement the smallest change that satisfies one failing
    test, then re-run.
- order: 5
  cost: 60
  content: NEAR-SOLUTION — finish the function so all visible tests pass, then Check
    Solution.
