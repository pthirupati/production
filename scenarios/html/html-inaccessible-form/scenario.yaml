description: 'CONTEXT: A team operating HTML and web delivery needs you to resolve `Form Inputs Missing
  Labels (a11y)` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline web server lab with HTML pages, nginx/apache config,
  and browser devtools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A static contact form whose inputs lack <label> associations, failing a11y.
  A contact form fails accessibility checks because inputs have no associated labels. Add proper labels
  and confirm the file is corrected.


  OBJECTIVE: Confirm inputs lack labels; Associate labels with inputs; Verify the file is corrected. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
