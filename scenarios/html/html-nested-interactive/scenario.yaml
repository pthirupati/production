description: 'CONTEXT: A team operating HTML and web delivery needs you to resolve `Invalid Nested Interactive
  Elements` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline web server lab with HTML pages, nginx/apache config,
  and browser devtools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A page nesting interactive elements. Markup is invalid because interactive
  elements are nested (a within button).


  OBJECTIVE: Confirm the issue: Nested interactive controls; Apply the documented fix in /var/www/html/card.html;
  Verify the file is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A page nesting interactive elements.
objectives:
- 'Confirm the issue: Nested interactive controls'
- Apply the documented fix in /var/www/html/card.html
- Verify the file is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Verify the file is corrected.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
