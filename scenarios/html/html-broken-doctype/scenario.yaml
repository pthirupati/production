description: A page renders inconsistently across browsers because it's missing a valid DOCTYPE and falls
  into quirks mode. Add the HTML5 doctype and confirm the file is corrected.
initial_state: A static site whose index.html lacks a DOCTYPE, triggering browser quirks mode.
objectives:
- Confirm the page is in quirks mode
- Add the HTML5 <!DOCTYPE html>
- Verify the file is corrected
