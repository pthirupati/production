description: 'CONTEXT: A team operating HTML and web delivery needs you to resolve `Mobile Layout Broken
  Without Viewport` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline web server lab with HTML pages, nginx/apache config,
  and browser devtools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A static page missing the viewport meta, breaking mobile layout. The site
  doesn''t scale on phones because the responsive viewport meta tag is missing. Add it and confirm the
  file is corrected.


  OBJECTIVE: Confirm the page doesn''t scale on mobile; Add the viewport meta tag; Verify the file is
  corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
