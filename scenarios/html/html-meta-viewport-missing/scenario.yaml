  - index.html
  - styles.css
  commands_run: []
  reference_docs: html-fundamentals
coding_mode: true
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: 'Add a landmark <main> wrapping the page content. Variant 10.

    Edit index.html / styles.css, use Preview, then Check Solution.

    '
  files:
  - path: index.html
    content: '<!DOCTYPE html><html lang="en"><head><title>Lab</title></head><body><h1>Welcome</h1></body></html>

      '
    readonly: false
  - path: styles.css
    content: 'body { font-family: system-ui, sans-serif; }

      '
    readonly: false
  - path: solution.js
    content: '// Grader harness — PAGE_HTML / PAGE_CSS are injected server-side.

      // Keep this file; edit index.html and styles.css instead.

      '
    readonly: true
  visible_tests:
  - name: main
    code: assert(/<main[\s>]/i.test(PAGE_HTML), 'wrap content in <main>');
  hidden_tests:
  - name: doctype
    code: assert(/<!DOCTYPE\s+html>/i.test(PAGE_HTML));
  timeout: 8
