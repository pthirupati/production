tasks:
- id: task_1
  title: Seo — Troubleshoot Lab
  description: Implement the seo exercise in the browser IDE and pass all tests.
  background: 'This html lab teaches systematic troubleshooting: observe, hypothesize,
    change, verify.'
  validation:
