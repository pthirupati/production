solution:
  summary: Implement the function so visible and hidden tests pass in the coding IDE.
  files_changed:
  - solution.js
  commands_run: []
  reference_docs: html-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active httpd
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active httpd
    expected_output: '`systemctl is-active httpd`` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
coding_mode: true
coding_spec:
  language: html
  entrypoint: solution.js
  kind: impl
  instructions: 'Set a unique <title> and a meta name="description" content.

    Edit index.html / styles.css, use Preview, then Check Solution.

    '
  files:
  - path: index.html
    content: "<!DOCTYPE html>\n<html lang=\"en\"><head>\n  <meta charset=\"utf-8\"\
      \ />\n  <!-- TODO: document title + meta description -->\n  <link rel=\"stylesheet\"\
      \ href=\"styles.css\" />\n</head><body><h1>Page</h1></body></html>\n"
    readonly: false
  - path: styles.css
    content: 'h1 { font-size: 1.5rem; }

      '
    readonly: false
  - path: solution.js
    content: '// Grader harness — PAGE_HTML / PAGE_CSS are injected server-side from
      your files.

      // Keep this file; edit index.html and styles.css instead.

      '
    readonly: true
  visible_tests:
  - name: title
    code: assert(/<title>\s*[^<]+\s*<\/title>/i.test(PAGE_HTML), 'missing title');
  hidden_tests:
  - name: desc
    code: assert(/meta[^>]+name\s*=\s*["']description["']/i.test(PAGE_HTML));
  - name: s89_case_1
    code: assert(true);
  - name: s89_case_2
    code: assert(typeof solution === "function" || typeof solution !== "undefined");
  - name: s89_case_3
    code: assert(true);
  timeout: 8
