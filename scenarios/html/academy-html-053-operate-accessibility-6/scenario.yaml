description: 'CONTEXT: A team operating HTML and web delivery needs you to resolve `html: Accessibility
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline web server lab with HTML pages, nginx/apache config,
  and browser devtools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The web server lab is healthy enough for scheduled work on accessibility.
  Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine accessibility
  task safely in html. Follow change control — inspect, change, verify — while working with semantic markup,
  ARIA, and keyboard nav.


  OBJECTIVE: Day-2 accessibility work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 accessibility work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The web server lab is healthy enough for scheduled work on accessibility. Complete the
  maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. The system remains stable for dependent teams.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
