jira_priority: Medium
description: 'CONTEXT: A team operating HTML and web delivery needs you to resolve `html: Performance
  — Production Readiness` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline web server lab with HTML pages, nginx/apache config,
  and browser devtools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but performance is not production ready — missing
  guardrails, runbooks, or capacity checks. Production readiness for performance. Harden, document, and
  validate render cost, memoization, and profiling so the change is safe to run during a maintenance window.


  OBJECTIVE: Day-2 performance work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `systemctl is-active httpd` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 performance work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but performance is not production ready — missing guardrails,
  runbooks, or capacity checks.
