description: Service operations lab. The `httpd` systemd unit is **failed/inactive** on this host — a
  realistic fault for Production Readiness workflows that depend on it. Diagnose with `systemctl status
  httpd` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active httpd`.
objectives:
- The `httpd` service is active (running)
- '`systemctl is-active httpd` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `httpd` service is not running (`systemctl is-active httpd` → inactive/failed). Dependent
  Production Readiness tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the profiler and re-render counts.

    2. Write down what looks normal versus wrong or missing for performance.

    3. Recall the core idea: render cost, memoization, and profiling. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for performance.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the profiler and re-render counts.

    2. Apply production standards for performance: resource limits, monitoring, access controls, and a
    written rollback step.

    3. Verify the result — unnecessary work is removed and the UI is smooth.

    4. Click Check Solution once `systemctl is-active httpd` returns active.'
