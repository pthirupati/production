description: 'CONTEXT: A team operating HTML and web delivery needs you to resolve `Deploy HTML Static
  Site` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline web server lab with HTML pages, nginx/apache config,
  and browser devtools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux host with nginx installed but no site content deployed. Port 80 should
  serve your static page once configured. Build task: publish a static HTML page and serve it with nginx
  on port 80. Starting from a host with nginx but no site, create an index.html, place it in the web root,
  ensure nginx is configured and running, and verify the page is served over HTTP.


  OBJECTIVE: Create an index.html in the nginx document root; Ensure nginx is configured to serve it on
  port 80 and is running; Verify the page is reachable over HTTP. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Create an index.html in the nginx document root
- Ensure nginx is configured to serve it on port 80 and is running
- Verify the page is reachable over HTTP
initial_state: Linux host with nginx installed but no site content deployed. Port 80 should serve your
  static page once configured.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
