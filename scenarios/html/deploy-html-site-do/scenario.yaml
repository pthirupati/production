description: 'CONTEXT: Complete the coding exercise for deploy-html-site-do in the
  browser IDE.

  ENVIRONMENT: FixitLab HTML practice IDE — edit index.html / styles.css, open Preview,
  then Check Solution.

  SYMPTOM / STARTING STATE: Coding challenge in the browser IDE. Edit index.html /
  styles.css — Preview shows the page; Check Solution grades markup.

  OBJECTIVE: Implement the required changes so all visible and hidden tests pass.

  VERIFY: Check Solution passes all hidden tests.

  '
objectives:
- Complete the exercise in index.html
- Pass visible tests with Run / Preview
- Pass Check Solution (hidden tests)
initial_state: Coding challenge in the browser IDE. Edit index.html / styles.css —
  Preview shows the page; Check Solution grades markup.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: deploy HTML static site
    is not behaving as the scenario objectives require. This lab is about deploy HTML
    static site — how deploy HTML static site behaves in a HTML and web delivery environment.
    Read the objectives and the current state, and note precisely what looks wrong
    versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For deploy HTML static site problems the reliable
    method is: (1) reproduce/observe the failure, (2) narrow from the whole system
    down to the one component that owns the symptom, (3) change exactly one thing,
    (4) re-check. Execute the maintenance in small, reversible steps, taking a snapshot
    or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect
    HTTP 200).

    WHY: systemd will not start nginx until `nginx -t` passes.'
