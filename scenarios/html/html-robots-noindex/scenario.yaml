description: 'CONTEXT: A team operating HTML and web delivery needs you to resolve `Page Accidentally
  Set to noindex` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline web server lab with HTML pages, nginx/apache config,
  and browser devtools. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A page with an accidental noindex meta. An important page is deindexed because
  a robots noindex meta is present.


  OBJECTIVE: Confirm the issue: Page excluded from search; Apply the documented fix in /var/www/html/landing.html;
  Verify the file is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
