jira_priority: Low
description: 'CONTEXT: Complete the forms coding exercise in the browser IDE.

  ENVIRONMENT: FixitLab HTML practice IDE — edit index.html / styles.css, open Preview,
  then Check Solution.

  SYMPTOM / STARTING STATE: Coding challenge: forms. Edit index.html / styles.css
  — Preview shows the page; Check Solution grades markup.

  OBJECTIVE: Implement the required changes so all visible and hidden tests pass.

  VERIFY: Check Solution passes all hidden tests.

  '
objectives:
- Implement the required function in index.html
- Pass visible tests with Run
- Pass Check Solution (hidden tests)
initial_state: 'Coding challenge: forms. Edit index.html / styles.css — Preview shows
  the page; Check Solution grades markup.'
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: inputs do not update or
    invalid data submits. This lab is about forms — controlled inputs, validation,
    and submission. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For forms problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one
    component that owns the symptom, (3) change exactly one thing, (4) re-check. Create
    the smallest working slice of forms first, validate it, then add the remaining
    pieces one at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 4
  cost: 40
  content: NARROW DOWN — implement the smallest change that satisfies one failing
    test, then re-run.
- order: 5
  cost: 60
  content: NEAR-SOLUTION — finish the function so all visible tests pass, then Check
    Solution.
summary: Complete the forms — build lab html lab and verify success with the checker
estimated_minutes: 15
xp_reward: 100
prerequisites:
- Basic html literacy
tags:
- do
- hands-on
- html
linked_tutorial: html-web-zero-hero
what_you_will_learn:
- A working forms setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
environment:
  nodes:
  - role: primary
    os: FixitLab web server lab
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline lab environment
  pre_installed:
  - bash
  - coreutils
  - html
  - journalctl
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Forms — Build Lab
  description: Implement the forms exercise in the browser IDE and pass all tests.
  background: 'This html lab teaches systematic troubleshooting: observe, hypothesize,
    change, verify.'
  validation:
    type: script
    script: hidden_tests
    error_message: Hidden tests still failing — keep iterating in the IDE.
solution:
  summary: Implement the function so visible and hidden tests pass in the coding IDE.
  files_changed:
  - solution.js
  commands_run: []
  reference_docs: html-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx`` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
coding_mode: true
coding_spec:
  language: html
  entrypoint: solution.js
  kind: impl
  instructions: 'Add a <form> with an email <input type="email" required> and a submit
    <button>.

    Edit index.html / styles.css, use Preview, then Check Solution.

    '
  files:
  - path: index.html
    content: "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\" /><title>Form</title><link\
      \ rel=\"stylesheet\" href=\"styles.css\" /></head><body>\n  <!-- TODO: add a\
      \ form with email field and submit control -->\n</body></html>\n"
    readonly: false
  - path: styles.css
    content: 'form { display: grid; gap: 0.5rem; max-width: 20rem; }

      '
    readonly: false
  - path: solution.js
    content: '// Grader harness — PAGE_HTML / PAGE_CSS are injected server-side from
      your files.

      // Keep this file; edit index.html and styles.css instead.

      '
    readonly: true
  visible_tests:
  - name: form
    code: assert(/<form[\s>][\s\S]*<\/form>/i.test(PAGE_HTML), 'missing form');
  - name: email
    code: assert(/type\s*=\s*["']email["']/i.test(PAGE_HTML), 'missing email input');
  hidden_tests:
  - name: required
    code: assert(/required/i.test(PAGE_HTML));
  - name: button
    code: assert(/<button[\s>]/i.test(PAGE_HTML) || /type\s*=\s*["']submit["']/i.test(PAGE_HTML));
  - name: s89_case_2
    code: assert(typeof solution === "function" || typeof solution !== "undefined");
  - name: s89_case_3
    code: assert(true);
  timeout: 8
