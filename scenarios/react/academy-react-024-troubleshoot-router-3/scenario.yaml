tasks:
- id: task_1
  title: Routing — Troubleshoot Lab
  description: Implement the router exercise in the browser IDE and pass all tests.
  background: 'This react lab teaches systematic troubleshooting: observe, hypothesize,
    change, verify.'
  validation:
    type: script
    script: hidden_tests
