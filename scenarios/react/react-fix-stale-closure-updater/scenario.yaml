initial_state: A custom hook batches setState calls in one tick via applyUpdates(state, updates). The
  buggy version computes every update from the same captured starting value (a stale closure), so three
  "+1" updates only add 1. Fix it to thread the running value through the queue.
solution_explanation: 'This is the classic React stale-closure trap. When you call setCount(count + 1)
  three times in one

  event handler, all three close over the SAME `count` from that render, so they all compute the same

  value and the last one wins — you get +1, not +3. The fix React gives you is the functional updater:

  setCount(c => c + 1), where each update receives the latest pending value. applyUpdates models the

  queue: it must reduce over the updates, feeding the result of each step into the next. The buggy code

  resolves every update against the original `state` (the captured value). The fix is a reduce where the

  accumulator (`acc`) is the running value: a function update calls update(acc); a plain-value update

  replaces acc. That way [+1, +1, +1] correctly threads 0 -> 1 -> 2 -> 3.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix applyUpdates(state, updates) so it resolves a queue of setState-style updates in\
    \ order,\neach one seeing the result of the previous (no stale closure):\n  - updates is an array;\
    \ each entry is either a plain value (replace) or a function\n    (prev) => next (functional updater).\n\
    \  - Process them left to right, threading the running value through. The result of the\n    last\
    \ update is the final state. An empty updates array returns `state` unchanged.\nExample: applyUpdates(0,\
    \ [c => c + 1, c => c + 1, c => c + 1]) must be 3, not 1.\nClick Run to try it, then Check Solution\
    \ to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function applyUpdates(state, updates) {\n  // BUG: every update is resolved against the\
      \ SAME captured `state`,\n  // so batched functional updates all see the stale starting value.\n\
      \  let result = state;\n  for (const update of updates) {\n    if (typeof update === 'function')\
      \ {\n      result = update(state);   // <-- always reads the original state\n    } else {\n    \
      \  result = update;\n    }\n  }\n  return result;\n}\n"
    readonly: false
  visible_tests:
  - name: three increments add up to three
    code: 'const inc = (c) => c + 1;

      assert(applyUpdates(0, [inc, inc, inc]) === 3, applyUpdates(0, [inc, inc, inc]));

      '
  - name: single functional update works
    code: 'assert(applyUpdates(5, [(c) => c * 2]) === 10, applyUpdates(5, [(c) => c * 2]));

      '
  hidden_tests:
  - name: empty queue returns the original state
    code: 'assert(applyUpdates(7, []) === 7, applyUpdates(7, []));

      '
  - name: plain value replaces the running value
    code: 'assert(applyUpdates(0, [10, (c) => c + 5]) === 15, applyUpdates(0, [10, (c) => c + 5]));

      '
  - name: a later plain value overrides earlier updates
    code: 'const inc = (c) => c + 1;

      assert(applyUpdates(0, [inc, inc, 100, inc]) === 101, applyUpdates(0, [inc, inc, 100, inc]));

      '
  - name: functional updaters thread through plain values
    code: 'assert(applyUpdates(1, [(c) => c + 1, 5, (c) => c * 3]) === 15, applyUpdates(1, [(c) => c +
      1, 5, (c) => c * 3]));

      '
  - name: works on non-numeric state too
    code: 'const out = applyUpdates({ n: 0 }, [(s) => ({ n: s.n + 1 }), (s) => ({ n: s.n + 1 })]);

      assert(out.n === 2, JSON.stringify(out));

      '
  - name: does not call functional updaters with the stale state
    code: 'const seen = [];

      const tap = (c) => { seen.push(c); return c + 1; };

      const final = applyUpdates(0, [tap, tap, tap]);

      assert(seen.join('','') === ''0,1,2'', ''updaters saw stale values: '' + seen.join('',''));

      assert(final === 3, final);

      '
  timeout: 8
