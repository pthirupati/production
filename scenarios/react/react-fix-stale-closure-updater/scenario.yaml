title: Fix the Stale-Closure Counter Updater
slug: react-fix-stale-closure-updater
technology: react
category: Fix
description: 'CONTEXT: A team operating React frontends needs you to resolve `Fix the Stale-Closure Counter
  Updater` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline React application with components, hooks, router,
  and build output. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A custom hook batches setState calls in one tick via applyUpdates(state, updates).
  The buggy version computes every update from the same captured starting value (a stale closure), so
  three "+1" updates only add 1. Fix it to thread the running value through the queue. A custom hook batches
  several setState calls in one tick. Its applyUpdates(state, updates) helper models how React resolves
  a queue of updates. The buggy version computes every update from the SAME captured starting value (a
  stale closure), so three "+1" updates only add 1 instead of 3. Fix it to thread the running value through
  the queue the way functional updaters do.


  OBJECTIVE: See why several updates in one tick collapse into one when each reads the captured value;
  Thread the accumulator so each update sees the result of the previous one; Support both plain-value
  updates and functional (prev => next) updates. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
