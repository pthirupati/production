description: This beginner-friendly React Development lab introduces React components.
  You will explore props, state, composition, and rendering boundaries on the React
  application. Read the environment first, then complete the guided steps — no prior
  production experience required.
objectives:
- Understand how React components work in this lab environment
- Identify the main status and configuration signals for React components
- Confirm you can read the current state confidently before changing anything
initial_state: The React application is online with a starter React components setup.
  Some pieces are intentionally incomplete so you can learn how the pieces fit together.
  Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: component tree, React DevTools, and console errors. Write
    down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — props, state, composition, and rendering boundaries. Make one
    small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-react-071-learn-components-8.conf`, then click
    Check Solution.
