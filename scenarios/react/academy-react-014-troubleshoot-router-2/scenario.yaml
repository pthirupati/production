description: 'CONTEXT: A team operating React frontends needs you to resolve `react: Routing — Troubleshooting
  Drill` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline React application with components, hooks, router,
  and build output. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The React application is degraded. Routes 404 or guards do not protect pages.
  Recent changes may exist around routing, but do not restart blindly — gather evidence first. Production
  alert: routes 404 or guards do not protect pages. You are on call for react and must troubleshoot routing
  methodically — triage symptoms, isolate root cause, apply the smallest safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: routes 404 or guards do not protect pages; Root cause is isolated
  with evidence, not guesswork; Service behavior returns to normal after the fix. Success means `systemctl
  is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: routes 404 or guards do not protect pages'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The React application is degraded. Routes 404 or guards do not protect pages. Recent changes
