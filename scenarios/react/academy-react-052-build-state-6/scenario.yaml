title: 'React Development: Terraform State — Build From Scratch'
slug: academy-react-052-build-state-6
technology: React Development
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Service operations lab. The `nginx` systemd unit is **failed/inactive** on this host — a
  realistic fault for Build From Scratch workflows that depend on it. Diagnose with `systemctl status
  nginx` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active nginx`.
objectives:
- The `nginx` service is active (running)
- '`systemctl is-active nginx` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `nginx` service is not running (`systemctl is-active nginx` → inactive/failed). Dependent
  Build From Scratch tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `terraform state list`, `terraform show`, and backend config.

    2. Write down what looks normal versus wrong or missing for Terraform state.

    3. Recall the core idea: local vs remote state, locking, drift, and resource addressing. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Terraform state.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `terraform state list`, `terraform show`, and backend config.

    2. Create the smallest working slice of Terraform state first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — state accurately reflects deployed resources.

    4. Click Check Solution once `systemctl is-active nginx` returns active.'
