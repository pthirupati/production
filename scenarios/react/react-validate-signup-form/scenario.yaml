title: Implement a Signup Form Validator
slug: react-validate-signup-form
technology: react
category: React Development
description: A React signup form keeps its fields in state and needs a pure validateSignup(values)
  function it can call on submit to decide whether to enable the button and which inline errors
  to show. Implement the validator so it returns a per-field errors object plus an isValid flag,
  with no DOM access — just the rules.
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Turn form-field values into a per-field errors object
- Apply each validation rule with the correct precedence (first failing rule wins per field)
- Derive an isValid flag from the absence of any errors
initial_state: A React signup form keeps its fields in state and needs a pure validateSignup(values)
  function for submit-time validation. Implement the validator so it returns a per-field errors
  object plus an isValid flag, with no DOM access.
solution_explanation: |
  Form validation in React is best kept as a pure function the component calls — it takes the
  current field values and returns { errors, isValid } so the UI can render inline messages and
  enable/disable submit. The key ideas: check one rule at a time per field and stop at the first
  failure (so the user sees the most relevant message), trim the email before the empty check,
  and compute isValid as "no keys in errors" using Object.keys(errors).length === 0. Each field
  only appears in errors when it actually fails a rule, so a fully valid form yields an empty
  errors object.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: implement
  instructions: |
    Implement validateSignup(values) where values = { email, password, confirm, age }.
    Return an object { errors, isValid }:
      errors is an object that contains a message ONLY for fields that fail, using the FIRST
      failing rule per field (in the order listed):
        email:    required (after trimming) -> 'Email is required';
                  must contain exactly one '@' with non-empty text on both sides -> 'Email is invalid'.
        password: required -> 'Password is required';
                  at least 8 characters -> 'Password must be at least 8 characters';
                  must contain a digit -> 'Password must contain a number'.
        confirm:  must equal password -> 'Passwords do not match'.
        age:      must be a number >= 18 -> 'You must be at least 18'.
      isValid is true only when errors has no keys.
    This is a pure function: no DOM, no state, no side effects.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function validateSignup(values) {
        // TODO: build the per-field errors object and derive isValid.
        // values = { email, password, confirm, age }
        const errors = {};
        return { errors, isValid: false };
      }
    readonly: false
  visible_tests:
  - name: a fully valid form has no errors
    code: |
      const r = validateSignup({ email: 'a@b.com', password: 'secret12', confirm: 'secret12', age: 18 });
      assert(r.isValid === true, 'expected valid');
      assert(Object.keys(r.errors).length === 0, JSON.stringify(r.errors));
  - name: missing email reports required
    code: |
      const r = validateSignup({ email: '   ', password: 'secret12', confirm: 'secret12', age: 20 });
      assert(r.errors.email === 'Email is required', JSON.stringify(r.errors));
      assert(r.isValid === false, 'should be invalid');
  hidden_tests:
  - name: malformed email reports invalid
    code: |
      const r = validateSignup({ email: 'not-an-email', password: 'secret12', confirm: 'secret12', age: 20 });
      assert(r.errors.email === 'Email is invalid', JSON.stringify(r.errors));
  - name: email with two at signs is invalid
    code: |
      const r = validateSignup({ email: 'a@@b.com', password: 'secret12', confirm: 'secret12', age: 20 });
      assert(r.errors.email === 'Email is invalid', JSON.stringify(r.errors));
  - name: short password message wins over missing-number
    code: |
      const r = validateSignup({ email: 'a@b.com', password: 'ab1', confirm: 'ab1', age: 20 });
      assert(r.errors.password === 'Password must be at least 8 characters', JSON.stringify(r.errors));
  - name: long password without a digit is rejected
    code: |
      const r = validateSignup({ email: 'a@b.com', password: 'abcdefgh', confirm: 'abcdefgh', age: 20 });
      assert(r.errors.password === 'Password must contain a number', JSON.stringify(r.errors));
  - name: empty password reports required first
    code: |
      const r = validateSignup({ email: 'a@b.com', password: '', confirm: '', age: 20 });
      assert(r.errors.password === 'Password is required', JSON.stringify(r.errors));
  - name: mismatched confirm reports an error
    code: |
      const r = validateSignup({ email: 'a@b.com', password: 'secret12', confirm: 'secret13', age: 20 });
      assert(r.errors.confirm === 'Passwords do not match', JSON.stringify(r.errors));
  - name: under-18 age is rejected
    code: |
      const r = validateSignup({ email: 'a@b.com', password: 'secret12', confirm: 'secret12', age: 17 });
      assert(r.errors.age === 'You must be at least 18', JSON.stringify(r.errors));
  - name: non-numeric age is rejected
    code: |
      const r = validateSignup({ email: 'a@b.com', password: 'secret12', confirm: 'secret12', age: 'old' });
      assert(r.errors.age === 'You must be at least 18', JSON.stringify(r.errors));
  - name: multiple fields can fail at once
    code: |
      const r = validateSignup({ email: '', password: 'short', confirm: 'nope', age: 10 });
      assert(r.errors.email === 'Email is required', JSON.stringify(r.errors));
      assert(r.errors.password === 'Password must be at least 8 characters', JSON.stringify(r.errors));
      assert(r.errors.confirm === 'Passwords do not match', JSON.stringify(r.errors));
      assert(r.errors.age === 'You must be at least 18', JSON.stringify(r.errors));
      assert(r.isValid === false, 'should be invalid');
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Build the errors object by checking one rule at a time per field and assigning errors.field the first time a rule fails; once a field has a message, skip its remaining rules.
- order: 2
  cost: 20
  content: "For email, trim it first for the required check, then validate the shape — splitting on '@' and requiring exactly two non-empty halves (parts.length === 2 && parts[0] && parts[1]) is enough here."
- order: 3
  cost: 30
  content: "For age use Number(values.age) and check Number.isFinite(n) && n >= 18. At the end, isValid = Object.keys(errors).length === 0."
