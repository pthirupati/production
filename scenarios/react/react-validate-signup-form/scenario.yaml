title: Implement a Signup Form Validator
slug: react-validate-signup-form
technology: react
category: Build
description: 'CONTEXT: A team operating React frontends needs you to resolve `Implement a Signup Form
  Validator` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline React application with components, hooks, router,
  and build output. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A React signup form keeps its fields in state and needs a pure validateSignup(values)
  function for submit-time validation. Implement the validator so it returns a per-field errors object
  plus an isValid flag, with no DOM access. A React signup form keeps its fields in state and needs a
  pure validateSignup(values) function it can call on submit to decide whether to enable the button and
  which inline errors to show. Implement the validator so it returns a per-field errors object plus an
  isValid flag, with no DOM access — just the rules.


  OBJECTIVE: Turn form-field values into a per-field errors object; Apply each validation rule with the
  correct precedence (first failing rule wins per field); Derive an isValid flag from the absence of any
  errors. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Turn form-field values into a per-field errors object
- Apply each validation rule with the correct precedence (first failing rule wins per field)
- Derive an isValid flag from the absence of any errors
initial_state: A React signup form keeps its fields in state and needs a pure validateSignup(values) function
  for submit-time validation. Implement the validator so it returns a per-field errors object plus an
  isValid flag, with no DOM access.
solution_explanation: 'Form validation in React is best kept as a pure function the component calls —
  it takes the

  current field values and returns { errors, isValid } so the UI can render inline messages and

  enable/disable submit. The key ideas: check one rule at a time per field and stop at the first

  failure (so the user sees the most relevant message), trim the email before the empty check,

  and compute isValid as "no keys in errors" using Object.keys(errors).length === 0. Each field

  only appears in errors when it actually fails a rule, so a fully valid form yields an empty

  errors object.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: implement
  instructions: "Implement validateSignup(values) where values = { email, password, confirm, age }.\n\
    Return an object { errors, isValid }:\n  errors is an object that contains a message ONLY for fields\
    \ that fail, using the FIRST\n  failing rule per field (in the order listed):\n    email:    required\
    \ (after trimming) -> 'Email is required';\n              must contain exactly one '@' with non-empty\
    \ text on both sides -> 'Email is invalid'.\n    password: required -> 'Password is required';\n \
    \             at least 8 characters -> 'Password must be at least 8 characters';\n              must\
    \ contain a digit -> 'Password must contain a number'.\n    confirm:  must equal password -> 'Passwords\
    \ do not match'.\n    age:      must be a number >= 18 -> 'You must be at least 18'.\n  isValid is\
    \ true only when errors has no keys.\nThis is a pure function: no DOM, no state, no side effects.\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function validateSignup(values) {\n  // TODO: build the per-field errors object and derive\
      \ isValid.\n  // values = { email, password, confirm, age }\n  const errors = {};\n  return { errors,\
      \ isValid: false };\n}\n"
    readonly: false
  visible_tests:
  - name: a fully valid form has no errors
    code: 'const r = validateSignup({ email: ''a@b.com'', password: ''secret12'', confirm: ''secret12'',
      age: 18 });

      assert(r.isValid === true, ''expected valid'');

      assert(Object.keys(r.errors).length === 0, JSON.stringify(r.errors));

      '
  - name: missing email reports required
    code: 'const r = validateSignup({ email: ''   '', password: ''secret12'', confirm: ''secret12'', age:
      20 });

      assert(r.errors.email === ''Email is required'', JSON.stringify(r.errors));

      assert(r.isValid === false, ''should be invalid'');

      '
  hidden_tests:
  - name: malformed email reports invalid
    code: 'const r = validateSignup({ email: ''not-an-email'', password: ''secret12'', confirm: ''secret12'',
      age: 20 });

      assert(r.errors.email === ''Email is invalid'', JSON.stringify(r.errors));

      '
  - name: email with two at signs is invalid
    code: 'const r = validateSignup({ email: ''a@@b.com'', password: ''secret12'', confirm: ''secret12'',
      age: 20 });

      assert(r.errors.email === ''Email is invalid'', JSON.stringify(r.errors));

      '
  - name: short password message wins over missing-number
    code: 'const r = validateSignup({ email: ''a@b.com'', password: ''ab1'', confirm: ''ab1'', age: 20
      });

      assert(r.errors.password === ''Password must be at least 8 characters'', JSON.stringify(r.errors));

      '
  - name: long password without a digit is rejected
    code: 'const r = validateSignup({ email: ''a@b.com'', password: ''abcdefgh'', confirm: ''abcdefgh'',
      age: 20 });

      assert(r.errors.password === ''Password must contain a number'', JSON.stringify(r.errors));

      '
  - name: empty password reports required first
    code: 'const r = validateSignup({ email: ''a@b.com'', password: '''', confirm: '''', age: 20 });

      assert(r.errors.password === ''Password is required'', JSON.stringify(r.errors));

      '
  - name: mismatched confirm reports an error
    code: 'const r = validateSignup({ email: ''a@b.com'', password: ''secret12'', confirm: ''secret13'',
      age: 20 });

      assert(r.errors.confirm === ''Passwords do not match'', JSON.stringify(r.errors));

      '
  - name: under-18 age is rejected
    code: 'const r = validateSignup({ email: ''a@b.com'', password: ''secret12'', confirm: ''secret12'',
      age: 17 });

      assert(r.errors.age === ''You must be at least 18'', JSON.stringify(r.errors));

      '
  - name: non-numeric age is rejected
    code: 'const r = validateSignup({ email: ''a@b.com'', password: ''secret12'', confirm: ''secret12'',
      age: ''old'' });

      assert(r.errors.age === ''You must be at least 18'', JSON.stringify(r.errors));

      '
  - name: multiple fields can fail at once
    code: 'const r = validateSignup({ email: '''', password: ''short'', confirm: ''nope'', age: 10 });

      assert(r.errors.email === ''Email is required'', JSON.stringify(r.errors));

      assert(r.errors.password === ''Password must be at least 8 characters'', JSON.stringify(r.errors));

      assert(r.errors.confirm === ''Passwords do not match'', JSON.stringify(r.errors));

      assert(r.errors.age === ''You must be at least 18'', JSON.stringify(r.errors));

      assert(r.isValid === false, ''should be invalid'');

      '
  timeout: 8
