title: 'React Development: React Context — Backup and Recovery'
slug: academy-react-009-backup-context
technology: React Development
category: Backup & Recovery
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Backup and recovery drill for React Context. Ensure backups run on schedule,
  retention is correct, and you can restore providers, consumers, and avoiding unnecessary
  rerenders within the lab RTO.
objectives:
- Backup coverage for React Context is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for React Context. Leadership
  wants proof that restore works — not just that backup scripts exit zero.
hints:
- order: 1
  cost: 10
  content: Inspect backup schedules, last success time, and destination free space.
- order: 2
  cost: 15
  content: Run or repair the backup job, then perform a controlled restore to a scratch
    location.
- order: 3
  cost: 20
  content: Compare restored data to source. Complete the lab via `# FIXED-OK` in `/opt/fixitlab/academy/academy-react-009-backup-context.conf`.
