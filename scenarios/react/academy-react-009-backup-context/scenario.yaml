title: 'React Development: Context Management — Backup and Recovery'
slug: academy-react-009-backup-context
technology: React Development
category: Backup & Recovery
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Backup and recovery drill for context management. Ensure backups run
  on schedule, retention is correct, and you can restore context windows and retrieval
  within the lab RTO.
objectives:
- Backup coverage for context management is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for context management.
  Leadership wants proof that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the assembled context.

    2. Write down what looks normal versus wrong or missing for context management.

    3. Recall the core idea: context windows and retrieval. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for context management.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the assembled context.

    2. Repair or run the backup job, then perform a controlled restore into a scratch
    location to prove it works.

    3. Verify the result — the right context fits the window.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-react-009-backup-context.conf`,
    then click Check Solution.'
