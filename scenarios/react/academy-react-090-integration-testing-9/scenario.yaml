title: Testing — Integration Lab
slug: academy-react-090-integration-testing-9
technology: react
category: Project
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: Complete the testing coding exercise in the browser IDE.


  ENVIRONMENT: FixitLab JavaScript/React practice IDE — edit solution.js, Run visible
  tests, then Check Solution.


  SYMPTOM / STARTING STATE: Coding challenge: testing. The stub in solution.js is
  incomplete so tests fail until you implement it.


  OBJECTIVE: Implement the required function so all visible and hidden tests pass.


  VERIFY: Check Solution passes all hidden tests.

  '
objectives:
- Implement the required function in solution.js
- Pass visible tests with Run
- Pass Check Solution (hidden tests)
initial_state: 'Coding challenge: testing. The stub in solution.js is incomplete so
  tests fail until you implement it.'
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: code changes break behavior
    with no safety net. This lab is about testing — unit tests, fixtures, and assertions.
    Read the objectives and the current state, and note precisely what looks wrong
    versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For testing problems the reliable method is:
    (1) reproduce/observe the failure, (2) narrow from the whole system down to the
    one component that owns the symptom, (3) change exactly one thing, (4) re-check.
    Configure credentials and networking, then drive one happy-path transaction end
    to end across both systems.'
- order: 3
  cost: 25
  content: WHICH TOOL — use the IDE Run button on visible tests first; read the failing
    assertion message carefully.
- order: 4
  cost: 40
  content: NARROW DOWN — implement the smallest change that satisfies one failing
    test, then re-run.
- order: 5
  cost: 60
  content: NEAR-SOLUTION — finish the function so all visible tests pass, then Check
    Solution.
cross_technology: true
summary: Complete the testing — integration lab react lab and verify success with
  the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic react literacy
tags:
- do
- hands-on
- react
linked_tutorial: react-fundamentals
what_you_will_learn:
- testing is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
environment:
  nodes:
  - role: primary
    os: FixitLab React application
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline lab environment
  pre_installed:
  - bash
  - coreutils
  - journalctl
  - react
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Testing — Integration Lab
  description: Implement the testing exercise in the browser IDE and pass all tests.
  background: 'This react lab teaches systematic troubleshooting: observe, hypothesize,
    change, verify.'
  validation:
    type: script
    script: hidden_tests
    error_message: Hidden tests still failing — keep iterating in the IDE.
solution:
  summary: Implement the function so visible and hidden tests pass in the coding IDE.
  files_changed:
  - solution.js
  commands_run: []
  reference_docs: react-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx`` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
coding_mode: true
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: 'Implement shallowEqual(a, b) for plain objects (same keys + === values).

    Click Run to try it, then Check Solution to grade.

    '
  files:
  - path: solution.js
    content: "function shallowEqual(a, b) {\n  // TODO\n}\n"
    readonly: false
  visible_tests:
  - name: eq
    code: assert(shallowEqual({a:1}, {a:1}) === true);
  - name: neq
    code: assert(shallowEqual({a:1}, {a:2}) === false);
  hidden_tests:
  - name: keys
    code: assert(shallowEqual({a:1}, {a:1,b:2}) === false);
  - name: n
    code: assert(shallowEqual({v:9}, {v:9}) === true);
  timeout: 8
