title: Fix the Mutating useReducer Reducer
slug: react-fix-reducer-immutability
technology: react
category: Fix
description: 'CONTEXT: A team operating React frontends needs you to resolve `Fix the Mutating useReducer
  Reducer` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline React application with components, hooks, router,
  and build output. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: cartReducer(state, action) powers a shopping cart with useReducer, but the
  ADD_ITEM case calls state.items.push(...) and returns the same state object. Because the array is mutated
  in place and the state reference never changes, React''s bailout skips the re-render. Make the reducer
  pure. cartReducer(state, action) powers a shopping cart with useReducer, but the ADD_ITEM case calls
  state.items.push(...) and returns the same state object. Because the array is mutated in place and the
  state reference never changes, React''s bailout skips the re-render and the UI shows a stale cart. Make
  the reducer pure — return new objects/arrays instead of mutating the previous state.


  OBJECTIVE: See that the reducer mutates the previous state and returns the same reference; Return a
  brand-new state object with a new items array on every change; Keep the previous state untouched so
  React detects the update. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
