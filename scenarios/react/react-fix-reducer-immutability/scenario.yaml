initial_state: cartReducer(state, action) powers a shopping cart with useReducer, but the ADD_ITEM case
  calls state.items.push(...) and returns the same state object. Because the array is mutated in place
  and the state reference never changes, React's bailout skips the re-render. Make the reducer pure.
solution_explanation: 'React''s useReducer bails out of a re-render when the reducer returns the exact
  same object

  reference it was given (Object.is(prev, next) === true). Calling state.items.push() mutates

  the existing array AND returns the same top-level object, so React sees no change. A pure

  reducer never touches the incoming state: it builds a NEW object ({ ...state, items: [...] })

  with a NEW array. Here ADD_ITEM appends with [...state.items, item] (or increments quantity

  for an existing id), and REMOVE_ITEM uses filter — both produce fresh references, leaving the

  previous state object completely unchanged.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix cartReducer(state, action) so it is a PURE reducer for a useReducer cart.\nState\
    \ shape: { items: [{ id, name, qty }] }.\n  - ADD_ITEM (action.item = { id, name }): if an item with\
    \ that id already exists,\n    return state with that item's qty incremented by 1; otherwise append\
    \ { id, name, qty: 1 }.\n  - REMOVE_ITEM (action.id): return state without the item that has that\
    \ id.\n  - any unknown action type: return the state unchanged (same reference is fine here).\nThe\
    \ reducer must NEVER mutate the incoming state or its items array — always return new\nobjects/arrays\
    \ so React detects the change.\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function cartReducer(state, action) {\n  switch (action.type) {\n    case 'ADD_ITEM':\n\
      \      // BUG: mutates state.items in place and returns the SAME state object,\n      // so React's\
      \ bailout skips the re-render.\n      state.items.push({ id: action.item.id, name: action.item.name,\
      \ qty: 1 });\n      return state;\n    case 'REMOVE_ITEM':\n      // BUG: also mutates the existing\
      \ array.\n      const idx = state.items.findIndex((it) => it.id === action.id);\n      if (idx !==\
      \ -1) state.items.splice(idx, 1);\n      return state;\n    default:\n      return state;\n  }\n\
      }\n"
    readonly: false
  visible_tests:
  - name: adds a new item with qty 1
    code: 'const prev = { items: [] };

      const next = cartReducer(prev, { type: ''ADD_ITEM'', item: { id: ''a'', name: ''Apple'' } });

      assert(JSON.stringify(next.items) === JSON.stringify([{ id: ''a'', name: ''Apple'', qty: 1 }]),
      JSON.stringify(next.items));

      '
  - name: returns a new state reference
    code: 'const prev = { items: [] };

      const next = cartReducer(prev, { type: ''ADD_ITEM'', item: { id: ''a'', name: ''Apple'' } });

      assert(next !== prev, ''reducer returned the same state reference'');

      '
  hidden_tests:
  - name: does not mutate previous state
    code: 'const prev = { items: [] };

      cartReducer(prev, { type: ''ADD_ITEM'', item: { id: ''a'', name: ''Apple'' } });

      assert(prev.items.length === 0, ''previous state was mutated: '' + JSON.stringify(prev.items));

      '
  - name: existing id increments qty
    code: 'const prev = { items: [{ id: ''a'', name: ''Apple'', qty: 1 }] };

      const next = cartReducer(prev, { type: ''ADD_ITEM'', item: { id: ''a'', name: ''Apple'' } });

      assert(next.items.length === 1 && next.items[0].qty === 2, JSON.stringify(next.items));

      '
  - name: increment does not mutate the old item
    code: 'const prev = { items: [{ id: ''a'', name: ''Apple'', qty: 1 }] };

      cartReducer(prev, { type: ''ADD_ITEM'', item: { id: ''a'', name: ''Apple'' } });

      assert(prev.items[0].qty === 1, ''old item object was mutated: '' + JSON.stringify(prev.items[0]));

      '
  - name: new items array reference on add
    code: 'const prev = { items: [{ id: ''a'', name: ''Apple'', qty: 1 }] };

      const next = cartReducer(prev, { type: ''ADD_ITEM'', item: { id: ''b'', name: ''Banana'' } });

      assert(next.items !== prev.items, ''items array reference was reused'');

      '
  - name: remove filters the item out without mutating
    code: 'const prev = { items: [{ id: ''a'', name: ''Apple'', qty: 1 }, { id: ''b'', name: ''Banana'',
      qty: 1 }] };

      const next = cartReducer(prev, { type: ''REMOVE_ITEM'', id: ''a'' });

      assert(next.items.length === 1 && next.items[0].id === ''b'', JSON.stringify(next.items));

      assert(prev.items.length === 2, ''previous state was mutated on remove'');

      '
  - name: unknown action returns same reference
    code: 'const prev = { items: [{ id: ''a'', name: ''Apple'', qty: 1 }] };

      const next = cartReducer(prev, { type: ''NOPE'' });

      assert(next === prev, ''unknown action should return the same state reference'');

      '
  timeout: 8
