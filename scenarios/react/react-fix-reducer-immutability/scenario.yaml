title: Fix the Mutating useReducer Reducer
slug: react-fix-reducer-immutability
technology: react
category: Fix
description: 'CONTEXT: A team operating React frontends has raised a ticket for `Fix the Mutating useReducer
  Reducer`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline React application. The architecture is a single
  lab-primary node exposing components, hooks, router, and build output; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: cartReducer(state, action) powers a shopping cart with useReducer, but the
  ADD_ITEM case calls state.items.push(...) and returns the same state object. Because the array is mutated
  in place and the state reference never changes, React''s bailout skips the re-render. Make the reducer
  pure.


  OBJECTIVE: See that the reducer mutates the previous state and returns the same reference; Return a
  brand-new state object with a new items array on every change; Keep the previous state untouched so
  React detects the update. Acceptance criteria: the change is minimal and reversible, and success means
  all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant components, hooks, router, and build output), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
