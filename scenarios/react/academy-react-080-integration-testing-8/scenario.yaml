title: 'React Development: Testing — Integration Lab'
slug: academy-react-080-integration-testing-8
technology: React Development
category: Cross-Technology
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Integration lab: connect testing with an adjacent platform in the React
  Development stack. Validate authentication, data handoff, and failure behavior for
  unit tests, fixtures, and assertions.'
objectives:
- testing is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for testing.
  Downstream consumers are waiting on this integration path.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — test files and `pytest -q` output.

    2. Write down what looks normal versus wrong or missing for testing.

    3. Recall the core idea: unit tests, fixtures, and assertions. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for testing.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — test files and `pytest -q` output.

    2. Configure credentials and networking, then drive one happy-path transaction
    end to end across both systems.

    3. Verify the result — tests cover the change and pass.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-react-080-integration-testing-8.conf`,
    then click Check Solution.'
cross_technology: true
