initial_state: A todo app renders a derived "visible" list from all todos based on a status filter, a
  search query, and a sort order. Implement selectVisibleTodos as a pure selector that filters, searches,
  and sorts without mutating the input array.
solution_explanation: 'In React, anything you can compute from state should be derived at render time,
  not stored —

  and a "selector" (a pure function of state) is the clean way to do it. selectVisibleTodos takes

  the full todos array plus the UI options and returns a fresh array. It applies the status filter

  (active = not done, completed = done), then a case-insensitive substring search on the title,

  then sorts. The subtle bug everyone hits: Array.prototype.sort mutates in place, so you must sort

  a COPY ([...todos].sort(...)) or the React state array gets reordered under you, breaking the

  next render. The ''created'' sort is ascending by createdAt; ''alpha'' is a localeCompare on title;

  ties keep input order because sort is stable in modern engines and we never reorder equal keys.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: implement
  instructions: "Implement selectVisibleTodos(todos, options) where each todo is\n  { id, title, done,\
    \ createdAt }   // createdAt is a number (epoch ms)\nand options = { filter, query, sort } with defaults\
    \ applied when missing:\n  filter: 'all' (default) | 'active' (done === false) | 'completed' (done\
    \ === true)\n  query:  '' (default) — case-insensitive substring match against title; '' matches everything\n\
    \  sort:   'created' (default, ascending by createdAt) | 'alpha' (A→Z by title, localeCompare)\nApply\
    \ filter, then search, then sort. Return a NEW array — never mutate the input todos array\nor its\
    \ sort order. This is a pure selector: no DOM, no state, no side effects.\nClick Run to try it, then\
    \ Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function selectVisibleTodos(todos, options) {\n  // TODO: derive the visible list.\n  //\
      \ options = { filter, query, sort } — apply defaults, then filter -> search -> sort.\n  // Must\
      \ NOT mutate `todos` (including its order).\n  return todos;\n}\n"
    readonly: false
  visible_tests:
  - name: defaults return all todos sorted by createdAt asc
    code: "const todos = [\n  { id: 2, title: 'Banana', done: false, createdAt: 200 },\n  { id: 1, title:\
      \ 'Apple', done: true, createdAt: 100 },\n];\nconst out = selectVisibleTodos(todos, {});\nassert(out.map(t\
      \ => t.id).join(',') === '1,2', out.map(t => t.id).join(','));\n"
  - name: does not mutate the input array order
    code: "const todos = [\n  { id: 2, title: 'Banana', done: false, createdAt: 200 },\n  { id: 1, title:\
      \ 'Apple', done: true, createdAt: 100 },\n];\nselectVisibleTodos(todos, { sort: 'created' });\n\
      assert(todos[0].id === 2 && todos[1].id === 1, 'input array was reordered: ' + todos.map(t => t.id).join(','));\n"
  hidden_tests:
  - name: active filter keeps only not-done
    code: "const todos = [\n  { id: 1, title: 'A', done: true, createdAt: 1 },\n  { id: 2, title: 'B',\
      \ done: false, createdAt: 2 },\n  { id: 3, title: 'C', done: false, createdAt: 3 },\n];\nconst out\
      \ = selectVisibleTodos(todos, { filter: 'active' });\nassert(out.map(t => t.id).join(',') === '2,3',\
      \ out.map(t => t.id).join(','));\n"
  - name: completed filter keeps only done
    code: "const todos = [\n  { id: 1, title: 'A', done: true, createdAt: 1 },\n  { id: 2, title: 'B',\
      \ done: false, createdAt: 2 },\n];\nconst out = selectVisibleTodos(todos, { filter: 'completed'\
      \ });\nassert(out.length === 1 && out[0].id === 1, JSON.stringify(out.map(t => t.id)));\n"
  - name: query matches case-insensitively as a substring
    code: "const todos = [\n  { id: 1, title: 'Buy Milk', done: false, createdAt: 1 },\n  { id: 2, title:\
      \ 'Walk dog', done: false, createdAt: 2 },\n  { id: 3, title: 'milk tea', done: false, createdAt:\
      \ 3 },\n];\nconst out = selectVisibleTodos(todos, { query: 'MILK' });\nassert(out.map(t => t.id).join(',')\
      \ === '1,3', out.map(t => t.id).join(','));\n"
  - name: empty query matches everything
    code: "const todos = [\n  { id: 1, title: 'A', done: false, createdAt: 1 },\n  { id: 2, title: 'B',\
      \ done: false, createdAt: 2 },\n];\nconst out = selectVisibleTodos(todos, { query: '' });\nassert(out.length\
      \ === 2, JSON.stringify(out.map(t => t.id)));\n"
  - name: alpha sort orders by title A to Z
    code: "const todos = [\n  { id: 1, title: 'Cherry', done: false, createdAt: 1 },\n  { id: 2, title:\
      \ 'apple', done: false, createdAt: 2 },\n  { id: 3, title: 'Banana', done: false, createdAt: 3 },\n\
      ];\nconst out = selectVisibleTodos(todos, { sort: 'alpha' });\nassert(out.map(t => t.title).join(',')\
      \ === 'apple,Banana,Cherry', out.map(t => t.title).join(','));\n"
  - name: filter search and sort compose together
    code: "const todos = [\n  { id: 1, title: 'Read book', done: false, createdAt: 50 },\n  { id: 2, title:\
      \ 'Read paper', done: true, createdAt: 10 },\n  { id: 3, title: 'Read mail', done: false, createdAt:\
      \ 30 },\n  { id: 4, title: 'Cook', done: false, createdAt: 20 },\n];\nconst out = selectVisibleTodos(todos,\
      \ { filter: 'active', query: 'read', sort: 'created' });\nassert(out.map(t => t.id).join(',') ===\
      \ '3,1', out.map(t => t.id).join(','));\n"
  - name: returns a new array reference
    code: 'const todos = [{ id: 1, title: ''A'', done: false, createdAt: 1 }];

      const out = selectVisibleTodos(todos, {});

      assert(out !== todos, ''selector returned the same array reference'');

      '
  - name: no options argument uses all defaults
    code: "const todos = [\n  { id: 2, title: 'B', done: false, createdAt: 20 },\n  { id: 1, title: 'A',\
      \ done: true, createdAt: 10 },\n];\nconst out = selectVisibleTodos(todos);\nassert(out.map(t =>\
      \ t.id).join(',') === '1,2', out.map(t => t.id).join(','));\n"
  timeout: 8
