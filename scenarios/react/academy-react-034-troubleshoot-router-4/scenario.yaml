    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: navigation and guards work as intended. Document the
    fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-react-034-troubleshoot-router-4.conf`,
