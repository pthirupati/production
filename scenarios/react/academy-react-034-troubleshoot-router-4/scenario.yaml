    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: routes match URLs and preserve expected navigation state.
    Document the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-react-034-troubleshoot-router-4.conf`,
