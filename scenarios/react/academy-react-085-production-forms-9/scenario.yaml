simulation_type: react
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: Complete the forms coding exercise in the browser IDE.


  ENVIRONMENT: FixitLab JavaScript/React practice IDE — edit solution.js, Run visible
  tests, then Check Solution.


  SYMPTOM / STARTING STATE: Coding challenge: forms. The stub in solution.js is incomplete
  so tests fail until you implement it.


  OBJECTIVE: Implement the required function so all visible and hidden tests pass.


  VERIFY: Check Solution passes all hidden tests.

  '
objectives:
- Implement the required function in solution.js
- Pass visible tests with Run
- Pass Check Solution (hidden tests)
initial_state: 'Coding challenge: forms. The stub in solution.js is incomplete so
  tests fail until you implement it.'
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: inputs do not update or
    invalid data submits. This lab is about forms — controlled inputs, validation,
    and submission. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For forms problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one
    component that owns the symptom, (3) change exactly one thing, (4) re-check. Apply
    production standards for forms: resource limits, monitoring, access controls,
    and a written rollback step.'
- order: 3
  cost: 25
  content: WHICH TOOL — use the IDE Run button on visible tests first; read the failing
    assertion message carefully.
- order: 4
  cost: 40
  content: NARROW DOWN — implement the smallest change that satisfies one failing
    test, then re-run.
- order: 5
  cost: 60
  content: NEAR-SOLUTION — finish the function so all visible tests pass, then Check
    Solution.
summary: Complete the forms — production lab react lab and verify success with the
  checker
estimated_minutes: 20
xp_reward: 100
