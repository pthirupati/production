description: 'Security review: harden web accessibility on this React Development
  system. Close unsafe defaults, enforce least privilege, and ensure ARIA roles, keyboard
  navigation, contrast, and screen-reader semantics cannot be abused — without breaking
  legitimate use.'
objectives:
- Unsafe defaults related to web accessibility are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around web accessibility.
  Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Baseline current exposure: axe/Lighthouse audits, tab order, and semantic
    landmarks. Note world-readable files, open ports, or excessive roles.'
- order: 2
  cost: 15
  content: Apply least privilege incrementally. Prefer explicit allows over broad
    wildcards.
- order: 3
  cost: 20
  content: Re-test legitimate workflows after hardening. Finish with `# FIXED-OK`
    in `/opt/fixitlab/academy/academy-react-056-security-accessibility-6.conf` and
    Check Solution.
