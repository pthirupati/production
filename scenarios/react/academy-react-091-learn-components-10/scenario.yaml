description: 'CONTEXT: A team operating React frontends needs you to resolve `react: React Components
  — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline React application with components, hooks, router,
  and build output. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The React application is online with a starter React components setup. Some
  pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus
  on observation. This beginner-friendly react lab introduces React components. You will explore props,
  state, composition, and rendering boundaries on the React application. Read the environment first, then
  follow the guided steps — no prior production experience required.


  OBJECTIVE: Understand how React components work in this lab environment; Identify the main status and
  configuration signals for React components; Confirm you can read the current state confidently before
  changing anything. Success means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how React components work in this lab environment
- Identify the main status and configuration signals for React components
- Confirm you can read the current state confidently before changing anything
initial_state: The React application is online with a starter React components setup. Some pieces are
