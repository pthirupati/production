is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating Docker containers needs you to resolve `docker: Container Healthchecks
  — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around container healthchecks.
  Assume an auditor or pen test is next week — tighten controls with evidence. Security review: harden
  container healthchecks on this docker system. Close unsafe defaults, enforce least privilege, and ensure
  HEALTHCHECK directives, readiness, and restart policy cannot be abused — without breaking legitimate
  use.


  OBJECTIVE: Unsafe defaults related to container healthchecks are removed or constrained; Access follows
  least privilege and is auditable; Security checks pass without breaking required functionality. Success
  means `systemctl is-active docker` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to container healthchecks are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around container healthchecks. Assume
  an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker ps` health column and `docker inspect` health log.

    2. Write down what looks normal versus wrong or missing for container healthchecks.

    3. Recall the core idea: HEALTHCHECK directives, readiness, and restart policy. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status docker` — note Active/Failed and the last log lines.

    2. Read `journalctl -u docker -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `docker ps` health column and `docker inspect` health log.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — the container reports healthy and unhealthy ones are restarted.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
