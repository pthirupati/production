description: Containers can't reach corporate services because Docker's default bridge subnet overlaps
  the corp network. Move Docker's address pool and confirm the config is corrected.
initial_state: A host whose Docker bridge subnet conflicts with the corporate network range, breaking
  routing.
objectives:
- Confirm the subnet conflict
- Reconfigure Docker's address pool
- Verify the config is corrected
hints:
