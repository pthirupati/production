description: Container operations with Docker Compose. The application's services are defined in the compose
  file, but the stack is not running, so there are no live containers serving traffic. Bring the stack
  up and confirm the containers are healthy. Verify with `docker ps`.
objectives:
- The Docker Compose stack is running
- docker ps shows the application containers in the Up state
- The containerised service is reachable again
initial_state: The Docker Compose stack is defined but not running — `docker ps` shows no application
  containers Up.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker ps` (likely empty) and review the compose file in the app directory.

    2. Write down what looks normal versus wrong or missing.

    3. Form one hypothesis about the root cause before you change anything.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture command output before the change so you can prove it worked afterward.'
- order: 3
  cost: 20
  content: 'Guided walkthrough:

    1. Re-check the current state — Check what is running: `docker ps` (likely empty) and review the compose
    file in the app directory.

    2. You do not need to rebuild images — the stack simply needs to be started in the background.

    3. Verify the result — Run `docker compose up -d` from the app directory, confirm with `docker ps`,
    then Check Solution.

    4. Click Check Solution once every objective is met.'
