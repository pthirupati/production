description: 'CONTEXT: A team operating Docker containers needs you to resolve `docker: Docker Compose
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Docker host is healthy enough for scheduled work on Docker Compose. Complete
  the maintenance task without unnecessary downtime. Day-2 operations: perform a routine Docker Compose
  task safely in docker. Follow change control — inspect, change, verify — while working with multi-service
  stacks, networks, volumes, and dependency order.


  OBJECTIVE: Day-2 Docker Compose work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 Docker Compose work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The Docker host is healthy enough for scheduled work on Docker Compose. Complete the maintenance
  task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker compose config`, `docker compose ps`, and service logs.

    2. Write down what looks normal versus wrong or missing for Docker Compose.

    3. Recall the core idea: multi-service stacks, networks, volumes, and dependency order. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `docker compose config`, `docker compose ps`, and service logs.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — the stack is healthy end-to-end with persistent data where required.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
