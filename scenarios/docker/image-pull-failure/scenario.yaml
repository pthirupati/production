category: Build
description: 'CONTEXT: A team operating Docker containers needs you to resolve `Docker Image Pull Failure`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Docker host. `docker run` / `docker pull` fails for an image — the tag does
  not exist in the registry ("manifest unknown") or authentication is required and missing. Starting a
  container fails because the image cannot be pulled. The image name or tag is wrong (manifest unknown),
  or the registry/credentials are misconfigured, so docker cannot fetch the image. Identify the exact
  pull error and correct the reference (or auth) so the image pulls and the container runs.


  OBJECTIVE: Reproduce the pull failure and read the exact error; Identify the wrong image name/tag or
  missing registry auth; Pull the corrected image and run the container successfully. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
initial_state: Docker host. `docker run` / `docker pull` fails for an image — the tag does not exist in
