category: Build
description: 'CONTEXT: A team operating Docker containers needs you to resolve `Docker Container Exited`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Docker host. A container is in Exited state instead of Up — its main process
  terminated shortly after start. `docker ps -a` shows a non-zero (or zero) exit code. A container that
  should be running has exited immediately and shows status Exited. The container''s main process either
  errored on startup, finished and returned, or hit a bad command/config. Inspect why it exited, fix the
  cause, and restart it so it stays Up.


  OBJECTIVE: Find the exited container and its exit code; Read the container logs to learn why it stopped;
  Fix the cause and restart the container so it stays running. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
