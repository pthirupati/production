description: Service operations lab. The `docker` systemd unit is **failed/inactive** on this host — a
  realistic fault for Automation Practice workflows that depend on it. Diagnose with `systemctl status
  docker` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active docker`.
objectives:
- The `docker` service is active (running)
- '`systemctl is-active docker` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `docker` service is not running (`systemctl is-active docker` → inactive/failed). Dependent
  Automation Practice tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker logs`, `docker inspect` LogConfig, and daemon.json.

    2. Write down what looks normal versus wrong or missing for container logs.

    3. Recall the core idea: log drivers, rotation, and stdout/stderr capture. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for container logs.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `docker logs`, `docker inspect` LogConfig, and daemon.json.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — logs are captured and rotation caps disk usage.

    4. Click Check Solution once `systemctl is-active docker` returns active.'
