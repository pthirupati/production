title: Container Not on Application Network
slug: sim-docker-network-connect
technology: docker
category: Build
difficulty: medium
lab_mode: simulation
simulation_type: docker
time_limit: 900
max_score: 100
jira_priority: Medium
is_free: false
description: 'CONTEXT: A team operating Docker containers needs you to resolve `Container Not on Application
  Network` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Docker host running an app container and its dependency (e.g. a database)
  on different networks. The app can''t reach the dependency by name; connections fail with name-resolution
  or connection errors. Two containers that need to talk to each other can''t resolve or reach one another
  because they are not on the same user-defined Docker network. On the default bridge, DNS-based service
  discovery doesn''t work; on separate networks, there''s no connectivity at all. Put both containers
  on a shared user-defined network so they can communicate by name.


  OBJECTIVE: Confirm the containers cannot reach each other across networks; Identify which networks each
  container is attached to; Attach both to a shared user-defined network and verify name-based connectivity.
  Success means `systemctl is-active docker` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the containers cannot reach each other across networks
- Identify which networks each container is attached to
- Attach both to a shared user-defined network and verify name-based connectivity
initial_state: Docker host running an app container and its dependency (e.g. a database) on different
  networks. The app can't reach the dependency by name; connections fail with name-resolution or connection
  errors.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status docker` and `journalctl -u docker -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status docker` — note Active/Failed and the last log lines.

    2. Read `journalctl -u docker -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart docker` and confirm `systemctl is-active docker` succeeds.


    WHY: the grader checks real service state, not marker files.'
