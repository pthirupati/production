description: 'CONTEXT: A team operating Docker containers needs you to resolve `docker: Images And Layers
  — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Docker host is online with a starter images and layers setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
  This beginner-friendly docker lab introduces images and layers. You will explore image tags, layer caching,
  dangling images, and registry pulls on the Docker host. Read the environment first, then follow the
  guided steps — no prior production experience required.


  OBJECTIVE: Understand how images and layers work in this lab environment; Identify the main status and
  configuration signals for images and layers; Confirm you can read the current state confidently before
  changing anything. Success means `systemctl is-active docker` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how images and layers work in this lab environment
- Identify the main status and configuration signals for images and layers
- Confirm you can read the current state confidently before changing anything
initial_state: The Docker host is online with a starter images and layers setup. Some pieces are intentionally
  incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker images`, `docker history`, and `docker system df`.

    2. Write down what looks normal versus wrong or missing for images and layers.

    3. Recall the core idea: image tags, layer caching, dangling images, and registry pulls. Form one
    hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status docker` — note Active/Failed and the last log lines.

    2. Read `journalctl -u docker -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `docker images`, `docker history`, and `docker system df`.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — the intended image digest/tag is running and reclaimable waste is cleaned safely.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
