description: 'CONTEXT: A team operating Docker containers needs you to resolve `docker: Docker Volumes
  — Troubleshooting Drill` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Docker host is degraded. Containers start but lose data, hit permission
  denied on mounts, or disk fills from anonymous volumes. Recent changes may exist around Docker volumes,
  but do not restart blindly — gather evidence first. Production alert: containers start but lose data,
  hit permission denied on mounts, or disk fills from anonymous volumes. You are on call for docker and
  must troubleshoot Docker volumes methodically — triage symptoms, isolate root cause, apply the smallest
  safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: containers start but lose data, hit permission denied on mounts,
  or disk fills from anonymous volumes; Root cause is isolated with evidence, not guesswork; Service behavior
  returns to normal after the fix. Success means `systemctl is-active docker` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: containers start but lose data, hit permission denied on mounts, or
  disk fills from anonymous volumes'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Docker host is degraded. Containers start but lose data, hit permission denied on mounts,
  or disk fills from anonymous volumes. Recent changes may exist around Docker volumes, but do not restart
  blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker volume ls`, `docker inspect` mount sections, and `docker compose
    config`.

    2. Write down what looks normal versus wrong or missing for Docker volumes.

    3. Recall the core idea: named volumes, bind mounts, permissions, and data persistence across restarts.
    Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status docker` — note Active/Failed and the last log lines.

    2. Read `journalctl -u docker -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `docker volume ls`, `docker inspect` mount sections, and `docker compose
    config`.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — data persists across container recreation and mount paths are writable by the
    container user.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
