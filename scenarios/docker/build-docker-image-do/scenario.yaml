description: 'CONTEXT: A team operating Docker containers needs you to resolve `Build and Run Docker Image`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu host with Docker installed and a project directory containing application
  source. No image has been built for it yet. Build task: package a small application into a Docker image
  and run it. There is a project directory with source but no working image yet. Write/complete a Dockerfile,
  build a tagged image, and run a container, verifying the app responds on its published port.


  OBJECTIVE: Create or complete a Dockerfile for the application; Build a tagged image with docker build;
  Run a container and verify the app responds on the published port. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Create or complete a Dockerfile for the application
- Build a tagged image with docker build
- Run a container and verify the app responds on the published port
initial_state: Ubuntu host with Docker installed and a project directory containing application source.
  No image has been built for it yet.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
