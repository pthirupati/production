title: Resource Limits — Integration Lab
slug: academy-docker-080-integration-resource-limits-8
technology: docker
category: Build
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating Docker containers needs you to resolve `docker: Resource Limits
  — Integration Lab` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for resource limits.
  Downstream consumers are waiting on this integration path. Integration lab: connect resource limits
  with an adjacent platform in the docker stack. Validate authentication, data handoff, and failure behavior
  for CPU/memory limits, OOM, and reservations.


  OBJECTIVE: resource limits is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `systemctl
  is-active docker` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- resource limits is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for resource limits. Downstream consumers
  are waiting on this integration path.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker stats` and `docker inspect` HostConfig.

    2. Write down what looks normal versus wrong or missing for resource limits.

    3. Recall the core idea: CPU/memory limits, OOM, and reservations. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status docker` — note Active/Failed and the last log lines.

    2. Read `journalctl -u docker -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `docker stats` and `docker inspect` HostConfig.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — limits are enforced and the workload stays within budget.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
