title: 'Docker & Containers: Docker Volumes — Troubleshooting Drill'
slug: academy-docker-014-troubleshoot-volumes-2
technology: Docker & Containers
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: containers start but lose data, hit permission denied
  on mounts, or disk fills from anonymous volumes. You are on call for Docker & Containers
  and must troubleshoot Docker volumes methodically — triage symptoms, find root cause,
  apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: containers start but lose data, hit permission denied
  on mounts, or disk fills from anonymous volumes'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Docker host is degraded. Containers start but lose data, hit permission
  denied on mounts, or disk fills from anonymous volumes. Recent changes may exist
  around Docker volumes, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Triage: `docker volume ls`, `docker inspect` mount sections, and `docker
    compose config`. Capture timestamps, error messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: data persists across container recreation and mount paths
    are writable by the container user. Document the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-docker-014-troubleshoot-volumes-2.conf`,
    and rerun Check Solution.'
