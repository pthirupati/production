title: 'Docker → Kubernetes Migration: Compose Service Won''t'
slug: docker-compose-to-k8s-manifest-migration
technology: docker
category: Build
difficulty: medium
description: 'CONTEXT: A team operating Docker containers needs you to resolve `Docker → Kubernetes Migration:
  Compose Service Won''t` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A host with the original /opt/app/docker-compose.yml (the api service) and
  a

  half-converted /opt/app/k8s/deployment.yaml that is invalid Kubernetes

  (compose-only keys, a bind mount, no probes/limits). kubectl apply fails. CROSS-TECHNOLOGY task (Docker
  -> Kubernetes). The team is lifting the `api`

  service out of docker-compose and onto Kubernetes. A converted manifest was

  generated at /opt/app/k8s/deployment.yaml, but it is wrong: it still references

  the compose-only `container_name`, uses a host bind-mount path that does not

  exist in-cluster, and sets no resource requests — so `kubectl apply` is rejected

  and the Deployment never schedules. Fix the manifest so the compose service

  becomes a valid Kubernetes Deployment.


  OBJECTIVE: Diff the compose service against the generated Deployment to find the invalid/compose-only
  fields; Rewrite /opt/app/k8s/deployment.yaml as a valid Deployment (proper image, container port, a
  volume the cluster can satisfy, resource requests); Confirm the manifest is corrected so `kubectl apply
  -f deployment.yaml` would be accepted. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A host with the original /opt/app/docker-compose.yml (the api service) and a

  half-converted /opt/app/k8s/deployment.yaml that is invalid Kubernetes

  (compose-only keys, a bind mount, no probes/limits). kubectl apply fails.

  '
objectives:
- Diff the compose service against the generated Deployment to find the invalid/compose-only fields
- Rewrite /opt/app/k8s/deployment.yaml as a valid Deployment (proper image, container port, a volume the
  cluster can satisfy, resource requests)
- Confirm the manifest is corrected so `kubectl apply -f deployment.yaml` would be accepted
lab_mode: simulation
simulation_type: generic
cross_technology: true
time_limit: 1500
max_score: 100
is_free: false
jira_priority: High
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
