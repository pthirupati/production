jira_priority: Medium
description: 'Production alert: containers start but lose data, hit permission denied
  on mounts, or disk fills from anonymous volumes. You are on call for Docker & Containers
  and must troubleshoot Docker volumes methodically — triage symptoms, isolate root
  cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: containers start but lose data, hit permission denied
  on mounts, or disk fills from anonymous volumes'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Docker host is degraded. Containers start but lose data, hit permission
  denied on mounts, or disk fills from anonymous volumes. Recent changes may exist
  around Docker volumes, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker volume ls`, `docker inspect` mount sections,
    and `docker compose config`.

    2. Write down what looks normal versus wrong or missing for Docker volumes.

    3. Recall the core idea: named volumes, bind mounts, permissions, and data persistence
    across restarts. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Docker volumes.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `docker volume ls`, `docker inspect` mount sections,
    and `docker compose config`.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — data persists across container recreation and mount paths
    are writable by the container user.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-docker-024-troubleshoot-volumes-3.conf`,
    then click Check Solution.'
