description: 'CONTEXT: A team operating Docker containers has raised a ticket for `Compose Service Starts
  Before Dependency`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host. The architecture is a single lab-primary
  node exposing docker CLI, images, containers, and compose files; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A compose stack with broken startup ordering.


  OBJECTIVE: Confirm the issue: App connects before DB is ready; Apply the documented fix in /opt/app/docker-compose.yml;
  Verify the configuration is corrected. Acceptance criteria: the change is minimal and reversible, and
  success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant docker CLI, images, containers, and compose files), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A compose stack with broken startup ordering.
objectives:
- 'Confirm the issue: App connects before DB is ready'
- Apply the documented fix in /opt/app/docker-compose.yml
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: compose service starts before dependency is
    not behaving as the scenario objectives require. This lab is about compose service starts before dependency
    — how compose service starts before dependency behaves in a Docker containers environment. Read the
    objectives and the current state, and note precisely what looks wrong versus healthy before you form
    any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For compose service starts before dependency problems the reliable
    method is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Create the smallest working slice
    of compose service starts before dependency first, validate it, then add the remaining pieces one
    at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Identify the exited/unhealthy container and read its logs.

    2. Inspect the image, env vars, and volume mounts (`docker inspect`).

    3. Compare container state to the scenario objectives.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix the Dockerfile, compose file, or runtime config.

    2. Rebuild/restart the container.

    3. Confirm `bash check.sh` succeeds.


    WHY: Docker labs grade real container state.'
