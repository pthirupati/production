description: Container operations with Docker Compose. The application's services are defined in the compose
  file, but the stack is not running, so there are no live containers serving traffic. Bring the stack
  up and confirm the containers are healthy. Verify with `docker ps`.
objectives:
- The Docker Compose stack is running
- docker ps shows the application containers in the Up state
- The containerised service is reachable again
initial_state: The Docker Compose stack is defined but not running — `docker ps` shows no application
  containers Up.
hints:
- order: 1
  cost: 10
  content: 'Check what is running: `docker ps` (likely empty) and review the compose file in the app directory.'
- order: 2
  cost: 15
  content: You do not need to rebuild images — the stack simply needs to be started in the background.
- order: 3
  cost: 20
  content: Run `docker compose up -d` from the app directory, confirm with `docker ps`, then Check Solution.
