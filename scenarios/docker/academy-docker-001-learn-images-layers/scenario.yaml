title: 'Docker & Containers: Images And Layers — Fundamentals Lab'
slug: academy-docker-001-learn-images-layers
technology: Docker & Containers
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: true
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly Docker & Containers lab introduces images and
  layers. You will explore image tags, layer caching, dangling images, and registry
  pulls on the Docker host. Read the environment first, then complete the guided steps
  — no prior production experience required.
objectives:
- Understand how images and layers work in this lab environment
- Identify the main status and configuration signals for images and layers
- Confirm you can read the current state confidently before changing anything
initial_state: The Docker host is online with a starter images and layers setup. Some
  pieces are intentionally incomplete so you can learn how the pieces fit together.
  Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: `docker images`, `docker history`, and `docker system
    df`. Write down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — image tags, layer caching, dangling images, and registry pulls.
    Make one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-docker-001-learn-images-layers.conf`, then click
    Check Solution.
