jira_priority: Low
description: 'CONTEXT: A team operating Docker containers needs you to resolve `docker: Dockerfiles —
  Build From Scratch` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Docker host is ready but Dockerfiles is not configured yet. Required tools
  may already be installed; your job is to create the configuration and bring the capability online. Build
  Dockerfiles from scratch in this docker lab. You start from a minimal environment and must produce a
  working configuration that demonstrates image layers, build context, ENTRYPOINT/CMD, and caching. Plan,
  implement, then prove it works.


  OBJECTIVE: A working Dockerfiles setup must exist by the end of this lab; Configuration should follow
  team conventions and be easy to audit; The result should pass validation without manual cleanup. Success
  means `systemctl is-active docker` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working Dockerfiles setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The Docker host is ready but Dockerfiles is not configured yet. Required tools may already
  be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker build` output, `docker history`, and the Dockerfile stages.

    2. Write down what looks normal versus wrong or missing for Dockerfiles.

    3. Recall the core idea: image layers, build context, ENTRYPOINT/CMD, and caching. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status docker` — note Active/Failed and the last log lines.

    2. Read `journalctl -u docker -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `docker build` output, `docker history`, and the Dockerfile stages.

    2. Create the smallest working slice of Dockerfiles first, validate it, then add the remaining pieces
    one at a time.

    3. Verify the result — the image builds reproducibly and the container starts as intended.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
