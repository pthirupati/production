dual_terminal: false
description: 'CONTEXT: A team operating Docker containers needs you to resolve `Signals Not Reaching Container
  Process` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Dockerfile using shell-form ENTRYPOINT. The app doesn''t receive SIGTERM
  because ENTRYPOINT uses shell form (PID 1 is sh).


  OBJECTIVE: Confirm the issue: Container ignores stop signals; Apply the documented fix in /opt/app/Dockerfile;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A Dockerfile using shell-form ENTRYPOINT.
objectives:
- 'Confirm the issue: Container ignores stop signals'
- Apply the documented fix in /opt/app/Dockerfile
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
