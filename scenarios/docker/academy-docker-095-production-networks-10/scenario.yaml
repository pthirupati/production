description: 'CONTEXT: A team operating Docker containers needs you to resolve `docker: Docker Networks
  — Production Readiness` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but Docker networks is not production ready —
  missing guardrails, runbooks, or capacity checks. Production readiness for Docker networks. Harden,
  document, and validate bridge/overlay networks, DNS names, published ports, and container-to-container
  connectivity so the change is safe to run during a maintenance window.


  OBJECTIVE: Day-2 Docker networks work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  docker` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 Docker networks work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but Docker networks is not production ready — missing guardrails,
  runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker network ls`, `docker network inspect`, and `docker port`.

    2. Write down what looks normal versus wrong or missing for Docker networks.

    3. Recall the core idea: bridge/overlay networks, DNS names, published ports, and container-to-container
    connectivity. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status docker` — note Active/Failed and the last log lines.

    2. Read `journalctl -u docker -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `docker network ls`, `docker network inspect`, and `docker port`.

    2. Apply production standards for Docker networks: resource limits, monitoring, access controls, and
    a written rollback step.

    3. Verify the result — expected containers share the correct network and connectivity works on the
    service port.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
