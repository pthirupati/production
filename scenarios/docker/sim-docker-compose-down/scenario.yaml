title: Docker Compose Stack Down
slug: sim-docker-compose-down
technology: Docker & Containers
category: Docker Compose
difficulty: medium
lab_mode: simulation
simulation_type: docker
time_limit: 900
max_score: 100
jira_priority: Medium
is_free: false
description: A multi-container application defined in docker-compose is not running — `docker compose
  ps` shows the services stopped (or one service repeatedly exits). Bring the stack up, and if a service
  won't stay healthy, diagnose it from its logs and fix the compose definition or its dependency ordering.
objectives:
- Inspect the compose project's current service status
- Bring the stack up and identify any service that fails to stay healthy
- Fix the failing service/config and confirm all services are Up
initial_state: Docker host with a docker-compose.yml defining several services. The stack is down (or
  a key service keeps exiting), so the application is unavailable.
hints:
- order: 1
  cost: 10
  content: 'Check status from the compose directory: `docker compose ps`. Bring everything up: `docker
    compose up -d`.'
- order: 2
  cost: 15
  content: 'If a service keeps restarting, read its logs: `docker compose logs <service>`. Common causes
    are a missing env var, a bad volume path, or starting before a dependency (DB) is ready.'
- order: 3
  cost: 20
  content: Fix the compose file (add the env/volume, or a `depends_on` with a healthcheck), then `docker
    compose up -d` again and confirm every service shows Up in `docker compose ps`.
