title: 'Docker → Linux: Compose Stack Must Run Under systemd'
slug: docker-handoff-systemd-managed-stack
technology: docker
category: Build
difficulty: medium
description: 'CONTEXT: A team operating Docker containers needs you to resolve `Docker → Linux: Compose
  Stack Must Run Under systemd` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Linux host with Docker installed and a compose stack under /opt/app. The

  `appstack` systemd unit that should manage the stack is failed and disabled. CROSS-TECHNOLOGY task (Docker
  -> Linux/systemd). An app team handed off a

  docker-compose stack that they used to start by hand. Operations needs it to be

  a managed boot service so it survives reboots and is supervised like any other

  daemon. A systemd unit `appstack` was created to run `docker compose up`, but it

  is failed and disabled — the unit has the wrong ordering/oneshot semantics so it

  exits immediately. Make the containerized stack a healthy, enabled systemd

  service.


  OBJECTIVE: Confirm the appstack service is failed/disabled and the stack is not supervised; Correct
  the unit so it manages `docker compose up -d` correctly (ordering after docker, Type/RemainAfterExit);
  Enable and start appstack; verify the service is active. Success means `systemctl is-active appstack`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A Linux host with Docker installed and a compose stack under /opt/app. The

  `appstack` systemd unit that should manage the stack is failed and disabled.

  '
objectives:
- Confirm the appstack service is failed/disabled and the stack is not supervised
- Correct the unit so it manages `docker compose up -d` correctly (ordering after docker, Type/RemainAfterExit)
- Enable and start appstack; verify the service is active
lab_mode: simulation
simulation_type: generic
cross_technology: true
time_limit: 1200
max_score: 100
is_free: false
jira_priority: High
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status appstack` and `journalctl -u appstack -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status appstack` — note Active/Failed and the last log lines.

    2. Read `journalctl -u appstack -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart appstack` and confirm `systemctl is-active appstack` succeeds.


    WHY: the grader checks real service state, not marker files.'
summary: 'Complete the docker → linux: compose stack must run under systemd docker lab and verify success
