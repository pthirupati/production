title: Docker Socket Proxy Down
slug: docker-docker-socket-proxy-down
technology: docker
category: Build
difficulty: medium
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: 'CONTEXT: A team operating Docker containers needs you to resolve `Docker Socket Proxy Down`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A host where the docker-socket-proxy service is failed. A hardened socket
  proxy in front of dockerd is down, breaking tooling.


  OBJECTIVE: Confirm docker-socket-proxy is down (Tools can''t reach the proxied socket); Resolve the
  cause and start docker-socket-proxy; Verify docker-socket-proxy is active. Success means `systemctl
  is-active docker-socket-proxy` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A host where the docker-socket-proxy service is failed.
objectives:
- Confirm docker-socket-proxy is down (Tools can't reach the proxied socket)
- Resolve the cause and start docker-socket-proxy
- Verify docker-socket-proxy is active
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status docker-socket-proxy` and `journalctl -u docker-socket-proxy
    -n 50 --no-pager` before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status docker-socket-proxy` — note Active/Failed and the last log lines.

    2. Read `journalctl -u docker-socket-proxy -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart docker-socket-proxy` and confirm `systemctl is-active docker-socket-proxy`
    succeeds.


    WHY: the grader checks real service state, not marker files.'
summary: Complete the docker socket proxy down docker lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
