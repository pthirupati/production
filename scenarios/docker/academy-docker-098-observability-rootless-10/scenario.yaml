description: 'CONTEXT: A team operating Docker containers needs you to resolve `docker: Rootless Docker
  — Observability Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Docker host with docker CLI, images, containers,
  and compose files. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The system runs, but rootless Docker lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality. Observability task: make rootless Docker visible in logs,
  metrics, or traces. On-call should answer ''what is broken?'' quickly using signals from user namespaces,
  subuid/subgid, and rootless daemon.


  OBJECTIVE: Day-2 rootless Docker work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  docker` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 rootless Docker work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but rootless Docker lacks useful telemetry. Dashboards/alerts are blank
  or noisy — improve signal quality.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `docker info` security options and `id`.

    2. Write down what looks normal versus wrong or missing for rootless Docker.

    3. Recall the core idea: user namespaces, subuid/subgid, and rootless daemon. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status docker` — note Active/Failed and the last log lines.

    2. Read `journalctl -u docker -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `docker info` security options and `id`.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a sensible threshold.

    3. Verify the result — workloads run rootless with correct ownership.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
