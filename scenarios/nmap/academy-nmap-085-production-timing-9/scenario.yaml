  content: 'Diagnostic steps:

    1. Gather evidence with `-T` templates and timing flags.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `-T` templates and timing flags.

    2. Apply production standards for scan timing: resource limits, monitoring, access controls, and a
