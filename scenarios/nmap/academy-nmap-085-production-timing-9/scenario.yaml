description: 'CONTEXT: A team operating network scanning needs you to resolve `nmap: Scan Timing — Production
  Readiness` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but scan timing is not production ready — missing
  guardrails, runbooks, or capacity checks. Production readiness for scan timing. Harden, document, and
  validate timing templates and rate control so the change is safe to run during a maintenance window.


  OBJECTIVE: Day-2 scan timing work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
