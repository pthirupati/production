  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nmap --traceroute`.

    2. Write down what looks normal versus wrong or missing for traceroute.

    3. Recall the core idea: path discovery and hops. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Changes are verified with before/after checks

    2. The system remains stable for dependent teams'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `nmap --traceroute`.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a sensible threshold.

    3. Verify the result — the path/hops are mapped.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
