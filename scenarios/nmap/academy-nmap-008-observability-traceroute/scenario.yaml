description: 'CONTEXT: A team operating network scanning needs you to resolve `nmap: Traceroute — Observability
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The system runs, but traceroute lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality. Observability task: make traceroute visible in logs, metrics,
  or traces. On-call should answer ''what is broken?'' quickly using signals from path discovery and hops.


  OBJECTIVE: Day-2 traceroute work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 traceroute work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
