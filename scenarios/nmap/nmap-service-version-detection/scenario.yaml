title: Detect the web server software and version
slug: nmap-service-version-detection
category: Fix
description: 'CONTEXT: A team operating network scanning needs you to resolve `Detect the web server software
  and version` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: web01:80 is known to be open but its service is reported only as the generic
  "http". A version-detection scan is required to reveal the underlying server product and version. A
  vulnerability report needs the exact HTTP server product and version running on web01 (10.10.10.10)
  port 80. A plain port scan only says "http" — use Nmap service/version detection to read the actual
  banner.


  OBJECTIVE: Open the Nmap simulator from the lab toolbar (Open Nmap); Run service/version detection against
  web01 port 80 (nmap -sV -p 80 10.10.10.10); Identify the HTTP server software (nginx) and its version.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
lab_mode: simulation
simulation_type: nmap
technology: nmap
jira_priority: Medium
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
