title: Detect the web server software and version
slug: nmap-service-version-detection
category: Nmap Network Scanning
description: A vulnerability report needs the exact HTTP server product and version running on web01
  (10.10.10.10) port 80. A plain port scan only says "http" — use Nmap service/version detection to
  read the actual banner.
difficulty: medium
lab_mode: simulation
simulation_type: nmap
technology: nmap
jira_priority: Medium
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Open the Nmap simulator from the lab toolbar (Open Nmap)
- Run service/version detection against web01 port 80 (nmap -sV -p 80 10.10.10.10)
- Identify the HTTP server software (nginx) and its version
initial_state: web01:80 is known to be open but its service is reported only as the generic "http". A
  version-detection scan is required to reveal the underlying server product and version.
hints:
- order: 1
  cost: 10
  content: A normal scan only maps a port to a default service name. Add the -sV flag to perform
    service/version detection (banner grabbing), e.g. nmap -sV -p 80 10.10.10.10.
- order: 2
  cost: 15
  content: Combine -sV with -p 80 to target just the HTTP port for a fast, focused result. The
    Discovered Hosts panel will then show the product and version next to the port.
- order: 3
  cost: 20
  content: The goal is met when port 80 on web01 reports a concrete web-server version string (the
    product is nginx). A plain scan without -sV will not satisfy this.
