title: Fingerprint the operating system of an unknown host
slug: nmap-os-fingerprint
category: Fix
description: 'CONTEXT: A team operating network scanning needs you to resolve `Fingerprint the operating
  system of an unknown host` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: win-app01 (10.10.10.30) responds to scans but its OS is unknown. OS fingerprinting
  needs raw packets, which require root — an unprivileged -O scan will skip detection. An unidentified
  server win-app01 (10.10.10.30) is exposing several services. Asset management needs to know what operating
  system it runs. Use Nmap OS detection to fingerprint it.


  OBJECTIVE: Open the Nmap simulator from the lab toolbar (Open Nmap); Run OS detection against win-app01
  (10.10.10.30) with privileges (sudo nmap -O 10.10.10.30); Identify the host''s operating system family
  (Windows). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
