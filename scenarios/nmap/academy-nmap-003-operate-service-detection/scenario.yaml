description: 'CONTEXT: A team operating network scanning needs you to resolve `nmap: Service/Version Detection
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The scanning lab is healthy enough for scheduled work on service/version detection.
  Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine service/version
  detection task safely in nmap. Follow change control — inspect, change, verify — while working with
  banner grabbing and version probes.


  OBJECTIVE: Day-2 service/version detection work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 service/version detection work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The scanning lab is healthy enough for scheduled work on service/version detection. Complete
  the maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nmap -sV`.

    2. Write down what looks normal versus wrong or missing for service/version detection.

    3. Recall the core idea: banner grabbing and version probes. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with `nmap -sV`.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `nmap -sV`.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — service versions are detected.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
