title: Discover live hosts on the subnet
slug: nmap-discover-live-hosts
category: Nmap Network Scanning
description: You are dropped onto an unfamiliar 10.10.10.0/24 lab network and asked to map which
  hosts are actually alive. Open the in-app Nmap simulator and run a host-discovery (ping) sweep
  to find every responsive host on the subnet.
difficulty: easy
lab_mode: simulation
simulation_type: nmap
technology: nmap
jira_priority: Low
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Open the Nmap simulator from the lab toolbar (Open Nmap)
- Run a host-discovery / ping sweep across 10.10.10.0/24 (nmap -sn 10.10.10.0/24)
- Discover the live hosts on the network (the gateway, web, database, and Windows app servers)
initial_state: The Nmap console starts with no hosts discovered. The /24 has several live hosts plus
  unassigned addresses; you must scan to learn which are up.
hints:
- order: 1
  cost: 10
  content: Open the Nmap simulator (toolbar -> Open Nmap). A ping/host-discovery sweep uses the -sn flag
    and skips port scanning, e.g. nmap -sn 10.10.10.0/24.
- order: 2
  cost: 15
  content: Scan the whole subnet at once with CIDR notation (10.10.10.0/24) rather than one IP at a time.
    The Discovered Hosts panel updates with each live host that answers.
- order: 3
  cost: 20
  content: You need the four primary servers responding to ICMP. Some addresses are unassigned (no
    reply) and a hardened bastion ignores ping — those are not required for this task.
