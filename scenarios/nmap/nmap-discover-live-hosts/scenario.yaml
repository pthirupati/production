title: Discover live hosts on the subnet
slug: nmap-discover-live-hosts
category: Fix
description: 'CONTEXT: A team operating network scanning needs you to resolve `Discover live hosts on
  the subnet` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Nmap console starts with no hosts discovered. The /24 has several live
  hosts plus unassigned addresses; you must scan to learn which are up. You are dropped onto an unfamiliar
  10.10.10.0/24 lab network and asked to map which hosts are actually alive. Open the in-app Nmap simulator
  and run a host-discovery (ping) sweep to find every responsive host on the subnet.


  OBJECTIVE: Open the Nmap simulator from the lab toolbar (Open Nmap); Run a host-discovery / ping sweep
  across 10.10.10.0/24 (nmap -sn 10.10.10.0/24); Discover the live hosts on the network (the gateway,
  web, database, and Windows app servers). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
