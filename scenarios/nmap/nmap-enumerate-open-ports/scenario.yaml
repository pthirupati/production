title: Enumerate open ports on the web server
slug: nmap-enumerate-open-ports
category: Fix
description: 'CONTEXT: A team operating network scanning needs you to resolve `Enumerate open ports on
  the web server` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: web01 (10.10.10.10) is reachable but its open ports are unknown until you
  scan it. The Discovered Hosts panel shows no ports for the host yet. A new web server web01 (10.10.10.10)
  just came online and the security team wants its exposed TCP ports documented. Use the Nmap simulator
  to scan the host and enumerate every open port.


  OBJECTIVE: Open the Nmap simulator from the lab toolbar (Open Nmap); Run a TCP port scan against web01
  (10.10.10.10); Identify all of its open ports — SSH (22), HTTP (80) and HTTPS (443). Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
