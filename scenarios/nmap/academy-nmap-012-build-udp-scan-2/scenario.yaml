  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nmap -sU` with timing tuning.

    2. Write down what looks normal versus wrong or missing for UDP scanning.

    3. Recall the core idea: UDP probes and open|filtered states. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Configuration should follow team conventions and be easy to audit

    2. The result should pass validation without manual cleanup'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `nmap -sU` with timing tuning.

    2. Create the smallest working slice of UDP scanning first, validate it, then add the remaining pieces
    one at a time.

    3. Verify the result — open UDP services are identified.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
