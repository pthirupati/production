description: 'CONTEXT: A team operating network scanning needs you to resolve `nmap: Udp Scanning — Build
  From Scratch` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The scanning lab is ready but UDP scanning is not configured yet. Required
  tools may already be installed; your job is to create the configuration and bring the capability online.
  Build UDP scanning from scratch in this nmap lab. You start from a minimal environment and must produce
  a working configuration that demonstrates UDP probes and open|filtered states. Plan, implement, then
  prove it works.


  OBJECTIVE: A working UDP scanning setup must exist by the end of this lab; Configuration should follow
  team conventions and be easy to audit; The result should pass validation without manual cleanup. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
