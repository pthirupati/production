description: 'CONTEXT: A team operating network scanning needs you to resolve `nmap: Safe Scanning — Integration
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for safe scanning. Downstream
  consumers are waiting on this integration path. Integration lab: connect safe scanning with an adjacent
  platform in the nmap stack. Validate authentication, data handoff, and failure behavior for non-intrusive,
  authorized scanning.


  OBJECTIVE: safe scanning is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- safe scanning is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for safe scanning. Downstream consumers
