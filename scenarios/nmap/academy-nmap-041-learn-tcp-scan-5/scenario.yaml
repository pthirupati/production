  content: 'Orient yourself: `nmap -sS/-sT`, `--reason`, and service detection output.
    Write down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — SYN/connect scans, port states, and safe timing templates.
    Make one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
