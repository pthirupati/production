description: 'CONTEXT: A team operating network scanning needs you to resolve `nmap: Tcp Scanning — Fundamentals
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The scanning lab is online with a starter TCP scanning setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
  This beginner-friendly nmap lab introduces TCP scanning. You will explore SYN/connect scans, port states,
  and safe timing templates on the scanning lab. Read the environment first, then follow the guided steps
  — no prior production experience required.


  OBJECTIVE: Understand how TCP scanning work in this lab environment; Identify the main status and configuration
  signals for TCP scanning; Confirm you can read the current state confidently before changing anything.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
