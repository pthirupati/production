  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nmap -sS/-sT`, `--reason`, and service detection output.

    2. Write down what looks normal versus wrong or missing for TCP scanning.

    3. Recall the core idea: SYN/connect scans, port states, and safe timing templates. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify the main status and configuration signals for TCP scanning

    2. Confirm you can read the current state confidently before changing anything'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `nmap -sS/-sT`, `--reason`, and service detection output.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — results match expected exposure with documented scan parameters.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
