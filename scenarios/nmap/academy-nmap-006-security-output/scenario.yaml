description: 'CONTEXT: A team operating network scanning needs you to resolve `nmap: Scan Output — Security
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around scan output. Assume
  an auditor or pen test is next week — tighten controls with evidence. Security review: harden scan output
  on this nmap system. Close unsafe defaults, enforce least privilege, and ensure output formats and reporting
  cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to scan output are removed or constrained; Access follows least privilege
  and is auditable; Security checks pass without breaking required functionality. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to scan output are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around scan output. Assume an auditor
  or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `-oN/-oX/-oG` files.

    2. Write down what looks normal versus wrong or missing for scan output.

    3. Recall the core idea: output formats and reporting. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Access follows least privilege and is auditable

    2. Security checks pass without breaking required functionality'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `-oN/-oX/-oG` files.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — output is saved in the required format.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
