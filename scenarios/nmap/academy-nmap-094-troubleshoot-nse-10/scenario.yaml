  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `nmap --script` output.

    2. Write down what looks normal versus wrong or missing for NSE scripts.

    3. Recall the core idea: script categories and safe scanning. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with `nmap --script` output.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `nmap --script` output.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — the right scripts run and report.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
