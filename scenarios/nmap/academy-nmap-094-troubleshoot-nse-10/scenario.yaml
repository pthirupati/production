description: 'CONTEXT: A team operating network scanning needs you to resolve `nmap: Nse Scripts — Troubleshooting
  Drill` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The scanning lab is degraded. Deeper checks need scripted probes. Recent changes
  may exist around NSE scripts, but do not restart blindly — gather evidence first. Production alert:
  deeper checks need scripted probes. You are on call for nmap and must troubleshoot NSE scripts methodically
  — triage symptoms, isolate root cause, apply the smallest safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: deeper checks need scripted probes; Root cause is isolated
  with evidence, not guesswork; Service behavior returns to normal after the fix. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
