title: Get past the firewall to the blocked database port
slug: nmap-fix-blocked-syn-scan
category: Nmap Network Scanning
description: The DBA insists PostgreSQL is listening on db01 (10.10.10.20:5432), but your scan reports
  the port as "filtered". A stateful edge firewall is silently dropping unsolicited SYN packets. Use a
  privileged SYN scan to confirm the port is really open.
difficulty: medium
lab_mode: simulation
simulation_type: nmap
technology: nmap
jira_priority: High
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Open the Nmap simulator and scan db01:5432 — observe it reported as "filtered"
- Recognise that the firewall is dropping unsolicited SYNs (no RST/closed response)
- Re-run with a privileged TCP SYN scan (sudo nmap -sS -p 5432 10.10.10.20) to confirm the port is open
initial_state: A default unprivileged scan of db01 (10.10.10.20) port 5432 returns "filtered" because
  the edge firewall drops the probe. The port is actually open behind the firewall.
hints:
- order: 1
  cost: 10
  content: Scan the port first to see the problem, e.g. nmap -p 5432 10.10.10.20. "filtered" means no
    response came back at all — a firewall is dropping the packet (unlike "closed", which sends a RST).
- order: 2
  cost: 15
  content: A half-open TCP SYN scan (-sS) is stealthier and gets through the firewall's allow rule for
    the probe. SYN scans need raw sockets, so they require root — prefix the command with sudo.
- order: 3
  cost: 20
  content: Run sudo nmap -sS -p 5432 10.10.10.20. Without sudo, nmap falls back to a connect scan that
    the firewall still drops. The task completes when db01:5432 is confirmed OPEN.
