title: Get past the firewall to the blocked database port
slug: nmap-fix-blocked-syn-scan
category: Fix
description: 'CONTEXT: A team operating network scanning has raised a ticket for `Get past the firewall
  to the blocked database port`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab. The architecture is a single lab-primary
  node exposing nmap CLI, targets, and scan output; treat it as the production host for this incident.
  All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A default unprivileged scan of db01 (10.10.10.20) port 5432 returns "filtered"
  because the edge firewall drops the probe. The port is actually open behind the firewall.


  OBJECTIVE: Open the Nmap console and scan db01:5432 — observe it reported as "filtered"; Recognise that
  the firewall is dropping unsolicited SYNs (no RST/closed response); Re-run with a privileged TCP SYN
  scan (sudo nmap -sS -p 5432 10.10.10.20) to confirm the port is open. Acceptance criteria: the change
  is minimal and reversible, and success means `pg_isready` includes `accepting connections`.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant nmap CLI, targets, and scan output), changing one thing at a time. Check your work
  continuously against the objective — success means `pg_isready` includes `accepting connections`.


  VERIFY: Re-run the same check the grader uses and confirm `pg_isready` includes `accepting connections`.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
