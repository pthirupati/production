title: Get past the firewall to the blocked database port
slug: nmap-fix-blocked-syn-scan
category: Fix
description: 'CONTEXT: A team operating network scanning needs you to resolve `Get past the firewall to
  the blocked database port` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline scanning lab with nmap CLI, targets, and scan output.
  All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A default unprivileged scan of db01 (10.10.10.20) port 5432 returns "filtered"
  because the edge firewall drops the probe. The port is actually open behind the firewall. The DBA insists
  PostgreSQL is listening on db01 (10.10.10.20:5432), but your scan reports the port as "filtered". A
  stateful edge firewall is silently dropping unsolicited SYN packets. Use a privileged SYN scan to confirm
  the port is really open.


  OBJECTIVE: Open the Nmap simulator and scan db01:5432 — observe it reported as "filtered"; Recognise
  that the firewall is dropping unsolicited SYNs (no RST/closed response); Re-run with a privileged TCP
  SYN scan (sudo nmap -sS -p 5432 10.10.10.20) to confirm the port is open. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
