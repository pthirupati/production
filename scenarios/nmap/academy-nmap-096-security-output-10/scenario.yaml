title: 'Nmap Network Scanning: Scan Output — Security Practice'
slug: academy-nmap-096-security-output-10
technology: Nmap Network Scanning
category: Security
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: nmap
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Security review: harden scan output on this Nmap Network Scanning system. Close unsafe defaults,
  enforce least privilege, and ensure output formats and reporting cannot be abused — without breaking
  legitimate use.'
objectives:
- Unsafe defaults related to scan output are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around scan output. Assume an auditor
  or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `-oN/-oX/-oG` files.

    2. Write down what looks normal versus wrong or missing for scan output.

    3. Recall the core idea: output formats and reporting. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for scan output.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `-oN/-oX/-oG` files.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — output is saved in the required format.

    4. Click Check Solution once `systemctl is-active nginx` returns active.'
