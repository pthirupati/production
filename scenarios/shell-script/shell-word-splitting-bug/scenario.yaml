  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An ops shell script that breaks on filenames with spaces due to unquoted variable
  expansion. A file-processing script mishandles paths with spaces because variables are unquoted, causing
  word splitting. Quote correctly and confirm the script is corrected.


  OBJECTIVE: Confirm word-splitting on spaced paths; Quote the variables / use arrays; Verify the script
  is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
