description: 'Observability task: make logging visible in logs, metrics, or traces.
  On-call should answer ''what is broken?'' quickly using signals from loggers, levels,
  handlers, and formatting.'
objectives:
- Day-2 logging work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but logging lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — logging config and emitted log lines.

    2. Write down what looks normal versus wrong or missing for logging.

    3. Recall the core idea: loggers, levels, handlers, and formatting. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for logging.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — logging config and emitted log lines.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a
    sensible threshold.

    3. Verify the result — useful logs are emitted at the right levels.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-shell-script-088-observability-logging-9.conf`,
    then click Check Solution.'
