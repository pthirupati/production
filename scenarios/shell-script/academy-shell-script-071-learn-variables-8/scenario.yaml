description: 'CONTEXT: Complete the variables coding exercise in the browser IDE.


  ENVIRONMENT: FixitLab coding practice IDE — edit solution.js, Run visible tests,
  then Check Solution.


  SYMPTOM / STARTING STATE: Coding challenge: variables. The stub in solution.js is
