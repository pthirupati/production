description: 'CONTEXT: A team operating shell scripting needs you to resolve `Script Mishandles CLI Flags`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An ops shell script with brittle manual argument parsing that mishandles standard
  flags. An ops CLI script mishandles options because it parses arguments manually and breaks on combined/edge
  flags. Use getopts properly and confirm the script is corrected.


  OBJECTIVE: Confirm flags are mishandled; Reimplement parsing with getopts; Verify the script is corrected.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
