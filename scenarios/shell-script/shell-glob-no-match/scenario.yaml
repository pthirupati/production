description: 'CONTEXT: A team operating shell scripting needs you to resolve `Script Breaks on Empty Glob`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An ops script mishandling an empty glob. A loop over *.log breaks when there
  are no matches because nullglob isn''t set.


  OBJECTIVE: Confirm the issue: Loop processes the literal ''*.log''; Apply the documented fix in /opt/scripts/archive.sh;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
