description: 'Production alert: functions leak globals or mishandle args. You are
  on call for Shell Scripting and must troubleshoot functions methodically — triage
  symptoms, find root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: functions leak globals or mishandle args'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The bash practice environment is degraded. Functions leak globals or
  mishandle args. Recent changes may exist around functions, but do not restart blindly
  — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Triage: function definitions and call sites. Capture timestamps, error
    messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: functions are reusable with correct returns. Document
    the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-shell-script-004-troubleshoot-functions.conf`,
    and rerun Check Solution.'
