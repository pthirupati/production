tasks:
- id: task_1
  title: Traps — Security Lab
  description: Implement the traps exercise in the browser IDE and pass all tests.
  background: 'This shell script lab teaches systematic troubleshooting: observe,
    hypothesize, change, verify.'
  validation:
    type: script
    script: hidden_tests
    error_message: Hidden tests still failing — keep iterating in the IDE.
solution:
  summary: Implement the function so visible and hidden tests pass in the coding IDE.
  files_changed:
  - solution.js
  commands_run: []
  reference_docs: shell-script-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active crond
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active crond
    expected_output: '`systemctl is-active crond`` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
coding_mode: true
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: 'Implement trapSignal(sig) → uppercase signal name without ''SIG''
    prefix (e.g. SIGINT→INT).

    Click Run to try it, then Check Solution to grade.

    '
  files:
  - path: solution.js
    content: "function trapSignal(sig) {\n  // TODO\n}\n"
    readonly: false
  visible_tests:
  - name: int
    code: assert(trapSignal('SIGINT') === 'INT');
  hidden_tests:
  - name: term
    code: assert(trapSignal('SIGTERM') === 'TERM');
  - name: raw
    code: assert(trapSignal('HUP') === 'HUP');
  timeout: 8
