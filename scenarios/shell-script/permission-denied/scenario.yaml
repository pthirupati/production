description: 'CONTEXT: Complete the coding exercise for permission-denied in the browser
  IDE.


  ENVIRONMENT: FixitLab coding practice IDE — edit solution.js, Run visible tests,
  then Check Solution.


  SYMPTOM / STARTING STATE: Coding challenge in the browser IDE. The stub in solution.js
  is incomplete so tests fail until you implement it.


  OBJECTIVE: Implement the required changes so all visible and hidden tests pass.


  VERIFY: Check Solution passes all hidden tests.

  '
initial_state: Coding challenge in the browser IDE. The stub in solution.js is incomplete
  so tests fail until you implement it.
objectives:
- Complete the exercise in solution.js
- Pass visible tests with Run / Preview
- Pass Check Solution (hidden tests)
lab_mode: simulation
simulation_type: shell
time_limit: 600
max_score: 100
is_free: true
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: script not executable is
    not behaving as the scenario objectives require. This lab is about script not
    executable — how script not executable behaves in a shell scripting environment.
    Read the objectives and the current state, and note precisely what looks wrong
    versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For script not executable problems the reliable
    method is: (1) reproduce/observe the failure, (2) narrow from the whole system
    down to the one component that owns the symptom, (3) change exactly one thing,
    (4) re-check. Fix the underlying misconfiguration you identified (not just the
    noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    1. Inspect the current state with scripts, cron, logs, and shellcheck.

    2. Each command above tells you something specific — status/health, recent errors,
    and the effective configuration. Read them in that order.

    3. Compare what you see to the objectives; the gap points at the fault.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of script not executable
    is at fault.

    2. Re-run the most relevant of scripts, cron, logs, and shellcheck focused on
    just that part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state
    from ''script not executable is not behaving as the scenario objectives require''
    toward ''`check.sh` exits successfully''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the smallest reversible change your hypothesis points to. Fix the underlying
    misconfiguration you identified (not just the noisy log line), changing one thing
    at a time.

    2. Re-run `bash check.sh` and confirm `check.sh` exits successfully.

    3. If it still fails, the hypothesis was wrong — go back to the evidence, do not
    stack changes.


    WHY: the grader validates real system state, not marker files — a fix only counts
    when the subsystem is actually healthy.'
