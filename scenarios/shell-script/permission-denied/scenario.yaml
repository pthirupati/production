title: Script Not Executable
slug: shell-permission-denied
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating shell scripting has raised a ticket for `Script Not Executable`.
  A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve it.
  Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment. The architecture is a
  single lab-primary node exposing scripts, cron, logs, and shellcheck; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. Running ./deploy.sh returns "Permission denied".
  The file exists and contains valid bash commands.


  OBJECTIVE: Diagnose why the script cannot be executed (missing execute bit and shebang); Add the correct
  shebang line and set the execute permission with chmod; Fix file ownership so the CI user can run the
  script. Acceptance criteria: the change is minimal and reversible, and success means `check.sh` exits
  successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant scripts, cron, logs, and shellcheck), changing one thing at a time. Check your work
  continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. Running ./deploy.sh returns "Permission denied". The file exists
  and contains valid bash commands.

  '
objectives:
- Diagnose why the script cannot be executed (missing execute bit and shebang)
- Add the correct shebang line and set the execute permission with chmod
- Fix file ownership so the CI user can run the script
