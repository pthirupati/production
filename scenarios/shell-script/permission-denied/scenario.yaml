title: Script Not Executable
slug: shell-permission-denied
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating shell scripting needs you to resolve `Script Not Executable` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. Running ./deploy.sh returns "Permission denied".
  The file exists and contains valid bash commands. A deployment script fails with "Permission denied"
  when invoked from a CI pipeline. The script file lacks the execute bit, the shebang line is missing
  so the shell cannot determine the interpreter, and the script is owned by a different user than the
  one running the pipeline. All three must be resolved for the script to execute correctly.


  OBJECTIVE: Diagnose why the script cannot be executed (missing execute bit and shebang); Add the correct
  shebang line and set the execute permission with chmod; Fix file ownership so the CI user can run the
  script. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
