description: 'CONTEXT: A team operating shell scripting needs you to resolve `Metrics Script Divides by
  Zero` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An ops shell script that performs arithmetic without guarding a zero denominator.
  A metrics script crashes when a denominator is zero because it doesn''t guard the division. Add a guard
  and confirm the script is corrected.


  OBJECTIVE: Confirm a divide-by-zero crash; Guard the denominator before dividing; Verify the script
  is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
