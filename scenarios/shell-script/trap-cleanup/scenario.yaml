title: Script Leaves Temp Files on Exit
slug: shell-trap-cleanup
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating shell scripting needs you to resolve `Script Leaves Temp Files
  on Exit` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. /tmp is filling with files named proc_*.tmp left
  behind by process.sh. Killing the script mid-run always leaves orphaned files. A data-processing script
  creates temporary files in /tmp during execution but fails to clean them up when it exits — especially
  when killed with SIGINT or SIGTERM. Over time, gigabytes of temp data accumulate. The script must be
  refactored to use a trap handler that cleans up on all exit paths including signals.


  OBJECTIVE: Identify the missing trap statement in the script; Add a cleanup function and trap it on
  EXIT, INT, and TERM signals; Confirm that temp files are removed whether the script exits normally or
  is killed. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
