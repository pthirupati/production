hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — pipelines and `set -o pipefail`.

    2. Write down what looks normal versus wrong or missing for pipes and redirection.

    3. Recall the core idea: stdout/stderr, pipefail, and process substitution. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status rsyslog` — note Active/Failed and the last log lines.

    2. Read `journalctl -u rsyslog -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — pipelines and `set -o pipefail`.

    2. Apply production standards for pipes and redirection: resource limits, monitoring, access controls,
    and a written rollback step.

    3. Verify the result — pipeline errors propagate correctly.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
