description: 'CONTEXT: A team operating shell scripting needs you to resolve `shell-script: Pipes And
  Redirection — Production Readiness` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but pipes and redirection is not production ready
  — missing guardrails, runbooks, or capacity checks. Production readiness for pipes and redirection.
  Harden, document, and validate stdout/stderr, pipefail, and process substitution so the change is safe
  to run during a maintenance window.


  OBJECTIVE: Day-2 pipes and redirection work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  rsyslog` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 pipes and redirection work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but pipes and redirection is not production ready — missing
