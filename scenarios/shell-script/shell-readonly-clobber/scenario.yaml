description: 'CONTEXT: A team operating shell scripting needs you to resolve `Script Clobbers Readonly
  Output File` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An ops shell script that clobbers an existing output file with a careless
  redirect. A reporting script overwrites an important file with > instead of appending or guarding it.
  Make output handling safe and confirm the script is corrected.


  OBJECTIVE: Confirm the script clobbers the output; Use safe redirection / noclobber / append; Verify
  the script is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
