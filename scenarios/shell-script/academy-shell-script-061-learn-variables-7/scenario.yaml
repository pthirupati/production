description: This beginner-friendly Shell Scripting lab introduces Terraform variables.
  You will explore input variables, defaults, validation, and tfvars layering on the
  bash practice environment. Read the environment first, then follow the guided steps
  — no prior production experience required.
objectives:
- Understand how Terraform variables work in this lab environment
- Identify the main status and configuration signals for Terraform variables
- Confirm you can read the current state confidently before changing anything
initial_state: The bash practice environment is online with a starter Terraform variables
  setup. Some pieces are intentionally incomplete so you can learn how they fit together.
  Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — variables.tf, *.tfvars, and `terraform console`.

    2. Write down what looks normal versus wrong or missing for Terraform variables.

    3. Recall the core idea: input variables, defaults, validation, and tfvars layering.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Terraform variables.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — variables.tf, *.tfvars, and `terraform console`.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — the correct tfvars set is used and `terraform validate`
    passes.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-shell-script-061-learn-variables-7.conf`,
    then click Check Solution.'
