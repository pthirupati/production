title: Unbound Variable Error in Script
slug: shell-variable-not-set
difficulty: easy
category: Shell Scripting
description: 'A bash script exits immediately with "unbound variable" errors when run with strict mode
  (set -euo pipefail). Variables are referenced before assignment, one variable has a typo in its name,
  and an array element is accessed without a bounds check. The script must be fixed to handle unset variables
  gracefully using default values and proper quoting.

  '
initial_state: 'Simulated RHEL 9 server. Running backup.sh with set -u active causes it to abort immediately
  with "BACKUP_DIR: unbound variable" before any backup is created.

  '
objectives:
- Identify all unbound variable references using bash -n and the error output
- Add default value assignments or parameter expansions to handle unset variables
- Confirm the script runs to completion without unbound variable errors
lab_mode: simulation
simulation_type: generic
time_limit: 600
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Run with tracing to see where it aborts: `bash -x backup.sh`. The error names the unbound
    variable (e.g. BACKUP_DIR) because `set -u` is active. `bash -n backup.sh` checks syntax.'
- order: 2
  cost: 15
  content: 'Causes: a variable used before assignment, a typo in a variable name, and an array element
    accessed out of bounds. Use default expansions like `${BACKUP_DIR:-/tmp/backup}` to make unset variables
    safe.'
- order: 3
  cost: 20
  content: Fix the typo so the name matches its assignment, add `:-default` expansions for the optionally-unset
    variables, and guard the array index. Re-run backup.sh — it completes without unbound-variable errors.
requires_companion_hosts: false
dual_terminal: false
jira_priority: Low
