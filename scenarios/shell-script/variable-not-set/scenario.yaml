title: Unbound Variable Error in Script
slug: shell-variable-not-set
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating shell scripting needs you to resolve `Unbound Variable Error in
  Script` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. Running backup.sh with set -u active causes it to
  abort immediately with "BACKUP_DIR: unbound variable" before any backup is created. A bash script exits
  immediately with "unbound variable" errors when run with strict mode (set -euo pipefail). Variables
  are referenced before assignment, one variable has a typo in its name, and an array element is accessed
  without a bounds check. The script must be fixed to handle unset variables gracefully using default
  values and proper quoting.


  OBJECTIVE: Identify all unbound variable references using bash -n and the error output; Add default
  value assignments or parameter expansions to handle unset variables; Confirm the script runs to completion
  without unbound variable errors. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
