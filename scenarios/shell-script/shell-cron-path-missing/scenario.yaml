description: 'CONTEXT: A team operating shell scripting needs you to resolve `Cron Script Fails on Missing
  PATH` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An ops shell script that breaks under cron because it assumes an interactive
  PATH. A script works interactively but fails under cron because it relies on a PATH that cron doesn''t
  set. Make it robust and confirm it is corrected.


  OBJECTIVE: Confirm the script fails under cron''s minimal env; Set an explicit PATH / use absolute paths;
  Verify the script is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
