description: 'CONTEXT: A team operating shell scripting needs you to resolve `Script Lockfile Never Released
  on Crash` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An ops script with a lockfile not tied to the process. A second run is blocked
  forever because a crash left a stale lockfile.


  OBJECTIVE: Confirm the issue: Stale lock blocks new runs; Apply the documented fix in /opt/scripts/singleton.sh;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
