category: Fix
description: 'CONTEXT: A team operating shell scripting needs you to resolve `Bash Unbound Variable` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL host. Running `bash /opt/scripts/backup.sh` exits early with
  a "<VAR>: unbound variable" error (the script uses set -u) before any backup is produced. A backup script
  (/opt/scripts/backup.sh) aborts immediately under strict mode because it references a variable that
  was never set. With `set -u` active, expanding an unset variable is a fatal error, so the backup never
  runs. Find the unbound variable, give it a safe value or default, and get the script to complete.


  OBJECTIVE: Run the script and identify which variable is unbound; Set the variable or provide a default
  expansion; Confirm the script runs to completion and produces the backup. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the bash practice environment. For Bash Unbound
    Variable, inspect scripts, cron, logs, and shellcheck before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with scripts, cron, logs, and shellcheck.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Confirm the script runs to completion and produces the backup.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
