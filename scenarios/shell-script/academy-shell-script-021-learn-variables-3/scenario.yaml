description: 'CONTEXT: A team operating shell scripting needs you to resolve `shell-script: Terraform
  Variables — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The bash practice environment is online with a starter Terraform variables
  setup. Some pieces are intentionally incomplete so you can learn how they fit together. Nothing is on
  fire — focus on observation. This beginner-friendly shell-script lab introduces Terraform variables.
  You will explore input variables, defaults, validation, and tfvars layering on the bash practice environment.
  Read the environment first, then follow the guided steps — no prior production experience required.


  OBJECTIVE: Understand how Terraform variables work in this lab environment; Identify the main status
  and configuration signals for Terraform variables; Confirm you can read the current state confidently
  before changing anything. Success means `systemctl is-active crond` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how Terraform variables work in this lab environment
- Identify the main status and configuration signals for Terraform variables
- Confirm you can read the current state confidently before changing anything
initial_state: The bash practice environment is online with a starter Terraform variables setup. Some
  pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus
  on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — variables.tf, *.tfvars, and `terraform console`.

    2. Write down what looks normal versus wrong or missing for Terraform variables.

    3. Recall the core idea: input variables, defaults, validation, and tfvars layering. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — variables.tf, *.tfvars, and `terraform console`.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — the correct tfvars set is used and `terraform validate` passes.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
