title: 'Shell Scripting: Terraform Variables — Fundamentals Lab'
slug: academy-shell-script-021-learn-variables-3
technology: Shell Scripting
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly Shell Scripting lab introduces Terraform variables.
  You will explore input variables, defaults, validation, and tfvars layering on the
  bash practice environment. Read the environment first, then complete the guided
  steps — no prior production experience required.
objectives:
- Understand how Terraform variables work in this lab environment
- Identify the main status and configuration signals for Terraform variables
- Confirm you can read the current state confidently before changing anything
initial_state: The bash practice environment is online with a starter Terraform variables
  setup. Some pieces are intentionally incomplete so you can learn how the pieces
  fit together. Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: variables.tf, *.tfvars, and `terraform console`. Write
    down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — input variables, defaults, validation, and tfvars layering.
    Make one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-shell-script-021-learn-variables-3.conf`, then
    click Check Solution.
