title: Here-Doc Syntax Issue
slug: shell-heredoc-broken
difficulty: medium
category: Shell Scripting
description: 'A script that generates configuration files using here-documents is producing empty files
  or mangled output. The heredoc delimiter has a leading tab on the closing token (but the opening does
  not use <<-), variable expansion is accidentally suppressed by quoting the delimiter, and a pipe after
  the heredoc is breaking the construct. All three issues must be fixed.

  '
initial_state: 'Simulated RHEL 9 server. Running gen-config.sh produces an empty nginx.conf file. No errors
  are printed because the heredoc silently consumes the issue.

  '
objectives:
- Add bash -x tracing to understand what the heredoc is actually producing
- Fix the delimiter quoting, indentation, and pipe placement issues
- Confirm the script generates the correct nginx.conf with all variables expanded
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Trace what the heredoc actually emits: `bash -x gen-config.sh`. Note the empty/mangled output
    and where it stops.'
- order: 2
  cost: 15
  content: Quoting the delimiter (`<<'EOF'`) disables `$VAR` expansion — leave it unquoted to substitute
    variables. Use `<<-EOF` (dash) only if the closing token is indented with a tab, and never pipe the
    heredoc into a command that swallows it.
- order: 3
  cost: 20
  content: 'Fix all three: unquote the delimiter so variables expand, align the closing token (or use
    `<<-` consistently), and remove the stray pipe after the heredoc. Re-run gen-config.sh and confirm
    nginx.conf is fully populated with expanded values.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
