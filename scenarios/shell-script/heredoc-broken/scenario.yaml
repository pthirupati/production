title: Here-Doc Syntax Issue
slug: shell-heredoc-broken
difficulty: medium
category: Build
description: 'CONTEXT: A team operating shell scripting needs you to resolve `Here-Doc Syntax Issue` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. Running gen-config.sh produces an empty nginx.conf
  file. No errors are printed because the heredoc silently consumes the issue. A script that generates
  configuration files using here-documents is producing empty files or mangled output. The heredoc delimiter
  has a leading tab on the closing token (but the opening does not use <<-), variable expansion is accidentally
  suppressed by quoting the delimiter, and a pipe after the heredoc is breaking the construct. All three
  issues must be fixed.


  OBJECTIVE: Add bash -x tracing to understand what the heredoc is actually producing; Fix the delimiter
  quoting, indentation, and pipe placement issues; Confirm the script generates the correct nginx.conf
  with all variables expanded. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. Running gen-config.sh produces an empty nginx.conf file. No errors
  are printed because the heredoc silently consumes the issue.

  '
objectives:
- Add bash -x tracing to understand what the heredoc is actually producing
- Fix the delimiter quoting, indentation, and pipe placement issues
- Confirm the script generates the correct nginx.conf with all variables expanded
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
