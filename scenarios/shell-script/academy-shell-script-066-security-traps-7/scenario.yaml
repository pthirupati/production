title: Traps — Security Lab
slug: academy-shell-script-066-security-traps-7
technology: shell-script
category: Harden
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating shell scripting needs you to resolve `shell-script: Traps — Security
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline bash practice environment with scripts, cron, logs,
  and shellcheck. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around traps. Assume an
  auditor or pen test is next week — tighten controls with evidence. Security review: harden traps on
  this shell-script system. Close unsafe defaults, enforce least privilege, and ensure signal handling
  and cleanup on exit cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to traps are removed or constrained; Access follows least privilege
  and is auditable; Security checks pass without breaking required functionality. Success means `systemctl
  is-active crond` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to traps are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around traps. Assume an auditor or
  pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status crond` and `journalctl -u crond -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart crond` and confirm `systemctl is-active crond` succeeds.


    WHY: the grader checks real service state, not marker files.'
summary: Complete the traps — security lab shell script lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
