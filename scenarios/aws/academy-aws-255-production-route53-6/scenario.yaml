description: 'CONTEXT: A team operating AWS cloud operations needs you to resolve `Route53 — Production
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline AWS practice account with AWS CLI, IAM policies,
  EC2/S3/VPC, security groups, and CloudFormation/Terraform. All tools run locally; no paid APIs or external
  cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but Route53 is not production ready — missing
  guardrails, runbooks, or capacity checks. Production readiness for Route53. Harden, document, and validate
  how route53 fits into AWS cloud operations so the change is safe to run during a maintenance window.


  OBJECTIVE: Day-2 Route53 work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 Route53 work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but Route53 is not production ready — missing guardrails, runbooks,
  or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the AWS practice account. For Route53, inspect
    the relevant AWS CLI, IAM policies, EC2/S3/VPC, security groups, and CloudFormation/Terraform for
    route53 before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with the relevant AWS CLI, IAM policies, EC2/S3/VPC, security groups, and CloudFormation/Terraform
    for route53.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. The system remains stable for dependent teams.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
