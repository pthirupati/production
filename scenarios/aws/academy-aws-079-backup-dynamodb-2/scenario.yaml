description: 'CONTEXT: A team operating AWS cloud operations needs you to resolve `Dynamodb — Backup Lab`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline AWS practice account with AWS CLI, IAM policies,
  EC2/S3/VPC, security groups, and CloudFormation/Terraform. All tools run locally; no paid APIs or external
  cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for Dynamodb. Leadership wants
  proof that restore works — not just that scripts exit zero. Backup and recovery drill for Dynamodb.
  Ensure backups run on schedule, retention is correct, and you can restore how dynamodb fits into AWS
  cloud operations within the lab RTO.


  OBJECTIVE: Backup coverage for Dynamodb is complete and restorable; Retention and encryption meet the
  stated policy; A restore drill proves data integrity. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for Dynamodb is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for Dynamodb. Leadership wants proof that
