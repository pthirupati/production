description: 'CONTEXT: A team operating AWS cloud operations needs you to resolve `Autoscaling — Troubleshoot
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline AWS practice account with AWS CLI, IAM policies,
  EC2/S3/VPC, security groups, and CloudFormation/Terraform. All tools run locally; no paid APIs or external
  cloud calls are required.


  SYMPTOM / STARTING STATE: The AWS practice account is degraded. The app does not scale under load or
  flaps. Recent changes may exist around autoscaling, but do not restart blindly — gather evidence first.
  Production alert: the app does not scale under load or flaps. You are on call for AWS Cloud and must
  troubleshoot autoscaling methodically — triage symptoms, isolate root cause, apply the smallest safe
  fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: the app does not scale under load or flaps; Root cause is
  isolated with evidence, not guesswork; Service behavior returns to normal after the fix. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: the app does not scale under load or flaps'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The AWS practice account is degraded. The app does not scale under load or flaps. Recent
  changes may exist around autoscaling, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get hpa` and `kubectl describe hpa`.

    2. Write down what looks normal versus wrong or missing for autoscaling.

    3. Recall the core idea: HPA metrics, min/max replicas, and resource requests. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with `kubectl get hpa` and `kubectl describe hpa`.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `kubectl get hpa` and `kubectl describe hpa`.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — replicas scale with load between the configured bounds.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
