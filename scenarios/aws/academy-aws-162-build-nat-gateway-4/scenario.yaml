description: Cloud Lab Server operations for Build Lab. A planted cloud CLI/API configuration fault keeps
  the environment unhealthy. Repair the cloud profile under `/opt`, then verify with the documented checker
  (cloud Lab Server health check passes (`systemctl is-failed` finds no failed units / config repaired)).
objectives:
- Identify the planted cloud configuration fault
- Repair the cloud profile with the minimal change
- cloud Lab Server health check passes (`systemctl is-failed` finds no failed units / config repaired)
initial_state: Cloud CLI/API configuration on this Lab Server is broken; console and CLI workflows fail
  until repaired.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: Nat Gateway is misconfigured and dependent workflows
    are failing. This lab is about Nat Gateway — how nat gateway fits into AWS cloud operations. Read
    the objectives and the current state, and note precisely what looks wrong versus healthy before you
    form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Nat Gateway problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Create the smallest working slice of Nat Gateway first, validate
    it, then add the remaining pieces one at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Inspect the planted aws Lab Server fault: `/opt/aws/lab-state.json` and the AWS CLI profile. Do not
    chase unrelated nginx/rsyslog units.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm the aws config under /opt/aws/ is broken.

    2. Repair credentials/project/region (or OpenStack clouds.yaml).

    3. Re-check with the cloud CLI until the profile is healthy.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix the broken aws configuration on this Lab Server.

    2. Apply the documented remediation (config + FIXED-OK where required).

    3. Click Check Solution once cloud Lab Server health check passes (`systemctl is-failed` finds no
    failed units / config repaired).'
