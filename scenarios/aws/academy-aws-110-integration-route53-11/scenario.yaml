jira_priority: Medium
description: 'CONTEXT: A team operating AWS cloud operations needs you to resolve
  `Route53 — Integration Lab` during a realistic incident. The business impact is
  reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline AWS practice account with AWS
  CLI, IAM policies, EC2/S3/VPC, security groups, and CloudFormation/Terraform. All
  tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together
  for Route53. Downstream consumers are waiting on this integration path. Integration
  lab: connect Route53 with an adjacent platform in the AWS Cloud stack. Validate
  authentication, data handoff, and failure behavior for how route53 fits into AWS
  cloud operations.


  OBJECTIVE: Route53 is connected to the adjacent system successfully; Handoff points
  are authenticated and observable; End-to-end workflow completes without manual intervention.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Route53 is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for Route53.
  Downstream consumers are waiting on this integration path.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the AWS practice account.
    For Route53, inspect the relevant AWS CLI, IAM policies, EC2/S3/VPC, security
    groups, and CloudFormation/Terraform for route53 before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with the relevant AWS CLI, IAM policies, EC2/S3/VPC, security
    groups, and CloudFormation/Terraform for route53.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy
    state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. End-to-end workflow completes without manual intervention.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
