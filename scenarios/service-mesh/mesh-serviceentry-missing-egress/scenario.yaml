description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `External API Blocked by Egress Policy` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: Calls to `api.stripe-like.local` fail with `502 BlackHoleCluster`. The mesh outbound policy is REGISTRY_ONLY and there is no ServiceEntry for the external host, so the sidecar refuses the unknown destination.

  OBJECTIVE: With outboundTrafficPolicy REGISTRY_ONLY, unknown external hosts hit the BlackHole cluster unless declared. Add a ServiceEntry for the external host/port so the sidecar knows the destination and allows the egress call. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Calls to the external host stop hitting the BlackHoleCluster'
- 'The missing ServiceEntry under REGISTRY_ONLY is confirmed as root cause'
- 'The external API is reachable after the ServiceEntry is added'
initial_state: |-
  Calls to `api.stripe-like.local` fail with `502 BlackHoleCluster`. The mesh outbound policy is REGISTRY_ONLY and there is no ServiceEntry for the external host, so the sidecar refuses the unknown destination.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get serviceentry -A`
        2. `istioctl proxy-config cluster deploy/checkout --fqdn api.stripe-like.local`
        3. `kubectl -n istio-system get configmap istio -o yaml | grep -A2 outboundTrafficPolicy`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get serviceentry -A` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config cluster deploy/checkout --fqdn api.stripe-like.local` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. With outboundTrafficPolicy REGISTRY_ONLY, unknown external hosts hit the BlackHole cluster unless declared. Add a ServiceEntry for the external host/port so the sidecar knows the destination and allows the egress call.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
