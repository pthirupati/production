tasks:
- id: task_1
  title: 'External API Blocked by Egress Policy'
  description: |-
    Restore healthy behavior for External API Blocked by Egress Policy by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This service-mesh lab teaches how outboundTrafficPolicy and ServiceEntry govern egress in Istio and why REGISTRY_ONLY blocks undeclared external hosts through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-serviceentry-missing-egress.conf carries the FIXED-OK marker.
solution:
  summary: |-
    With outboundTrafficPolicy REGISTRY_ONLY, unknown external hosts hit the BlackHole cluster unless declared. Add a ServiceEntry for the external host/port so the sidecar knows the destination and allows the egress call.
  files_changed: []
  commands_run:
  - 'kubectl get serviceentry -A'
  - 'istioctl proxy-config cluster deploy/checkout --fqdn api.stripe-like.local'
  - 'kubectl -n istio-system get configmap istio -o yaml | grep -A2 outboundTrafficPolicy'
  reference_docs: service-mesh-fundamentals
