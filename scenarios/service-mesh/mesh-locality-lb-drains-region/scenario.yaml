tasks:
- id: task_1
  title: 'Locality Load Balancing Sends All Traffic Cross-Region'
  description: |-
    Restore healthy behavior for Locality Load Balancing Sends All Traffic Cross-Region by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This service-mesh lab teaches how Istio locality-aware load balancing prefers same-zone endpoints and how bad distribution weights force cross-region traffic through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-locality-lb-drains-region.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The DestinationRule localityLbSetting distribution weights (or a failover rule) route traffic to the remote region even when local endpoints are healthy, inflating latency. Correct the locality distribution/failover so local-zone endpoints are preferred, then verify traffic stays local.
  files_changed: []
  commands_run:
  - 'kubectl get destinationrule ratings -o yaml'
  - 'istioctl proxy-config endpoint deploy/reviews --cluster ''outbound|9080||ratings.default.svc.cluster.local'''
  - 'curl -s http://ratings/ -o /dev/null -w ''%{time_total}\n'''
  reference_docs: service-mesh-fundamentals
