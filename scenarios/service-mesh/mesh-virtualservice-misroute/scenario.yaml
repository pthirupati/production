description: 'CONTEXT: A platform team operating service mesh needs you to resolve `VirtualService Routes
  to a Missing Subset` during a realistic delivery incident. The business impact is a stalled or unsafe
  release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline service-mesh lab with an Istio/Linkerd control plane,
  sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under
  /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.


  SYMPTOM / STARTING STATE: Users hit `reviews` and get HTTP 503 (no healthy upstream). The VirtualService
  routes 100% of traffic to subset `v3`, but the DestinationRule only defines subsets `v1` and `v2` —
  there are no `v3` endpoints, so every request fails with no destination.


  OBJECTIVE: The VirtualService references subset `v3` that does not exist in the DestinationRule (or
  has no matching pod labels), so Envoy has no endpoints and returns 503. Fix the route to target an existing
  subset (or define the v3 subset + its labeled workload) so traffic reaches healthy pods. Success is
  graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The reviews VirtualService routes to a subset backed by real endpoints
- Requests to reviews return 200 instead of 503
- The missing-subset root cause is confirmed via proxy-config route/DestinationRule
initial_state: Users hit `reviews` and get HTTP 503 (no healthy upstream). The VirtualService routes 100%
  of traffic to subset `v3`, but the DestinationRule only defines subsets `v1` and `v2` — there are no
  `v3` endpoints, so every request fails with no destination.
