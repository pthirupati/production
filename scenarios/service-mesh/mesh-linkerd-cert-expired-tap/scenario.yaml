description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `Linkerd mTLS Fails After Trust Anchor Expiry` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: Meshed connections start failing with certificate errors and `linkerd check` reports the trust anchor expiring. The issuer certificate lifetime lapsed, so proxies can no longer establish mutual TLS.

  OBJECTIVE: The Linkerd issuer/trust-anchor certificate expired (or is within the fail window), so proxies cannot complete the mTLS handshake. Rotate the issuer certificate (and trust anchor if needed) and restart the affected proxies so a valid cert chain is used. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Meshed mTLS connections succeed again'
- 'The expired issuer/trust-anchor cert is confirmed as root cause via linkerd check'
- 'Proxies establish mTLS after the certificate is rotated'
initial_state: |-
  Meshed connections start failing with certificate errors and `linkerd check` reports the trust anchor expiring. The issuer certificate lifetime lapsed, so proxies can no longer establish mutual TLS.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `linkerd check --proxy`
        2. `kubectl -n linkerd get secret linkerd-identity-issuer -o yaml`
        3. `linkerd identity -n web deploy/web`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `linkerd check --proxy` and read the status/error carefully.
        2. Cross-check with `kubectl -n linkerd get secret linkerd-identity-issuer -o yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Linkerd issuer/trust-anchor certificate expired (or is within the fail window), so proxies cannot complete the mTLS handshake. Rotate the issuer certificate (and trust anchor if needed) and restart the affected proxies so a valid cert chain is used.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
