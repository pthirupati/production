tasks:
- id: task_1
  title: 'Linkerd mTLS Fails After Trust Anchor Expiry'
  description: |-
    Restore healthy behavior for Linkerd mTLS Fails After Trust Anchor Expiry by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This service-mesh lab teaches how Linkerd's trust anchor and issuer certificates underpin mTLS and why expiry breaks all meshed connections through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-linkerd-cert-expired-tap.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The Linkerd issuer/trust-anchor certificate expired (or is within the fail window), so proxies cannot complete the mTLS handshake. Rotate the issuer certificate (and trust anchor if needed) and restart the affected proxies so a valid cert chain is used.
  files_changed: []
  commands_run:
  - 'linkerd check --proxy'
  - 'kubectl -n linkerd get secret linkerd-identity-issuer -o yaml'
  - 'linkerd identity -n web deploy/web'
  reference_docs: service-mesh-fundamentals
