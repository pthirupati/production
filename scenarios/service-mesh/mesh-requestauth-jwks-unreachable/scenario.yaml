hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get requestauthentication -n api -o yaml`
        2. `istioctl proxy-config log deploy/api -n api`
        3. `curl -s https://issuer.local/.well-known/jwks.json`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get requestauthentication -n api -o yaml` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config log deploy/api -n api` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The RequestAuthentication `jwksUri` (or issuer) points at an unreachable endpoint, so Envoy cannot fetch signing keys and rejects every JWT. Point jwksUri at the reachable JWKS endpoint (or inline the jwks) so tokens validate against the correct keys.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
