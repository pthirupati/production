description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `JWT Auth Fails on Unreachable JWKS` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: All authenticated requests to `api` return 401 with `Jwks doesn't have key to match kid`. The RequestAuthentication's jwksUri points at an issuer host the mesh cannot reach, so Envoy has no keys to validate tokens.

  OBJECTIVE: The RequestAuthentication `jwksUri` (or issuer) points at an unreachable endpoint, so Envoy cannot fetch signing keys and rejects every JWT. Point jwksUri at the reachable JWKS endpoint (or inline the jwks) so tokens validate against the correct keys. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Valid JWTs are accepted by the api service'
- 'The unreachable JWKS endpoint is confirmed as root cause'
- 'Token validation succeeds after jwksUri is corrected'
initial_state: |-
