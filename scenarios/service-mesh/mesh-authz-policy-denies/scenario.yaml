    \  3. `kubectl get serviceaccount -n frontend`\n    Write down what looks healthy versus wrong. Form\
    \ one hypothesis before you touch anything."
- order: 2
  cost: 25
  content: "Diagnostic steps:\n    1. Re-run `kubectl get authorizationpolicy -n payments -o yaml` and\
    \ read the status/error carefully.\n    2. Cross-check with `istioctl proxy-config log deploy/payments\
    \ --level rbac:debug` to isolate the failing object.\n    3. State the single root cause in one sentence\
    \ before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. The AuthorizationPolicy's `from.source.principals` lists\
    \ the wrong SPIFFE identity for the frontend service account, so the mesh's default-deny denies the\
    \ real caller. Remediate by correcting the principal to frontend's actual service-account identity\
    \ so authorized traffic is allowed while everything else stays denied.\n    2. Change one thing at\
    \ a time so you can roll back if the hypothesis was wrong.\n    3. Verify the objective is met, then\
    \ click Check Solution (graded on real state, not a marker file)."
