description: 'CONTEXT: A platform team operating service mesh needs you to resolve `AuthorizationPolicy
  Denies Legitimate Traffic` during a realistic delivery incident. The business impact is a stalled or
  unsafe release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline service-mesh lab with an Istio/Linkerd control plane,
  sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under
  /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.


  SYMPTOM / STARTING STATE: The `frontend` can no longer call `payments`: every request returns RBAC:
  access denied (HTTP 403). A new AuthorizationPolicy on payments allows only a principal that doesn''t
  match frontend''s actual service-account identity, so legitimate traffic is denied by default.


  OBJECTIVE: The AuthorizationPolicy''s `from.source.principals` lists the wrong SPIFFE identity for the
  frontend service account, so the mesh''s default-deny denies the real caller. Remediate by correcting
  the principal to frontend''s actual service-account identity so authorized traffic is allowed while
  everything else stays denied. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The AuthorizationPolicy principal matches frontend's real service-account identity
- frontend can call payments (no more RBAC 403) while unauthorized callers stay denied
- The wrong-principal root cause is confirmed via Envoy rbac debug logs
initial_state: 'The `frontend` can no longer call `payments`: every request returns RBAC: access denied
  (HTTP 403). A new AuthorizationPolicy on payments allows only a principal that doesn''t match frontend''s
  actual service-account identity, so legitimate traffic is denied by default.'
