description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `A DENY Policy Overrides the Intended ALLOW` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: Even after adding an ALLOW policy, `metrics` scraping to `app` is still 403. A separate DENY AuthorizationPolicy matches the same paths, and DENY is evaluated before ALLOW, so the deny wins.

  OBJECTIVE: Istio evaluates DENY policies before ALLOW, so a broad DENY policy shadows the intended ALLOW and blocks legitimate scraping. Narrow or remove the conflicting DENY policy (or exclude the metrics path) so the ALLOW takes effect for the scrape traffic. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'metrics scraping to app succeeds instead of 403'
- 'The DENY-before-ALLOW precedence is confirmed as root cause'
- 'The ALLOW policy governs the path after the DENY is narrowed'
initial_state: |-
  Even after adding an ALLOW policy, `metrics` scraping to `app` is still 403. A separate DENY AuthorizationPolicy matches the same paths, and DENY is evaluated before ALLOW, so the deny wins.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get authorizationpolicy -n app -o yaml`
        2. `istioctl proxy-config log deploy/app -n app`
        3. `curl -s http://app/metrics -o /dev/null -w '%{http_code}\n'`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get authorizationpolicy -n app -o yaml` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config log deploy/app -n app` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. Istio evaluates DENY policies before ALLOW, so a broad DENY policy shadows the intended ALLOW and blocks legitimate scraping. Narrow or remove the conflicting DENY policy (or exclude the metrics path) so the ALLOW takes effect for the scrape traffic.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
