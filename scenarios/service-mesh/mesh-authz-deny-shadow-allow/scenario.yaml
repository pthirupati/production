tasks:
- id: task_1
  title: 'A DENY Policy Overrides the Intended ALLOW'
  description: |-
    Restore healthy behavior for A DENY Policy Overrides the Intended ALLOW by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This service-mesh lab teaches how Istio AuthorizationPolicy evaluates DENY before ALLOW and why a broad DENY shadows an intended ALLOW through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-authz-deny-shadow-allow.conf carries the FIXED-OK marker.
solution:
  summary: |-
    Istio evaluates DENY policies before ALLOW, so a broad DENY policy shadows the intended ALLOW and blocks legitimate scraping. Narrow or remove the conflicting DENY policy (or exclude the metrics path) so the ALLOW takes effect for the scrape traffic.
  files_changed: []
  commands_run:
  - 'kubectl get authorizationpolicy -n app -o yaml'
  - 'istioctl proxy-config log deploy/app -n app'
  - 'curl -s http://app/metrics -o /dev/null -w ''%{http_code}\n'''
  reference_docs: service-mesh-fundamentals
