description: 'CONTEXT: A platform team operating service mesh needs you to resolve `mTLS STRICT Breaks
  a Plaintext Client` during a realistic delivery incident. The business impact is a stalled or unsafe
  release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline service-mesh lab with an Istio/Linkerd control plane,
  sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under
  /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.


  SYMPTOM / STARTING STATE: After enabling a mesh-wide PeerAuthentication with mTLS mode STRICT, the `legacy-batch`
  client (a non-mesh pod with no sidecar) can no longer reach `orders`: it gets connection resets. STRICT
  mode requires mutual TLS, and the plaintext client cannot present a mesh certificate.


  OBJECTIVE: The workload''s PeerAuthentication is STRICT, which rejects the plaintext connection from
  the sidecar-less legacy client. Remediate by setting mTLS to PERMISSIVE for the orders workload (accepts
  both mТLS and plaintext during migration) — or onboard the legacy client into the mesh — so the client
  connects while the migration completes. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The orders workload accepts the legacy plaintext client again (PERMISSIVE or client onboarded)
- legacy-batch reaches orders without connection resets
- The STRICT-vs-plaintext mismatch is confirmed as root cause (not a network/DNS issue)
