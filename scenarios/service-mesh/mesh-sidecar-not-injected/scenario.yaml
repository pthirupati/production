    script: check.sh
    error_message: The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root
      cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-sidecar-not-injected.conf
      carries the FIXED-OK marker.
solution:
  summary: The `shipping` namespace is missing the `istio-injection=enabled` label (or the pod has an
    opt-out annotation), so the sidecar injector webhook never added the proxy. Remediate by labeling
    the namespace for injection and restarting the workload so pods come up with the istio-proxy sidecar.
  files_changed: []
  commands_run:
  - kubectl get namespace shipping --show-labels
  - kubectl get pod -n shipping -o jsonpath='{.items[*].spec.containers[*].name}'
  - istioctl analyze -n shipping
  reference_docs: service-mesh-fundamentals
