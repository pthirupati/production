description: 'CONTEXT: A platform team operating service mesh needs you to resolve `Workload Has No Sidecar
  Injected` during a realistic delivery incident. The business impact is a stalled or unsafe release until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline service-mesh lab with an Istio/Linkerd control plane,
  sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under
  /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.


  SYMPTOM / STARTING STATE: The new `shipping` Deployment is not part of the mesh: its pods run a single
  container (no istio-proxy), so mTLS, telemetry, and routing policies do not apply. The namespace lacks
  the injection label, so the mutating webhook skipped these pods.


  OBJECTIVE: The `shipping` namespace is missing the `istio-injection=enabled` label (or the pod has an
  opt-out annotation), so the sidecar injector webhook never added the proxy. Remediate by labeling the
  namespace for injection and restarting the workload so pods come up with the istio-proxy sidecar. Success
  is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The shipping namespace is labeled for automatic sidecar injection
- shipping pods come up with the istio-proxy sidecar (2 containers)
- The missing injection label is confirmed as root cause via istioctl analyze
initial_state: 'The new `shipping` Deployment is not part of the mesh: its pods run a single container
