    the outcome with the checker.
  background: 'This service-mesh lab teaches automatic sidecar injection via the mutating webhook, the
    istio-injection namespace label, and why un-injected pods bypass the mesh through systematic troubleshooting:
    observe, hypothesize, change, verify.'
  validation:
