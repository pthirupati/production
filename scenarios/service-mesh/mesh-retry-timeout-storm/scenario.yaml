solution:
  summary: The retry `attempts` is high, the per-try timeout exceeds the overall timeout, and there is
    no retry budget, so each slow call spawns multiplied retries that overload inventory. Remediate by
    lowering retry attempts, setting a per-try timeout well under the overall timeout, and adding retryOn/backoff
    so retries relieve rather than amplify load.
  files_changed: []
  commands_run:
  - kubectl get virtualservice inventory -o yaml
  - istioctl proxy-config route deploy/frontend -o json
  - kubectl logs deploy/inventory --tail=20
  reference_docs: service-mesh-fundamentals
