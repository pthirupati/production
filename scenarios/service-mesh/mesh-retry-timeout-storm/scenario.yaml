description: 'CONTEXT: A platform team operating service mesh needs you to resolve `Retry/Timeout Misconfig
  Causes a Storm` during a realistic delivery incident. The business impact is a stalled or unsafe release
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline service-mesh lab with an Istio/Linkerd control plane,
  sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under
  /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.


  SYMPTOM / STARTING STATE: A brief `inventory` slowdown escalated into a full outage. The VirtualService
  sets a per-try timeout longer than the overall request timeout with a high retry count, so slow requests
  are retried aggressively, amplifying load on an already-struggling service — a retry storm / cascading
  failure.


  OBJECTIVE: The retry `attempts` is high, the per-try timeout exceeds the overall timeout, and there
  is no retry budget, so each slow call spawns multiplied retries that overload inventory. Remediate by
  lowering retry attempts, setting a per-try timeout well under the overall timeout, and adding retryOn/backoff
  so retries relieve rather than amplify load. Success is graded on the real repaired state, not a manual
  marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- Retry attempts and per-try timeout are tuned under the overall request timeout
- A transient inventory slowdown no longer amplifies into a retry storm
- The timeout/retry misconfiguration is confirmed as root cause
initial_state: A brief `inventory` slowdown escalated into a full outage. The VirtualService sets a per-try
  timeout longer than the overall request timeout with a high retry count, so slow requests are retried
  aggressively, amplifying load on an already-struggling service — a retry storm / cascading failure.
