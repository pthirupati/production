description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `Route Timeout Shorter Than Backend Latency` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: A report endpoint that legitimately takes 8s always returns 504 through the mesh. The VirtualService sets a 3s `timeout` on the route, so Envoy cancels the upstream before the backend can respond.

  OBJECTIVE: The VirtualService route `timeout` is shorter than the backend's real processing time, so Envoy times out and returns 504 before the response is ready. Raise the route timeout above the endpoint's real latency (or make the endpoint async) so slow-but-valid responses complete. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The slow report endpoint returns 200 instead of 504'
- 'The too-short route timeout is confirmed as root cause'
- 'The route completes within the corrected timeout'
initial_state: |-
  A report endpoint that legitimately takes 8s always returns 504 through the mesh. The VirtualService sets a 3s `timeout` on the route, so Envoy cancels the upstream before the backend can respond.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get virtualservice report -o yaml`
        2. `istioctl proxy-config route deploy/istio-ingressgateway -n istio-system -o json`
        3. `curl -s http://report/slow -o /dev/null -w '%{http_code} %{time_total}\n'`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get virtualservice report -o yaml` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config route deploy/istio-ingressgateway -n istio-system -o json` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The VirtualService route `timeout` is shorter than the backend's real processing time, so Envoy times out and returns 504 before the response is ready. Raise the route timeout above the endpoint's real latency (or make the endpoint async) so slow-but-valid responses complete.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
