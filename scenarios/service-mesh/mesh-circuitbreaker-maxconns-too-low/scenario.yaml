description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `Circuit Breaker Trips Under Normal Load` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: The `catalog` service returns 503 UO (upstream overflow) during ordinary traffic. Its DestinationRule connection pool caps `maxConnections` at 1 and pending requests at 1, so Envoy sheds normal concurrency as overflow.

  OBJECTIVE: The DestinationRule `trafficPolicy.connectionPool` limits are set far below real concurrency (maxConnections/http1MaxPendingRequests of 1), so Envoy trips the circuit breaker under normal load. Raise the connection-pool limits to match expected concurrency so legitimate traffic is not shed. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'catalog stops returning 503 upstream-overflow under normal load'
- 'The too-low connection-pool limits are confirmed as root cause'
- 'Concurrent requests succeed after the pool is right-sized'
initial_state: |-
  The `catalog` service returns 503 UO (upstream overflow) during ordinary traffic. Its DestinationRule connection pool caps `maxConnections` at 1 and pending requests at 1, so Envoy sheds normal concurrency as overflow.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get destinationrule catalog -o yaml`
        2. `istioctl proxy-config cluster deploy/catalog --fqdn catalog.default.svc.cluster.local -o json`
        3. `curl -s http://catalog/ -o /dev/null -w '%{http_code}\n'`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get destinationrule catalog -o yaml` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config cluster deploy/catalog --fqdn catalog.default.svc.cluster.local -o json` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The DestinationRule `trafficPolicy.connectionPool` limits are set far below real concurrency (maxConnections/http1MaxPendingRequests of 1), so Envoy trips the circuit breaker under normal load. Raise the connection-pool limits to match expected concurrency so legitimate traffic is not shed.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
