tasks:
- id: task_1
  title: 'Circuit Breaker Trips Under Normal Load'
  description: |-
    Restore healthy behavior for Circuit Breaker Trips Under Normal Load by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This service-mesh lab teaches how DestinationRule connection-pool limits implement circuit breaking in Envoy and why under-sized limits shed healthy traffic through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-circuitbreaker-maxconns-too-low.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The DestinationRule `trafficPolicy.connectionPool` limits are set far below real concurrency (maxConnections/http1MaxPendingRequests of 1), so Envoy trips the circuit breaker under normal load. Raise the connection-pool limits to match expected concurrency so legitimate traffic is not shed.
  files_changed: []
  commands_run:
  - 'kubectl get destinationrule catalog -o yaml'
  - 'istioctl proxy-config cluster deploy/catalog --fqdn catalog.default.svc.cluster.local -o json'
  - 'curl -s http://catalog/ -o /dev/null -w ''%{http_code}\n'''
  reference_docs: service-mesh-fundamentals
