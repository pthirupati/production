description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `Ingress Gateway Selector Matches No Pods` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: External traffic to the app returns 404 from the load balancer. The Gateway resource's `selector` labels do not match any ingressgateway pod, so its listener is never programmed and no route is served.

  OBJECTIVE: The Gateway `spec.selector` labels do not match the running ingressgateway deployment labels, so Istio never attaches the listener to a proxy. Correct the Gateway selector to match the ingressgateway pod labels so the listener is programmed and the VirtualService binds. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'External requests reach the app instead of a 404 from the gateway'
- 'The mismatched Gateway selector is confirmed as root cause'
- 'The listener is programmed on the ingressgateway after the selector is fixed'
initial_state: |-
  External traffic to the app returns 404 from the load balancer. The Gateway resource's `selector` labels do not match any ingressgateway pod, so its listener is never programmed and no route is served.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get gateway app-gw -o yaml`
        2. `istioctl proxy-config listener deploy/istio-ingressgateway -n istio-system`
        3. `kubectl -n istio-system get pods --show-labels | grep ingress`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get gateway app-gw -o yaml` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config listener deploy/istio-ingressgateway -n istio-system` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Gateway `spec.selector` labels do not match the running ingressgateway deployment labels, so Istio never attaches the listener to a proxy. Correct the Gateway selector to match the ingressgateway pod labels so the listener is programmed and the VirtualService binds.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
