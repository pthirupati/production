description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `Sidecar Resource Cuts Off a Dependency` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: The `checkout` pod can no longer reach `inventory` after an optimization. A namespace Sidecar resource restricts egress hosts to `./*` (same namespace only), so cross-namespace calls to inventory are dropped.

  OBJECTIVE: A Sidecar resource's `egress.hosts` was narrowed to the local namespace only, so cross-namespace dependencies are no longer in the proxy's config and calls fail. Add the required namespace/host to the Sidecar egress hosts so the dependency is reachable again. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'checkout can reach inventory across namespaces again'
- 'The over-narrow Sidecar egress.hosts is confirmed as root cause'
- 'The dependency is restored to the proxy config after egress hosts are widened'
initial_state: |-
  The `checkout` pod can no longer reach `inventory` after an optimization. A namespace Sidecar resource restricts egress hosts to `./*` (same namespace only), so cross-namespace calls to inventory are dropped.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get sidecar -A -o yaml`
        2. `istioctl proxy-config cluster deploy/checkout -n checkout | grep inventory`
        3. `kubectl -n checkout logs deploy/checkout -c istio-proxy --tail=30`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get sidecar -A -o yaml` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config cluster deploy/checkout -n checkout | grep inventory` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. A Sidecar resource's `egress.hosts` was narrowed to the local namespace only, so cross-namespace dependencies are no longer in the proxy's config and calls fail. Add the required namespace/host to the Sidecar egress hosts so the dependency is reachable again.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
