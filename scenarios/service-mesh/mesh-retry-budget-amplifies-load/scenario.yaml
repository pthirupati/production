  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get virtualservice catalog -o yaml`
        2. `istioctl proxy-config route deploy/istio-ingressgateway -n istio-system -o json`
        3. `curl -s http://catalog/ -o /dev/null -w '%{http_code} %{time_total}\n'`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get virtualservice catalog -o yaml` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config route deploy/istio-ingressgateway -n istio-system -o json` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The VirtualService retry policy is far too aggressive (10 attempts, no perTryTimeout), so transient 5xx errors amplify load and turn a brownout into an outage. Reduce attempts, set a perTryTimeout, and scope retryOn to idempotent, safe conditions so retries damp rather than amplify.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
