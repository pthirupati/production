description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `Aggressive Retries Amplify a Backend Brownout` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: A slow backend turns into a full outage. The VirtualService sets `retries: attempts 10` with no perTryTimeout and retries on 5xx, so a brownout multiplies into 10x load and collapses the service.

  OBJECTIVE: The VirtualService retry policy is far too aggressive (10 attempts, no perTryTimeout), so transient 5xx errors amplify load and turn a brownout into an outage. Reduce attempts, set a perTryTimeout, and scope retryOn to idempotent, safe conditions so retries damp rather than amplify. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Retry amplification no longer collapses the backend'
- 'The over-aggressive retry policy is confirmed as root cause'
- 'Retries are bounded with a perTryTimeout after the policy is fixed'
initial_state: |-
  A slow backend turns into a full outage. The VirtualService sets `retries: attempts 10` with no perTryTimeout and retries on 5xx, so a brownout multiplies into 10x load and collapses the service.
