    error_message: The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root
      cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-outlier-eject-flapping.conf
      carries the FIXED-OK marker.
solution:
  summary: '`outlierDetection` is tuned so tightly (consecutive5xxErrors: 1, high maxEjectionPercent,
    long baseEjectionTime) that transient errors evict nearly the whole small pool, causing flapping.
    Remediate by tuning the thresholds (raise consecutive errors, cap maxEjectionPercent, shorten ejection
    time) so only genuinely bad hosts are ejected.'
  files_changed: []
  commands_run:
  - kubectl get destinationrule catalog -o yaml
  - istioctl proxy-config cluster deploy/catalog --fqdn catalog.default.svc.cluster.local -o json
  - kubectl logs deploy/catalog --tail=20
  reference_docs: service-mesh-fundamentals
