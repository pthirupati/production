    \ catalog.default.svc.cluster.local -o json` to isolate the failing object.\n    3. State the single\
    \ root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. `outlierDetection` is tuned so tightly (consecutive5xxErrors:\
    \ 1, high maxEjectionPercent, long baseEjectionTime) that transient errors evict nearly the whole\
