description: 'CONTEXT: A platform team operating service mesh needs you to resolve `Outlier Detection
  Ejecting Healthy Pods` during a realistic delivery incident. The business impact is a stalled or unsafe
  release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline service-mesh lab with an Istio/Linkerd control plane,
  sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under
  /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.


  SYMPTOM / STARTING STATE: The `catalog` service is flapping: latency spikes and requests intermittently
  fail. The DestinationRule''s outlier detection is too aggressive — a single 5xx ejects a host for a
  long interval, and with few replicas it ejects most of the pool, then re-admits, then ejects again,
  causing oscillation.


  OBJECTIVE: `outlierDetection` is tuned so tightly (consecutive5xxErrors: 1, high maxEjectionPercent,
  long baseEjectionTime) that transient errors evict nearly the whole small pool, causing flapping. Remediate
  by tuning the thresholds (raise consecutive errors, cap maxEjectionPercent, shorten ejection time) so
  only genuinely bad hosts are ejected. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- outlierDetection thresholds are tuned to stop ejecting healthy hosts
- catalog stops flapping (stable endpoint set, no oscillation)
- The over-aggressive ejection config is confirmed as root cause
initial_state: 'The `catalog` service is flapping: latency spikes and requests intermittently fail. The
