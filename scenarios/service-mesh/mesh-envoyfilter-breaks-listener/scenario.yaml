tasks:
- id: task_1
  title: 'A Bad EnvoyFilter Breaks the Listener'
  description: |-
    Restore healthy behavior for A Bad EnvoyFilter Breaks the Listener by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This service-mesh lab teaches how EnvoyFilter patches the generated Envoy config and why a bad patch is NACKed and degrades the proxy through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-envoyfilter-breaks-listener.conf carries the FIXED-OK marker.
solution:
  summary: |-
    A custom EnvoyFilter uses an incorrect applyTo/match or malformed patch value, so Envoy NACKs the update and the listener is left broken. Correct (or remove) the EnvoyFilter patch so istiod pushes a valid config Envoy accepts, then verify the listener is programmed.
  files_changed: []
  commands_run:
  - 'kubectl get envoyfilter -A'
  - 'istioctl proxy-status'
  - 'kubectl -n istio-system logs deploy/istiod --tail=40 | grep -i nack'
  reference_docs: service-mesh-fundamentals
