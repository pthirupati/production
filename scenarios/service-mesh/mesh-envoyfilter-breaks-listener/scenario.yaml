description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `A Bad EnvoyFilter Breaks the Listener` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: After applying a custom EnvoyFilter, the ingressgateway stops serving traffic and istiod logs `Envoy NACK`. The filter patches a listener with a wrong `applyTo`/match, so Envoy rejects the config and keeps the last-good but degraded state.

  OBJECTIVE: A custom EnvoyFilter uses an incorrect applyTo/match or malformed patch value, so Envoy NACKs the update and the listener is left broken. Correct (or remove) the EnvoyFilter patch so istiod pushes a valid config Envoy accepts, then verify the listener is programmed. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The ingressgateway serves traffic again (no Envoy NACK)'
- 'The malformed EnvoyFilter patch is confirmed as root cause'
- 'istiod pushes an accepted config after the filter is fixed'
initial_state: |-
  After applying a custom EnvoyFilter, the ingressgateway stops serving traffic and istiod logs `Envoy NACK`. The filter patches a listener with a wrong `applyTo`/match, so Envoy rejects the config and keeps the last-good but degraded state.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get envoyfilter -A`
        2. `istioctl proxy-status`
        3. `kubectl -n istio-system logs deploy/istiod --tail=40 | grep -i nack`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get envoyfilter -A` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-status` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. A custom EnvoyFilter uses an incorrect applyTo/match or malformed patch value, so Envoy NACKs the update and the listener is left broken. Correct (or remove) the EnvoyFilter patch so istiod pushes a valid config Envoy accepts, then verify the listener is programmed.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
