  description: |-
    Restore healthy behavior for Traffic Mirror Accidentally Doubles Prod Writes by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This service-mesh lab teaches how VirtualService mirror/mirrorPercentage shadow traffic and why mirroring to prod duplicates side effects through systematic troubleshooting: observe, hypothesize, change, verify.
