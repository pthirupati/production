solution:
  summary: |-
    The VirtualService mirror destination points at the live production service instead of a dedicated shadow, so mirrored (fire-and-forget) requests still execute real writes. Repoint the mirror to a shadow/staging subset (and cap mirrorPercentage) so mirroring is safe and non-mutating.
  files_changed: []
  commands_run:
  - 'kubectl get virtualservice orders -o yaml'
  - 'istioctl proxy-config route deploy/istio-ingressgateway -n istio-system -o json'
  - 'kubectl logs deploy/orders --tail=30'
  reference_docs: service-mesh-fundamentals
