description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `VirtualService Names an Undefined Subset` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: Requests to `reviews` fail with `no healthy upstream`. The VirtualService routes 90% to subset `v2`, but the DestinationRule only defines `v1`, so Envoy has no cluster for v2 and drops the traffic.

  OBJECTIVE: The VirtualService references a subset (`v2`) that the DestinationRule never defines, so Envoy has no matching cluster and returns no healthy upstream. Add the `v2` subset (with its label selector) to the DestinationRule so the route resolves, then re-test. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Requests to the reviews service stop returning no healthy upstream'
- 'The undefined DestinationRule subset is confirmed as root cause'
- 'The v2 route resolves once the subset is defined'
