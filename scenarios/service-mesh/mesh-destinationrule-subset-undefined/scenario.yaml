solution:
  summary: |-
    The VirtualService references a subset (`v2`) that the DestinationRule never defines, so Envoy has no matching cluster and returns no healthy upstream. Add the `v2` subset (with its label selector) to the DestinationRule so the route resolves, then re-test.
  files_changed: []
  commands_run:
  - 'kubectl get virtualservice reviews -o yaml'
  - 'kubectl get destinationrule reviews -o yaml'
  - 'istioctl proxy-config cluster deploy/productpage'
  reference_docs: service-mesh-fundamentals
