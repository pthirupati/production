- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The VirtualService references a subset (`v2`) that the DestinationRule never defines, so Envoy has no matching cluster and returns no healthy upstream. Add the `v2` subset (with its label selector) to the DestinationRule so the route resolves, then re-test.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
