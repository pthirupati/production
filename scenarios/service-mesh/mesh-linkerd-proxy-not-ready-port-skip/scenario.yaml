    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-linkerd-proxy-not-ready-port-skip.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The workload lacks the linkerd `config.linkerd.io/skip-inbound-ports` (or probe port annotation), so the proxy intercepts the readiness probe before it is ready, failing startup. Annotate the workload to skip the probe port (or use the proxy-aware probe config) so the kubelet reaches the app directly, then restart.
  files_changed: []
  commands_run:
  - 'kubectl get pod -n web -o yaml'
  - 'linkerd check --proxy'
  - 'kubectl -n web logs deploy/web -c linkerd-proxy --tail=30'
  reference_docs: service-mesh-fundamentals
