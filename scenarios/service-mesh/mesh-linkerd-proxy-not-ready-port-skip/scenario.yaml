tasks:
- id: task_1
  title: 'Linkerd Proxy Blocks the App''s Startup Probe'
  description: |-
    Restore healthy behavior for Linkerd Proxy Blocks the App's Startup Probe by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This service-mesh lab teaches how Linkerd proxy port interception interacts with kubelet probes and why probe ports may need to be skipped during startup through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
