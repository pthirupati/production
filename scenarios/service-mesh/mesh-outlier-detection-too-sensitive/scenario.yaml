description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `Outlier Detection Ejects the Whole Service` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: Intermittent errors cascade into total unavailability for `ratings`. The DestinationRule outlierDetection ejects a host after 1 consecutive 5xx with maxEjectionPercent 100, so a brief blip ejects every endpoint at once.

  OBJECTIVE: The outlierDetection thresholds are hair-trigger (consecutive5xxErrors: 1, maxEjectionPercent: 100), so a transient error ejects all endpoints and the service goes fully down. Relax the thresholds and cap maxEjectionPercent so only genuinely unhealthy hosts are ejected. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'ratings stays available during transient errors'
- 'The over-sensitive outlierDetection is confirmed as root cause'
- 'Ejection is capped so not all endpoints are removed at once'
initial_state: |-
  Intermittent errors cascade into total unavailability for `ratings`. The DestinationRule outlierDetection ejects a host after 1 consecutive 5xx with maxEjectionPercent 100, so a brief blip ejects every endpoint at once.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get destinationrule ratings -o yaml`
        2. `istioctl proxy-config cluster deploy/reviews --fqdn ratings.default.svc.cluster.local -o json`
        3. `curl -s http://ratings/ -o /dev/null -w '%{http_code}\n'`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get destinationrule ratings -o yaml` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config cluster deploy/reviews --fqdn ratings.default.svc.cluster.local -o json` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The outlierDetection thresholds are hair-trigger (consecutive5xxErrors: 1, maxEjectionPercent: 100), so a transient error ejects all endpoints and the service goes fully down. Relax the thresholds and cap maxEjectionPercent so only genuinely unhealthy hosts are ejected.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
