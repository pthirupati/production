  - user: root
    password: lab123
tasks:
- id: task_1
  title: 'Outlier Detection Ejects the Whole Service'
  description: |-
    Restore healthy behavior for Outlier Detection Ejects the Whole Service by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This service-mesh lab teaches how Envoy outlier detection ejects unhealthy hosts and why over-sensitive thresholds cause a full-service ejection through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-outlier-detection-too-sensitive.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The outlierDetection thresholds are hair-trigger (consecutive5xxErrors: 1, maxEjectionPercent: 100), so a transient error ejects all endpoints and the service goes fully down. Relax the thresholds and cap maxEjectionPercent so only genuinely unhealthy hosts are ejected.
  files_changed: []
  commands_run:
  - 'kubectl get destinationrule ratings -o yaml'
  - 'istioctl proxy-config cluster deploy/reviews --fqdn ratings.default.svc.cluster.local -o json'
  - 'curl -s http://ratings/ -o /dev/null -w ''%{http_code}\n'''
  reference_docs: service-mesh-fundamentals
