description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `Canary Header Route Never Matches` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: A canary meant to route users with header `x-canary: true` to v2 sends everyone to v1. The VirtualService match uses `exact: 'true '` (trailing space) so the header condition never matches real requests.

  OBJECTIVE: The VirtualService header match value has a typo/trailing whitespace, so no request ever satisfies the canary condition and all traffic falls through to the default v1 route. Correct the header match value so canary requests match and route to v2. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Requests with the canary header route to v2'
- 'The header-match typo is confirmed as root cause'
- 'Non-canary traffic still routes to v1 after the match is fixed'
initial_state: |-
  A canary meant to route users with header `x-canary: true` to v2 sends everyone to v1. The VirtualService match uses `exact: 'true '` (trailing space) so the header condition never matches real requests.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl get virtualservice frontend -o yaml`
        2. `istioctl proxy-config route deploy/istio-ingressgateway -n istio-system`
        3. `curl -s -H 'x-canary: true' http://frontend/ -o /dev/null -w '%{http_code}\n'`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get virtualservice frontend -o yaml` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config route deploy/istio-ingressgateway -n istio-system` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The VirtualService header match value has a typo/trailing whitespace, so no request ever satisfies the canary condition and all traffic falls through to the default v1 route. Correct the header match value so canary requests match and route to v2.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
