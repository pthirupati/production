        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl get authorizationpolicy -n orders -o yaml` and read the status/error carefully.
        2. Cross-check with `istioctl proxy-config log deploy/orders -n orders` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. An ALLOW AuthorizationPolicy on `orders` enumerates allowed source principals but omits checkout's service-account SPIFFE identity, so the implicit deny rejects it. Add checkout's principal to the policy's `from.source.principals` so the legitimate caller is authorized.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
