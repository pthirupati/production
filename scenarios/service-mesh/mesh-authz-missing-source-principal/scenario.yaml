tasks:
- id: task_1
  title: 'AuthorizationPolicy Blocks a Valid Caller'
  description: |-
    Restore healthy behavior for AuthorizationPolicy Blocks a Valid Caller by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This service-mesh lab teaches how AuthorizationPolicy ALLOW rules and SPIFFE source principals gate service-to-service calls and why a missing principal denies a caller through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/mesh-authz-missing-source-principal.conf carries the FIXED-OK marker.
solution:
  summary: |-
    An ALLOW AuthorizationPolicy on `orders` enumerates allowed source principals but omits checkout's service-account SPIFFE identity, so the implicit deny rejects it. Add checkout's principal to the policy's `from.source.principals` so the legitimate caller is authorized.
  files_changed: []
  commands_run:
  - 'kubectl get authorizationpolicy -n orders -o yaml'
  - 'istioctl proxy-config log deploy/orders -n orders'
  - 'kubectl -n checkout get sa'
  reference_docs: service-mesh-fundamentals
