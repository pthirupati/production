description: |-
  CONTEXT: A platform team operating service mesh needs you to resolve `AuthorizationPolicy Blocks a Valid Caller` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline service-mesh lab with an Istio/Linkerd control plane, sidecar-injected workloads, and mesh CRDs (VirtualService, DestinationRule, AuthorizationPolicy) under /mesh. The mesh runs locally; no cloud load balancer or paid APIs are required.

  SYMPTOM / STARTING STATE: The `orders` service returns 403 (RBAC denied) when called by `checkout`. An ALLOW AuthorizationPolicy lists source principals but omits checkout's service account, so its requests are denied by the default-deny that the policy creates.

  OBJECTIVE: An ALLOW AuthorizationPolicy on `orders` enumerates allowed source principals but omits checkout's service-account SPIFFE identity, so the implicit deny rejects it. Add checkout's principal to the policy's `from.source.principals` so the legitimate caller is authorized. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'checkout can call orders without an RBAC 403'
- 'The missing source principal is confirmed as root cause'
- 'The policy authorizes checkout after its principal is added'
initial_state: |-
