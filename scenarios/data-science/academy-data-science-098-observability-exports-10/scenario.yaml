objectives:
- Day-2 data exports work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but data exports lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — export code and output files.

    2. Write down what looks normal versus wrong or missing for data exports.

    3. Recall the core idea: file formats, encoding, and schemas. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for data exports.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — export code and output files.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a
    sensible threshold.

    3. Verify the result — exports match the target schema.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-data-science-098-observability-exports-10.conf`,
    then click Check Solution.'
