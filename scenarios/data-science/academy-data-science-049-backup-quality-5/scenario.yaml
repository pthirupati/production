title: 'Data Science & Analytics: Data Quality — Backup and Recovery'
slug: academy-data-science-049-backup-quality-5
technology: Data Science & Analytics
category: Backup & Recovery
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Backup and recovery drill for data quality. Ensure backups run on schedule,
  retention is correct, and you can restore validation rules and monitoring within
  the lab RTO.
objectives:
- Backup coverage for data quality is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for data quality. Leadership
  wants proof that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — quality checks and failures.

    2. Write down what looks normal versus wrong or missing for data quality.

    3. Recall the core idea: validation rules and monitoring. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for data quality.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — quality checks and failures.

    2. Repair or run the backup job, then perform a controlled restore into a scratch
    location to prove it works.

    3. Verify the result — quality checks catch bad data.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-data-science-049-backup-quality-5.conf`,
    then click Check Solution.'
