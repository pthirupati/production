title: Trailing Moving Average of a Time Series
slug: ds-moving-average-summary
technology: data-science
category: Data Science & Analytics
description: An analytics helper should compute the trailing moving average of a numeric series over a
  window of size k, but the starter's window is off by one — it includes one extra future-looking value
  and divides by the wrong count, so every smoothed point is wrong. Fix the window math.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Build sliding windows over a numeric series
- Use statistics.mean to average each window
- Handle the warm-up region and short series correctly
initial_state: An analytics helper should compute the trailing moving average of a numeric series over a
  window of size k, but the starter's window slicing is off by one and it divides by k even before k
  points exist, so every smoothed value is wrong. Fix the window so each output averages the current
  point and the k-1 points before it.
solution_explanation: |
  A trailing moving average at index i should average values[i-k+1 .. i] (the current point and the k-1
  before it), using statistics.mean over exactly the points available. For indices before k-1 points
  exist, average just the points seen so far. The starter sliced values[i:i+k] (looking FORWARD) and
  always divided by k, producing wrong, future-leaking values.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix solution(values, k): return a list the SAME length as values where element i is the trailing
    moving average over the window ending at i — that is, mean of values[max(0, i-k+1) .. i].
      moving([1,2,3,4], 2) -> [1.0, 1.5, 2.5, 3.5]
    Window must look BACKWARD, never forward, and short windows average only the points available.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      import statistics

      def solution(values, k):
          out = []
          for i in range(len(values)):
              # BUG: this looks FORWARD (values[i:i+k]) and divides by a fixed k,
              # so it leaks future points and mishandles the series tail/warm-up.
              window = values[i:i + k]
              out.append(sum(window) / k)
          return out
    readonly: false
  visible_tests:
  - name: window of 2
    code: |
      assert solution([1, 2, 3, 4], 2) == [1.0, 1.5, 2.5, 3.5], solution([1, 2, 3, 4], 2)
  - name: window of 1 is identity
    code: |
      assert solution([5, 6, 7], 1) == [5.0, 6.0, 7.0], solution([5, 6, 7], 1)
  hidden_tests:
  - name: window of 3 with warm-up
    code: |
      assert solution([2, 4, 6, 8, 10], 3) == [2.0, 3.0, 4.0, 6.0, 8.0], solution([2, 4, 6, 8, 10], 3)
  - name: window larger than series
    code: |
      assert solution([10, 20], 5) == [10.0, 15.0], solution([10, 20], 5)
  - name: same length as input
    code: |
      vals = [1, 3, 5, 7, 9, 11]
      assert len(solution(vals, 4)) == len(vals), solution(vals, 4)
  - name: empty series
    code: |
      assert solution([], 3) == [], solution([], 3)
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Compare against [1.0, 1.5, 2.5, 3.5] for moving([1,2,3,4], 2). Your values use points AFTER i, not before.
- order: 2
  cost: 20
  content: 'The trailing window ending at i is values[max(0, i-k+1) : i+1]. Average exactly those, not a fixed k.'
- order: 3
  cost: 30
  content: 'window = values[max(0, i - k + 1) : i + 1]; out.append(statistics.mean(window)).'
