title: Sum Sales by Region from a CSV
slug: ds-csv-group-totals
technology: data-science
category: Fix
description: 'CONTEXT: A team operating data science has raised a ticket for `Sum Sales by Region from
  a CSV`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline notebook lab. The architecture is a single lab-primary
  node exposing pandas/notebook workflows, joins, and charts; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A finance script reads a CSV of sales rows and should return the total amount
  per region, but the starter overwrites each region''s total with the latest row instead of accumulating,
  so every region ends up showing only its last sale. Fix the aggregation so totals add up.


  OBJECTIVE: Parse CSV text with the csv module; Group rows by a key and accumulate a numeric total; Return
  a dict of region -> summed amount. Acceptance criteria: the change is minimal and reversible, and success
  means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant pandas/notebook workflows, joins, and charts), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
