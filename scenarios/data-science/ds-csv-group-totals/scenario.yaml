title: Sum Sales by Region from a CSV
slug: ds-csv-group-totals
technology: data-science
category: Data Science & Analytics
description: A finance script reads a CSV of sales rows and should return the total amount per region,
  but the starter keeps overwriting each region's total with the latest row instead of accumulating,
  so every region ends up showing only its last sale. Fix the aggregation so totals add up.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Low
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Parse CSV text with the csv module
- Group rows by a key and accumulate a numeric total
- Return a dict of region -> summed amount
initial_state: A finance script reads a CSV of sales rows and should return the total amount per region,
  but the starter overwrites each region's total with the latest row instead of accumulating, so every
  region ends up showing only its last sale. Fix the aggregation so totals add up.
solution_explanation: |
  Assigning totals[region] = amount on every row discards whatever was already summed for that region.
  Use totals[region] = totals.get(region, 0) + amount (or a collections.defaultdict(float)) so each row's
  amount is added to the running total instead of replacing it.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix solution(csv_text): it receives a CSV string with a header row "region,amount" and must return a
    dict mapping each region to the SUM of its amounts (as a float).
      "region,amount\nEast,10\nWest,5\nEast,2" -> {"East": 12.0, "West": 5.0}
    The starter overwrites instead of accumulating — make it add.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      import csv
      import io

      def solution(csv_text):
          totals = {}
          reader = csv.DictReader(io.StringIO(csv_text))
          for row in reader:
              region = row["region"]
              amount = float(row["amount"])
              # BUG: this REPLACES the running total with the latest row's amount
              # instead of adding to it, so each region keeps only its last sale.
              totals[region] = amount
          return totals
    readonly: false
  visible_tests:
  - name: accumulates repeated regions
    code: |
      r = solution("region,amount\nEast,10\nWest,5\nEast,2")
      assert r == {"East": 12.0, "West": 5.0}, r
  - name: single row per region
    code: |
      r = solution("region,amount\nNorth,7\nSouth,3")
      assert r == {"North": 7.0, "South": 3.0}, r
  hidden_tests:
  - name: many rows one region
    code: |
      r = solution("region,amount\nA,1\nA,2\nA,3\nA,4")
      assert r == {"A": 10.0}, r
  - name: empty body returns empty dict
    code: |
      r = solution("region,amount\n")
      assert r == {}, r
  - name: float amounts sum precisely enough
    code: |
      r = solution("region,amount\nX,1.5\nX,2.25\nY,0.25")
      assert abs(r["X"] - 3.75) < 1e-9 and abs(r["Y"] - 0.25) < 1e-9, r
  - name: values are floats not strings
    code: |
      r = solution("region,amount\nQ,5")
      assert isinstance(r["Q"], float), type(r["Q"])
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Print totals after each row — you will see each region only ever holds the amount from its most recent row.
- order: 2
  cost: 20
  content: You are assigning (=) the new amount, which throws away the running sum. You want to add to what is already there.
- order: 3
  cost: 30
  content: 'Use totals[region] = totals.get(region, 0.0) + amount, or a collections.defaultdict(float).'
