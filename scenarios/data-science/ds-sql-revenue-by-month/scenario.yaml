title: Monthly Revenue with a Running Total (SQL)
slug: ds-sql-revenue-by-month
technology: data-science
category: Fix
description: 'CONTEXT: A team operating data science needs you to resolve `Monthly Revenue with a Running
  Total (SQL)` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline notebook lab with pandas/notebook workflows, joins,
  and charts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An analytics query should report revenue per month plus a running cumulative
  total, but the starter omits GROUP BY (collapsing all sales into one row) and its window frame is wrong.
  Fix it so each row is (month ''YYYY-MM'', monthly_revenue, running_total) ordered by month ascending,
  where running_total is the cumulative sum of monthly_revenue through that month. An analytics query
  should report revenue per calendar month plus a running cumulative total, but the starter forgets to
  GROUP BY month (so it sums everything into one row) and its window frame is unbounded on the wrong side.
  Fix the GROUP BY aggregation and the running-total window.


  OBJECTIVE: Bucket rows into months with strftime and GROUP BY; Aggregate revenue per month with SUM;
  Add a cumulative running total with a window function. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: High
time_limit: 1500
