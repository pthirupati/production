initial_state: An analytics query should report revenue per month plus a running cumulative total, but
  the starter omits GROUP BY (collapsing all sales into one row) and its window frame is wrong. Fix it
  so each row is (month 'YYYY-MM', monthly_revenue, running_total) ordered by month ascending, where running_total
  is the cumulative sum of monthly_revenue through that month.
solution_explanation: 'SELECT the month bucket with strftime(''%Y-%m'', sold_at), SUM(amount) AS monthly_revenue,
  GROUP BY that

  bucket, ORDER BY it. The running total is SUM(SUM(amount)) OVER (ORDER BY the month ROWS BETWEEN

  UNBOUNDED PRECEDING AND CURRENT ROW) — a window over the grouped aggregate. The starter omitted GROUP

  BY (so every sale collapsed into a single row) and used the wrong frame, giving a flat or wrong total.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix solution(conn): the `sales` table has columns (id, sold_at TEXT 'YYYY-MM-DD', amount\
    \ REAL).\nReturn rows of (month, monthly_revenue, running_total) where month is 'YYYY-MM', monthly_revenue\
    \ is\nthe SUM of amount in that month, and running_total is the cumulative sum of monthly_revenue\
    \ from the\nfirst month through the current one. Order by month ascending.\n  Two Jan sales of 10\
    \ and 5, one Feb sale of 20 ->\n    [('2024-01', 15.0, 15.0), ('2024-02', 20.0, 35.0)]\nClick Run\
    \ to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "import sqlite3\n\ndef solution(conn):\n    # BUG: no GROUP BY, so SUM collapses every sale\
      \ into ONE row; and the\n    # window frame looks at FOLLOWING rows instead of preceding ones.\n\
      \    return conn.execute(\n        \"\"\"\n        SELECT strftime('%Y-%m', sold_at) AS month,\n\
      \               SUM(amount) AS monthly_revenue,\n               SUM(SUM(amount)) OVER (\n      \
      \             ORDER BY strftime('%Y-%m', sold_at)\n                   ROWS BETWEEN CURRENT ROW AND\
      \ UNBOUNDED FOLLOWING\n               ) AS running_total\n        FROM sales\n        ORDER BY month\n\
      \        \"\"\"\n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: groups by month with running total
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript(\n    \"CREATE TABLE\
      \ sales (id INTEGER PRIMARY KEY, sold_at TEXT, amount REAL);\"\n    \"INSERT INTO sales (sold_at,\
      \ amount) VALUES \"\n    \"('2024-01-05', 10.0), ('2024-01-20', 5.0), ('2024-02-10', 20.0);\"\n\
      )\nassert solution(conn) == [\n    ('2024-01', 15.0, 15.0), ('2024-02', 20.0, 35.0)], solution(conn)\n"
  - name: single month single row
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript(\n    \"CREATE TABLE\
      \ sales (id INTEGER PRIMARY KEY, sold_at TEXT, amount REAL);\"\n    \"INSERT INTO sales (sold_at,\
      \ amount) VALUES ('2024-03-01', 7.0), ('2024-03-31', 3.0);\"\n)\nassert solution(conn) == [('2024-03',\
      \ 10.0, 10.0)], solution(conn)\n"
  hidden_tests:
  - name: running total accumulates across three months
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript(\n    \"CREATE TABLE\
      \ sales (id INTEGER PRIMARY KEY, sold_at TEXT, amount REAL);\"\n    \"INSERT INTO sales (sold_at,\
      \ amount) VALUES \"\n    \"('2024-01-01', 100.0), ('2024-02-01', 50.0), ('2024-03-01', 25.0);\"\n\
      )\nassert solution(conn) == [\n    ('2024-01', 100.0, 100.0),\n    ('2024-02', 50.0, 150.0),\n \
      \   ('2024-03', 25.0, 175.0)], solution(conn)\n"
  - name: months come back in ascending order even if inserted out of order
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript(\n    \"CREATE TABLE\
      \ sales (id INTEGER PRIMARY KEY, sold_at TEXT, amount REAL);\"\n    \"INSERT INTO sales (sold_at,\
      \ amount) VALUES \"\n    \"('2024-12-01', 4.0), ('2024-01-01', 1.0), ('2024-06-01', 2.0);\"\n)\n\
      rows = solution(conn)\nassert [r[0] for r in rows] == ['2024-01', '2024-06', '2024-12'], rows\n\
      assert rows[-1][2] == 7.0, rows\n"
  - name: empty table yields no rows
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript(\n    \"CREATE TABLE\
      \ sales (id INTEGER PRIMARY KEY, sold_at TEXT, amount REAL);\"\n)\nassert solution(conn) == [],\
      \ solution(conn)\n"
  timeout: 8
