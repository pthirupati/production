category: Fix
description: 'CONTEXT: A team operating data science has raised a ticket for `Monthly Revenue with a Running
  Total (SQL)`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline notebook lab. The architecture is a single lab-primary
  node exposing pandas/notebook workflows, joins, and charts; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: An analytics query should report revenue per month plus a running cumulative
  total, but the starter omits GROUP BY (collapsing all sales into one row) and its window frame is wrong.
  Fix it so each row is (month ''YYYY-MM'', monthly_revenue, running_total) ordered by month ascending,
  where running_total is the cumulative sum of monthly_revenue through that month.

  OBJECTIVE: Bucket rows into months with strftime and GROUP BY; Aggregate revenue per month with SUM;
  Add a cumulative running total with a window function. Acceptance criteria: the change is minimal and
  reversible, and success means all hidden tests pass.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant pandas/notebook workflows, joins, and charts), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.

  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
