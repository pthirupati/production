slug: ds-dashboard-avg-not-sum
title: "Fix the Wrong Aggregation: Average, Not Sum"
technology: Data Science & Analytics
category: Dashboards
difficulty: easy
lab_mode: simulation
simulation_type: data-dashboard
coding_mode: false
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: Medium
is_free: true
description: |
  A colleague built a "score by subject" dashboard from the exam_scores dataset,
  but they summed the scores. Summing exam scores is meaningless — a subject with
  more students looks better purely because it has more rows, not because students
  did better. The dashboard should show the AVERAGE score per subject.

  The dimension (subject), measure (score), and chart type (bar) are already
  correct. Your only job is to fix the aggregation so the bars show the true
  average score for each subject.
objectives:
  - Inspect the pre-built dashboard and notice the aggregation is 'sum'
  - Change the aggregation to 'avg' (average) so each bar is the mean score
  - Keep dimension 'subject', measure 'score', and chart type 'bar'
initial_state: |
  The dashboard opens pre-configured with dimension 'subject', measure 'score',
  chart type 'bar', and aggregation 'sum' (the bug). Math has 3 scores
  (90, 70, 80 -> avg 80), Science has 3 (60, 100, 80 -> avg 80), History has 2
  (75, 85 -> avg 80). Summed they read 240/240/160, which is misleading.
hints:
  - order: 1
    cost: 10
    content: "Open the aggregation control — it is currently set to 'sum'. Summing scores rewards subjects that simply have more students, not better performance."
  - order: 2
    cost: 15
    content: "The correct statistic for comparing exam performance is the mean. Set the aggregation to 'avg'."
  - order: 3
    cost: 20
    content: "Leave the dimension ('subject'), measure ('score'), and chart type ('bar') unchanged — only the aggregation was wrong. After switching to 'avg' all three subjects average 80."
