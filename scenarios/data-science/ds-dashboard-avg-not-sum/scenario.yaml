description: 'CONTEXT: A team operating data science needs you to resolve `Fix the Wrong Aggregation:
  Average, Not Sum` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline notebook lab with pandas/notebook workflows, joins,
  and charts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The dashboard opens pre-configured with dimension ''subject'', measure ''score'',

  chart type ''bar'', and aggregation ''sum'' (the bug). Math has 3 scores

  (90, 70, 80 -> avg 80), Science has 3 (60, 100, 80 -> avg 80), History has 2

  (75, 85 -> avg 80). Summed they read 240/240/160, which is misleading. A colleague built a "score by
  subject" dashboard from the exam_scores dataset,

  but they summed the scores. Summing exam scores is meaningless — a subject with

  more students looks better purely because it has more rows, not because students

  did better. The dashboard should show the AVERAGE score per subject.


  The dimension (subject), measure (score), and chart type (bar) are already

  correct. Your only job is to fix the aggregation so the bars show the true

  average score for each subject.


  OBJECTIVE: Inspect the pre-built dashboard and notice the aggregation is ''sum''; Change the aggregation
  to ''avg'' (average) so each bar is the mean score; Keep dimension ''subject'', measure ''score'', and
  chart type ''bar''. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
