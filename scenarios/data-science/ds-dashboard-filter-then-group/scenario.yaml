description: 'CONTEXT: A team operating data science has raised a ticket for `Filter Then Group: Completed
  Order Value by Category`. A customer-facing workflow is degraded and the on-call engineer (you) must
  diagnose and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline notebook lab. The architecture is a single lab-primary
  node exposing pandas/notebook workflows, joins, and charts; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A fresh dashboard with no filter, dimension, measure, aggregation, or chart
  set.

  The orders dataset has 9 rows. After filtering to completed orders, summing

  amount per category gives Books 65, Electronics 500, Toys 30. Cancelled orders

  (Books 99, Electronics 450, Toys 15) must NOT be included.


  OBJECTIVE: Filter the dataset to status = ''completed'' (exclude cancelled orders); Group by ''category''
  and sum the ''amount'' measure; Render the result as a bar chart. Acceptance criteria: the change is
  minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant pandas/notebook workflows, joins, and charts), changing one thing at a time. Check
  your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
