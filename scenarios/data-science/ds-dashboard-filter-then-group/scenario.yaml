description: 'CONTEXT: A team operating data science needs you to resolve `Filter Then Group: Completed
  Order Value by Category` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline notebook lab with pandas/notebook workflows, joins,
  and charts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A fresh dashboard with no filter, dimension, measure, aggregation, or chart
  set.

  The orders dataset has 9 rows. After filtering to completed orders, summing

  amount per category gives Books 65, Electronics 500, Toys 30. Cancelled orders

  (Books 99, Electronics 450, Toys 15) must NOT be included. Finance wants total order value per product
  category, but cancelled orders are

  inflating the totals. The orders dataset has a ''status'' column (completed or

  cancelled). You must FILTER the data to completed orders first, then GROUP by

  category and sum the amount, shown as a bar chart.


  Order of operations matters: if you group without filtering, cancelled orders

  are counted and the totals are wrong. Apply the filter, set the right

  dimension/measure/aggregation, and choose a bar chart.


  OBJECTIVE: Filter the dataset to status = ''completed'' (exclude cancelled orders); Group by ''category''
  and sum the ''amount'' measure; Render the result as a bar chart. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
