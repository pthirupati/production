title: Clean a Series — Dedupe then Drop Outliers
slug: ds-dedupe-and-outliers
technology: data-science
category: Data Science & Analytics
description: A cleaning step should remove duplicate readings (keeping first occurrence and original
  order) and then drop outliers more than 2 population standard deviations from the mean, but the starter
  dedupes with a set (destroying order) and compares against the WRONG statistics with a loose 3-sigma
  bound. Fix the cleaning pipeline.
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: High
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Deduplicate while preserving first-seen order
- Compute mean and population stdev on the deduped data
- Keep only points within 2 standard deviations of the mean
initial_state: A cleaning step should remove duplicate readings (keep first occurrence, preserve order)
  and then drop outliers more than 2 population standard deviations from the mean of the deduped data,
  but the starter dedupes with set() (losing order) and thresholds against the raw, not-deduped stats.
  Fix it so dedupe preserves order and the outlier bound uses the deduped mean and stdev.
solution_explanation: |
  Step 1 dedupe preserving order: iterate and keep values whose first occurrence you have not seen
  (a seen-set guards membership, but you append in encounter order — never iterate a set, which loses
  order). Step 2: compute statistics.mean and statistics.pstdev of the DEDUPED values, then keep each x
  with abs(x - mean) <= 2 * stdev. If stdev is 0 every point is within bound and all are kept.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix solution(values): first remove duplicates keeping the FIRST occurrence and ORIGINAL order, then
    from those deduped values drop any point whose distance from the (deduped) mean is MORE than two
    population standard deviations. Return the surviving values in their original order.
      clean([10, 10, 11, 9, 12, 8, 80]) -> [10, 11, 9, 12, 8]   (drops the duplicate 10 and the outlier 80)
    If the standard deviation is 0, keep everything. Click Run, then Check Solution to grade.
  files:
  - path: solution.py
    content: |
      import statistics

      def solution(values):
          # BUG 1: set() destroys the original order (and is unordered on iteration).
          deduped = list(set(values))
          if not deduped:
              return []
          # BUG 2: thresholds use the RAW input stats, not the deduped data,
          # and use a loose 3-sigma bound instead of the required 2 sigma.
          mean = statistics.mean(values)
          sd = statistics.pstdev(values)
          return [x for x in deduped if abs(x - mean) <= 3 * sd]
    readonly: false
  visible_tests:
  - name: dedupes preserving order and drops an outlier
    code: |
      assert solution([10, 10, 11, 9, 12, 8, 80]) == [10, 11, 9, 12, 8], solution([10, 10, 11, 9, 12, 8, 80])
  - name: no duplicates no outliers keeps all in order
    code: |
      assert solution([4, 5, 6, 5.5, 4.5]) == [4, 5, 6, 5.5, 4.5], solution([4, 5, 6, 5.5, 4.5])
  hidden_tests:
  - name: all identical values stdev zero keeps all unique
    code: |
      assert solution([7, 7, 7, 7]) == [7], solution([7, 7, 7, 7])
  - name: preserves first occurrence order not sorted set order
    code: |
      assert solution([3, 1, 2, 1, 3]) == [3, 1, 2], solution([3, 1, 2, 1, 3])
  - name: empty input
    code: |
      assert solution([]) == [], solution([])
  - name: dedupe happens before the outlier check
    code: |
      # After deduping, [5, 5, 5, 5, 9] becomes [5, 9]: mean 7, pstdev 2, both within
      # 2 sigma, so both survive — in their original first-seen order.
      assert solution([5, 5, 5, 5, 9]) == [5, 9], solution([5, 5, 5, 5, 9])
  - name: single value survives
    code: |
      assert solution([42]) == [42], solution([42])
  timeout: 8
hints:
- order: 1
  cost: 10
  content: list(set(values)) returns the values in arbitrary order and loses the original sequence — your output order is wrong.
- order: 2
  cost: 20
  content: Dedupe by walking the list with a seen set and appending only first occurrences. Then compute mean and pstdev on the DEDUPED list, and use a 2-sigma bound.
- order: 3
  cost: 30
  content: 'Keep x when abs(x - statistics.mean(deduped)) <= 2 * statistics.pstdev(deduped); when pstdev is 0, keep all.'
