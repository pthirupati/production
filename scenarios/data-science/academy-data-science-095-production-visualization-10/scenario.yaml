hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the chart and its encoding.

    2. Write down what looks normal versus wrong or missing for visualization.

    3. Recall the core idea: chart choice, scales, and labels. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for visualization.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the chart and its encoding.

    2. Apply production standards for visualization: resource limits, monitoring,
    access controls, and a written rollback step.

    3. Verify the result — the chart conveys the data accurately.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-data-science-095-production-visualization-10.conf`,
    then click Check Solution.'
