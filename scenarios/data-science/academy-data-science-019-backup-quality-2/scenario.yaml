description: 'CONTEXT: A team operating data science needs you to resolve `data-science: Data Quality
  — Backup and Recovery` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline notebook lab with pandas/notebook workflows, joins,
  and charts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for data quality. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for data
  quality. Ensure backups run on schedule, retention is correct, and you can restore validation rules
  and monitoring within the lab RTO.


  OBJECTIVE: Backup coverage for data quality is complete and restorable; Retention and encryption meet
  the stated policy; A restore drill proves data integrity. Success means `systemctl is-active nginx`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for data quality is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for data quality. Leadership wants proof
  that restore works — not just that scripts exit zero.
