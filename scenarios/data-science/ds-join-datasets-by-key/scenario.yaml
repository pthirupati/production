title: Inner-Join Two Datasets on a Key
slug: ds-join-datasets-by-key
technology: data-science
category: Data Science & Analytics
description: A report enriches order rows with the customer's city by joining two lists on customer_id,
  but the starter uses a nested scan that keeps the FIRST customer match it finds and never stops, so
  orders get attached to the wrong city when ids repeat or are missing. Build a correct keyed join.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Index one dataset by its key for O(1) lookup
- Inner-join: emit a row only when the key exists on both sides
- Carry the right fields from each side into the joined row
initial_state: A report enriches order rows with the customer's city by joining two lists on customer_id,
  but the starter's nested scan grabs the wrong customer (it does not match the id correctly) and emits
  orders even when no customer matches. Build an inner join keyed on customer_id.
solution_explanation: |
  Build a dict mapping customer_id -> city first, then iterate orders and look each id up. Emit a joined
  row {"order_id", "city"} ONLY when the id is present in the customer index (inner join). The starter
  matched on the wrong condition and emitted unmatched orders, attaching wrong or missing cities.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix solution(orders, customers): orders is a list of {"order_id", "customer_id"}; customers is a list
    of {"customer_id", "city"}. Return a list of {"order_id", "city"} for every order whose customer_id
    matches a customer (INNER join), preserving the order of `orders`. Drop orders with no matching customer.
      orders=[{"order_id":1,"customer_id":7}], customers=[{"customer_id":7,"city":"NYC"}]
        -> [{"order_id":1,"city":"NYC"}]
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      def solution(orders, customers):
          out = []
          for o in orders:
              city = None
              for c in customers:
                  # BUG: this matches on the wrong field and never breaks, so the
                  # LAST customer wins and orders with no match still get emitted.
                  if c["customer_id"] or True:
                      city = c["city"]
              out.append({"order_id": o["order_id"], "city": city})
          return out
    readonly: false
  visible_tests:
  - name: joins matching ids
    code: |
      orders = [{"order_id": 1, "customer_id": 7}, {"order_id": 2, "customer_id": 8}]
      customers = [{"customer_id": 7, "city": "NYC"}, {"customer_id": 8, "city": "LA"}]
      assert solution(orders, customers) == [
          {"order_id": 1, "city": "NYC"}, {"order_id": 2, "city": "LA"}], solution(orders, customers)
  - name: drops unmatched order
    code: |
      orders = [{"order_id": 1, "customer_id": 7}, {"order_id": 2, "customer_id": 99}]
      customers = [{"customer_id": 7, "city": "NYC"}]
      assert solution(orders, customers) == [{"order_id": 1, "city": "NYC"}], solution(orders, customers)
  hidden_tests:
  - name: preserves order of orders
    code: |
      orders = [{"order_id": 3, "customer_id": 2}, {"order_id": 1, "customer_id": 1}]
      customers = [{"customer_id": 1, "city": "A"}, {"customer_id": 2, "city": "B"}]
      assert solution(orders, customers) == [
          {"order_id": 3, "city": "B"}, {"order_id": 1, "city": "A"}], solution(orders, customers)
  - name: many orders share one customer
    code: |
      orders = [{"order_id": 1, "customer_id": 5}, {"order_id": 2, "customer_id": 5}]
      customers = [{"customer_id": 5, "city": "SF"}]
      assert solution(orders, customers) == [
          {"order_id": 1, "city": "SF"}, {"order_id": 2, "city": "SF"}], solution(orders, customers)
  - name: no customers yields empty
    code: |
      orders = [{"order_id": 1, "customer_id": 7}]
      assert solution(orders, []) == [], solution(orders, [])
  - name: empty orders yields empty
    code: |
      assert solution([], [{"customer_id": 1, "city": "A"}]) == [], "expected empty"
  timeout: 8
hints:
- order: 1
  cost: 10
  content: The inner loop's condition is always true and it never breaks, so every order grabs the last customer's city even when its id does not match.
- order: 2
  cost: 20
  content: 'Index customers once into a dict mapping customer_id to city. Then each order is a single lookup — and you can tell when there is no match.'
- order: 3
  cost: 30
  content: 'by_id = {c["customer_id"]: c["city"] for c in customers}; emit {"order_id": o["order_id"], "city": by_id[cid]} only when cid in by_id.'
