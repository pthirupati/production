solution_explanation: 'Build a dict mapping customer_id -> city first, then iterate orders and look each
  id up. Emit a joined

  row {"order_id", "city"} ONLY when the id is present in the customer index (inner join). The starter

  matched on the wrong condition and emitted unmatched orders, attaching wrong or missing cities.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix solution(orders, customers): orders is a list of {\"order_id\", \"customer_id\"};\
    \ customers is a list\nof {\"customer_id\", \"city\"}. Return a list of {\"order_id\", \"city\"} for\
    \ every order whose customer_id\nmatches a customer (INNER join), preserving the order of `orders`.\
    \ Drop orders with no matching customer.\n  orders=[{\"order_id\":1,\"customer_id\":7}], customers=[{\"\
    customer_id\":7,\"city\":\"NYC\"}]\n    -> [{\"order_id\":1,\"city\":\"NYC\"}]\nClick Run to try it,\
    \ then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def solution(orders, customers):\n    out = []\n    for o in orders:\n        city = None\n\
      \        for c in customers:\n            # BUG: this matches on the wrong field and never breaks,\
      \ so the\n            # LAST customer wins and orders with no match still get emitted.\n       \
      \     if c[\"customer_id\"] or True:\n                city = c[\"city\"]\n        out.append({\"\
      order_id\": o[\"order_id\"], \"city\": city})\n    return out\n"
    readonly: false
  visible_tests:
  - name: joins matching ids
    code: "orders = [{\"order_id\": 1, \"customer_id\": 7}, {\"order_id\": 2, \"customer_id\": 8}]\ncustomers\
      \ = [{\"customer_id\": 7, \"city\": \"NYC\"}, {\"customer_id\": 8, \"city\": \"LA\"}]\nassert solution(orders,\
      \ customers) == [\n    {\"order_id\": 1, \"city\": \"NYC\"}, {\"order_id\": 2, \"city\": \"LA\"\
      }], solution(orders, customers)\n"
  - name: drops unmatched order
    code: 'orders = [{"order_id": 1, "customer_id": 7}, {"order_id": 2, "customer_id": 99}]

      customers = [{"customer_id": 7, "city": "NYC"}]

      assert solution(orders, customers) == [{"order_id": 1, "city": "NYC"}], solution(orders, customers)

      '
  hidden_tests:
  - name: preserves order of orders
    code: "orders = [{\"order_id\": 3, \"customer_id\": 2}, {\"order_id\": 1, \"customer_id\": 1}]\ncustomers\
      \ = [{\"customer_id\": 1, \"city\": \"A\"}, {\"customer_id\": 2, \"city\": \"B\"}]\nassert solution(orders,\
      \ customers) == [\n    {\"order_id\": 3, \"city\": \"B\"}, {\"order_id\": 1, \"city\": \"A\"}],\
      \ solution(orders, customers)\n"
  - name: many orders share one customer
    code: "orders = [{\"order_id\": 1, \"customer_id\": 5}, {\"order_id\": 2, \"customer_id\": 5}]\ncustomers\
      \ = [{\"customer_id\": 5, \"city\": \"SF\"}]\nassert solution(orders, customers) == [\n    {\"order_id\"\
      : 1, \"city\": \"SF\"}, {\"order_id\": 2, \"city\": \"SF\"}], solution(orders, customers)\n"
  - name: no customers yields empty
    code: 'orders = [{"order_id": 1, "customer_id": 7}]

      assert solution(orders, []) == [], solution(orders, [])

      '
  - name: empty orders yields empty
    code: 'assert solution([], [{"customer_id": 1, "city": "A"}]) == [], "expected empty"

      '
  timeout: 8
