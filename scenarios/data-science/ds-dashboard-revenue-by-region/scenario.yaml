slug: ds-dashboard-revenue-by-region
title: "Build a Revenue-by-Region Bar Chart"
technology: Data Science & Analytics
category: Dashboards
difficulty: easy
lab_mode: simulation
simulation_type: data-dashboard
coding_mode: false
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: Medium
is_free: true
description: |
  The sales team needs a quick view of how each region is performing. You have a
  regional_sales dataset (one row per transaction, with region, product, channel,
  revenue and units columns). Using the dashboard builder, produce a bar chart
  that shows total revenue for every region.

  Pick the right dimension (the column to group by), the right measure (the
  numeric column to aggregate), the correct aggregation, and the correct chart
  type. The dashboard is graded on the configuration AND the computed numbers.
objectives:
  - Set the dimension (group-by) to 'region'
  - Set the measure to 'revenue' and the aggregation to 'sum'
  - Set the chart type to 'bar' so the totals render as bars per region
initial_state: |
  A fresh dashboard with no dimension, measure, aggregation, or chart selected.
  The regional_sales dataset has 8 rows across four regions (North, South, East,
  West). North should total 2000, South 800, East 2000, West 1100 when revenue is
  summed per region.
hints:
  - order: 1
    cost: 10
    content: "Group-by first: set the dimension to 'region'. The dimension is the categorical column whose distinct values become the bars on the x-axis."
  - order: 2
    cost: 15
    content: "Choose what to measure: set the measure to 'revenue' and the aggregation to 'sum' so each region's bar equals the total of its revenue rows."
  - order: 3
    cost: 20
    content: "Finally set the chart type to 'bar'. A table also shows the numbers, but the goal explicitly asks for a bar chart, so the chart type must be 'bar' to pass."
