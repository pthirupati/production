description: 'CONTEXT: A team operating data science needs you to resolve `Build a Revenue-by-Region Bar
  Chart` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline notebook lab with pandas/notebook workflows, joins,
  and charts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A fresh dashboard with no dimension, measure, aggregation, or chart selected.

  The regional_sales dataset has 8 rows across four regions (North, South, East,

  West). North should total 2000, South 800, East 2000, West 1100 when revenue is

  summed per region. The sales team needs a quick view of how each region is performing. You have a

  regional_sales dataset (one row per transaction, with region, product, channel,

  revenue and units columns). Using the dashboard builder, produce a bar chart

  that shows total revenue for every region.


  Pick the right dimension (the column to group by), the right measure (the

  numeric column to aggregate), the correct aggregation, and the correct chart

  type. The dashboard is graded on the configuration AND the computed numbers.


  OBJECTIVE: Set the dimension (group-by) to ''region''; Set the measure to ''revenue'' and the aggregation
  to ''sum''; Set the chart type to ''bar'' so the totals render as bars per region. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
