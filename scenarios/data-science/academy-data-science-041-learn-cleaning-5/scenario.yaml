description: 'CONTEXT: A team operating data science needs you to resolve `data-science: Data Cleaning
  — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline notebook lab with pandas/notebook workflows, joins,
  and charts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The notebook lab is online with a starter data cleaning setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
  This beginner-friendly data-science lab introduces data cleaning. You will explore nulls, types, and
  dedup on the notebook lab. Read the environment first, then follow the guided steps — no prior production
  experience required.


  OBJECTIVE: Understand how data cleaning work in this lab environment; Identify the main status and configuration
  signals for data cleaning; Confirm you can read the current state confidently before changing anything.
  Success means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
