coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'An integrity check reports malformed pages. Fix solution(conn) so it returns the recovery
    plan as a list of table names that can be salvaged, sorted ascending. A table is salvageable when
    its row in `integrity(table_name, corrupt_pages, total_pages)` has at least one intact page (corrupt_pages
    < total_pages). A table whose pages are entirely corrupt cannot be salvaged, and a table with zero
    total pages is empty, not salvageable.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn):\n    # BUG: reports every table that has any corruption at all, which\
      \ is the\n    # opposite of the salvageable set.\n    return sorted(r[0] for r in conn.execute(\n\
      \        \"SELECT table_name FROM integrity WHERE corrupt_pages > 0\"))\n"
    readonly: false
  visible_tests:
  - name: partially corrupt table is salvageable
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE integrity (table_name TEXT, corrupt_pages INTEGER, \"\n        \"total_pages\
      \ INTEGER);\")\n    conn.executemany(\"INSERT INTO integrity VALUES (?,?,?)\", rows)\n    return\
      \ conn\nconn = _seed([('orders', 2, 10)])\nassert solution(conn) == ['orders'], solution(conn)\n"
  - name: fully corrupt table is not salvageable
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE integrity (table_name TEXT, corrupt_pages INTEGER, \"\n        \"total_pages\
      \ INTEGER);\")\n    conn.executemany(\"INSERT INTO integrity VALUES (?,?,?)\", rows)\n    return\
      \ conn\nconn = _seed([('orders', 10, 10)])\nassert solution(conn) == [], solution(conn)\n"
  hidden_tests:
  - name: clean table is salvageable
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE integrity (table_name TEXT, corrupt_pages INTEGER, \"\n        \"total_pages\
      \ INTEGER);\")\n    conn.executemany(\"INSERT INTO integrity VALUES (?,?,?)\", rows)\n    return\
      \ conn\nconn = _seed([('users', 0, 5)])\nassert solution(conn) == ['users'], solution(conn)\n"
  - name: empty table is not salvageable
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE integrity (table_name TEXT, corrupt_pages INTEGER, \"\n        \"total_pages\
      \ INTEGER);\")\n    conn.executemany(\"INSERT INTO integrity VALUES (?,?,?)\", rows)\n    return\
      \ conn\nconn = _seed([('blank', 0, 0)])\nassert solution(conn) == [], solution(conn)\n"
  - name: no rows returns empty plan
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE integrity (table_name TEXT, corrupt_pages INTEGER, \"\n        \"total_pages\
      \ INTEGER);\")\n    conn.executemany(\"INSERT INTO integrity VALUES (?,?,?)\", rows)\n    return\
      \ conn\nconn = _seed([])\nassert solution(conn) == [], solution(conn)\n"
  - name: plan is sorted and mixes cases correctly
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE integrity (table_name TEXT, corrupt_pages INTEGER, \"\n        \"total_pages\
      \ INTEGER);\")\n    conn.executemany(\"INSERT INTO integrity VALUES (?,?,?)\", rows)\n    return\
      \ conn\nconn = _seed([('zeta',1,4),('alpha',4,4),('mid',0,2)])\nassert solution(conn) == ['mid','zeta'],\
      \ solution(conn)\n"
  timeout: 8
