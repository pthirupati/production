tasks:
- id: task_1
  title: Backup Workflows — Production Lab
  description: Restore healthy behavior for Backup Workflows — Production Lab by investigating the failure,
    applying the smallest safe fix, and validating the outcome.
  background: 'This sqlite lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
