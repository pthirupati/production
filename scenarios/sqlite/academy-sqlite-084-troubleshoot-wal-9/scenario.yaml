- order: 3
  cost: 20
  content: 'Verify recovery: WAL retained per policy and replay succeeds. Document
    the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-sqlite-084-troubleshoot-wal-9.conf`,
