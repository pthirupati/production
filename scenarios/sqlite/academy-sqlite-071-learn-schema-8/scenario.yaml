title: 'SQLite: Schema Design — Fundamentals Lab'
slug: academy-sqlite-071-learn-schema-8
technology: SQLite
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Service operations lab. The `postgresql` systemd unit is **failed/inactive** on this host
  — a realistic fault for Fundamentals Lab workflows that depend on it. Diagnose with `systemctl status
  postgresql` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active
  postgresql`.
objectives:
- The `postgresql` service is active (running)
- '`systemctl is-active postgresql` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `postgresql` service is not running (`systemctl is-active postgresql` → inactive/failed).
  Dependent Fundamentals Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the schema definition (`.schema`).

    2. Write down what looks normal versus wrong or missing for schema design.

    3. Recall the core idea: tables, types, keys, and constraints. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for schema design.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the schema definition (`.schema`).

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — the schema enforces correct structure.

    4. Click Check Solution once `systemctl is-active postgresql` returns active.'
