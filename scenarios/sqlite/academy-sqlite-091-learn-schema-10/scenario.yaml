title: Schema Design — Learn Lab
slug: academy-sqlite-091-learn-schema-10
technology: sqlite
category: Learn
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: 'CONTEXT: A team operating SQLite needs you to resolve `sqlite: Schema Design — Fundamentals
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline SQLite database file with sqlite3 CLI, schema, WAL
  mode, and pragmas. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The SQLite database file is online with a starter schema design setup. Some
  pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus
  on observation. This beginner-friendly sqlite lab introduces schema design. You will explore tables,
  types, keys, and constraints on the SQLite database file. Read the environment first, then follow the
  guided steps — no prior production experience required.


  OBJECTIVE: Understand how schema design work in this lab environment; Identify the main status and configuration
  signals for schema design; Confirm you can read the current state confidently before changing anything.
  Success means `systemctl is-active postgresql` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how schema design work in this lab environment
- Identify the main status and configuration signals for schema design
- Confirm you can read the current state confidently before changing anything
initial_state: The SQLite database file is online with a starter schema design setup. Some pieces are
  intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the schema definition (`.schema`).

    2. Write down what looks normal versus wrong or missing for schema design.

    3. Recall the core idea: tables, types, keys, and constraints. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status postgresql` — note Active/Failed and the last log lines.

    2. Read `journalctl -u postgresql -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — the schema definition (`.schema`).

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — the schema enforces correct structure.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
summary: Complete the schema design — learn lab sqlite lab and verify success with the checker
