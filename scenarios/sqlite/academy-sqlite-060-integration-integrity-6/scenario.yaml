title: Integrity Checks — Integration Lab
slug: academy-sqlite-060-integration-integrity-6
technology: sqlite
category: Project
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating SQLite needs you to resolve `sqlite: Integrity Checks — Integration
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline SQLite database file with sqlite3 CLI, schema, WAL
  mode, and pragmas. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for integrity checks.
  Downstream consumers are waiting on this integration path. Integration lab: connect integrity checks
  with an adjacent platform in the sqlite stack. Validate authentication, data handoff, and failure behavior
  for PRAGMA integrity_check and corruption recovery.


  OBJECTIVE: integrity checks is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `systemctl
  is-active postgresql` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- integrity checks is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for integrity checks. Downstream
  consumers are waiting on this integration path.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `PRAGMA integrity_check` output.

    2. Write down what looks normal versus wrong or missing for integrity checks.

    3. Recall the core idea: PRAGMA integrity_check and corruption recovery. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status postgresql` — note Active/Failed and the last log lines.

    2. Read `journalctl -u postgresql -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `PRAGMA integrity_check` output.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — integrity check passes after repair.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
cross_technology: true
summary: Complete the integrity checks — integration lab sqlite lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic sqlite literacy
tags:
- do
- hands-on
- sqlite
linked_tutorial: sqlite-fundamentals
what_you_will_learn:
- integrity checks is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
environment:
  nodes:
  - role: primary
    os: FixitLab SQLite database file
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - bash
  - coreutils
  - journalctl
  - sqlite
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Integrity Checks — Integration Lab
  description: Restore healthy behavior for Integrity Checks — Integration Lab by investigating the failure,
    applying the smallest safe fix, and validating the outcome.
  background: 'This sqlite lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: service_active
    command: systemctl is-active postgresql
    expected_status: active
    error_message: The postgresql service is not active yet. Check `systemctl status postgresql` and `journalctl
      -u postgresql -n 50`.
solution:
  summary: The root cause is an unhealthy `postgresql` service; repair it and verify active state.
  files_changed: []
  commands_run:
  - systemctl is-active postgresql
  reference_docs: sqlite-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active postgresql
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active postgresql
    expected_output: '`systemctl is-active postgresql` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
