coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'A migration must add a NOT NULL column to a live table, which plain ALTER TABLE refuses
    without a default. Fix solution(conn) so it adds a ''status'' TEXT column to `accounts` that is NOT
    NULL with default ''active'', backfilling existing rows. Return the number of rows that now have status=''active''.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn):\n    # BUG: adds a NOT NULL column with no DEFAULT, which SQLite rejects\n\
      \    # outright on a table that already has rows.\n    conn.execute(\"ALTER TABLE accounts ADD COLUMN\
      \ status TEXT NOT NULL\")\n    return conn.execute(\"SELECT COUNT(*) FROM accounts WHERE status='active'\"\
      ).fetchone()[0]\n"
    readonly: false
  visible_tests:
  - name: existing rows are backfilled
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE accounts (id INTEGER PRIMARY KEY, name TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ accounts VALUES (?,?)\", rows)\n    return conn\nconn = _seed([(1,'ann'),(2,'bob')])\nassert solution(conn)\
      \ == 2, solution(conn)\n"
  - name: column really exists
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE accounts (id INTEGER PRIMARY KEY, name TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ accounts VALUES (?,?)\", rows)\n    return conn\nconn = _seed([(1,'ann')])\nsolution(conn)\ncols\
      \ = [r[1] for r in conn.execute('PRAGMA table_info(accounts)')]\nassert 'status' in cols, cols\n"
  hidden_tests:
  - name: empty table migrates cleanly
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE accounts (id INTEGER PRIMARY KEY, name TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ accounts VALUES (?,?)\", rows)\n    return conn\nconn = _seed([])\nassert solution(conn) == 0,\
      \ solution(conn)\n"
  - name: new insert defaults to active
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE accounts (id INTEGER PRIMARY KEY, name TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ accounts VALUES (?,?)\", rows)\n    return conn\nconn = _seed([])\nsolution(conn)\nconn.execute(\"\
      INSERT INTO accounts (id, name) VALUES (5,'new')\")\nv = conn.execute('SELECT status FROM accounts\
      \ WHERE id=5').fetchone()[0]\nassert v == 'active', v\n"
  - name: column is NOT NULL
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE accounts (id INTEGER PRIMARY KEY, name TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ accounts VALUES (?,?)\", rows)\n    return conn\nconn = _seed([(1,'ann')])\nsolution(conn)\nnotnull\
      \ = [r[3] for r in conn.execute('PRAGMA table_info(accounts)') if r[1]=='status']\nassert notnull\
      \ == [1], notnull\n"
  - name: original data is preserved
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE accounts (id INTEGER PRIMARY KEY, name TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ accounts VALUES (?,?)\", rows)\n    return conn\nconn = _seed([(1,'ann'),(2,'bob')])\nsolution(conn)\n\
      names = [r[0] for r in conn.execute('SELECT name FROM accounts ORDER BY id')]\nassert names == ['ann','bob'],\
      \ names\n"
  timeout: 8
