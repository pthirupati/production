initial_state: filter_price_range(conn, low, high) should return product names whose price is between
  low and high INCLUSIVE, ordered by price then name. The starter uses `price > low AND price < high`,
  so products priced exactly at low or high are dropped. Fix the bounds.
solution_explanation: 'The spec says the range includes both endpoints, but `> low AND < high` is strictly

  exclusive, so a product priced exactly at the low or high bound is filtered out —

  a classic off-by-one on a range. Using `>= low AND <= high` (equivalently

  `price BETWEEN low AND high`, which is inclusive in standard SQL) keeps the

  boundary rows.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix filter_price_range(conn, low, high). It must return the names of products\nwhose\
    \ price is within [low, high] INCLUSIVE — a product priced exactly at low or\nexactly at high must\
    \ be included. Order by price ascending, then by name.\n\n  products(id INTEGER, name TEXT, price\
    \ REAL)\n\nThe query is parameterized with (low, high). Return a list of (name,) tuples.\nClick Run\
    \ to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def solution(conn):\n    def filter_price_range(c, low, high):\n        return c.execute(\n\
      \            \"SELECT name FROM products \"\n            \"WHERE price > ? AND price < ? \"   #\
      \ bug: bounds are exclusive\n            \"ORDER BY price ASC, name ASC\",\n            (low, high),\n\
      \        ).fetchall()\n    return filter_price_range\n"
  visible_tests:
  - name: includes the lower boundary
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL);\n  INSERT INTO products VALUES (1,'Edge',10.0);\n\
      \  INSERT INTO products VALUES (2,'Inside',15.0);\n  INSERT INTO products VALUES (3,'Above',30.0);\n\
      ''')\nf = solution(conn)\nassert f(conn, 10.0, 20.0) == [('Edge',), ('Inside',)], f(conn, 10.0,\
      \ 20.0)\n"
  - name: includes the upper boundary
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL);\n  INSERT INTO products VALUES (1,'Low',5.0);\n \
      \ INSERT INTO products VALUES (2,'High',20.0);\n''')\nf = solution(conn)\nassert f(conn, 5.0, 20.0)\
      \ == [('Low',), ('High',)], f(conn, 5.0, 20.0)\n"
  hidden_tests:
  - name: excludes values outside the range
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL);\n  INSERT INTO products VALUES (1,'Under',4.99);\n\
      \  INSERT INTO products VALUES (2,'In',5.0);\n  INSERT INTO products VALUES (3,'Over',5.01);\n''')\n\
      f = solution(conn)\nassert f(conn, 5.0, 5.0) == [('In',)], f(conn, 5.0, 5.0)\n"
  - name: tie on price breaks by name
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL);\n  INSERT INTO products VALUES (1,'Zeta',12.0);\n\
      \  INSERT INTO products VALUES (2,'Alpha',12.0);\n  INSERT INTO products VALUES (3,'Mid',8.0);\n\
      ''')\nf = solution(conn)\nassert f(conn, 8.0, 12.0) == [('Mid',), ('Alpha',), ('Zeta',)], f(conn,\
      \ 8.0, 12.0)\n"
  - name: single point range hits exact match
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL);\n  INSERT INTO products VALUES (1,'Exact',100.0);\n\
      ''')\nf = solution(conn)\nassert f(conn, 100.0, 100.0) == [('Exact',)], f(conn, 100.0, 100.0)\n"
  - name: nothing in range
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL);\n  INSERT INTO products VALUES (1,'Cheap',1.0);\n\
      \  INSERT INTO products VALUES (2,'Dear',999.0);\n''')\nf = solution(conn)\nassert f(conn, 10.0,\
      \ 20.0) == [], f(conn, 10.0, 20.0)\n"
  timeout: 8
