title: Fix the Off-by-One Price Range Filter
slug: sql-fix-between-range
technology: sqlite
category: SQLite
description: A "products between two prices" filter is dropping items that sit exactly
  on the boundary prices. The query uses strict greater-than / less-than, so a product
  priced at exactly the low or high bound is excluded even though the spec says the
  range is inclusive on both ends. Fix the off-by-one boundary handling.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Find a product that sits exactly on a boundary and is wrongly excluded
- Understand inclusive vs exclusive range bounds
- Make both endpoints inclusive
initial_state: filter_price_range(conn, low, high) should return product names whose
  price is between low and high INCLUSIVE, ordered by price then name. The starter
  uses `price > low AND price < high`, so products priced exactly at low or high are
  dropped. Fix the bounds.
solution_explanation: |
  The spec says the range includes both endpoints, but `> low AND < high` is strictly
  exclusive, so a product priced exactly at the low or high bound is filtered out —
  a classic off-by-one on a range. Using `>= low AND <= high` (equivalently
  `price BETWEEN low AND high`, which is inclusive in standard SQL) keeps the
  boundary rows.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix filter_price_range(conn, low, high). It must return the names of products
    whose price is within [low, high] INCLUSIVE — a product priced exactly at low or
    exactly at high must be included. Order by price ascending, then by name.

      products(id INTEGER, name TEXT, price REAL)

    The query is parameterized with (low, high). Return a list of (name,) tuples.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      def solution(conn):
          def filter_price_range(c, low, high):
              return c.execute(
                  "SELECT name FROM products "
                  "WHERE price > ? AND price < ? "   # bug: bounds are exclusive
                  "ORDER BY price ASC, name ASC",
                  (low, high),
              ).fetchall()
          return filter_price_range
  visible_tests:
  - name: includes the lower boundary
    code: |
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.executescript('''
        CREATE TABLE products(id INTEGER, name TEXT, price REAL);
        INSERT INTO products VALUES (1,'Edge',10.0);
        INSERT INTO products VALUES (2,'Inside',15.0);
        INSERT INTO products VALUES (3,'Above',30.0);
      ''')
      f = solution(conn)
      assert f(conn, 10.0, 20.0) == [('Edge',), ('Inside',)], f(conn, 10.0, 20.0)
  - name: includes the upper boundary
    code: |
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.executescript('''
        CREATE TABLE products(id INTEGER, name TEXT, price REAL);
        INSERT INTO products VALUES (1,'Low',5.0);
        INSERT INTO products VALUES (2,'High',20.0);
      ''')
      f = solution(conn)
      assert f(conn, 5.0, 20.0) == [('Low',), ('High',)], f(conn, 5.0, 20.0)
  hidden_tests:
  - name: excludes values outside the range
    code: |
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.executescript('''
        CREATE TABLE products(id INTEGER, name TEXT, price REAL);
        INSERT INTO products VALUES (1,'Under',4.99);
        INSERT INTO products VALUES (2,'In',5.0);
        INSERT INTO products VALUES (3,'Over',5.01);
      ''')
      f = solution(conn)
      assert f(conn, 5.0, 5.0) == [('In',)], f(conn, 5.0, 5.0)
  - name: tie on price breaks by name
    code: |
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.executescript('''
        CREATE TABLE products(id INTEGER, name TEXT, price REAL);
        INSERT INTO products VALUES (1,'Zeta',12.0);
        INSERT INTO products VALUES (2,'Alpha',12.0);
        INSERT INTO products VALUES (3,'Mid',8.0);
      ''')
      f = solution(conn)
      assert f(conn, 8.0, 12.0) == [('Mid',), ('Alpha',), ('Zeta',)], f(conn, 8.0, 12.0)
  - name: single point range hits exact match
    code: |
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.executescript('''
        CREATE TABLE products(id INTEGER, name TEXT, price REAL);
        INSERT INTO products VALUES (1,'Exact',100.0);
      ''')
      f = solution(conn)
      assert f(conn, 100.0, 100.0) == [('Exact',)], f(conn, 100.0, 100.0)
  - name: nothing in range
    code: |
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.executescript('''
        CREATE TABLE products(id INTEGER, name TEXT, price REAL);
        INSERT INTO products VALUES (1,'Cheap',1.0);
        INSERT INTO products VALUES (2,'Dear',999.0);
      ''')
      f = solution(conn)
      assert f(conn, 10.0, 20.0) == [], f(conn, 10.0, 20.0)
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Try low=high (e.g. 5.0 and 5.0) against a product priced exactly 5.0 — the
    strict `>`/`<` bounds return nothing, but it should match.
- order: 2
  cost: 20
  content: An inclusive range keeps the endpoints. Switch the strict comparisons to
    `price >= ? AND price <= ?`.
- order: 3
  cost: 30
  content: 'Use `WHERE price >= ? AND price <= ?` (equivalently `price BETWEEN ? AND
    ?`, which is inclusive in standard SQL).'
