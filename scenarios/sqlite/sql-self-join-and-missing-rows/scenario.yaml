  Both starters return empty lists — write the self-join and the LEFT JOIN anti-join.
solution_explanation: 'Roommate pairs come from joining students to themselves on room_id. Joining on

  equality alone would return each student paired with itself and each pair twice

  (A-B and B-A), so the guard a.id < b.id keeps exactly one ordered representative

  per pair and drops self-pairs. Rooms are matched only when room_id is NOT NULL so

  unassigned students never pair up.


  The unassigned report is an anti-join: although here a simple WHERE room_id IS NULL

  works, the portable, generalizable pattern is to LEFT JOIN students to the rooms

  table and keep the rows where the right side failed to match (rooms.id IS NULL) —

  that surfaces exactly the "missing" rows that an INNER JOIN would silently drop.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: implement
  instructions: "Implement solution(conn) to RETURN A TUPLE of two functions: (roommate_pairs, unassigned).\n\
    \nSchema (created fresh by each test):\n  rooms(id INTEGER, label TEXT)\n  students(id INTEGER, name\
    \ TEXT, room_id INTEGER)   -- room_id may be NULL\n\n1) roommate_pairs(c): return (name_a, name_b)\
    \ for every pair of DIFFERENT students\n   sharing the same room. List each pair ONCE (not both A-B\
    \ and B-A), with\n   name_a < name_b within the row. Order by name_a, then name_b. Students with a\n\
    \   NULL room_id are not in any pair.\n\n2) unassigned(c): return (name,) for every student whose\
    \ room_id does NOT match any\n   row in `rooms` (i.e. NULL or dangling). Use a LEFT JOIN from students\
    \ to rooms\n   and keep the rows where the room side is NULL. Order by name ascending.\n\nEach function\
    \ takes the connection and returns conn.execute(...).fetchall().\nClick Run to try it, then Check\
    \ Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def solution(conn):\n    def roommate_pairs(c):\n        # TODO: self-join students a, students\
      \ b on a.room_id = b.room_id,\n        # keep one row per pair (a.name < b.name), ignore NULL room_id.\n\
      \        return c.execute(\"SELECT name, name FROM students WHERE 0\").fetchall()\n\n    def unassigned(c):\n\
      \        # TODO: LEFT JOIN students -> rooms on students.room_id = rooms.id,\n        # keep rows\
      \ where rooms.id IS NULL. Order by name.\n        return c.execute(\"SELECT name FROM students WHERE\
      \ 0\").fetchall()\n\n    return (roommate_pairs, unassigned)\n"
    readonly: false
  visible_tests:
  - name: pairs share a room and dedupe
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ rooms(id INTEGER, label TEXT);\n  CREATE TABLE students(id INTEGER, name TEXT, room_id INTEGER);\n\
      \  INSERT INTO rooms VALUES (1,'101'),(2,'102');\n  INSERT INTO students VALUES (1,'Ava',1),(2,'Ben',1),(3,'Cy',2);\n\
      ''')\npairs, _ = solution(conn)\nassert pairs(conn) == [('Ava','Ben')], pairs(conn)\n"
  - name: unassigned finds null room
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ rooms(id INTEGER, label TEXT);\n  CREATE TABLE students(id INTEGER, name TEXT, room_id INTEGER);\n\
      \  INSERT INTO rooms VALUES (1,'101');\n  INSERT INTO students VALUES (1,'Ava',1),(2,'Ben',NULL);\n\
      ''')\n_, unassigned = solution(conn)\nassert unassigned(conn) == [('Ben',)], unassigned(conn)\n"
  hidden_tests:
  - name: three in a room give three pairs no mirrors
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ rooms(id INTEGER, label TEXT);\n  CREATE TABLE students(id INTEGER, name TEXT, room_id INTEGER);\n\
      \  INSERT INTO rooms VALUES (1,'101');\n  INSERT INTO students VALUES (1,'Ava',1),(2,'Ben',1),(3,'Cy',1);\n\
      ''')\npairs, _ = solution(conn)\nassert pairs(conn) == [('Ava','Ben'),('Ava','Cy'),('Ben','Cy')],\
      \ pairs(conn)\n"
  - name: no self pairs and null rooms never pair
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ rooms(id INTEGER, label TEXT);\n  CREATE TABLE students(id INTEGER, name TEXT, room_id INTEGER);\n\
      \  INSERT INTO rooms VALUES (1,'101');\n  INSERT INTO students VALUES (1,'Ava',1),(2,'Ben',NULL),(3,'Cy',NULL);\n\
      ''')\npairs, _ = solution(conn)\nassert pairs(conn) == [], pairs(conn)\n"
  - name: pairs ordered across multiple rooms
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ rooms(id INTEGER, label TEXT);\n  CREATE TABLE students(id INTEGER, name TEXT, room_id INTEGER);\n\
      \  INSERT INTO rooms VALUES (1,'101'),(2,'102');\n  INSERT INTO students VALUES (1,'Dan',2),(2,'Eve',2),(3,'Ada',1),(4,'Bo',1);\n\
      ''')\npairs, _ = solution(conn)\nassert pairs(conn) == [('Ada','Bo'),('Dan','Eve')], pairs(conn)\n"
  - name: dangling room_id counts as unassigned via left join
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ rooms(id INTEGER, label TEXT);\n  CREATE TABLE students(id INTEGER, name TEXT, room_id INTEGER);\n\
      \  INSERT INTO rooms VALUES (1,'101');\n  INSERT INTO students VALUES (1,'Ava',1),(2,'Ben',99),(3,'Cy',NULL);\n\
      ''')\n_, unassigned = solution(conn)\nassert unassigned(conn) == [('Ben',),('Cy',)], unassigned(conn)\n"
  - name: all assigned to real rooms means none unassigned
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ rooms(id INTEGER, label TEXT);\n  CREATE TABLE students(id INTEGER, name TEXT, room_id INTEGER);\n\
      \  INSERT INTO rooms VALUES (1,'101'),(2,'102');\n  INSERT INTO students VALUES (1,'Ava',1),(2,'Ben',2);\n\
      ''')\n_, unassigned = solution(conn)\nassert unassigned(conn) == [], unassigned(conn)\n"
  timeout: 8
