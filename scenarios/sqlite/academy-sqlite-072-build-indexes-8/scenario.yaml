title: 'SQLite: Database Indexes — Build From Scratch'
slug: academy-sqlite-072-build-indexes-8
technology: SQLite
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Build database indexes from scratch in this SQLite lab. You start from
  a minimal environment and must produce a working configuration that demonstrates
  B-tree indexes, selectivity, covering indexes, and plan impact. Plan, implement,
  then prove it works.
objectives:
- A working database indexes setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The SQLite database file is ready but database indexes is not configured
  yet. Required tools may already be installed; your job is to create the configuration
  and bring the capability online.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — EXPLAIN/EXPLAIN ANALYZE and index usage views.

    2. Write down what looks normal versus wrong or missing for database indexes.

    3. Recall the core idea: B-tree indexes, selectivity, covering indexes, and plan
    impact. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for database indexes.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — EXPLAIN/EXPLAIN ANALYZE and index usage views.

    2. Create the smallest working slice of database indexes first, validate it, then
    add the remaining pieces one at a time.

    3. Verify the result — plans use the intended index and latency drops.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-sqlite-072-build-indexes-8.conf`,
    then click Check Solution.'
