coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'The file never shrinks after a mass delete because free pages are retained. Fix solution(conn)
    so it reports whether a VACUUM is worth running: return the reclaimable fraction as a float (freelist_count
    / page_count) from the `dbstat` table, rounded to 2 decimals. Return 0.0 when the database has no
    pages at all rather than dividing by zero.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn):\n    # BUG: divides by the freelist instead of the total page count\
      \ and has no\n    # zero guard, so the ratio is inverted and an empty db explodes.\n    page_count,\
      \ freelist = conn.execute(\n        \"SELECT page_count, freelist_count FROM dbstat\").fetchone()\n\
      \    return round(page_count / freelist, 2)\n"
    readonly: false
  visible_tests:
  - name: half-free database reports 0.5
    code: "import sqlite3\ndef _seed(page_count, freelist_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\n        \"CREATE TABLE dbstat (page_count INTEGER, freelist_count INTEGER);\"\
      )\n    conn.execute(\"INSERT INTO dbstat VALUES (?,?)\", (page_count, freelist_count))\n    return\
      \ conn\nconn = _seed(100, 50)\nassert solution(conn) == 0.5, solution(conn)\n"
  - name: compact database reports 0.0
    code: "import sqlite3\ndef _seed(page_count, freelist_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\n        \"CREATE TABLE dbstat (page_count INTEGER, freelist_count INTEGER);\"\
      )\n    conn.execute(\"INSERT INTO dbstat VALUES (?,?)\", (page_count, freelist_count))\n    return\
      \ conn\nconn = _seed(100, 0)\nassert solution(conn) == 0.0, solution(conn)\n"
  hidden_tests:
  - name: empty database does not divide by zero
    code: "import sqlite3\ndef _seed(page_count, freelist_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\n        \"CREATE TABLE dbstat (page_count INTEGER, freelist_count INTEGER);\"\
      )\n    conn.execute(\"INSERT INTO dbstat VALUES (?,?)\", (page_count, freelist_count))\n    return\
      \ conn\nconn = _seed(0, 0)\nassert solution(conn) == 0.0, solution(conn)\n"
  - name: ratio is rounded to two decimals
    code: "import sqlite3\ndef _seed(page_count, freelist_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\n        \"CREATE TABLE dbstat (page_count INTEGER, freelist_count INTEGER);\"\
      )\n    conn.execute(\"INSERT INTO dbstat VALUES (?,?)\", (page_count, freelist_count))\n    return\
      \ conn\nconn = _seed(3, 1)\nassert solution(conn) == 0.33, solution(conn)\n"
  - name: fully free database reports 1.0
    code: "import sqlite3\ndef _seed(page_count, freelist_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\n        \"CREATE TABLE dbstat (page_count INTEGER, freelist_count INTEGER);\"\
      )\n    conn.execute(\"INSERT INTO dbstat VALUES (?,?)\", (page_count, freelist_count))\n    return\
      \ conn\nconn = _seed(10, 10)\nassert solution(conn) == 1.0, solution(conn)\n"
  - name: ratio never exceeds one
    code: "import sqlite3\ndef _seed(page_count, freelist_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\n        \"CREATE TABLE dbstat (page_count INTEGER, freelist_count INTEGER);\"\
      )\n    conn.execute(\"INSERT INTO dbstat VALUES (?,?)\", (page_count, freelist_count))\n    return\
      \ conn\nconn = _seed(200, 7)\nassert 0.0 <= solution(conn) <= 1.0, solution(conn)\n"
  timeout: 8
