description: 'CONTEXT: A team operating SQLite needs you to resolve `sqlite: Write-Ahead Log — Troubleshooting
  Drill` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline SQLite database file with sqlite3 CLI, schema, WAL
  mode, and pragmas. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The SQLite database file is degraded. Crash recovery or replication lags.
  Recent changes may exist around write-ahead log, but do not restart blindly — gather evidence first.
  Production alert: crash recovery or replication lags. You are on call for sqlite and must troubleshoot
  write-ahead log methodically — triage symptoms, isolate root cause, apply the smallest safe fix, and
  confirm recovery.


  OBJECTIVE: The incident symptom is clear: crash recovery or replication lags; Root cause is isolated
  with evidence, not guesswork; Service behavior returns to normal after the fix. Success means `systemctl
  is-active postgresql` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: crash recovery or replication lags'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The SQLite database file is degraded. Crash recovery or replication lags. Recent changes
  may exist around write-ahead log, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status postgresql` and `journalctl -u postgresql -n 50
    --no-pager` before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status postgresql` — note Active/Failed and the last log lines.

    2. Read `journalctl -u postgresql -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart postgresql` and confirm `systemctl is-active postgresql` succeeds.


    WHY: the grader checks real service state, not marker files.'
summary: Complete the write-ahead log — troubleshoot lab sqlite lab and verify success with the checker
