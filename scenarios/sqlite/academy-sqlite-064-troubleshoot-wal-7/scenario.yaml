tasks:
- id: task_1
  title: Write-Ahead Log — Troubleshoot Lab
  description: Restore healthy behavior for Write-Ahead Log — Troubleshoot Lab by investigating the failure,
    applying the smallest safe fix, and validating the outcome.
  background: 'This sqlite lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
