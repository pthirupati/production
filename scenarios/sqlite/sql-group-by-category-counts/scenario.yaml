title: Count Orders Per Category
slug: sql-group-by-category-counts
technology: sqlite
category: Build
description: 'CONTEXT: A team operating SQLite has raised a ticket for `Count Orders Per Category`. A
  customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve it. Business
  impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline SQLite database file. The architecture is a single
  lab-primary node exposing sqlite3 CLI, schema, WAL mode, and pragmas; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: report_busy_categories(conn) should return (category, order_count) for every
  category that has 2 or more orders, ordered by count descending then category ascending. The starter
  returns an empty list — write the grouped query.


  OBJECTIVE: Aggregate rows into one row per group with GROUP BY; Count rows in each group with COUNT(*);
  Filter whole groups with HAVING (not WHERE). Acceptance criteria: the change is minimal and reversible,
  and success means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant sqlite3 CLI, schema, WAL mode, and pragmas), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
