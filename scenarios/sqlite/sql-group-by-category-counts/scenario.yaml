objectives:
- Aggregate rows into one row per group with GROUP BY
- Count rows in each group with COUNT(*)
- Filter whole groups with HAVING (not WHERE)
initial_state: report_busy_categories(conn) should return (category, order_count) for every category that
  has 2 or more orders, ordered by count descending then category ascending. The starter returns an empty
  list — write the grouped query.
solution_explanation: 'GROUP BY category collapses all rows sharing a category into a single group;

  COUNT(*) reports how many rows fell into each group. WHERE filters individual rows

  BEFORE grouping, so a per-group condition like "at least 2 orders" must use HAVING,

  which filters AFTER aggregation. Ordering by the count descending, then category,

  gives a stable busiest-first report.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: implement
  instructions: "Implement solution(conn): return (category, order_count) for each category that\nhas\
    \ 2 OR MORE orders. Order by order_count descending, then category ascending.\n\n  orders(id INTEGER,\
    \ category TEXT, amount REAL)\n\nUse GROUP BY and a HAVING clause. Return conn.execute(...).fetchall().\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def solution(conn):\n    # TODO: count orders per category, keep only categories with >=\
      \ 2 orders,\n    # order by count desc then category asc.\n    return conn.execute(\n        \"\
      SELECT category, COUNT(*) FROM orders WHERE 0 GROUP BY category\"\n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: counts and filters groups
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ orders(id INTEGER, category TEXT, amount REAL);\n  INSERT INTO orders VALUES (1,'books',10);\n\
      \  INSERT INTO orders VALUES (2,'books',12);\n  INSERT INTO orders VALUES (3,'books',8);\n  INSERT\
      \ INTO orders VALUES (4,'toys',5);\n  INSERT INTO orders VALUES (5,'toys',6);\n  INSERT INTO orders\
      \ VALUES (6,'food',9);\n''')\nassert solution(conn) == [('books',3),('toys',2)], solution(conn)\n"
  - name: single-order categories are excluded
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ orders(id INTEGER, category TEXT, amount REAL);\n  INSERT INTO orders VALUES (1,'a',1);\n  INSERT\
      \ INTO orders VALUES (2,'b',1);\n  INSERT INTO orders VALUES (3,'c',1);\n''')\nassert solution(conn)\
      \ == [], solution(conn)\n"
  hidden_tests:
  - name: ties on count break by category ascending
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ orders(id INTEGER, category TEXT, amount REAL);\n  INSERT INTO orders VALUES (1,'zoo',1);\n  INSERT\
      \ INTO orders VALUES (2,'zoo',1);\n  INSERT INTO orders VALUES (3,'art',1);\n  INSERT INTO orders\
      \ VALUES (4,'art',1);\n''')\nassert solution(conn) == [('art',2),('zoo',2)], solution(conn)\n"
  - name: exactly two qualifies, count is accurate
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ orders(id INTEGER, category TEXT, amount REAL);\n  INSERT INTO orders VALUES (1,'x',1);\n  INSERT\
      \ INTO orders VALUES (2,'x',1);\n  INSERT INTO orders VALUES (3,'y',1);\n  INSERT INTO orders VALUES\
      \ (4,'y',1);\n  INSERT INTO orders VALUES (5,'y',1);\n  INSERT INTO orders VALUES (6,'y',1);\n''')\n\
      assert solution(conn) == [('y',4),('x',2)], solution(conn)\n"
  - name: empty table returns nothing
    code: 'import sqlite3

      conn = sqlite3.connect(":memory:")

      conn.executescript(''CREATE TABLE orders(id INTEGER, category TEXT, amount REAL);'')

      assert solution(conn) == [], solution(conn)

      '
  - name: filtering happens per group not per row
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ orders(id INTEGER, category TEXT, amount REAL);\n  INSERT INTO orders VALUES (1,'solo',1);\n \
      \ INSERT INTO orders VALUES (2,'pair',1);\n  INSERT INTO orders VALUES (3,'pair',1);\n''')\nrows\
      \ = solution(conn)\nassert rows == [('pair',2)], rows\n"
  timeout: 8
