title: Find Above-Average Orders with a Subquery
slug: sql-subquery-above-average
technology: sqlite
category: Build
description: 'CONTEXT: A team operating SQLite has raised a ticket for `Find Above-Average Orders with
  a Subquery`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline SQLite database file. The architecture is a single
  lab-primary node exposing sqlite3 CLI, schema, WAL mode, and pragmas; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: above_average_orders(conn) should return (id, amount) for every order whose
  amount is strictly greater than AVG(amount) over all orders, ordered by amount descending then id ascending.
  The starter returns an empty list — write the query with a subquery in WHERE.


  OBJECTIVE: Compute an aggregate as a scalar subquery; Compare each row to that subquery in WHERE; Understand
  strict greater-than against a computed threshold. Acceptance criteria: the change is minimal and reversible,
  and success means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant sqlite3 CLI, schema, WAL mode, and pragmas), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
