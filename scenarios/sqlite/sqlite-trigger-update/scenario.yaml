coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'The updated_at column never changes when a row is updated. Fix solution(conn) so it installs
    an AFTER UPDATE trigger on `items` that sets updated_at to the new_stamp argument for the row that
    was just updated. Return the trigger name you created. The trigger must not fire on INSERT, and must
    only touch the updated row.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn, new_stamp):\n    # BUG: fires on INSERT rather than UPDATE, and rewrites\
      \ every row in the\n    # table instead of just the one that changed.\n    conn.execute(\n     \
      \   \"CREATE TRIGGER items_touch AFTER INSERT ON items BEGIN \"\n        \"UPDATE items SET updated_at\
      \ = '%s'; END\" % new_stamp\n    )\n    return 'items_touch'\n"
    readonly: false
  visible_tests:
  - name: update stamps the changed row
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE items (id INTEGER PRIMARY KEY, name TEXT, updated_at TEXT);\")\n    conn.executemany(\"\
      INSERT INTO items VALUES (?,?,?)\", rows)\n    return conn\ndef _stamp(conn, rid):\n    return conn.execute(\"\
      SELECT updated_at FROM items WHERE id=?\", (rid,)).fetchone()[0]\ndef _rows(conn):\n    return conn.execute(\"\
      SELECT * FROM items ORDER BY id\").fetchall()\nconn = _seed([(1,'a','old'),(2,'b','old')])\nsolution(conn,\
      \ 'NEW')\nconn.execute(\"UPDATE items SET name='a2' WHERE id=1\")\nassert _stamp(conn,1) == 'NEW',\
      \ _rows(conn)\n"
  - name: untouched rows keep their stamp
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE items (id INTEGER PRIMARY KEY, name TEXT, updated_at TEXT);\")\n    conn.executemany(\"\
      INSERT INTO items VALUES (?,?,?)\", rows)\n    return conn\ndef _stamp(conn, rid):\n    return conn.execute(\"\
      SELECT updated_at FROM items WHERE id=?\", (rid,)).fetchone()[0]\ndef _rows(conn):\n    return conn.execute(\"\
      SELECT * FROM items ORDER BY id\").fetchall()\nconn = _seed([(1,'a','old'),(2,'b','old')])\nsolution(conn,\
      \ 'NEW')\nconn.execute(\"UPDATE items SET name='a2' WHERE id=1\")\nassert _stamp(conn,2) == 'old',\
      \ _rows(conn)\n"
  hidden_tests:
  - name: insert does not fire the trigger
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE items (id INTEGER PRIMARY KEY, name TEXT, updated_at TEXT);\")\n    conn.executemany(\"\
      INSERT INTO items VALUES (?,?,?)\", rows)\n    return conn\ndef _stamp(conn, rid):\n    return conn.execute(\"\
      SELECT updated_at FROM items WHERE id=?\", (rid,)).fetchone()[0]\ndef _rows(conn):\n    return conn.execute(\"\
      SELECT * FROM items ORDER BY id\").fetchall()\nconn = _seed([])\nsolution(conn, 'NEW')\nconn.execute(\"\
      INSERT INTO items VALUES (9,'fresh','orig')\")\nassert _stamp(conn,9) == 'orig', _rows(conn)\n"
  - name: trigger name is returned
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE items (id INTEGER PRIMARY KEY, name TEXT, updated_at TEXT);\")\n    conn.executemany(\"\
      INSERT INTO items VALUES (?,?,?)\", rows)\n    return conn\ndef _stamp(conn, rid):\n    return conn.execute(\"\
      SELECT updated_at FROM items WHERE id=?\", (rid,)).fetchone()[0]\ndef _rows(conn):\n    return conn.execute(\"\
      SELECT * FROM items ORDER BY id\").fetchall()\nconn = _seed([])\nname = solution(conn, 'NEW')\n\
      found = conn.execute(\"SELECT name FROM sqlite_master WHERE type='trigger'\").fetchall()\nassert\
      \ (name,) in found, (name, found)\n"
  - name: second update re-stamps only its own row
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE items (id INTEGER PRIMARY KEY, name TEXT, updated_at TEXT);\")\n    conn.executemany(\"\
      INSERT INTO items VALUES (?,?,?)\", rows)\n    return conn\ndef _stamp(conn, rid):\n    return conn.execute(\"\
      SELECT updated_at FROM items WHERE id=?\", (rid,)).fetchone()[0]\ndef _rows(conn):\n    return conn.execute(\"\
      SELECT * FROM items ORDER BY id\").fetchall()\nconn = _seed([(1,'a','old'),(2,'b','old')])\nsolution(conn,\
      \ 'NEW')\nconn.execute(\"UPDATE items SET name='b2' WHERE id=2\")\nassert _stamp(conn,1) == 'old'\
      \ and _stamp(conn,2) == 'NEW', _rows(conn)\n"
  - name: updating every row stamps every row
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE items (id INTEGER PRIMARY KEY, name TEXT, updated_at TEXT);\")\n    conn.executemany(\"\
      INSERT INTO items VALUES (?,?,?)\", rows)\n    return conn\ndef _stamp(conn, rid):\n    return conn.execute(\"\
      SELECT updated_at FROM items WHERE id=?\", (rid,)).fetchone()[0]\ndef _rows(conn):\n    return conn.execute(\"\
      SELECT * FROM items ORDER BY id\").fetchall()\nconn = _seed([(1,'a','old'),(2,'b','old')])\nsolution(conn,\
      \ 'NEW')\nconn.execute(\"UPDATE items SET name = name || 'x'\")\nassert _stamp(conn,1) == 'NEW'\
      \ and _stamp(conn,2) == 'NEW', _rows(conn)\n"
