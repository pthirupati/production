title: Filter and Sort the Active Products
slug: sql-select-active-products
technology: sqlite
category: Build
description: 'CONTEXT: A team operating SQLite has raised a ticket for `Filter and Sort the Active Products`.
  A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve it.
  Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline SQLite database file. The architecture is a single
  lab-primary node exposing sqlite3 CLI, schema, WAL mode, and pragmas; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The storefront needs a query that returns only products that are in stock
  (stock > 0) and active (active = 1), ordered by price ascending. The starter returns an empty list —
  write the SELECT.


  OBJECTIVE: Select only the columns the page needs; Filter rows with a multi-condition WHERE; Sort results
  with ORDER BY (ascending). Acceptance criteria: the change is minimal and reversible, and success means
  all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant sqlite3 CLI, schema, WAL mode, and pragmas), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Low
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Select only the columns the page needs
- Filter rows with a multi-condition WHERE
- Sort results with ORDER BY (ascending)
initial_state: The storefront needs a query that returns only products that are in stock (stock > 0) and
  active (active = 1), ordered by price ascending. The starter returns an empty list — write the SELECT.
solution_explanation: 'A SELECT lists the columns to return, WHERE keeps only the rows whose conditions

  are all true (combined with AND), and ORDER BY price ASC sorts the surviving rows

  from cheapest to most expensive. Returning (name, price) tuples in that order is

  exactly what the catalog page renders.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: implement
  instructions: "Implement solution(conn): run ONE SELECT against the `products` table and return\nits\
    \ rows. Include only products that are active (active = 1) AND in stock\n(stock > 0). Return the columns\
    \ (name, price) ordered by price ascending.\n\n  products(id INTEGER, name TEXT, price REAL, stock\
    \ INTEGER, active INTEGER)\n\nReturn conn.execute(...).fetchall() — a list of (name, price) tuples.\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def solution(conn):\n    # TODO: SELECT name, price FROM products\n    # keep only active\
      \ = 1 AND stock > 0, ORDER BY price ascending.\n    return conn.execute(\"SELECT name, price FROM\
      \ products WHERE 0\").fetchall()\n"
    readonly: false
  visible_tests:
  - name: basic filter and order
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL, stock INTEGER, active INTEGER);\n  INSERT INTO products\
      \ VALUES (1,'Widget',9.5,4,1);\n  INSERT INTO products VALUES (2,'Gadget',3.0,0,1);\n  INSERT INTO\
      \ products VALUES (3,'Gizmo',5.0,2,1);\n  INSERT INTO products VALUES (4,'Doohickey',1.0,7,0);\n\
      ''')\nassert solution(conn) == [('Gizmo', 5.0), ('Widget', 9.5)], solution(conn)\n"
  - name: only inactive or out of stock
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL, stock INTEGER, active INTEGER);\n  INSERT INTO products\
      \ VALUES (1,'A',2.0,0,1);\n  INSERT INTO products VALUES (2,'B',3.0,5,0);\n''')\nassert solution(conn)\
      \ == [], solution(conn)\n"
  hidden_tests:
  - name: orders ascending by price
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL, stock INTEGER, active INTEGER);\n  INSERT INTO products\
      \ VALUES (1,'Pricey',100.0,1,1);\n  INSERT INTO products VALUES (2,'Cheap',1.0,1,1);\n  INSERT INTO\
      \ products VALUES (3,'Mid',50.0,1,1);\n''')\nassert solution(conn) == [('Cheap',1.0),('Mid',50.0),('Pricey',100.0)],\
      \ solution(conn)\n"
  - name: stock zero excluded even if active
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL, stock INTEGER, active INTEGER);\n  INSERT INTO products\
      \ VALUES (1,'InStock',4.0,1,1);\n  INSERT INTO products VALUES (2,'Empty',2.0,0,1);\n''')\nassert\
      \ solution(conn) == [('InStock', 4.0)], solution(conn)\n"
  - name: returns only name and price columns
    code: "import sqlite3\nconn = sqlite3.connect(\":memory:\")\nconn.executescript('''\n  CREATE TABLE\
      \ products(id INTEGER, name TEXT, price REAL, stock INTEGER, active INTEGER);\n  INSERT INTO products\
      \ VALUES (7,'Solo',12.5,3,1);\n''')\nrows = solution(conn)\nassert rows == [('Solo', 12.5)], rows\n\
      assert len(rows[0]) == 2, rows[0]\n"
  - name: empty table
    code: 'import sqlite3

      conn = sqlite3.connect(":memory:")

      conn.executescript(''CREATE TABLE products(id INTEGER, name TEXT, price REAL, stock INTEGER, active
      INTEGER);'')

      assert solution(conn) == [], solution(conn)

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: filter and sort the active products is not behaving
    as the scenario objectives require. This lab is about filter and sort the active products — how filter
    and sort the active products behaves in a SQLite environment. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For filter and sort the active products problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small,
    reversible steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `solution.py`, read the instructions, and run the visible tests to see which assertion fails
    first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of filter and sort the active products is at
    fault.

    2. Re-run the most relevant of sqlite3 CLI, schema, WAL mode, and pragmas focused on just that part
    to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''filter and sort
    the active products is not behaving as the scenario objectives require'' toward ''all hidden tests
    pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `solution.py` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
