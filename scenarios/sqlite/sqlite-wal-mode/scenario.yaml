coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Readers hit ''database is locked'' under concurrency because the journal mode is wrong.
    Fix solution(conn) so it returns the journal mode that lets readers run concurrently with a writer.
    Read the current mode from `settings(key, value)` where key=''journal_mode''; if it is already ''wal''
    leave it alone, otherwise change it to ''wal''. Persist the value back to settings and return the
    final mode as a lowercase string.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn):\n    # BUG: reports the mode it found without ever switching it, so\
      \ a database\n    # left on 'delete' keeps serialising readers behind the writer.\n    return conn.execute(\n\
      \        \"SELECT value FROM settings WHERE key='journal_mode'\").fetchone()[0].lower()\n"
    readonly: false
  visible_tests:
  - name: delete mode is switched to wal
    code: "import sqlite3\ndef _seed(mode):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ settings VALUES (?,?)\",\n                     [('journal_mode', mode), ('cache_size', '2000')])\n\
      \    return conn\ndef _mode(conn):\n    return conn.execute(\"SELECT value FROM settings WHERE key='journal_mode'\"\
      ).fetchone()[0]\nconn = _seed('delete')\nassert solution(conn) == 'wal', solution(conn)\n"
  - name: change is persisted
    code: "import sqlite3\ndef _seed(mode):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ settings VALUES (?,?)\",\n                     [('journal_mode', mode), ('cache_size', '2000')])\n\
      \    return conn\ndef _mode(conn):\n    return conn.execute(\"SELECT value FROM settings WHERE key='journal_mode'\"\
      ).fetchone()[0]\nconn = _seed('delete')\nsolution(conn)\nassert _mode(conn) == 'wal', _mode(conn)\n"
  hidden_tests:
  - name: already-wal database stays wal
    code: "import sqlite3\ndef _seed(mode):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ settings VALUES (?,?)\",\n                     [('journal_mode', mode), ('cache_size', '2000')])\n\
      \    return conn\ndef _mode(conn):\n    return conn.execute(\"SELECT value FROM settings WHERE key='journal_mode'\"\
      ).fetchone()[0]\nconn = _seed('wal')\nassert solution(conn) == 'wal', solution(conn)\n"
  - name: truncate mode is switched too
    code: "import sqlite3\ndef _seed(mode):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ settings VALUES (?,?)\",\n                     [('journal_mode', mode), ('cache_size', '2000')])\n\
      \    return conn\ndef _mode(conn):\n    return conn.execute(\"SELECT value FROM settings WHERE key='journal_mode'\"\
      ).fetchone()[0]\nconn = _seed('truncate')\nassert solution(conn) == 'wal', solution(conn)\n"
  - name: uppercase stored mode is normalised
    code: "import sqlite3\ndef _seed(mode):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ settings VALUES (?,?)\",\n                     [('journal_mode', mode), ('cache_size', '2000')])\n\
      \    return conn\ndef _mode(conn):\n    return conn.execute(\"SELECT value FROM settings WHERE key='journal_mode'\"\
      ).fetchone()[0]\nconn = _seed('DELETE')\nassert solution(conn) == 'wal', solution(conn)\n"
  - name: no other setting is disturbed
    code: "import sqlite3\ndef _seed(mode):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT);\")\n    conn.executemany(\"INSERT INTO\
      \ settings VALUES (?,?)\",\n                     [('journal_mode', mode), ('cache_size', '2000')])\n\
      \    return conn\ndef _mode(conn):\n    return conn.execute(\"SELECT value FROM settings WHERE key='journal_mode'\"\
      ).fetchone()[0]\nconn = _seed('delete')\nsolution(conn)\nother = conn.execute(\"SELECT value FROM\
      \ settings WHERE key='cache_size'\").fetchone()[0]\nassert other == '2000', other\n"
  timeout: 8
