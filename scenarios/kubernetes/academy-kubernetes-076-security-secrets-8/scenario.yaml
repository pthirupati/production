description: 'CONTEXT: A team operating Kubernetes needs you to resolve `kubernetes: Secrets — Security
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around Secrets. Assume
  an auditor or pen test is next week — tighten controls with evidence. Security review: harden Secrets
  on this kubernetes system. Close unsafe defaults, enforce least privilege, and ensure secret types,
  mounting, RBAC access, and rotation cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to Secrets are removed or constrained; Access follows least privilege
  and is auditable; Security checks pass without breaking required functionality. Success means `kubectl
  get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to Secrets are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around Secrets. Assume an auditor or
  pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get secret`, volume mounts, and ServiceAccount permissions.

    2. Write down what looks normal versus wrong or missing for Secrets.

    3. Recall the core idea: secret types, mounting, RBAC access, and rotation. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `kubectl get secret`, volume mounts, and ServiceAccount permissions.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — only intended workloads can read the secret and apps authenticate successfully.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
