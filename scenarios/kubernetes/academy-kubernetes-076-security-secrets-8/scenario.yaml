title: 'Kubernetes: Secrets — Security Practice'
slug: academy-kubernetes-076-security-secrets-8
technology: Kubernetes
category: Security
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Security review: harden Secrets on this Kubernetes system. Close unsafe
  defaults, enforce least privilege, and ensure secret types, mounting, RBAC access,
  and rotation cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to Secrets are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around Secrets.
  Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get secret`, volume mounts, and ServiceAccount
    permissions.

    2. Write down what looks normal versus wrong or missing for Secrets.

    3. Recall the core idea: secret types, mounting, RBAC access, and rotation. Form
    one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Secrets.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `kubectl get secret`, volume mounts, and ServiceAccount
    permissions.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit
    access the workload actually needs.

    3. Verify the result — only intended workloads can read the secret and apps authenticate
    successfully.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-kubernetes-076-security-secrets-8.conf`,
    then click Check Solution.'
