title: PersistentVolumeClaim Stuck Pending
slug: k8s-pvc-pending
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `PersistentVolumeClaim Stuck Pending`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. A PVC sits in Pending because no PV matches
  and no default StorageClass is configured to provision one. The dependent pod is stuck ContainerCreating.
  A PersistentVolumeClaim is stuck in Pending and the pod that needs it won''t start. No PersistentVolume
  satisfies the claim — either there is no default StorageClass to dynamically provision one, or the requested
  StorageClass/size/accessModes don''t match any available PV. Provide a binding so the PVC is satisfied
  and the pod can mount its volume.


  OBJECTIVE: Inspect the PVC and see why it cannot bind; Check StorageClasses and any available PersistentVolumes;
  Provide a matching StorageClass/PV so the PVC binds and the pod starts. Success means `kubectl get pods`
  shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated Kubernetes cluster. A PVC sits in Pending because no PV matches and no default
  StorageClass is configured to provision one. The dependent pod is stuck ContainerCreating.
objectives:
- Inspect the PVC and see why it cannot bind
- Check StorageClasses and any available PersistentVolumes
- Provide a matching StorageClass/PV so the PVC binds and the pod starts
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
