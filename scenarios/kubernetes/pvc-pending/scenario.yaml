title: PersistentVolumeClaim Stuck Pending
slug: k8s-pvc-pending
difficulty: medium
category: Kubernetes
description: 'A PersistentVolumeClaim remains in Pending state and the pod that depends
  on it cannot start. The StorageClass referenced in the PVC does not exist in the
  cluster, so no PersistentVolume can be dynamically provisioned.

  '
initial_state: 'Simulated Kubernetes cluster. A StatefulSet pod is stuck in Pending
  because its PVC "data-pvc" cannot bind. No storage has been provisioned.

  '
objectives:
  - Identify why the PVC is stuck in Pending state
  - Create or correct the StorageClass so the PVC can be satisfied
  - Confirm the PVC transitions to Bound and the pod starts successfully
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: false
hints:
  - content: 'Run: kubectl describe pvc data-pvc and look at the Events for provisioning
      errors.'
    cost: 10
    order: 1
  - content: 'Check available storage classes: kubectl get storageclass. The PVC requests
      a class that may not exist.'
    cost: 15
    order: 2
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
