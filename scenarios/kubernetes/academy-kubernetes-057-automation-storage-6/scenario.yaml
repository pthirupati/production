title: 'Kubernetes: Kubernetes Storage — Automation Practice'
slug: academy-kubernetes-057-automation-storage-6
technology: Kubernetes
category: Automation
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Kubernetes operations lab. One or more pods are **not Running** — workloads for Automation
  Practice cannot serve traffic. Inspect with `kubectl get pods`, read `kubectl describe pod` events,
  fix the root cause, and confirm all pods Running.
objectives:
- All pods in the default namespace are Running
- '`kubectl get pods` shows every pod Running'
- The deployment survives `kubectl get pods` re-check
initial_state: The cluster is up but at least one pod is CrashLoopBackOff or Pending.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get pv,pvc,sc` and `kubectl describe pvc`.

    2. Write down what looks normal versus wrong or missing for Kubernetes storage.

    3. Recall the core idea: PV/PVC binding, storage classes, and access modes. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Kubernetes storage.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `kubectl get pv,pvc,sc` and `kubectl describe pvc`.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — PVCs bind and pods mount the volume read/write.

    4. Click Check Solution once `kubectl get pods` shows every pod Running.'
