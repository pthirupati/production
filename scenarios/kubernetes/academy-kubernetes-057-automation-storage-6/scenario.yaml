description: 'CONTEXT: A team operating Kubernetes needs you to resolve `kubernetes: Kubernetes Storage
  — Automation Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for Kubernetes storage. Automate the
  boring parts without hiding important safety checks. Automation lab: remove toil around Kubernetes storage.
  Codify repeatable steps for PV/PVC binding, storage classes, and access modes and prove the automation
  is idempotent.


  OBJECTIVE: Day-2 Kubernetes storage work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `kubectl get
  pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 Kubernetes storage work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for Kubernetes storage. Automate the boring parts
  without hiding important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get pv,pvc,sc` and `kubectl describe pvc`.

    2. Write down what looks normal versus wrong or missing for Kubernetes storage.

    3. Recall the core idea: PV/PVC binding, storage classes, and access modes. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `kubectl get pv,pvc,sc` and `kubectl describe pvc`.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — PVCs bind and pods mount the volume read/write.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
