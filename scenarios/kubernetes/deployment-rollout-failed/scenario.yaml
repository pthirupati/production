title: Deployment Rollout Failed
slug: k8s-deployment-rollout-failed
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Deployment Rollout Failed` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. A deployment was updated, but the new ReplicaSet''s
  pods never become Ready, so the rollout is wedged and `kubectl rollout status` hangs. A deployment rollout
  is stuck and `kubectl rollout status` never completes. The new ReplicaSet''s pods are failing their
  readiness probe (or crashing on a bad config), so the rollout is paused mid-progress and old pods remain.
  Diagnose why the new pods are not becoming Ready and either fix the spec or roll back.


  OBJECTIVE: Inspect rollout status and the new vs old ReplicaSet; Determine why the new pods fail to
  become Ready (probe, image, or config); Fix the spec or roll back so the deployment fully progresses.
  Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
lab_mode: simulation
simulation_type: kubernetes
time_limit: 900
max_score: 100
is_free: false
objectives:
- Inspect rollout status and the new vs old ReplicaSet
- Determine why the new pods fail to become Ready (probe, image, or config)
- Fix the spec or roll back so the deployment fully progresses
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
