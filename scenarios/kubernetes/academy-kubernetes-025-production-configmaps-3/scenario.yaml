description: 'CONTEXT: A team operating Kubernetes needs you to resolve `kubernetes: Configmaps — Production
  Readiness` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but ConfigMaps is not production ready — missing
  guardrails, runbooks, or capacity checks. Production readiness for ConfigMaps. Harden, document, and
  validate key/value config, mounted files, envFrom, and rollout after config changes so the change is
  safe to run during a maintenance window.


  OBJECTIVE: Day-2 ConfigMaps work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `kubectl get pods` shows every
  pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 ConfigMaps work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but ConfigMaps is not production ready — missing guardrails,
  runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get cm`, mounted paths in pods, and `kubectl describe pod`.

    2. Write down what looks normal versus wrong or missing for ConfigMaps.

    3. Recall the core idea: key/value config, mounted files, envFrom, and rollout after config changes.
    Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `kubectl get cm`, mounted paths in pods, and `kubectl describe pod`.

    2. Apply production standards for ConfigMaps: resource limits, monitoring, access controls, and a
    written rollback step.

    3. Verify the result — pods see updated config after rollout and apps start cleanly.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
