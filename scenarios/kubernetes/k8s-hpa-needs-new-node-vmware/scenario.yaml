title: HPA Wants More Pods but the Cluster is Out of Nodes - Add a
slug: k8s-hpa-needs-new-node-vmware
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `HPA Wants More Pods but the Cluster
  is Out of Nodes - Add a` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes cluster with one control-plane and one worker (worker-1). The
  `web`

  Deployment''s HPA targets 4 replicas under load but only 2 are Running; the other

  2 are Pending (Insufficient cpu). A second worker VM, `k8s-worker-2`, exists in

  the VMware inventory but is powered off, so node worker-2 has not joined. The `web` Deployment is under
  sustained load. Its HorizontalPodAutoscaler has

  decided it needs 4 replicas, but two of the pods are stuck Pending with

  FailedScheduling "Insufficient cpu" — the single worker node (worker-1) is full.

  This cluster runs ON VMware: each Kubernetes node is a VMware VM. You cannot fix

  this from kubectl alone — there is genuinely no room to schedule the pods.


  This is a CROSS-TECHNOLOGY task. Open the VMware simulator for this lab (toolbar

  -> Open VMware), power on the spare worker-node VM `k8s-worker-2` (it is in the

  inventory, powered off). It joins the cluster as node `worker-2` and the Pending

  pods schedule onto it. Then confirm from the terminal that the HPA is satisfied

  and all pods are Running across both nodes.


  OBJECTIVE: Inspect the Pending pods and the HPA (kubectl get pods, kubectl describe hpa web); Confirm
  the cluster is out of schedulable capacity (kubectl get nodes shows one worker); Open the VMware simulator
  and power on the worker-node VM k8s-worker-2. Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A Kubernetes cluster with one control-plane and one worker (worker-1). The `web`

