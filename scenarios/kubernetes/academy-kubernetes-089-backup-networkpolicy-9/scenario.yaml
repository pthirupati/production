description: 'CONTEXT: A team operating Kubernetes has raised a ticket for `Network Policies — Backup
  Lab`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster. The architecture is a single
  lab-primary node exposing kubectl, manifests, and cluster resources; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for network policies. Leadership
  wants proof that restore works — not just that scripts exit zero.


  OBJECTIVE: Backup coverage for network policies is complete and restorable; Retention and encryption
  meet the stated policy; A restore drill proves data integrity. Acceptance criteria: the change is minimal
  and reversible, and success means `kubectl get pods` shows every pod Running.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant kubectl, manifests, and cluster resources), changing one thing at a time. Check your
  work continuously against the objective — success means `kubectl get pods` shows every pod Running.


  VERIFY: Re-run the same check the grader uses and confirm `kubectl get pods` shows every pod Running.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for network policies is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for network policies. Leadership wants proof
  that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: allowed traffic is blocked or everything is
    open. This lab is about network policies — ingress/egress rules, selectors, and default deny. Read
    the objectives and the current state, and note precisely what looks wrong versus healthy before you
    form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For network policies problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Repair or run the backup job, then perform a controlled restore
    into a scratch location to prove it works.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `kubectl get pods -A` and `kubectl describe pod <name>` for Events and container state.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Check pod phase, restarts, and last State reason.

    2. `kubectl logs <pod> --previous` if it crashed.

    3. Compare resource spec (probes, limits, mounts) to objectives.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Patch the Deployment/Service/ConfigMap with the minimal fix.

    2. Wait for rollout (`kubectl rollout status`).

    3. Confirm `kubectl get pods` succeeds.


    WHY: Kubernetes labs grade real cluster state.'
