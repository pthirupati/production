description: 'CONTEXT: A team operating Kubernetes needs you to resolve `kubernetes: Network Policies
  — Backup and Recovery` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for network policies. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for network
  policies. Ensure backups run on schedule, retention is correct, and you can restore ingress/egress rules,
  selectors, and default deny within the lab RTO.


  OBJECTIVE: Backup coverage for network policies is complete and restorable; Retention and encryption
  meet the stated policy; A restore drill proves data integrity. Success means `kubectl get pods` shows
  every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for network policies is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for network policies. Leadership wants proof
  that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get netpol` and `kubectl describe netpol`.

    2. Write down what looks normal versus wrong or missing for network policies.

    3. Recall the core idea: ingress/egress rules, selectors, and default deny. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `kubectl get netpol` and `kubectl describe netpol`.

    2. Repair or run the backup job, then perform a controlled restore into a scratch location to prove
    it works.

    3. Verify the result — only intended pod-to-pod traffic is permitted.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
