description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Pod Pending from Resource Quota
  Exhausted` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes namespace whose ResourceQuota is fully consumed, leaving new
  pods Pending. New pods are Pending because the namespace ResourceQuota is exhausted. Right-size requests
  or raise the quota and confirm pods schedule.


  OBJECTIVE: Confirm pods are Pending due to quota; Lower requests or raise the quota; Verify pods schedule
  and the cluster is healthy. Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A Kubernetes namespace whose ResourceQuota is fully consumed, leaving new pods Pending.
objectives:
- Confirm pods are Pending due to quota
- Lower requests or raise the quota
- Verify pods schedule and the cluster is healthy
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
