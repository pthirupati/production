description: 'CONTEXT: A team operating Kubernetes needs you to resolve `kubernetes: Kubernetes Services
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Kubernetes cluster is healthy enough for scheduled work on Kubernetes
  Services. Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine
  Kubernetes Services task safely in kubernetes. Follow change control — inspect, change, verify — while
  working with ClusterIP/NodePort/LoadBalancer, selectors, endpoints, and kube-proxy routing.


  OBJECTIVE: Day-2 Kubernetes Services work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `kubectl get
  pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 Kubernetes Services work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The Kubernetes cluster is healthy enough for scheduled work on Kubernetes Services. Complete
  the maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get svc,endpoints`, `kubectl describe svc`, and pod labels.

    2. Write down what looks normal versus wrong or missing for Kubernetes Services.

    3. Recall the core idea: ClusterIP/NodePort/LoadBalancer, selectors, endpoints, and kube-proxy routing.
    Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `kubectl get svc,endpoints`, `kubectl describe svc`, and pod labels.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — Service endpoints match ready pods and probes succeed through the Service IP.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
