category: Fix
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Pod CrashLoopBackOff` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. An nginx pod enters CrashLoopBackOff: it starts,
  the container immediately exits non-zero, and the kubelet keeps restarting it with growing backoff.
  An nginx pod is stuck in CrashLoopBackOff and restarts continuously. The container exits immediately
  on startup — typically a bad image tag, a missing config file the container expects, or a failing command.
  Inspect the pod''s logs and previous-container output to find why it exits, then fix the deployment
  so the pod stays Running.


  OBJECTIVE: Identify the crash-looping pod and its restart count; Read the crashing container''s logs
  to find the exit cause; Fix the deployment (image/config/command) so the pod stays Running. Success
  means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
