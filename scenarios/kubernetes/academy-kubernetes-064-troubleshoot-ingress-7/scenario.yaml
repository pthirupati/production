description: 'CONTEXT: A team operating Kubernetes needs you to resolve `kubernetes: Ingress — Troubleshooting
  Drill` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Kubernetes cluster is degraded. Http routes return 404/502 or tls handshake
  fails. Recent changes may exist around Ingress, but do not restart blindly — gather evidence first.
  Production alert: HTTP routes return 404/502 or TLS handshake fails. You are on call for kubernetes
  and must troubleshoot Ingress methodically — triage symptoms, isolate root cause, apply the smallest
  safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: HTTP routes return 404/502 or TLS handshake fails; Root cause
  is isolated with evidence, not guesswork; Service behavior returns to normal after the fix. Success
  means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: HTTP routes return 404/502 or TLS handshake fails'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Kubernetes cluster is degraded. Http routes return 404/502 or tls handshake fails.
  Recent changes may exist around Ingress, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl describe ingress`, controller logs, and backend Service health.

    2. Write down what looks normal versus wrong or missing for Ingress.

    3. Recall the core idea: hosts, paths, TLS secrets, and ingress controller routing. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `kubectl describe ingress`, controller logs, and backend Service health.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — requests reach the intended backend with a valid certificate chain.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
