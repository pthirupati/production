title: Ingress Returns 404
slug: sim-k8s-ingress-404
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Ingress Returns 404` during a
  realistic incident. The business impact is reduced service reliability until the underlying state is
  repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster with an ingress controller. An Ingress resource
  routes the app hostname, but the backend Service name or port is wrong, producing 404s for every request
  to that host. An Ingress returns 404 Not Found for the application hostname. The Ingress rule points
  to a Service name or port that does not exist (or the path/host doesn''t match the request), so the
  ingress controller has no backend to route to. Correct the Ingress backend so the site loads.


  OBJECTIVE: Reproduce the 404 and inspect the Ingress rules; Verify the referenced Service name and port
  actually exist; Fix the Ingress backend so requests reach the Service and return 200. Success means
  `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated Kubernetes cluster with an ingress controller. An Ingress resource routes the
  app hostname, but the backend Service name or port is wrong, producing 404s for every request to that
  host.
lab_mode: simulation
simulation_type: kubernetes
