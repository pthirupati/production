title: ServiceAccount RBAC Forbidden
slug: sim-k8s-rbac
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `ServiceAccount RBAC Forbidden`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. A pod uses a ServiceAccount that lacks RBAC
  permissions; API calls fail with "User \"system:serviceaccount:...\" cannot list resource pods". An
  application''s ServiceAccount is getting "Forbidden" errors when calling the Kubernetes API (e.g. listing
  pods). The ServiceAccount has no Role/RoleBinding granting the verbs and resources it needs, so the
  API server denies the request. Create the appropriate Role and RoleBinding to grant least-privilege
  access.


  OBJECTIVE: Identify the ServiceAccount and the exact forbidden verb/resource; Create a Role granting
  the needed permissions in the namespace; Bind the Role to the ServiceAccount and confirm the call succeeds.
  Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated Kubernetes cluster. A pod uses a ServiceAccount that lacks RBAC permissions;
  API calls fail with "User \"system:serviceaccount:...\" cannot list resource pods".
lab_mode: simulation
simulation_type: kubernetes
is_free: false
jira_priority: Medium
max_score: 100
time_limit: 900
dual_terminal: false
requires_companion_hosts: false
objectives:
- Identify the ServiceAccount and the exact forbidden verb/resource
- Create a Role granting the needed permissions in the namespace
- Bind the Role to the ServiceAccount and confirm the call succeeds
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
