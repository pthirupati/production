title: 'Kubernetes: Deployments — Build From Scratch'
slug: academy-kubernetes-062-build-deployments-7
technology: Kubernetes
category: Build Lab
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: kubernetes
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Kubernetes operations lab. One or more pods are **not Running** — workloads for Build From
  Scratch cannot serve traffic. Inspect with `kubectl get pods`, read `kubectl describe pod` events, fix
  the root cause, and confirm all pods Running.
objectives:
- All pods in the default namespace are Running
- '`kubectl get pods` shows every pod Running'
- The deployment survives `kubectl get pods` re-check
initial_state: The cluster is up but at least one pod is CrashLoopBackOff or Pending.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get deploy`, `kubectl rollout status`, and `kubectl describe
    deploy`.

    2. Write down what looks normal versus wrong or missing for Deployments.

    3. Recall the core idea: replicas, rollout strategy, selectors, and revision history. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Deployments.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `kubectl get deploy`, `kubectl rollout status`, and `kubectl describe
    deploy`.

    2. Create the smallest working slice of Deployments first, validate it, then add the remaining pieces
    one at a time.

    3. Verify the result — desired replicas are available and the rollout completed.

    4. Click Check Solution once `kubectl get pods` shows every pod Running.'
