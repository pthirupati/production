title: 'Kubernetes: Network Policies — Backup and Recovery'
slug: academy-kubernetes-059-backup-networkpolicy-6
technology: Kubernetes
category: Backup & Recovery
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Kubernetes operations lab. One or more pods are **not Running** — workloads for Backup and
  Recovery cannot serve traffic. Inspect with `kubectl get pods`, read `kubectl describe pod` events,
  fix the root cause, and confirm all pods Running.
objectives:
- All pods in the default namespace are Running
- '`kubectl get pods` shows every pod Running'
- The deployment survives `kubectl get pods` re-check
initial_state: The cluster is up but at least one pod is CrashLoopBackOff or Pending.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get netpol` and `kubectl describe netpol`.

    2. Write down what looks normal versus wrong or missing for network policies.

    3. Recall the core idea: ingress/egress rules, selectors, and default deny. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for network policies.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `kubectl get netpol` and `kubectl describe netpol`.

    2. Repair or run the backup job, then perform a controlled restore into a scratch location to prove
    it works.

    3. Verify the result — only intended pod-to-pod traffic is permitted.

    4. Click Check Solution once `kubectl get pods` shows every pod Running.'
