title: Node Maintenance - Drain worker-1, Bring Up a Replacement
slug: k8s-drain-node-poweroff-vmware
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Node Maintenance - Drain worker-1,
  Bring Up a Replacement` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes cluster with one worker (worker-1) hosting all 3 billing pods.
  A

  replacement worker VM k8s-worker-2 exists in the VMware inventory, powered off.

  worker-1 must be drained onto a freshly-joined worker-2 before it can be taken

  down for maintenance. Worker node `worker-1` needs to come out of service for hardware maintenance,
  but

  it is the only worker and is running all three `billing` pods. You must move the

  workload off it WITHOUT downtime. This Kubernetes cluster runs ON VMware — each

  node is a VMware VM — so the maintenance is a two-part, cross-technology job:

  bring up a replacement node and drain the old one.


  Steps: (1) In the VMware simulator (toolbar -> Open VMware) power on the spare

  worker VM `k8s-worker-2` so node worker-2 joins. (2) In the terminal, cordon and

  drain worker-1 (`kubectl drain worker-1 --ignore-daemonsets`) so its pods evict

  and reschedule onto worker-2. The lab passes when worker-1 is drained

  (unschedulable, no pods left on it), worker-2 is Ready, and all billing pods are

  Running. (In production you would then power off k8s-worker-1 for the hardware

  work.)


  OBJECTIVE: Confirm worker-1 hosts all billing pods (kubectl get pods -o wide); Open the VMware simulator
  and power on the replacement worker VM k8s-worker-2; Confirm worker-2 is Ready (kubectl get nodes).
  Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A Kubernetes cluster with one worker (worker-1) hosting all 3 billing pods. A

  replacement worker VM k8s-worker-2 exists in the VMware inventory, powered off.

  worker-1 must be drained onto a freshly-joined worker-2 before it can be taken

  down for maintenance.

  '
objectives:
- Confirm worker-1 hosts all billing pods (kubectl get pods -o wide)
- Open the VMware simulator and power on the replacement worker VM k8s-worker-2
- Confirm worker-2 is Ready (kubectl get nodes)
- Cordon and drain worker-1 so its pods reschedule (kubectl drain worker-1 --ignore-daemonsets)
- Verify worker-1 is unschedulable with no pods and all billing pods Running on worker-2
lab_mode: simulation
simulation_type: kubernetes
cross_technology: true
vmware_link: true
time_limit: 1500
max_score: 100
is_free: false
jira_priority: High
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
