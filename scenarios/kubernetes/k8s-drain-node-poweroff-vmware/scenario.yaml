  down for maintenance.

  '
objectives:
- Confirm worker-1 hosts all billing pods (kubectl get pods -o wide)
- Open the VMware simulator and power on the replacement worker VM k8s-worker-2
- Confirm worker-2 is Ready (kubectl get nodes)
- Cordon and drain worker-1 so its pods reschedule (kubectl drain worker-1 --ignore-daemonsets)
- Verify worker-1 is unschedulable with no pods and all billing pods Running on worker-2
