title: StatefulSet Stuck on PodManagementPolicy
slug: k8s-statefulset-stuck-ordered
technology: Kubernetes
category: Workloads
difficulty: hard
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: A StatefulSet rollout is stuck because pod-0 crash-loops and OrderedReady blocks the rest.
  Fix pod-0's config and confirm the set becomes healthy.
initial_state: A Kubernetes StatefulSet whose first pod crash-loops, blocking the ordered rollout of the
  remaining replicas.
objectives:
- Confirm the StatefulSet is blocked on a crashing pod-0
- Fix the failing pod's configuration and roll out
- Verify all pods are Running
hints:
- order: 1
  cost: 10
  content: kubectl get pods shows pod-0 CrashLoopBackOff and others stuck.
- order: 2
  cost: 15
  content: Fix pod-0's config and roll out the StatefulSet.
- order: 3
  cost: 20
  content: All pods Running.
