title: Worker Node NotReady — Reset its VM in VMware to Recover
slug: k8s-node-notready-vmware-reset
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Worker Node NotReady — Reset
  its VM in VMware to Recover` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes cluster whose worker-1 node is NotReady because its VMware VM

  (k8s-worker-1) is hung. A payments pod is Pending (the node has a not-ready taint).

  A healthy k8s-worker-2 is also present. Only a VMware reset of k8s-worker-1

  recovers the node. Node `worker-1` has gone NotReady and a `payments` pod scheduled to it is stuck

  Pending — the kubelet has stopped reporting because the node''s VM is hung (no

  guest heartbeat). This Kubernetes cluster runs ON VMware: each node is a VMware

  VM, so a wedged node is a wedged VM. You cannot recover a hung node with kubectl;

  uncordon/delete will not bring back a dead kubelet.


  This is a CROSS-TECHNOLOGY task. Open the VMware simulator (toolbar -> Open VMware),

  select the node VM `k8s-worker-1`, and perform a hard Reset (VM Actions -> Power ->

  Reset). When the VM reboots, the kubelet re-registers, the node returns to Ready,

  and the Pending pod reschedules. Confirm from the terminal that worker-1 is Ready

  and all pods are Running.


  OBJECTIVE: Confirm worker-1 is NotReady (kubectl get nodes) and a pod is Pending (kubectl get pods);
  Recognise the node VM is hung — kubectl cannot revive a dead kubelet; Open the VMware simulator and
  Reset the node VM k8s-worker-1 (Power -> Reset). Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A Kubernetes cluster whose worker-1 node is NotReady because its VMware VM

  (k8s-worker-1) is hung. A payments pod is Pending (the node has a not-ready taint).

  A healthy k8s-worker-2 is also present. Only a VMware reset of k8s-worker-1

  recovers the node.

  '
objectives:
- Confirm worker-1 is NotReady (kubectl get nodes) and a pod is Pending (kubectl get pods)
- Recognise the node VM is hung — kubectl cannot revive a dead kubelet
- Open the VMware simulator and Reset the node VM k8s-worker-1 (Power -> Reset)
- Confirm worker-1 returns to Ready (kubectl get nodes)
- Verify the stranded pod reschedules and all pods are Running (kubectl get pods)
