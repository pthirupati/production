title: Worker Node NotReady — Reset its VM in VMware to Recover
slug: k8s-node-notready-vmware-reset
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Kubernetes has raised a ticket for `Worker Node NotReady — Reset
  its VM in VMware to Recover`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster. The architecture is a single
  lab-primary node exposing kubectl, manifests, and cluster resources; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes cluster whose worker-1 node is NotReady because its VMware VM

  (k8s-worker-1) is hung. A payments pod is Pending (the node has a not-ready taint).

  A healthy k8s-worker-2 is also present. Only a VMware reset of k8s-worker-1

  recovers the node.


  OBJECTIVE: Confirm worker-1 is NotReady (kubectl get nodes) and a pod is Pending (kubectl get pods);
  Recognise the node VM is hung — kubectl cannot revive a dead kubelet; Open the VMware console and
  Reset the node VM k8s-worker-1 (Power -> Reset). Acceptance criteria: the change is minimal and reversible,
  and success means `kubectl get pods` shows every pod Running.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant kubectl, manifests, and cluster resources), changing one thing at a time. Check your
  work continuously against the objective — success means `kubectl get pods` shows every pod Running.


  VERIFY: Re-run the same check the grader uses and confirm `kubectl get pods` shows every pod Running.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
