description: 'CONTEXT: A team operating Kubernetes needs you to resolve `kubernetes: Kubernetes Pods —
  Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Kubernetes cluster is online with a starter Kubernetes pods setup. Some
  pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus
  on observation. This beginner-friendly kubernetes lab introduces Kubernetes pods. You will explore pod
  spec, containers, probes, resources, and scheduling on the Kubernetes cluster. Read the environment
  first, then follow the guided steps — no prior production experience required.


  OBJECTIVE: Understand how Kubernetes pods work in this lab environment; Identify the main status and
  configuration signals for Kubernetes pods; Confirm you can read the current state confidently before
  changing anything. Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how Kubernetes pods work in this lab environment
- Identify the main status and configuration signals for Kubernetes pods
- Confirm you can read the current state confidently before changing anything
initial_state: The Kubernetes cluster is online with a starter Kubernetes pods setup. Some pieces are
  intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl describe pod`, `kubectl logs`, and the rendered manifest.

    2. Write down what looks normal versus wrong or missing for Kubernetes pods.

    3. Recall the core idea: pod spec, containers, probes, resources, and scheduling. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `kubectl describe pod`, `kubectl logs`, and the rendered manifest.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — pods are Running/Ready with healthy probe results.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
