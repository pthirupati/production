description: 'CONTEXT: A team operating Kubernetes needs you to resolve `kubernetes: Autoscaling — Integration
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for autoscaling. Downstream
  consumers are waiting on this integration path. Integration lab: connect autoscaling with an adjacent
  platform in the kubernetes stack. Validate authentication, data handoff, and failure behavior for HPA
  metrics, min/max replicas, and resource requests.


  OBJECTIVE: autoscaling is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `kubectl get
  pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- autoscaling is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for autoscaling. Downstream consumers
  are waiting on this integration path.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get hpa` and `kubectl describe hpa`.

    2. Write down what looks normal versus wrong or missing for autoscaling.

    3. Recall the core idea: HPA metrics, min/max replicas, and resource requests. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `kubectl get hpa` and `kubectl describe hpa`.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — replicas scale with load between the configured bounds.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
