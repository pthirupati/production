objectives:
- Day-2 Kubernetes storage work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for Kubernetes storage. Automate
  the boring parts without hiding important safety checks.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get pv,pvc,sc` and `kubectl describe pvc`.

    2. Write down what looks normal versus wrong or missing for Kubernetes storage.

    3. Recall the core idea: PV/PVC binding, storage classes, and access modes. Form
    one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Kubernetes storage.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `kubectl get pv,pvc,sc` and `kubectl describe
    pvc`.

    2. Implement the automation with dry-run / check mode, then run it twice — the
    second run must report no changes.

    3. Verify the result — PVCs bind and pods mount the volume read/write.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-kubernetes-067-automation-storage-7.conf`,
    then click Check Solution.'
