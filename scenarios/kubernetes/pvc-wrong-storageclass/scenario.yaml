title: PVC Stuck — Wrong StorageClass
slug: sim-k8s-pvc-storageclass
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `PVC Stuck — Wrong StorageClass`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. A PVC specifies storageClassName: fast-ssd,
  but no such StorageClass exists. The PVC remains Pending and its pod stays ContainerCreating. A PVC
  will not bind because it requests a StorageClass that does not exist in the cluster. The claim names
  a class (e.g. fast-ssd) with no matching provisioner or PV, so it stays Pending forever and the workload
  can''t start. Point the PVC at an existing StorageClass so it can be provisioned.


  OBJECTIVE: Confirm the PVC is Pending due to a missing StorageClass; List the StorageClasses that actually
  exist in the cluster; Bind the PVC to a valid StorageClass so the volume provisions. Success means `kubectl
  get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
