title: NetworkPolicy Blocks Backend Traffic
slug: k8s-network-policy-block
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `NetworkPolicy Blocks Backend
  Traffic` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster with NetworkPolicies enforced. A NetworkPolicy
  on the backend denies ingress from the frontend pods, so frontend-to-backend calls time out. Backend
  pods became unreachable after a NetworkPolicy was applied. A default-deny or overly-narrow ingress policy
  now blocks traffic from the frontend pods to the backend, causing connection timeouts. Adjust the NetworkPolicy
  to allow the legitimate frontend traffic while keeping everything else denied.


  OBJECTIVE: Reproduce the blocked frontend-to-backend connection; Inspect the NetworkPolicy selecting
  the backend pods; Add an ingress rule that permits the frontend pods and verify connectivity. Success
  means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
lab_mode: simulation
simulation_type: kubernetes
time_limit: 900
max_score: 100
is_free: false
objectives:
- Reproduce the blocked frontend-to-backend connection
- Inspect the NetworkPolicy selecting the backend pods
- Add an ingress rule that permits the frontend pods and verify connectivity
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
