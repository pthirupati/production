hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: deployment ImagePullBackOff is not behaving
    as the scenario objectives require. This lab is about deployment ImagePullBackOff — how deployment
    ImagePullBackOff behaves in a Kubernetes environment. Read the objectives and the current state, and
    note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For deployment ImagePullBackOff problems the reliable method is:
    (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component that
    owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `kubectl get pods -A` and `kubectl describe pod <name>` for Events and container state.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Check pod phase, restarts, and last State reason.

    2. `kubectl logs <pod> --previous` if it crashed.

    3. Compare resource spec (probes, limits, mounts) to objectives.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Patch the Deployment/Service/ConfigMap with the minimal fix.

    2. Wait for rollout (`kubectl rollout status`).

    3. Confirm `kubectl get pods` succeeds.


    WHY: Kubernetes labs grade real cluster state.'
