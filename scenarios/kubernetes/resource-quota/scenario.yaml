title: Pod Blocked by ResourceQuota
slug: sim-k8s-resource-quota
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Pod Blocked by ResourceQuota`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. A namespace ResourceQuota caps total CPU/memory
  requests and pod count. New replicas are rejected with "exceeded quota" and stay Pending. A deployment
  cannot scale up — new pods stay Pending because the namespace''s ResourceQuota has been exhausted. The
  sum of CPU/memory requests (or the pod count) for existing workloads has hit the quota''s hard limit,
  so the API server rejects additional pods. Raise the quota or reduce requests so the deployment can
  schedule its replicas.


  OBJECTIVE: Identify that scheduling is blocked by the namespace ResourceQuota; Compare current usage
  against the quota''s hard limits; Adjust the quota (or workload requests) so the new pods schedule.
  Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated Kubernetes cluster. A namespace ResourceQuota caps total CPU/memory requests
  and pod count. New replicas are rejected with "exceeded quota" and stay Pending.
lab_mode: simulation
