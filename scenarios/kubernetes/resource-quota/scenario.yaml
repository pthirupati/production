title: Pod Blocked by ResourceQuota
slug: sim-k8s-resource-quota
category: Kubernetes
difficulty: medium
description: A deployment cannot scale up — new pods stay Pending because the namespace's ResourceQuota
  has been exhausted. The sum of CPU/memory requests (or the pod count) for existing workloads has hit
  the quota's hard limit, so the API server rejects additional pods. Raise the quota or reduce requests
  so the deployment can schedule its replicas.
initial_state: Simulated Kubernetes cluster. A namespace ResourceQuota caps total CPU/memory requests
  and pod count. New replicas are rejected with "exceeded quota" and stay Pending.
lab_mode: simulation
simulation_type: kubernetes
is_free: false
jira_priority: Medium
max_score: 100
time_limit: 900
dual_terminal: false
requires_companion_hosts: false
objectives:
- Identify that scheduling is blocked by the namespace ResourceQuota
- Compare current usage against the quota's hard limits
- Adjust the quota (or workload requests) so the new pods schedule
hints:
- order: 1
  cost: 10
  content: '`kubectl get pods` shows Pending replicas. `kubectl describe rs <rs>` Events show "exceeded
    quota". Inspect it: `kubectl describe resourcequota -n <ns>`.'
- order: 2
  cost: 15
  content: The Used vs Hard columns show which dimension is maxed (e.g. requests.cpu Used=2 Hard=2). You
    either raise that limit or lower the deployment's per-pod requests.
- order: 3
  cost: 20
  content: 'Raise the quota: `kubectl edit resourcequota <name> -n <ns>` and increase the maxed field
    (e.g. requests.cpu: "4"). Pending pods schedule immediately; verify with `kubectl get pods`.'
