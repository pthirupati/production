description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Deploy Nginx on Kubernetes` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster with kubectl configured against the default namespace.
  No nginx Deployment or Service exists yet. Build task: deploy a basic nginx web server to the cluster
  and expose it. There is no running nginx workload yet. Create a Deployment running the nginx image and
  a Service so the page is reachable, then verify the pods are Ready and the endpoint serves the default
  nginx welcome page.


  OBJECTIVE: Create an nginx Deployment with at least one replica; Expose the Deployment with a Service
  on port 80; Verify the pods are Running/Ready and the Service has endpoints. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Create an nginx Deployment with at least one replica
- Expose the Deployment with a Service on port 80
- Verify the pods are Running/Ready and the Service has endpoints
initial_state: Simulated Kubernetes cluster with kubectl configured against the default namespace. No
  nginx Deployment or Service exists yet.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
