title: DaemonSet Pod Pending - Bring Up the Missing Node VM in
slug: k8s-daemonset-needs-node-vmware
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `DaemonSet Pod Pending - Bring
  Up the Missing Node VM in` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes cluster with one worker (worker-1) running a node-agent DaemonSet

  pod, and a second DaemonSet pod Pending because node worker-2 does not exist —

  its VMware VM (k8s-worker-2) is powered off. The DaemonSet only becomes fully

  scheduled once that node joins. The `node-agent` DaemonSet should run exactly one pod on every node,
  but one of

  its pods is stuck Pending: the node it is meant to run on does not exist yet. This

  Kubernetes cluster runs ON VMware — each node is a VMware VM — and the second

  worker''s VM is powered off, so the DaemonSet has nowhere to place its pod.


  This is a CROSS-TECHNOLOGY task. Open the VMware simulator (toolbar -> Open VMware)

  and power on the worker-node VM `k8s-worker-2`. Once it joins as node worker-2 the

  DaemonSet controller schedules its pod there. Confirm from the terminal that the

  DaemonSet is fully scheduled and all pods are Running.


  OBJECTIVE: Confirm a node-agent DaemonSet pod is Pending (kubectl get pods, kubectl get ds); Confirm
  only one worker node exists (kubectl get nodes); Open the VMware simulator and power on the worker-node
  VM k8s-worker-2. Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A Kubernetes cluster with one worker (worker-1) running a node-agent DaemonSet

  pod, and a second DaemonSet pod Pending because node worker-2 does not exist —

  its VMware VM (k8s-worker-2) is powered off. The DaemonSet only becomes fully

  scheduled once that node joins.

  '
objectives:
- Confirm a node-agent DaemonSet pod is Pending (kubectl get pods, kubectl get ds)
- Confirm only one worker node exists (kubectl get nodes)
- Open the VMware simulator and power on the worker-node VM k8s-worker-2
- Confirm worker-2 is Ready and the DaemonSet schedules its pod there
- Verify the DaemonSet is fully scheduled and all pods Running (kubectl get ds, kubectl get pods)
lab_mode: simulation
simulation_type: kubernetes
cross_technology: true
vmware_link: true
time_limit: 1200
max_score: 100
is_free: false
jira_priority: Medium
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
