title: Gateway API HTTPRoute Misconfigured
slug: k8s-gateway-api-routing
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Gateway API HTTPRoute Misconfigured`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster with Gateway API installed. A Gateway and HTTPRoute
  exist, but requests return 404 because the HTTPRoute does not correctly bind to the Gateway or target
  the backend Service. Requests through the Gateway return 404 instead of reaching the backend Service.
  The HTTPRoute is misconfigured — either its parentRef does not bind to the Gateway listener, its hostname/path
  match is wrong, or its backendRef points at the wrong Service or port. Fix the HTTPRoute so traffic
  is routed to the intended backend.


  OBJECTIVE: Inspect the Gateway and HTTPRoute status and the route rules; Identify the broken parentRef,
  match rule, or backendRef; Correct the HTTPRoute so requests reach the backend Service. Success means
  `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: false
objectives:
- Inspect the Gateway and HTTPRoute status and the route rules
- Identify the broken parentRef, match rule, or backendRef
- Correct the HTTPRoute so requests reach the backend Service
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
