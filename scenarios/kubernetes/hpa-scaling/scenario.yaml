title: HPA Not Scaling Under Load
slug: k8s-hpa-scaling
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `HPA Not Scaling Under Load` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster with an HPA targeting a Deployment. The HPA''s
  TARGETS column shows <unknown>/50% and replica count stays at the minimum despite sustained CPU load.
  A HorizontalPodAutoscaler is not adding replicas even though the workload is under load. The HPA shows
  targets as <unknown> because the metrics-server isn''t returning pod metrics, or the Deployment''s containers
  have no CPU resource requests for the HPA to compute utilization against. Restore metrics so the HPA
  can scale.


  OBJECTIVE: Inspect the HPA and see why current utilization is <unknown>; Verify metrics-server availability
  and that pods declare CPU requests; Restore metrics/requests so the HPA scales the Deployment up under
  load. Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
lab_mode: simulation
simulation_type: kubernetes
time_limit: 900
max_score: 100
is_free: false
objectives:
- Inspect the HPA and see why current utilization is <unknown>
- Verify metrics-server availability and that pods declare CPU requests
- Restore metrics/requests so the HPA scales the Deployment up under load
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
initial_state: Simulated Kubernetes cluster with an HPA targeting a Deployment. The HPA's TARGETS column
  shows <unknown>/50% and replica count stays at the minimum despite sustained CPU load.
