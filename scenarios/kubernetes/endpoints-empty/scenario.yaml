category: kubernetes
description: A Service exists but has no endpoints, so traffic to its ClusterIP times out. The Service's
  label selector does not match the labels on the backend pods, leaving the EndpointSlice empty. Align
  the selector with the pod labels so the Service routes to the running pods.
difficulty: hard
hints:
- order: 1
  cost: 10
  content: 'Check endpoints: `kubectl get endpoints <svc>` shows <none>. That means the selector matches
    zero pods. View it: `kubectl get svc <svc> -o jsonpath=''{.spec.selector}''`.'
- order: 2
  cost: 15
  content: 'List the pod labels: `kubectl get pods --show-labels`. The Service selector (e.g. app=web-v2)
    doesn''t match the pods'' actual labels (e.g. app=web).'
- order: 3
  cost: 20
  content: 'Patch the selector to match: `kubectl patch svc <svc> -p ''{"spec":{"selector":{"app":"web"}}}''`.
    Re-check `kubectl get endpoints <svc>` — the pod IPs now appear.'
initial_state: Simulated Kubernetes cluster. A Service is defined with a selector that matches no pods.
  `kubectl get endpoints <svc>` returns <none> and requests to the Service hang.
is_free: false
lab_mode: simulation
objectives:
- Confirm the Service has no endpoints
- Compare the Service selector against the backend pod labels
- Correct the selector (or pod labels) so endpoints populate and traffic flows
simulation_type: kubernetes
slug: sim-k8s-endpoints-fix
title: Fix Kubernetes Service Endpoints
