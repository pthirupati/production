tasks:
- id: task_1
  title: Make production/db-credentials genuinely encrypted at rest
  description: Prove the base64 value is recoverable without a key, then remediate by enabling an
    encryption provider covering the secrets resource and re-encrypting the existing object, or by
    moving the value behind an External Secrets Operator ExternalSecret.
  background: 'Kubernetes stores Secret values base64-encoded, not encrypted. Without an
    EncryptionConfiguration the API server uses the identity provider and writes cleartext into etcd, so
    an etcd snapshot or backup tarball leaks every credential. This lab teaches the distinction between
    encoding, encryption in transit, and encryption at rest — and that only the last one closes the
    finding.'
  validation:
    type: k8s_resource_state
    resource_kind: Secret
    resource_name: db-credentials
    namespace: production
    expected_state: EncryptedAtRest
    error_message: Secret production/db-credentials is still stored in plaintext. base64 in the manifest
      is encoding, not encryption — re-encoding it will not pass. Enable an EncryptionConfiguration
      covering the secrets resource with a real provider listed before identity and rewrite the existing
      Secrets, or move the value behind an ExternalSecret with a secretStoreRef.
solution:
  summary: Enable an EncryptionConfiguration on kube-apiserver covering the secrets resource with aescbc
    listed before identity, then rewrite the existing Secrets so the pre-existing object is re-serialised
    under the new provider. Alternatively create an ExternalSecret with a secretStoreRef so the value is
    sourced from an external store and never lands in etcd.
  files_changed:
  - /etc/kubernetes/enc/enc.yaml
  - /etc/kubernetes/manifests/kube-apiserver.yaml
  commands_run:
  - kubectl get secret db-credentials -n production -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d
  - kubectl get secrets -n production -o json | kubectl replace -f -
  reference_docs: kubernetes-fundamentals
