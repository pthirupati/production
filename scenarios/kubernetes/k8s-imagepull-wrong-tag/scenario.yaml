title: ImagePullBackOff from Wrong Registry Tag
slug: k8s-imagepull-wrong-tag
technology: Kubernetes
category: Workloads
difficulty: medium
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: true
