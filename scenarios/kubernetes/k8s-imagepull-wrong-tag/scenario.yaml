description: 'CONTEXT: A team operating Kubernetes needs you to resolve `ImagePullBackOff from Wrong Registry
  Tag` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes Deployment stuck in ImagePullBackOff due to a non-existent image
  tag. A Deployment is in ImagePullBackOff because it references an image tag that doesn''t exist in the
  registry. Set a valid tag and confirm pods run.


  OBJECTIVE: Confirm pods are in ImagePullBackOff; Set the deployment image to a valid tag; Verify pods
  are Running. Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A Kubernetes Deployment stuck in ImagePullBackOff due to a non-existent image tag.
objectives:
- Confirm pods are in ImagePullBackOff
- Set the deployment image to a valid tag
- Verify pods are Running
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
