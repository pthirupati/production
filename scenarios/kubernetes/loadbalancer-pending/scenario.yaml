title: LoadBalancer Service Pending
slug: k8s-loadbalancer-pending
category: Kubernetes
difficulty: medium
description: A Service of type LoadBalancer is stuck with EXTERNAL-IP <pending>. In this environment no
  cloud load-balancer provisioner is available to allocate an external address, so the Service never gets
  an IP. Switch the Service to a type the cluster can satisfy (NodePort or ClusterIP + Ingress) so the
  app becomes reachable.
lab_mode: simulation
simulation_type: kubernetes
time_limit: 900
max_score: 100
is_free: false
objectives:
- Confirm the LoadBalancer Service is stuck at <pending>
- Determine why no external IP is provisioned in this environment
- Expose the app via NodePort (or Ingress) so it becomes reachable
hints:
- order: 1
  cost: 10
  content: '`kubectl get svc <svc>` shows TYPE LoadBalancer and EXTERNAL-IP <pending>. Describe it: `kubectl
    describe svc <svc>` — there''s no cloud-provider event because no LB controller exists.'
- order: 2
  cost: 15
  content: Without a cloud LB or MetalLB, LoadBalancer never resolves. The portable fix is a NodePort,
    which the kube-proxy on every node can serve directly.
- order: 3
  cost: 20
  content: 'Convert it: `kubectl patch svc <svc> -p ''{"spec":{"type":"NodePort"}}''`. Read the assigned
    port from `kubectl get svc <svc>` and reach the app at <node-ip>:<nodePort>.'
initial_state: Simulated Kubernetes cluster without a cloud LoadBalancer controller. A Service of type
  LoadBalancer shows EXTERNAL-IP <pending> indefinitely and the app is unreachable externally.
