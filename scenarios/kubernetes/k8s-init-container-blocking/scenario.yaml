title: Init Container Blocking Pod Start
slug: k8s-init-container-blocking
technology: Kubernetes
category: Workloads
difficulty: medium
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: true
