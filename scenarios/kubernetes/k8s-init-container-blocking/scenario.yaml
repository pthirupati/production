description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Init Container Blocking Pod Start`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes pod stuck in Init because its init container loops waiting for
  an unavailable dependency. A pod never starts because its init container waits on a dependency that
  never becomes ready. Fix the init container and confirm the pod runs.


  OBJECTIVE: Confirm the pod is stuck in Init; Fix the init container''s dependency/command and roll out;
  Verify the pod is Running. Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A Kubernetes pod stuck in Init because its init container loops waiting for an unavailable
  dependency.
objectives:
- Confirm the pod is stuck in Init
- Fix the init container's dependency/command and roll out
- Verify the pod is Running
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
