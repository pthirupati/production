dual_terminal: false
description: A pod never starts because its init container waits on a dependency that never becomes ready.
  Fix the init container and confirm the pod runs.
initial_state: A Kubernetes pod stuck in Init because its init container loops waiting for an unavailable
  dependency.
objectives:
- Confirm the pod is stuck in Init
- Fix the init container's dependency/command and roll out
- Verify the pod is Running
hints:
