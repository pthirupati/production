description: 'CONTEXT: A team operating Kubernetes needs you to resolve `kubernetes: Deployments — Build
  From Scratch` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Kubernetes cluster is ready but Deployments is not configured yet. Required
  tools may already be installed; your job is to create the configuration and bring the capability online.
  Build Deployments from scratch in this kubernetes lab. You start from a minimal environment and must
  produce a working configuration that demonstrates replicas, rollout strategy, selectors, and revision
  history. Plan, implement, then prove it works.


  OBJECTIVE: A working Deployments setup must exist by the end of this lab; Configuration should follow
  team conventions and be easy to audit; The result should pass validation without manual cleanup. Success
  means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working Deployments setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The Kubernetes cluster is ready but Deployments is not configured yet. Required tools may
  already be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get deploy`, `kubectl rollout status`, and `kubectl describe
    deploy`.

    2. Write down what looks normal versus wrong or missing for Deployments.

    3. Recall the core idea: replicas, rollout strategy, selectors, and revision history. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `kubectl get deploy`, `kubectl rollout status`, and `kubectl describe
    deploy`.

    2. Create the smallest working slice of Deployments first, validate it, then add the remaining pieces
    one at a time.

    3. Verify the result — desired replicas are available and the rollout completed.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
