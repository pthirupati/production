title: Deployment ImagePullBackOff
slug: k8s-deployment-imagepull
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Deployment ImagePullBackOff`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. A deployment''s container image points to a
  tag that does not exist in the registry. Pods cycle through ErrImagePull and ImagePullBackOff. Pods
  for a deployment are stuck in ImagePullBackOff. The container spec references an image tag that does
  not exist in the registry, so every pull attempt fails and the pods never become Ready. Identify the
  bad image reference and patch the deployment to a valid, existing tag.


  OBJECTIVE: Describe a failing pod and read the exact image-pull error; Identify the incorrect image
  name or tag in the deployment; Patch the deployment to a valid image and confirm pods reach Running.
  Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated Kubernetes cluster. A deployment's container image points to a tag that does
  not exist in the registry. Pods cycle through ErrImagePull and ImagePullBackOff.
objectives:
- Describe a failing pod and read the exact image-pull error
- Identify the incorrect image name or tag in the deployment
- Patch the deployment to a valid image and confirm pods reach Running
lab_mode: simulation
simulation_type: kubernetes
time_limit: 900
max_score: 100
is_free: true
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
