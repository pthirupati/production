category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Kubernetes has raised a ticket for `Scale-Out Blocked - Add a
  Worker VM in VMware to Fit the`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster. The architecture is a single
  lab-primary node exposing kubectl, manifests, and cluster resources; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes cluster with one control-plane and one worker (worker-1). The
  `api`

  Deployment is set to 4 replicas; 2 are Running on worker-1 and 2 are Pending

  (Insufficient cpu/memory). The replacement worker VM `k8s-worker-2` exists in the

  VMware inventory but is powered off, so node worker-2 has not joined.


  OBJECTIVE: Confirm 2 api pods are Pending due to FailedScheduling (kubectl get pods, kubectl describe
  pod); Confirm the cluster has only one worker node (kubectl get nodes); Open the VMware console and
  power on the worker-node VM k8s-worker-2. Acceptance criteria: the change is minimal and reversible,
  and success means `kubectl get pods` shows every pod Running.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant kubectl, manifests, and cluster resources), changing one thing at a time. Check your
  work continuously against the objective — success means `kubectl get pods` shows every pod Running.


  VERIFY: Re-run the same check the grader uses and confirm `kubectl get pods` shows every pod Running.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
