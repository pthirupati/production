title: Scale-Out Blocked - Add a Worker VM in VMware to Fit the
slug: k8s-scale-out-add-vmware-node
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Scale-Out Blocked - Add a Worker
  VM in VMware to Fit the` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Kubernetes cluster with one control-plane and one worker (worker-1). The
  `api`

  Deployment is set to 4 replicas; 2 are Running on worker-1 and 2 are Pending

  (Insufficient cpu/memory). The replacement worker VM `k8s-worker-2` exists in the

  VMware inventory but is powered off, so node worker-2 has not joined. The `api` Deployment was scaled
  to 4 replicas to handle a traffic spike, but two

  pods are stuck Pending with FailedScheduling — the only worker node (worker-1) has

  no free CPU/memory. This Kubernetes cluster runs ON VMware: each node is a VMware

  VM, so adding capacity means adding a node VM, not editing a manifest.


  This is a CROSS-TECHNOLOGY task. Open the VMware simulator (toolbar -> Open VMware)

  and power on the spare worker VM `k8s-worker-2`. Once it joins as node worker-2,

  the Pending api pods schedule onto it. Confirm from the terminal that every api

  pod is Running across the two worker nodes.


  OBJECTIVE: Confirm 2 api pods are Pending due to FailedScheduling (kubectl get pods, kubectl describe
  pod); Confirm the cluster has only one worker node (kubectl get nodes); Open the VMware simulator and
  power on the worker-node VM k8s-worker-2. Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A Kubernetes cluster with one control-plane and one worker (worker-1). The `api`

  Deployment is set to 4 replicas; 2 are Running on worker-1 and 2 are Pending

  (Insufficient cpu/memory). The replacement worker VM `k8s-worker-2` exists in the

  VMware inventory but is powered off, so node worker-2 has not joined.

  '
objectives:
- Confirm 2 api pods are Pending due to FailedScheduling (kubectl get pods, kubectl describe pod)
- Confirm the cluster has only one worker node (kubectl get nodes)
- Open the VMware simulator and power on the worker-node VM k8s-worker-2
- Confirm worker-2 is Ready and the Pending pods schedule onto it
- Verify all api pods are Running (kubectl get pods -o wide)
