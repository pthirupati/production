description: 'Day-2 operations: perform a routine Kubernetes Services task safely
  in Kubernetes. Follow change control — inspect, change, verify — while working with
  ClusterIP/NodePort/LoadBalancer, selectors, endpoints, and kube-proxy routing.'
objectives:
- Day-2 Kubernetes Services work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The Kubernetes cluster is healthy enough for scheduled work on Kubernetes
