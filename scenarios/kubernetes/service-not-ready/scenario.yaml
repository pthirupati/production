category: Fix
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Kubernetes Service Not Ready`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. A Service has zero ready endpoints because its
  pods fail their readiness probe (wrong path/port or the app isn''t actually serving). A Service is not
  ready: requests to it fail because its backing pods are not passing readiness checks, so Kubernetes
  keeps them out of the Service''s endpoints. Either the pods are unhealthy or the readiness probe is
  misconfigured. Get the pods Ready so the Service receives endpoints and serves traffic.


  OBJECTIVE: Confirm the Service has no ready endpoints; Determine why the backing pods are not Ready
  (probe vs app health); Fix the pods/probe so endpoints populate and the Service responds. Success means
  `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
