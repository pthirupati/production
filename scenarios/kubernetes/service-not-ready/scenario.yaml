category: Kubernetes
description: 'A Service is not ready: requests to it fail because its backing pods are not passing readiness
  checks, so Kubernetes keeps them out of the Service''s endpoints. Either the pods are unhealthy or the
  readiness probe is misconfigured. Get the pods Ready so the Service receives endpoints and serves traffic.'
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 10
  content: '`kubectl get endpoints <svc>` is empty while pods exist. `kubectl get pods` shows them 0/1
    READY — they''re failing readiness.'
- order: 2
  cost: 15
  content: 'Describe a pod: `kubectl describe pod <pod>` and read the Readiness probe and its failures
    (e.g. probing :8080/healthz but the app serves :80/). Check `kubectl logs <pod>`.'
- order: 3
  cost: 20
  content: Correct the readiness probe path/port in the deployment (`kubectl edit deploy <name>`) to match
    the app, or fix the app. Once pods report 1/1 Ready, `kubectl get endpoints <svc>` fills in.
initial_state: Simulated Kubernetes cluster. A Service has zero ready endpoints because its pods fail
  their readiness probe (wrong path/port or the app isn't actually serving).
is_free: false
jira_priority: Medium
lab_mode: simulation
max_score: 100
objectives:
- Confirm the Service has no ready endpoints
- Determine why the backing pods are not Ready (probe vs app health)
- Fix the pods/probe so endpoints populate and the Service responds
requires_companion_hosts: false
simulation_type: kubernetes
slug: sim-k8s-service-not-ready
time_limit: 900
title: Kubernetes Service Not Ready
