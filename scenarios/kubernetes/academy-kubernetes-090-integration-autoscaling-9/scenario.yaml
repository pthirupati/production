description: 'Integration lab: connect autoscaling with an adjacent platform in the
  Kubernetes stack. Validate authentication, data handoff, and failure behavior for
  HPA metrics, min/max replicas, and resource requests.'
objectives:
- autoscaling is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for autoscaling.
  Downstream consumers are waiting on this integration path.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get hpa` and `kubectl describe hpa`.

    2. Write down what looks normal versus wrong or missing for autoscaling.

    3. Recall the core idea: HPA metrics, min/max replicas, and resource requests.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for autoscaling.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `kubectl get hpa` and `kubectl describe hpa`.

    2. Configure credentials and networking, then drive one happy-path transaction
    end to end across both systems.

    3. Verify the result — replicas scale with load between the configured bounds.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-kubernetes-090-integration-autoscaling-9.conf`,
    then click Check Solution.'
