title: Fix Kubernetes Service Port Mismatch
slug: k8s-manifest-port-fix
technology: Kubernetes
category: Kubernetes
difficulty: hard
scenario_type: fix
time_limit: 1200
max_score: 100
infrastructure_type: docker
lab_mode: docker
jira_priority: High
is_free: false
description: A Service cannot reach its pods because of a port mismatch. The Service's targetPort does
  not match the containerPort the application actually listens on, so connections to the Service are refused
  even though endpoints exist. Align the targetPort with the container's real listening port.
objectives:
- Confirm the pods are Ready but Service requests are refused
- Compare the Service targetPort with the container's listening port
- Fix the targetPort so the Service reaches the application
initial_state: Simulated Kubernetes cluster. A Service routes to healthy pods, but its targetPort (e.g.
  8080) doesn't match the container's listening port (e.g. 80), so requests are refused.
hints:
- order: 1
  cost: 10
  content: Endpoints exist (`kubectl get endpoints <svc>`) but curling the Service is refused. That points
    to a port mismatch rather than a selector problem.
- order: 2
  cost: 15
  content: 'Compare: `kubectl get svc <svc> -o jsonpath=''{.spec.ports[0].targetPort}''` vs the container''s
    port `kubectl get pod <pod> -o jsonpath=''{.spec.containers[0].ports[0].containerPort}''`. They differ.'
- order: 3
  cost: 20
  content: 'Set targetPort to the real container port: `kubectl patch svc <svc> -p ''{"spec":{"ports":[{"port":80,"targetPort":80}]}}''`,
    then re-test the Service.'
