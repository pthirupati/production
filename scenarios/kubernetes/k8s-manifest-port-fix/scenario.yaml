description: 'CONTEXT: A team operating Kubernetes has raised a ticket for `Fix Kubernetes Service Port
  Mismatch`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster. The architecture is a single
  lab-primary node exposing kubectl, manifests, and cluster resources; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Kubernetes cluster. A Service routes to healthy pods, but its targetPort
  (e.g. 8080) doesn''t match the container''s listening port (e.g. 80), so requests are refused.


  OBJECTIVE: Confirm the pods are Ready but Service requests are refused; Compare the Service targetPort
  with the container''s listening port; Fix the targetPort so the Service reaches the application. Acceptance
  criteria: the change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant kubectl, manifests, and cluster resources), changing one thing at a time. Check your
  work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
