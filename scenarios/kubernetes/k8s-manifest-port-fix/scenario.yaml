description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Fix Kubernetes Service Port Mismatch`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. A Service routes to healthy pods, but its targetPort
  (e.g. 8080) doesn''t match the container''s listening port (e.g. 80), so requests are refused. A Service
  cannot reach its pods because of a port mismatch. The Service''s targetPort does not match the containerPort
  the application actually listens on, so connections to the Service are refused even though endpoints
  exist. Align the targetPort with the container''s real listening port.


  OBJECTIVE: Confirm the pods are Ready but Service requests are refused; Compare the Service targetPort
  with the container''s listening port; Fix the targetPort so the Service reaches the application. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the pods are Ready but Service requests are refused
- Compare the Service targetPort with the container's listening port
- Fix the targetPort so the Service reaches the application
initial_state: Simulated Kubernetes cluster. A Service routes to healthy pods, but its targetPort (e.g.
  8080) doesn't match the container's listening port (e.g. 80), so requests are refused.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
