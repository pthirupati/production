title: 'Pod Fails: Missing ConfigMap'
slug: sim-k8s-configmap-missing
category: Kubernetes
difficulty: easy
description: A pod in the default namespace is stuck in CreateContainerConfigError. The deployment mounts
  environment variables from a ConfigMap named app-config that does not exist in the namespace, so the
  kubelet cannot start the container. Recreate the missing ConfigMap with the expected keys so the pod
  can start.
initial_state: Simulated Kubernetes cluster. A deployment references configMapRef name app-config, but
  that ConfigMap was never created. Pods report CreateContainerConfigError and never reach Running.
lab_mode: simulation
simulation_type: kubernetes
is_free: false
jira_priority: Medium
max_score: 100
time_limit: 900
dual_terminal: false
requires_companion_hosts: false
objectives:
- Identify the pod stuck in CreateContainerConfigError and the ConfigMap it expects
- Create the app-config ConfigMap with the required keys
- Confirm the pod reaches Running after the ConfigMap exists
hints:
- order: 1
  cost: 10
  content: Start with `kubectl get pods` then `kubectl describe pod <pod>`. The Events show "configmap
    \"app-config\" not found" — the deployment's envFrom references it.
- order: 2
  cost: 15
  content: 'List ConfigMaps with `kubectl get configmap`. app-config is absent. Check the deployment spec:
    `kubectl get deploy <name> -o yaml | grep -A3 configMapRef` to see which keys the container reads
    (e.g. APP_ENV, LOG_LEVEL).'
- order: 3
  cost: 20
  content: 'Create it: `kubectl create configmap app-config --from-literal=APP_ENV=production --from-literal=LOG_LEVEL=info`.
    The kubelet retries automatically and the pod transitions to Running within ~30s.'
