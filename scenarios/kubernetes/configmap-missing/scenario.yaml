title: 'Pod Fails: Missing ConfigMap'
slug: sim-k8s-configmap-missing
category: Fix
difficulty: easy
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Pod Fails: Missing ConfigMap`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. A deployment references configMapRef name app-config,
  but that ConfigMap was never created. Pods report CreateContainerConfigError and never reach Running.
  A pod in the default namespace is stuck in CreateContainerConfigError. The deployment mounts environment
  variables from a ConfigMap named app-config that does not exist in the namespace, so the kubelet cannot
  start the container. Recreate the missing ConfigMap with the expected keys so the pod can start.


  OBJECTIVE: Identify the pod stuck in CreateContainerConfigError and the ConfigMap it expects; Create
  the app-config ConfigMap with the required keys; Confirm the pod reaches Running after the ConfigMap
  exists. Success means `kubectl get pods` shows every pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated Kubernetes cluster. A deployment references configMapRef name app-config, but
  that ConfigMap was never created. Pods report CreateContainerConfigError and never reach Running.
