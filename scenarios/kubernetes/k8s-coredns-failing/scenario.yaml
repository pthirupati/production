description: Pods can't resolve service names because the CoreDNS Corefile is misconfigured. Fix CoreDNS
  and confirm in-cluster DNS works (cluster healthy).
initial_state: A Kubernetes cluster whose CoreDNS ConfigMap has a broken Corefile, breaking service discovery.
objectives:
- Confirm DNS resolution is failing in pods
- Fix the CoreDNS Corefile and restart CoreDNS
- Verify resolution works and the cluster is healthy
