title: CoreDNS Failing Cluster DNS
slug: k8s-coredns-failing
technology: Kubernetes
category: Networking
difficulty: hard
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
