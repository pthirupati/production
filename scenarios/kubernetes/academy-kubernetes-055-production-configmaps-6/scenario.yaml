title: 'Kubernetes: Configmaps — Production Readiness'
slug: academy-kubernetes-055-production-configmaps-6
technology: Kubernetes
category: Production
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: kubernetes
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Kubernetes operations lab. One or more pods are **not Running** — workloads for Production
  Readiness cannot serve traffic. Inspect with `kubectl get pods`, read `kubectl describe pod` events,
  fix the root cause, and confirm all pods Running.
objectives:
- All pods in the default namespace are Running
- '`kubectl get pods` shows every pod Running'
- The deployment survives `kubectl get pods` re-check
initial_state: The cluster is up but at least one pod is CrashLoopBackOff or Pending.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get cm`, mounted paths in pods, and `kubectl describe pod`.

    2. Write down what looks normal versus wrong or missing for ConfigMaps.

    3. Recall the core idea: key/value config, mounted files, envFrom, and rollout after config changes.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for ConfigMaps.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `kubectl get cm`, mounted paths in pods, and `kubectl describe pod`.

    2. Apply production standards for ConfigMaps: resource limits, monitoring, access controls, and a
    written rollback step.

    3. Verify the result — pods see updated config after rollout and apps start cleanly.

    4. Click Check Solution once `kubectl get pods` shows every pod Running.'
