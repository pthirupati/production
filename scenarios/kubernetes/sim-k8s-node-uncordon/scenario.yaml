is_free: false
description: 'CONTEXT: A team operating Kubernetes needs you to resolve `Kubernetes Worker Node NotReady`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Kubernetes cluster with kubectl, manifests, and
  cluster resources. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Kubernetes cluster. A worker node is marked SchedulingDisabled (cordoned).
  It is otherwise healthy, but the scheduler won''t place pods on it and capacity is reduced. A worker
  node is shown as NotReady/SchedulingDisabled and no new pods land on it. The node was cordoned (and
  possibly drained) for maintenance and never brought back into service, so the scheduler skips it. Verify
  the node is healthy, then uncordon it so it accepts workloads again.


  OBJECTIVE: Identify the cordoned node and confirm it is otherwise healthy; Verify the kubelet/node conditions
  are Ready; Uncordon the node so it accepts pods again. Success means `kubectl get pods` shows every
  pod Running.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the cordoned node and confirm it is otherwise healthy
- Verify the kubelet/node conditions are Ready
- Uncordon the node so it accepts pods again
initial_state: Simulated Kubernetes cluster. A worker node is marked SchedulingDisabled (cordoned). It
  is otherwise healthy, but the scheduler won't place pods on it and capacity is reduced.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
