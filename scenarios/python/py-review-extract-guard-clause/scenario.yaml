title: 'Refactor: Fix the Discount Edge Cases'
slug: py-review-extract-guard-clause
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Refactor: Fix the Discount
  Edge Cases` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: apply_discount(price, percent) applies a percentage discount, but the logic
  accepts invalid percentages (negative or > 100) and can return negative prices. Refactor with guard
  clauses: percent must be in [0, 100] (else ValueError), and the returned price is never negative. The
  tests pin these contracts.


  OBJECTIVE: Validate the percent range with a guard clause; Raise ValueError for out-of-range percentages;
  Never return a negative price. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Validate the percent range with a guard clause
- Raise ValueError for out-of-range percentages
- Never return a negative price
initial_state: 'apply_discount(price, percent) applies a percentage discount, but the logic accepts invalid
  percentages (negative or > 100) and can return negative prices. Refactor with guard clauses: percent
  must be in [0, 100] (else ValueError), and the returned price is never negative. The tests pin these
  contracts.'
solution_explanation: 'A guard clause rejecting out-of-range percentages up front prevents nonsensical
  negative prices and makes the contract explicit.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: review
  instructions: "Refactor apply_discount(price, percent): percent must be between 0 and 100 inclusive\
    \ (else raise ValueError). Return price reduced by that percent, as a float.\n  apply_discount(100,\
    \ 25) -> 75.0\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def apply_discount(price, percent):\n    return price - price * percent / 100   # no validation;\
      \ allows bad percent\n"
    readonly: false
  visible_tests:
  - name: quarter off
    code: 'assert apply_discount(100, 25) == 75.0

      '
  - name: no discount
    code: 'assert apply_discount(50, 0) == 50.0

      '
  hidden_tests:
  - name: full discount
    code: 'assert apply_discount(80, 100) == 0.0

      '
  - name: negative percent rejected
    code: "try:\n    apply_discount(100, -10)\n    assert False, 'should raise'\nexcept ValueError:\n\
      \    pass\n"
  - name: over 100 percent rejected
    code: "try:\n    apply_discount(100, 150)\n    assert False\nexcept ValueError:\n    pass\n"
  - name: returns float
    code: 'assert isinstance(apply_discount(10, 10), float)

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.py`, read the instructions, and run the visible tests to see
    which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Never return a negative price.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
