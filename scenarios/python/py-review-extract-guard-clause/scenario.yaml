solution_explanation: 'A guard clause rejecting out-of-range percentages up front prevents nonsensical
  negative prices and makes the contract explicit.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: review
  instructions: "Refactor apply_discount(price, percent): percent must be between 0 and 100 inclusive\
    \ (else raise ValueError). Return price reduced by that percent, as a float.\n  apply_discount(100,\
    \ 25) -> 75.0\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def apply_discount(price, percent):\n    return price - price * percent / 100   # no validation;\
      \ allows bad percent\n"
    readonly: false
  visible_tests:
  - name: quarter off
    code: 'assert apply_discount(100, 25) == 75.0

      '
  - name: no discount
    code: 'assert apply_discount(50, 0) == 50.0

      '
  hidden_tests:
  - name: full discount
    code: 'assert apply_discount(80, 100) == 0.0

      '
  - name: negative percent rejected
    code: "try:\n    apply_discount(100, -10)\n    assert False, 'should raise'\nexcept ValueError:\n\
      \    pass\n"
  - name: over 100 percent rejected
    code: "try:\n    apply_discount(100, 150)\n    assert False\nexcept ValueError:\n    pass\n"
  - name: returns float
    code: 'assert isinstance(apply_discount(10, 10), float)

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: refactor is not behaving as the scenario objectives
    require. This lab is about refactor — how refactor behaves in a Python development environment. Read
    the objectives and the current state, and note precisely what looks wrong versus healthy before you
    form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For refactor problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `solution.py`, read the instructions, and run the visible tests to see which assertion fails
    first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of refactor is at fault.

    2. Re-run the most relevant of source files, venv, tests, and CLI entrypoints focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''refactor is not
    behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `solution.py` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
