title: Implement Valid Parentheses
slug: py-impl-valid-parentheses
category: Build
description: 'CONTEXT: A team operating Python development needs you to resolve `Implement Valid Parentheses`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement is_balanced(s): return True if every bracket in s — (), [], {} —
  is correctly opened and closed in the right order, False otherwise. Other characters are ignored. The
  stub is empty so tests fail.


  OBJECTIVE: Use a stack to match opening brackets; Verify each closer matches the most recent opener;
  Ensure nothing is left unclosed. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Use a stack to match opening brackets
- Verify each closer matches the most recent opener
- Ensure nothing is left unclosed
initial_state: 'Implement is_balanced(s): return True if every bracket in s — (), [], {} — is correctly
  opened and closed in the right order, False otherwise. Other characters are ignored. The stub is empty
  so tests fail.'
solution_explanation: 'A stack records open brackets; each closer must match the most recent opener (LIFO),
  and a non-empty stack at the end means something is unclosed.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: "Implement is_balanced(s) -> bool for the brackets (), [], {} (ignore other chars).\n\
    \  is_balanced('([]{})') -> True, is_balanced('(]') -> False\nClick Run to try it, then Check Solution\
    \ to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def is_balanced(s):\n    # TODO: return True iff brackets are balanced\n    pass\n"
    readonly: false
  visible_tests:
  - name: balanced mixed
    code: 'assert is_balanced(''([]{})'') is True

      '
  - name: mismatch
    code: 'assert is_balanced(''(]'') is False

      '
  hidden_tests:
  - name: empty is balanced
    code: 'assert is_balanced('''') is True

      '
  - name: unclosed
    code: 'assert is_balanced(''((('') is False

      '
  - name: extra close
    code: 'assert is_balanced(''())'') is False

      '
  - name: ignores other chars
    code: 'assert is_balanced(''a(b)c[d]'') is True

      '
  - name: wrong nesting
    code: 'assert is_balanced(''([)]'') is False

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.py`, read the instructions, and run the visible tests to see
    which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Ensure nothing is left unclosed.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
