title: 'Log Analysis: Fix the IndexError on Empty Input'
slug: py-logfix-indexerror-last
category: Fix
description: 'CONTEXT: A team operating Python development has raised a ticket for `Log Analysis: Fix
  the IndexError on Empty Input`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace. The architecture is a
  single lab-primary node exposing source files, venv, tests, and CLI entrypoints; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: The log shows `IndexError: list index out of range` from last_or_none() when
  the list is empty. It should return None for an empty list instead of indexing [-1].

  OBJECTIVE: Spot the [-1] access that fails on empty lists; Guard the empty case; Return None when there
  is no last element. Acceptance criteria: the change is minimal and reversible, and success means all
  hidden tests pass.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant source files, venv, tests, and CLI entrypoints), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.

  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Spot the [-1] access that fails on empty lists
- Guard the empty case
- Return None when there is no last element
initial_state: 'The log shows `IndexError: list index out of range` from last_or_none() when the list
  is empty. It should return None for an empty list instead of indexing [-1].'
solution_explanation: 'Indexing [-1] requires at least one element. An empty-check returning None avoids
  the IndexError.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: logfix
  instructions: 'Fix last_or_none(items): return the last element, or None if the list is empty. The log
    shows an IndexError on empty input.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "# Production log:\n#   IndexError: list index out of range\n#     at last_or_none(items)\
      \ -> return items[-1]\n\ndef last_or_none(items):\n    return items[-1]   # IndexError when items\
      \ is empty\n"
    readonly: false
  visible_tests:
  - name: last element
    code: 'assert last_or_none([1, 2, 3]) == 3

      '
  - name: empty is none
    code: 'assert last_or_none([]) is None

      '
  hidden_tests:
  - name: single element
    code: 'assert last_or_none([42]) == 42

      '
  - name: strings
    code: 'assert last_or_none([''a'', ''b'']) == ''b''

      '
  - name: empty does not raise
    code: 'assert last_or_none([]) is None

      '
  timeout: 8
