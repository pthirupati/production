initial_state: clamp(x, lo, hi) should constrain x to the [lo, hi] range, but the min and max are swapped,
  so it returns the opposite of what you want. Fix the clamping so values below lo become lo and above
  hi become hi.
solution_explanation: 'Swapping min/lo and max/hi inverts the clamp. The correct nesting is max(lo, min(hi,
  x)).

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix clamp(x, lo, hi): if x < lo return lo, if x > hi return hi, else x.\n  clamp(15,\
    \ 0, 10) -> 10, clamp(-3, 0, 10) -> 0\nClick Run to try it, then Check Solution to grade against all\
    \ tests.\n"
  files:
  - path: solution.py
    content: "def clamp(x, lo, hi):\n    return min(lo, max(hi, x))   # bounds swapped\n"
    readonly: false
  visible_tests:
  - name: above range
    code: 'assert clamp(15, 0, 10) == 10, clamp(15, 0, 10)

      '
  - name: below range
    code: 'assert clamp(-3, 0, 10) == 0, clamp(-3, 0, 10)

      '
  hidden_tests:
  - name: in range
    code: 'assert clamp(5, 0, 10) == 5

      '
  - name: equals lower bound
    code: 'assert clamp(0, 0, 10) == 0

      '
  - name: equals upper bound
    code: 'assert clamp(10, 0, 10) == 10

      '
  - name: negative range
    code: 'assert clamp(-5, -10, -1) == -5

      '
  timeout: 8
