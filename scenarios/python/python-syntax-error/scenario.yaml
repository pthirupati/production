category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix Python Syntax Error`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Python file containing a syntax error (e.g. missing colon on a def/if, unclosed
  parenthesis, or inconsistent indentation). `python file.py` aborts before executing with a SyntaxError.
  A Python program won''t run because of a SyntaxError raised at import/parse time — a missing colon,
  unbalanced brackets/quotes, or bad indentation. Read the error''s file and line, correct the syntax,
  and confirm the program parses and runs.


  OBJECTIVE: Read the SyntaxError''s filename, line number, and caret position; Correct the offending
  syntax; Confirm the file parses and the program runs. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Read the SyntaxError''s filename, line number, and caret position'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Correct the offending syntax

    2. Confirm the file parses and the program runs'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Confirm the file parses and the program runs.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
