title: 'Log Analysis: Fix the AttributeError on int.strip'
slug: py-logfix-attributeerror-strip
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Log Analysis: Fix the
  AttributeError on int.strip` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The log shows `AttributeError: ''int'' object has no attribute ''strip''`
  from normalize() because it calls .strip().lower() on every value, but some values are non-strings.
  Coerce to str first (or skip non-strings) so it never crashes, returning a lowercased, stripped string
  for every input.


  OBJECTIVE: Read the AttributeError and find the unsafe .strip call; Coerce the value to a string before
  string operations; Return a normalized string for any input type. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
