initial_state: 'The log shows `AttributeError: ''int'' object has no attribute ''strip''` from normalize()
  because it calls .strip().lower() on every value, but some values are non-strings. Coerce to str first
  (or skip non-strings) so it never crashes, returning a lowercased, stripped string for every input.'
solution_explanation: 'String methods only exist on strings. Wrapping the value in str() first makes the
  normalization total over any input type.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: logfix
  instructions: "Fix normalize(value): return str(value) lowercased and stripped of surrounding whitespace.\
    \ It must work for strings AND non-strings (ints, etc). The log shows it crashes on an int.\n  normalize('\
    \  Hi ') -> 'hi', normalize(42) -> '42'\nClick Run to try it, then Check Solution to grade against\
    \ all tests.\n"
  files:
  - path: solution.py
    content: "# Production log:\n#   AttributeError: 'int' object has no attribute 'strip'\n#     at normalize(value)\
      \ -> return value.strip().lower()\n\ndef normalize(value):\n    return value.strip().lower()   #\
      \ fails for non-strings\n"
    readonly: false
  visible_tests:
  - name: string normalized
    code: 'assert normalize(''  Hi '') == ''hi''

      '
  - name: int coerced
    code: 'assert normalize(42) == ''42''

      '
  hidden_tests:
  - name: already clean
    code: 'assert normalize(''abc'') == ''abc''

      '
  - name: uppercase
    code: 'assert normalize(''HELLO'') == ''hello''

      '
  - name: float
    code: 'assert normalize(3.5) == ''3.5''

      '
  - name: whitespace only
    code: 'assert normalize(''   '') == ''''

      '
  timeout: 8
