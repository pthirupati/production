    \ 3) -> 'ABC'\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def caesar(text, shift):\n    # TODO: shift letters, wrap within case, leave others alone\n\
      \    pass\n"
    readonly: false
  visible_tests:
  - name: shift by one
    code: 'assert caesar(''abc'', 1) == ''bcd''

      '
  - name: wrap uppercase
    code: 'assert caesar(''XYZ'', 3) == ''ABC'', caesar(''XYZ'', 3)

      '
  hidden_tests:
  - name: non-letters unchanged
    code: 'assert caesar(''a-b!'', 1) == ''b-c!''

      '
  - name: negative shift
    code: 'assert caesar(''bcd'', -1) == ''abc''

      '
  - name: shift over 26
    code: 'assert caesar(''abc'', 27) == ''bcd''

      '
  - name: mixed case
    code: 'assert caesar(''Hello, World!'', 5) == ''Mjqqt, Btwqi!''

      '
  - name: zero shift
    code: 'assert caesar(''Zz'', 0) == ''Zz''

      '
  timeout: 8
