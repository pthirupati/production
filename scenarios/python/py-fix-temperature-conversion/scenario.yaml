solution_explanation: 'The conversion needs the 9/5 scaling factor before adding 32; omitting it only
  offsets the value.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix c_to_f(c): Fahrenheit = c * 9/5 + 32.\n  c_to_f(0) -> 32.0, c_to_f(100) -> 212.0\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def c_to_f(c):\n    return c + 32      # bug: missing * 9/5\n"
    readonly: false
  visible_tests:
  - name: freezing
    code: 'assert c_to_f(0) == 32.0

      '
  - name: boiling
    code: 'assert c_to_f(100) == 212.0, c_to_f(100)

      '
  hidden_tests:
  - name: body temp
    code: 'assert abs(c_to_f(37) - 98.6) < 1e-9, c_to_f(37)

      '
  - name: negative
    code: 'assert c_to_f(-40) == -40.0, c_to_f(-40)

      '
  - name: twenty c
    code: 'assert c_to_f(20) == 68.0

      '
  timeout: 8
