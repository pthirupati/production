title: 'Log Analysis: Fix the Crash Parsing CSV Numbers'
slug: py-logfix-valueerror-int-parse
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Log Analysis: Fix the
  Crash Parsing CSV Numbers` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A batch job crashed with `ValueError: invalid literal for int() with base
  10: ''''` in sum_csv_row(). The row may contain empty fields and surrounding spaces. Parse only the
  integer fields, skipping blanks, and return their sum. Read the log and fix the parsing.


  OBJECTIVE: Read the ValueError and identify the bad int() call; Skip empty/whitespace fields; Sum the
  remaining integers robustly. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
