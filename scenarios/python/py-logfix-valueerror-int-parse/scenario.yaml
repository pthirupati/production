- Sum the remaining integers robustly
initial_state: 'A batch job crashed with `ValueError: invalid literal for int() with base 10: ''''` in
  sum_csv_row(). The row may contain empty fields and surrounding spaces. Parse only the integer fields,
  skipping blanks, and return their sum. Read the log and fix the parsing.'
solution_explanation: 'Empty/whitespace fields can''t be parsed. Stripping and skipping blanks before
  int() makes the sum robust to messy CSV rows.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: logfix
  instructions: "Fix sum_csv_row(row) where row is a list of strings. Strip each field; skip empty fields;\
    \ sum the integer values of the rest. The log shows it crashes on an empty field.\n  sum_csv_row(['1',\
    \ ' 2 ', '', '3']) -> 6\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "# Production log:\n#   ValueError: invalid literal for int() with base 10: ''\n#     at\
      \ sum_csv_row -> total += int(field)\n\ndef sum_csv_row(row):\n    total = 0\n    for field in row:\n\
      \        total += int(field)   # blank fields raise ValueError\n    return total\n"
    readonly: false
  visible_tests:
  - name: with blanks and spaces
    code: 'assert sum_csv_row([''1'', '' 2 '', '''', ''3'']) == 6, sum_csv_row([''1'', '' 2 '', '''',
      ''3''])

      '
  - name: all numbers
    code: 'assert sum_csv_row([''10'', ''20'']) == 30

      '
  hidden_tests:
  - name: only blanks
    code: 'assert sum_csv_row(['''', ''   '', '''']) == 0

      '
  - name: negative values
    code: 'assert sum_csv_row([''-5'', ''5'']) == 0

      '
  - name: single
    code: 'assert sum_csv_row(['' 7 '']) == 7

      '
  - name: empty row
    code: 'assert sum_csv_row([]) == 0

      '
  timeout: 8
