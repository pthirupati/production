title: Fix Integer Division in percentage
slug: py-fix-percentage-int-division
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix Integer Division
  in percentage` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: percentage(part, whole) should return what percent `part` is of `whole` as
  a float, but it uses floor division (//) so it truncates to whole numbers (e.g. 1/3 -> 0.0). Fix it
  to return a true float percentage and guard whole == 0 (return 0.0).


  OBJECTIVE: See the truncated 0.0 result; Use true division; Guard division by zero. Success means all
  hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
