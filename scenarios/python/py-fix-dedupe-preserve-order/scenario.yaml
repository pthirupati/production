title: Fix dedupe to Preserve Order
slug: py-fix-dedupe-preserve-order
category: Python Development
description: dedupe(items) should remove duplicates while preserving first-seen order, but it returns
  list(set(items)), which loses order and is non-deterministic. Fix it to keep the original order of first
  appearance.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See that the output order is wrong/unstable
- Track seen items while iterating in order
- Return uniques in first-seen order
initial_state: dedupe(items) should remove duplicates while preserving first-seen order, but it returns
  list(set(items)), which loses order and is non-deterministic. Fix it to keep the original order of first
  appearance.
solution_explanation: |
  A set has no order. Iterating in sequence while tracking a `seen` set preserves first-appearance order deterministically.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix dedupe(items) so duplicates are removed but the order of first appearance is preserved.
      dedupe([3, 1, 3, 2, 1]) -> [3, 1, 2]
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      def dedupe(items):
          return list(set(items))
    readonly: false
  visible_tests:
  - name: preserves order
    code: |
      assert dedupe([3, 1, 3, 2, 1]) == [3, 1, 2]
  - name: already unique
    code: |
      assert dedupe([1, 2, 3]) == [1, 2, 3]
  hidden_tests:
  - name: strings keep order
    code: |
      assert dedupe(['b', 'a', 'b', 'c']) == ['b', 'a', 'c']
  - name: empty
    code: |
      assert dedupe([]) == []
  - name: all same
    code: |
      assert dedupe([5, 5, 5]) == [5]
  - name: order is exact
    code: |
      assert dedupe([10, 20, 10, 30, 20, 40]) == [10, 20, 30, 40]
  timeout: 8
hints:
- order: 1
  cost: 10
  content: list(set(...)) discards ordering — dedupe([3,1,3,2,1]) may not start with 3.
- order: 2
  cost: 20
  content: Iterate in order and remember which items you've already emitted.
- order: 3
  cost: 30
  content: Keep a `seen` set and append to an output list only the first time you see each item.
