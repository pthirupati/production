title: Fix dedupe to Preserve Order
slug: py-fix-dedupe-preserve-order
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix dedupe to Preserve
  Order` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: dedupe(items) should remove duplicates while preserving first-seen order,
  but it returns list(set(items)), which loses order and is non-deterministic. Fix it to keep the original
  order of first appearance.


  OBJECTIVE: See that the output order is wrong/unstable; Track seen items while iterating in order; Return
  uniques in first-seen order. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See that the output order is wrong/unstable
- Track seen items while iterating in order
- Return uniques in first-seen order
initial_state: dedupe(items) should remove duplicates while preserving first-seen order, but it returns
  list(set(items)), which loses order and is non-deterministic. Fix it to keep the original order of first
  appearance.
solution_explanation: 'A set has no order. Iterating in sequence while tracking a `seen` set preserves
  first-appearance order deterministically.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix dedupe(items) so duplicates are removed but the order of first appearance is preserved.\n\
    \  dedupe([3, 1, 3, 2, 1]) -> [3, 1, 2]\nClick Run to try it, then Check Solution to grade against\
    \ all tests.\n"
  files:
  - path: solution.py
    content: "def dedupe(items):\n    return list(set(items))\n"
    readonly: false
  visible_tests:
  - name: preserves order
    code: 'assert dedupe([3, 1, 3, 2, 1]) == [3, 1, 2]

      '
  - name: already unique
    code: 'assert dedupe([1, 2, 3]) == [1, 2, 3]

      '
  hidden_tests:
  - name: strings keep order
    code: 'assert dedupe([''b'', ''a'', ''b'', ''c'']) == [''b'', ''a'', ''c'']

      '
  - name: empty
    code: 'assert dedupe([]) == []

      '
  - name: all same
    code: 'assert dedupe([5, 5, 5]) == [5]

      '
  - name: order is exact
    code: 'assert dedupe([10, 20, 10, 30, 20, 40]) == [10, 20, 30, 40]

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.py`, read the instructions, and run the visible tests to see
