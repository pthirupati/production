title: Fix the ZeroDivisionError in average
slug: py-fix-average-empty-divzero
category: Python Development
description: average(nums) crashes with ZeroDivisionError when given an empty list because it divides
  by len(nums) without checking. Guard the empty case (return 0.0) while keeping the correct mean for
  non-empty lists.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Trigger the crash on an empty list
- Add a guard for the zero-length case
- Keep the correct average for non-empty input
initial_state: average(nums) crashes with ZeroDivisionError when given an empty list because it divides
  by len(nums) without checking. Guard the empty case (return 0.0) while keeping the correct mean for
  non-empty lists.
solution_explanation: |
  Dividing by len(nums) explodes when the list is empty. An early `if not nums: return 0.0` guard fixes it without changing the normal path.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix average(nums) so it returns the arithmetic mean, and returns 0.0 for an empty list instead of raising ZeroDivisionError.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      def average(nums):
          return sum(nums) / len(nums)
    readonly: false
  visible_tests:
  - name: simple mean
    code: |
      assert average([2, 4, 6]) == 4, average([2, 4, 6])
  - name: empty list is 0.0
    code: |
      assert average([]) == 0.0, average([])
  hidden_tests:
  - name: single element
    code: |
      assert average([9]) == 9.0
  - name: floats
    code: |
      assert abs(average([1.0, 2.0]) - 1.5) < 1e-9
  - name: negatives
    code: |
      assert average([-2, 2]) == 0.0
  - name: empty does not raise
    code: |
      r = average([]); assert isinstance(r, float)
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Call average([]) — it raises ZeroDivisionError because len is 0.
- order: 2
  cost: 20
  content: Check `if not nums:` at the top and return 0.0 before dividing.
- order: 3
  cost: 30
  content: Guard the empty case, otherwise divide sum(nums) by len(nums) as before.
