title: Fix the ZeroDivisionError in average
slug: py-fix-average-empty-divzero
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix the ZeroDivisionError
  in average` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: average(nums) crashes with ZeroDivisionError when given an empty list because
  it divides by len(nums) without checking. Guard the empty case (return 0.0) while keeping the correct
  mean for non-empty lists.


  OBJECTIVE: Trigger the crash on an empty list; Add a guard for the zero-length case; Keep the correct
  average for non-empty input. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Trigger the crash on an empty list
- Add a guard for the zero-length case
- Keep the correct average for non-empty input
initial_state: average(nums) crashes with ZeroDivisionError when given an empty list because it divides
  by len(nums) without checking. Guard the empty case (return 0.0) while keeping the correct mean for
  non-empty lists.
solution_explanation: 'Dividing by len(nums) explodes when the list is empty. An early `if not nums: return
  0.0` guard fixes it without changing the normal path.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Fix average(nums) so it returns the arithmetic mean, and returns 0.0 for an empty list
    instead of raising ZeroDivisionError.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def average(nums):\n    return sum(nums) / len(nums)\n"
    readonly: false
  visible_tests:
  - name: simple mean
    code: 'assert average([2, 4, 6]) == 4, average([2, 4, 6])

      '
  - name: empty list is 0.0
    code: 'assert average([]) == 0.0, average([])

      '
  hidden_tests:
  - name: single element
    code: 'assert average([9]) == 9.0

      '
  - name: floats
    code: 'assert abs(average([1.0, 2.0]) - 1.5) < 1e-9

      '
  - name: negatives
    code: 'assert average([-2, 2]) == 0.0

      '
  - name: empty does not raise
    code: 'r = average([]); assert isinstance(r, float)

      '
  timeout: 8
