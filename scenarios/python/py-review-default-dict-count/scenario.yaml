title: 'Refactor: Simplify and Fix char_counts'
slug: py-review-default-dict-count
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Refactor: Simplify and
  Fix char_counts` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: char_counts(s) should return a dict of character -> count, but the hand-rolled
  version forgets to initialize new keys, raising KeyError on the first occurrence of each character.
  Refactor it to count safely (collections.Counter or dict.get) and return the frequency map.


  OBJECTIVE: Reproduce the KeyError on the first character; Initialize counts safely; Return correct character
  frequencies. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
