is_free: true
dual_terminal: false
objectives:
- Reproduce the KeyError on the first character
- Initialize counts safely
- Return correct character frequencies
initial_state: char_counts(s) should return a dict of character -> count, but the hand-rolled version
  forgets to initialize new keys, raising KeyError on the first occurrence of each character. Refactor
  it to count safely (collections.Counter or dict.get) and return the frequency map.
solution_explanation: 'Incrementing an absent key raises KeyError. Using counts.get(ch, 0) + 1 (or Counter)
  initializes on first sight.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: review
  instructions: "Fix char_counts(s): return {char: count}.\n  char_counts('aab') -> {'a': 2, 'b': 1}\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def char_counts(s):\n    counts = {}\n    for ch in s:\n        counts[ch] += 1   # KeyError:\
      \ ch not initialized\n    return counts\n"
    readonly: false
  visible_tests:
  - name: basic
    code: 'assert char_counts(''aab'') == {''a'': 2, ''b'': 1}

      '
  - name: single char
    code: 'assert char_counts(''z'') == {''z'': 1}

      '
  hidden_tests:
  - name: empty string
    code: 'assert char_counts('''') == {}

      '
  - name: spaces counted
    code: 'assert char_counts(''a a'') == {''a'': 2, '' '': 1}

      '
  - name: all same
    code: 'assert char_counts(''xxxx'') == {''x'': 4}

      '
  - name: mixed
    code: 'assert char_counts(''abcabc'') == {''a'': 2, ''b'': 2, ''c'': 2}

      '
  timeout: 8
