category: Build
description: 'CONTEXT: A team operating Python development needs you to resolve `Implement FizzBuzz` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement fizzbuzz(n) returning a list for 1..n: ''Fizz'' for multiples of
  3, ''Buzz'' for multiples of 5, ''FizzBuzz'' for multiples of both, otherwise the number as a string.
  The stub returns nothing, so the tests fail.


  OBJECTIVE: Read the FizzBuzz contract from the tests; Check the combined 3-and-5 case first; Return
  the correct list of strings for 1..n. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
