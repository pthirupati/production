title: Fix max_subarray Initialization (Kadane)
slug: py-fix-max-subarray-init
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix max_subarray Initialization
  (Kadane)` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: max_subarray(nums) returns the largest contiguous-sum subarray total using
  Kadane''s algorithm, but it initializes the best sum to 0, so for all-negative inputs it wrongly returns
  0 instead of the largest (least negative) element. Fix the initialization.


  OBJECTIVE: Find the wrong answer on an all-negative array; Initialize best/current from the first element,
  not 0; Keep O(n) and pass all tests. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
