initial_state: max_subarray(nums) returns the largest contiguous-sum subarray total using Kadane's algorithm,
  but it initializes the best sum to 0, so for all-negative inputs it wrongly returns 0 instead of the
  largest (least negative) element. Fix the initialization.
solution_explanation: 'Seeding best/cur with 0 implicitly allows the empty subarray, giving 0 for all-negative
  inputs. Seeding from nums[0] makes Kadane correct.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix max_subarray(nums) so it returns the maximum contiguous subarray sum, correct even\
    \ when every number is negative. Assume nums is non-empty.\n  max_subarray([-2,1,-3,4,-1,2,1,-5,4])\
    \ -> 6\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def max_subarray(nums):\n    best = 0\n    cur = 0\n    for x in nums:\n        cur = max(x,\
      \ cur + x)\n        best = max(best, cur)\n    return best\n"
    readonly: false
  visible_tests:
  - name: classic example
    code: 'assert max_subarray([-2,1,-3,4,-1,2,1,-5,4]) == 6

      '
  - name: all positive
    code: 'assert max_subarray([1, 2, 3]) == 6

      '
  hidden_tests:
  - name: all negative
    code: 'assert max_subarray([-3, -1, -2]) == -1, max_subarray([-3, -1, -2])

      '
  - name: single negative
    code: 'assert max_subarray([-5]) == -5

      '
  - name: single positive
    code: 'assert max_subarray([7]) == 7

      '
  - name: mixed ending negative
    code: 'assert max_subarray([5, -2, 3, -10]) == 6

      '
  timeout: 8
