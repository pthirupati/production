title: Fix max_subarray Initialization (Kadane)
slug: py-fix-max-subarray-init
category: Python Development
description: max_subarray(nums) returns the largest contiguous-sum subarray total using Kadane's algorithm,
  but it initializes the best sum to 0, so for all-negative inputs it wrongly returns 0 instead of the
  largest (least negative) element. Fix the initialization.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Find the wrong answer on an all-negative array
- Initialize best/current from the first element, not 0
- Keep O(n) and pass all tests
initial_state: max_subarray(nums) returns the largest contiguous-sum subarray total using Kadane's algorithm,
  but it initializes the best sum to 0, so for all-negative inputs it wrongly returns 0 instead of the
  largest (least negative) element. Fix the initialization.
solution_explanation: |
  Seeding best/cur with 0 implicitly allows the empty subarray, giving 0 for all-negative inputs. Seeding from nums[0] makes Kadane correct.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix max_subarray(nums) so it returns the maximum contiguous subarray sum, correct even when every number is negative. Assume nums is non-empty.
      max_subarray([-2,1,-3,4,-1,2,1,-5,4]) -> 6
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      def max_subarray(nums):
          best = 0
          cur = 0
          for x in nums:
              cur = max(x, cur + x)
              best = max(best, cur)
          return best
    readonly: false
  visible_tests:
  - name: classic example
    code: |
      assert max_subarray([-2,1,-3,4,-1,2,1,-5,4]) == 6
  - name: all positive
    code: |
      assert max_subarray([1, 2, 3]) == 6
  hidden_tests:
  - name: all negative
    code: |
      assert max_subarray([-3, -1, -2]) == -1, max_subarray([-3, -1, -2])
  - name: single negative
    code: |
      assert max_subarray([-5]) == -5
  - name: single positive
    code: |
      assert max_subarray([7]) == 7
  - name: mixed ending negative
    code: |
      assert max_subarray([5, -2, 3, -10]) == 6
  timeout: 8
hints:
- order: 1
  cost: 10
  content: max_subarray([-3,-1,-2]) returns 0, but the answer should be -1 (the best single element).
- order: 2
  cost: 20
  content: Starting best at 0 means an empty subarray is allowed, which is wrong here.
- order: 3
  cost: 30
  content: Initialize best = cur = nums[0] and iterate from nums[1:].
