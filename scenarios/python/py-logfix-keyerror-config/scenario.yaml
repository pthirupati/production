title: 'Log Analysis: Fix the KeyError from the Traceback'
slug: py-logfix-keyerror-config
category: Fix
description: 'CONTEXT: A team operating Python development has raised a ticket for `Log Analysis: Fix
  the KeyError from the Traceback`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace. The architecture is a
  single lab-primary node exposing source files, venv, tests, and CLI entrypoints; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Production logged: `KeyError: ''timeout''` raised from get_setting() when
  a key is absent. The function should return a provided default instead of crashing on a missing key.
  Read the traceback in the comment and fix the lookup.


  OBJECTIVE: Read the traceback to identify the failing lookup; Use a safe dict lookup with a default;
  Return the default for missing keys without raising. Acceptance criteria: the change is minimal and
  reversible, and success means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant source files, venv, tests, and CLI entrypoints), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Read the traceback to identify the failing lookup
- Use a safe dict lookup with a default
- Return the default for missing keys without raising
initial_state: 'Production logged: `KeyError: ''timeout''` raised from get_setting() when a key is absent.
  The function should return a provided default instead of crashing on a missing key. Read the traceback
  in the comment and fix the lookup.'
solution_explanation: 'Subscript access raises KeyError for absent keys. dict.get(key, default) returns
  the fallback while still returning stored falsy values like 0.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: logfix
  instructions: 'Fix get_setting(config, key, default) so it returns config[key] when present, otherwise
    `default`. The log shows it currently raises KeyError on missing keys.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "# Production traceback:\n#   File \"app.py\", line 12, in handle_request\n#     t = get_setting(cfg,\
      \ 'timeout', 30)\n#   File \"settings.py\", line 4, in get_setting\n#     return config[key]\n#\
      \ KeyError: 'timeout'\n\ndef get_setting(config, key, default):\n    return config[key]   # raises\
      \ KeyError when key is missing\n"
    readonly: false
  visible_tests:
  - name: present key
    code: 'assert get_setting({''timeout'': 5}, ''timeout'', 30) == 5

      '
  - name: missing key uses default
    code: 'assert get_setting({}, ''timeout'', 30) == 30

      '
  hidden_tests:
  - name: falsy stored value is returned
    code: 'assert get_setting({''retries'': 0}, ''retries'', 3) == 0

      '
  - name: missing does not raise
    code: 'r = get_setting({''a'': 1}, ''b'', ''fallback'')

      assert r == ''fallback''

      '
  - name: None default
    code: 'assert get_setting({}, ''x'', None) is None

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: log analysis is not behaving as the scenario
    objectives require. This lab is about log analysis — how log analysis behaves in a Python development
    environment. Read the objectives and the current state, and note precisely what looks wrong versus
    healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For log analysis problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `solution.py`, read the instructions, and run the visible tests to see which assertion fails
    first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of log analysis is at fault.

    2. Re-run the most relevant of source files, venv, tests, and CLI entrypoints focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''log analysis
    is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `solution.py` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
