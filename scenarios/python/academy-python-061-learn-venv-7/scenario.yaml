hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `which python`, `pip freeze`, and activation scripts.

    2. Write down what looks normal versus wrong or missing for Python virtual environments.

    3. Recall the core idea: venv creation, dependency pinning, and interpreter isolation.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Python virtual
    environments.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `which python`, `pip freeze`, and activation scripts.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — the venv activates cleanly and required imports succeed.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-python-061-learn-venv-7.conf`,
    then click Check Solution.'
