title: "Coding: Fix the FizzBuzz Bug"
slug: sim-coding-fizzbuzz-bug
category: Python Development
description: |
  The fizzbuzz(n) function is supposed to return a list for 1..n where multiples
  of 3 become "Fizz", multiples of 5 become "Buzz", multiples of both become
  "FizzBuzz", and everything else is the number as a string. There is a bug in
  the implementation — find it and fix it so all tests pass.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
  - Read the failing tests to understand the expected output
  - Locate and fix the bug in fizzbuzz()
  - Pass all visible and hidden tests
initial_state: A browser IDE opens with fizzbuzz.py. The function has a subtle bug.
solution_explanation: |
  The original code checked `n % 3 == 0` before the combined `n % 15 == 0` case,
  so multiples of 15 returned "Fizz" instead of "FizzBuzz". Check the n % 15 (or
  n % 3 and n % 5 together) case first.
coding_spec:
  language: python
  entrypoint: fizzbuzz.py
  instructions: |
    Fix fizzbuzz(n) so it returns the correct list for 1..n.
      - multiples of 3        -> "Fizz"
      - multiples of 5        -> "Buzz"
      - multiples of 3 AND 5  -> "FizzBuzz"
      - otherwise             -> str(number)
    Click Run to try it, then Check Solution to grade against all tests.
  files:
    - path: fizzbuzz.py
      content: |
        def fizzbuzz(n):
            result = []
            for i in range(1, n + 1):
                if i % 3 == 0:
                    result.append("Fizz")
                elif i % 5 == 0:
                    result.append("Buzz")
                elif i % 3 == 0 and i % 5 == 0:
                    result.append("FizzBuzz")
                else:
                    result.append(str(i))
            return result
  visible_tests:
    - name: returns a list of length n
      code: |
        out = fizzbuzz(5)
        assert isinstance(out, list), "should return a list"
        assert len(out) == 5, f"expected length 5, got {len(out)}"
    - name: handles plain numbers
      code: |
        assert fizzbuzz(2) == ["1", "2"], fizzbuzz(2)
    - name: fizz on 3, buzz on 5
      code: |
        out = fizzbuzz(5)
        assert out[2] == "Fizz", out
        assert out[4] == "Buzz", out
  hidden_tests:
    - name: fizzbuzz on 15
      code: |
        out = fizzbuzz(15)
        assert out[14] == "FizzBuzz", f"index 15 should be FizzBuzz, got {out[14]}"
    - name: fizzbuzz on 30 (two multiples of 15)
      code: |
        out = fizzbuzz(30)
        assert out[14] == "FizzBuzz", out[14]
        assert out[29] == "FizzBuzz", out[29]
    - name: no FizzBuzz where not expected
      code: |
        out = fizzbuzz(15)
        assert out[2] == "Fizz" and out[4] == "Buzz" and out[8] == "Fizz"
        assert out[0] == "1"
hints:
  - content: Run the code and read which test fails. Look closely at the order of the if/elif branches.
    cost: 10
    order: 1
  - content: An `elif i % 3 == 0 and i % 5 == 0` branch can never be reached if `i % 3 == 0` is checked first. Check the combined case first.
    cost: 20
    order: 2
