initial_state: 'A FizzBuzz function is provided with a bug: it prints the wrong token for some numbers
  (e.g. 15 prints "Fizz" instead of "FizzBuzz" because the 15-case is checked after 3/5).'
solution_explanation: 'The original code checked `n % 3 == 0` before the combined `n % 15 == 0` case,

  so multiples of 15 returned "Fizz" instead of "FizzBuzz". Check the n % 15 (or

  n % 3 and n % 5 together) case first.

  '
coding_spec:
  language: python
  entrypoint: fizzbuzz.py
  instructions: "Fix fizzbuzz(n) so it returns the correct list for 1..n.\n  - multiples of 3        ->\
    \ \"Fizz\"\n  - multiples of 5        -> \"Buzz\"\n  - multiples of 3 AND 5  -> \"FizzBuzz\"\n  -\
    \ otherwise             -> str(number)\nClick Run to try it, then Check Solution to grade against\
    \ all tests.\n"
  files:
  - path: fizzbuzz.py
    content: "def fizzbuzz(n):\n    result = []\n    for i in range(1, n + 1):\n        if i % 3 == 0:\n\
      \            result.append(\"Fizz\")\n        elif i % 5 == 0:\n            result.append(\"Buzz\"\
      )\n        elif i % 3 == 0 and i % 5 == 0:\n            result.append(\"FizzBuzz\")\n        else:\n\
      \            result.append(str(i))\n    return result\n"
  visible_tests:
  - name: returns a list of length n
    code: 'out = fizzbuzz(5)

      assert isinstance(out, list), "should return a list"

      assert len(out) == 5, f"expected length 5, got {len(out)}"

      '
  - name: handles plain numbers
    code: 'assert fizzbuzz(2) == ["1", "2"], fizzbuzz(2)

      '
  - name: fizz on 3, buzz on 5
    code: 'out = fizzbuzz(5)

      assert out[2] == "Fizz", out

      assert out[4] == "Buzz", out

      '
  hidden_tests:
  - name: fizzbuzz on 15
    code: 'out = fizzbuzz(15)

      assert out[14] == "FizzBuzz", f"index 15 should be FizzBuzz, got {out[14]}"

      '
  - name: fizzbuzz on 30 (two multiples of 15)
    code: 'out = fizzbuzz(30)

      assert out[14] == "FizzBuzz", out[14]

      assert out[29] == "FizzBuzz", out[29]

      '
  - name: no FizzBuzz where not expected
    code: 'out = fizzbuzz(15)

      assert out[2] == "Fizz" and out[4] == "Buzz" and out[8] == "Fizz"

      assert out[0] == "1"

      '
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: coding is not behaving as the scenario objectives
    require. This lab is about coding — how coding behaves in a Python development environment. Read the
    objectives and the current state, and note precisely what looks wrong versus healthy before you form
    any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For coding problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `fizzbuzz.py`, read the instructions, and run the visible tests to see which assertion fails
    first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of coding is at fault.

    2. Re-run the most relevant of source files, venv, tests, and CLI entrypoints focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''coding is not
    behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `fizzbuzz.py` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.

    WHY: coding labs grade against hidden test cases, not marker files.'
