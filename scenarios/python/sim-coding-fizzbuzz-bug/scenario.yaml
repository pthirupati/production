title: 'Coding: Fix the FizzBuzz Bug'
slug: sim-coding-fizzbuzz-bug
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Coding: Fix the FizzBuzz
  Bug` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A FizzBuzz function is provided with a bug: it prints the wrong token for
  some numbers (e.g. 15 prints "Fizz" instead of "FizzBuzz" because the 15-case is checked after 3/5).
  Coding task: the provided FizzBuzz implementation has a logic bug, so its output is wrong for some inputs
  (commonly the multiples-of-15 case is mishandled, or the order of checks is wrong). Read the code and
  the failing expectations, fix the conditional logic, and make the output correct for all n.


  OBJECTIVE: Run the code/tests and identify which inputs produce wrong output; Locate the faulty conditional
  ordering or modulus check; Fix the logic so FizzBuzz is correct for all numbers. Success means all hidden
  tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Run the code/tests and identify which inputs produce wrong output
- Locate the faulty conditional ordering or modulus check
- Fix the logic so FizzBuzz is correct for all numbers
initial_state: 'A FizzBuzz function is provided with a bug: it prints the wrong token for some numbers
  (e.g. 15 prints "Fizz" instead of "FizzBuzz" because the 15-case is checked after 3/5).'
solution_explanation: 'The original code checked `n % 3 == 0` before the combined `n % 15 == 0` case,

  so multiples of 15 returned "Fizz" instead of "FizzBuzz". Check the n % 15 (or

  n % 3 and n % 5 together) case first.

  '
coding_spec:
  language: python
  entrypoint: fizzbuzz.py
  instructions: "Fix fizzbuzz(n) so it returns the correct list for 1..n.\n  - multiples of 3        ->\
    \ \"Fizz\"\n  - multiples of 5        -> \"Buzz\"\n  - multiples of 3 AND 5  -> \"FizzBuzz\"\n  -\
    \ otherwise             -> str(number)\nClick Run to try it, then Check Solution to grade against\
    \ all tests.\n"
  files:
  - path: fizzbuzz.py
    content: "def fizzbuzz(n):\n    result = []\n    for i in range(1, n + 1):\n        if i % 3 == 0:\n\
      \            result.append(\"Fizz\")\n        elif i % 5 == 0:\n            result.append(\"Buzz\"\
      )\n        elif i % 3 == 0 and i % 5 == 0:\n            result.append(\"FizzBuzz\")\n        else:\n\
      \            result.append(str(i))\n    return result\n"
  visible_tests:
  - name: returns a list of length n
    code: 'out = fizzbuzz(5)

      assert isinstance(out, list), "should return a list"

      assert len(out) == 5, f"expected length 5, got {len(out)}"

      '
  - name: handles plain numbers
    code: 'assert fizzbuzz(2) == ["1", "2"], fizzbuzz(2)

      '
  - name: fizz on 3, buzz on 5
    code: 'out = fizzbuzz(5)

      assert out[2] == "Fizz", out

      assert out[4] == "Buzz", out

      '
  hidden_tests:
  - name: fizzbuzz on 15
    code: 'out = fizzbuzz(15)

      assert out[14] == "FizzBuzz", f"index 15 should be FizzBuzz, got {out[14]}"

      '
  - name: fizzbuzz on 30 (two multiples of 15)
    code: 'out = fizzbuzz(30)

      assert out[14] == "FizzBuzz", out[14]

      assert out[29] == "FizzBuzz", out[29]

      '
  - name: no FizzBuzz where not expected
    code: 'out = fizzbuzz(15)

      assert out[2] == "Fizz" and out[4] == "Buzz" and out[8] == "Fizz"

      assert out[0] == "1"

      '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `fizzbuzz.py`, read the instructions, and run the visible tests to see
    which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the logic so FizzBuzz is correct for all numbers.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
