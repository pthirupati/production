solution_explanation: 'String interpolation lets crafted input change the query. A parameterized query
  with a ? placeholder binds the value at execution time, so it is treated strictly as data.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Refactor build_user_query(username) to return a tuple (sql, params) where sql uses a
    single ? placeholder and params is a tuple/list containing username. The raw username must NOT appear
    in the SQL string.

    Expected sql: "SELECT * FROM users WHERE username = ?"

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def build_user_query(username):\n    sql = \"SELECT * FROM users WHERE username = '\" +\
      \ username + \"'\"\n    return sql\n"
    readonly: false
  visible_tests:
  - name: returns sql and params tuple
    code: 'sql, params = build_user_query(''alice'')

      assert sql == ''SELECT * FROM users WHERE username = ?'', sql

      assert list(params) == [''alice''], params

      '
  - name: uses a placeholder
    code: 'sql, params = build_user_query(''bob'')

      assert ''?'' in sql

      '
  hidden_tests:
  - name: malicious input is not interpolated
    code: 'evil = "x'' OR ''1''=''1"

      sql, params = build_user_query(evil)

      assert evil not in sql, ''username must not be concatenated into SQL''

      assert list(params) == [evil]

      '
  - name: no inline quotes around a value
    code: 'sql, params = build_user_query(''alice'')

      assert "''alice''" not in sql

      '
  - name: params carries the value
    code: 'sql, params = build_user_query(''zoe'')

      assert tuple(params) == (''zoe'',)

      '
  timeout: 8
