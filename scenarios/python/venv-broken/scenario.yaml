title: Broken Virtual Environment
slug: sim-python-venv-broken
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Python development needs you to resolve `Broken Virtual Environment`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Project with a virtual environment that no longer works: activation or the
  venv''s python/pip fails (e.g. "bad interpreter" or missing modules), blocking installs and runs. A
  Python virtual environment is broken — activating it fails or its interpreter/pip errors (commonly because
  the base Python it was created against moved, or the venv is corrupt). Packages can''t be installed
  and scripts won''t run in it. Recreate or repair the venv and reinstall the project''s dependencies.


  OBJECTIVE: Confirm the existing venv''s interpreter/pip is broken; Recreate (or repair) the virtual
  environment; Reinstall dependencies and confirm the project runs in the venv. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
