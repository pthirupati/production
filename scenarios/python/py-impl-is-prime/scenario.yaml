title: Implement is_prime
slug: py-impl-is-prime
category: Build
description: 'CONTEXT: A team operating Python development needs you to resolve `Implement is_prime` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement is_prime(n): True if n is a prime number, False otherwise. Handle
  n < 2 (not prime) and be efficient enough to test moderately large primes (trial division up to sqrt(n)
  is fine).


  OBJECTIVE: Treat n < 2 as not prime; Test divisibility up to sqrt(n); Return correct booleans including
  edge cases. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
