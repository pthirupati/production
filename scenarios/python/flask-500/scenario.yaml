title: Flask App Returns 500
slug: sim-python-flask-500
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Python development needs you to resolve `Flask App Returns 500`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Flask application serving a route that raises an unhandled exception, so the
  endpoint responds 500. The traceback is visible in the server''s stderr/log. A Flask endpoint returns
  HTTP 500 Internal Server Error. An unhandled exception is raised inside the view (a bug, a None value,
  a missing key, or a failed dependency call). Read the traceback from the server log, fix the offending
  code path, and confirm the route returns a successful response.


  OBJECTIVE: Reproduce the 500 and capture the traceback from the Flask log; Identify the line/exception
  inside the view that fails; Fix the code so the endpoint returns a 2xx response. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
