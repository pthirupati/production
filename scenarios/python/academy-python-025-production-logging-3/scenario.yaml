coding_mode: true
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: 'Implement format_log(level, msg) → ''[LEVEL] msg'' with level uppercased.

    Click Run to try it, then Check Solution to grade.

    '
  files:
  - path: solution.py
    content: "def format_log(level, msg):\n    # TODO\n    pass\n"
    readonly: false
  visible_tests:
  - name: info
    code: assert format_log('info', 'hi') == '[INFO] hi'
  hidden_tests:
  - name: err
    code: assert format_log('error', 'x') == '[ERROR] x'
  - name: n
    code: assert format_log('debug', 'n3') == '[DEBUG] n3'
  timeout: 8
