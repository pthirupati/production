initial_state: 'A singly linked Node class (with .val and .next) is provided as a read-only helper. Implement
  reverse_list(head): reverse the list in-place and return the new head. The stub is empty so tests fail.'
solution_explanation: |
  Iteratively reversing the .next pointers with a prev/cur/next trio reverses the list in O(n) and returns the old tail as the new head.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: |
    Implement reverse_list(head) for the provided Node class; return the new head. The list helpers to_list(head) and from_list(values) are available for testing.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: linked.py
    content: |
      class Node:
          def __init__(self, val, next=None):
              self.val = val
              self.next = next

      def from_list(values):
          head = None
          for v in reversed(values):
              head = Node(v, head)
          return head

      def to_list(head):
          out = []
          while head is not None:
              out.append(head.val)
              head = head.next
          return out
    readonly: true
