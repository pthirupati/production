    readonly: false
  visible_tests:
  - name: reverses a list
    code: |
      head = from_list([1, 2, 3, 4])
      assert to_list(reverse_list(head)) == [4, 3, 2, 1]
  - name: single node
    code: |
      head = from_list([7])
      assert to_list(reverse_list(head)) == [7]
  hidden_tests:
  - name: empty list
    code: |
