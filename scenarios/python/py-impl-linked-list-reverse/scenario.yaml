  - name: longer list
    code: |
      assert to_list(reverse_list(from_list([5,4,3,2,1]))) == [1,2,3,4,5]
  - name: new head is old tail
    code: |
      head = from_list([1, 2, 3])
      new_head = reverse_list(head)
      assert new_head.val == 3
