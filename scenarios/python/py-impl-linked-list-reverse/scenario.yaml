      \ = next\n\ndef from_list(values):\n    head = None\n    for v in reversed(values):\n        head\
      \ = Node(v, head)\n    return head\n\ndef to_list(head):\n    out = []\n    while head is not None:\n\
      \        out.append(head.val)\n        head = head.next\n    return out\n"
