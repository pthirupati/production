initial_state: binary_search(arr, target) returns the index of target in a sorted list or -1, but the
  loop condition uses `lo < hi` with an inclusive `hi = len(arr) - 1`, so it never checks the last element
  — the final candidate is skipped. Fix the bound handling.
solution_explanation: 'When hi is inclusive (len-1), `lo < hi` exits before examining the final single-element
  window. Using `lo <= hi` checks it.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Fix binary_search(arr, target) so it returns the index of target in the sorted list arr,
    or -1 if not present. The current bounds skip the last element.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo < hi:      \
      \            # bug: should be lo <= hi\n        mid = (lo + hi) // 2\n        if arr[mid] == target:\n\
      \            return mid\n        elif arr[mid] < target:\n            lo = mid + 1\n        else:\n\
      \            hi = mid - 1\n    return -1\n"
    readonly: false
  visible_tests:
  - name: found in middle
    code: 'assert binary_search([1,3,5,7,9], 5) == 2

      '
  - name: absent
    code: 'assert binary_search([1,3,5,7,9], 4) == -1

      '
  hidden_tests:
  - name: last element
    code: 'assert binary_search([1,3,5,7,9], 9) == 4, binary_search([1,3,5,7,9], 9)

      '
  - name: first element
    code: 'assert binary_search([1,3,5,7,9], 1) == 0

      '
  - name: single element present
    code: 'assert binary_search([42], 42) == 0, binary_search([42], 42)

      '
  - name: single element absent
    code: 'assert binary_search([42], 7) == -1

      '
  - name: two elements last
    code: 'assert binary_search([1, 2], 2) == 1

      '
  timeout: 8
