title: Fix the Binary Search Bounds
slug: py-fix-binary-search-bounds
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix the Binary Search
  Bounds` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: binary_search(arr, target) returns the index of target in a sorted list or
  -1, but the loop condition uses `lo < hi` with an inclusive `hi = len(arr) - 1`, so it never checks
  the last element — the final candidate is skipped. Fix the bound handling.


  OBJECTIVE: Find an input where the last element is missed; Make the loop condition and bounds consistent;
  Return the correct index, or -1 when absent. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
