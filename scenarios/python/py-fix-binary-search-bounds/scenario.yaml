title: Fix the Binary Search Bounds
slug: py-fix-binary-search-bounds
category: Python Development
description: binary_search(arr, target) returns the index of target in a sorted list or -1, but the loop
  condition uses `lo < hi` with an inclusive `hi = len(arr) - 1`, so it never checks the last element
  — the final candidate is skipped. Fix the bound handling.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Find an input where the last element is missed
- Make the loop condition and bounds consistent
- Return the correct index, or -1 when absent
initial_state: binary_search(arr, target) returns the index of target in a sorted list or -1, but the
  loop condition uses `lo < hi` with an inclusive `hi = len(arr) - 1`, so it never checks the last element
  — the final candidate is skipped. Fix the bound handling.
solution_explanation: |
  When hi is inclusive (len-1), `lo < hi` exits before examining the final single-element window. Using `lo <= hi` checks it.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix binary_search(arr, target) so it returns the index of target in the sorted list arr, or -1 if not present. The current bounds skip the last element.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      def binary_search(arr, target):
          lo, hi = 0, len(arr) - 1
          while lo < hi:                  # bug: should be lo <= hi
              mid = (lo + hi) // 2
              if arr[mid] == target:
                  return mid
              elif arr[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1
    readonly: false
  visible_tests:
  - name: found in middle
    code: |
      assert binary_search([1,3,5,7,9], 5) == 2
  - name: absent
    code: |
      assert binary_search([1,3,5,7,9], 4) == -1
  hidden_tests:
  - name: last element
    code: |
      assert binary_search([1,3,5,7,9], 9) == 4, binary_search([1,3,5,7,9], 9)
  - name: first element
    code: |
      assert binary_search([1,3,5,7,9], 1) == 0
  - name: single element present
    code: |
      assert binary_search([42], 42) == 0, binary_search([42], 42)
  - name: single element absent
    code: |
      assert binary_search([42], 7) == -1
  - name: two elements last
    code: |
      assert binary_search([1, 2], 2) == 1
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Search for the last value (e.g. 9 in [1,3,5,7,9]) — it returns -1 even though it's present.
- order: 2
  cost: 20
  content: With an inclusive hi = len-1, the loop must run while lo <= hi, not lo < hi.
- order: 3
  cost: 30
  content: Change the condition to `while lo <= hi:`.
