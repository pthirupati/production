      '
  - name: large input performance
    code: 'nums = list(range(1, 100001))

      target = 199999  # 99999 + 100000 -> indices 99998, 99999

      r = two_sum(nums, target)

      assert r == [99998, 99999], r

      '
hints:
- order: 1
  cost: 10
  content: 'Read the tests for the exact contract: it returns indices (not the values), and each input
    has exactly one solution. A brute-force double loop is O(n^2).'
- order: 2
  cost: 15
  content: 'Do it in one pass with a hash map of value→index: for each num, check if `target - num` is
    already in the map.'
- order: 3
  cost: 20
  content: 'Implement: `seen={}; for i,n in enumerate(nums): if target-n in seen: return [seen[target-n],
    i]; seen[n]=i`. Re-run the tests — all pass in O(n).'
