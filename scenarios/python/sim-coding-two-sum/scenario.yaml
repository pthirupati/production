title: 'Coding: Implement Two-Sum'
slug: sim-coding-two-sum
category: Build
description: 'CONTEXT: A team operating Python development needs you to resolve `Coding: Implement Two-Sum`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A two_sum(nums, target) stub is provided with failing tests. It must return
  the indices of the two values summing to target (exactly one valid answer per input). Coding task: implement
  the classic Two-Sum function — given an array of integers and a target, return the indices of the two
  numbers that add up to the target. The stub is provided and the tests are failing. Implement an efficient,
  correct solution that passes all test cases.


  OBJECTIVE: Understand the required input/output contract from the tests; Implement two_sum returning
  the correct pair of indices; Pass all provided test cases efficiently. Success means all hidden tests
  pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
