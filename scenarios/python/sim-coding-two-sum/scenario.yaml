initial_state: A two_sum(nums, target) stub is provided with failing tests. It must return the indices
  of the two values summing to target (exactly one valid answer per input).
solution_explanation: 'A single-pass hash map gives O(n): for each value, check whether

  target - value was already seen; if so return its stored index and the

  current index. Otherwise store value -> index. A brute-force double loop also

  passes the correctness tests.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  instructions: "Implement two_sum(nums, target). Return the two indices (ascending) of the\nelements\
    \ that sum to target. Assume exactly one valid answer exists.\n  two_sum([2, 7, 11, 15], 9) -> [0,\
    \ 1]\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def two_sum(nums, target):\n    # TODO: return [i, j] (i < j) such that nums[i] + nums[j]\
      \ == target\n    pass\n"
  visible_tests:
  - name: basic example
    code: 'assert two_sum([2, 7, 11, 15], 9) == [0, 1], two_sum([2, 7, 11, 15], 9)

      '
  - name: answer at the end
    code: 'assert two_sum([3, 2, 4], 6) == [1, 2], two_sum([3, 2, 4], 6)

      '
  - name: indices ascending
    code: 'r = two_sum([3, 3], 6)

      assert r == [0, 1], r

      '
  hidden_tests:
  - name: negative numbers
    code: 'r = two_sum([-3, 4, 3, 90], 0)

      assert r == [0, 2], r

      '
  - name: does not reuse the same element
    code: 'r = two_sum([5, 1, 5], 10)

      assert r[0] != r[1] and sorted(r) == r

      assert {5} == {[5,1,5][r[0]], [5,1,5][r[1]]}

      '
  - name: large input performance
    code: 'nums = list(range(1, 100001))

      target = 199999  # 99999 + 100000 -> indices 99998, 99999

      r = two_sum(nums, target)

      assert r == [99998, 99999], r

      '
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: coding is not behaving as the scenario objectives
    require. This lab is about coding — how coding behaves in a Python development environment. Read the
    objectives and the current state, and note precisely what looks wrong versus healthy before you form
    any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For coding problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `solution.py`, read the instructions, and run the visible tests to see which assertion fails
    first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of coding is at fault.

    2. Re-run the most relevant of source files, venv, tests, and CLI entrypoints focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''coding is not
    behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `solution.py` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
