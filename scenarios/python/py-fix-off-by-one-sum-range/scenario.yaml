title: Fix the Off-by-One in sum_range
slug: py-fix-off-by-one-sum-range
category: Python Development
description: sum_range(a, b) should return the sum of all integers from a to b INCLUSIVE, but it drops
  the final value because of an off-by-one error in the range bounds. Find and fix the boundary so both
  endpoints are counted.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Reproduce the wrong total for a small inclusive range
- Locate the off-by-one in the range() upper bound
- Make both endpoints inclusive so all tests pass
initial_state: sum_range(a, b) should return the sum of all integers from a to b INCLUSIVE, but it drops
  the final value because of an off-by-one error in the range bounds. Find and fix the boundary so both
  endpoints are counted.
solution_explanation: |
  range(a, b) is half-open and never yields b, so the upper endpoint was dropped. Using range(a, b + 1) makes the range inclusive on both ends.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix sum_range(a, b) so it returns the sum of every integer from a to b, inclusive of both ends.
      sum_range(1, 5) -> 15  (1+2+3+4+5)
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      def sum_range(a, b):
          total = 0
          for i in range(a, b):   # bug: excludes b
              total += i
          return total
    readonly: false
  visible_tests:
  - name: 1..5 inclusive
    code: |
      assert sum_range(1, 5) == 15, sum_range(1, 5)
  - name: single value
    code: |
      assert sum_range(7, 7) == 7, sum_range(7, 7)
  hidden_tests:
  - name: zero to four
    code: |
      assert sum_range(0, 4) == 10, sum_range(0, 4)
  - name: includes the endpoint
    code: |
      assert sum_range(3, 6) == 18, sum_range(3, 6)
  - name: ten to ten
    code: |
      assert sum_range(10, 10) == 10
  - name: larger range
    code: |
      assert sum_range(1, 100) == 5050, sum_range(1, 100)
  timeout: 8
hints:
- order: 1
  cost: 10
  content: 'Print sum_range(1, 5): you''ll get 10, not 15 — the last number is missing.'
- order: 2
  cost: 20
  content: range(a, b) stops BEFORE b. To include b you need range(a, b + 1).
- order: 3
  cost: 30
  content: Change the loop to `for i in range(a, b + 1):` and re-run — every case passes.
