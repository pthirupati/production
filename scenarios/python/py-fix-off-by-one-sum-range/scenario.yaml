title: Fix the Off-by-One in sum_range
slug: py-fix-off-by-one-sum-range
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix the Off-by-One in
  sum_range` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: sum_range(a, b) should return the sum of all integers from a to b INCLUSIVE,
  but it drops the final value because of an off-by-one error in the range bounds. Find and fix the boundary
  so both endpoints are counted.


  OBJECTIVE: Reproduce the wrong total for a small inclusive range; Locate the off-by-one in the range()
  upper bound; Make both endpoints inclusive so all tests pass. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
