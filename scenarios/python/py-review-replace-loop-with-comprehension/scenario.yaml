title: 'Refactor: Correct and Simplify squares_of_evens'
slug: py-review-replace-loop-with-comprehension
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Refactor: Correct and
  Simplify squares_of_evens` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: squares_of_evens(nums) is meant to return the squares of only the EVEN numbers,
  but the verbose loop has a bug: it squares every number and filters nothing. Refactor it (a comprehension
  is cleanest) so it returns the squares of the even values only, in order.


  OBJECTIVE: Notice odd numbers are wrongly included; Filter to even numbers before squaring; Return the
  squares in input order. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
