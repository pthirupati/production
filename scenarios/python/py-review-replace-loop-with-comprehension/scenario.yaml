- Return the squares in input order
initial_state: 'squares_of_evens(nums) is meant to return the squares of only the EVEN numbers, but the
  verbose loop has a bug: it squares every number and filters nothing. Refactor it (a comprehension is
  cleanest) so it returns the squares of the even values only, in order.'
solution_explanation: 'The loop squared everything with no filter. A guarded comprehension keeps only
  even numbers and is also clearer.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: review
  instructions: "Fix squares_of_evens(nums): return [n*n for the even n], preserving order.\n  squares_of_evens([1,2,3,4])\
    \ -> [4, 16]\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def squares_of_evens(nums):\n    out = []\n    for n in nums:\n        out.append(n * n)\
      \   # bug: never filters to evens\n    return out\n"
    readonly: false
  visible_tests:
  - name: basic
    code: 'assert squares_of_evens([1, 2, 3, 4]) == [4, 16]

      '
  - name: no evens
    code: 'assert squares_of_evens([1, 3, 5]) == []

      '
  hidden_tests:
  - name: all evens
    code: 'assert squares_of_evens([2, 4, 6]) == [4, 16, 36]

      '
  - name: includes zero
    code: 'assert squares_of_evens([0, 1, 2]) == [0, 4]

      '
  - name: negatives
    code: 'assert squares_of_evens([-2, -3, -4]) == [4, 16]

      '
  - name: empty
    code: 'assert squares_of_evens([]) == []

      '
  timeout: 8
