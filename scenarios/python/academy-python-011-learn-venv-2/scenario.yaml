description: 'CONTEXT: A team operating Python development needs you to resolve `python: Python Virtual
  Environments — Fundamentals Lab` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Python project workspace is online with a starter Python virtual environments
  setup. Some pieces are intentionally incomplete so you can learn how they fit together. Nothing is on
  fire — focus on observation. This beginner-friendly python lab introduces Python virtual environments.
  You will explore venv creation, dependency pinning, and interpreter isolation on the Python project
  workspace. Read the environment first, then follow the guided steps — no prior production experience
  required.


  OBJECTIVE: Understand how Python virtual environments work in this lab environment; Identify the main
  status and configuration signals for Python virtual environments; Confirm you can read the current state
  confidently before changing anything. Success means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how Python virtual environments work in this lab environment
- Identify the main status and configuration signals for Python virtual environments
- Confirm you can read the current state confidently before changing anything
initial_state: The Python project workspace is online with a starter Python virtual environments setup.
  Some pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire
  — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `which python`, `pip freeze`, and activation scripts.

    2. Write down what looks normal versus wrong or missing for Python virtual environments.

    3. Recall the core idea: venv creation, dependency pinning, and interpreter isolation. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `which python`, `pip freeze`, and activation scripts.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — the venv activates cleanly and required imports succeed.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
