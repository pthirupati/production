title: Circular Import Error
slug: sim-python-circular-import
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Python development needs you to resolve `Circular Import Error`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Python project. Two modules import each other at module load time, producing
  an ImportError about a partially initialized module the moment the app is imported/run. A Python application
  fails to start with "ImportError: cannot import name X from partially initialized module ... (most likely
  due to a circular import)". Two modules import each other at top level, so neither finishes initializing.
  Break the cycle so the app imports cleanly.


  OBJECTIVE: Reproduce the ImportError and read which modules form the cycle; Locate the mutual top-level
  imports causing the circular dependency; Break the cycle and confirm the app imports/runs cleanly. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
