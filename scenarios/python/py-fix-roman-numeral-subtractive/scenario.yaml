solution_explanation: 'Greedy conversion only produces canonical numerals when the subtractive pairs are
  present as table entries in descending order.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix to_roman(n) for 1 <= n <= 3999 to produce canonical Roman numerals with subtractive\
    \ notation.\n  to_roman(4) -> 'IV', to_roman(1994) -> 'MCMXCIV'\nClick Run to try it, then Check Solution\
    \ to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def to_roman(n):\n    table = [\n        (1000, 'M'), (500, 'D'), (100, 'C'),\n        (50,\
      \ 'L'), (10, 'X'), (5, 'V'), (1, 'I'),\n    ]\n    out = []\n    for value, sym in table:\n    \
      \    while n >= value:\n            out.append(sym)\n            n -= value\n    return ''.join(out)\n"
    readonly: false
  visible_tests:
  - name: four
    code: 'assert to_roman(4) == ''IV'', to_roman(4)

      '
  - name: nine
    code: 'assert to_roman(9) == ''IX'', to_roman(9)

      '
  hidden_tests:
  - name: forty
    code: 'assert to_roman(40) == ''XL'', to_roman(40)

      '
  - name: ninety-nine
    code: 'assert to_roman(99) == ''XCIX'', to_roman(99)

      '
  - name: '1994'
    code: 'assert to_roman(1994) == ''MCMXCIV'', to_roman(1994)

      '
  - name: 3888 (long)
    code: 'assert to_roman(3888) == ''MMMDCCCLXXXVIII''

      '
  - name: plain values still work
    code: 'assert to_roman(3) == ''III'' and to_roman(2000) == ''MM''

      '
  timeout: 8
