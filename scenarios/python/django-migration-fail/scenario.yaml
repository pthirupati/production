title: Django Migration Failure
slug: sim-python-django-migration
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating Python development needs you to resolve `Django Migration Failure`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Django project whose database schema doesn''t match the current models. The
  app raises database errors about missing columns/tables, and `showmigrations` lists unapplied migrations.
  A Django app fails because the database schema is out of sync with the models — requests error (e.g.
  "no such column" / "relation does not exist") or Django reports unapplied migrations. A migration was
  added but never applied, or models changed without a migration. Generate and apply the migrations so
  the schema matches the models.


  OBJECTIVE: Identify the pending or missing migration causing the schema mismatch; Generate any missing
  migration and apply migrations; Confirm the app runs without database schema errors. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
