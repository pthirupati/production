title: Django Migration Failure
slug: sim-python-django-migration
category: Python Development
difficulty: hard
description: A Django app fails because the database schema is out of sync with the models — requests
  error (e.g. "no such column" / "relation does not exist") or Django reports unapplied migrations. A
  migration was added but never applied, or models changed without a migration. Generate and apply the
  migrations so the schema matches the models.
initial_state: Django project whose database schema doesn't match the current models. The app raises database
  errors about missing columns/tables, and `showmigrations` lists unapplied migrations.
lab_mode: simulation
simulation_type: python
is_free: false
jira_priority: Medium
max_score: 100
time_limit: 900
dual_terminal: false
requires_companion_hosts: false
objectives:
- Identify the pending or missing migration causing the schema mismatch
- Generate any missing migration and apply migrations
- Confirm the app runs without database schema errors
hints:
- order: 1
  cost: 10
  content: 'See migration state: `python manage.py showmigrations` — unapplied ones show as [ ]. The runtime
    error names the missing column/table.'
- order: 2
  cost: 15
  content: 'If models changed but no migration exists, create it: `python manage.py makemigrations`. If
    a migration exists but is unapplied, you just need to migrate.'
- order: 3
  cost: 20
  content: 'Apply them: `python manage.py migrate`. Re-run the failing request (or `manage.py check`)
    and confirm the schema errors are gone.'
