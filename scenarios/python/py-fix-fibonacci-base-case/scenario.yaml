title: Fix the Fibonacci Base Case
slug: py-fix-fibonacci-base-case
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix the Fibonacci Base
  Case` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: fib(n) returns the n-th Fibonacci number (0-indexed: 0,1,1,2,3,5,...), but
  the base cases are wrong so the whole sequence is shifted/incorrect. Fix the base cases so fib(0)=0
  and fib(1)=1.


  OBJECTIVE: Check fib(0) and fib(1) against the definition; Correct the base-case return values; Verify
  the recursive/iterative sequence is right. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Check fib(0) and fib(1) against the definition
- Correct the base-case return values
- Verify the recursive/iterative sequence is right
initial_state: 'fib(n) returns the n-th Fibonacci number (0-indexed: 0,1,1,2,3,5,...), but the base cases
  are wrong so the whole sequence is shifted/incorrect. Fix the base cases so fib(0)=0 and fib(1)=1.'
solution_explanation: 'fib(0) must be 0. The base case returned 1, shifting the indexing. Correcting it
  to return 0 fixes the whole sequence.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix fib(n) so the 0-indexed sequence is 0, 1, 1, 2, 3, 5, 8, ...\n  fib(0)=0, fib(1)=1,\
    \ fib(6)=8\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def fib(n):\n    if n == 0:\n        return 1\n    if n == 1:\n        return 1\n    a,\
      \ b = 0, 1\n    for _ in range(n - 1):\n        a, b = b, a + b\n    return b\n"
    readonly: false
  visible_tests:
  - name: fib(0)
    code: 'assert fib(0) == 0, fib(0)

      '
  - name: fib(1)
    code: 'assert fib(1) == 1, fib(1)

      '
  hidden_tests:
  - name: fib(2)
    code: 'assert fib(2) == 1, fib(2)

      '
  - name: fib(6)
    code: 'assert fib(6) == 8, fib(6)

      '
  - name: fib(10)
    code: 'assert fib(10) == 55, fib(10)

      '
  - name: sequence prefix
    code: 'assert [fib(i) for i in range(7)] == [0, 1, 1, 2, 3, 5, 8]

      '
  timeout: 8
hints:
- order: 1
  cost: 0
