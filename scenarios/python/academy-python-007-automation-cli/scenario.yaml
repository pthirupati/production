description: 'CONTEXT: A team operating Python development needs you to resolve `python: Command-Line
  Interfaces — Automation Practice` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for command-line interfaces. Automate
  the boring parts without hiding important safety checks. Automation lab: remove toil around command-line
  interfaces. Codify repeatable steps for argument parsing, help, and exit codes and prove the automation
  is idempotent.


  OBJECTIVE: Day-2 command-line interfaces work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 command-line interfaces work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for command-line interfaces. Automate the boring parts
  without hiding important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — argparse setup and `--help` output.

    2. Write down what looks normal versus wrong or missing for command-line interfaces.

    3. Recall the core idea: argument parsing, help, and exit codes. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Changes are verified with before/after checks

    2. The system remains stable for dependent teams'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — argparse setup and `--help` output.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — the CLI parses args and returns correct exit codes.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
