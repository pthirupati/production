objectives:
- Back the stack with a list
- Implement LIFO push/pop/peek
- Raise IndexError on empty pop/peek and support len()
initial_state: Implement a Stack class with push(x), pop(), peek(), is_empty(), and __len__. pop/peek
  on an empty stack should raise IndexError. The stub is empty so the tests fail.
solution_explanation: 'A list models a stack: append/pop at the end give LIFO. Guarding the empty case
  raises IndexError, and __len__ exposes the size.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: 'Implement class Stack with: push(x), pop() -> last item, peek() -> last item without
    removing, is_empty() -> bool, and len(stack). pop/peek on empty must raise IndexError.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "class Stack:\n    # TODO: implement push, pop, peek, is_empty, __len__\n    pass\n"
    readonly: false
  visible_tests:
  - name: push and pop
    code: 's = Stack()

      s.push(1)

      s.push(2)

      assert s.pop() == 2 and s.pop() == 1

      '
  - name: starts empty
    code: 's = Stack()

      assert s.is_empty() and len(s) == 0

      '
  hidden_tests:
  - name: peek does not remove
    code: 's = Stack()

      s.push(7)

      assert s.peek() == 7 and len(s) == 1

      '
  - name: len tracks size
    code: "s = Stack()\nfor i in range(3):\n    s.push(i)\nassert len(s) == 3\n"
  - name: pop empty raises
    code: "s = Stack()\ntry:\n    s.pop()\n    assert False, 'expected IndexError'\nexcept IndexError:\n\
      \    pass\n"
  - name: peek empty raises
    code: "s = Stack()\ntry:\n    s.peek()\n    assert False\nexcept IndexError:\n    pass\n"
  - name: LIFO order
    code: "s = Stack()\nfor x in [1,2,3]:\n    s.push(x)\nassert [s.pop(), s.pop(), s.pop()] == [3,2,1]\n"
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: implement a stack class is not behaving as the
    scenario objectives require. This lab is about implement a stack class — how implement a stack class
    behaves in a Python development environment. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For implement a stack class problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one component that owns
    the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small, reversible
    steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `solution.py`, read the instructions, and run the visible tests to see which assertion fails
    first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of implement a stack class is at fault.

    2. Re-run the most relevant of source files, venv, tests, and CLI entrypoints focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''implement a stack
    class is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `solution.py` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
