title: Implement a Stack Class
slug: py-impl-stack-class
category: Build
description: 'CONTEXT: A team operating Python development needs you to resolve `Implement a Stack Class`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement a Stack class with push(x), pop(), peek(), is_empty(), and __len__.
  pop/peek on an empty stack should raise IndexError. The stub is empty so the tests fail.


  OBJECTIVE: Back the stack with a list; Implement LIFO push/pop/peek; Raise IndexError on empty pop/peek
  and support len(). Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Back the stack with a list
- Implement LIFO push/pop/peek
- Raise IndexError on empty pop/peek and support len()
initial_state: Implement a Stack class with push(x), pop(), peek(), is_empty(), and __len__. pop/peek
  on an empty stack should raise IndexError. The stub is empty so the tests fail.
solution_explanation: 'A list models a stack: append/pop at the end give LIFO. Guarding the empty case
  raises IndexError, and __len__ exposes the size.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: 'Implement class Stack with: push(x), pop() -> last item, peek() -> last item without
    removing, is_empty() -> bool, and len(stack). pop/peek on empty must raise IndexError.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "class Stack:\n    # TODO: implement push, pop, peek, is_empty, __len__\n    pass\n"
    readonly: false
  visible_tests:
  - name: push and pop
    code: 's = Stack()

      s.push(1)

      s.push(2)

      assert s.pop() == 2 and s.pop() == 1

      '
  - name: starts empty
    code: 's = Stack()

      assert s.is_empty() and len(s) == 0

      '
  hidden_tests:
  - name: peek does not remove
    code: 's = Stack()

      s.push(7)

      assert s.peek() == 7 and len(s) == 1

      '
  - name: len tracks size
    code: "s = Stack()\nfor i in range(3):\n    s.push(i)\nassert len(s) == 3\n"
  - name: pop empty raises
    code: "s = Stack()\ntry:\n    s.pop()\n    assert False, 'expected IndexError'\nexcept IndexError:\n\
      \    pass\n"
  - name: peek empty raises
    code: "s = Stack()\ntry:\n    s.peek()\n    assert False\nexcept IndexError:\n    pass\n"
  - name: LIFO order
    code: "s = Stack()\nfor x in [1,2,3]:\n    s.push(x)\nassert [s.pop(), s.pop(), s.pop()] == [3,2,1]\n"
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.py`, read the instructions, and run the visible tests to see
    which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Raise IndexError on empty pop/peek and support len().

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
