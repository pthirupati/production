description: 'Integration lab: connect data processing with an adjacent platform in
  the Python Development stack. Validate authentication, data handoff, and failure
  behavior for parsing, transforming, and aggregating data.'
objectives:
- data processing is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for data processing.
  Downstream consumers are waiting on this integration path.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the transformation pipeline and sample output.

    2. Write down what looks normal versus wrong or missing for data processing.

    3. Recall the core idea: parsing, transforming, and aggregating data. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for data processing.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the transformation pipeline and sample output.

    2. Configure credentials and networking, then drive one happy-path transaction
    end to end across both systems.

    3. Verify the result — processed data matches the expected result.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-python-030-integration-data-processing-3.conf`,
    then click Check Solution.'
cross_technology: true
