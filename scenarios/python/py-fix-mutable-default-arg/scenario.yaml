title: Fix the Mutable Default Argument Bug
slug: py-fix-mutable-default-arg
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix the Mutable Default
  Argument Bug` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: append_item(item, bucket=[]) uses a mutable default list, so the SAME list
  is shared across calls and items leak between unrelated calls. Fix it using the standard None sentinel
  idiom so each call starts fresh unless a bucket is explicitly passed.


  OBJECTIVE: Show that two separate calls share state; Replace the mutable default with a None sentinel;
  Confirm calls are independent but explicit buckets still work. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
