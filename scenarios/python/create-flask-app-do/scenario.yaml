description: 'CONTEXT: A team operating Python development needs you to resolve `Create Flask Application`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Python environment with pip available. No Flask application exists in the
  working directory yet. Build task: create a minimal Flask web application from scratch. There is no
  app yet. Write a small Flask app that defines a route returning a response, install Flask if needed,
  run the development server, and verify the endpoint responds over HTTP.


  OBJECTIVE: Install Flask and create a minimal app with at least one route; Run the Flask development
  server; Verify the route responds over HTTP. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
