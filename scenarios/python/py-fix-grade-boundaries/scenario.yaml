title: Fix the Grade Boundary Logic
slug: py-fix-grade-boundaries
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix the Grade Boundary
  Logic` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: letter_grade(score) maps a 0-100 score to A/B/C/D/F, but the boundary comparisons
  use `>` instead of `>=`, so exact cutoffs (90, 80, 70, 60) fall into the wrong bucket. Fix the boundaries
  so 90 is an A, 80 a B, and so on.


  OBJECTIVE: Test the exact cutoff scores; Use >= at each threshold; Return the correct letter for every
  score. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Test the exact cutoff scores
- Use >= at each threshold
- Return the correct letter for every score
initial_state: letter_grade(score) maps a 0-100 score to A/B/C/D/F, but the boundary comparisons use `>`
  instead of `>=`, so exact cutoffs (90, 80, 70, 60) fall into the wrong bucket. Fix the boundaries so
  90 is an A, 80 a B, and so on.
solution_explanation: 'Strict `>` excludes the exact cutoff value, bumping boundary scores down a grade.
  Using `>=` makes each threshold inclusive.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Fix letter_grade(score): 90+ -> ''A'', 80+ -> ''B'', 70+ -> ''C'', 60+ -> ''D'', else
    ''F''. Cutoffs are INCLUSIVE.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def letter_grade(score):\n    if score > 90:\n        return 'A'\n    elif score > 80:\n\
      \        return 'B'\n    elif score > 70:\n        return 'C'\n    elif score > 60:\n        return\
      \ 'D'\n    return 'F'\n"
    readonly: false
  visible_tests:
  - name: clear A
    code: 'assert letter_grade(95) == ''A''

      '
  - name: exact 90 is A
    code: 'assert letter_grade(90) == ''A'', letter_grade(90)

      '
  hidden_tests:
  - name: exact 80 is B
    code: 'assert letter_grade(80) == ''B'', letter_grade(80)

      '
  - name: exact 70 is C
    code: 'assert letter_grade(70) == ''C''

      '
  - name: exact 60 is D
    code: 'assert letter_grade(60) == ''D''

      '
  - name: fail
    code: 'assert letter_grade(59) == ''F''

      '
  - name: mid B
    code: 'assert letter_grade(85) == ''B''

      '
  timeout: 8
hints:
