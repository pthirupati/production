title: Fix the Grade Boundary Logic
slug: py-fix-grade-boundaries
category: Python Development
description: letter_grade(score) maps a 0-100 score to A/B/C/D/F, but the boundary comparisons use `>`
  instead of `>=`, so exact cutoffs (90, 80, 70, 60) fall into the wrong bucket. Fix the boundaries so
  90 is an A, 80 a B, and so on.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Test the exact cutoff scores
- Use >= at each threshold
- Return the correct letter for every score
initial_state: letter_grade(score) maps a 0-100 score to A/B/C/D/F, but the boundary comparisons use `>`
  instead of `>=`, so exact cutoffs (90, 80, 70, 60) fall into the wrong bucket. Fix the boundaries so
  90 is an A, 80 a B, and so on.
solution_explanation: |
  Strict `>` excludes the exact cutoff value, bumping boundary scores down a grade. Using `>=` makes each threshold inclusive.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix letter_grade(score): 90+ -> 'A', 80+ -> 'B', 70+ -> 'C', 60+ -> 'D', else 'F'. Cutoffs are INCLUSIVE.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      def letter_grade(score):
          if score > 90:
              return 'A'
          elif score > 80:
              return 'B'
          elif score > 70:
              return 'C'
          elif score > 60:
              return 'D'
          return 'F'
    readonly: false
  visible_tests:
  - name: clear A
    code: |
      assert letter_grade(95) == 'A'
  - name: exact 90 is A
    code: |
      assert letter_grade(90) == 'A', letter_grade(90)
  hidden_tests:
  - name: exact 80 is B
    code: |
      assert letter_grade(80) == 'B', letter_grade(80)
  - name: exact 70 is C
    code: |
      assert letter_grade(70) == 'C'
  - name: exact 60 is D
    code: |
      assert letter_grade(60) == 'D'
  - name: fail
    code: |
      assert letter_grade(59) == 'F'
  - name: mid B
    code: |
      assert letter_grade(85) == 'B'
  timeout: 8
hints:
- order: 1
  cost: 10
  content: letter_grade(90) returns 'B', but 90 should be an 'A'.
- order: 2
  cost: 20
  content: '`score > 90` excludes exactly 90. The cutoffs are inclusive.'
- order: 3
  cost: 30
  content: Use >= at every threshold.
