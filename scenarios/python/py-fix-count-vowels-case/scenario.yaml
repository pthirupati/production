title: Fix Case-Insensitive Vowel Counting
slug: py-fix-count-vowels-case
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix Case-Insensitive
  Vowel Counting` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: count_vowels(s) is supposed to count vowels case-insensitively, but it only
  checks lowercase vowels, so uppercase vowels are missed. Fix it so ''A'' and ''a'' both count.


  OBJECTIVE: Notice uppercase vowels are not counted; Normalize case before checking membership; Count
  a, e, i, o, u regardless of case. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
