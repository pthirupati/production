initial_state: count_vowels(s) is supposed to count vowels case-insensitively, but it only checks lowercase
  vowels, so uppercase vowels are missed. Fix it so 'A' and 'a' both count.
solution_explanation: 'The vowel set only had lowercase letters. Lowercasing the input before checking
  membership makes the count case-insensitive.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix count_vowels(s) to count a, e, i, o, u case-insensitively.\n  count_vowels('Apple')\
    \ -> 2\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def count_vowels(s):\n    vowels = 'aeiou'\n    return sum(1 for ch in s if ch in vowels)\n"
    readonly: false
  visible_tests:
  - name: lowercase word
    code: 'assert count_vowels(''education'') == 5

      '
  - name: capitalized
    code: 'assert count_vowels(''Apple'') == 2, count_vowels(''Apple'')

      '
  hidden_tests:
  - name: all caps
    code: 'assert count_vowels(''AEIOU'') == 5

      '
  - name: mixed case
    code: 'assert count_vowels(''HeLLo WoRLD'') == 3

      '
  - name: no vowels
    code: 'assert count_vowels(''rhythm'') == 0

      '
  timeout: 8
