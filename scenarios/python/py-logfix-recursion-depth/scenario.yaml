initial_state: 'The log shows `RecursionError: maximum recursion depth exceeded` from factorial() because
  its base case is wrong (it never stops at 0), so it recurses forever into negatives. Fix the base case
  so factorial(0) == 1 and recursion terminates.'
solution_explanation: 'Without a base case the recursion descends past 0 forever. Returning 1 for n <=
  1 terminates it with the correct value.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: logfix
  instructions: 'Fix factorial(n) for n >= 0 so recursion terminates: factorial(0) == 1. The log shows
    infinite recursion.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "# Production log:\n#   RecursionError: maximum recursion depth exceeded\n#     factorial(n)\
      \ keeps calling factorial(n - 1) past 0\n\ndef factorial(n):\n    return n * factorial(n - 1)  \
      \ # no base case -> infinite recursion\n"
    readonly: false
  visible_tests:
  - name: factorial 0
    code: 'assert factorial(0) == 1

      '
  - name: factorial 5
    code: 'assert factorial(5) == 120

      '
  hidden_tests:
  - name: factorial 1
    code: 'assert factorial(1) == 1

      '
  - name: factorial 10
    code: 'assert factorial(10) == 3628800

      '
  - name: factorial 3
    code: 'assert factorial(3) == 6

      '
  timeout: 8
