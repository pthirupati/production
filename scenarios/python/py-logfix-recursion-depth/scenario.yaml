title: 'Log Analysis: Fix the RecursionError in factorial'
slug: py-logfix-recursion-depth
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Log Analysis: Fix the
  RecursionError in factorial` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The log shows `RecursionError: maximum recursion depth exceeded` from factorial()
  because its base case is wrong (it never stops at 0), so it recurses forever into negatives. Fix the
  base case so factorial(0) == 1 and recursion terminates.


  OBJECTIVE: Read the RecursionError and find the missing/wrong base case; Stop recursion at n == 0 (or
  n <= 1); Return the correct factorial. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
