description: 'CONTEXT: A team operating Python development needs you to resolve `python: Exception Handling
  — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around exception handling.
  Assume an auditor or pen test is next week — tighten controls with evidence. Security review: harden
  exception handling on this python system. Close unsafe defaults, enforce least privilege, and ensure
  try/except, custom errors, and clean failure cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to exception handling are removed or constrained; Access follows
  least privilege and is auditable; Security checks pass without breaking required functionality. Success
  means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to exception handling are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
