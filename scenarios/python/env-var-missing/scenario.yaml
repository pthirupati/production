title: Missing Environment Variable
slug: sim-python-env-missing
category: Fix
difficulty: easy
description: 'CONTEXT: A team operating Python development needs you to resolve `Missing Environment Variable`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Python application that reads a required environment variable at startup.
  The variable is unset, so the app raises a KeyError (or fails configuration) immediately on launch.
  A Python app crashes on startup with a KeyError/None because a required environment variable (e.g. DATABASE_URL
  or SECRET_KEY) is not set. The code reads `os.environ[''VAR'']` and the variable is absent in the runtime
  environment. Provide the variable so the app starts.


  OBJECTIVE: Identify which environment variable the app requires and where it''s read; Set the variable
  in the runtime environment; Start the app successfully with the variable present. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
