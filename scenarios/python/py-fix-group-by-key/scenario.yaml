title: Fix group_by Aggregation
slug: py-fix-group-by-key
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix group_by Aggregation`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: group_by(items, key) should group items into a dict of {key_value: [items...]},
  but it assigns the latest item instead of appending, so each group keeps only one item. Fix it to accumulate
  all items per key.


  OBJECTIVE: See groups collapse to a single item; Append to a per-key list; Preserve item order within
  each group. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See groups collapse to a single item
- Append to a per-key list
- Preserve item order within each group
initial_state: 'group_by(items, key) should group items into a dict of {key_value: [items...]}, but it
  assigns the latest item instead of appending, so each group keeps only one item. Fix it to accumulate
  all items per key.'
solution_explanation: 'Assigning the item replaces the group each time. setdefault(key, []) ensures a
  list exists, and append accumulates all members in order.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix group_by(items, key): return {key(item): [items with that key], ...} preserving order.\
    \ key is a function.\n  group_by([1,2,3,4], lambda x: x % 2) -> {1: [1,3], 0: [2,4]}\nClick Run to\
    \ try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def group_by(items, key):\n    groups = {}\n    for it in items:\n        groups[key(it)]\
      \ = it      # bug: overwrites the group\n    return groups\n"
    readonly: false
  visible_tests:
  - name: parity grouping
    code: 'g = group_by([1,2,3,4], lambda x: x % 2)

      assert g == {1: [1,3], 0: [2,4]}, g

      '
  - name: single group
    code: 'assert group_by([2,4,6], lambda x: ''even'') == {''even'': [2,4,6]}

      '
  hidden_tests:
  - name: by length
    code: 'g = group_by([''a'',''bb'',''cc'',''d''], len)

      assert g == {1: [''a'',''d''], 2: [''bb'',''cc'']}, g

      '
  - name: empty input
    code: 'assert group_by([], lambda x: x) == {}

      '
  - name: order within group
    code: 'g = group_by([10,20,11,21], lambda x: x % 10)

      assert g[0] == [10,20] and g[1] == [11,21]

      '
  timeout: 8
hints:
