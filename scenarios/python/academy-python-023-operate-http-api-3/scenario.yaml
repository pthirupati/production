tasks:
- id: task_1
  title: Http Apis — Operate Lab
  description: Restore healthy behavior for Http Apis — Operate Lab by investigating the failure, applying
    the smallest safe fix, and validating the outcome.
  background: 'This python lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: service_active
    command: systemctl is-active nginx
    expected_status: active
