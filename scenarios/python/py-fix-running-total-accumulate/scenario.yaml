title: Fix the Running Total (Prefix Sums)
slug: py-fix-running-total-accumulate
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix the Running Total
  (Prefix Sums)` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: running_total(nums) should return a list of cumulative sums (prefix sums),
  but it resets the accumulator each iteration so it just echoes the inputs. Fix it so each element is
  the sum of all elements up to that index.


  OBJECTIVE: See the output equals the input (no accumulation); Keep a persistent running sum; Emit the
  cumulative value at each step. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
