title: Fix the Running Total (Prefix Sums)
slug: py-fix-running-total-accumulate
category: Python Development
description: running_total(nums) should return a list of cumulative sums (prefix sums), but it resets
  the accumulator each iteration so it just echoes the inputs. Fix it so each element is the sum of all
  elements up to that index.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See the output equals the input (no accumulation)
- Keep a persistent running sum
- Emit the cumulative value at each step
initial_state: running_total(nums) should return a list of cumulative sums (prefix sums), but it resets
  the accumulator each iteration so it just echoes the inputs. Fix it so each element is the sum of all
  elements up to that index.
solution_explanation: |
  Re-initializing total inside the loop discards prior sums. Initializing it once before the loop accumulates correctly.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix running_total(nums): return cumulative sums.
      running_total([1,2,3,4]) -> [1,3,6,10]
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      def running_total(nums):
          out = []
          for n in nums:
              total = 0        # bug: reset every iteration
              total += n
              out.append(total)
          return out
    readonly: false
  visible_tests:
  - name: basic
    code: |
      assert running_total([1,2,3,4]) == [1,3,6,10]
  - name: single
    code: |
      assert running_total([5]) == [5]
  hidden_tests:
  - name: with negatives
    code: |
      assert running_total([1,-1,2,-2]) == [1,0,2,0]
  - name: empty
    code: |
      assert running_total([]) == []
  - name: zeros
    code: |
      assert running_total([0,0,0]) == [0,0,0]
  - name: longer
    code: |
      assert running_total([2,2,2,2,2]) == [2,4,6,8,10]
  timeout: 8
hints:
- order: 1
  cost: 10
  content: running_total([1,2,3]) returns [1,2,3] — it isn't accumulating.
- order: 2
  cost: 20
  content: The `total = 0` line is inside the loop, so it resets every step.
- order: 3
  cost: 30
  content: Move the accumulator initialization OUTSIDE the loop.
