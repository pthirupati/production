solution_explanation: 'Re-initializing total inside the loop discards prior sums. Initializing it once
  before the loop accumulates correctly.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix running_total(nums): return cumulative sums.\n  running_total([1,2,3,4]) -> [1,3,6,10]\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def running_total(nums):\n    out = []\n    for n in nums:\n        total = 0        # bug:\
      \ reset every iteration\n        total += n\n        out.append(total)\n    return out\n"
    readonly: false
  visible_tests:
  - name: basic
    code: 'assert running_total([1,2,3,4]) == [1,3,6,10]

      '
  - name: single
    code: 'assert running_total([5]) == [5]

      '
  hidden_tests:
  - name: with negatives
    code: 'assert running_total([1,-1,2,-2]) == [1,0,2,0]

      '
  - name: empty
    code: 'assert running_total([]) == []

      '
  - name: zeros
    code: 'assert running_total([0,0,0]) == [0,0,0]

      '
  - name: longer
    code: 'assert running_total([2,2,2,2,2]) == [2,4,6,8,10]

      '
  timeout: 8
