description: 'CONTEXT: A team operating Python development needs you to resolve `python: File I/O — Build
  From Scratch` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Python project workspace is ready but file I/O is not configured yet.
  Required tools may already be installed; your job is to create the configuration and bring the capability
  online. Build file I/O from scratch in this python lab. You start from a minimal environment and must
  produce a working configuration that demonstrates reading/writing files, paths, and encodings. Plan,
  implement, then prove it works.


  OBJECTIVE: A working file I/O setup must exist by the end of this lab; Configuration should follow team
  conventions and be easy to audit; The result should pass validation without manual cleanup. Success
  means `systemctl is-active crond` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working file I/O setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The Python project workspace is ready but file I/O is not configured yet. Required tools
  may already be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status crond` and `journalctl -u crond -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart crond` and confirm `systemctl is-active crond` succeeds.


    WHY: the grader checks real service state, not marker files.'
