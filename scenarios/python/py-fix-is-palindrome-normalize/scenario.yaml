title: Fix is_palindrome Normalization
slug: py-fix-is-palindrome-normalize
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix is_palindrome Normalization`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: is_palindrome(s) should ignore case, spaces, and punctuation (so ''A man,
  a plan, a canal: Panama'' is a palindrome), but it compares the raw string, so anything with spaces
  or capitals fails. Fix the normalization.


  OBJECTIVE: See that the raw comparison rejects valid palindromes; Strip non-alphanumerics and lowercase
  before comparing; Compare the cleaned string to its reverse. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
