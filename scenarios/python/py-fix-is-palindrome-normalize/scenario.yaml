solution_explanation: 'Comparing the raw string is sensitive to case and punctuation. Filtering to lowercase
  alphanumerics first yields the canonical comparison.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix is_palindrome(s) to ignore case and any non-alphanumeric characters.\n  is_palindrome('A\
    \ man, a plan, a canal: Panama') -> True\nClick Run to try it, then Check Solution to grade against\
    \ all tests.\n"
  files:
  - path: solution.py
    content: "def is_palindrome(s):\n    return s == s[::-1]\n"
    readonly: false
  visible_tests:
  - name: simple palindrome
    code: 'assert is_palindrome(''racecar'') is True

      '
  - name: with punctuation
    code: 'assert is_palindrome(''A man, a plan, a canal: Panama'') is True

      '
  hidden_tests:
  - name: not a palindrome
    code: 'assert is_palindrome(''hello'') is False

      '
  - name: case insensitive
    code: 'assert is_palindrome(''Noon'') is True

      '
  - name: alphanumeric mix
    code: 'assert is_palindrome(''Was it a car or a cat I saw?'') is True

      '
  - name: empty string is palindrome
    code: 'assert is_palindrome('''') is True

      '
  timeout: 8
