title: Memory Leak Profiling
slug: sim-python-memory-leak
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating Python development needs you to resolve `Memory Leak Profiling`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Python service whose RSS grows over time without leveling off. Under sustained
  use it eventually exhausts memory. Heap growth is driven by retained objects, not real workload. A long-running
  Python process steadily grows in memory until it''s killed (OOM) or slows the host. Objects are being
  retained unintentionally — e.g. an ever-growing cache/list or a reference held in a global. Profile
  allocations to find what accumulates, then fix the retention so memory stays flat.


  OBJECTIVE: Confirm RSS grows over time under steady load; Profile allocations to find the object type/site
  that accumulates; Fix the retention so memory usage stabilizes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
