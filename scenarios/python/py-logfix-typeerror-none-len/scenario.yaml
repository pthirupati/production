  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: logfix
  instructions: 'Fix count_items(items) so it returns len(items), but returns 0 when items is None. The
    log shows it crashes on None.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "# Production log:\n#   TypeError: object of type 'NoneType' has no len()\n#     at count_items(items)\
      \ -> return len(items)\n\ndef count_items(items):\n    return len(items)   # crashes when items\
      \ is None\n"
    readonly: false
  visible_tests:
  - name: list length
    code: 'assert count_items([1, 2, 3]) == 3

      '
  - name: none is zero
    code: 'assert count_items(None) == 0

      '
  hidden_tests:
  - name: empty list
    code: 'assert count_items([]) == 0

      '
  - name: string length
    code: 'assert count_items(''abc'') == 3

      '
  - name: dict length
    code: 'assert count_items({''a'': 1}) == 1

      '
  - name: none does not raise
    code: 'assert count_items(None) == 0

      '
  timeout: 8
