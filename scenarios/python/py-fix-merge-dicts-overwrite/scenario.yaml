solution_explanation: 'Copying a into a new dict and updating with b means b overrides on conflicts and
  neither input is mutated.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix merge_dicts(a, b): return a NEW dict with all keys from both, where b's value wins\
    \ on conflicts. Do not mutate a or b.\n  merge_dicts({'x':1,'y':2}, {'y':9}) -> {'x':1, 'y':9}\nClick\
    \ Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def merge_dicts(a, b):\n    a.update(b)        # mutates a\n    a.update(a)        # bug:\
      \ re-applies a over b; and still mutates\n    return a\n"
    readonly: false
  visible_tests:
  - name: b overrides
    code: 'assert merge_dicts({''x'':1,''y'':2}, {''y'':9}) == {''x'':1,''y'':9}

      '
  - name: disjoint keys
    code: 'assert merge_dicts({''a'':1}, {''b'':2}) == {''a'':1,''b'':2}

      '
  hidden_tests:
  - name: does not mutate a
    code: 'a = {''k'': 1}

      merge_dicts(a, {''k'': 2})

      assert a == {''k'': 1}, a

      '
  - name: does not mutate b
    code: 'b = {''k'': 2}

      merge_dicts({''k'': 1}, b)

      assert b == {''k'': 2}

      '
  - name: b wins on multiple conflicts
    code: 'assert merge_dicts({''a'':1,''b'':1}, {''a'':2,''b'':2}) == {''a'':2,''b'':2}

      '
  - name: empty b returns copy of a
    code: 'a = {''a'': 1}

      r = merge_dicts(a, {})

      assert r == {''a'':1} and r is not a

      '
  timeout: 8
