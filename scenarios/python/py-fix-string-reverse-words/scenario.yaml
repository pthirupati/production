title: Fix reverse_words Token Order
slug: py-fix-string-reverse-words
category: Python Development
description: reverse_words(s) should reverse the ORDER of words while keeping each word's characters intact,
  but it reverses the whole string character by character. Fix it so 'hello world' becomes 'world hello'.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See that characters are being reversed, not words
- Split on whitespace, reverse the list of words, re-join
- Preserve single spaces between words
initial_state: reverse_words(s) should reverse the ORDER of words while keeping each word's characters
  intact, but it reverses the whole string character by character. Fix it so 'hello world' becomes 'world
  hello'.
solution_explanation: |
  s[::-1] reverses characters. Splitting into words, reversing that list, and re-joining with spaces reverses word order while keeping each word.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix reverse_words(s) so it reverses the order of space-separated words.
      reverse_words('hello world') -> 'world hello'
    Assume words are separated by single spaces.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      def reverse_words(s):
          return s[::-1]
    readonly: false
  visible_tests:
  - name: two words
    code: |
      assert reverse_words('hello world') == 'world hello'
  - name: single word
    code: |
      assert reverse_words('python') == 'python'
  hidden_tests:
  - name: three words
    code: |
      assert reverse_words('a b c') == 'c b a'
  - name: keeps characters intact
    code: |
      assert reverse_words('abc def') == 'def abc'
  - name: empty string
    code: |
      assert reverse_words('') == ''
  timeout: 8
hints:
- order: 1
  cost: 10
  content: reverse_words('hello world') currently gives 'dlrow olleh' — letters reversed, not words.
- order: 2
  cost: 20
  content: Use s.split(' ') to get a list of words, then reverse the LIST.
- order: 3
  cost: 30
  content: Return ' '.join(s.split(' ')[::-1]).
