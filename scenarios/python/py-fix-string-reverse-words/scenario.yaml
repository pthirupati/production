title: Fix reverse_words Token Order
slug: py-fix-string-reverse-words
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix reverse_words Token
  Order` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: reverse_words(s) should reverse the ORDER of words while keeping each word''s
  characters intact, but it reverses the whole string character by character. Fix it so ''hello world''
  becomes ''world hello''.


  OBJECTIVE: See that characters are being reversed, not words; Split on whitespace, reverse the list
  of words, re-join; Preserve single spaces between words. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See that characters are being reversed, not words
- Split on whitespace, reverse the list of words, re-join
- Preserve single spaces between words
initial_state: reverse_words(s) should reverse the ORDER of words while keeping each word's characters
  intact, but it reverses the whole string character by character. Fix it so 'hello world' becomes 'world
  hello'.
solution_explanation: 's[::-1] reverses characters. Splitting into words, reversing that list, and re-joining
  with spaces reverses word order while keeping each word.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix reverse_words(s) so it reverses the order of space-separated words.\n  reverse_words('hello\
    \ world') -> 'world hello'\nAssume words are separated by single spaces.\nClick Run to try it, then\
    \ Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def reverse_words(s):\n    return s[::-1]\n"
    readonly: false
  visible_tests:
  - name: two words
    code: 'assert reverse_words(''hello world'') == ''world hello''

      '
  - name: single word
    code: 'assert reverse_words(''python'') == ''python''

      '
  hidden_tests:
  - name: three words
    code: 'assert reverse_words(''a b c'') == ''c b a''

      '
  - name: keeps characters intact
    code: 'assert reverse_words(''abc def'') == ''def abc''

      '
  - name: empty string
    code: 'assert reverse_words('''') == ''''

      '
  timeout: 8
hints:
