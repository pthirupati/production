solution_explanation: 'min/max are built-ins; the mean is the sum over the count. Returning them in a
  dict with the required keys satisfies the contract.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: 'Implement stats(nums) -> {''min'': .., ''max'': .., ''mean'': ..} for a non-empty numeric
    list. mean must be a float.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def stats(nums):\n    # TODO: return {'min':..,'max':..,'mean':..}\n    pass\n"
    readonly: false
  visible_tests:
  - name: basic
    code: 'r = stats([1, 2, 3, 4])

      assert r[''min''] == 1 and r[''max''] == 4 and r[''mean''] == 2.5

      '
  - name: single value
    code: 'r = stats([5])

      assert r == {''min'': 5, ''max'': 5, ''mean'': 5.0}

      '
  hidden_tests:
  - name: negatives
    code: 'r = stats([-3, 0, 3])

      assert r[''min''] == -3 and r[''max''] == 3 and r[''mean''] == 0.0

      '
  - name: floats mean
    code: 'r = stats([1, 2])

      assert isinstance(r[''mean''], float) and r[''mean''] == 1.5

      '
  - name: has exactly the keys
    code: 'r = stats([7, 8])

      assert set(r.keys()) == {''min'', ''max'', ''mean''}

      '
  timeout: 8
