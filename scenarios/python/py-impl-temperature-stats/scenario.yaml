title: Implement Temperature Statistics
slug: py-impl-temperature-stats
category: Build
description: 'CONTEXT: A team operating Python development needs you to resolve `Implement Temperature
  Statistics` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement stats(nums) returning a dict {''min'',''max'',''mean''} for a non-empty
  list of numbers. mean is a float. The stub is empty so tests fail. (You decide behavior for empty ->
  the tests only use non-empty lists, but raising ValueError on empty is acceptable.)


  OBJECTIVE: Compute min, max, and mean; Return them in a dict with the exact keys; Keep mean as a float.
  Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
