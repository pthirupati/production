title: 'Refactor: Fix find_first to Return the First Match'
slug: py-review-early-return-find-first
category: Fix
description: 'CONTEXT: A team operating Python development has raised a ticket for `Refactor: Fix find_first
  to Return the First Match`. A customer-facing workflow is degraded and the on-call engineer (you) must
  diagnose and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace. The architecture is a
  single lab-primary node exposing source files, venv, tests, and CLI entrypoints; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: find_first(items, predicate) should return the FIRST item for which predicate
  is true (or None), but it keeps looping and returns the LAST match instead. Refactor it to return early
  on the first match.


  OBJECTIVE: See it returns the last match, not the first; Return as soon as the predicate is satisfied;
  Return None when nothing matches. Acceptance criteria: the change is minimal and reversible, and success
  means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant source files, venv, tests, and CLI entrypoints), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
