title: Fix the Number Parsing Crash
slug: py-fix-parse-int-base-error
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix the Number Parsing
  Crash` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: safe_int(s, default) should parse a string to an int, returning `default`
  when the string is not a valid integer, but it lets ValueError propagate and crash. Wrap the parse so
  invalid input falls back to default.


  OBJECTIVE: Trigger the ValueError on bad input; Catch the conversion error; Return the provided default
  on failure. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
