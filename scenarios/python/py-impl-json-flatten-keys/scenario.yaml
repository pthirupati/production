    code: 'assert flatten_dict({''a'': {''b'': 1, ''c'': {''d'': 2}}, ''e'': 3}) == {''a.b'': 1, ''a.c.d'':
      2, ''e'': 3}

      '
  - name: flat already
    code: 'assert flatten_dict({''x'': 1, ''y'': 2}) == {''x'': 1, ''y'': 2}

