  hidden_tests:
  - name: deep nesting
    code: 'assert flatten_dict({''a'': {''b'': {''c'': {''d'': 9}}}}) == {''a.b.c.d'': 9}

      '
  - name: list is a leaf
    code: 'assert flatten_dict({''a'': {''b'': [1, 2]}}) == {''a.b'': [1, 2]}

      '
  - name: empty dict
    code: 'assert flatten_dict({}) == {}

      '
  - name: mixed leaves and nests
    code: 'assert flatten_dict({''k'': 1, ''n'': {''a'': 2, ''b'': {''c'': 3}}}) == {''k'': 1, ''n.a'':
      2, ''n.b.c'': 3}

      '
