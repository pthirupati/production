title: Implement a BankAccount with Overdraft Protection
slug: py-impl-bank-account-class
category: Build
description: 'CONTEXT: A team operating Python development needs you to resolve `Implement a BankAccount
  with Overdraft Protection` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement a BankAccount class: starts at an opening balance (default 0), supports
  deposit(amount) and withdraw(amount). Negative or zero amounts raise ValueError. A withdrawal exceeding
  the balance raises an exception with the message ''Insufficient funds'' and does NOT change the balance.
  balance is exposed as an attribute. The stub is empty so tests fail.


  OBJECTIVE: Track a balance and update it on deposit/withdraw; Reject non-positive amounts with ValueError;
  Block overdrafts with a clear error and no state change. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Track a balance and update it on deposit/withdraw
- Reject non-positive amounts with ValueError
- Block overdrafts with a clear error and no state change
initial_state: 'Implement a BankAccount class: starts at an opening balance (default 0), supports deposit(amount)
  and withdraw(amount). Negative or zero amounts raise ValueError. A withdrawal exceeding the balance
  raises an exception with the message ''Insufficient funds'' and does NOT change the balance. balance
  is exposed as an attribute. The stub is empty so tests fail.'
solution_explanation: 'Validation runs before any mutation, so a rejected operation leaves the balance
  untouched. The overdraft check raises with the required message.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: 'Implement class BankAccount(opening=0) with .balance, deposit(amount), withdraw(amount).
    amount must be > 0 (else ValueError). Withdrawing more than the balance raises ValueError(''Insufficient
    funds'') and leaves balance unchanged.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "class BankAccount:\n    # TODO: balance, deposit, withdraw with validation + overdraft protection\n\
      \    pass\n"
    readonly: false
  visible_tests:
  - name: deposit then withdraw
    code: 'a = BankAccount()

      a.deposit(100)

      a.withdraw(30)

      assert a.balance == 70

      '
  - name: opening balance
    code: 'a = BankAccount(50)

      assert a.balance == 50

      '
  hidden_tests:
  - name: overdraft blocked and balance unchanged
    code: "a = BankAccount(20)\ntry:\n    a.withdraw(50)\n    assert False, 'should raise'\nexcept ValueError\
      \ as e:\n    assert 'Insufficient funds' in str(e)\nassert a.balance == 20\n"
  - name: negative deposit rejected
    code: "a = BankAccount()\ntry:\n    a.deposit(-5)\n    assert False\nexcept ValueError:\n    pass\n\
      assert a.balance == 0\n"
  - name: zero withdraw rejected
    code: "a = BankAccount(10)\ntry:\n    a.withdraw(0)\n    assert False\nexcept ValueError:\n    pass\n"
  - name: exact balance withdrawal allowed
    code: 'a = BankAccount(40)

      a.withdraw(40)

      assert a.balance == 0

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.py`, read the instructions, and run the visible tests to see
    which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Block overdrafts with a clear error and no state change.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
