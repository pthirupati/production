coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: 'Implement class BankAccount(opening=0) with .balance, deposit(amount), withdraw(amount).
    amount must be > 0 (else ValueError). Withdrawing more than the balance raises ValueError(''Insufficient
    funds'') and leaves balance unchanged.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "class BankAccount:\n    # TODO: balance, deposit, withdraw with validation + overdraft protection\n\
      \    pass\n"
    readonly: false
  visible_tests:
  - name: deposit then withdraw
    code: 'a = BankAccount()

      a.deposit(100)

      a.withdraw(30)

      assert a.balance == 70

      '
  - name: opening balance
    code: 'a = BankAccount(50)

      assert a.balance == 50

      '
  hidden_tests:
  - name: overdraft blocked and balance unchanged
    code: "a = BankAccount(20)\ntry:\n    a.withdraw(50)\n    assert False, 'should raise'\nexcept ValueError\
      \ as e:\n    assert 'Insufficient funds' in str(e)\nassert a.balance == 20\n"
  - name: negative deposit rejected
    code: "a = BankAccount()\ntry:\n    a.deposit(-5)\n    assert False\nexcept ValueError:\n    pass\n\
      assert a.balance == 0\n"
  - name: zero withdraw rejected
    code: "a = BankAccount(10)\ntry:\n    a.withdraw(0)\n    assert False\nexcept ValueError:\n    pass\n"
  - name: exact balance withdrawal allowed
    code: 'a = BankAccount(40)

      a.withdraw(40)

      assert a.balance == 0

      '
  timeout: 8
