category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Missing Python Package`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Python environment where a script imports a third-party package that isn''t
  installed. Running it raises ModuleNotFoundError for that package. A Python script fails with "ModuleNotFoundError:
  No module named X" because a required third-party package is not installed in the active environment.
  Identify the missing dependency, install it (ideally pinned via requirements), and confirm the script
  imports and runs.


  OBJECTIVE: Identify the missing module from the traceback; Install the correct package into the active
  environment; Confirm the script imports and runs successfully. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Identify the missing module from the traceback'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Install the correct package into the active environment

    2. Confirm the script imports and runs successfully'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Confirm the script imports and runs successfully.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
