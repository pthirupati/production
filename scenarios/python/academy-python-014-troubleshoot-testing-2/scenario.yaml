title: Testing — Troubleshoot Lab
slug: academy-python-014-troubleshoot-testing-2
technology: python
category: Fix
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: Complete the testing coding exercise in the browser IDE.

  ENVIRONMENT: FixitLab coding practice IDE — edit solution.py, Run visible tests,
  then Check Solution.

  SYMPTOM / STARTING STATE: Coding challenge: testing. The stub in solution.py is
  incomplete so tests fail until you implement it.

  OBJECTIVE: Implement the required changes so all visible and hidden tests pass.

  VERIFY: Check Solution passes all hidden tests.

  '
objectives:
- Implement the required function in solution.py
- Pass visible tests with Run
- Pass Check Solution (hidden tests)
initial_state: 'Coding challenge: testing. The stub in solution.py is incomplete so
  tests fail until you implement it.'
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: code changes break behavior
    with no safety net. This lab is about testing — unit tests, fixtures, and assertions.
    Read the objectives and the current state, and note precisely what looks wrong
    versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For testing problems the reliable method is:
    (1) reproduce/observe the failure, (2) narrow from the whole system down to the
    one component that owns the symptom, (3) change exactly one thing, (4) re-check.
    Fix the underlying misconfiguration you identified (not just the noisy log line),
    changing one thing at a time.'
- order: 3
  cost: 25
  content: WHICH TOOL — use the IDE Run button on visible tests first; read the failing
    assertion message carefully.
- order: 4
  cost: 40
  content: NARROW DOWN — implement the smallest change that satisfies one failing
    test, then re-run.
- order: 5
  cost: 60
  content: NEAR-SOLUTION — finish the function so all visible tests pass, then Check
    Solution.
summary: Complete the testing — troubleshoot lab python lab and verify success with
  the checker
estimated_minutes: 20
xp_reward: 100
