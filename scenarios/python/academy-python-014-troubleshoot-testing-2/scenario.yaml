tasks:
- id: task_1
  title: Testing — Troubleshoot Lab
  description: Implement the testing exercise in the browser IDE and pass all tests.
  background: 'This python lab teaches systematic troubleshooting: observe, hypothesize,
    change, verify.'
  validation:
    type: script
    script: hidden_tests
