title: 'Python Development: Testing — Troubleshooting Drill'
slug: academy-python-034-troubleshoot-testing-4
technology: Python Development
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: code changes break behavior with no safety net. You
  are on call for Python Development and must troubleshoot testing methodically —
  triage symptoms, isolate root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: code changes break behavior with no safety net'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Python project workspace is degraded. Code changes break behavior
  with no safety net. Recent changes may exist around testing, but do not restart
  blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — test files and `pytest -q` output.

    2. Write down what looks normal versus wrong or missing for testing.

    3. Recall the core idea: unit tests, fixtures, and assertions. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for testing.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — test files and `pytest -q` output.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — tests cover the change and pass.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-python-034-troubleshoot-testing-4.conf`,
    then click Check Solution.'
