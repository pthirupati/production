coding_mode: true
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: 'Implement join_path(base, name) → base/name with exactly one slash
    between.

    Click Run to try it, then Check Solution to grade.

    '
  files:
  - path: solution.py
    content: "def join_path(base, name):\n    # TODO\n    pass\n"
    readonly: false
  visible_tests:
  - name: basic
    code: assert join_path('/data', 'a.txt') == '/data/a.txt'
  hidden_tests:
  - name: slash
    code: assert join_path('/data/', '/a.txt') == '/data/a.txt'
  - name: n
    code: assert join_path('/p4', 'f') == '/p4/f'
  timeout: 8
