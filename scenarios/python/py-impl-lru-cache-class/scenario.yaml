  visible_tests:
  - name: basic get/put
    code: |
      c = LRUCache(2)
      c.put(1, 1)
      c.put(2, 2)
      assert c.get(1) == 1
  - name: miss returns -1
    code: |
      c = LRUCache(2)
      assert c.get(99) == -1
  hidden_tests:
  - name: evicts least recently used
    code: |
      c = LRUCache(2)
      c.put(1, 1)
      c.put(2, 2)
      c.put(3, 3)
      assert c.get(1) == -1 and c.get(2) == 2 and c.get(3) == 3
  - name: get refreshes recency
    code: |
      c = LRUCache(2)
      c.put(1, 1)
      c.put(2, 2)
      c.get(1)
      c.put(3, 3)
      assert c.get(2) == -1 and c.get(1) == 1 and c.get(3) == 3
  - name: update existing keeps it fresh
    code: |
      c = LRUCache(2)
      c.put(1, 1)
      c.put(2, 2)
      c.put(1, 10)
      c.put(3, 3)
      assert c.get(2) == -1 and c.get(1) == 10
  - name: capacity one
    code: |
      c = LRUCache(1)
      c.put(1, 1)
      c.put(2, 2)
      assert c.get(1) == -1 and c.get(2) == 2
