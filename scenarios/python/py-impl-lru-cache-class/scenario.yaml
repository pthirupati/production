max_score: 100
is_free: true
dual_terminal: false
objectives:
- Track recency of access for keys
- Evict the least-recently-used entry on overflow
- Make get/put update recency correctly
initial_state: Implement an LRUCache(capacity) with get(key) and put(key, value). get returns the value
  or -1 if absent and marks the key most-recently-used. put inserts/updates and evicts the least-recently-used
  key when capacity is exceeded. The stub is empty so the tests fail.
solution_explanation: |
  An OrderedDict maintains insertion/use order. Moving a key to the end on access marks it most-recent; popitem(last=False) evicts the LRU entry.
