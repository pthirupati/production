  key when capacity is exceeded. The stub is empty so the tests fail.
solution_explanation: 'An OrderedDict maintains insertion/use order. Moving a key to the end on access
  marks it most-recent; popitem(last=False) evicts the LRU entry.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: 'Implement class LRUCache(capacity) with get(key)->value or -1, and put(key, value). On
    overflow evict the least-recently-used key. Both get and put count as ''use''.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "class LRUCache:\n    def __init__(self, capacity):\n        # TODO\n        pass\n    def\
      \ get(self, key):\n        # TODO\n        pass\n    def put(self, key, value):\n        # TODO\n\
      \        pass\n"
    readonly: false
  visible_tests:
  - name: basic get/put
    code: 'c = LRUCache(2)

      c.put(1, 1)

      c.put(2, 2)

      assert c.get(1) == 1

      '
  - name: miss returns -1
    code: 'c = LRUCache(2)

      assert c.get(99) == -1

      '
  hidden_tests:
  - name: evicts least recently used
    code: 'c = LRUCache(2)

      c.put(1, 1)

      c.put(2, 2)

      c.put(3, 3)

      assert c.get(1) == -1 and c.get(2) == 2 and c.get(3) == 3

      '
  - name: get refreshes recency
    code: 'c = LRUCache(2)

      c.put(1, 1)

      c.put(2, 2)

      c.get(1)

      c.put(3, 3)

      assert c.get(2) == -1 and c.get(1) == 1 and c.get(3) == 3

      '
  - name: update existing keeps it fresh
    code: 'c = LRUCache(2)

      c.put(1, 1)

      c.put(2, 2)

      c.put(1, 10)

      c.put(3, 3)

      assert c.get(2) == -1 and c.get(1) == 10

      '
  - name: capacity one
    code: 'c = LRUCache(1)

      c.put(1, 1)

      c.put(2, 2)

      assert c.get(1) == -1 and c.get(2) == 2

      '
  timeout: 8
