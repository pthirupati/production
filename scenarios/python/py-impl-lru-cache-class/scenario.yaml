title: Implement an LRU Cache
slug: py-impl-lru-cache-class
category: Python Development
description: Implement an LRUCache(capacity) with get(key) and put(key, value). get returns the value
  or -1 if absent and marks the key most-recently-used. put inserts/updates and evicts the least-recently-used
  key when capacity is exceeded. The stub is empty so the tests fail.
difficulty: hard
scenario_type: do
