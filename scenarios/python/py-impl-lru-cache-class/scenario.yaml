title: Implement an LRU Cache
slug: py-impl-lru-cache-class
category: Build
description: 'CONTEXT: A team operating Python development needs you to resolve `Implement an LRU Cache`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement an LRUCache(capacity) with get(key) and put(key, value). get returns
  the value or -1 if absent and marks the key most-recently-used. put inserts/updates and evicts the least-recently-used
  key when capacity is exceeded. The stub is empty so the tests fail.


  OBJECTIVE: Track recency of access for keys; Evict the least-recently-used entry on overflow; Make get/put
  update recency correctly. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
