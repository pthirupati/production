title: Fix the Exponential Recursive Fibonacci
slug: py-fix-recursion-memoize-perf
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Fix the Exponential Recursive
  Fibonacci` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: fib(n) is implemented with naive double recursion, which is exponential and
  times out for moderate n (e.g. n=40). Add memoization (or convert to iteration) so it computes large
  n quickly while staying correct.


  OBJECTIVE: Recognize the exponential branching of naive recursion; Cache subresults or iterate; Compute
  fib(40)+ within the timeout. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
