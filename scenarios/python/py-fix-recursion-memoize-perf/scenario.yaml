objectives:
- Recognize the exponential branching of naive recursion
- Cache subresults or iterate
- Compute fib(40)+ within the timeout
initial_state: fib(n) is implemented with naive double recursion, which is exponential and times out for
  moderate n (e.g. n=40). Add memoization (or convert to iteration) so it computes large n quickly while
  staying correct.
solution_explanation: 'Naive recursion recomputes overlapping subproblems, giving O(2^n). Memoizing with
  lru_cache (or iterating) makes it linear.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Make fib(n) efficient (0-indexed: 0,1,1,2,3,5,...). It must compute fib(40) and beyond
    quickly. You may memoize or rewrite iteratively.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def fib(n):\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)   # exponential,\
      \ times out for large n\n"
    readonly: false
  visible_tests:
  - name: small values
    code: 'assert fib(0) == 0 and fib(1) == 1 and fib(10) == 55

      '
  - name: fib(20)
    code: 'assert fib(20) == 6765

      '
  hidden_tests:
  - name: fib(40) fast
    code: 'assert fib(40) == 102334155

      '
  - name: fib(60)
    code: 'assert fib(60) == 1548008755920

      '
  - name: sequence prefix
    code: 'assert [fib(i) for i in range(8)] == [0,1,1,2,3,5,8,13]

      '
  timeout: 6
