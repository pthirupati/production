solution_explanation: 'Mutating nums in place leaks a side effect to callers. A list comprehension returns
  a new list and leaves the argument untouched.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: review
  instructions: "Refactor double_all(nums) so it returns a new list of doubled values and does NOT modify\
    \ the input list.\n  double_all([1,2,3]) -> [2,4,6]; the original stays [1,2,3]\nClick Run to try\
    \ it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "def double_all(nums):\n    for i in range(len(nums)):\n        nums[i] *= 2      # mutates\
      \ the caller's list\n    return nums\n"
    readonly: false
  visible_tests:
  - name: doubles values
    code: 'assert double_all([1, 2, 3]) == [2, 4, 6]

      '
  - name: empty
    code: 'assert double_all([]) == []

      '
  hidden_tests:
  - name: does not mutate input
    code: 'src = [1, 2, 3]

      double_all(src)

      assert src == [1, 2, 3], src

      '
  - name: returns a new object
    code: 'src = [4, 5]

      out = double_all(src)

      assert out is not src

      '
  - name: negatives and zero
    code: 'assert double_all([-2, 0, 3]) == [-4, 0, 6]

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: refactor is not behaving as the scenario objectives
    require. This lab is about refactor — how refactor behaves in a Python development environment. Read
    the objectives and the current state, and note precisely what looks wrong versus healthy before you
    form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For refactor problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `solution.py`, read the instructions, and run the visible tests to see which assertion fails
    first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of refactor is at fault.

    2. Re-run the most relevant of source files, venv, tests, and CLI entrypoints focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''refactor is not
    behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `solution.py` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.

    WHY: coding labs grade against hidden test cases, not marker files.'
