title: 'Refactor: Make double_all Pure (No Mutation)'
slug: py-review-pure-no-mutate
category: Fix
description: 'CONTEXT: A team operating Python development needs you to resolve `Refactor: Make double_all
  Pure (No Mutation)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Python project workspace with source files, venv,
  tests, and CLI entrypoints. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: double_all(nums) returns a list with every value doubled, but it mutates the
  caller''s list in place — a side effect that breaks callers who reuse the original. Refactor it to be
  pure: return a NEW list and leave the input unchanged. The hidden test pins the no-mutation contract.


  OBJECTIVE: Recognize the in-place mutation side effect; Build and return a new list; Leave the caller''s
  list unchanged. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
