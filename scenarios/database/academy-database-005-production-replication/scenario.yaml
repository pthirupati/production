title: 'Database Administration: Database Replication — Production Readiness'
slug: academy-database-005-production-replication
technology: Database Administration
category: Production
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Service operations lab. The `mysqld` systemd unit is **failed/inactive** on this host — a
  realistic fault for Production Readiness workflows that depend on it. Diagnose with `systemctl status
  mysqld` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active mysqld`.
objectives:
- The `mysqld` service is active (running)
- '`systemctl is-active mysqld` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `mysqld` service is not running (`systemctl is-active mysqld` → inactive/failed). Dependent
  Production Readiness tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — replication status views, `SHOW REPLICA STATUS`, or `pg_stat_replication`.

    2. Write down what looks normal versus wrong or missing for database replication.

    3. Recall the core idea: primary/replica topology, lag, failover, and consistency. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for database replication.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — replication status views, `SHOW REPLICA STATUS`, or `pg_stat_replication`.

    2. Apply production standards for database replication: resource limits, monitoring, access controls,
    and a written rollback step.

    3. Verify the result — replication is streaming, lag is within SLO, and read routing works.

    4. Click Check Solution once `systemctl is-active mysqld` returns active.'
