description: 'CONTEXT: A team operating database administration needs you to resolve `database: Database
  Replication — Production Readiness` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but database replication is not production ready
  — missing guardrails, runbooks, or capacity checks. Production readiness for database replication. Harden,
  document, and validate primary/replica topology, lag, failover, and consistency so the change is safe
  to run during a maintenance window.


  OBJECTIVE: Day-2 database replication work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  mysqld` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 database replication work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but database replication is not production ready — missing
  guardrails, runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — replication status views, `SHOW REPLICA STATUS`, or `pg_stat_replication`.

    2. Write down what looks normal versus wrong or missing for database replication.

    3. Recall the core idea: primary/replica topology, lag, failover, and consistency. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status mysqld` — note Active/Failed and the last log lines.

    2. Read `journalctl -u mysqld -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — replication status views, `SHOW REPLICA STATUS`, or `pg_stat_replication`.

    2. Apply production standards for database replication: resource limits, monitoring, access controls,
    and a written rollback step.

    3. Verify the result — replication is streaming, lag is within SLO, and read routing works.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
