description: 'CONTEXT: A team operating database administration needs you to resolve `Create PostgreSQL
  Database` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: RHEL host with PostgreSQL running and only default roles present. No appdb
  database or appuser role exists yet. Build task: provision a PostgreSQL application database and a dedicated
  user with the right privileges. Starting from a running PostgreSQL with only the default roles, create
  the database appdb and a login role appuser, grant appuser ownership/privileges on appdb, and verify
  appuser can connect and use it.


  OBJECTIVE: Create a login role appuser with a password; Create database appdb owned by (or granted to)
  appuser; Verify appuser can connect to appdb and the grants are correct. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Create a login role appuser with a password
- Create database appdb owned by (or granted to) appuser
- Verify appuser can connect to appdb and the grants are correct
initial_state: RHEL host with PostgreSQL running and only default roles present. No appdb database or
  appuser role exists yet.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status postgresql` and `pg_isready` for connection state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check service status and `/var/log/postgresql/` logs.

    2. Verify `pg_hba.conf` and `postgresql.conf` for listen addresses.

    3. Test with `psql -U postgres -c ''SELECT 1''`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix auth rules, data directory permissions, or port conflict.

    2. `systemctl restart postgresql`.

    3. Confirm `pg_isready` reports accepting connections.


    WHY: the database must accept connections, not just start.'
