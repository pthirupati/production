description: Backup and recovery drill for locks and contention. Ensure backups run
  on schedule, retention is correct, and you can restore row/table locks, deadlocks,
  and waits within the lab RTO.
objectives:
- Backup coverage for locks and contention is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for locks and contention.
  Leadership wants proof that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — lock/wait views and slow transactions.

    2. Write down what looks normal versus wrong or missing for locks and contention.

    3. Recall the core idea: row/table locks, deadlocks, and waits. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for locks and contention.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — lock/wait views and slow transactions.

    2. Repair or run the backup job, then perform a controlled restore into a scratch
    location to prove it works.

    3. Verify the result — contention is resolved and transactions complete.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-database-039-backup-locks-4.conf`,
    then click Check Solution.'
