title: PostgreSQL Down — WAL Archive Filled the Disk
slug: db-postgres-disk-full-archive
difficulty: hard
category: Database Administration
description: 'PostgreSQL has stopped because the data partition is 100% full. A failing archive_command

  meant WAL segments piled up in pg_wal and the archive_status directory until the disk

  filled, and the server shut down to protect data integrity. You must reclaim space by

  clearing the backed-up WAL archive, then restart PostgreSQL.

  '
initial_state: 'Simulated RHEL 9 database server. The postgresql service is down. df shows the data

  filesystem at 100%. Stale WAL archive files have accumulated under

  /var/lib/pgsql/data/pg_wal/archive_status and an old dump in

  /var/lib/pgsql/archive is consuming the space. psql cannot connect.

  '
objectives:
- Identify the data partition is full and PostgreSQL stopped because of it
- Reclaim space by clearing the stale archived WAL files (e.g. rm the archive backlog)
- Restart PostgreSQL once there is free space
- Verify the service is active and accepting connections
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Confirm the disk is the cause: `df -h` shows the data filesystem at 100%. PostgreSQL halts
    when it can''t write WAL. Look under the archive dir (e.g. /var/lib/pgsql/archive) for a backlog of
    already-archived segments.'
- order: 2
  cost: 20
  content: Reclaim space by deleting the ALREADY-ARCHIVED backlog only — e.g. `rm -f /var/lib/pgsql/archive/*`.
    Do NOT touch live segments in pg_wal/ directly, and never delete from pg_wal by hand.
- order: 3
  cost: 30
  content: 'Once `df -h` shows free space, start the service: `systemctl start postgresql` and confirm
    with `systemctl is-active postgresql` plus `psql -c ''SELECT 1;''`. Then fix the failing archive_command
    so WAL is archived going forward.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Critical
