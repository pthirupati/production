title: PostgreSQL Down — WAL Archive Filled the Disk
slug: db-postgres-disk-full-archive
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating database administration needs you to resolve `PostgreSQL Down
  — WAL Archive Filled the Disk` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 database server. The postgresql service is down. df shows
  the data

  filesystem at 100%. Stale WAL archive files have accumulated under

  /var/lib/pgsql/data/pg_wal/archive_status and an old dump in

  /var/lib/pgsql/archive is consuming the space. psql cannot connect. PostgreSQL has stopped because the
  data partition is 100% full. A failing archive_command

  meant WAL segments piled up in pg_wal and the archive_status directory until the disk

  filled, and the server shut down to protect data integrity. You must reclaim space by

  clearing the backed-up WAL archive, then restart PostgreSQL.


  OBJECTIVE: Identify the data partition is full and PostgreSQL stopped because of it; Reclaim space by
  clearing the stale archived WAL files (e.g. rm the archive backlog); Restart PostgreSQL once there is
  free space. Success means `systemctl is-active postgresql` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 database server. The postgresql service is down. df shows the data

  filesystem at 100%. Stale WAL archive files have accumulated under

  /var/lib/pgsql/data/pg_wal/archive_status and an old dump in

  /var/lib/pgsql/archive is consuming the space. psql cannot connect.

  '
objectives:
- Identify the data partition is full and PostgreSQL stopped because of it
- Reclaim space by clearing the stale archived WAL files (e.g. rm the archive backlog)
- Restart PostgreSQL once there is free space
- Verify the service is active and accepting connections
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status postgresql` and `journalctl -u postgresql -n 50
    --no-pager` before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status postgresql` — note Active/Failed and the last log lines.

    2. Read `journalctl -u postgresql -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart postgresql` and confirm `systemctl is-active postgresql` succeeds.


    WHY: the grader checks real service state, not marker files.'
