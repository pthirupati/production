dual_terminal: false
description: 'CONTEXT: A team operating database administration needs you to resolve `MySQL Replica Replication
  Stopped` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A MySQL replica whose replication threads stopped on an error. MySQL replica
  replication stopped after an error and the replica is falling behind.


  OBJECTIVE: Confirm mysqld is down (SHOW REPLICA STATUS shows IO/SQL not running); Resolve the cause
  and start mysqld; Verify mysqld is active. Success means `systemctl is-active mysqld` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A MySQL replica whose replication threads stopped on an error.
objectives:
- Confirm mysqld is down (SHOW REPLICA STATUS shows IO/SQL not running)
- Resolve the cause and start mysqld
- Verify mysqld is active
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status mysqld` and `journalctl -u mysqld -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status mysqld` — note Active/Failed and the last log lines.

    2. Read `journalctl -u mysqld -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart mysqld` and confirm `systemctl is-active mysqld` succeeds.


    WHY: the grader checks real service state, not marker files.'
