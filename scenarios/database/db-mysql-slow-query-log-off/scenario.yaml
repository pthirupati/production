description: 'CONTEXT: A team operating database administration needs you to resolve `MySQL Slow Query
  Log Disabled` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A MySQL host with the slow query log turned off. Nobody can diagnose slow
  queries because the slow query log is disabled.


  OBJECTIVE: Confirm the issue: No slow_query.log entries; Apply the documented fix in /etc/my.cnf; Verify
  the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A MySQL host with the slow query log turned off.
objectives:
- 'Confirm the issue: No slow_query.log entries'
- Apply the documented fix in /etc/my.cnf
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
