tasks:
- id: task_1
  title: State Restore — Build Lab
  description: Restore healthy behavior for State Restore — Build Lab by investigating the failure, applying
    the smallest safe fix, and validating the outcome.
  background: 'This database lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
