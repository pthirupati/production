title: 'Database Administration: Locks And Contention — Backup and Recovery'
slug: academy-database-049-backup-locks-5
technology: Database Administration
category: Backup & Recovery
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
