description: 'CONTEXT: A team operating database administration needs you to resolve `database: Locks
  And Contention — Backup and Recovery` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for locks and contention. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for locks
  and contention. Ensure backups run on schedule, retention is correct, and you can restore row/table
  locks, deadlocks, and waits within the lab RTO.


  OBJECTIVE: Backup coverage for locks and contention is complete and restorable; Retention and encryption
  meet the stated policy; A restore drill proves data integrity. Success means `systemctl is-active postgresql`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for locks and contention is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for locks and contention. Leadership wants
  proof that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status postgresql` and `journalctl -u postgresql -n 50
    --no-pager` before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status postgresql` — note Active/Failed and the last log lines.

    2. Read `journalctl -u postgresql -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart postgresql` and confirm `systemctl is-active postgresql` succeeds.


    WHY: the grader checks real service state, not marker files.'
