description: 'CONTEXT: A team operating database administration has raised a ticket for `MySQL Temp Tables
  Spilling to Disk`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server. The architecture is a single lab-primary
  node exposing SQL client, schemas, backups, and performance views; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A MySQL host with tiny temp-table limits.


  OBJECTIVE: Confirm the issue: Created_tmp_disk_tables rising; Apply the documented fix in /etc/my.cnf;
  Verify the configuration is corrected. Acceptance criteria: the change is minimal and reversible, and
  success means `systemctl is-active mysqld` returns active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SQL client, schemas, backups, and performance views), changing one thing at a time.
  Check your work continuously against the objective — success means `systemctl is-active mysqld` returns
  active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active mysqld` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A MySQL host with tiny temp-table limits.
objectives:
- 'Confirm the issue: Created_tmp_disk_tables rising'
- Apply the documented fix in /etc/my.cnf
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: MySQL temp tables spilling to disk is not behaving
    as the scenario objectives require. This lab is about MySQL temp tables spilling to disk — how MySQL
    temp tables spilling to disk behaves in a database administration environment. Read the objectives
    and the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For MySQL temp tables spilling to disk problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
