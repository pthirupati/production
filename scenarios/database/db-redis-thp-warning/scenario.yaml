description: 'CONTEXT: A team operating database administration needs you to resolve `Redis Latency From
  Transparent Huge Pages` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Redis host with THP enabled, causing latency. Redis logs warn about latency
  from transparent huge pages.


  OBJECTIVE: Confirm the issue: Redis warns about THP; Apply the documented fix in /etc/redis/redis-tuning.conf;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
