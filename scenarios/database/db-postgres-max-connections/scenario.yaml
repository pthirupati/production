title: PostgreSQL Refusing New Connections (max_connections)
slug: db-postgres-max-connections
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating database administration has raised a ticket for `PostgreSQL Refusing
  New Connections (max_connections)`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline database server. The architecture is a single lab-primary
  node exposing SQL client, schemas, backups, and performance views; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: RHEL 9 database server. The postgresql service is down (it crashed under the

  connection storm). /var/lib/pgsql/data/postgresql.conf has max_connections = 20. psql

  reports the server is not accepting connections.

  OBJECTIVE: Inspect /var/lib/pgsql/data/postgresql.conf and find max_connections set too low; Raise max_connections
  to a production-appropriate value (e.g. 200); Restart PostgreSQL so the new setting takes effect. Acceptance
  criteria: the change is minimal and reversible, and success means `systemctl is-active postgresql```
  returns active.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SQL client, schemas, backups, and performance views), changing one thing at a time.
  Check your work continuously against the objective — success means `systemctl is-active postgresql```
  returns active.

  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active postgresql`` returns
  active. Capture the before/after output as evidence. Success criteria: the objective''s healthy state
  holds on a repeat check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'RHEL 9 database server. The postgresql service is down (it crashed under the

