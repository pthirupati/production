title: PostgreSQL Refusing New Connections (max_connections)
slug: db-postgres-max-connections
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating database administration needs you to resolve `PostgreSQL Refusing
  New Connections (max_connections)` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 database server. The postgresql service is down (it crashed
  under the

  connection storm). /var/lib/pgsql/data/postgresql.conf has max_connections = 20. psql

  reports the server is not accepting connections. A production PostgreSQL instance is rejecting new client
  connections with

  "FATAL: sorry, too many clients already". The configured max_connections is far too

  low for the current workload after an application scale-up, and the service is now

  effectively down for new sessions. You must raise max_connections in postgresql.conf

  and restart PostgreSQL so the new limit takes effect.


  OBJECTIVE: Inspect /var/lib/pgsql/data/postgresql.conf and find max_connections set too low; Raise max_connections
  to a production-appropriate value (e.g. 200); Restart PostgreSQL so the new setting takes effect. Success
  means `systemctl is-active postgresql` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 database server. The postgresql service is down (it crashed under the

  connection storm). /var/lib/pgsql/data/postgresql.conf has max_connections = 20. psql

  reports the server is not accepting connections.

  '
objectives:
- Inspect /var/lib/pgsql/data/postgresql.conf and find max_connections set too low
- Raise max_connections to a production-appropriate value (e.g. 200)
- Restart PostgreSQL so the new setting takes effect
- Verify the service is active and accepting connections
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status postgresql` and `journalctl -u postgresql -n 50
    --no-pager` before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status postgresql` — note Active/Failed and the last log lines.

    2. Read `journalctl -u postgresql -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart postgresql` and confirm `systemctl is-active postgresql` succeeds.


    WHY: the grader checks real service state, not marker files.'
