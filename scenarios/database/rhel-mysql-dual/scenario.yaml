description: 'CONTEXT: A team operating database administration needs you to resolve `RHEL Simulation:
  MySQL Down (Dual Terminal)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Dual-terminal lab. primary (10.0.0.10): mysqld is inactive. ssh_client: used
  to run `mysqladmin ping -h 10.0.0.10` against the server. Remote connections currently fail. MySQL is
  stopped on the database server (10.0.0.10), so remote clients can''t reach it. Using the dual-terminal
  setup, confirm from the SSH client pane that `mysqladmin ping` fails, then start mysqld from the server
  console and verify the remote ping now succeeds — restoring database connectivity for clients.


  OBJECTIVE: From the SSH client, confirm mysqladmin ping fails while mysqld is down; Start mysqld on
  the server console; Verify the remote mysqladmin ping from the client now succeeds. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- From the SSH client, confirm mysqladmin ping fails while mysqld is down
- Start mysqld on the server console
- Verify the remote mysqladmin ping from the client now succeeds
initial_state: 'Dual-terminal lab. primary (10.0.0.10): mysqld is inactive. ssh_client: used to run `mysqladmin
  ping -h 10.0.0.10` against the server. Remote connections currently fail.'
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
