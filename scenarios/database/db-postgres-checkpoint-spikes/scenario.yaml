description: 'CONTEXT: A team operating database administration has raised a ticket for `PostgreSQL Checkpoint
  I/O Spikes`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server. The architecture is a single lab-primary
  node exposing SQL client, schemas, backups, and performance views; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A PostgreSQL host with poor checkpoint tuning.


  OBJECTIVE: Confirm the issue: Latency spikes at checkpoints; Apply the documented fix in /var/lib/pgsql/data/postgresql.conf;
  Verify the configuration is corrected. Acceptance criteria: the change is minimal and reversible, and
  success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SQL client, schemas, backups, and performance views), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A PostgreSQL host with poor checkpoint tuning.
objectives:
- 'Confirm the issue: Latency spikes at checkpoints'
- Apply the documented fix in /var/lib/pgsql/data/postgresql.conf
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: PostgreSQL checkpoint I/O spikes is not behaving
    as the scenario objectives require. This lab is about PostgreSQL checkpoint I/O spikes — how PostgreSQL
    checkpoint I/O spikes behaves in a database administration environment. Read the objectives and the
    current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For PostgreSQL checkpoint I/O spikes problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `systemctl status postgresql` and `pg_isready` for connection state.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Check service status and `/var/log/postgresql/` logs.

    2. Verify `pg_hba.conf` and `postgresql.conf` for listen addresses.

    3. Test with `psql -U postgres -c ''SELECT 1''`.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix auth rules, data directory permissions, or port conflict.

    2. `systemctl restart postgresql`.

    3. Confirm `pg_isready` reports accepting connections.


    WHY: the database must accept connections, not just start.'
