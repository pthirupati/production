title: 'Database Administration: State Restore — Build From Scratch'
slug: academy-database-012-build-restore-2
technology: Database Administration
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Build state restore from scratch in this Database Administration lab.
  You start from a minimal environment and must produce a working configuration that
  demonstrates reset and restore lab state. Plan, implement, then prove it works.
objectives:
- A working state restore setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The database server is ready but state restore is not configured yet.
  Required tools may already be installed; your job is to create the configuration
  and bring the capability online.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — reset/restore behavior.

    2. Write down what looks normal versus wrong or missing for state restore.

    3. Recall the core idea: reset and restore lab state. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for state restore.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — reset/restore behavior.

    2. Create the smallest working slice of state restore first, validate it, then
    add the remaining pieces one at a time.

    3. Verify the result — restore returns a clean starting state.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-database-012-build-restore-2.conf`,
    then click Check Solution.'
