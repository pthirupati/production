title: 'Database Administration: Backup Workflows — Fundamentals Lab'
slug: academy-database-081-learn-backup-9
technology: Database Administration
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly Database Administration lab introduces backup
  workflows. You will explore full/incremental backups, retention, encryption, and
  restore drills on the database server. Read the environment first, then follow the
  guided steps — no prior production experience required.
objectives:
- Understand how backup workflows work in this lab environment
- Identify the main status and configuration signals for backup workflows
- Confirm you can read the current state confidently before changing anything
initial_state: The database server is online with a starter backup workflows setup.
  Some pieces are intentionally incomplete so you can learn how they fit together.
  Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — backup job logs, catalog/metadata, and latest restore
    test results.

    2. Write down what looks normal versus wrong or missing for backup workflows.

    3. Recall the core idea: full/incremental backups, retention, encryption, and
    restore drills. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for backup workflows.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — backup job logs, catalog/metadata, and latest
    restore test results.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — a restore completes within policy and data checksums match.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-database-081-learn-backup-9.conf`,
    then click Check Solution.'
