title: 'Database Administration: Grants And Privileges — Troubleshooting Drill'
slug: academy-database-044-troubleshoot-grants-5
technology: Database Administration
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: an app has wrong DB privileges. You are on call for
  Database Administration and must troubleshoot grants and privileges methodically
  — triage symptoms, isolate root cause, apply the smallest safe fix, and confirm
  recovery.'
objectives:
- 'The incident symptom is clear: an app has wrong DB privileges'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The database server is degraded. An app has wrong db privileges. Recent
  changes may exist around grants and privileges, but do not restart blindly — gather
  evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — grant tables / role memberships.

    2. Write down what looks normal versus wrong or missing for grants and privileges.

    3. Recall the core idea: users, roles, and least privilege. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for grants and privileges.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — grant tables / role memberships.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — privileges match least-privilege need.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-database-044-troubleshoot-grants-5.conf`,
    then click Check Solution.'
