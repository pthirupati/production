title: 'Database Administration: Backup Workflows — Fundamentals Lab'
slug: academy-database-091-learn-backup-10
technology: Database Administration
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly Database Administration lab introduces backup
  workflows. You will explore full/incremental backups, retention, encryption, and
  restore drills on the database server. Read the environment first, then complete
  the guided steps — no prior production experience required.
objectives:
- Understand how backup workflows work in this lab environment
- Identify the main status and configuration signals for backup workflows
- Confirm you can read the current state confidently before changing anything
initial_state: The database server is online with a starter backup workflows setup.
  Some pieces are intentionally incomplete so you can learn how the pieces fit together.
  Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: backup job logs, catalog/metadata, and latest restore
    test results. Write down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — full/incremental backups, retention, encryption, and restore
    drills. Make one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-database-091-learn-backup-10.conf`, then click
    Check Solution.
