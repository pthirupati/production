title: 'DB ↔ Network: MySQL Replica Can''t Reach the Primary'
slug: db-mysql-replication-network-firewall
technology: database
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating database administration needs you to resolve `DB ↔ Network: MySQL
  Replica Can''t Reach the Primary` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A db-replica-02 host. /etc/my.cnf.d/replication.cnf has a clashing server-id
  and a

  stale primary host/port, and the route/filter to the primary''s 3306 is wrong, so

  `SHOW REPLICA STATUS` reports it cannot connect. CROSS-TECHNOLOGY task (Database <-> Networking). Replication
  from the MySQL

  primary to db-replica-02 is broken. Two layers are wrong at once: the replica''s

  /etc/my.cnf.d/replication.cnf has a duplicate server-id and points

  master_host at a stale primary address, and the replica''s path to the primary''s

  3306 was never opened after a network change. Reconcile the database replication

  config with the corrected network path so the replica can connect and catch up.


  OBJECTIVE: Confirm replication is down (cannot connect to the primary on 3306; server-id clash); Reconcile
  /etc/my.cnf.d/replication.cnf (unique server-id, correct primary host/port) and the network path to
  3306; Confirm the replication config is corrected so the replica can connect and sync. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A db-replica-02 host. /etc/my.cnf.d/replication.cnf has a clashing server-id and a

