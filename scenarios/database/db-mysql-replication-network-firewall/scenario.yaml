title: 'DB ↔ Network: MySQL Replica Can''t Reach the Primary'
slug: db-mysql-replication-network-firewall
technology: database
category: Fix
difficulty: hard
description: 'CONTEXT: A team operating database administration has raised a ticket for `DB ↔ Network:
  MySQL Replica Can''t Reach the Primary`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server. The architecture is a single lab-primary
  node exposing SQL client, schemas, backups, and performance views; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A db-replica-02 host. /etc/my.cnf.d/replication.cnf has a clashing server-id
  and a

  stale primary host/port, and the route/filter to the primary''s 3306 is wrong, so

  `SHOW REPLICA STATUS` reports it cannot connect.


  OBJECTIVE: Confirm replication is down (cannot connect to the primary on 3306; server-id clash); Reconcile
  /etc/my.cnf.d/replication.cnf (unique server-id, correct primary host/port) and the network path to
  3306; Confirm the replication config is corrected so the replica can connect and sync. Acceptance criteria:
  the change is minimal and reversible, and success means `systemctl is-active mysqld``` returns active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SQL client, schemas, backups, and performance views), changing one thing at a time.
  Check your work continuously against the objective — success means `systemctl is-active mysqld``` returns
  active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active mysqld`` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
