hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: DB ↔ network is not behaving as the scenario
    objectives require. This lab is about DB ↔ network — how DB ↔ network behaves in a database administration
    environment. Read the objectives and the current state, and note precisely what looks wrong versus
    healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For DB ↔ network problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status mysqld` and `journalctl -u mysqld -n 50 --no-pager` before changing anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status mysqld` — note Active/Failed and the last log lines.

    2. Read `journalctl -u mysqld -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart mysqld` and confirm `systemctl is-active mysqld` succeeds.


    WHY: the grader checks real service state, not marker files.'
