title: MySQL MyISAM Table Marked as Crashed
slug: db-mysql-table-crashed
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating database administration has raised a ticket for `MySQL MyISAM
  Table Marked as Crashed`. A customer-facing workflow is degraded and the on-call engineer (you) must
  diagnose and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline database server. The architecture is a single lab-primary
  node exposing SQL client, schemas, backups, and performance views; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: RHEL 9 database server. mysqld has failed. The error log shows the orders

  MyISAM table is marked as crashed following a power loss. A repair flag file exists at

  /var/lib/mysql/appdb/orders.CRASHED.

  OBJECTIVE: Diagnose the crashed MyISAM table from the error log; Repair the table (myisamchk -r or REPAIR
  TABLE / mysqlcheck --repair); Restart the mysqld service. Acceptance criteria: the change is minimal
  and reversible, and success means `systemctl is-active mysqld``` returns active.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SQL client, schemas, backups, and performance views), changing one thing at a time.
  Check your work continuously against the objective — success means `systemctl is-active mysqld``` returns
  active.

  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active mysqld`` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'RHEL 9 database server. mysqld has failed. The error log shows the orders

  MyISAM table is marked as crashed following a power loss. A repair flag file exists at

  /var/lib/mysql/appdb/orders.CRASHED.

  '
objectives:
- Diagnose the crashed MyISAM table from the error log
- Repair the table (myisamchk -r or REPAIR TABLE / mysqlcheck --repair)
- Restart the mysqld service
- Verify mysqld is active and the table is readable
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: MySQL MyISAM table marked as crashed is not
    behaving as the scenario objectives require. This lab is about MySQL MyISAM table marked as crashed
    — how MySQL MyISAM table marked as crashed behaves in a database administration environment. Read
    the objectives and the current state, and note precisely what looks wrong versus healthy before you
    form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For MySQL MyISAM table marked as crashed problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status mysqld` and `journalctl -u mysqld -n 50 --no-pager` before changing anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status mysqld` — note Active/Failed and the last log lines.

    2. Read `journalctl -u mysqld -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart mysqld` and confirm `systemctl is-active mysqld` succeeds.

    WHY: the grader checks real service state, not marker files.'
