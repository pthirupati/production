title: MySQL MyISAM Table Marked as Crashed
slug: db-mysql-table-crashed
difficulty: medium
category: Database Administration
description: |
  After an unclean shutdown, a heavily-used MyISAM table reports "Table './appdb/orders'
  is marked as crashed and should be repaired" and the mysqld service has failed. The
  application cannot read or write orders. You must repair the crashed table and bring
  mysqld back up.

initial_state: |
  Simulated RHEL 9 database server. mysqld has failed. The error log shows the orders
  MyISAM table is marked as crashed following a power loss. A repair flag file exists at
  /var/lib/mysql/appdb/orders.CRASHED.

objectives:
  - Diagnose the crashed MyISAM table from the error log
  - Repair the table (myisamchk -r or REPAIR TABLE / mysqlcheck --repair)
  - Restart the mysqld service
  - Verify mysqld is active and the table is readable
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
hints:
  - content: 'The error log points at a crashed MyISAM table (orders). MyISAM tables can be repaired in place rather than restored from backup.'
    cost: 10
    order: 1
  - content: 'Repair it, e.g. myisamchk -r /var/lib/mysql/appdb/orders or mysqlcheck --repair appdb orders, which clears the crashed marker.'
    cost: 20
    order: 2
  - content: 'Bring the service back with systemctl restart mysqld and confirm with systemctl is-active mysqld.'
    cost: 15
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: High
