title: MySQL MyISAM Table Marked as Crashed
slug: db-mysql-table-crashed
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating database administration needs you to resolve `MySQL MyISAM Table
  Marked as Crashed` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 database server. mysqld has failed. The error log shows the
  orders

  MyISAM table is marked as crashed following a power loss. A repair flag file exists at

  /var/lib/mysql/appdb/orders.CRASHED. After an unclean shutdown, a heavily-used MyISAM table reports
  "Table ''./appdb/orders''

  is marked as crashed and should be repaired" and the mysqld service has failed. The

  application cannot read or write orders. You must repair the crashed table and bring

  mysqld back up.


  OBJECTIVE: Diagnose the crashed MyISAM table from the error log; Repair the table (myisamchk -r or REPAIR
  TABLE / mysqlcheck --repair); Restart the mysqld service. Success means `systemctl is-active mysqld`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 database server. mysqld has failed. The error log shows the orders

  MyISAM table is marked as crashed following a power loss. A repair flag file exists at

  /var/lib/mysql/appdb/orders.CRASHED.

  '
objectives:
- Diagnose the crashed MyISAM table from the error log
- Repair the table (myisamchk -r or REPAIR TABLE / mysqlcheck --repair)
- Restart the mysqld service
- Verify mysqld is active and the table is readable
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status mysqld` and `journalctl -u mysqld -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status mysqld` — note Active/Failed and the last log lines.

    2. Read `journalctl -u mysqld -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart mysqld` and confirm `systemctl is-active mysqld` succeeds.


    WHY: the grader checks real service state, not marker files.'
