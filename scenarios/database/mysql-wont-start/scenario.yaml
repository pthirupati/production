category: Fix
description: 'CONTEXT: A team operating database administration needs you to resolve `MySQL Service Won''t
  Start` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL host. `systemctl start mysqld` fails and the unit is in a failed
  state; the MySQL error log records why startup aborted (config error or permission/lock issue). The
  mysqld service fails to start and the database is down. The error log points at a concrete cause — usually
  a bad directive in the MySQL config, wrong datadir permissions, or a stale PID/socket — so systemd reports
  the unit as failed. Read the log, fix the underlying problem, and bring mysqld back to active.


  OBJECTIVE: Read the MySQL error log to find why startup fails; Fix the underlying cause (config directive,
  permissions, or stale lock); Start mysqld and confirm the service is active. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
