description: Service operations lab. The `postgresql` systemd unit is **failed/inactive** on this host
  — a realistic fault for Security Practice workflows that depend on it. Diagnose with `systemctl status
  postgresql` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active
  postgresql`.
objectives:
- The `postgresql` service is active (running)
- '`systemctl is-active postgresql` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `postgresql` service is not running (`systemctl is-active postgresql` → inactive/failed).
  Dependent Security Practice tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — pool config and active connections.

    2. Write down what looks normal versus wrong or missing for connection pooling.

    3. Recall the core idea: pool size, timeouts, and leaks. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for connection pooling.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — pool config and active connections.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — the pool serves load without exhaustion.

    4. Click Check Solution once `systemctl is-active postgresql` returns active.'
