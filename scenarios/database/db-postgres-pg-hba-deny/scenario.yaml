description: 'CONTEXT: A team operating database administration needs you to resolve `PostgreSQL pg_hba
  Rejecting App` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A PostgreSQL host whose pg_hba.conf lacks an entry for the application network,
  rejecting its logins. Application logins to PostgreSQL are rejected with ''no pg_hba.conf entry'' because
  the host-based auth rules don''t allow the app subnet. Add the correct rule and reload so the app can
  connect.


  OBJECTIVE: Confirm logins fail on pg_hba rules; Add the correct host auth entry; Verify the configuration
  is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A PostgreSQL host whose pg_hba.conf lacks an entry for the application network, rejecting
  its logins.
objectives:
- Confirm logins fail on pg_hba rules
- Add the correct host auth entry
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status postgresql` and `pg_isready` for connection state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check service status and `/var/log/postgresql/` logs.

    2. Verify `pg_hba.conf` and `postgresql.conf` for listen addresses.

    3. Test with `psql -U postgres -c ''SELECT 1''`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix auth rules, data directory permissions, or port conflict.

    2. `systemctl restart postgresql`.

    3. Confirm `pg_isready` reports accepting connections.


    WHY: the database must accept connections, not just start.'
