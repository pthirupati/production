description: 'CONTEXT: A team operating database administration needs you to resolve `PostgreSQL Running
  With fsync Off` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A PostgreSQL host whose postgresql.conf has fsync disabled, a durability risk.
  An audit found PostgreSQL running with fsync = off, risking data corruption on crash. Re-enable fsync
  safely and confirm the configuration is corrected.


  OBJECTIVE: Confirm fsync is disabled; Re-enable fsync and plan a restart; Verify the configuration is
  corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A PostgreSQL host whose postgresql.conf has fsync disabled, a durability risk.
objectives:
- Confirm fsync is disabled
- Re-enable fsync and plan a restart
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status postgresql` and `pg_isready` for connection state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check service status and `/var/log/postgresql/` logs.

    2. Verify `pg_hba.conf` and `postgresql.conf` for listen addresses.

    3. Test with `psql -U postgres -c ''SELECT 1''`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix auth rules, data directory permissions, or port conflict.

    2. `systemctl restart postgresql`.

    3. Confirm `pg_isready` reports accepting connections.


    WHY: the database must accept connections, not just start.'
