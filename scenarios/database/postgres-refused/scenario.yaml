category: Fix
description: 'CONTEXT: A team operating database administration needs you to resolve `PostgreSQL Connection
  Refused` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL host. PostgreSQL is not accepting connections — the service
  is stopped or failed. Connection attempts return "could not connect ... Connection refused". Clients
  get "connection refused" when connecting to PostgreSQL because the service is down (or not listening
  on the expected address). The postgresql unit failed to start, or listen_addresses/port is misconfigured,
  so nothing is accepting connections. Start the service (fixing any startup error) and confirm it accepts
  connections.


  OBJECTIVE: Confirm PostgreSQL is down / not listening and why; Start the service, resolving any startup
  error; Verify the server accepts connections. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status postgresql` and `pg_isready` for connection state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check service status and `/var/log/postgresql/` logs.

    2. Verify `pg_hba.conf` and `postgresql.conf` for listen addresses.

    3. Test with `psql -U postgres -c ''SELECT 1''`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix auth rules, data directory permissions, or port conflict.

    2. `systemctl restart postgresql`.

    3. Confirm `pg_isready` reports accepting connections.


    WHY: the database must accept connections, not just start.'
