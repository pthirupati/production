description: 'CONTEXT: A team operating database administration needs you to resolve `database: Connection
  Pooling — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around connection pooling.
  Assume an auditor or pen test is next week — tighten controls with evidence. Security review: harden
  connection pooling on this database system. Close unsafe defaults, enforce least privilege, and ensure
  pool size, timeouts, and leaks cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to connection pooling are removed or constrained; Access follows
  least privilege and is auditable; Security checks pass without breaking required functionality. Success
  means `systemctl is-active redis` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to connection pooling are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around connection pooling. Assume an
  auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status redis` and `journalctl -u redis -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status redis` — note Active/Failed and the last log lines.

    2. Read `journalctl -u redis -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart redis` and confirm `systemctl is-active redis` succeeds.


    WHY: the grader checks real service state, not marker files.'
