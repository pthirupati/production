title: 'Database Administration: Connection Pooling — Security Practice'
slug: academy-database-006-security-pooling
technology: Database Administration
category: Security
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Security review: harden connection pooling on this Database Administration
  system. Close unsafe defaults, enforce least privilege, and ensure pool size, timeouts,
  and prepared statements cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to connection pooling are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around connection
  pooling. Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Baseline current exposure: pool metrics, wait times, and server conn count.
    Note world-readable files, open ports, or excessive roles.'
- order: 2
  cost: 15
  content: Apply least privilege incrementally. Prefer explicit allows over broad
    wildcards.
- order: 3
  cost: 20
  content: Re-test legitimate workflows after hardening. Finish with `# FIXED-OK`
    in `/opt/fixitlab/academy/academy-database-006-security-pooling.conf` and Check
    Solution.
