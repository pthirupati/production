title: Redis Sentinel Quorum Lost
slug: db-redis-sentinel-down
technology: database
category: Build
difficulty: hard
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: 'CONTEXT: A team operating database administration needs you to resolve `Redis Sentinel Quorum
  Lost` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline database server with SQL client, schemas, backups,
  and performance views. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A host where the redis-sentinel service is failed. Redis Sentinel is down,
  so automatic failover can no longer occur.


  OBJECTIVE: Confirm redis-sentinel is down (redis-cli -p 26379 ping fails); Resolve the cause and start
  redis-sentinel; Verify redis-sentinel is active. Success means `systemctl is-active redis-sentinel`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A host where the redis-sentinel service is failed.
objectives:
- Confirm redis-sentinel is down (redis-cli -p 26379 ping fails)
- Resolve the cause and start redis-sentinel
- Verify redis-sentinel is active
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status redis-sentinel` and `journalctl -u redis-sentinel
    -n 50 --no-pager` before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status redis-sentinel` — note Active/Failed and the last log lines.

    2. Read `journalctl -u redis-sentinel -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart redis-sentinel` and confirm `systemctl is-active redis-sentinel` succeeds.


    WHY: the grader checks real service state, not marker files.'
summary: Complete the redis sentinel quorum lost database lab and verify success with the checker
