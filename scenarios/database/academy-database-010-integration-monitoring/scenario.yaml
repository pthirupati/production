title: 'Database Administration: Monitoring — Integration Lab'
slug: academy-database-010-integration-monitoring
technology: Database Administration
category: Cross-Technology
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Service operations lab. The `postgresql` systemd unit is **failed/inactive** on this host
  — a realistic fault for Integration Lab workflows that depend on it. Diagnose with `systemctl status
  postgresql` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active
  postgresql`.
objectives:
- The `postgresql` service is active (running)
- '`systemctl is-active postgresql` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `postgresql` service is not running (`systemctl is-active postgresql` → inactive/failed).
  Dependent Integration Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the relevant SQL client, schemas, backups, and performance views for
    monitoring.

    2. Write down what looks normal versus wrong or missing for Monitoring.

    3. Recall the core idea: how monitoring fits into database administration. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Monitoring.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the relevant SQL client, schemas, backups, and performance views for
    monitoring.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — Monitoring behaves correctly under normal and failure checks.

    4. Click Check Solution once `systemctl is-active postgresql` returns active.'
cross_technology: true
