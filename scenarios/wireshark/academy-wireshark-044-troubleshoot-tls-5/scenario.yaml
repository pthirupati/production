description: 'Production alert: clients see certificate errors or weak cipher negotiation.
  You are on call for Wireshark Packet Analysis and must troubleshoot TLS configuration
  methodically — triage symptoms, find root cause, apply the smallest safe fix, and
  confirm recovery.'
objectives:
- 'The incident symptom is clear: clients see certificate errors or weak cipher negotiation'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The capture lab is degraded. Clients see certificate errors or weak
  cipher negotiation. Recent changes may exist around TLS configuration, but do not
  restart blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Triage: `openssl s_client`, cert file paths, and ingress/listener config.
    Capture timestamps, error messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: handshakes succeed with a trusted chain and modern ciphers.
    Document the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-wireshark-044-troubleshoot-tls-5.conf`,
    and rerun Check Solution.'
