title: Capture and find the HTTP traffic
slug: wireshark-find-http-traffic
category: Fix
description: 'CONTEXT: A team operating packet analysis needs you to resolve `Capture and find the HTTP
  traffic` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab with pcap files, display filters, and
  protocol decode. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The capture contains DNS, HTTP, TLS and SSH packets with no display filter
  applied, so all protocols are interleaved in the packet list. A mixed capture (DNS, HTTP, TLS, SSH)
  is open in the in-app Wireshark simulator. Apply a display filter that isolates only the HTTP packets
  so you can confirm the web request to example.com was made, then run Check Solution.


  OBJECTIVE: Open the Wireshark simulator from the lab toolbar (toolbar -> Open Wireshark); Inspect the
  packet list — note the mix of DNS, HTTP, TLS and SSH protocols; Apply a display filter so the packet
  list shows ONLY HTTP packets. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
