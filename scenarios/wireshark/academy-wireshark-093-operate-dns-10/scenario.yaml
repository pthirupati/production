description: 'CONTEXT: A team operating packet analysis has raised a ticket for `Dns — Operate Lab`. A
  customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve it. Business
  impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab. The architecture is a single lab-primary
  node exposing pcap files, display filters, and protocol decode; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The capture lab is healthy enough for scheduled work on DNS. Complete the
  maintenance task without unnecessary downtime.


  OBJECTIVE: Day-2 DNS work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Acceptance criteria: the change is minimal and
  reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant pcap files, display filters, and protocol decode), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 DNS work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The capture lab is healthy enough for scheduled work on DNS. Complete the maintenance task
  without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: applications cannot resolve service names or
    lookups return wrong targets. This lab is about DNS — name resolution, records, forward/reverse lookups,
    and resolver config. Read the objectives and the current state, and note precisely what looks wrong
    versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For DNS problems the reliable method is: (1) reproduce/observe the
    failure, (2) narrow from the whole system down to the one component that owns the symptom, (3) change
    exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking a snapshot
    or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `cat /etc/resolv.conf` and test with `dig example.com` or `getent hosts example.com`.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Note the configured nameserver IP in resolv.conf.

    2. `ping` or `nc -zv` the nameserver — is it reachable?

    3. Check if NetworkManager or systemd-resolved overwrites the file.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Set a working `nameserver` line (e.g. 8.8.8.8 or the lab''s resolver).

    2. Re-run `dig` or `getent hosts` — lookups should succeed.

    3. Confirm `check.sh` passes.


    WHY: applications use resolv.conf for every hostname lookup.'
