title: Fix the wrong capture filter that captured nothing useful
slug: wireshark-fix-wrong-capture-filter
category: Fix
description: 'CONTEXT: A team operating packet analysis needs you to resolve `Fix the wrong capture filter
  that captured nothing useful` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab with pcap files, display filters, and
  protocol decode. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The capture filter is set to ''udp port 53''. Only the DNS query/response
  were captured; the HTTP, TLS and SSH traffic never made it into the capture. The on-call engineer set
  a capture filter of ''udp port 53'' and the resulting capture has no web traffic at all — only DNS.
  Fix the capture filter so the HTTP traffic to the web server on TCP port 80 is actually captured, then
  run Check Solution.


  OBJECTIVE: Open the Wireshark simulator from the lab toolbar (toolbar -> Open Wireshark); Notice the
  capture filter is ''udp port 53'', so only DNS packets were captured; Correct the CAPTURE filter so
  TCP port 80 (HTTP) traffic is captured off the wire. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
