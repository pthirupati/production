description: 'CONTEXT: A team operating packet analysis needs you to resolve `wireshark: Exporting Captures
  — Integration Lab` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab with pcap files, display filters, and
  protocol decode. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for exporting captures.
  Downstream consumers are waiting on this integration path. Integration lab: connect exporting captures
  with an adjacent platform in the wireshark stack. Validate authentication, data handoff, and failure
  behavior for saving, filtering, and exporting objects.


  OBJECTIVE: exporting captures is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- exporting captures is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for exporting captures. Downstream
  consumers are waiting on this integration path.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Load the capture in Wireshark and apply a display filter matching the symptom.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note protocol, source/dest IP, and TCP flags on failing packets.

    2. Follow TCP stream or export objects if HTTP/DNS is involved.

    3. Compare timing (retransmissions, RST, TLS alerts) to the lab question.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the filter or analysis steps the objectives describe.

    2. Document the answer (host, port, flag, or root cause).

    3. Submit via Check Solution in the Wireshark simulator.


    WHY: packet labs grade your analysis, not arbitrary shell markers.'
