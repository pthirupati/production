title: Diagnose TCP retransmissions and a connection reset
slug: wireshark-diagnose-tcp-retransmission
category: Fix
description: 'CONTEXT: A team operating packet analysis needs you to resolve `Diagnose TCP retransmissions
  and a connection reset` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab with pcap files, display filters, and
  protocol decode. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The full capture is shown with no display filter. Buried in the traffic is
  a connection to port 8080 that retransmits its SYN three times and then receives a RST, ACK from the
  server. Users report the service on port 8080 is unreachable. The capture holds the failed connection.
  Use a display filter to surface the TCP retransmissions and the RST, then mark the packet where the
  server reset the connection and run Check Solution.


  OBJECTIVE: Open the Wireshark simulator from the lab toolbar (toolbar -> Open Wireshark); Apply a display
  filter that surfaces the TCP retransmissions and the RST on port 8080; Identify the packet where the
  server reset the connection (the TCP RST). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
