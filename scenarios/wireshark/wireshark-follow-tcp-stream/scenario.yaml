title: Follow a TCP stream to read the request and response
slug: wireshark-follow-tcp-stream
category: Fix
description: 'CONTEXT: A team operating packet analysis needs you to resolve `Follow a TCP stream to read
  the request and response` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab with pcap files, display filters, and
  protocol decode. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The capture holds several TCP/UDP conversations. No stream has been followed
  yet, so the reassembled request/response view is empty. Reconstruct the application-layer exchange for
  the HTTP request to example.com. Use Follow TCP Stream on the correct conversation so you can read the
  raw GET request and the 200 OK response, then run Check Solution.


  OBJECTIVE: Open the Wireshark simulator from the lab toolbar (toolbar -> Open Wireshark); Locate the
  HTTP request packets to example.com (the GET /index.html on TCP port 80); Use Follow TCP Stream on that
  conversation to reassemble client and server payloads. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
