title: Follow a TCP stream to read the request and response
slug: wireshark-follow-tcp-stream
category: Wireshark Packet Analysis
description: Reconstruct the application-layer exchange for the HTTP request to example.com. Use Follow TCP
  Stream on the correct conversation so you can read the raw GET request and the 200 OK response, then run
  Check Solution.
difficulty: easy
lab_mode: simulation
simulation_type: wireshark
technology: wireshark
jira_priority: Low
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Open the Wireshark simulator from the lab toolbar (toolbar -> Open Wireshark)
- Locate the HTTP request packets to example.com (the GET /index.html on TCP port 80)
- Use Follow TCP Stream on that conversation to reassemble client and server payloads
- Run Check Solution to confirm you followed the correct stream
initial_state: The capture holds several TCP/UDP conversations. No stream has been followed yet, so the
  reassembled request/response view is empty.
hints:
- order: 1
  cost: 5
  content: Follow TCP Stream reassembles all the bytes of one conversation into a readable request/response.
    Pick a packet that belongs to the HTTP exchange first.
- order: 2
  cost: 10
  content: The HTTP request to example.com is TCP stream 0 (port 80). Select one of its packets, then choose
    Follow TCP Stream.
- order: 3
  cost: 15
  content: When you follow the right stream you should see the raw GET /index.html request and the HTTP/1.1
    200 OK response body. Then run Check Solution.
