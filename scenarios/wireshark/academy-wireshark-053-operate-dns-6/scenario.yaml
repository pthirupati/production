description: 'CONTEXT: A team operating packet analysis needs you to resolve `wireshark: Dns — Daily Operations`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab with pcap files, display filters, and
  protocol decode. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The capture lab is healthy enough for scheduled work on DNS. Complete the
  maintenance task without unnecessary downtime. Day-2 operations: perform a routine DNS task safely in
  wireshark. Follow change control — inspect, change, verify — while working with name resolution, records,
  forward/reverse lookups, and resolver config.


  OBJECTIVE: Day-2 DNS work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 DNS work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The capture lab is healthy enough for scheduled work on DNS. Complete the maintenance task
  without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `dig`, `nslookup`, or `Resolve-DnsName` plus zone/config files.

    2. Write down what looks normal versus wrong or missing for DNS.

    3. Recall the core idea: name resolution, records, forward/reverse lookups, and resolver config. Form
    one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the configured nameserver IP in resolv.conf.

    2. `ping` or `nc -zv` the nameserver — is it reachable?

    3. Check if NetworkManager or systemd-resolved overwrites the file.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `dig`, `nslookup`, or `Resolve-DnsName` plus zone/config files.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — queries return the expected records from the intended resolver.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
