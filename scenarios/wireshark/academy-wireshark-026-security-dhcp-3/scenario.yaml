description: 'CONTEXT: A team operating packet analysis needs you to resolve `wireshark: Dhcp Analysis
  — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab with pcap files, display filters, and
  protocol decode. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around DHCP analysis.
  Assume an auditor or pen test is next week — tighten controls with evidence. Security review: harden
  DHCP analysis on this wireshark system. Close unsafe defaults, enforce least privilege, and ensure DORA
  exchange and lease issues cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to DHCP analysis are removed or constrained; Access follows least
  privilege and is auditable; Security checks pass without breaking required functionality. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to DHCP analysis are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around DHCP analysis. Assume an auditor
  or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Load the capture in Wireshark and apply a display filter matching the symptom.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note protocol, source/dest IP, and TCP flags on failing packets.

    2. Follow TCP stream or export objects if HTTP/DNS is involved.

    3. Compare timing (retransmissions, RST, TLS alerts) to the lab question.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the filter or analysis steps the objectives describe.

    2. Document the answer (host, port, flag, or root cause).

    3. Submit via Check Solution in the Wireshark simulator.


    WHY: packet labs grade your analysis, not arbitrary shell markers.'
