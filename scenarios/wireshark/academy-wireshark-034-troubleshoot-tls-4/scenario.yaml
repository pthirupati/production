description: 'CONTEXT: A team operating packet analysis needs you to resolve `wireshark: Tls Configuration
  — Troubleshooting Drill` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab with pcap files, display filters, and
  protocol decode. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The capture lab is degraded. Clients see certificate errors or weak cipher
  negotiation. Recent changes may exist around TLS configuration, but do not restart blindly — gather
  evidence first. Production alert: clients see certificate errors or weak cipher negotiation. You are
  on call for wireshark and must troubleshoot TLS configuration methodically — triage symptoms, isolate
  root cause, apply the smallest safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: clients see certificate errors or weak cipher negotiation;
  Root cause is isolated with evidence, not guesswork; Service behavior returns to normal after the fix.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: clients see certificate errors or weak cipher negotiation'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The capture lab is degraded. Clients see certificate errors or weak cipher negotiation.
  Recent changes may exist around TLS configuration, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `openssl s_client`, cert file paths, and ingress/listener config.

    2. Write down what looks normal versus wrong or missing for TLS configuration.

    3. Recall the core idea: certificates, chains, ciphers, renewal, and mTLS. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note protocol, source/dest IP, and TCP flags on failing packets.

    2. Follow TCP stream or export objects if HTTP/DNS is involved.

    3. Compare timing (retransmissions, RST, TLS alerts) to the lab question.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `openssl s_client`, cert file paths, and ingress/listener config.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — handshakes succeed with a trusted chain and modern ciphers.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
