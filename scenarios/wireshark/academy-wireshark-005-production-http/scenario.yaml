description: 'CONTEXT: A team operating packet analysis needs you to resolve `wireshark: Http Analysis
  — Production Readiness` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab with pcap files, display filters, and
  protocol decode. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but HTTP analysis is not production ready — missing
  guardrails, runbooks, or capacity checks. Production readiness for HTTP analysis. Harden, document,
  and validate requests, responses, and timing so the change is safe to run during a maintenance window.


  OBJECTIVE: Day-2 HTTP analysis work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 HTTP analysis work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but HTTP analysis is not production ready — missing guardrails,
  runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Load the capture in Wireshark and apply a display filter matching the symptom.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note protocol, source/dest IP, and TCP flags on failing packets.

    2. Follow TCP stream or export objects if HTTP/DNS is involved.

    3. Compare timing (retransmissions, RST, TLS alerts) to the lab question.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the filter or analysis steps the objectives describe.

    2. Document the answer (host, port, flag, or root cause).

    3. Submit via Check Solution in the Wireshark simulator.


    WHY: packet labs grade your analysis, not arbitrary shell markers.'
