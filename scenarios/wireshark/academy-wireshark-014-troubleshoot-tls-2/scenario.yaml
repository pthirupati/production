title: 'Wireshark Packet Analysis: Tls Configuration — Troubleshooting Drill'
slug: academy-wireshark-014-troubleshoot-tls-2
technology: Wireshark Packet Analysis
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: wireshark
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: clients see certificate errors or weak cipher negotiation.
  You are on call for Wireshark Packet Analysis and must troubleshoot TLS configuration
  methodically — triage symptoms, isolate root cause, apply the smallest safe fix,
  and confirm recovery.'
objectives:
- 'The incident symptom is clear: clients see certificate errors or weak cipher negotiation'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The capture lab is degraded. Clients see certificate errors or weak
  cipher negotiation. Recent changes may exist around TLS configuration, but do not
  restart blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `openssl s_client`, cert file paths, and ingress/listener
    config.

    2. Write down what looks normal versus wrong or missing for TLS configuration.

    3. Recall the core idea: certificates, chains, ciphers, renewal, and mTLS. Form
    one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for TLS configuration.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `openssl s_client`, cert file paths, and ingress/listener
    config.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — handshakes succeed with a trusted chain and modern ciphers.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-wireshark-014-troubleshoot-tls-2.conf`,
    then click Check Solution.'
