title: Isolate a single conversation with a display filter
slug: wireshark-isolate-conversation
category: Fix
description: 'CONTEXT: A team operating packet analysis needs you to resolve `Isolate a single conversation
  with a display filter` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab with pcap files, display filters, and
  protocol decode. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The capture shows DNS, the HTTP conversation on port 80, a TLS handshake on
  port 443, SSH on port 22, and a failed connection on port 8080 — all interleaved with no display filter
  applied. The capture mixes several conversations. Use a Wireshark display filter to isolate only the
  conversation between the client and the web server on TCP port 80, then run Check Solution.


  OBJECTIVE: Open the Wireshark simulator from the lab toolbar (toolbar -> Open Wireshark); Identify the
  client-to-web-server conversation (TCP port 80, host 93.184.216.34); Apply a display filter that leaves
  ONLY that single conversation in the packet list. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
