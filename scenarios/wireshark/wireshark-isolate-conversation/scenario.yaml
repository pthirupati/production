title: Isolate a single conversation with a display filter
slug: wireshark-isolate-conversation
category: Wireshark Packet Analysis
description: The capture mixes several conversations. Use a Wireshark display filter to isolate only the
  conversation between the client and the web server on TCP port 80, then run Check Solution.
difficulty: easy
lab_mode: simulation
simulation_type: wireshark
technology: wireshark
jira_priority: Low
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Open the Wireshark simulator from the lab toolbar (toolbar -> Open Wireshark)
- Identify the client-to-web-server conversation (TCP port 80, host 93.184.216.34)
- Apply a display filter that leaves ONLY that single conversation in the packet list
- Run Check Solution to confirm exactly one conversation remains
initial_state: The capture shows DNS, the HTTP conversation on port 80, a TLS handshake on port 443, SSH on
  port 22, and a failed connection on port 8080 — all interleaved with no display filter applied.
hints:
- order: 1
  cost: 5
  content: A conversation can be isolated by its transport port or by host. The web conversation runs over
    TCP port 80 to 93.184.216.34.
- order: 2
  cost: 10
  content: Try a display filter of tcp.port==80 (or ip.addr==93.184.216.34). Both narrow the list to the one
    client/web-server stream.
- order: 3
  cost: 15
  content: After filtering, every packet in the list should belong to the same TCP stream (the example.com
    web request). Then run Check Solution.
