title: Isolate a single conversation with a display filter
slug: wireshark-isolate-conversation
category: Fix
description: 'CONTEXT: A team operating packet analysis has raised a ticket for `Isolate a single conversation
  with a display filter`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline capture lab. The architecture is a single lab-primary
  node exposing pcap files, display filters, and protocol decode; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The capture shows DNS, the HTTP conversation on port 80, a TLS handshake on
  port 443, SSH on port 22, and a failed connection on port 8080 — all interleaved with no display filter
  applied.


  OBJECTIVE: Open the Wireshark console from the lab toolbar (toolbar -> Open Wireshark); Identify the
  client-to-web-server conversation (TCP port 80, host 93.184.216.34); Apply a display filter that leaves
  ONLY that single conversation in the packet list. Acceptance criteria: the change is minimal and reversible,
  and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant pcap files, display filters, and protocol decode), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
