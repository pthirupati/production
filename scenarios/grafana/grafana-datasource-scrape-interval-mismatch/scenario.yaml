title: Datasource scrape interval mismatch
slug: grafana-datasource-scrape-interval-mismatch
category: Fix
description: 'CONTEXT: A team operating Grafana observability has raised a ticket for `Datasource scrape
  interval mismatch`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Grafana stack. The architecture is a single lab-primary
  node exposing dashboards, datasources, alerts, and provisioning YAML; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The datasource''s scrapeInterval disagrees with Prometheus, skewing rate().
  The Grafana console renders the broken state; the configuration file /etc/grafana/provisioning/datasources/prometheus.yaml
  must be corrected.


  OBJECTIVE: Open the Grafana console from the lab toolbar and sign in (lab_grafana / lab_grafana@123);
  Diagnose the fault — The datasource''s scrapeInterval disagrees with Prometheus, skewing rate().; Edit
  /etc/grafana/provisioning/datasources/prometheus.yaml in the terminal to apply the documented remediation.
  Acceptance criteria: the change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant dashboards, datasources, alerts, and provisioning YAML), changing one thing at a
  time. Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
