  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Grafana stack with dashboards, datasources, alerts,
  and provisioning YAML. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Condition uses < instead of > so it never triggers. The Grafana simulator
  renders the broken state; the configuration file /etc/grafana/provisioning/alerting/rules.yaml must
  be corrected. Condition uses < instead of > so it never triggers. Use the in-app Grafana simulator to
  investigate, then apply the documented fix to /etc/grafana/provisioning/alerting/rules.yaml from the
  terminal and verify with Check Solution.


  OBJECTIVE: Open the Grafana simulator from the lab toolbar and sign in (lab_grafana / lab_grafana@123);
  Diagnose the fault — Condition uses < instead of > so it never triggers.; Edit /etc/grafana/provisioning/alerting/rules.yaml
  in the terminal to apply the documented remediation. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
