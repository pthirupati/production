description: 'CONTEXT: A team operating Grafana observability needs you to resolve `grafana: Terraform
  Variables — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Grafana stack with dashboards, datasources, alerts,
  and provisioning YAML. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Grafana stack is healthy enough for scheduled work on Terraform variables.
  Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine Terraform
  variables task safely in grafana. Follow change control — inspect, change, verify — while working with
  input variables, defaults, validation, and tfvars layering.


  OBJECTIVE: Day-2 Terraform variables work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 Terraform variables work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The Grafana stack is healthy enough for scheduled work on Terraform variables. Complete
  the maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — variables.tf, *.tfvars, and `terraform console`.

    2. Write down what looks normal versus wrong or missing for Terraform variables.

    3. Recall the core idea: input variables, defaults, validation, and tfvars layering. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Settings → Data sources — test the Prometheus/Loki datasource.

    2. Inspect panel query JSON and variable definitions.

    3. Check Grafana server logs if provisioning or auth errors appear.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — variables.tf, *.tfvars, and `terraform console`.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — the correct tfvars set is used and `terraform validate` passes.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
