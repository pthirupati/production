technology: Grafana Observability
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: a panel shows wrong or empty data. You are on call
  for Grafana Observability and must troubleshoot panels methodically — triage symptoms,
  isolate root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: a panel shows wrong or empty data'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Grafana stack is degraded. A panel shows wrong or empty data. Recent
  changes may exist around panels, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — panel query and transform pipeline.

    2. Write down what looks normal versus wrong or missing for panels.

    3. Recall the core idea: queries, visualizations, and transforms. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for panels.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — panel query and transform pipeline.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — the panel renders the intended metric.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-grafana-074-troubleshoot-panels-8.conf`,
    then click Check Solution.'
