description: 'Production alert: a panel shows wrong or empty data. You are on call
  for Grafana Observability and must troubleshoot panels methodically — triage symptoms,
  find root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: a panel shows wrong or empty data'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Grafana stack is degraded. A panel shows wrong or empty data. Recent
  changes may exist around panels, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Triage: panel query and transform pipeline. Capture timestamps, error
    messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: the panel renders the intended metric. Document the fix,
    add `# FIXED-OK` to `/opt/fixitlab/academy/academy-grafana-074-troubleshoot-panels-8.conf`,
    and rerun Check Solution.'
