description: Build Grafana dashboards from scratch in this Grafana Observability lab.
  You start from a minimal environment and must produce a working configuration that
  demonstrates panels, variables, transformations, and datasource wiring. Plan, implement,
  then prove it works.
objectives:
- A working Grafana dashboards setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The Grafana stack is ready but Grafana dashboards is not configured
  yet. Required tools may already be installed; your job is to create the configuration
  and bring the capability online.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — dashboard JSON, panel queries, and Explore view.

    2. Write down what looks normal versus wrong or missing for Grafana dashboards.

    3. Recall the core idea: panels, variables, transformations, and datasource wiring.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Grafana dashboards.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — dashboard JSON, panel queries, and Explore view.

    2. Create the smallest working slice of Grafana dashboards first, validate it,
    then add the remaining pieces one at a time.

    3. Verify the result — dashboards render with correct templated filters.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-grafana-042-build-dashboards-5.conf`,
    then click Check Solution.'
