hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — alert rule config and state.

    2. Write down what looks normal versus wrong or missing for alerting.

    3. Recall the core idea: alert rules, conditions, and routing. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for alerting.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — alert rule config and state.

    2. Apply production standards for alerting: resource limits, monitoring, access
    controls, and a written rollback step.

    3. Verify the result — alerts trigger on real conditions.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-grafana-065-production-alerting-7.conf`,
