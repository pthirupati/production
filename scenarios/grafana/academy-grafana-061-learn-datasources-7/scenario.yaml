description: This beginner-friendly Grafana Observability lab introduces Grafana datasources.
  You will explore proxy vs direct, auth, and TLS to backends on the Grafana stack.
  Read the environment first, then complete the guided steps — no prior production
  experience required.
objectives:
- Understand how Grafana datasources work in this lab environment
- Identify the main status and configuration signals for Grafana datasources
- Confirm you can read the current state confidently before changing anything
initial_state: The Grafana stack is online with a starter Grafana datasources setup.
  Some pieces are intentionally incomplete so you can learn how the pieces fit together.
  Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: Grafana datasource test and query inspector. Write down
    what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — proxy vs direct, auth, and TLS to backends. Make one small,
    reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-grafana-061-learn-datasources-7.conf`, then
    click Check Solution.
