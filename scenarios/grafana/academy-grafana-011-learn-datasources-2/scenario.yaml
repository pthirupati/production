description: This beginner-friendly Grafana Observability lab introduces datasources.
  You will explore connection, auth, and default datasource on the Grafana stack.
  Read the environment first, then follow the guided steps — no prior production experience
  required.
objectives:
- Understand how datasources work in this lab environment
- Identify the main status and configuration signals for datasources
- Confirm you can read the current state confidently before changing anything
initial_state: The Grafana stack is online with a starter datasources setup. Some
  pieces are intentionally incomplete so you can learn how they fit together. Nothing
  is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — datasource config and test results.

    2. Write down what looks normal versus wrong or missing for datasources.

    3. Recall the core idea: connection, auth, and default datasource. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for datasources.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — datasource config and test results.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — the datasource connects and returns data.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-grafana-011-learn-datasources-2.conf`,
    then click Check Solution.'
