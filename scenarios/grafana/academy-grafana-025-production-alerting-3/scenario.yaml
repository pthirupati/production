description: 'CONTEXT: A team operating Grafana observability needs you to resolve `grafana: Alerting
  — Production Readiness` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Grafana stack with dashboards, datasources, alerts,
  and provisioning YAML. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but alerting is not production ready — missing
  guardrails, runbooks, or capacity checks. Production readiness for alerting. Harden, document, and validate
  alert rules, conditions, and routing so the change is safe to run during a maintenance window.


  OBJECTIVE: Day-2 alerting work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `systemctl is-active nginx` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 alerting work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but alerting is not production ready — missing guardrails,
  runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Sign in to Grafana, open the affected dashboard/panel, and check Explore for
    the datasource health.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Settings → Data sources — test the Prometheus/Loki datasource.

    2. Inspect panel query JSON and variable definitions.

    3. Check Grafana server logs if provisioning or auth errors appear.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix datasource URL, credentials, or panel PromQL/LogQL.

    2. Save the dashboard and refresh the panel.

    3. Confirm data renders and Check Solution passes.


    WHY: Grafana panels fail when queries or datasources are misconfigured.'
summary: Complete the alerting — production lab grafana lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
