description: 'CONTEXT: A team operating Grafana observability needs you to resolve `grafana: Provisioning
  — Automation Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Grafana stack with dashboards, datasources, alerts,
  and provisioning YAML. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for provisioning. Automate the boring
  parts without hiding important safety checks. Automation lab: remove toil around provisioning. Codify
  repeatable steps for as-code dashboards and datasources and prove the automation is idempotent.


  OBJECTIVE: Day-2 provisioning work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `systemctl is-active rsyslog` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 provisioning work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for provisioning. Automate the boring parts without
  hiding important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status rsyslog` and `journalctl -u rsyslog -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status rsyslog` — note Active/Failed and the last log lines.

    2. Read `journalctl -u rsyslog -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart rsyslog` and confirm `systemctl is-active rsyslog` succeeds.


    WHY: the grader checks real service state, not marker files.'
summary: Complete the provisioning — automation lab grafana lab and verify success with the checker
