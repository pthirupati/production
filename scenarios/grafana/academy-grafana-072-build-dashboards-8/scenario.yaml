description: Service operations lab. The `rsyslog` systemd unit is **failed/inactive** on this host —
  a realistic fault for Build From Scratch workflows that depend on it. Diagnose with `systemctl status
  rsyslog` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active rsyslog`.
objectives:
- The `rsyslog` service is active (running)
- '`systemctl is-active rsyslog` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `rsyslog` service is not running (`systemctl is-active rsyslog` → inactive/failed).
  Dependent Build From Scratch tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — dashboard JSON, panel queries, and Explore view.

    2. Write down what looks normal versus wrong or missing for Grafana dashboards.

    3. Recall the core idea: panels, variables, transformations, and datasource wiring. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Grafana dashboards.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — dashboard JSON, panel queries, and Explore view.

    2. Create the smallest working slice of Grafana dashboards first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — dashboards render with correct templated filters.

    4. Click Check Solution once `systemctl is-active rsyslog` returns active.'
