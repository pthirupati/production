title: Panels — Troubleshoot Lab
slug: academy-grafana-094-troubleshoot-panels-10
technology: grafana
category: Fix
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating Grafana observability needs you to resolve `grafana: Panels —
  Troubleshooting Drill` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Grafana stack with dashboards, datasources, alerts,
  and provisioning YAML. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Grafana stack is degraded. A panel shows wrong or empty data. Recent changes
  may exist around panels, but do not restart blindly — gather evidence first. Production alert: a panel
  shows wrong or empty data. You are on call for grafana and must troubleshoot panels methodically — triage
  symptoms, isolate root cause, apply the smallest safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: a panel shows wrong or empty data; Root cause is isolated
  with evidence, not guesswork; Service behavior returns to normal after the fix. Success means `systemctl
  is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: a panel shows wrong or empty data'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Grafana stack is degraded. A panel shows wrong or empty data. Recent changes may exist
  around panels, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Sign in to Grafana, open the affected dashboard/panel, and check Explore for
    the datasource health.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Settings → Data sources — test the Prometheus/Loki datasource.

    2. Inspect panel query JSON and variable definitions.

    3. Check Grafana server logs if provisioning or auth errors appear.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix datasource URL, credentials, or panel PromQL/LogQL.

    2. Save the dashboard and refresh the panel.

    3. Confirm data renders and Check Solution passes.


    WHY: Grafana panels fail when queries or datasources are misconfigured.'
summary: Complete the panels — troubleshoot lab grafana lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic grafana literacy
tags:
- fix
- grafana
- hands-on
linked_tutorial: grafana-fundamentals
what_you_will_learn:
- 'The incident symptom is clear: a panel shows wrong or empty data'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
environment:
  nodes:
  - role: primary
    os: FixitLab Grafana stack
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - bash
  - coreutils
  - grafana
  - journalctl
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Panels — Troubleshoot Lab
  description: Restore healthy behavior for Panels — Troubleshoot Lab by investigating the failure, applying
    the smallest safe fix, and validating the outcome.
  background: 'This grafana lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: service_active
    command: systemctl is-active nginx
    expected_status: active
    error_message: The nginx service is not active yet. Check `systemctl status nginx` and `journalctl
      -u nginx -n 50`.
solution:
  summary: The root cause is an unhealthy `nginx` service; repair it and verify active state.
  files_changed: []
  commands_run:
  - systemctl is-active nginx
  reference_docs: grafana-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
