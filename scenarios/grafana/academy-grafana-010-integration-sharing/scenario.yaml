description: 'Integration lab: connect dashboard sharing with an adjacent platform
  in the Grafana Observability stack. Validate authentication, data handoff, and failure
  behavior for snapshots, links, and permissions.'
objectives:
- dashboard sharing is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for dashboard
  sharing. Downstream consumers are waiting on this integration path.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — share settings and permissions.

    2. Write down what looks normal versus wrong or missing for dashboard sharing.

    3. Recall the core idea: snapshots, links, and permissions. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for dashboard sharing.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — share settings and permissions.

    2. Configure credentials and networking, then drive one happy-path transaction
    end to end across both systems.

    3. Verify the result — sharing matches the intended audience.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-grafana-010-integration-sharing.conf`,
    then click Check Solution.'
