    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — Loki datasource and LogQL queries.

    2. Repair or run the backup job, then perform a controlled restore into a scratch
