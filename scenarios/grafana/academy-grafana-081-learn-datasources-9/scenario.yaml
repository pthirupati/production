title: Datasources — Learn Lab
slug: academy-grafana-081-learn-datasources-9
technology: grafana
category: Learn
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: 'CONTEXT: A team operating Grafana observability needs you to resolve `grafana: Datasources
  — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Grafana stack with dashboards, datasources, alerts,
  and provisioning YAML. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Grafana stack is online with a starter datasources setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
  This beginner-friendly grafana lab introduces datasources. You will explore connection, auth, and default
  datasource on the Grafana stack. Read the environment first, then follow the guided steps — no prior
  production experience required.


  OBJECTIVE: Understand how datasources work in this lab environment; Identify the main status and configuration
  signals for datasources; Confirm you can read the current state confidently before changing anything.
  Success means `systemctl is-active rsyslog` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how datasources work in this lab environment
- Identify the main status and configuration signals for datasources
- Confirm you can read the current state confidently before changing anything
initial_state: The Grafana stack is online with a starter datasources setup. Some pieces are intentionally
  incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status rsyslog` and `journalctl -u rsyslog -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status rsyslog` — note Active/Failed and the last log lines.

    2. Read `journalctl -u rsyslog -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart rsyslog` and confirm `systemctl is-active rsyslog` succeeds.


    WHY: the grader checks real service state, not marker files.'
summary: Complete the datasources — learn lab grafana lab and verify success with the checker
estimated_minutes: 15
xp_reward: 100
prerequisites:
- Basic grafana literacy
tags:
- do
- grafana
