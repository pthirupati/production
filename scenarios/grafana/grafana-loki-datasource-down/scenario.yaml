title: Loki datasource unreachable
slug: grafana-loki-datasource-down
category: Build
description: 'CONTEXT: A team operating Grafana observability needs you to resolve `Loki datasource unreachable`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Grafana stack with dashboards, datasources, alerts,
  and provisioning YAML. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Logs panels show errors — the Loki datasource URL is wrong. The Grafana simulator
  renders the broken state; the configuration file /etc/grafana/provisioning/datasources/loki.yaml must
  be corrected. Logs panels show errors — the Loki datasource URL is wrong. Use the in-app Grafana simulator
  to investigate, then apply the documented fix to /etc/grafana/provisioning/datasources/loki.yaml from
  the terminal and verify with Check Solution.


  OBJECTIVE: Open the Grafana simulator from the lab toolbar and sign in (lab_grafana / lab_grafana@123);
  Diagnose the fault — Logs panels show errors — the Loki datasource URL is wrong.; Edit /etc/grafana/provisioning/datasources/loki.yaml
  in the terminal to apply the documented remediation. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
lab_mode: simulation
simulation_type: grafana
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: false
dual_terminal: false
objectives:
- Open the Grafana simulator from the lab toolbar and sign in (lab_grafana / lab_grafana@123)
- Diagnose the fault — Logs panels show errors — the Loki datasource URL is wrong.
- Edit /etc/grafana/provisioning/datasources/loki.yaml in the terminal to apply the documented remediation
- Run Check Solution to confirm the configuration is corrected
initial_state: Logs panels show errors — the Loki datasource URL is wrong. The Grafana simulator renders
  the broken state; the configuration file /etc/grafana/provisioning/datasources/loki.yaml must be corrected.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Sign in to Grafana, open the affected dashboard/panel, and check Explore for
    the datasource health.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Settings → Data sources — test the Prometheus/Loki datasource.

    2. Inspect panel query JSON and variable definitions.

    3. Check Grafana server logs if provisioning or auth errors appear.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix datasource URL, credentials, or panel PromQL/LogQL.

    2. Save the dashboard and refresh the panel.

    3. Confirm data renders and Check Solution passes.


    WHY: Grafana panels fail when queries or datasources are misconfigured.'
