environment:
  nodes:
  - role: primary
    os: FixitLab supply-chain security lab
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline lab environment
  pre_installed:
  - bash
  - coreutils
  - trivy
  - cosign
  - syft
  - falco
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: 'SBOM Does Not Match the Shipped Image'
  description: |-
    Restore healthy behavior for SBOM Does Not Match the Shipped Image by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This devsecops-supplychain lab teaches why an SBOM must be generated from the final artifact and how SBOM drift undermines supply-chain provenance through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/devsecops-sbom-stale-not-regenerated.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The pipeline attaches a stale SBOM produced before the last dependency update, so it misrepresents the shipped artifact and fails drift verification. Regenerate the SBOM from the actual built image (e.g. `syft`) and re-attach it so the SBOM matches the image digest.
  files_changed: []
  commands_run:
  - 'syft payments:3.1 -o table | head'
  - 'cat /supplychain/sbom/payments-3.1.spdx.json | head'
  - 'trivy image --list-all-pkgs payments:3.1 | head'
  reference_docs: devsecops-supplychain-fundamentals
