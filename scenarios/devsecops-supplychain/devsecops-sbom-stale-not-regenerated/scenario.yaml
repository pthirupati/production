description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `SBOM Does Not Match the Shipped Image` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: The release gate flags that the attached SBOM lists package versions that differ from what is actually in `payments:3.1`. The SBOM was generated against a previous build and never regenerated after the dependency bump.

  OBJECTIVE: The pipeline attaches a stale SBOM produced before the last dependency update, so it misrepresents the shipped artifact and fails drift verification. Regenerate the SBOM from the actual built image (e.g. `syft`) and re-attach it so the SBOM matches the image digest. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The SBOM accurately reflects the shipped image''s packages'
- 'The stale, un-regenerated SBOM is confirmed as root cause'
- 'SBOM drift verification passes after regeneration'
initial_state: |-
  The release gate flags that the attached SBOM lists package versions that differ from what is actually in `payments:3.1`. The SBOM was generated against a previous build and never regenerated after the dependency bump.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `syft payments:3.1 -o table | head`
        2. `cat /supplychain/sbom/payments-3.1.spdx.json | head`
        3. `trivy image --list-all-pkgs payments:3.1 | head`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `syft payments:3.1 -o table | head` and read the status/error carefully.
        2. Cross-check with `cat /supplychain/sbom/payments-3.1.spdx.json | head` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The pipeline attaches a stale SBOM produced before the last dependency update, so it misrepresents the shipped artifact and fails drift verification. Regenerate the SBOM from the actual built image (e.g. `syft`) and re-attach it so the SBOM matches the image digest.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
