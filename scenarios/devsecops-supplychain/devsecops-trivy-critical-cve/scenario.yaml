  content: "Where to look — orient before changing anything:\n    1. `trivy image --severity CRITICAL\
    \ checkout:1.8`\n    2. `trivy image --list-all-pkgs checkout:1.8`\n    3. `grep -n 'FROM' Dockerfile`\n\
    \    Write down what looks healthy versus wrong. Form one hypothesis before you touch anything."
- order: 2
  cost: 25
  content: "Diagnostic steps:\n    1. Re-run `trivy image --severity CRITICAL checkout:1.8` and read the\
    \ status/error carefully.\n    2. Cross-check with `trivy image --list-all-pkgs checkout:1.8` to isolate\
    \ the failing object.\n    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. The image is built on a stale base tag that ships a vulnerable\
    \ openssl with a fix already published upstream. Remediate by bumping the base image to the patched\
    \ tag (or adding the package update in the build) so the CRITICAL fixed-available finding clears —\
    \ do NOT just lower the severity threshold to make the gate pass.\n    2. Change one thing at a time\
    \ so you can roll back if the hypothesis was wrong.\n    3. Verify the objective is met, then click\
    \ Check Solution (graded on real state, not a marker file)."
