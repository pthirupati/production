description: 'CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Trivy Blocks
  Deploy on Critical CVE` during a realistic delivery incident. The business impact is a stalled or unsafe
  release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline supply-chain security lab with a local OCI registry,
  Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything
  runs locally; no external registry or paid APIs are required.


  SYMPTOM / STARTING STATE: The CI gate fails: `trivy image checkout:1.8` reports a CRITICAL, fixed-available
  CVE in a base OS package (openssl). The pipeline is configured to fail on CRITICAL severity with a fix
  available, so the release is blocked until the image is remediated.


  OBJECTIVE: The image is built on a stale base tag that ships a vulnerable openssl with a fix already
  published upstream. Remediate by bumping the base image to the patched tag (or adding the package update
  in the build) so the CRITICAL fixed-available finding clears — do NOT just lower the severity threshold
  to make the gate pass. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The CRITICAL fixed-available openssl CVE is remediated at the image layer
- trivy image --severity CRITICAL returns no fixed-available findings
- The gate is not bypassed by lowering severity thresholds
initial_state: 'The CI gate fails: `trivy image checkout:1.8` reports a CRITICAL, fixed-available CVE
  in a base OS package (openssl). The pipeline is configured to fail on CRITICAL severity with a fix available,
  so the release is blocked until the image is remediated.'
hints:
