description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Attestation Attached to the Wrong Digest` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: Verification of `checkout:6.0` fails with `no matching attestations`. CI produced an SBOM attestation but attached it to a tag that was later re-pushed, so it no longer references the running image's digest.

  OBJECTIVE: The attestation was attached to a tag rather than the immutable digest, and the tag moved, so the attestation no longer matches the deployed image. Re-attach the attestation to the exact image digest (`@sha256:...`) so verification finds the matching attestation for the running artifact. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Verification finds the attestation for the deployed digest'
- 'The tag-attached (moved) attestation is confirmed as root cause'
- 'The attestation references the immutable digest after re-attachment'
initial_state: |-
  Verification of `checkout:6.0` fails with `no matching attestations`. CI produced an SBOM attestation but attached it to a tag that was later re-pushed, so it no longer references the running image's digest.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `crane digest checkout:6.0`
        2. `cosign verify-attestation --type spdxjson --key /supplychain/cosign.pub checkout:6.0`
        3. `cosign tree checkout:6.0`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `crane digest checkout:6.0` and read the status/error carefully.
        2. Cross-check with `cosign verify-attestation --type spdxjson --key /supplychain/cosign.pub checkout:6.0` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The attestation was attached to a tag rather than the immutable digest, and the tag moved, so the attestation no longer matches the deployed image. Re-attach the attestation to the exact image digest (`@sha256:...`) so verification finds the matching attestation for the running artifact.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
