        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `ls -a /supplychain/app` and read the status/error carefully.
        2. Cross-check with `grep -n 'npm install\|npm ci' Dockerfile` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The lockfile is not committed, so dependency resolution is non-deterministic and builds are not reproducible (and cannot be reliably scanned). Commit the lockfile and switch the build to `npm ci` so every build installs the exact pinned tree.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
