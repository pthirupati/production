description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Non-Reproducible Build: Lockfile Missing` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: Two CI runs of the same commit produce images with different dependency versions. The repo has `package.json` but no committed `package-lock.json`, so `npm install` resolves floating ranges differently each build.

  OBJECTIVE: The lockfile is not committed, so dependency resolution is non-deterministic and builds are not reproducible (and cannot be reliably scanned). Commit the lockfile and switch the build to `npm ci` so every build installs the exact pinned tree. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The build resolves an identical, pinned dependency tree every run'
- 'The missing committed lockfile is confirmed as root cause'
- 'The build uses ci-mode against a committed lockfile after the fix'
initial_state: |-
