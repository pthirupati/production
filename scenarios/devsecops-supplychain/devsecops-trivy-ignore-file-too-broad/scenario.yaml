    Where to look — orient before changing anything:
        1. `cat /supplychain/.trivyignore`
        2. `trivy image --severity CRITICAL --ignorefile /dev/null api:2.3`
        3. `trivy image --severity CRITICAL api:2.3`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /supplychain/.trivyignore` and read the status/error carefully.
        2. Cross-check with `trivy image --severity CRITICAL --ignorefile /dev/null api:2.3` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The `.trivyignore` has an over-broad or unexpiring entry that suppresses far more than the one accepted risk, hiding real CVEs. Scope the ignore to the specific CVE ID with a documented expiry (or remove it) so genuine findings are surfaced again.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
