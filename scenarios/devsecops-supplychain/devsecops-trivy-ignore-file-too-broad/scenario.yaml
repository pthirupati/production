description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `A Broad .trivyignore Hides Real CVEs` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: A CRITICAL RCE CVE slipped past the gate. The `.trivyignore` file contains a wildcard/blanket entry added months ago to silence one finding, and it now suppresses many unrelated, still-exploitable CVEs.

  OBJECTIVE: The `.trivyignore` has an over-broad or unexpiring entry that suppresses far more than the one accepted risk, hiding real CVEs. Scope the ignore to the specific CVE ID with a documented expiry (or remove it) so genuine findings are surfaced again. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The previously hidden CRITICAL CVE is reported by the scan'
- 'The over-broad .trivyignore entry is confirmed as root cause'
- 'The ignore list is scoped to specific, documented, expiring exceptions'
