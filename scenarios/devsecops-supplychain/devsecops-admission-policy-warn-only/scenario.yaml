is_free: false
infrastructure_type: docker
jira_priority: Medium
description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Vulnerability Gate Is in Warn-Only Mode` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: A CRITICAL-CVE image reached production despite the scanner flagging it. The admission policy is configured in `warn` (audit) mode, so violations are logged but never actually block the deploy.

  OBJECTIVE: The admission policy validationAction is set to `Warn`/`Audit`, so CVE violations are logged but not enforced, letting vulnerable images through. Set the policy to enforce (`Deny`) for the CRITICAL rule so violating images are actually blocked at admission. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The admission policy blocks CRITICAL-CVE images at deploy'
- 'The warn-only validationAction is confirmed as root cause'
- 'Enforcement is enabled without weakening the CVE rule'
initial_state: |-
  A CRITICAL-CVE image reached production despite the scanner flagging it. The admission policy is configured in `warn` (audit) mode, so violations are logged but never actually block the deploy.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /supplychain/policy/admission.yaml`
        2. `grep -n 'validationAction\|enforcementAction' /supplychain/policy/admission.yaml`
        3. `journalctl -u admission-controller --no-pager | tail -20`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /supplychain/policy/admission.yaml` and read the status/error carefully.
        2. Cross-check with `grep -n 'validationAction\|enforcementAction' /supplychain/policy/admission.yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The admission policy validationAction is set to `Warn`/`Audit`, so CVE violations are logged but not enforced, letting vulnerable images through. Set the policy to enforce (`Deny`) for the CRITICAL rule so violating images are actually blocked at admission.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
