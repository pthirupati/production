tasks:
- id: task_1
  title: 'Vulnerability Gate Is in Warn-Only Mode'
  description: |-
    Restore healthy behavior for Vulnerability Gate Is in Warn-Only Mode by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This devsecops-supplychain lab teaches the difference between audit/warn and enforce modes in admission policy and why warn-only gates do not stop bad artifacts through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/devsecops-admission-policy-warn-only.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The admission policy validationAction is set to `Warn`/`Audit`, so CVE violations are logged but not enforced, letting vulnerable images through. Set the policy to enforce (`Deny`) for the CRITICAL rule so violating images are actually blocked at admission.
  files_changed: []
  commands_run:
  - 'cat /supplychain/policy/admission.yaml'
  - 'grep -n ''validationAction\|enforcementAction'' /supplychain/policy/admission.yaml'
  - 'journalctl -u admission-controller --no-pager | tail -20'
  reference_docs: devsecops-supplychain-fundamentals
