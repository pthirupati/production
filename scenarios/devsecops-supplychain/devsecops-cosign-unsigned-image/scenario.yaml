description: 'CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Cosign Verify
  Fails on Unsigned Image` during a realistic delivery incident. The business impact is a stalled or unsafe
  release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline supply-chain security lab with a local OCI registry,
  Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything
  runs locally; no external registry or paid APIs are required.


  SYMPTOM / STARTING STATE: Admission control blocks `analytics:3.0`: `cosign verify` fails with `no matching
  signatures`. The cluster policy requires images to be signed by the team''s key, but this image was
  pushed straight from a developer laptop without a signing step.


  OBJECTIVE: The image was never signed, so there is no signature for cosign to verify against the trusted
  key and the policy denies it. Remediate by signing the image with the team''s cosign key (in CI, keyless
  or key-based) so verification succeeds — do NOT disable the policy. Success is graded on the real repaired
  state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- analytics:3.0 is signed with the team's cosign key
- cosign verify --key succeeds (matching signature found)
- The signature-required policy stays enabled (not disabled to pass)
initial_state: 'Admission control blocks `analytics:3.0`: `cosign verify` fails with `no matching signatures`.
  The cluster policy requires images to be signed by the team''s key, but this image was pushed straight
  from a developer laptop without a signing step.'
