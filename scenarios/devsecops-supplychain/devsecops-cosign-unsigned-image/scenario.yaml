    \ the failing object.\n    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. The image was never signed, so there is no signature for\
    \ cosign to verify against the trusted key and the policy denies it. Remediate by signing the image\
