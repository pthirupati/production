description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Cosign Verify Rejects a Correctly-Signed Image` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: The admission gate rejects `worker:1.2` with `error verifying signature: key mismatch` even though CI signed it. The verification policy references an old public key that was rotated out of the signing pipeline.

  OBJECTIVE: The verification policy (`cosign verify --key`) uses a stale public key that no longer matches the current signing key, so valid signatures fail. Update the policy to the current cosign public key (or the correct keyless identity) so genuine signatures verify — do not skip verification. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'cosign verify accepts the correctly-signed image'
- 'The stale verification public key is confirmed as root cause'
- 'Signature verification passes without disabling the gate'
initial_state: |-
  The admission gate rejects `worker:1.2` with `error verifying signature: key mismatch` even though CI signed it. The verification policy references an old public key that was rotated out of the signing pipeline.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cosign verify --key /supplychain/cosign.pub worker:1.2`
        2. `cosign tree worker:1.2`
        3. `cat /supplychain/policy/verify.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cosign verify --key /supplychain/cosign.pub worker:1.2` and read the status/error carefully.
        2. Cross-check with `cosign tree worker:1.2` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The verification policy (`cosign verify --key`) uses a stale public key that no longer matches the current signing key, so valid signatures fail. Update the policy to the current cosign public key (or the correct keyless identity) so genuine signatures verify — do not skip verification.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
