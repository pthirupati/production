description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Provenance Rejected: Untrusted Builder ID` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: The admission policy rejects `service:1.9` with `provenance builder.id not in trusted set`. The attestation is valid but was produced by a builder identity the policy does not trust (a self-hosted runner).

  OBJECTIVE: The SLSA provenance is signed by a builder ID outside the policy's trusted builder set, so verification fails on origin, not integrity. Rebuild on the trusted/hardened builder (or add the correct hosted builder ID to the trust policy) so provenance verifies against an authorized builder. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Provenance verifies against a trusted builder ID'
- 'The untrusted builder identity is confirmed as root cause'
- 'The artifact is built by (or trusts) an authorized builder after the fix'
initial_state: |-
  The admission policy rejects `service:1.9` with `provenance builder.id not in trusted set`. The attestation is valid but was produced by a builder identity the policy does not trust (a self-hosted runner).
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cosign verify-attestation --type slsaprovenance --key /supplychain/cosign.pub service:1.9`
        2. `cat /supplychain/policy/slsa-trust.yaml`
        3. `cosign download attestation service:1.9 | jq '.payload' | head`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cosign verify-attestation --type slsaprovenance --key /supplychain/cosign.pub service:1.9` and read the status/error carefully.
        2. Cross-check with `cat /supplychain/policy/slsa-trust.yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The SLSA provenance is signed by a builder ID outside the policy's trusted builder set, so verification fails on origin, not integrity. Rebuild on the trusted/hardened builder (or add the correct hosted builder ID to the trust policy) so provenance verifies against an authorized builder.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
