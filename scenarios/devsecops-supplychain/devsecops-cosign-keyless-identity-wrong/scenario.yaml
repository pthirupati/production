description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Keyless Verify Trusts the Wrong Identity` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: The keyless verification policy for `svc:5.0` accepts signatures from any GitHub workflow, not just the trusted repo. A signature produced by an unrelated fork passes verification, defeating the gate.

  OBJECTIVE: The keyless `cosign verify` policy does not pin `--certificate-identity` and `--certificate-oidc-issuer`, so it accepts signatures from any Fulcio identity. Pin the exact expected signer identity and issuer so only signatures from the trusted workflow verify. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Verification accepts only the trusted signer identity/issuer'
- 'The unpinned keyless identity is confirmed as root cause'
- 'A signature from an untrusted identity is now rejected'
initial_state: |-
  The keyless verification policy for `svc:5.0` accepts signatures from any GitHub workflow, not just the trusted repo. A signature produced by an unrelated fork passes verification, defeating the gate.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /supplychain/policy/keyless-verify.sh`
        2. `cosign verify --certificate-identity-regexp '.*' --certificate-oidc-issuer-regexp '.*' svc:5.0`
        3. `cosign download signature svc:5.0 | jq '.[0].optional' | head`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /supplychain/policy/keyless-verify.sh` and read the status/error carefully.
        2. Cross-check with `cosign verify --certificate-identity-regexp '.*' --certificate-oidc-issuer-regexp '.*' svc:5.0` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The keyless `cosign verify` policy does not pin `--certificate-identity` and `--certificate-oidc-issuer`, so it accepts signatures from any Fulcio identity. Pin the exact expected signer identity and issuer so only signatures from the trusted workflow verify.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
