description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `SBOM Omits Bundled Java Dependencies` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: A Log4Shell-class CVE went undetected because the vulnerable jar was inside a fat JAR the SBOM never listed. The SBOM was generated at the OS-package level only and did not catalog application archives.

  OBJECTIVE: The SBOM was produced with a catalog scope that only inspects OS packages, so bundled application archives (fat JARs) are not enumerated and their CVEs are missed. Regenerate the SBOM with archive/deep cataloging enabled so nested dependencies are included and scannable. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The SBOM enumerates bundled application archive dependencies'
- 'The OS-only catalog scope is confirmed as root cause'
- 'Nested jar CVEs are detectable after deep cataloging'
initial_state: |-
  A Log4Shell-class CVE went undetected because the vulnerable jar was inside a fat JAR the SBOM never listed. The SBOM was generated at the OS-package level only and did not catalog application archives.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `syft dir:/supplychain/app -o table | grep -i jar`
        2. `cat /supplychain/sbom/config.yaml`
        3. `trivy sbom /supplychain/sbom/app.spdx.json`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `syft dir:/supplychain/app -o table | grep -i jar` and read the status/error carefully.
        2. Cross-check with `cat /supplychain/sbom/config.yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The SBOM was produced with a catalog scope that only inspects OS packages, so bundled application archives (fat JARs) are not enumerated and their CVEs are missed. Regenerate the SBOM with archive/deep cataloging enabled so nested dependencies are included and scannable.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
