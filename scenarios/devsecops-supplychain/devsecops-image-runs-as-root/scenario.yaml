description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Hardening Gate Fails: Image Runs as Root` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: The policy gate rejects `frontend:2.0` with `container must not run as root`. The Dockerfile never sets a `USER`, so the effective user is UID 0, violating the run-as-non-root policy.

  OBJECTIVE: The Dockerfile omits a non-root `USER` directive, so the container runs as root and fails the hardening policy. Add a dedicated non-root user (and chown the app dir) and set `USER` in the Dockerfile, then rebuild so the image runs unprivileged. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The rebuilt image runs as a non-root user'
- 'The missing USER directive is confirmed as root cause'
- 'The run-as-non-root policy passes after the fix'
initial_state: |-
  The policy gate rejects `frontend:2.0` with `container must not run as root`. The Dockerfile never sets a `USER`, so the effective user is UID 0, violating the run-as-non-root policy.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `docker image inspect frontend:2.0 --format '{{.Config.User}}'`
        2. `grep -n 'USER' Dockerfile`
        3. `trivy config Dockerfile`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `docker image inspect frontend:2.0 --format '{{.Config.User}}'` and read the status/error carefully.
        2. Cross-check with `grep -n 'USER' Dockerfile` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Dockerfile omits a non-root `USER` directive, so the container runs as root and fails the hardening policy. Add a dedicated non-root user (and chown the app dir) and set `USER` in the Dockerfile, then rebuild so the image runs unprivileged.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
