description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Internal Package Resolves From the Public Index` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: A build pulled `acme-internal-utils` from the public registry instead of the private one — a dependency-confusion vector. The package manager config lists the public index first with no scope pinning for internal packages.

  OBJECTIVE: The package-manager config resolves the internal package name from the public index (no scoped registry mapping), exposing a dependency-confusion attack. Pin the internal scope/namespace to the private registry (and disable public fallback for it) so internal packages only resolve from the trusted source. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The internal package resolves only from the private registry'
- 'The public-first resolution / missing scope pin is confirmed as root cause'
- 'Public fallback for internal scopes is disabled after the fix'
initial_state: |-
  A build pulled `acme-internal-utils` from the public registry instead of the private one — a dependency-confusion vector. The package manager config lists the public index first with no scope pinning for internal packages.
