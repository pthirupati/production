tasks:
- id: task_1
  title: 'Internal Package Resolves From the Public Index'
  description: |-
    Restore healthy behavior for Internal Package Resolves From the Public Index by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This devsecops-supplychain lab teaches how dependency confusion exploits public/private resolution order and how scoped registry pinning prevents it through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/devsecops-dependency-confusion-public-source.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The package-manager config resolves the internal package name from the public index (no scoped registry mapping), exposing a dependency-confusion attack. Pin the internal scope/namespace to the private registry (and disable public fallback for it) so internal packages only resolve from the trusted source.
  files_changed: []
  commands_run:
  - 'cat /supplychain/app/.npmrc'
  - 'grep -rn ''registry'' /supplychain/app/.npmrc'
  - 'npm config get registry'
  reference_docs: devsecops-supplychain-fundamentals
