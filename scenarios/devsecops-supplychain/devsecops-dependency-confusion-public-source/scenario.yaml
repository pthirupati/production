        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /supplychain/app/.npmrc` and read the status/error carefully.
        2. Cross-check with `grep -rn 'registry' /supplychain/app/.npmrc` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The package-manager config resolves the internal package name from the public index (no scoped registry mapping), exposing a dependency-confusion attack. Pin the internal scope/namespace to the private registry (and disable public fallback for it) so internal packages only resolve from the trusted source.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
