    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/devsecops-secret-scanner-excludes-yaml.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The secret-scanner config excludes YAML paths (a leftover exclusion), so secrets committed in manifests bypass detection. Remove the over-broad path exclusion so manifests are scanned, then re-run the scan so the hardcoded token is caught.
  files_changed: []
  commands_run:
  - 'cat /supplychain/secretscan/config.yaml'
  - 'grep -rn ''token\|password'' /supplychain/manifests'
  - 'trivy fs --scanners secret /supplychain/manifests'
  reference_docs: devsecops-supplychain-fundamentals
