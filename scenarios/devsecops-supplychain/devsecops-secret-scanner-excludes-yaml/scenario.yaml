description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Secret Scanner Skips Manifest Files` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: A hardcoded API token in a Kubernetes manifest committed straight to main. The pre-commit secret scanner has a config that excludes `*.yaml` paths, so manifest secrets are never scanned.

  OBJECTIVE: The secret-scanner config excludes YAML paths (a leftover exclusion), so secrets committed in manifests bypass detection. Remove the over-broad path exclusion so manifests are scanned, then re-run the scan so the hardcoded token is caught. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The scanner detects the hardcoded secret in the manifest'
- 'The YAML path exclusion is confirmed as root cause'
- 'Manifest files are in scope after the exclusion is removed'
initial_state: |-
