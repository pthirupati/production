- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /supplychain/secretscan/config.yaml`
        2. `grep -rn 'token\|password' /supplychain/manifests`
        3. `trivy fs --scanners secret /supplychain/manifests`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /supplychain/secretscan/config.yaml` and read the status/error carefully.
        2. Cross-check with `grep -rn 'token\|password' /supplychain/manifests` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The secret-scanner config excludes YAML paths (a leftover exclusion), so secrets committed in manifests bypass detection. Remove the over-broad path exclusion so manifests are scanned, then re-run the scan so the hardcoded token is caught.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
