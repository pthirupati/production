  title: 'Secret Scanner Skips Manifest Files'
  description: |-
    Restore healthy behavior for Secret Scanner Skips Manifest Files by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This devsecops-supplychain lab teaches how secret-scanner path filters work and why over-broad exclusions create committed-secret blind spots through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
