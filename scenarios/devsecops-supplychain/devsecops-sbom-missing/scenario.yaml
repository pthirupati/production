description: 'CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Release Rejected
  for Missing/Invalid SBOM` during a realistic delivery incident. The business impact is a stalled or
  unsafe release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline supply-chain security lab with a local OCI registry,
  Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything
  runs locally; no external registry or paid APIs are required.


  SYMPTOM / STARTING STATE: The release admission policy rejects `billing:2.1`: the attached SBOM is missing
  (no `sbom.spdx.json` attestation on the image) so the pipeline cannot enumerate components for license
  and vulnerability policy. Downstream compliance checks have nothing to read.


  OBJECTIVE: The build never generated and attached an SBOM, so there is no machine-readable inventory
  of what shipped. Remediate by generating the SBOM (syft) and attaching it as an attestation to the image,
  so the admission policy can read a valid component list. Success is graded on the real repaired state,
  not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- A valid SBOM (SPDX/CycloneDX) is generated for billing:2.1
- The SBOM is attached as an attestation the admission policy can verify
- The missing-SBOM root cause is fixed in the build, not stubbed with an empty file
initial_state: 'The release admission policy rejects `billing:2.1`: the attached SBOM is missing (no `sbom.spdx.json`
  attestation on the image) so the pipeline cannot enumerate components for license and vulnerability
  policy. Downstream compliance checks have nothing to read.'
