  cost: 25
  content: "Diagnostic steps:\n    1. Re-run `syft billing:2.1 -o spdx-json` and read the status/error\
    \ carefully.\n    2. Cross-check with `cosign download sbom billing:2.1` to isolate the failing object.\n\
    \    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. The build never generated and attached an SBOM, so there\
    \ is no machine-readable inventory of what shipped. Remediate by generating the SBOM (syft) and attaching\
    \ it as an attestation to the image, so the admission policy can read a valid component list.\n  \
    \  2. Change one thing at a time so you can roll back if the hypothesis was wrong.\n    3. Verify\
    \ the objective is met, then click Check Solution (graded on real state, not a marker file)."
