description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Build Uses an End-of-Life Base Image` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: Trivy reports dozens of unfixable HIGH/CRITICAL CVEs in `api:2.3`. The Dockerfile's `FROM` pins an end-of-life distro release that no longer receives security updates, so patches are simply unavailable.

  OBJECTIVE: The image builds on an EOL base tag whose distro no longer ships security fixes, so CVEs pile up with no upstream patch. Bump the base image to a supported release (e.g. the current LTS) and rebuild so the vulnerable packages are replaced with patched versions — do not add ignore rules for the EOL CVEs. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The image is rebuilt on a supported, patched base release'
- 'The EOL base tag is confirmed as the source of unfixable CVEs'
- 'CVEs are cleared by upgrading the base, not by ignore rules'
initial_state: |-
  Trivy reports dozens of unfixable HIGH/CRITICAL CVEs in `api:2.3`. The Dockerfile's `FROM` pins an end-of-life distro release that no longer receives security updates, so patches are simply unavailable.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `trivy image --severity HIGH,CRITICAL api:2.3`
        2. `grep -n 'FROM' Dockerfile`
        3. `trivy image --list-all-pkgs api:2.3 | head`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `trivy image --severity HIGH,CRITICAL api:2.3` and read the status/error carefully.
        2. Cross-check with `grep -n 'FROM' Dockerfile` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The image builds on an EOL base tag whose distro no longer ships security fixes, so CVEs pile up with no upstream patch. Bump the base image to a supported release (e.g. the current LTS) and rebuild so the vulnerable packages are replaced with patched versions — do not add ignore rules for the EOL CVEs.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
