tasks:
- id: task_1
  title: 'Build Uses an End-of-Life Base Image'
  description: |-
    Restore healthy behavior for Build Uses an End-of-Life Base Image by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This devsecops-supplychain lab teaches why end-of-life base images accumulate unfixable CVEs and how choosing a supported distro release restores patch availability through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/devsecops-base-image-eol-distro.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The image builds on an EOL base tag whose distro no longer ships security fixes, so CVEs pile up with no upstream patch. Bump the base image to a supported release (e.g. the current LTS) and rebuild so the vulnerable packages are replaced with patched versions — do not add ignore rules for the EOL CVEs.
  files_changed: []
  commands_run:
  - 'trivy image --severity HIGH,CRITICAL api:2.3'
  - 'grep -n ''FROM'' Dockerfile'
  - 'trivy image --list-all-pkgs api:2.3 | head'
  reference_docs: devsecops-supplychain-fundamentals
