description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Poisoned Build Cache Reintroduces a CVE` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: A rebuilt image still ships a package that was supposedly patched. A cached `RUN apt-get install` layer from a stale cache is reused, so the fixed version in the updated instruction is never actually installed.

  OBJECTIVE: A stale build-cache layer for the package-install step is reused because the cache key did not change, so the patched package is never fetched. Bust the cache for the install step (update the cache key / add a versioned invalidator or build --no-cache for that stage) so the patched packages are installed on rebuild. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The rebuild actually installs the patched package version'
- 'The reused stale cache layer is confirmed as root cause'
- 'The CVE is cleared after the install-step cache is invalidated'
initial_state: |-
  A rebuilt image still ships a package that was supposedly patched. A cached `RUN apt-get install` layer from a stale cache is reused, so the fixed version in the updated instruction is never actually installed.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `trivy image --severity CRITICAL app:rebuild`
        2. `grep -n 'apt-get\|RUN' Dockerfile`
        3. `docker history app:rebuild | head`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `trivy image --severity CRITICAL app:rebuild` and read the status/error carefully.
        2. Cross-check with `grep -n 'apt-get\|RUN' Dockerfile` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. A stale build-cache layer for the package-install step is reused because the cache key did not change, so the patched package is never fetched. Bust the cache for the install step (update the cache key / add a versioned invalidator or build --no-cache for that stage) so the patched packages are installed on rebuild.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
