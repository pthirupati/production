tasks:
- id: task_1
  title: 'Poisoned Build Cache Reintroduces a CVE'
  description: |-
    Restore healthy behavior for Poisoned Build Cache Reintroduces a CVE by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This devsecops-supplychain lab teaches how Docker layer caching keys on instruction text and why stale cache can silently reintroduce vulnerable packages through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/devsecops-build-cache-poisoned-layer.conf carries the FIXED-OK marker.
solution:
  summary: |-
    A stale build-cache layer for the package-install step is reused because the cache key did not change, so the patched package is never fetched. Bust the cache for the install step (update the cache key / add a versioned invalidator or build --no-cache for that stage) so the patched packages are installed on rebuild.
  files_changed: []
  commands_run:
  - 'trivy image --severity CRITICAL app:rebuild'
  - 'grep -n ''apt-get\|RUN'' Dockerfile'
  - 'docker history app:rebuild | head'
  reference_docs: devsecops-supplychain-fundamentals
