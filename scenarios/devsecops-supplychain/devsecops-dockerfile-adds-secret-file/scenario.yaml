  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `trivy image --scanners secret web:4.0`
        2. `grep -n 'COPY\|ADD' Dockerfile`
        3. `ls -a /supplychain/build-context`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `trivy image --scanners secret web:4.0` and read the status/error carefully.
        2. Cross-check with `grep -n 'COPY\|ADD' Dockerfile` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Dockerfile does a broad `COPY . .` with no `.dockerignore`, so a `.env` secret is baked into a layer where it persists in history. Add a `.dockerignore` excluding secret files (and scope the COPY), then rebuild so the secret is no longer present in any layer.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
