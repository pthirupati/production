description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Build Copies a .env Secret Into the Image` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: A history scan of `web:4.0` finds an intermediate layer containing a `.env` file with a live database password. The Dockerfile `COPY . .` pulls the whole context, including secrets, into the image.

  OBJECTIVE: The Dockerfile does a broad `COPY . .` with no `.dockerignore`, so a `.env` secret is baked into a layer where it persists in history. Add a `.dockerignore` excluding secret files (and scope the COPY), then rebuild so the secret is no longer present in any layer. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The rebuilt image contains no secret file in any layer'
- 'The broad COPY without .dockerignore is confirmed as root cause'
- 'The .env is excluded from the build context after the fix'
initial_state: |-
  A history scan of `web:4.0` finds an intermediate layer containing a `.env` file with a live database password. The Dockerfile `COPY . .` pulls the whole context, including secrets, into the image.
