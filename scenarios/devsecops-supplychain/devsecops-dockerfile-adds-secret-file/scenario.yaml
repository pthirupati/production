tasks:
- id: task_1
  title: 'Build Copies a .env Secret Into the Image'
  description: |-
    Restore healthy behavior for Build Copies a .env Secret Into the Image by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This devsecops-supplychain lab teaches how Docker layers persist copied files in history and why .dockerignore plus scoped COPY prevents secret leakage through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/devsecops-dockerfile-adds-secret-file.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The Dockerfile does a broad `COPY . .` with no `.dockerignore`, so a `.env` secret is baked into a layer where it persists in history. Add a `.dockerignore` excluding secret files (and scope the COPY), then rebuild so the secret is no longer present in any layer.
  files_changed: []
  commands_run:
  - 'trivy image --scanners secret web:4.0'
  - 'grep -n ''COPY\|ADD'' Dockerfile'
  - 'ls -a /supplychain/build-context'
  reference_docs: devsecops-supplychain-fundamentals
