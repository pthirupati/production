tasks:
- id: task_1
  title: Secret Baked Into an Image Layer
  description: Restore healthy behavior for Secret Baked Into an Image Layer by reproducing the diagnosis
    from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating
