    error_message: The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root
      cause, and apply the documented remediation so /opt/fixitlab/academy/devsecops-secret-leaked-layer.conf
      carries the FIXED-OK marker.
solution:
  summary: Copying the .env into the image writes the secret into an immutable layer; deleting it later
    does not remove it from image history. Remediate by removing the secret from the build (use build
    secrets / runtime env, add .env to .dockerignore) AND rebuilding so no layer carries the credential
    — then the leaked key must be rotated.
  files_changed: []
  commands_run:
  - trivy image --scanners secret reporting:5.4
  - docker history reporting:5.4
  - grep -rn 'COPY .env' Dockerfile
  reference_docs: devsecops-supplychain-fundamentals
