description: 'CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Secret Baked
  Into an Image Layer` during a realistic delivery incident. The business impact is a stalled or unsafe
  release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline supply-chain security lab with a local OCI registry,
  Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything
  runs locally; no external registry or paid APIs are required.


  SYMPTOM / STARTING STATE: A secret scanner found an AWS access key embedded in an image layer of `reporting:5.4`:
  an early Dockerfile step `COPY .env /app/` baked credentials into the image history, where they persist
  even if a later layer deletes the file. The credential is exposed to anyone who pulls the image.


  OBJECTIVE: Copying the .env into the image writes the secret into an immutable layer; deleting it later
  does not remove it from image history. Remediate by removing the secret from the build (use build secrets
  / runtime env, add .env to .dockerignore) AND rebuilding so no layer carries the credential — then the
  leaked key must be rotated. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The Dockerfile no longer copies secrets into any image layer
- trivy secret scan of the rebuilt image reports no embedded credential
- The leaked credential is flagged for rotation (root cause fully addressed)
