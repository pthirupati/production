description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `CI Scans a Different Image Than It Ships` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: The pipeline reports a clean scan but prod runs a vulnerable image. CI scans `app:latest` while the build step pushes `app:${GIT_SHA}`, so the scan and the shipped artifact are two different images.

  OBJECTIVE: The scan step and the push step reference different image references (latest vs the commit-SHA tag), so CI never scans the artifact it actually ships. Align the scan to the exact built reference (the SHA tag/digest) so the shipped image is the one that is scanned and gated. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'CI scans the exact image reference it ships'
- 'The scan/push reference mismatch is confirmed as root cause'
- 'The gate evaluates the shipped artifact after references are aligned'
initial_state: |-
  The pipeline reports a clean scan but prod runs a vulnerable image. CI scans `app:latest` while the build step pushes `app:${GIT_SHA}`, so the scan and the shipped artifact are two different images.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `grep -n 'trivy image\|docker push\|tag' /supplychain/ci/pipeline.sh`
        2. `crane digest app:latest`
        3. `trivy image --severity HIGH,CRITICAL app:latest`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `grep -n 'trivy image\|docker push\|tag' /supplychain/ci/pipeline.sh` and read the status/error carefully.
        2. Cross-check with `crane digest app:latest` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The scan step and the push step reference different image references (latest vs the commit-SHA tag), so CI never scans the artifact it actually ships. Align the scan to the exact built reference (the SHA tag/digest) so the shipped image is the one that is scanned and gated.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
