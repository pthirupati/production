tasks:
- id: task_1
  title: 'Falco Misses a Privilege-Escalation Event'
  description: |-
    Restore healthy behavior for Falco Misses a Privilege-Escalation Event by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This devsecops-supplychain lab teaches how Falco rules detect runtime threats and why disabling a rule to reduce noise creates a detection blind spot through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/devsecops-falco-rule-disabled-privesc.conf carries the FIXED-OK marker.
solution:
  summary: |-
    A Falco rule for privilege escalation was disabled during noise reduction and never re-enabled, so the sensor no longer detects in-container privesc. Re-enable the rule (and tune with exceptions instead of disabling) so the escalation event triggers an alert.
  files_changed: []
  commands_run:
  - 'falco --list | grep -i escalation'
  - 'grep -rn ''enabled: false'' /supplychain/falco'
  - 'journalctl -u falco --no-pager | tail -30'
  reference_docs: devsecops-supplychain-fundamentals
