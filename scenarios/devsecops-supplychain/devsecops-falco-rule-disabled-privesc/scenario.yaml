description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Falco Misses a Privilege-Escalation Event` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: A red-team test ran `sudo` inside a container and no alert fired. The Falco rules config has the privilege-escalation rule disabled (a leftover from noise tuning), so the event is silently ignored.

  OBJECTIVE: A Falco rule for privilege escalation was disabled during noise reduction and never re-enabled, so the sensor no longer detects in-container privesc. Re-enable the rule (and tune with exceptions instead of disabling) so the escalation event triggers an alert. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The privilege-escalation event triggers a Falco alert'
- 'The disabled Falco rule is confirmed as root cause'
- 'Detection is restored by re-enabling (not deleting) the rule'
initial_state: |-
  A red-team test ran `sudo` inside a container and no alert fired. The Falco rules config has the privilege-escalation rule disabled (a leftover from noise tuning), so the event is silently ignored.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `falco --list | grep -i escalation`
        2. `grep -rn 'enabled: false' /supplychain/falco`
        3. `journalctl -u falco --no-pager | tail -30`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `falco --list | grep -i escalation` and read the status/error carefully.
        2. Cross-check with `grep -rn 'enabled: false' /supplychain/falco` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. A Falco rule for privilege escalation was disabled during noise reduction and never re-enabled, so the sensor no longer detects in-container privesc. Re-enable the rule (and tune with exceptions instead of disabling) so the escalation event triggers an alert.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
