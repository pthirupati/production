solution:
  summary: |-
    The deployment references a mutable tag (`:latest`) instead of an immutable digest, so the running image can differ from the scanned/signed one after a re-push. Pin the deployment to the image digest (`@sha256:...`) so the verified artifact is exactly what runs.
  files_changed: []
  commands_run:
  - 'crane digest app:latest'
  - 'grep -rn ''image:'' /supplychain/deploy'
  - 'cosign verify --key /supplychain/cosign.pub app:latest'
  reference_docs: devsecops-supplychain-fundamentals
