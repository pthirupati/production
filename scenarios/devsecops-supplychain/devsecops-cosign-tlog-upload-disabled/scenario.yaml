tasks:
- id: task_1
  title: 'Signatures Not Recorded in the Transparency Log'
  description: |-
    Restore healthy behavior for Signatures Not Recorded in the Transparency Log by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This devsecops-supplychain lab teaches how the Rekor transparency log makes signatures auditable and why disabling tlog upload weakens supply-chain accountability through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/devsecops-cosign-tlog-upload-disabled.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The signing pipeline sets `COSIGN_EXPERIMENTAL=0` / uses `--tlog-upload=false`, so signatures skip the Rekor transparency log and lose auditability. Enable transparency-log upload during signing so each signature is recorded and independently verifiable.
  files_changed: []
  commands_run:
  - 'grep -n ''tlog-upload\|COSIGN'' /supplychain/ci/sign.sh'
  - 'cosign verify --key /supplychain/cosign.pub --insecure-ignore-tlog=false app:1.0'
  - 'cat /supplychain/ci/sign.sh'
  reference_docs: devsecops-supplychain-fundamentals
