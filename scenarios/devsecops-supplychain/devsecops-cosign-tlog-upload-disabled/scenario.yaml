description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Signatures Not Recorded in the Transparency Log` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: An auditor cannot find any Rekor entries for recently signed images. The signing step runs with transparency-log upload disabled, so signatures exist but are not publicly verifiable/auditable.

  OBJECTIVE: The signing pipeline sets `COSIGN_EXPERIMENTAL=0` / uses `--tlog-upload=false`, so signatures skip the Rekor transparency log and lose auditability. Enable transparency-log upload during signing so each signature is recorded and independently verifiable. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'New signatures are recorded in the transparency log'
- 'The disabled tlog upload is confirmed as root cause'
- 'Signatures become auditable via Rekor after upload is enabled'
initial_state: |-
  An auditor cannot find any Rekor entries for recently signed images. The signing step runs with transparency-log upload disabled, so signatures exist but are not publicly verifiable/auditable.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `grep -n 'tlog-upload\|COSIGN' /supplychain/ci/sign.sh`
        2. `cosign verify --key /supplychain/cosign.pub --insecure-ignore-tlog=false app:1.0`
        3. `cat /supplychain/ci/sign.sh`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `grep -n 'tlog-upload\|COSIGN' /supplychain/ci/sign.sh` and read the status/error carefully.
        2. Cross-check with `cosign verify --key /supplychain/cosign.pub --insecure-ignore-tlog=false app:1.0` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The signing pipeline sets `COSIGN_EXPERIMENTAL=0` / uses `--tlog-upload=false`, so signatures skip the Rekor transparency log and lose auditability. Enable transparency-log upload during signing so each signature is recorded and independently verifiable.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
