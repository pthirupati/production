description: 'CONTEXT: A team operating devsecops supplychain has raised a ticket for `Signatures Not
  Recorded in the Transparency Log`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline FixitLab lab environment. The architecture is a
  single lab-primary node exposing CLI and configuration files; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: An auditor cannot find any Rekor entries for recently signed images. The signing
  step runs with transparency-log upload disabled, so signatures exist but are not publicly verifiable/auditable.

  OBJECTIVE: New signatures are recorded in the transparency log; The disabled tlog upload is confirmed
  as root cause; Signatures become auditable via Rekor after upload is enabled. Acceptance criteria: the
  change is minimal and reversible, and success means `check.sh` exits successfully.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant CLI and configuration files), changing one thing at a time. Check your work continuously
  against the objective — success means `check.sh` exits successfully.

  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'New signatures are recorded in the transparency log'
- 'The disabled tlog upload is confirmed as root cause'
- 'Signatures become auditable via Rekor after upload is enabled'
