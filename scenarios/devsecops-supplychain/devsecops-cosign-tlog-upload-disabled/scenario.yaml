  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For signatures not recorded in the transparency log problems the
    reliable method is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the
    one component that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying
    misconfiguration you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    1. Inspect the current state with SCA, image scanning, signing, and policy gates.

    2. Each command above tells you something specific — status/health, recent errors, and the effective
    configuration. Read them in that order.

    3. Compare what you see to the objectives; the gap points at the fault.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of signatures not recorded in the transparency
    log is at fault.

    2. Re-run the most relevant of SCA, image scanning, signing, and policy gates focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''signatures not
    recorded in the transparency log is not behaving as the scenario objectives require'' toward ''`check.sh`
    exits successfully''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the smallest reversible change your hypothesis points to. Fix the underlying misconfiguration
