description: 'CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Falco Alert:
  Unexpected Shell in Container` during a realistic delivery incident. The business impact is a stalled
  or unsafe release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline supply-chain security lab with a local OCI registry,
  Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything
  runs locally; no external registry or paid APIs are required.


  SYMPTOM / STARTING STATE: Falco fired a Warning: `Terminal shell in container` for the `web` pod — a
  `/bin/bash` was spawned inside a container that should never run an interactive shell. The runtime rule
  flagged the exec as a potential intrusion or unauthorized debugging on a production workload.


  OBJECTIVE: A sidecar/init step (or a leftover debug entrypoint) is spawning an interactive shell in
  the container at runtime, which Falco''s macro correctly flags. Remediate by removing the shell-spawning
  step from the workload (the real change) so the offending exec no longer occurs — do NOT silence the
  Falco rule to hide the alert. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The unexpected shell exec is eliminated from the web workload
- Falco no longer fires the shell-in-container alert for the web pod
- The detection rule is left intact (alert fixed at the source, not suppressed)
