solution:
  summary: A sidecar/init step (or a leftover debug entrypoint) is spawning an interactive shell in the
    container at runtime, which Falco's macro correctly flags. Remediate by removing the shell-spawning
    step from the workload (the real change) so the offending exec no longer occurs — do NOT silence the
    Falco rule to hide the alert.
  files_changed: []
  commands_run:
  - cat /supplychain/falco/falco_events.log
  - cat /supplychain/falco/rules/shell_in_container.yaml
  - ps aux --forest
  reference_docs: devsecops-supplychain-fundamentals
