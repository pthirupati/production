solution:
  summary: |-
    The registry is configured with anonymous/no-auth access for push, so untrusted parties can overwrite images. Enable authentication and restrict push to authorized identities (token/basic auth + RBAC) so only trusted pipelines can publish images.
  files_changed: []
  commands_run:
  - 'cat /supplychain/registry/config.yml'
  - 'curl -s -X POST http://localhost:5000/v2/test/blobs/uploads/ -o /dev/null -w ''%{http_code}\n'''
  - 'grep -n ''auth'' /supplychain/registry/config.yml'
  reference_docs: devsecops-supplychain-fundamentals
