description: |-
  CONTEXT: A platform team operating devsecops supplychain needs you to resolve `Internal Registry Allows Anonymous Push` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline supply-chain security lab with a local OCI registry, Trivy scanner, cosign keys, an SBOM store, and a Falco runtime sensor under /supplychain. Everything runs locally; no external registry or paid APIs are required.

  SYMPTOM / STARTING STATE: An audit finds the internal OCI registry accepts unauthenticated pushes, so anyone on the network could overwrite trusted tags. The registry auth config was left in an open/no-auth state after a migration.

  OBJECTIVE: The registry is configured with anonymous/no-auth access for push, so untrusted parties can overwrite images. Enable authentication and restrict push to authorized identities (token/basic auth + RBAC) so only trusted pipelines can publish images. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Anonymous push to the registry is rejected'
- 'The open no-auth registry config is confirmed as root cause'
- 'Push is restricted to authenticated, authorized identities after the fix'
initial_state: |-
  An audit finds the internal OCI registry accepts unauthenticated pushes, so anyone on the network could overwrite trusted tags. The registry auth config was left in an open/no-auth state after a migration.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /supplychain/registry/config.yml`
        2. `curl -s -X POST http://localhost:5000/v2/test/blobs/uploads/ -o /dev/null -w '%{http_code}\n'`
        3. `grep -n 'auth' /supplychain/registry/config.yml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /supplychain/registry/config.yml` and read the status/error carefully.
        2. Cross-check with `curl -s -X POST http://localhost:5000/v2/test/blobs/uploads/ -o /dev/null -w '%{http_code}\n'` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The registry is configured with anonymous/no-auth access for push, so untrusted parties can overwrite images. Enable authentication and restrict push to authorized identities (token/basic auth + RBAC) so only trusted pipelines can publish images.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
