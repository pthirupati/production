title: Wire an n8n-style order-lookup flow
slug: agent-n8n-order-lookup-flow
category: Fix
description: 'CONTEXT: A team operating AI/ML workflows needs you to resolve `Wire an n8n-style order-lookup
  flow` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace with datasets, training scripts,
  metrics, and model artifacts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The canvas has a Webhook trigger (carrying a raw JSON body string), a disconnected
  Order API http_get tool, and an Output node. Nothing is wired and the body is never parsed — you must
  build the parsing and extraction steps and connect the whole chain. A webhook delivers a raw customer
  message as a JSON body, and the team wants an automation that parses it, pulls out the order id and
  email with a deterministic extractor, then calls the Order API to fetch the order status. Wire the n8n-style
  flow in the Agent Workflow simulator. All tools are canned and local — no external HTTP, no paid LLM.


  OBJECTIVE: Open the Agent Workflow simulator from the lab toolbar; Add a Transform node (op json_parse)
  to turn the raw webhook body string into structured fields; Add an LLM node in extract mode to pull
  the order id and email out of the message text. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
