title: Wire an n8n-style order-lookup flow
slug: agent-n8n-order-lookup-flow
category: Fix
description: 'CONTEXT: A team operating AI/ML workflows has raised a ticket for `Wire an n8n-style order-lookup
  flow`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace. The architecture is a single
  lab-primary node exposing datasets, training scripts, metrics, and model artifacts; treat it as the
  production host for this incident. All tools run locally — no paid APIs or external cloud calls are
  required.


  SYMPTOM / STARTING STATE: The canvas has a Webhook trigger (carrying a raw JSON body string), a disconnected
  Order API http_get tool, and an Output node. Nothing is wired and the body is never parsed — you must
  build the parsing and extraction steps and connect the whole chain.


  OBJECTIVE: Open the Agent Workflow console from the lab toolbar; Add a Transform node (op json_parse)
  to turn the raw webhook body string into structured fields; Add an LLM node in extract mode to pull
  the order id and email out of the message text. Acceptance criteria: the change is minimal and reversible,
  and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant datasets, training scripts, metrics, and model artifacts), changing one thing at
  a time. Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
