description: 'CONTEXT: A team operating AI/ML workflows has raised a ticket for `Configuration Drift —
  Observability Lab`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace. The architecture is a single
  lab-primary node exposing datasets, training scripts, metrics, and model artifacts; treat it as the
  production host for this incident. All tools run locally — no paid APIs or external cloud calls are
  required.

  SYMPTOM / STARTING STATE: The system runs, but configuration drift lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality.

  OBJECTIVE: Day-2 configuration drift work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Acceptance criteria: the change
  is minimal and reversible, and success means success means `grep -q FIXED-OK /opt/fixitlab/academy/academy-ai-ml-058-observability-drift-6.conf`
  succeeds after the documented fix.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant datasets, training scripts, metrics, and model artifacts), changing one thing at
  a time. Check your work continuously against the objective — success means success means `grep -q FIXED-OK
  /opt/fixitlab/academy/academy-ai-ml-058-observability-drift-6.conf` succeeds after the documented fix.

  VERIFY: Re-run the same check the grader uses and confirm success means `grep -q FIXED-OK /opt/fixitlab/academy/academy-ai-ml-058-observability-drift-6.conf`
  succeeds after the documented fix. Capture the before/after output as evidence. Success criteria: the
  objective''s healthy state holds on a repeat check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
