description: 'CONTEXT: A team operating AI/ML workflows needs you to resolve `ai-ml: Configuration Drift
  — Observability Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace with datasets, training scripts,
  metrics, and model artifacts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The system runs, but configuration drift lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality. Observability task: make configuration drift visible in
  logs, metrics, or traces. On-call should answer ''what is broken?'' quickly using signals from detecting
  and reconciling out-of-band changes.


  OBJECTIVE: Day-2 configuration drift work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 configuration drift work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but configuration drift lacks useful telemetry. Dashboards/alerts are
  blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `terraform plan -refresh-only` and state.

    2. Write down what looks normal versus wrong or missing for configuration drift.

    3. Recall the core idea: detecting and reconciling out-of-band changes. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Changes are verified with before/after checks

    2. The system remains stable for dependent teams'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `terraform plan -refresh-only` and state.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a sensible threshold.

    3. Verify the result — plan is clean after reconciling drift.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
