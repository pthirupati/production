tasks:
- id: task_1
  title: Ml Datasets — Learn Lab
  description: Learn the dataset vocabulary (schema, label, split, leakage), then establish why the model-server
    inference unit is down from systemctl and journalctl evidence and bring it back to active.
  background: 'This lab pairs ML vocabulary with the ops habit that supports it: read the journal before
    you restart, because the evidence for why a service stopped disappears the moment it comes back up.'
  validation:
    type: service_active
    command: systemctl is-active model-server
    expected_status: active
    error_message: The model-server service is not active yet. Check `systemctl status model-server` and
      `journalctl -u model-server --no-pager`.
solution:
  summary: The model-server unit is enabled and loaded but exited non-zero, leaving it failed. Read the
    journal for the exit evidence, then start the unit and confirm it reports active.
  files_changed: []
  commands_run:
  - systemctl --failed
  - systemctl status model-server
  - journalctl -u model-server --no-pager
  - systemctl start model-server
  - systemctl is-active model-server
  reference_docs: ai-ml-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Scope the fault to one unit
    instruction: List every failed unit on the host before looking at any single one.
    command: systemctl --failed
    expected_output: model-server.service listed as failed
    explanation: Starting host-wide tells you whether this is one broken service or a wider problem. It
      costs one command and prevents tunnel vision.
    next_on: command_success
  - step: 2
    title: Read the unit's state
    instruction: Inspect model-server's loaded, enabled, and active state.
    command: systemctl status model-server
    expected_output: 'Loaded: loaded, enabled; Active: failed (Result: exit-code)'
    explanation: Three independent facts. Enabled means it should have started at boot; failed with exit-code
      means it did start and then the process exited non-zero — not a missing unit file.
    next_on: command_success
  - step: 3
    title: Read the journal before restarting
    instruction: Print the unit's log history and find the exit evidence.
    command: journalctl -u model-server --no-pager
    expected_output: '"main process exited, code=exited, status=1/FAILURE"'
    explanation: This is the habit the lab exists to build. A restart erases the running evidence; capture
      it first or you cannot explain the failure later.
    next_on: command_success
  - step: 4
    title: Bring the inference server up
    instruction: Start the unit now that you have recorded why it was down.
    command: systemctl start model-server
    expected_output: No output — systemctl is silent on success
    explanation: A minimal, reversible action. `systemctl stop model-server` undoes it if you want to
      observe the failure state again.
    next_on: command_success
  - step: 5
    title: Verify with the grader's check
    instruction: Run the same verification the checker uses.
    command: systemctl is-active model-server
    expected_output: active
    explanation: The lab passes only when real service state is healthy. Re-read the journal too — a clean
      "Started" line after the old failure confirms the restart actually succeeded.
    next_on: command_success
