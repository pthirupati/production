description: 'CONTEXT: This is your first ML lab, and it is deliberately not an outage. You are the ops
  engineer for a small ML team. Before you can reason about *why a model is wrong*, you have to be able
  to reason about *whether the thing serving it is even running* — and you have to know the vocabulary
  the data scientists will use when they page you. This lab covers both: the vocabulary first, then a
  real service you bring up yourself.

  ENVIRONMENT: A single node, `lab-primary`, running the offline ML practice workspace. It hosts one systemd
  unit, `model-server` (the ML Model Inference Server) — the process that loads a trained model into memory
  and answers prediction requests. Everything runs locally; no paid APIs or cloud calls.

  CONCEPTS — read this before you touch anything, because these four words explain every dataset bug
  you will be paged about:

  • SCHEMA — the agreed shape of your data: which columns exist, their types, and their units. Training
  and serving must use the *same* schema. A model trained on a price column in dollars, served a column
  in cents, is silently wrong — no error, just bad predictions.

  • LABEL — the answer column, the value you are teaching the model to predict. Everything else is a feature.
  Labels are usually the expensive part of a dataset because a human had to produce them, and they are
  where errors quietly enter.

  • SPLIT — datasets are divided into train / validation / test subsets. You fit on train, tune on validation,
  and touch test once at the end. The split exists so you can measure performance on data the model has
  never seen.

  • LEAKAGE — when information from outside the training subset sneaks into it: the same row appearing
  in both train and test, or a feature that secretly encodes the label. Leakage is the reason for the
  classic symptom "great validation metrics, terrible production performance". If a data scientist reports
  that, leakage is the first hypothesis — and it is a *data* bug, not a server bug.

  SYMPTOM / STARTING STATE: The workspace is online, but the model-server unit is not running. Nothing
  is on fire and no customer is affected — this is a practice node, so read state carefully before changing
  it.

  OBJECTIVE: Learn the dataset vocabulary above, and learn to establish service state from evidence instead
  of assumption. Determine what state model-server is in and why, then bring it up. Acceptance criteria:
  the change is minimal and reversible, and `systemctl is-active model-server` returns `active`.

  WORK TO DO: Do not start the service first. Answer these in order: (1) Which units on this host are
  failed? (2) Is model-server enabled to start at boot, and is it currently loaded? (3) What did the journal
  record when it last tried to start? Only then start the unit. The habit being built is journal-before-restart:
  restarting first destroys the evidence that explains why it stopped.

  VERIFY: Re-run the check the grader uses — `systemctl is-active model-server` — and confirm it prints
  `active`. Then re-read `journalctl -u model-server` and note that the failure lines are now followed
  by a clean startup. Success criteria: the healthy state holds on a repeat check, not just once.

  ROLLBACK: Every action here is reversible with `systemctl stop model-server`. If you want to confirm
  cause and effect, stop the unit, watch `systemctl is-active` flip back to inactive, and start it again.

  WHAT TO AVOID: Do not skip straight to `systemctl start` — you will pass the checker and learn nothing
  about why it was down. Do not edit the unit file; nothing is wrong with it. Do not fake completion with
  marker files — the checker reads real service state.'
objectives:
- Define schema, label, split, and leakage, and explain why leakage produces strong validation metrics
  with weak production performance
- Establish model-server's real state from systemctl and journalctl evidence before changing anything
- Bring the inference server to active and confirm the healthy state holds on a repeat check
initial_state: The ML practice workspace is online and reachable, but the model-server unit is not running
  — it exited non-zero on its last start attempt and systemd left it failed. The journal still holds that
  attempt. Nothing is on fire — focus on observation before you restart anything.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. Two things are being taught here and they are separate. First, the vocabulary
    in the CONTEXT section — schema, label, split, leakage — which is what a data scientist means when
    they say "training metrics look great but production performance collapsed" (that specific sentence
    describes leakage, a dataset problem). Second, the hands-on skill: on this host the inference *service*
    is down, and your job is to establish that from evidence rather than assumption.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Read state before you change state. The order that works for any systemd service is: (1) which units
    are failed, (2) what does this unit''s status say — loaded, enabled, and why it stopped, (3) what
    does the journal show from the last attempt, (4) only now, act. Restarting first is the most common
    beginner mistake: the service comes back, the evidence is gone, and it fails again that night with
    nobody able to say why.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    `systemctl --failed` lists every unit in a failed state on the host. `systemctl status model-server`
    shows loaded/enabled/active for one unit and the reason it stopped. `journalctl -u model-server --no-pager`
    prints that unit''s log history. `systemctl cat model-server` shows the unit file itself if you suspect
    the definition.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. `systemctl --failed` — model-server appears, so the fault is scoped to this unit, not the whole
    host.

    2. `systemctl status model-server` — note three separate facts: Loaded (systemd can read the unit
    file), enabled (it is meant to start at boot), and Active: failed with Result: exit-code (the process
    started and then exited non-zero).

    3. `journalctl -u model-server --no-pager` — the line "main process exited, code=exited, status=1/FAILURE"
    is the root evidence. Enabled-but-failed is a different diagnosis from disabled-and-never-started.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Start the unit: `systemctl start model-server`.

    2. Confirm with `systemctl is-active model-server` — it should print `active`.

    3. Re-read `journalctl -u model-server --no-pager` and confirm the old failure lines are now followed
    by "Server startup complete" and "Started ML Model Inference Server".

    WHY: the grader checks real service state, not marker files — and reading the journal after the fix
    is how you confirm the restart actually succeeded rather than merely being requested.'
summary: Learn the dataset vocabulary — schema, labels, splits, and leakage — then establish and restore
  the state of an ML inference service from systemd and journal evidence
