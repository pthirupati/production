title: Fix the misrouting billing-escalation agent
slug: agent-fix-misrouted-escalation
category: Fix
description: 'CONTEXT: A team operating AI/ML workflows needs you to resolve `Fix the misrouting billing-escalation
  agent` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace with datasets, training scripts,
  metrics, and model artifacts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The full graph already exists but is wired wrong on three counts — the LLM
  is in summarize mode, the condition compares sentiment==positive, and the send_notification tool sits
  on the false branch while a db_query sits on the true branch. The escalation never fires. An existing
  triage agent is supposed to escalate high-priority billing tickets, but it is broken. The "LLM" node
  is summarising instead of classifying, the condition checks the wrong field, and the escalation is wired
  to the wrong branch so it calls a logging query instead of paging the billing team. Debug the agent
  in the Agent Workflow simulator and make the refund ticket escalate correctly. Everything is deterministic
  and local.


  OBJECTIVE: Open the Agent Workflow simulator and run the broken flow to see what it currently does;
  Reconfigure the LLM node from summarize mode to classify mode so it produces a category and priority;
  Fix the Condition node to detect a high-priority ticket (field priority, equals high). Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
