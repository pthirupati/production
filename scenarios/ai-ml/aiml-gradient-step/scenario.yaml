title: One Gradient-Descent Step by Hand
slug: aiml-gradient-step
technology: ai-ml
category: AI / ML / LLM & Agents
description: Every neural network ultimately reduces to this single move — predict, measure the error,
  nudge the weights downhill. Implement the logistic prediction (sigmoid of a linear combination),
  the binary cross-entropy loss, and a single gradient-descent weight update over a tiny fixed
  dataset, all in stdlib math. One honest step is the whole of training in miniature.
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: High
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Implement a numerically stable sigmoid
- Predict with a linear combination plus bias, then apply the sigmoid
- Apply one full-batch gradient-descent update to the weights and bias
initial_state: Every neural network ultimately reduces to this single move — predict, measure the error,
  nudge the weights downhill. Implement the logistic prediction (sigmoid of a linear combination),
  the binary cross-entropy loss, and a single gradient-descent weight update over a tiny fixed
  dataset, all in stdlib math. One honest step is the whole of training in miniature.
solution_explanation: |
  sigmoid(z) = 1 / (1 + e^-z), guarded for large-magnitude z so it never overflows. predict computes
  the dot product of weights and features plus the bias, then squashes it through the sigmoid.
  gradient_step runs one full-batch update: for each example the error is (prediction - label); the
  gradient for weight j is the mean over the batch of error * feature_j, and the bias gradient is the
  mean error. Each parameter moves against its gradient scaled by the learning rate
  (w_j -= lr * grad_j). Because the data, weights, and learning rate are fixed, the updated
  parameters are fully deterministic, and the loss after the step is lower than before.
