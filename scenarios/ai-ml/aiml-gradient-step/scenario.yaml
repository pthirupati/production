  visible_tests:
  - name: sigmoid at zero is 0.5
    code: |
      import math
      assert math.isclose(sigmoid(0), 0.5, rel_tol=1e-9), sigmoid(0)
  - name: prediction uses weights and bias
    code: |
      import math
      # weights=[2], bias=0, x=[1] -> sigmoid(2)
      assert math.isclose(predict([2.0], 0.0, [1.0]), 1 / (1 + math.exp(-2)), rel_tol=1e-9), predict([2.0], 0.0, [1.0])
  hidden_tests:
  - name: sigmoid is stable for large magnitudes
    code: |
      import math
      assert math.isclose(sigmoid(1000), 1.0, abs_tol=1e-9), sigmoid(1000)
      assert math.isclose(sigmoid(-1000), 0.0, abs_tol=1e-9), sigmoid(-1000)
  - name: sigmoid is symmetric
    code: |
      import math
      assert math.isclose(sigmoid(3) + sigmoid(-3), 1.0, rel_tol=1e-9), (sigmoid(3), sigmoid(-3))
  - name: one gradient step is deterministic and exact
    code: |
      import math
      # Start at all zeros: every prediction is 0.5, so error = 0.5 - label.
      data = [([1.0, 0.0], 1), ([0.0, 1.0], 0)]
      w, b = gradient_step([0.0, 0.0], 0.0, data, lr=1.0)
      # errors: ex0 = 0.5-1 = -0.5 ; ex1 = 0.5-0 = 0.5
      # grad_w0 = mean(-0.5*1, 0.5*0) = -0.25 ; grad_w1 = mean(-0.5*0, 0.5*1) = 0.25
      # grad_b  = mean(-0.5, 0.5) = 0.0
      assert math.isclose(w[0], 0.25, rel_tol=1e-9), w
      assert math.isclose(w[1], -0.25, rel_tol=1e-9), w
      assert math.isclose(b, 0.0, abs_tol=1e-9), b
  - name: a step lowers the loss on a separable point
    code: |
      def bce(weights, bias, data):
          import math
          eps = 1e-12
          total = 0.0
          for feats, label in data:
              p = predict(weights, bias, feats)
              p = min(max(p, eps), 1 - eps)
              total += -(label * math.log(p) + (1 - label) * math.log(1 - p))
          return total / len(data)
      data = [([2.0], 1), ([-2.0], 0)]
      w0, b0 = [0.0], 0.0
      before = bce(w0, b0, data)
      w1, b1 = gradient_step(w0, b0, data, lr=0.5)
      after = bce(w1, b1, data)
      assert after < before, (before, after)
  - name: does not mutate the input weights
    code: |
      original = [0.0, 0.0]
      gradient_step(original, 0.0, [([1.0, 1.0], 1)], lr=0.3)
      assert original == [0.0, 0.0], original
  - name: returns a list of weights and a scalar bias
    code: |
      w, b = gradient_step([0.1, -0.2], 0.05, [([1.0, 2.0], 1)], lr=0.1)
      assert isinstance(w, list) and len(w) == 2, w
      assert isinstance(b, float), b
  timeout: 8
hints:
- order: 1
  cost: 10
  content: For a stable sigmoid, when z is very negative compute exp(z) / (1 + exp(z)) instead of 1 / (1 + exp(-z)) so exp does not overflow. A simple branch on the sign of z works.
- order: 2
  cost: 20
  content: predict is sigmoid(sum(w * x for w, x in zip(weights, features)) + bias). For the step, compute error = predict(...) - label for every example first.
- order: 3
  cost: 30
  content: 'grad for weight j is the average over the batch of error * features[j]; grad_b is the average error. Then new_w[j] = weights[j] - lr * grad_j and new_b = bias - lr * grad_b. Build a NEW list so you do not mutate the input.'
