      sigmoid(z) -> float: 1 / (1 + e^-z), numerically stable for large |z|.
      predict(weights, bias, features) -> float: sigmoid(dot(weights, features) + bias).
      gradient_step(weights, bias, data, lr) -> (new_weights, new_bias):
        data is a list of (features, label) with label in {0, 1}. Do ONE full-batch gradient-descent
        update. For each example error = predict(...) - label. The gradient for weight j is the mean
        of error * features[j] over the batch; the bias gradient is the mean error. Update with
        w_j := w_j - lr * grad_j and b := b - lr * grad_b. Return the new weights as a list and the
        new bias. Do not mutate the input weights list.
