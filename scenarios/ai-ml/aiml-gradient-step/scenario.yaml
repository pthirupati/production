initial_state: Every neural network ultimately reduces to this single move — predict, measure the error,
  nudge the weights downhill. Implement the logistic prediction (sigmoid of a linear combination), the
  binary cross-entropy loss, and a single gradient-descent weight update over a tiny fixed dataset, all
