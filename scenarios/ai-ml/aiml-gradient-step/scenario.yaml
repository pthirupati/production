solution_explanation: 'sigmoid(z) = 1 / (1 + e^-z), guarded for large-magnitude z so it never overflows.
  predict computes

  the dot product of weights and features plus the bias, then squashes it through the sigmoid.

  gradient_step runs one full-batch update: for each example the error is (prediction - label); the

  gradient for weight j is the mean over the batch of error * feature_j, and the bias gradient is the

  mean error. Each parameter moves against its gradient scaled by the learning rate

  (w_j -= lr * grad_j). Because the data, weights, and learning rate are fixed, the updated

  parameters are fully deterministic, and the loss after the step is lower than before.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: "Implement a single logistic-regression training step (import math allowed):\n  sigmoid(z)\
    \ -> float: 1 / (1 + e^-z), numerically stable for large |z|.\n  predict(weights, bias, features)\
    \ -> float: sigmoid(dot(weights, features) + bias).\n  gradient_step(weights, bias, data, lr) -> (new_weights,\
    \ new_bias):\n    data is a list of (features, label) with label in {0, 1}. Do ONE full-batch gradient-descent\n\
    \    update. For each example error = predict(...) - label. The gradient for weight j is the mean\n\
    \    of error * features[j] over the batch; the bias gradient is the mean error. Update with\n   \
    \ w_j := w_j - lr * grad_j and b := b - lr * grad_b. Return the new weights as a list and the\n  \
    \  new bias. Do not mutate the input weights list.\nClick Run to try it, then Check Solution to grade\
    \ against all tests.\n"
  files:
  - path: solution.py
    content: "import math\n\ndef sigmoid(z):\n    # TODO: 1 / (1 + e^-z), stable for large |z|.\n    pass\n\
      \ndef predict(weights, bias, features):\n    # TODO: sigmoid(dot(weights, features) + bias).\n \
      \   pass\n\ndef gradient_step(weights, bias, data, lr):\n    # TODO: one full-batch gradient-descent\
      \ update; return (new_weights, new_bias).\n    pass\n"
    readonly: false
  visible_tests:
  - name: sigmoid at zero is 0.5
    code: 'import math

      assert math.isclose(sigmoid(0), 0.5, rel_tol=1e-9), sigmoid(0)

      '
  - name: prediction uses weights and bias
    code: 'import math

      # weights=[2], bias=0, x=[1] -> sigmoid(2)

      assert math.isclose(predict([2.0], 0.0, [1.0]), 1 / (1 + math.exp(-2)), rel_tol=1e-9), predict([2.0],
      0.0, [1.0])

      '
  hidden_tests:
  - name: sigmoid is stable for large magnitudes
    code: 'import math

      assert math.isclose(sigmoid(1000), 1.0, abs_tol=1e-9), sigmoid(1000)

      assert math.isclose(sigmoid(-1000), 0.0, abs_tol=1e-9), sigmoid(-1000)

      '
  - name: sigmoid is symmetric
    code: 'import math

      assert math.isclose(sigmoid(3) + sigmoid(-3), 1.0, rel_tol=1e-9), (sigmoid(3), sigmoid(-3))

      '
  - name: one gradient step is deterministic and exact
    code: 'import math

      # Start at all zeros: every prediction is 0.5, so error = 0.5 - label.

      data = [([1.0, 0.0], 1), ([0.0, 1.0], 0)]

      w, b = gradient_step([0.0, 0.0], 0.0, data, lr=1.0)

      # errors: ex0 = 0.5-1 = -0.5 ; ex1 = 0.5-0 = 0.5

      # grad_w0 = mean(-0.5*1, 0.5*0) = -0.25 ; grad_w1 = mean(-0.5*0, 0.5*1) = 0.25

      # grad_b  = mean(-0.5, 0.5) = 0.0

      assert math.isclose(w[0], 0.25, rel_tol=1e-9), w

      assert math.isclose(w[1], -0.25, rel_tol=1e-9), w

      assert math.isclose(b, 0.0, abs_tol=1e-9), b

      '
  - name: a step lowers the loss on a separable point
    code: "def bce(weights, bias, data):\n    import math\n    eps = 1e-12\n    total = 0.0\n    for feats,\
      \ label in data:\n        p = predict(weights, bias, feats)\n        p = min(max(p, eps), 1 - eps)\n\
      \        total += -(label * math.log(p) + (1 - label) * math.log(1 - p))\n    return total / len(data)\n\
      data = [([2.0], 1), ([-2.0], 0)]\nw0, b0 = [0.0], 0.0\nbefore = bce(w0, b0, data)\nw1, b1 = gradient_step(w0,\
      \ b0, data, lr=0.5)\nafter = bce(w1, b1, data)\nassert after < before, (before, after)\n"
  - name: does not mutate the input weights
    code: 'original = [0.0, 0.0]

      gradient_step(original, 0.0, [([1.0, 1.0], 1)], lr=0.3)

      assert original == [0.0, 0.0], original

      '
  - name: returns a list of weights and a scalar bias
    code: 'w, b = gradient_step([0.1, -0.2], 0.05, [([1.0, 2.0], 1)], lr=0.1)

      assert isinstance(w, list) and len(w) == 2, w

      assert isinstance(b, float), b

      '
  timeout: 8
