title: Add an MCP tool so the agent can answer a data question
slug: agent-mcp-metrics-answer
category: Fix
description: 'CONTEXT: A team operating AI/ML workflows has raised a ticket for `Add an MCP tool so the
  agent can answer a data question`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace. The architecture is a single
  lab-primary node exposing datasets, training scripts, metrics, and model artifacts; treat it as the
  production host for this incident. All tools run locally — no paid APIs or external cloud calls are
  required.


  SYMPTOM / STARTING STATE: The canvas has a Trigger (an ops question about CPU on web01) connected to
  an LLM intent classifier, plus a disconnected Output node. There is no MCP tool, so the agent can recognise
  the question but cannot fetch the metric — the output never contains a CPU figure.


  OBJECTIVE: Open the Agent Workflow simulator and run the flow to see the agent answer without real data;
  Add an MCP tool node configured for server "metrics" and tool "get_cpu"; Wire Trigger -> LLM -> MCP
  tool -> Output so the live CPU metric flows into the final answer. Acceptance criteria: the change is
  minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant datasets, training scripts, metrics, and model artifacts), changing one thing at
  a time. Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
