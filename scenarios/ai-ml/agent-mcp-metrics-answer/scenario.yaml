title: Add an MCP tool so the agent can answer a data question
slug: agent-mcp-metrics-answer
category: Fix
description: 'CONTEXT: A team operating AI/ML workflows needs you to resolve `Add an MCP tool so the agent
  can answer a data question` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace with datasets, training scripts,
  metrics, and model artifacts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The canvas has a Trigger (an ops question about CPU on web01) connected to
  an LLM intent classifier, plus a disconnected Output node. There is no MCP tool, so the agent can recognise
  the question but cannot fetch the metric — the output never contains a CPU figure. An ops chat agent
  recognises infrastructure questions but has no way to fetch live data, so it just guesses. Give it real
  grounding by adding a Model-Context-Protocol (MCP) tool node that calls the metrics MCP server, and
  wire it in so the agent''s answer carries the real CPU figure for the host. The MCP server is simulated
  and deterministic — same call, same data, no network.


  OBJECTIVE: Open the Agent Workflow simulator and run the flow to see the agent answer without real data;
  Add an MCP tool node configured for server "metrics" and tool "get_cpu"; Wire Trigger -> LLM -> MCP
  tool -> Output so the live CPU metric flows into the final answer. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
