title: Build a support-ticket triage agent
slug: agent-support-ticket-triage
category: Fix
description: 'CONTEXT: A team operating AI/ML workflows needs you to resolve `Build a support-ticket triage
  agent` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace with datasets, training scripts,
  metrics, and model artifacts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The canvas starts with only a Trigger node (an urgent security ticket) and
  an Output node, unconnected. There is no classifier, no routing, and nothing fires — you must build
  the agent. A new support ticket has arrived and your team wants it triaged automatically. Open the Agent
  Workflow simulator and build a small agent that classifies the incoming ticket with a deterministic
  rule-based "LLM" node, then routes high-priority tickets to a notification tool so the on-call engineer
  is paged. Everything runs free and local — no paid LLM, no network.


  OBJECTIVE: Open the Agent Workflow simulator from the lab toolbar; Add an LLM node in classify mode
  and feed it the ticket text from the trigger; Add a condition node that detects a high-priority ticket
  and route the true branch to a send_notification tool, then connect the notification to the output.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
