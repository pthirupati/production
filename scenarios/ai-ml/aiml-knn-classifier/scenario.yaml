  visible_tests:
  - name: euclidean distance of a 3-4-5 triangle
    code: |
      import math
      assert math.isclose(euclidean_distance([0, 0], [3, 4]), 5.0, rel_tol=1e-9), euclidean_distance([0, 0], [3, 4])
  - name: classifies to the obvious nearest cluster
    code: |
      train = [([0, 0], "a"), ([0, 1], "a"), ([10, 10], "b"), ([10, 11], "b")]
      assert classify(train, [0, 2], 1) == "a", classify(train, [0, 2], 1)
      assert classify(train, [9, 9], 1) == "b", classify(train, [9, 9], 1)
  hidden_tests:
  - name: majority vote among k neighbours
    code: |
      train = [([0], "a"), ([1], "a"), ([2], "b"), ([10], "b")]
      # query 1.0: nearest 3 are idx1(d0,a), idx0(d1,a), idx2(d1,b) -> a wins 2-1
      assert classify(train, [1], 3) == "a", classify(train, [1], 3)
  - name: distance tie breaks toward lower index
    code: |
      # query [0,0] is equidistant (d=1) from both points; k=1 must pick the lower index -> 'first'
      train = [([1, 0], "first"), ([0, 1], "second")]
      assert classify(train, [0, 0], 1) == "first", classify(train, [0, 0], 1)
  - name: vote tie breaks toward smaller label
    code: |
      # k=2 with one 'x' and one 'z' equally close -> tie, smaller label 'x' wins
      train = [([0], "z"), ([2], "x")]
      assert classify(train, [1], 2) == "x", classify(train, [1], 2)
  - name: k larger than dataset uses all points
    code: |
      train = [([0], "a"), ([1], "a"), ([5], "b")]
      assert classify(train, [3], 99) == "a", classify(train, [3], 99)
  - name: multi-dimensional features
    code: |
      train = [([1, 1, 1], "near"), ([9, 9, 9], "far")]
      assert classify(train, [2, 2, 2], 1) == "near", classify(train, [2, 2, 2], 1)
  - name: deterministic across repeated calls
    code: |
      train = [([0], "z"), ([2], "x"), ([0], "x"), ([2], "z")]
      first = classify(train, [1], 4)
      assert all(classify(train, [1], 4) == first for _ in range(5)), first
