title: K-Nearest-Neighbours Classifier
slug: aiml-knn-classifier
technology: ai-ml
category: AI / ML / LLM & Agents
description: >-
  k-NN is the simplest classifier there is — to label a new point you find the k closest
  labelled points and let them vote. The catch is determinism: distance ties and vote ties must
  break the same way every run. Implement Euclidean k-NN with explicit, repeatable tie-breaking so
  the same query always returns the same label.
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Compute Euclidean distance between feature vectors
- Select the k nearest training points with a deterministic distance tie-break
- Take a majority vote of their labels with a deterministic label tie-break
initial_state: >-
  k-NN is the simplest classifier there is — to label a new point you find the k closest
  labelled points and let them vote. The catch is determinism: distance ties and vote ties must
  break the same way every run. Implement Euclidean k-NN with explicit, repeatable tie-breaking so
  the same query always returns the same label.
solution_explanation: |
  euclidean_distance is sqrt(sum((ai-bi)^2)). classify computes the distance from the query to every
  training point, then sorts by (distance, original_index) so equal distances break toward the
  lower index — fully deterministic, no reliance on input order surviving an unstable sort. It takes
  the first k labels and tallies them with a Counter. When two labels tie on count, it breaks the tie
  by picking the smallest label (sorted order), so the winner never depends on dict/iteration order.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: |
    Implement two functions (import math, collections allowed):
      euclidean_distance(a, b) -> float: the straight-line distance sqrt(sum((ai-bi)^2)).
      classify(train, query, k) -> label: train is a list of (features, label) pairs. Find the k
        training points nearest to query and return the majority label.
        DETERMINISTIC TIE-BREAKS (required):
          * distance ties: prefer the point with the smaller index in train.
          * vote ties: prefer the smaller label (as given by sorted()).
