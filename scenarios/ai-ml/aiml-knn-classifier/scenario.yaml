title: K-Nearest-Neighbours Classifier
slug: aiml-knn-classifier
technology: ai-ml
category: Build
description: 'CONTEXT: A team operating AI/ML workflows has raised a ticket for `K-Nearest-Neighbours
  Classifier`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace. The architecture is a single
  lab-primary node exposing datasets, training scripts, metrics, and model artifacts; treat it as the
  production host for this incident. All tools run locally — no paid APIs or external cloud calls are
  required.

  SYMPTOM / STARTING STATE: k-NN is the simplest classifier there is — to label a new point you find the
  k closest labelled points and let them vote. The catch is determinism: distance ties and vote ties must
  break the same way every run. Implement Euclidean k-NN with explicit, repeatable tie-breaking so the
  same query always returns the same label.

  OBJECTIVE: Compute Euclidean distance between feature vectors; Select the k nearest training points
  with a deterministic distance tie-break; Take a majority vote of their labels with a deterministic label
  tie-break. Acceptance criteria: the change is minimal and reversible, and success means all hidden tests
  pass.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant datasets, training scripts, metrics, and model artifacts), changing one thing at
  a time. Check your work continuously against the objective — success means all hidden tests pass.

  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
