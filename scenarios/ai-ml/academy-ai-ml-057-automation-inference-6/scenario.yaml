description: 'CONTEXT: A team operating AI/ML workflows needs you to resolve `ai-ml: Inference — Automation
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace with datasets, training scripts,
  metrics, and model artifacts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for inference. Automate the boring parts
  without hiding important safety checks. Automation lab: remove toil around inference. Codify repeatable
  steps for serving, batching, and latency and prove the automation is idempotent.


  OBJECTIVE: Day-2 inference work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `systemctl is-active nginx` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 inference work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for inference. Automate the boring parts without hiding
