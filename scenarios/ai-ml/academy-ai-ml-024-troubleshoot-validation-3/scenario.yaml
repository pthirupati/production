description: 'Production alert: metrics look good but generalize poorly. You are on
  call for AI / ML / LLM & Agents and must troubleshoot validation methodically —
  triage symptoms, isolate root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: metrics look good but generalize poorly'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The ML practice workspace is degraded. Metrics look good but generalize
  poorly. Recent changes may exist around validation, but do not restart blindly —
  gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — validation metrics and confusion matrix.

    2. Write down what looks normal versus wrong or missing for validation.

    3. Recall the core idea: holdout, cross-validation, and metrics. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for validation.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — validation metrics and confusion matrix.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — validation reflects real performance.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-ai-ml-024-troubleshoot-validation-3.conf`,
    then click Check Solution.'
