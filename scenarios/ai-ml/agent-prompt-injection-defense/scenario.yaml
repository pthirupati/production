time_limit: 1200
max_score: 100
is_free: false
dual_terminal: false
objectives:
- Run the flow and observe the injected KB text take over the classification and route
- Insert a Transform node with op "sanitize" between the KB tool and the LLM
- Point the classifier back at the customer's trusted "text" field instead of the retrieved article body
- Remove the "attacker-exfil" destination and escalate to "support-team" instead
initial_state: The Agent Workflow canvas has Trigger -> KB Lookup -> Classifier -> Condition -> Notify.
  The retrieved KB article body carries injected attacker instructions and is fed directly into the classifier,
  so the agent classifies on attacker-controlled text and notifies the "attacker-exfil" channel.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. Run the workflow once and read the execution trace top to bottom. Look
    at what the KB Lookup node actually returned, then look at what text the Classifier received as its
    input. Note precisely which field the Classifier is reading and where that field came from before
    you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. Trace the data, not the boxes: for each node ask "who controls this
    value?". A value that originated outside your trust boundary — a retrieved document, a web page, a
    user-supplied file — is untrusted no matter how it arrives. Change exactly one thing, re-run, and
    compare the trace.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic signals:

    1. In the trace, expand the KB Lookup output and read `http.article_body` in full.

    2. Expand the Classifier output and check `llm_prompt_injected` — it tells you whether injected instructions
    reached the model.

    3. Check the run''s notifications list and compare the channel that fired against the channel you
    would expect.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. The Classifier''s `input_field` is set to a value that comes from the tool result, not from the
    trigger. That is the trust-boundary violation.

    2. Two separate defects exist: untrusted text reaching the model, and an escalation destination that
    should never have been in the graph. Fixing only one leaves the other.

    3. State a one-line hypothesis before changing anything.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Add a Transform node, set its op to "sanitize", point its field at `http.article_body`, and wire
    KB Lookup -> Transform -> Classifier (removing the direct KB Lookup -> Classifier edge).

    2. Set the Classifier''s input_field back to `text` so it classifies the customer, not the document.

    3. Change the Notify node''s channel from "attacker-exfil" to "support-team".

    4. Re-run and confirm `llm_prompt_injected` is false and no attacker notification fired.

    WHY: quarantining untrusted spans and keeping them out of the instruction channel is the actual mitigation
    — the grader checks the injection never reached the model and the exfil destination is gone, not merely
    that it did not fire this time.'
