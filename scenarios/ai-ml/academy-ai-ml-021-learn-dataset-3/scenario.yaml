objectives:
- Understand how ML datasets work in this lab environment
- Identify the main status and configuration signals for ML datasets
- Confirm you can read the current state confidently before changing anything
initial_state: The ML practice workspace is online with a starter ML datasets setup.
  Some pieces are intentionally incomplete so you can learn how they fit together.
  Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — dataset profile, class balance, and feature distributions.

    2. Write down what looks normal versus wrong or missing for ML datasets.

    3. Recall the core idea: schema, splits, labeling quality, and leakage. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for ML datasets.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — dataset profile, class balance, and feature distributions.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — train/val/test splits are correct and features are free
    of leakage.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-ai-ml-021-learn-dataset-3.conf`,
    then click Check Solution.'
