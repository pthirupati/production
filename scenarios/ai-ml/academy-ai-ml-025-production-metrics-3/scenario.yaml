description: 'CONTEXT: A team operating AI/ML workflows has raised a ticket for `Evaluation Metrics —
  Production Lab`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace. The architecture is a single
  lab-primary node exposing datasets, training scripts, metrics, and model artifacts; treat it as the
  production host for this incident. All tools run locally — no paid APIs or external cloud calls are
  required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but evaluation metrics is not production ready
  — missing guardrails, runbooks, or capacity checks.


  OBJECTIVE: Day-2 evaluation metrics work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Acceptance criteria: the change
  is minimal and reversible, and success means `systemctl is-active model-server`` returns active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant datasets, training scripts, metrics, and model artifacts), changing one thing at
  a time. Check your work continuously against the objective — success means `systemctl is-active model-server`` returns active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active model-server` returns
  active. Capture the before/after output as evidence. Success criteria: the objective''s healthy state
  holds on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 evaluation metrics work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but evaluation metrics is not production ready — missing guardrails,
  runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: the wrong metric hides real failures. This lab
    is about evaluation metrics — accuracy, precision/recall, and AUC. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For evaluation metrics problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Apply production standards for evaluation metrics: resource
    limits, monitoring, access controls, and a written rollback step.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `systemctl status model-server` and `journalctl -u model-server -n 50`.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm `model-server` is failed/inactive.

    2. Read the unit journal for the root cause.

    3. Apply the smallest fix that restores the unit.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Repair the underlying config/cause for `model-server`.

    2. `systemctl enable --now model-server`.

    3. Verify with `systemctl is-active model-server` (expect active).'
