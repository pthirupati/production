  versioning, and loading cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to model persistence are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around model persistence.
  Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — saved artifacts and load code.

    2. Write down what looks normal versus wrong or missing for model persistence.

    3. Recall the core idea: serialization, versioning, and loading. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for model persistence.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — saved artifacts and load code.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit
    access the workload actually needs.

    3. Verify the result — the model saves and loads identically.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-ai-ml-026-security-model-save-3.conf`,
    then click Check Solution.'
