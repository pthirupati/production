objectives:
- Compute term frequency (TF) within a single document
- Compute inverse document frequency (IDF) across the corpus with smoothing
- Combine them into a per-term TF-IDF score for one document
initial_state: Bag-of-words counts treat every word equally, so common words like "the" drown out the
  ones that actually distinguish a document. TF-IDF fixes that by weighting each term's frequency in a
  document against how rare it is across the whole corpus. Implement it from scratch with stdlib math
  so common terms get pushed toward zero and distinctive terms float to the top.
solution_explanation: 'TF is the count of a term in the document divided by the document''s total token
  count. IDF uses the

  smoothed form log((1 + N) / (1 + df)) + 1, where N is the number of documents and df is how many

  documents contain the term — the +1 smoothing avoids division by zero and a log of zero, and the

  trailing +1 keeps even ubiquitous terms slightly positive. tfidf multiplies TF by IDF for each term

  in the chosen document. A term that appears in every document gets the smallest IDF, so common

  words are down-weighted while rare, distinctive words score highest.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: "Each document is a list of tokens. Implement three functions (import math allowed):\n\
    \  term_frequency(doc) -> dict[str, float]: count(term) / len(doc) for each term. Empty doc -> {}.\n\
    \  inverse_document_frequency(corpus) -> dict[str, float]: for every term anywhere in the corpus,\n\
    \    idf = log((1 + N) / (1 + df)) + 1, where N = number of documents and df = number of documents\n\
    \    containing the term. Use math.log (natural log).\n  tfidf(doc, corpus) -> dict[str, float]: tf(term)\
    \ * idf(term) for each term in doc, where idf is\n    taken from inverse_document_frequency(corpus).\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "import math\n\ndef term_frequency(doc):\n    # TODO: count(term) / len(doc) for each distinct\
      \ term.\n    pass\n\ndef inverse_document_frequency(corpus):\n    # TODO: log((1 + N) / (1 + df))\
      \ + 1 for each term seen in the corpus.\n    pass\n\ndef tfidf(doc, corpus):\n    # TODO: tf(term)\
      \ * idf(term) for each term in doc.\n    pass\n"
    readonly: false
  visible_tests:
  - name: term frequency normalizes by length
    code: 'import math

      tf = term_frequency(["a", "a", "b", "c"])

      assert math.isclose(tf["a"], 0.5, rel_tol=1e-9), tf

      assert math.isclose(tf["b"], 0.25, rel_tol=1e-9), tf

      assert math.isclose(tf["c"], 0.25, rel_tol=1e-9), tf

      '
  - name: common term has lower idf than rare term
    code: 'corpus = [["a", "b"], ["a", "c"], ["a", "d"]]

      idf = inverse_document_frequency(corpus)

      # ''a'' is in every doc, ''b'' in only one -> idf(a) < idf(b)

      assert idf["a"] < idf["b"], idf

      '
  hidden_tests:
  - name: empty document has no term frequencies
    code: 'assert term_frequency([]) == {}, term_frequency([])

      '
  - name: idf exact smoothed value
    code: 'import math

      corpus = [["a", "b"], ["a", "c"], ["a", "d"]]

      idf = inverse_document_frequency(corpus)

      # N=3. ''a'' df=3 -> log(4/4)+1 = 1.0 ; ''b'' df=1 -> log(4/2)+1

      assert math.isclose(idf["a"], 1.0, rel_tol=1e-9), idf

      assert math.isclose(idf["b"], math.log(4 / 2) + 1, rel_tol=1e-9), idf

      '
  - name: tfidf combines tf and idf
    code: 'import math

      corpus = [["a", "b"], ["a", "c"], ["a", "d"]]

      doc = ["a", "b"]

      scores = tfidf(doc, corpus)

      idf = inverse_document_frequency(corpus)

      assert math.isclose(scores["a"], 0.5 * idf["a"], rel_tol=1e-9), scores

      assert math.isclose(scores["b"], 0.5 * idf["b"], rel_tol=1e-9), scores

      '
  - name: distinctive term outranks common term in same doc
    code: 'corpus = [["the", "cat"], ["the", "dog"], ["the", "fish"]]

      scores = tfidf(["the", "cat"], corpus)

      assert scores["cat"] > scores["the"], scores

      '
  - name: idf covers every corpus term
    code: 'corpus = [["x"], ["y"], ["z"]]

      idf = inverse_document_frequency(corpus)

      assert set(idf.keys()) == {"x", "y", "z"}, idf

      '
  - name: repeated term in doc counts once per document for df
    code: 'import math

      # ''a'' appears twice in doc 0 but df should still be 1 (one document)

      corpus = [["a", "a"], ["b"]]

      idf = inverse_document_frequency(corpus)

      assert math.isclose(idf["a"], math.log((1 + 2) / (1 + 1)) + 1, rel_tol=1e-9), idf

      '
  timeout: 8
