title: TF-IDF Term Scoring
slug: aiml-tfidf-scoring
technology: ai-ml
category: AI / ML / LLM & Agents
description: Bag-of-words counts treat every word equally, so common words like "the" drown out the
  ones that actually distinguish a document. TF-IDF fixes that by weighting each term's frequency in
  a document against how rare it is across the whole corpus. Implement it from scratch with stdlib
  math so common terms get pushed toward zero and distinctive terms float to the top.
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Compute term frequency (TF) within a single document
- Compute inverse document frequency (IDF) across the corpus with smoothing
- Combine them into a per-term TF-IDF score for one document
initial_state: Bag-of-words counts treat every word equally, so common words like "the" drown out the
  ones that actually distinguish a document. TF-IDF fixes that by weighting each term's frequency in
  a document against how rare it is across the whole corpus. Implement it from scratch with stdlib
  math so common terms get pushed toward zero and distinctive terms float to the top.
solution_explanation: |
  TF is the count of a term in the document divided by the document's total token count. IDF uses the
  smoothed form log((1 + N) / (1 + df)) + 1, where N is the number of documents and df is how many
  documents contain the term — the +1 smoothing avoids division by zero and a log of zero, and the
  trailing +1 keeps even ubiquitous terms slightly positive. tfidf multiplies TF by IDF for each term
  in the chosen document. A term that appears in every document gets the smallest IDF, so common
  words are down-weighted while rare, distinctive words score highest.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: |
    Each document is a list of tokens. Implement three functions (import math allowed):
      term_frequency(doc) -> dict[str, float]: count(term) / len(doc) for each term. Empty doc -> {}.
      inverse_document_frequency(corpus) -> dict[str, float]: for every term anywhere in the corpus,
        idf = log((1 + N) / (1 + df)) + 1, where N = number of documents and df = number of documents
        containing the term. Use math.log (natural log).
      tfidf(doc, corpus) -> dict[str, float]: tf(term) * idf(term) for each term in doc, where idf is
        taken from inverse_document_frequency(corpus).
