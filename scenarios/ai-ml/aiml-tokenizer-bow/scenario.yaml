title: Tokenizer and Bag-of-Words Counts
slug: aiml-tokenizer-bow
technology: ai-ml
category: Build
description: 'CONTEXT: A team operating AI/ML workflows has raised a ticket for `Tokenizer and Bag-of-Words
  Counts`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace. The architecture is a single
  lab-primary node exposing datasets, training scripts, metrics, and model artifacts; treat it as the
  production host for this incident. All tools run locally — no paid APIs or external cloud calls are
  required.

  SYMPTOM / STARTING STATE: Before any model can read text it must be turned into numbers. Implement a
  simple tokenizer that lowercases and splits on word characters, then a bag-of-words counter that maps
  each distinct token to how many times it appears. This is the front door of every classic NLP pipeline.

  OBJECTIVE: Lowercase text and split it into word tokens, ignoring punctuation; Count how many times
  each token occurs; Return a plain dict so results are deterministic and comparable. Acceptance criteria:
  the change is minimal and reversible, and success means all hidden tests pass.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant datasets, training scripts, metrics, and model artifacts), changing one thing at
  a time. Check your work continuously against the objective — success means all hidden tests pass.

  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
