    readonly: false
  visible_tests:
  - name: tokenize lowercases and drops punctuation
    code: |
      assert tokenize("Hello, WORLD!") == ["hello", "world"], tokenize("Hello, WORLD!")
  - name: bag-of-words counts repeats
    code: |
      assert bag_of_words("the cat the dog the") == {"the": 3, "cat": 1, "dog": 1}, bag_of_words("the cat the dog the")
  hidden_tests:
  - name: empty string yields no tokens
    code: |
      assert tokenize("") == [], tokenize("")
      assert bag_of_words("") == {}, bag_of_words("")
  - name: digits are tokens
    code: |
      assert tokenize("Room 101 has 2 beds") == ["room", "101", "has", "2", "beds"], tokenize("Room 101 has 2 beds")
  - name: collapses multiple spaces and newlines
    code: |
      assert tokenize("a\n\n  b\tc") == ["a", "b", "c"], tokenize("a\n\n  b\tc")
  - name: bag-of-words is a plain dict
    code: |
      r = bag_of_words("a a b")
      assert type(r) is dict, type(r)
      assert r == {"a": 2, "b": 1}, r
  - name: punctuation only yields empty
    code: |
      assert bag_of_words("!!! ... ???") == {}, bag_of_words("!!! ... ???")
  - name: case folds so Cat and cat are one token
    code: |
      assert bag_of_words("Cat cat CAT") == {"cat": 3}, bag_of_words("Cat cat CAT")
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Lowercase the text first with text.lower(), then split. re.findall does the splitting and filtering in one step.
- order: 2
  cost: 20
  content: 'For tokenize use: re.findall(r"[a-z0-9]+", text.lower()). It returns only the matching runs.'
- order: 3
  cost: 30
  content: 'For bag_of_words, feed tokenize(text) into collections.Counter and return dict(counter) so the result is a plain dict.'
