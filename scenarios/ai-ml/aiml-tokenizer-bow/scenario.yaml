  to how many times it appears. This is the front door of every classic NLP pipeline.
solution_explanation: 'tokenize lowercases the string and uses re.findall(r"[a-z0-9]+", ...) to pull out
  runs of letters

  and digits, dropping punctuation and whitespace. bag_of_words feeds those tokens into a

  collections.Counter and returns it as a dict, mapping each unique token to its frequency. Because

  the steps are pure and order-independent, the same text always yields the same counts.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: "Implement two functions using only the standard library (import re, collections allowed):\n\
    \  tokenize(text) -> list[str]: lowercase the text and return the tokens, where a token is a run\n\
    \    of letters/digits ([a-z0-9]+). Punctuation and whitespace separate tokens and are dropped.\n\
    \  bag_of_words(text) -> dict[str, int]: map each distinct token from tokenize(text) to its count.\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "import re\nimport collections\n\ndef tokenize(text):\n    # TODO: lowercase, then return\
      \ runs of [a-z0-9] as tokens.\n    pass\n\ndef bag_of_words(text):\n    # TODO: count each token\
      \ from tokenize(text) into a dict.\n    pass\n"
    readonly: false
  visible_tests:
  - name: tokenize lowercases and drops punctuation
    code: 'assert tokenize("Hello, WORLD!") == ["hello", "world"], tokenize("Hello, WORLD!")

      '
  - name: bag-of-words counts repeats
    code: 'assert bag_of_words("the cat the dog the") == {"the": 3, "cat": 1, "dog": 1}, bag_of_words("the
      cat the dog the")

      '
  hidden_tests:
  - name: empty string yields no tokens
    code: 'assert tokenize("") == [], tokenize("")

      assert bag_of_words("") == {}, bag_of_words("")

      '
  - name: digits are tokens
    code: 'assert tokenize("Room 101 has 2 beds") == ["room", "101", "has", "2", "beds"], tokenize("Room
      101 has 2 beds")

      '
  - name: collapses multiple spaces and newlines
    code: 'assert tokenize("a\n\n  b\tc") == ["a", "b", "c"], tokenize("a\n\n  b\tc")

      '
  - name: bag-of-words is a plain dict
    code: 'r = bag_of_words("a a b")

      assert type(r) is dict, type(r)

      assert r == {"a": 2, "b": 1}, r

      '
  - name: punctuation only yields empty
    code: 'assert bag_of_words("!!! ... ???") == {}, bag_of_words("!!! ... ???")

      '
  - name: case folds so Cat and cat are one token
    code: 'assert bag_of_words("Cat cat CAT") == {"cat": 3}, bag_of_words("Cat cat CAT")

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: tokenizer and Bag-of-Words counts is not behaving
    as the scenario objectives require. This lab is about tokenizer and Bag-of-Words counts — how tokenizer
    and Bag-of-Words counts behaves in a AI/ML workflows environment. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For tokenizer and Bag-of-Words counts problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small,
    reversible steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `solution.py`, read the instructions, and run the visible tests to see which assertion fails
    first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of tokenizer and Bag-of-Words counts is at fault.

    2. Re-run the most relevant of datasets, training scripts, metrics, and model artifacts focused on
    just that part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''tokenizer and
    Bag-of-Words counts is not behaving as the scenario objectives require'' toward ''all hidden tests
    pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `solution.py` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.

    WHY: coding labs grade against hidden test cases, not marker files.'
