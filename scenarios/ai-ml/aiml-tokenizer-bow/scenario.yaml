title: Tokenizer and Bag-of-Words Counts
slug: aiml-tokenizer-bow
technology: ai-ml
category: Build
description: 'CONTEXT: A team operating AI/ML workflows needs you to resolve `Tokenizer and Bag-of-Words
  Counts` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline ML practice workspace with datasets, training scripts,
  metrics, and model artifacts. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Before any model can read text it must be turned into numbers. Implement a
  simple tokenizer that lowercases and splits on word characters, then a bag-of-words counter that maps
  each distinct token to how many times it appears. This is the front door of every classic NLP pipeline.


  OBJECTIVE: Lowercase text and split it into word tokens, ignoring punctuation; Count how many times
  each token occurs; Return a plain dict so results are deterministic and comparable. Success means all
  hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Low
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Lowercase text and split it into word tokens, ignoring punctuation
- Count how many times each token occurs
- Return a plain dict so results are deterministic and comparable
initial_state: Before any model can read text it must be turned into numbers. Implement a simple tokenizer
  that lowercases and splits on word characters, then a bag-of-words counter that maps each distinct token
  to how many times it appears. This is the front door of every classic NLP pipeline.
solution_explanation: 'tokenize lowercases the string and uses re.findall(r"[a-z0-9]+", ...) to pull out
  runs of letters

  and digits, dropping punctuation and whitespace. bag_of_words feeds those tokens into a

  collections.Counter and returns it as a dict, mapping each unique token to its frequency. Because

  the steps are pure and order-independent, the same text always yields the same counts.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: "Implement two functions using only the standard library (import re, collections allowed):\n\
    \  tokenize(text) -> list[str]: lowercase the text and return the tokens, where a token is a run\n\
    \    of letters/digits ([a-z0-9]+). Punctuation and whitespace separate tokens and are dropped.\n\
    \  bag_of_words(text) -> dict[str, int]: map each distinct token from tokenize(text) to its count.\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "import re\nimport collections\n\ndef tokenize(text):\n    # TODO: lowercase, then return\
      \ runs of [a-z0-9] as tokens.\n    pass\n\ndef bag_of_words(text):\n    # TODO: count each token\
      \ from tokenize(text) into a dict.\n    pass\n"
    readonly: false
  visible_tests:
  - name: tokenize lowercases and drops punctuation
    code: 'assert tokenize("Hello, WORLD!") == ["hello", "world"], tokenize("Hello, WORLD!")

      '
  - name: bag-of-words counts repeats
    code: 'assert bag_of_words("the cat the dog the") == {"the": 3, "cat": 1, "dog": 1}, bag_of_words("the
      cat the dog the")

      '
  hidden_tests:
  - name: empty string yields no tokens
    code: 'assert tokenize("") == [], tokenize("")

      assert bag_of_words("") == {}, bag_of_words("")

      '
  - name: digits are tokens
    code: 'assert tokenize("Room 101 has 2 beds") == ["room", "101", "has", "2", "beds"], tokenize("Room
      101 has 2 beds")

      '
  - name: collapses multiple spaces and newlines
    code: 'assert tokenize("a\n\n  b\tc") == ["a", "b", "c"], tokenize("a\n\n  b\tc")

      '
  - name: bag-of-words is a plain dict
    code: 'r = bag_of_words("a a b")

      assert type(r) is dict, type(r)

      assert r == {"a": 2, "b": 1}, r

      '
  - name: punctuation only yields empty
    code: 'assert bag_of_words("!!! ... ???") == {}, bag_of_words("!!! ... ???")

      '
  - name: case folds so Cat and cat are one token
    code: 'assert bag_of_words("Cat cat CAT") == {"cat": 3}, bag_of_words("Cat cat CAT")

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.py`, read the instructions, and run the visible tests to see
    which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Return a plain dict so results are deterministic and comparable.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
