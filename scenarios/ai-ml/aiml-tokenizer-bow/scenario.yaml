title: Tokenizer and Bag-of-Words Counts
slug: aiml-tokenizer-bow
technology: ai-ml
category: AI / ML / LLM & Agents
description: Before any model can read text it must be turned into numbers. Implement a simple
  tokenizer that lowercases and splits on word characters, then a bag-of-words counter that maps
  each distinct token to how many times it appears. This is the front door of every classic NLP
  pipeline.
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Low
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Lowercase text and split it into word tokens, ignoring punctuation
- Count how many times each token occurs
- Return a plain dict so results are deterministic and comparable
initial_state: Before any model can read text it must be turned into numbers. Implement a simple
  tokenizer that lowercases and splits on word characters, then a bag-of-words counter that maps
  each distinct token to how many times it appears. This is the front door of every classic NLP
  pipeline.
solution_explanation: |
  tokenize lowercases the string and uses re.findall(r"[a-z0-9]+", ...) to pull out runs of letters
  and digits, dropping punctuation and whitespace. bag_of_words feeds those tokens into a
  collections.Counter and returns it as a dict, mapping each unique token to its frequency. Because
  the steps are pure and order-independent, the same text always yields the same counts.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: |
    Implement two functions using only the standard library (import re, collections allowed):
      tokenize(text) -> list[str]: lowercase the text and return the tokens, where a token is a run
        of letters/digits ([a-z0-9]+). Punctuation and whitespace separate tokens and are dropped.
      bag_of_words(text) -> dict[str, int]: map each distinct token from tokenize(text) to its count.
