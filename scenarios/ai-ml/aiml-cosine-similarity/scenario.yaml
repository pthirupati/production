title: Cosine Similarity Between Vectors
slug: aiml-cosine-similarity
technology: ai-ml
category: AI / ML / LLM & Agents
description: Embeddings are compared by the angle between them, not their raw magnitude. Implement
  cosine_similarity(a, b) from scratch with stdlib math — dot product over the product of norms —
  so two vectors pointing the same direction score 1.0 regardless of length, and orthogonal vectors
  score 0.0.
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Low
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Compute the dot product of two equal-length vectors
- Divide by the product of the Euclidean norms
- Return 0.0 safely when either vector is all zeros
initial_state: Embeddings are compared by the angle between them, not their raw magnitude. Implement
  cosine_similarity(a, b) from scratch with stdlib math — dot product over the product of norms —
  so two vectors pointing the same direction score 1.0 regardless of length, and orthogonal vectors
  score 0.0.
solution_explanation: |
  Cosine similarity is the dot product of the two vectors divided by the product of their magnitudes:
  sum(ai*bi) / (sqrt(sum(ai^2)) * sqrt(sum(bi^2))). It measures the angle, so a vector and any
  positive scaling of it score exactly 1.0. When either vector has zero magnitude the denominator is
  0, so we return 0.0 to avoid dividing by zero.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: impl
  instructions: |
    Implement cosine_similarity(a, b) -> float using only the standard library (import math).
    a and b are equal-length lists of numbers. Return the dot product divided by the product of the
    two Euclidean norms. If either vector has zero magnitude, return 0.0 (do not divide by zero).
    Click Run to try it, then Check Solution to grade against all tests.
