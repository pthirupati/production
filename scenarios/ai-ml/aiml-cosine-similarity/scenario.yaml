          # TODO: dot(a, b) / (norm(a) * norm(b)); return 0.0 if either norm is 0.
          pass
    readonly: false
  visible_tests:
  - name: identical direction scores 1.0
    code: |
      import math
      assert math.isclose(cosine_similarity([1, 0], [1, 0]), 1.0, rel_tol=1e-9), cosine_similarity([1, 0], [1, 0])
  - name: orthogonal vectors score 0.0
    code: |
      import math
      assert math.isclose(cosine_similarity([1, 0], [0, 1]), 0.0, abs_tol=1e-9), cosine_similarity([1, 0], [0, 1])
  hidden_tests:
  - name: positive scaling is still 1.0
    code: |
      import math
      assert math.isclose(cosine_similarity([1, 2, 3], [2, 4, 6]), 1.0, rel_tol=1e-9), cosine_similarity([1, 2, 3], [2, 4, 6])
  - name: opposite direction scores -1.0
    code: |
      import math
      assert math.isclose(cosine_similarity([1, 1], [-1, -1]), -1.0, rel_tol=1e-9), cosine_similarity([1, 1], [-1, -1])
  - name: known angle value
    code: |
      import math
      # [1,1] vs [1,0]: cos(45deg) = 1/sqrt(2)
      assert math.isclose(cosine_similarity([1, 1], [1, 0]), 1 / math.sqrt(2), rel_tol=1e-9), cosine_similarity([1, 1], [1, 0])
  - name: zero vector returns 0.0
    code: |
      assert cosine_similarity([0, 0, 0], [1, 2, 3]) == 0.0, cosine_similarity([0, 0, 0], [1, 2, 3])
  - name: floats supported
    code: |
      import math
      assert math.isclose(cosine_similarity([0.5, 0.5], [0.5, 0.5]), 1.0, rel_tol=1e-9), cosine_similarity([0.5, 0.5], [0.5, 0.5])
