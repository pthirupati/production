  content: The dot product is sum(x * y for x, y in zip(a, b)). The norm of a vector is math.sqrt(sum(x * x for x in a)).
- order: 2
  cost: 20
  content: Cosine similarity = dot / (norm_a * norm_b). Compute the denominator first so you can guard it.
- order: 3
