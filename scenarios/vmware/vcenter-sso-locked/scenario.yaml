description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vCenter SSO Account Locked
  Out — Admin Cannot Login` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. vCenter VCSA at vcenter.lab.local.

  SSH access to VCSA available as root.

  Account administrator@vsphere.local shows as locked in SSO. The vCenter administrator account administrator@vsphere.local
  is locked out after

  multiple failed login attempts triggered by a misconfigured automation script.

  The SSO lockout policy is set to lock accounts after 5 failed attempts. No other

  users have Administrator privilege. Engineers must unlock the account using the

  vSphere SSO CLI tool (sso-config.sh) directly on the vCenter appliance.


  OBJECTIVE: SSH into the vCenter VCSA appliance and access the SSO management CLI; Verify the administrator
  account is locked using sso-config.sh; Unlock the account and optionally reset the password. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- SSH into the vCenter VCSA appliance and access the SSO management CLI
- Verify the administrator account is locked using sso-config.sh
- Unlock the account and optionally reset the password
- Update the automation script to use a non-admin service account
