description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vmware: Datastores — Build
  From Scratch` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The vSphere lab is ready but datastores is not configured yet. Required tools
  may already be installed; your job is to create the configuration and bring the capability online. Build
  datastores from scratch in this vmware lab. You start from a minimal environment and must produce a
  working configuration that demonstrates VMFS/NFS datastores, capacity, and multipathing. Plan, implement,
  then prove it works.


  OBJECTIVE: A working datastores setup must exist by the end of this lab; Configuration should follow
  team conventions and be easy to audit; The result should pass validation without manual cleanup. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working datastores setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The vSphere lab is ready but datastores is not configured yet. Required tools may already
  be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the vSphere lab. For datastores, inspect
    datastore usage, paths, and VM storage before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with datastore usage, paths, and VM storage.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. The result should pass validation without manual cleanup.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
