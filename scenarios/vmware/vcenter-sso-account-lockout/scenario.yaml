title: vCenter SSO Administrator Locked Out
slug: vcenter-sso-account-lockout
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vCenter SSO Administrator
  Locked Out` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows the SSO administrator account locked. The vCenter SSO administrator
  account is locked after repeated failed logins, blocking admin access. Unlock the account and confirm
  access is restored.


  OBJECTIVE: Confirm the SSO admin account is locked; Unlock the SSO administrator account; Verify the
  account is unlocked. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
