title: ESXi Management Network Isolated
slug: esxi-management-network-isolated
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `ESXi Management Network Isolated`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows an ESXi host disconnected with its management network down.
  An ESXi host is unmanageable because its management network is isolated, showing it disconnected in
  vCenter. Restore the management network and reconnect the host.


  OBJECTIVE: Confirm the host management network is isolated; Restore the management network and reconnect;
  Verify the host is connected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
