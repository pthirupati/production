title: Enable HA and DRS on Production Cluster
slug: vmware-enable-ha-drs
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Enable HA and DRS on Production
  Cluster` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter cluster Cluster-01 with vSphere HA and DRS turned off; hosts are imbalanced
  and VMs have no failover protection. After maintenance, Cluster-01 has both vSphere HA and DRS left
  disabled. Without HA, VMs won''t automatically restart if a host fails; without DRS, load is not balanced
  and one host is overloaded. Re-enable HA for failover protection and DRS for load balancing, then trigger
  an initial balancing pass.


  OBJECTIVE: Open the cluster Configure tab and confirm HA and DRS are off; Enable vSphere HA on Cluster-01;
  Enable vSphere DRS and run an initial balancing pass. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
