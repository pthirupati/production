description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vmware: Jinja2 Templates
  — Automation Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for Jinja2 templates. Automate the boring
  parts without hiding important safety checks. Automation lab: remove toil around Jinja2 templates. Codify
  repeatable steps for variables, filters, and conditionals in templates and prove the automation is idempotent.


  OBJECTIVE: Day-2 Jinja2 templates work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 Jinja2 templates work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for Jinja2 templates. Automate the boring parts without
