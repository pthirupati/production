description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vmware: Snapshots — Daily
  Operations` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The vSphere lab is healthy enough for scheduled work on snapshots. Complete
  the maintenance task without unnecessary downtime. Day-2 operations: perform a routine snapshots task
  safely in vmware. Follow change control — inspect, change, verify — while working with snapshot trees,
  consolidation, and disk growth.


  OBJECTIVE: Day-2 snapshots work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 snapshots work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The vSphere lab is healthy enough for scheduled work on snapshots. Complete the maintenance
  task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
