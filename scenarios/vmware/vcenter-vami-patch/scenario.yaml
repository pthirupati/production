description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vCenter VAMI Pending Appliance
  Patches` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter Server Appliance with pending updates available in VAMI that have
  not been staged or installed. The vCenter Server Appliance has pending VAMI (appliance-management) patches
  that haven''t been applied, leaving the appliance OS/components out of date. Using the VAMI interface,
  check for the pending appliance updates, stage them, and install so the appliance is patched and current.


  OBJECTIVE: Check the pending appliance patches in VAMI; Stage the available updates; Install the patches
  and confirm the appliance is up to date. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Check the pending appliance patches in VAMI
- Stage the available updates
- Install the patches and confirm the appliance is up to date
