description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Datastore at 95% Capacity
  — Risk of VM Suspension` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. datastore-prod-01 at 95% (950 GB / 1 TB).

  Orphaned VMDK files: ~40 GB. Old ISO files in /ISOs folder: ~30 GB.

  Snapshot delta files for dev-vm-03: ~25 GB. Datastore "datastore-prod-01" is at 95% capacity (950 GB
  of 1 TB). VMware has

  issued a "Datastore usage on disk" alarm. If the datastore reaches 100%, all VMs

  on it will be suspended immediately, causing a production outage. Engineers must

  immediately free space by cleaning up orphaned VMDKs, snapshots, and ISO files,

  or extend the VMDK/LUN size via the storage team.


  OBJECTIVE: Acknowledge the datastore alarm in vCenter and assess urgency; Browse the datastore to identify
  large orphaned files, snapshots, and ISOs; Delete orphaned VMDKs and old ISO files to recover at least
  100 GB. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Acknowledge the datastore alarm in vCenter and assess urgency
- Browse the datastore to identify large orphaned files, snapshots, and ISOs
- Delete orphaned VMDKs and old ISO files to recover at least 100 GB
- Verify datastore drops below 85% capacity and alarm clears
initial_state: 'VMware vCenter simulation. datastore-prod-01 at 95% (950 GB / 1 TB).

  Orphaned VMDK files: ~40 GB. Old ISO files in /ISOs folder: ~30 GB.

  Snapshot delta files for dev-vm-03: ~25 GB.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
