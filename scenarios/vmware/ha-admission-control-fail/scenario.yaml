description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `HA Admission Control Blocking
  VM Power-On` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. 3-host cluster: esxi-01 (active), esxi-02 (active),

  esxi-03 (maintenance mode). HA admission control: slot-based, 2 host failures.

  analytics-01 power-on fails with insufficient failover resources error. Engineers cannot power on a
  VM "analytics-01" in the production cluster. The error

  is: "Insufficient resources to satisfy configured failover level for vSphere HA."

  The cluster''s HA admission control is set to guarantee failover capacity for 2 hosts,

  but the cluster only has 3 hosts and current usage is too high. A recent host failure

  took one host to maintenance mode, leaving only 2 active hosts, which cannot satisfy

  the 2-host failover reservation.


  OBJECTIVE: Review the cluster HA configuration and current admission control policy; Understand why
  power-on is being rejected given current host count; Adjust the admission control policy to "1 host
  failure" to match current capacity. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Review the cluster HA configuration and current admission control policy
- Understand why power-on is being rejected given current host count
- Adjust the admission control policy to "1 host failure" to match current capacity
- Successfully power on analytics-01 and verify HA is still protecting the cluster
