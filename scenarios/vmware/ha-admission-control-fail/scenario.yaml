slug: ha-admission-control-fail
title: "HA Admission Control Blocking VM Power-On"
technology: VMware
category: High Availability
difficulty: medium
time_limit: 1200
max_score: 100
lab_mode: simulation
simulation_type: vmware
infrastructure_type: simulation
jira_priority: High
is_free: false
description: |
  Engineers cannot power on a VM "analytics-01" in the production cluster. The error
  is: "Insufficient resources to satisfy configured failover level for vSphere HA."
  The cluster's HA admission control is set to guarantee failover capacity for 2 hosts,
  but the cluster only has 3 hosts and current usage is too high. A recent host failure
  took one host to maintenance mode, leaving only 2 active hosts, which cannot satisfy
  the 2-host failover reservation.
objectives:
  - Review the cluster HA configuration and current admission control policy
  - Understand why power-on is being rejected given current host count
  - Adjust the admission control policy to "1 host failure" to match current capacity
  - Successfully power on analytics-01 and verify HA is still protecting the cluster
initial_state: |
  VMware vCenter simulation. 3-host cluster: esxi-01 (active), esxi-02 (active),
  esxi-03 (maintenance mode). HA admission control: slot-based, 2 host failures.
  analytics-01 power-on fails with insufficient failover resources error.
hints:
  - order: 1
    cost: 10
    content: "Select the cluster → Configure → vSphere Availability → Edit.
      Look at the Admission Control section. Note the current 'Host failures cluster
      tolerates' value (2) and compare to available active hosts (2)."
  - order: 2
    cost: 15
    content: "Change 'Host failures cluster tolerates' from 2 to 1.
      This is appropriate while one host is in maintenance mode.
      Document this change and create a task to revert when esxi-03 comes back online."
  - order: 3
    cost: 20
    content: "After changing admission control, retry powering on analytics-01.
      Also check: Monitor → vSphere HA → Summary to see the current slot size and
      available capacity. Consider using 'Percentage of cluster resources reserved'
      instead of slot-based policy for more flexibility."
