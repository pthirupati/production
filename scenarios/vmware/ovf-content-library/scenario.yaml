title: Deploy VM from Content Library OVF
slug: vmware-ovf-content-library
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Deploy VM from Content Library
  OVF` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter with a content library containing OVF templates (including tiny-linux.ova).
  No VM has been deployed from it yet. A new Linux VM should be deployed from the FixitLab content library''s
  OVF template (tiny-linux.ova) using the Deploy OVF wizard, but it hasn''t been done yet. Deploying from
  the content library is the standard, repeatable way to stamp out VMs from a known-good image. Run the
  OVF deploy wizard to create the VM on the cluster.


  OBJECTIVE: Open the content library and locate the tiny-linux OVF template; Deploy tiny-linux.ova to
  the cluster via the OVF wizard; Verify the new VM is created in inventory. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
