title: ESXi Time Drift Breaking AD Auth
slug: esxi-ntp-drift-kerberos
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `ESXi Time Drift Breaking
  AD Auth` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows ESXi hosts not synchronized to NTP. ESXi hosts drifted out of
  time sync, which breaks AD-based authentication and SSO. Restore NTP synchronization across the hosts.


  OBJECTIVE: Confirm the hosts are not NTP-synced; Restore the NTP configuration/sync; Verify all hosts
  are NTP synchronized. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
