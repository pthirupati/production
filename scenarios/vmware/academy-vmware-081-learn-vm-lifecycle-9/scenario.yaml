description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vmware: Vm Lifecycle — Fundamentals
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The vSphere lab is online with a starter VM lifecycle setup. Some pieces are
  intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
  This beginner-friendly vmware lab introduces VM lifecycle. You will explore create, template deploy,
  power state, and guest tools on the vSphere lab. Read the environment first, then follow the guided
  steps — no prior production experience required.


  OBJECTIVE: Understand how VM lifecycle work in this lab environment; Identify the main status and configuration
  signals for VM lifecycle; Confirm you can read the current state confidently before changing anything.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
