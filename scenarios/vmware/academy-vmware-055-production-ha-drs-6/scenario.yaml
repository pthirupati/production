hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — cluster HA/DRS settings and recommendations.

    2. Write down what looks normal versus wrong or missing for HA and DRS.

    3. Recall the core idea: cluster availability and load balancing. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for HA and DRS.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — cluster HA/DRS settings and recommendations.

    2. Apply production standards for HA and DRS: resource limits, monitoring, access
    controls, and a written rollback step.

    3. Verify the result — HA restarts VMs and DRS balances load.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-vmware-055-production-ha-drs-6.conf`,
    then click Check Solution.'
