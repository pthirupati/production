description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `ESXi Host Disconnected from
  vCenter - VMs Inaccessible via` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. esxi-02.lab.local shows Disconnected in vCenter.

  Host IP: 192.168.10.12. Port 902 is blocked by a firewall rule change.

  VMs on the host are running but appear grayed out in vCenter. ESXi host esxi-02.lab.local shows as "Disconnected"
  in vCenter. VMs on this host

  are still running but cannot be managed through vCenter. The disconnection was

  caused by the vpxd service on vCenter being unable to reach the host agent (hostd)

  after a firewall rule change blocked port 902. Engineers must restore connectivity

  and reconnect the host to vCenter without disrupting running VMs.


  OBJECTIVE: Verify ESXi host is reachable via ICMP and SSH; Check if the hostd service is running on
  the ESXi host; Restore firewall access on port 902 between vCenter and ESXi. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Verify ESXi host is reachable via ICMP and SSH
- Check if the hostd service is running on the ESXi host
- Restore firewall access on port 902 between vCenter and ESXi
- Reconnect the host from vCenter and verify VMs become manageable
initial_state: 'VMware vCenter simulation. esxi-02.lab.local shows Disconnected in vCenter.

  Host IP: 192.168.10.12. Port 902 is blocked by a firewall rule change.

  VMs on the host are running but appear grayed out in vCenter.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
