---
slug: esxi-host-disconnected
title: "ESXi Host Disconnected from vCenter — VMs Inaccessible via GUI"
technology: VMware
category: Host Management
difficulty: medium
time_limit: 1200
max_score: 100
lab_mode: simulation
simulation_type: vmware
infrastructure_type: simulation
jira_priority: High
is_free: false
description: |
  ESXi host esxi-02.lab.local shows as "Disconnected" in vCenter. VMs on this host
  are still running but cannot be managed through vCenter. The disconnection was
  caused by the vpxd service on vCenter being unable to reach the host agent (hostd)
  after a firewall rule change blocked port 902. Engineers must restore connectivity
  and reconnect the host to vCenter without disrupting running VMs.
objectives:
  - Verify ESXi host is reachable via ICMP and SSH
  - Check if the hostd service is running on the ESXi host
  - Restore firewall access on port 902 between vCenter and ESXi
  - Reconnect the host from vCenter and verify VMs become manageable
initial_state: |
  VMware vCenter simulation. esxi-02.lab.local shows Disconnected in vCenter.
  Host IP: 192.168.10.12. Port 902 is blocked by a firewall rule change.
  VMs on the host are running but appear grayed out in vCenter.
hints:
  - order: 1
    cost: 10
    content: "SSH to ESXi: ssh root@192.168.10.12
      Check hostd: /etc/init.d/hostd status
      Check vpxa (vCenter agent): /etc/init.d/vpxa status
      Both must be running for vCenter communication."
  - order: 2
    cost: 15
    content: "Test port 902 from vCenter: nc -zv 192.168.10.12 902
      If blocked, update firewall rules to allow vCenter IP → ESXi port 902.
      On ESXi: esxcli network firewall ruleset set --ruleset-id=vpxHeartbeat --enabled=true"
  - order: 3
    cost: 20
    content: "After restoring network access, reconnect from vCenter GUI:
      Right-click esxi-02 → Connection → Connect.
      Or right-click → Connection → Reconnect.
      Wait for the host to show as 'Connected' and VMs to become manageable.
      Check Recent Tasks for any reconnection errors."
