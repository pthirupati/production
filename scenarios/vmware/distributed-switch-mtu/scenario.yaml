description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `DVS MTU Mismatch — Jumbo
  Frame Packets Being Dropped` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. DVS "Production-DVS" MTU: 1500.

  vmk2 (NFS): MTU 1500. vmk3 (vSAN): MTU 1500. Physical switches: MTU 9000.

  NFS mounts: /vmfs/volumes/nfs-storage intermittently timing out. The NFS datastore mounts on all ESXi
  hosts are experiencing intermittent timeouts

  and the vSAN network is showing packet loss. Investigation reveals the Distributed

  Virtual Switch (DVS) MTU is set to the default 1500 bytes, while the NFS storage

  network and vSAN kernel ports require jumbo frames (MTU 9000). The physical

  switches already support jumbo frames but the DVS has not been updated to match.


  OBJECTIVE: Verify the current DVS MTU setting in vCenter; Check the vmkernel adapters (vmk) MTU settings
  for NFS and vSAN; Change the DVS MTU to 9000 (jumbo frames). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Verify the current DVS MTU setting in vCenter
- Check the vmkernel adapters (vmk) MTU settings for NFS and vSAN
- Change the DVS MTU to 9000 (jumbo frames)
- Update vmkernel adapter MTUs to 9000 and verify NFS/vSAN connectivity
