slug: nsx-microsegmentation
title: NSX-T Micro-Segmentation Rule Missing
technology: VMware
category: vCenter Administration
difficulty: medium
scenario_type: fix
time_limit: 1200
max_score: 100
lab_mode: simulation
simulation_type: vmware
infrastructure_type: simulation
jira_priority: Medium
is_free: false
description: The production tier needs NSX-T distributed-firewall micro-segmentation, but the NSX-T manager
  isn't connected and the required Distributed Firewall (DFW) allow rule doesn't exist — so the intended
  east-west security policy isn't being enforced. Connect NSX-T and create the DFW rule that permits the
  prod tier's required traffic.
objectives:
- Connect the NSX-T manager
- Create the required DFW allow rule for the prod tier
- Verify the rule is published and enforcing
hints:
- order: 1
  cost: 10
  content: First connect NSX-T from the platform services panel in the simulator (register the NSX-T manager
    with vCenter).
- order: 2
  cost: 15
  content: 'In the NSX Distributed Firewall, add a new rule for the prod tier: source/destination groups
    for the production workloads, the required service/ports, and Action: Allow.'
- order: 3
  cost: 20
  content: Publish the rule and confirm it shows as applied to the prod tier so the intended micro-segmentation
    policy is enforced.
initial_state: vCenter environment where NSX-T isn't connected and no DFW micro-segmentation rule exists
  for the production tier.
