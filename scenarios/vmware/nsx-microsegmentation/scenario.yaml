description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `NSX-T Micro-Segmentation
  Rule Missing` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter environment where NSX-T isn''t connected and no DFW micro-segmentation
  rule exists for the production tier. The production tier needs NSX-T distributed-firewall micro-segmentation,
  but the NSX-T manager isn''t connected and the required Distributed Firewall (DFW) allow rule doesn''t
  exist — so the intended east-west security policy isn''t being enforced. Connect NSX-T and create the
  DFW rule that permits the prod tier''s required traffic.


  OBJECTIVE: Connect the NSX-T manager; Create the required DFW allow rule for the prod tier; Verify the
  rule is published and enforcing. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Connect the NSX-T manager
- Create the required DFW allow rule for the prod tier
- Verify the rule is published and enforcing
