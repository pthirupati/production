description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Enhanced Linked Mode — DC-DR
  Not Visible` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter where DC-DR is not joined via Enhanced Linked Mode, so the DR datacenter
  and esxi-dr-01 don''t show in the shared inventory. The recovery datacenter DC-DR (and its host esxi-dr-01)
  isn''t visible because Enhanced Linked Mode hasn''t been enabled, so the two vCenter instances aren''t
  sharing a single inventory view. Enable Enhanced Linked Mode so DC-DR appears alongside the production
  datacenter and can be managed from one pane.


  OBJECTIVE: Confirm DC-DR / esxi-dr-01 are absent from the shared inventory; Enable Enhanced Linked Mode
  to join the vCenter instances; Verify DC-DR and esxi-dr-01 appear in inventory. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm DC-DR / esxi-dr-01 are absent from the shared inventory
- Enable Enhanced Linked Mode to join the vCenter instances
- Verify DC-DR and esxi-dr-01 appear in inventory
