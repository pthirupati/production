title: VM Network Adapter Disconnected
slug: vm-network-adapter-disconnected
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `VM Network Adapter Disconnected`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows web-prod-01 with a disconnected network adapter. web-prod-01
  is offline on the network because its virtual NIC is disconnected. Reconnect the adapter and confirm
  connectivity.


  OBJECTIVE: Confirm the VM''s NIC is disconnected; Reconnect the virtual network adapter; Verify the
  adapter is connected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
