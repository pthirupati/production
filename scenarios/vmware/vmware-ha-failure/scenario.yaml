title: HA Host Failure
slug: vmware-ha-failure
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `HA Host Failure` during a
  realistic incident. The business impact is reduced service reliability until the underlying state is
  repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter cluster where esxi-01 is "not responding" and web-prod-01 is powered
  off as a result; HA should recover the VM on another host. An ESXi host (esxi-01) has stopped responding
  and a production VM (web-prod-01) that was running on it is now down. In a properly configured cluster,
  vSphere HA should restart the VM on a surviving host. Investigate the host/HA state, identify the affected
  VM, and restore the workload — confirming HA behavior or powering the VM on elsewhere.


  OBJECTIVE: Review cluster HA status and the health of the unresponsive host; Identify the VMs affected
  by the host failure; Restore the affected VM''s power state on a healthy host. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
lab_mode: simulation
simulation_type: vmware
jira_priority: Critical
time_limit: 1500
max_score: 100
objectives:
- Review cluster HA status and the health of the unresponsive host
- Identify the VMs affected by the host failure
- Restore the affected VM's power state on a healthy host
initial_state: vCenter cluster where esxi-01 is "not responding" and web-prod-01 is powered off as a result;
  HA should recover the VM on another host.
hints:
