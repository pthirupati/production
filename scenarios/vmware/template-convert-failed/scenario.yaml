description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Converting VM to Template
  Failed - Snapshots Blocking` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. golden-image-ubuntu22 has 1 snapshot: "pre-sysprep-backup".

  VM is powered off. Template conversion fails with snapshot error.

  Target template name: ubuntu-22-04-template. An attempt to convert VM "golden-image-ubuntu22" to a template
  failed with:

  "Cannot convert a virtual machine that has one or more snapshots to a template."

  The golden image VM was prepared for templating but a backup snapshot was taken

  before the final sysprep/cloud-init configuration was applied. The snapshot must

  be committed before template conversion can proceed.


  OBJECTIVE: Verify the error by checking the Recent Tasks for the failed conversion task; Open Snapshot
  Manager for golden-image-ubuntu22 and review existing snapshots; Delete the backup snapshot to consolidate
  the disk. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Verify the error by checking the Recent Tasks for the failed conversion task
- Open Snapshot Manager for golden-image-ubuntu22 and review existing snapshots
- Delete the backup snapshot to consolidate the disk
- Convert the VM to a template successfully and verify it appears in VM Templates
initial_state: 'VMware vCenter simulation. golden-image-ubuntu22 has 1 snapshot: "pre-sysprep-backup".

  VM is powered off. Template conversion fails with snapshot error.

  Target template name: ubuntu-22-04-template.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
