- Confirm SSH to web-prod-01 fails from the lab SSH drawer
- Open VMware vCenter from the Jira ticket and launch the guest console
- Verify the guest OS is hung (no console response)
- Update the Jira incident with console findings
- Obtain customer approval for a reboot
- Reset/reboot the VM in vCenter and confirm SSH works again
