title: Hung Linux Guest — SSH Unreachable via VMware
slug: vmware-guest-hung-ssh
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Hung Linux Guest — SSH Unreachable
  via VMware` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: web-prod-01 is poweredOn but guest_hung=true. SSH times out. Jira ticket linked.
  Production Linux server web-prod-01 is unreachable over SSH. The VM shows powered on in

  monitoring but the guest OS is hung. Use vCenter, the web console, Jira, and customer

  coordination before rebooting.


  OBJECTIVE: Confirm SSH to web-prod-01 fails from the lab SSH drawer; Open VMware vCenter from the Jira
  ticket and launch the guest console; Verify the guest OS is hung (no console response). Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
lab_mode: simulation
simulation_type: vmware
jira_priority: High
time_limit: 1200
max_score: 100
