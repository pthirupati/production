title: vCenter RBAC Permission Missing
slug: vmware-vcenter-rbac-missing
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vCenter RBAC Permission Missing`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter where the lab_vmware principal lacks VM-admin permissions on the DC-Prod
  datacenter, so VM operations are denied. A lab operator (lab_vmware) can''t perform required VM operations
  because they have no vCenter role assigned at the right inventory level — vCenter denies the actions
  for lack of permission. Assign the appropriate role (Virtual Machine Administrator) on the DC-Prod datacenter
  so the operator can manage VMs, following least-privilege scoping.


  OBJECTIVE: Confirm lab_vmware lacks permissions on DC-Prod; Add the Virtual Machine Administrator role
  for lab_vmware on DC-Prod; Verify the operator can now perform the required VM operations. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
