title: ESXi Host Patch Pending Reboot
slug: vmware-esxi-patch-pending
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `ESXi Host Patch Pending Reboot`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter-managed host esxi-01 reporting 3 pending ESXi patches and an active
  compliance alarm; updates have not been installed. ESXi host esxi-01 has pending security patches and
  is raising a compliance alarm. Until the updates are staged and installed (and the host is remediated),
  it remains non-compliant and potentially vulnerable. Use the host''s Updates tab to check for and install
  the pending patches, clearing the compliance alarm.


  OBJECTIVE: Open esxi-01 -> Updates tab and review the pending patches; Check for updates and install
  the pending ESXi patches; Confirm the host becomes compliant and the alarm clears. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
