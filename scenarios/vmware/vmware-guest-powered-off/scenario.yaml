- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with VMs, datastores, vCenter, and ESXi tasks.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Power on the VM and verify it returns to service.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
