- Open the vCenter simulator from the Jira ticket
- Identify the powered-off VM (web-prod-01)
- Power on the VM and verify it returns to service
initial_state: vCenter shows web-prod-01 powered off while the ESXi hosts are connected and healthy; the
  production service is down until the VM is started.
hints:
