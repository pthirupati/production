title: VM Guest Powered Off
slug: vmware-guest-powered-off
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `VM Guest Powered Off` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows web-prod-01 powered off while the ESXi hosts are connected and
  healthy; the production service is down until the VM is started. A production web VM (web-prod-01) is
  powered off, so the service it hosts is down. The ESXi hosts are healthy and connected — the VM simply
  needs to be investigated and powered back on. Use the vCenter simulator (reached from the Jira ticket)
  to find the powered-off VM and restore service.


  OBJECTIVE: Open the vCenter simulator from the Jira ticket; Identify the powered-off VM (web-prod-01);
  Power on the VM and verify it returns to service. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
