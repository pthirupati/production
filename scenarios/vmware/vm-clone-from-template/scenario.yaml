description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Clone from Template Failing
  - Customization Spec` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. Template: ubuntu-22-04-template.

  Customization spec: linux-static-ip-spec has hostname set to "APP_SERVER_01" (invalid).

  Linux requires: lowercase letters, numbers, hyphens only (no underscores). Cloning from the Ubuntu 22.04
  template using a customization specification

  "linux-static-ip-spec" is failing after the VM powers on for the first time.

  The VM gets stuck in an endless reboot loop and the customization agent reports:

  "Customization failed: Unable to set hostname — hostname string is invalid."

  The customization spec is using a Windows-style hostname format (NETBIOS) which

  is incompatible with Linux hostname requirements.


  OBJECTIVE: Examine the failed customization spec in vCenter Customization Specifications Manager; Identify
  the invalid hostname configuration in the Linux spec; Fix the hostname format to be RFC 1123 compliant
  (lowercase, hyphens only). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Examine the failed customization spec in vCenter Customization Specifications Manager
- Identify the invalid hostname configuration in the Linux spec
- Fix the hostname format to be RFC 1123 compliant (lowercase, hyphens only)
- Redeploy the clone and verify successful customization and guest OS startup
