title: Guest Disk Not Visible After Add
slug: vmware-guest-disk-missing
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Guest Disk Not Visible After
  Add` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter guest web-prod-01 with a freshly attached 20 GB disk at the hypervisor
  that the OS hasn''t detected; the disk must be rescanned and prepared from the console. A new 20 GB
  virtual disk was added to web-prod-01 at the vSphere layer, but the Linux guest doesn''t see it because
  the SCSI bus hasn''t been rescanned. The disk must be detected inside the guest, then partitioned/formatted
  and mounted before it''s usable. Rescan, create a filesystem, and mount the new disk from the VM console.


  OBJECTIVE: Open the web-prod-01 console and confirm the new disk isn''t visible; Rescan the SCSI bus
  so the guest detects the disk; Create an ext4 filesystem and mount the disk at /data. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
