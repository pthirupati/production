title: ESXi Host Disconnected
slug: vmware-host-disconnected
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `ESXi Host Disconnected` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows esxi-01.fixitlab.local as disconnected; its VMs are unmanageable
  via the GUI until the host is reconnected. An ESXi host (esxi-01.fixitlab.local) shows as Disconnected
  in vCenter, so its VMs can''t be managed through the GUI and the host isn''t contributing to the cluster.
  The management agents or connection state need restoring. Reconnect the host from vCenter and verify
  the cluster returns to a healthy, fully-connected state.


  OBJECTIVE: Open the vCenter simulator from the Jira ticket and find the disconnected host; Reconnect
  esxi-01 to vCenter; Verify the host and cluster return to a healthy connected state. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
