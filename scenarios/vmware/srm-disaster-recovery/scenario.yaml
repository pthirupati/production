is_free: false
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `SRM Site Recovery Not Configured`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter spanning DC-Prod and DC-DR where SRM replication/protection is not
  configured; no protection groups or recovery plans exist. Site Recovery Manager (SRM) protection between
  the production site (DC-Prod) and the recovery site (DC-DR) isn''t configured, so there is no orchestrated
  disaster-recovery plan and protected VMs can''t be failed over. Configure SRM protection groups and
  a recovery plan, then run a non-disruptive test to validate recovery.


  OBJECTIVE: Ensure the sites are linked, then configure SRM protection groups; Create a recovery plan
  covering the protected VMs; Run a recovery plan test and confirm it succeeds. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Ensure the sites are linked, then configure SRM protection groups
- Create a recovery plan covering the protected VMs
- Run a recovery plan test and confirm it succeeds
