description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `High VM CPU Ready Time —
  Application Performance Degraded` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. db-prod-01 on esxi-01 showing 22% CPU ready.

  esxi-01: 16 pCPU threads, 32 vCPUs allocated across all VMs (2:1 overcommit).

  esxi-02: 16 pCPU threads, 12 vCPUs allocated (0.75:1 — capacity available). A critical application VM
  "db-prod-01" is experiencing high CPU ready time (over

  20%), meaning the VM is waiting for physical CPU time that is not available. The

  ESXi host esxi-01.lab.local is overcommitted with 32 vCPUs across VMs on a host

  that has only 16 physical CPU threads. Engineers must use vSphere performance

  charts to diagnose the CPU ready issue and migrate the VM to a less loaded host.


  OBJECTIVE: View CPU ready time for db-prod-01 in vSphere performance charts; Identify the host-level
  CPU utilization and overcommitment ratio; Use vMotion to migrate db-prod-01 to esxi-02.lab.local. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- View CPU ready time for db-prod-01 in vSphere performance charts
- Identify the host-level CPU utilization and overcommitment ratio
- Use vMotion to migrate db-prod-01 to esxi-02.lab.local
- Verify CPU ready time drops below 5% after migration
