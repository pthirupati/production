description: 'CONTEXT: A team operating VMware vSphere has raised a ticket for `High VM CPU Ready Time
  — Application Performance Degraded`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab. The architecture is a single lab-primary
  node exposing VMs, datastores, vCenter, and ESXi tasks; treat it as the production host for this incident.
  All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter. db-prod-01 on esxi-01 showing 22% CPU ready.

  esxi-01: 16 pCPU threads, 32 vCPUs allocated across all VMs (2:1 overcommit).

  esxi-02: 16 pCPU threads, 12 vCPUs allocated (0.75:1 — capacity available).


  OBJECTIVE: View CPU ready time for db-prod-01 in vSphere performance charts; Identify the host-level
  CPU utilization and overcommitment ratio; Use vMotion to migrate db-prod-01 to esxi-02.lab.local. Acceptance
  criteria: the change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant VMs, datastores, vCenter, and ESXi tasks), changing one thing at a time. Check your
  work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- View CPU ready time for db-prod-01 in vSphere performance charts
- Identify the host-level CPU utilization and overcommitment ratio
- Use vMotion to migrate db-prod-01 to esxi-02.lab.local
- Verify CPU ready time drops below 5% after migration
