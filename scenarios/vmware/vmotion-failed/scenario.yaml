description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vMotion Failed — Incompatible
  CPU Feature Sets Between Hosts` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. Cluster has no EVC baseline set.

  esxi-01: Intel Haswell (4th gen). esxi-03: Intel Sandy Bridge (2nd gen).

  web-prod-02 has "Expose hardware assisted virtualization to guest" enabled. A vMotion migration of VM
  "web-prod-02" from esxi-01 to esxi-03 failed with:

  "The virtual machine''s CPU hardware is incompatible with this host." The two hosts

  have different CPU generations — esxi-01 has Intel Haswell processors and esxi-03

  has older Intel Sandy Bridge processors. The VM was configured to "Expose hardware

  assisted virtualization" which prevents migration to older CPU generations without

  Enhanced vMotion Compatibility (EVC).


  OBJECTIVE: Review the vMotion compatibility error in the Recent Tasks panel; Check the EVC baseline
  configured on the cluster; Enable EVC on the cluster at the Sandy Bridge baseline. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Review the vMotion compatibility error in the Recent Tasks panel
- Check the EVC baseline configured on the cluster
- Enable EVC on the cluster at the Sandy Bridge baseline
- Retry the vMotion migration and verify it succeeds
