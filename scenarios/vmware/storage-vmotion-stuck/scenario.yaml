description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Storage vMotion Stuck at
  73% — Migration Stalled for Hours` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. data-proc-01 Storage vMotion at 73% for 3+ hours.

  VM is powered on and serving traffic. Source: datastore1. Destination: datastore2.

  datastore1 snapshot delta files growing at 2 GB/hr due to continued VM writes. A Storage vMotion operation
  for VM "data-proc-01" from datastore1 to datastore2

  has been stuck at 73% for over 3 hours. The VM is still running but any further

  progress has halted. The stall is caused by high I/O on the VM combined with

  snapshots created during the migration, which are now growing faster than they

  can be committed. Engineers must safely abort the migration and retry during off-hours.


  OBJECTIVE: Check the Storage vMotion task status and duration in Recent Tasks; Verify the VM is still
  running normally despite the stalled migration; Cancel the Storage vMotion task safely from vCenter.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Check the Storage vMotion task status and duration in Recent Tasks
- Verify the VM is still running normally despite the stalled migration
- Cancel the Storage vMotion task safely from vCenter
- Plan and retry the migration during a low-I/O maintenance window
