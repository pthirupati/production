slug: storage-vmotion-stuck
title: "Storage vMotion Stuck at 73% — Migration Stalled for Hours"
technology: VMware
category: Storage
difficulty: hard
time_limit: 1500
max_score: 100
lab_mode: simulation
simulation_type: vmware
infrastructure_type: simulation
jira_priority: High
is_free: false
description: |
  A Storage vMotion operation for VM "data-proc-01" from datastore1 to datastore2
  has been stuck at 73% for over 3 hours. The VM is still running but any further
  progress has halted. The stall is caused by high I/O on the VM combined with
  snapshots created during the migration, which are now growing faster than they
  can be committed. Engineers must safely abort the migration and retry during off-hours.
objectives:
  - Check the Storage vMotion task status and duration in Recent Tasks
  - Verify the VM is still running normally despite the stalled migration
  - Cancel the Storage vMotion task safely from vCenter
  - Plan and retry the migration during a low-I/O maintenance window
initial_state: |
  VMware vCenter simulation. data-proc-01 Storage vMotion at 73% for 3+ hours.
  VM is powered on and serving traffic. Source: datastore1. Destination: datastore2.
  datastore1 snapshot delta files growing at 2 GB/hr due to continued VM writes.
hints:
  - order: 1
    cost: 10
    content: "Select data-proc-01 → Monitor → Tasks & Events → Tasks to see the
      Storage vMotion task. Note the start time and check if progress has changed
      in the last 30 minutes. If stuck, confirm with datastore storage browser
      that delta VMDKs are growing on the source datastore."
  - order: 2
    cost: 15
    content: "To cancel: find the Storage vMotion task in Recent Tasks.
      Right-click it and select 'Cancel Task'. Allow up to 10 minutes for
      cancellation as VMware must safely roll back the partial migration.
      Do NOT power off the VM — it is still running from source datastore."
  - order: 3
    cost: 20
    content: "After cancellation, verify: the VM shows no snapshots (they should
      be automatically cleaned up), the VM storage policy shows datastore1 as the
      home datastore, and VM I/O is back to normal.
      For the retry: schedule for 2am when VM write rate drops. Consider using
      storage I/O control to throttle the VM during migration."
