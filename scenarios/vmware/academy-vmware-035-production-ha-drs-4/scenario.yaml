description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vmware: Ha And Drs — Production
  Readiness` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but HA and DRS is not production ready — missing
  guardrails, runbooks, or capacity checks. Production readiness for HA and DRS. Harden, document, and
  validate cluster availability and load balancing so the change is safe to run during a maintenance window.


  OBJECTIVE: Day-2 HA and DRS work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 HA and DRS work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but HA and DRS is not production ready — missing guardrails,
  runbooks, or capacity checks.
hints:
