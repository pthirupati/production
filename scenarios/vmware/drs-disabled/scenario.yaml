description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `DRS Disabled - Hosts Severely
  Imbalanced, One Host` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. 3-host cluster. DRS: Disabled.

  esxi-01: 95% CPU. esxi-02: 28% CPU. esxi-03: 32% CPU.

  18 VMs running, mostly concentrated on esxi-01. vSphere DRS is showing as "Disabled" on the production
  cluster. One ESXi host

  (esxi-01) is running at 95% CPU utilization while the other two hosts are at 30%.

  DRS was disabled 6 weeks ago during a troubleshooting session and never re-enabled.

  VMs are not being automatically balanced, causing performance degradation on the

  overloaded host. Engineers must enable DRS and run an initial balance.


  OBJECTIVE: Confirm DRS status is disabled on the cluster; Enable DRS in "Fully Automated" mode with
  a medium migration threshold; Run an initial DRS recommendation to balance the cluster. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm DRS status is disabled on the cluster
- Enable DRS in "Fully Automated" mode with a medium migration threshold
- Run an initial DRS recommendation to balance the cluster
- Verify VMs begin migrating from esxi-01 to less-loaded hosts
