title: Expand VM Disk Capacity
slug: vmware-add-disk
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Expand VM Disk Capacity`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter VM web-prod-01 with a single 40 GB disk; the application requires
  at least 100 GB, so more capacity must be added (online). The application VM web-prod-01 needs at least
  100 GB of disk but currently has only 40 GB, so it''s running out of space. Additional disk capacity
  should be added from vCenter without taking the VM down (hot-add). Add at least 60 GB more so the VM
  meets the 100 GB requirement, then confirm the new capacity.


  OBJECTIVE: Locate web-prod-01 in the vCenter inventory; Add at least 60 GB of additional disk capacity
  (hot-add); Verify the VM now meets the 100 GB requirement. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
lab_mode: simulation
simulation_type: vmware
jira_priority: Medium
time_limit: 900
max_score: 100
is_free: false
objectives:
- Locate web-prod-01 in the vCenter inventory
- Add at least 60 GB of additional disk capacity (hot-add)
- Verify the VM now meets the 100 GB requirement
initial_state: vCenter VM web-prod-01 with a single 40 GB disk; the application requires at least 100
  GB, so more capacity must be added (online).
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
