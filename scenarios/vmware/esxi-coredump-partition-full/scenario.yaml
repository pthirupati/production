title: ESXi Core Dump Partition Full
slug: esxi-coredump-partition-full
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `ESXi Core Dump Partition
  Full` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows the ESXi host''s core dump partition full. An ESXi host can''t
  write core dumps because its coredump partition is full, risking lost diagnostics on a PSOD. Clear/resize
  the coredump partition and confirm the alarm clears.


  OBJECTIVE: Confirm the core dump partition is full; Clear or resize the coredump partition; Verify the
  coredump alarm is cleared. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
