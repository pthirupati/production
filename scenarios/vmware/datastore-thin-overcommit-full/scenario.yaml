title: Datastore Full From Thin-Provision Overcommit
slug: datastore-thin-overcommit-full
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Datastore Full From Thin-Provision
  Overcommit` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows datastore-ssd-01 critically low on free space due to thin-provision
  growth. Thin-provisioned VMs grew and filled datastore-ssd-01, so VMs risk stunning when it hits 100%.
  Reclaim or add capacity until the datastore has healthy free space again.


  OBJECTIVE: Open the simulator and confirm datastore-ssd-01 is nearly full; Reclaim space (or add capacity)
  on the datastore; Verify the datastore has at least 50 GB free. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
