description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vmware: Tool Use — Observability
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The system runs, but tool use lacks useful telemetry. Dashboards/alerts are
  blank or noisy — improve signal quality. Observability task: make tool use visible in logs, metrics,
  or traces. On-call should answer ''what is broken?'' quickly using signals from function calling and
  schemas.


  OBJECTIVE: Day-2 tool use work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
