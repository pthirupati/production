title: Guest Kernel Module Missing
slug: vmware-guest-kernel-module
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Guest Kernel Module Missing`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter guest web-prod-01 where the nf_conntrack kernel module is not loaded,
  degrading connectivity. The fix is performed from the VM''s console. Networking on the guest web-prod-01
  is degraded because a required kernel module (nf_conntrack) isn''t loaded, so connection tracking /
  NAT-dependent traffic misbehaves. The fix is inside the guest, via the VM console. Load the module,
  verify it, and make it load on boot so the problem doesn''t recur.


  OBJECTIVE: Open the console on web-prod-01 and confirm the module is missing; Load nf_conntrack and
  verify with lsmod; Persist the module so it loads on boot. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
