description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vCenter Certificate Expired
  - Authentication and API` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. vCenter at vcenter.lab.local.

  SSL cert expired 3 days ago. SSH to VCSA available as root.

  certificate-manager utility available at /usr/lib/vmware-vmca/bin/certificate-manager. vCenter Server
  certificates have expired, causing: HTTPS connections to show

  certificate errors, vSphere Client authentication failures, and API calls from

  automation scripts failing with SSL certificate verification errors. The Machine

  SSL certificate and STS signing certificates in VMCA expired simultaneously.

  Engineers must renew the certificates using the vSphere Certificate Manager.


  OBJECTIVE: Confirm certificate expiry using openssl and the vCenter management UI; Access the vCenter
  appliance via SSH; Use certificate-manager to regenerate and replace expired certificates. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm certificate expiry using openssl and the vCenter management UI
- Access the vCenter appliance via SSH
- Use certificate-manager to regenerate and replace expired certificates
- Verify vSphere Client loads without certificate errors and API calls succeed
initial_state: 'VMware vCenter simulation. vCenter at vcenter.lab.local.

  SSL cert expired 3 days ago. SSH to VCSA available as root.

  certificate-manager utility available at /usr/lib/vmware-vmca/bin/certificate-manager.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
