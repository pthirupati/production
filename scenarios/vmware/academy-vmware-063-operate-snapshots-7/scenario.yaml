hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — snapshot manager and VM disk usage.

    2. Write down what looks normal versus wrong or missing for snapshots.

    3. Recall the core idea: snapshot trees, consolidation, and disk growth. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for snapshots.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — snapshot manager and VM disk usage.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — snapshots are consolidated and storage is reclaimed.

    4. Click Check Solution once `systemctl is-active nginx` returns active.'
