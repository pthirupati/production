description: 'Security review: harden distributed switch on this VMware vSphere system. Close unsafe defaults,
  enforce least privilege, and ensure port groups, uplinks, and VLAN trunks cannot be abused — without
  breaking legitimate use.'
objectives:
- Unsafe defaults related to distributed switch are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around distributed switch. Assume an
  auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — dvSwitch config, uplinks, and port group VLANs.

    2. Write down what looks normal versus wrong or missing for distributed switch.

    3. Recall the core idea: port groups, uplinks, and VLAN trunks. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for distributed switch.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — dvSwitch config, uplinks, and port group VLANs.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — port groups and uplinks carry the right VLANs.

    4. Click Check Solution once `systemctl is-active nginx` returns active.'
