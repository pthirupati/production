description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `VM Snapshot Deletion Failing
  — Datastore Almost Full` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. VM "app-prod-01" on datastore1 has a 3-week-old
  snapshot.

  Datastore1 is at 94% (950 GB / 1 TB). Snapshot delta files are ~55 GB.

  vCenter: vcenter.lab.local. ESXi host: esxi-01.lab.local. A VM snapshot created 3 weeks ago is failing
  to delete with error: "Unable to

  access file [datastore1] app-prod-01/app-prod-01-Snapshot3.vmsn." The datastore

  is at 94% capacity (950 GB of 1 TB used). The snapshot delta VMDK files have grown

  significantly as the base disk has continued to receive writes. Engineers must

  free space, then delete the snapshot chain using the vSphere Snapshot Manager.


  OBJECTIVE: Identify the VM with the failing snapshot in vSphere Client; Check datastore free space and
  identify large delta VMDK files; Free at least 60 GB of datastore space by migrating or deleting unused
  VMs. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the VM with the failing snapshot in vSphere Client
- Check datastore free space and identify large delta VMDK files
- Free at least 60 GB of datastore space by migrating or deleting unused VMs
- Delete the snapshot using Snapshot Manager and verify datastore space increases
initial_state: 'VMware vCenter simulation. VM "app-prod-01" on datastore1 has a 3-week-old snapshot.

  Datastore1 is at 94% (950 GB / 1 TB). Snapshot delta files are ~55 GB.

  vCenter: vcenter.lab.local. ESXi host: esxi-01.lab.local.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
