is_free: false
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Create VM Using New Virtual
  Machine Wizard` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter with a cluster, datastore, and network available. No new VM has been
  created yet; you will build one through the New Virtual Machine wizard. Build lab: create a brand-new
  virtual machine end to end using the full New Virtual Machine wizard. Starting from an empty target,
  walk all wizard steps — name, compute resource, storage, compatibility, guest OS, and hardware customization
  — and finish so the VM is created and visible in inventory.


  OBJECTIVE: Launch the New Virtual Machine wizard; Complete every wizard step (name, resource, storage,
  OS, hardware); Finish the wizard and verify the VM appears in inventory. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Launch the New Virtual Machine wizard
- Complete every wizard step (name, resource, storage, OS, hardware)
- Finish the wizard and verify the VM appears in inventory
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the vSphere lab. For Create VM Using New
    Virtual Machine Wizard, inspect VMs, datastores, vCenter, and ESXi tasks before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with VMs, datastores, vCenter, and ESXi tasks.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Finish the wizard and verify the VM appears in inventory.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
