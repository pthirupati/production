description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `VM NIC Disconnected After
  vCenter Migration - No Network` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. app-dev-05 on esxi-02. NIC shows Disconnected.

  Source host esxi-01 had port group "VM Network" on vSwitch0.

  esxi-02 has port groups "Management Network" and "VM Network Production" but

  no "VM Network" port group. VM needs to connect to "VM Network Production". After migrating VM "app-dev-05"
  to a new ESXi host via vMotion, the VM has lost

  all network connectivity. The VM is powered on and the guest OS is running, but

  ping and SSH are failing. Investigation shows the VM''s NIC is connected to a

  virtual switch port group "VM Network" that does not exist on the destination host.

  The VM''s NIC shows as "Disconnected" in the vSphere Client.


  OBJECTIVE: Verify the VM''s NIC status in vSphere Client settings; Identify the missing port group on
  the destination ESXi host; Either reconnect the NIC to an existing port group or create the missing
  one. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Verify the VM's NIC status in vSphere Client settings
- Identify the missing port group on the destination ESXi host
- Either reconnect the NIC to an existing port group or create the missing one
- Verify network connectivity is restored to the VM
