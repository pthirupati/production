description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vCenter Database Nearly Full
  - Performance Alerts and Event` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. VCSA at vcenter.lab.local. DB at 92% (18.4 GB /
  20 GB).

  Event retention: 365 days (misconfigured). Task retention: 365 days.

  Recommended: events 30 days, tasks 30 days. The vCenter Embedded PostgreSQL database is at 92% capacity.
  vCenter performance

  charts are not updating, alarms are delayed, and some events are being dropped.

  The database grew beyond normal due to a misconfigured event retention policy that

  was set to retain events for 365 days instead of the recommended 30 days. Engineers

  must archive old events and adjust the database retention settings.


  OBJECTIVE: Confirm vCenter database disk usage from the VCSA management UI; Access the embedded PostgreSQL
  and check database table sizes; Reduce the event and task retention period to reclaim database space.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm vCenter database disk usage from the VCSA management UI
- Access the embedded PostgreSQL and check database table sizes
- Reduce the event and task retention period to reclaim database space
- Run a database cleanup to archive old records and verify space is recovered
initial_state: 'VMware vCenter simulation. VCSA at vcenter.lab.local. DB at 92% (18.4 GB / 20 GB).

  Event retention: 365 days (misconfigured). Task retention: 365 days.

  Recommended: events 30 days, tasks 30 days.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status postgresql` and `pg_isready` for connection state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check service status and `/var/log/postgresql/` logs.

    2. Verify `pg_hba.conf` and `postgresql.conf` for listen addresses.

    3. Test with `psql -U postgres -c ''SELECT 1''`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix auth rules, data directory permissions, or port conflict.

    2. `systemctl restart postgresql`.

    3. Confirm `pg_isready` reports accepting connections.


    WHY: the database must accept connections, not just start.'
