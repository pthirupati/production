description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `ESXi Coredump Partition Full
  — Host Warning Alarm Active` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. esxi-01 shows coredump partition full alarm.

  SSH access to esxi-01 available. Coredump partition at /var/core/ is full.

  Multiple .gz coredump files from past PSOD events in /var/core/. ESXi host esxi-01.lab.local has a persistent
  warning alarm: "ESXi coredump

  partition is full." The host has generated multiple core dumps from past PSOD

  (Purple Screen of Death) events. These core dump files are consuming the entire

  coredump partition, preventing any future crash diagnostics from being captured.

  Engineers must review past dumps, archive important ones, and clear the partition.


  OBJECTIVE: SSH into the ESXi host and list existing coredump files; Identify and archive any diagnostics
  not yet sent to VMware Support; Remove old coredump files to clear the partition. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- SSH into the ESXi host and list existing coredump files
- Identify and archive any diagnostics not yet sent to VMware Support
- Remove old coredump files to clear the partition
- Verify the alarm clears and the partition has free space
