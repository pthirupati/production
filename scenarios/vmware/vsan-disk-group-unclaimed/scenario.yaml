title: vSAN Disk Group Unclaimed
slug: vsan-disk-group-unclaimed
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vSAN Disk Group Unclaimed`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows unclaimed vSAN disks on a host. vSAN capacity is reduced because
  a host''s disks are unclaimed and not contributing to the datastore. Claim the disks and confirm vSAN
  is healthy.


  OBJECTIVE: Confirm vSAN disks are unclaimed; Claim the disks into the disk group; Verify all vSAN disks
  are claimed. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
lab_mode: simulation
simulation_type: vmware
jira_priority: High
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Confirm vSAN disks are unclaimed
- Claim the disks into the disk group
- Verify all vSAN disks are claimed
initial_state: vCenter shows unclaimed vSAN disks on a host.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
