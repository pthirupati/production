title: Create Missing Distributed Port Group
slug: vmware-create-portgroup
category: VMware Networking
description: A new VLAN segment, Prod-VLAN-200, is needed on the distributed switch dvSwitch-Prod, but
  the corresponding distributed port group was never created. Until it exists, VMs cannot be attached
  to that VLAN and can't be migrated to the correct network. Create the port group with the right VLAN
  ID and confirm it appears in the network inventory.
difficulty: easy
lab_mode: simulation
simulation_type: vmware
jira_priority: Medium
time_limit: 900
max_score: 100
is_free: false
objectives:
- Identify that the Prod-VLAN-200 port group is missing from dvSwitch-Prod
- Create the distributed port group with VLAN ID 200
- Verify the new port group appears in the network inventory
initial_state: vCenter with dvSwitch-Prod present but missing the Prod-VLAN-200 distributed port group,
  so VMs have no way to connect to that VLAN segment.
hints:
- order: 1
  cost: 10
  content: In the Networking inventory, select dvSwitch-Prod and confirm there's no Prod-VLAN-200 port
    group under it.
- order: 2
  cost: 15
  content: 'Create it: right-click dvSwitch-Prod -> Distributed Port Group -> New Distributed Port Group
    (or Actions -> New Port Group). Name it Prod-VLAN-200.'
- order: 3
  cost: 20
  content: Set the VLAN type to VLAN and VLAN ID 200, finish the wizard, and confirm Prod-VLAN-200 now
    lists under dvSwitch-Prod so VMs can attach to it.
