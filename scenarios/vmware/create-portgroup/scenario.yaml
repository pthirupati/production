title: Create Missing Distributed Port Group
slug: vmware-create-portgroup
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Create Missing Distributed
  Port Group` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter with dvSwitch-Prod present but missing the Prod-VLAN-200 distributed
  port group, so VMs have no way to connect to that VLAN segment. A new VLAN segment, Prod-VLAN-200, is
  needed on the distributed switch dvSwitch-Prod, but the corresponding distributed port group was never
  created. Until it exists, VMs cannot be attached to that VLAN and can''t be migrated to the correct
  network. Create the port group with the right VLAN ID and confirm it appears in the network inventory.


  OBJECTIVE: Identify that the Prod-VLAN-200 port group is missing from dvSwitch-Prod; Create the distributed
  port group with VLAN ID 200; Verify the new port group appears in the network inventory. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
