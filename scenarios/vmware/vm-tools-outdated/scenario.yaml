description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `VMware Tools Outdated - VM
  Performance and Management` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. 8 VMs showing "VMware Tools: Outdated" status.

  Mix of Windows Server 2019 and Ubuntu 22.04 VMs.

  VMware Tools current version for ESXi 8.0: 12.3.0. Multiple Windows and Linux VMs in the production
  cluster are running VMware Tools

  versions that are more than 3 major versions behind the current ESXi 8.0 host.

  Outdated Tools causes degraded VMXNET3 driver performance, missing balloon driver

  for memory management, and inability to perform graceful guest OS quiesces for

  snapshot consistency. vCenter shows "VMware Tools: Outdated" warnings on 8 VMs.


  OBJECTIVE: Identify all VMs with outdated VMware Tools using vCenter inventory; Update VMware Tools
  on a Windows VM using the automatic upgrade mechanism; Update VMware Tools on a Linux VM using open-vm-tools
  package manager. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify all VMs with outdated VMware Tools using vCenter inventory
- Update VMware Tools on a Windows VM using the automatic upgrade mechanism
- Update VMware Tools on a Linux VM using open-vm-tools package manager
- Verify all target VMs show "VMware Tools: OK (Current)" status
