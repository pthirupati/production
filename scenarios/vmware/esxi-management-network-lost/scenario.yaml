description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `ESXi Management Network Lost
  After NIC Team Configuration` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: VMware vCenter simulation. esxi-03 shows "Not Responding" in vCenter.

  iDRAC console access available at: idrac-03.mgmt.local (admin/password).

  On ESXi: vmnic0 is physically connected but in unused uplinks list.

  vmnic1 is listed as active but has no physical cable connected. ESXi host esxi-03 is unreachable after
  a network team reconfigured the NIC

  teaming policy on vSwitch0. The management vmkernel (vmk0) lost connectivity

  when the active uplink (vmnic0) was moved to the unused list and only vmnic1

  (which has no physical cable connected) was left as active. The host shows as

  "Not Responding" in vCenter. Physical console access is available via iDRAC/ILO.


  OBJECTIVE: Connect to the ESXi host via physical console (iDRAC/ILO/DCUI); Access the Direct Console
  User Interface (DCUI) to restore network settings; Move vmnic0 back to active in the management network
  NIC team. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Connect to the ESXi host via physical console (iDRAC/ILO/DCUI)
- Access the Direct Console User Interface (DCUI) to restore network settings
- Move vmnic0 back to active in the management network NIC team
- Verify vCenter shows the host as Connected
