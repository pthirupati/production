title: Long Snapshot Chain Eating Datastore
slug: vm-snapshot-chain-consolidate
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `Long Snapshot Chain Eating
  Datastore` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows web-prod-01 with a long snapshot chain. web-prod-01 has a long
  snapshot chain consuming datastore space and degrading I/O. Consolidate/delete snapshots and confirm
  the chain is short.


  OBJECTIVE: Confirm web-prod-01 has too many snapshots; Consolidate or delete the snapshot chain; Verify
  the snapshot chain is reduced. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
