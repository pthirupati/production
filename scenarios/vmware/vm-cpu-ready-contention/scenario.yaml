title: VM High CPU Ready From Host Contention
slug: vm-cpu-ready-contention
category: Fix
description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `VM High CPU Ready From Host
  Contention` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: vCenter shows web-prod-01 with high CPU ready time. web-prod-01 is slow because
  CPU ready time is high due to host CPU contention/oversubscription. Reduce contention (migrate/right-size)
  and confirm CPU ready drops.


  OBJECTIVE: Confirm web-prod-01 CPU ready time is high; Reduce host CPU contention (migrate/right-size);
  Verify CPU ready time is within target. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
