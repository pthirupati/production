description: 'CONTEXT: A team operating VMware vSphere needs you to resolve `vmware: Distributed Switch
  — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline vSphere lab with VMs, datastores, vCenter, and ESXi
  tasks. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around distributed switch.
  Assume an auditor or pen test is next week — tighten controls with evidence. Security review: harden
  distributed switch on this vmware system. Close unsafe defaults, enforce least privilege, and ensure
  port groups, uplinks, and VLAN trunks cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to distributed switch are removed or constrained; Access follows
  least privilege and is auditable; Security checks pass without breaking required functionality. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
