hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — datastore usage, paths, and VM storage.

    2. Write down what looks normal versus wrong or missing for datastores.

    3. Recall the core idea: VMFS/NFS datastores, capacity, and multipathing. Form
    one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for datastores.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — datastore usage, paths, and VM storage.

    2. Create the smallest working slice of datastores first, validate it, then add
    the remaining pieces one at a time.

    3. Verify the result — datastores have capacity and redundant paths.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-vmware-092-build-datastore-10.conf`,
    then click Check Solution.'
