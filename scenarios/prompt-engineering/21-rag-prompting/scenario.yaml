title: 'RAG Prompting: Answer From Retrieved Docs'
slug: rag-prompting
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `RAG Prompting: Answer
  From Retrieved Docs` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens. Practice writing the prompt half of
  a RAG system — fence retrieved passages, force grounding, and require citations. Rule-based and free.
  Retrieval-augmented generation feeds the model relevant documents at query time so it answers from facts,
  not memory. The retrieval is only half the job — the PROMPT around the retrieved chunks decides whether
  the answer is grounded and cited. Learn to structure a RAG prompt that stays faithful to its sources.


  OBJECTIVE: Explain RAG and why the prompt around retrieved chunks matters; Write a RAG prompt that grounds
  the answer strictly in the provided sources; Require citations and an "I don''t know" fallback when
  sources are silent. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
