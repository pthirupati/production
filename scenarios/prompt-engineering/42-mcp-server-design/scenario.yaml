solution_explanation: 'An MCP server exposes three things over a standard protocol: TOOLS (actions the
  model can invoke, each with a name, description, and JSON input schema), RESOURCES (read-only data the
  model can pull in, like files or records), and PROMPTS (reusable templates). The value is standardization
  — write the server once and any MCP-aware client can use it. Good server design is good tool design:
  small, non-overlapping tools; descriptions that say WHEN to call each one; tight typed schemas; and
  least-privilege (read-only where possible, confirmation for destructive actions). On the Claude side
  you declare a remote server as {type, name, url}; credentials live separately (e.g. in a vault), not
  in the server definition.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant that connects to MCP servers exposing tools, resources, and prompts.
    lesson:
    - heading: What a server exposes
      body: 'An MCP server offers a standard menu: TOOLS (callable actions with typed inputs — e.g. create_ticket,
        search_docs), RESOURCES (read-only context the model can load, like a file or a record by URI),
        and PROMPTS (named, reusable templates). A client connects, lists what''s available, and uses
        it. Because the protocol is standard, one server works across many clients.'
    - heading: Design tools, not a kitchen sink
      body: The same rules as any tool design apply, doubled. Keep each tool focused and non-overlapping;
        give it a name that reads like an action; write a description that states WHEN to call it; and
        define a precise input schema (names, types, required fields). A server with 40 vague, overlapping
        tools is harder for a model to use than five sharp ones.
    - heading: Least privilege and clean wiring
      body: Expose read-only resources where you can; gate destructive or irreversible actions behind
        explicit, confirmable tools. Keep secrets OUT of the tool definitions — when Claude connects to
        a remote MCP server you declare {type, name, url} and supply credentials separately (e.g. via
        a vault), so the schema you publish never carries a token.
    rubric:
    - task
    - constraints
    - format
    - specificity
    exercises:
    - id: describe-server-surface
      title: 'Graded: describe an MCP server''s surface'
      goal: In a few sentences, describe what an MCP server you'd build exposes — name at least one tool,
        and mention resources and/or prompts — and say why exposing it over MCP is useful (standard interface,
        reusable across clients).
      starter: ''
      success:
        min_words: 16
        any_of:
        - - tool
          - tools
          - resource
          - resources
          - prompt
          - prompts
        require:
        - - standard
          - standardize
          - standardized
          - any client
          - reusable
          - reuse
          - interface
          - protocol
          - plug
          - connect
          - interoperable
      success_response: Connected to the docs MCP server. It exposes a search_docs tool, a read-only resource
        for each doc by URI, and a "summarize_doc" prompt template — usable from any MCP client.
      partial_response: 'Name what the server exposes — at least one tool, plus resources and/or prompts
        — and say why MCP helps: it''s a standard interface, so the same server works across any MCP-aware
        client without custom glue.'
    - id: design-focused-tool
      title: 'Graded: design one focused MCP tool'
      goal: 'Design a single MCP tool: give it an action-style name, say WHEN the model should call it,
        and specify a typed input schema (parameter names and JSON types).'
      starter: ''
      success:
        min_words: 14
        require:
        - - when
          - call this
          - use this
          - use it when
          - trigger
          - should call
          - call when
        any_of:
        - - string
          - integer
          - boolean
          - enum
          - array
          - object
          - type
          - required
          - schema
          - parameter
          - input
      success_response: 'Tool: create_ticket — call this when the user asks to file a bug. Input: title
        (string, required), severity (enum: low/medium/high), description (string).'
      partial_response: 'Good — now make it concrete. Give the tool an action name, a trigger ("call this
        when..."), and a typed input schema (e.g. title: string, severity: enum). When + types is what
        makes the tool usable.'
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: designing an MCP server is not behaving as the
    scenario objectives require. This lab is about designing an MCP server — how designing an MCP server
    behaves in a prompt engineering environment. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For designing an MCP server problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one component that owns
    the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small, reversible
    steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of designing an MCP server is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''designing an
    MCP server is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
