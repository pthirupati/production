title: Controlling Output Format
slug: output-formatting
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Controlling Output Format`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens. Practice asking for a precise output
  format — a table, exactly three bullets, or a one-line answer — and watch the simulated reply snap to
  the shape you named. Rule-based and free. The shape of the answer matters as much as the content. Learn
  to pin the output format precisely — a markdown table, a numbered list, exactly N bullets, a single
  word, a fixed template — so downstream code or readers always get what they expect.


  OBJECTIVE: List the levers that control output shape (format type, count, template, "only"); Write a
  prompt that specifies an exact format and forbids extra text; Pass the exercise that demands a fixed-shape
  answer. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
- List the levers that control output shape (format type, count, template, "only")
- Write a prompt that specifies an exact format and forbids extra text
- Pass the exercise that demands a fixed-shape answer
initial_state: The guided AI practice console opens. Practice asking for a precise output format — a table,
  exactly three bullets, or a one-line answer — and watch the simulated reply snap to the shape you named.
  Rule-based and free.
solution_explanation: Models default to prose unless told otherwise. To control the shape - (1) name the
  FORMAT explicitly (markdown table with columns X and Y; numbered list; JSON; one word); (2) pin the
  COUNT ("exactly 3 bullets," "in one sentence"); (3) give a TEMPLATE the model fills in; (4) forbid extras
  ("return only the table, no preamble"). Showing one example of the target shape is the most reliable
  trick of all. For machine consumption, prefer JSON/tool use; for humans, tables and tight bullet lists.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A formatting assistant that returns exactly the shape you specify.
    lesson:
    - heading: Name the format
      body: Don't leave the shape to chance. Say "as a markdown table with columns Name and Status," or
        "as a numbered list," or "answer with a single word." A model asked vaguely will pick a format
        for you — usually prose — and you'll be parsing or reformatting it later.
    - heading: Pin the count and use a template
      body: 'Quantify - "exactly 3 bullets," "in one sentence," "no more than 50 words." For repeatable
        structure, hand the model a TEMPLATE to fill - "Reply in this format - Summary: <one line> / Risk:
        <low|med|high> / Action: <one line>." Templates make many answers line up identically, which is
        gold for downstream parsing.'
    - heading: Forbid the extras
      body: 'The #1 formatting failure is stray prose - "Sure! Here''s your table:" or a trailing "Let
        me know if you need more." Add a hard rule - "Return ONLY the table, with no preamble or closing
        remark." And the single most effective technique is to SHOW one example of the exact output; the
        model copies the shape faithfully.'
    rubric:
    - format
    - constraints
    - task
    - examples
    - specificity
    exercises:
    - id: table-only
      title: Ask for a clean table, nothing else
      goal: Write a prompt that asks for the answer as a markdown table with named columns, and explicitly
        forbids any preamble or closing text — return ONLY the table.
      starter: ''
      success:
        min_words: 10
        any_of:
        - - table
          - column
          - markdown
        require:
        - - only
          - no preamble
          - no other text
          - nothing else
          - no extra
          - just the
          - no explanation
      success_response: '| Name | Status |

        | --- | --- |

        | reset-email | broken |

        | login | ok |

        '
      partial_response: Name the FORMAT (a markdown table with columns) AND forbid extras ("return only
        the table, no preamble"). Otherwise I'll likely wrap it in a sentence or two.
    - id: fixed-template
      title: Fill a fixed template
      goal: Write a prompt that gives the model an exact response TEMPLATE to fill in (with labeled fields
        and a fixed number of parts), so every answer comes back in the same shape. Include the template
        in your prompt.
      starter: 'Reply using exactly this template:

        Summary: <one sentence>

        Risk: <low|medium|high>

        Action: <one sentence>

        '
      success:
        min_words: 12
        any_of:
        - - template
          - format
          - exactly this
          - this format
          - fill
          - fields
        mentions_limit: true
      success_response: 'Summary: The reset email never sends because the SMTP credentials expired.

        Risk: high

        Action: Rotate the SMTP key and add a send-failure alert.

        '
      partial_response: Give me the exact TEMPLATE to fill (labeled fields, fixed parts) and pin the length
        of each field. A template is what makes every answer line up the same way.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `the solution file`, read the instructions, and run the visible tests
    to see which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Pass the exercise that demands a fixed-shape answer.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
