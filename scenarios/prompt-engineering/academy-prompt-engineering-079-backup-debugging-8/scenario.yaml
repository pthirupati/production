description: 'CONTEXT: A team operating prompt engineering needs you to resolve `prompt-engineering: Prompt
  Debugging — Backup and Recovery` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for prompt debugging. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for prompt
  debugging. Ensure backups run on schedule, retention is correct, and you can restore tracing, isolating,
  and iterating within the lab RTO.


  OBJECTIVE: Backup coverage for prompt debugging is complete and restorable; Retention and encryption
  meet the stated policy; A restore drill proves data integrity. Success means `systemctl is-active nginx`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for prompt debugging is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
