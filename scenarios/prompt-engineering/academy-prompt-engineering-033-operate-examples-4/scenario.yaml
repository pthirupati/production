title: Few-Shot Examples — Operate Lab
slug: academy-prompt-engineering-033-operate-examples-4
technology: prompt-engineering
category: Build
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `prompt-engineering: Few-Shot
  Examples — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The LLM practice workspace is healthy enough for scheduled work on few-shot
  examples. Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine
  few-shot examples task safely in prompt-engineering. Follow change control — inspect, change, verify
  — while working with exemplars and formatting.


  OBJECTIVE: Day-2 few-shot examples work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 few-shot examples work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The LLM practice workspace is healthy enough for scheduled work on few-shot examples. Complete
  the maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Day-2 few-shot examples work completes safely in this environment'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Changes are verified with before/after checks

    2. The system remains stable for dependent teams'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. The system remains stable for dependent teams.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
summary: Complete the few-shot examples — operate lab prompt engineering lab and verify success with the
  checker
estimated_minutes: 20
xp_reward: 100
