solution_explanation: 'Zero-shot ("classify this review as positive or negative") is great when the task
  is common and the format is obvious. Few-shot — adding 2-3 labeled examples — wins when you need a precise,
  consistent format or you''re handling an unusual labeling scheme. Examples act as a template the model
  copies. Diminishing returns set in fast: 2-4 well-chosen examples usually beat 20.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A classification and formatting assistant that mimics any examples you provide.
    lesson:
    - heading: Zero-shot
      body: 'Zero-shot means you describe the task with no examples and trust the model to figure out
        the format: "Classify this support ticket as billing, technical, or other." For common tasks this
        is often enough and keeps the prompt short and cheap.'
    - heading: Few-shot
      body: Few-shot means you include a handful of input -> output pairs before the real input. The model
        treats them as a template. This is the most reliable way to (a) pin an exact output format, (b)
        teach an unusual or domain-specific labeling scheme, and (c) reduce variance between runs.
    - heading: How many examples
      body: More is not better. 2-4 diverse, correct examples usually capture the pattern. Cover the edge
        cases you care about (a tricky class, an empty input). Beyond ~5 you mostly add cost and latency
        for little gain. Make sure every example is correct — the model will copy your mistakes.
    rubric:
    - examples
    - format
    - task
    - specificity
    exercises:
    - id: write-few-shot
      title: Write a 2-example few-shot prompt
      goal: 'Write a prompt that classifies a sentence''s sentiment, and include at least two worked examples
        in the form "Input: ... -> Output: ..." so the model copies the exact format.'
      starter: 'Classify the sentiment of the sentence as POSITIVE or NEGATIVE.


        Input: "I love this!" -> Output: POSITIVE

        Input:

        '
      success:
        min_words: 10
        min_example_pairs: 2
        any_of:
        - - positive
          - negative
          - neutral
          - label
          - class
          - category
          - sentiment
      success_response: 'POSITIVE

        (Matched your example format exactly — one label per line, no extra text.)

        '
      partial_response: 'I see the task, but to lock the format reliably, include at least TWO example
        pairs like `Input: "..." -> Output: LABEL`. Examples are what make few-shot consistent.'
    - id: when-zero-shot
      title: Recognize when zero-shot is enough
      goal: Write a short, plain zero-shot instruction for a simple, common task (no examples) — and state
        the expected output format in words so it still comes back consistent.
      starter: ''
      success:
        min_words: 8
        max_example_pairs: 0
        any_of:
        - - one word
          - single
          - only
          - just
          - yes or no
          - true or false
          - label
          - json
          - format
      success_response: POSITIVE — answered as a single label with no extra text, exactly as asked. For
        a common task like this, a clear zero-shot instruction is plenty.
      partial_response: 'For zero-shot, skip the examples but still pin the FORMAT in words (e.g. "answer
        with one word: POSITIVE or NEGATIVE"). That keeps it consistent without examples.'
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: Zero-Shot vs Few-Shot prompting is not behaving
    as the scenario objectives require. This lab is about Zero-Shot vs Few-Shot prompting — how Zero-Shot
    vs Few-Shot prompting behaves in a prompt engineering environment. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Zero-Shot vs Few-Shot prompting problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small,
    reversible steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of Zero-Shot vs Few-Shot prompting is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''Zero-Shot vs
    Few-Shot prompting is not behaving as the scenario objectives require'' toward ''all hidden tests
    pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
