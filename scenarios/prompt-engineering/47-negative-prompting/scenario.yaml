initial_state: The guided AI practice console opens with two graded exercises on negative prompting. Write
  a prompt that forbids specific unwanted output, then pair a prohibition with a positive instruction.
  Rule-based and free — strong prompts pass, vague ones fail.
solution_explanation: 'Negative instructions ("do NOT include a preamble", "no markdown fences", "don''t
  apologize", "don''t invent details not in the source") are great for surgically removing a specific,
  recurring annoyance. Two cautions. First, they work best when SPECIFIC — "no preamble" beats "don''t
  be verbose." Second, a pile of "don''ts" can crowd out the actual task and sometimes draws attention
  to the very thing you banned. The strongest pattern pairs each prohibition with a positive target: "Don''t
  start with ''Here is...''. Begin directly with the answer." or "Don''t guess; if the source doesn''t
  say, reply ''Not stated.''" Positive examples of the desired output are usually more effective than
  long lists of negatives — so lead with what you DO want, then prune with a few precise prohibitions.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant whose unwanted habits you curb with explicit prohibitions.
    lesson:
    - heading: Forbid the specific annoyance
      body: 'When a model keeps doing one unwanted thing, name it and ban it: "Do not include a preamble."
        "No markdown code fences." "Do not apologize." "Do not add caveats." Specific prohibitions are
        surgical and effective — they remove a known failure without rewriting the whole prompt.'
    - heading: Pair "don't" with "instead"
      body: 'A bare prohibition leaves a vacuum the model fills however it likes, and can even spotlight
        the banned thing. Pair it with a positive target: "Don''t start with ''Here is the summary.''
        Begin directly with the first point." "Don''t invent details; if the text doesn''t say, write
        ''Not stated.''" The "instead" tells the model where to go.'
    - heading: Lead with positives, prune with negatives
      body: Don't build a prompt out of nothing but "don'ts" — a long list of negatives buries the task
        and can confuse the model. State what you DO want first (ideally with a short example of the desired
        output), then add a few precise prohibitions to trim the edges. Positive guidance plus targeted
        negatives beats a wall of prohibitions.
    rubric:
    - task
    - constraints
    - specificity
    exercises:
    - id: forbid-unwanted
      title: 'Graded: forbid a specific unwanted output'
      goal: Write a prompt for a task that includes at least one specific, targeted prohibition — what
        the model must NOT do (e.g. no preamble, no markdown fences, no apologies, no invented facts).
      starter: Summarize the release notes.
      success:
        min_words: 12
        any_of:
        - - do not
          - don't
          - never
          - no preamble
          - no markdown
          - no fences
          - no apolog
          - without
          - avoid
          - do no
          - must not
          - no caveats
          - no filler
      success_response: v2.1 adds dark mode and fixes the export crash; upgrade is optional.
      partial_response: Name a specific thing to forbid. "No preamble", "no markdown fences", or "don't
        apologize" are surgical. A vague "don't be verbose" is too fuzzy for the model to act on.
    - id: dont-plus-instead
      title: 'Graded: pair a prohibition with a target'
      goal: Write a prompt that pairs a "do not" with a positive "instead" — forbid something AND tell
        the model what to do in its place (e.g. don't guess; instead say 'Not stated').
      starter: ''
      success:
        min_words: 12
        must_contain_all:
        - - instead
          - rather
          - do not
          - don't
          - never
        any_of:
        - - begin
          - answer
          - say
          - reply
          - use
          - write
          - respond
          - start with
          - return
          - give
      success_response: Got it — I'll start straight with the answer and, when the source is silent, I'll
        say "Not stated" rather than guessing.
      partial_response: 'Add the "instead." A prohibition alone leaves a gap. Pair it: "Don''t start with
        ''Here is...''; instead begin directly with the answer," or "Don''t guess; instead reply ''Not
        stated.''"'
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: negative prompting is not behaving as the scenario
    objectives require. This lab is about negative prompting — how negative prompting behaves in a prompt
    engineering environment. Read the objectives and the current state, and note precisely what looks
    wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For negative prompting problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of negative prompting is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''negative prompting
    is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
