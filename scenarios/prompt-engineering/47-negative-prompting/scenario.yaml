title: 'Negative Prompting: Telling the Model What NOT to Do'
slug: negative-prompting
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Negative Prompting: Telling
  the Model What NOT to Do` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens with two graded exercises on negative
  prompting. Write a prompt that forbids specific unwanted output, then pair a prohibition with a positive
  instruction. Rule-based and free — strong prompts pass, vague ones fail. Sometimes the fastest way to
  fix an output is to forbid the thing you don''t want — no preamble, no markdown, no apologies, no invented
  facts. But negative instructions are easy to overdo and can backfire. Learn when prohibitions help,
  why a positive example is often stronger, and how to combine the two.


  OBJECTIVE: Use targeted prohibitions to remove unwanted output (preambles, fences, filler); Pair a "do
  not" with a positive "instead, do this" so the model has a target; Pass both graded exercises (the simulator
  re-checks your prompt server-side). Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
