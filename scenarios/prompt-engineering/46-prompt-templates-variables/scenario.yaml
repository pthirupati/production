solution_explanation: 'A prompt template is a fixed skeleton with VARIABLE SLOTS you fill per request.
  Two design rules. First, mark the slots clearly — named placeholders like {{document}} or <question>...</question>
  — so substitution is unambiguous and a caller can''t accidentally merge instructions with data. Second,
  ORDER for reuse: put the stable instructions and any fixed reference material at the TOP, and the per-request
  variable input at the BOTTOM. That ordering is also exactly what prompt caching wants — caching is a
  prefix match, so a stable prefix can be cached and reused across requests while only the varying suffix
  changes. Keep the stable part byte-identical (no timestamps or per-request IDs up front) or you silently
  break the cache.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant driven by a reusable prompt template with filled-in variables.
    lesson:
    - heading: Name and delimit the slots
      body: 'A template needs unambiguous variable slots. Use named placeholders the calling code substitutes
        — {{document}}, {{user_question}}, {{tone}} — or wrap them in tags like <document>...</document>.
        Clear slots prevent two failure modes: merging the user''s input into the instructions, and a
        caller filling the wrong field.'
    - heading: Stable first, variable last
      body: 'Order matters. Put the parts that never change — the role, the rules, fixed examples, any
        shared reference document — at the TOP. Put the per-request variable content at the BOTTOM. This
        keeps the template readable AND sets up caching: a long shared preamble can be cached once and
        reused, with only the final question varying.'
    - heading: Don't poison the prefix
      body: 'Prompt caching is a prefix match — one changed byte anywhere in the prefix invalidates everything
        after it. So keep the stable top truly stable: no current-date string, no random request ID, no
        unsorted JSON near the front. Inject anything per-request only after the cached prefix (in the
        variable slot), and you keep both reuse and low cost.'
    rubric:
    - format
    - task
    - constraints
    - specificity
    exercises:
    - id: template-with-slots
      title: 'Graded: a template with named placeholders'
      goal: Write a reusable prompt template that contains at least one clearly marked variable placeholder
        (e.g. {{document}}, <question>...</question>, or [INPUT]) that calling code would fill in per
        request.
      starter: Answer the user's question about the document.
      success:
        min_words: 12
        has_delimiter: true
        any_of:
        - - template
          - placeholder
          - variable
          - fill in
          - substitute
          - '{{'
          - <question>
          - <document>
          - insert
          - per request
          - each request
      success_response: Template ready. Per request, the code fills <document>...</document> and <question>...</question>,
        and the model answers using only the document.
      partial_response: Mark the variable slot clearly. Use a named placeholder like {{document}} or wrap
        it in tags such as <document>...</document>, so the calling code fills exactly the right spot
        and never merges input with instructions.
    - id: order-for-caching
      title: 'Graded: order the template for reuse'
      goal: Explain (or lay out) how to order a template so the STABLE parts come first and the VARIABLE
        per-request input comes last — and note why that ordering helps caching/reuse.
      starter: ''
      success:
        min_words: 14
        any_of:
        - - cache
          - cached
          - caching
          - prefix
          - reuse
          - reused
          - stable
          - first
          - last
          - shared
          - top
          - bottom
        require:
        - - first
          - last
          - stable
          - static
          - fixed
          - variable
          - prefix
          - beginning
          - end
          - top
          - bottom
          - front
      success_response: Put the role, rules, and shared document first (the stable prefix) and the per-request
        question last. The stable prefix can be cached and reused across requests; only the final variable
        changes.
      partial_response: Say which part goes first and why. Stable instructions and shared reference go
        at the top; the variable per-request input goes at the bottom. A stable prefix is what lets caching
        reuse it across requests.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
