initial_state: The guided AI practice console opens. Practice turning many one-off calls into a single
  batched request that returns one labeled answer per item. Rule-based and free.
solution_explanation: 'Every API call repeats fixed overhead - the system prompt, instructions, and per-request
  latency. Batching amortizes that by sending MANY items in one prompt and asking for one labeled output
  per item. Keys to a good batch prompt - (1) number or label the inputs; (2) demand one result per input
  in a parseable shape ("Return one line per item as <id>: <label>" or a JSON array keyed by id); (3)
  state the count so nothing is dropped. Limits to respect - very large batches risk truncation and cross-item
  bleed (the model letting one item influence another); one bad item can muddy the response, so keep batches
  a sane size and validate the count. The Message Batches API adds async, high-throughput, discounted
  batch processing on top of this idea.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A throughput-oriented assistant that processes many items per call.
    lesson:
    - heading: Why batching saves
      body: Each separate call re-sends your instructions and pays per-request latency. If you classify
        100 items one at a time, you pay that overhead 100 times. Put 20 items in a single prompt and
        the instructions are sent once, the round-trips drop, and total tokens and wall-clock time fall
        sharply.
    - heading: Make the output parseable
      body: 'A batch is only useful if you can split the results back out. Number the inputs and demand
        a strict per-item shape - "Return exactly one line per item as `N: LABEL`," or a JSON array of
        objects keyed by id. State the expected COUNT so you can detect drops. Without a labeled, parseable
        structure, a batched answer is hard to use.'
    - heading: Know the limits
      body: Batching isn't free of risk. Very large batches can hit output limits and get truncated; items
        can BLEED into each other (the model harmonizing answers it should judge independently); and one
        malformed item can degrade the whole response. Keep batches a reasonable size, validate that the
        count matches, and for big async jobs use the Message Batches API, which offers discounted, high-throughput
        processing.
    rubric:
    - task
    - format
    - constraints
    - specificity
    exercises:
    - id: batch-classify
      title: Batch many items into one call
      goal: Write a single prompt that processes MULTIPLE inputs at once (e.g. a numbered list of sentences)
        and returns ONE labeled result per item — make the per-item output format explicit.
      starter: 'Classify each sentence below as POSITIVE or NEGATIVE. Return one label per line, numbered
        to match.

        1.

        '
      success:
        min_words: 12
        min_list_items: 2
        any_of:
        - - each
          - per line
          - one per
          - for every
          - per item
          - numbered
          - respectively
          - one label
      success_response: '1. POSITIVE

        2. NEGATIVE

        3. POSITIVE

        (Three items in one call — instructions sent once, far cheaper than three requests.)

        '
      partial_response: Put SEVERAL items in one prompt (a numbered list of at least two) and pin the
        per-item output ("one label per line, numbered to match"). That's what makes the single call replace
        many.
    - id: parseable-batch
      title: Return a parseable batch result
      goal: Write a batch prompt that returns results in a strict, PARSEABLE structure keyed to each input
        (e.g. a JSON array of objects with an id and a value), so code can split the results apart reliably.
      starter: ''
      success:
        min_words: 12
        requires_json_request: true
        any_of:
        - - each
          - per item
          - array
          - one object per
          - keyed
          - id
          - for every
          - list of
      success_response: '[{"id": 1, "label": "POSITIVE"}, {"id": 2, "label": "NEGATIVE"}]

        '
      partial_response: Ask for a parseable structure keyed to each input — e.g. a JSON array of {id,
        label} objects — so you can split the batch back out in code. Labeling by id also lets you catch
        dropped items.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: batching requests to cut cost is not behaving
    as the scenario objectives require. This lab is about batching requests to cut cost — how batching
    requests to cut cost behaves in a prompt engineering environment. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For batching requests to cut cost problems the reliable method is:
    (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component that
    owns the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small, reversible
    steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of batching requests to cut cost is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''batching requests
    to cut cost is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
