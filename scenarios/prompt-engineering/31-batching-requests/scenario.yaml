title: "Batching Requests to Cut Cost"
slug: batching-requests
category: Prompt Engineering
description: >-
  Calling a model once per item wastes tokens and time on repeated overhead.
  Batching processes many items in a single request. Learn to write a batch prompt
  that returns one clearly-labeled result per item, keep outputs parseable, and
  know when batching is the wrong tool.
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
  - Explain how batching saves overhead tokens and latency vs N separate calls
  - Write a batch prompt that returns one labeled output per input
  - Recognize the limits of batching (size, cross-item bleed, error isolation)
initial_state: >-
  The guided AI practice console opens. Practice turning many one-off calls into a
  single batched request that returns one labeled answer per item. Rule-based and
  free.
solution_explanation: >-
  Every API call repeats fixed overhead - the system prompt, instructions, and
  per-request latency. Batching amortizes that by sending MANY items in one prompt
  and asking for one labeled output per item. Keys to a good batch prompt - (1)
  number or label the inputs; (2) demand one result per input in a parseable shape
  ("Return one line per item as <id>: <label>" or a JSON array keyed by id); (3)
  state the count so nothing is dropped. Limits to respect - very large batches risk
  truncation and cross-item bleed (the model letting one item influence another);
  one bad item can muddy the response, so keep batches a sane size and validate the
  count. The Message Batches API adds async, high-throughput, discounted batch
  processing on top of this idea.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A throughput-oriented assistant that processes many items per call.
    lesson:
      - heading: Why batching saves
        body: >-
          Each separate call re-sends your instructions and pays per-request
          latency. If you classify 100 items one at a time, you pay that overhead 100
          times. Put 20 items in a single prompt and the instructions are sent once,
          the round-trips drop, and total tokens and wall-clock time fall sharply.
      - heading: Make the output parseable
        body: >-
          A batch is only useful if you can split the results back out. Number the
          inputs and demand a strict per-item shape - "Return exactly one line per
          item as `N: LABEL`," or a JSON array of objects keyed by id. State the
          expected COUNT so you can detect drops. Without a labeled, parseable
          structure, a batched answer is hard to use.
      - heading: Know the limits
        body: >-
          Batching isn't free of risk. Very large batches can hit output limits and
          get truncated; items can BLEED into each other (the model harmonizing
          answers it should judge independently); and one malformed item can degrade
          the whole response. Keep batches a reasonable size, validate that the count
          matches, and for big async jobs use the Message Batches API, which offers
          discounted, high-throughput processing.
    rubric: [task, format, constraints, specificity]
    exercises:
      - id: batch-classify
        title: Batch many items into one call
        goal: >-
          Write a single prompt that processes MULTIPLE inputs at once (e.g. a
          numbered list of sentences) and returns ONE labeled result per item — make
          the per-item output format explicit.
        starter: |
          Classify each sentence below as POSITIVE or NEGATIVE. Return one label per line, numbered to match.
          1.
        success:
          min_words: 12
          min_list_items: 2
          any_of:
            - ["each", "per line", "one per", "for every", "per item", "numbered", "respectively", "one label"]
        success_response: |
          1. POSITIVE
          2. NEGATIVE
          3. POSITIVE
          (Three items in one call — instructions sent once, far cheaper than three requests.)
        partial_response: >-
          Put SEVERAL items in one prompt (a numbered list of at least two) and pin
          the per-item output ("one label per line, numbered to match"). That's what
          makes the single call replace many.
      - id: parseable-batch
        title: Return a parseable batch result
        goal: >-
          Write a batch prompt that returns results in a strict, PARSEABLE structure
          keyed to each input (e.g. a JSON array of objects with an id and a value),
          so code can split the results apart reliably.
        starter: ""
        success:
          min_words: 12
          requires_json_request: true
          any_of:
            - ["each", "per item", "array", "one object per", "keyed", "id", "for every", "list of"]
        success_response: |
          [{"id": 1, "label": "POSITIVE"}, {"id": 2, "label": "NEGATIVE"}]
        partial_response: >-
          Ask for a parseable structure keyed to each input — e.g. a JSON array of
          {id, label} objects — so you can split the batch back out in code. Labeling
          by id also lets you catch dropped items.
hints:
  - content: Batching = many items in ONE prompt, one labeled output per item. Instructions are sent once and round-trips drop, cutting tokens and latency.
    cost: 10
    order: 1
  - content: 'Number the inputs and pin the per-item output ("one line per item as N: LABEL," or a JSON array keyed by id). State the count so you can detect drops.'
    cost: 15
    order: 2
  - content: 'Watch the limits: huge batches truncate, items can bleed into each other, one bad item muddies the rest. Keep batches sane and validate the count. For big async jobs, use the Message Batches API.'
    cost: 20
    order: 3
