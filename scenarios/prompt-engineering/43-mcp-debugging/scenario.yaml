initial_state: The guided AI practice console opens with two graded MCP-debugging exercises. Walk a connection
  failure layer by layer, then diagnose why a tool never fires. Rule-based and free — a methodical answer
  passes, a vague one fails.
solution_explanation: Debug MCP by layer, outermost first. (1) CONNECTION/TRANSPORT — is the server URL
  reachable and the transport (e.g. Streamable HTTP / SSE) correct? Under locked-down networking the host
  may simply be unreachable. (2) AUTH — are the credentials valid and of the RIGHT KIND (hosted MCP servers
  usually need OAuth bearer tokens, not the service's native API key)? An invalid credential often doesn't
  block connecting; it surfaces later as an auth error on a tool call. (3) DISCOVERY — does listing tools/resources
  actually return the ones you expect? (4) SCHEMA/VALIDATION — do the model's arguments match the tool's
  input schema? Malformed or missing required fields cause silent or error results. (5) THE MODEL — even
  with everything wired, a weak tool description means the model never decides to call it; fix the WHEN-to-call
  guidance. Isolate by testing each layer independently rather than re-running the whole flow and hoping.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An engineer debugging a flaky MCP integration with a connected assistant.
    lesson:
    - heading: Check the layers in order
      body: An MCP call passes through connection -> auth -> discovery -> schema validation -> the model's
        decision to call. Debug outside-in. First confirm the server URL is reachable and the transport
        is right (a restricted network may block the host entirely). Don't jump to "the prompt is wrong"
        before you've proven the connection is even alive.
    - heading: Auth is the usual culprit
      body: 'Credentials fail in two ways. Wrong KIND: hosted MCP servers typically want an OAuth bearer
        token, not the service''s native API key — they''re different auth systems. Wrong STATE: an expired
        or invalid token. A bad credential often lets the session start, then shows up as an auth error
        on the first tool call — so a "connected but tools fail" symptom points straight at auth.'
    - heading: Schema mismatches and the silent no-call
      body: 'If tools are discovered but calls error, check the arguments against the tool''s input schema
        — a missing required field or a wrong type fails validation. And if a tool simply never fires,
        the wiring may be fine: the model just didn''t choose it. That''s a prompt problem — strengthen
        the tool''s description with an explicit "call this when..." trigger. Isolate each layer with
        a direct test instead of re-running end to end.'
    rubric:
    - task
    - reasoning
    - specificity
    exercises:
    - id: diagnose-connection
      title: 'Graded: triage a failing connection'
      goal: An MCP server "won't work." Describe how you'd isolate the cause across layers — at minimum
        mention checking the connection/transport AND auth — rather than guessing.
      starter: ''
      success:
        min_words: 16
        any_of:
        - - url
          - reachable
          - transport
          - connect
          - connection
          - network
          - host
          - endpoint
          - ping
          - sse
          - http
        require:
        - - auth
          - token
          - oauth
          - credential
          - api key
          - expired
          - bearer
          - permission
      success_response: 'Step 1: confirm the server URL is reachable and the transport matches. Step 2:
        verify the credential is valid and the right kind — hosted MCP servers want an OAuth bearer token,
        not a native API key.'
      partial_response: Go layer by layer. First check the connection (URL reachable? transport correct?
        network allowed?), THEN auth (token valid and the right kind — OAuth vs native API key). Don't
        blame the prompt before the connection is proven.
    - id: tool-never-fires
      title: 'Graded: a tool that never gets called'
      goal: The server connects and the tool is listed, but the model never calls it. Explain the likely
        cause and the fix (the description/trigger), or a schema/validation issue if arguments are involved.
      starter: ''
      success:
        min_words: 14
        any_of:
        - - description
          - trigger
          - when to call
          - call this when
          - prompt
          - system prompt
          - schema
          - validation
          - required
          - argument
          - input schema
          - doesn't choose
          - never selects
          - tool choice
      success_response: The wiring is fine — the model just isn't choosing the tool. Strengthen its description
        with an explicit "call this when the user asks about X," and double-check the input schema isn't
        rejecting the arguments.
      partial_response: 'If a discovered tool never fires, it''s usually a prompt problem: the description
        doesn''t tell the model WHEN to call it. Add a trigger condition. If arguments are involved, also
        check they satisfy the input schema (types, required fields).'
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: debugging MCP servers & connections is not behaving
    as the scenario objectives require. This lab is about debugging MCP servers & connections — how debugging
    MCP servers & connections behaves in a prompt engineering environment. Read the objectives and the
    current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For debugging MCP servers & connections problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small,
    reversible steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of debugging MCP servers & connections is at
    fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''debugging MCP
    servers & connections is not behaving as the scenario objectives require'' toward ''all hidden tests
    pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
