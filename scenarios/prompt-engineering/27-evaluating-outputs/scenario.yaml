title: Evaluating Outputs & LLM-as-Judge
slug: evaluating-outputs-llm-judge
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Evaluating Outputs &
  LLM-as-Judge` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens. Practice writing a judge prompt that
  scores another model''s output against a clear rubric. Rule-based and free. You can''t improve prompts
  you don''t measure. Learn to build evals: a test set, clear criteria, and graders — exact-match for
  structured tasks, rubric-based scoring for open-ended ones, and an LLM-as-judge with a tight rubric.
  Then write a judge prompt that scores outputs consistently.


  OBJECTIVE: Describe how to build an eval (test set, criteria, grading method); Choose programmatic grading
  vs LLM-as-judge for a given task; Write an LLM-as-judge prompt with an explicit rubric and output format.
  Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
