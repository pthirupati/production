description: 'CONTEXT: A team operating prompt engineering has raised a ticket for `Jinja2 Templates —
  Integration Lab`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace. The architecture is a single
  lab-primary node exposing prompt templates, eval sets, and tool configs; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A guided AI practice console opens in your browser. It is a rule-based tool
  responder (no real model, no API cost) that scores your prompt live. Two systems are deployed but not
  fully wired together for Jinja2 templates. Downstream consumers are waiting on this integration path.
  Integration lab: connect Jinja2 templates with an adjacent platform in the prompt-engineering stack.
  Validate authentication, data handoff, and failure behavior for variables, filters, and conditionals
  in templates.


  OBJECTIVE: Jinja2 templates is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Acceptance criteria: the
  change is minimal and reversible, and success means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant prompt templates, eval sets, and tool configs), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Jinja2 templates is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: A guided AI practice console opens in your browser. It is a rule-based tool responder (no
  real model, no API cost) that scores your prompt live.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: rendered config is wrong or missing values.
    This lab is about Jinja2 templates — variables, filters, and conditionals in templates. Read the objectives
    and the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Jinja2 templates problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Configure credentials and networking, then drive one happy-path
    transaction end to end across both systems.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `systemctl status model-server` and `journalctl -u model-server -n 50`.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm `model-server` is failed/inactive.

    2. Read the unit journal for the root cause.

    3. Apply the smallest fix that restores the unit.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Repair the underlying config/cause for `model-server`.

    2. `systemctl enable --now model-server`.

    3. Verify with `systemctl is-active model-server` (expect active).'
