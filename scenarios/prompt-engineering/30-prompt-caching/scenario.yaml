initial_state: The guided AI practice console opens. Practice structuring a prompt so its large, stable
  prefix is cacheable and only the small per-request part varies. Rule-based and free.
solution_explanation: Prompt caching stores the processed form of a stable prompt PREFIX so repeated requests
  that share it skip most of the work - the cached portion is served much cheaper and faster (Anthropic's
  prompt caching can cut cost on the cached tokens dramatically). The key is STRUCTURE - put everything
  stable FIRST (system prompt, big reference doc, fixed examples, tool definitions) and the small variable
  part (the user's actual question) LAST, since caching keys on a shared prefix. Caching pays off when
  you reuse a large context across many calls - chatbots with a fat system prompt, doc Q&A over the same
  document, batch jobs sharing instructions. It does little for one-off prompts or when the early tokens
  change every time. Caches also expire, so steady reuse matters.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A cost-aware assistant that rewards a stable, reusable prompt prefix.
    lesson:
    - heading: What caching buys you
      body: Normally you pay to process every input token on every call. Prompt caching lets the provider
        store the processed PREFIX of your prompt, so subsequent calls that begin with the exact same
        text reuse it - far cheaper and faster on that portion. If you send a 10k-token system prompt
        and document on every request, caching it means you stop paying full price for those 10k tokens
        each time.
    - heading: Structure for cache hits
      body: Caching keys on a SHARED PREFIX, so ORDER matters. Put the stable stuff first - system prompt,
        big reference document, fixed few-shot examples, tool definitions - and the volatile stuff (the
        user's specific question) last. If a variable value appears early, it breaks the prefix and you
        lose the hit. Design prompts as "big stable block, then small variable tail."
    - heading: When it pays off
      body: Caching wins when a LARGE context is REUSED across MANY calls - a chatbot with a long system
        prompt, repeated Q&A over the same document, batch jobs that share instructions/examples. It does
        little for one-off prompts, tiny prefixes, or prompts whose early tokens change every time. Caches
        also expire after a short window, so the savings come from steady reuse. Measure before and after
        to confirm the win.
    rubric:
    - task
    - constraints
    - specificity
    exercises:
    - id: cache-friendly-order
      title: Put the stable prefix first
      goal: Describe (or write) a prompt structure where the large STABLE content (system prompt / reference
        doc / fixed examples) comes FIRST and the small VARIABLE per-request part comes LAST — so the
        prefix can be cached across many calls.
      starter: ''
      success:
        min_words: 14
        any_of:
        - - cache
          - cached
          - caching
          - prefix
          - reuse
          - reused
          - stable
          - first
          - last
          - shared
        require:
        - - first
          - last
          - stable
          - static
          - fixed
          - variable
          - prefix
          - beginning
          - end
          - front
      success_response: That's cache-friendly - a big stable block up front (cached once) and only the
        small question changing at the end means most calls reuse the prefix at a fraction of the cost.
      partial_response: Spell out the ORDER - stable content (system prompt, document, examples) FIRST
        so it forms a reusable cached prefix, and the variable per-request part LAST. Caching keys on
        the shared prefix, so the order is the whole trick.
    - id: when-cache-pays
      title: Decide when caching pays off
      goal: Write a short note picking ONE workload and deciding whether prompt caching helps — tie it
        to whether a LARGE context is REUSED across MANY calls, versus a one-off or always-changing prompt.
      starter: ''
      success:
        min_words: 14
        any_of:
        - - reuse
          - reused
          - many calls
          - repeated
          - many requests
          - high volume
          - same document
          - same system
          - one-off
          - one off
          - changes every
          - shared
          - across calls
          - large context
      success_response: Right call. Caching pays when a large prefix is reused across many calls (chatbot
        system prompt, doc Q&A, batch jobs); for one-off or always-changing prompts there's nothing stable
        to cache.
      partial_response: Tie it to reuse - caching helps when a LARGE context is shared across MANY calls,
        and does little for one-off prompts or ones whose early tokens change each time. Name the workload
        and justify it.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
