solution_explanation: 'The context window is everything the model can "see": system prompt, conversation
  history, documents you paste, and the current question. Three rules: (1) include what''s needed and
  prune what isn''t — irrelevant text dilutes attention and can mislead; (2) for long documents, put the
  document BEFORE the question and clearly delimit it (e.g. <document>...</document>); (3) summarize or
  drop stale history in long sessions. In Claude Code, CLAUDE.md and the files you reference are your
  curated context — keep them tight and relevant.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant that answers strictly from the context you provide.
    lesson:
    - heading: What the model can see
      body: The context window holds the system prompt, the running conversation, anything you paste,
        and the current question. The model has no memory beyond it. If a fact isn't in context, the model
        will either say it doesn't know or — worse — guess. Giving it the right reference material is
        often more important than clever wording.
    - heading: Less is more
      body: 'More context is not better. Dumping an entire codebase or ten documents dilutes the model''s
        attention and invites it to latch onto irrelevant details. Curate: include the specific function,
        the relevant doc section, the actual error — not everything tangentially related.'
    - heading: Placement and delimiters
      body: For long inputs, put the reference material FIRST and the instruction LAST, and wrap the material
        in clear delimiters like <document>...</document> or triple backticks. This helps the model separate
        "data to use" from "what to do," and it tends to follow the most recent instruction most closely.
    rubric:
    - context
    - task
    - format
    - specificity
    - constraints
    exercises:
    - id: ground-answer
      title: Ground the answer in provided context
      goal: Write a prompt that includes a short reference passage AND a focused question about it, and
        instruct the model to answer ONLY from that passage (say "I don't know" if the answer isn't there).
      starter: 'Context:

        """

        FixitLab labs auto-terminate after 30 minutes of inactivity.

        """

        Question:

        '
      success:
        min_words: 12
        any_of:
        - - only
          - based on
          - according to
          - from the context
          - from the passage
          - using the text
          - don't know
          - do not know
          - not in the text
      success_response: 'Based only on the provided context: labs auto-terminate after 30 minutes of inactivity.
        The passage doesn''t mention anything else, so I won''t speculate beyond it.'
      partial_response: You included context — good. Now instruct me to answer ONLY from it (e.g. "Using
        only the passage above, answer; if it's not there, say you don't know"). That prevents me from
        inventing details.
    - id: delimit-document
      title: Delimit a document and put the task last
      goal: Write a prompt that wraps a block of reference text in clear delimiters (like triple quotes
        or <document> tags) and places the actual instruction AFTER the document.
      starter: ''
      success:
        min_words: 12
        has_delimiter: true
        any_of:
        - - summarize
          - answer
          - extract
          - list
          - explain
          - question
          - task
          - instruction
      success_response: Here's a 1-sentence summary of the delimited document, with my instruction taken
        from the line after it. Clear delimiters made it easy to tell the data apart from the task.
      partial_response: Wrap the reference text in delimiters (triple backticks, triple quotes, or <document>...</document>)
        and put the instruction after it. That separation is what keeps data and task from blurring together.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: context management is not behaving as the scenario
    objectives require. This lab is about context management — how context management behaves in a prompt
    engineering environment. Read the objectives and the current state, and note precisely what looks
    wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For context management problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of context management is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''context management
    is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.

    WHY: coding labs grade against hidden test cases, not marker files.'
