initial_state: The guided AI practice console opens. Practice splitting a complex task into a short pipeline
  of prompts where each step's output feeds the next. Rule-based and free.
solution_explanation: Prompt chaining decomposes a complex task into a sequence of smaller prompts, where
  the OUTPUT of one step becomes the INPUT to the next - e.g. extract -> validate -> summarize, or outline
  -> draft -> critique -> revise. Benefits - each step is simpler and more reliable, you can inspect and
  fix the handoff in the middle, and you can use different models/formats per step. Make the handoff CLEAN
  (a well-defined structure like JSON between steps) so the next prompt can parse it. Use chaining when
  a task has distinct phases; for a single-shot ask, don't over-engineer. This is also the core idea behind
  workflows and agent pipelines.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant that works through a task as a pipeline of focused steps.
    lesson:
    - heading: Why decompose
      body: A single prompt asked to "extract the data, validate it, summarize it, and translate the summary"
        juggles four jobs at once - and tends to do each one a little worse. Chaining splits that into
        focused steps. Each prompt has one clear job, so it's more accurate, easier to debug, and easier
        to swap out.
    - heading: Clean handoffs
      body: The link between steps is the OUTPUT->INPUT handoff. Make it structured - step 1 returns JSON,
        step 2 takes that JSON as its input. A clean, parseable handoff is what makes the pipeline robust;
        sloppy prose handoffs are where chains break. You can also inspect or correct the intermediate
        value before passing it on.
    - heading: When to chain
      body: Chain when the task has distinct PHASES (outline -> draft -> critique -> revise; retrieve
        -> answer; classify -> route -> respond). Don't chain a task a single good prompt already nails
        - extra steps add latency and places to fail. Chaining, branching, and tool loops are the building
        blocks of larger agentic workflows.
    rubric:
    - task
    - format
    - specificity
    - constraints
    exercises:
    - id: design-chain
      title: Decompose a task into ordered steps
      goal: Write a prompt (or plan) that breaks a complex task into MULTIPLE ordered steps, making clear
        that each step's OUTPUT feeds the NEXT step's input. Lay the steps out as a numbered or labeled
        pipeline.
      starter: 'Break this into steps where each step''s output feeds the next:

        Step 1:

        '
      success:
        min_words: 16
        min_list_items: 2
        any_of:
        - - output
          - feeds
          - input to
          - then
          - next step
          - pass
          - result
          - hand off
          - handoff
          - pipeline
      success_response: Clear pipeline - each step has one job and a defined handoff to the next. That
        decomposition is exactly what makes a chain more reliable than one do-everything prompt.
      partial_response: List the steps (a numbered pipeline) AND show the handoff — each step's OUTPUT
        becomes the next step's INPUT. The explicit handoff is what makes it a chain rather than one big
        prompt.
    - id: clean-handoff
      title: Define a clean handoff between steps
      goal: Write a prompt for a SINGLE step of a chain whose output is structured (e.g. JSON) specifically
        so the NEXT step can parse it. State that the output will be consumed by a downstream step.
      starter: ''
      success:
        min_words: 12
        requires_json_request: true
        any_of:
        - - next step
          - downstream
          - feed
          - input to
          - passed to
          - consumed
          - so the next
          - pipeline
          - subsequent
      success_response: '{"entities": ["Ada", "France"], "valid": true}

        (Structured so the next step in the chain can parse it directly.)

        '
      partial_response: Make this step emit a structured, parseable output (e.g. JSON) AND say it will
        be consumed by the next step. A clean handoff is what keeps the chain from breaking between stages.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `the solution file`, read the instructions, and run the visible tests
    to see which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Write a prompt that breaks a task into ordered, focused steps with handoffs.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
