title: Writing Function & Tool-Calling Prompts
slug: tool-calling-prompts
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Writing Function & Tool-Calling
  Prompts` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens. Practice writing tool definitions and
  schemas that make the model call the right function with the right arguments. Rule-based and free. Tool
  (function) calling lets a model invoke your code with structured arguments. Whether the model calls
  the right tool with the right arguments comes down to how you describe it. Learn to write tool descriptions
  and input schemas that drive correct, reliable calls.


  OBJECTIVE: Explain what makes a tool description drive correct tool selection; Write a tool definition
  with a name, a WHEN-to-use description, and typed inputs; Add guidance for argument extraction and when
  NOT to call the tool. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Explain what makes a tool description drive correct tool selection
- Write a tool definition with a name, a WHEN-to-use description, and typed inputs
- Add guidance for argument extraction and when NOT to call the tool
initial_state: The guided AI practice console opens. Practice writing tool definitions and schemas that
  make the model call the right function with the right arguments. Rule-based and free.
solution_explanation: With tool/function calling you give the model a set of tools - each with a NAME,
  a DESCRIPTION, and a typed INPUT SCHEMA (JSON Schema). The model decides which to call and with what
  arguments; your code runs it and returns the result. The description is the single biggest lever on
  correctness - it should say WHAT the tool does and crucially WHEN to use it (and when not to). Make
  inputs typed and required-vs-optional explicit, add enums for fixed choices, and describe each parameter.
  Other levers - tell the model it may call multiple tools or none, and what to do when no tool fits.
  With Claude, you pass tools in the API `tools` array; vague descriptions are the top cause of wrong
  or missing calls.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant that calls the tools you define when their description fits.
    lesson:
    - heading: Anatomy of a tool
      body: A tool definition has three parts - NAME (a clear verb_noun like create_ticket), DESCRIPTION
        (what it does and WHEN to use it), and an INPUT SCHEMA (typed parameters, usually JSON Schema).
        The model reads these and decides whether and how to call the tool. Treat the description as a
        tiny spec the model must understand cold.
    - heading: Descriptions decide everything
      body: 'The description is the #1 driver of correct tool use. Write it like an API doc - "Use this
        to look up the current weather for a city. Call it whenever the user asks about weather, temperature,
        or forecast. Do NOT use it for historical climate questions." Stating the TRIGGER (when to call)
        and the ANTI-trigger (when not to) prevents both missed calls and inappropriate ones.'
    - heading: Schemas and arguments
      body: 'Make inputs precise - type every parameter (string, integer, boolean, array, object), mark
        which are required, use enums for fixed choices ("status: one of open|closed"), and add a one-line
        description per field so the model extracts the right value from the user''s text. Also tell the
        model what to do when NO tool fits (answer directly, or ask a clarifying question) so it doesn''t
        force an irrelevant call.'
    rubric:
    - task
    - format
    - specificity
    - constraints
    exercises:
    - id: tool-when-to-use
      title: Write a tool with a WHEN-to-use description
      goal: 'Write a tool definition with a NAME, a DESCRIPTION that says both what it does and WHEN the
        model should call it, and typed INPUT parameters. Bonus: note when it should NOT be called.'
      starter: 'Tool: create_ticket

        Description:

        '
      success:
        min_words: 16
        require:
        - - when
          - use this
          - call this
          - call it
          - use it when
          - trigger
          - should call
        any_of:
        - - string
          - integer
          - boolean
          - enum
          - array
          - object
          - required
          - param
          - input
          - type
      success_response: Strong definition - a clear name, a WHEN-to-call description, and typed inputs
        give me everything I need to call create_ticket with the right arguments at the right moment.
      partial_response: 'State WHEN to call it (the trigger condition), not just what it does, and type
        the INPUT parameters (e.g. title: string, priority: enum). The trigger plus typed inputs are what
        drive a correct call.'
    - id: argument-schema
      title: Specify a typed argument schema
      goal: Write a JSON-style input schema for a tool — at least two parameters with their TYPES (string/integer/boolean/array),
        marking which are required and using an enum or fixed choices where it helps.
      starter: ''
      success:
        min_words: 10
        requires_json_request: true
        require:
        - - string
          - integer
          - int
          - number
          - boolean
          - bool
          - array
          - enum
        any_of:
        - - required
          - optional
          - enum
          - type
          - properties
          - schema
      success_response: '{"type":"object","properties":{"city":{"type":"string"},"units":{"type":"string","enum":["c","f"]}},"required":["city"]}

        '
      partial_response: Give a real schema - name each parameter, set its TYPE (string/integer/boolean/array),
        mark which are required, and use an enum for fixed choices. Typed schemas are what make argument
        extraction reliable.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `the solution file`, read the instructions, and run the visible tests
    to see which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Add guidance for argument extraction and when NOT to call the tool.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
