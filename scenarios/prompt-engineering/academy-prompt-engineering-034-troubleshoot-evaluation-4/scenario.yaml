environment:
  nodes:
  - role: primary
    os: FixitLab LLM practice workspace
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - bash
  - coreutils
  - journalctl
  - prompt engineering
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Prompt Evaluation — Troubleshoot Lab
  description: Complete the evaluation prompt exercise in the practice console.
  validation:
    type: custom_script
    script: hidden_tests
    error_message: Prompt did not meet the rubric. Revise and submit again.
solution:
  summary: Write a specific prompt covering role, task, constraints, and format for
    evaluation.
  files_changed: []
  commands_run: []
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Read the lesson
    instruction: Review the lesson panels in the Prompt Playground.
    command: open playground
    expected_output: Lesson content visible
    explanation: Understand the rubric before writing.
    next_on: manual
  - step: 2
    title: Draft your prompt
    instruction: Write your prompt in the editor and check the live score.
    command: draft prompt
    expected_output: Score 80+ on rubric
    explanation: Iterate until specific enough.
    next_on: manual
  - step: 3
    title: Submit for grading
    instruction: Submit when all exercises pass.
    command: submit
    expected_output: All exercises passed
    explanation: Server re-checks your prompt.
    next_on: validate
coding_mode: true
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A helpful AI assistant for learning prompt engineering.
    lesson:
    - heading: About Evaluation
      body: This lab teaches evaluation — one of the core skills for reliable LLM
        workflows. Use the practice console to draft and score your prompt against
        the rubric.
    - heading: What good looks like
      body: Strong prompts assign a role, state the task clearly, set constraints
        (length, tone, format), and specify the output shape. Vague prompts score
        low; specific prompts score 80+.
    rubric:
    - role
    - context
    - task
    - constraints
    - format
    - specificity
    exercises:
    - id: eval-criteria
      title: Define evaluation criteria
      goal: Write a prompt that states how outputs should be judged.
      success:
        mentions_limit: true
        min_words: 18
        require_any_role: true
      starter: Write your prompt here…
  instructions: Complete the Prompt Evaluation — Troubleshoot Lab exercise in the
    Prompt Playground. Score 80+ on the rubric, then submit.
