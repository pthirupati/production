title: Prompt Evaluation — Troubleshoot Lab
slug: academy-prompt-engineering-034-troubleshoot-evaluation-4
technology: prompt-engineering
category: Fix
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
jira_priority: Medium
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Prompt
  Evaluation — Troubleshoot` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with
  prompt templates, eval sets, and tool configs. All tools run locally; no paid APIs
  or external cloud calls are required.


  SYMPTOM / STARTING STATE: The LLM practice workspace is degraded. Prompt changes
  regress quietly. Recent changes may exist around prompt evaluation, but do not restart
  blindly — gather evidence first. Production alert: prompt changes regress quietly.
  You are on call for prompt-engineering and must troubleshoot prompt evaluation methodically
  — triage symptoms, isolate root cause, apply the smallest safe fix, and confirm
  recovery.


  OBJECTIVE: The incident symptom is clear: prompt changes regress quietly; Root cause
  is isolated with evidence, not guesswork; Service behavior returns to normal after
  the fix. Success means all prompt exercises pass the rubric.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: prompt changes regress quietly'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: A guided AI practice console opens in your browser. It is a rule-based
  simulator (no real model, no API cost) that scores your prompt live.
hints:
- order: 1
  cost: 0
  content: Include WHO the AI should act as (role), WHAT to do (task), and HOW to
    format the answer.
- order: 2
  cost: 25
  content: 'Add constraints: word count, audience, tone, or things to avoid.'
- order: 3
  cost: 50
  content: Use the live score panel — aim for 80+ before submitting.
summary: Complete the prompt evaluation — troubleshoot lab prompt engineering lab
  and verify success with the checker
estimated_minutes: 20
xp_reward: 100
