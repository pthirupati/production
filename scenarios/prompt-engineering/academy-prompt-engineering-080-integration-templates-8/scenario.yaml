title: Jinja2 Templates — Integration Lab
slug: academy-prompt-engineering-080-integration-templates-8
technology: prompt-engineering
category: Project
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `prompt-engineering: Jinja2
  Templates — Integration Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for Jinja2 templates.
  Downstream consumers are waiting on this integration path. Integration lab: connect Jinja2 templates
  with an adjacent platform in the prompt-engineering stack. Validate authentication, data handoff, and
  failure behavior for variables, filters, and conditionals in templates.


  OBJECTIVE: Jinja2 templates is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `systemctl
  is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Jinja2 templates is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for Jinja2 templates. Downstream
  consumers are waiting on this integration path.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — template files, `--check --diff`, and rendered output.

    2. Write down what looks normal versus wrong or missing for Jinja2 templates.

    3. Recall the core idea: variables, filters, and conditionals in templates. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Handoff points are authenticated and observable

    2. End-to-end workflow completes without manual intervention'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — template files, `--check --diff`, and rendered output.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — the rendered file matches the intended config.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
