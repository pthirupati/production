title: 'Practice: Enforce a JSON Schema with Enums'
slug: output-schema-validation-practice
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Practice: Enforce a JSON
  Schema with Enums` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens with two graded schema exercises. Write
  prompts that demand JSON matching a precise schema — required fields, types, and an enum — and nothing
  else. Rule-based and free — a schema-precise prompt passes; a vague one fails. The capstone graded lab.
  Write prompts that don''t just ask for JSON, but pin a full schema — required fields, exact types, and
  enum-constrained values — so the output validates every time. This is the difference between "usually
  parseable" and "safe to feed straight into a typed system."


  OBJECTIVE: Write a prompt that declares a JSON schema with required fields and explicit types; Constrain
  a field to a fixed set of values with an enum, shown by example; Pass both graded exercises (the simulator
  re-checks your prompt server-side). Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
