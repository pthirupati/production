title: "Context Pruning in Long Sessions"
slug: context-pruning
category: Prompt Engineering
description: >-
  In long conversations and agent runs, the context window fills with stale turns,
  old tool output, and dead ends — raising cost and degrading focus. Learn to prune
  and compress context: summarize old history, drop irrelevant material, and keep
  only what the current step needs.
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
  - Explain why a bloated context raises cost and hurts quality ("context rot")
  - Apply pruning strategies — summarize history, drop stale/irrelevant content
  - Write a prompt that compresses prior context into a compact running summary
initial_state: >-
  The guided AI practice console opens. Practice compressing a long history into a
  tight running summary so the model keeps only what matters. Rule-based and free.
solution_explanation: >-
  Every token in context costs money and competes for the model's attention. In
  long chats and agent loops the window fills with old turns, verbose tool outputs,
  and abandoned attempts - raising cost and causing "context rot," where the signal
  you care about gets buried and the model drifts. Pruning strategies - (1)
  SUMMARIZE older history into a compact running summary and drop the raw turns; (2)
  REMOVE stale or irrelevant material (closed sub-tasks, superseded plans, huge
  pasted blobs you've already used); (3) KEEP only what the current step needs - the
  goal, the active sub-task, the most recent relevant facts; (4) re-inject key
  constraints near the end so they stay salient. In Claude Code this maps to
  /compact and keeping a tight CLAUDE.md. Prune deliberately rather than letting
  context grow unbounded.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant that keeps a tight, relevant working context.
    lesson:
      - heading: Why a fat context hurts
        body: >-
          Bigger context isn't better. Beyond the direct token cost, a window
          crammed with old turns, long tool dumps, and dead-end attempts buries the
          relevant signal - models can lose track of the goal and latch onto stale
          details. This "context rot" is why a focused, pruned context often
          outperforms a giant one.
      - heading: Pruning strategies
        body: >-
          Three moves. SUMMARIZE - compress earlier history into a short running
          summary ("Decisions so far: ...; Open task: ...") and discard the raw
          turns. DROP - remove material that's no longer relevant - resolved
          sub-tasks, superseded plans, big blobs you've already extracted what you
          need from. KEEP-FOCUSED - retain only the goal, the active sub-task, and
          the most recent pertinent facts. Re-state critical constraints near the end
          so they stay salient.
      - heading: In practice
        body: >-
          Long agent runs need this most - tool outputs pile up fast. Periodically
          replace history with a summary, evict completed-step detail, and carry
          forward a compact state object. In Claude Code, /compact summarizes the
          conversation and a lean CLAUDE.md keeps durable context small. The
          discipline - decide what to KEEP rather than letting context accrete by
          default.
    rubric: [context, task, constraints, specificity]
    exercises:
      - id: summarize-history
        title: Compress history into a running summary
        goal: >-
          Write a prompt that instructs the model to compress a long prior
          conversation into a COMPACT running summary — capturing key decisions and
          the open task — so the raw turns can be dropped. Cap the summary length.
        starter: ""
        success:
          min_words: 14
          any_of:
            - ["summarize", "summary", "compress", "condense", "running summary", "key points", "key decisions", "recap", "distill"]
          mentions_limit: true
        success_response: >-
          Good — a capped running summary lets you discard the raw turns while
          keeping the decisions and the open task. That's how you hold a long session
          in a small, focused context.
        partial_response: >-
          Ask the model to COMPRESS the history into a short running summary (key
          decisions + the open task) and CAP its length so it stays compact. The
          length limit is what keeps the summary from re-bloating.
      - id: keep-relevant
        title: Keep only what the current step needs
        goal: >-
          Write an instruction that tells the model (or agent) to KEEP only the
          context relevant to the CURRENT step and DROP stale/irrelevant material —
          make the keep-vs-drop rule explicit.
        starter: ""
        success:
          min_words: 12
          any_of:
            - ["keep only", "only the", "relevant", "drop", "discard", "remove", "ignore", "prune", "exclude", "stale", "irrelevant", "no longer"]
        success_response: >-
          That's the right discipline — retaining only what the current step needs
          and dropping stale material keeps both cost down and the model focused on
          the active task.
        partial_response: >-
          State the keep-vs-drop rule explicitly - KEEP only what's relevant to the
          current step, DROP stale or resolved material. Deciding what to keep beats
          letting context grow unbounded.
hints:
  - content: Every token costs money and competes for attention. In long sessions, old turns, tool dumps, and dead ends cause "context rot" — pruning often beats a giant context.
    cost: 10
    order: 1
  - content: 'Three moves: summarize old history into a compact running summary (and drop raw turns), remove stale/irrelevant material, and keep only what the current step needs.'
    cost: 15
    order: 2
  - content: 'In Claude Code this is /compact plus a lean CLAUDE.md. Carry forward a small state object and re-state critical constraints near the end so they stay salient.'
    cost: 20
    order: 3
