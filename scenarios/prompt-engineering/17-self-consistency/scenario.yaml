title: 'Self-Consistency: Sample and Vote'
slug: self-consistency
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Self-Consistency: Sample
  and Vote` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens. Practice asking the model for several
  independent solution attempts and a majority-vote answer. Rule-based and free. On hard reasoning problems
  a single chain of thought can take a wrong turn. Self-consistency fixes this: generate several independent
  reasoning paths, then take the majority answer. Learn the technique, when it earns its extra cost, and
  how to prompt for it.


  OBJECTIVE: Explain self-consistency (sample multiple reasoning paths, then majority-vote); Decide when
  the accuracy gain is worth the extra calls/cost; Write a prompt that requests multiple independent attempts
  and a final vote. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Explain self-consistency (sample multiple reasoning paths, then majority-vote)
- Decide when the accuracy gain is worth the extra calls/cost
- Write a prompt that requests multiple independent attempts and a final vote
initial_state: The guided AI practice console opens. Practice asking the model for several independent
  solution attempts and a majority-vote answer. Rule-based and free.
solution_explanation: Self-consistency builds on chain-of-thought - instead of trusting one reasoning
  path, you sample several (with some randomness/temperature), then return the answer that appears most
  often. The intuition - many independent correct paths tend to converge on the same answer, while wrong
  paths scatter. It reliably lifts accuracy on arithmetic, logic, and commonsense tasks, at the cost of
  N times the calls. Use it for high-stakes, verifiable answers; skip it for cheap or open-ended tasks.
  You can prompt for it in one shot ("produce 3 independent solutions, then the majority answer") or orchestrate
  N separate calls and vote in code.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A reasoning assistant that can produce several independent attempts and vote.
    lesson:
    - heading: The core idea
      body: A single chain of thought is one sample from the model's distribution - sometimes it slips.
        Self-consistency samples MANY reasoning paths independently and keeps the most common final answer.
        Correct reasoning tends to converge; mistakes tend to be idiosyncratic and scatter, so the majority
        vote washes them out.
    - heading: When it's worth it
      body: Self-consistency multiplies cost and latency by the number of samples (3, 5, sometimes more).
        Spend that budget when the answer is (a) high-stakes and (b) objectively checkable - a number,
        a label, a yes/no. For open-ended writing there's no "majority answer," so it doesn't apply. For
        cheap, low-risk tasks one pass is fine.
    - heading: How to prompt for it
      body: Two ways. ONE-SHOT - "Solve this 3 different ways, showing each independent line of reasoning,
        then state the single answer that the majority of your attempts agree on." ORCHESTRATED - make
        N separate calls (ideally with temperature > 0 for diversity) and tally the final answers in your
        own code. The orchestrated version gives true independence; the one-shot version is cheaper and
        often good enough.
    rubric:
    - task
    - reasoning
    - format
    - specificity
    exercises:
    - id: vote-on-answer
      title: Request multiple attempts and a vote
      goal: Write a prompt for a checkable problem (math/logic) that asks the model to produce SEVERAL
        independent solution attempts (reason each one separately) and then return the MAJORITY / most
        common final answer.
      starter: ''
      success:
        min_words: 14
        any_of:
        - - reason
          - reasoning
          - step by step
          - solve
          - work through
          - attempt
          - approach
        require:
        - - majority
          - most common
          - vote
          - agree
          - consensus
          - appears most
          - 3 times
          - multiple times
          - several attempts
          - independent
      success_response: 'Attempt 1 -> 42. Attempt 2 -> 42. Attempt 3 -> 40.

        Majority answer: 42 (2 of 3 independent attempts agree).

        '
      partial_response: Ask for SEVERAL independent attempts (each with its own reasoning) and then the
        MAJORITY answer — e.g. "solve it 3 separate ways and give the answer most of them agree on." That
        voting step is the whole technique.
    - id: when-to-vote
      title: Decide when self-consistency pays off
      goal: Write a short note picking ONE task and arguing whether self-consistency is worth its extra
        cost — tie it to whether the answer is high-stakes and objectively checkable, versus cheap or
        open-ended.
      starter: ''
      success:
        min_words: 14
        any_of:
        - - high-stakes
          - high stakes
          - checkable
          - verifiable
          - objective
          - majority
          - open-ended
          - open ended
          - cost
          - cheap
          - expensive
          - latency
          - accuracy
      success_response: Sound reasoning. Self-consistency earns its N-times cost when the answer is high-stakes
        and objectively checkable; for cheap or open-ended work a single pass is the better trade.
      partial_response: Tie the decision to the task - is the answer high-stakes AND checkable (worth
        sampling and voting) or cheap/open-ended (one pass is plenty)? Name the task and justify the trade-off.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `the solution file`, read the instructions, and run the visible tests
    to see which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Write a prompt that requests multiple independent attempts and a final vote.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
