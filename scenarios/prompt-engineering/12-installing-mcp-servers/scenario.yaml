description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Installing MCP Servers
  in Claude Code` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided console opens with a reference lesson plus a practice exercise
  where you compose a real `claude mcp add` command. Rule-based and free — no servers are actually installed.
  The Model Context Protocol (MCP) is an open standard that lets AI assistants connect to external tools
  and data — GitHub, databases, your filesystem, Slack, and more. Learn what MCP is, the three transports
  (stdio, SSE, HTTP), and the exact `claude mcp add` commands to install and manage MCP servers in Claude
  Code.


  OBJECTIVE: Explain what MCP is and why it standardizes tool access for AI assistants; Name the three
  MCP transports and when each applies (stdio, SSE, HTTP); Write a correct `claude mcp add` command to
  install a server. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
