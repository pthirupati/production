title: 'Practice: A System Prompt That Refuses Off-Topic'
slug: refuse-off-topic-practice
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Practice: A System Prompt
  That Refuses Off-Topic` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens with two graded exercises on scoping
  and refusals. Write a system prompt that keeps a narrow bot on-topic and declines the rest, kindly.
  Rule-based and free — a strong prompt passes, a vague one fails. A hands-on, graded lab. Write a SYSTEM
  prompt for a narrow assistant (say, a billing-support bot) that stays strictly in scope: it answers
  in-scope questions and politely declines anything off-topic, ideally redirecting the user. This is the
  backbone of safe, predictable production assistants.


  OBJECTIVE: Write a system prompt that assigns a narrow role and an explicit scope boundary; Make the
  assistant politely refuse and redirect off-topic requests instead of answering; Pass both graded exercises
  (the simulator re-checks your prompt server-side). Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
