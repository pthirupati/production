title: Tool Use — Production Lab
slug: academy-prompt-engineering-025-production-tools-3
technology: prompt-engineering
category: Project
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
jira_priority: Medium
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `prompt-engineering:
  Tool Use — Production Readiness` during a realistic incident. The business impact
  is reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with
  prompt templates, eval sets, and tool configs. All tools run locally; no paid APIs
  or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but tool use is not production
  ready — missing guardrails, runbooks, or capacity checks. Production readiness for
  tool use. Harden, document, and validate function calling and schemas so the change
  is safe to run during a maintenance window.


  OBJECTIVE: Day-2 tool use work completes safely in this environment; Changes are
  verified with before/after checks; The system remains stable for dependent teams.
  Success means all prompt exercises pass the rubric.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Day-2 tool use work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A guided AI practice console opens in your browser. It is a rule-based
  simulator (no real model, no API cost) that scores your prompt live.
hints:
- order: 1
  cost: 0
  content: Include WHO the AI should act as (role), WHAT to do (task), and HOW to
    format the answer.
- order: 2
  cost: 25
  content: 'Add constraints: word count, audience, tone, or things to avoid.'
- order: 3
  cost: 50
  content: Use the live score panel — aim for 80+ before submitting.
summary: Complete the tool use — production lab prompt engineering lab and verify
