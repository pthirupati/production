    title: Submit for grading
    instruction: Submit when all exercises pass.
    command: submit
    expected_output: All exercises passed
    explanation: Server re-checks your prompt.
    next_on: validate
coding_mode: true
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A helpful AI assistant for learning prompt engineering.
    lesson:
    - heading: About Tools
      body: This lab teaches tools — one of the core skills for reliable LLM workflows.
        Use the practice console to draft and score your prompt against the rubric.
    - heading: What good looks like
      body: Strong prompts assign a role, state the task clearly, set constraints
        (length, tone, format), and specify the output shape. Vague prompts score
        low; specific prompts score 80+.
    rubric:
    - role
    - context
    - task
    - constraints
    - format
    - specificity
    exercises:
    - id: tool-use
      title: Tool-use prompt
      goal: Write a prompt that asks the model to use tools step by step.
      success:
        min_words: 20
        require_any_role: true
      starter: Write your prompt here…
  instructions: Complete the Tool Use — Production Lab exercise in the Prompt Playground.
    Score 80+ on the rubric, then submit.
