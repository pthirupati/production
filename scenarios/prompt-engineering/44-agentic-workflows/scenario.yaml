title: 'Agentic Workflows: Plan, Act, Verify'
slug: agentic-workflows
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Agentic Workflows: Plan,
  Act, Verify` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens with two graded exercises on agentic
  workflows. Write an agent instruction with a goal and a stop condition, then justify when an agent beats
  a simpler approach. Rule-based and free — strong answers pass, vague ones fail. An agent is a model
  that runs a loop — plan, take an action with a tool, observe the result, and repeat until a goal is
  met. Learn when an agentic loop is the right tool (and when a single call or a fixed workflow is better),
  and how to prompt one so it stays on task and knows when to stop.


  OBJECTIVE: Decide between a single call, a fixed workflow, and an open-ended agent loop; Prompt an agent
  with a clear goal, a stopping condition, and a verification step; Pass both graded exercises (the simulator
  re-checks your prompt server-side). Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
