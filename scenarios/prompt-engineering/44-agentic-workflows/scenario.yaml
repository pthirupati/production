initial_state: The guided AI practice console opens with two graded exercises on agentic workflows. Write
  an agent instruction with a goal and a stop condition, then justify when an agent beats a simpler approach.
  Rule-based and free — strong answers pass, vague ones fail.
solution_explanation: Start simple and escalate. A SINGLE CALL handles classification, extraction, or
  Q&A. A FIXED WORKFLOW (you orchestrate the steps in code) handles multi-step pipelines where the path
  is known. Reach for an AGENT — a model-driven loop — only when the task is open-ended and hard to fully
  specify up front, the outcome justifies the extra cost and latency, and errors are recoverable (tests,
  review, rollback). A good agent prompt states the GOAL clearly up front (give the full task in one well-specified
  instruction), grants the tools it needs, defines a STOPPING CONDITION ("stop when the tests pass and
  you've summarized the change"), and builds in VERIFICATION (have it check its own work before declaring
  done). Without an explicit stop and a verify step, agents loop forever or quit early.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An autonomous assistant that plans, calls tools, observes results, and iterates toward a
      goal.
    lesson:
    - heading: Should this even be an agent?
      body: Most tasks aren't agents. Use a single call for one-shot work (summarize, classify, extract).
        Use a fixed, code-orchestrated workflow when the steps are known in advance — it's cheaper and
        more predictable. Reserve an open-ended agent loop for tasks that are genuinely multi-step, hard
        to specify fully, worth the cost, and recoverable when they go wrong.
    - heading: Goal up front, then let it run
      body: Agents do best when you state the full goal and constraints in one clear instruction at the
        start, rather than dribbling context across many turns. "Migrate this module to the new API; keep
        tests green; don't change public behavior." A well-specified goal up front yields more efficient,
        more coherent runs than vague step-by-step nudging.
    - heading: Stopping conditions and self-verification
      body: Two things keep a loop healthy. A STOPPING CONDITION tells the agent when it's done — "stop
        when all tests pass and you've written a one-line summary." A VERIFICATION step makes it check
        its own work before claiming success — re-run the tests, diff the output against the requirement.
        Without these, agents either spin endlessly or declare victory too soon.
    rubric:
    - task
    - reasoning
    - constraints
    - specificity
    exercises:
    - id: agent-goal-and-stop
      title: 'Graded: an agent instruction with a stop condition'
      goal: Write an instruction for an agent that states a clear goal, lets it use tools/act in a loop,
        and defines an explicit stopping condition or a step where it verifies its own work before finishing.
      starter: Fix the failing build.
      success:
        min_words: 14
        must_contain_all:
        - - stop
          - until
          - done
          - finish
          - complete
          - verify
          - check
        any_of:
        - - goal
          - task
          - tool
          - act
          - action
          - step
          - loop
          - iterate
          - then
          - tests pass
          - re-run
          - confirm
      success_response: 'Goal: make the build pass. Run the tests, fix what fails, and repeat. Stop when
        all tests pass; before finishing, re-run the full suite to verify, then give a one-line summary.'
      partial_response: You set a goal — now add a stopping condition and a verification step. Tell the
        agent when it's done ("stop when tests pass") and to confirm by re-running before declaring success.
        Otherwise it loops or quits early.
    - id: when-agent-vs-workflow
      title: 'Graded: agent vs simpler approach'
      goal: Explain when an open-ended agent loop is the right choice versus a single call or a fixed
        workflow — touch on at least one tradeoff (open-ended vs known steps, cost/latency, or recoverability
        of errors).
      starter: ''
      success:
        min_words: 16
        any_of:
        - - open-ended
          - open ended
          - multi-step
          - multistep
          - hard to specify
          - single call
          - fixed workflow
          - workflow
          - known steps
          - cost
          - latency
          - recoverable
          - rollback
          - overkill
          - tradeoff
          - trade-off
      success_response: Use an agent only when the task is open-ended and hard to script, the payoff justifies
        extra cost and latency, and mistakes are recoverable. For known steps, a fixed workflow is cheaper
        and more predictable.
      partial_response: Name a real tradeoff. Agents fit open-ended, hard-to-specify tasks where errors
        are recoverable and the cost is worth it; a single call or a fixed code workflow is cheaper and
        more predictable for known steps.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: agentic workflows is not behaving as the scenario
    objectives require. This lab is about agentic workflows — how agentic workflows behaves in a prompt
    engineering environment. Read the objectives and the current state, and note precisely what looks
    wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For agentic workflows problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of agentic workflows is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''agentic workflows
    is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
