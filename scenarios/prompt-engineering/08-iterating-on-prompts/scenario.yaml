max_score: 100
is_free: true
dual_terminal: false
objectives:
- Describe the try -> diagnose -> change-one-thing -> retry loop
- Identify the specific missing ingredient when an answer falls short
- Pass the exercise by refining a weak prompt into a strong one in steps
initial_state: The guided AI practice console opens. Start from a weak prompt, read the feedback, and
  improve it one change at a time until the score clears the bar. Rule-based and free.
solution_explanation: Prompt engineering is empirical. The loop - (1) try the prompt; (2) diagnose - what
  exactly is wrong (too long? wrong format? missing a constraint?); (3) change ONE thing so you know what
  caused the improvement; (4) retry. Keep a few test inputs so you can tell whether a change helped overall,
  not just on one lucky case. When a prompt finally works, save it. Changing several things at once makes
  it impossible to learn what actually mattered.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant whose answers improve as your prompt does.
    lesson:
    - heading: The loop
      body: Try, diagnose, change one thing, retry. Treat the model's output as data - if it's wrong,
        the prompt under-specified something. Resist the urge to rewrite everything; isolate the one change
        that should fix the gap, so you actually learn what works.
    - heading: Diagnose honestly
      body: Name the failure precisely - "too verbose" needs a length cap; "wrong format" needs an explicit
        format + example; "missed an edge case" needs that case spelled out or a few-shot example; "made
        something up" needs grounding in provided context. The fix follows directly from the diagnosis.
    - heading: Use test inputs and save winners
      body: Don't tune on a single example - you'll overfit. Keep 3-5 representative inputs and check
        a change against all of them. Once a prompt reliably works, save it (in a file, a CLAUDE.md, or
        a prompt library) so you and your team reuse it instead of reinventing it.
    rubric:
    - task
    - constraints
    - format
    - specificity
    - examples
    exercises:
    - id: refine-stepwise
      title: Refine a weak prompt
      goal: Start from the weak prompt below and improve it. A strong version names an audience, caps
        the length, and asks for a specific format. Make it clear and specific enough to clear the bar.
      starter: explain APIs
      success:
        min_words: 12
        require_any_role: true
        mentions_limit: true
        any_of:
        - - bullet
          - list
          - sentence
          - analogy
          - example
          - table
          - steps
          - paragraph
      success_response: An API is a contract that lets two programs talk - like a waiter taking your order
        to the kitchen and bringing back food. (Beginner audience, one analogy, length-capped - the refinements
        landed.)
      partial_response: Diagnose what's missing and fix ONE thing at a time. Right now there's no audience,
        no length cap, and no format. Add an audience first, then retry, then add a length cap.
    - id: name-the-fix
      title: Apply the fix that matches the failure
      goal: Suppose the model's answer was too long and rambling. Write a revised prompt whose change
        directly targets THAT failure - add a hard length limit and ask for a tight format.
      starter: Summarize the article.
      success:
        min_words: 8
        mentions_limit: true
        any_of:
        - - bullet
          - sentence
          - words
          - concise
          - brief
          - tl;dr
          - one line
          - short
      success_response: '- Key point 1\n- Key point 2\n- Key point 3\n(Capped to 3 bullets - the fix matched
        the "too long" failure directly.)'
      partial_response: The failure was "too long," so the targeted fix is a length cap plus a tight format
        - e.g. "Summarize in exactly 3 bullet points, max 12 words each." Aim the change at the actual
        problem.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: iterating on prompts is not behaving as the
    scenario objectives require. This lab is about iterating on prompts — how iterating on prompts behaves
    in a prompt engineering environment. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For iterating on prompts problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of iterating on prompts is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''iterating on
    prompts is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.

    WHY: coding labs grade against hidden test cases, not marker files.'
