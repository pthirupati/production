title: "Iterating on Prompts"
slug: iterating-on-prompts
category: Prompt Engineering
description: >-
  Great prompts are rarely written in one shot — they're refined. Learn a tight
  iteration loop: try, read the failure honestly, change ONE thing, and retry.
  Practice diagnosing why an answer missed and making the smallest fix that
  moves it toward your goal.
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
  - Describe the try -> diagnose -> change-one-thing -> retry loop
  - Identify the specific missing ingredient when an answer falls short
  - Pass the exercise by refining a weak prompt into a strong one in steps
initial_state: >-
  The guided AI practice console opens. Start from a weak prompt, read the
  feedback, and improve it one change at a time until the score clears the bar.
  Rule-based and free.
solution_explanation: >-
  Prompt engineering is empirical. The loop - (1) try the prompt; (2) diagnose -
  what exactly is wrong (too long? wrong format? missing a constraint?); (3)
  change ONE thing so you know what caused the improvement; (4) retry. Keep a few
  test inputs so you can tell whether a change helped overall, not just on one
  lucky case. When a prompt finally works, save it. Changing several things at
  once makes it impossible to learn what actually mattered.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant whose answers improve as your prompt does.
    lesson:
      - heading: The loop
        body: >-
          Try, diagnose, change one thing, retry. Treat the model's output as
          data - if it's wrong, the prompt under-specified something. Resist the
          urge to rewrite everything; isolate the one change that should fix the
          gap, so you actually learn what works.
      - heading: Diagnose honestly
        body: >-
          Name the failure precisely - "too verbose" needs a length cap; "wrong
          format" needs an explicit format + example; "missed an edge case" needs
          that case spelled out or a few-shot example; "made something up" needs
          grounding in provided context. The fix follows directly from the
          diagnosis.
      - heading: Use test inputs and save winners
        body: >-
          Don't tune on a single example - you'll overfit. Keep 3-5 representative
          inputs and check a change against all of them. Once a prompt reliably
          works, save it (in a file, a CLAUDE.md, or a prompt library) so you and
          your team reuse it instead of reinventing it.
    rubric: [task, constraints, format, specificity, examples]
    exercises:
      - id: refine-stepwise
        title: Refine a weak prompt
        goal: >-
          Start from the weak prompt below and improve it. A strong version names
          an audience, caps the length, and asks for a specific format. Make it
          clear and specific enough to clear the bar.
        starter: explain APIs
        success:
          min_words: 12
          require_any_role: true
          mentions_limit: true
          any_of:
            - ["bullet", "list", "sentence", "analogy", "example", "table", "steps", "paragraph"]
        success_response: >-
          An API is a contract that lets two programs talk - like a waiter taking
          your order to the kitchen and bringing back food. (Beginner audience,
          one analogy, length-capped - the refinements landed.)
        partial_response: >-
          Diagnose what's missing and fix ONE thing at a time. Right now there's
          no audience, no length cap, and no format. Add an audience first, then
          retry, then add a length cap.
      - id: name-the-fix
        title: Apply the fix that matches the failure
        goal: >-
          Suppose the model's answer was too long and rambling. Write a revised
          prompt whose change directly targets THAT failure - add a hard length
          limit and ask for a tight format.
        starter: "Summarize the article."
        success:
          min_words: 8
          mentions_limit: true
          any_of:
            - ["bullet", "sentence", "words", "concise", "brief", "tl;dr", "one line", "short"]
        success_response: >-
          - Key point 1\n- Key point 2\n- Key point 3\n(Capped to 3 bullets - the
          fix matched the "too long" failure directly.)
        partial_response: >-
          The failure was "too long," so the targeted fix is a length cap plus a
          tight format - e.g. "Summarize in exactly 3 bullet points, max 12 words
          each." Aim the change at the actual problem.
hints:
  - content: Change ONE thing per iteration so you know what caused the improvement. Rewriting everything at once teaches you nothing.
    cost: 10
    order: 1
  - content: Diagnose precisely - too long needs a length cap; wrong format needs a format + example; made-up facts need grounding in provided context.
    cost: 15
    order: 2
  - content: Keep 3-5 test inputs and check each change against all of them so you don't overfit to one lucky example. Then save the prompt that wins.
    cost: 20
    order: 3
