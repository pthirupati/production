is_free: false
jira_priority: Medium
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `prompt-engineering:
  Jinja2 Templates — Integration Lab` during a realistic incident. The business impact
  is reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with
  prompt templates, eval sets, and tool configs. All tools run locally; no paid APIs
  or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together
  for Jinja2 templates. Downstream consumers are waiting on this integration path.
  Integration lab: connect Jinja2 templates with an adjacent platform in the prompt-engineering
  stack. Validate authentication, data handoff, and failure behavior for variables,
  filters, and conditionals in templates.


  OBJECTIVE: Jinja2 templates is connected to the adjacent system successfully; Handoff
  points are authenticated and observable; End-to-end workflow completes without manual
  intervention. Success means all prompt exercises pass the rubric.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Jinja2 templates is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: A guided AI practice console opens in your browser. It is a rule-based
  simulator (no real model, no API cost) that scores your prompt live.
hints:
- order: 1
  cost: 0
  content: Include WHO the AI should act as (role), WHAT to do (task), and HOW to
    format the answer.
- order: 2
  cost: 25
  content: 'Add constraints: word count, audience, tone, or things to avoid.'
- order: 3
  cost: 50
  content: Use the live score panel — aim for 80+ before submitting.
