objectives:
- Write scope guardrails that keep an assistant on-topic
- Define a graceful refusal style with a redirect
- Balance over-refusal vs under-refusal of edge-case requests
initial_state: The guided AI practice console opens. Practice writing a system prompt that scopes an assistant
  and defines how it should refuse off-topic or disallowed requests. Rule-based and free.
solution_explanation: Guardrails are instructions that bound what an assistant will do. Three layers -
  (1) SCOPE - state the allowed topics/tasks and that it should decline anything outside them ("You only
  answer questions about FixitLab billing"); (2) REFUSAL STYLE - how to say no - briefly, without lecturing,
  and ideally with a redirect ("I can't help with that, but I can ...")); (3) CALIBRATION - avoid over-refusing
  legitimate edge cases and under-refusing genuinely harmful ones. Put guardrails in the system role so
  they hold every turn, give a couple of allowed/declined examples, and test with adversarial inputs.
  Guardrails complement, not replace, platform-level safety.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A scoped support assistant that politely declines out-of-scope requests.
    lesson:
    - heading: Scope the assistant
      body: The first guardrail is SCOPE - say what the assistant is for and that it should decline everything
        else. "You are FixitLab's billing assistant. Answer only questions about plans, invoices, and
        refunds. For anything else, politely say it's out of scope and point the user to the right channel."
        A clear boundary prevents the assistant from being pulled into unrelated or risky territory.
    - heading: A graceful refusal style
      body: Specify HOW to refuse. Good refusals are brief, non-judgmental, and offer a path forward -
        "I can't help with that here, but I can answer billing questions or connect you to support." Avoid
        moralizing, walls of text, or repeating the user's request back. Define this once in the system
        prompt so every refusal sounds the same.
    - heading: Calibrate - over vs under-refusal
      body: Two failure modes - OVER-refusal (declining safe, legitimate requests because they pattern-match
        a rule) frustrates users; UNDER-refusal (complying with something it shouldn't) is a real risk.
        Give a couple of examples of what IS and ISN'T allowed, encourage asking a clarifying question
        when intent is ambiguous, and test with adversarial prompts. These app-level guardrails sit on
        top of the model's built-in safety, not instead of it.
    rubric:
    - role
    - constraints
    - specificity
    - tone
    exercises:
    - id: scope-and-refuse
      title: Scope an assistant and define refusals
      goal: Write a system prompt that (a) limits the assistant to a specific topic and (b) instructs
        it to politely DECLINE/refuse anything out of scope, ideally with a redirect. Make both the scope
        and the refusal behavior explicit.
      starter: 'You are a support assistant for '
      success:
        min_words: 16
        require_any_role: true
        require:
        - - only
          - out of scope
          - off-topic
          - off topic
          - decline
          - refuse
          - politely
          - not answer
          - won't
          - stay on
        any_of:
        - - redirect
          - instead
          - point them
          - direct them
          - i can
          - i can't
          - i cannot
          - say it's
          - explain that
      success_response: Well-scoped. I'll answer only within that topic and decline anything else gracefully
        with a redirect, every turn — exactly how a production assistant should behave.
      partial_response: Pin BOTH halves - the SCOPE (only this topic) and the REFUSAL behavior (politely
        decline out-of-scope asks, ideally with a redirect like "I can't help with that, but I can ...").
        Make the boundary explicit.
    - id: refusal-tone
      title: Define a graceful refusal style
      goal: Write an instruction describing HOW the assistant should refuse — brief, polite/non-judgmental,
        and offering an alternative — so refusals are consistent and don't lecture the user.
      starter: ''
      success:
        min_words: 12
        any_of:
        - - brief
          - concise
          - short
          - polite
          - politely
          - without lecturing
          - no lecture
          - non-judgmental
          - kind
          - friendly
          - one sentence
        require:
        - - refuse
          - decline
          - say no
          - can't
          - cannot
          - won't
          - not able
          - turn down
      success_response: Good — a brief, kind refusal with an offered alternative reads far better than
        a lecture, and defining it once keeps every "no" consistent.
      partial_response: Describe the refusal STYLE - keep it brief and polite, skip the moralizing, and
        offer an alternative. And make sure it's clearly about how to REFUSE (decline/say no), not just
        general tone.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: guardrails & refusal handling is not behaving
    as the scenario objectives require. This lab is about guardrails & refusal handling — how guardrails
    & refusal handling behaves in a prompt engineering environment. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For guardrails & refusal handling problems the reliable method is:
    (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component that
    owns the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small, reversible
    steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of guardrails & refusal handling is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''guardrails &
    refusal handling is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
