solution_explanation: 'Tool calling is prompting in disguise — the model decides whether and how to call
  a function from your DESCRIPTION and SCHEMA. Two rules dominate: (1) be prescriptive about WHEN to call
  ("Call this when the user asks about a specific order''s status"), because recent models reach for tools
  conservatively and a trigger condition raises the should-call rate; (2) give a precise input_schema
  — parameter names, JSON types (string, integer, boolean, enum, array), and a required list — so arguments
  come back well-formed. In the Claude API you can add strict: true to validate arguments against the
  schema. Provide an example call for complex tools, and keep the tool set small and focused so the model
  isn''t confused by overlapping options.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant that decides when and how to call developer-provided tools.
    lesson:
    - heading: Describe WHEN, not just WHAT
      body: 'A tool description like "Gets weather" tells the model what the function does but not when
        to reach for it. Add the trigger: "Call this when the user asks about current conditions or forecast
        for a named location. Do not call it for general climate questions." Prescriptive when-to-call
        guidance measurably improves how often the model picks the right tool.'
    - heading: Pin the argument schema
      body: 'Define the inputs precisely: each parameter''s name, its JSON type (string, integer, boolean,
        enum, array, object), and whether it''s required. An enum constrains a field to allowed values
        ("unit: one of celsius, fahrenheit"). A tight schema is what makes arguments come back parseable.
        In the Claude API, strict: true validates the model''s arguments against this schema before your
        code ever runs.'
    - heading: Keep the toolset focused
      body: The model gets confused by many overlapping tools. Prefer a small set with non-overlapping
        purposes and clear names (get_order_status, not tool1). For complex inputs, include one example
        call in the description. When you have a large library, tool-search lets the model discover the
        few relevant tools instead of loading every schema at once.
    rubric:
    - task
    - constraints
    - format
    - specificity
    exercises:
    - id: tool-when-to-use
      title: 'Graded: a tool description with a trigger'
      goal: Write a tool description for a function (e.g. get_order_status) that clearly states WHEN the
        model should call it AND names at least one typed argument (its type or whether it's required).
      starter: 'get_order_status: returns the status of an order.'
      success:
        min_words: 16
        require:
        - - when
          - use this
          - call this
          - call it
          - use it when
          - trigger
          - should call
          - call when
        any_of:
        - - string
          - integer
          - boolean
          - enum
          - array
          - object
          - required
          - param
          - input
          - type
          - argument
      success_response: 'Tool selected: get_order_status(order_id="A-1042"). Returning the current status
        for that order.'
      partial_response: 'You named the tool — now add a trigger condition ("Call this when the user asks
        about a specific order''s status") and at least one typed argument (e.g. order_id: string, required).
        When + types is what makes the call reliable.'
    - id: argument-schema
      title: 'Graded: a typed argument schema'
      goal: Write an argument schema for a tool that specifies parameter names, their JSON types (string,
        integer, boolean, enum, array), and which parameters are required vs optional.
      starter: ''
      success:
        min_words: 10
        requires_json_request: true
        require:
        - - string
          - integer
          - int
          - number
          - boolean
          - bool
          - array
          - enum
        any_of:
        - - required
          - optional
          - enum
          - type
          - properties
          - schema
          - parameter
      success_response: '{"order_id": "A-1042", "include_history": false}

        '
      partial_response: 'Name each parameter, give it a JSON type, and mark required vs optional. For
        example: order_id (string, required), include_history (boolean, optional). An enum is great when
        a field has a fixed set of values.'
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: designing tool / Function-Calling prompts is
    not behaving as the scenario objectives require. This lab is about designing tool / Function-Calling
    prompts — how designing tool / Function-Calling prompts behaves in a prompt engineering environment.
    Read the objectives and the current state, and note precisely what looks wrong versus healthy before
    you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For designing tool / Function-Calling prompts problems the reliable
    method is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small,
    reversible steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of designing tool / Function-Calling prompts
    is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''designing tool
    / Function-Calling prompts is not behaving as the scenario objectives require'' toward ''all hidden
    tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.

    WHY: coding labs grade against hidden test cases, not marker files.'
