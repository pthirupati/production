hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: unsafe output slips through. This lab is about
    safety guardrails — refusals, filters, and limits. Read the objectives and the current state, and
    note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For safety guardrails problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Implement the automation with dry-run / check mode, then run
    it twice — the second run must report no changes.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of safety guardrails is at fault.

    2. Re-run the most relevant of guardrail rules and outputs focused on just that part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''unsafe output
    slips through'' toward ''guardrails block unsafe output''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.

    WHY: coding labs grade against hidden test cases, not marker files.'
