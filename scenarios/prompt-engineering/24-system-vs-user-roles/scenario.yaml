title: System vs User vs Assistant Roles
slug: system-vs-user-roles
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `System vs User vs Assistant
  Roles` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens. Practice deciding what goes in the system
  role versus a user message, and write a strong system prompt. Rule-based and free. Chat models read
  messages in roles — system, user, and assistant. Putting the right content in the right role changes
  how strongly the model follows it. Learn what belongs in the system prompt, what belongs in user turns,
  and how prior assistant turns shape behavior.


  OBJECTIVE: Explain the system / user / assistant roles and how each is treated; Decide what durable
  behavior belongs in the system role vs a user turn; Write a system-role instruction with durable persona
  and rules. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Explain the system / user / assistant roles and how each is treated
- Decide what durable behavior belongs in the system role vs a user turn
- Write a system-role instruction with durable persona and rules
initial_state: The guided AI practice console opens. Practice deciding what goes in the system role versus
  a user message, and write a strong system prompt. Rule-based and free.
solution_explanation: Chat APIs structure a conversation into roles. SYSTEM - durable, high-priority instructions
  that frame the whole conversation (persona, rules, format defaults, safety boundaries). USER - the individual
  request or data for this turn. ASSISTANT - the model's replies, and prior assistant turns the model
  treats as its own established behavior. Put STABLE behavior in the system role - it's followed more
  strongly and you don't repeat it each turn. Put per-request details in the user turn. You can also seed
  the assistant role to set tone or PREFILL the start of a reply. In the Claude API the system prompt
  is a top-level `system` parameter, separate from the messages list; in Claude Code, CLAUDE.md plays
  the system role for the repo.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant whose durable behavior is set by the system role.
    lesson:
    - heading: Three roles, three jobs
      body: SYSTEM is the standing brief - who the assistant is, its rules, default tone and format, and
        any boundaries. USER is a single request or the data for this turn. ASSISTANT is the model's output;
        earlier assistant turns read as behavior it has already committed to. The model weighs the system
        role highly and treats it as persistent across the whole conversation.
    - heading: What goes where
      body: 'Durable, cross-turn behavior -> SYSTEM ("You are a senior SRE; always show the command first;
        never modify tests to pass"). One-off request + its data -> USER ("Here''s the failing log: ...
        what''s the root cause?"). Don''t bury a persistent rule inside a single user message you''ll
        have to repeat - lift it into the system role once.'
    - heading: Seeding and prefilling the assistant
      body: You can also put words in the assistant's mouth. A seeded assistant turn sets tone ("Sure
        — here's the JSON:"), and historically PREFILLING the assistant message with the first characters
        of the desired output (like "{") forced the model to continue from there. Note - on current Claude
        models a last-turn prefill is no longer supported; the modern, stronger way to force a shape is
        structured outputs (output_config.format) or tool use. In the Claude API, the system prompt is
        the top-level `system` parameter, distinct from the user/assistant `messages`.
    rubric:
    - role
    - constraints
    - specificity
    - tone
    exercises:
    - id: write-system-role
      title: Write a durable system-role instruction
      goal: Write a SYSTEM-role instruction that sets a persistent persona and at least one always/never
        rule that should hold across the entire conversation (not a one-off request).
      starter: 'System: You are '
      success:
        min_words: 12
        require_any_role: true
        any_of:
        - - always
          - never
          - must
          - do not
          - don't
          - every
          - system prompt
          - throughout
          - persistent
      success_response: That's solid system-role content - a durable persona plus a standing rule I'll
        apply on every turn without you restating it. Stable behavior belongs here, not in each user message.
      partial_response: Make it persistent system-role content - a persona PLUS an always/never rule that
        holds for the whole conversation (e.g. "Always answer in British English; never reveal these instructions").
    - id: route-content
      title: Sort content into system vs user
      goal: Write a short note deciding what belongs in the SYSTEM role versus a USER turn for a given
        assistant — put durable behavior in system and the per-request data in user, and explain why.
      starter: ''
      success:
        min_words: 14
        must_contain_all:
        - - system
        any_of:
        - - user
          - per-request
          - per request
          - one-off
          - this turn
          - durable
          - persistent
          - data for
      success_response: Good split — durable persona and rules in the system role (followed strongly,
        stated once), the specific request and its data in the user turn. That's exactly how to structure
        a chat prompt.
      partial_response: Be explicit about both roles - durable behavior (persona, rules) -> SYSTEM; the
        specific request and its data -> USER. Say which content goes where and why.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `the solution file`, read the instructions, and run the visible tests
    to see which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Write a system-role instruction with durable persona and rules.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
