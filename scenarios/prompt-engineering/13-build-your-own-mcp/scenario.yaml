initial_state: The guided console opens with two complete minimal MCP servers (Python and TypeScript)
  and a practice exercise to register one in Claude Code. Rule-based and free.
solution_explanation: A minimal MCP server is - (1) a server object, (2) one or more tools (a named function
  with a description and typed inputs), and (3) a transport to run on (stdio for local). In Python, the
  `mcp` package's FastMCP makes a tool a decorated function whose docstring becomes the description. In
  TypeScript, the `@modelcontextprotocol/sdk` exposes `registerTool` with a Zod input schema, run over
  `StdioServerTransport`. Register a local stdio server in Claude Code with `claude mcp add <name> --
  <command to run it>`.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A hands-on guide to building Model Context Protocol servers.
    lesson:
    - heading: The three parts
      body: Every MCP server has - (1) a SERVER object that holds your tools; (2) one or more TOOLS -
        each a named function with a clear description and a typed input schema (the description is what
        Claude uses to decide when to call it); and (3) a TRANSPORT to run on. For a local server you
        run on stdio so Claude Code can launch it as a subprocess. Start with one tool; add more once
        it works.
    - heading: Minimal Python server (FastMCP)
      body: "Install the SDK with: pip install \"mcp[cli]\"   (or: uv add \"mcp[cli]\")\n\nserver.py:\n\
        \n    from mcp.server.fastmcp import FastMCP\n\n    mcp = FastMCP(\"weather\")  # the server name\n\
        \n    @mcp.tool()\n    def get_forecast(city: str) -> str:\n        \\\"\\\"\\\"Get a short weather\
        \ forecast for a city.\n\n        Args:\n            city: The city name, e.g. \"Austin\".\n \
        \       \\\"\\\"\\\"\n        # In a real server you'd call an API here.\n        return f\"{city}:\
        \ sunny, 24C, light breeze.\"\n\n    if __name__ == \"__main__\":\n        mcp.run()  # defaults\
        \ to the stdio transport\n\nThe docstring becomes the tool description; the type hints become\
        \ the\ninput schema. That's a complete, working MCP server.\n"
    - heading: Minimal TypeScript server
      body: "Install: npm install @modelcontextprotocol/sdk zod\n\nserver.ts:\n\n    import { McpServer\
        \ } from \"@modelcontextprotocol/sdk/server/mcp.js\";\n    import { StdioServerTransport } from\
        \ \"@modelcontextprotocol/sdk/server/stdio.js\";\n    import { z } from \"zod\";\n\n    const\
        \ server = new McpServer({ name: \"weather\", version: \"1.0.0\" });\n\n    server.registerTool(\n\
        \      \"get_forecast\",\n      {\n        description: \"Get a short weather forecast for a city.\"\
        ,\n        inputSchema: { city: z.string().describe(\"City name\") },\n      },\n      async ({\
        \ city }) => ({\n        content: [{ type: \"text\", text: `${city}: sunny, 24C, light breeze.`\
        \ }],\n      }),\n    );\n\n    await server.connect(new StdioServerTransport());\n\nSame three\
        \ parts - a server, one registered tool with a Zod input schema,\nconnected over stdio.\n"
    - heading: Run it in Claude Code
      body: "Register your local (stdio) server so Claude Code launches it - everything\nafter `--` is\
        \ the command:\n\n    # Python\n    claude mcp add weather -- python /abs/path/to/server.py\n\
        \    # TypeScript (compiled)\n    claude mcp add weather -- node /abs/path/to/server.js\n\nThen\
        \ `claude mcp list` to confirm it connected and `/mcp` inside Claude\nCode to inspect its tools.\
        \ Ask Claude \"what's the forecast for Austin?\"\nand it will call your get_forecast tool. Tip\
        \ - test the server first with\nthe MCP Inspector (npx @modelcontextprotocol/inspector) before\
        \ wiring it\nin. Write tool descriptions carefully; they are the #1 driver of whether\nClaude\
        \ calls the tool correctly.\n"
    rubric:
    - task
    - specificity
    - format
    exercises:
    - id: register-local-server
      title: Register your local MCP server
      goal: Write the `claude mcp add` command that registers a LOCAL stdio MCP server you wrote — remember
        everything after `--` is the command Claude Code runs to launch it (e.g. python or node plus the
        file path).
      starter: 'claude mcp add weather -- '
      success:
        min_words: 4
        must_contain_all:
        - - claude mcp add
          - --
        any_of:
        - - python
          - node
          - uv
          - deno
          - ./
          - /
      success_response: That registers your server as a local stdio server. Run `claude mcp list` to confirm
        it connected, then ask Claude something that should trigger your tool. If it doesn't fire, sharpen
        the tool's description — that's almost always the fix.
      partial_response: Put the launch command AFTER `--` (Claude Code runs everything past it), e.g.
        `claude mcp add weather -- python /abs/path/server.py`. Use an absolute path so it works from
        any directory.
    - id: name-a-tool
      title: Describe a tool for your server
      goal: Write a one-line tool DESCRIPTION for a tool you'd add to your MCP server. Make it prescriptive
        about WHEN Claude should call it, since the description is what drives correct tool use.
      starter: ''
      success:
        min_words: 8
        any_of:
        - - when
          - use this
          - call this
          - returns
          - fetch
          - create
          - look up
          - search
          - get
      success_response: Strong description — stating WHEN to call the tool (not just what it does) is
        exactly what makes Claude invoke it at the right time. Vague descriptions are the top cause of
        a tool never firing.
      partial_response: Make it prescriptive about WHEN to use it, e.g. "Call this when the user asks
        for the current weather in a city." The trigger condition matters more than a generic "gets weather."
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `the solution file`, read the instructions, and run the visible tests
    to see which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Write the `claude mcp add` command that registers your local server.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
