title: Build Your Own MCP Server
slug: build-your-own-mcp
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Build Your Own MCP Server`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided console opens with two complete minimal MCP servers (Python and
  TypeScript) and a practice exercise to register one in Claude Code. Rule-based and free. Once you understand
  MCP, building your own server is surprisingly small. Walk through a minimal, working MCP server in both
  Python (FastMCP) and TypeScript (the official SDK) that exposes a single tool, then wire it into Claude
  Code with one command. Accurate, copy-pasteable starter code.


  OBJECTIVE: Describe the parts of a minimal MCP server (server object, a tool, a transport); Read and
  understand a minimal Python and TypeScript MCP server; Write the `claude mcp add` command that registers
  your local server. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
