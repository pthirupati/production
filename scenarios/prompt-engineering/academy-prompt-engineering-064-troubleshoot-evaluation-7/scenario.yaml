description: 'CONTEXT: A team operating prompt engineering has raised a ticket for `Prompt Evaluation
  — Troubleshoot Lab`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace. The architecture is a single
  lab-primary node exposing prompt templates, eval sets, and tool configs; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A guided AI practice console opens in your browser. It is a rule-based simulator
  (no real model, no API cost) that scores your prompt live. The LLM practice workspace is degraded. Prompt
  changes regress quietly. Recent changes may exist around prompt evaluation, but do not restart blindly
  — gather evidence first. Production alert: prompt changes regress quietly. You are on call for prompt-engineering
  and must troubleshoot prompt evaluation methodically — triage symptoms, isolate root cause, apply the
  smallest safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: prompt changes regress quietly; Root cause is isolated with
  evidence, not guesswork; Service behavior returns to normal after the fix. Acceptance criteria: the
  change is minimal and reversible, and success means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant prompt templates, eval sets, and tool configs), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: prompt changes regress quietly'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: A guided AI practice console opens in your browser. It is a rule-based
  simulator (no real model, no API cost) that scores your prompt live.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: prompt changes regress quietly. This lab is
    about prompt evaluation — eval sets and regression checks. Read the objectives and the current state,
    and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For prompt evaluation problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of prompt evaluation is at fault.

    2. Re-run the most relevant of the eval harness and scores focused on just that part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''prompt changes
    regress quietly'' toward ''evals catch regressions before release''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
