title: 'Practice: Write a Safety System Prompt'
slug: safety-system-prompt-practice
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Practice: Write a Safety
  System Prompt` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens with two graded safety exercises. Write
  a safety-minded system prompt, then a rule that resists override/injection attempts. Rule-based and
  free — a strong, specific prompt passes; a vague one fails. A hands-on, graded lab. Write a SYSTEM prompt
  that gives an assistant a clear safety posture: stay in scope, refuse disallowed requests, and resist
  attempts to make it ignore its own rules. This combines guardrails, refusal style, and injection resistance
  into one practical, gradeable exercise.


  OBJECTIVE: Write a system prompt that sets a role, a scope, and a clear refusal rule; Add a rule that
  resists override attempts ("ignore your instructions") and protects the system prompt; Pass both graded
  exercises (the simulator re-checks your prompt server-side). Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
