solution_explanation: 'Length control needs an explicit, checkable cap: "in no more than 20 words", "in
  exactly 3 bullet points", "in one sentence." Vague words like "short" or "briefly" leave the model guessing.
  Pair the cap with the task and, ideally, a focus ("summarize the decision, not the discussion"). For
  production, you can also enforce length in code (truncate, or reject and re-ask) since models occasionally
  drift a word or two over — but a firm cap in the prompt does most of the work. The checker here rewards
  a concrete limit plus a format.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A summarization assistant that respects explicit length and format limits.
    lesson:
    - heading: Make the limit checkable
      body: '"Summarize this briefly" is unmeasurable — brief to whom? Give a number and a unit: "in no
        more than 25 words", "in exactly 3 bullets", "in one sentence under 15 words." A checkable cap
        is one you (or a script) could verify, which is also what makes it enforceable.'
    - heading: Limit + task + focus
      body: 'The strongest summarization prompts combine three things: the TASK (summarize / TL;DR / headline),
        the LIMIT (the cap), and a FOCUS (what matters — "the decision and owner, not the back-and-forth").
        Focus keeps a tight summary from wasting its few words on filler.'
    - heading: Enforce in code for guarantees
      body: 'Models occasionally run a word or two over a hard cap. If you need a true guarantee (a fixed-width
        UI slot, an SMS), enforce it on your side: count words and either truncate or send it back with
        "that was 27 words, redo it in 20 or fewer." The prompt does 90% of the work; code closes the
        gap.'
    rubric:
    - task
    - constraints
    - format
    - specificity
    exercises:
    - id: summarize-hard-cap
      title: 'Graded: summarize under a hard cap'
      goal: Write a prompt that asks the model to summarize a given paragraph under a STRICT, checkable
        length limit — a specific number of words, a fixed number of bullets, or a single sentence.
      starter: Summarize this paragraph.
      success:
        min_words: 10
        mentions_limit: true
        any_of:
        - - summarize
          - summary
          - tl;dr
          - tldr
          - headline
          - recap
          - condense
          - boil down
      success_response: New pricing launches Monday; the team agreed to grandfather existing customers
        for 90 days.
      partial_response: You asked for a summary — now add a checkable cap. "In no more than 20 words",
        "in 3 bullets", or "in one sentence" all work. Without a number, the model decides the length
        for you.
    - id: tight-prompt-tight-output
      title: 'Graded: a tight prompt for a tight output'
      goal: Write a concise prompt (keep it short yourself) that still names the task, states an explicit
        length cap, and asks for a specific format (bullets, one sentence, a word count, etc.).
      starter: ''
      success:
        min_words: 6
        max_words: 40
        mentions_limit: true
        require:
        - - summarize
          - summary
          - tl;dr
          - tldr
          - recap
          - condense
          - headline
          - boil down
          - distill
        any_of:
        - - bullet
          - bullets
          - sentence
          - sentences
          - tl;dr
          - tldr
          - one line
          - headline
          - list
          - word
      success_response: '- Pricing changes Monday

        - Existing customers grandfathered 90 days

        - No action needed from current users

        '
      partial_response: Tighten it and add the cap. A strong short prompt is something like "TL;DR in
        3 bullets, max 8 words each." Name the format and the limit without padding your own prompt.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: practice is not behaving as the scenario objectives
    require. This lab is about practice — how practice behaves in a prompt engineering environment. Read
    the objectives and the current state, and note precisely what looks wrong versus healthy before you
    form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For practice problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of practice is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''practice is not
    behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.

    WHY: coding labs grade against hidden test cases, not marker files.'
