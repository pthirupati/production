coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A helpful AI assistant for learning prompt engineering.
    lesson:
    - heading: About Examples
      body: This lab teaches examples — one of the core skills for reliable LLM workflows. Use the practice
        console to draft and score your prompt against the rubric.
    - heading: What good looks like
      body: Strong prompts assign a role, state the task clearly, set constraints (length, tone, format),
        and specify the output shape. Vague prompts score low; specific prompts score 80+.
    rubric:
    - role
    - context
    - task
    - constraints
    - format
    - specificity
    exercises:
    - id: few-shot
      title: Use examples
      goal: Write a few-shot prompt with at least one input→output example.
      success:
        min_example_pairs: 1
        min_words: 25
      starter: Write your prompt here…
  instructions: Complete the Few-Shot Examples — Operate Lab exercise in the Prompt Playground. Score
