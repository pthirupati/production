title: Designing Multi-Turn Conversations
slug: multi-turn-conversation-design
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Designing Multi-Turn
  Conversations` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens with two graded exercises on multi-turn
  design. Decide what goes in the system prompt vs each user turn, then plan how to keep a long chat bounded.
  Rule-based and free — strong answers pass, vague ones fail. Real assistants hold conversations, and
  the API is stateless — you resend the history every turn. Learn how multi-turn prompting actually works:
  durable rules belong in the system prompt, per-turn detail goes in user messages, and long chats need
  a strategy (summarize or prune) before they blow the context window.


  OBJECTIVE: Split durable behavior (system prompt) from per-turn input (user messages); Plan how to keep
  a long conversation within the context window via summarizing or pruning; Pass both graded exercises
  (the simulator re-checks your prompt server-side). Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
