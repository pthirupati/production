title: "Designing Multi-Turn Conversations"
slug: multi-turn-conversation-design
category: Prompt Engineering
description: >-
  Real assistants hold conversations, and the API is stateless — you resend the
  history every turn. Learn how multi-turn prompting actually works: durable
  rules belong in the system prompt, per-turn detail goes in user messages, and
  long chats need a strategy (summarize or prune) before they blow the context
  window.
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
  - Split durable behavior (system prompt) from per-turn input (user messages)
  - Plan how to keep a long conversation within the context window via summarizing or pruning
  - Pass both graded exercises (the simulator re-checks your prompt server-side)
initial_state: >-
  The guided AI practice console opens with two graded exercises on multi-turn
  design. Decide what goes in the system prompt vs each user turn, then plan how
  to keep a long chat bounded. Rule-based and free — strong answers pass, vague
  ones fail.
solution_explanation: >-
  The Messages API is STATELESS — the model has no memory between calls, so you
  resend the full conversation (system + alternating user/assistant turns) every
  request. Design follows from that. DURABLE behavior — persona, rules, output
  format, tone — goes once in the SYSTEM prompt so it holds across every turn.
  PER-TURN content — the user's current question, the data for this request —
  goes in USER messages. As the history grows it eventually approaches the
  context-window limit; the standard strategies are to SUMMARIZE older turns into
  a running recap (and drop the raw turns) or to PRUNE content that's no longer
  relevant, keeping only what bears on the current task. Operator instructions
  that arrive mid-conversation are best delivered as a system-role message rather
  than rebuilt into the top system prompt (which would also break caching).
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A conversational assistant whose history is resent on every stateless turn.
    lesson:
      - heading: The API is stateless
        body: >-
          The model doesn't remember the last turn — your code resends the whole
          transcript each request: the system prompt, then alternating user and
          assistant messages. "It forgot what I told it" almost always means a
          turn was dropped from the resent history, not that the model lost
          memory. Design with that mental model.
      - heading: System for durable, user for per-turn
        body: >-
          Put behavior that should hold for the WHOLE conversation in the system
          prompt — who the assistant is, the rules, the output format, the tone.
          Put the specifics of THIS turn — the question, the document to act on —
          in the user message. Mixing them (e.g. re-stating the persona every
          user turn) wastes tokens and invites drift.
      - heading: Keep long chats bounded
        body: >-
          A growing transcript eventually nears the context limit. Two strategies:
          SUMMARIZE — replace older turns with a running recap that preserves key
          decisions and facts, then drop the raw turns; or PRUNE — discard
          messages no longer relevant to the current task. Mid-conversation
          operator instructions are best sent as a system-role message, which
          preserves the cached prefix instead of rebuilding the top prompt.
    rubric: [role, context, task, specificity]
    exercises:
      - id: route-system-vs-user
        title: "Graded: route content to system vs user"
        goal: >-
          Explain (or write instructions showing) what belongs in the SYSTEM
          prompt for a multi-turn assistant versus what belongs in each USER
          message — at minimum mention the system prompt and the user/per-turn
          split.
        starter: ""
        success:
          min_words: 14
          must_contain_all:
            - ["system"]
          any_of:
            - ["user", "per-turn", "per turn", "each turn", "this turn", "durable", "persistent", "every turn", "throughout", "per-request", "per request"]
        success_response: >-
          System prompt: the persona, rules, tone, and output format — they hold
          for every turn. User messages: this turn's question and any data for it.
        partial_response: >-
          Name both sides. Durable behavior (persona, rules, format) goes in the
          system prompt so it persists; the per-turn question and data go in the
          user message. Don't restate the persona every turn.
      - id: bound-long-chat
        title: "Graded: keep a long conversation in budget"
        goal: >-
          Describe how you'd keep a long multi-turn conversation within the
          context window — e.g. summarizing older turns into a running recap, or
          pruning messages that are no longer relevant.
        starter: ""
        success:
          min_words: 14
          any_of:
            - ["summarize", "summary", "running summary", "recap", "condense", "compress", "prune", "drop", "discard", "remove", "trim", "older turns", "stale", "irrelevant", "key decisions"]
        success_response: >-
          Roll older turns into a running summary that keeps the key decisions and
          facts, then drop the raw messages; prune anything no longer relevant.
        partial_response: >-
          Pick a strategy. Either summarize older turns into a running recap (and
          drop the raw turns) or prune messages that no longer bear on the current
          task. Both keep the transcript under the context limit.
hints:
  - content: The API is stateless — you resend the whole transcript each turn. "It forgot" usually means a turn was dropped from the resent history.
    cost: 10
    order: 1
  - content: Durable behavior (persona, rules, format, tone) goes once in the system prompt; the per-turn question and data go in the user message.
    cost: 15
    order: 2
  - content: For long chats, summarize older turns into a running recap (then drop them) or prune irrelevant messages. Deliver mid-conversation operator rules as a system-role message to preserve caching.
    cost: 20
    order: 3
