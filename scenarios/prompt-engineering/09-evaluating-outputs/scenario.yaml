title: Evaluating AI Outputs
slug: evaluating-outputs
category: Build
description: 'CONTEXT: A team operating prompt engineering has raised a ticket for `Evaluating AI Outputs`.
  A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve it.
  Business impact: reduced service reliability and blocked users until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace. The architecture is a single
  lab-primary node exposing prompt templates, eval sets, and tool configs; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: The guided AI practice console opens. Practice writing crisp success criteria
  and a tiny eval so you can tell a good answer from a lucky one. Rule-based and free.

  OBJECTIVE: Define measurable success criteria for a prompt before running it; Choose an appropriate
  scoring method (exact match, rubric, or LLM-as-judge); Pass the exercise that writes a clear, checkable
  acceptance criterion. Acceptance criteria: the change is minimal and reversible, and success means all
  hidden tests pass.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant prompt templates, eval sets, and tool configs), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.

  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Define measurable success criteria for a prompt before running it
- Choose an appropriate scoring method (exact match, rubric, or LLM-as-judge)
- Pass the exercise that writes a clear, checkable acceptance criterion
initial_state: The guided AI practice console opens. Practice writing crisp success criteria and a tiny
  eval so you can tell a good answer from a lucky one. Rule-based and free.
solution_explanation: You can't improve what you don't measure. Lightweight eval - (1) write success criteria
  BEFORE you look at outputs (what makes an answer correct?); (2) collect a small test set of representative
  inputs with expected results; (3) pick a scoring method - exact/substring match for deterministic tasks,
  a rubric for open-ended quality, or LLM-as-judge (a second model scoring against your rubric) for scale;
  (4) re-run the eval whenever you change the prompt or model to catch regressions. Even 10 examples beat
  vibes.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant that helps you define and apply evaluation criteria.
    lesson:
    - heading: Criteria first
      body: Decide what "correct" means before you read any output, or you'll rationalize whatever the
        model produced. Good criteria are concrete and checkable - "returns valid JSON with keys X, Y,
        Z", "answer is under 50 words", "cites the source line", "classification matches the gold label."
    - heading: Build a tiny test set
      body: Gather 10-30 representative inputs with expected outputs, including the tricky cases. This
        is your regression suite. When you tweak a prompt or swap models, re-run it - a change that fixes
        one case often breaks another, and only a test set will tell you.
    - heading: Pick a scoring method
      body: EXACT/SUBSTRING MATCH - for deterministic tasks (a label, a number, valid JSON). RUBRIC -
        score open-ended answers 1-5 on dimensions like accuracy and completeness. LLM-AS-JUDGE - have
        a second model grade outputs against your rubric so you can scale beyond manual review; spot check
        it against human labels so the judge itself is trustworthy.
    rubric:
    - task
    - constraints
    - format
    - specificity
    exercises:
    - id: write-criterion
      title: Write a checkable success criterion
      goal: For a task that extracts a user's email from text, write a CLEAR, MEASURABLE success criterion
        the output must meet (something a script could check automatically), not a vague "the answer is
        good."
      starter: 'The output is correct if '
      success:
        min_words: 10
        any_of:
        - - exactly
          - matches
          - equals
          - valid
          - format
          - regex
          - contains
          - only
          - json
          - field
          - no other text
          - one
      success_response: Clear criterion. A script can check it deterministically - e.g. the output must
        be exactly the email string with nothing else, matching a standard email pattern. That's a real
        test, not a vibe.
      partial_response: Make it machine-checkable. Instead of "good," specify something a script could
        verify - e.g. "output equals the email exactly, with no other text" or "matches an email regex."
        Concrete criteria enable real evals.
    - id: choose-method
      title: Choose a scoring method and justify it
      goal: Write a short note that picks a scoring method (exact match, rubric, or LLM-as-judge) for
        evaluating a SUMMARIZATION prompt and briefly says why that method fits an open-ended task.
      starter: ''
      success:
        min_words: 12
        any_of:
        - - rubric
          - llm-as-judge
          - llm as judge
          - judge
          - human
          - score 1
          - 1-5
          - 1 to 5
          - dimensions
      success_response: Sensible choice. Summaries are open-ended, so exact match won't work - a rubric
        (or an LLM-as-judge scoring accuracy and completeness) fits because there are many valid summaries,
        not one gold string.
      partial_response: Summarization is open-ended, so exact match is the wrong tool. Pick a rubric or
        LLM-as-judge and say why (many valid answers, so you score quality dimensions rather than string
        equality).
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: evaluating AI outputs is not behaving as the
    scenario objectives require. This lab is about evaluating AI outputs — how evaluating AI outputs behaves
    in a prompt engineering environment. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For evaluating AI outputs problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of evaluating AI outputs is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''evaluating AI
    outputs is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.

    WHY: coding labs grade against hidden test cases, not marker files.'
