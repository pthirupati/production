initial_state: The guided AI practice console opens. Practice prompts that ground the model in sources
  and let it abstain instead of inventing answers. Rule-based and free.
solution_explanation: Hallucination is the model filling a gap with a plausible-sounding guess. Prompt
  techniques that cut it down - (1) GROUND - provide the source text and require "answer only from this";
  (2) PERMIT ABSTENTION - explicitly allow "I don't know / not stated," which removes the pressure to
  fabricate; (3) CITE/QUOTE - require the model to quote the supporting span or cite a source for each
  claim, making answers checkable; (4) SEPARATE KNOWN FROM INFERRED - ask it to mark what's directly supported
  versus an inference; (5) for facts it can't verify, ask for confidence or a caveat. Combine with retrieval
  (RAG) and, for the strongest guarantees, a verification step. No prompt eliminates hallucination entirely
  - design so wrong answers are caught.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A careful assistant that grounds claims and admits uncertainty.
    lesson:
    - heading: Ground in sources
      body: The biggest lever is grounding. If the answer should come from a document, PUT the document
        in the prompt and say "answer using only this text." With nothing to anchor to, the model leans
        on fuzzy parametric memory and is far more likely to invent specifics like dates, numbers, and
        names.
    - heading: Permit "I don't know"
      body: Models often fabricate because the prompt implies an answer must exist. Explicitly grant permission
        to abstain - "If the answer isn't in the provided text (or you're not sure), say 'I don't know'
        rather than guessing." Removing the pressure to always answer is one of the simplest, most effective
        anti-hallucination moves.
    - heading: Cite, quote, and separate inference
      body: 'Make claims checkable. Require the model to QUOTE the supporting sentence or CITE a source
        for each fact. Ask it to SEPARATE what''s directly supported from what it''s inferring ("Supported:
        ... / Inferred: ..."). For unverifiable facts, ask for a confidence level or a caveat. Pair these
        with retrieval (RAG) and, where it matters, a second verification pass. No prompt is a guarantee
        - build so mistakes get caught downstream.'
    rubric:
    - context
    - constraints
    - specificity
    - format
    exercises:
    - id: ground-and-abstain
      title: Ground the answer and allow "I don't know"
      goal: Write a prompt that instructs the model to answer ONLY from a provided source AND to say "I
        don't know" (or "not stated") when the answer isn't there, instead of guessing.
      starter: ''
      success:
        min_words: 14
        any_of:
        - - only from
          - based only
          - using only
          - from the text
          - from the source
          - from the passage
          - according to
        require:
        - - don't know
          - do not know
          - not stated
          - not sure
          - if not
          - if absent
          - not in the
          - isn't there
          - uncertain
          - say so
      success_response: That's well grounded - answering only from the source and allowing an honest "I
        don't know" removes the pressure to fabricate. Abstention beats a confident wrong answer.
      partial_response: Combine TWO instructions - answer only from the provided source AND explicitly
        permit "I don't know / not stated" when it's absent. The permission to abstain is what stops the
        model filling the gap.
    - id: require-quotes
      title: Require quotes or citations
      goal: Write a prompt that requires the model to support each claim with a direct QUOTE from the
        source or a CITATION, so every statement can be checked back against the text.
      starter: ''
      success:
        min_words: 12
        any_of:
        - - quote
          - cite
          - citation
          - reference
          - exact words
          - verbatim
          - point to
          - which sentence
          - supporting
          - source for
      success_response: Requiring a quote or citation per claim makes the answer auditable — anyone can
        trace each statement back to the text, and the model is far less likely to assert something the
        source doesn't contain.
      partial_response: Ask the model to back each claim with a direct QUOTE or a CITATION to the source.
        Requiring evidence per claim is what makes the output checkable and discourages invented facts.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: reducing hallucination is not behaving as the
    scenario objectives require. This lab is about reducing hallucination — how reducing hallucination
    behaves in a prompt engineering environment. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For reducing hallucination problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of reducing hallucination is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''reducing hallucination
    is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
