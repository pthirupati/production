title: 'Practice: Reliably Extract JSON'
slug: extract-json-practice
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Practice: Reliably Extract
  JSON` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens with two graded JSON-extraction exercises.
  Write prompts that make the rule-based simulator emit clean JSON and nothing else. No API key, no cost
  — a strong prompt passes, a vague one fails. A hands-on, graded lab. You are given a messy line of text
  and must write a prompt that makes the simulator return clean, parseable JSON every time — the exact
  keys, the right types, and NO surrounding prose or markdown fences. This is the skill that lets an AI
  safely feed another program.


  OBJECTIVE: Write a prompt that returns ONLY valid JSON for a given record — no prose, no fences; Pin
  the exact field names AND their types so the output is predictable; Pass both graded exercises (the
  simulator re-checks your prompt server-side). Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
