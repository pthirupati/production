initial_state: The guided AI practice console opens. Practice rewriting a padded, rambling prompt into
  a tight one that keeps every requirement. Rule-based and free.
solution_explanation: Concise prompts win three ways - lower cost (you pay for input tokens), lower latency,
  and clearer instructions (the real ask isn't buried under "please and thank you"). To tighten - cut
  politeness padding and meta-talk ("I was hoping you could maybe..."), remove restatements of the same
  instruction, drop irrelevant background, and prefer direct imperatives ("Summarize X in 2 sentences"
  over a paragraph of preamble). But concise isn't cryptic - KEEP the load-bearing parts - the role (if
  needed), the exact task, the constraints (length/tone), and the output format. The goal is maximum signal
  per token, not the shortest possible string.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A no-nonsense assistant that rewards tight, high-signal prompts.
    lesson:
    - heading: Why brevity matters
      body: You pay for input tokens, and longer prompts are slower. Worse, padding dilutes the instruction
        - a model wading through three sentences of pleasantries may weight them against your actual request.
        Tight prompts are cheaper, faster, and more reliably followed.
    - heading: What to cut
      body: Strip the things that carry no instruction - politeness padding ("if it's not too much trouble"),
        meta-commentary about what you're about to ask, repeated restatements of the same rule, and background
        the model doesn't need for THIS task. Replace hedged requests with direct imperatives - "Summarize
        this in 2 sentences" beats a paragraph leading up to it.
    - heading: What to keep
      body: Concise is not cryptic. Keep the load-bearing ingredients - ROLE when it changes behavior,
        the exact TASK, the CONSTRAINTS (length, tone, what to avoid), and the output FORMAT. Cutting
        one of those to save a few tokens usually costs you a re-prompt. Aim for the highest signal per
        token, not the fewest characters.
    rubric:
    - task
    - constraints
    - format
    - specificity
    exercises:
    - id: tighten-bloated
      title: Rewrite a bloated prompt tightly
      goal: Take the long, padded request in the starter and rewrite it concisely — cut the filler but
        KEEP a clear task, a length constraint, and an output format. Aim for a short prompt that still
        asks for a capped, formatted answer.
      starter: Hi there! I was just wondering, if it's really not too much trouble for you, whether you
        might possibly be able to help me out by writing up something, anything really, that explains
        how DNS works, that would be so amazing, thank you so so much!!
      success:
        max_words: 40
        mentions_limit: true
        any_of:
        - - sentence
          - sentences
          - bullet
          - words
          - concise
          - brief
          - json
          - table
          - steps
          - list
      success_response: DNS maps human-readable domain names to IP addresses so clients can reach servers.
        (Concise, capped, and on-format — exactly the tight ask you wrote.)
      partial_response: Cut the pleasantries and rambling, then keep the essentials - the TASK plus a
        length cap and a FORMAT (e.g. "Explain how DNS works in 2 sentences"). Shorter input, clearer
        ask, lower cost.
    - id: direct-imperative
      title: Turn a hedged request into an imperative
      goal: Write a single, direct imperative prompt for a task (no hedging, no preamble) that still names
        a constraint and a format — demonstrate "maximum signal per token."
      starter: ''
      success:
        min_words: 6
        max_words: 30
        mentions_limit: true
        any_of:
        - - bullet
          - list
          - sentence
          - words
          - json
          - table
          - one word
          - steps
          - format
      success_response: Tight and direct — a clear imperative with a constraint and a format and no wasted
        words. That's the concise ideal - every token earns its place.
      partial_response: Make it a direct imperative (start with the verb, drop the preamble) but still
        include a CONSTRAINT and a FORMAT, and keep it short. Signal per token is the target.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: writing concise prompts is not behaving as the
    scenario objectives require. This lab is about writing concise prompts — how writing concise prompts
    behaves in a prompt engineering environment. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For writing concise prompts problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one component that owns
    the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small, reversible
    steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of writing concise prompts is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''writing concise
    prompts is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
