description: 'CONTEXT: A team operating prompt engineering needs you to resolve `prompt-engineering:
  Context Management — Build From Scratch` during a realistic incident. The business
  impact is reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with
  prompt templates, eval sets, and tool configs. All tools run locally; no paid APIs
  or external cloud calls are required.


  SYMPTOM / STARTING STATE: The LLM practice workspace is ready but context management
  is not configured yet. Required tools may already be installed; your job is to create
  the configuration and bring the capability online. Build context management from
  scratch in this prompt-engineering lab. You start from a minimal environment and
  must produce a working configuration that demonstrates context windows and retrieval.
  Plan, implement, then prove it works.


  OBJECTIVE: A working context management setup must exist by the end of this lab;
  Configuration should follow team conventions and be easy to audit; The result should
  pass validation without manual cleanup. Success means all prompt exercises pass
  the rubric.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- A working context management setup must exist by the end of this lab
