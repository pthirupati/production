coding_mode: true
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A helpful AI assistant for learning prompt engineering.
    lesson:
    - heading: About Context
      body: This lab teaches context — one of the core skills for reliable LLM workflows.
        Use the practice console to draft and score your prompt against the rubric.
    - heading: What good looks like
      body: Strong prompts assign a role, state the task clearly, set constraints
        (length, tone, format), and specify the output shape. Vague prompts score
        low; specific prompts score 80+.
    rubric:
    - role
    - context
    - task
    - constraints
    - format
    - specificity
    exercises:
    - id: add-context
      title: Add context
      goal: Write a prompt that includes background context and a specific task.
      success:
        require_any_role: true
        min_words: 20
        has_delimiter: true
      starter: Write your prompt here…
  instructions: Complete the Context Management exercise in the Prompt Playground.
    Score 80+ on the rubric, then submit.
