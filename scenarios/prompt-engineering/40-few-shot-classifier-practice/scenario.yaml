solution_explanation: 'A reliable classifier prompt does three things: (1) states the TASK and the exact
  allowed labels ("Classify as one of: positive, negative, neutral"); (2) shows two or three worked examples
  in the exact Input -> Output shape; (3) forbids extra text ("Reply with only the label"). Few-shot examples
  pin both the decision boundary and the output format far better than instructions alone. Keep the examples
  diverse (cover each label) and consistent in format. For high-stakes labeling you can pair this with
  structured output or an enum tool, but the free, portable version is a tight few-shot prompt.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A classification assistant that returns one label from a fixed set.
    lesson:
    - heading: Fix the label set
      body: 'Never let the model invent its own categories. Enumerate them: "Classify the message as exactly
        one of: bug, feature_request, question, praise." A closed label set is what makes the output usable
        downstream — an open-ended "categorize this" gives you a different vocabulary every run.'
    - heading: Teach the format by example
      body: 'Two or three worked examples are worth a paragraph of instructions. Show the exact shape
        - "Input: ''love it'' -> Output: praise" / "Input: ''it crashes on save'' -> Output: bug". The
        model copies the pattern: same labels, same one-token output, no commentary. Cover each label
        at least once so the boundary is clear.'
    - heading: One label, nothing else
      body: 'End with a hard rule: "Reply with only the label — no explanation, no punctuation." Stray
        reasoning breaks parsers. If you later need probabilities or a structured object, switch to tool
        use / structured outputs in the Claude API; for a plain label, the few-shot prompt is enough.'
    rubric:
    - task
    - examples
    - constraints
    - format
    - specificity
    exercises:
    - id: few-shot-labels
      title: 'Graded: classify with worked examples'
      goal: Write a prompt that classifies a support message as exactly one of a fixed set of labels (e.g.
        bug, feature_request, question, praise) and includes at least two Input -> Output worked examples.
      starter: 'Classify this message: ''The export button does nothing.'''
      success:
        min_words: 16
        min_example_pairs: 2
        any_of:
        - - classify
          - label
          - category
          - categorize
          - tag
          - one of
          - exactly one
      success_response: 'bug

        '
      partial_response: 'Good — you''re classifying. Now add at least two worked examples in the form
        "Input: ... -> Output: <label>" and name the allowed labels. The examples teach the format better
        than instructions can.'
    - id: enforce-label-only
      title: 'Graded: force a single clean label'
      goal: Write a prompt that lists the allowed labels and forces the model to reply with ONLY one of
        them — no explanation, no extra text.
      starter: ''
      success:
        min_words: 12
        require:
        - - one of
          - exactly one
          - only
          - single label
          - just the label
          - no explanation
          - no other text
          - label only
        any_of:
        - - positive
          - negative
          - neutral
          - bug
          - spam
          - intent
          - priority
          - label
          - category
          - class
      success_response: 'neutral

        '
      partial_response: List the allowed labels explicitly and add "Reply with only the label, no explanation."
        Without that, the model may add a sentence of reasoning that breaks your parser.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: practice is not behaving as the scenario objectives
    require. This lab is about practice — how practice behaves in a prompt engineering environment. Read
    the objectives and the current state, and note precisely what looks wrong versus healthy before you
    form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For practice problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of practice is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''practice is not
    behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
