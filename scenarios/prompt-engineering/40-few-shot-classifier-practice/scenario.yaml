title: 'Practice: A Few-Shot Classification Prompt'
slug: few-shot-classifier-practice
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Practice: A Few-Shot
  Classification Prompt` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens with two graded classification exercises.
  Write prompts that force a single label from a fixed set and show the model the format by example. Rule-based
  and free — strong prompts pass, vague ones fail. A hands-on, graded lab. Build a classification prompt
  that pins the allowed labels and teaches the format with worked examples. Few-shot examples are the
  most reliable way to get consistent, parseable labels out of a model — sentiment, intent, priority,
  spam, you name it.


  OBJECTIVE: Write a classifier prompt that lists the exact allowed labels and demands one of them; Teach
  the output format with at least two worked Input -> Output examples; Pass both graded exercises (the
  simulator re-checks your prompt server-side). Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
