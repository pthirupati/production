  - role: primary
    os: FixitLab LLM practice workspace
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - bash
  - coreutils
  - journalctl
  - prompt engineering
  - systemctl
  credentials:
  - user: root
