title: Structured Output — Security Lab
slug: academy-prompt-engineering-036-security-structured-output-4
technology: prompt-engineering
category: Harden
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
jira_priority: Medium
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `prompt-engineering:
  Structured Output — Security Practice` during a realistic incident. The business
  impact is reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with
  prompt templates, eval sets, and tool configs. All tools run locally; no paid APIs
  or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around
  structured output. Assume an auditor or pen test is next week — tighten controls
  with evidence. Security review: harden structured output on this prompt-engineering
  system. Close unsafe defaults, enforce least privilege, and ensure JSON schemas
  and validation cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to structured output are removed or constrained;
  Access follows least privilege and is auditable; Security checks pass without breaking
  required functionality. Success means all prompt exercises pass the rubric.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to structured output are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: A guided AI practice console opens in your browser. It is a rule-based
  simulator (no real model, no API cost) that scores your prompt live.
hints:
- order: 1
  cost: 0
  content: Include WHO the AI should act as (role), WHAT to do (task), and HOW to
    format the answer.
- order: 2
  cost: 25
  content: 'Add constraints: word count, audience, tone, or things to avoid.'
- order: 3
  cost: 50
  content: Use the live score panel — aim for 80+ before submitting.
summary: Complete the structured output — security lab prompt engineering lab and
  verify success with the checker
estimated_minutes: 20
xp_reward: 100
