title: "JSON Mode & Schema-Constrained Output"
slug: json-mode-schema
category: Prompt Engineering
description: >-
  Prompting for JSON gets you most of the way; JSON mode and schema constraints get
  you the rest. Learn the spectrum — from "return only JSON" prompting, to a
  declared JSON Schema, to tool-use/structured-output enforcement — and write a
  prompt that pins an exact, typed schema.
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
coding_mode: true
jira_priority: Low
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
  - Describe the spectrum from prompted JSON to schema-enforced structured output
  - Declare a typed JSON Schema (fields, types, required) in a prompt
  - Pass the exercise that specifies an exact schema and forbids extra text
initial_state: >-
  The guided AI practice console opens. Practice declaring an exact JSON Schema and
  forbidding prose, then see how a typed schema removes ambiguity. Rule-based and
  free.
solution_explanation: >-
  There's a reliability spectrum for structured output. WEAKEST - "return JSON"
  (the model guesses fields and may add prose/fences). BETTER - declare the exact
  schema in the prompt - field names, types, which are required, enums for fixed
  values - and forbid extra text. STRONGEST - use the API's schema enforcement -
  tool use (input_schema) or structured outputs (output_config.format) validate the
  response against a real JSON Schema so it can't drift. (On current Claude models
  this enforcement is the recommended path; a last-turn assistant prefill is no
  longer supported.) Even when you have enforcement, a clear schema and one example in
  the prompt help the model fill the right values. Always specify TYPES (string vs
  integer vs boolean) and required fields; that's what prevents "30" vs 30 and
  missing keys.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A data-extraction assistant that returns JSON matching a declared schema.
    lesson:
      - heading: The reliability spectrum
        body: >-
          "Return JSON" is the weakest form - the model invents field names and
          often wraps the JSON in prose or ```json fences. Declaring the exact schema
          in the prompt is much better. Enforcing a schema at the API level (tool
          use / structured outputs) is strongest, because the response is validated
          against real JSON Schema and literally can't be malformed.
      - heading: Declare a typed schema
        body: >-
          Write the schema out - keys, TYPES, required-vs-optional, and enums for
          fixed sets. "Return an object with title (string, required), priority
          (integer 1-5), and status (one of open|closed)." Naming types stops the
          classic bugs - a number returned as a string, a missing key, a free-text
          field that should be an enum. One concrete example of the object cements
          the shape.
      - heading: Forbid the extras, then enforce
        body: >-
          Add the hard rule - "Return ONLY the JSON object, no prose, no markdown
          code fences." Stray text and fences are the top parse failures. When you
          can, move from prompting to enforcement - in the Claude API, define a tool
          whose input_schema is your JSON Schema, or set output_config.format to a
          json_schema; the response is validated against it, giving you a guarantee
          prompting alone can't.
    rubric: [format, constraints, examples, specificity, task]
    exercises:
      - id: declare-schema
        title: Declare an exact typed schema
        goal: >-
          Write a prompt that declares an exact JSON schema for the output — at
          least two fields WITH their types (string/integer/boolean/array), noting
          which are required — and forbids any text outside the JSON.
        starter: ""
        success:
          min_words: 14
          requires_json_request: true
          require:
            - ["string", "integer", "int", "number", "boolean", "bool", "array", "object"]
          any_of:
            - ["only", "no prose", "no other text", "no markdown", "no code fence", "nothing else", "just the json", "required"]
        success_response: |
          {"title": "Fix login bug", "priority": 1, "resolved": false}
        partial_response: >-
          Declare the field TYPES (string, integer, boolean, array) and which are
          required, and add "Return ONLY the JSON, no prose or code fences." A typed
          schema plus the "only" rule is what makes it parseable.
      - id: enum-and-required
        title: Use enums and mark required fields
        goal: >-
          Write a prompt for a JSON output that uses an ENUM for a fixed-choice field
          (e.g. status is one of open/closed) and marks at least one field as
          required. Show one example object.
        starter: ""
        success:
          min_words: 12
          requires_json_request: true
          any_of:
            - ["enum", "one of", "must be one", "either", "required", "allowed values"]
          mentions_example: true
        success_response: |
          {"id": 42, "status": "open"}
          (status constrained to the enum open|closed; id is required.)
        partial_response: >-
          Constrain the fixed-choice field with an enum ("status is one of
          open|closed"), mark a field required, and show one example object. Enums
          and required flags remove ambiguity the model would otherwise guess at.
hints:
  - content: There's a spectrum — "return JSON" (weak), declare the exact typed schema in the prompt (better), enforce a JSON Schema via tool use (input_schema) or structured outputs (output_config.format) (strongest).
    cost: 10
    order: 1
  - content: 'Always specify TYPES and required fields: "title (string, required), priority (integer), status (one of open|closed)." Types stop "30" vs 30 and missing keys.'
    cost: 15
    order: 2
  - content: 'Add "Return ONLY the JSON, no prose or code fences," show one example object, and when you can, move to API schema enforcement (output_config.format or a tool input_schema) for a hard guarantee.'
    cost: 20
    order: 3
