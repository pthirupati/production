title: Extended & Adaptive Thinking
slug: extended-thinking
category: Build
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `Extended & Adaptive Thinking`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with prompt templates, eval
  sets, and tool configs. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The guided AI practice console opens. Practice framing a hard task so the
  model reasons carefully first, and reason about when thinking is worth it. Rule-based and free. Modern
  Claude models can reason internally before answering — "thinking" — which sharply improves hard, multi-step
  tasks. Learn how thinking differs from prompted chain-of-thought, when to turn it on, how the effort
  setting trades quality for cost, and how to prompt so the model reasons well without over-thinking simple
  asks.


  OBJECTIVE: Explain model "thinking" and how it differs from prompted chain-of-thought; Decide when thinking
  earns its extra cost and latency; Write a prompt that asks for careful reasoning on a genuinely hard
  task. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
