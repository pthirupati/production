solution_explanation: 'Chain-of-thought (CoT) means instructing the model to lay out its reasoning before
  committing to an answer ("Let''s think step by step"). It helps most on arithmetic, logic, debugging,
  and planning. Two practical patterns: (1) ask for reasoning then a clearly-labeled final answer; (2)
  when you only want the answer, ask it to reason privately and return just the conclusion — or use a
  scratchpad section you then ignore. Modern reasoning models do much of this internally, but explicit
  CoT still helps on novel, multi-step tasks.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A reasoning assistant that can show its work when asked.
    lesson:
    - heading: Why it works
      body: Language models predict the next token. When the answer requires several steps, jumping straight
        to a conclusion forces the model to compress all that work into one leap — and it often slips.
        Writing the steps out gives each intermediate result a place to live, so the final answer is grounded
        in explicit reasoning rather than a guess.
    - heading: How to trigger it
      body: 'The classic trigger is "Let''s think step by step." More structured: "First list what we
        know. Then work through it one step at a time. Finally, give the answer on its own line prefixed
        with ANSWER:." For debugging: "Walk through what each line does, identify where the actual behavior
        diverges from expected, then propose the fix."'
    - heading: Keeping output clean
      body: Reasoning can be verbose. If you only want the result, either ask the model to "reason briefly,
        then give just the final answer" or request a dedicated section (e.g. <scratchpad>...</scratchpad>)
        that you discard programmatically. Reasoning models (extended thinking) handle much of this internally,
        but explicit CoT still helps for unusual problems.
    rubric:
    - task
    - reasoning
    - format
    - specificity
    exercises:
    - id: request-reasoning
      title: Ask for step-by-step reasoning
      goal: Write a prompt for a multi-step problem (math, logic, or debugging) that explicitly tells
        the model to reason step by step BEFORE giving its final answer.
      starter: ''
      success:
        min_words: 10
        any_of:
        - - step by step
          - step-by-step
          - reason
          - reasoning
          - think through
          - work through
          - show your work
          - walk through
          - one step at a time
      success_response: 'Step 1: A train travels 60 km in the first hour.

        Step 2: It travels 90 km in the next 1.5 hours (60 km/h is wrong here; given speeds differ).

        Step 3: Total distance = 60 + 90 = 150 km over 2.5 hours.

        ANSWER: average speed = 150 / 2.5 = 60 km/h.

        '
      partial_response: Add an explicit instruction to reason step by step (e.g. "think through it one
        step at a time, then give the final answer"). Otherwise I may jump straight to a guess.
    - id: reason-then-answer
      title: Reason first, then a clean final answer
      goal: Write a prompt that asks the model to reason step by step AND to put the final answer on its
        own line in a fixed format (for example prefixed with "ANSWER:") so it's easy to extract.
      starter: ''
      success:
        min_words: 12
        any_of:
        - - step by step
          - reason
          - think
          - work through
          - walk through
        require:
        - - 'answer:'
          - final answer
          - on its own line
          - prefix
          - label
          - format
          - last line
      success_response: 'Reasoning: there are 3 boxes, each with 4 apples, and 2 are removed.

        3 x 4 = 12, minus 2 = 10.

        ANSWER: 10

        '
      partial_response: 'Good — you asked for reasoning. Now also pin the final answer''s format (e.g.
        "put the result on its own line as ANSWER: <value>") so it''s trivial to parse out.'
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: Chain-of-Thought reasoning is not behaving as
    the scenario objectives require. This lab is about Chain-of-Thought reasoning — how Chain-of-Thought
    reasoning behaves in a prompt engineering environment. Read the objectives and the current state,
    and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Chain-of-Thought reasoning problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one component that owns
    the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small, reversible
    steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of Chain-of-Thought reasoning is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''Chain-of-Thought
    reasoning is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
