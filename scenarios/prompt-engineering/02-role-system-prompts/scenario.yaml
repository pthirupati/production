objectives:
- Explain how a system prompt differs from a user message
- Write a role/persona instruction that sets expertise, audience, and tone
- Pass the exercise that requires a clear persona plus behavioral rules
initial_state: The guided AI practice console opens. Set a role for the assistant and watch how the reply changes tone and depth. Everything is rule-based and free — no API key required.
solution_explanation: System prompts set durable behavior ("You are a senior SRE. Always show the command
  first, then a one-line why."). They persist across the conversation, unlike a one-off user message.
  A good role specifies expertise level, the audience, the tone, and any always/never rules. With Claude,
  system-level guidance is passed via the system parameter; in Claude Code it lives in CLAUDE.md and your
  settings.
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: An assistant that adopts whatever role you assign in your prompt.
    lesson:
    - heading: System vs user prompts
      body: A USER prompt is a single request. A SYSTEM prompt is standing instruction that frames every
        reply in the conversation — the AI's role, rules, and style. Think of the system prompt as the
        job description and the user prompts as the individual tasks. With the Claude API you pass it
        via the top-level `system` parameter; in Claude Code, your CLAUDE.md file acts like a persistent
        system prompt for the whole repo.
    - heading: Anatomy of a good role
      body: 'A strong role sets four things: EXPERTISE ("You are a senior security engineer"), AUDIENCE
        ("explaining to a junior dev"), TONE ("concise and direct, no fluff"), and RULES ("always show
        the command first, never invent APIs you''re unsure about"). Roles work because they prime the
        model toward a consistent slice of its training.'
    - heading: Always / never rules
      body: 'Behavioral rules are powerful in system prompts: "Always cite the file and line you changed."
        "Never modify tests to make them pass." "If you are unsure, say so instead of guessing." These
        constraints shape every answer without you repeating them each turn.'
    rubric:
    - role
    - constraints
    - tone
    - audience
    - specificity
    exercises:
    - id: set-persona
      title: Assign an expert persona
      goal: Write a system-style instruction that gives the assistant a clear expert role, names the audience
        it's speaking to, and sets a tone. For example a security reviewer explaining findings to developers.
      starter: 'You are a '
      success:
        min_words: 10
        require_any_role: true
        require:
        - - concise
          - brief
          - direct
          - friendly
          - formal
          - plain
          - no jargon
          - simple
          - professional
          - blunt
          - tone
        any_of:
        - - junior
          - developer
          - engineer
          - beginner
          - team
          - student
          - manager
          - customer
          - user
          - audience
      success_response: Understood. I'll act as a senior security engineer, keep things concise and jargon-light
        for developers, and flag the risk and the fix for each issue. What would you like me to review?
      partial_response: Good start on the role. Now also tell me the AUDIENCE (who I'm talking to) and
        the TONE you want (concise? formal? friendly?) so I stay consistent.
    - id: behavior-rule
      title: Add an always/never rule
      goal: 'Add a behavioral rule to the assistant''s instructions — something it should ALWAYS do or
        NEVER do (for example: always show the command first, or never guess when unsure).'
      starter: 'You are a coding assistant. Always '
      success:
        min_words: 8
        any_of:
        - - always
          - never
          - must
          - do not
          - don't
          - if unsure
          - if you are not sure
      success_response: Got it. I'll follow that rule on every reply. For example, I'll lead with the
        exact command and add one line on why — and I won't pretend to know an API I'm unsure about.
      partial_response: A persistent rule should use ALWAYS or NEVER (or "if unsure, ..."). Try phrasing
        one concrete behavior I should follow every time.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: role & system prompts is not behaving as the
    scenario objectives require. This lab is about role & system prompts — how role & system prompts behaves
    in a prompt engineering environment. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For role & system prompts problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of role & system prompts is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''role & system
    prompts is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
