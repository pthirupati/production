  the difference specificity makes.
solution_explanation: 'Strong prompts almost always include: WHO the AI should act as, the CONTEXT it
  needs, the exact TASK, any CONSTRAINTS (length, tone, what to avoid), and the desired OUTPUT FORMAT.
  "Write about dogs" scores low; "You are a vet. In 3 bullet points for new owners, list the most important
  first-week care tasks for a puppy" scores high because every ingredient is present.'
coding_spec:
  kind: prompt
  language: text
  prompt_config:
    persona: A general-purpose AI writing assistant.
    lesson:
    - heading: Why specificity wins
      body: An AI can only respond to what you actually asked. "Tell me about databases" could mean a
        one-line definition or a 50-page book. The model guesses — and guesses are usually generic. Every
        detail you add (audience, length, format, focus) removes ambiguity and pushes the answer toward
        what you actually want.
    - heading: The five ingredients
      body: 'A reliable prompt has: (1) ROLE — who the AI should act as; (2) CONTEXT — the background
        it needs; (3) TASK — the specific thing to do, ideally with an action verb; (4) CONSTRAINTS —
        length, tone, audience, things to avoid; (5) OUTPUT FORMAT — bullets, JSON, a table, a number.
        You don''t always need all five, but the more high-stakes the task, the more of them you want.'
    - heading: Weak vs strong
      body: 'Weak: "explain recursion". Strong: "You are a CS tutor. Explain recursion to a first-year
        student in under 120 words, using one concrete example (factorial) and no jargon." The strong
        version is specific about audience, length, example, and tone.'
    rubric:
    - role
    - context
    - task
    - constraints
    - format
    - specificity
    exercises:
    - id: rewrite-vague
      title: Rewrite a vague prompt
      goal: The prompt "write something about Python" is far too vague. Rewrite it into a specific request.
        Aim to include an audience, a length limit, and a clear output format.
      starter: write something about Python
      success:
        min_words: 12
        require_any_role: true
        any_of:
        - - bullet
          - list
          - table
          - steps
          - numbered
          - paragraph
          - json
        require:
        - - beginner
          - junior
          - student
          - new
          - audience
          - team
          - developer
          - engineer
        mentions_limit: true
      success_response: 'Here are 3 beginner-friendly facts about Python: 1. It reads almost like English,
        so it''s a great first language. 2. Indentation defines code blocks instead of curly braces. 3.
        A huge standard library means "batteries included" for common tasks.'
      partial_response: I can answer that, but it's broad. Who is the audience, how long should it be,
        and what format do you want (bullets, a paragraph, a table)?
    - id: extract-fact
      title: Ask for one precise answer
      goal: Write a prompt that forces a single, unambiguous answer — for example, asking for exactly
        one number, one word, or one sentence, with no extra explanation.
      starter: ''
      success:
        min_words: 6
        any_of:
        - - only
          - just
          - exactly
          - single
          - one word
          - one sentence
          - one number
          - no explanation
          - no other text
      success_response: '42'
      partial_response: That could produce a paragraph. Add a constraint like "answer with only the number,
        no explanation" to force a precise reply.
  hidden_tests:
  - name: smoke_hidden
    code: assert True
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: prompt fundamentals is not behaving as the scenario
    objectives require. This lab is about prompt fundamentals — how prompt fundamentals behaves in a prompt
    engineering environment. Read the objectives and the current state, and note precisely what looks
    wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For prompt fundamentals problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `the solution file`, read the instructions, and run the visible tests to see which assertion
    fails first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of prompt fundamentals is at fault.

    2. Re-run the most relevant of prompt templates, eval sets, and tool configs focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''prompt fundamentals
    is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `the solution file` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
