jira_priority: Low
description: 'CONTEXT: A team operating prompt engineering needs you to resolve `prompt-engineering:
  Instruction Design — Fundamentals Lab` during a realistic incident. The business
  impact is reduced service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline LLM practice workspace with
  prompt templates, eval sets, and tool configs. All tools run locally; no paid APIs
  or external cloud calls are required.


  SYMPTOM / STARTING STATE: The LLM practice workspace is online with a starter instruction
  design setup. Some pieces are intentionally incomplete so you can learn how they
  fit together. Nothing is on fire — focus on observation. This beginner-friendly
  prompt-engineering lab introduces instruction design. You will explore clear, scoped
  task instructions on the LLM practice workspace. Read the environment first, then
  follow the guided steps — no prior production experience required.


  OBJECTIVE: Understand how instruction design work in this lab environment; Identify
  the main status and configuration signals for instruction design; Confirm you can
  read the current state confidently before changing anything. Success means all prompt
  exercises pass the rubric.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
objectives:
- Understand how instruction design work in this lab environment
- Identify the main status and configuration signals for instruction design
- Confirm you can read the current state confidently before changing anything
initial_state: A guided AI practice console opens in your browser. It is a rule-based
  simulator (no real model, no API cost) that scores your prompt live.
hints:
- order: 1
  cost: 0
  content: Include WHO the AI should act as (role), WHAT to do (task), and HOW to
    format the answer.
- order: 2
  cost: 25
  content: 'Add constraints: word count, audience, tone, or things to avoid.'
- order: 3
  cost: 50
  content: Use the live score panel — aim for 80+ before submitting.
summary: Complete the instruction design — learn lab prompt engineering lab and verify
