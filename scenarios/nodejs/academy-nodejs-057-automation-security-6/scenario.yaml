title: Application Security — Automation Lab
slug: academy-nodejs-057-automation-security-6
technology: nodejs
category: Harden
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: nodejs
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: Complete the security coding exercise in the browser IDE.

  ENVIRONMENT: FixitLab coding practice IDE — edit solution.js, Run visible tests,
  then Check Solution.

  SYMPTOM / STARTING STATE: Coding challenge: security. The stub in solution.js is
  incomplete so tests fail until you implement it.

  OBJECTIVE: Implement the required changes so all visible and hidden tests pass.

  VERIFY: Check Solution passes all hidden tests.

  '
objectives:
- Implement the required function in solution.js
- Pass visible tests with Run
- Pass Check Solution (hidden tests)
initial_state: 'Coding challenge: security. The stub in solution.js is incomplete
  so tests fail until you implement it.'
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: the app is vulnerable to
    common attacks. This lab is about application security — input validation, headers,
    and authz. Read the objectives and the current state, and note precisely what
    looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For application security problems the reliable
    method is: (1) reproduce/observe the failure, (2) narrow from the whole system
    down to the one component that owns the symptom, (3) change exactly one thing,
    (4) re-check. Implement the automation with dry-run / check mode, then run it
    twice — the second run must report no changes.'
- order: 3
  cost: 25
  content: WHICH TOOL — use the IDE Run button on visible tests first; read the failing
    assertion message carefully.
- order: 4
  cost: 40
  content: NARROW DOWN — implement the smallest change that satisfies one failing
    test, then re-run.
- order: 5
  cost: 60
  content: NEAR-SOLUTION — finish the function so all visible tests pass, then Check
    Solution.
summary: Complete the application security — automation lab nodejs lab and verify
  success with the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic nodejs literacy
tags:
- do
- hands-on
- nodejs
linked_tutorial: nodejs-zero-hero
what_you_will_learn:
- Day-2 application security work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
environment:
  nodes:
  - role: primary
    os: FixitLab Node.js application
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline lab environment
  pre_installed:
  - bash
  - coreutils
  - journalctl
  - nodejs
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Application Security — Automation Lab
  description: Implement the security exercise in the browser IDE and pass all tests.
  background: 'This nodejs lab teaches systematic troubleshooting: observe, hypothesize,
    change, verify.'
  validation:
    type: script
    script: hidden_tests
    error_message: Hidden tests still failing — keep iterating in the IDE.
solution:
  summary: Implement the function so visible and hidden tests pass in the coding IDE.
  files_changed:
  - solution.js
  commands_run: []
  reference_docs: nodejs-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx`` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
coding_mode: true
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: 'Implement sanitizeHeader(v) → strip CR/LF characters.

    Click Run to try it, then Check Solution to grade.

    '
  files:
  - path: solution.js
    content: "function sanitizeHeader(v) {\n  // TODO\n}\n"
    readonly: false
  visible_tests:
  - name: crlf
    code: assert(sanitizeHeader('a\r\nb') === 'ab');
  hidden_tests:
  - name: ok
    code: assert(sanitizeHeader('ok') === 'ok');
  - name: n
    code: assert(sanitizeHeader('v6\n') === 'v6');
  - name: s89_case_2
    code: assert(typeof sanitizeHeader === "function" || typeof sanitizeHeader !== "undefined");
  - name: s89_case_3
    code: assert(true);
  timeout: 8
