title: Implement retry with Exponential Backoff
slug: nodejs-impl-retry-backoff-async
technology: nodejs
category: Build
description: 'CONTEXT: A team operating Node.js backends needs you to resolve `Implement retry with Exponential
  Backoff` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Node.js application with Express routes, middleware,
  and package.json. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement retryWithBackoff(fn, options): call fn; on throw, retry up to options.retries
  times (retries+1 attempts total). Before each retry call options.sleep(baseMs * 2**retryIndex), index
  starting at 0. Return fn''s value on success; re-throw the last error if every attempt fails. The injected
  sleep is synchronous (it just records the delay) so the schedule is deterministic — no real timers.
  The stub returns undefined so tests fail. Implement retryWithBackoff(fn, options): call fn; if it throws,
  retry up to options.retries times (so at most retries+1 total attempts). Before each retry, record the
  wait by calling the injected options.sleep(ms) — never a real timer — with an exponential delay: options.baseMs
  * 2**(retryIndex), where retryIndex starts at 0 for the first wait. Return fn''s value on success; if
  every attempt throws, re-throw the LAST error. The stub returns undefined so tests fail.


  OBJECTIVE: Return fn''s value on the first successful attempt; Retry on throw up to options.retries,
  calling options.sleep between attempts; Compute exponential delays baseMs * 2**index and re-throw the
  last error if all fail. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
