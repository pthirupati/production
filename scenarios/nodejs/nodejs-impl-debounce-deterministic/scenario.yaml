initial_state: 'Implement debounce(fn, waitMs, clock): return a debounced wrapper that delays calling
  fn until `waitMs` of quiet has passed since the LAST call. Use the injected clock (clock.setTimeout/clearTimeout)
  so the behaviour is deterministic. Each new call cancels the pending timer and schedules a fresh one;
  fn runs with the arguments of the most recent call. The stub does nothing so tests fail.'
solution_explanation: 'Debounce collapses a burst of calls into one trailing invocation. Keep the id of
  the pending timer; on every call, clearTimeout the old id (so an earlier scheduled run is discarded)
  and setTimeout a new one for waitMs. Because each call reschedules, fn only fires once the calls stop
  for waitMs, and it sees the arguments captured by the last call. Using the injected clock instead of
  the global setTimeout makes the timing fully controllable in tests.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: "Implement debounce(fn, waitMs, clock) -> a function. Calling the returned function should:\n\
    \  - cancel any pending scheduled run (clock.clearTimeout)\n  - schedule fn to run after waitMs (clock.setTimeout),\
    \ with THIS call's arguments\nso that a burst of calls results in exactly one fn invocation, waitMs\
    \ after the last call.\nA test driver advances a fake clock; do NOT use the global setTimeout.\nClick\
    \ Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function debounce(fn, waitMs, clock) {\n  // TODO: return a function that debounces fn using\
      \ clock.setTimeout / clock.clearTimeout.\n  // Cancel the previous pending timer on each call, then\
      \ schedule a fresh one for waitMs.\n  // fn must run with the arguments of the most recent call.\n\
      }\n"
    readonly: false
  visible_tests:
  - name: fires once after the last call
    code: "function makeClock() {\n  let now = 0, seq = 0; const timers = new Map();\n  return {\n   \
      \ setTimeout(cb, ms) { const id = ++seq; timers.set(id, { at: now + ms, cb }); return id; },\n \
      \   clearTimeout(id) { timers.delete(id); },\n    tick(ms) {\n      now += ms;\n      for (const\
      \ [id, t] of [...timers.entries()].sort((a, b) => a[1].at - b[1].at)) {\n        if (t.at <= now)\
      \ { timers.delete(id); t.cb(); }\n      }\n    }\n  };\n}\nconst clock = makeClock();\nlet calls\
      \ = [];\nconst d = debounce((x) => calls.push(x), 100, clock);\nd(1); d(2); d(3);\nclock.tick(99);\n\
      assert(calls.length === 0, 'should not fire before quiet period: ' + JSON.stringify(calls));\nclock.tick(1);\n\
      assert(JSON.stringify(calls) === JSON.stringify([3]), 'expected one call with last arg: ' + JSON.stringify(calls));\n"
  - name: separate bursts fire separately
    code: "function makeClock() {\n  let now = 0, seq = 0; const timers = new Map();\n  return {\n   \
      \ setTimeout(cb, ms) { const id = ++seq; timers.set(id, { at: now + ms, cb }); return id; },\n \
      \   clearTimeout(id) { timers.delete(id); },\n    tick(ms) { now += ms; for (const [id, t] of [...timers.entries()].sort((a,b)=>a[1].at-b[1].at))\
      \ { if (t.at <= now) { timers.delete(id); t.cb(); } } }\n  };\n}\nconst clock = makeClock();\nlet\
      \ calls = [];\nconst d = debounce((x) => calls.push(x), 50, clock);\nd('a'); clock.tick(50);\nd('b');\
      \ clock.tick(50);\nassert(JSON.stringify(calls) === JSON.stringify(['a', 'b']), JSON.stringify(calls));\n"
  hidden_tests:
  - name: passes the most recent arguments
    code: 'function makeClock() { let now=0,seq=0; const t=new Map(); return { setTimeout(cb,ms){const
      id=++seq;t.set(id,{at:now+ms,cb});return id;}, clearTimeout(id){t.delete(id);}, tick(ms){now+=ms;for(const
      [id,x] of [...t.entries()].sort((a,b)=>a[1].at-b[1].at)){if(x.at<=now){t.delete(id);x.cb();}}} };
      }

      const clock = makeClock();

      let seen = null;

      const d = debounce((a, b) => { seen = [a, b]; }, 10, clock);

      d(1, 2); d(3, 4);

      clock.tick(10);

      assert(JSON.stringify(seen) === JSON.stringify([3, 4]), JSON.stringify(seen));

      '
  - name: clears the previous pending timer
    code: "let cleared = 0;\nlet scheduled = 0;\nconst clock = {\n  setTimeout(cb, ms) { scheduled++;\
      \ return scheduled; },\n  clearTimeout(id) { cleared++; }\n};\nconst d = debounce(() => {}, 10,\
      \ clock);\nd(); d(); d();\nassert(scheduled === 3, 'should schedule on every call: ' + scheduled);\n\
      assert(cleared >= 2, 'should clear the pending timer on reschedule, got ' + cleared);\n"
  - name: never calls fn if time never advances
    code: 'function makeClock(){let now=0,seq=0;const t=new Map();return {setTimeout(cb,ms){const id=++seq;t.set(id,{at:now+ms,cb});return
      id;},clearTimeout(id){t.delete(id);},tick(ms){now+=ms;for(const [id,x] of [...t.entries()].sort((a,b)=>a[1].at-b[1].at)){if(x.at<=now){t.delete(id);x.cb();}}}};}

      const clock = makeClock();

      let called = false;

      const d = debounce(() => { called = true; }, 100, clock);

      d(); d();

      assert(called === false, ''fn must not run until the clock advances past waitMs'');

      '
  - name: returns a callable function
    code: 'const clock = { setTimeout() { return 1; }, clearTimeout() {} };

      const d = debounce(() => {}, 5, clock);

      assert(typeof d === ''function'', ''debounce must return a function'');

      '
  - name: a single call fires exactly once
    code: 'function makeClock(){let now=0,seq=0;const t=new Map();return {setTimeout(cb,ms){const id=++seq;t.set(id,{at:now+ms,cb});return
      id;},clearTimeout(id){t.delete(id);},tick(ms){now+=ms;for(const [id,x] of [...t.entries()].sort((a,b)=>a[1].at-b[1].at)){if(x.at<=now){t.delete(id);x.cb();}}}};}

      const clock = makeClock();

      let count = 0;

      const d = debounce(() => { count++; }, 30, clock);

      d();

      clock.tick(30);

      clock.tick(30);

      assert(count === 1, ''expected exactly one call, got '' + count);

      '
  timeout: 8
