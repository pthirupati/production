        // Cancel the previous pending timer on each call, then schedule a fresh one for waitMs.
        // fn must run with the arguments of the most recent call.
      }
    readonly: false
  visible_tests:
  - name: fires once after the last call
    code: |
      function makeClock() {
        let now = 0, seq = 0; const timers = new Map();
        return {
          setTimeout(cb, ms) { const id = ++seq; timers.set(id, { at: now + ms, cb }); return id; },
          clearTimeout(id) { timers.delete(id); },
          tick(ms) {
            now += ms;
            for (const [id, t] of [...timers.entries()].sort((a, b) => a[1].at - b[1].at)) {
              if (t.at <= now) { timers.delete(id); t.cb(); }
            }
          }
        };
      }
      const clock = makeClock();
      let calls = [];
      const d = debounce((x) => calls.push(x), 100, clock);
      d(1); d(2); d(3);
      clock.tick(99);
      assert(calls.length === 0, 'should not fire before quiet period: ' + JSON.stringify(calls));
      clock.tick(1);
      assert(JSON.stringify(calls) === JSON.stringify([3]), 'expected one call with last arg: ' + JSON.stringify(calls));
  - name: separate bursts fire separately
    code: |
      function makeClock() {
        let now = 0, seq = 0; const timers = new Map();
        return {
          setTimeout(cb, ms) { const id = ++seq; timers.set(id, { at: now + ms, cb }); return id; },
          clearTimeout(id) { timers.delete(id); },
          tick(ms) { now += ms; for (const [id, t] of [...timers.entries()].sort((a,b)=>a[1].at-b[1].at)) { if (t.at <= now) { timers.delete(id); t.cb(); } } }
        };
      }
      const clock = makeClock();
      let calls = [];
      const d = debounce((x) => calls.push(x), 50, clock);
      d('a'); clock.tick(50);
      d('b'); clock.tick(50);
      assert(JSON.stringify(calls) === JSON.stringify(['a', 'b']), JSON.stringify(calls));
  hidden_tests:
  - name: passes the most recent arguments
    code: |
      function makeClock() { let now=0,seq=0; const t=new Map(); return { setTimeout(cb,ms){const id=++seq;t.set(id,{at:now+ms,cb});return id;}, clearTimeout(id){t.delete(id);}, tick(ms){now+=ms;for(const [id,x] of [...t.entries()].sort((a,b)=>a[1].at-b[1].at)){if(x.at<=now){t.delete(id);x.cb();}}} }; }
      const clock = makeClock();
      let seen = null;
      const d = debounce((a, b) => { seen = [a, b]; }, 10, clock);
      d(1, 2); d(3, 4);
      clock.tick(10);
      assert(JSON.stringify(seen) === JSON.stringify([3, 4]), JSON.stringify(seen));
  - name: clears the previous pending timer
    code: |
      let cleared = 0;
      let scheduled = 0;
      const clock = {
        setTimeout(cb, ms) { scheduled++; return scheduled; },
        clearTimeout(id) { cleared++; }
      };
      const d = debounce(() => {}, 10, clock);
      d(); d(); d();
      assert(scheduled === 3, 'should schedule on every call: ' + scheduled);
      assert(cleared >= 2, 'should clear the pending timer on reschedule, got ' + cleared);
  - name: never calls fn if time never advances
    code: |
      function makeClock(){let now=0,seq=0;const t=new Map();return {setTimeout(cb,ms){const id=++seq;t.set(id,{at:now+ms,cb});return id;},clearTimeout(id){t.delete(id);},tick(ms){now+=ms;for(const [id,x] of [...t.entries()].sort((a,b)=>a[1].at-b[1].at)){if(x.at<=now){t.delete(id);x.cb();}}}};}
      const clock = makeClock();
      let called = false;
      const d = debounce(() => { called = true; }, 100, clock);
      d(); d();
      assert(called === false, 'fn must not run until the clock advances past waitMs');
  - name: returns a callable function
    code: |
      const clock = { setTimeout() { return 1; }, clearTimeout() {} };
      const d = debounce(() => {}, 5, clock);
      assert(typeof d === 'function', 'debounce must return a function');
  - name: a single call fires exactly once
    code: |
      function makeClock(){let now=0,seq=0;const t=new Map();return {setTimeout(cb,ms){const id=++seq;t.set(id,{at:now+ms,cb});return id;},clearTimeout(id){t.delete(id);},tick(ms){now+=ms;for(const [id,x] of [...t.entries()].sort((a,b)=>a[1].at-b[1].at)){if(x.at<=now){t.delete(id);x.cb();}}}};}
      const clock = makeClock();
      let count = 0;
      const d = debounce(() => { count++; }, 30, clock);
      d();
      clock.tick(30);
      clock.tick(30);
      assert(count === 1, 'expected exactly one call, got ' + count);
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Keep a variable for the pending timer id in the closure, shared across calls.
- order: 2
  cost: 20
  content: 'On each call: if an id exists, clock.clearTimeout(it); capture the args; then set a new id = clock.setTimeout(() => fn(...args), waitMs).'
- order: 3
  cost: 30
  content: Use `return function (...args) { ... }` so each call reschedules from the latest args, and reset the id when the timer fires.
