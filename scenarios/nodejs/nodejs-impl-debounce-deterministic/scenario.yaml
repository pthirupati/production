title: Implement debounce with an Injected Clock
slug: nodejs-impl-debounce-deterministic
technology: nodejs
category: Build
description: 'CONTEXT: A team operating Node.js backends needs you to resolve `Implement debounce with
  an Injected Clock` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Node.js application with Express routes, middleware,
  and package.json. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement debounce(fn, waitMs, clock): return a debounced wrapper that delays
  calling fn until `waitMs` of quiet has passed since the LAST call. Use the injected clock (clock.setTimeout/clearTimeout)
  so the behaviour is deterministic. Each new call cancels the pending timer and schedules a fresh one;
  fn runs with the arguments of the most recent call. The stub does nothing so tests fail. Implement debounce(fn,
  waitMs, clock): return a debounced wrapper that delays calling fn until `waitMs` of quiet has passed
  since the LAST call. To stay deterministic (no real timers), use the injected clock: clock.setTimeout(cb,
  ms) returns an id, clock.clearTimeout(id) cancels it. Each new call must cancel the pending timer and
  schedule a fresh one; fn runs with the arguments of the most recent call. The stub does nothing so tests
  fail.


  OBJECTIVE: Schedule fn via clock.setTimeout instead of a real timer; Cancel the previous pending timer
  on every new call (clearTimeout); Invoke fn once, after quiet, with the latest call''s arguments. Success
  means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
