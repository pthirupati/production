title: Implement debounce with an Injected Clock
slug: nodejs-impl-debounce-deterministic
technology: nodejs
category: Node.js Development
description: 'Implement debounce(fn, waitMs, clock): return a debounced wrapper that delays calling fn
  until `waitMs` of quiet has passed since the LAST call. To stay deterministic (no real timers), use
  the injected clock: clock.setTimeout(cb, ms) returns an id, clock.clearTimeout(id) cancels it. Each
  new call must cancel the pending timer and schedule a fresh one; fn runs with the arguments of the
  most recent call. The stub does nothing so tests fail.'
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Schedule fn via clock.setTimeout instead of a real timer
- Cancel the previous pending timer on every new call (clearTimeout)
- Invoke fn once, after quiet, with the latest call's arguments
initial_state: 'Implement debounce(fn, waitMs, clock): return a debounced wrapper that delays calling
  fn until `waitMs` of quiet has passed since the LAST call. Use the injected clock (clock.setTimeout/clearTimeout)
  so the behaviour is deterministic. Each new call cancels the pending timer and schedules a fresh one;
  fn runs with the arguments of the most recent call. The stub does nothing so tests fail.'
solution_explanation: |
  Debounce collapses a burst of calls into one trailing invocation. Keep the id of the pending timer; on every call, clearTimeout the old id (so an earlier scheduled run is discarded) and setTimeout a new one for waitMs. Because each call reschedules, fn only fires once the calls stop for waitMs, and it sees the arguments captured by the last call. Using the injected clock instead of the global setTimeout makes the timing fully controllable in tests.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: |
    Implement debounce(fn, waitMs, clock) -> a function. Calling the returned function should:
      - cancel any pending scheduled run (clock.clearTimeout)
      - schedule fn to run after waitMs (clock.setTimeout), with THIS call's arguments
    so that a burst of calls results in exactly one fn invocation, waitMs after the last call.
    A test driver advances a fake clock; do NOT use the global setTimeout.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function debounce(fn, waitMs, clock) {
