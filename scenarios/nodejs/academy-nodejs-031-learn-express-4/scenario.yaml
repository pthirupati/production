description: This beginner-friendly Node.js Development lab introduces Express APIs.
  You will explore routes, middleware order, error handlers, and request parsing on
  the Node.js application. Read the environment first, then follow the guided steps
  — no prior production experience required.
objectives:
- Understand how Express APIs work in this lab environment
- Identify the main status and configuration signals for Express APIs
- Confirm you can read the current state confidently before changing anything
initial_state: The Node.js application is online with a starter Express APIs setup.
  Some pieces are intentionally incomplete so you can learn how they fit together.
  Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — route definitions, server logs, and HTTP traces.

    2. Write down what looks normal versus wrong or missing for Express APIs.

    3. Recall the core idea: routes, middleware order, error handlers, and request
    parsing. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Express APIs.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — route definitions, server logs, and HTTP traces.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — endpoints return expected status/body and errors are handled
    centrally.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-nodejs-031-learn-express-4.conf`,
    then click Check Solution.'
