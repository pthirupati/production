- order: 3
  cost: 20
  content: 'Verify recovery: logs answer who/what/when with traceable request IDs.
    Document the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-nodejs-084-troubleshoot-logging-9.conf`,
