title: Fix the Promise That Never Resolves
slug: nodejs-fix-promise-never-resolves
technology: nodejs
category: Fix
description: 'CONTEXT: A team operating Node.js backends needs you to resolve `Fix the Promise That Never
  Resolves` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Node.js application with Express routes, middleware,
  and package.json. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: makeResolved(value) should return a Promise that fulfils with `value`. The
  executor runs and computes the value but forgets to call resolve, so the returned Promise stays pending
  forever and any `await makeResolved(...)` hangs. Fix the executor so it calls resolve(value) and the
  Promise actually settles.


  OBJECTIVE: See that the returned Promise never settles because resolve is never called; Understand that
  a Promise executor runs immediately, but the Promise only fulfils when resolve runs; Call resolve(value)
  so the Promise settles with the value. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
