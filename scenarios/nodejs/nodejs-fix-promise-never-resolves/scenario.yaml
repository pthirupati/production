title: Fix the Promise That Never Resolves
slug: nodejs-fix-promise-never-resolves
technology: nodejs
category: Node.js Development
description: makeResolved(value) should return a Promise that fulfils with `value`. The executor runs
  and computes the value but forgets to call resolve, so the returned Promise stays pending forever and
  any `await makeResolved(...)` hangs. Fix the executor so it calls resolve(value) and the Promise actually
  settles.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See that the returned Promise never settles because resolve is never called
- Understand that a Promise executor runs immediately, but the Promise only fulfils when resolve runs
- Call resolve(value) so the Promise settles with the value
initial_state: makeResolved(value) should return a Promise that fulfils with `value`. The executor runs
  and computes the value but forgets to call resolve, so the returned Promise stays pending forever and
  any `await makeResolved(...)` hangs. Fix the executor so it calls resolve(value) and the Promise actually
  settles.
solution_explanation: |
  The function passed to `new Promise(executor)` runs synchronously the moment the Promise is constructed, but the Promise itself stays pending until that executor calls resolve (or reject). Computing a value and never calling resolve leaves the Promise pending forever, so `await` never returns. Passing the value to resolve() fulfils the Promise. (The tests verify this synchronously by instrumenting the Promise constructor to confirm resolve was actually called with the value — they do not rely on the microtask queue.)
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: |
    Fix makeResolved(value): it must return a Promise that fulfils with `value`.
      await makeResolved(7)  ->  7
    The executor currently computes the value but never calls resolve, so the Promise hangs.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function makeResolved(value) {
        return new Promise((resolve, reject) => {
          const result = value;
          // bug: result is computed but resolve is never called,
          // so this Promise stays pending forever and `await` hangs.
        });
      }
    readonly: false
  visible_tests:
  - name: calls resolve with the value
    code: |
      let resolvedWith;
      let called = false;
      const Real = Promise;
      class Spy extends Real {
        constructor(ex) { super((res, rej) => { ex((v) => { called = true; resolvedWith = v; res(v); }, rej); }); }
      }
      Promise = Spy;
      try { makeResolved(7); } finally { Promise = Real; }
      assert(called === true, 'executor never called resolve — Promise stays pending');
      assert(resolvedWith === 7, 'resolved with wrong value: ' + resolvedWith);
  - name: returns a Promise (thenable)
    code: |
      const p = makeResolved(1);
      assert(typeof p.then === 'function', 'makeResolved must return a Promise');
  hidden_tests:
  - name: resolves with a string value
    code: |
      let val; let called = false;
      const Real = Promise;
      class Spy extends Real { constructor(ex){ super((res,rej)=>{ ex((v)=>{ called=true; val=v; res(v); }, rej); }); } }
      Promise = Spy;
      try { makeResolved('hi'); } finally { Promise = Real; }
      assert(called && val === 'hi', 'called=' + called + ' val=' + val);
  - name: resolves undefined when value is undefined
    code: |
      let called = false; let val = 'sentinel';
      const Real = Promise;
      class Spy extends Real { constructor(ex){ super((res,rej)=>{ ex((v)=>{ called=true; val=v; res(v); }, rej); }); } }
      Promise = Spy;
      try { makeResolved(undefined); } finally { Promise = Real; }
      assert(called === true, 'resolve must be called even for undefined');
      assert(val === undefined, 'val=' + String(val));
  - name: resolves falsy values like 0
    code: |
      let called = false; let val;
      const Real = Promise;
      class Spy extends Real { constructor(ex){ super((res,rej)=>{ ex((v)=>{ called=true; val=v; res(v); }, rej); }); } }
      Promise = Spy;
      try { makeResolved(0); } finally { Promise = Real; }
      assert(called === true && val === 0, 'called=' + called + ' val=' + val);
  - name: the executor runs synchronously
    code: |
      let ranSync = false;
      const Real = Promise;
      class Spy extends Real { constructor(ex){ super((res,rej)=>{ ranSync = true; ex(res, rej); }); } }
      Promise = Spy;
      try { makeResolved(5); } finally { Promise = Real; }
      assert(ranSync === true, 'the Promise executor should run synchronously at construction');
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Try `await makeResolved(7)` — it never returns, because the Promise is still pending.
- order: 2
  cost: 20
  content: A Promise only fulfils when the executor calls resolve(...). Computing a value isn't enough.
- order: 3
  cost: 30
  content: Replace the comment with `resolve(result);` (or `resolve(value);`).
