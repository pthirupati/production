initial_state: makeResolved(value) should return a Promise that fulfils with `value`. The executor runs
  and computes the value but forgets to call resolve, so the returned Promise stays pending forever and
  any `await makeResolved(...)` hangs. Fix the executor so it calls resolve(value) and the Promise actually
  settles.
solution_explanation: 'The function passed to `new Promise(executor)` runs synchronously the moment the
  Promise is constructed, but the Promise itself stays pending until that executor calls resolve (or reject).
  Computing a value and never calling resolve leaves the Promise pending forever, so `await` never returns.
  Passing the value to resolve() fulfils the Promise. (The tests verify this synchronously by instrumenting
  the Promise constructor to confirm resolve was actually called with the value — they do not rely on
  the microtask queue.)

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix makeResolved(value): it must return a Promise that fulfils with `value`.\n  await\
    \ makeResolved(7)  ->  7\nThe executor currently computes the value but never calls resolve, so the\
    \ Promise hangs.\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function makeResolved(value) {\n  return new Promise((resolve, reject) => {\n    const result\
      \ = value;\n    // bug: result is computed but resolve is never called,\n    // so this Promise\
      \ stays pending forever and `await` hangs.\n  });\n}\n"
    readonly: false
  visible_tests:
  - name: calls resolve with the value
    code: "let resolvedWith;\nlet called = false;\nconst Real = Promise;\nclass Spy extends Real {\n \
      \ constructor(ex) { super((res, rej) => { ex((v) => { called = true; resolvedWith = v; res(v); },\
      \ rej); }); }\n}\nPromise = Spy;\ntry { makeResolved(7); } finally { Promise = Real; }\nassert(called\
      \ === true, 'executor never called resolve — Promise stays pending');\nassert(resolvedWith === 7,\
      \ 'resolved with wrong value: ' + resolvedWith);\n"
  - name: returns a Promise (thenable)
    code: 'const p = makeResolved(1);

      assert(typeof p.then === ''function'', ''makeResolved must return a Promise'');

      '
  hidden_tests:
  - name: resolves with a string value
    code: 'let val; let called = false;

      const Real = Promise;

      class Spy extends Real { constructor(ex){ super((res,rej)=>{ ex((v)=>{ called=true; val=v; res(v);
      }, rej); }); } }

      Promise = Spy;

      try { makeResolved(''hi''); } finally { Promise = Real; }

      assert(called && val === ''hi'', ''called='' + called + '' val='' + val);

      '
  - name: resolves undefined when value is undefined
    code: 'let called = false; let val = ''sentinel'';

      const Real = Promise;

      class Spy extends Real { constructor(ex){ super((res,rej)=>{ ex((v)=>{ called=true; val=v; res(v);
      }, rej); }); } }

      Promise = Spy;

      try { makeResolved(undefined); } finally { Promise = Real; }

      assert(called === true, ''resolve must be called even for undefined'');

      assert(val === undefined, ''val='' + String(val));

      '
  - name: resolves falsy values like 0
    code: 'let called = false; let val;

      const Real = Promise;

      class Spy extends Real { constructor(ex){ super((res,rej)=>{ ex((v)=>{ called=true; val=v; res(v);
      }, rej); }); } }

      Promise = Spy;

      try { makeResolved(0); } finally { Promise = Real; }

      assert(called === true && val === 0, ''called='' + called + '' val='' + val);

      '
  - name: the executor runs synchronously
    code: 'let ranSync = false;

      const Real = Promise;

      class Spy extends Real { constructor(ex){ super((res,rej)=>{ ranSync = true; ex(res, rej); }); }
      }

      Promise = Spy;

      try { makeResolved(5); } finally { Promise = Real; }

      assert(ranSync === true, ''the Promise executor should run synchronously at construction'');

      '
  timeout: 8
