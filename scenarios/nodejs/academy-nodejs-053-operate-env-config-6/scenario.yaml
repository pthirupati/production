description: 'CONTEXT: Complete the env config coding exercise in the browser IDE.


  ENVIRONMENT: FixitLab coding practice IDE — edit solution.js, Run visible tests,
  then Check Solution.


  SYMPTOM / STARTING STATE: Coding challenge: env config. The stub in solution.js
