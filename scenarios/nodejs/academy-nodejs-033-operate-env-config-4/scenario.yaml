description: 'CONTEXT: A team operating Node.js backends needs you to resolve `nodejs: Environment Config
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Node.js application with Express routes, middleware,
  and package.json. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Node.js application is healthy enough for scheduled work on environment
  config. Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine
  environment config task safely in nodejs. Follow change control — inspect, change, verify — while working
  with env vars, secrets, and per-env settings.


  OBJECTIVE: Day-2 environment config work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 environment config work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The Node.js application is healthy enough for scheduled work on environment config. Complete
  the maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `.env` files and config loading.

    2. Write down what looks normal versus wrong or missing for environment config.

    3. Recall the core idea: env vars, secrets, and per-env settings. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `.env` files and config loading.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — config loads correctly per environment.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
