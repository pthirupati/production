title: Express Apis — Learn Lab
slug: academy-nodejs-071-learn-express-8
technology: nodejs
category: Learn
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: nodejs
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: 'CONTEXT: Complete the express coding exercise in the browser IDE.


  ENVIRONMENT: FixitLab coding practice IDE — edit solution.js, Run visible tests,
  then Check Solution.


  SYMPTOM / STARTING STATE: Coding challenge: express. The stub in solution.js is
  incomplete so tests fail until you implement it.


  OBJECTIVE: Implement the required changes so all visible and hidden tests pass.


  VERIFY: Check Solution passes all hidden tests.

  '
objectives:
- Implement the required function in solution.js
- Pass visible tests with Run
- Pass Check Solution (hidden tests)
initial_state: 'Coding challenge: express. The stub in solution.js is incomplete so
  tests fail until you implement it.'
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: routes 404, middleware never
    runs, or JSON body is undefined. This lab is about Express APIs — routes, middleware
    order, error handlers, and request parsing. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any
    theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Express APIs problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to
    the one component that owns the symptom, (3) change exactly one thing, (4) re-check.
    Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.'
- order: 3
  cost: 25
  content: WHICH TOOL — use the IDE Run button on visible tests first; read the failing
    assertion message carefully.
- order: 4
  cost: 40
  content: NARROW DOWN — implement the smallest change that satisfies one failing
    test, then re-run.
- order: 5
  cost: 60
  content: NEAR-SOLUTION — finish the function so all visible tests pass, then Check
    Solution.
summary: Complete the express apis — learn lab nodejs lab and verify success with
  the checker
estimated_minutes: 15
xp_reward: 100
prerequisites:
- Basic nodejs literacy
tags:
- do
- hands-on
- nodejs
linked_tutorial: nodejs-fundamentals
what_you_will_learn:
- Understand how Express APIs work in this lab environment
- Identify the main status and configuration signals for Express APIs
- Confirm you can read the current state confidently before changing anything
environment:
  nodes:
  - role: primary
    os: FixitLab Node.js application
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline lab environment
  pre_installed:
  - bash
  - coreutils
  - journalctl
  - nodejs
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Express Apis — Learn Lab
  description: Implement the express exercise in the browser IDE and pass all tests.
  background: 'This nodejs lab teaches systematic troubleshooting: observe, hypothesize,
    change, verify.'
  validation:
    type: script
    script: hidden_tests
    error_message: Hidden tests still failing — keep iterating in the IDE.
solution:
  summary: Implement the function so visible and hidden tests pass in the coding IDE.
  files_changed:
  - solution.js
  commands_run: []
  reference_docs: nodejs-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx`` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
coding_mode: true
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: 'Implement routePath(base, resource) → join with single ''/'' (no
    doubles). Variant 8.

    Click Run to try it, then Check Solution to grade.

    '
  files:
  - path: solution.js
    content: "function routePath(base, resource) {\n  // TODO\n}\n"
    readonly: false
  visible_tests:
  - name: basic
    code: assert(routePath('/api', 'users') === '/api/users');
  hidden_tests:
  - name: slash
    code: assert(routePath('/api/', '/users') === '/api/users');
  - name: n
    code: assert(routePath('/v8', 'x') === '/v8/x');
  timeout: 8
