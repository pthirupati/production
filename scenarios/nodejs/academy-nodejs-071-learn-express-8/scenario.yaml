description: This beginner-friendly Node.js Development lab introduces Express APIs.
  You will explore routes, middleware order, error handlers, and request parsing on
  the Node.js application. Read the environment first, then complete the guided steps
  — no prior production experience required.
objectives:
- Understand how Express APIs work in this lab environment
- Identify the main status and configuration signals for Express APIs
- Confirm you can read the current state confidently before changing anything
initial_state: The Node.js application is online with a starter Express APIs setup.
  Some pieces are intentionally incomplete so you can learn how the pieces fit together.
  Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: route definitions, server logs, and HTTP traces. Write
    down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — routes, middleware order, error handlers, and request parsing.
    Make one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-nodejs-071-learn-express-8.conf`, then click
    Check Solution.
