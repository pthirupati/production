title: Application Security — Automation Lab
slug: academy-nodejs-047-automation-security-5
technology: nodejs
category: Harden
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating Node.js backends needs you to resolve `nodejs: Application Security
  — Automation Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Node.js application with Express routes, middleware,
  and package.json. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for application security. Automate the
  boring parts without hiding important safety checks. Automation lab: remove toil around application
  security. Codify repeatable steps for input validation, headers, and authz and prove the automation
  is idempotent.


  OBJECTIVE: Day-2 application security work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 application security work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for application security. Automate the boring parts
  without hiding important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. The system remains stable for dependent teams.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
summary: Complete the application security — automation lab nodejs lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic nodejs literacy
tags:
- do
- hands-on
- nodejs
linked_tutorial: nodejs-fundamentals
what_you_will_learn:
- Day-2 application security work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
environment:
  nodes:
  - role: primary
    os: FixitLab Node.js application
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - bash
  - coreutils
  - journalctl
  - nodejs
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Application Security — Automation Lab
  description: Restore healthy behavior for Application Security — Automation Lab by investigating the
    failure, applying the smallest safe fix, and validating the outcome.
  background: 'This nodejs lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: service_active
    command: systemctl is-active nginx
    expected_status: active
    error_message: The nginx service is not active yet. Check `systemctl status nginx` and `journalctl
      -u nginx -n 50`.
solution:
  summary: The root cause is an unhealthy `nginx` service; repair it and verify active state.
  files_changed: []
  commands_run:
  - systemctl is-active nginx
  reference_docs: nodejs-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
