title: 'Node.js Development: Logging — Troubleshooting Drill'
slug: academy-nodejs-004-troubleshoot-logging
technology: Node.js Development
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: failures are silent or logs are unusable. You are
  on call for Node.js Development and must troubleshoot logging methodically — triage
  symptoms, isolate root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: failures are silent or logs are unusable'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Node.js application is degraded. Failures are silent or logs are
  unusable. Recent changes may exist around logging, but do not restart blindly —
  gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — logging config and emitted log lines.

    2. Write down what looks normal versus wrong or missing for logging.

    3. Recall the core idea: loggers, levels, handlers, and formatting. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for logging.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — logging config and emitted log lines.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — useful logs are emitted at the right levels.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-nodejs-004-troubleshoot-logging.conf`,
    then click Check Solution.'
