title: Implement a Layered Config Loader (Deep-Merge + Validate)
slug: nodejs-impl-config-deepmerge-validate
technology: nodejs
category: Build
description: 'CONTEXT: A team operating Node.js backends has raised a ticket for `Implement a Layered
  Config Loader (Deep-Merge + Validate)`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Node.js application. The architecture is a single
  lab-primary node exposing Express routes, middleware, and package.json; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement loadConfig(layers, schema): deep-merge an array of plain config
  objects (last wins; nested objects merge recursively, scalars/arrays replace) then validate against
  a schema — apply defaults, fail on missing required keys, fail on type mismatches. Return {ok:true,
  config} or {ok:false, errors:[...]} sorted by key. The stub returns undefined so tests fail.


  OBJECTIVE: Deep-merge layered objects so nested objects combine but scalars/arrays replace; Apply schema
  defaults and detect missing required keys; Type-check each value and report sorted, structured errors.
  Acceptance criteria: the change is minimal and reversible, and success means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant Express routes, middleware, and package.json), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
