solution_explanation: 'This is the "Result object" pattern at the heart of robust async/await error handling:
  instead of letting an exception propagate, you catch it and hand the caller a settled value that says
  whether it worked. Without a try/catch, a throw from fn() bubbles straight out of safeCall, so every
  caller would need its own try/catch. Wrapping the call converts a throw into { ok: false, error }, while
  the happy path returns { ok: true, value }. (In real async code you would mark the function async and
  `await fn()` inside the same try/catch — the structure is identical.)

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix safeCall(fn): it must ALWAYS return a result object (never throw).\n  success: {\
    \ ok: true,  value: <fn's return value> }\n  failure: { ok: false, error: <thrown error's .message>\
    \ }\nThe current version has no try/catch, so a throwing fn makes safeCall throw too.\nClick Run to\
    \ try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function safeCall(fn) {\n  // bug: no try/catch — if fn throws, the error escapes and safeCall\
      \ throws too,\n  // instead of returning an { ok: false, error } object.\n  const value = fn();\n\
      \  return { ok: true, value };\n}\n"
    readonly: false
  visible_tests:
  - name: success wraps the value
    code: 'const r = safeCall(() => 5);

      assert(JSON.stringify(r) === JSON.stringify({ ok: true, value: 5 }), JSON.stringify(r));

      '
  - name: failure becomes a returned error object
    code: 'const r = safeCall(() => { throw new Error(''boom''); });

      assert(r.ok === false && r.error === ''boom'', JSON.stringify(r));

      '
  hidden_tests:
  - name: never throws on a throwing fn
    code: 'let threw = false; let r = null;

      try { r = safeCall(() => { throw new Error(''nope''); }); }

      catch (e) { threw = true; }

      assert(threw === false, ''safeCall must not throw — it must return a result object'');

      assert(r.ok === false, ''expected ok:false, got '' + JSON.stringify(r));

      '
  - name: preserves object values
    code: 'const r = safeCall(() => ({ a: 1 }));

      assert(r.ok === true && r.value.a === 1, JSON.stringify(r));

      '
  - name: error message comes from the thrown error
    code: 'const r = safeCall(() => { throw new Error(''disk full''); });

      assert(r.error === ''disk full'', JSON.stringify(r));

      '
  - name: ok flag is a boolean true on success
    code: 'const r = safeCall(() => 1);

      assert(r.ok === true, JSON.stringify(r));

      '
  - name: falsy return values still succeed
    code: 'const r = safeCall(() => 0);

      assert(r.ok === true && r.value === 0, JSON.stringify(r));

      '
  timeout: 8
