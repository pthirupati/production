title: Fix the Swallowed Error in try/catch
slug: nodejs-fix-async-await-error-handling
technology: nodejs
category: Fix
description: 'CONTEXT: A team operating Node.js backends needs you to resolve `Fix the Swallowed Error
  in try/catch` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Node.js application with Express routes, middleware,
  and package.json. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: safeCall(fn) should run fn and ALWAYS return a result object — {ok:true, value}
  on success or {ok:false, error} (the thrown error''s message) on failure. The current code calls fn()
  with no try/catch, so when fn throws the error escapes and safeCall throws too instead of returning
  the error object. Add the try/catch so a throw becomes a value. safeCall(fn) should run fn and ALWAYS
  return a result object — {ok:true, value} on success or {ok:false, error} (the thrown error''s message)
  on failure — so callers never have to wrap every call in their own try/catch. The current code calls
  fn() with no try/catch, so when fn throws the error escapes and safeCall throws too instead of returning
  the error object. Add the try/catch so a throw becomes a value.


  OBJECTIVE: See that a throwing fn makes safeCall throw instead of returning an error object; Wrap the
  call in try/catch so both outcomes become a returned value; Return {ok:true,value} on success and {ok:false,error}
  on failure. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
