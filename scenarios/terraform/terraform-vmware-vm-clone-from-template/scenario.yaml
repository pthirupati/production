difficulty: medium
description: 'CONTEXT: A team operating Terraform IaC has raised a ticket for `Terraform
  → VMware: VM Clone Plan Targets the Wrong`. A customer-facing workflow is degraded
  and the on-call engineer (you) must diagnose and resolve it. Business impact: reduced
  service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace. The architecture
  is a single lab-primary node exposing HCL files, state, and plan/apply workflow;
  treat it as the production host for this incident. All tools run locally — no paid
  APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Terraform workspace. /root/iac/vsphere-vm.tf points
  the vsphere_virtual_machine

  clone at non-existent datacenter/pool/datastore/template/network names, so

  `terraform plan` fails during data-source lookups against vCenter.


  OBJECTIVE: Run terraform plan and read which vSphere data-source lookups fail; Correct
  /root/iac/vsphere-vm.tf to reference the real datacenter, resource pool, datastore,
  template, and network; Confirm the config is corrected so the clone would plan and
  apply against vCenter. Acceptance criteria: the change is minimal and reversible,
  and success means `terraform validate` includes `Success`.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it
  and use the equivalent already on the host. Make the smallest configuration change
  that moves the system toward the objective (edit the relevant HCL files, state,
  and plan/apply workflow), changing one thing at a time. Check your work continuously
  against the objective — success means `terraform validate` includes `Success`.


  VERIFY: Re-run the same check the grader uses and confirm `terraform validate` includes
  `Success`. Capture the before/after output as evidence. Success criteria: the objective''s
  healthy state holds on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately
  (restore the original config file / undo the edit / restart the affected component)
  and re-observe before trying another hypothesis. Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
