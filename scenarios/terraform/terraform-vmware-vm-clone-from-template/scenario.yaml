title: 'Terraform → VMware: VM Clone Plan Targets the Wrong'
slug: terraform-vmware-vm-clone-from-template
technology: terraform
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Terraform → VMware: VM Clone
  Plan Targets the Wrong` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Terraform workspace. /root/iac/vsphere-vm.tf points the vsphere_virtual_machine

  clone at non-existent datacenter/pool/datastore/template/network names, so

  `terraform plan` fails during data-source lookups against vCenter. CROSS-TECHNOLOGY task (Terraform
  -> VMware vSphere). A Terraform config at

  /root/iac/vsphere-vm.tf clones an app VM from a template using the

  vsphere provider, but `terraform plan` errors out: it references a datacenter,

  resource pool, datastore, and template name that do not exist in the vCenter

  inventory, and the network is wrong. Reconcile the Terraform vSphere resources

  with the real inventory so the clone plans and applies.


  OBJECTIVE: Run terraform plan and read which vSphere data-source lookups fail; Correct /root/iac/vsphere-vm.tf
  to reference the real datacenter, resource pool, datastore, template, and network; Confirm the config
  is corrected so the clone would plan and apply against vCenter. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
