description: 'CONTEXT: A team operating Terraform IaC has raised a ticket for `Provision S3 Bucket with
  Terraform`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace. The architecture is a single
  lab-primary node exposing HCL files, state, and plan/apply workflow; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Empty Terraform working directory with AWS access available. No .tf files
  exist yet.


  OBJECTIVE: Write Terraform config: the AWS provider and an aws_s3_bucket resource; Run terraform init
  and terraform validate successfully; Apply the plan and confirm the bucket is created. Acceptance criteria:
  the change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant HCL files, state, and plan/apply workflow), changing one thing at a time. Check your
  work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'Write Terraform config: the AWS provider and an aws_s3_bucket resource'
- Run terraform init and terraform validate successfully
- Apply the plan and confirm the bucket is created
initial_state: Empty Terraform working directory with AWS access available. No .tf files exist yet.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: provision S3 bucket with terraform is not behaving
    as the scenario objectives require. This lab is about provision S3 bucket with terraform — how provision
    S3 bucket with terraform behaves in a Terraform IaC environment. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For provision S3 bucket with terraform problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Execute the maintenance in small,
    reversible steps, taking a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `terraform validate` in the module directory for precise error paths.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix the reported syntax or reference error.

    2. Re-run `terraform validate` until it prints Success.

    3. Optionally `terraform plan` to confirm no new errors.


    WHY: validate catches config errors before any apply.'
