description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Provision S3 Bucket with Terraform`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Empty Terraform working directory with AWS access available. No .tf files
  exist yet. Build task: provision an S3 bucket with Terraform from scratch. Starting with no Terraform
  configuration, write the provider and an aws_s3_bucket resource (with sensible settings), validate the
  configuration, and run it through plan/apply so the bucket is created and the config is clean.


  OBJECTIVE: Write Terraform config: the AWS provider and an aws_s3_bucket resource; Run terraform init
  and terraform validate successfully; Apply the plan and confirm the bucket is created. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'Write Terraform config: the AWS provider and an aws_s3_bucket resource'
- Run terraform init and terraform validate successfully
- Apply the plan and confirm the bucket is created
initial_state: Empty Terraform working directory with AWS access available. No .tf files exist yet.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `terraform validate` in the module directory for precise error paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the reported syntax or reference error.

    2. Re-run `terraform validate` until it prints Success.

    3. Optionally `terraform plan` to confirm no new errors.


    WHY: validate catches config errors before any apply.'
