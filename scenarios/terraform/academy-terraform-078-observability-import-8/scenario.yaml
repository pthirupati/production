description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `terraform: Resource Import
  — Observability Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The system runs, but resource import lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality. Observability task: make resource import visible in logs,
  metrics, or traces. On-call should answer ''what is broken?'' quickly using signals from adopting existing
  resources into state.


  OBJECTIVE: Day-2 resource import work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `terraform validate`
  includes `Success`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 resource import work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but resource import lacks useful telemetry. Dashboards/alerts are blank
  or noisy — improve signal quality.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `terraform import`, `terraform state show`, and plan diff.

    2. Write down what looks normal versus wrong or missing for resource import.

    3. Recall the core idea: adopting existing resources into state. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `terraform import`, `terraform state show`, and plan diff.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a sensible threshold.

    3. Verify the result — imported resources show no destroy/recreate in plan.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
