title: Terraform Remote State Corrupted
slug: terraform-state-backend-corrupt
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Terraform Remote State Corrupted`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated environment with a Terraform S3 backend where S3 versioning is enabled.
  The current state file version is corrupted (truncated JSON). Previous valid versions exist in S3 object
  version history and can be restored. The Terraform remote state file in S3 is corrupted — it contains
  invalid JSON or was partially overwritten. All terraform commands fail with state parsing errors. Recover
  the state from an S3 versioned backup.


  OBJECTIVE: Identify the corruption by running terraform state list and observing the parse error; List
  S3 object versions for the state file and identify the last known-good version; Restore the previous
  version as the current state object in S3. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated environment with a Terraform S3 backend where S3 versioning is enabled. The current
