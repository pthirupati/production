title: AWS Budget Alert Not Firing
slug: aws-budget-alert-missing
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS Budget Alert Not Firing`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with a cost budget defined. The notification configuration
  is missing or has an incorrect threshold type, preventing alerts from being delivered when costs exceed
  the budget. An AWS Budgets alert is configured but never sends a notification when the monthly cost
  threshold is exceeded. The budget itself exists, but its notification is missing a valid subscriber
  (or the threshold type is wrong), so no email is delivered when actual spend crosses the limit. Repair
  the notification so cost alerts are actually sent.


  OBJECTIVE: Inspect the AWS Budget and its notification/subscriber configuration; Identify the missing/broken
  subscriber or wrong threshold type; Add a valid email subscriber so an alert fires when spend exceeds
  the threshold. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
