description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `terraform: Workspaces — Automation
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for workspaces. Automate the boring parts
  without hiding important safety checks. Automation lab: remove toil around workspaces. Codify repeatable
  steps for per-environment state isolation and prove the automation is idempotent.


  OBJECTIVE: Day-2 workspaces work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `terraform validate` includes `Success`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 workspaces work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for workspaces. Automate the boring parts without
  hiding important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `terraform workspace list` and state per workspace.

    2. Write down what looks normal versus wrong or missing for workspaces.

    3. Recall the core idea: per-environment state isolation. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `terraform workspace list` and state per workspace.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — each environment uses its own workspace/state.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
