description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS Security Group Open to
  World on RDS Port` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS RDS instance whose security group has a 5432 ingress open to the entire
  internet. The RDS security group allows 0.0.0.0/0 on port 5432, exposing the database to the internet.
  Restrict ingress to the application security group only and confirm the open-world rule is gone.


  OBJECTIVE: Find the 0.0.0.0/0 ingress on port 5432; Replace it with a source-sg restricted rule and
  apply; Verify no world-open rule remains. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
