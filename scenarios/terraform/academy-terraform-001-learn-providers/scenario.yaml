description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `terraform: Terraform Providers
  — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Terraform workspace is online with a starter Terraform providers setup.
  Some pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire
  — focus on observation. This beginner-friendly terraform lab introduces Terraform providers. You will
  explore provider blocks, versions, authentication, and resource schemas on the Terraform workspace.
  Read the environment first, then follow the guided steps — no prior production experience required.


  OBJECTIVE: Understand how Terraform providers work in this lab environment; Identify the main status
  and configuration signals for Terraform providers; Confirm you can read the current state confidently
  before changing anything. Success means `terraform validate` includes `Success`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how Terraform providers work in this lab environment
- Identify the main status and configuration signals for Terraform providers
- Confirm you can read the current state confidently before changing anything
initial_state: The Terraform workspace is online with a starter Terraform providers setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `terraform providers`, provider config, and `terraform validate`.

    2. Write down what looks normal versus wrong or missing for Terraform providers.

    3. Recall the core idea: provider blocks, versions, authentication, and resource schemas. Form one
    hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `terraform providers`, provider config, and `terraform validate`.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — provider initialization succeeds and schemas resolve.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
