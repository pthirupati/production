description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `terraform: Data Sources —
  Production Readiness` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but data sources is not production ready — missing
  guardrails, runbooks, or capacity checks. Production readiness for data sources. Harden, document, and
  validate reading existing infra, filters, and dependencies so the change is safe to run during a maintenance
  window.


  OBJECTIVE: Day-2 data sources work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `terraform validate` includes `Success`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 data sources work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but data sources is not production ready — missing guardrails,
  runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — data blocks, `terraform plan`, and `terraform console`.

    2. Write down what looks normal versus wrong or missing for data sources.

    3. Recall the core idea: reading existing infra, filters, and dependencies. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — data blocks, `terraform plan`, and `terraform console`.

    2. Apply production standards for data sources: resource limits, monitoring, access controls, and
    a written rollback step.

    3. Verify the result — data lookups resolve to the intended resource.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
