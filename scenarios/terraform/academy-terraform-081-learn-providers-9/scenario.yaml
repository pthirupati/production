description: This beginner-friendly Terraform & IaC lab introduces Terraform providers.
  You will explore provider blocks, versions, authentication, and resource schemas
  on the Terraform workspace. Read the environment first, then follow the guided steps
  — no prior production experience required.
objectives:
- Understand how Terraform providers work in this lab environment
- Identify the main status and configuration signals for Terraform providers
- Confirm you can read the current state confidently before changing anything
initial_state: The Terraform workspace is online with a starter Terraform providers
  setup. Some pieces are intentionally incomplete so you can learn how they fit together.
  Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `terraform providers`, provider config, and `terraform
    validate`.

    2. Write down what looks normal versus wrong or missing for Terraform providers.

    3. Recall the core idea: provider blocks, versions, authentication, and resource
    schemas. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Terraform providers.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `terraform providers`, provider config, and `terraform
    validate`.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — provider initialization succeeds and schemas resolve.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-terraform-081-learn-providers-9.conf`,
    then click Check Solution.'
