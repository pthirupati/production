title: EC2 Security Group Allows Unrestricted SSH
slug: aws-ec2-sg-too-open
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `EC2 Security Group Allows
  Unrestricted SSH` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with an EC2 instance and a security group that has
  a permissive inbound rule: port 22 open to all IPv4 addresses. This violates least-privilege network
  access principles. An EC2 security group has an inbound rule allowing SSH (port 22) from 0.0.0.0/0,
  exposing the instance to brute-force attempts from the entire internet. This violates least-privilege
  network access. Replace the open rule with a tightly-scoped CIDR so only trusted networks can reach
  SSH, without locking out legitimate administrators.


  OBJECTIVE: Identify the security group with the 0.0.0.0/0 SSH rule using the AWS CLI; Revoke the world-open
  SSH ingress rule; Re-authorize SSH from a specific trusted CIDR and verify the rule is scoped. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated AWS environment with an EC2 instance and a security group that has a permissive
