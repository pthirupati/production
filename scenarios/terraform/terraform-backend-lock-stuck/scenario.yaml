title: Terraform State Lock Stuck in DynamoDB
slug: terraform-backend-lock-stuck
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Terraform State Lock Stuck
  in DynamoDB` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated environment with a Terraform S3 backend and DynamoDB locking table.
  A stale lock entry exists in DynamoDB from a previous interrupted plan. All terraform plan/apply commands
  fail immediately with a state lock error. Terraform operations are failing with "Error acquiring the
  state lock" because a previous run crashed and left a stale lock entry in DynamoDB. The lock must be
  force-unlocked safely so the team can resume infrastructure changes.


  OBJECTIVE: Identify the stale DynamoDB lock entry and retrieve the LockID from the error message; Verify
  no other Terraform process is actively running before force-unlocking; Run terraform force-unlock <LockID>
  to release the stale lock. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
