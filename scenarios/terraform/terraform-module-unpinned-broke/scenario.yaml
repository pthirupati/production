description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Terraform Module Version Not
  Pinned Broke Apply` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Terraform root module referencing a child module without a version constraint;
  the latest release broke the interface. An upstream module published a breaking change and, because
  the version was unpinned, the next apply failed. Pin the module to a known-good version and confirm
  validate/plan succeeds.


  OBJECTIVE: Identify the module call without a version constraint; Pin it to the last known-good version;
  Confirm terraform init/validate succeed. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
