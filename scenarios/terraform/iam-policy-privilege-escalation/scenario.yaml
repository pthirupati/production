title: IAM Privilege Escalation via iam:PassRole
slug: aws-iam-privilege-escalation
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Terraform IaC has raised a ticket for `IAM Privilege Escalation
  via iam:PassRole`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace. The architecture is a single
  lab-primary node exposing HCL files, state, and plan/apply workflow; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: AWS environment where an IAM user policy grants iam:PassRole with a wildcard
  resource alongside ec2:RunInstances. This allows the user to attach high-privilege roles to instances
  and gain indirect admin access.

  OBJECTIVE: Identify the dangerous iam:PassRole + ec2:RunInstances combination in the IAM policy; Remove
  or scope down the iam:PassRole permission to restrict it to specific safe roles only; Confirm the user
  can no longer pass arbitrary roles to EC2 instances. Acceptance criteria: the change is minimal and
  reversible, and success means `check.sh` exits successfully.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant HCL files, state, and plan/apply workflow), changing one thing at a time. Check your
  work continuously against the objective — success means `check.sh` exits successfully.

  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
