title: IAM Privilege Escalation via iam:PassRole
slug: aws-iam-privilege-escalation
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `IAM Privilege Escalation via
  iam:PassRole` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment where an IAM user policy grants iam:PassRole with
  a wildcard resource alongside ec2:RunInstances. This allows the user to attach high-privilege roles
  to instances and gain indirect admin access. An IAM user has the iam:PassRole permission combined with
  ec2:RunInstances, allowing them to launch EC2 instances with any IAM role — including admin roles —
  and escalate their effective privileges beyond what is intended.


  OBJECTIVE: Identify the dangerous iam:PassRole + ec2:RunInstances combination in the IAM policy; Remove
  or scope down the iam:PassRole permission to restrict it to specific safe roles only; Confirm the user
  can no longer pass arbitrary roles to EC2 instances. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
