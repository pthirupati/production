description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS EKS aws-auth ConfigMap
  Misconfigured` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS EKS cluster whose aws-auth ConfigMap lacks the worker node IAM role,
  so nodes never reach Ready. Nodes are not joining the EKS cluster because the aws-auth ConfigMap is
  missing the node instance role mapping. Fix aws-auth and confirm nodes register.


  OBJECTIVE: Confirm worker nodes are not joining the cluster; Add the node instance role to aws-auth
  and apply; Verify nodes register and go Ready. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
