title: Kinesis Consumer Falling Behind
slug: aws-kinesis-consumer-lag
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Terraform IaC has raised a ticket for `Kinesis Consumer Falling
  Behind`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace. The architecture is a single
  lab-primary node exposing HCL files, state, and plan/apply workflow; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: AWS environment with a Kinesis Data Stream configured with 1 shard
  and a Lambda consumer. Producer throughput exceeds the single shard capacity of 1 MB/s, causing records
  to pile up and MillisBehindLatest to increase continuously.


  OBJECTIVE: Identify the consumer lag using CloudWatch MillisBehindLatest and GetRecords.IteratorAgeMilliseconds
  metrics; Increase the shard count on the Kinesis stream to meet throughput requirements; Optionally
  increase Lambda concurrency or batch size to improve consumer throughput. Acceptance criteria: the change
  is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant HCL files, state, and plan/apply workflow), changing one thing at a time. Check your
  work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: AWS environment with a Kinesis Data Stream configured with 1 shard and a Lambda
