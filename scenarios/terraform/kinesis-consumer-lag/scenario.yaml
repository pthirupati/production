title: Kinesis Consumer Falling Behind
slug: aws-kinesis-consumer-lag
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Kinesis Consumer Falling Behind`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with a Kinesis Data Stream configured with 1 shard
  and a Lambda consumer. Producer throughput exceeds the single shard capacity of 1 MB/s, causing records
  to pile up and MillisBehindLatest to increase continuously. A Kinesis Data Stream consumer is accumulating
  significant lag — the MillisBehindLatest metric is growing because the stream has too few shards and
  the consumer cannot process records fast enough to keep up with the producer throughput.


  OBJECTIVE: Identify the consumer lag using CloudWatch MillisBehindLatest and GetRecords.IteratorAgeMilliseconds
  metrics; Increase the shard count on the Kinesis stream to meet throughput requirements; Optionally
  increase Lambda concurrency or batch size to improve consumer throughput. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
