description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `terraform: Remote Backend
  — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around remote backend.
  Assume an auditor or pen test is next week — tighten controls with evidence. Security review: harden
  remote backend on this terraform system. Close unsafe defaults, enforce least privilege, and ensure
  remote state, locking, and workspaces cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to remote backend are removed or constrained; Access follows least
  privilege and is auditable; Security checks pass without breaking required functionality. Success means
  `terraform validate` includes `Success`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to remote backend are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around remote backend. Assume an auditor
  or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — backend config and `terraform init` output.

    2. Write down what looks normal versus wrong or missing for remote backend.

    3. Recall the core idea: remote state, locking, and workspaces. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — backend config and `terraform init` output.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — state is remote and concurrent applies are locked.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
