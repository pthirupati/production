title: Terraform Plan Shows Unexpected Resource Destruction
slug: terraform-plan-destroy-protection
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Terraform Plan Shows Unexpected
  Resource Destruction` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Terraform project where a change to a resource argument (e.g., renaming
  an RDS identifier or changing an immutable attribute) causes Terraform to plan a destroy + create cycle
  for a stateful resource. The plan output shows "-/+" destroy and recreate. Running terraform plan unexpectedly
  shows that critical resources (e.g., an RDS instance or S3 bucket) will be destroyed and recreated due
  to a configuration change. Add lifecycle prevent_destroy to protect the resources and rethink the change
  strategy.


  OBJECTIVE: Read the terraform plan output and identify which resources are scheduled for destruction;
  Add a lifecycle { prevent_destroy = true } block to the critical resource to block accidental deletion;
  Investigate whether the change can be made in-place or requires a migration strategy instead. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
