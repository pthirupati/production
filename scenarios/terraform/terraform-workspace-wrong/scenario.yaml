title: Terraform Running in Wrong Workspace
slug: terraform-workspace-wrong
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Terraform Running in Wrong
  Workspace` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Terraform project with multiple workspaces (default, staging, production).
  The shell session is currently in the production workspace. Running terraform plan would target production
  resources instead of the intended staging environment. A developer runs terraform plan while in the
  default or production workspace instead of the staging workspace, risking changes to the wrong environment.
  Switch to the correct workspace before running any infrastructure commands.


  OBJECTIVE: Run terraform workspace show to identify the currently active workspace; List available workspaces
  with terraform workspace list; Switch to the staging workspace using terraform workspace select. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
