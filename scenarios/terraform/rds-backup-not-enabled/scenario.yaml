title: RDS Automated Backups Disabled
slug: aws-rds-backup-not-enabled
difficulty: easy
category: AWS
description: An RDS instance has automated backups disabled (BackupRetentionPeriod = 0), so the database
  takes no automated snapshots and can't be point-in-time restored — a serious data-loss and compliance
  risk. Enable automated backups with a sensible retention period and backup window so the instance is
  recoverable.
initial_state: Simulated AWS environment with an RDS MySQL instance where BackupRetentionPeriod is 0.
  No automated snapshots are being taken, leaving the database unprotected against accidental data loss
  or corruption.
objectives:
- Identify the RDS instance with backups disabled using the AWS CLI
- Enable automated backups with a retention period of at least 7 days
- Set an appropriate backup window and confirm backups are enabled
lab_mode: simulation
simulation_type: aws
time_limit: 1200
max_score: 100
is_free: true
hints:
- content: 'Run: aws rds describe-db-instances --query "DBInstances[].[DBInstanceIdentifier,BackupRetentionPeriod]"
    to find instances with retention 0.'
  cost: 10
  order: 1
- content: Use aws rds modify-db-instance --db-instance-identifier <id> --backup-retention-period 7 --apply-immediately
    to enable backups.
  cost: 15
  order: 2
- content: Set --preferred-backup-window to a low-traffic time (e.g., "03:00-04:00") when enabling backups
    to minimize impact.
  cost: 20
  order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: High
