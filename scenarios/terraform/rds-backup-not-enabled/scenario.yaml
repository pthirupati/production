title: RDS Automated Backups Disabled
slug: aws-rds-backup-not-enabled
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `RDS Automated Backups Disabled`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with an RDS MySQL instance where BackupRetentionPeriod
  is 0. No automated snapshots are being taken, leaving the database unprotected against accidental data
  loss or corruption. An RDS instance has automated backups disabled (BackupRetentionPeriod = 0), so the
  database takes no automated snapshots and can''t be point-in-time restored — a serious data-loss and
  compliance risk. Enable automated backups with a sensible retention period and backup window so the
  instance is recoverable.


  OBJECTIVE: Identify the RDS instance with backups disabled using the AWS CLI; Enable automated backups
  with a retention period of at least 7 days; Set an appropriate backup window and confirm backups are
  enabled. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated AWS environment with an RDS MySQL instance where BackupRetentionPeriod is 0.
  No automated snapshots are being taken, leaving the database unprotected against accidental data loss
  or corruption.
objectives:
- Identify the RDS instance with backups disabled using the AWS CLI
- Enable automated backups with a retention period of at least 7 days
- Set an appropriate backup window and confirm backups are enabled
lab_mode: simulation
simulation_type: aws
time_limit: 1200
max_score: 100
is_free: true
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
