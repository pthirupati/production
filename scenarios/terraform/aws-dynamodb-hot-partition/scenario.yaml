description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS DynamoDB Throttling on
  Hot Partition` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS DynamoDB table experiencing ProvisionedThroughputExceeded on a hot
  partition key. A DynamoDB table is throttling reads because of a hot partition and provisioned capacity
  that is too low. Switch to on-demand (or raise capacity / improve key design) and confirm throttling
  clears.


  OBJECTIVE: Confirm the table is throttling on a hot partition; Switch to on-demand billing or raise
  capacity and apply; Verify throttle events stop. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
