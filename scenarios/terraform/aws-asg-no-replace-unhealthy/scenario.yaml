description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS Auto Scaling Group Not
  Replacing Unhealthy Instances` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS ASG using EC2-only health checks, so application-level failures (ELB)
  never trigger replacement. An Auto Scaling Group is not replacing instances that fail ELB health checks
  because the ASG health check type is set to EC2 only. Switch to ELB health checks and confirm unhealthy
  instances get replaced.


  OBJECTIVE: Confirm unhealthy instances are not being replaced; Set the ASG health_check_type to ELB
  and apply; Verify failing instances are terminated and replaced. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
