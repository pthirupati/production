title: AWS CLI AccessDenied Error
slug: aws-cli-permissions-error
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS CLI AccessDenied Error`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with an IAM user configured in the CLI profile.
  The user has no inline or managed policies granting the necessary actions, causing all resource API
  calls to fail with AccessDenied. An IAM user receives an AccessDenied error when running AWS CLI commands
  against S3 and EC2. The user exists but is missing the required IAM policy permissions needed to perform
  the intended operations.


  OBJECTIVE: Identify which IAM actions are being denied using the CLI error output or IAM policy simulator;
  Attach or create an IAM policy granting the minimum required permissions; Confirm the CLI commands succeed
  after the policy change. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
