jira_priority: Low
description: This beginner-friendly Terraform & IaC lab introduces Terraform providers.
  You will explore provider blocks, versions, authentication, and resource schemas
  on the Terraform workspace. Read the environment first, then complete the guided
  steps — no prior production experience required.
objectives:
- Understand how Terraform providers work in this lab environment
- Identify the main status and configuration signals for Terraform providers
- Confirm you can read the current state confidently before changing anything
initial_state: The Terraform workspace is online with a starter Terraform providers
  setup. Some pieces are intentionally incomplete so you can learn how the pieces
  fit together. Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: `terraform providers`, provider config, and `terraform
    validate`. Write down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — provider blocks, versions, authentication, and resource schemas.
    Make one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-terraform-011-learn-providers-2.conf`, then
    click Check Solution.
