title: Lambda Function Timing Out
slug: aws-lambda-timeout
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Lambda Function Timing Out`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with a Lambda function configured with a 3-second
  timeout and 128 MB memory. Processing a large S3 object or complex computation consistently exceeds
  the timeout, resulting in Task timed out errors in CloudWatch Logs. A Lambda function is timing out
  when processing large payloads. The function timeout is set to the default 3 seconds, which is insufficient
  for the workload, and the memory allocation is too low, slowing down execution further.


  OBJECTIVE: Review the Lambda configuration and CloudWatch Logs to confirm timeout errors; Increase the
  function timeout to an appropriate value (e.g., 60 seconds); Increase memory allocation to improve CPU
  proportioning and reduce execution time. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated AWS environment with a Lambda function configured with a 3-second timeout and
