description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS Lambda Hitting Concurrency
  Limit` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS Lambda function whose reserved concurrency is far below demand, causing
  Throttles and 429s. A Lambda function is being throttled because reserved concurrency is set too low
  for the traffic. Raise reserved/ provisioned concurrency appropriately and confirm throttles stop.


  OBJECTIVE: Confirm the function is throttling on concurrency; Adjust reserved/provisioned concurrency
  and apply; Verify throttle metrics drop to zero. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
