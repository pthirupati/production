description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `terraform: Terraform State
  — Build From Scratch` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Terraform workspace is ready but Terraform state is not configured yet.
  Required tools may already be installed; your job is to create the configuration and bring the capability
  online. Build Terraform state from scratch in this terraform lab. You start from a minimal environment
  and must produce a working configuration that demonstrates local vs remote state, locking, drift, and
  resource addressing. Plan, implement, then prove it works.


  OBJECTIVE: A working Terraform state setup must exist by the end of this lab; Configuration should follow
  team conventions and be easy to audit; The result should pass validation without manual cleanup. Success
  means `terraform validate` includes `Success`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working Terraform state setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The Terraform workspace is ready but Terraform state is not configured yet. Required tools
  may already be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `terraform state list`, `terraform show`, and backend config.

    2. Write down what looks normal versus wrong or missing for Terraform state.

    3. Recall the core idea: local vs remote state, locking, drift, and resource addressing. Form one
    hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `terraform state list`, `terraform show`, and backend config.

    2. Create the smallest working slice of Terraform state first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — state accurately reflects deployed resources.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
