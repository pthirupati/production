title: EKS Worker Node Fails to Join Cluster
slug: aws-eks-node-not-joining
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Terraform IaC has raised a ticket for `EKS Worker Node Fails to
  Join Cluster`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace. The architecture is a single
  lab-primary node exposing HCL files, state, and plan/apply workflow; treat it as the production host
  for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: AWS environment with an EKS cluster and a managed node group. The node group
  IAM role lacks the AmazonEKSWorkerNodePolicy, AmazonEKS_CNI_Policy, or AmazonEC2ContainerRegistryReadOnly
  policies, or the role ARN is absent from the aws-auth ConfigMap.


  OBJECTIVE: Inspect the node group IAM role and identify the missing managed policies; Attach the required
  policies to the node group IAM role; Verify the aws-auth ConfigMap includes the node role ARN and nodes
  join the cluster. Acceptance criteria: the change is minimal and reversible, and success means `check.sh`
  exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant HCL files, state, and plan/apply workflow), changing one thing at a time. Check your
  work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
