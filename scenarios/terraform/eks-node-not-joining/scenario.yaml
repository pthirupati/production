title: EKS Worker Node Fails to Join Cluster
slug: aws-eks-node-not-joining
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `EKS Worker Node Fails to Join
  Cluster` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with an EKS cluster and a managed node group. The
  node group IAM role lacks the AmazonEKSWorkerNodePolicy, AmazonEKS_CNI_Policy, or AmazonEC2ContainerRegistryReadOnly
  policies, or the role ARN is absent from the aws-auth ConfigMap. EKS worker nodes in a managed node
  group are not joining the cluster. The nodes launch but remain in a NotReady state because the node
  group IAM role is missing the required policies or the aws-auth ConfigMap does not map the role correctly.


  OBJECTIVE: Inspect the node group IAM role and identify the missing managed policies; Attach the required
  policies to the node group IAM role; Verify the aws-auth ConfigMap includes the node role ARN and nodes
  join the cluster. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
