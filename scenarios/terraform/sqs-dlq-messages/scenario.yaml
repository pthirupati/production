title: SQS Dead-Letter Queue Accumulating Messages
slug: aws-sqs-dlq-messages
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `SQS Dead-Letter Queue Accumulating
  Messages` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with an SQS standard queue, a DLQ, and a Lambda
  consumer. The Lambda function fails processing due to a missing environment variable or malformed message,
  causing messages to be retried and eventually moved to the DLQ. An SQS queue is continuously sending
  messages to its dead-letter queue (DLQ) because the consumer Lambda function is throwing unhandled exceptions
  and exhausting maxReceiveCount. Diagnose the root cause and fix the processing failure.


  OBJECTIVE: Inspect the DLQ message bodies to understand why processing is failing; Fix the Lambda function
  configuration or code that causes the processing exception; Redrive DLQ messages back to the source
  queue and confirm successful processing. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
