description: 'Security review: harden remote backend on this Terraform & IaC system.
  Close unsafe defaults, enforce least privilege, and ensure remote state, locking,
  and workspaces cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to remote backend are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around remote backend.
  Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — backend config and `terraform init` output.

    2. Write down what looks normal versus wrong or missing for remote backend.

    3. Recall the core idea: remote state, locking, and workspaces. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for remote backend.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — backend config and `terraform init` output.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit
    access the workload actually needs.

    3. Verify the result — state is remote and concurrent applies are locked.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-terraform-036-security-remote-backend-4.conf`,
    then click Check Solution.'
