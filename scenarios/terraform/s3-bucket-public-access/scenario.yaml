title: S3 Bucket Publicly Readable
slug: aws-s3-public-access
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `S3 Bucket Publicly Readable`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with an S3 bucket containing sensitive data. The
  bucket has BlockPublicAcls and BlockPublicPolicy set to false, and a permissive bucket policy grants
  s3:GetObject to Principal: "*". An S3 bucket is publicly readable because the Block Public Access settings
  are disabled and a bucket policy or ACL grants s3:GetObject to everyone. Restrict access by enabling
  Block Public Access and removing public grants.


  OBJECTIVE: Identify the public S3 bucket using the CLI and review its public access settings and bucket
  policy; Enable all four Block Public Access settings on the bucket; Remove any bucket policy or ACL
  entries that grant public read access. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated AWS environment with an S3 bucket containing sensitive data. The bucket has
