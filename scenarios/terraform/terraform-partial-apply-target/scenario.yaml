description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Terraform Resource Targeting
  Left Partial State` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Terraform workspace where a -target apply left the state inconsistent; a
  normal plan now shows surprising changes. Someone ran terraform apply -target on one resource during
  an incident and now state is partially applied and inconsistent with code. Reconcile the drift with
  a full plan/apply and confirm convergence.


  OBJECTIVE: Confirm state is partial after the -target apply; Run a full terraform plan and reconcile
  the drift; Apply and confirm terraform plan reports no changes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
