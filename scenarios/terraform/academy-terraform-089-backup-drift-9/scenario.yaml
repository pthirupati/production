description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `terraform: Configuration Drift
  — Backup and Recovery` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for configuration drift. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for configuration
  drift. Ensure backups run on schedule, retention is correct, and you can restore detecting and reconciling
  out-of-band changes within the lab RTO.


  OBJECTIVE: Backup coverage for configuration drift is complete and restorable; Retention and encryption
  meet the stated policy; A restore drill proves data integrity. Success means `terraform validate` includes
  `Success`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for configuration drift is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for configuration drift. Leadership wants
  proof that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `terraform plan -refresh-only` and state.

    2. Write down what looks normal versus wrong or missing for configuration drift.

    3. Recall the core idea: detecting and reconciling out-of-band changes. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `terraform plan -refresh-only` and state.

    2. Repair or run the backup job, then perform a controlled restore into a scratch location to prove
    it works.

    3. Verify the result — plan is clean after reconciling drift.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
