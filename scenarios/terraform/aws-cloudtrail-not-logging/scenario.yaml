description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS CloudTrail Not Logging
  to S3` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS CloudTrail trail whose target S3 bucket policy blocks cloudtrail.amazonaws.com,
  so no logs are written. CloudTrail is enabled but not delivering logs because the S3 bucket policy denies
  the CloudTrail service principal. Fix the bucket policy and confirm log delivery resumes.


  OBJECTIVE: Confirm CloudTrail log delivery is failing; Fix the S3 bucket policy for the CloudTrail principal
  and apply; Verify logs are delivered to the bucket. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
