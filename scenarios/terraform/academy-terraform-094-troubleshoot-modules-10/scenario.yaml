title: 'Terraform & IaC: Terraform Modules — Troubleshooting Drill'
slug: academy-terraform-094-troubleshoot-modules-10
technology: Terraform & IaC
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: terraform
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: module upgrades break dependents or outputs changed
  unexpectedly. You are on call for Terraform & IaC and must troubleshoot Terraform
  modules methodically — triage symptoms, isolate root cause, apply the smallest safe
  fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: module upgrades break dependents or outputs changed
  unexpectedly'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Terraform workspace is degraded. Module upgrades break dependents
  or outputs changed unexpectedly. Recent changes may exist around Terraform modules,
  but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — module blocks, `terraform get`, and child module
    outputs.

    2. Write down what looks normal versus wrong or missing for Terraform modules.

    3. Recall the core idea: module sources, versions, outputs, and composition. Form
    one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Terraform modules.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — module blocks, `terraform get`, and child module
    outputs.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — module inputs/outputs match the wrapper and plans are clean.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-terraform-094-troubleshoot-modules-10.conf`,
    then click Check Solution.'
