description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Terraform Remote State Data
  Source Empty` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A downstream Terraform config whose terraform_remote_state data source points
  at the wrong S3 key/workspace. A terraform_remote_state data source returns empty outputs, so dependent
  resources get null values and apply fails. Fix the backend config/key path and verify outputs resolve.


  OBJECTIVE: Identify why the remote_state data source returns empty outputs; Correct the bucket/key/workspace
  in the data source; Confirm the upstream outputs are populated. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
