simulation_type: terraform
time_limit: 1800
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: terraform provider version constraint conflict
    is not behaving as the scenario objectives require. This lab is about terraform provider version constraint
    conflict — how terraform provider version constraint conflict behaves in a Terraform IaC environment.
    Read the objectives and the current state, and note precisely what looks wrong versus healthy before
    you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For terraform provider version constraint conflict problems the reliable
    method is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `terraform validate` in the module directory for precise error paths.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix the reported syntax or reference error.

    2. Re-run `terraform validate` until it prints Success.

    3. Optionally `terraform plan` to confirm no new errors.


    WHY: validate catches config errors before any apply.'
