title: ALB Showing All Targets Unhealthy
slug: aws-elb-unhealthy-targets
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `ALB Showing All Targets Unhealthy`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with an ALB and a target group. The health check
  is configured to ping /healthcheck but the app only serves /health, and the EC2 security group blocks
  port 8080 from the ALB security group. An Application Load Balancer reports all registered targets as
  unhealthy. The health check path does not exist on the application, and the target security group does
  not allow traffic from the ALB on the service port.


  OBJECTIVE: Inspect the target group health check configuration and identify the incorrect path; Fix
  the health check path to match the application endpoint; Update the EC2 instance security group to allow
  inbound traffic from the ALB on the correct port. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
