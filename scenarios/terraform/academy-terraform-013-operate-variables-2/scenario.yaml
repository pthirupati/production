hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — variables.tf, *.tfvars, and `terraform console`.

    2. Write down what looks normal versus wrong or missing for Terraform variables.

    3. Recall the core idea: input variables, defaults, validation, and tfvars layering. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — variables.tf, *.tfvars, and `terraform console`.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — the correct tfvars set is used and `terraform validate` passes.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
