description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `terraform: Terraform Variables
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Terraform workspace is healthy enough for scheduled work on Terraform
  variables. Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine
  Terraform variables task safely in terraform. Follow change control — inspect, change, verify — while
  working with input variables, defaults, validation, and tfvars layering.


  OBJECTIVE: Day-2 Terraform variables work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `terraform validate`
  includes `Success`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 Terraform variables work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The Terraform workspace is healthy enough for scheduled work on Terraform variables. Complete
