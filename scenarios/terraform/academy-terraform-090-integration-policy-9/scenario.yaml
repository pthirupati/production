description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `terraform: Policy As Code
  — Integration Lab` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for policy as code.
  Downstream consumers are waiting on this integration path. Integration lab: connect policy as code with
  an adjacent platform in the terraform stack. Validate authentication, data handoff, and failure behavior
  for guardrails, validation, and sentinel/OPA checks.


  OBJECTIVE: policy as code is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `terraform
  validate` includes `Success`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- policy as code is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for policy as code. Downstream consumers
  are waiting on this integration path.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `terraform validate` in the module directory for precise error paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `terraform init` if providers are missing.

    2. `terraform validate` — read file:line references.

    3. Cross-check variable names and resource blocks against the error.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the reported syntax or reference error.

    2. Re-run `terraform validate` until it prints Success.

    3. Optionally `terraform plan` to confirm no new errors.


    WHY: validate catches config errors before any apply.'
