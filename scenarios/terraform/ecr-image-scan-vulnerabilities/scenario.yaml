title: ECR Image HIGH Severity Vulnerabilities
slug: aws-ecr-image-vulnerabilities
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `ECR Image HIGH Severity Vulnerabilities`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with an ECR repository containing an image built
  on an outdated base image (e.g., ubuntu:18.04). Image scanning is enabled and reports multiple HIGH
  severity vulnerabilities, causing downstream deployment checks to fail. An ECR image scan reports HIGH
  severity CVEs in the base image, and the deployment pipeline is blocked by a policy that rejects images
  with HIGH or CRITICAL findings. Remediate by updating the base image to a patched version.


  OBJECTIVE: Run an ECR image scan and review the HIGH severity CVE findings; Update the Dockerfile base
  image to a patched version and push a new image to ECR; Confirm the new image scan shows no HIGH or
  CRITICAL findings. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated AWS environment with an ECR repository containing an image built on an outdated
  base image (e.g., ubuntu:18.04). Image scanning is enabled and reports multiple HIGH severity vulnerabilities,
  causing downstream deployment checks to fail.
objectives:
- Run an ECR image scan and review the HIGH severity CVE findings
- Update the Dockerfile base image to a patched version and push a new image to ECR
- Confirm the new image scan shows no HIGH or CRITICAL findings
lab_mode: simulation
simulation_type: aws
time_limit: 1800
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
