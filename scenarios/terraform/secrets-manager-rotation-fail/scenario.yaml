title: Secrets Manager Rotation Lambda Failing
slug: aws-secrets-rotation-fail
difficulty: medium
category: AWS
description: 'Secrets Manager automatic rotation is failing because the rotation Lambda function lacks the necessary IAM permissions to call secretsmanager:RotateSecret and secretsmanager:PutSecretValue, leaving the secret stale and unrotated.'
initial_state: 'Simulated AWS environment with a Secrets Manager secret configured for automatic rotation via a Lambda function. The Lambda execution role is missing the required Secrets Manager permissions, causing rotation to fail with AccessDenied errors in CloudWatch Logs.'
objectives:
  - Check CloudWatch Logs for the rotation Lambda and identify the AccessDenied error
  - Add the missing secretsmanager permissions to the Lambda execution role
  - Trigger a manual rotation and confirm it completes successfully
lab_mode: simulation
simulation_type: aws
time_limit: 1800
max_score: 100
is_free: false
hints:
  - content: 'Run: aws secretsmanager describe-secret --secret-id <name> to see the rotation Lambda ARN and last rotation status.'
    cost: 10
    order: 1
  - content: 'Check the Lambda execution role with aws iam list-attached-role-policies. Attach or inline a policy granting secretsmanager:GetSecretValue, PutSecretValue, DescribeSecret, and UpdateSecret.'
    cost: 15
    order: 2
  - content: 'Trigger manual rotation: aws secretsmanager rotate-secret --secret-id <name> and then poll describe-secret to confirm RotationEnabled and LastRotatedDate update.'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: High
