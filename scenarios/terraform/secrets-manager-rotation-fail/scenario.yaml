title: Secrets Manager Rotation Lambda Failing
slug: aws-secrets-rotation-fail
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Secrets Manager Rotation Lambda
  Failing` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with a Secrets Manager secret configured for automatic
  rotation via a Lambda function. The Lambda execution role is missing the required Secrets Manager permissions,
  causing rotation to fail with AccessDenied errors in CloudWatch Logs. Secrets Manager automatic rotation
  is failing because the rotation Lambda function lacks the necessary IAM permissions to call secretsmanager:RotateSecret
  and secretsmanager:PutSecretValue, leaving the secret stale and unrotated.


  OBJECTIVE: Check CloudWatch Logs for the rotation Lambda and identify the AccessDenied error; Add the
  missing secretsmanager permissions to the Lambda execution role; Trigger a manual rotation and confirm
  it completes successfully. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
