description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS Secrets Manager Rotation
  Lambda Failing` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS Secrets Manager secret whose rotation Lambda cannot reach the DB (missing
  VPC config/SG), so rotation errors. A Secrets Manager rotation is failing because the rotation Lambda
  lacks VPC access to the database. Fix the Lambda networking/permissions and confirm rotation succeeds.


  OBJECTIVE: Confirm rotation is failing; Give the rotation Lambda the right VPC/SG/permissions and apply;
  Verify a rotation completes successfully. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
