description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Terraform Output Sensitive
  Value Leaked in CI Logs` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Terraform output for a generated credential missing sensitive = true, leaking
  it in plan/apply logs. A database password is showing up in plaintext in CI logs because the Terraform
  output is not marked sensitive. Mark the output sensitive, scrub the exposed value, and verify terraform
  output no longer prints the secret.


  OBJECTIVE: Find the output printing the secret in CI logs; Add sensitive = true and confirm it is redacted;
  Verify terraform output shows (sensitive value). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
