description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Terraform count to for_each
  Migration Drift` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Terraform module migrated from count to for_each; plan wants to replace
  all instances because state still uses numeric indices. Switching a resource from count to for_each
  caused Terraform to want to destroy and recreate every instance because addresses changed from [0],[1]
  to [key]. Use state mv to map indices to keys so the migration is non-destructive.


  OBJECTIVE: Confirm plan wants to recreate all instances after the migration; Map each indexed address
  to its keyed address with terraform state mv; Verify plan shows no recreation after the moves. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
