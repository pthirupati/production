description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS VPC Peering Route Missing`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS VPC peering connection that is active but missing route table entries
  for the peer CIDR on both sides. Two VPCs are peered but traffic does not flow because the route tables
  lack routes to the peer CIDR. Add the peering routes via Terraform and confirm cross-VPC connectivity.


  OBJECTIVE: Confirm the peering is active but routes are missing; Add routes to the peer CIDR via the
  peering connection and apply; Verify cross-VPC traffic flows. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
