description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS KMS Key Policy Locked
  Out Admins` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS KMS customer-managed key whose policy no longer grants the account
  root, so it cannot be administered normally. A KMS key policy was edited and accidentally removed the
  account root principal, risking lockout. Restore a safe key policy granting root and the admin role,
  and confirm access.


  OBJECTIVE: Confirm the key policy is missing the root/admin principal; Restore a safe key policy and
  apply; Verify the key can be administered again. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
