description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS ECS Service Stuck Deploying`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS ECS service whose new task definition fails container health checks,
  so the deployment never stabilizes. An ECS service deployment is stuck because the task definition references
  an image tag that fails its container health check. Fix the task def/health check and confirm the service
  reaches a steady state.


  OBJECTIVE: Confirm the ECS deployment is stuck (PRIMARY not steady); Fix the task definition image/health
  check and apply; Verify the service reaches steady state. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: An AWS ECS service whose new task definition fails container health checks, so the deployment
  never stabilizes.
objectives:
- Confirm the ECS deployment is stuck (PRIMARY not steady)
- Fix the task definition image/health check and apply
- Verify the service reaches steady state
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
