title: CloudWatch Alarm Never Triggers
slug: aws-cloudwatch-alarm-missing
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `CloudWatch Alarm Never Triggers`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with a CloudWatch alarm attached to an EC2 instance
  metric. The alarm threshold is set to an unreachable value (e.g., 99999) or the metric name does not
  match the actual emitted metric, so ALARM is never triggered. A CloudWatch alarm is defined but never
  transitions to ALARM even when the monitored metric clearly exceeds the threshold. The alarm references
  the wrong metric name/namespace, or has a misconfigured threshold/period/evaluation window, so it sits
  in OK or INSUFFICIENT_DATA. Correct the alarm so it reflects real resource utilization and fires when
  it should.


  OBJECTIVE: Determine why the alarm stays in OK / INSUFFICIENT_DATA; Identify the wrong metric name,
  threshold, period, or evaluation settings; Fix the alarm so it transitions to ALARM when the metric
  breaches the threshold. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
