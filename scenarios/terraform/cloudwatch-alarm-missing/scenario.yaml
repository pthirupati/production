title: CloudWatch Alarm Never Triggers
slug: aws-cloudwatch-alarm-missing
difficulty: easy
category: AWS
description: A CloudWatch alarm is defined but never transitions to ALARM even when the monitored metric
  clearly exceeds the threshold. The alarm references the wrong metric name/namespace, or has a misconfigured
  threshold/period/evaluation window, so it sits in OK or INSUFFICIENT_DATA. Correct the alarm so it reflects
  real resource utilization and fires when it should.
initial_state: Simulated AWS environment with a CloudWatch alarm attached to an EC2 instance metric. The
  alarm threshold is set to an unreachable value (e.g., 99999) or the metric name does not match the actual
  emitted metric, so ALARM is never triggered.
objectives:
- Determine why the alarm stays in OK / INSUFFICIENT_DATA
- Identify the wrong metric name, threshold, period, or evaluation settings
- Fix the alarm so it transitions to ALARM when the metric breaches the threshold
lab_mode: simulation
simulation_type: aws
time_limit: 1200
max_score: 100
is_free: true
hints:
- content: 'Run: aws cloudwatch describe-alarms and check the MetricName, Threshold, and ComparisonOperator
    fields.'
  cost: 10
  order: 1
- content: Use aws cloudwatch list-metrics to find the exact MetricName as emitted by the resource, then
    update the alarm to match.
  cost: 15
  order: 2
- content: 'Run: aws cloudwatch put-metric-alarm with corrected parameters. Ensure EvaluationPeriods and
    Period are reasonable (e.g., 1 period of 60 seconds).'
  cost: 20
  order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Low
