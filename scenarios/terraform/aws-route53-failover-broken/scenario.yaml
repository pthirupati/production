description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `AWS Route53 Health Check Failing
  Failover` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An AWS Route53 failover record whose health check targets a path that always
  404s, so failover never triggers. A Route53 failover routing policy is not failing over because the
  health check endpoint path is wrong. Fix the health check and confirm DNS fails over to the secondary
  when primary is unhealthy.


  OBJECTIVE: Identify why the Route53 health check stays unhealthy/healthy incorrectly; Correct the health
  check resource path/port and apply; Verify failover behaves correctly. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
