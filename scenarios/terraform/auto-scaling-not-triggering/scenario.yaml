title: Auto Scaling Group Not Triggering
slug: aws-autoscaling-not-triggering
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `Auto Scaling Group Not Triggering`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with an Auto Scaling group, a CloudWatch alarm,
  and EC2 instances. The alarm metric namespace or dimension is misconfigured, preventing it from detecting
  high CPU and triggering scale-out. An Auto Scaling group is not launching new instances despite CPU
  utilization spiking above the target threshold. The CloudWatch alarm exists but never transitions to
  ALARM state, leaving the application under-provisioned during peak load.


  OBJECTIVE: Inspect the CloudWatch alarm configuration and identify why it never enters ALARM state;
  Fix the alarm metric namespace, dimension, or threshold so it correctly monitors ASG CPU utilization;
  Verify the Auto Scaling policy is linked to the corrected alarm. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
