title: EC2 Private Subnet Has No Internet Access
slug: aws-vpc-routing-broken
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Terraform IaC needs you to resolve `EC2 Private Subnet Has No
  Internet Access` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Terraform workspace with HCL files, state, and plan/apply
  workflow. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated AWS environment with a VPC containing public and private subnets,
  an Internet Gateway, and a NAT Gateway. The private subnet route table has no entry for 0.0.0.0/0 pointing
  to the NAT Gateway, so outbound internet traffic from private EC2 instances is dropped. An EC2 instance
  in a private subnet cannot reach the internet to download packages or call external APIs. The route
  table is missing a route to a NAT Gateway, or the NAT Gateway itself is misconfigured or in a wrong
  subnet.


  OBJECTIVE: Identify the private subnet route table and confirm the missing 0.0.0.0/0 route; Verify the
  NAT Gateway is in a public subnet and has an Elastic IP; {''Add the missing route'': ''destination 0.0.0.0/0,
  target the NAT Gateway ID''}. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Simulated AWS environment with a VPC containing public and private subnets, an Internet
  Gateway, and a NAT Gateway. The private subnet route table has no entry for 0.0.0.0/0 pointing to the
  NAT Gateway, so outbound internet traffic from private EC2 instances is dropped.
objectives:
- Identify the private subnet route table and confirm the missing 0.0.0.0/0 route
- Verify the NAT Gateway is in a public subnet and has an Elastic IP
- Add the missing route: destination 0.0.0.0/0, target the NAT Gateway ID
- Confirm the EC2 instance can reach the internet (e.g., curl an external URL)
