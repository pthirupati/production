description: 'CONTEXT: A team operating enterprise data center operations has raised a ticket for `Physical
  Data Center (DCIM): Fiber — Observability Practice`. A customer-facing workflow is degraded and the
  on-call engineer (you) must diagnose and resolve it. Business impact: reduced service reliability and
  blocked users until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline data center practice floor. The architecture is
  a single lab-primary node exposing racks, PDUs, cooling, cabling, and physical servers; treat it as
  the production host for this incident. All tools run locally — no paid APIs or external cloud calls
  are required.

  SYMPTOM / STARTING STATE: The `crond` service is not running (`systemctl is-active crond` → inactive/failed).
  Dependent Observability Practice tasks cannot succeed until the unit is healthy again. Service operations
  lab. The `crond` systemd unit is **failed/inactive** on this host — a realistic fault for Observability
  Practice workflows that depend on it. Diagnose with `systemctl status crond` and journal logs, apply
  the smallest reliable fix, then verify with `systemctl is-active crond`.

  OBJECTIVE: The `crond` service is active (running); `systemctl is-active crond`` returns active; The
  fix survives a status re-check (no marker files). Acceptance criteria: the change is minimal and reversible,
  and success means `systemctl is-active crond` returns active.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant racks, PDUs, cooling, cabling, and physical servers), changing one thing at a time.
  Check your work continuously against the objective — success means `systemctl is-active crond` returns
  active.

  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active crond` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- The `crond` service is active (running)
- '`systemctl is-active crond`` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `crond` service is not running (`systemctl is-active crond` → inactive/failed). Dependent
  Observability Practice tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: Fiber is misconfigured and dependent workflows
    are failing. This lab is about Fiber — how fiber fits into enterprise data center operations. Read
    the objectives and the current state, and note precisely what looks wrong versus healthy before you
    form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Fiber problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Add or fix the exporter / dashboard / alert with clear names,
    labels, and a sensible threshold.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status crond` and `journalctl -u crond -n 50 --no-pager` before changing anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart crond` and confirm `systemctl is-active crond` succeeds.

    WHY: the grader checks real service state, not marker files.'
