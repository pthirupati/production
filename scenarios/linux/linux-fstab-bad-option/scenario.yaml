description: 'CONTEXT: A team operating Linux administration needs you to resolve `Bad fstab Option Blocks
  Mount` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Linux host whose /etc/fstab has an invalid mount option, breaking mount
  -a. A filesystem won''t mount because an invalid mount option in /etc/fstab causes mount -a to error.
  Fix the option and confirm the file is corrected.


  OBJECTIVE: Confirm mount -a fails on the bad option; Correct the fstab option; Verify the fstab is corrected.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
