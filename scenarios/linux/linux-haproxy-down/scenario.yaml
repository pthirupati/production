description: 'CONTEXT: A team operating Linux administration has raised a ticket for `HAProxy Load Balancer
  Down`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture is a single
  lab-primary node exposing terminal and config files under /etc and /var; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: A Linux host where the haproxy service is failed, taking the load balancer
  offline.

  OBJECTIVE: Confirm haproxy is down; Fix the config and start haproxy; Verify haproxy is active. Acceptance
  criteria: the change is minimal and reversible, and success means `systemctl is-active haproxy``` returns
  active.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant terminal and config files under /etc and /var), changing one thing at a time. Check
  your work continuously against the objective — success means `systemctl is-active haproxy``` returns
  active.

  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active haproxy`` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A Linux host where the haproxy service is failed, taking the load balancer offline.
objectives:
- Confirm haproxy is down
- Fix the config and start haproxy
- Verify haproxy is active
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: HAProxy load balancer down is not behaving as
    the scenario objectives require. This lab is about HAProxy load balancer down — how HAProxy load balancer
    down behaves in a Linux administration environment. Read the objectives and the current state, and
    note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For HAProxy load balancer down problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one component that owns
    the symptom, (3) change exactly one thing, (4) re-check. Create the smallest working slice of HAProxy
    load balancer down first, validate it, then add the remaining pieces one at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status haproxy` and `journalctl -u haproxy -n 50 --no-pager` before changing
    anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status haproxy` — note Active/Failed and the last log lines.

    2. Read `journalctl -u haproxy -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart haproxy` and confirm `systemctl is-active haproxy` succeeds.

    WHY: the grader checks real service state, not marker files.'
