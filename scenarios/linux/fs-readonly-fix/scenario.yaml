title: Filesystem Mounted Read-Only After Disk Errors
slug: linux-fs-readonly-fix
difficulty: medium
category: Build
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Filesystem Mounted
  Read-Only After Disk Errors` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where the kernel flipped /data to read-only after I/O errors.
  Writes fail; the filesystem on /dev/sdb1 needs checking and a clean read-write remount. The /data filesystem
  was automatically remounted read-only by the kernel after it detected I/O errors on the underlying block
  device — a safety measure to prevent further corruption. Applications now fail with "Read-only file
  system". Confirm the cause, repair the filesystem, remount it read-write, and harden the fstab entry
  against future boot hangs.


  OBJECTIVE: Identify the read-only condition via mount and dmesg; Unmount cleanly and repair with fsck.ext4
  -y; Remount read-write, verify writes, and add nofail to the fstab entry. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Linux server where the kernel flipped /data to read-only after I/O errors. Writes fail;
  the filesystem on /dev/sdb1 needs checking and a clean read-write remount.
objectives:
- Identify the read-only condition via mount and dmesg
- Unmount cleanly and repair with fsck.ext4 -y
- Remount read-write, verify writes, and add nofail to the fstab entry
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
