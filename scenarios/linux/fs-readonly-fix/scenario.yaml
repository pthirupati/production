title: Filesystem Mounted Read-Only After Disk Errors
slug: linux-fs-readonly-fix
difficulty: medium
category: Linux Administration
description: The /data filesystem was automatically remounted read-only by the kernel after it detected
  I/O errors on the underlying block device — a safety measure to prevent further corruption. Applications
  now fail with "Read-only file system". Confirm the cause, repair the filesystem, remount it read-write,
  and harden the fstab entry against future boot hangs.
initial_state: Linux server where the kernel flipped /data to read-only after I/O errors. Writes fail;
  the filesystem on /dev/sdb1 needs checking and a clean read-write remount.
objectives:
- Identify the read-only condition via mount and dmesg
- Unmount cleanly and repair with fsck.ext4 -y
- Remount read-write, verify writes, and add nofail to the fstab entry
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Confirm it: `mount | grep /data` shows `ro`, and `dmesg | tail -30` shows EXT4 I/O errors
    and the "Remounting filesystem read-only" message.'
- order: 2
  cost: 20
  content: 'Unmount and check the device: `umount /data` then `fsck.ext4 -y /dev/sdb1` to auto-repair
    errors.'
- order: 3
  cost: 30
  content: 'Remount rw and validate: `mount /data && touch /data/test`. Add `nofail` to the /data line
    in /etc/fstab so a future device error doesn''t block boot.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
