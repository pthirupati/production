description: Topic lab for Build Lab. The Lab Server has a planted configuration fault under `/opt` (and/or
  `/etc`). Diagnose from evidence, apply the smallest reliable fix, then verify with the documented checker
  (`grep -q FIXED-OK /opt/fixitlab/academy/academy-linux-002-build-permissions-acl.conf` succeeds after
  the documented fix).
objectives:
- Identify the planted configuration fault from evidence
- Apply the minimal documented remediation
- '`grep -q FIXED-OK /opt/fixitlab/academy/academy-linux-002-build-permissions-acl.conf` succeeds after
  the documented fix'
initial_state: A topic-specific configuration fault is present on this host; dependent workflows fail
  until repaired.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: applications fail with permission denied even
    though the user exists. This lab is about file permissions and ACLs — owner/group/other bits, ACL
    entries, and default ACL inheritance. Read the objectives and the current state, and note precisely
    what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For file permissions and ACLs problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one component that owns
    the symptom, (3) change exactly one thing, (4) re-check. Create the smallest working slice of file
    permissions and ACLs first, validate it, then add the remaining pieces one at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Inspect permissions: `ls -la /opt/app/secret.env` and `cat /etc/sudoers.d/app`. World-writable secrets
    and NOPASSWD ALL are the faults.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm secret.env mode is 777 (too open).

    2. Review sudoers.d for overly broad privileges.

    3. Decide least-privilege mode/owner for the app secret.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. `chmod 600 /opt/app/secret.env` (and chown if needed).

    2. Lock down `/etc/sudoers.d/app` to the minimum required.

    3. Click Check Solution once the documented remediation is applied.'
