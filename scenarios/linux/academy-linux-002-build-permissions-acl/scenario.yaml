description: 'CONTEXT: A team operating Linux administration needs you to resolve `linux: File Permissions
  And Acls — Build From Scratch` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Linux practice server is ready but file permissions and ACLs is not configured
  yet. Required tools may already be installed; your job is to create the configuration and bring the
  capability online. Build file permissions and ACLs from scratch in this linux lab. You start from a
  minimal environment and must produce a working configuration that demonstrates owner/group/other bits,
  ACL entries, and default ACL inheritance. Plan, implement, then prove it works.


  OBJECTIVE: A working file permissions and ACLs setup must exist by the end of this lab; Configuration
  should follow team conventions and be easy to audit; The result should pass validation without manual
  cleanup. Success means `systemctl is-active chronyd` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working file permissions and ACLs setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The Linux practice server is ready but file permissions and ACLs is not configured yet.
  Required tools may already be installed; your job is to create the configuration and bring the capability
  online.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ls -la`, `getfacl`, and `namei -l` on the affected path.

    2. Write down what looks normal versus wrong or missing for file permissions and ACLs.

    3. Recall the core idea: owner/group/other bits, ACL entries, and default ACL inheritance. Form one
    hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status chronyd` — note Active/Failed and the last log lines.

    2. Read `journalctl -u chronyd -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `ls -la`, `getfacl`, and `namei -l` on the affected path.

    2. Create the smallest working slice of file permissions and ACLs first, validate it, then add the
    remaining pieces one at a time.

    3. Verify the result — the process user can read/write/execute exactly what the service needs.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
