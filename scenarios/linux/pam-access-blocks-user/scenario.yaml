title: PAM access.conf Denies Console Login
slug: pam-access-blocks-user
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Authentication / PAM
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q33 PAM access — /etc/security/access.conf
description: User 'opsuser' is denied at login with "access denied" because /etc/security/access.conf
  (pam_access) contains a negative rule matching that account. pam_access evaluates its rules top-down
  and the first match wins, so a `-` rule for opsuser blocks the login. Adjust the access rules so opsuser
  can log in.
objectives:
- Identify the pam_access rule denying opsuser
- Correct the access.conf rule (remove the deny or add an allow first)
- Verify opsuser can log in
initial_state: Linux server using pam_access where /etc/security/access.conf has a negative (-) rule that
  matches opsuser, denying their logins.
hints:
- order: 1
  cost: 10
  content: 'Logs show a pam_access denial. Inspect the rules: `grep -n opsuser /etc/security/access.conf`
    — there''s a line like `- : opsuser : ALL`.'
- order: 2
  cost: 15
  content: 'Remember first-match-wins: remove that `-` line, or add a permit ABOVE it, e.g. `+ : opsuser
    : ALL` (or `LOCAL`).'
- order: 3
  cost: 20
  content: Verify opsuser can authenticate again (`su - opsuser` or an SSH login). No more access-denied.
