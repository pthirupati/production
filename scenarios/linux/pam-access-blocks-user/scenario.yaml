topics_covered: Q33 PAM access — /etc/security/access.conf
description: 'CONTEXT: A team operating Linux administration needs you to resolve `PAM access.conf Denies
  Console Login` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server using pam_access where /etc/security/access.conf has a negative
  (-) rule that matches opsuser, denying their logins. User ''opsuser'' is denied at login with "access
  denied" because /etc/security/access.conf (pam_access) contains a negative rule matching that account.
  pam_access evaluates its rules top-down and the first match wins, so a `-` rule for opsuser blocks the
  login. Adjust the access rules so opsuser can log in.


  OBJECTIVE: Identify the pam_access rule denying opsuser; Correct the access.conf rule (remove the deny
  or add an allow first); Verify opsuser can log in. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the pam_access rule denying opsuser
- Correct the access.conf rule (remove the deny or add an allow first)
- Verify opsuser can log in
