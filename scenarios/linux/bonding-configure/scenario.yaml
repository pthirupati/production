title: Configure Network Bonding Mode 1 (Active-Backup) for HA
slug: linux-bonding-configure
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Configure Network Bonding
  Mode 1 (Active-Backup) for HA` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server with two NICs: eth0 (192.168.1.100/24, active) and
  eth1 (up,

  no IP assigned). There is currently no bonding configured. Running cat /proc/net/bonding/

  returns "No such file or directory". A network outage is expected during maintenance

  and the server needs HA networking before then. The server has two physical NICs, eth0 and eth1, but
  only one is active at a time.

  Network bonding in mode 1 (active-backup) must be configured so that if eth0 fails,

  eth1 automatically becomes the active link with no service interruption. This requires

  creating a bond interface, enslaving both NICs, and configuring the bonding options in

  the network scripts. The link failover must be verified.


  OBJECTIVE: Create /etc/sysconfig/network-scripts/ifcfg-bond0 with BONDING_OPTS="mode=1 miimon=100";
  Configure ifcfg-eth0 and ifcfg-eth1 as SLAVE with MASTER=bond0; Bring up the bond with ifup bond0 and
  verify with ip link show bond0. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server with two NICs: eth0 (192.168.1.100/24, active) and eth1 (up,

  no IP assigned). There is currently no bonding configured. Running cat /proc/net/bonding/

  returns "No such file or directory". A network outage is expected during maintenance

  and the server needs HA networking before then.

  '
objectives:
- Create /etc/sysconfig/network-scripts/ifcfg-bond0 with BONDING_OPTS="mode=1 miimon=100"
- Configure ifcfg-eth0 and ifcfg-eth1 as SLAVE with MASTER=bond0
- Bring up the bond with ifup bond0 and verify with ip link show bond0
- Read /proc/net/bonding/bond0 to confirm active slave and bonding mode
- Test failover by bringing down eth0 with ip link set eth0 down and verifying connectivity
