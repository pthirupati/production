description: 'Integration lab: connect boot recovery with an adjacent platform in
  the Linux Administration stack. Validate authentication, data handoff, and failure
  behavior for GRUB, initramfs, fstab, and rescue targets.'
objectives:
- boot recovery is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for boot recovery.
  Downstream consumers are waiting on this integration path.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `journalctl -b`, GRUB menu, and `/etc/fstab`.

    2. Write down what looks normal versus wrong or missing for boot recovery.

    3. Recall the core idea: GRUB, initramfs, fstab, and rescue targets. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for boot recovery.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `journalctl -b`, GRUB menu, and `/etc/fstab`.

    2. Configure credentials and networking, then drive one happy-path transaction
    end to end across both systems.

    3. Verify the result — the system boots cleanly to the default target.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-linux-020-integration-boot-recovery-2.conf`,
    then click Check Solution.'
