title: Fix the Broken Nginx Server
slug: broken-nginx
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Web Servers
difficulty: easy
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: Medium
is_free: true
description: 'A web server was recently deployed, but it refuses to start.

  Your mission is to investigate the Nginx configuration, identify

  the error, fix it, and ensure the server is running and serving

  the default page on port 80.'
objectives:
- Find the error in the nginx configuration with nginx -t
- Fix the invalid directive so the config validates
- Start nginx and verify http://localhost returns HTTP 200
initial_state: 'You have SSH access to an Ubuntu 22.04 server.

  Nginx is installed but fails to start.

  The default site configuration has been modified.

  '
hints:
- order: 1
  cost: 10
  content: 'Test the config to pinpoint the error: `nginx -t` reports the file and line of the bad directive.'
- order: 2
  cost: 15
  content: Look at the `listen` directive in /etc/nginx/sites-available/default — it's misspelled (e.g.
    `listn`).
- order: 3
  cost: 20
  content: Fix the typo so `nginx -t` passes, then `systemctl start nginx` and verify with `curl -I http://localhost`
    (expect HTTP/1.1 200).
