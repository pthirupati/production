description: 'CONTEXT: A team operating Linux administration needs you to resolve `Fix the Broken Nginx
  Server` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: You have SSH access to an Ubuntu 22.04 server.

  Nginx is installed but fails to start.

  The default site configuration has been modified. A web server was recently deployed, but it refuses
  to start.

  Your mission is to investigate the Nginx configuration, identify

  the error, fix it, and ensure the server is running and serving

  the default page on port 80.


  OBJECTIVE: Find the error in the nginx configuration with nginx -t; Fix the invalid directive so the
  config validates; Start nginx and verify http://localhost returns HTTP 200. Success means HTTP 200 from
  http://localhost.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Find the error in the nginx configuration with nginx -t
- Fix the invalid directive so the config validates
- Start nginx and verify http://localhost returns HTTP 200
initial_state: 'You have SSH access to an Ubuntu 22.04 server.

  Nginx is installed but fails to start.

  The default site configuration has been modified.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
