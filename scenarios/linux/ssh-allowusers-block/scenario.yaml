description: 'CONTEXT: A team operating Linux administration needs you to resolve `AllowUsers Blocks SSH
  Login` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where sshd_config contains `AllowUsers adminonly`, so the deploy
  user is denied SSH access even with valid credentials. The ''deploy'' user can''t SSH in because sshd_config
  has an `AllowUsers` directive that only permits ''adminonly'' — any user not on that allow-list is rejected
  after connecting. Add deploy to the allow-list (or adjust the directive), validate the config, and reload
  sshd so deploy can log in.


  OBJECTIVE: Find the AllowUsers directive restricting SSH logins; Permit the deploy user and validate
  the sshd config; Reload sshd and verify deploy can SSH in. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Find the AllowUsers directive restricting SSH logins
- Permit the deploy user and validate the sshd config
- Reload sshd and verify deploy can SSH in
initial_state: Linux server where sshd_config contains `AllowUsers adminonly`, so the deploy user is denied
  SSH access even with valid credentials.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
