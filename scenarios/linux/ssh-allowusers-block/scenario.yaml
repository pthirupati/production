title: AllowUsers Blocks SSH Login
slug: ssh-allowusers-block
lab_mode: simulation
simulation_type: generic
technology: Linux
category: SSH
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q39 Q40 AllowUsers/DenyUsers
description: The 'deploy' user can't SSH in because sshd_config has an `AllowUsers` directive that only
  permits 'adminonly' — any user not on that allow-list is rejected after connecting. Add deploy to the
  allow-list (or adjust the directive), validate the config, and reload sshd so deploy can log in.
objectives:
- Find the AllowUsers directive restricting SSH logins
- Permit the deploy user and validate the sshd config
- Reload sshd and verify deploy can SSH in
initial_state: Linux server where sshd_config contains `AllowUsers adminonly`, so the deploy user is denied
  SSH access even with valid credentials.
hints:
- order: 1
  cost: 10
  content: 'Inspect the policy: `grep -i AllowUsers /etc/ssh/sshd_config` shows only `adminonly` is allowed.'
- order: 2
  cost: 15
  content: 'Add deploy: change it to `AllowUsers adminonly deploy` (or remove the directive if not needed).
    Validate: `sshd -t` (no output = OK).'
- order: 3
  cost: 20
  content: Apply with `systemctl reload sshd`, then test `ssh deploy@<host>` — login succeeds. Keep a
    session open while you change SSH config.
