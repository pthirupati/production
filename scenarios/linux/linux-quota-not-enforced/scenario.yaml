title: User Disk Quotas Not Enforced on /home
slug: linux-quota-not-enforced
difficulty: medium
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `User Disk Quotas Not
  Enforced on /home` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. repquota -a reports quotas are not on for /home.
  The /home line

  in /etc/fstab has ''defaults'' only (no usrquota/grpquota). One user is consuming all

  space with no cap. A runaway user filled /home and there is no protection because disk quotas were never

  enabled. The /home entry in /etc/fstab is missing the usrquota/grpquota mount options, so

  quotacheck/quotaon cannot enforce limits. Enable quotas on /home: add the mount options,

  remount, initialise the quota database, turn quotas on, and set a limit for the offending

  user. Record the remediation in /etc/fstab.


  OBJECTIVE: Confirm quotas are off (repquota -a / quotaon -p); Add usrquota (and grpquota) to the /home
  options in /etc/fstab and remount; {''Initialise the quota files'': ''quotacheck -cum /home''}. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. repquota -a reports quotas are not on for /home. The /home line

  in /etc/fstab has ''defaults'' only (no usrquota/grpquota). One user is consuming all

  space with no cap.

  '
objectives:
- Confirm quotas are off (repquota -a / quotaon -p)
- Add usrquota (and grpquota) to the /home options in /etc/fstab and remount
- Initialise the quota files: quotacheck -cum /home
- Turn quotas on: quotaon /home
- Set a limit for the user with edquota / setquota and record the fstab change
