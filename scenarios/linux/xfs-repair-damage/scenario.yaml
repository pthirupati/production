description: 'CONTEXT: A team operating Linux administration needs you to resolve `XFS Filesystem Requires
  xfs_repair` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where the XFS filesystem on /data won''t mount cleanly after
  a crash; xfs_repair is required before the data is accessible. The /data XFS filesystem fails to mount
  after an unclean shutdown, and the application can''t read its config until the volume is healthy. XFS
  may need its log replayed or, if that''s not possible, an explicit xfs_repair (which must be run on
  an UNMOUNTED filesystem). Check the errors, repair the filesystem, and remount so /data accepts writes
  again.


  OBJECTIVE: Read the mount/dmesg errors and confirm XFS corruption; Unmount and repair the filesystem
  with xfs_repair; Remount /data and verify it accepts writes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Read the mount/dmesg errors and confirm XFS corruption
- Unmount and repair the filesystem with xfs_repair
- Remount /data and verify it accepts writes
initial_state: Linux server where the XFS filesystem on /data won't mount cleanly after a crash; xfs_repair
