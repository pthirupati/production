description: 'CONTEXT: A team operating Linux administration needs you to resolve `Inode Exhaustion on
  /var/cache` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /var/cache has exhausted its inodes (df -i at 100%) due
  to a directory full of small files, so new files can''t be created despite free space. Files can no
  longer be created ("No space left on device") even though `df` reports free space, because the inodes
  on /var/cache are fully consumed by a huge number of small cache files. A filesystem can run out of
  inodes long before it runs out of blocks. Find the directory hoarding inodes and remove the excess files
  to recover.


  OBJECTIVE: Confirm inode exhaustion with df -i; Find the directory holding the bulk of the small files;
  Remove the excess files and verify inodes are recovered. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm inode exhaustion with df -i
- Find the directory holding the bulk of the small files
- Remove the excess files and verify inodes are recovered
