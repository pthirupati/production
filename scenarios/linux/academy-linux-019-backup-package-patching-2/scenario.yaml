description: 'CONTEXT: A team operating Linux administration needs you to resolve `linux: Package Patching
  — Backup and Recovery` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for package patching. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for package
  patching. Ensure backups run on schedule, retention is correct, and you can restore repos, updates,
  version pinning, and rollback within the lab RTO.


  OBJECTIVE: Backup coverage for package patching is complete and restorable; Retention and encryption
  meet the stated policy; A restore drill proves data integrity. Success means `systemctl is-active rsyslog`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for package patching is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for package patching. Leadership wants proof
  that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `dnf history`, `dnf check-update`, and repo files.

    2. Write down what looks normal versus wrong or missing for package patching.

    3. Recall the core idea: repos, updates, version pinning, and rollback. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status rsyslog` — note Active/Failed and the last log lines.

    2. Read `journalctl -u rsyslog -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `dnf history`, `dnf check-update`, and repo files.

    2. Repair or run the backup job, then perform a controlled restore into a scratch location to prove
    it works.

    3. Verify the result — required packages are at the approved versions and services still run.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
