description: 'CONTEXT: A team operating Linux administration needs you to resolve `NTP/Chrony Not Synchronizing`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server running chrony with a bad time server in /etc/chrony.conf. The
  clock drifts and chrony reports no reachable source. The system clock is drifting because chrony is
  configured with an invalid/unreachable time source, so it never synchronizes. `chronyc sources` shows
  no usable server. Point chrony at a valid NTP pool, restart it, and confirm it begins disciplining the
  clock.


  OBJECTIVE: Confirm chrony has no usable time source; Configure a valid NTP pool/server and restart chrony;
  Verify chrony selects a source and synchronizes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
