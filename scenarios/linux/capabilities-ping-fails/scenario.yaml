title: ping Fails — Missing CAP_NET_RAW
slug: capabilities-ping-fails
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Capabilities / Security
difficulty: hard
time_limit: 900
max_score: 100
infrastructure_type: docker
docker_privileged: true
jira_priority: Medium
topics_covered: Q41 capabilities — setcap cap_net_raw+ep
description: Running `ping 127.0.0.1` fails with "Operation not permitted" for non-root users because
  the file capability cap_net_raw was stripped from the ping binary. ping needs cap_net_raw to open raw
  ICMP sockets; without it (and without setuid), unprivileged users can't ping. Restore the capability
  and verify ping works.
objectives:
- Confirm ping fails for lack of cap_net_raw
- Restore the cap_net_raw capability on the ping binary
- Verify ping works for an unprivileged user
initial_state: Linux server where the ping binary has lost its cap_net_raw file capability, so non-root
  users get "Operation not permitted" when pinging.
hints:
- order: 1
  cost: 10
  content: 'Check the binary''s capabilities: `getcap $(command -v ping)` — it''s empty, so raw ICMP sockets
    are denied to non-root.'
- order: 2
  cost: 15
  content: 'Restore the effective+permitted capability: `setcap cap_net_raw+ep $(command -v ping)`.'
- order: 3
  cost: 20
  content: 'Verify: `getcap $(command -v ping)` now shows `cap_net_raw=ep`, and `ping -c1 127.0.0.1` succeeds
    as a normal user.'
