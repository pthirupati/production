objectives:
- Open the VMware simulator (toolbar link) and add a new Hard Disk to web-prod-01
- Rescan the SCSI bus in the terminal so /dev/sdc is discovered
- Add the disk to LVM (pvcreate /dev/sdc; vgextend vgdata /dev/sdc)
- Extend the data LV and filesystem (lvextend -r -l +100%FREE /dev/vgdata/lvdata)
- Verify /data has free space again with df -h
