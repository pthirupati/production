title: Datastore Full - Add Capacity in VMware and Extend the Data
slug: linux-datastore-full-add-disk-vmware
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Datastore Full - Add
  Capacity in VMware and Extend the Data` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator.
  /data

  is a full XFS filesystem on /dev/mapper/vgdata-lvdata; vgdata has 0 free extents and

  no spare disk is attached. /var/lib/docker lives on /data. web-prod-01 has run out of space on its data
  volume (mounted at /data, used by

  /var/lib/docker), and the underlying datastore has no free room for the existing

  disk to grow. This is a CROSS-TECHNOLOGY task: add a NEW virtual disk to the VM in

  the vCenter simulator, rescan the SCSI bus in the terminal so /dev/sdc appears,

  then add it to the vgdata volume group and extend the lvdata logical volume to

  reclaim space for the application.


  OBJECTIVE: Open the VMware simulator (toolbar link) and add a new Hard Disk to web-prod-01; Rescan the
  SCSI bus in the terminal so /dev/sdc is discovered; Add the disk to LVM (pvcreate /dev/sdc; vgextend
  vgdata /dev/sdc). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator. /data

  is a full XFS filesystem on /dev/mapper/vgdata-lvdata; vgdata has 0 free extents and

  no spare disk is attached. /var/lib/docker lives on /data.

  '
objectives:
- Open the VMware simulator (toolbar link) and add a new Hard Disk to web-prod-01
- Rescan the SCSI bus in the terminal so /dev/sdc is discovered
- Add the disk to LVM (pvcreate /dev/sdc; vgextend vgdata /dev/sdc)
- Extend the data LV and filesystem (lvextend -r -l +100%FREE /dev/vgdata/lvdata)
- Verify /data has free space again with df -h
