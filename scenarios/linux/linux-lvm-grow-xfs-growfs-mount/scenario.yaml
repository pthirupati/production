title: Grow a Full LVM Volume Online with lvextend + xfs_growfs
slug: linux-lvm-grow-xfs-growfs-mount
difficulty: medium
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Grow a Full LVM Volume
  Online with lvextend + xfs_growfs` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. df -h shows /data at 100% on /dev/mapper/vgdata-lvdata.
  vgs

  shows vgdata has free space. The XFS filesystem on /data has not yet been grown to use

  any new extents. The logical volume vgdata/lvdata is mounted at /data and is 100% full, causing writes

  to fail. The volume group vgdata still has free extents available (a spare PV was added

  earlier). You must grow the logical volume into that free space and then grow the XFS

  filesystem ONLINE so /data gains capacity without unmounting. After growing, record the

  change. Growing the LV alone is not enough — the XFS filesystem must also be expanded.


  OBJECTIVE: Confirm the shortage with df -h /data and the free space with vgs; {''Extend the LV into
  the free extents'': ''lvextend -l +100%FREE /dev/vgdata/lvdata''}; {''Grow the XFS filesystem online'':
  ''xfs_growfs /data''}. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
