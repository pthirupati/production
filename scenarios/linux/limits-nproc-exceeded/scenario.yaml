description: 'CONTEXT: A team operating Linux administration needs you to resolve `nproc Limit Prevents
  Forking` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where a /etc/security/limits.d/ rule sets nproc too low for a
  user, so process creation fails once the cap is reached. Applications and shells start failing with
  "cannot fork" / "Resource temporarily unavailable" because a too-low nproc (max user processes) limit
  is being hit. A restrictive limits.d entry caps the number of processes the user may create. Raise the
  nproc limit appropriately and verify new shells get the higher limit.


  OBJECTIVE: Confirm the failures are due to the nproc limit (ulimit -u); Raise the nproc soft/hard limit
  (or fix the restrictive rule); Verify a new shell/session gets the increased limit. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
