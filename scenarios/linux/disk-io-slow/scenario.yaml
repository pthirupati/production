title: Application I/O Extremely Slow — Find the Disk Bottleneck
slug: linux-disk-io-slow
difficulty: medium
category: Linux Administration
description: |
  An rsync backup job that normally completes in 15 minutes has been running for several
  hours and is not progressing at expected speed. The disk may be saturated, showing I/O
  errors, or another process may be monopolizing disk bandwidth. System observability tools
  must be used to identify the bottleneck and determine the root cause before data
  corruption or drive failure occurs.

initial_state: |
  Simulated RHEL 9 server. An rsync job has been running for 3 hours copying 50GB of data.
  The server feels sluggish. Running df -h shows /dev/sda is the target disk. dmesg output
  includes several recent "blk_update_request: I/O error" messages for /dev/sda.
  No RAID status has been checked.

objectives:
  - Run iostat -x 2 5 to identify disk utilization and await percentage
  - Use iotop -o to find which process is consuming the most disk I/O
  - Check dmesg | grep -i error for disk hardware errors
  - Inspect SMART data with smartctl -a /dev/sda for reallocated sectors
  - If disk shows errors, stop writes immediately and plan data migration
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
  - content: 'Run iostat -x 2 5 and look at %util column — if it is near 100% the disk is saturated. The await column shows average I/O wait time in milliseconds.'
    cost: 10
    order: 1
  - content: 'Use iotop -o (only active processes) to identify the top disk consumer. Install if needed: yum install iotop. Check dmesg for hardware errors alongside this.'
    cost: 20
    order: 2
  - content: 'Check SMART health: smartctl -H /dev/sda. Look for Reallocated_Sector_Ct and Current_Pending_Sector — non-zero values indicate a failing drive.'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
