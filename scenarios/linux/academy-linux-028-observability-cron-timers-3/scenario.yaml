description: Scheduled-jobs operations. The `crond` scheduler is not running, so no cron jobs (backups,
  rotations, batch tasks) will fire. Restore the scheduler so scheduled work resumes. Verify with `systemctl
  is-active crond`.
objectives:
- The crond scheduler service is active (running)
- Scheduled jobs can fire again
- systemctl is-active crond reports 'active'
initial_state: The cron scheduler (`crond`) is stopped, so no scheduled jobs will run until it is started.
hints:
- order: 1
  cost: 10
  content: 'Check the scheduler: `systemctl status crond` and `systemctl list-timers` for context.'
- order: 2
  cost: 15
  content: No crontab edits are required — the scheduler daemon itself is down.
- order: 3
  cost: 20
  content: Run `sudo systemctl enable --now crond`, confirm with `systemctl is-active crond`, then Check
    Solution.
