description: 'CONTEXT: A team operating Linux administration needs you to resolve `Password Change Broken`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /etc/pam.d/common-password has a typo in a module name,
  so passwd fails; the devuser account may also be locked. Users can''t change their passwords — `passwd`
  fails — because the PAM password stack was recently edited and now contains an error (a typo in a module
  name such as pam_unixx.so), and one account may also be locked. A broken /etc/pam.d/common-password
  breaks passwd for everyone. Fix the PAM typo, unlock the affected account, and confirm password changes
  work.


  OBJECTIVE: Diagnose why passwd fails for devuser; Fix the typo in the PAM password configuration; Unlock
  devuser if locked and successfully change its password. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Diagnose why passwd fails for devuser
- Fix the typo in the PAM password configuration
- Unlock devuser if locked and successfully change its password
initial_state: Linux server where /etc/pam.d/common-password has a typo in a module name, so passwd fails;
