title: User Cannot Create Cron Jobs — Access Denied
slug: linux-cron-permission-denied
difficulty: easy
category: Linux Administration
description: 'A developer running `crontab -e` gets "You (developer) are not allowed to use this program".
  cron access is controlled by /etc/cron.allow and /etc/cron.deny: if cron.allow exists, only users listed
  there may use cron; otherwise users in cron.deny are blocked. Grant the developer access per that precedence
  and confirm crontab works.'
initial_state: Linux server using cron access control. The developer user is blocked from crontab — either
  listed in /etc/cron.deny or absent from an existing /etc/cron.allow.
objectives:
- Check whether the user is in /etc/cron.deny
- Check whether /etc/cron.allow exists and restricts access (it takes precedence)
- Grant the developer access and verify crontab -l no longer errors
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Inspect both files: `cat /etc/cron.deny /etc/cron.allow 2>/dev/null`. Remember cron.allow
    takes priority — if it exists, only listed users may use cron.'
- order: 2
  cost: 15
  content: If developer is in cron.deny, remove that line; if cron.allow exists, add `developer` to it.
- order: 3
  cost: 20
  content: 'Verify as the user: `sudo -u developer crontab -l` no longer returns the access-denied error
    and `crontab -e` opens.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
