category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Corrupt MBR / Bootloader`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. GRUB fails early with a stage1.5 / error-15 message;
  the MBR bootloader is corrupt and the OS does not load. The server won''t boot and GRUB shows a stage1.5
  / "error 15" failure because the MBR bootloader code is corrupt and can''t locate the next boot stage.
  From a rescue environment you must reinstall GRUB to the disk''s boot sector and regenerate its configuration
  so the system boots normally.


  OBJECTIVE: Recognize the corrupt MBR/bootloader from the GRUB error; Boot a rescue environment and access
  the root install; Reinstall GRUB to the disk and regenerate its config so the system boots. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
