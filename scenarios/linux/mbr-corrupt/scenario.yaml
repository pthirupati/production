category: Linux Administration
description: The server won't boot and GRUB shows a stage1.5 / "error 15" failure because the MBR bootloader
  code is corrupt and can't locate the next boot stage. From a rescue environment you must reinstall GRUB
  to the disk's boot sector and regenerate its configuration so the system boots normally.
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 10
  content: The stage1.5/error-15 means GRUB's MBR code can't find its next stage. Boot from rescue media
    and identify the root disk/partitions with `lsblk` / `blkid`.
- order: 2
  cost: 15
  content: Mount and chroot into the installed system (e.g. mount root at /mnt, bind /dev /proc /sys,
    `chroot /mnt`) so grub2-install targets the real installation.
- order: 3
  cost: 20
  content: 'Reinstall the bootloader to the disk and rebuild config: `grub2-install /dev/sda` then `grub2-mkconfig
    -o /boot/grub2/grub.cfg`. Exit, reboot, and confirm normal boot.'
initial_state: Simulated RHEL 9 server. GRUB fails early with a stage1.5 / error-15 message; the MBR bootloader
  is corrupt and the OS does not load.
is_free: false
jira_priority: Medium
lab_mode: simulation
max_score: 100
objectives:
- Recognize the corrupt MBR/bootloader from the GRUB error
- Boot a rescue environment and access the root install
- Reinstall GRUB to the disk and regenerate its config so the system boots
requires_companion_hosts: false
simulation_type: rhel
slug: sim-rhel-mbr-corrupt
time_limit: 900
title: Corrupt MBR / Bootloader
