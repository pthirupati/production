title: Fix autofs so On-Demand /data Automounts Work
slug: linux-autofs-automount-home
difficulty: medium
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Fix autofs so On-Demand
  /data Automounts Work` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server with the autofs package installed. /etc/auto.master
  has a broken

  entry for /data/projects and the referenced map file is wrong, so ls /data/projects/app

  fails. The autofs service is running but mounts nothing. The team uses autofs to mount project shares
  on demand under /data/projects, but

  accessing a project directory fails with ''No such file or directory''. The autofs master

  map points at the wrong map file (or the map entry is malformed), so the automounter

  never mounts anything. Correct the autofs master map and the project map so that

  /data/projects/<name> automounts on access, then reload autofs. Record the fix.


  OBJECTIVE: {''Reproduce the failure'': ''ls /data/projects/app returns no such file''}; Inspect /etc/auto.master
  and the referenced map file for the wrong path/syntax; Correct the master map to reference the right
  indirect map (e.g. /data/projects /etc/auto.projects). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server with the autofs package installed. /etc/auto.master has a broken

  entry for /data/projects and the referenced map file is wrong, so ls /data/projects/app

  fails. The autofs service is running but mounts nothing.

  '
objectives:
- Reproduce the failure: ls /data/projects/app returns no such file
- Inspect /etc/auto.master and the referenced map file for the wrong path/syntax
- Correct the master map to reference the right indirect map (e.g. /data/projects /etc/auto.projects)
- Fix the map entry syntax and reload autofs (systemctl reload autofs)
- Record the remediation
