title: Configure HugePages for Oracle Database
slug: linux-hugepages-configure
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Configure HugePages
  for Oracle Database` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server running Oracle Database 19c. The database is failing
  to allocate

  shared memory from HugePages. cat /proc/meminfo | grep Huge shows:

  HugePages_Total: 0

  HugePages_Free:  0

  Hugepagesize:    2048 kB

  The database alert log shows: "ORA-27102: out of memory" during startup. An Oracle database instance
  requires 512 HugePages (2MB each = 1GB total) to be

  pre-allocated for the SGA (System Global Area). Without HugePages, Oracle must manage

  thousands of 4KB TLB entries which degrades performance significantly. HugePages must

  be configured in the kernel and verified before the database startup scripts are updated.


  OBJECTIVE: Check current HugePage status with cat /proc/meminfo | grep -i huge; Set vm.nr_hugepages=512
  in /etc/sysctl.conf; Apply immediately with sysctl -p and verify vm.nr_hugepages is 512. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server running Oracle Database 19c. The database is failing to allocate

  shared memory from HugePages. cat /proc/meminfo | grep Huge shows:

  HugePages_Total: 0

  HugePages_Free:  0

  Hugepagesize:    2048 kB

  The database alert log shows: "ORA-27102: out of memory" during startup.

  '
objectives:
- Check current HugePage status with cat /proc/meminfo | grep -i huge
- Set vm.nr_hugepages=512 in /etc/sysctl.conf
- Apply immediately with sysctl -p and verify vm.nr_hugepages is 512
- Confirm allocation with cat /proc/meminfo | grep HugePages_Total showing 512
- Add the oracle user to the hugepages group or set vm.hugetlb_shm_group in sysctl.conf
- Verify HugePages_Free is 512 before starting Oracle
