description: 'CONTEXT: A team operating Linux administration needs you to resolve `linux: Cron And Systemd
  Timers — Observability Practice` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The system runs, but cron and systemd timers lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality. Observability task: make cron and systemd timers visible
  in logs, metrics, or traces. On-call should answer ''what is broken?'' quickly using signals from scheduled
  jobs, crontab syntax, and timer units.


  OBJECTIVE: Day-2 cron and systemd timers work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  crond` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 cron and systemd timers work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but cron and systemd timers lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `crontab -l`, `systemctl list-timers`, and job logs.

    2. Write down what looks normal versus wrong or missing for cron and systemd timers.

    3. Recall the core idea: scheduled jobs, crontab syntax, and timer units. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `crontab -l`, `systemctl list-timers`, and job logs.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a sensible threshold.

    3. Verify the result — the job fires on schedule and logs success.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
