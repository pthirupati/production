title: One-Off at Job Never Runs — atd and Queue
slug: linux-at-job-not-scheduled
difficulty: easy
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `One-Off at Job Never
  Runs — atd and Queue` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. `atq` shows a job but it never runs; `systemctl is-enabled
  atd`

  reports disabled. The job script under /var/spool/at references a missing command path. A one-off maintenance
  task was supposed to run tonight via the `at` command, but the job

  never executes. The atd daemon is not enabled, and the queued job definition under

  /var/spool/at is malformed. Fix the at job definition and ensure atd is running/enabled so

  the job fires at its scheduled time. Record the remediation.


  OBJECTIVE: List queued jobs with atq and inspect the job body with at -c <id>; Correct the malformed
  job definition (fix the command/PATH); Enable and start atd so queued jobs actually run. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
