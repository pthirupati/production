title: SSH Connection Refused
slug: linux-ssh-refused
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `SSH Connection Refused`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where sshd is stopped, port 22 is blocked by the firewall, and
  sshd_config has a syntax error — so remote SSH is refused. SSH connections to the server are refused
  because of several compounding problems: the sshd service is stopped, the firewall is blocking port
  22, and sshd_config contains a syntax error that prevents the service from starting cleanly. Work through
  all three so SSH connects again.


  OBJECTIVE: Check sshd status and firewall rules to see what''s blocking SSH; Fix the sshd_config syntax
  error and restart sshd; Open the firewall port and confirm SSH connections succeed. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Linux server where sshd is stopped, port 22 is blocked by the firewall, and sshd_config
  has a syntax error — so remote SSH is refused.
objectives:
- Check sshd status and firewall rules to see what's blocking SSH
- Fix the sshd_config syntax error and restart sshd
- Open the firewall port and confirm SSH connections succeed
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
