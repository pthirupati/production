title: SSH Connection Refused
slug: linux-ssh-refused
difficulty: easy
category: Linux Administration
description: 'SSH connections to the server are refused because of several compounding problems: the sshd
  service is stopped, the firewall is blocking port 22, and sshd_config contains a syntax error that prevents
  the service from starting cleanly. Work through all three so SSH connects again.'
initial_state: Linux server where sshd is stopped, port 22 is blocked by the firewall, and sshd_config
  has a syntax error — so remote SSH is refused.
objectives:
- Check sshd status and firewall rules to see what's blocking SSH
- Fix the sshd_config syntax error and restart sshd
- Open the firewall port and confirm SSH connections succeed
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Survey the state: `systemctl status sshd` (stopped/failed) and `firewall-cmd --list-ports`
    (no 22). Validate the config: `sshd -t` reports the syntax error.'
- order: 2
  cost: 15
  content: 'Fix the sshd_config error, then `systemctl enable --now sshd` (it should now start). Confirm
    it''s listening: `ss -tlnp | grep :22`.'
- order: 3
  cost: 20
  content: 'Open the firewall: `firewall-cmd --permanent --add-service=ssh && firewall-cmd --reload`.
    Test a connection — SSH now succeeds.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
