title: Fix Broken User Creation
slug: broken-useradd
lab_mode: simulation
simulation_type: generic
technology: Linux
category: User Management
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
docker_privileged: true
jira_priority: High
description: New-user creation is failing and existing user management looks corrupted. The account databases
  are damaged — a corrupted line in /etc/passwd or /etc/group, and/or wrong permissions on the passwd/shadow/group
  files — which makes useradd error out. Repair the files, restore correct permissions, and successfully
  create the devops user.
objectives:
- Investigate why useradd is failing (read its exact error)
- Repair the corrupted passwd/group line and restore correct file permissions
- Create the devops user with a home directory and verify login with su - devops
initial_state: 'Linux server where useradd fails and user management is broken: /etc/passwd or /etc/group
  has a corrupted line and/or the files have incorrect permissions.'
hints:
- order: 1
  cost: 10
  content: 'Reproduce the error: `useradd testuser` and read it carefully. Check permissions: `ls -l /etc/passwd
    /etc/shadow /etc/group` (should be 644/640/644).'
- order: 2
  cost: 15
  content: 'Validate the databases: `pwck` and `grpck` point to the corrupted/duplicate line. Fix or remove
    it. Restore perms: `chmod 644 /etc/passwd /etc/group && chmod 640 /etc/shadow`.'
- order: 3
  cost: 20
  content: 'Once clean, create the user: `useradd -m -s /bin/bash devops && passwd devops`. Verify with
    `su - devops` (you get an interactive shell).'
