description: 'CONTEXT: A team operating Linux administration needs you to resolve `Fix Broken User Creation`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where useradd fails and user management is broken: /etc/passwd
  or /etc/group has a corrupted line and/or the files have incorrect permissions. New-user creation is
  failing and existing user management looks corrupted. The account databases are damaged — a corrupted
  line in /etc/passwd or /etc/group, and/or wrong permissions on the passwd/shadow/group files — which
  makes useradd error out. Repair the files, restore correct permissions, and successfully create the
  devops user.


  OBJECTIVE: Investigate why useradd is failing (read its exact error); Repair the corrupted passwd/group
  line and restore correct file permissions; Create the devops user with a home directory and verify login
  with su - devops. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Investigate why useradd is failing (read its exact error)
- Repair the corrupted passwd/group line and restore correct file permissions
- Create the devops user with a home directory and verify login with su - devops
