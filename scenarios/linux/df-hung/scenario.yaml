title: df -Th Hangs Indefinitely Due to Stale NFS Mount
slug: linux-df-hung
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `df -Th Hangs Indefinitely
  Due to Stale NFS Mount` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. Running df -Th hangs and never returns. The NFS server
  at

  192.168.1.50 is no longer reachable. /proc/mounts shows /mnt/oldshare as an NFS mount.

  Applications trying to access /mnt/oldshare are blocked in D (uninterruptible sleep) state. Running
  df -Th on the server hangs forever and must be killed with Ctrl-C. This is a

  classic symptom of a stale NFS mount — the NFS server is unreachable but the mount

  point is still listed in /proc/mounts. Any command that touches the mount point will

  block waiting for the unresponsive NFS server. The stale mount must be force-unmounted

  and the fstab entry corrected to prevent recurrence.


  OBJECTIVE: Identify the stale NFS mount using cat /proc/mounts | grep nfs and findmnt; Check for processes
  blocked on the stale mount with lsof | grep mnt/oldshare; Force unmount the stale mount with umount
  -f -l /mnt/oldshare. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. Running df -Th hangs and never returns. The NFS server at

  192.168.1.50 is no longer reachable. /proc/mounts shows /mnt/oldshare as an NFS mount.

  Applications trying to access /mnt/oldshare are blocked in D (uninterruptible sleep) state.

  '
objectives:
- Identify the stale NFS mount using cat /proc/mounts | grep nfs and findmnt
- Check for processes blocked on the stale mount with lsof | grep mnt/oldshare
- Force unmount the stale mount with umount -f -l /mnt/oldshare
- Confirm df -Th now completes normally
- Update /etc/fstab to add the _netdev and soft,timeo=30 options or comment out the stale entry
