title: Swap Disk Present but Not Active
slug: linux-swap-not-active
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Swap Disk Present but
  Not Active` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. lsblk shows an unused /dev/sdc (4G). swapon --show
  returns

  no output and free -h shows 0B of swap. The database process was recently OOM-killed. The server has
  a dedicated 4G disk (/dev/sdc) intended for swap, but swap is not

  active — swapon --show prints nothing and free shows 0 swap. Under memory pressure the

  OOM killer has started terminating processes. You must initialise the disk as swap,

  activate it, and add it to /etc/fstab so it comes up automatically after a reboot.


  OBJECTIVE: Confirm there is no active swap with swapon --show; Initialise the swap area on the disk
  with mkswap /dev/sdc; Activate it immediately with swapon /dev/sdc. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. lsblk shows an unused /dev/sdc (4G). swapon --show returns

  no output and free -h shows 0B of swap. The database process was recently OOM-killed.

  '
objectives:
- Confirm there is no active swap with swapon --show
- Initialise the swap area on the disk with mkswap /dev/sdc
- Activate it immediately with swapon /dev/sdc
- Verify it is active with swapon --show
- Persist it in /etc/fstab (e.g. /dev/sdc none swap sw 0 0)
lab_mode: simulation
simulation_type: generic
time_limit: 600
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
