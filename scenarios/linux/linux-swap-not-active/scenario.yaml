title: Swap Disk Present but Not Active
slug: linux-swap-not-active
difficulty: easy
category: Linux Administration
description: |
  The server has a dedicated 4G disk (/dev/sdc) intended for swap, but swap is not
  active — swapon --show prints nothing and free shows 0 swap. Under memory pressure the
  OOM killer has started terminating processes. You must initialise the disk as swap,
  activate it, and add it to /etc/fstab so it comes up automatically after a reboot.

initial_state: |
  Simulated RHEL 9 server. lsblk shows an unused /dev/sdc (4G). swapon --show returns
  no output and free -h shows 0B of swap. The database process was recently OOM-killed.

objectives:
  - Confirm there is no active swap with swapon --show
  - Initialise the swap area on the disk with mkswap /dev/sdc
  - Activate it immediately with swapon /dev/sdc
  - Verify it is active with swapon --show
  - Persist it in /etc/fstab (e.g. /dev/sdc none swap sw 0 0)
lab_mode: simulation
simulation_type: generic
time_limit: 600
max_score: 100
is_free: false
hints:
  - content: 'Check current swap with swapon --show (empty) and free -h. The disk /dev/sdc is available but not formatted as swap yet.'
    cost: 10
    order: 1
  - content: 'Initialise and activate: mkswap /dev/sdc then swapon /dev/sdc. Confirm with swapon --show.'
    cost: 15
    order: 2
  - content: 'Persist across reboots by adding to /etc/fstab: /dev/sdc none swap sw 0 0.'
    cost: 15
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
