title: 'Linux Administration: Users And Groups — Fundamentals Lab'
slug: academy-linux-031-learn-users-groups-4
technology: Linux Administration
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly Linux Administration lab introduces users and
  groups. You will explore how accounts, UIDs/GIDs, primary groups, and supplementary
  membership are defined on the Linux practice server. Read the environment first,
  then complete the guided steps — no prior production experience required.
objectives:
- Understand how users and groups work in this lab environment
- Identify the main status and configuration signals for users and groups
- Confirm you can read the current state confidently before changing anything
initial_state: The Linux practice server is online with a starter users and groups
  setup. Some pieces are intentionally incomplete so you can learn how the pieces
  fit together. Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: `id`, `getent passwd`, and `getent group` (or equivalent
    directory tools on Windows). Write down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — how accounts, UIDs/GIDs, primary groups, and supplementary
    membership are defined. Make one small, reversible change at a time and re-check
    status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-linux-031-learn-users-groups-4.conf`, then click
    Check Solution.
