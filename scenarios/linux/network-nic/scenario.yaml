category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Network — Add Secondary
  NIC IP via Jira` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. eth0 has only 10.0.0.10; a secondary IP (10.0.0.20/24)
  is required for the application VIP. Request the @network team in Jira, wait for confirmation (~30s),
  then verify in the terminal. An application needs a secondary IP (10.0.0.20) on eth0 for its VIP, but
  only the primary 10.0.0.10 is configured. Coordinate with the @network team through the Jira ticket
  to have the address assigned, verify it appears on the interface, and confirm the application can bind
  to the new address (configuring routing if needed).


  OBJECTIVE: Request the @network team in Jira to add the secondary IP; Verify the new address with ip
  addr show dev eth0; Confirm the application can bind to the new address (and routing works). Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
hints:
- order: 1
  cost: 0
  content: 'Where to look: Request the @network team in Jira to add the secondary IP'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify the new address with ip addr show dev eth0

    2. Confirm the application can bind to the new address (and routing works)'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Confirm the application can bind to the new address (and routing works).

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
