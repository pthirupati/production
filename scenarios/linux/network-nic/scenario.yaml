category: Linux Administration
description: An application needs a secondary IP (10.0.0.20) on eth0 for its VIP, but only the primary
  10.0.0.10 is configured. Coordinate with the @network team through the Jira ticket to have the address
  assigned, verify it appears on the interface, and confirm the application can bind to the new address
  (configuring routing if needed).
difficulty: medium
hints:
- order: 1
  cost: 10
  content: 'Comment on Jira: @network team please add secondary IP 10.0.0.20/24 on eth0'
- order: 2
  cost: 20
  content: 'After the team confirms, verify the address landed: `ip addr show dev eth0` should list both
    10.0.0.10 and 10.0.0.20. (To add it manually: `ip addr add 10.0.0.20/24 dev eth0`.)'
- order: 3
  cost: 30
  content: 'Confirm reachability/binding: `ping -c1 10.0.0.20` from the host and check the route with
    `ip route get 10.0.0.20`. The application can now bind its VIP to the new address.'
initial_state: Simulated RHEL 9 server. eth0 has only 10.0.0.10; a secondary IP (10.0.0.20/24) is required
  for the application VIP. Request the @network team in Jira, wait for confirmation (~30s), then verify
  in the terminal.
is_free: false
lab_mode: simulation
objectives:
- Request the @network team in Jira to add the secondary IP
- Verify the new address with ip addr show dev eth0
- Confirm the application can bind to the new address (and routing works)
simulation_type: rhel
slug: sim-rhel-network-nic
time_limit: 900
title: Network — Add Secondary NIC IP via Jira
