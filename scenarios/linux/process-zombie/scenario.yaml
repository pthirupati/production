title: Zombie Processes Accumulating
slug: linux-process-zombie
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Zombie Processes Accumulating`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server accumulating zombie processes from a buggy parent that doesn''t
  reap children; the process table is approaching exhaustion. The process table is filling with zombie
  (defunct) processes because a parent process isn''t reaping its children — it fails to call wait(),
  so finished children linger as <defunct>. Zombies hold PID-table slots and can eventually exhaust them.
  Trace the zombies to their parent and clear them by signaling or restarting that parent.


  OBJECTIVE: Identify the zombie processes and their parent (PPID); Determine why the parent isn''t reaping
  children; Clear the zombies by signaling or restarting the parent. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Linux server accumulating zombie processes from a buggy parent that doesn't reap children;
  the process table is approaching exhaustion.
objectives:
- Identify the zombie processes and their parent (PPID)
