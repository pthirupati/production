title: Zombie Processes Accumulating — System Becoming Slow
slug: linux-zombie-process-kill
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Zombie Processes Accumulating
  — System Becoming Slow` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. Running ps aux | grep Z shows many processes in Z
  (zombie) state:

  appworker 1234 0.0 0.0 0 0 ? Z 10:00 0:00 [child] <defunct>

  The system load is elevated and some new processes cannot be created. The zombie parent

  is a Python-based job worker that does not properly handle SIGCHLD. The system has a growing number
  of zombie (Z state) processes shown in ps aux. Zombie

  processes are child processes that have exited but whose parent has not called wait()

  to collect the exit status. They hold a PID and process table slot but no memory or CPU.

  However, if enough accumulate they can exhaust PID space. The parent process must be

  identified and restarted to reap the zombies.


  OBJECTIVE: Identify zombie processes with ps aux | awk ''$8 == "Z" { print }''; Find the parent PID
  of a zombie with ps -o ppid= -p <zombie_pid>; Use pstree -s <ppid> to understand the parent process
  tree. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. Running ps aux | grep Z shows many processes in Z (zombie) state:

  appworker 1234 0.0 0.0 0 0 ? Z 10:00 0:00 [child] <defunct>

  The system load is elevated and some new processes cannot be created. The zombie parent

  is a Python-based job worker that does not properly handle SIGCHLD.

  '
objectives:
- Identify zombie processes with ps aux | awk '$8 == "Z" { print }'
- Find the parent PID of a zombie with ps -o ppid= -p <zombie_pid>
- Use pstree -s <ppid> to understand the parent process tree
- Send SIGCHLD to the parent with kill -SIGCHLD <ppid> to trigger wait()
- If SIGCHLD does not work, restart the parent process to reap all zombies
- Verify zombie count drops to zero with ps aux | grep -c Z
