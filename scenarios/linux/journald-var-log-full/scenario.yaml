description: 'CONTEXT: A team operating Linux administration needs you to resolve `journald Cannot Write
  — /var/log Full` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /var/log is at capacity, so journald and apps can''t write
  logs. A large journal and oversized log files are consuming the space. Logging has broken because /var/log
  is full — journalctl and applications that write there fail to record anything. The space is consumed
  by an oversized systemd journal and/or large application log files. Reclaim space by vacuuming the journal
  and clearing stale logs, then cap journal growth so it doesn''t recur.


  OBJECTIVE: Confirm /var/log is full and find the largest consumers; Vacuum the systemd journal and remove
  stale logs to reclaim space; Cap journal size so it doesn''t fill again. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm /var/log is full and find the largest consumers
- Vacuum the systemd journal and remove stale logs to reclaim space
- Cap journal size so it doesn't fill again
