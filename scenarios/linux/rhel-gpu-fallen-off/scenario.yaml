description: 'CONTEXT: A team operating Linux administration needs you to resolve `RHEL Simulation: GPU
  Fallen Off Bus` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL GPU node. The NVIDIA driver is loaded, but the GPU has fallen
  off the bus, so `nvidia-smi` errors and CUDA workloads can''t run. On a RHEL GPU node, nvidia-smi fails
  because the GPU has fallen off the PCIe bus — the driver was loaded but the device stopped responding
  (an Xid/NVRM bus error). Use kernel logs to confirm the cause, then reload the NVIDIA kernel module
  (or reset the device) to bring the GPU back so nvidia-smi enumerates it again.


  OBJECTIVE: Confirm the GPU failure with nvidia-smi; Inspect dmesg for NVRM/Xid bus errors; Reload the
  nvidia kernel module (or reset) and verify nvidia-smi lists the GPU. Success means `nvidia-smi` includes
  `NVIDIA-SMI`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the GPU failure with nvidia-smi
- Inspect dmesg for NVRM/Xid bus errors
- Reload the nvidia kernel module (or reset) and verify nvidia-smi lists the GPU
initial_state: Simulated RHEL GPU node. The NVIDIA driver is loaded, but the GPU has fallen off the bus,
  so `nvidia-smi` errors and CUDA workloads can't run.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `nvidia-smi` and `dmesg | grep -i nvidia` for driver visibility.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check if the GPU appears in `lspci | grep -i nvidia`.

    2. Verify the correct driver module is loaded (`lsmod | grep nvidia`).

    3. Look for Xid errors or fallen-off-bus messages in dmesg.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Reload driver, rebind PCI, or fix persistence mode per the scenario.

    2. Re-run `nvidia-smi`.

    3. Confirm GPU name and memory report without errors.


    WHY: workloads need the driver to see the device.'
