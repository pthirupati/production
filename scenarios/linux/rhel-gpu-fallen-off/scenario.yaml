description: 'CONTEXT: A team operating Linux administration has raised a ticket for `RHEL Lab: GPU Fallen
  Off Bus`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture is a single
  lab-primary node exposing terminal and config files under /etc and /var; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: RHEL GPU node. The NVIDIA driver is loaded, but the GPU has fallen off the
  bus, so `nvidia-smi` errors and CUDA workloads can''t run.

  OBJECTIVE: Confirm the GPU failure with nvidia-smi; Inspect dmesg for NVRM/Xid bus errors; Reload the
  nvidia kernel module (or reset) and verify nvidia-smi lists the GPU. Acceptance criteria: the change
  is minimal and reversible, and success means `nvidia-smi` includes `NVIDIA-SMI`.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant terminal and config files under /etc and /var), changing one thing at a time. Check
  your work continuously against the objective — success means `nvidia-smi` includes `NVIDIA-SMI`.

  VERIFY: Re-run the same check the grader uses and confirm `nvidia-smi` includes `NVIDIA-SMI`. Capture
  the before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
