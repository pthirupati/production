title: Grow /data — Add a Disk in VMware, Rescan, then Extend LVM
slug: linux-lvm-extend-vmware-disk-rescan
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Grow /data — Add a
  Disk in VMware, Rescan, then Extend LVM` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator
  for

  this lab. /data is an XFS filesystem on /dev/mapper/vgdata-lvdata (VG vgdata, on

  /dev/sdb) and is out of space. The volume group has 0 free extents and there is

  no spare disk attached yet. Open the VMware simulator from the lab toolbar to add

  one. The /data filesystem on web-prod-01 is full and there is NO spare disk in the

  server. This is a CROSS-TECHNOLOGY task: the same server lives in both the

  vCenter simulator and this Linux terminal. You must first ADD A NEW VIRTUAL

  DISK to web-prod-01 in VMware (Edit Settings -> Add Hard Disk), then come back

  to the terminal and trigger a SCSI rescan so the kernel discovers /dev/sdc.

  Only then can you initialise it as an LVM physical volume, add it to the vgdata

  volume group, and extend the lvdata logical volume (and its filesystem) online.


  OBJECTIVE: Open the VMware simulator for this server (toolbar link) and add a new Hard Disk to web-prod-01;
  Back in the terminal, rescan the SCSI bus so the kernel sees /dev/sdc (echo "- - -" > /sys/class/scsi_host/host0/scan,
  or rescan-scsi-bus.sh); Initialise the new disk as a PV (pvcreate /dev/sdc) and add it to the volume
  group (vgextend vgdata /dev/sdc). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator for

  this lab. /data is an XFS filesystem on /dev/mapper/vgdata-lvdata (VG vgdata, on

  /dev/sdb) and is out of space. The volume group has 0 free extents and there is

  no spare disk attached yet. Open the VMware simulator from the lab toolbar to add

  one.

  '
objectives:
- Open the VMware simulator for this server (toolbar link) and add a new Hard Disk to web-prod-01
- Back in the terminal, rescan the SCSI bus so the kernel sees /dev/sdc (echo "- - -" > /sys/class/scsi_host/host0/scan,
  or rescan-scsi-bus.sh)
- Initialise the new disk as a PV (pvcreate /dev/sdc) and add it to the volume group (vgextend vgdata
  /dev/sdc)
- Extend the logical volume and grow the filesystem (lvextend -r -l +100%FREE /dev/vgdata/lvdata)
- Confirm /data is larger with vgs, lvs and df -h
