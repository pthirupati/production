title: Grow /data — Add a Disk in VMware, Rescan, then Extend LVM
slug: linux-lvm-extend-vmware-disk-rescan
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration has raised a ticket for
  `Grow /data — Add a Disk in VMware, Rescan, then Extend LVM`. A customer-facing
  workflow is degraded and the on-call engineer (you) must diagnose and resolve it.
  Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture
  is a single lab-primary node exposing terminal and config files under /etc and /var;
  treat it as the production host for this incident. All tools run locally — no paid
  APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: RHEL 9 server (web-prod-01), also present in the vCenter
  console for

  this lab. /data is an XFS filesystem on /dev/mapper/vgdata-lvdata (VG vgdata, on

  /dev/sdb) and is out of space. The volume group has 0 free extents and there is

  no spare disk attached yet. Open the VMware console from the lab toolbar to add

  one.


  OBJECTIVE: Open the VMware console for this server (toolbar link) and add a new
  Hard Disk to web-prod-01; Back in the terminal, rescan the SCSI bus so the kernel
  sees /dev/sdc (echo "- - -" > /sys/class/scsi_host/host0/scan, or rescan-scsi-bus.sh);
  Initialise the new disk as a PV (pvcreate /dev/sdc) and add it to the volume group
  (vgextend vgdata /dev/sdc). Acceptance criteria: the change is minimal and reversible,
  and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it
  and use the equivalent already on the host. Make the smallest configuration change
  that moves the system toward the objective (edit the relevant terminal and config
  files under /etc and /var), changing one thing at a time. Check your work continuously
  against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully.
  Capture the before/after output as evidence. Success criteria: the objective''s
  healthy state holds on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately
  (restore the original config file / undo the edit / restart the affected component)
  and re-observe before trying another hypothesis. Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering,
  or fake completion with marker files — the checker validates real system state.'
