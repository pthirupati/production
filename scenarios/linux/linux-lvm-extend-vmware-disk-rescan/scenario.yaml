title: Grow /data — Add a Disk in VMware, Rescan, then Extend LVM
slug: linux-lvm-extend-vmware-disk-rescan
difficulty: medium
category: Linux Administration
description: |
  The /data filesystem on web-prod-01 is full and there is NO spare disk in the
  server. This is a CROSS-TECHNOLOGY task: the same server lives in both the
  vCenter simulator and this Linux terminal. You must first ADD A NEW VIRTUAL
  DISK to web-prod-01 in VMware (Edit Settings -> Add Hard Disk), then come back
  to the terminal and trigger a SCSI rescan so the kernel discovers /dev/sdc.
  Only then can you initialise it as an LVM physical volume, add it to the vgdata
  volume group, and extend the lvdata logical volume (and its filesystem) online.
initial_state: |
  Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator for
  this lab. /data is an XFS filesystem on /dev/mapper/vgdata-lvdata (VG vgdata, on
  /dev/sdb) and is out of space. The volume group has 0 free extents and there is
  no spare disk attached yet. Open the VMware simulator from the lab toolbar to add
  one.
objectives:
  - Open the VMware simulator for this server (toolbar link) and add a new Hard Disk to web-prod-01
  - Back in the terminal, rescan the SCSI bus so the kernel sees /dev/sdc (echo "- - -" > /sys/class/scsi_host/host0/scan, or rescan-scsi-bus.sh)
  - Initialise the new disk as a PV (pvcreate /dev/sdc) and add it to the volume group (vgextend vgdata /dev/sdc)
  - Extend the logical volume and grow the filesystem (lvextend -r -l +100%FREE /dev/vgdata/lvdata)
  - Confirm /data is larger with vgs, lvs and df -h
lab_mode: simulation
simulation_type: generic
cross_technology: true
vmware_link: true
time_limit: 1200
max_score: 100
is_free: false
hints:
  - content: 'There is no spare disk to extend the VG. Open the VMware simulator (toolbar -> Open VMware) and Edit Settings on web-prod-01 -> Add Hard Disk -> 50 GB -> OK.'
    cost: 10
    order: 1
  - content: 'The hot-added disk is invisible until the kernel rescans the SCSI bus: echo "- - -" > /sys/class/scsi_host/host0/scan (or run rescan-scsi-bus.sh), then lsblk should show /dev/sdc.'
    cost: 15
    order: 2
  - content: 'Add the new disk to LVM: pvcreate /dev/sdc, then vgextend vgdata /dev/sdc. Confirm free space with vgs.'
    cost: 20
    order: 3
  - content: 'Grow the LV and its XFS in one step: lvextend -r -l +100%FREE /dev/vgdata/lvdata. Verify with lvs and df -h /data.'
    cost: 20
    order: 4
requires_companion_hosts: false
dual_terminal: false
jira_priority: High
