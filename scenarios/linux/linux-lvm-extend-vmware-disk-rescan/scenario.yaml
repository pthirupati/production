objectives:
- Open the VMware console for this server (toolbar link) and add a new Hard Disk to
  web-prod-01
- Back in the terminal, rescan the SCSI bus so the kernel sees /dev/sdc (echo "- -
  -" > /sys/class/scsi_host/host0/scan, or rescan-scsi-bus.sh)
- Initialise the new disk as a PV (pvcreate /dev/sdc) and add it to the volume group
  (vgextend vgdata /dev/sdc)
- Extend the logical volume and grow the filesystem (lvextend -r -l +100%FREE /dev/vgdata/lvdata)
- Confirm /data is larger with vgs, lvs and df -h
