title: Set GRUB Password to Prevent Unauthorized Boot Options
slug: linux-grub-password
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Set GRUB Password to
  Prevent Unauthorized Boot Options` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. The GRUB bootloader has no password set. Pressing
  ''e'' at the

  GRUB menu allows editing of boot entries without any authentication. A security audit

  has flagged this as a critical finding. The server uses BIOS boot with GRUB2 at

  /boot/grub2/grub.cfg. Physical security requires that the GRUB bootloader be password-protected so that

  unauthorized users cannot boot into single-user mode, modify kernel parameters, or

  bypass root authentication by appending init=/bin/bash to the kernel command line.

  A PBKDF2-hashed GRUB password must be configured and the GRUB configuration must be

  regenerated to apply the change.


  OBJECTIVE: Generate a PBKDF2 password hash with grub2-mkpasswd-pbkdf2 and save the output; Edit /etc/grub.d/40_custom
  to add set superusers="root" and the password_pbkdf2 line; Regenerate the GRUB config with grub2-mkconfig
  -o /boot/grub2/grub.cfg. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. The GRUB bootloader has no password set. Pressing ''e'' at the

  GRUB menu allows editing of boot entries without any authentication. A security audit

