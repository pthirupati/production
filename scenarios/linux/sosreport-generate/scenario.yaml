title: Generate sosreport for Red Hat Support Case
slug: linux-sosreport-generate
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Generate sosreport
  for Red Hat Support Case` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: RHEL server that needs a sosreport generated for a support case. The sos package
  may or may not be installed yet. A Red Hat support case is open and the engineer has requested a sosreport
  diagnostic bundle. sosreport collects system configuration, logs, and state into a single archive for
  analysis. Ensure the sos package is installed, generate the report, locate the resulting archive, and
  record its checksum to share with support.


  OBJECTIVE: Ensure the sos package is installed; Generate the sosreport bundle and locate the output
  file in /var/tmp; Record the archive''s checksum and verify its contents. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
