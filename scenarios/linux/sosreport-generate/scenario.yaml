title: Generate sosreport for Red Hat Support Case
slug: linux-sosreport-generate
difficulty: easy
category: Linux Administration
description: A Red Hat support case is open and the engineer has requested a sosreport diagnostic bundle.
  sosreport collects system configuration, logs, and state into a single archive for analysis. Ensure
  the sos package is installed, generate the report, locate the resulting archive, and record its checksum
  to share with support.
initial_state: RHEL server that needs a sosreport generated for a support case. The sos package may or
  may not be installed yet.
objectives:
- Ensure the sos package is installed
- Generate the sosreport bundle and locate the output file in /var/tmp
- Record the archive's checksum and verify its contents
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Check/install the tool: `rpm -q sos || yum install -y sos`. Then run it as root: `sos report`
    (older systems: `sosreport`).'
- order: 2
  cost: 15
  content: It writes to /var/tmp and prints the exact path and checksum at the end, e.g. `/var/tmp/sosreport-<host>-<date>.tar.xz`.
- order: 3
  cost: 20
  content: 'Verify and record: `ls -l /var/tmp/sosreport-*.tar.xz`, `md5sum` (or sha256sum) the file,
    and sanity-check contents with `tar -tf <file> | head`. Share the path + checksum with support.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
