title: Load Kernel Module and Make It Persistent Across Reboots
slug: linux-kernel-module-load
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Load Kernel Module
  and Make It Persistent Across Reboots` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux node intended for Kubernetes where br_netfilter is not loaded; bridged
  traffic isn''t subject to iptables and the bridge-nf sysctls are unavailable. A Kubernetes node setup
  requires the br_netfilter kernel module so that bridged pod traffic is processed by iptables, but the
  module isn''t loaded (and won''t persist across reboots). Without it, the related sysctls can''t be
  set and pod networking misbehaves. Load the module now, make it load at boot, and enable the bridge-nf
  sysctl.


  OBJECTIVE: Load br_netfilter immediately and confirm with lsmod; Make it load on boot via /etc/modules-load.d/;
  Enable net.bridge.bridge-nf-call-iptables=1 persistently. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Linux node intended for Kubernetes where br_netfilter is not loaded; bridged traffic isn't
  subject to iptables and the bridge-nf sysctls are unavailable.
