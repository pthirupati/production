title: Load Kernel Module and Make It Persistent Across Reboots
slug: linux-kernel-module-load
difficulty: easy
category: Linux Administration
description: A Kubernetes node setup requires the br_netfilter kernel module so that bridged pod traffic
  is processed by iptables, but the module isn't loaded (and won't persist across reboots). Without it,
  the related sysctls can't be set and pod networking misbehaves. Load the module now, make it load at
  boot, and enable the bridge-nf sysctl.
initial_state: Linux node intended for Kubernetes where br_netfilter is not loaded; bridged traffic isn't
  subject to iptables and the bridge-nf sysctls are unavailable.
objectives:
- Load br_netfilter immediately and confirm with lsmod
- Make it load on boot via /etc/modules-load.d/
- Enable net.bridge.bridge-nf-call-iptables=1 persistently
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Load it now: `modprobe br_netfilter`, then confirm `lsmod | grep br_netfilter`.'
- order: 2
  cost: 15
  content: 'Persist the module: create `/etc/modules-load.d/k8s.conf` containing `br_netfilter` (systemd-modules-load
    reads it at boot).'
- order: 3
  cost: 20
  content: 'Enable the sysctl persistently: add `net.bridge.bridge-nf-call-iptables=1` to `/etc/sysctl.d/k8s.conf`
    and apply with `sysctl --system`. Verify with `sysctl net.bridge.bridge-nf-call-iptables`.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
