title: Passwordless SSH Key Authentication Not Working
slug: linux-ssh-key-auth-fail
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Passwordless SSH Key
  Authentication Not Working` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. User ''developer'' has ~/.ssh/authorized_keys in
  place with

  the correct public key. Running ssh developer@localhost still prompts for a password.

  Running ssh -v developer@localhost shows "Server refused our key" in the verbose output.

  SELinux is in Enforcing mode. A developer has copied their public key to the server with ssh-copy-id
  but SSH still

  prompts for a password instead of authenticating with the key. This is a common problem

  caused by incorrect permissions on the ~/.ssh directory or authorized_keys file, or by

  sshd_config having PubkeyAuthentication disabled. On SELinux systems an incorrect file

  context can also prevent sshd from reading authorized_keys.


  OBJECTIVE: Check ~/.ssh directory permissions — must be 700 (chmod 700 ~/.ssh); Check ~/.ssh/authorized_keys
  permissions — must be 600 (chmod 600 ~/.ssh/authorized_keys); Verify /etc/ssh/sshd_config has PubkeyAuthentication
  yes and AuthorizedKeysFile .ssh/authorized_keys. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. User ''developer'' has ~/.ssh/authorized_keys in place with

  the correct public key. Running ssh developer@localhost still prompts for a password.

  Running ssh -v developer@localhost shows "Server refused our key" in the verbose output.

  SELinux is in Enforcing mode.

  '
objectives:
- Check ~/.ssh directory permissions — must be 700 (chmod 700 ~/.ssh)
- Check ~/.ssh/authorized_keys permissions — must be 600 (chmod 600 ~/.ssh/authorized_keys)
- Verify /etc/ssh/sshd_config has PubkeyAuthentication yes and AuthorizedKeysFile .ssh/authorized_keys
- Restore SELinux context on the .ssh directory with restorecon -Rv ~/.ssh
- Test key auth with ssh -v and confirm no password is requested
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
