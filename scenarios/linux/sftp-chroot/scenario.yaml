title: Create Chroot SFTP User Who Cannot SSH
slug: linux-sftp-chroot
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Create Chroot SFTP
  User Who Cannot SSH` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. A request has come in to create SFTP-only access
  for user

  ''sftpuser''. No such user exists yet. The /srv/uploads directory exists. Currently any

  user with a valid password can both SSH and SFTP to this server. A vendor needs SFTP access to upload
  files to /srv/uploads but must not be able to

  SSH into the server and run commands. A chroot SFTP configuration in sshd_config will

  restrict the vendor to SFTP-only access within a jailed directory. The user''s shell

  must be set to /sbin/nologin to prevent SSH login and the sshd_config Match Group

  directive must enforce the SFTP restriction.


  OBJECTIVE: {''Create user sftpuser with shell /sbin/nologin'': ''useradd -m -s /sbin/nologin sftpuser''};
  Set a password and create the sftp group, add sftpuser to it; {''Add to /etc/ssh/sshd_config'': ''Match
  Group sftp with ChrootDirectory /srv/uploads and ForceCommand internal-sftp''}. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. A request has come in to create SFTP-only access for user

  ''sftpuser''. No such user exists yet. The /srv/uploads directory exists. Currently any

  user with a valid password can both SSH and SFTP to this server.

  '
objectives:
- Create user sftpuser with shell /sbin/nologin: useradd -m -s /sbin/nologin sftpuser
- Set a password and create the sftp group, add sftpuser to it
- Add to /etc/ssh/sshd_config: Match Group sftp with ChrootDirectory /srv/uploads and ForceCommand internal-sftp
- Ensure /srv/uploads is owned by root (chroot requirement)
- Restart sshd and verify sftp sftpuser@localhost works
- Verify ssh sftpuser@localhost is rejected with "This account is currently not available"
