description: 'CONTEXT: A team operating Linux administration needs you to resolve `User Has Invalid Primary
  Group` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where baduser''s primary GID in /etc/passwd references a non-existent
  group, breaking login. User ''baduser'' can''t log in because the primary GID listed in /etc/passwd
  doesn''t correspond to any group in /etc/group. The login process can''t resolve the user''s primary
  group, so the session setup fails. Point the user at a valid primary group (or create the missing group)
  so login works.


  OBJECTIVE: Confirm baduser''s primary GID has no matching group entry; Assign a valid primary group
  (or create the missing one); Verify baduser can log in. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm baduser's primary GID has no matching group entry
- Assign a valid primary group (or create the missing one)
- Verify baduser can log in
