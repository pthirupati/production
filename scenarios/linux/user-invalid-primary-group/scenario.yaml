title: User Has Invalid Primary Group
slug: user-invalid-primary-group
lab_mode: simulation
simulation_type: generic
technology: Linux
category: User Management
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q21 primary group — usermod -g
description: User 'baduser' can't log in because the primary GID listed in /etc/passwd doesn't correspond
  to any group in /etc/group. The login process can't resolve the user's primary group, so the session
  setup fails. Point the user at a valid primary group (or create the missing group) so login works.
objectives:
- Confirm baduser's primary GID has no matching group entry
- Assign a valid primary group (or create the missing one)
- Verify baduser can log in
initial_state: Linux server where baduser's primary GID in /etc/passwd references a non-existent group,
  breaking login.
hints:
- order: 1
  cost: 10
  content: 'Compare the user''s GID to existing groups: `getent passwd baduser` (note the GID) vs `getent
    group <GID>` (returns nothing — that''s the problem).'
- order: 2
  cost: 15
  content: 'Fix it: set a valid primary group with `usermod -g <existing-group> baduser`, or create the
    intended group (`groupadd -g <GID> <name>`) if it should exist.'
- order: 3
  cost: 20
  content: 'Verify resolution and login: `id baduser` shows a valid primary group and `su - baduser` opens
    a shell.'
