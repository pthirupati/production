description: Service operations lab. The `chronyd` systemd unit is **failed/inactive** on this host —
  a realistic fault for Integration Lab workflows that depend on it. Diagnose with `systemctl status chronyd`
  and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active chronyd`.
objectives:
- The `chronyd` service is active (running)
- '`systemctl is-active chronyd` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `chronyd` service is not running (`systemctl is-active chronyd` → inactive/failed).
  Dependent Integration Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `journalctl -b`, GRUB menu, and `/etc/fstab`.

    2. Write down what looks normal versus wrong or missing for boot recovery.

    3. Recall the core idea: GRUB, initramfs, fstab, and rescue targets. Form one hypothesis before you
    act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for boot recovery.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `journalctl -b`, GRUB menu, and `/etc/fstab`.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — the system boots cleanly to the default target.

    4. Click Check Solution once `systemctl is-active chronyd` returns active.'
