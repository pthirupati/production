category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Initramfs / Dracut
  Failure` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. Boot stalls at the dracut initqueue and times out
  into the dracut emergency shell; the root device isn''t being found by the current initramfs. Boot hangs
  in the dracut initqueue ("Warning: dracut-initqueue timeout") and eventually drops to an emergency shell
  because the initramfs can''t assemble the root device. A missing driver/module or a stale initramfs
  is preventing the root filesystem from being mounted. Regenerate a correct initramfs so the system boots.


  OBJECTIVE: Recognize the dracut initqueue timeout and that root can''t be assembled; Determine the missing
  module/driver or stale initramfs; Regenerate the initramfs so the root device mounts and the system
  boots. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the Linux practice server. For Initramfs
    / Dracut Failure, inspect terminal and config files under /etc and /var before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with terminal and config files under /etc and /var.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Regenerate the initramfs so the root device mounts and the system boots.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
