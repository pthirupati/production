title: yum Fails with Corrupted RPM Database
slug: linux-rpmdb-corrupted-fix
difficulty: medium
category: Linux Administration
description: |
  Package management is broken on this server. Running yum install or yum update returns
  an error about a damaged or corrupted RPM database. The RPM database files in
  /var/lib/rpm/ have become corrupted, possibly from a system crash or interrupted package
  operation. The database must be rebuilt using rpm --rebuilddb before package operations
  can resume.

initial_state: |
  Simulated RHEL 9 server. Running yum install vim returns:
  "error: rpmdb: damaged header at cursor EOF"
  "RPMDB altered outside of yum."
  yum clean all also fails. The server is missing critical security updates and packages
  cannot be installed or queried until the RPM database is repaired.

objectives:
  - Confirm the error with yum install vim and note the exact error message
  - Remove the corrupted RPM database lock files with rm -f /var/lib/rpm/__db.*
  - Rebuild the RPM database with rpm --rebuilddb
  - Run yum clean all to clear cached metadata
  - Verify yum list installed | head works correctly
  - Successfully install a test package to confirm package management is restored
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
  - content: 'Remove stale lock files first: rm -f /var/lib/rpm/__db.*. These are BDB lock/cache files, not the actual database, and are safe to delete.'
    cost: 10
    order: 1
  - content: 'Rebuild the database: rpm --rebuilddb. This rebuilds the index from the actual package headers stored in /var/lib/rpm/Packages. It may take a few minutes on a system with many packages.'
    cost: 20
    order: 2
  - content: 'After rpm --rebuilddb, run yum clean all then yum makecache to refresh repository metadata. Test with yum install vim or rpm -q bash to verify the DB is working.'
    cost: 15
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
