title: yum Fails with Corrupted RPM Database
slug: linux-rpmdb-corrupted-fix
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `yum Fails with Corrupted
  RPM Database` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. Running yum install vim returns:

  "error: rpmdb: damaged header at cursor EOF"

  "RPMDB altered outside of yum."

  yum clean all also fails. The server is missing critical security updates and packages

  cannot be installed or queried until the RPM database is repaired. Package management is broken on this
  server. Running yum install or yum update returns

  an error about a damaged or corrupted RPM database. The RPM database files in

  /var/lib/rpm/ have become corrupted, possibly from a system crash or interrupted package

  operation. The database must be rebuilt using rpm --rebuilddb before package operations

  can resume.


  OBJECTIVE: Confirm the error with yum install vim and note the exact error message; Remove the corrupted
  RPM database lock files with rm -f /var/lib/rpm/__db.*; Rebuild the RPM database with rpm --rebuilddb.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. Running yum install vim returns:

  "error: rpmdb: damaged header at cursor EOF"

  "RPMDB altered outside of yum."

  yum clean all also fails. The server is missing critical security updates and packages

  cannot be installed or queried until the RPM database is repaired.

  '
objectives:
- Confirm the error with yum install vim and note the exact error message
- Remove the corrupted RPM database lock files with rm -f /var/lib/rpm/__db.*
- Rebuild the RPM database with rpm --rebuilddb
- Run yum clean all to clear cached metadata
- Verify yum list installed | head works correctly
- Successfully install a test package to confirm package management is restored
