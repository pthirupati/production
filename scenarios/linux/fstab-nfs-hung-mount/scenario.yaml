title: fstab NFS Entry Causes df Hang
slug: fstab-nfs-hung-mount
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Storage / NFS
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q10 df hang — noserver, nobootwait, fix fstab
description: Commands like `df` and `ls` hang on /mnt/nfs because an NFS server referenced in /etc/fstab
  is unreachable and the mount uses hard/blocking options, so any access to the path blocks indefinitely.
  Stop the hang and make the entry resilient — use soft/timeout/nofail options or remove the stale entry
  — so the system isn't held up by a dead NFS server.
objectives:
- Identify the stale NFS entry causing the hang
- Recover the hung mount and make the fstab entry resilient (or remove it)
- Verify df/ls no longer hang
initial_state: Linux server with an unreachable NFS server in /etc/fstab. Accessing /mnt/nfs (or running
  df) hangs because the mount blocks on the dead server.
hints:
- order: 1
  cost: 10
  content: 'Confirm where it hangs: `findmnt /mnt/nfs` and a backgrounded `df` that blocks. The fstab
    NFS line points at an unreachable server with blocking options.'
- order: 2
  cost: 15
  content: 'Force-unmount the dead mount: `umount -f -l /mnt/nfs`. Then edit /etc/fstab to add resilient
    options — `nofail,soft,timeo=50,retrans=2` — or remove the entry if it''s obsolete.'
- order: 3
  cost: 20
  content: 'Verify: `df -h` and `ls /` complete instantly. With `nofail`, a future outage won''t hang
    boot or commands.'
