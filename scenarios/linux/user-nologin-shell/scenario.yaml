description: 'CONTEXT: A team operating Linux administration needs you to resolve `User Shell Set to /usr/sbin/nologin`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where the deploy user''s login shell is /usr/sbin/nologin, so
  interactive logins are immediately terminated. The ''deploy'' user exists and authenticates, but any
  interactive login closes immediately because its login shell is set to /usr/sbin/nologin (a shell designed
  to refuse logins). Service accounts use nologin intentionally, but deploy needs an interactive shell.
  Set a real shell for the account and verify login works.


  OBJECTIVE: Confirm deploy''s login shell is nologin in /etc/passwd; Change the shell to an interactive
  shell (e.g. /bin/bash); Verify deploy can log in interactively. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm deploy's login shell is nologin in /etc/passwd
- Change the shell to an interactive shell (e.g. /bin/bash)
- Verify deploy can log in interactively
