title: User Shell Set to /usr/sbin/nologin
slug: user-nologin-shell
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Users / Groups
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q21 nologin shell — usermod -s /bin/bash
description: The 'deploy' user exists and authenticates, but any interactive login closes immediately
  because its login shell is set to /usr/sbin/nologin (a shell designed to refuse logins). Service accounts
  use nologin intentionally, but deploy needs an interactive shell. Set a real shell for the account and
  verify login works.
objectives:
- Confirm deploy's login shell is nologin in /etc/passwd
- Change the shell to an interactive shell (e.g. /bin/bash)
- Verify deploy can log in interactively
initial_state: Linux server where the deploy user's login shell is /usr/sbin/nologin, so interactive logins
  are immediately terminated.
hints:
- order: 1
  cost: 10
  content: 'Check the shell field: `getent passwd deploy` ends in `/usr/sbin/nologin`, which prints a
    message and exits on login.'
- order: 2
  cost: 15
  content: 'Set a real shell: `usermod -s /bin/bash deploy` (ensure /bin/bash is listed in /etc/shells).'
- order: 3
  cost: 20
  content: 'Verify: `su - deploy` now opens an interactive shell instead of closing immediately.'
