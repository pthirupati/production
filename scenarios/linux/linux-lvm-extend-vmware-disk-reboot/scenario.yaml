title: Grow /data - Add a Disk in VMware that Only Appears After a
slug: linux-lvm-extend-vmware-disk-reboot
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Grow /data - Add a
  Disk in VMware that Only Appears After a` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator.
  /data

  is full (XFS on /dev/mapper/vgdata-lvdata, VG vgdata has 0 free extents). After you

  add a disk in VMware, a SCSI rescan will NOT reveal it — only a reboot will. Like the rescan scenario,
  /data on web-prod-01 is full and you must ADD A NEW

  VIRTUAL DISK in the vCenter simulator first. The twist: this controller does NOT

  surface the hot-added disk to a live SCSI rescan — rescan-scsi-bus.sh finds

  nothing. You must REBOOT the server from the terminal; after it comes back up the

  kernel enumerates /dev/sdc at boot, and you can then extend the vgdata volume

  group and the lvdata logical volume online.


  OBJECTIVE: Open the VMware simulator (toolbar link) and add a new Hard Disk to web-prod-01; Try a SCSI
  rescan and observe the disk does NOT appear (the controller needs a re-enumeration); Reboot the server
  from the terminal so the kernel discovers /dev/sdc at boot. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator. /data

  is full (XFS on /dev/mapper/vgdata-lvdata, VG vgdata has 0 free extents). After you

