title: Broken Symbolic Link Chain
slug: broken-symlink-chain
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Filesystem
difficulty: easy
time_limit: 600
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q17 soft links — readlink, ln -sf
description: The application launcher /usr/local/bin/apptool is a broken (dangling) symlink — it points
  at a target that no longer exists, so running apptool fails with "No such file or directory". Trace
  the symlink, find where the real binary lives, and recreate the link to the correct target.
objectives:
- Confirm apptool is a broken symlink and find its current (missing) target
- Locate the real binary the link should point to
- Recreate the symlink to the correct target and verify apptool runs
initial_state: Linux server where /usr/local/bin/apptool is a dangling symlink whose target is missing,
  so invoking apptool fails.
hints:
- order: 1
  cost: 10
  content: 'Inspect the link: `ls -l /usr/local/bin/apptool` and `readlink /usr/local/bin/apptool` show
    it points to a path that no longer exists. `readlink -f` traces the whole chain.'
- order: 2
  cost: 15
  content: 'Find where the real binary is now: `find / -name apptool -type f 2>/dev/null` (or check the
    package: `which`/`rpm -ql`/`dpkg -L`).'
- order: 3
  cost: 20
  content: 'Recreate the link: `ln -sf /correct/path/to/apptool /usr/local/bin/apptool`, then run `apptool`
    (or `apptool --version`) to confirm it executes.'
