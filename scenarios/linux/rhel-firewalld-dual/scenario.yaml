description: 'CONTEXT: A team operating Linux administration needs you to resolve `RHEL Simulation: Firewall
  Blocks HTTP (Dual Terminal)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Dual-terminal lab. primary (10.0.0.10): nginx is active but firewalld blocks
  port 80. ssh_client: used to `curl http://10.0.0.10` to test connectivity from outside. nginx is serving
  on the database/web server (10.0.0.10) but firewalld is blocking inbound port 80, so remote clients
  can''t reach it. Using the dual-terminal lab, confirm from the SSH client that the request is refused,
  open HTTP through firewalld on the server console, then verify the remote request succeeds.


  OBJECTIVE: From the SSH client, confirm curl to the server is refused while the port is blocked; Allow
  HTTP through firewalld on the server console; Verify the remote curl now returns 200. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- From the SSH client, confirm curl to the server is refused while the port is blocked
- Allow HTTP through firewalld on the server console
- Verify the remote curl now returns 200
initial_state: 'Dual-terminal lab. primary (10.0.0.10): nginx is active but firewalld blocks port 80.
  ssh_client: used to `curl http://10.0.0.10` to test connectivity from outside.'
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
