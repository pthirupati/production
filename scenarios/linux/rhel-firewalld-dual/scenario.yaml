title: 'RHEL Simulation: Firewall Blocks HTTP (Dual Terminal)'
slug: sim-rhel-firewalld-dual
technology: Linux Administration
category: Linux Administration
difficulty: easy
time_limit: 900
max_score: 100
lab_mode: simulation
simulation_type: generic
dual_terminal: true
infrastructure_type: docker
jira_priority: Low
is_free: false
description: nginx is serving on the database/web server (10.0.0.10) but firewalld is blocking inbound
  port 80, so remote clients can't reach it. Using the dual-terminal lab, confirm from the SSH client
  that the request is refused, open HTTP through firewalld on the server console, then verify the remote
  request succeeds.
objectives:
- From the SSH client, confirm curl to the server is refused while the port is blocked
- Allow HTTP through firewalld on the server console
- Verify the remote curl now returns 200
initial_state: 'Dual-terminal lab. primary (10.0.0.10): nginx is active but firewalld blocks port 80.
  ssh_client: used to `curl http://10.0.0.10` to test connectivity from outside.'
hints:
- order: 1
  cost: 10
  content: 'SSH Client pane: `curl -v http://10.0.0.10/` — expect connection refused/timeout because port
    80 is blocked.'
- order: 2
  cost: 15
  content: 'Server console: inspect and open it — `firewall-cmd --list-all`, then `firewall-cmd --permanent
    --add-service=http && firewall-cmd --reload`.'
- order: 3
  cost: 20
  content: Back in the SSH Client, retry `curl http://10.0.0.10/` — it now returns the nginx HTML (HTTP
    200).
