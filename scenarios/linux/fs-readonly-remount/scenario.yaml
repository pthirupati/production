title: Filesystem Stuck Read-Only
slug: fs-readonly-remount
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Storage
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
docker_privileged: true
jira_priority: Medium
topics_covered: Q4 readonly FS — remount rw, dmesg, fs errors
description: 'Applications are failing with "Read-only file system" on /data: after detecting errors,
  the kernel remounted it read-only to protect data. Once the device is confirmed healthy, the filesystem
  can be remounted read-write so writes resume. Confirm the read-only state, remount read-write, and verify
  the application can write again.'
objectives:
- Identify the read-only mount with mount/findmnt and check dmesg
- Remount /data read-write
- Verify the application can write to /data
initial_state: Linux server where /data is mounted read-only following earlier errors. Writes are blocked
  until it is remounted read-write.
hints:
- order: 1
  cost: 10
  content: 'Confirm the state and look for a cause: `findmnt /data` shows `ro`, and `dmesg | tail` shows
    why the kernel flipped it.'
- order: 2
  cost: 20
  content: 'If the device is healthy, remount it: `mount -o remount,rw /data`. If dmesg shows ongoing
    I/O errors, run `fsck` on the unmounted device first.'
- order: 3
  cost: 30
  content: 'Verify writes: `touch /data/test && rm /data/test` succeeds. Confirm `findmnt /data` now shows
    `rw`.'
