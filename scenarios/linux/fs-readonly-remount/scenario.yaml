- Identify read-only mount with mount/findmnt
- /data accepts writes again
- Verify application can write
initial_state: 'Ubuntu 22.04 lab container with a realistic misconfiguration.

  '
hints:
- order: 1
  cost: 10
  content: Run `findmnt /data` and `dmesg | tail`
- order: 2
  cost: 20
  content: '`mount -o remount,rw /data` then `touch /data/test`'
- order: 3
  cost: 15
  content: Remount rw safely
- order: 4
  cost: 15
  content: Verify application can write
