description: 'CONTEXT: A team operating Linux administration needs you to resolve `Filesystem Stuck Read-Only`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /data is mounted read-only following earlier errors. Writes
  are blocked until it is remounted read-write. Applications are failing with "Read-only file system"
  on /data: after detecting errors, the kernel remounted it read-only to protect data. Once the device
  is confirmed healthy, the filesystem can be remounted read-write so writes resume. Confirm the read-only
  state, remount read-write, and verify the application can write again.


  OBJECTIVE: Identify the read-only mount with mount/findmnt and check dmesg; Remount /data read-write;
  Verify the application can write to /data. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the read-only mount with mount/findmnt and check dmesg
- Remount /data read-write
- Verify the application can write to /data
initial_state: Linux server where /data is mounted read-only following earlier errors. Writes are blocked
  until it is remounted read-write.
