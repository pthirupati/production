title: 'Terraform → Ansible Handoff: Inventory From State Is Broken'
slug: linux-terraform-output-to-ansible-inventory
technology: linux
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Linux administration has raised a ticket for `Terraform → Ansible
  Handoff: Inventory From State Is Broken`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture is a single
  lab-primary node exposing terminal and config files under /etc and /var; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: A Linux automation host. Terraform state lists web-1/web-2/web-3 at

  10.20.0.11-13, but /home/ansible/inventory/provisioned_hosts.ini is stale and

  malformed (placeholder IPs, broken [webservers] header). The Ansible run that

  consumes it cannot reach any host.

  OBJECTIVE: Compare the Terraform output (terraform output -json web_private_ips) with the rendered inventory;
  Correct /home/ansible/inventory/provisioned_hosts.ini so the group + addresses match the real state;
  Confirm the file is corrected so the Ansible ping handoff would succeed. Acceptance criteria: the change
  is minimal and reversible, and success means `ansible webservers -m ping` includes `SUCCESS`.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant terminal and config files under /etc and /var), changing one thing at a time. Check
  your work continuously against the objective — success means `ansible webservers -m ping` includes `SUCCESS`.

  VERIFY: Re-run the same check the grader uses and confirm `ansible webservers -m ping` includes `SUCCESS`.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
