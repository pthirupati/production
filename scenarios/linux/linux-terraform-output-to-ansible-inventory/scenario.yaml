title: 'Terraform → Ansible Handoff: Inventory From State Is Broken'
slug: linux-terraform-output-to-ansible-inventory
technology: linux
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Terraform → Ansible
  Handoff: Inventory From State Is Broken` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Linux automation host. Terraform state lists web-1/web-2/web-3 at

  10.20.0.11-13, but /home/ansible/inventory/provisioned_hosts.ini is stale and

  malformed (placeholder IPs, broken [webservers] header). The Ansible run that

  consumes it cannot reach any host. CROSS-TECHNOLOGY task (Terraform -> Ansible). Terraform provisioned
  three web

  hosts and wrote their private IPs to an output, and a small wrapper renders that

  output into the Ansible inventory at /home/ansible/inventory/provisioned_hosts.ini.

  The render broke: the inventory still carries the OLD placeholder addresses and a

  malformed group header, so `ansible -i provisioned_hosts.ini webservers -m ping`

  fails and the configuration stage never starts. Reconcile the inventory with the

  real Terraform output so the provision -> configure handoff works again.


  OBJECTIVE: Compare the Terraform output (terraform output -json web_private_ips) with the rendered inventory;
  Correct /home/ansible/inventory/provisioned_hosts.ini so the group + addresses match the real state;
  Confirm the file is corrected so the Ansible ping handoff would succeed. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A Linux automation host. Terraform state lists web-1/web-2/web-3 at

  10.20.0.11-13, but /home/ansible/inventory/provisioned_hosts.ini is stale and

  malformed (placeholder IPs, broken [webservers] header). The Ansible run that

  consumes it cannot reach any host.

  '
objectives:
