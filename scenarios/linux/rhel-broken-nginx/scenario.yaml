description: 'CONTEXT: A team operating Linux administration needs you to resolve `RHEL Simulation: Fix
  Broken Nginx` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. nginx is installed but the active site config contains
  a typo, so `systemctl start nginx` fails and `nginx -t` reports a syntax error. The website is unreachable.
  Nginx is installed but fails to start because of a typo in its configuration (commonly a misspelled
  directive such as `listn` instead of `listen`). `nginx -t` reports the syntax error and systemd refuses
  to start the service, so the site is down. Find the bad directive, fix it, start nginx, and confirm
  port 80 serves.


  OBJECTIVE: Run nginx -t to locate the configuration syntax error; Fix the misspelled/invalid directive
  in the site config; Start and enable nginx, then verify it serves on port 80. Success means HTTP 200
  from http://localhost.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Run nginx -t to locate the configuration syntax error
- Fix the misspelled/invalid directive in the site config
- Start and enable nginx, then verify it serves on port 80
initial_state: Simulated RHEL 9 server. nginx is installed but the active site config contains a typo,
  so `systemctl start nginx` fails and `nginx -t` reports a syntax error. The website is unreachable.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
