title: Create a GPT Disk Label with parted, Format and Mount
slug: linux-parted-gpt-mkfs-mount
difficulty: medium
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Create a GPT Disk Label
  with parted, Format and Mount` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. /dev/sdc (20G) has no disk label and no partitions.
  parted

  print reports an unrecognised disk label. /data is not mounted and is absent from

  /etc/fstab. A new 20G disk /dev/sdc must be brought online for a large data volume. Because the

  volume may later exceed the 2 TiB MBR limit, the team standard is a GPT label rather

  than the legacy MBR/msdos scheme. Using parted, write a fresh GPT label on /dev/sdc,

  create a single primary partition spanning the disk, put a filesystem on it, mount it

  at /data, and persist it in /etc/fstab.


  OBJECTIVE: {''Write a GPT label'': ''parted /dev/sdc --script mklabel gpt''}; {''Create a partition'':
  ''parted /dev/sdc --script mkpart primary xfs 0% 100%''}; Format /dev/sdc1 with mkfs.xfs. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. /dev/sdc (20G) has no disk label and no partitions. parted

  print reports an unrecognised disk label. /data is not mounted and is absent from

  /etc/fstab.

  '
objectives:
- Write a GPT label: parted /dev/sdc --script mklabel gpt
- Create a partition: parted /dev/sdc --script mkpart primary xfs 0% 100%
- Format /dev/sdc1 with mkfs.xfs
- Mount it at /data (mkdir -p /data && mount /dev/sdc1 /data)
- Add the mount to /etc/fstab
