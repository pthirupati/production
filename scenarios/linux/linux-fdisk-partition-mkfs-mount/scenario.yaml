title: Partition, Format and Mount a Spare Disk with fdisk
slug: linux-fdisk-partition-mkfs-mount
difficulty: medium
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Partition, Format and
  Mount a Spare Disk with fdisk` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. lsblk shows /dev/sdc (20G) with no child partitions
  and no

  filesystem. blkid does not list /dev/sdc. There is no /data mount and nothing about

  /data in /etc/fstab. Applications that write to /data are failing. A spare 20G disk /dev/sdc has been
  attached to the server but it is completely raw —

  no partition table, no filesystem, nothing mounted. The application team needs durable

  storage at /data. You must carve a primary partition on /dev/sdc with fdisk, lay down

  an XFS (or ext4) filesystem on that partition, mount it at /data, and add a line to

  /etc/fstab so the mount survives a reboot. A bare disk with no partition or an

  unmounted partition is NOT acceptable.


  OBJECTIVE: Inspect the disk with lsblk and fdisk -l /dev/sdc; Create a primary partition /dev/sdc1 with
  fdisk /dev/sdc (n, p, defaults, w); {''Make a filesystem on the partition'': ''mkfs.xfs /dev/sdc1 (or
  mkfs.ext4)''}. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. lsblk shows /dev/sdc (20G) with no child partitions and no

  filesystem. blkid does not list /dev/sdc. There is no /data mount and nothing about

  /data in /etc/fstab. Applications that write to /data are failing.

  '
objectives:
- Inspect the disk with lsblk and fdisk -l /dev/sdc
- Create a primary partition /dev/sdc1 with fdisk /dev/sdc (n, p, defaults, w)
- Make a filesystem on the partition: mkfs.xfs /dev/sdc1 (or mkfs.ext4)
- Mount it: mkdir -p /data && mount /dev/sdc1 /data
- Persist the mount in /etc/fstab so it remounts on reboot
