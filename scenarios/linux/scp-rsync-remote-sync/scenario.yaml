description: 'CONTEXT: A team operating Linux administration needs you to resolve `SCP and Rsync Mirror
  to Remote Host` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two-host lab. SSH key auth between client and backup-server works, but backup-server:/var/www/backup/
  isn''t writable by syncuser, so rsync/scp can''t write there. Syncing /var/www/app to the backup server
  over SSH fails on the write side: SSH key auth works, but the destination directory on backup-server
  isn''t writable by the sync user, so scp/rsync errors with permission denied. Fix the ownership/permissions
  of the destination so the transfer completes.


  OBJECTIVE: Confirm the transfer fails on destination write permissions (not auth); Fix ownership/permissions
  on backup-server:/var/www/backup/; Verify rsync/scp completes the sync successfully. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
companion_hosts:
- name: backup
  role: backup-server
  hostname: backup-server
  ssh_user: syncuser
  setup_command: 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server
    rsync >/dev/null

    useradd -m syncuser 2>/dev/null || true

    mkdir -p /var/www/backup && chown root:root /var/www/backup && chmod 755 /var/www/backup

    mkdir -p /home/syncuser/.ssh && chmod 700 /home/syncuser/.ssh

    service ssh restart 2>/dev/null || /usr/sbin/sshd

    '
objectives:
- Confirm the transfer fails on destination write permissions (not auth)
- Fix ownership/permissions on backup-server:/var/www/backup/
- Verify rsync/scp completes the sync successfully
hints:
- order: 1
  cost: 0
  content: 'Where to look: Confirm the transfer fails on destination write permissions (not auth)'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Fix ownership/permissions on backup-server:/var/www/backup/

    2. Verify rsync/scp completes the sync successfully'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Verify rsync/scp completes the sync successfully.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
validation_script: 'test -f /var/www/app/index.html && rsync -az -e "ssh -o StrictHostKeyChecking=no"
  /var/www/app/ syncuser@backup-server:/var/www/backup/ && ssh -o BatchMode=yes syncuser@backup-server
  test -f /var/www/backup/index.html

  '
