title: NFS Files Show UID Numbers Instead of Usernames
slug: linux-nfs-uid-mapping
difficulty: easy
category: Linux Administration
description: An NFS share is mounted and usable, but `ls -l` shows raw numeric UIDs/GIDs (e.g. 1001 1001)
  instead of names. With NFSv4 idmapping, names only resolve when the idmapd service is running and both
  ends share the same configured Domain. Enable idmapd, set the matching Domain, and confirm ownership
  displays as names.
initial_state: Linux NFS client where the share displays numeric owner/group IDs because nfs-idmapd isn't
  running or the idmapd Domain doesn't match the server.
objectives:
- Confirm the numeric-UID display on the mounted share
- Enable nfs-idmapd and set the correct Domain in /etc/idmapd.conf
- Restart idmapd and verify ls -l shows usernames
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Reproduce: `ls -l /mnt/shared` shows numbers. Check the service: `systemctl status nfs-idmapd`
    (often not running).'
- order: 2
  cost: 15
  content: 'Set the domain to match the server in `/etc/idmapd.conf` under [General]: `Domain = your.domain.com`.'
- order: 3
  cost: 20
  content: 'Apply: `systemctl restart nfs-idmapd` (and clear the keyring with `nfsidmap -c`). Re-run `ls
    -l /mnt/shared` — owners now show as names.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
