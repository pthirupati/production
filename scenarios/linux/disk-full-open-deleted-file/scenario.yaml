title: "Disk Full — Deleted File Still Open"
slug: "disk-full-open-deleted-file"
technology: "Linux"
category: "Storage"
difficulty: "hard"
time_limit: 1200
max_score: 100
infrastructure_type: "docker"
docker_privileged: false
jira_priority: "Medium"
topics_covered: "Q6 df vs du — lsof /proc/fd, restart process"

description: |
  df shows /var/log 100% full but du sums to much less. A process holds a deleted log file open.

objectives:
  - Compare df vs du
  - Find open deleted files with lsof
  - Stop process or truncate via /proc/PID/fd

initial_state: |
  Ubuntu 22.04 lab container with a realistic misconfiguration.

hints:
  - order: 1
    cost: 15
    content: "`lsof +L1 /var/log` or `lsof | grep deleted`"
  - order: 2
    cost: 25
    content: "Kill the holder PID or `>: /proc/PID/fd/N`"
