description: 'CONTEXT: A team operating Linux administration needs you to resolve `Disk Full — Deleted
  File Still Open` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /var/log shows full in df but not in du. A process keeps
  a deleted log file open, pinning its blocks. `df` reports /var/log at 100% full, but `du` of the directory
  sums to far less. A running process still holds a large log file open after it was deleted, so the space
  isn''t released until the file descriptor is closed. Find the process holding the deleted file and reclaim
  the space without a reboot.


  OBJECTIVE: Recognize the df-vs-du discrepancy points to a deleted-but-open file; Find the process and
  descriptor holding the deleted file; Reclaim the space (close/truncate the fd or restart the holder).
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Recognize the df-vs-du discrepancy points to a deleted-but-open file
- Find the process and descriptor holding the deleted file
- Reclaim the space (close/truncate the fd or restart the holder)
initial_state: Linux server where /var/log shows full in df but not in du. A process keeps a deleted log
  file open, pinning its blocks.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
