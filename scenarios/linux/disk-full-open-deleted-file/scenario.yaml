title: Disk Full — Deleted File Still Open
slug: disk-full-open-deleted-file
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Storage
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q6 df vs du — lsof /proc/fd, restart process
description: '`df` reports /var/log at 100% full, but `du` of the directory sums to far less. A running
  process still holds a large log file open after it was deleted, so the space isn''t released until the
  file descriptor is closed. Find the process holding the deleted file and reclaim the space without a
  reboot.'
objectives:
- Recognize the df-vs-du discrepancy points to a deleted-but-open file
- Find the process and descriptor holding the deleted file
- Reclaim the space (close/truncate the fd or restart the holder)
initial_state: Linux server where /var/log shows full in df but not in du. A process keeps a deleted log
  file open, pinning its blocks.
hints:
- order: 1
  cost: 10
  content: Compare `df -h /var/log` (100%) with `du -sh /var/log` (much less). The gap means space is
    held by deleted-but-open files.
- order: 2
  cost: 15
  content: 'Find the holder: `lsof +L1 /var/log` (or `lsof | grep deleted`) lists the PID and the open
    fd pointing at the deleted file.'
- order: 3
  cost: 20
  content: 'Release the space without rebooting: truncate the descriptor with `: > /proc/<PID>/fd/<N>`
    or restart/HUP the process. `df -h /var/log` immediately shows the space back.'
