description: 'CONTEXT: A team operating Linux administration needs you to resolve `Fix the Broken Cron
  Job` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server whose nightly backup hasn''t run in days. The cron daemon is
  active, but the backup job is not executing and no recent backup files exist. The nightly backup cron
  job stopped running about three days ago and operators noticed missing backup files. cron itself is
  healthy, but the job no longer executes — typically because the backup script lost its execute bit (or
  the crontab entry is missing/malformed). Restore a working, scheduled, executable backup job.


  OBJECTIVE: Find why the backup cron job is not running; Ensure /opt/backup.sh is executable and a valid
  crontab entry exists; Verify the backup script runs successfully. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Find why the backup cron job is not running
- Ensure /opt/backup.sh is executable and a valid crontab entry exists
- Verify the backup script runs successfully
initial_state: Linux server whose nightly backup hasn't run in days. The cron daemon is active, but the
  backup job is not executing and no recent backup files exist.
