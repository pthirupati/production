title: Extend a Full Filesystem via a ServiceNow Storage Ticket
slug: linux-disk-extend-itsm-ticket
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration has raised a ticket for `Extend a Full Filesystem
  via a ServiceNow Storage Ticket`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture is a single
  lab-primary node exposing terminal and config files under /etc and /var; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: RHEL 9 server (web-prod-01). The volume group `rhel` has no free extents and

  there is no spare disk attached. A ServiceNow Incident is open and assigned to the

  Service Desk; the Storage team must add a disk before the LV can be extended.

  OBJECTIVE: Open the Ticket panel and review the Incident assigned to you; Raise a sub-ticket to the
  Storage team for a 50 GiB disk; After the Storage team resolves it, run a SCSI rescan so the new disk
  (/dev/sdc) appears. Acceptance criteria: the change is minimal and reversible, and success means `check.sh`
  exits successfully.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant terminal and config files under /etc and /var), changing one thing at a time. Check
  your work continuously against the objective — success means `check.sh` exits successfully.

  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'RHEL 9 server (web-prod-01). The volume group `rhel` has no free extents and

  there is no spare disk attached. A ServiceNow Incident is open and assigned to the

  Service Desk; the Storage team must add a disk before the LV can be extended.

  '
objectives:
- Open the Ticket panel and review the Incident assigned to you
- Raise a sub-ticket to the Storage team for a 50 GiB disk
- After the Storage team resolves it, run a SCSI rescan so the new disk (/dev/sdc) appears
- pvcreate the new disk, vgextend the rhel VG, and lvextend the root LV to use the space
- Resolve the Incident with a close code once the filesystem is extended
