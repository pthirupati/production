title: systemd Timer Not Firing — OnCalendar Misconfigured
slug: linux-systemd-timer-not-firing
difficulty: medium
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `systemd Timer Not Firing
  — OnCalendar Misconfigured` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. /etc/systemd/system/backup.timer has an invalid OnCalendar=

  line and the timer is not enabled, so systemctl list-timers does not list backup.timer

  and the backup never runs. A backup is meant to run nightly via a systemd timer (backup.timer driving

  backup.service), but it never fires. The timer unit has a malformed OnCalendar

  expression and is not enabled. Correct the OnCalendar value, enable and start the timer,

  and verify it shows up in systemctl list-timers. Record the remediation in the unit.


  OBJECTIVE: {''Inspect the timer'': ''systemctl cat backup.timer and systemctl list-timers''}; Fix the
  OnCalendar= expression to a valid calendar event (e.g. *-*-* 02:00:00); Reload systemd and enable --now
  backup.timer. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. /etc/systemd/system/backup.timer has an invalid OnCalendar=

