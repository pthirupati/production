title: Application Unreachable — Firewall Blocking Port 8080
slug: linux-iptables-allow-port
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Application Unreachable
  — Firewall Blocking Port 8080` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where an app listens on 8080 (confirmed by ss) but firewalld
  blocks inbound traffic to that port, so remote clients can''t connect. A web application is up and listening
  on port 8080 locally but is unreachable from external clients because the active firewall (firewalld)
  does not permit that port. The service binds fine; the firewall drops inbound connections. Add and persist
  a rule allowing 8080/tcp, reload the firewall, and confirm external access.


  OBJECTIVE: Confirm the service listens locally (ss -tlnp) and that the firewall blocks 8080; Add a permanent
  firewalld rule for 8080/tcp and reload; Verify the rule is active and the port is reachable. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Linux server where an app listens on 8080 (confirmed by ss) but firewalld blocks inbound
  traffic to that port, so remote clients can't connect.
objectives:
- Confirm the service listens locally (ss -tlnp) and that the firewall blocks 8080
- Add a permanent firewalld rule for 8080/tcp and reload
- Verify the rule is active and the port is reachable
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.


    WHY: a running service behind a closed firewall still fails health checks.'
