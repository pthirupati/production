title: Application Unreachable — Firewall Blocking Port 8080
slug: linux-iptables-allow-port
difficulty: easy
category: Linux Administration
description: A web application is up and listening on port 8080 locally but is unreachable from external
  clients because the active firewall (firewalld) does not permit that port. The service binds fine; the
  firewall drops inbound connections. Add and persist a rule allowing 8080/tcp, reload the firewall, and
  confirm external access.
initial_state: Linux server where an app listens on 8080 (confirmed by ss) but firewalld blocks inbound
  traffic to that port, so remote clients can't connect.
objectives:
- Confirm the service listens locally (ss -tlnp) and that the firewall blocks 8080
- Add a permanent firewalld rule for 8080/tcp and reload
- Verify the rule is active and the port is reachable
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Confirm it''s a firewall issue, not the app: `ss -tlnp | grep 8080` shows it listening; `firewall-cmd
    --list-all` shows 8080 isn''t allowed.'
- order: 2
  cost: 15
  content: 'Add and persist the rule: `firewall-cmd --permanent --add-port=8080/tcp` then `firewall-cmd
    --reload` (or `--add-service=http` if it''s standard HTTP).'
- order: 3
  cost: 20
  content: 'Verify: `firewall-cmd --list-ports` shows 8080/tcp, and a request from another host (or `curl
    http://<server-ip>:8080`) now succeeds.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
