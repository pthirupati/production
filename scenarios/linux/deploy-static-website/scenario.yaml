description: 'CONTEXT: A team operating Linux administration needs you to resolve `Deploy a Static Website
  with Nginx` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Fresh Ubuntu server with nginx installed but not configured.

  No website is deployed yet — this is a greenfield task. Build task: deploy a static website from scratch
  and serve it with nginx on port 80. Starting from a host with nginx but no site, create the page content,
  add an nginx server block pointing at it, enable the site, and verify the page is served over HTTP.


  OBJECTIVE: Create /var/www/mysite/index.html with your page content; Configure and enable an nginx site
  at /etc/nginx/sites-available/mysite (root /var/www/mysite); Start nginx and verify curl http://localhost
  returns your page. Success means HTTP 200 from http://localhost.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Create /var/www/mysite/index.html with your page content
- Configure and enable an nginx site at /etc/nginx/sites-available/mysite (root /var/www/mysite)
- Start nginx and verify curl http://localhost returns your page
initial_state: 'Fresh Ubuntu server with nginx installed but not configured.

  No website is deployed yet — this is a greenfield task.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
