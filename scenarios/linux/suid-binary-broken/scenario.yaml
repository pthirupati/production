title: SUID Binary Not Working
slug: suid-binary-broken
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Permissions
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q19 SUID — chmod u+s
description: A custom privileged helper no longer works because it lost its SUID bit, so it runs as the
  calling user instead of its owner (root) and fails its privileged operation. Confirm the missing setuid
  bit, restore it, and verify the helper runs with elevated privileges again — being mindful that SUID
  root binaries are security-sensitive.
objectives:
- Confirm the binary is missing its SUID bit (ls -l)
- Restore the setuid bit on the helper
- Verify the helper runs with elevated privileges again
initial_state: Linux server where a setuid helper (e.g. /usr/local/bin/reads-shadow) had its SUID bit
  removed, so it no longer executes with its owner's privileges.
hints:
- order: 1
  cost: 10
  content: 'Inspect the binary: `ls -l /usr/local/bin/reads-shadow` — the owner-execute shows `x` instead
    of `s`, so setuid is gone.'
- order: 2
  cost: 15
  content: 'Restore it (it must be owned by the intended privileged user, usually root): `chmod u+s /usr/local/bin/reads-shadow`.'
- order: 3
  cost: 20
  content: 'Verify: `ls -l` now shows `-rwsr-xr-x` and running the helper as an unprivileged user succeeds
    in its privileged action. (Only keep SUID on trusted binaries.)'
