title: fstab Wrong UUID — /mnt/data Won't Mount
slug: fstab-bad-uuid
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Storage / fstab
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: true
jira_priority: Medium
topics_covered: Q9 fstab UUID — blkid, fix mount entry
description: After a reboot, /mnt/data is empty because /etc/fstab references a UUID that no longer matches
  the data volume (e.g. the disk was re-created or cloned). The mount silently fails (or mounts nothing),
  so the data appears missing. Find the correct UUID, fix the fstab entry, and remount so the data is
  accessible.
objectives:
- Confirm /mnt/data isn't mounted and find the wrong UUID in fstab
- Look up the device's real UUID and correct the fstab entry
- Run mount -a and verify the data is accessible
initial_state: Linux server where /etc/fstab has a stale/wrong UUID for the /mnt/data volume, so it doesn't
  mount on boot and /mnt/data shows empty.
hints:
- order: 1
  cost: 10
  content: '`findmnt /mnt/data` shows nothing mounted. Compare the fstab UUID against reality: `blkid`
    lists each device''s true UUID.'
- order: 2
  cost: 15
  content: Edit /etc/fstab and replace the bad UUID on the /mnt/data line with the correct one from blkid.
- order: 3
  cost: 20
  content: 'Apply it: `mount -a` (no errors), then `ls /mnt/data` shows the data (e.g. production.dat)
    and `findmnt /mnt/data` confirms it''s mounted.'
