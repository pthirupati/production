description: 'CONTEXT: A team operating Linux administration needs you to resolve `fstab Wrong UUID —
  /mnt/data Won''t Mount` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /etc/fstab has a stale/wrong UUID for the /mnt/data volume,
  so it doesn''t mount on boot and /mnt/data shows empty. After a reboot, /mnt/data is empty because /etc/fstab
  references a UUID that no longer matches the data volume (e.g. the disk was re-created or cloned). The
  mount silently fails (or mounts nothing), so the data appears missing. Find the correct UUID, fix the
  fstab entry, and remount so the data is accessible.


  OBJECTIVE: Confirm /mnt/data isn''t mounted and find the wrong UUID in fstab; Look up the device''s
  real UUID and correct the fstab entry; Run mount -a and verify the data is accessible. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm /mnt/data isn't mounted and find the wrong UUID in fstab
- Look up the device's real UUID and correct the fstab entry
- Run mount -a and verify the data is accessible
initial_state: Linux server where /etc/fstab has a stale/wrong UUID for the /mnt/data volume, so it doesn't
  mount on boot and /mnt/data shows empty.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
