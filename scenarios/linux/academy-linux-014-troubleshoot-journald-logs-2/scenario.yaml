hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `journalctl -p err..alert`, `journalctl -b`, and
    `/etc/systemd/journald.conf`.

    2. Write down what looks normal versus wrong or missing for journald logging.

    3. Recall the core idea: structured logs, priorities, boots, and persistent journal
    storage. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for journald logging.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `journalctl -p err..alert`, `journalctl -b`, and
    `/etc/systemd/journald.conf`.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — the relevant error window is visible with useful metadata.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-linux-014-troubleshoot-journald-logs-2.conf`,
