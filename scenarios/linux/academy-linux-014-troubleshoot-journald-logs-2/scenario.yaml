description: 'Production alert: errors are hard to find or logs rotate away before
  investigation. You are on call for Linux Administration and must troubleshoot journald
  logging methodically — triage symptoms, find root cause, apply the smallest safe
  fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: errors are hard to find or logs rotate away before
  investigation'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Linux practice server is degraded. Errors are hard to find or logs
  rotate away before investigation. Recent changes may exist around journald logging,
  but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Triage: `journalctl -p err..alert`, `journalctl -b`, and `/etc/systemd/journald.conf`.
    Capture timestamps, error messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: the relevant error window is visible with useful metadata.
    Document the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-linux-014-troubleshoot-journald-logs-2.conf`,
    and rerun Check Solution.'
