title: New User Cannot Login — Existing Users Unaffected
slug: linux-user-login-fail
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `New User Cannot Login
  — Existing Users Unaffected` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. The user ''appuser'' exists in /etc/passwd. Attempting
  to

  switch to the user with su - appuser fails. SSH login as appuser is also rejected.

  Other users like ''admin'' and ''root'' can log in without issue.

  The account was created with: useradd -m appuser but no password was set. A new user account ''appuser''
  was created by the ops team but the user reports being

  unable to log in. SSH returns "Permission denied" immediately and console login also

  fails. All existing users can log in normally. There are multiple possible causes:

  a locked password, an invalid shell, a missing home directory, or pam_nologin being

  active. Each must be checked systematically.


  OBJECTIVE: Check /etc/shadow for appuser — the password field will show !! indicating locked; Set a
  password with passwd appuser to unlock the account; Verify the shell in /etc/passwd is not /sbin/nologin
  or /bin/false. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. The user ''appuser'' exists in /etc/passwd. Attempting to

  switch to the user with su - appuser fails. SSH login as appuser is also rejected.

  Other users like ''admin'' and ''root'' can log in without issue.

  The account was created with: useradd -m appuser but no password was set.

  '
objectives:
- Check /etc/shadow for appuser — the password field will show !! indicating locked
- Set a password with passwd appuser to unlock the account
- Verify the shell in /etc/passwd is not /sbin/nologin or /bin/false
- Check that the home directory /home/appuser exists with correct ownership
- Confirm /etc/nologin does not exist (if it does, remove it as it blocks all non-root logins)
- Verify login succeeds with su - appuser
