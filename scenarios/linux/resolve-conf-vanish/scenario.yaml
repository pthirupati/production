objectives:
- Confirm NetworkManager is managing the connection with nmcli con show
- Set DNS persistently using nmcli: nmcli con mod "System eth0" ipv4.dns "8.8.8.8 8.8.4.4"
- Disable NetworkManager from overwriting resolv.conf with PEERDNS=no in the ifcfg file
- Apply changes with nmcli con up "System eth0"
- Reboot and verify /etc/resolv.conf still contains the correct nameservers
