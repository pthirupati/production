title: /etc/resolv.conf Reverts After Reboot — DNS Lost
slug: linux-resolve-conf-vanish
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `/etc/resolv.conf Reverts
  After Reboot — DNS Lost` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. /etc/resolv.conf currently contains:

  nameserver 8.8.8.8

  nameserver 8.8.4.4

  DNS resolution works now but a previous reboot cleared these entries. NetworkManager

  is running and manages the primary network connection "System eth0". DNS resolution works fine until
  the server is rebooted, at which point /etc/resolv.conf

  is overwritten by NetworkManager and the manually added nameserver entries are gone.

  This is because NetworkManager manages /etc/resolv.conf by default and overwrites any

  manual edits. The correct fix is to configure DNS through NetworkManager rather than

  editing /etc/resolv.conf directly.


  OBJECTIVE: Confirm NetworkManager is managing the connection with nmcli con show; {''Set DNS persistently
  using nmcli'': ''nmcli con mod "System eth0" ipv4.dns "8.8.8.8 8.8.4.4"''}; Disable NetworkManager from
  overwriting resolv.conf with PEERDNS=no in the ifcfg file. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. /etc/resolv.conf currently contains:

  nameserver 8.8.8.8

  nameserver 8.8.4.4

  DNS resolution works now but a previous reboot cleared these entries. NetworkManager

  is running and manages the primary network connection "System eth0".

  '
objectives:
- Confirm NetworkManager is managing the connection with nmcli con show
- Set DNS persistently using nmcli: nmcli con mod "System eth0" ipv4.dns "8.8.8.8 8.8.4.4"
- Disable NetworkManager from overwriting resolv.conf with PEERDNS=no in the ifcfg file
- Apply changes with nmcli con up "System eth0"
- Reboot and verify /etc/resolv.conf still contains the correct nameservers
