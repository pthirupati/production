category: Linux Administration
description: 'The kernel panics on boot with "VFS: Unable to mount root fs" because it cannot mount the
  root filesystem — typically a wrong root device/UUID in the boot entry or fstab, or an initramfs missing
  the storage driver. Correct the root reference (and/or rebuild the initramfs) so the kernel mounts root
  and boots.'
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 10
  content: 'From rescue media, compare the real root device against what''s configured: `blkid` vs the
    `root=` in the GRUB entry and the root line in /etc/fstab. A UUID mismatch causes the VFS panic.'
- order: 2
  cost: 15
  content: 'If the device is right but the driver is missing from initramfs, that also yields this panic.
    Decide which: wrong identifier vs missing module.'
- order: 3
  cost: 20
  content: Fix the UUID in /etc/fstab and the GRUB entry (then `grub2-mkconfig -o /boot/grub2/grub.cfg`),
    and/or rebuild initramfs with `dracut -f`. Reboot — the kernel mounts root and boots cleanly.
initial_state: 'Simulated RHEL 9 server. Boot ends in a kernel panic: "VFS: Unable to mount root fs on
  unknown-block". The root device can''t be found/mounted as currently configured.'
is_free: false
jira_priority: Medium
lab_mode: simulation
max_score: 100
objectives:
- Read the panic and identify that root cannot be mounted
- Find the wrong root UUID/device or missing initramfs driver
- Fix the root reference / rebuild initramfs so the system boots
requires_companion_hosts: false
simulation_type: rhel
slug: sim-rhel-kernel-panic
time_limit: 900
title: Kernel Panic on Boot
