category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Kernel Panic on Boot`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. Boot ends in a kernel panic: "VFS: Unable to mount
  root fs on unknown-block". The root device can''t be found/mounted as currently configured. The kernel
  panics on boot with "VFS: Unable to mount root fs" because it cannot mount the root filesystem — typically
  a wrong root device/UUID in the boot entry or fstab, or an initramfs missing the storage driver. Correct
  the root reference (and/or rebuild the initramfs) so the kernel mounts root and boots.


  OBJECTIVE: Read the panic and identify that root cannot be mounted; Find the wrong root UUID/device
  or missing initramfs driver; Fix the root reference / rebuild initramfs so the system boots. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Read the panic and identify that root cannot be mounted'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find the wrong root UUID/device or missing initramfs driver

    2. Fix the root reference / rebuild initramfs so the system boots'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root reference / rebuild initramfs so the system boots.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
