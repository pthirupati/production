title: Cron Jobs Not Executing
slug: linux-cron-not-running
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Cron Jobs Not Executing`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where crond is active but a scheduled job never executes, due
  to a combination of missing PATH, non-executable script, and/or cron.allow/deny restrictions. Scheduled
  cron jobs are silently skipped even though the crond service is active. The job fails for environment
  reasons that produce no obvious error: a missing PATH in the crontab, the script lacking its execute
  bit, and/or cron access control blocking the user. Diagnose from the logs and fix all three so the job
  runs on schedule.


  OBJECTIVE: Check cron logs and identify why jobs are not executing; Fix the PATH, script permissions,
  and cron access-control issues; Confirm the job runs on the next scheduled minute. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
