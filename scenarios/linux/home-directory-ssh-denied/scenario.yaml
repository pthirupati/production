title: SSH Rejects Writable Home Directory
slug: home-directory-ssh-denied
lab_mode: simulation
simulation_type: generic
technology: Linux
category: SSH / Security
difficulty: easy
time_limit: 600
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q38 home dir perms — must not be group/world writable
description: User 'ops' can no longer log in via SSH with key auth because their home directory is world-writable.
  OpenSSH's StrictModes refuses to use ~/.ssh when the home directory or key files are writable by group/other,
  as a security precaution. Tighten the home directory permissions so sshd accepts the keys again.
objectives:
- Confirm the login failure traces to permissive home-directory permissions
- Set safe permissions on the home directory
- Verify ops can SSH in with key authentication
initial_state: Linux server where /home/ops is world-writable, so sshd (StrictModes) rejects key-based
  login for ops.
hints:
- order: 1
  cost: 10
  content: 'sshd logs the reason: `journalctl -u sshd | tail` shows "bad ownership or modes for directory
    /home/ops". Check it: `ls -ld /home/ops` (group/other-writable).'
- order: 2
  cost: 15
  content: 'Remove the unsafe write bits: `chmod 755 /home/ops` (750 is fine too). Also ensure `~/.ssh`
    is 700 and `authorized_keys` is 600.'
- order: 3
  cost: 20
  content: 'Verify: `ssh ops@localhost` (or from the client) now authenticates with the key — no more
    StrictModes rejection.'
