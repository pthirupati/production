topics_covered: Q38 home dir perms — must not be group/world writable
description: 'CONTEXT: A team operating Linux administration needs you to resolve `SSH Rejects Writable
  Home Directory` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /home/ops is world-writable, so sshd (StrictModes) rejects
  key-based login for ops. User ''ops'' can no longer log in via SSH with key auth because their home
  directory is world-writable. OpenSSH''s StrictModes refuses to use ~/.ssh when the home directory or
  key files are writable by group/other, as a security precaution. Tighten the home directory permissions
  so sshd accepts the keys again.


  OBJECTIVE: Confirm the login failure traces to permissive home-directory permissions; Set safe permissions
  on the home directory; Verify ops can SSH in with key authentication. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the login failure traces to permissive home-directory permissions
- Set safe permissions on the home directory
- Verify ops can SSH in with key authentication
