title: Configure autofs for On-Demand NFS Mounting
slug: linux-autofs-setup
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Configure autofs for
  On-Demand NFS Mounting` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. The autofs package is not installed. The NFS server
  at

  192.168.1.10 is exporting /srv/data (verified with showmount -e 192.168.1.10).

  Attempting to cd /mnt/nfs/data fails with "No such file or directory" because

  autofs is not yet configured to handle that path. The team wants NFS shares to be mounted on-demand
  rather than at boot time. autofs

  provides this capability by mounting filesystems automatically when they are accessed

  and unmounting them after a period of inactivity. The NFS server at 192.168.1.10 is

  exporting /srv/data. autofs must be configured to mount this share at /mnt/nfs/data

  automatically when a user navigates to that path.


  OBJECTIVE: Install autofs with yum install -y autofs; Configure /etc/auto.master to add the /mnt/nfs
  indirect map pointing to /etc/auto.nfs; {''Create /etc/auto.nfs with the entry'': ''data -rw,soft 192.168.1.10:/srv/data''}.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. The autofs package is not installed. The NFS server at

  192.168.1.10 is exporting /srv/data (verified with showmount -e 192.168.1.10).

  Attempting to cd /mnt/nfs/data fails with "No such file or directory" because

  autofs is not yet configured to handle that path.

  '
objectives:
- Install autofs with yum install -y autofs
- Configure /etc/auto.master to add the /mnt/nfs indirect map pointing to /etc/auto.nfs
- Create /etc/auto.nfs with the entry: data -rw,soft 192.168.1.10:/srv/data
- Enable and start autofs with systemctl enable --now autofs
- Verify the mount triggers automatically when running cd /mnt/nfs/data
