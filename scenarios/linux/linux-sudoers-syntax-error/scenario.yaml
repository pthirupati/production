description: 'CONTEXT: A team operating Linux administration needs you to resolve `Broken sudoers Locks
  Out Admins` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Linux host whose /etc/sudoers.d drop-in has a syntax error, breaking privilege
  escalation. A syntax error in a sudoers drop-in breaks sudo for the ops team. Fix the file (safely)
  and confirm it is corrected.


  OBJECTIVE: Confirm sudo is broken by the syntax error; Fix the sudoers drop-in safely; Verify the file
  is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
