title: Recover a Corrupted Partition Table and Remount Data
slug: linux-fdisk-corrupt-partition-table-disk-missing-rescan-recovery
difficulty: hard
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Recover a Corrupted
  Partition Table and Remount Data` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. fdisk -l /dev/sdc shows the disk but NO partitions
  — the table

  is gone. /data is not mounted. /etc/fstab references the old partition. The application

  that depends on /data is failing. After a botched dd, the partition table on /dev/sdc was wiped. The
  disk still exists but

  its single data partition /dev/sdc1 vanished, so the /data filesystem can no longer be

  mounted and the application is down. You must recreate the partition with the SAME layout

  (one primary partition spanning the disk), restore the filesystem onto it, remount it at

  /data, repair /etc/fstab, and record the recovery. (In a real incident you might recover

  the table with testdisk or a sgdisk backup; here you rebuild it cleanly.)


  OBJECTIVE: Inspect the damage with fdisk -l /dev/sdc (no partition present); Recreate the primary partition
  with fdisk /dev/sdc; {''Lay a filesystem back down'': ''mkfs.xfs /dev/sdc1''}. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. fdisk -l /dev/sdc shows the disk but NO partitions — the table

  is gone. /data is not mounted. /etc/fstab references the old partition. The application

