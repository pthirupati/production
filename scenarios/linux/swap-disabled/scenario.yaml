description: 'CONTEXT: A team operating Linux administration needs you to resolve `Swap Disabled — Memory
  Pressure` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where a swap file exists but is not enabled (swapon --show empty),
  so the system OOM-kills under load. OOM kills are occurring because, although a swap file already exists
  on disk, it isn''t activated — `swapon --show` shows no active swap. The kernel has no overflow space
  under memory pressure. Activate the existing swap file and make it persist across reboots.


  OBJECTIVE: Confirm no swap is active despite the swap file existing; Activate the existing swap file;
  Persist swap activation in fstab. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm no swap is active despite the swap file existing
- Activate the existing swap file
- Persist swap activation in fstab
initial_state: Linux server where a swap file exists but is not enabled (swapon --show empty), so the
  system OOM-kills under load.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
