title: Swap Disabled — Memory Pressure
slug: swap-disabled
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Memory
difficulty: easy
time_limit: 600
max_score: 100
infrastructure_type: docker
docker_privileged: true
jira_priority: Medium
topics_covered: Q147-Q148 swap — swapon, /etc/fstab
description: OOM kills are occurring because, although a swap file already exists on disk, it isn't activated
  — `swapon --show` shows no active swap. The kernel has no overflow space under memory pressure. Activate
  the existing swap file and make it persist across reboots.
objectives:
- Confirm no swap is active despite the swap file existing
- Activate the existing swap file
- Persist swap activation in fstab
initial_state: Linux server where a swap file exists but is not enabled (swapon --show empty), so the
  system OOM-kills under load.
hints:
- order: 1
  cost: 10
  content: 'Check current swap: `free -h` (Swap: 0) and `swapon --show` (empty), while the file exists
    (`ls -l /swapfile`).'
- order: 2
  cost: 15
  content: 'Activate it: `swapon /swapfile` (if it complains, re-run `mkswap /swapfile` first and ensure
    mode 600).'
- order: 3
  cost: 20
  content: Verify with `swapon --show` / `free -h`, then ensure `/swapfile none swap sw 0 0` is in /etc/fstab
    so it survives reboot.
