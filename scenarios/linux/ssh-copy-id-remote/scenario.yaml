description: 'CONTEXT: A team operating Linux administration needs you to resolve `SSH Copy-ID to Remote
  Host Fails` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two-host lab. Passwordless SSH from the client to labuser@remote-server is
  required but not set up; the key isn''t yet in the remote authorized_keys. Deployment scripts need passwordless
  SSH from the lab client to remote-server, but ssh-copy-id hasn''t been run yet, so the remote host still
  prompts for a password (or rejects the key). Install the client''s public key into labuser''s authorized_keys
  on remote-server and verify non-interactive SSH works.


  OBJECTIVE: Copy the client''s SSH public key to labuser@remote-server; Confirm the key is installed
  in the remote authorized_keys; Verify non-interactive (key-based) SSH succeeds. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
companion_hosts:
- name: server
  role: server
  hostname: remote-server
  ssh_user: labuser
  setup_command: 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server
    >/dev/null

    useradd -m labuser 2>/dev/null || true

    mkdir -p /home/labuser/.ssh && chmod 700 /home/labuser/.ssh

    chown -R labuser:labuser /home/labuser/.ssh

    sed -i ''s/#PasswordAuthentication yes/PasswordAuthentication yes/'' /etc/ssh/sshd_config

    service ssh restart 2>/dev/null || /usr/sbin/sshd

    '
objectives:
- Copy the client's SSH public key to labuser@remote-server
- Confirm the key is installed in the remote authorized_keys
- Verify non-interactive (key-based) SSH succeeds
initial_state: Two-host lab. Passwordless SSH from the client to labuser@remote-server is required but
  not set up; the key isn't yet in the remote authorized_keys.
