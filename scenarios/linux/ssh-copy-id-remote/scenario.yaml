description: 'CONTEXT: A team operating Linux administration has raised a ticket for `SSH Copy-ID to Remote
  Host Fails`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture is a single
  lab-primary node exposing terminal and config files under /etc and /var; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two-host lab. Passwordless SSH from the client to labuser@remote-server is
  required but not set up; the key isn''t yet in the remote authorized_keys.


  OBJECTIVE: Copy the client''s SSH public key to labuser@remote-server; Confirm the key is installed
  in the remote authorized_keys; Verify non-interactive (key-based) SSH succeeds. Acceptance criteria:
  the change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant terminal and config files under /etc and /var), changing one thing at a time. Check
  your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
companion_hosts:
- name: server
  role: server
  hostname: remote-server
  ssh_user: labuser
  setup_command: 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server
    >/dev/null

    useradd -m labuser 2>/dev/null || true

    mkdir -p /home/labuser/.ssh && chmod 700 /home/labuser/.ssh

    chown -R labuser:labuser /home/labuser/.ssh

    sed -i ''s/#PasswordAuthentication yes/PasswordAuthentication yes/'' /etc/ssh/sshd_config

    service ssh restart 2>/dev/null || /usr/sbin/sshd

    '
objectives:
- Copy the client's SSH public key to labuser@remote-server
- Confirm the key is installed in the remote authorized_keys
- Verify non-interactive (key-based) SSH succeeds
initial_state: Two-host lab. Passwordless SSH from the client to labuser@remote-server is required but
  not set up; the key isn't yet in the remote authorized_keys.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: SSH Copy-ID to remote host fails is not behaving
    as the scenario objectives require. This lab is about SSH Copy-ID to remote host fails — how SSH Copy-ID
    to remote host fails behaves in a Linux administration environment. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For SSH Copy-ID to remote host fails problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    1. Inspect the current state with terminal and config files under /etc and /var.

    2. Each command above tells you something specific — status/health, recent errors, and the effective
    configuration. Read them in that order.

    3. Compare what you see to the objectives; the gap points at the fault.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of SSH Copy-ID to remote host fails is at fault.

    2. Re-run the most relevant of terminal and config files under /etc and /var focused on just that
    part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''SSH Copy-ID to
    remote host fails is not behaving as the scenario objectives require'' toward ''`check.sh` exits successfully''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the smallest reversible change your hypothesis points to. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.

    2. Re-run `bash check.sh` and confirm `check.sh` exits successfully.

    3. If it still fails, the hypothesis was wrong — go back to the evidence, do not stack changes.


    WHY: the grader validates real system state, not marker files — a fix only counts when the subsystem
    is actually healthy.'
validation_script: 'ssh -o BatchMode=yes -o StrictHostKeyChecking=no labuser@remote-server echo fixitlab-ok

  '
