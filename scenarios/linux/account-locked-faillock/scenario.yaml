description: 'CONTEXT: A team operating Linux administration needs you to resolve `Account Locked After
  Failed Logins` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server with pam_faillock enforced. The ''lockeduser'' account is locked
  after repeated failed logins; authentication attempts are denied even with the right password. The ''lockeduser''
  account has been locked out after too many failed login attempts — pam_faillock has tripped its deny
  threshold (and/or the account was manually locked with passwd -l), so even correct credentials are rejected.
  Confirm the lock, reset the failed-attempt counter, unlock the account, and verify the user can authenticate
  again.


  OBJECTIVE: Confirm the account is locked (faillock / passwd -S); Reset the failed-login counter and
  unlock the account; Verify lockeduser can authenticate successfully again. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the account is locked (faillock / passwd -S)
- Reset the failed-login counter and unlock the account
- Verify lockeduser can authenticate successfully again
