title: Hung Server — Reset the VM in VMware to Recover the Terminal
slug: linux-server-hung-needs-vmware-reset
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Hung Server — Reset
  the VM in VMware to Recover the Terminal` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator.
  The

  guest is hung (no VMware Tools heartbeat) and nginx is failed. Commands you run in

  the terminal cannot recover a hung kernel — the VM must be reset from VMware. web-prod-01 is wedged
  — the guest kernel has stopped responding and the web

  service (nginx) is down. VMware Tools shows no heartbeat. You cannot fix this from

  inside the guest because the OS is hung. This is a CROSS-TECHNOLOGY task: open the

  vCenter simulator for this server and perform a hard RESET (Power -> Reset / Restart)

  on web-prod-01. Once the VM reboots and the guest is responsive again, confirm from

  the terminal that nginx is back up.


  OBJECTIVE: Open the VMware simulator (toolbar link) for this server; Reset / Restart web-prod-01 from
  the VMware Power menu (the guest is hung); Wait for the VM to come back and the guest to respond. Success
  means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator. The

  guest is hung (no VMware Tools heartbeat) and nginx is failed. Commands you run in

  the terminal cannot recover a hung kernel — the VM must be reset from VMware.

  '
objectives:
- Open the VMware simulator (toolbar link) for this server
- Reset / Restart web-prod-01 from the VMware Power menu (the guest is hung)
- Wait for the VM to come back and the guest to respond
- Confirm nginx is active again from the terminal (systemctl is-active nginx)
lab_mode: simulation
simulation_type: generic
cross_technology: true
vmware_link: true
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Confirm nginx is active again from the terminal (systemctl is-active nginx).

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
