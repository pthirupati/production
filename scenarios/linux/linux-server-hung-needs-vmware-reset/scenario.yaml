title: Hung Server — Reset the VM in VMware to Recover the Terminal
slug: linux-server-hung-needs-vmware-reset
difficulty: medium
category: Linux Administration
description: |
  web-prod-01 is wedged — the guest kernel has stopped responding and the web
  service (nginx) is down. VMware Tools shows no heartbeat. You cannot fix this from
  inside the guest because the OS is hung. This is a CROSS-TECHNOLOGY task: open the
  vCenter simulator for this server and perform a hard RESET (Power -> Reset / Restart)
  on web-prod-01. Once the VM reboots and the guest is responsive again, confirm from
  the terminal that nginx is back up.
initial_state: |
  Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator. The
  guest is hung (no VMware Tools heartbeat) and nginx is failed. Commands you run in
  the terminal cannot recover a hung kernel — the VM must be reset from VMware.
objectives:
  - Open the VMware simulator (toolbar link) for this server
  - Reset / Restart web-prod-01 from the VMware Power menu (the guest is hung)
  - Wait for the VM to come back and the guest to respond
  - Confirm nginx is active again from the terminal (systemctl is-active nginx)
lab_mode: simulation
simulation_type: generic
cross_technology: true
vmware_link: true
time_limit: 900
max_score: 100
is_free: false
hints:
  - content: 'A hung guest cannot be fixed from inside itself. Open the VMware simulator (toolbar -> Open VMware) and select web-prod-01.'
    cost: 10
    order: 1
  - content: 'Use VM Actions -> Power -> Reset (or Restart) on web-prod-01 to force a reboot of the wedged guest.'
    cost: 15
    order: 2
  - content: 'After the reset, the guest comes back and nginx recovers. Verify in the terminal: systemctl is-active nginx (should report active).'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Critical
