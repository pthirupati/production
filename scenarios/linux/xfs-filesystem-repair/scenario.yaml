title: XFS Filesystem Corrupt — Repair with xfs_repair
slug: linux-xfs-filesystem-repair
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `XFS Filesystem Corrupt
  — Repair with xfs_repair` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. /var/data is not mounted. dmesg shows XFS mount errors
  for

  /dev/sdb1 including "Metadata CRC error" and "xfs_mountfs: corrupted superblock".

  Applications that store data in /var/data are failing to start. The directory

  /var/data exists but ls /var/data shows nothing since the filesystem is unmounted. The XFS filesystem
  on /dev/sdb1, normally mounted at /var/data, has become corrupt

  after an unclean shutdown. The kernel refuses to mount it and dmesg shows XFS metadata

  errors. The xfs_repair utility must be used to scan and repair the filesystem before

  it can be remounted. Data integrity must be verified after the repair completes.


  OBJECTIVE: Read dmesg | grep -i xfs to understand the corruption error; Confirm the filesystem is unmounted
  with mount | grep sdb1; Run xfs_repair /dev/sdb1 and review its output for repaired structures. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. /var/data is not mounted. dmesg shows XFS mount errors for

