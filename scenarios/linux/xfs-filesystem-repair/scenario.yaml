  '
objectives:
- Read dmesg | grep -i xfs to understand the corruption error
- Confirm the filesystem is unmounted with mount | grep sdb1
- Run xfs_repair /dev/sdb1 and review its output for repaired structures
- Mount the filesystem with mount /dev/sdb1 /var/data
- Verify data integrity by listing /var/data and checking key files are present
