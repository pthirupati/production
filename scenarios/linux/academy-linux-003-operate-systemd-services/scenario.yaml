title: 'Linux Administration: Systemd Services — Daily Operations'
slug: academy-linux-003-operate-systemd-services
technology: Linux Administration
category: Operations
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Day-2 systemd service operations. The `nginx` unit on this host has entered a failed state,
  so the web service it provides is down. Investigate it the way you would in production — `systemctl
  status nginx` and `journalctl -u nginx` — then bring the unit back to an active (running) state. Verify
  with `systemctl is-active nginx`.
objectives:
- The nginx service is active (running) again
- The unit is healthy and (ideally) enabled to survive reboot
- systemctl is-active nginx reports 'active'
initial_state: The `nginx` service is installed but currently failed/stopped, so the site it serves is
  unavailable.
hints:
- order: 1
  cost: 10
  content: 'Pre-check the unit: `systemctl status nginx` and `journalctl -u nginx` to see why it is not
    running.'
- order: 2
  cost: 15
  content: Bring it up with the smallest safe action rather than reinstalling — a stopped/failed unit
    usually just needs to be started.
- order: 3
  cost: 20
  content: Run `sudo systemctl start nginx` (add `sudo systemctl enable nginx` for persistence), confirm
    `systemctl is-active nginx`, then Check Solution.
