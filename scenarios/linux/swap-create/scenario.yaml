title: Add Swap Space to Prevent OOM Kills
slug: linux-swap-create
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Add Swap Space to Prevent
  OOM Kills` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server with no active swap (swapon --show is empty), leading to OOM
  kills under memory pressure. A swap file needs to be created and enabled. The system is suffering OOM
  (out-of-memory) kills because no swap space is configured — `swapon --show` is empty. Adding swap gives
  the kernel overflow room and reduces OOM events. Create a 2GB swap file with secure permissions, initialize
  and activate it, and make it persistent via fstab.


  OBJECTIVE: Create a 2GB swap file with secure (600) permissions; Initialize it with mkswap and activate
  it with swapon; Verify with swapon --show / free -h and persist it in fstab. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
