title: Add Swap Space to Prevent OOM Kills
slug: linux-swap-create
difficulty: easy
category: Linux Administration
description: The system is suffering OOM (out-of-memory) kills because no swap space is configured — `swapon
  --show` is empty. Adding swap gives the kernel overflow room and reduces OOM events. Create a 2GB swap
  file with secure permissions, initialize and activate it, and make it persistent via fstab.
initial_state: Linux server with no active swap (swapon --show is empty), leading to OOM kills under memory
  pressure. A swap file needs to be created and enabled.
objectives:
- Create a 2GB swap file with secure (600) permissions
- Initialize it with mkswap and activate it with swapon
- Verify with swapon --show / free -h and persist it in fstab
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Create the file: `fallocate -l 2G /swapfile` (or `dd if=/dev/zero of=/swapfile bs=1M count=2048`
    if fallocate is unavailable), then secure it: `chmod 600 /swapfile`.'
- order: 2
  cost: 15
  content: 'Make it swap and turn it on: `mkswap /swapfile && swapon /swapfile`.'
- order: 3
  cost: 20
  content: 'Confirm with `swapon --show` and `free -h`, then persist: add `/swapfile none swap sw 0 0`
    to /etc/fstab.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
