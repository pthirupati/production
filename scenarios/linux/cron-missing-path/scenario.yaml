title: Cron Job Fails — PATH Not Set
slug: cron-missing-path
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Scheduling
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q193 cron environment — PATH in crontab
description: A per-minute cron job is supposed to create /var/run/cron-ok but never does. cron runs with
  a minimal PATH (typically /usr/bin:/bin), and the crontab invokes backup.sh by bare name without an
  absolute path, so cron can't find it. Fix the job to use a full path (or set PATH in the crontab) so
  it runs.
objectives:
- Find from cron logs why the job fails to run the script
- Fix the crontab to use an absolute path (or set PATH)
- Verify the job creates /var/run/cron-ok
initial_state: Linux server where a minute-interval cron job calls backup.sh without a full path or PATH,
  so it silently fails and /var/run/cron-ok is never created.
hints:
- order: 1
  cost: 10
  content: 'Check cron''s log: `grep CRON /var/log/syslog` (or `journalctl -u cron`). You''ll see it can''t
    find `backup.sh` because cron''s PATH is minimal.'
- order: 2
  cost: 15
  content: Either invoke it absolutely — `* * * * * /usr/local/bin/backup.sh` — or add a `PATH=` line
    at the top of the crontab.
- order: 3
  cost: 20
  content: 'Wait for the next minute (or run the absolute command yourself) and confirm: `ls -l /var/run/cron-ok`
    now exists.'
