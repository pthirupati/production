description: 'CONTEXT: A team operating Linux administration needs you to resolve `Cron Job Fails — PATH
  Not Set` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where a minute-interval cron job calls backup.sh without a full
  path or PATH, so it silently fails and /var/run/cron-ok is never created. A per-minute cron job is supposed
  to create /var/run/cron-ok but never does. cron runs with a minimal PATH (typically /usr/bin:/bin),
  and the crontab invokes backup.sh by bare name without an absolute path, so cron can''t find it. Fix
  the job to use a full path (or set PATH in the crontab) so it runs.


  OBJECTIVE: Find from cron logs why the job fails to run the script; Fix the crontab to use an absolute
  path (or set PATH); Verify the job creates /var/run/cron-ok. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Find from cron logs why the job fails to run the script
- Fix the crontab to use an absolute path (or set PATH)
- Verify the job creates /var/run/cron-ok
