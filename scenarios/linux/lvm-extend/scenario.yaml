description: 'CONTEXT: A team operating Linux administration needs you to resolve `Extend LVM Logical
  Volume` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server using LVM where /data is full but VG fixitlab has free extents.
  The datalv LV and its XFS filesystem need to be extended. /data is full and applications report "No
  space left on device", but `vgs` shows the volume group still has free extents — the logical volume
  simply hasn''t been grown into them yet. Extend the datalv logical volume to use the free space, then
  grow the XFS filesystem online so /data has room again.


  OBJECTIVE: Confirm free extents exist in the VG while /data is full; Extend the datalv logical volume;
  Grow the XFS filesystem on /data and verify free space. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm free extents exist in the VG while /data is full
- Extend the datalv logical volume
- Grow the XFS filesystem on /data and verify free space
initial_state: Linux server using LVM where /data is full but VG fixitlab has free extents. The datalv
  LV and its XFS filesystem need to be extended.
