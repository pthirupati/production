title: Extend LVM Logical Volume
slug: lvm-extend
technology: Linux
category: Storage / LVM
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: true
jira_priority: High
description: |
  /data is full on a server using LVM. Applications report "No space left on device"
  even though `vgs` shows free extents in the volume group. The logical volume was never
  grown to use available space.
objectives:
- Storage layout and utilization are understood
- /data has sufficient free space for applications
- Filesystem on /data accepts new writes
initial_state: 'Ubuntu container with loop-backed LVM. VG fixitlab, LV datalv mounted at /data.

  '
hints:
- order: 1
  cost: 10
  content: Run `vgs` and `lvs` to see free space in the volume group.
- order: 2
  cost: 20
  content: '`lvextend -L +200M /dev/fixitlab/datalv` then `xfs_growfs /data`.'
- order: 3
  cost: 15
  content: Inspect VG/LV with vgs, lvs, df
- order: 4
  cost: 15
  content: Extend logical volume datalv in VG fixitlab
- order: 5
  cost: 15
  content: Grow the XFS filesystem on /data
