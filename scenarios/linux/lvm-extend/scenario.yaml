title: Extend LVM Logical Volume
slug: lvm-extend
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Storage / LVM
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: true
jira_priority: High
description: /data is full and applications report "No space left on device", but `vgs` shows the volume
  group still has free extents — the logical volume simply hasn't been grown into them yet. Extend the
  datalv logical volume to use the free space, then grow the XFS filesystem online so /data has room again.
objectives:
- Confirm free extents exist in the VG while /data is full
- Extend the datalv logical volume
- Grow the XFS filesystem on /data and verify free space
initial_state: Linux server using LVM where /data is full but VG fixitlab has free extents. The datalv
  LV and its XFS filesystem need to be extended.
hints:
- order: 1
  cost: 10
  content: 'See the mismatch: `df -h /data` is 100%, but `vgs`/`lvs` show free extents in VG fixitlab
    — the LV just needs extending.'
- order: 2
  cost: 20
  content: 'Extend the LV into free space: `lvextend -L +200M /dev/fixitlab/datalv` (or `-l +100%FREE`
    to use it all).'
- order: 3
  cost: 30
  content: 'Grow the filesystem online: `xfs_growfs /data` (XFS grows mounted). Confirm with `df -h /data`
    and a test write.'
