title: Configure Samba Share for Windows Client Access
slug: linux-samba-share
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration has raised a ticket for `Configure Samba
  Share for Windows Client Access`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture is a single
  lab-primary node exposing terminal and config files under /etc and /var; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. The directory /srv/share exists and contains project
  files.

  The samba package is not installed. Windows clients attempting to browse the network

  cannot see this server. The server''s IP is 192.168.1.20.


  OBJECTIVE: Install samba with yum install -y samba; Configure /etc/samba/smb.conf with a [projects]
  share section pointing to /srv/share; Create a Samba user with smbpasswd -a smbuser to set the Samba
  password. Acceptance criteria: the change is minimal and reversible, and success means `firewall-cmd
  --list-ports` includes `80/tcp`.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant terminal and config files under /etc and /var), changing one thing at a time. Check
  your work continuously against the objective — success means `firewall-cmd --list-ports` includes `80/tcp`.


  VERIFY: Re-run the same check the grader uses and confirm `firewall-cmd --list-ports` includes `80/tcp`.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. The directory /srv/share exists and contains project files.

  The samba package is not installed. Windows clients attempting to browse the network

  cannot see this server. The server''s IP is 192.168.1.20.

  '
objectives:
- Install samba with yum install -y samba
- Configure /etc/samba/smb.conf with a [projects] share section pointing to /srv/share
- Create a Samba user with smbpasswd -a smbuser to set the Samba password
- Enable and start smb and nmb services with systemctl enable --now smb nmb
- Open the firewall with firewall-cmd --permanent --add-service=samba && firewall-cmd --reload
- Validate configuration with testparm and verify with smbclient -L localhost -U smbuser
