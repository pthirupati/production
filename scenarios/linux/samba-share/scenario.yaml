title: Configure Samba Share for Windows Client Access
slug: linux-samba-share
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Configure Samba Share
  for Windows Client Access` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. The directory /srv/share exists and contains project
  files.

  The samba package is not installed. Windows clients attempting to browse the network

  cannot see this server. The server''s IP is 192.168.1.20. Windows workstations in the office need to
  access /srv/share on this Linux server as

  a network drive. Samba must be installed and configured to expose this directory as a

  Windows-compatible SMB share with proper authentication. The firewall must also be

  opened for Samba traffic and the configuration must be validated before enabling the

  service.


  OBJECTIVE: Install samba with yum install -y samba; Configure /etc/samba/smb.conf with a [projects]
  share section pointing to /srv/share; Create a Samba user with smbpasswd -a smbuser to set the Samba
  password. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. The directory /srv/share exists and contains project files.

  The samba package is not installed. Windows clients attempting to browse the network

  cannot see this server. The server''s IP is 192.168.1.20.

  '
objectives:
- Install samba with yum install -y samba
- Configure /etc/samba/smb.conf with a [projects] share section pointing to /srv/share
- Create a Samba user with smbpasswd -a smbuser to set the Samba password
- Enable and start smb and nmb services with systemctl enable --now smb nmb
- Open the firewall with firewall-cmd --permanent --add-service=samba && firewall-cmd --reload
- Validate configuration with testparm and verify with smbclient -L localhost -U smbuser
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.


    WHY: a running service behind a closed firewall still fails health checks.'
