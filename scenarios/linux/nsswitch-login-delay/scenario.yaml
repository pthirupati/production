description: 'CONTEXT: A team operating Linux administration needs you to resolve `Slow SSH Login — NSS/DNS
  Delay` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where a misconfigured /etc/nsswitch.conf hosts line causes lookups
  to hang on a slow source, adding a 30s+ delay to SSH password prompts. SSH logins take 30+ seconds at
  the password prompt because name-service lookups are timing out — /etc/nsswitch.conf lists an unreachable/slow
  source before the local files/DNS, so each lookup waits for a timeout. Fix the nsswitch hosts ordering
  (and optionally disable sshd''s reverse-DNS) to make logins fast again.


  OBJECTIVE: Trace the login delay to nsswitch lookup timeouts; Correct the hosts line ordering in /etc/nsswitch.conf;
  Verify logins are fast (optionally set UseDNS no in sshd_config). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Trace the login delay to nsswitch lookup timeouts
- Correct the hosts line ordering in /etc/nsswitch.conf
- Verify logins are fast (optionally set UseDNS no in sshd_config)
initial_state: Linux server where a misconfigured /etc/nsswitch.conf hosts line causes lookups to hang
  on a slow source, adding a 30s+ delay to SSH password prompts.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `cat /etc/resolv.conf` and test with `dig example.com` or `getent hosts
    example.com`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the configured nameserver IP in resolv.conf.

    2. `ping` or `nc -zv` the nameserver — is it reachable?

    3. Check if NetworkManager or systemd-resolved overwrites the file.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Verify logins are fast (optionally set UseDNS no in sshd_config).

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
