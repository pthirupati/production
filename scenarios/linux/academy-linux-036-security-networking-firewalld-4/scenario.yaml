title: 'Linux Administration: Networking And Firewalld — Security Practice'
slug: academy-linux-036-security-networking-firewalld-4
technology: Linux Administration
category: Security
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Firewall administration with firewalld. Clients cannot reach the HTTP service because the
  active firewalld zone does not permit web traffic on port 80. Open HTTP persistently and reload firewalld
  so the rule survives, then confirm the zone allows it. Verify with `firewall-cmd --list-all`.
objectives:
- HTTP (port 80/tcp) is permitted in the active firewalld zone
- The rule is persistent across a firewalld reload
- firewall-cmd shows the HTTP port/service open
initial_state: Port 80/tcp (HTTP) is not allowed through firewalld in the active zone, so the web service
  is unreachable from clients.
hints:
- order: 1
  cost: 10
  content: 'Inspect the active zone: `firewall-cmd --list-all` to see which services/ports are currently
    allowed.'
- order: 2
  cost: 15
  content: Make the change persistent (`--permanent`) and remember runtime rules need a `--reload` to
    take effect.
- order: 3
  cost: 20
  content: Run `sudo firewall-cmd --permanent --add-service=http` (or `--add-port=80/tcp`) then `sudo
    firewall-cmd --reload`; verify with `firewall-cmd --list-all`, then Check Solution.
