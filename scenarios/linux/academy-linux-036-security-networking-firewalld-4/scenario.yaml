description: 'CONTEXT: A team operating Linux administration has raised a ticket for `Networking And Firewalld
  — Security Lab`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture is a single
  lab-primary node exposing terminal and config files under /etc and /var; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around networking and
  firewalld. Assume an auditor or pen test is next week — tighten controls with evidence.

  OBJECTIVE: Unsafe defaults related to networking and firewalld are removed or constrained; Access follows
  least privilege and is auditable; Security checks pass without breaking required functionality. Acceptance
  criteria: the change is minimal and reversible, and success means `firewall-cmd --list-ports` includes
  `80/tcp`.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant terminal and config files under /etc and /var), changing one thing at a time. Check
  your work continuously against the objective — success means `firewall-cmd --list-ports` includes `80/tcp`.

  VERIFY: Re-run the same check the grader uses and confirm `firewall-cmd --list-ports` includes `80/tcp`.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to networking and firewalld are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around networking and firewalld. Assume
  an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: a service is unreachable because the port or
    zone is wrong. This lab is about networking and firewalld — interfaces, zones, and persistent firewall
    rules. Read the objectives and the current state, and note precisely what looks wrong versus healthy
    before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For networking and firewalld problems the reliable method is: (1)
    reproduce/observe the failure, (2) narrow from the whole system down to the one component that owns
    the symptom, (3) change exactly one thing, (4) re-check. Apply least privilege: remove the unsafe
    default, then grant only the explicit access the workload actually needs.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of networking and firewalld is at fault.

    2. Re-run the most relevant of `ip a`, `nmcli con show`, and `firewall-cmd --list-all` focused on
    just that part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''a service is
    unreachable because the port or zone is wrong'' toward ''the intended ports are open in the right
    zone and survive reload''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.

    WHY: a running service behind a closed firewall still fails health checks.'
