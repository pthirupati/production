title: 'Linux Administration: Cron And Systemd Timers — Observability Practice'
slug: academy-linux-038-observability-cron-timers-4
technology: Linux Administration
category: Observability
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Scheduled-jobs operations. The `crond` scheduler is not running, so no cron jobs (backups,
  rotations, batch tasks) will fire. Restore the scheduler so scheduled work resumes. Verify with `systemctl
  is-active crond`.
objectives:
- The crond scheduler service is active (running)
- Scheduled jobs can fire again
- systemctl is-active crond reports 'active'
initial_state: The cron scheduler (`crond`) is stopped, so no scheduled jobs will run until it is started.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `systemctl status crond` and `systemctl list-timers` for context.

    2. Write down what looks normal versus wrong or missing.

    3. Form one hypothesis about the root cause before you change anything.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture command output before the change so you can prove it worked afterward.'
- order: 3
  cost: 20
  content: 'Guided walkthrough:

    1. Re-check the current state — Check the scheduler: `systemctl status crond` and `systemctl list-timers`
    for context.

    2. No crontab edits are required — the scheduler daemon itself is down.

    3. Verify the result — Run `sudo systemctl enable --now crond`, confirm with `systemctl is-active
    crond`, then Check Solution.

    4. Click Check Solution once every objective is met.'
