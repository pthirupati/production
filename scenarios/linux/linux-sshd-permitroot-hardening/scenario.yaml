description: 'CONTEXT: A team operating Linux administration needs you to resolve `SSH Hardening Broke
  Automation Login` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Linux host whose sshd hardening drop-in blocks a required automation login.
  An automation account can no longer log in over SSH because a hardening change set an overly broad restriction.
  Fix the sshd drop-in correctly and confirm it is corrected.


  OBJECTIVE: Confirm the automation SSH login is blocked; Adjust the sshd drop-in correctly; Verify the
  config is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
