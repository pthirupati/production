description: 'CONTEXT: A team operating Linux administration needs you to resolve `ACL Required for Shared
  Directory` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server with /srv/shared protected by POSIX ACLs. alice cannot read/write
  it because no ACL entry grants her access, despite nominal group membership. User alice gets "Permission
  denied" on /srv/shared even though she appears to be in the right group. The directory relies on POSIX
  ACLs, and the specific ACL entry granting alice access is missing (the standard group bits aren''t enough).
  Grant the correct ACL and confirm alice can access the directory.


  OBJECTIVE: Inspect the directory''s ACLs and confirm alice has no granting entry; Add an ACL entry granting
  alice access; Verify alice can access /srv/shared. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Inspect the directory's ACLs and confirm alice has no granting entry
- Add an ACL entry granting alice access
- Verify alice can access /srv/shared
