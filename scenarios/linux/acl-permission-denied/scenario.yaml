title: ACL Required for Shared Directory
slug: acl-permission-denied
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Permissions / ACL
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q19 ACL — setfacl -m u:user:rx
description: User alice gets "Permission denied" on /srv/shared even though she appears to be in the right
  group. The directory relies on POSIX ACLs, and the specific ACL entry granting alice access is missing
  (the standard group bits aren't enough). Grant the correct ACL and confirm alice can access the directory.
objectives:
- Inspect the directory's ACLs and confirm alice has no granting entry
- Add an ACL entry granting alice access
- Verify alice can access /srv/shared
initial_state: Linux server with /srv/shared protected by POSIX ACLs. alice cannot read/write it because
  no ACL entry grants her access, despite nominal group membership.
hints:
- order: 1
  cost: 10
  content: 'Inspect the ACLs: `getfacl /srv/shared`. There''s no `user:alice` entry, and the group/other
    bits don''t grant her access.'
- order: 2
  cost: 15
  content: 'Grant her an explicit ACL: `setfacl -m u:alice:rwx /srv/shared` (add `-R` and a default ACL
    `-d -m u:alice:rwx` if she needs access to existing/new contents).'
- order: 3
  cost: 20
  content: 'Verify: `getfacl /srv/shared` shows `user:alice:rwx`, and acting as alice (`sudo -u alice
    touch /srv/shared/test`) now succeeds.'
