title: Required Kernel Module Not Loaded at Boot
slug: linux-kernel-module-not-loaded
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Required Kernel Module
  Not Loaded at Boot` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server being prepared as a Kubernetes node. lsmod | grep
  br_netfilter

  returns nothing, and there is no /etc/modules-load.d drop-in to load it at boot. kubeadm

  preflight fails with: "br_netfilter module is not loaded". A Kubernetes node preflight check fails because
  the br_netfilter kernel module is not

  loaded, so bridged pod traffic cannot be filtered by iptables. Loading the module by

  hand is not enough — it must be configured to load automatically on every boot by

  creating a drop-in under /etc/modules-load.d. You must make the module load persistent.


  OBJECTIVE: Load the module immediately with modprobe br_netfilter; Make it persistent by creating /etc/modules-load.d/k8s.conf
  containing br_netfilter; Confirm the drop-in exists so systemd-modules-load loads it on next boot. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server being prepared as a Kubernetes node. lsmod | grep br_netfilter

  returns nothing, and there is no /etc/modules-load.d drop-in to load it at boot. kubeadm

  preflight fails with: "br_netfilter module is not loaded".

  '
objectives:
- Load the module immediately with modprobe br_netfilter
- Make it persistent by creating /etc/modules-load.d/k8s.conf containing br_netfilter
- Confirm the drop-in exists so systemd-modules-load loads it on next boot
