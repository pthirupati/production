title: Create Filesystem on New Disk
slug: linux-disk-create-filesystem
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Create Filesystem on
  New Disk` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server with a raw, unformatted disk /dev/sdb present in lsblk. /data
  does not yet hold a mounted filesystem. A new block device (/dev/sdb) is visible to the system but unformatted,
  so it can''t be used for storage yet. It must be given an ext4 filesystem and mounted at /data so applications
  can write to it. Format the disk, mount it, and (for persistence) add it to fstab.


  OBJECTIVE: Create an ext4 filesystem on /dev/sdb; Mount it at /data and confirm with df -h; Make the
  mount persistent across reboots (fstab). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
lab_mode: simulation
simulation_type: rhel
time_limit: 900
max_score: 100
is_free: false
objectives:
- Create an ext4 filesystem on /dev/sdb
- Mount it at /data and confirm with df -h
- Make the mount persistent across reboots (fstab)
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
initial_state: Linux server with a raw, unformatted disk /dev/sdb present in lsblk. /data does not yet
