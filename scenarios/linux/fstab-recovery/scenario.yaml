title: Server Stuck in Emergency Mode After Bad fstab Entry
slug: linux-fstab-recovery
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Server Stuck in Emergency
  Mode After Bad fstab Entry` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server in emergency shell. Boot shows:

  "[FAILED] Failed to mount /data."

  "See ''journalctl -xb'' for details."

  "You are in emergency mode. After logging in, type ''journalctl -xb'' to view system logs..."

  Root password prompt is displayed. The root filesystem is mounted read-only. A server is stuck in emergency
  maintenance mode after a bad /etc/fstab entry was added

  for a new disk. The UUID referenced in fstab does not match any existing block device,

  causing systemd to fail during boot and drop to an emergency shell. The fstab must be

  corrected from the emergency shell to restore normal boot. This is a high-pressure

  scenario that simulates real-world boot recovery.


  OBJECTIVE: Enter the root password to get a shell in emergency mode; Remount the root filesystem read-write
  with mount -o remount,rw /; Check dmesg and journalctl -xb to identify which fstab entry failed. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server in emergency shell. Boot shows:

  "[FAILED] Failed to mount /data."

  "See ''journalctl -xb'' for details."

  "You are in emergency mode. After logging in, type ''journalctl -xb'' to view system logs..."

  Root password prompt is displayed. The root filesystem is mounted read-only.

  '
objectives:
- Enter the root password to get a shell in emergency mode
- Remount the root filesystem read-write with mount -o remount,rw /
- Check dmesg and journalctl -xb to identify which fstab entry failed
- Use blkid to find the correct UUID for the disk
- Edit /etc/fstab to correct the wrong UUID or comment out the bad entry
- Run systemctl reboot to restart and verify normal boot completes
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
