description: Service operations lab. The `crond` systemd unit is **failed/inactive** on this host — a
  realistic fault for Production Readiness workflows that depend on it. Diagnose with `systemctl status
  crond` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active crond`.
objectives:
- The `crond` service is active (running)
- '`systemctl is-active crond` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `crond` service is not running (`systemctl is-active crond` → inactive/failed). Dependent
  Production Readiness tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `lsblk`, `pvs`, `vgs`, `lvs`, and `df -h`.

    2. Write down what looks normal versus wrong or missing for storage and LVM.

    3. Recall the core idea: PV/VG/LV layout, filesystem growth, and mount persistence. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for storage and LVM.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `lsblk`, `pvs`, `vgs`, `lvs`, and `df -h`.

    2. Apply production standards for storage and LVM: resource limits, monitoring, access controls, and
    a written rollback step.

    3. Verify the result — capacity is sufficient and mounts survive reboot.

    4. Click Check Solution once `systemctl is-active crond` returns active.'
