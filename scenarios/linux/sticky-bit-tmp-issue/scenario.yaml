title: Sticky Bit Missing on Shared /tmp/app
slug: sticky-bit-tmp-issue
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Permissions
difficulty: easy
time_limit: 600
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q19 sticky bit — chmod +t
description: In the shared directory /tmp/app, users can delete each other's files because the sticky
  bit isn't set. On a world-writable shared directory, the sticky bit restricts deletion/renaming to each
  file's owner (and root). Set the sticky bit so users can no longer remove files they don't own.
objectives:
- Understand why files are deletable by non-owners (missing sticky bit)
- Set the sticky bit on the shared directory
- Verify users can no longer delete files they don't own
initial_state: Linux server where the world-writable /tmp/app lacks the sticky bit, allowing any user
  to delete other users' files.
hints:
- order: 1
  cost: 10
  content: 'Inspect the dir: `ls -ld /tmp/app` — it''s world-writable (drwxrwxrwx) with no trailing `t`,
    so anyone can delete anything.'
- order: 2
  cost: 15
  content: 'Set the sticky bit: `chmod +t /tmp/app` (or `chmod 1777 /tmp/app`).'
- order: 3
  cost: 20
  content: 'Verify: `ls -ld /tmp/app` now shows `drwxrwxrwt`. A non-owner attempting to delete another
    user''s file gets "Operation not permitted".'
