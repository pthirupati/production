description: 'CONTEXT: A team operating Linux administration needs you to resolve `Sticky Bit Missing
  on Shared /tmp/app` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where the world-writable /tmp/app lacks the sticky bit, allowing
  any user to delete other users'' files. In the shared directory /tmp/app, users can delete each other''s
  files because the sticky bit isn''t set. On a world-writable shared directory, the sticky bit restricts
  deletion/renaming to each file''s owner (and root). Set the sticky bit so users can no longer remove
  files they don''t own.


  OBJECTIVE: Understand why files are deletable by non-owners (missing sticky bit); Set the sticky bit
  on the shared directory; Verify users can no longer delete files they don''t own. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand why files are deletable by non-owners (missing sticky bit)
- Set the sticky bit on the shared directory
- Verify users can no longer delete files they don't own
initial_state: Linux server where the world-writable /tmp/app lacks the sticky bit, allowing any user
  to delete other users' files.
