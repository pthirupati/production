category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Extend LVM Volume Group
  (Jira storage request)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. The ''rhel'' volume group is out of free extents
  and / is full. A new disk is NOT attached until the @storage team confirms in Jira; after ~30s, /dev/sdb
  appears and you can extend LVM. The root filesystem is full and the volume group has no free space,
  so writes are failing. A new disk must be requested from the @storage team via the Jira ticket; once
  it''s attached, you add it as an LVM physical volume, extend the volume group and root logical volume,
  and grow the XFS filesystem online to reclaim capacity.


  OBJECTIVE: Request a new disk from the @storage team in Jira; Verify the new disk (lsblk/fdisk) and
  add it: pvcreate, vgextend; Extend the logical volume and grow the XFS filesystem (lvextend + xfs_growfs).
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
