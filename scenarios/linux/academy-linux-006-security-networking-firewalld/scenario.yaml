description: 'CONTEXT: A team operating Linux administration needs you to resolve `linux: Networking And
  Firewalld — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around networking and
  firewalld. Assume an auditor or pen test is next week — tighten controls with evidence. Security review:
  harden networking and firewalld on this linux system. Close unsafe defaults, enforce least privilege,
  and ensure interfaces, zones, and persistent firewall rules cannot be abused — without breaking legitimate
  use.


  OBJECTIVE: Unsafe defaults related to networking and firewalld are removed or constrained; Access follows
  least privilege and is auditable; Security checks pass without breaking required functionality. Success
  means `firewall-cmd --list-ports` includes `80/tcp`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to networking and firewalld are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around networking and firewalld. Assume
  an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ip a`, `nmcli con show`, and `firewall-cmd --list-all`.

    2. Write down what looks normal versus wrong or missing for networking and firewalld.

    3. Recall the core idea: interfaces, zones, and persistent firewall rules. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `ip a`, `nmcli con show`, and `firewall-cmd --list-all`.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — the intended ports are open in the right zone and survive reload.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
