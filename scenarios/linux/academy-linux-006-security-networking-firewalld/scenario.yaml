title: 'Linux Administration: Networking And Firewalld — Security Practice'
slug: academy-linux-006-security-networking-firewalld
technology: Linux Administration
category: Security
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Security review: harden networking and firewalld on this Linux Administration
  system. Close unsafe defaults, enforce least privilege, and ensure interfaces, zones,
  and persistent firewall rules cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to networking and firewalld are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around networking
  and firewalld. Assume an auditor or pen test is next week — tighten controls with
  evidence.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ip a`, `nmcli con show`, and `firewall-cmd --list-all`.

    2. Write down what looks normal versus wrong or missing for networking and firewalld.

    3. Recall the core idea: interfaces, zones, and persistent firewall rules. Form
    one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for networking and
    firewalld.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `ip a`, `nmcli con show`, and `firewall-cmd --list-all`.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit
    access the workload actually needs.

    3. Verify the result — the intended ports are open in the right zone and survive
    reload.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-linux-006-security-networking-firewalld.conf`,
    then click Check Solution.'
