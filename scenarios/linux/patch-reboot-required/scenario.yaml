title: Kernel Update Requires Reboot
slug: linux-patch-reboot-required
category: Fix
difficulty: easy
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Kernel Update Requires
  Reboot` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where a newer kernel package is installed but the running kernel
  is older; a reboot is required to activate the patched kernel. Security patches (including a kernel
  update) were installed, but the system is still running the old kernel because it hasn''t been rebooted
  — the new kernel only takes effect after a reboot. Confirm the running kernel lags the installed one,
  then reboot and verify the new kernel is active.


  OBJECTIVE: Confirm the running kernel differs from the latest installed kernel; Reboot the system; Verify
  the new kernel is active after reboot. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
lab_mode: simulation
simulation_type: rhel
time_limit: 600
max_score: 100
is_free: false
objectives:
- Confirm the running kernel differs from the latest installed kernel
- Reboot the system
- Verify the new kernel is active after reboot
