category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `RHEL System Patching
  (Jira change window)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server in a change window. Use the Jira ticket to request
  change-window actions from the @backup, @database, and @application teams (~30s replies), then patch
  and reboot in the terminal. It''s the monthly patching change window. Before touching the server you
  must coordinate in Jira with the @backup, @database, and @application teams to stop services and take
  backups. Then run a pre-check, apply updates with dnf, reboot, and run a post-check — resolving any
  mount problem that appears after reboot before bringing services back via Jira.


  OBJECTIVE: Request stop/backup from the @backup, @database, and @application teams in Jira before patching;
  Run precheck, apply dnf update, reboot, and run postcheck in the terminal; Fix any mount issue reported
  after reboot, then start DB/app via Jira. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the Linux practice server. For RHEL System
    Patching (Jira change window), inspect terminal and config files under /etc and /var before changing
    anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with terminal and config files under /etc and /var.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix any mount issue reported after reboot, then start DB/app via Jira.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
