title: Bind Mount Hides Production Web Root
slug: bind-mount-hides-data
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Storage / Mounts
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q5 bind mounts — findmnt, umount overlay, restore content
description: Nginx serves a blank page even though the real site files clearly exist under /var/www/html
  on disk. An empty directory has been bind-mounted on top of /var/www/html, so the web server sees the
  empty overlay instead of the actual content. Identify and remove the bind mount to reveal the real files
  — without deleting anything underneath.
objectives:
- Identify that /var/www/html is masked by a bind mount
- Unmount the overlay without deleting the underlying files
- Verify the real index.html content is served again
initial_state: Linux web server. The real site lives in /var/www/html on disk, but an empty directory
  is bind-mounted over that path, so nginx serves a blank/empty page.
hints:
- order: 1
  cost: 10
  content: 'Compare what''s mounted vs what''s on disk: `findmnt /var/www/html` reveals a bind mount shadowing
    the directory, and `ls /var/www/html` shows the empty overlay.'
- order: 2
  cost: 15
  content: 'Unmount the overlay — do NOT delete files: `umount /var/www/html`. The original contents underneath
    reappear immediately.'
- order: 3
  cost: 20
  content: 'Confirm: `ls /var/www/html` now shows index.html and `curl -s http://localhost` returns the
    real page. Remove the offending bind-mount line from /etc/fstab so it doesn''t return.'
