description: 'CONTEXT: A team operating Linux administration needs you to resolve `Bind Mount Hides Production
  Web Root` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux web server. The real site lives in /var/www/html on disk, but an empty
  directory is bind-mounted over that path, so nginx serves a blank/empty page. Nginx serves a blank page
  even though the real site files clearly exist under /var/www/html on disk. An empty directory has been
  bind-mounted on top of /var/www/html, so the web server sees the empty overlay instead of the actual
  content. Identify and remove the bind mount to reveal the real files — without deleting anything underneath.


  OBJECTIVE: Identify that /var/www/html is masked by a bind mount; Unmount the overlay without deleting
  the underlying files; Verify the real index.html content is served again. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify that /var/www/html is masked by a bind mount
- Unmount the overlay without deleting the underlying files
- Verify the real index.html content is served again
initial_state: Linux web server. The real site lives in /var/www/html on disk, but an empty directory
  is bind-mounted over that path, so nginx serves a blank/empty page.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
