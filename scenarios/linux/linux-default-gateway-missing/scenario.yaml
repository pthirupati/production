title: Missing Default Gateway Breaks Outbound Routing
slug: linux-default-gateway-missing
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Missing Default Gateway
  Breaks Outbound Routing` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. eth0 is up with 10.0.0.10/24 but the routing table
  has no

  default route. The persistent network config in /etc/sysconfig/network has no GATEWAY

  line. Outbound connections to the internet time out. After a network reconfiguration the server can
  reach hosts on its local subnet but

  cannot reach anything off-LAN — there is no default route. The interface eth0 has an

  address (10.0.0.10/24) but no gateway is configured, so all non-local traffic is

  dropped. You must configure the default gateway and persist it so it survives a reboot

  (write GATEWAY=10.0.0.1 into the network config).


  OBJECTIVE: Confirm the routing table has no default route; Configure the default gateway (10.0.0.1)
  for eth0; Persist it so it survives a reboot by adding GATEWAY=10.0.0.1 to /etc/sysconfig/network. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. eth0 is up with 10.0.0.10/24 but the routing table has no

