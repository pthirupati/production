description: 'CONTEXT: A team operating Linux administration needs you to resolve `linux: Users And Groups
  — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Linux practice server is online with a starter users and groups setup.
  Some pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire
  — focus on observation. This beginner-friendly linux lab introduces users and groups. You will explore
  how accounts, UIDs/GIDs, primary groups, and supplementary membership are defined on the Linux practice
  server. Read the environment first, then follow the guided steps — no prior production experience required.


  OBJECTIVE: Understand how users and groups work in this lab environment; Identify the main status and
  configuration signals for users and groups; Confirm you can read the current state confidently before
  changing anything. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how users and groups work in this lab environment
- Identify the main status and configuration signals for users and groups
- Confirm you can read the current state confidently before changing anything
initial_state: The Linux practice server is online with a starter users and groups setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `id`, `getent passwd`, and `getent group` (or equivalent directory
    tools on Windows).

    2. Write down what looks normal versus wrong or missing for users and groups.

    3. Recall the core idea: how accounts, UIDs/GIDs, primary groups, and supplementary membership are
    defined. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with `id`, `getent passwd`, and `getent group` (or equivalent directory tools on
    Windows).

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `id`, `getent passwd`, and `getent group` (or equivalent directory
    tools on Windows).

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — account and group entries match the expected owner and membership.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
