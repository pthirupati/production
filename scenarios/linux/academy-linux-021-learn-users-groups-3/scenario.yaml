title: 'Linux Administration: Users And Groups — Fundamentals Lab'
slug: academy-linux-021-learn-users-groups-3
technology: Linux Administration
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Hands-on user administration. An application is meant to run under a dedicated, non-login
  service account named `appuser`, but that account does not exist on this host yet — so the service cannot
  own its files or run with least privilege. Create the `appuser` account (with a home directory) and
  verify it resolves with `getent passwd appuser`.
objectives:
- The dedicated 'appuser' service account exists on the host
- The account is created cleanly (with a home directory)
- getent passwd appuser returns the account
initial_state: The application service account `appuser` is missing on this host. The service that depends
  on it cannot start until the account exists.
hints:
- order: 1
  cost: 10
  content: 'Inspect first: `getent passwd appuser` (will be empty) and `cat /etc/passwd` to see existing
    accounts.'
- order: 2
  cost: 15
  content: Decide whether the account needs a login shell and home directory. A service account usually
    wants a home dir but no interactive login.
- order: 3
  cost: 20
  content: 'Create it: `sudo useradd -m appuser`, confirm with `getent passwd appuser`, then run Check
    Solution.'
