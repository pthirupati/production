tasks:
- id: task_1
  title: Nginx Stream Proxy Service Down
  description: Restore healthy behavior for Nginx Stream Proxy Service Down by investigating the failure,
    applying the smallest safe fix, and validating the outcome.
  background: 'This linux lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
