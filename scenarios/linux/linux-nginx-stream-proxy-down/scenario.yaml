title: Nginx Stream Proxy Service Down
slug: linux-nginx-stream-proxy-down
technology: linux
category: Build
difficulty: medium
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Nginx Stream Proxy
  Service Down` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Linux host where nginx (running as a stream proxy) is failed. An nginx TCP
  stream proxy fronting a database is down, so clients can''t reach the DB through it. Restore nginx.


  OBJECTIVE: Confirm nginx is down; Fix the config and start nginx; Verify nginx is active. Success means
  `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A Linux host where nginx (running as a stream proxy) is failed.
objectives:
- Confirm nginx is down
- Fix the config and start nginx
- Verify nginx is active
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the stream block in nginx config (upstream, listen, proxy_pass).

    2. Run `nginx -t`, then `systemctl enable --now nginx`.

    3. Confirm `systemctl is-active nginx` returns active.


    WHY: stream proxies fail when the TCP upstream or listen directive is wrong.'
summary: Complete the nginx stream proxy service down linux lab and verify success with the checker
