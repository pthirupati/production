description: 'CONTEXT: A team operating Linux administration needs you to resolve `Fix Broken fstab Entry`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server post storage-migration where the /etc/fstab line for /mnt/data
  is invalid, so the mount fails (and `mount -a` errors). After a storage migration the server fails to
  mount /mnt/data at boot because its /etc/fstab entry is invalid — typically a wrong UUID/device for
  the migrated volume. Depending on options this can also drop boot into emergency mode. Identify and
  correct the bad line so /mnt/data mounts cleanly.


  OBJECTIVE: Identify the invalid fstab line for /mnt/data; Correct it to the right UUID/device (or remove
  it if obsolete); Verify /mnt/data mounts and the data is accessible. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the invalid fstab line for /mnt/data
- Correct it to the right UUID/device (or remove it if obsolete)
- Verify /mnt/data mounts and the data is accessible
initial_state: Linux server post storage-migration where the /etc/fstab line for /mnt/data is invalid,
