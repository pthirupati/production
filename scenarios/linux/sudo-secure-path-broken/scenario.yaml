description: 'CONTEXT: A team operating Linux administration needs you to resolve `sudo secure_path Blocks
  Admin Commands` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where sudoers `secure_path` omits /usr/sbin and /sbin, so sudo
  can''t find sbin-based commands (ip, systemctl, etc.). Commands like `sudo ip ...` or `sudo systemctl
  ...` fail with "command not found" even though the binaries exist, because the sudoers `secure_path`
  was edited and no longer includes /usr/sbin and /sbin. sudo replaces PATH with secure_path, so admin
  tools in sbin become invisible. Restore a complete secure_path so privileged commands resolve.


  OBJECTIVE: Confirm sudo''s secure_path is missing the sbin directories; Restore a complete secure_path
  in sudoers; Verify sudo can run sbin commands again. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm sudo's secure_path is missing the sbin directories
- Restore a complete secure_path in sudoers
- Verify sudo can run sbin commands again
