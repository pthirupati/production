title: sudo secure_path Blocks Admin Commands
slug: sudo-secure-path-broken
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Sudo / Security
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q32 sudoers secure_path — visudo
description: Commands like `sudo ip ...` or `sudo systemctl ...` fail with "command not found" even though
  the binaries exist, because the sudoers `secure_path` was edited and no longer includes /usr/sbin and
  /sbin. sudo replaces PATH with secure_path, so admin tools in sbin become invisible. Restore a complete
  secure_path so privileged commands resolve.
objectives:
- Confirm sudo's secure_path is missing the sbin directories
- Restore a complete secure_path in sudoers
- Verify sudo can run sbin commands again
initial_state: Linux server where sudoers `secure_path` omits /usr/sbin and /sbin, so sudo can't find
  sbin-based commands (ip, systemctl, etc.).
hints:
- order: 1
  cost: 10
  content: 'Check what sudo uses: `sudo -l` shows the `secure_path` value — /usr/sbin and /sbin are missing,
    which is why sudo can''t find those tools.'
- order: 2
  cost: 15
  content: 'Fix it with visudo (check /etc/sudoers and /etc/sudoers.d/): set `Defaults secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"`.'
- order: 3
  cost: 20
  content: 'Verify: `sudo -l` shows the full path, and `sudo ip a` / `sudo systemctl status sshd` now
    run instead of "command not found".'
