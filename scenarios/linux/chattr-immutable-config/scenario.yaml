title: Immutable Flag Blocks Config Edit
slug: chattr-immutable-config
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Filesystem / Attributes
difficulty: hard
time_limit: 900
max_score: 100
infrastructure_type: docker
docker_privileged: true
jira_priority: Medium
topics_covered: Q4 chattr +i — lsattr, remove immutable
description: A configuration file cannot be modified even by root — edits and saves fail with "Operation
  not permitted". The file has the immutable (i) attribute set via chattr, which blocks all writes, renames,
  and deletes regardless of normal permissions. Clear the immutable flag, set the service to listen on
  port 9090, and confirm the change persists.
objectives:
- Identify why the config can't be modified (extended attributes)
- Clear the immutable flag safely with chattr
- Set PORT=9090 and verify the change persists
initial_state: Linux server where /etc/myapp/config.env carries the immutable attribute, so even root
  cannot edit it. The service must end up configured with PORT=9090.
hints:
- order: 1
  cost: 10
  content: 'Normal perms look fine but writes fail. Check extended attributes: `lsattr /etc/myapp/config.env`
    — the `i` (immutable) flag is set.'
- order: 2
  cost: 15
  content: 'Remove the immutable attribute: `chattr -i /etc/myapp/config.env`. Now the file is editable.'
- order: 3
  cost: 20
  content: 'Edit PORT to 9090, save, and verify it stuck: `grep PORT /etc/myapp/config.env` shows `PORT=9090`.
    (Re-apply immutability with `chattr +i` only if the design requires it.)'
