description: 'CONTEXT: A team operating Linux administration needs you to resolve `Immutable Flag Blocks
  Config Edit` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /etc/myapp/config.env carries the immutable attribute,
  so even root cannot edit it. The service must end up configured with PORT=9090. A configuration file
  cannot be modified even by root — edits and saves fail with "Operation not permitted". The file has
  the immutable (i) attribute set via chattr, which blocks all writes, renames, and deletes regardless
  of normal permissions. Clear the immutable flag, set the service to listen on port 9090, and confirm
  the change persists.


  OBJECTIVE: Identify why the config can''t be modified (extended attributes); Clear the immutable flag
  safely with chattr; Set PORT=9090 and verify the change persists. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
