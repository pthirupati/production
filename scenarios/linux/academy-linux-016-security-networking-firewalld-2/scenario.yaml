description: 'Security review: harden Linux networking + firewalld on this Linux Administration
  system. Close unsafe defaults, enforce least privilege, and ensure interfaces, routes,
  zones, and service ports cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to Linux networking + firewalld are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around Linux networking
  + firewalld. Assume an auditor or pen test is next week — tighten controls with
  evidence.
hints:
- order: 1
  cost: 10
  content: 'Baseline current exposure: `nmcli`, `ip route`, and `firewall-cmd`. Note
    world-readable files, open ports, or excessive roles.'
- order: 2
  cost: 15
  content: Apply least privilege incrementally. Prefer explicit allows over broad
    wildcards.
- order: 3
  cost: 20
  content: Re-test legitimate workflows after hardening. Finish with `# FIXED-OK`
    in `/opt/fixitlab/academy/academy-linux-016-security-networking-firewalld-2.conf`
    and Check Solution.
