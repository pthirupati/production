description: 'CONTEXT: A team operating Linux administration needs you to resolve `Wrong umask — Insecure
  New Files` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where a global umask of 000 causes new files to be created world-writable;
  the umask is set too permissively in the login environment. Newly created files are coming out world-writable
  because the global umask was set to 000 (in a /etc/profile.d script or login config). A 000 umask removes
  no permission bits, so files are created 666 and directories 777 — a security problem. Restore a safe
  default umask (022) and verify new files get sane permissions.


  OBJECTIVE: Confirm the current umask is 000 and find where it''s set; Restore a safe default umask (022);
  Verify newly created files get correct permissions. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
