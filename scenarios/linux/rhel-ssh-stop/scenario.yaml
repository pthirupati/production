description: 'CONTEXT: A team operating Linux administration needs you to resolve `RHEL Simulation: SSH
  Service Down` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: primary (10.0.0.10): root console, sshd inactive

  ssh_client (10.0.0.5): use ssh root@10.0.0.10 to test remote access Remote users can no longer SSH into
  the server (10.0.0.10) because the sshd service is stopped, so every connection is refused. Using the
  dual-terminal lab, confirm the refusal from the SSH client pane, start sshd on the server console, and
  verify that SSH login then succeeds from the client — restoring remote administrative access.


  OBJECTIVE: Diagnose SSH connection refused from the SSH client terminal; {''Start sshd on the server
  (primary console)'': ''systemctl start sshd''}; Verify SSH login succeeds from the client terminal.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Diagnose SSH connection refused from the SSH client terminal
- Start sshd on the server (primary console): systemctl start sshd
- Verify SSH login succeeds from the client terminal
initial_state: 'primary (10.0.0.10): root console, sshd inactive

  ssh_client (10.0.0.5): use ssh root@10.0.0.10 to test remote access

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
