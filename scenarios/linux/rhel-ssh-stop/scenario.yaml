title: 'RHEL Simulation: SSH Service Down'
slug: sim-rhel-ssh-stop
technology: Linux Administration
category: Linux Administration
difficulty: easy
time_limit: 900
max_score: 100
lab_mode: simulation
simulation_type: rhel
dual_terminal: true
infrastructure_type: docker
jira_priority: Medium
is_free: false
description: Remote users can no longer SSH into the server (10.0.0.10) because the sshd service is stopped,
  so every connection is refused. Using the dual-terminal lab, confirm the refusal from the SSH client
  pane, start sshd on the server console, and verify that SSH login then succeeds from the client — restoring
  remote administrative access.
objectives:
- Diagnose SSH connection refused from the SSH client terminal
- Start sshd on the server (primary console): systemctl start sshd
- Verify SSH login succeeds from the client terminal
initial_state: 'primary (10.0.0.10): root console, sshd inactive

  ssh_client (10.0.0.5): use ssh root@10.0.0.10 to test remote access

  '
hints:
- order: 1
  cost: 10
  content: 'From the SSH Client pane: `ssh root@10.0.0.10` — expect "Connection refused" because sshd
    isn''t listening on the server.'
- order: 2
  cost: 15
  content: 'On the Server console, check and start it: `systemctl status sshd` (inactive), then `systemctl
    start sshd` (and `systemctl enable sshd` so it survives reboot).'
- order: 3
  cost: 20
  content: Back in the SSH Client, retry `ssh root@10.0.0.10` — the login now succeeds (the password is
    redhat if prompted).
