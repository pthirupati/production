description: 'CONTEXT: A team operating Linux administration needs you to resolve `ext4 Filesystem Needs
  fsck` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where the ext4 filesystem for /data fails to mount after a crash
  due to a corrupt primary superblock; the data device needs fsck repair. An ext4 volume mounted at /data
  won''t mount cleanly after an unclean shutdown — the primary superblock is damaged, so mount fails with
  a superblock/structure error. ext4 keeps backup superblocks that fsck can use to repair the filesystem.
  Unmount, run a filesystem check (with a backup superblock if needed), and restore read-write access
  to /data.


  OBJECTIVE: Confirm the mount failure is a superblock/filesystem corruption; Unmount and repair the filesystem
  with fsck (using a backup superblock if required); Remount /data read-write and verify it accepts writes.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the mount failure is a superblock/filesystem corruption
- Unmount and repair the filesystem with fsck (using a backup superblock if required)
- Remount /data read-write and verify it accepts writes
initial_state: Linux server where the ext4 filesystem for /data fails to mount after a crash due to a
