title: Application Fails with Too Many Open Files (EMFILE)
slug: linux-ulimit-open-files
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Application Fails with
  Too Many Open Files (EMFILE)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. The appserver service is failing. Checking the application

  log at /var/log/appserver/app.log shows repeated errors:

  "ERROR: java.io.IOException: Too many open files (EMFILE)"

  Running ulimit -n as the ''appuser'' shows 1024, which is the system default. A Java application server
  is crashing with "java.io.IOException: Too many open files"

  in its logs. The system default limit of 1024 open file descriptors is too low for a

  busy application server that opens thousands of connections and file handles. The limit

  must be raised permanently in /etc/security/limits.conf and the service must be

  restarted to pick up the new limit.


  OBJECTIVE: Confirm the current limit with ulimit -n (shows 1024); Check /proc/<pid>/limits for the running
  process''s actual limits; Edit /etc/security/limits.conf to add soft and hard nofile limits for appuser.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. The appserver service is failing. Checking the application

  log at /var/log/appserver/app.log shows repeated errors:

  "ERROR: java.io.IOException: Too many open files (EMFILE)"

  Running ulimit -n as the ''appuser'' shows 1024, which is the system default.

  '
objectives:
- Confirm the current limit with ulimit -n (shows 1024)
- Check /proc/<pid>/limits for the running process's actual limits
- Edit /etc/security/limits.conf to add soft and hard nofile limits for appuser
- Set: appuser soft nofile 65536 and appuser hard nofile 65536
- Restart the appserver service and verify the new limit with ulimit -n as appuser
