jira_priority: Medium
description: 'CONTEXT: A team operating Linux administration needs you to resolve `linux: Boot Recovery
  — Integration Lab` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for boot recovery. Downstream
  consumers are waiting on this integration path. Integration lab: connect boot recovery with an adjacent
  platform in the linux stack. Validate authentication, data handoff, and failure behavior for GRUB, initramfs,
  fstab, and rescue targets.


  OBJECTIVE: boot recovery is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `systemctl
  is-active crond` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- boot recovery is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for boot recovery. Downstream consumers
  are waiting on this integration path.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `journalctl -b`, GRUB menu, and `/etc/fstab`.

    2. Write down what looks normal versus wrong or missing for boot recovery.

    3. Recall the core idea: GRUB, initramfs, fstab, and rescue targets. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `journalctl -b`, GRUB menu, and `/etc/fstab`.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — the system boots cleanly to the default target.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
