title: vgcreate Fails — Invalid VG Name with Hyphen
slug: linux-vg-name-error
difficulty: easy
category: Linux Administration
description: |
  A junior admin is setting up LVM storage and runs vgcreate vg-data /dev/sdb but the
  command fails with an error about the name not being allowed. LVM volume group names
  have specific naming rules — leading hyphens are not permitted and hyphens in names
  conflict with LVM's internal device mapper naming convention. The admin must understand
  the rule and create the VG with a valid name.

initial_state: |
  Simulated RHEL 9 server. /dev/sdb has already been initialized as a PV with pvcreate.
  Running vgcreate vg-data /dev/sdb returns:
  "vgcreate: Name vg-data is not allowed: A Volume Group name may not contain hyphens."
  The disk is ready but no VG exists yet.

objectives:
  - Read the vgcreate error message carefully to understand the naming restriction
  - Identify that hyphens are not allowed in LVM VG names due to device mapper conflicts
  - Create the volume group using an underscore instead: vgcreate vg_data /dev/sdb
  - Verify the VG was created successfully with vgs
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
  - content: 'LVM VG names cannot contain hyphens because device mapper uses hyphens as separators in /dev/mapper/ paths (e.g. vg_name-lv_name). Use underscores instead.'
    cost: 10
    order: 1
  - content: 'Run: vgcreate vg_data /dev/sdb — replacing the hyphen with an underscore. Verify with vgs to see the new volume group.'
    cost: 15
    order: 2
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
