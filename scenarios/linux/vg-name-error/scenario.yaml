title: vgcreate Fails — Invalid VG Name with Hyphen
slug: linux-vg-name-error
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `vgcreate Fails — Invalid
  VG Name with Hyphen` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where `vgcreate vg-data /dev/sdb` fails due to the hyphen in
  the VG name (invalid for device-mapper). Creating an LVM volume group fails: `vgcreate vg-data /dev/sdb`
  errors because the name contains a hyphen. LVM/device-mapper reserve the hyphen as a separator in /dev/mapper
  device names, so VG and LV names can''t contain it. Recreate the volume group with a valid name (underscore
  instead of hyphen) and verify it exists.


  OBJECTIVE: Read the vgcreate error and understand the naming restriction; Recreate the VG with a valid
  name (no hyphen); Verify the volume group was created with vgs. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
