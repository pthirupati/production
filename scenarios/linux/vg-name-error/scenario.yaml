title: vgcreate Fails — Invalid VG Name with Hyphen
slug: linux-vg-name-error
difficulty: easy
category: Linux Administration
description: 'Creating an LVM volume group fails: `vgcreate vg-data /dev/sdb` errors because the name
  contains a hyphen. LVM/device-mapper reserve the hyphen as a separator in /dev/mapper device names,
  so VG and LV names can''t contain it. Recreate the volume group with a valid name (underscore instead
  of hyphen) and verify it exists.'
initial_state: Linux server where `vgcreate vg-data /dev/sdb` fails due to the hyphen in the VG name (invalid
  for device-mapper).
objectives:
- Read the vgcreate error and understand the naming restriction
- Recreate the VG with a valid name (no hyphen)
- Verify the volume group was created with vgs
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'The error is about the name: LVM names can''t contain `-` because device-mapper uses it as
    a separator in /dev/mapper paths.'
- order: 2
  cost: 15
  content: 'Use an underscore instead: `vgcreate vg_data /dev/sdb`.'
- order: 3
  cost: 20
  content: 'Verify it was created: `vgs` lists `vg_data` on /dev/sdb.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
