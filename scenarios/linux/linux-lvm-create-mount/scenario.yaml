title: Provision LVM Storage and Mount at /data
slug: linux-lvm-create-mount
difficulty: medium
category: Storage / LVM
description: |
  A spare disk /dev/sdc has been presented to the server but no LVM structures exist on
  it. Applications are waiting for /data to be provisioned. You must build the full LVM
  stack from scratch — physical volume, volume group, logical volume — format it, mount
  it at /data, and persist the mount in /etc/fstab.

initial_state: |
  Simulated RHEL 9 server. lsblk shows an unused 20G /dev/sdc with no partitions or LVM
  metadata. There is no volume group named vgdata and no /data mount. The application
  team is blocked until /data is available.

objectives:
  - Initialise the disk as a physical volume with pvcreate /dev/sdc
  - Create a volume group named vgdata with vgcreate vgdata /dev/sdc
  - Create a logical volume named lvdata with lvcreate -L 10G -n lvdata vgdata
  - Format the LV with mkfs.xfs /dev/vgdata/lvdata
  - Mount it at /data and add it to /etc/fstab so it survives a reboot
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
hints:
  - content: 'Confirm /dev/sdc with lsblk, then build the stack: pvcreate /dev/sdc; vgcreate vgdata /dev/sdc; lvcreate -L 10G -n lvdata vgdata.'
    cost: 10
    order: 1
  - content: 'Format and mount: mkfs.xfs /dev/vgdata/lvdata, then mkdir -p /data && mount /dev/vgdata/lvdata /data. Verify with pvs, lvs, and df -h.'
    cost: 20
    order: 2
  - content: 'Persist the mount in /etc/fstab, e.g. /dev/vgdata/lvdata /data xfs defaults 0 0.'
    cost: 15
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
