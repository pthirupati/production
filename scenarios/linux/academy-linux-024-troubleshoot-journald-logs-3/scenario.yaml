title: 'Linux Administration: Journald Logging — Troubleshooting Drill'
slug: academy-linux-024-troubleshoot-journald-logs-3
technology: Linux Administration
category: Troubleshooting
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Logging-pipeline troubleshooting. The `rsyslog` service that journald forwards system logs
  to is not running, so centralised/persistent logging has stopped and you are flying blind during incidents.
  Investigate and restore the service. Verify with `systemctl is-active rsyslog`.
objectives:
- The rsyslog service is active (running) again
- The logging pipeline is restored
- systemctl is-active rsyslog reports 'active'
initial_state: The `rsyslog` logging service is stopped, so log forwarding and persistence have halted
  on this host.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `systemctl status rsyslog` and look for recent log entries with `journalctl
    -u rsyslog`.

    2. Write down what looks normal versus wrong or missing.

    3. Form one hypothesis about the root cause before you change anything.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture command output before the change so you can prove it worked afterward.'
- order: 3
  cost: 20
  content: 'Guided walkthrough:

    1. Re-check the current state — Check the service: `systemctl status rsyslog` and look for recent
    log entries with `journalctl -u rsyslog`.

    2. The configuration is intact — the daemon just needs to be running and enabled.

    3. Verify the result — Run `sudo systemctl enable --now rsyslog`, confirm with `systemctl is-active
    rsyslog`, then Check Solution.

    4. Click Check Solution once every objective is met.'
