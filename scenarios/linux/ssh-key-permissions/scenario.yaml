title: SSH Key Auth Fails — Bad .ssh Permissions
slug: ssh-key-permissions
lab_mode: simulation
simulation_type: generic
technology: Linux
category: SSH / Security
difficulty: easy
time_limit: 600
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q42 key auth — chmod 700 ~/.ssh 600 authorized_keys
description: Key-based SSH for user 'dev' is rejected and falls back to a password (or fails) because
  the permissions on ~/.ssh and authorized_keys are too open. OpenSSH ignores keys when the .ssh directory
  or key files are group/world-accessible (StrictModes). Tighten the permissions so the key is accepted.
objectives:
- Confirm key auth is rejected due to permissive ~/.ssh permissions
- Set correct, restrictive permissions on ~/.ssh and authorized_keys
- Verify dev can authenticate with the key
initial_state: Linux server where user dev's ~/.ssh (and/or authorized_keys) has overly permissive modes,
  so sshd refuses to use the key for authentication.
hints:
- order: 1
  cost: 10
  content: 'sshd logs "Authentication refused: bad ownership or modes". Check: `ls -ld ~dev/.ssh` and
    `ls -l ~dev/.ssh/authorized_keys` (too open).'
- order: 2
  cost: 15
  content: 'Fix them: `chmod 700 ~dev/.ssh && chmod 600 ~dev/.ssh/authorized_keys` and ensure they''re
    owned by dev (`chown -R dev:dev ~dev/.ssh`).'
- order: 3
  cost: 20
  content: Verify key login now works (`ssh dev@<host>` authenticates with the key, no password prompt).
