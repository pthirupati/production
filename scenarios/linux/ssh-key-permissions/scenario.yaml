description: 'CONTEXT: A team operating Linux administration needs you to resolve `SSH Key Auth Fails
  — Bad .ssh Permissions` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where user dev''s ~/.ssh (and/or authorized_keys) has overly
  permissive modes, so sshd refuses to use the key for authentication. Key-based SSH for user ''dev''
  is rejected and falls back to a password (or fails) because the permissions on ~/.ssh and authorized_keys
  are too open. OpenSSH ignores keys when the .ssh directory or key files are group/world-accessible (StrictModes).
  Tighten the permissions so the key is accepted.


  OBJECTIVE: Confirm key auth is rejected due to permissive ~/.ssh permissions; Set correct, restrictive
  permissions on ~/.ssh and authorized_keys; Verify dev can authenticate with the key. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
