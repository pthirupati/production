description: 'CONTEXT: A team operating Linux administration needs you to resolve `DNS Resolution Broken
  — Dead nameserver` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /etc/resolv.conf lists a dead nameserver (192.0.2.1); a
  functioning local dnsmasq on 127.0.0.1 already serves app.fixitlab.local. DNS lookups for the internal
  host app.fixitlab.local fail because /etc/resolv.conf points at a dead nameserver (192.0.2.1) while
  a working local resolver (dnsmasq on 127.0.0.1) is already running and authoritative for the internal
  zone. Point the resolver at the live local DNS so internal names resolve.


  OBJECTIVE: Confirm internal-name resolution fails and the configured nameserver is dead; Point resolv.conf
  at the working local resolver (127.0.0.1); Verify internal hostname resolution succeeds. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm internal-name resolution fails and the configured nameserver is dead
- Point resolv.conf at the working local resolver (127.0.0.1)
- Verify internal hostname resolution succeeds
initial_state: Linux server where /etc/resolv.conf lists a dead nameserver (192.0.2.1); a functioning
  local dnsmasq on 127.0.0.1 already serves app.fixitlab.local.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `cat /etc/resolv.conf` and test with `dig example.com` or `getent hosts
    example.com`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the configured nameserver IP in resolv.conf.

    2. `ping` or `nc -zv` the nameserver — is it reachable?

    3. Check if NetworkManager or systemd-resolved overwrites the file.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Verify internal hostname resolution succeeds.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
