title: 'Linux Administration: Package Patching — Backup and Recovery'
slug: academy-linux-039-backup-package-patching-4
technology: Linux Administration
category: Backup & Recovery
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Backup and recovery drill for package patching. Ensure backups run on
  schedule, retention is correct, and you can restore repos, updates, version pinning,
  and rollback within the lab RTO.
objectives:
- Backup coverage for package patching is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for package patching.
  Leadership wants proof that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `dnf history`, `dnf check-update`, and repo files.

    2. Write down what looks normal versus wrong or missing for package patching.

    3. Recall the core idea: repos, updates, version pinning, and rollback. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for package patching.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `dnf history`, `dnf check-update`, and repo files.

    2. Repair or run the backup job, then perform a controlled restore into a scratch
    location to prove it works.

    3. Verify the result — required packages are at the approved versions and services
    still run.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-linux-039-backup-package-patching-4.conf`,
    then click Check Solution.'
