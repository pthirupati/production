title: TCP Wrappers hosts.deny Blocks SSH
slug: hosts-deny-blocks-ssh
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Security / SSH
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q39 hosts.allow/deny — sshd tcp wrappers
description: 'Every SSH connection is refused immediately because TCP Wrappers is configured to deny sshd:
  /etc/hosts.deny contains a blanket `sshd: ALL` (with nothing allowing it back in hosts.allow). This
  blocks connections before authentication. Adjust the TCP Wrappers rules so legitimate SSH is permitted
  again.'
objectives:
- Identify that hosts.deny/hosts.allow is blocking sshd
- Adjust the TCP Wrappers rules to permit SSH
- Validate sshd config and verify SSH connections succeed
initial_state: Linux server where /etc/hosts.deny blocks sshd for all hosts via TCP Wrappers, so SSH connections
  are refused outright.
hints:
- order: 1
  cost: 10
  content: 'Connections drop instantly (not an auth failure). Check TCP Wrappers: `cat /etc/hosts.deny
    /etc/hosts.allow` — hosts.deny has `sshd: ALL`.'
- order: 2
  cost: 15
  content: 'Either remove the `sshd: ALL` line from /etc/hosts.deny, or add a permit in /etc/hosts.allow
    (e.g. `sshd: ALL` or `sshd: 10.0.0.0/24`). hosts.allow is evaluated first.'
- order: 3
  cost: 20
  content: Validate sshd is otherwise healthy (`sshd -t`) and test a connection — SSH now succeeds.
