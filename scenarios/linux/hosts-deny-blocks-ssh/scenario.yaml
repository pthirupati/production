topics_covered: Q39 hosts.allow/deny — sshd tcp wrappers
description: 'CONTEXT: A team operating Linux administration needs you to resolve `TCP Wrappers hosts.deny
  Blocks SSH` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /etc/hosts.deny blocks sshd for all hosts via TCP Wrappers,
  so SSH connections are refused outright. Every SSH connection is refused immediately because TCP Wrappers
  is configured to deny sshd: /etc/hosts.deny contains a blanket `sshd: ALL` (with nothing allowing it
  back in hosts.allow). This blocks connections before authentication. Adjust the TCP Wrappers rules so
  legitimate SSH is permitted again.


  OBJECTIVE: Identify that hosts.deny/hosts.allow is blocking sshd; Adjust the TCP Wrappers rules to permit
  SSH; Validate sshd config and verify SSH connections succeed. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify that hosts.deny/hosts.allow is blocking sshd
- Adjust the TCP Wrappers rules to permit SSH
- Validate sshd config and verify SSH connections succeed
initial_state: Linux server where /etc/hosts.deny blocks sshd for all hosts via TCP Wrappers, so SSH connections
  are refused outright.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
