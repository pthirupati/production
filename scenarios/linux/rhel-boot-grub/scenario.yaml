category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `RHEL Simulation: GRUB
  Boot & Rescue` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL system paused at the GRUB boot menu. Boot the default entry
  to proceed to login, then operate as root in the full shell. A guided practice lab for booting a RHEL
  system through GRUB and reaching a working shell. You start at the GRUB menu; the goal is to boot the
  default kernel entry, log in as root, and confirm you can operate the system (e.g. inspect a service).
  It builds familiarity with the boot path and recovery entry points.


  OBJECTIVE: Boot the default RHEL entry from the GRUB menu; Log in as root; Run systemctl status sshd
  in the full shell to confirm the system is operational. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the Linux practice server. For RHEL Simulation:
    GRUB Boot & Rescue, inspect terminal and config files under /etc and /var before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with terminal and config files under /etc and /var.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run systemctl status sshd in the full shell to confirm the system is operational.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
