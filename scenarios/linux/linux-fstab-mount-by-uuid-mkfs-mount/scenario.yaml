title: Mount a Data Filesystem by UUID in /etc/fstab
slug: linux-fstab-mount-by-uuid-mkfs-mount
difficulty: medium
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Mount a Data Filesystem
  by UUID in /etc/fstab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. /dev/sdc (20G) is present but unformatted. /data
  is not

  mounted and /etc/fstab has no UUID-based entry for it. The spare disk /dev/sdc must back /data, but
  device names like /dev/sdc are not stable

  across reboots and re-cabling — the team standard is to mount filesystems by UUID. Make

  a filesystem on /dev/sdc, look up its UUID with blkid, mount it at /data, and add an

  fstab entry that references the filesystem by UUID= (not by /dev/sdc). Persisting it by

  device name is not acceptable for this task.


  OBJECTIVE: {''Create a filesystem'': ''mkfs.xfs /dev/sdc''}; Find the UUID with blkid /dev/sdc; Mount
  it at /data. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. /dev/sdc (20G) is present but unformatted. /data is not

  mounted and /etc/fstab has no UUID-based entry for it.

  '
objectives:
- Create a filesystem: mkfs.xfs /dev/sdc
- Find the UUID with blkid /dev/sdc
- Mount it at /data
- Add a UUID-based line to /etc/fstab (UUID=... /data xfs defaults 0 0)
- Verify the by-UUID mount resolves with mount -a and findmnt
