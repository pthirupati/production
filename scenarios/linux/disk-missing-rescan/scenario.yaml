title: Rescan SCSI Bus for Missing Disk
slug: linux-disk-missing-rescan
category: Fix
difficulty: medium
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Rescan SCSI Bus for
  Missing Disk` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux guest where a freshly attached disk is not yet visible (missing from
  lsblk) because the SCSI host needs a rescan to detect it. A new disk was hot-added at the hypervisor/SAN,
  but it doesn''t appear inside the Linux guest because the SCSI bus hasn''t been rescanned. Linux won''t
  see the device until the relevant SCSI host is told to look for new LUNs. Trigger a rescan and confirm
  the new disk shows up in lsblk.


  OBJECTIVE: Confirm the new disk is not yet visible to the guest; Rescan the SCSI host bus to detect
  the new device; Verify the new disk appears in lsblk. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
lab_mode: simulation
simulation_type: rhel
time_limit: 900
max_score: 100
is_free: false
objectives:
- Confirm the new disk is not yet visible to the guest
- Rescan the SCSI host bus to detect the new device
- Verify the new disk appears in lsblk
initial_state: Linux guest where a freshly attached disk is not yet visible (missing from lsblk) because
  the SCSI host needs a rescan to detect it.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
