title: Changing User Password Shows Authentication Failure
slug: linux-password-auth-fail
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Changing User Password
  Shows Authentication Failure` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /etc/shadow has incorrect permissions/ownership (changed
  from the default 000 root:shadow), causing passwd to fail with a token-manipulation error. A non-root
  user can''t change another account''s password — `passwd <user>` returns "Authentication token manipulation
  error". The /etc/shadow file''s permissions were altered from their secure default (000, root:shadow),
  which breaks the passwd helper, and/or the PAM passwd stack was disturbed. Restore the correct shadow
  permissions/ownership and PAM config.


  OBJECTIVE: Check /etc/shadow permissions/ownership against the secure default; Restore chmod 000 and
  chown root:shadow on /etc/shadow; Confirm /etc/pam.d/passwd is intact and verify password changes work.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Linux server where /etc/shadow has incorrect permissions/ownership (changed from the default
  000 root:shadow), causing passwd to fail with a token-manipulation error.
objectives:
- Check /etc/shadow permissions/ownership against the secure default
- Restore chmod 000 and chown root:shadow on /etc/shadow
- Confirm /etc/pam.d/passwd is intact and verify password changes work
