title: Changing User Password Shows Authentication Failure
slug: linux-password-auth-fail
difficulty: medium
category: Linux Administration
description: |
  A non-root user reports they cannot change another account's password. Running
  passwd username as a regular user returns "passwd: Authentication failure" even though
  the user is supposed to have delegated admin access. The underlying cause is a
  misconfigured PAM password policy or incorrect /etc/shadow permissions that prevent
  the passwd binary from reading shadow entries.

initial_state: |
  Simulated RHEL 9 server. Logged in as user 'admin' (not root). Running:
  passwd appuser
  returns: "passwd: Authentication failure"
  The /etc/shadow file permissions have been recently changed during a security audit
  and something broke. Other authentication operations work normally.

objectives:
  - Check /etc/shadow permissions with ls -la /etc/shadow (should be 000 owned by root:shadow)
  - Identify if permissions were incorrectly changed from the default
  - Restore correct permissions with chmod 000 /etc/shadow and chown root:shadow /etc/shadow
  - Review /etc/pam.d/passwd to confirm pam_unix.so is present and uncorrupted
  - Verify password change works after restoring correct shadow file permissions
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
  - content: 'Check: ls -la /etc/shadow — the correct permissions are ---------- (000) with ownership root:shadow. The setuid bit on /usr/bin/passwd lets it read shadow as root.'
    cost: 10
    order: 1
  - content: 'Restore with: chmod 000 /etc/shadow && chown root:shadow /etc/shadow. Also check /etc/pam.d/passwd for any commented-out pam_unix.so line.'
    cost: 20
    order: 2
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
