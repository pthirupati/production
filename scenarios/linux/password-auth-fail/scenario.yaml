title: Changing User Password Shows Authentication Failure
slug: linux-password-auth-fail
difficulty: medium
category: Linux Administration
description: A non-root user can't change another account's password — `passwd <user>` returns "Authentication
  token manipulation error". The /etc/shadow file's permissions were altered from their secure default
  (000, root:shadow), which breaks the passwd helper, and/or the PAM passwd stack was disturbed. Restore
  the correct shadow permissions/ownership and PAM config.
initial_state: Linux server where /etc/shadow has incorrect permissions/ownership (changed from the default
  000 root:shadow), causing passwd to fail with a token-manipulation error.
objectives:
- Check /etc/shadow permissions/ownership against the secure default
- Restore chmod 000 and chown root:shadow on /etc/shadow
- Confirm /etc/pam.d/passwd is intact and verify password changes work
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Inspect the file: `ls -la /etc/shadow` — the correct state is `----------` (000) owned by
    `root:shadow`. Anything more permissive breaks the setuid passwd flow.'
- order: 2
  cost: 20
  content: 'Restore it: `chown root:shadow /etc/shadow && chmod 000 /etc/shadow`. Also confirm `/etc/pam.d/passwd`
    still references `pam_unix.so` correctly.'
- order: 3
  cost: 30
  content: 'Verify: changing a password (`passwd <user>`) now completes without the token-manipulation
    error.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
