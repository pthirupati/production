description: 'CONTEXT: A team operating Linux administration needs you to resolve `Software RAID1 Degraded
  — Missing Disk` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server with a degraded mdadm array /dev/md0 (one slot failed/missing).
  A spare partition is available to add; the array needs to be rebuilt to a clean redundant state. A software
  RAID array (/dev/md0) is running degraded — one member device has failed or dropped out, shown by a
  missing slot in /proc/mdstat (e.g. [U_]). The array is up but has no redundancy. Identify the failed/missing
  slot, add a replacement device, and monitor the rebuild until the array is fully redundant again ([UU]).


  OBJECTIVE: Check /proc/mdstat and mdadm --detail to find the failed/missing slot; Add the replacement
  device to the array; Monitor the rebuild until the array reaches [UU]. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Check /proc/mdstat and mdadm --detail to find the failed/missing slot
- Add the replacement device to the array
- Monitor the rebuild until the array reaches [UU]
initial_state: Linux server with a degraded mdadm array /dev/md0 (one slot failed/missing). A spare partition
  is available to add; the array needs to be rebuilt to a clean redundant state.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
