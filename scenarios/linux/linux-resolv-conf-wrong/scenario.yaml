description: 'CONTEXT: A team operating Linux administration needs you to resolve `Wrong DNS Resolver
  Breaks Lookups` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Linux host whose resolv.conf nameserver is wrong/unreachable, breaking DNS.
  Name resolution fails because /etc/resolv.conf points at an unreachable DNS server. Set a working resolver
  and confirm the file is corrected.


  OBJECTIVE: Confirm DNS lookups fail; Set a working nameserver; Verify resolv.conf is corrected. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: A Linux host whose resolv.conf nameserver is wrong/unreachable, breaking DNS.
objectives:
- Confirm DNS lookups fail
- Set a working nameserver
- Verify resolv.conf is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `cat /etc/resolv.conf` and test with `dig example.com` or `getent hosts
    example.com`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the configured nameserver IP in resolv.conf.

    2. `ping` or `nc -zv` the nameserver — is it reachable?

    3. Check if NetworkManager or systemd-resolved overwrites the file.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Set a working `nameserver` line (e.g. 8.8.8.8 or the lab''s resolver).

    2. Re-run `dig` or `getent hosts` — lookups should succeed.

    3. Confirm `check.sh` passes.


    WHY: applications use resolv.conf for every hostname lookup.'
