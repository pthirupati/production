title: 'Two fdisk Partitions: One for LVM, One Plain Filesystem'
slug: linux-fdisk-two-part-lvm-create-mount-and-fs
difficulty: hard
category: Fix
technology: linux
description: "CONTEXT: A team operating Linux administration needs you to resolve `Two fdisk Partitions:\
  \ One for LVM, One Plain Filesystem` during a realistic incident. The business impact is reduced service\
  \ reliability until the underlying state is repaired.\n\nENVIRONMENT: You are working in FixitLab's\
  \ offline Linux practice server with terminal and config files under /etc and /var. All tools run locally;\
  \ no paid APIs or external cloud calls are required.\n\nSYMPTOM / STARTING STATE: Simulated RHEL 9 server.\
  \ lsblk shows /dev/sdc (30G) with no partitions. There is no\nvgdata volume group, no lvdata LV, /data\
  \ is empty, and /mnt/data2 is empty. /etc/fstab\nhas no entries for either device. A 30G disk /dev/sdc\
  \ is attached and raw. You must split it into TWO primary partitions\nwith fdisk and provision them\
  \ differently:\n  - /dev/sdc1 becomes part of LVM — initialise it as a physical volume, create the\n\
  \    volume group vgdata on it, carve a logical volume named lvdata, format it, and\n    mount it at\
  \ /data.\n  - /dev/sdc2 becomes a plain standalone filesystem — format it directly (no LVM) and\n  \
  \  mount it at /mnt/data2.\nBoth must end up mounted and recorded in /etc/fstab. The lab only passes\
  \ when the LV\nlvdata exists, /data is mounted from the LV, and the plain /dev/sdc2 filesystem is\n\
  mounted and persisted.\n\nOBJECTIVE: Create two primary partitions on /dev/sdc with fdisk (/dev/sdc1\
  \ and /dev/sdc2); {'LVM leg': 'pvcreate /dev/sdc1; vgcreate vgdata /dev/sdc1; lvcreate -L 15G -n lvdata\
  \ vgdata'}; {'Format and mount the LV': 'mkfs.xfs /dev/vgdata/lvdata; mount it at /data'}. Success means\
  \ `check.sh` exits successfully.\n\nWHAT TO AVOID: Do not apply broad destructive changes, skip evidence\
  \ gathering, or fake completion with marker files — the checker validates real system state."
initial_state: 'Simulated RHEL 9 server. lsblk shows /dev/sdc (30G) with no partitions. There is no

  vgdata volume group, no lvdata LV, /data is empty, and /mnt/data2 is empty. /etc/fstab

  has no entries for either device.

  '
objectives:
- Create two primary partitions on /dev/sdc with fdisk (/dev/sdc1 and /dev/sdc2)
- LVM leg: pvcreate /dev/sdc1; vgcreate vgdata /dev/sdc1; lvcreate -L 15G -n lvdata vgdata
- Format and mount the LV: mkfs.xfs /dev/vgdata/lvdata; mount it at /data
- Plain leg: mkfs.ext4 /dev/sdc2; mount it at /mnt/data2
- Add both mounts to /etc/fstab so they come back after a reboot
