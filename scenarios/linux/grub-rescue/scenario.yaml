category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `GRUB Rescue Mode` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server that drops to the `grub rescue>` prompt at boot. GRUB
  cannot load its normal configuration, so the OS does not start. The system boots into the limited `grub
  rescue>` prompt instead of the OS because the GRUB bootloader can''t find its configuration/modules
  (a damaged install or a moved /boot). You must locate the boot partition, load the OS, and reinstall
  GRUB so the machine boots normally again.


  OBJECTIVE: Identify the boot/root partition from the grub rescue prompt; Boot into the OS (or a rescue
  environment); Reinstall GRUB and regenerate its config so the system boots normally. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Identify the boot/root partition from the grub rescue prompt'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Boot into the OS (or a rescue environment)

    2. Reinstall GRUB and regenerate its config so the system boots normally'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Reinstall GRUB and regenerate its config so the system boots normally.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
