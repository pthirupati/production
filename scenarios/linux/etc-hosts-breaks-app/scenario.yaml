description: 'CONTEXT: A team operating Linux administration needs you to resolve `/etc/hosts Breaks Application`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /etc/hosts contains a wrong static mapping for api.internal,
  so the app resolves it to the wrong address regardless of DNS. An application can''t reach api.internal
  because a stale /etc/hosts entry overrides DNS with the wrong IP address. Since /etc/hosts is consulted
  before DNS, the bad static mapping wins and connections go to the wrong (or dead) host. Correct or remove
  the offending entry so the name resolves properly again.


  OBJECTIVE: Confirm api.internal resolves to the wrong address and trace it to /etc/hosts; Correct or
  remove the bad /etc/hosts entry; Verify the hostname now resolves correctly. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
