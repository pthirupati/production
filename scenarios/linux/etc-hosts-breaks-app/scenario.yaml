title: /etc/hosts Breaks Application
slug: etc-hosts-breaks-app
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Networking
difficulty: easy
time_limit: 600
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q62 /etc/hosts vs resolv.conf
description: An application can't reach api.internal because a stale /etc/hosts entry overrides DNS with
  the wrong IP address. Since /etc/hosts is consulted before DNS, the bad static mapping wins and connections
  go to the wrong (or dead) host. Correct or remove the offending entry so the name resolves properly
  again.
objectives:
- Confirm api.internal resolves to the wrong address and trace it to /etc/hosts
- Correct or remove the bad /etc/hosts entry
- Verify the hostname now resolves correctly
initial_state: Linux server where /etc/hosts contains a wrong static mapping for api.internal, so the
  app resolves it to the wrong address regardless of DNS.
hints:
- order: 1
  cost: 10
  content: 'See what the resolver returns: `getent hosts api.internal`. Compare against DNS: `dig +short
    api.internal`. They differ because /etc/hosts is checked first.'
- order: 2
  cost: 15
  content: Open /etc/hosts and find the stale `api.internal` line with the wrong IP; fix the address or
    remove the line so DNS is used.
- order: 3
  cost: 20
  content: 'Verify: `getent hosts api.internal` now returns the correct IP and the app can connect (`curl
    -sI http://api.internal/`).'
