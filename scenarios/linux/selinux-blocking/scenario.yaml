title: SELinux Blocking Service from Binding to Non-Standard Port
slug: linux-selinux-blocking
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `SELinux Blocking Service
  from Binding to Non-Standard Port` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server with SELinux in Enforcing mode. nginx is configured
  to listen

  on port 8080 in /etc/nginx/nginx.conf. Running systemctl start nginx fails with:

  "nginx: [emerg] bind() to 0.0.0.0:8080 failed (13: Permission denied)"

  journalctl -u nginx shows the service failing immediately on start. nginx has been configured to listen
  on port 8080 instead of the default port 80, but

  the service fails to start. SELinux in Enforcing mode is preventing nginx from binding

  to port 8080 because it is not in the list of allowed HTTP ports. The correct fix is

  to add the port to SELinux''s http_port_t type using semanage rather than disabling SELinux.


  OBJECTIVE: Check SELinux status with sestatus and confirm Enforcing mode; Inspect /var/log/audit/audit.log
  or run ausearch -c nginx for AVC denied messages; Identify port 8080 is not in the http_port_t SELinux
  type. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server with SELinux in Enforcing mode. nginx is configured to listen

  on port 8080 in /etc/nginx/nginx.conf. Running systemctl start nginx fails with:

  "nginx: [emerg] bind() to 0.0.0.0:8080 failed (13: Permission denied)"

  journalctl -u nginx shows the service failing immediately on start.

  '
objectives:
- Check SELinux status with sestatus and confirm Enforcing mode
- Inspect /var/log/audit/audit.log or run ausearch -c nginx for AVC denied messages
- Identify port 8080 is not in the http_port_t SELinux type
- Add the port with semanage port -a -t http_port_t -p tcp 8080
- Start nginx with systemctl start nginx and verify it is running
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
