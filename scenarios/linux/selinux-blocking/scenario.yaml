title: SELinux Blocking Service from Binding to Non-Standard Port
slug: linux-selinux-blocking
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration has raised a ticket for `SELinux Blocking
  Service from Binding to Non-Standard Port`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture is a single
  lab-primary node exposing terminal and config files under /etc and /var; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: RHEL 9 server with SELinux in Enforcing mode. nginx is configured
  to listen

  on port 8080 in /etc/nginx/nginx.conf. Running systemctl start nginx fails with:

  "nginx: [emerg] bind() to 0.0.0.0:8080 failed (13: Permission denied)"

  journalctl -u nginx shows the service failing immediately on start.


  OBJECTIVE: Check SELinux status with sestatus and confirm Enforcing mode; Inspect /var/log/audit/audit.log
  or run ausearch -c nginx for AVC denied messages; Identify port 8080 is not in the http_port_t SELinux
  type. Acceptance criteria: the change is minimal and reversible, and success means `check.sh` exits
  successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant terminal and config files under /etc and /var), changing one thing at a time. Check
  your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'RHEL 9 server with SELinux in Enforcing mode. nginx is configured to listen

  on port 8080 in /etc/nginx/nginx.conf. Running systemctl start nginx fails with:

  "nginx: [emerg] bind() to 0.0.0.0:8080 failed (13: Permission denied)"

  journalctl -u nginx shows the service failing immediately on start.

  '
objectives:
- Check SELinux status with sestatus and confirm Enforcing mode
- Inspect /var/log/audit/audit.log or run ausearch -c nginx for AVC denied messages
- Identify port 8080 is not in the http_port_t SELinux type
- Add the port with semanage port -a -t http_port_t -p tcp 8080
- Start nginx with systemctl start nginx and verify it is running
