title: Broken systemd Unit — App Won't Start
slug: systemd-unit-wont-start
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Services / systemd
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q180 systemd — systemctl status, journalctl, unit syntax
description: The myapp.service unit fails on every start because its ExecStart points to a script path
  that doesn't exist (status 203/EXEC). systemd can't launch a binary it can't find, so the service enters
  a failed state. Find the correct executable path, fix the unit, reload systemd, and start the service.
objectives:
- Read the unit status/journal to find why it fails
- Correct the ExecStart path in the unit and reload systemd
- Start the service and confirm it is active
initial_state: Linux server where myapp.service has an ExecStart referencing a non-existent path, so the
  unit fails to start (203/EXEC).
hints:
- order: 1
  cost: 10
  content: 'See the failure: `systemctl status myapp` and `journalctl -u myapp -n 20` — likely "status=203/EXEC"
    meaning the ExecStart binary isn''t found.'
- order: 2
  cost: 15
  content: Find the real script (`ls /opt/myapp/`) and fix ExecStart in the unit (e.g. to `/opt/myapp/run.sh`);
    make sure it's executable. Then `systemctl daemon-reload`.
- order: 3
  cost: 20
  content: 'Start and verify: `systemctl start myapp` then `systemctl is-active myapp` (active). `systemctl
    enable myapp` if it should start on boot.'
