title: "Broken systemd Unit — App Won't Start"
slug: "systemd-unit-wont-start"
technology: "Linux"
category: "Services / systemd"
difficulty: "hard"
time_limit: 1200
max_score: 100
infrastructure_type: "docker"
docker_privileged: false
jira_priority: "Medium"
topics_covered: "Q180 systemd — systemctl status, journalctl, unit syntax"

description: |
  myapp.service fails on every start. ExecStart points to a non-existent script path.

objectives:
  - systemctl status myapp
  - Read journalctl -u myapp
  - Fix unit file ExecStart
  - Reload and start service

initial_state: |
  Ubuntu 22.04 lab container with a realistic misconfiguration.

hints:
  - order: 1
    cost: 15
    content: "`systemctl status myapp` and `journalctl -u myapp -n 20`"
  - order: 2
    cost: 25
    content: "Change ExecStart to `/opt/myapp/run.sh` then `systemctl daemon-reload`"
