description: 'CONTEXT: A team operating Linux administration needs you to resolve `Broken systemd Unit
  — App Won''t Start` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where myapp.service has an ExecStart referencing a non-existent
  path, so the unit fails to start (203/EXEC). The myapp.service unit fails on every start because its
  ExecStart points to a script path that doesn''t exist (status 203/EXEC). systemd can''t launch a binary
  it can''t find, so the service enters a failed state. Find the correct executable path, fix the unit,
  reload systemd, and start the service.


  OBJECTIVE: Read the unit status/journal to find why it fails; Correct the ExecStart path in the unit
  and reload systemd; Start the service and confirm it is active. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Read the unit status/journal to find why it fails
- Correct the ExecStart path in the unit and reload systemd
- Start the service and confirm it is active
