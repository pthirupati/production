title: Configure kdump to Capture Kernel Crash Dumps
slug: linux-kdump-configure
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Configure kdump to
  Capture Kernel Crash Dumps` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. systemctl status kdump shows "Unit kdump.service
  could not

  be found". The /etc/default/grub file does not have crashkernel= in GRUB_CMDLINE_LINUX.

  The previous kernel panic left no trace in /var/crash/ because kdump was absent. The server had an unexpected
  kernel panic last week but no vmcore dump was captured

  for analysis because kdump was not configured. kdump uses kexec to boot a capture

  kernel when the main kernel crashes and saves the memory dump to disk. It must be

  properly installed and configured so future crashes produce a vmcore that can be

  analyzed with crash or gdb.


  OBJECTIVE: Install kexec-tools with yum install -y kexec-tools; Add crashkernel=auto to GRUB_CMDLINE_LINUX
  in /etc/default/grub; Regenerate GRUB config with grub2-mkconfig -o /boot/grub2/grub.cfg. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. systemctl status kdump shows "Unit kdump.service could not

  be found". The /etc/default/grub file does not have crashkernel= in GRUB_CMDLINE_LINUX.

  The previous kernel panic left no trace in /var/crash/ because kdump was absent.

  '
objectives:
- Install kexec-tools with yum install -y kexec-tools
- Add crashkernel=auto to GRUB_CMDLINE_LINUX in /etc/default/grub
- Regenerate GRUB config with grub2-mkconfig -o /boot/grub2/grub.cfg
- Configure /etc/kdump.conf to set path /var/crash and core_collector makedumpfile -l --message-level
  1
- Enable and start kdump with systemctl enable --now kdump
- Reboot and verify kdump service is active after reboot
