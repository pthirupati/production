description: 'CONTEXT: A team operating Linux administration needs you to resolve `LVM — Evacuate PV Before
  Disk Removal` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server using LVM where datalv spans two PVs. The old PV (a /dev/loop
  device) must be evacuated with pvmove and then removed from VG fixitlab, with data left intact. A physical
  volume (the /dev/loop ''disk1'' device) is being retired, but the datalv logical volume currently spans
  both PVs, so the disk can''t simply be removed. Its extents must be migrated off the doomed PV onto
  the remaining disk with pvmove (online, data-safe) before the PV is removed from the volume group with
  vgreduce.


  OBJECTIVE: Inspect the PV/LV extent layout and confirm datalv uses the old PV; Evacuate all extents
  off the old PV with pvmove; Verify the PV is empty and data intact, then vgreduce it out. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Inspect the PV/LV extent layout and confirm datalv uses the old PV
- Evacuate all extents off the old PV with pvmove
- Verify the PV is empty and data intact, then vgreduce it out
initial_state: Linux server using LVM where datalv spans two PVs. The old PV (a /dev/loop device) must
  be evacuated with pvmove and then removed from VG fixitlab, with data left intact.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
