title: LVM — Evacuate PV Before Disk Removal
slug: lvm-pvmove-evacuate
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Storage / LVM
difficulty: hard
time_limit: 1800
max_score: 100
infrastructure_type: docker
docker_privileged: true
jira_priority: Medium
topics_covered: Q14 pvmove — migrate extents off failing PV
description: A physical volume (the /dev/loop 'disk1' device) is being retired, but the datalv logical
  volume currently spans both PVs, so the disk can't simply be removed. Its extents must be migrated off
  the doomed PV onto the remaining disk with pvmove (online, data-safe) before the PV is removed from
  the volume group with vgreduce.
objectives:
- Inspect the PV/LV extent layout and confirm datalv uses the old PV
- Evacuate all extents off the old PV with pvmove
- Verify the PV is empty and data intact, then vgreduce it out
initial_state: Linux server using LVM where datalv spans two PVs. The old PV (a /dev/loop device) must
  be evacuated with pvmove and then removed from VG fixitlab, with data left intact.
hints:
- order: 1
  cost: 10
  content: 'Map the layout: `pvs -o+pv_used,vg_name` and `lvs -o+devices` show datalv occupying both PVs,
    including the old loop device you must retire.'
- order: 2
  cost: 20
  content: 'Migrate the extents off it (online, safe): `pvmove /dev/loop0p1` (use the real old-PV path
    from pvs). Watch progress until it completes.'
- order: 3
  cost: 30
  content: 'Confirm it''s empty (`pvs` shows 0 used on that PV) and data is intact, then remove it: `vgreduce
    fixitlab /dev/loop0p1` (and `pvremove` if decommissioning).'
