title: Enable IP Forwarding via sysctl
slug: linux-sysctl-ip-forward
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Enable IP Forwarding
  via sysctl` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server with two interfaces. net.ipv4.ip_forward is 0, so
  traffic

  arriving on one interface destined for another is silently dropped. No sysctl drop-in

  enables forwarding, so even a runtime change would be lost on reboot. This host is meant to act as a
  router/NAT gateway for a lab network, but packets are

  not being forwarded between interfaces because net.ipv4.ip_forward is 0. You must

  enable IP forwarding and make the change persistent so it is reapplied on every boot by

  adding net.ipv4.ip_forward = 1 to a file under /etc/sysctl.d (or /etc/sysctl.conf).


  OBJECTIVE: Enable forwarding at runtime (sysctl -w net.ipv4.ip_forward=1); Persist it by writing net.ipv4.ip_forward
  = 1 into /etc/sysctl.d/99-ipforward.conf; Confirm the persistent setting is present so it survives a
  reboot. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
