title: nftables Drops Application Traffic on 8080
slug: linux-nftables-port-blocked
difficulty: medium
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `nftables Drops Application
  Traffic on 8080` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. nft list ruleset shows table inet filter with chain
  input

  policy drop and no rule for 8080. Connections to port 8080 time out. /etc/nftables.conf

  lacks the accept rule. After migrating from iptables to nftables, the application on TCP 8080 is unreachable.

  The inet filter table''s input chain has a default policy of drop with no accept rule for

  8080. Add an nftables rule to allow tcp dport 8080, make it persistent in

  /etc/nftables.conf, and reload the ruleset. Record the remediation.


  OBJECTIVE: {''Inspect the ruleset'': ''nft list ruleset''}; Add an accept rule for tcp dport 8080 to
  the inet filter input chain; Persist it in /etc/nftables.conf. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. nft list ruleset shows table inet filter with chain input

