title: LVM Full — Add New PV and Extend LV
slug: lvm-add-pv-extend
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Storage / LVM
difficulty: hard
time_limit: 1800
max_score: 100
infrastructure_type: docker
docker_privileged: true
jira_priority: Medium
topics_covered: Q11-Q14 LVM — pvcreate, vgextend, lvextend, xfs_growfs
description: /data is 100% full. Volume group fixitlab has no free extents. A second disk is attached at /dev/fixitlab-disk2 but is not yet in the VG (ignore tiny /dev/vdb — it is not usable).
objectives:
- Confirm VG is full with vgs/pvs
- Initialize /dev/fixitlab-disk2 with pvcreate
- vgextend and lvextend datalv
- Filesystem on /data accepts new writes
initial_state: 'Ubuntu 22.04 lab container with a realistic misconfiguration.

  '
hints:
- order: 1
  cost: 15
  content: '`lsblk` and `pvs` — spare disk is /dev/fixitlab-disk2 (not /dev/vdb)'
- order: 2
  cost: 30
  content: '`pvcreate /dev/fixitlab-disk2 && vgextend fixitlab /dev/fixitlab-disk2`'
- order: 3
  cost: 45
  content: '`lvextend -l +100%FREE /dev/fixitlab/datalv && xfs_growfs /data`'
- order: 4
  cost: 15
  content: Run xfs_growfs /data
