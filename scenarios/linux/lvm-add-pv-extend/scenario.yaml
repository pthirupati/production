description: 'CONTEXT: A team operating Linux administration needs you to resolve `LVM Full — Add New
  PV and Extend LV` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server using LVM where VG fixitlab is out of free extents and /data
  is full. The spare disk is /dev/fixitlab-disk2 (note: not /dev/vdb), not yet a PV. /data is 100% full
  and the volume group ''fixitlab'' has no free extents, so applications can''t write. A second disk is
  attached as /dev/fixitlab-disk2 but hasn''t been added to the VG. Add the new disk as a physical volume,
  extend the volume group and the datalv logical volume, then grow the XFS filesystem to reclaim capacity.


  OBJECTIVE: Confirm the VG is full and identify the spare disk; pvcreate the new disk and vgextend the
  volume group; lvextend datalv into the new space and xfs_growfs /data. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the VG is full and identify the spare disk
- pvcreate the new disk and vgextend the volume group
- lvextend datalv into the new space and xfs_growfs /data
initial_state: 'Linux server using LVM where VG fixitlab is out of free extents and /data is full. The
  spare disk is /dev/fixitlab-disk2 (note: not /dev/vdb), not yet a PV.'
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
