title: 'Add a Swap Partition with fdisk + mkswap + swapon'
slug: linux-fdisk-swap-partition-mkswap-swapon
difficulty: medium
category: 'Storage / Swap'
technology: linux
description: |
  The server is under memory pressure and the OOM killer has begun terminating processes.
  A spare 4G disk /dev/sdc is available. Rather than a swap file, the team wants a
  dedicated swap PARTITION. Create a partition on /dev/sdc with fdisk (type Linux swap),
  initialise it with mkswap, activate it with swapon, and add it to /etc/fstab so it comes
  up on every boot. Activating swap without persisting it, or persisting without
  activating, is not acceptable.
initial_state: |
  Simulated RHEL 9 server. swapon --show prints nothing and free -h shows 0B swap.
  /dev/sdc (4G) is present with no partitions. /etc/fstab has no swap entry for it.
objectives:
  - Confirm there is no active swap with swapon --show and free -h
  - Create a partition with fdisk /dev/sdc (set type 82 / Linux swap)
  - Initialise the swap area: mkswap /dev/sdc1
  - Activate it now: swapon /dev/sdc1, verify with swapon --show
  - Persist it in /etc/fstab (/dev/sdc1 none swap sw 0 0)
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
topics_covered:
  - fdisk
  - swap
  - mkswap
  - swapon
  - fstab
hints:
  - content: 'swapon --show is empty and free -h shows 0 swap. /dev/sdc has no partition yet — create one with fdisk /dev/sdc (n, p, w); optionally set the type to 82 (Linux swap) with t.'
    cost: 10
    order: 1
  - content: 'Turn the new partition into swap and activate it: mkswap /dev/sdc1; swapon /dev/sdc1. Confirm it now appears in swapon --show.'
    cost: 15
    order: 2
  - content: 'Persist across reboots by adding ''/dev/sdc1 none swap sw 0 0'' to /etc/fstab, then test with swapon -a.'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
