title: Add a Swap Partition with fdisk + mkswap + swapon
slug: linux-fdisk-swap-partition-mkswap-swapon
difficulty: medium
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Add a Swap Partition
  with fdisk + mkswap + swapon` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. swapon --show prints nothing and free -h shows 0B
  swap.

  /dev/sdc (4G) is present with no partitions. /etc/fstab has no swap entry for it. The server is under
  memory pressure and the OOM killer has begun terminating processes.

  A spare 4G disk /dev/sdc is available. Rather than a swap file, the team wants a

  dedicated swap PARTITION. Create a partition on /dev/sdc with fdisk (type Linux swap),

  initialise it with mkswap, activate it with swapon, and add it to /etc/fstab so it comes

  up on every boot. Activating swap without persisting it, or persisting without

  activating, is not acceptable.


  OBJECTIVE: Confirm there is no active swap with swapon --show and free -h; Create a partition with fdisk
  /dev/sdc (set type 82 / Linux swap); {''Initialise the swap area'': ''mkswap /dev/sdc1''}. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. swapon --show prints nothing and free -h shows 0B swap.

  /dev/sdc (4G) is present with no partitions. /etc/fstab has no swap entry for it.

  '
objectives:
- Confirm there is no active swap with swapon --show and free -h
- Create a partition with fdisk /dev/sdc (set type 82 / Linux swap)
- Initialise the swap area: mkswap /dev/sdc1
- Activate it now: swapon /dev/sdc1, verify with swapon --show
- Persist it in /etc/fstab (/dev/sdc1 none swap sw 0 0)
