title: User Not Allowed to Run Cron
slug: cron-access-denied
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Scheduling
difficulty: easy
time_limit: 600
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q193 cron.allow/deny
description: User 'appuser' gets "You are not allowed to run crontab" when trying to schedule jobs. cron
  access is gated by /etc/cron.allow and /etc/cron.deny, and appuser is either listed in cron.deny or
  missing from an existing cron.allow. Adjust the access-control files so appuser can manage its crontab.
objectives:
- Confirm appuser is blocked by cron access control
- Check cron.allow/cron.deny and grant appuser access
- Verify appuser can run crontab without the access-denied error
initial_state: Linux server using cron access control. appuser is denied crontab access because of an
  entry in /etc/cron.deny (or absence from /etc/cron.allow).
hints:
- order: 1
  cost: 10
  content: 'Confirm the rule: if `/etc/cron.allow` exists, ONLY users listed there may use cron; otherwise
    users in `/etc/cron.deny` are blocked. Check both: `cat /etc/cron.allow /etc/cron.deny 2>/dev/null`.'
- order: 2
  cost: 15
  content: If appuser is in cron.deny, remove that line. If cron.allow exists and gates access, add `appuser`
    to it.
- order: 3
  cost: 20
  content: 'Verify as the user: `sudo -u appuser crontab -l` no longer returns "not allowed", and `sudo
    -u appuser crontab -e` works.'
