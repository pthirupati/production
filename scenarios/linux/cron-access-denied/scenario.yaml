description: 'CONTEXT: A team operating Linux administration needs you to resolve `User Not Allowed to
  Run Cron` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server using cron access control. appuser is denied crontab access because
  of an entry in /etc/cron.deny (or absence from /etc/cron.allow). User ''appuser'' gets "You are not
  allowed to run crontab" when trying to schedule jobs. cron access is gated by /etc/cron.allow and /etc/cron.deny,
  and appuser is either listed in cron.deny or missing from an existing cron.allow. Adjust the access-control
  files so appuser can manage its crontab.


  OBJECTIVE: Confirm appuser is blocked by cron access control; Check cron.allow/cron.deny and grant appuser
  access; Verify appuser can run crontab without the access-denied error. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
