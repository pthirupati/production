title: Network Slow and Large Transfers Failing — MTU Mismatch
slug: linux-network-slow-mtu
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Network Slow and Large
  Transfers Failing — MTU Mismatch` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server connected through a VPN. SSH sessions are responsive
  but scp

  and rsync transfers stall after a few kilobytes. ping -c 3 8.8.8.8 succeeds but

  ping -M do -s 1472 8.8.8.8 (a 1500-byte packet with DF bit) returns "Message too long".

  The interface eth0 shows MTU 1500 with ip link show. Small network packets like SSH keystrokes work
  fine but large file transfers are either

  failing entirely or running at a fraction of expected speed. This is a classic symptom

  of an MTU mismatch — the interface MTU is set higher than the network path supports,

  causing packet fragmentation or silent drops. The path MTU must be discovered and the

  interface MTU must be adjusted accordingly.


  OBJECTIVE: Test path MTU with ping -M do -s 1472 <target> and decrease packet size until pings succeed;
  Calculate correct MTU (payload size that succeeds + 28 bytes for IP/ICMP headers); Check current MTU
  with ip link show eth0. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server connected through a VPN. SSH sessions are responsive but scp

  and rsync transfers stall after a few kilobytes. ping -c 3 8.8.8.8 succeeds but

  ping -M do -s 1472 8.8.8.8 (a 1500-byte packet with DF bit) returns "Message too long".

  The interface eth0 shows MTU 1500 with ip link show.

  '
objectives:
- Test path MTU with ping -M do -s 1472 <target> and decrease packet size until pings succeed
- Calculate correct MTU (payload size that succeeds + 28 bytes for IP/ICMP headers)
- Check current MTU with ip link show eth0
- Set the correct MTU: ip link set dev eth0 mtu 1450 (or appropriate value found)
- Make the MTU change persistent in /etc/sysconfig/network-scripts/ifcfg-eth0 with MTU=1450
- Verify large scp transfer works after MTU adjustment
