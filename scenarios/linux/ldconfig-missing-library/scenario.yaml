title: Application Fails — Shared Library Not Found
slug: ldconfig-missing-library
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Libraries
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
docker_privileged: false
jira_priority: Medium
topics_covered: Q156 ldconfig — /etc/ld.so.conf.d, ldd
description: The binary /usr/local/bin/myapp won't run — it exits with "error while loading shared libraries"
  because the directory holding its custom .so was removed from the dynamic linker's search path (an ld.so.conf.d
  entry was deleted). The loader can't find libfixit.so at startup. Restore the library path and refresh
  the linker cache.
objectives:
- Identify the missing shared library at load time
- Restore the library directory to the dynamic linker configuration
- Refresh the linker cache and verify myapp runs
initial_state: Linux server where /usr/local/bin/myapp fails to start because /usr/local/lib (containing
  libfixit.so) is no longer in the dynamic linker path; the ld.so.conf.d entry was removed.
hints:
- order: 1
  cost: 10
  content: 'See what''s missing: `ldd /usr/local/bin/myapp` shows `libfixit.so => not found`. The lib
    exists (e.g. in /usr/local/lib) but isn''t on the loader''s path.'
- order: 2
  cost: 15
  content: 'Re-add the path: create `/etc/ld.so.conf.d/fixitlab.conf` containing `/usr/local/lib`.'
- order: 3
  cost: 20
  content: 'Rebuild the cache: `ldconfig`. Re-check `ldd /usr/local/bin/myapp` (now resolved) and run
    `myapp` — it starts.'
