description: 'CONTEXT: A team operating Linux administration needs you to resolve `Application Fails —
  Shared Library Not Found` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /usr/local/bin/myapp fails to start because /usr/local/lib
  (containing libfixit.so) is no longer in the dynamic linker path; the ld.so.conf.d entry was removed.
  The binary /usr/local/bin/myapp won''t run — it exits with "error while loading shared libraries" because
  the directory holding its custom .so was removed from the dynamic linker''s search path (an ld.so.conf.d
  entry was deleted). The loader can''t find libfixit.so at startup. Restore the library path and refresh
  the linker cache.


  OBJECTIVE: Identify the missing shared library at load time; Restore the library directory to the dynamic
  linker configuration; Refresh the linker cache and verify myapp runs. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the missing shared library at load time
- Restore the library directory to the dynamic linker configuration
- Refresh the linker cache and verify myapp runs
