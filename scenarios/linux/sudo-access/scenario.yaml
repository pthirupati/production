title: Configure Sudo Access for a User Without Full Root
slug: linux-sudo-access
difficulty: easy
category: Build
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Configure Sudo Access
  for a User Without Full Root` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where devops needs delegated, command-scoped sudo for systemctl
  only — no broad root access — and no such rule exists yet. The ''devops'' user needs to manage services
  with systemctl via sudo, but must NOT get unrestricted root. This calls for a precise sudoers rule that
  allows only the systemctl command (passwordless if desired) and nothing else. Add the rule safely with
  visudo and verify devops can run sudo systemctl but not arbitrary privileged commands.


  OBJECTIVE: Edit the sudoers file safely with visudo; Add a rule allowing devops to run only systemctl
  via sudo; Verify sudo systemctl works for devops but other privileged commands are denied. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: Linux server where devops needs delegated, command-scoped sudo for systemctl only — no
  broad root access — and no such rule exists yet.
objectives:
- Edit the sudoers file safely with visudo
- Add a rule allowing devops to run only systemctl via sudo
- Verify sudo systemctl works for devops but other privileged commands are denied
