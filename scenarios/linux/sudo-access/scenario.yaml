title: Configure Sudo Access for a User Without Full Root
slug: linux-sudo-access
difficulty: easy
category: Linux Administration
description: The 'devops' user needs to manage services with systemctl via sudo, but must NOT get unrestricted
  root. This calls for a precise sudoers rule that allows only the systemctl command (passwordless if
  desired) and nothing else. Add the rule safely with visudo and verify devops can run sudo systemctl
  but not arbitrary privileged commands.
initial_state: Linux server where devops needs delegated, command-scoped sudo for systemctl only — no
  broad root access — and no such rule exists yet.
objectives:
- Edit the sudoers file safely with visudo
- Add a rule allowing devops to run only systemctl via sudo
- Verify sudo systemctl works for devops but other privileged commands are denied
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Always edit with `visudo` (it validates syntax). Prefer a drop-in: `visudo -f /etc/sudoers.d/devops`.'
- order: 2
  cost: 15
  content: 'Add a command-scoped rule: `devops ALL=(ALL) NOPASSWD:/usr/bin/systemctl` (only systemctl,
    not full root).'
- order: 3
  cost: 20
  content: 'Verify both sides: `sudo -u devops sudo systemctl status nginx` works, while `sudo -u devops
    sudo bash` is rejected (not permitted).'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
