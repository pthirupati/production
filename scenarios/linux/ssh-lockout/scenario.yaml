description: 'CONTEXT: A team operating Linux administration needs you to resolve `SSH Configuration Lockout`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where over-aggressive hardening broke SSH: sshd_config has invalid
  options (and/or a non-standard port), and /etc/ssh/ssh_host_*_key files have wrong permissions, so sshd
  fails to serve. After a rushed security hardening pass, SSH to the production host is broken: sshd_config
  contains invalid directives so the service won''t start (or won''t listen on port 22), and the host
  key file permissions were changed so sshd refuses them. Validate and fix the config, restore correct
  host-key permissions, and get sshd listening on 22 again.


  OBJECTIVE: Validate sshd_config and identify the invalid directives; Fix the config (restore listening
  on port 22) and host-key file permissions; Start sshd and verify it is serving SSH. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Validate sshd_config and identify the invalid directives
- Fix the config (restore listening on port 22) and host-key file permissions
- Start sshd and verify it is serving SSH
initial_state: 'Linux server where over-aggressive hardening broke SSH: sshd_config has invalid options
  (and/or a non-standard port), and /etc/ssh/ssh_host_*_key files have wrong permissions, so sshd fails
  to serve.'
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
