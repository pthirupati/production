title: SSH Configuration Lockout
slug: ssh-lockout
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Security
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: High
description: 'After a rushed security hardening pass, SSH to the production host is broken: sshd_config
  contains invalid directives so the service won''t start (or won''t listen on port 22), and the host
  key file permissions were changed so sshd refuses them. Validate and fix the config, restore correct
  host-key permissions, and get sshd listening on 22 again.'
objectives:
- Validate sshd_config and identify the invalid directives
- Fix the config (restore listening on port 22) and host-key file permissions
- Start sshd and verify it is serving SSH
initial_state: 'Linux server where over-aggressive hardening broke SSH: sshd_config has invalid options
  (and/or a non-standard port), and /etc/ssh/ssh_host_*_key files have wrong permissions, so sshd fails
  to serve.'
hints:
- order: 1
  cost: 10
  content: 'Validate the config: `sshd -t` prints the offending line(s). Also confirm the intended `Port
    22`/`ListenAddress` settings.'
- order: 2
  cost: 15
  content: 'Correct the invalid directives in /etc/ssh/sshd_config. Host keys must be tightly permissioned:
    `chmod 600 /etc/ssh/ssh_host_*_key`.'
- order: 3
  cost: 20
  content: 'Once `sshd -t` is clean, `systemctl restart sshd` and confirm it''s listening: `ss -tlnp |
    grep :22`. Test a connection before closing your current session.'
