description: 'CONTEXT: A team operating Linux administration needs you to resolve `Disk Space Crisis`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server with a filesystem at ~98% capacity. A log_generator process keeps
  growing logs, oversized files sit under /var/log, and hidden cache files add to the pressure; the app
  can''t write. Production alerts fired: a filesystem is at 98% and the web application can no longer
  write logs, so services are failing. Disk space is being consumed by oversized logs, a hidden cache
  directory, and a runaway process that keeps generating log data. Find the consumers, stop the runaway
  writer, and reclaim enough space to restore service.


  OBJECTIVE: Identify the largest files/directories consuming disk space; Find and remove hidden cache
  files and oversized logs; Kill the log_generator process so logs stop growing, and confirm space is
  reclaimed. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the largest files/directories consuming disk space
- Find and remove hidden cache files and oversized logs
- Kill the log_generator process so logs stop growing, and confirm space is reclaimed
initial_state: Linux server with a filesystem at ~98% capacity. A log_generator process keeps growing
  logs, oversized files sit under /var/log, and hidden cache files add to the pressure; the app can't
  write.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
