title: Disk Space Crisis
slug: disk-full
lab_mode: simulation
simulation_type: generic
technology: Linux
category: Storage
difficulty: medium
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: High
description: 'Production alerts fired: a filesystem is at 98% and the web application can no longer write
  logs, so services are failing. Disk space is being consumed by oversized logs, a hidden cache directory,
  and a runaway process that keeps generating log data. Find the consumers, stop the runaway writer, and
  reclaim enough space to restore service.'
objectives:
- Identify the largest files/directories consuming disk space
- Find and remove hidden cache files and oversized logs
- Kill the log_generator process so logs stop growing, and confirm space is reclaimed
initial_state: Linux server with a filesystem at ~98% capacity. A log_generator process keeps growing
  logs, oversized files sit under /var/log, and hidden cache files add to the pressure; the app can't
  write.
hints:
- order: 1
  cost: 10
  content: 'Find the big consumers top-down: `df -h` then `du -sh /* 2>/dev/null | sort -h` and drill
    into the largest (e.g. /var/log/webapp/).'
- order: 2
  cost: 15
  content: 'Don''t forget hidden dirs: `du -sh /tmp/.* 2>/dev/null`. And catch the writer: `ps aux | grep
    log_generator` shows a process appending continuously.'
- order: 3
  cost: 20
  content: Stop the runaway first (`pkill -f log_generator`) so space stops filling, then truncate/remove
    oversized logs (`truncate -s 0 /var/log/webapp/*.log`) and clear the cache. Confirm `df -h` drops
    well below the alert threshold.
