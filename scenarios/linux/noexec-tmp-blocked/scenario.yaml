description: 'CONTEXT: A team operating Linux administration needs you to resolve `/tmp Mounted noexec
  — Installer Fails` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /tmp is mounted noexec, so executing a script placed there
  is blocked regardless of its file permissions. An installer script copied into /tmp fails to run with
  "Permission denied" even though it''s executable, because /tmp is mounted with the `noexec` option,
  which forbids executing binaries from that filesystem. Either run the script from a path that permits
  execution or temporarily remount /tmp with exec to complete the install.


  OBJECTIVE: Confirm /tmp is mounted noexec and that''s why execution is blocked; Remount /tmp with exec
  (or run the script from an exec-permitted path); Run the installer successfully. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm /tmp is mounted noexec and that's why execution is blocked
- Remount /tmp with exec (or run the script from an exec-permitted path)
- Run the installer successfully
