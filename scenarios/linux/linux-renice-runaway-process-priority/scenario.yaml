title: Tame a Runaway Process with renice and a Limit
slug: linux-renice-runaway-process-priority
difficulty: easy
category: Fix
technology: linux
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Tame a Runaway Process
  with renice and a Limit` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. top shows the analytics process at nice 0 consuming
  most CPU.

  There is no policy file pinning it to a lower priority, so every restart reverts to nice

  0 and re-starves the box. A batch analytics process is hogging CPU and starving interactive work because
  it runs at

  the default priority. Operations policy is to keep this workload at a low CPU priority

  (high nice value) and to capture that policy so future launches inherit it. Renice the

  running process to a low priority and record the policy (e.g. a wrapper/limits drop-in)

  so it is reproducible. Record the remediation.


  OBJECTIVE: Identify the offending PID with top / ps -eo pid,ni,comm; {''Renice it to a low priority'':
  ''renice +15 -p <pid> (higher nice = lower priority)''}; Confirm the new nice value with ps -o ni. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
