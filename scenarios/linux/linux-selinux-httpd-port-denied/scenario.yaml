title: SELinux Blocks nginx on a Custom Port
slug: linux-selinux-httpd-port-denied
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `SELinux Blocks nginx
  on a Custom Port` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. getenforce returns Enforcing. nginx.conf listens
  on 8080.

  systemctl start nginx fails and the audit log shows:

  type=AVC msg=audit(...): avc:  denied  { name_bind } for  pid=... comm="nginx"

  src=8080 scontext=system_u:system_r:httpd_t:s0 tcontext=system_u:object_r:unreserved_port_t:s0 nginx
  is configured to listen on the non-standard port 8080, but SELinux is in

  Enforcing mode and only labels the standard HTTP ports (80, 443, 8008, ...) with

  the http_port_t type. When nginx tries to bind to 8080 the kernel denies the

  name_bind and the service fails to start. The correct production fix is to add the

  port to the http_port_t SELinux type with semanage — NOT to disable SELinux.


  OBJECTIVE: Confirm SELinux is in Enforcing mode with getenforce / sestatus; Identify port 8080 is not
  labelled http_port_t (semanage port -l | grep http_port_t); Add the port label with semanage port -a
  -t http_port_t -p tcp 8080. Success means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. getenforce returns Enforcing. nginx.conf listens on 8080.

  systemctl start nginx fails and the audit log shows:

  type=AVC msg=audit(...): avc:  denied  { name_bind } for  pid=... comm="nginx"

  src=8080 scontext=system_u:system_r:httpd_t:s0 tcontext=system_u:object_r:unreserved_port_t:s0

  '
objectives:
- Confirm SELinux is in Enforcing mode with getenforce / sestatus
- Identify port 8080 is not labelled http_port_t (semanage port -l | grep http_port_t)
- Add the port label with semanage port -a -t http_port_t -p tcp 8080
- Start nginx with systemctl start nginx and confirm it is running
- Leave SELinux in Enforcing mode — do not disable it
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
