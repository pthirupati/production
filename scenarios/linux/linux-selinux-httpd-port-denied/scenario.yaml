title: SELinux Blocks nginx on a Custom Port
slug: linux-selinux-httpd-port-denied
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration has raised a ticket for `SELinux Blocks nginx
  on a Custom Port`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture is a single
  lab-primary node exposing terminal and config files under /etc and /var; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: RHEL 9 server. getenforce returns Enforcing. nginx.conf listens
  on 8080.

  systemctl start nginx fails and the audit log shows:

  type=AVC msg=audit(...): avc:  denied  { name_bind } for  pid=... comm="nginx"

  src=8080 scontext=system_u:system_r:httpd_t:s0 tcontext=system_u:object_r:unreserved_port_t:s0


  OBJECTIVE: Confirm SELinux is in Enforcing mode with getenforce / sestatus; Identify port 8080 is not
  labelled http_port_t (semanage port -l | grep http_port_t); Add the port label with semanage port -a
  -t http_port_t -p tcp 8080. Acceptance criteria: the change is minimal and reversible, and success means
  `systemctl is-active nginx`` returns active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant terminal and config files under /etc and /var), changing one thing at a time. Check
  your work continuously against the objective — success means `systemctl is-active nginx``` returns active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active nginx`` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'RHEL 9 server. getenforce returns Enforcing. nginx.conf listens on 8080.

  systemctl start nginx fails and the audit log shows:

  type=AVC msg=audit(...): avc:  denied  { name_bind } for  pid=... comm="nginx"

  src=8080 scontext=system_u:system_r:httpd_t:s0 tcontext=system_u:object_r:unreserved_port_t:s0

  '
objectives:
- Confirm SELinux is in Enforcing mode with getenforce / sestatus
- Identify port 8080 is not labelled http_port_t (semanage port -l | grep http_port_t)
- Add the port label with semanage port -a -t http_port_t -p tcp 8080
- Start nginx with systemctl start nginx and confirm it is running
- Leave SELinux in Enforcing mode — do not disable it
