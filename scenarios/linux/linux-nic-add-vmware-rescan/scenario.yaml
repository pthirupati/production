title: Add a Second NIC in VMware, then Bring It Up in the Guest
slug: linux-nic-add-vmware-rescan
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Add a Second NIC in
  VMware, then Bring It Up in the Guest` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator.
  The

  guest has a single NIC (eth0). A second interface must be added in VMware before it

  can be brought up and addressed in the guest. web-prod-01 needs a second network interface on the 10.0.0.0/24
  storage network,

  but the VM currently has only one NIC. This is a CROSS-TECHNOLOGY task: add a NEW

  network adapter to web-prod-01 in the vCenter simulator, then go to the terminal,

  rescan so the kernel sees the new link (it appears as eth1), and configure it with

  the address 10.0.0.30/24. The interface does not exist in the guest until you add

  it in VMware first.


  OBJECTIVE: Open the VMware simulator (toolbar link) and add a Network Adapter to web-prod-01; Rescan
  in the terminal so the new link (eth1) is discovered (rescan-scsi-bus.sh or a PCI rescan); Assign the
  address 10.0.0.30/24 to the new interface (ip addr add 10.0.0.30/24 dev eth1). Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator. The

