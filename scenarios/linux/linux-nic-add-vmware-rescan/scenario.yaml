title: Add a Second NIC in VMware, then Bring It Up in the Guest
slug: linux-nic-add-vmware-rescan
difficulty: medium
category: Linux Administration
description: |
  web-prod-01 needs a second network interface on the 10.0.0.0/24 storage network,
  but the VM currently has only one NIC. This is a CROSS-TECHNOLOGY task: add a NEW
  network adapter to web-prod-01 in the vCenter simulator, then go to the terminal,
  rescan so the kernel sees the new link (it appears as eth1), and configure it with
  the address 10.0.0.30/24. The interface does not exist in the guest until you add
  it in VMware first.
initial_state: |
  Simulated RHEL 9 server (web-prod-01), also present in the vCenter simulator. The
  guest has a single NIC (eth0). A second interface must be added in VMware before it
  can be brought up and addressed in the guest.
objectives:
  - Open the VMware simulator (toolbar link) and add a Network Adapter to web-prod-01
  - Rescan in the terminal so the new link (eth1) is discovered (rescan-scsi-bus.sh or a PCI rescan)
  - Assign the address 10.0.0.30/24 to the new interface (ip addr add 10.0.0.30/24 dev eth1)
  - Verify the interface is up and addressed with ip addr
lab_mode: simulation
simulation_type: generic
cross_technology: true
vmware_link: true
time_limit: 900
max_score: 100
is_free: false
hints:
  - content: 'The guest has no second NIC yet. Open the VMware simulator (toolbar -> Open VMware), Edit Settings on web-prod-01 -> Add New Device -> Network Adapter.'
    cost: 10
    order: 1
  - content: 'Reveal the new link in the guest with a rescan (rescan-scsi-bus.sh, or echo 1 > /sys/bus/pci/rescan). It comes up as eth1.'
    cost: 15
    order: 2
  - content: 'Configure it: ip addr add 10.0.0.30/24 dev eth1 (and ip link set dev eth1 up). Confirm with ip addr.'
    cost: 20
    order: 3
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
