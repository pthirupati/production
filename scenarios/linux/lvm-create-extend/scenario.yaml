title: LVM — Create PV, VG, LV and Extend Filesystem
slug: linux-lvm-create-extend
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration has raised a ticket for `LVM — Create PV,
  VG, LV and Extend Filesystem`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server. The architecture is a single
  lab-primary node exposing terminal and config files under /etc and /var; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. A second disk /dev/sdb is visible via lsblk but has
  no

  partitions or LVM metadata. The /mnt/data directory exists but is empty and unmounted.

  Applications are waiting on storage to be provisioned before they can start.


  OBJECTIVE: Run pvcreate /dev/sdb to initialize the disk as an LVM physical volume; Create a volume group
  named vg_data using vgcreate vg_data /dev/sdb; Create a logical volume named lv_data using lvcreate
  -l 50%FREE -n lv_data vg_data. Acceptance criteria: the change is minimal and reversible, and success
  means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant terminal and config files under /etc and /var), changing one thing at a time. Check
  your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. A second disk /dev/sdb is visible via lsblk but has no

  partitions or LVM metadata. The /mnt/data directory exists but is empty and unmounted.

  Applications are waiting on storage to be provisioned before they can start.

  '
objectives:
- Run pvcreate /dev/sdb to initialize the disk as an LVM physical volume
- Create a volume group named vg_data using vgcreate vg_data /dev/sdb
- Create a logical volume named lv_data using lvcreate -l 50%FREE -n lv_data vg_data
- Format the logical volume with mkfs.xfs /dev/vg_data/lv_data
- Mount the logical volume at /mnt/data and verify with df -h
- Extend the logical volume with lvextend -l +100%FREE and grow the filesystem with xfs_growfs
