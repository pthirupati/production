title: LVM — Create PV, VG, LV and Extend Filesystem
slug: linux-lvm-create-extend
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `LVM — Create PV, VG,
  LV and Extend Filesystem` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. A second disk /dev/sdb is visible via lsblk but has
  no

  partitions or LVM metadata. The /mnt/data directory exists but is empty and unmounted.

  Applications are waiting on storage to be provisioned before they can start. A new disk /dev/sdb has
  been assigned to the server but no partitions or LVM structures

  have been configured on it. Storage must be provisioned using LVM so that applications

  can use the space. After creating the initial logical volume and mounting it, the volume

  must then be extended to accommodate growing data requirements.


  OBJECTIVE: Run pvcreate /dev/sdb to initialize the disk as an LVM physical volume; Create a volume group
  named vg_data using vgcreate vg_data /dev/sdb; Create a logical volume named lv_data using lvcreate
  -l 50%FREE -n lv_data vg_data. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. A second disk /dev/sdb is visible via lsblk but has no

  partitions or LVM metadata. The /mnt/data directory exists but is empty and unmounted.

  Applications are waiting on storage to be provisioned before they can start.

  '
objectives:
- Run pvcreate /dev/sdb to initialize the disk as an LVM physical volume
- Create a volume group named vg_data using vgcreate vg_data /dev/sdb
- Create a logical volume named lv_data using lvcreate -l 50%FREE -n lv_data vg_data
- Format the logical volume with mkfs.xfs /dev/vg_data/lv_data
- Mount the logical volume at /mnt/data and verify with df -h
- Extend the logical volume with lvextend -l +100%FREE and grow the filesystem with xfs_growfs
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
