title: Restore Accidentally Deleted Logical Volume Using LVM
slug: linux-lv-deleted-restore
difficulty: hard
category: Fix
description: 'CONTEXT: A team operating Linux administration needs you to resolve `Restore Accidentally
  Deleted Logical Volume Using LVM` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Linux practice server with terminal and config files
  under /etc and /var. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server. The volume group vg_prod exists but lvs shows lv_data
  is

  missing. The physical extents containing the data are still intact but unallocated.

  Applications using /data are down. /etc/lvm/archive/ contains timestamped backup files

  of the VG metadata from before the accidental deletion. An operator accidentally ran lvremove on the
  wrong logical volume, deleting lv_data

  from vg_prod while intending to remove a different volume. The data on the underlying

  physical extents has not been overwritten — LVM keeps configuration archives in

  /etc/lvm/archive/ that allow metadata to be restored. The LV metadata must be restored

  from the archive before any new LV is created in its place.


  OBJECTIVE: List available LVM archives with ls -ltr /etc/lvm/archive/; Identify the most recent archive
  file for vg_prod before the deletion occurred; Restore the LV metadata with vgcfgrestore -f /etc/lvm/archive/vg_prod_<timestamp>.vg
  vg_prod. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated RHEL 9 server. The volume group vg_prod exists but lvs shows lv_data is

  missing. The physical extents containing the data are still intact but unallocated.

  Applications using /data are down. /etc/lvm/archive/ contains timestamped backup files

  of the VG metadata from before the accidental deletion.

  '
objectives:
- List available LVM archives with ls -ltr /etc/lvm/archive/
- Identify the most recent archive file for vg_prod before the deletion occurred
- Restore the LV metadata with vgcfgrestore -f /etc/lvm/archive/vg_prod_<timestamp>.vg vg_prod
- Activate the restored logical volume with lvchange -ay vg_prod/lv_data
- Mount the logical volume and verify data is intact
- Review the data and confirm no corruption with application-level checks
