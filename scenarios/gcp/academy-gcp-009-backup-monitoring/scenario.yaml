description: 'CONTEXT: A team operating Google Cloud operations has raised a ticket for `Google Cloud
  Platform: Monitoring — Backup and Recovery`. A customer-facing workflow is degraded and the on-call
  engineer (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked
  users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GCP practice project. The architecture is a single
  lab-primary node exposing Console, gcloud, Compute Engine, disks, VPC, and IAM; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The `rsyslog` service is not running (`systemctl is-active rsyslog` → inactive/failed).
  Dependent Backup and Recovery tasks cannot succeed until the unit is healthy again. Service operations
  lab. The `rsyslog` systemd unit is **failed/inactive** on this host — a realistic fault for Backup and
  Recovery workflows that depend on it. Diagnose with `systemctl status rsyslog` and journal logs, apply
  the smallest reliable fix, then verify with `systemctl is-active rsyslog`.


  OBJECTIVE: The `rsyslog` service is active (running); `systemctl is-active rsyslog`` returns active;
  The fix survives a status re-check (no marker files). Acceptance criteria: the change is minimal and
  reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant Console, gcloud, Compute Engine, disks, VPC, and IAM), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- The `rsyslog` service is active (running)
- '`systemctl is-active rsyslog`` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `rsyslog` service is not running (`systemctl is-active rsyslog` → inactive/failed).
  Dependent Backup and Recovery tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: Monitoring is misconfigured and dependent workflows
    are failing. This lab is about Monitoring — how monitoring fits into Google Cloud operations. Read
    the objectives and the current state, and note precisely what looks wrong versus healthy before you
    form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Monitoring problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Repair or run the backup job, then perform a controlled restore
    into a scratch location to prove it works.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    1. Inspect the current state with the relevant Console, gcloud, Compute Engine, disks, VPC, and IAM
    for monitoring.

    2. Each command above tells you something specific — status/health, recent errors, and the effective
    configuration. Read them in that order.

    3. Compare what you see to the objectives; the gap points at the fault.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of Monitoring is at fault.

    2. Re-run the most relevant of the relevant Console, gcloud, Compute Engine, disks, VPC, and IAM for
    monitoring focused on just that part to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''Monitoring is
    misconfigured and dependent workflows are failing'' toward ''Monitoring behaves correctly under normal
    and failure checks''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the smallest reversible change your hypothesis points to. Repair or run the backup job, then
    perform a controlled restore into a scratch location to prove it works.

    2. Re-run `bash check.sh` and confirm Monitoring behaves correctly under normal and failure checks.

    3. If it still fails, the hypothesis was wrong — go back to the evidence, do not stack changes.


    WHY: the grader validates real system state, not marker files — a fix only counts when the subsystem
    is actually healthy.'
