tasks:
- id: task_1
  title: Open ingress SSH on the VPC firewall
  description: Add an ingress firewall rule allowing TCP/22 at a priority below the default-deny
    catch-all, and confirm SSH reachability returns.
  background: 'This lab teaches real GCP firewall rule evaluation: rules are processed in priority order,
    lowest number first, and the first match wins — a missing allow rule silently falls through to the
    implied default-deny every VPC gets by default.'
  validation:
