description: Service operations lab. The `nginx` systemd unit is **failed/inactive** on this host — a
  realistic fault for Integration Lab workflows that depend on it. Diagnose with `systemctl status nginx`
  and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active nginx`.
objectives:
- The `nginx` service is active (running)
- '`systemctl is-active nginx`` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `nginx` service is not running (`systemctl is-active nginx` → inactive/failed). Dependent
  Integration Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: old snapshots bloat storage or block operations.
    This lab is about snapshots — snapshot trees, consolidation, and disk growth. Read the objectives
    and the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For snapshots problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Configure credentials and networking, then drive one happy-path
    transaction end to end across both systems.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Inspect the planted gcp Lab Server fault: `/opt/gcp/config` and `gcloud config list`. Do not chase
    unrelated nginx/rsyslog units.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm the gcp config under /opt/gcp/ is broken.

    2. Repair credentials/project/region (or OpenStack clouds.yaml).

    3. Re-check with the cloud CLI until the profile is healthy.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix the broken gcp configuration on this Lab Server.

    2. Apply the documented remediation (config + FIXED-OK where required).

    3. Click Check Solution once cloud Lab Server health check passes (`systemctl is-failed` finds no
    failed units / config repaired).'
cross_technology: true
