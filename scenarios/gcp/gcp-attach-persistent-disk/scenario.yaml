tasks:
- id: task_1
  title: Attach disk-data-unattached to web01
  description: Attach the unattached persistent disk to web01 from the Google Cloud Console and confirm
    it shows as in use by web01.
  background: 'This lab teaches the standard GCP persistent-disk workflow: disks and instances are
    separate resources, and a disk provisioned ahead of time must be explicitly attached before the guest
    can see it.'
  validation:
    type: custom_script
    script: check.sh
    error_message: Validation did not pass. Attach disk-data-unattached to web01 from the Cloud Console
      Disks page.
solution:
  summary: Attach disk-data-unattached to web01 from either the instance's Disks section or the Disks
    list directly.
  files_changed: []
  commands_run:
  - 'Google Cloud Console: Compute Engine -> Disks -> disk-data-unattached -> Attach to instance -> web01'
  reference_docs: gcp-fundamentals
