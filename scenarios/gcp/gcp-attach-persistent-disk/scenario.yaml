description: 'CONTEXT: A team operating Google Cloud operations has raised a ticket for `Attach the Pending
  Persistent Disk Before the Data Import`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline GCP practice project. The architecture is a single
  lab-primary node exposing Console, gcloud, Compute Engine, disks, VPC, and IAM; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: disk-data-unattached (100GB, pd-ssd) shows no instance under "In use by" and
  is not listed under any instance''s disks. Compute Engine > Disks shows disk-data-unattached with no
  instance listed under "In use by". web01''s details page shows only its boot disk under Disks.

  OBJECTIVE: Sign in to the Google Cloud Console; Open Compute Engine > Disks and locate disk-data-unattached;
  Attach it to web01. Acceptance criteria: the change is minimal and reversible, and success means `check.sh`
  exits successfully.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant Console, gcloud, Compute Engine, disks, VPC, and IAM), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.

  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: disk-data-unattached (100GB, pd-ssd) shows no instance under "In use by" and is not listed
  under any instance's disks.
objectives:
- Sign in to the Google Cloud Console
- Open Compute Engine > Disks and locate disk-data-unattached
- Attach it to web01
- Confirm the disk shows web01 as "In use by"
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: attach the pending persistent disk before the
    data import is not behaving as the scenario objectives require. This lab is about attach the pending
    persistent disk before the data import — how attach the pending persistent disk before the data import
    behaves in a Google Cloud operations environment. Read the objectives and the current state, and note
    precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For attach the pending persistent disk before the data import problems
    the reliable method is: (1) reproduce/observe the failure, (2) narrow from the whole system down to
    the one component that owns the symptom, (3) change exactly one thing, (4) re-check. Create the smallest
    working slice of attach the pending persistent disk before the data import first, validate it, then
    add the remaining pieces one at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.

    WHY: many services fail cryptically when disk is full.'
