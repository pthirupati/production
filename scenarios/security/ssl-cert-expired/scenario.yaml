description: 'CONTEXT: A team operating security hardening needs you to resolve `Renew Expired SSL Certificate`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server running nginx with an expired (or about-to-expire) TLS certificate
  at /etc/nginx/ssl/cert.pem, causing HTTPS validation failures. HTTPS endpoints are failing certificate
  validation because the nginx TLS certificate is expired (or expires within a day). Browsers and clients
  reject the connection. Generate/install a valid certificate, point nginx at it, and reload so secure
  connections work again with a non-expired certificate.


  OBJECTIVE: Confirm the current certificate''s expiry; Generate/install a new valid certificate and key;
  Reload nginx and verify HTTPS serves a non-expired certificate. Success means HTTP 200 from http://localhost.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the current certificate's expiry
- Generate/install a new valid certificate and key
- Reload nginx and verify HTTPS serves a non-expired certificate
initial_state: Linux server running nginx with an expired (or about-to-expire) TLS certificate at /etc/nginx/ssl/cert.pem,
  causing HTTPS validation failures.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
