description: 'CONTEXT: A team operating security hardening needs you to resolve `Redis No Auth on 0.0.0.0
  - Add requirepass and Restrict` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with Redis. redis.conf has `bind 0.0.0.0` and no `requirepass`.

  `redis-cli -h localhost ping` returns PONG without any auth. Exposed to internet. Redis is running without
  authentication and listening on all network interfaces

  (0.0.0.0:6379). This is a known critical misconfiguration that has led to

  thousands of data breaches and ransomware infections. An unauthenticated attacker

  can read all cached data, overwrite it, or even write SSH keys to /root/.ssh/

  using Redis''s CONFIG SET dir command. Add a strong password requirement and

  restrict Redis to only listen on localhost.


  OBJECTIVE: Verify Redis is listening on 0.0.0.0 without authentication; Add requirepass with a strong
  password to /etc/redis/redis.conf; Change bind to 127.0.0.1. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Verify Redis is listening on 0.0.0.0 without authentication
- Add requirepass with a strong password to /etc/redis/redis.conf
- Change bind to 127.0.0.1
- Restart Redis and verify unauthenticated access is rejected
