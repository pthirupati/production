description: 'CONTEXT: A team operating security hardening needs you to resolve `Fix Insecure File Permissions`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where /opt/app/config.env is world-readable and not owned by
  appuser, exposing application secrets to any local user. A security audit flagged application secrets
  as world-readable: /opt/app/config.env (which holds credentials) is readable by every user, and its
  ownership is wrong. Secrets files must be owned by the service account and readable only by it (mode
  600). Restore correct ownership and permissions so the secrets are no longer exposed.


  OBJECTIVE: Confirm /opt/app/config.env is world-readable / wrongly owned; Set ownership to appuser;
  Set mode 600 so only the owner can read it, and verify. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm /opt/app/config.env is world-readable / wrongly owned
- Set ownership to appuser
- Set mode 600 so only the owner can read it, and verify
initial_state: Linux server where /opt/app/config.env is world-readable and not owned by appuser, exposing
  application secrets to any local user.
