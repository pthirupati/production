description: Service operations lab. The `sshd` systemd unit is **failed/inactive** on this host — a realistic
  fault for Security Practice workflows that depend on it. Diagnose with `systemctl status sshd` and journal
  logs, apply the smallest reliable fix, then verify with `systemctl is-active sshd`.
objectives:
- The `sshd` service is active (running)
- '`systemctl is-active sshd` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `sshd` service is not running (`systemctl is-active sshd` → inactive/failed). Dependent
  Security Practice tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — role/policy assignments.

    2. Write down what looks normal versus wrong or missing for identity and access.

    3. Recall the core idea: users, roles, and least privilege. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for identity and access.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — role/policy assignments.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — access follows least privilege.

    4. Click Check Solution once `systemctl is-active sshd` returns active.'
