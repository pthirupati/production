description: 'CONTEXT: A team operating security hardening needs you to resolve `Audit Log Cleared — Reconfigure
  auditd Immutable Mode` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with auditd. /var/log/audit/audit.log has a timestamp gap indicating

  clearing. No immutable flag in /etc/audit/rules.d/. max_log_file_action=rotate

  (logs can be overwritten). auditd running without immutable rules. An incident response investigation
  discovered that the auditd logs were cleared

  by a malicious actor who had temporary root access. Auditd was not configured in

  immutable mode, allowing the logs to be deleted. Reconfigure auditd to use

  immutable mode (so audit rules cannot be changed without a reboot), configure

  log rotation with keep-alive, and add rules to detect future log tampering.


  OBJECTIVE: Verify audit logs were cleared and identify the gap; Add immutable mode flag (-e 2) to audit
  rules; Configure auditd to monitor deletion of log files. Success means `systemctl is-active --quiet`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Verify audit logs were cleared and identify the gap
- Add immutable mode flag (-e 2) to audit rules
- Configure auditd to monitor deletion of log files
- Set max_log_file_action=keep_logs to prevent log rotation from discarding logs
- Restart auditd and confirm immutable mode is active
initial_state: 'Ubuntu 22.04 with auditd. /var/log/audit/audit.log has a timestamp gap indicating

  clearing. No immutable flag in /etc/audit/rules.d/. max_log_file_action=rotate

  (logs can be overwritten). auditd running without immutable rules.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
