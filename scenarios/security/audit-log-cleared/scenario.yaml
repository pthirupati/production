slug: audit-log-cleared
title: "Audit Log Cleared — Reconfigure auditd Immutable Mode"
technology: Security
category: Audit Logging
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: Critical
is_free: false
description: |
  An incident response investigation discovered that the auditd logs were cleared
  by a malicious actor who had temporary root access. Auditd was not configured in
  immutable mode, allowing the logs to be deleted. Reconfigure auditd to use
  immutable mode (so audit rules cannot be changed without a reboot), configure
  log rotation with keep-alive, and add rules to detect future log tampering.
objectives:
  - Verify audit logs were cleared and identify the gap
  - Add immutable mode flag (-e 2) to audit rules
  - Configure auditd to monitor deletion of log files
  - Set max_log_file_action=keep_logs to prevent log rotation from discarding logs
  - Restart auditd and confirm immutable mode is active
initial_state: |
  Ubuntu 22.04 with auditd. /var/log/audit/audit.log has a timestamp gap indicating
  clearing. No immutable flag in /etc/audit/rules.d/. max_log_file_action=rotate
  (logs can be overwritten). auditd running without immutable rules.
hints:
  - order: 1
    cost: 10
    content: "Check audit status: `auditctl -s` — look for 'enabled' and 'lock' fields."
  - order: 2
    cost: 20
    content: "Add to /etc/audit/rules.d/hardening.rules: `-a always,exit -F arch=b64 -S unlink,unlinkat -F dir=/var/log/audit -k log-tamper`"
  - order: 3
    cost: 20
    content: "Add immutable flag as LAST line: `-e 2` in /etc/audit/rules.d/99-immutable.rules"
  - order: 4
    cost: 15
    content: "In /etc/audit/auditd.conf: set `max_log_file_action = keep_logs`. Then `systemctl restart auditd`."
