description: 'CONTEXT: A team operating security hardening needs you to resolve `MySQL Root Accessible
  Remotely — Restrict to Localhost` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with MySQL 8.0. `SELECT user, host FROM mysql.user WHERE user=''root''`

  shows entries for root@''%'', root@localhost, root@127.0.0.1.

  Remote root login works. Root password is ''admin123''. The MySQL root user account has been granted
  access from any host (''%''),

  allowing remote root connections to the database server. Combined with a

  weak root password discovered in a leaked config file, this gives an attacker

  full control over all databases. Revoke the remote root grant, ensure root

  can only connect from localhost, and update the root password.


  OBJECTIVE: Connect to MySQL and check root user host grants; Revoke the root@''%'' grant; Ensure root
  exists only for localhost and 127.0.0.1. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Connect to MySQL and check root user host grants
- Revoke the root@'%' grant
- Ensure root exists only for localhost and 127.0.0.1
- Change the root password to a strong value
- Verify remote root login is rejected
initial_state: 'Ubuntu 22.04 with MySQL 8.0. `SELECT user, host FROM mysql.user WHERE user=''root''`

  shows entries for root@''%'', root@localhost, root@127.0.0.1.

  Remote root login works. Root password is ''admin123''.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
