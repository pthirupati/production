title: 'Security: Host Firewall — Build From Scratch'
slug: academy-security-012-build-firewall-2
technology: Security
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Service operations lab. The `firewalld` systemd unit is **failed/inactive** on this host
  — a realistic fault for Build From Scratch workflows that depend on it. Diagnose with `systemctl status
  firewalld` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active
  firewalld`.
objectives:
- The `firewalld` service is active (running)
- '`systemctl is-active firewalld` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `firewalld` service is not running (`systemctl is-active firewalld` → inactive/failed).
  Dependent Build From Scratch tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `firewall-cmd --list-all`, `iptables -S`, `ufw status`, or Windows
    firewall cmdlets.

    2. Write down what looks normal versus wrong or missing for host firewall.

    3. Recall the core idea: allow/deny rules, zones, services, and rule persistence. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for host firewall.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `firewall-cmd --list-all`, `iptables -S`, `ufw status`, or Windows
    firewall cmdlets.

    2. Create the smallest working slice of host firewall first, validate it, then add the remaining pieces
    one at a time.

    3. Verify the result — only the intended ports and sources are permitted.

    4. Click Check Solution once `systemctl is-active firewalld` returns active.'
