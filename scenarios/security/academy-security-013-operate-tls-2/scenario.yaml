description: 'CONTEXT: A team operating security hardening needs you to resolve `security: Tls Configuration
  — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The hardening lab is healthy enough for scheduled work on TLS configuration.
  Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine TLS
  configuration task safely in security. Follow change control — inspect, change, verify — while working
  with certificates, chains, ciphers, renewal, and mTLS.


  OBJECTIVE: Day-2 TLS configuration work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  sshd` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 TLS configuration work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The hardening lab is healthy enough for scheduled work on TLS configuration. Complete the
  maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `openssl s_client`, cert file paths, and ingress/listener config.

    2. Write down what looks normal versus wrong or missing for TLS configuration.

    3. Recall the core idea: certificates, chains, ciphers, renewal, and mTLS. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status sshd` — note Active/Failed and the last log lines.

    2. Read `journalctl -u sshd -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `openssl s_client`, cert file paths, and ingress/listener config.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — handshakes succeed with a trusted chain and modern ciphers.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
