description: 'CONTEXT: A team operating security hardening needs you to resolve `iptables Default Policy
  ACCEPT — Set to DROP` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. `iptables -L -n` shows policy ACCEPT on INPUT, FORWARD, OUTPUT.

  No services are blocked but there is also no protection from unsolicited traffic.

  The server is publicly accessible. A security hardening review found that the iptables INPUT, FORWARD,
  and OUTPUT

  chains all have their default policy set to ACCEPT. This means any traffic not

  matching a specific rule is permitted by default — the opposite of a secure

  default-deny posture. Change the default policy to DROP for INPUT and FORWARD,

  ensure all legitimate services have explicit ACCEPT rules, and verify the server

  remains accessible after applying the restrictive policy.


  OBJECTIVE: Identify the current default ACCEPT policies on INPUT/FORWARD; Add explicit ACCEPT rules
  for SSH (22), HTTP (80), HTTPS (443), and ICMP; Set default policy to DROP for INPUT and FORWARD chains.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the current default ACCEPT policies on INPUT/FORWARD
- Add explicit ACCEPT rules for SSH (22), HTTP (80), HTTPS (443), and ICMP
- Set default policy to DROP for INPUT and FORWARD chains
- Verify the server remains accessible and legitimate traffic flows
