description: 'CONTEXT: A team operating security hardening needs you to resolve `Log Tampering — Detect
  Deleted and Altered Log Entries` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server post-compromise. /var/log/auth.log has gaps between 02:00-03:00

  UTC. wtmp and btmp binary logs are intact. journald journal is also intact.

  The attacker had root access for approximately one hour overnight. During an incident response, evidence
  suggests an attacker gained root access

  and attempted to cover their tracks by deleting entries from /var/log/auth.log

  and modifying /var/log/syslog. Use last, wtmp, btmp, and filesystem metadata

  to reconstruct the attacker''s timeline and identify what evidence was removed

  from the logs.


  OBJECTIVE: Use `last` and `lastb` against /var/log/wtmp and /var/log/btmp to find login history the
  attacker could not erase; Compare auth.log timestamps to syslog and journalctl output to find gaps indicating
  deleted entries; Write a timeline of the attack to /tmp/incident-timeline.txt with at least 3 timestamped
  events. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
