title: "Rootkit Detection — Scan and Remove Hidden Malware"
slug: rootkit-detection
technology: Security
category: Forensics
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: Critical
is_free: false
description: |
  Anomalous network traffic has been observed from a server that was breached
  three weeks ago. The `ps` and `netstat` commands show no suspicious processes,
  but CPU usage is consistently high. Rootkit activity is suspected. Use rkhunter
  and chkrootkit to scan for rootkit artifacts, identify the hidden process, and
  remove the malicious files.
objectives:
  - Run rkhunter --check and chkrootkit and review their output for warnings and positives
  - Identify the hidden process or file by comparing /proc entries against ps output
  - Remove the malicious binary and any persistence mechanisms (crontab, systemd unit)
initial_state: |
  CentOS server post-compromise. rkhunter and chkrootkit are installed. CPU
  usage is at 90%. `ps aux` shows no high-CPU processes. A malicious binary is
  hidden at /lib/.x86_64/syslogd and has a cron persistence entry.
hints:
  - order: 1
    cost: 10
    content: "Run initial scan: `rkhunter --update && rkhunter --check --sk` then `chkrootkit 2>/dev/null` — look for INFECTED or Warning lines."
  - order: 2
    cost: 15
    content: "Find hidden processes: `for pid in /proc/[0-9]*; do pid=${pid##*/}; if ! ps -p $pid > /dev/null 2>&1; then echo \"Hidden PID: $pid\"; fi; done`"
  - order: 3
    cost: 20
    content: "Once you identify the hidden PID, find its binary: `ls -la /proc/<PID>/exe` to resolve the symlink to the malicious executable path."
  - order: 4
    cost: 25
    content: "Remove persistence: `kill -9 <PID>; rm -f /lib/.x86_64/syslogd; crontab -l | grep -v syslogd | crontab -; systemctl disable --now fake-syslog 2>/dev/null`"
