is_free: false
description: 'CONTEXT: A team operating security hardening needs you to resolve `Rootkit Detection — Scan
  and Remove Hidden Malware` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: CentOS server post-compromise. rkhunter and chkrootkit are installed. CPU

  usage is at 90%. `ps aux` shows no high-CPU processes. A malicious binary is

  hidden at /lib/.x86_64/syslogd and has a cron persistence entry. Anomalous network traffic has been
  observed from a server that was breached

  three weeks ago. The `ps` and `netstat` commands show no suspicious processes,

  but CPU usage is consistently high. Rootkit activity is suspected. Use rkhunter

  and chkrootkit to scan for rootkit artifacts, identify the hidden process, and

  remove the malicious files.


  OBJECTIVE: Run rkhunter --check and chkrootkit and review their output for warnings and positives; Identify
  the hidden process or file by comparing /proc entries against ps output; Remove the malicious binary
  and any persistence mechanisms (crontab, systemd unit). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Run rkhunter --check and chkrootkit and review their output for warnings and positives
- Identify the hidden process or file by comparing /proc entries against ps output
- Remove the malicious binary and any persistence mechanisms (crontab, systemd unit)
initial_state: 'CentOS server post-compromise. rkhunter and chkrootkit are installed. CPU

  usage is at 90%. `ps aux` shows no high-CPU processes. A malicious binary is

  hidden at /lib/.x86_64/syslogd and has a cron persistence entry.

  '
