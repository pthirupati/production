description: 'CONTEXT: A team operating security hardening needs you to resolve `SSH Brute Force — Fix
  fail2ban jail.conf to Block Attackers` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with fail2ban installed. /etc/fail2ban/jail.conf has [sshd] jail

  with enabled=false. /var/log/auth.log shows hundreds of failed password attempts.

  No IPs are being banned. fail2ban service is running but doing nothing for SSH. The server is receiving
  thousands of SSH brute force login attempts per hour.

  fail2ban is installed but not blocking the attackers. The SSH jail in jail.conf

  has the enabled flag set to false, and the logpath points to a non-existent

  file. Fix the fail2ban configuration to enable the SSH jail with a maxretry

  of 3 and a bantime of 1 hour, then verify it is actively banning attacking IPs.


  OBJECTIVE: Identify that the fail2ban SSH jail is disabled; Enable the sshd jail in /etc/fail2ban/jail.local;
  Set maxretry=3 and bantime=3600. Success means `systemctl is-active --quiet` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify that the fail2ban SSH jail is disabled
- Enable the sshd jail in /etc/fail2ban/jail.local
- Set maxretry=3 and bantime=3600
- Restart fail2ban and verify it bans repeated failed login IPs
initial_state: 'Ubuntu 22.04 with fail2ban installed. /etc/fail2ban/jail.conf has [sshd] jail

  with enabled=false. /var/log/auth.log shows hundreds of failed password attempts.

  No IPs are being banned. fail2ban service is running but doing nothing for SSH.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
