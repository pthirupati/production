title: 'Security ↔ Linux: SSH Fails the CIS Hardening Baseline'
slug: security-linux-ssh-cis-hardening
technology: security
category: Harden
difficulty: medium
description: 'CONTEXT: A team operating security hardening needs you to resolve `Security ↔ Linux: SSH
  Fails the CIS Hardening Baseline` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A bastion-01 Linux host. /etc/ssh/sshd_config.d/50-cis.conf exists but is
  a

  broken placeholder (PermitRootLogin yes, PasswordAuthentication yes, no strong

  Ciphers/MACs). The CIS SSH controls all fail. CROSS-TECHNOLOGY task (Security <-> Linux). A compliance
  scan flagged the SSH

  daemon on bastion-01 as failing the CIS benchmark: root login is permitted,

  password authentication is on, and weak MACs/Ciphers are negotiable. The audit

  team wrote a hardening drop-in at /etc/ssh/sshd_config.d/50-cis.conf, but it is

  a placeholder that still sets the INSECURE values. Apply the Linux-side SSH

  hardening so the host passes the security baseline without locking yourself out.


  OBJECTIVE: Confirm the SSH config fails the CIS controls (root login, password auth, weak crypto); Harden
  /etc/ssh/sshd_config.d/50-cis.conf (disable root login + password auth, restrict to strong Ciphers/MACs);
  Confirm the hardening drop-in is corrected so the baseline passes and sshd would reload cleanly. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'A bastion-01 Linux host. /etc/ssh/sshd_config.d/50-cis.conf exists but is a

