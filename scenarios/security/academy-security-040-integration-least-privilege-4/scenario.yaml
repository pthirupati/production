hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — current permissions vs need.

    2. Write down what looks normal versus wrong or missing for least privilege.

    3. Recall the core idea: minimal grants and scoped access. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for least privilege.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — current permissions vs need.

    2. Configure credentials and networking, then drive one happy-path transaction
    end to end across both systems.

    3. Verify the result — permissions are reduced to the minimum needed.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-security-040-integration-least-privilege-4.conf`,
    then click Check Solution.'
