description: 'CONTEXT: A team operating security hardening needs you to resolve `Buffer Overflow — Detect
  and Mitigate a Vulnerable Service` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server with the dataparser binary deployed and running as a systemd

  service. Source code is available at /opt/dataparser/main.c. checksec is

  installed. The service listens on 127.0.0.1:8888. A legacy C application `dataparser` running as a service
  on port 8888 has been

  flagged by a security audit as lacking stack canaries and NX-bit protection.

  The binary was compiled without -fstack-protector and with -z execstack. Your

  task is to confirm the vulnerability using checksec, examine the binary''s

  protections, and redeploy it with proper compiler hardening flags.


  OBJECTIVE: Use checksec to identify missing binary protections on /usr/local/bin/dataparser; Recompile
  the source at /opt/dataparser/main.c with -fstack-protector-strong, -D_FORTIFY_SOURCE=2, and -z noexecstack;
  Restart the dataparser service and confirm checksec now reports protections enabled. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Use checksec to identify missing binary protections on /usr/local/bin/dataparser
- Recompile the source at /opt/dataparser/main.c with -fstack-protector-strong, -D_FORTIFY_SOURCE=2, and
  -z noexecstack
- Restart the dataparser service and confirm checksec now reports protections enabled
