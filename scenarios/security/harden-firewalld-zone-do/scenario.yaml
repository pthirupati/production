description: 'CONTEXT: A team operating security hardening needs you to resolve `Harden Firewalld Zone`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux host with firewalld active. The interface zone assignment and allowed
  services aren''t yet hardened to a minimal public-zone configuration. Build/hardening task: place the
  server''s network interface into the firewalld public zone and open only the ports the service genuinely
  needs, removing anything unnecessary. The goal is a minimal, least-privilege firewall posture — the
  interface bound to the right zone, with an explicit, small allow-list, made persistent.


  OBJECTIVE: Assign the interface to the firewalld public zone; Open only the required ports/services
  and remove the rest; Make the configuration permanent and verify it. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Assign the interface to the firewalld public zone
- Open only the required ports/services and remove the rest
- Make the configuration permanent and verify it
initial_state: Linux host with firewalld active. The interface zone assignment and allowed services aren't
  yet hardened to a minimal public-zone configuration.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `firewall-cmd --state` and `firewall-cmd --list-all` for active zones.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which zone is active and which ports/services are allowed.

    2. Compare to the port the scenario expects (often 80/tcp or 443/tcp).

    3. Check if the service is bound but blocked externally.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. `firewall-cmd --permanent --add-service=http` (or the needed port).

    2. `firewall-cmd --reload`.

    3. Confirm `firewall-cmd --list-ports` includes the required port.


    WHY: a running service behind a closed firewall still fails health checks.'
