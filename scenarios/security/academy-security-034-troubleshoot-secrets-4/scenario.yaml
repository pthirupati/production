description: Service operations lab. The `auditd` systemd unit is **failed/inactive** on this host — a
  realistic fault for Troubleshooting Drill workflows that depend on it. Diagnose with `systemctl status
  auditd` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active auditd`.
objectives:
- The `auditd` service is active (running)
- '`systemctl is-active auditd` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `auditd` service is not running (`systemctl is-active auditd` → inactive/failed). Dependent
  Troubleshooting Drill tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `kubectl get secret`, volume mounts, and ServiceAccount permissions.

    2. Write down what looks normal versus wrong or missing for Secrets.

    3. Recall the core idea: secret types, mounting, RBAC access, and rotation. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Secrets.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `kubectl get secret`, volume mounts, and ServiceAccount permissions.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — only intended workloads can read the secret and apps authenticate successfully.

    4. Click Check Solution once `systemctl is-active auditd` returns active.'
