description: 'CONTEXT: A team operating security hardening needs you to resolve `security: Audit Logging
  — Production Readiness` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but audit logging is not production ready — missing
  guardrails, runbooks, or capacity checks. Production readiness for audit logging. Harden, document,
  and validate audit rules, retention, and review so the change is safe to run during a maintenance window.


  OBJECTIVE: Day-2 audit logging work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  auditd` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 audit logging work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but audit logging is not production ready — missing guardrails,
  runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status auditd` and `journalctl -u auditd -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status auditd` — note Active/Failed and the last log lines.

    2. Read `journalctl -u auditd -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart auditd` and confirm `systemctl is-active auditd` succeeds.


    WHY: the grader checks real service state, not marker files.'
