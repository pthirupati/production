title: 'Security: Audit Logging — Production Readiness'
slug: academy-security-075-production-audit-8
technology: Security
category: Production
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Service operations lab. The `auditd` systemd unit is **failed/inactive** on this host — a
  realistic fault for Production Readiness workflows that depend on it. Diagnose with `systemctl status
  auditd` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active auditd`.
objectives:
- The `auditd` service is active (running)
- '`systemctl is-active auditd` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `auditd` service is not running (`systemctl is-active auditd` → inactive/failed). Dependent
  Production Readiness tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — audit config and recent events.

    2. Write down what looks normal versus wrong or missing for audit logging.

    3. Recall the core idea: audit rules, retention, and review. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for audit logging.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — audit config and recent events.

    2. Apply production standards for audit logging: resource limits, monitoring, access controls, and
    a written rollback step.

    3. Verify the result — required actions are audited and retained.

    4. Click Check Solution once `systemctl is-active auditd` returns active.'
