description: 'CONTEXT: A team operating security hardening needs you to resolve `LDAP Anonymous Bind -
  Disable Unauthenticated Directory` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Debian server running OpenLDAP (slapd) with dc=lab,dc=local as the base DN.

  Anonymous binds are currently allowed by default. ldap-utils is installed.

  The LDAP admin DN is cn=admin,dc=lab,dc=local with password stored in /root/.ldaprc. An OpenLDAP server
  on the network is allowing anonymous binds, exposing the

  full directory tree including employee usernames, email addresses, and

  department information to any unauthenticated client. Confirm the anonymous

  bind vulnerability, disable it in the slapd configuration, and verify that

  unauthenticated queries are now rejected.


  OBJECTIVE: Confirm anonymous bind works by querying the LDAP server without credentials; {''Disable
  anonymous binds by setting olcDisallows'': ''bind_anon in the cn=config entry''}; Verify that anonymous
  ldapsearch now returns an error and requires authentication. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm anonymous bind works by querying the LDAP server without credentials
- Disable anonymous binds by setting olcDisallows: bind_anon in the cn=config entry
- Verify that anonymous ldapsearch now returns an error and requires authentication
initial_state: 'Debian server running OpenLDAP (slapd) with dc=lab,dc=local as the base DN.

