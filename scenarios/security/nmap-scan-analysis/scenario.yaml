description: 'CONTEXT: A team operating security hardening needs you to resolve `Nmap Scan Analysis -
  Interpret Results and Reduce Attack` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server with multiple services running: sshd (22), nginx (80/443),

  telnetd (23), vsftpd (21), rpcbind (111), and a test app on 8888. All are

  active systemd services. nmap is installed and available. A full nmap scan of the production server
  reveals 14 open ports, many of which

  are unexpected services left running from a test deployment: rpcbind (111),

  telnet (23), FTP (21), and an unknown service on port 8888. Your task is to

  analyze the nmap output, identify the unnecessary services, disable them with

  systemctl, and produce a report of what was found and removed.


  OBJECTIVE: Run a full nmap TCP scan against localhost and save the output to /tmp/nmap-full.txt; Identify
  all non-essential listening services and stop and disable them with systemctl; Write a summary of removed
  services and remaining open ports to /tmp/scan-report.txt. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Run a full nmap TCP scan against localhost and save the output to /tmp/nmap-full.txt
- Identify all non-essential listening services and stop and disable them with systemctl
- Write a summary of removed services and remaining open ports to /tmp/scan-report.txt
