slug: suid-bit-unauthorized
title: "Unauthorized SUID Bit on Python — Remove it"
technology: Security
category: Privilege Escalation
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: Critical
is_free: false
description: |
  A critical security finding: the SUID bit is set on /usr/bin/python3, which
  means any user on the system can execute Python scripts as root. This is a
  common misconfiguration that allows trivial privilege escalation — any user
  can run `python3 -c 'import os; os.system("/bin/bash")'` and get a root shell.
  Remove the SUID bit immediately and audit other binaries for similar issues.
objectives:
  - Identify the SUID bit on /usr/bin/python3
  - Remove the SUID bit using chmod
  - Audit all SUID binaries on the system for other anomalies
  - Verify python3 can no longer be used for privilege escalation
initial_state: |
  Ubuntu 22.04. `ls -la /usr/bin/python3` shows -rwsr-xr-x (SUID set).
  Any user can escalate to root: `python3 -c 'import os; os.setuid(0); os.system("/bin/bash")'`
  Authorized SUID binaries are: ping, sudo, passwd, su — python3 is not expected.
hints:
  - order: 1
    cost: 10
    content: "Verify SUID: `ls -la /usr/bin/python3` — the 's' in owner execute position indicates SUID."
  - order: 2
    cost: 10
    content: "Remove SUID: `chmod u-s /usr/bin/python3`"
  - order: 3
    cost: 15
    content: "Audit all SUID binaries: `find / -perm -4000 -type f 2>/dev/null | sort` — compare against expected list."
  - order: 4
    cost: 10
    content: "Verify: `ls -la /usr/bin/python3` should show -rwxr-xr-x (no 's')."
