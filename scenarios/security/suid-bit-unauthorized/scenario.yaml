description: 'CONTEXT: A team operating security hardening needs you to resolve `Unauthorized SUID Bit
  on Python — Remove it` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. `ls -la /usr/bin/python3` shows -rwsr-xr-x (SUID set).

  Any user can escalate to root: `python3 -c ''import os; os.setuid(0); os.system("/bin/bash")''`

  Authorized SUID binaries are: ping, sudo, passwd, su — python3 is not expected. A critical security
  finding: the SUID bit is set on /usr/bin/python3, which

  means any user on the system can execute Python scripts as root. This is a

  common misconfiguration that allows trivial privilege escalation — any user

  can run `python3 -c ''import os; os.system("/bin/bash")''` and get a root shell.

  Remove the SUID bit immediately and audit other binaries for similar issues.


  OBJECTIVE: Identify the SUID bit on /usr/bin/python3; Remove the SUID bit using chmod; Audit all SUID
  binaries on the system for other anomalies. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the SUID bit on /usr/bin/python3
- Remove the SUID bit using chmod
- Audit all SUID binaries on the system for other anomalies
- Verify python3 can no longer be used for privilege escalation
