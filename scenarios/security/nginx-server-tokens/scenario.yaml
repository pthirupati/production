description: 'CONTEXT: A team operating security hardening needs you to resolve `nginx Revealing Version
  — Disable server_tokens` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with nginx 1.18.0. `curl -I http://localhost/` shows:

  `Server: nginx/1.18.0`. 404 error pages display "nginx/1.18.0" in the footer.

  server_tokens is set to ''on'' (the default). nginx is exposing its version number in HTTP response
  headers and in error pages.

  This information disclosure makes targeted attacks easier — an attacker who knows

  the exact nginx version can look up specific CVEs. The Server header currently

  reads "nginx/1.18.0" and error pages include the full version string. Disable

  server_tokens to hide the version information.


  OBJECTIVE: Verify nginx is exposing version in Server header; Disable server_tokens in nginx.conf; Reload
  nginx and verify the Server header no longer shows the version. Success means `systemctl is-active --quiet`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Verify nginx is exposing version in Server header
- Disable server_tokens in nginx.conf
- Reload nginx and verify the Server header no longer shows the version
- Verify error pages also no longer show the version
