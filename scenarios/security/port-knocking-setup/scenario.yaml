description: 'CONTEXT: A team operating security hardening has raised a ticket for `Port Knocking Setup
  — Hide SSH Behind a Knock Sequence`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab. The architecture is a single lab-primary
  node exposing SSH, firewall, TLS, audit logs, and IAM settings; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server with SSH on port 22. knockd is installed but not configured.

  iptables currently allows all traffic. The server has a single network interface

  (eth0). The knockd configuration file is at /etc/knockd.conf.


  OBJECTIVE: Install and configure knockd with the sequence 7000:tcp, 8000:tcp, 9000:tcp to open port
  22 for 10 seconds; Set iptables to block port 22 by default and configure knockd to add and remove the
  ACCEPT rule on knock; Test that port 22 is closed before knocking and opens after the correct sequence
  is sent. Acceptance criteria: the change is minimal and reversible, and success means `check.sh` exits
  successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SSH, firewall, TLS, audit logs, and IAM settings), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
