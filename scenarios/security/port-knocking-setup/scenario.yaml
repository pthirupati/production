description: 'CONTEXT: A team operating security hardening needs you to resolve `Port Knocking Setup —
  Hide SSH Behind a Knock Sequence` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server with SSH on port 22. knockd is installed but not configured.

  iptables currently allows all traffic. The server has a single network interface

  (eth0). The knockd configuration file is at /etc/knockd.conf. To reduce SSH exposure on an internet-facing
  server, you have been asked to

  implement port knocking using knockd. SSH port 22 will be blocked by default

  and only opened temporarily after a client sends TCP packets to ports 7000,

  8000, and 9000 in sequence. Configure knockd with the correct sequence and

  verify that the port is inaccessible without knocking.


  OBJECTIVE: Install and configure knockd with the sequence 7000:tcp, 8000:tcp, 9000:tcp to open port
  22 for 10 seconds; Set iptables to block port 22 by default and configure knockd to add and remove the
  ACCEPT rule on knock; Test that port 22 is closed before knocking and opens after the correct sequence
  is sent. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Install and configure knockd with the sequence 7000:tcp, 8000:tcp, 9000:tcp to open port 22 for 10 seconds
- Set iptables to block port 22 by default and configure knockd to add and remove the ACCEPT rule on knock
- Test that port 22 is closed before knocking and opens after the correct sequence is sent
initial_state: 'Ubuntu server with SSH on port 22. knockd is installed but not configured.

  iptables currently allows all traffic. The server has a single network interface

  (eth0). The knockd configuration file is at /etc/knockd.conf.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
