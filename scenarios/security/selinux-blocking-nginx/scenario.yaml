description: 'CONTEXT: A team operating security hardening has raised a ticket for `SELinux Blocking Nginx
  — Fix the Security Context`. A customer-facing workflow is degraded and the on-call engineer (you) must
  diagnose and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline hardening lab. The architecture is a single lab-primary
  node exposing SSH, firewall, TLS, audit logs, and IAM settings; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: RHEL/CentOS 8 with SELinux enforcing. nginx configured to serve from /srv/www.

  Directory /srv/www has context default_t. nginx returns 403 for all requests.

  AVC denials appear in audit.log for comm="nginx" path="/srv/www".

  OBJECTIVE: Identify SELinux AVC denials in /var/log/audit/audit.log; Check the file context on /srv/www;
  Apply the correct httpd_sys_content_t context recursively. Acceptance criteria: the change is minimal
  and reversible, and success means `check.sh` exits successfully.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SSH, firewall, TLS, audit logs, and IAM settings), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.

  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify SELinux AVC denials in /var/log/audit/audit.log
- Check the file context on /srv/www
- Apply the correct httpd_sys_content_t context recursively
- Verify nginx can serve files from /srv/www
