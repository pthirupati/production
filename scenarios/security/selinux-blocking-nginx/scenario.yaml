description: 'CONTEXT: A team operating security hardening needs you to resolve `SELinux Blocking Nginx
  — Fix the Security Context` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: RHEL/CentOS 8 with SELinux enforcing. nginx configured to serve from /srv/www.

  Directory /srv/www has context default_t. nginx returns 403 for all requests.

  AVC denials appear in audit.log for comm="nginx" path="/srv/www". After deploying nginx to serve files
  from a custom directory /srv/www, nginx

  starts but returns 403 Forbidden for all requests. SELinux audit logs show

  AVC denials for nginx trying to read files. The issue is that /srv/www has the

  wrong SELinux file context — it needs the httpd_sys_content_t type instead of

  the default_t currently assigned. Fix the SELinux context to allow nginx to

  serve the files.


  OBJECTIVE: Identify SELinux AVC denials in /var/log/audit/audit.log; Check the file context on /srv/www;
  Apply the correct httpd_sys_content_t context recursively. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify SELinux AVC denials in /var/log/audit/audit.log
- Check the file context on /srv/www
- Apply the correct httpd_sys_content_t context recursively
- Verify nginx can serve files from /srv/www
initial_state: 'RHEL/CentOS 8 with SELinux enforcing. nginx configured to serve from /srv/www.

  Directory /srv/www has context default_t. nginx returns 403 for all requests.

  AVC denials appear in audit.log for comm="nginx" path="/srv/www".

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ausearch -m avc -ts recent` or `grep AVC /var/log/audit/audit.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which binary/path SELinux denied.

    2. Run `ls -Z` on the affected file and compare context.

    3. Check if a boolean needs toggling: `getsebool -a | grep <service>`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the correct context with `semanage fcontext` + `restorecon`, or set the boolean.

    2. Retry the failing command.

    3. Confirm no new AVC denials and the service works.


    WHY: permissive fixes hide denials; targeted policy fixes last.'
