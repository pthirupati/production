hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: SELinux blocking nginx — fix the security context
    is not behaving as the scenario objectives require. This lab is about SELinux blocking nginx — fix
    the security context — how SELinux blocking nginx — fix the security context behaves in a security
    hardening environment. Read the objectives and the current state, and note precisely what looks wrong
    versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For SELinux blocking nginx — fix the security context problems the
    reliable method is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the
    one component that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying
    misconfiguration you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `ausearch -m avc -ts recent` or `grep AVC /var/log/audit/audit.log`.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Identify which binary/path SELinux denied.

    2. Run `ls -Z` on the affected file and compare context.

    3. Check if a boolean needs toggling: `getsebool -a | grep <service>`.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the correct context with `semanage fcontext` + `restorecon`, or set the boolean.

    2. Retry the failing command.

    3. Confirm no new AVC denials and the service works.

    WHY: permissive fixes hide denials; targeted policy fixes last.'
