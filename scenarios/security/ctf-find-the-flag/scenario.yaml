title: CTF — Find the Hidden Flag
slug: ctf-find-the-flag
technology: Security
category: CTF
difficulty: medium
scenario_type: hack
time_limit: 900
max_score: 100
infrastructure_type: docker
lab_mode: docker
jira_priority: Medium
is_free: true
description: 'Capture-the-flag challenge: a flag of the form FIXITLAB{...} is hidden somewhere on the
  filesystem. Use practical Linux forensics — searching by name and content, inspecting hidden directories
  and dotfiles, and checking common stash locations — to locate the flag and submit it for validation.'
objectives:
- Search the filesystem by filename and by content for the flag
- Inspect hidden directories/dotfiles and common stash locations
- Locate the FIXITLAB{...} flag and submit it
initial_state: Linux system with a hidden flag string FIXITLAB{...} placed somewhere on disk (often in
  a hidden directory or dotfile). Find it using standard search/forensics tools.
hints:
- order: 1
  cost: 10
  content: 'Start broad: `find / -iname ''*flag*'' 2>/dev/null` and search contents `grep -rIl ''FIXITLAB{''
    / 2>/dev/null`. Don''t forget dotfiles in home directories (`ls -la ~`).'
- order: 2
  cost: 15
  content: 'Check common hiding spots, e.g. hidden dirs under /var: look in `/var/backups/.secret/` for
    a file like hint.txt that points to the flag.'
- order: 3
  cost: 20
  content: Once you find the file, read it (`cat <file>`) and copy the exact `FIXITLAB{...}` string (including
    braces) to submit for validation.
