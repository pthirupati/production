description: 'CONTEXT: A team operating security hardening has raised a ticket for `CTF — Find the Hidden
  Flag`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline hardening lab. The architecture is a single lab-primary
  node exposing SSH, firewall, TLS, audit logs, and IAM settings; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: Linux system with a hidden flag string FIXITLAB{...} placed somewhere on disk
  (often in a hidden directory or dotfile). Find it using standard search/forensics tools.

  OBJECTIVE: Search the filesystem by filename and by content for the flag; Inspect hidden directories/dotfiles
  and common stash locations; Locate the FIXITLAB{...} flag and submit it. Acceptance criteria: the change
  is minimal and reversible, and success means `check.sh` exits successfully.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SSH, firewall, TLS, audit logs, and IAM settings), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.

  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Search the filesystem by filename and by content for the flag
- Inspect hidden directories/dotfiles and common stash locations
- Locate the FIXITLAB{...} flag and submit it
initial_state: Linux system with a hidden flag string FIXITLAB{...} placed somewhere on disk (often in
