description: 'CONTEXT: A team operating security hardening needs you to resolve `CTF — Find the Hidden
  Flag` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux system with a hidden flag string FIXITLAB{...} placed somewhere on disk
  (often in a hidden directory or dotfile). Find it using standard search/forensics tools. Capture-the-flag
  challenge: a flag of the form FIXITLAB{...} is hidden somewhere on the filesystem. Use practical Linux
  forensics — searching by name and content, inspecting hidden directories and dotfiles, and checking
  common stash locations — to locate the flag and submit it for validation.


  OBJECTIVE: Search the filesystem by filename and by content for the flag; Inspect hidden directories/dotfiles
  and common stash locations; Locate the FIXITLAB{...} flag and submit it. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Search the filesystem by filename and by content for the flag
- Inspect hidden directories/dotfiles and common stash locations
- Locate the FIXITLAB{...} flag and submit it
initial_state: Linux system with a hidden flag string FIXITLAB{...} placed somewhere on disk (often in
  a hidden directory or dotfile). Find it using standard search/forensics tools.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
