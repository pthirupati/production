description: 'CONTEXT: A team operating security hardening needs you to resolve `Snort IDS Alert - Investigate
  and Tune Intrusion Detection` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server running Snort 2.9 in IDS mode on interface eth0. Alert log is

  at /var/log/snort/alert. A pcap capture of the suspicious traffic is at

  /opt/evidence/suspicious.pcap. snort is configured with /etc/snort/snort.conf. Snort is generating a
  flood of alerts for rule SID 1000001 which detects

  potential SQL injection attempts. Review the pcap evidence and Snort alert log

  to determine if these are true positive attacks or false positives from a

  legitimate web application scanner. Write a new Snort rule to more precisely

  detect the real attack pattern while suppressing the scanner noise.


  OBJECTIVE: Review /var/log/snort/alert to identify the pattern of SID 1000001 alerts; Analyze the source
  IPs and payloads to distinguish scanner traffic from real attacks; Write a refined Snort rule to /etc/snort/rules/local.rules
  that targets only the malicious pattern. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Review /var/log/snort/alert to identify the pattern of SID 1000001 alerts
- Analyze the source IPs and payloads to distinguish scanner traffic from real attacks
- Write a refined Snort rule to /etc/snort/rules/local.rules that targets only the malicious pattern
