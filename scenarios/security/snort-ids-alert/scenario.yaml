title: "Snort IDS Alert — Investigate and Tune Intrusion Detection Rules"
slug: snort-ids-alert
technology: Security
category: Intrusion Detection
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: High
is_free: false
description: |
  Snort is generating a flood of alerts for rule SID 1000001 which detects
  potential SQL injection attempts. Review the pcap evidence and Snort alert log
  to determine if these are true positive attacks or false positives from a
  legitimate web application scanner. Write a new Snort rule to more precisely
  detect the real attack pattern while suppressing the scanner noise.
objectives:
  - Review /var/log/snort/alert to identify the pattern of SID 1000001 alerts
  - Analyze the source IPs and payloads to distinguish scanner traffic from real attacks
  - Write a refined Snort rule to /etc/snort/rules/local.rules that targets only the malicious pattern
initial_state: |
  Ubuntu server running Snort 2.9 in IDS mode on interface eth0. Alert log is
  at /var/log/snort/alert. A pcap capture of the suspicious traffic is at
  /opt/evidence/suspicious.pcap. snort is configured with /etc/snort/snort.conf.
hints:
  - order: 1
    cost: 10
    content: "Review alerts: `tail -100 /var/log/snort/alert` and look for source IPs. Use `sort -u` to identify unique sources and `uniq -c` to count frequency."
  - order: 2
    cost: 15
    content: 'Inspect the pcap: `tcpdump -r /opt/evidence/suspicious.pcap -A | grep -i ''union\|select\|insert\|drop table''` to see the actual SQL injection payloads.'
  - order: 3
    cost: 20
    content: "Write a more specific rule in /etc/snort/rules/local.rules: `alert tcp any any -> $HTTP_SERVERS 80 (msg:\"SQL Injection UNION SELECT\"; content:\"UNION SELECT\"; nocase; sid:1000002; rev:1;)`"
  - order: 4
    cost: 25
    content: "Test the rule: `snort -T -c /etc/snort/snort.conf` to validate syntax, then reload: `systemctl reload snort` and verify it matches the pcap: `snort -r /opt/evidence/suspicious.pcap -c /etc/snort/snort.conf -A console`."
