description: 'CONTEXT: A team operating security hardening needs you to resolve `Sudo Misconfiguration
  — Fix Dangerous sudoers Entries` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server where /etc/sudoers contains: `deploy-svc ALL=(ALL) NOPASSWD:
  ALL`,

  `%developers ALL=(ALL) NOPASSWD: ALL`, and an uncommented `Defaults env_reset`

  override that bypasses NOEXEC. The ops group needs sudo access to all commands

  with password. A security audit of /etc/sudoers has found three dangerous misconfigurations:

  a wildcard rule allowing a service account to run ALL commands, a NOPASSWD

  entry for a shared developer account, and a deprecated NOEXEC bypass that

  was commented out incorrectly and is still active. Fix all three issues using

  visudo without breaking legitimate sudo access for the ops team.


  OBJECTIVE: Identify the three dangerous sudoers entries using visudo or sudoers syntax analysis; Restrict
  the service account (deploy-svc) to only /usr/bin/systemctl restart webapp; Remove the NOPASSWD flag
  from the shared dev account and fix the NOEXEC bypass. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the three dangerous sudoers entries using visudo or sudoers syntax analysis
- Restrict the service account (deploy-svc) to only /usr/bin/systemctl restart webapp
- Remove the NOPASSWD flag from the shared dev account and fix the NOEXEC bypass
