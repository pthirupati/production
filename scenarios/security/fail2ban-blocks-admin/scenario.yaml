title: fail2ban Blocks Admin SSH
slug: security-fail2ban-blocks-admin
category: Harden
difficulty: medium
description: 'CONTEXT: A team operating security hardening needs you to resolve `fail2ban Blocks Admin
  SSH` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Linux server where fail2ban''s sshd jail has banned the administrator''s IP,
  blocking legitimate SSH; the admin subnet is not in the ignore list. After a burst of failed logins
  from the admin''s own network, fail2ban banned the admin''s IP and now legitimate SSH from that subnet
  is blocked. The immediate need is to unban the admin IP and then whitelist the admin subnet (ignoreip)
  so this doesn''t recur, while keeping protection against real attackers.


  OBJECTIVE: Confirm the admin IP is banned in the sshd jail; Unban the admin IP to restore access; Whitelist
  the admin subnet (ignoreip) so it isn''t banned again. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
