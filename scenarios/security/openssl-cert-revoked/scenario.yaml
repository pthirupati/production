description: 'CONTEXT: A team operating security hardening needs you to resolve `Certificate Revoked -
  Update CRL and Reconfigure` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with nginx. ssl_crl=/etc/nginx/ssl/ca.crl (outdated, 30 days
  old).

  New CRL available at http://ca.internal/crl/latest.crl.

  A test with a revoked certificate returns 200 instead of 400/403 — not being checked. The internal CA
  has revoked a service certificate after a private key compromise.

  Services that perform CRL checking are now rejecting connections from this service.

  However, the CRL configured in nginx is outdated — it was last downloaded 30 days

  ago and doesn''t include the revocation. Update the CRL, configure nginx to use

  the fresh CRL, and ensure CRL checking is properly enforced for client certificates.


  OBJECTIVE: Download the current CRL from the internal CA; Convert the CRL to PEM format if necessary;
  Update the ssl_crl directive in nginx to point to the new CRL. Success means `systemctl is-active --quiet`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Download the current CRL from the internal CA
- Convert the CRL to PEM format if necessary
- Update the ssl_crl directive in nginx to point to the new CRL
- Reload nginx and verify revoked certificates are rejected
initial_state: 'Ubuntu 22.04 with nginx. ssl_crl=/etc/nginx/ssl/ca.crl (outdated, 30 days old).

  New CRL available at http://ca.internal/crl/latest.crl.

  A test with a revoked certificate returns 200 instead of 400/403 — not being checked.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
