description: 'CONTEXT: A team operating security hardening has raised a ticket for `PAM Authentication
  Broken — Fix Misconfigured Login Stack`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab. The architecture is a single lab-primary
  node exposing SSH, firewall, TLS, audit logs, and IAM settings; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server where a previous admin added a broken pam_google_authenticator

  line as ''required'' in /etc/pam.d/sshd without the module being installed.

  Console access via the lab terminal is available. sshd is running on port 22.


  OBJECTIVE: Identify the misconfiguration in /etc/pam.d/sshd causing authentication failures; Fix the
  PAM stack so that SSH password authentication works correctly; Verify that SSH login succeeds with valid
  credentials and fails with invalid ones. Acceptance criteria: the change is minimal and reversible,
  and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SSH, firewall, TLS, audit logs, and IAM settings), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the misconfiguration in /etc/pam.d/sshd causing authentication failures
- Fix the PAM stack so that SSH password authentication works correctly
- Verify that SSH login succeeds with valid credentials and fails with invalid ones
