description: 'CONTEXT: A team operating security hardening needs you to resolve `PAM Authentication Broken
  — Fix Misconfigured Login Stack` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server where a previous admin added a broken pam_google_authenticator

  line as ''required'' in /etc/pam.d/sshd without the module being installed.

  Console access via the lab terminal is available. sshd is running on port 22. After a failed attempt
  to configure two-factor authentication, the PAM

  configuration for SSH logins has been left in a broken state. All SSH

  password authentication attempts now fail with ''Permission denied'' even with

  the correct credentials. Console access still works. You must diagnose the

  PAM stack misconfiguration in /etc/pam.d/sshd and restore working SSH

  authentication without disabling security controls.


  OBJECTIVE: Identify the misconfiguration in /etc/pam.d/sshd causing authentication failures; Fix the
  PAM stack so that SSH password authentication works correctly; Verify that SSH login succeeds with valid
  credentials and fails with invalid ones. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the misconfiguration in /etc/pam.d/sshd causing authentication failures
- Fix the PAM stack so that SSH password authentication works correctly
- Verify that SSH login succeeds with valid credentials and fails with invalid ones
initial_state: 'Ubuntu server where a previous admin added a broken pam_google_authenticator

  line as ''required'' in /etc/pam.d/sshd without the module being installed.

  Console access via the lab terminal is available. sshd is running on port 22.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
