description: 'CONTEXT: A team operating security hardening needs you to resolve `World-Writable Files
  in /etc — Fix Permissions` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. Multiple files in /etc are world-writable (mode 777 or o+w).

  At minimum: /etc/cron.d/app (777), /etc/logrotate.d/myapp (666).

  `find /etc -perm -o+w` returns several results. A security scan flagged several world-writable files
  in /etc, including critical

  configuration files like /etc/cron.d/app and /etc/logrotate.d/myapp. World-writable

  files in /etc allow any local user to modify system configurations, potentially

  leading to privilege escalation or service disruption. Find all world-writable

  files in /etc and remove the write permission for others.


  OBJECTIVE: Find all world-writable files in /etc using find; Remove the world-writable bit from each
  identified file; Verify no world-writable files remain in /etc. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Find all world-writable files in /etc using find
- Remove the world-writable bit from each identified file
- Verify no world-writable files remain in /etc
- Identify which process likely caused the misconfiguration
