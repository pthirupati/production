slug: ssh-root-login-enabled
title: "SSH Root Login Enabled — Disable PermitRootLogin"
technology: Security
category: SSH Hardening
difficulty: easy
time_limit: 600
max_score: 100
infrastructure_type: docker
jira_priority: High
is_free: true
description: |
  A security baseline scan flagged that SSH direct root login is enabled on this
  server. Allowing root to log in directly via SSH bypasses the audit trail
  (no sudo logging of root actions), makes brute force attacks more impactful,
  and violates principle of least privilege. Disable direct root SSH login and
  ensure admins must SSH as their own user and then use sudo.
objectives:
  - Verify that PermitRootLogin is set to 'yes' in sshd_config
  - Change PermitRootLogin to 'no' or 'prohibit-password'
  - Reload sshd without dropping existing connections
  - Verify root cannot SSH in directly
initial_state: |
  Ubuntu 22.04. /etc/ssh/sshd_config has `PermitRootLogin yes`.
  Root can SSH directly: `ssh root@server`. An admin user exists with sudo rights.
hints:
  - order: 1
    cost: 10
    content: "Check current setting: `grep PermitRootLogin /etc/ssh/sshd_config`"
  - order: 2
    cost: 10
    content: "Edit /etc/ssh/sshd_config — change `PermitRootLogin yes` to `PermitRootLogin no`"
  - order: 3
    cost: 10
    content: "Check syntax: `sshd -t` (exits 0 if valid)"
  - order: 4
    cost: 10
    content: "Reload without dropping sessions: `systemctl reload sshd` (not restart)"
