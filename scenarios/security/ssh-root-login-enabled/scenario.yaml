description: 'CONTEXT: A team operating security hardening needs you to resolve `SSH Root Login Enabled
  — Disable PermitRootLogin` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. /etc/ssh/sshd_config has `PermitRootLogin yes`.

  Root can SSH directly: `ssh root@server`. An admin user exists with sudo rights. A security baseline
  scan flagged that SSH direct root login is enabled on this

  server. Allowing root to log in directly via SSH bypasses the audit trail

  (no sudo logging of root actions), makes brute force attacks more impactful,

  and violates principle of least privilege. Disable direct root SSH login and

  ensure admins must SSH as their own user and then use sudo.


  OBJECTIVE: Verify that PermitRootLogin is set to ''yes'' in sshd_config; Change PermitRootLogin to ''no''
  or ''prohibit-password''; Reload sshd without dropping existing connections. Success means `systemctl
  is-active --quiet` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Verify that PermitRootLogin is set to 'yes' in sshd_config
- Change PermitRootLogin to 'no' or 'prohibit-password'
- Reload sshd without dropping existing connections
- Verify root cannot SSH in directly
initial_state: 'Ubuntu 22.04. /etc/ssh/sshd_config has `PermitRootLogin yes`.

  Root can SSH directly: `ssh root@server`. An admin user exists with sudo rights.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
