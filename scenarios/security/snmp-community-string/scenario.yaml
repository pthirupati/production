description: 'CONTEXT: A team operating security hardening needs you to resolve `SNMP Public Community
  String — Change to Secure Value` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with snmpd. /etc/snmp/snmpd.conf has `rocommunity public default`.

  SNMP accessible from any host. `snmpwalk -c public -v2c localhost` dumps full MIB. The SNMP daemon is
  configured with the default community string ''public'', which

  allows any host on the network to query the full SNMP MIB — including sensitive

  system information like running processes, network interfaces, and routing tables.

  Additionally, the SNMP service is listening on all interfaces including the public

  one. Change the community string to a secure value and restrict access to the

  management network only.


  OBJECTIVE: Identify the ''public'' community string in snmpd.conf; Change the community string to a
  strong random value; Restrict SNMP access to the management network (192.168.10.0/24). Success means
  `systemctl is-active --quiet` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the 'public' community string in snmpd.conf
- Change the community string to a strong random value
- Restrict SNMP access to the management network (192.168.10.0/24)
- Restart snmpd and verify 'public' no longer works
initial_state: 'Ubuntu 22.04 with snmpd. /etc/snmp/snmpd.conf has `rocommunity public default`.

  SNMP accessible from any host. `snmpwalk -c public -v2c localhost` dumps full MIB.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
