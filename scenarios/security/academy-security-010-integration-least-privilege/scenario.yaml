title: 'Security: Least Privilege — Integration Lab'
slug: academy-security-010-integration-least-privilege
technology: Security
category: Cross-Technology
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Service operations lab. The `sshd` systemd unit is **failed/inactive** on this host — a realistic
  fault for Integration Lab workflows that depend on it. Diagnose with `systemctl status sshd` and journal
  logs, apply the smallest reliable fix, then verify with `systemctl is-active sshd`.
objectives:
- The `sshd` service is active (running)
- '`systemctl is-active sshd` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `sshd` service is not running (`systemctl is-active sshd` → inactive/failed). Dependent
  Integration Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — current permissions vs need.

    2. Write down what looks normal versus wrong or missing for least privilege.

    3. Recall the core idea: minimal grants and scoped access. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for least privilege.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — current permissions vs need.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — permissions are reduced to the minimum needed.

    4. Click Check Solution once `systemctl is-active sshd` returns active.'
cross_technology: true
