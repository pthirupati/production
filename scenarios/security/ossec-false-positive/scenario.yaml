description: 'CONTEXT: A team operating security hardening needs you to resolve `OSSEC False Positive
  — Tune Rules to Reduce Alert Noise` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: CentOS server running OSSEC 3.6 with file integrity monitoring enabled. The

  deployment script /usr/local/bin/svc-discovery.sh runs every 15 minutes and

  legitimately modifies /etc/hosts. OSSEC is generating rule 550 alerts for this. The OSSEC HIDS installation
  is generating hundreds of level-10 alerts per day

  for a known-good deployment script that runs every 15 minutes via cron. The

  script legitimately modifies /etc/hosts and /etc/resolv.conf as part of

  service discovery. Create a local rule to suppress these specific false

  positives while keeping all other file integrity alerts active.


  OBJECTIVE: Identify the specific OSSEC rule IDs generating the false positive alerts in /var/ossec/logs/alerts/alerts.log;
  Create a local rule override in /var/ossec/rules/local_rules.xml to suppress the false positive; Restart
  OSSEC and verify that the false positive alerts no longer appear while other alerts still fire. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the specific OSSEC rule IDs generating the false positive alerts in /var/ossec/logs/alerts/alerts.log
- Create a local rule override in /var/ossec/rules/local_rules.xml to suppress the false positive
- Restart OSSEC and verify that the false positive alerts no longer appear while other alerts still fire
initial_state: 'CentOS server running OSSEC 3.6 with file integrity monitoring enabled. The

  deployment script /usr/local/bin/svc-discovery.sh runs every 15 minutes and

  legitimately modifies /etc/hosts. OSSEC is generating rule 550 alerts for this.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `cat /etc/resolv.conf` and test with `dig example.com` or `getent hosts
    example.com`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Note the configured nameserver IP in resolv.conf.

    2. `ping` or `nc -zv` the nameserver — is it reachable?

    3. Check if NetworkManager or systemd-resolved overwrites the file.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Restart OSSEC and verify that the false positive alerts no longer appear while other alerts still
    fire.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
