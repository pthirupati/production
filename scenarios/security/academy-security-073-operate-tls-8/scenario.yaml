description: Topic lab for Operate Lab. The Lab Server has a planted configuration fault under `/opt`
  (and/or `/etc`). Diagnose from evidence, apply the smallest reliable fix, then verify with the documented
  checker (`grep -q FIXED-OK /opt/fixitlab/academy/academy-security-073-operate-tls-8.conf` succeeds after
  the documented fix).
objectives:
- Identify the planted configuration fault from evidence
- Apply the minimal documented remediation
- '`grep -q FIXED-OK /opt/fixitlab/academy/academy-security-073-operate-tls-8.conf` succeeds after the
  documented fix'
initial_state: A topic-specific configuration fault is present on this host; dependent workflows fail
  until repaired.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: clients see certificate errors or weak cipher
    negotiation. This lab is about TLS configuration — certificates, chains, ciphers, renewal, and mTLS.
    Read the objectives and the current state, and note precisely what looks wrong versus healthy before
    you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For TLS configuration problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status sshd and `journalctl -u sshd -n 50 --no-pager` before changing anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status sshd` — note Active/Failed and the last log lines.

    2. Read `journalctl -u sshd -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart sshd` and confirm `systemctl is-active sshd` succeeds.


    WHY: the grader checks real service state, not marker files.'
