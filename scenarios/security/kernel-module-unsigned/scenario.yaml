slug: kernel-module-unsigned
title: "Unsigned Kernel Module Loaded — Identify and Remove It"
technology: Security
category: Kernel Security
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: Critical
is_free: false
description: |
  Security monitoring detected that an unsigned kernel module was loaded outside
  of the normal software management process. This is a strong indicator of a
  rootkit or kernel-level persistence mechanism. The module is named 'hidepid'
  (obscuring its true purpose) and was loaded from /tmp. Identify the module,
  unload it, remove the file, and investigate whether a persistence mechanism
  was installed to reload it on boot.
objectives:
  - Use lsmod to identify the unauthorized module
  - Unload the module with rmmod
  - Find and delete the module file
  - Check for persistence mechanisms (modprobe.d, systemd services)
  - Write findings to /tmp/incident-report.txt
initial_state: |
  Ubuntu 22.04. `lsmod | grep hidepid` shows the module loaded. Module file at
  /tmp/hidepid.ko. A systemd service /etc/systemd/system/sysupdate.service is
  configured to load this module on boot. The module is not signed.
hints:
  - order: 1
    cost: 10
    content: "Identify: `lsmod | grep -v 'official\|canonical'`. Check signatures: `modinfo <module> | grep sig`"
  - order: 2
    cost: 15
    content: "Unload: `rmmod hidepid` (may need `-f` if dependencies exist)"
  - order: 3
    cost: 15
    content: "Remove file: `rm /tmp/hidepid.ko`. Check persistence: `find /etc/systemd /etc/modprobe.d -name '*update*' -o -name '*hidepid*'`"
  - order: 4
    cost: 20
    content: "Remove persistence: `systemctl disable sysupdate.service && rm /etc/systemd/system/sysupdate.service && systemctl daemon-reload`"
