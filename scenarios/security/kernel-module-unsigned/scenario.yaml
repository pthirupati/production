description: 'CONTEXT: A team operating security hardening needs you to resolve `Unsigned Kernel Module
  Loaded — Identify and Remove It` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. `lsmod | grep hidepid` shows the module loaded. Module file
  at

  /tmp/hidepid.ko. A systemd service /etc/systemd/system/sysupdate.service is

  configured to load this module on boot. The module is not signed. Security monitoring detected that
  an unsigned kernel module was loaded outside

  of the normal software management process. This is a strong indicator of a

  rootkit or kernel-level persistence mechanism. The module is named ''hidepid''

  (obscuring its true purpose) and was loaded from /tmp. Identify the module,

  unload it, remove the file, and investigate whether a persistence mechanism

  was installed to reload it on boot.


  OBJECTIVE: Use lsmod to identify the unauthorized module; Unload the module with rmmod; Find and delete
  the module file. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Use lsmod to identify the unauthorized module
- Unload the module with rmmod
- Find and delete the module file
- Check for persistence mechanisms (modprobe.d, systemd services)
- Write findings to /tmp/incident-report.txt
