description: 'CONTEXT: A team operating security hardening needs you to resolve `fail2ban Crashed — Fix
  Config Syntax Error and Restart` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with fail2ban. Service is stopped. journalctl shows config parse
  error

  in /etc/fail2ban/jail.local at line containing ''[action_mw''. The closing bracket is

  missing. Auth.log shows ongoing brute force attempts. fail2ban crashed and cannot restart due to a configuration
  syntax error introduced

  during a recent customization. The journal shows "ERROR: Failed during configuration"

  pointing to /etc/fail2ban/jail.local. A custom action was added but contains an

  unclosed bracket. While fail2ban is down, brute force attacks against SSH are going

  unblocked. Identify and fix the syntax error, then restart fail2ban.


  OBJECTIVE: Identify the syntax error in /etc/fail2ban/jail.local; Fix the configuration syntax; Restart
  fail2ban and verify it starts successfully. Success means `systemctl is-active --quiet` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the syntax error in /etc/fail2ban/jail.local
- Fix the configuration syntax
- Restart fail2ban and verify it starts successfully
- Confirm the sshd jail is active
initial_state: 'Ubuntu 22.04 with fail2ban. Service is stopped. journalctl shows config parse error

  in /etc/fail2ban/jail.local at line containing ''[action_mw''. The closing bracket is

  missing. Auth.log shows ongoing brute force attempts.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
