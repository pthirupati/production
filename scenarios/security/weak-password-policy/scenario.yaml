description: 'CONTEXT: A team operating security hardening needs you to resolve `Weak Password Policy
  — Fix PAM to Enforce Complexity` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with libpam-pwquality installed. /etc/security/pwquality.conf
  has

  all settings commented out or set to 0. Users can set weak passwords without

  restriction. /etc/pam.d/common-password does include pam_pwquality.so. A security audit found that system
  password policy is not enforcing any complexity

  requirements. Users can set passwords like "password", "123456", or their own

  username. The pam_pwquality module is installed but not configured — minlen is 0

  and no complexity checks are enabled. Configure PAM to require passwords of at

  least 12 characters with mixed case, digits, and special characters.


  OBJECTIVE: Identify that pam_pwquality is not enforcing complexity; Configure /etc/security/pwquality.conf
  with appropriate settings; Set minlen=12, dcredit=-1, ucredit=-1, ocredit=-1, lcredit=-1. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify that pam_pwquality is not enforcing complexity
- Configure /etc/security/pwquality.conf with appropriate settings
- Set minlen=12, dcredit=-1, ucredit=-1, ocredit=-1, lcredit=-1
- Verify the policy is enforced for new password changes
