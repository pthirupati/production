title: 'Security: Ssh Hardening — Fundamentals Lab'
slug: academy-security-011-learn-ssh-hardening-2
technology: Security
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Service operations lab. The `auditd` systemd unit is **failed/inactive** on this host — a
  realistic fault for Fundamentals Lab workflows that depend on it. Diagnose with `systemctl status auditd`
  and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active auditd`.
objectives:
- The `auditd` service is active (running)
- '`systemctl is-active auditd` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `auditd` service is not running (`systemctl is-active auditd` → inactive/failed). Dependent
  Fundamentals Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — sshd_config and `sshd -T`.

    2. Write down what looks normal versus wrong or missing for SSH hardening.

    3. Recall the core idea: key auth, disabling root, and ciphers. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for SSH hardening.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — sshd_config and `sshd -T`.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — SSH enforces key auth and safe settings.

    4. Click Check Solution once `systemctl is-active auditd` returns active.'
