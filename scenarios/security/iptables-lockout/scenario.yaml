description: 'CONTEXT: A team operating security hardening needs you to resolve `iptables Lockout — Recover
  and Fix Firewall Rules` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server with iptables INPUT chain policy set to DROP and no ACCEPT rules.

  Console access is available. iptables-persistent package is installed.

  The server should allow SSH, HTTP, and HTTPS inbound traffic. A junior admin accidentally applied an
  iptables INPUT policy of DROP without

  saving a recovery rule, locking out all remote access to the server. You have

  console access. Recover the server by flushing the broken rules, restoring

  connectivity for SSH on port 22, and then building a correct iptables ruleset

  that allows SSH, HTTP, and HTTPS while dropping everything else.


  OBJECTIVE: Flush the current broken iptables rules and set default policies to ACCEPT to restore access;
  Build a proper ruleset allowing established connections, SSH (22), HTTP (80), and HTTPS (443); Save
  the rules to /etc/iptables/rules.v4 so they persist after reboot. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Flush the current broken iptables rules and set default policies to ACCEPT to restore access
- Build a proper ruleset allowing established connections, SSH (22), HTTP (80), and HTTPS (443)
- Save the rules to /etc/iptables/rules.v4 so they persist after reboot
initial_state: 'Ubuntu server with iptables INPUT chain policy set to DROP and no ACCEPT rules.

