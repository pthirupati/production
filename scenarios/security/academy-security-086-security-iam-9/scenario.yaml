title: 'Security: Identity And Access — Security Practice'
slug: academy-security-086-security-iam-9
technology: Security
category: Security
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Security review: harden identity and access on this Security system.
  Close unsafe defaults, enforce least privilege, and ensure users, roles, and least
  privilege cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to identity and access are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around identity
  and access. Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — role/policy assignments.

    2. Write down what looks normal versus wrong or missing for identity and access.

    3. Recall the core idea: users, roles, and least privilege. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for identity and access.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — role/policy assignments.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit
    access the workload actually needs.

    3. Verify the result — access follows least privilege.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-security-086-security-iam-9.conf`,
    then click Check Solution.'
