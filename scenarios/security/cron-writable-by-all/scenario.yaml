description: 'CONTEXT: A team operating security hardening needs you to resolve `World-Writable Cron Directory
  - Fix /etc/cron.daily` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. `ls -ld /etc/cron.daily` shows drwxrwxrwx (world-writable).

  Any user can add scripts: `echo ''cp /bin/bash /tmp/bash && chmod +s /tmp/bash'' > /etc/cron.daily/evil`

  The fix requires setting proper permissions. A security audit found that /etc/cron.daily is world-writable
  (mode 777).

  This is a critical misconfiguration: any user on the system can place scripts

  in this directory and have them executed as root by the cron daemon. This

  provides a trivial privilege escalation path for any local user. Fix the

  permissions on /etc/cron.daily and audit other cron directories for similar issues.


  OBJECTIVE: Verify /etc/cron.daily is world-writable using ls -ld; Fix permissions to 755 (root:root);
  Audit /etc/cron.d, /etc/cron.weekly, /etc/cron.monthly for similar issues. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Verify /etc/cron.daily is world-writable using ls -ld
- Fix permissions to 755 (root:root)
- Audit /etc/cron.d, /etc/cron.weekly, /etc/cron.monthly for similar issues
- Verify cron still runs normally after the fix
