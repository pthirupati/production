title: 'Security: Ssh Hardening — Fundamentals Lab'
slug: academy-security-021-learn-ssh-hardening-3
technology: Security
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly Security lab introduces SSH hardening. You will
  explore key auth, disabling root, and ciphers on the hardening lab. Read the environment
  first, then complete the guided steps — no prior production experience required.
objectives:
- Understand how SSH hardening work in this lab environment
- Identify the main status and configuration signals for SSH hardening
- Confirm you can read the current state confidently before changing anything
initial_state: The hardening lab is online with a starter SSH hardening setup. Some
  pieces are intentionally incomplete so you can learn how the pieces fit together.
  Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: sshd_config and `sshd -T`. Write down what looks normal
    vs missing.'
- order: 2
  cost: 15
  content: Core idea — key auth, disabling root, and ciphers. Make one small, reversible
    change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-security-021-learn-ssh-hardening-3.conf`, then
    click Check Solution.
