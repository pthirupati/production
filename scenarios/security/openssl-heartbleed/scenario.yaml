description: 'CONTEXT: A team operating security hardening needs you to resolve `OpenSSL Heartbleed —
  Verify Vulnerability and Apply Patch` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server running nginx with OpenSSL 1.0.1e compiled in. A Heartbleed

  test script is available at /opt/tools/heartbleed-test.py. The patched OpenSSL

  version is available in the local apt repository. nginx is serving HTTPS on 443. An older nginx server
  is running OpenSSL 1.0.1e, which is vulnerable to

  CVE-2014-0160 (Heartbleed). The vulnerability allows remote attackers to read

  64KB of server memory per request, potentially leaking private keys and session

  tokens. Verify the vulnerability is present, update OpenSSL to a patched

  version, and confirm the service is no longer vulnerable.


  OBJECTIVE: Confirm the current OpenSSL version is vulnerable using openssl version and a Heartbleed
  test script; Update the openssl and libssl packages to a patched version using the package manager;
  Restart nginx and confirm the Heartbleed test script reports the server as not vulnerable. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the current OpenSSL version is vulnerable using openssl version and a Heartbleed test script
- Update the openssl and libssl packages to a patched version using the package manager
- Restart nginx and confirm the Heartbleed test script reports the server as not vulnerable
