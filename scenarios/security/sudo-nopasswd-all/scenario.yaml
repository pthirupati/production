description: 'CONTEXT: A team operating security hardening needs you to resolve `Sudo NOPASSWD ALL Found
  — Restrict the User''s Access` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. /etc/sudoers.d/deploy contains: `deploy ALL=(ALL) NOPASSWD:
  ALL`

  The deploy user only needs to restart nginx and the app service. Any other

  sudo command should be denied. During a routine access review, a user account ''deploy'' was found with

  NOPASSWD: ALL in the sudoers configuration. This deployment service account

  only needs to restart two specific services (nginx and app). The broad grant

  means any compromise of the deploy account leads to immediate full root access.

  Restrict the sudo grant to only the specific commands needed.


  OBJECTIVE: {''Identify the overly broad NOPASSWD'': "ALL grant for the ''deploy'' user"}; Modify the
  sudoers entry to restrict to specific commands only; {''Grant'': ''sudo /usr/bin/systemctl restart nginx,
  sudo /usr/bin/systemctl restart app''}. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the overly broad NOPASSWD: ALL grant for the 'deploy' user
- Modify the sudoers entry to restrict to specific commands only
- Grant: sudo /usr/bin/systemctl restart nginx, sudo /usr/bin/systemctl restart app
- Verify the deploy user cannot run arbitrary commands as root
initial_state: 'Ubuntu 22.04. /etc/sudoers.d/deploy contains: `deploy ALL=(ALL) NOPASSWD: ALL`

