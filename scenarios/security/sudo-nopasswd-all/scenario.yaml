slug: sudo-nopasswd-all
title: Sudo NOPASSWD ALL Found — Restrict the User's Access
technology: Security
category: Privilege Escalation
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: Critical
is_free: false
description: 'During a routine access review, a user account ''deploy'' was found with

  NOPASSWD: ALL in the sudoers configuration. This deployment service account

  only needs to restart two specific services (nginx and app). The broad grant

  means any compromise of the deploy account leads to immediate full root access.

  Restrict the sudo grant to only the specific commands needed.

  '
objectives:
- Identify the overly broad NOPASSWD: ALL grant for the 'deploy' user
- Modify the sudoers entry to restrict to specific commands only
- Grant: sudo /usr/bin/systemctl restart nginx, sudo /usr/bin/systemctl restart app
- Verify the deploy user cannot run arbitrary commands as root
initial_state: 'Ubuntu 22.04. /etc/sudoers.d/deploy contains: `deploy ALL=(ALL) NOPASSWD: ALL`

  The deploy user only needs to restart nginx and the app service. Any other

  sudo command should be denied.

  '
hints:
- order: 1
  cost: 10
  content: 'Audit the account: `sudo -l -U deploy` shows `NOPASSWD: ALL` — full passwordless root for
    a service account that only needs a couple of commands.'
- order: 2
  cost: 15
  content: Edit safely with `visudo -f /etc/sudoers.d/deploy` (never edit sudoers with a plain editor).
- order: 3
  cost: 20
  content: 'Replace the blanket rule with a scoped one, e.g. `deploy ALL=(ALL) NOPASSWD: /usr/bin/systemctl
    restart nginx, /usr/bin/systemctl status nginx`.'
- order: 4
  cost: 25
  content: 'Verify: `visudo -c` reports the files are OK and `sudo -l -U deploy` now lists only those
    two commands (no ALL).'
