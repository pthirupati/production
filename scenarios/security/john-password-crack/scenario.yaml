description: 'CONTEXT: A team operating security hardening needs you to resolve `John the Ripper — Crack
  Weak Hashed Passwords` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Forensics workstation with John the Ripper installed and rockyou.txt available

  at /usr/share/wordlists/rockyou.txt. Backup copies of passwd and shadow are

  at /opt/ir/passwd.bak and /opt/ir/shadow.bak respectively. A backup of /etc/shadow has been recovered
  from a compromised server during

  an incident response. Three accounts (backup-svc, deploybot, tempuser) are

  suspected of using weak passwords that enabled the initial breach. Use John

  the Ripper with the rockyou wordlist to crack their hashes and identify which

  accounts had weak passwords.


  OBJECTIVE: Use unshadow to combine /opt/ir/passwd.bak and /opt/ir/shadow.bak into a crackable format;
  Run john with /usr/share/wordlists/rockyou.txt against the combined file; Write the cracked username:password
  pairs to /tmp/cracked.txt. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
