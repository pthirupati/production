description: 'CONTEXT: A team operating security hardening needs you to resolve `Weak Cryptography — Identify
  and Replace Insecure Algorithms` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server running an nginx reverse proxy over a Python Flask app. The
  app

  uses hashlib.md5 for passwords. nginx TLS is configured with SSLv3 and RC4.

  openssl is installed for verification. An internal web service is using MD5 for password hashing and
  a self-signed

  certificate configured with RC4 cipher suites. A recent security scan flagged

  both issues as critical. You must update the application config to use bcrypt

  for password hashing and reconfigure nginx TLS to allow only TLS 1.2+

  with strong cipher suites.


  OBJECTIVE: Identify the weak MD5 hashing call in /opt/webapp/auth.py and replace it with bcrypt; Update
  /etc/nginx/conf.d/app.conf to set ssl_protocols TLSv1.2 TLSv1.3 and restrict ssl_ciphers to ECDHE+AESGCM;
  Reload nginx and verify the TLS configuration with openssl s_client. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the weak MD5 hashing call in /opt/webapp/auth.py and replace it with bcrypt
- Update /etc/nginx/conf.d/app.conf to set ssl_protocols TLSv1.2 TLSv1.3 and restrict ssl_ciphers to ECDHE+AESGCM
- Reload nginx and verify the TLS configuration with openssl s_client
