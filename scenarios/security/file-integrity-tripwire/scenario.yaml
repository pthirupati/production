description: 'CONTEXT: A team operating security hardening needs you to resolve `File Integrity Alert
  - Investigate and Restore Modified` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with aide installed. `/usr/sbin/aide --check` reports modifications

  to /usr/bin/find and /etc/passwd. Backups exist at /var/backup/find.backup and

  /var/backup/passwd.backup. AIDE database is at /var/lib/aide/aide.db. AIDE (Advanced Intrusion Detection
  Environment) triggered an alert — it detected

  that /usr/bin/find and /etc/passwd were modified outside of the normal change

  window. The modification times and checksums have changed. This could indicate

  a compromised system or unauthorized changes. Investigate the modified files,

  restore them from known-good backups, re-initialize the AIDE database, and

  document your findings.


  OBJECTIVE: Run AIDE check to identify all modified files; Investigate /usr/bin/find and /etc/passwd
  for suspicious changes; Restore the files from known-good backups in /var/backup/. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Run AIDE check to identify all modified files
- Investigate /usr/bin/find and /etc/passwd for suspicious changes
- Restore the files from known-good backups in /var/backup/
- Re-initialize the AIDE database after confirming system integrity
- Write investigation findings to /tmp/integrity-report.txt
