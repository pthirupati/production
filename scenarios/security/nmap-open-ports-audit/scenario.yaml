description: 'CONTEXT: A team operating security hardening needs you to resolve `Unexpected Open Ports
  - Audit and Close Unauthorized` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. Redis bound to 0.0.0.0:6379. MySQL bound to 0.0.0.0:3306.

  A Python SimpleHTTPServer running on 0.0.0.0:8080. All three are reachable

  from external hosts. Expected services: only 22, 80, 443. A vulnerability scan found unexpected ports
  open on a production server.

  In addition to the expected ports (22/SSH, 80/HTTP, 443/HTTPS), nmap reveals

  ports 6379 (Redis, exposed publicly), 8080 (development HTTP server), and

  3306 (MySQL, exposed publicly) are open and accessible. These services should

  only be accessible locally or from specific management hosts. Identify the

  offending services and restrict their bind addresses.


  OBJECTIVE: Run a port scan to identify all listening services; Identify services bound to 0.0.0.0 that
  should only be on 127.0.0.1; Configure Redis, MySQL, and the dev server to bind only to localhost. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Run a port scan to identify all listening services
- Identify services bound to 0.0.0.0 that should only be on 127.0.0.1
- Configure Redis, MySQL, and the dev server to bind only to localhost
- Verify the unauthorized ports are no longer reachable from outside
initial_state: 'Ubuntu 22.04. Redis bound to 0.0.0.0:6379. MySQL bound to 0.0.0.0:3306.

  A Python SimpleHTTPServer running on 0.0.0.0:8080. All three are reachable

  from external hosts. Expected services: only 22, 80, 443.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
