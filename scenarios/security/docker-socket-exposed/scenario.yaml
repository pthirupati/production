description: 'CONTEXT: A team operating security hardening has raised a ticket for `Docker Socket Exposed
  Without Auth — Fix Daemon Config`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab. The architecture is a single lab-primary
  node exposing SSH, firewall, TLS, audit logs, and IAM settings; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with Docker. /etc/docker/daemon.json contains:

  {"hosts": ["unix:///var/run/docker.sock", "tcp://0.0.0.0:2375"]}.

  `docker -H tcp://localhost:2375 ps` works without authentication.


  OBJECTIVE: Identify the TCP listener in /etc/docker/daemon.json or systemd override; Remove the tcp://0.0.0.0:2375
  listener from Docker configuration; Restart Docker and verify the TCP port is no longer open. Acceptance
  criteria: the change is minimal and reversible, and success means `systemctl is-active --quiet``` returns
  active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant SSH, firewall, TLS, audit logs, and IAM settings), changing one thing at a time.
  Check your work continuously against the objective — success means `systemctl is-active --quiet``` returns
  active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active --quiet`` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the TCP listener in /etc/docker/daemon.json or systemd override
- Remove the tcp://0.0.0.0:2375 listener from Docker configuration
- Restart Docker and verify the TCP port is no longer open
- Audit running containers for any launched via the exposed API
