description: 'CONTEXT: A team operating security hardening needs you to resolve `Docker Socket Exposed
  Without Auth — Fix Daemon Config` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with Docker. /etc/docker/daemon.json contains:

  {"hosts": ["unix:///var/run/docker.sock", "tcp://0.0.0.0:2375"]}.

  `docker -H tcp://localhost:2375 ps` works without authentication. The Docker daemon is configured to
  listen on a TCP socket (tcp://0.0.0.0:2375)

  without TLS authentication, in addition to the default Unix socket. This exposes

  the Docker API to anyone who can reach the server — effectively giving them

  root access (since containers can mount the host filesystem). Disable the TCP

  listener, ensure Docker only listens on the Unix socket, and verify no

  unauthorized containers were launched.


  OBJECTIVE: Identify the TCP listener in /etc/docker/daemon.json or systemd override; Remove the tcp://0.0.0.0:2375
  listener from Docker configuration; Restart Docker and verify the TCP port is no longer open. Success
  means `systemctl is-active --quiet` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the TCP listener in /etc/docker/daemon.json or systemd override
- Remove the tcp://0.0.0.0:2375 listener from Docker configuration
- Restart Docker and verify the TCP port is no longer open
- Audit running containers for any launched via the exposed API
initial_state: 'Ubuntu 22.04 with Docker. /etc/docker/daemon.json contains:

