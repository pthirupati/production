slug: apache-directory-listing
title: Apache Directory Listing Enabled — Disable Options Indexes
technology: security
category: Fix
difficulty: easy
time_limit: 600
max_score: 100
infrastructure_type: docker
jira_priority: Medium
is_free: true
description: 'CONTEXT: A team operating security hardening needs you to resolve `Apache Directory Listing
  Enabled — Disable Options Indexes` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04 with Apache2. /var/www/html/ has no index.html. Apache returns
  a

  directory listing when accessing the webroot. /etc/apache2/sites-enabled/000-default.conf

  has `Options Indexes FollowSymLinks`. Apache is serving directory listings for all directories that
  don''t have an

  index.html file. This exposes sensitive files including backup files, config

  files, and application source code to anyone who can reach the server. The

  Options Indexes directive is enabled in the virtual host configuration.

  Disable it to prevent unauthorized file browsing.


  OBJECTIVE: Confirm directory listing is enabled by accessing a directory without index; Remove or disable
  the Options Indexes directive in the Apache config; Reload Apache and verify directory listings are
  no longer served. Success means `systemctl is-active --quiet` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm directory listing is enabled by accessing a directory without index
- Remove or disable the Options Indexes directive in the Apache config
- Reload Apache and verify directory listings are no longer served
- Ensure this is configured for all virtual hosts
initial_state: 'Ubuntu 22.04 with Apache2. /var/www/html/ has no index.html. Apache returns a

  directory listing when accessing the webroot. /etc/apache2/sites-enabled/000-default.conf

  has `Options Indexes FollowSymLinks`.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status --quiet` and `journalctl -u --quiet -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status --quiet` — note Active/Failed and the last log lines.

    2. Read `journalctl -u --quiet -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart --quiet` and confirm `systemctl is-active --quiet` succeeds.


    WHY: the grader checks real service state, not marker files.'
