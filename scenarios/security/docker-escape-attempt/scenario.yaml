title: Docker Escape Attempt - Detect and Harden Container
slug: docker-escape-attempt
technology: security
category: Build
difficulty: hard
time_limit: 1200
max_score: 100
infrastructure_type: docker
jira_priority: Critical
is_free: false
description: 'CONTEXT: A team operating security hardening needs you to resolve `Docker Escape Attempt
  - Detect and Harden Container` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Docker host with a running container named `webapp` launched with --privileged

  and -v /:/host. The container image is nginx:alpine. Docker daemon is running

  with default configuration. Audit logs show unexpected host filesystem access. Security monitoring has
  detected suspicious activity from a running container

  that appears to be attempting a privileged escape. The container was launched

  with --privileged and has /host mounted from the host filesystem. Identify the

  dangerous container configuration, stop the offending container, and redeploy

  it with a hardened security profile using --cap-drop and a read-only root.


  OBJECTIVE: Identify the privileged container and its dangerous mounts using docker inspect; Stop the
  offending container and document the security misconfigurations found; Redeploy the container without
  --privileged, with --cap-drop=ALL --cap-add=NET_BIND_SERVICE, and --read-only. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the privileged container and its dangerous mounts using docker inspect
- Stop the offending container and document the security misconfigurations found
- Redeploy the container without --privileged, with --cap-drop=ALL --cap-add=NET_BIND_SERVICE, and --read-only
initial_state: 'Docker host with a running container named `webapp` launched with --privileged

  and -v /:/host. The container image is nginx:alpine. Docker daemon is running

  with default configuration. Audit logs show unexpected host filesystem access.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
