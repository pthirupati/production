title: Identity And Access — Security Lab
slug: academy-security-036-security-iam-4
technology: security
category: Harden
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating security hardening needs you to resolve `security: Identity And
  Access — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around identity and access.
  Assume an auditor or pen test is next week — tighten controls with evidence. Security review: harden
  identity and access on this security system. Close unsafe defaults, enforce least privilege, and ensure
  users, roles, and least privilege cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to identity and access are removed or constrained; Access follows
  least privilege and is auditable; Security checks pass without breaking required functionality. Success
  means `systemctl is-active auditd` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to identity and access are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around identity and access. Assume
  an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status auditd` and `journalctl -u auditd -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status auditd` — note Active/Failed and the last log lines.

    2. Read `journalctl -u auditd -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart auditd` and confirm `systemctl is-active auditd` succeeds.


    WHY: the grader checks real service state, not marker files.'
summary: Complete the identity and access — security lab security lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic security literacy
tags:
- fix
- hands-on
