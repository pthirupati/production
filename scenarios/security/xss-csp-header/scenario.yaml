description: 'CONTEXT: A team operating security hardening needs you to resolve `XSS and CSP Header -
  Add Content Security Policy to Prevent` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server running nginx as a reverse proxy for a Flask web app on port
  5000.

  The nginx config at /etc/nginx/conf.d/app.conf has no security headers configured.

  curl is available for testing. The app is reachable at http://localhost/. A penetration test has identified
  a reflected cross-site scripting (XSS)

  vulnerability in the search parameter of a web application. While the

  underlying code fix is pending, you must add a Content Security Policy header

  via nginx to block inline script execution and restrict resource loading to

  same-origin only. Also add X-Frame-Options and X-Content-Type-Options headers.


  OBJECTIVE: Add a Content-Security-Policy header to /etc/nginx/conf.d/app.conf restricting script-src
  to ''self''; Add X-Frame-Options DENY and X-Content-Type-Options nosniff headers; Reload nginx and verify
  all three security headers are present using curl. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Add a Content-Security-Policy header to /etc/nginx/conf.d/app.conf restricting script-src to 'self'
- Add X-Frame-Options DENY and X-Content-Type-Options nosniff headers
- Reload nginx and verify all three security headers are present using curl
