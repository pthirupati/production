hints:
- order: 1
  cost: 10
  content: 'Triage: `kubectl get secret`, volume mounts, and ServiceAccount permissions.
    Capture timestamps, error messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: only intended workloads can read the secret and apps
    authenticate successfully. Document the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-security-074-troubleshoot-secrets-8.conf`,
    and rerun Check Solution.'
