slug: sudoers-misconfigured
title: Sudoers Misconfigured — Restrict www-data ALL Command Access
technology: Security
category: Privilege Escalation
difficulty: medium
time_limit: 900
max_score: 100
infrastructure_type: docker
jira_priority: Critical
is_free: false
description: 'A security audit discovered that the www-data user (the nginx/Apache web server

  process account) has been granted unrestricted sudo access in the sudoers file.

  This means any web application vulnerability (RCE, SSRF) could instantly escalate

  to full root access. Remove the dangerous ALL=(ALL) NOPASSWD: ALL rule and replace

  it with a minimal scoped permission if needed (or remove entirely).

  '
objectives:
- Identify the dangerous sudoers entry for www-data
- Remove the ALL=(ALL) NOPASSWD: ALL grant from /etc/sudoers.d/ or /etc/sudoers
- Verify www-data can no longer execute arbitrary commands as root
- Ensure the sudoers file syntax is valid after editing
initial_state: 'Ubuntu 22.04. File /etc/sudoers.d/webserver contains:

  www-data ALL=(ALL) NOPASSWD: ALL

  This grants the web server process root access without any password.

  '
hints:
- order: 1
  cost: 10
  content: 'Audit the web account: `sudo -l -U www-data` shows it has unrestricted sudo — a serious risk
    if the web server is compromised.'
- order: 2
  cost: 15
  content: 'Remove the dangerous grant: delete the offending drop-in (`rm /etc/sudoers.d/webserver`) or
    edit it to drop the line — always via `visudo`.'
- order: 3
  cost: 20
  content: 'Check syntax after editing: `visudo -c` must report the sudoers files are OK.'
- order: 4
  cost: 25
  content: 'Verify: `sudo -l -U www-data` now shows no sudo rights (or only a minimal, intended scoped
    rule) — www-data can no longer run arbitrary root commands.'
