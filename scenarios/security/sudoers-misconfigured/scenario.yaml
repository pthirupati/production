description: 'CONTEXT: A team operating security hardening needs you to resolve `Sudoers Misconfigured
  — Restrict www-data ALL Command Access` during a realistic incident. The business impact is reduced
  service reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu 22.04. File /etc/sudoers.d/webserver contains:

  www-data ALL=(ALL) NOPASSWD: ALL

  This grants the web server process root access without any password. A security audit discovered that
  the www-data user (the nginx/Apache web server

  process account) has been granted unrestricted sudo access in the sudoers file.

  This means any web application vulnerability (RCE, SSRF) could instantly escalate

  to full root access. Remove the dangerous ALL=(ALL) NOPASSWD: ALL rule and replace

  it with a minimal scoped permission if needed (or remove entirely).


  OBJECTIVE: Identify the dangerous sudoers entry for www-data; {''Remove the ALL=(ALL) NOPASSWD'': ''ALL
  grant from /etc/sudoers.d/ or /etc/sudoers''}; Verify www-data can no longer execute arbitrary commands
  as root. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Identify the dangerous sudoers entry for www-data
- Remove the ALL=(ALL) NOPASSWD: ALL grant from /etc/sudoers.d/ or /etc/sudoers
- Verify www-data can no longer execute arbitrary commands as root
- Ensure the sudoers file syntax is valid after editing
initial_state: 'Ubuntu 22.04. File /etc/sudoers.d/webserver contains:

  www-data ALL=(ALL) NOPASSWD: ALL

  This grants the web server process root access without any password.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and note the file path and line number in the error.

    2. Open that file (often `/etc/nginx/nginx.conf` or under `/etc/nginx/conf.d/`).

    3. Compare the bad directive to the nginx docs — typos like `listn` should be `listen`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the typo on the reported line and save the file.

    2. Re-run `nginx -t` until it reports syntax is ok.

    3. Run `systemctl enable --now nginx`, then `curl -I http://localhost` (expect HTTP 200).


    WHY: systemd will not start nginx until `nginx -t` passes.'
