description: 'CONTEXT: A team operating security hardening needs you to resolve `HIDS Alert Review — Investigate
  OSSEC File Integrity Alerts` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: CentOS server running OSSEC HIDS in local mode. Alerts have been triggered
  for

  /etc/passwd and /usr/bin/sudo. OSSEC database is at /var/ossec/queue/syscheck/.

  The server last had a legitimate package update 3 days ago. OSSEC HIDS has triggered a level-7 file
  integrity monitoring alert indicating

  that /etc/passwd and /usr/bin/sudo have been modified outside of a change

  window. Review the OSSEC alerts, determine what changed in each file using

  the stored checksums, and assess whether the changes indicate a compromise

  or a legitimate system update.


  OBJECTIVE: Review /var/ossec/logs/alerts/alerts.log for the file modification events; Compare current
  checksums of /etc/passwd and /usr/bin/sudo against OSSEC''s baseline database; Write a one-line finding
  to /tmp/hids-findings.txt stating whether each change is suspicious or benign. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Review /var/ossec/logs/alerts/alerts.log for the file modification events
- Compare current checksums of /etc/passwd and /usr/bin/sudo against OSSEC's baseline database
- Write a one-line finding to /tmp/hids-findings.txt stating whether each change is suspicious or benign
