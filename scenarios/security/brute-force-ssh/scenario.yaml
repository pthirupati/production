is_free: false
description: 'CONTEXT: A team operating security hardening needs you to resolve `SSH Brute-Force Attack
  — Detect and Block` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline hardening lab with SSH, firewall, TLS, audit logs,
  and IAM settings. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ubuntu server with SSH exposed on port 22. auth.log contains thousands of

  failed login attempts. iptables is running with default ACCEPT policies. The auth.log on your server
  shows thousands of failed SSH login attempts from

  the IP 203.0.113.47 over the past hour targeting the root and admin accounts.

  The attack is ongoing. Identify the source IP from the logs, block it using

  iptables, and configure sshd to disable password authentication entirely.


  OBJECTIVE: Parse /var/log/auth.log to identify the attacking IP address; Block the attacker IP with
  an iptables DROP rule; Disable PasswordAuthentication in /etc/ssh/sshd_config and reload sshd. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Parse /var/log/auth.log to identify the attacking IP address
- Block the attacker IP with an iptables DROP rule
- Disable PasswordAuthentication in /etc/ssh/sshd_config and reload sshd
initial_state: 'Ubuntu server with SSH exposed on port 22. auth.log contains thousands of

  failed login attempts. iptables is running with default ACCEPT policies.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status sshd` and `ss -tlnp | grep :22` on the target host.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Confirm sshd is active and listening on port 22.

    2. Check `firewall-cmd` or iptables for blocked port 22.

    3. Read `/var/log/secure` for auth or config errors.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix sshd_config, firewall, or socket unit as needed.

    2. `systemctl restart sshd`.

    3. `ssh -o BatchMode=yes user@localhost echo ok` succeeds.


    WHY: SSH failures are usually service, firewall, or config — not credentials alone.'
