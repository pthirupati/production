description: 'CONTEXT: A team operating MySQL needs you to resolve `mysql: Character Sets — Backup and
  Recovery` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline MySQL instance with mysql client, InnoDB, grants,
  and slow query log. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for character sets. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for character
  sets. Ensure backups run on schedule, retention is correct, and you can restore utf8mb4, collations,
  and conversion within the lab RTO.


  OBJECTIVE: Backup coverage for character sets is complete and restorable; Retention and encryption meet
  the stated policy; A restore drill proves data integrity. Success means `systemctl is-active mysqld`
  returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for character sets is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for character sets. Leadership wants proof
  that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status mysqld` and `journalctl -u mysqld -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status mysqld` — note Active/Failed and the last log lines.

    2. Read `journalctl -u mysqld -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart mysqld` and confirm `systemctl is-active mysqld` succeeds.


    WHY: the grader checks real service state, not marker files.'
