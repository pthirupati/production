coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'A report query scans the whole orders table. Fix solution(conn) so it creates the index
    the query actually needs and returns its name. The hot query filters on customer_id and then orders
    by created_at, so a composite index on (customer_id, created_at) in that order is required - a single-column
    index on customer_id alone still leaves a filesort. Name it ''idx_orders_customer_created''.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn):\n    # BUG: indexes only the filter column, so MySQL still has to sort\
      \ the\n    # matched rows by created_at.\n    conn.execute(\"CREATE INDEX idx_orders_customer_created\
      \ ON orders(customer_id)\")\n    return 'idx_orders_customer_created'\n"
    readonly: false
  visible_tests:
  - name: index is created with the expected name
    code: "import sqlite3\ndef _seed():\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, \"\n        \"created_at\
      \ TEXT, total REAL);\")\n    conn.executemany(\n        \"INSERT INTO orders (customer_id, created_at,\
      \ total) VALUES (?,?,?)\",\n        [(i % 10, '2026-01-%02d' % ((i % 28) + 1), i * 1.5) for i in\
      \ range(200)])\n    return conn\ndef _indexes(conn):\n    return [r[0] for r in conn.execute(\n\
      \        \"SELECT name FROM sqlite_master WHERE type='index' AND name IS NOT NULL\")]\ndef _index_cols(conn,\
      \ name):\n    return [r[2] for r in conn.execute(\"PRAGMA index_info('%s')\" % name)]\ndef _plan(conn,\
      \ sql):\n    return ' '.join(str(r) for r in conn.execute(\"EXPLAIN QUERY PLAN \" + sql))\nconn\
      \ = _seed()\nassert solution(conn) == 'idx_orders_customer_created', solution(conn)\n"
  - name: index exists on the orders table
    code: "import sqlite3\ndef _seed():\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, \"\n        \"created_at\
      \ TEXT, total REAL);\")\n    conn.executemany(\n        \"INSERT INTO orders (customer_id, created_at,\
      \ total) VALUES (?,?,?)\",\n        [(i % 10, '2026-01-%02d' % ((i % 28) + 1), i * 1.5) for i in\
      \ range(200)])\n    return conn\ndef _indexes(conn):\n    return [r[0] for r in conn.execute(\n\
      \        \"SELECT name FROM sqlite_master WHERE type='index' AND name IS NOT NULL\")]\ndef _index_cols(conn,\
      \ name):\n    return [r[2] for r in conn.execute(\"PRAGMA index_info('%s')\" % name)]\ndef _plan(conn,\
      \ sql):\n    return ' '.join(str(r) for r in conn.execute(\"EXPLAIN QUERY PLAN \" + sql))\nconn\
      \ = _seed()\nsolution(conn)\nassert 'idx_orders_customer_created' in _indexes(conn), _indexes(conn)\n"
  hidden_tests:
  - name: index covers both columns in order
    code: "import sqlite3\ndef _seed():\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
