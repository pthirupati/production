title: Running Total of Daily Sales
slug: mysql-running-total-window
technology: mysql
category: Build
description: 'CONTEXT: A team operating MySQL has raised a ticket for `Running Total of Daily Sales`.
  A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve it.
  Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline MySQL instance. The architecture is a single lab-primary
  node exposing mysql client, InnoDB, grants, and slow query log; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A sales dashboard needs a cumulative (running) total alongside each day''s
  revenue, so the team can see the month build up day by day. Implement it with a window function that
  sums every amount from the first day through the current row, ordered by day.


  OBJECTIVE: Order rows chronologically by day; Use SUM(...) OVER (ORDER BY ...) to accumulate a running
  total; Return each day''s amount alongside the cumulative total to date. Acceptance criteria: the change
  is minimal and reversible, and success means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant mysql client, InnoDB, grants, and slow query log), changing one thing at a time.
  Check your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
