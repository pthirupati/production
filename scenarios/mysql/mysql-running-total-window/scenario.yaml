title: Running Total of Daily Sales
slug: mysql-running-total-window
technology: mysql
category: Build
description: 'CONTEXT: A team operating MySQL needs you to resolve `Running Total of Daily Sales` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline MySQL instance with mysql client, InnoDB, grants,
  and slow query log. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A sales dashboard needs a cumulative (running) total alongside each day''s
  revenue, so the team can see the month build up day by day. Implement it with a window function that
  sums every amount from the first day through the current row, ordered by day.


  OBJECTIVE: Order rows chronologically by day; Use SUM(...) OVER (ORDER BY ...) to accumulate a running
  total; Return each day''s amount alongside the cumulative total to date. Success means all hidden tests
  pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Order rows chronologically by day
- Use SUM(...) OVER (ORDER BY ...) to accumulate a running total
- Return each day's amount alongside the cumulative total to date
initial_state: A sales dashboard needs a cumulative (running) total alongside each day's revenue, so the
  team can see the month build up day by day. Implement it with a window function that sums every amount
  from the first day through the current row, ordered by day.
solution_explanation: 'A running total is a windowed aggregate: SUM(amount) OVER (ORDER BY day ...) computes
  the sum over a

  moving frame that, by default with an ORDER BY, runs from the first row up to the current one.

  Stating the frame explicitly — ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW — makes the intent

  unambiguous. Unlike GROUP BY, a window function keeps every original row, so each day still appears

  with both its own amount and the cumulative total through that day.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: implement
  instructions: 'Implement solution(conn) so it returns, for each day in daily_sales, a row of

    (day, amount, running_total), where running_total is the sum of every amount from the earliest

    day through this one. Order the result by day ascending. Use a window function.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "import sqlite3\n\ndef solution(conn):\n    # TODO: return (day, amount, running_total) for\
      \ each day, ordered by day.\n    # running_total must accumulate every amount from the first day\
      \ through\n    # the current one. Use a window function: SUM(amount) OVER (ORDER BY day ...).\n\
      \    # This stub returns a constant 0 running total and is intentionally wrong.\n    return conn.execute(\n\
      \        \"\"\"\n        SELECT day, amount, 0 AS running_total\n        FROM daily_sales\n    \
      \    ORDER BY day\n        \"\"\"\n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: accumulates day by day
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ daily_sales (day TEXT PRIMARY KEY, amount REAL);\"\n    \"INSERT INTO daily_sales (day, amount)\
      \ VALUES \"\n    \"('2024-01-01',100.0),('2024-01-02',50.0),('2024-01-03',25.0),('2024-01-04',75.0);\"\
      \n)\nassert solution(conn) == [\n    ('2024-01-01', 100.0, 100.0),\n    ('2024-01-02', 50.0, 150.0),\n\
      \    ('2024-01-03', 25.0, 175.0),\n    ('2024-01-04', 75.0, 250.0),\n], solution(conn)\n"
  - name: single day equals its own amount
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ daily_sales (day TEXT PRIMARY KEY, amount REAL);\"\n    \"INSERT INTO daily_sales (day, amount)\
      \ VALUES ('2024-05-01', 9.0);\"\n)\nassert solution(conn) == [('2024-05-01', 9.0, 9.0)], solution(conn)\n"
  hidden_tests:
  - name: final running total equals grand total
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ daily_sales (day TEXT PRIMARY KEY, amount REAL);\"\n    \"INSERT INTO daily_sales (day, amount)\
      \ VALUES ('a',1.0),('b',2.0),('c',3.0);\"\n)\nres = solution(conn)\nassert [r[2] for r in res] ==\
      \ [1.0, 3.0, 6.0], res\n"
  - name: each row keeps its own amount
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ daily_sales (day TEXT PRIMARY KEY, amount REAL);\"\n    \"INSERT INTO daily_sales (day, amount)\
      \ VALUES ('d1',10.0),('d2',20.0);\"\n)\nres = solution(conn)\nassert res == [('d1', 10.0, 10.0),\
      \ ('d2', 20.0, 30.0)], res\n"
  - name: handles unordered inserts
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ daily_sales (day TEXT PRIMARY KEY, amount REAL);\"\n    \"INSERT INTO daily_sales (day, amount)\
      \ VALUES ('2024-03-03',3.0),('2024-03-01',1.0),('2024-03-02',2.0);\"\n)\nres = solution(conn)\n\
      assert res == [\n    ('2024-03-01', 1.0, 1.0),\n    ('2024-03-02', 2.0, 3.0),\n    ('2024-03-03',\
      \ 3.0, 6.0),\n], res\n"
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
