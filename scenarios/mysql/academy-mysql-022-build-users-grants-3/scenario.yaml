description: 'CONTEXT: A team operating MySQL needs you to resolve `mysql: Users And Grants — Build From
  Scratch` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline MySQL instance with mysql client, InnoDB, grants,
  and slow query log. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The MySQL instance is ready but users and grants is not configured yet. Required
  tools may already be installed; your job is to create the configuration and bring the capability online.
  Build users and grants from scratch in this mysql lab. You start from a minimal environment and must
  produce a working configuration that demonstrates accounts, hosts, and privileges. Plan, implement,
  then prove it works.


  OBJECTIVE: A working users and grants setup must exist by the end of this lab; Configuration should
  follow team conventions and be easy to audit; The result should pass validation without manual cleanup.
  Success means `systemctl is-active mysqld` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working users and grants setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The MySQL instance is ready but users and grants is not configured yet. Required tools
  may already be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `SELECT user,host FROM mysql.user` and `SHOW GRANTS`.

    2. Write down what looks normal versus wrong or missing for users and grants.

    3. Recall the core idea: accounts, hosts, and privileges. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status mysqld` — note Active/Failed and the last log lines.

    2. Read `journalctl -u mysqld -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `SELECT user,host FROM mysql.user` and `SHOW GRANTS`.

    2. Create the smallest working slice of users and grants first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — the account connects with correct privileges.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
