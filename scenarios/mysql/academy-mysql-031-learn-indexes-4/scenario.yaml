environment:
  nodes:
  - role: primary
    os: FixitLab MySQL instance
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - bash
  - coreutils
  - journalctl
  - mysql
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Database Indexes — Learn Lab
  description: Restore healthy behavior for Database Indexes — Learn Lab by investigating the failure,
    applying the smallest safe fix, and validating the outcome.
  background: 'This mysql lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: service_active
    command: systemctl is-active mysqld
    expected_status: active
    error_message: The mysqld service is not active yet. Check `systemctl status mysqld` and `journalctl
      -u mysqld -n 50`.
solution:
  summary: The root cause is an unhealthy `mysqld` service; repair it and verify active state.
  files_changed: []
  commands_run:
  - systemctl is-active mysqld
  reference_docs: mysql-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active mysqld
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active mysqld
    expected_output: '`systemctl is-active mysqld` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
