title: 'MySQL: Slow Queries — Troubleshooting Drill'
slug: academy-mysql-004-troubleshoot-slow-query
technology: MySQL
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Service operations lab. The `mysqld` systemd unit is **failed/inactive** on this host — a
  realistic fault for Troubleshooting Drill workflows that depend on it. Diagnose with `systemctl status
  mysqld` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active mysqld`.
objectives:
- The `mysqld` service is active (running)
- '`systemctl is-active mysqld` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `mysqld` service is not running (`systemctl is-active mysqld` → inactive/failed). Dependent
  Troubleshooting Drill tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — slow query log, EXPLAIN, and performance_schema/pg_stat_statements.

    2. Write down what looks normal versus wrong or missing for slow queries.

    3. Recall the core idea: query plans, indexes, statistics, and timeout tuning. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for slow queries.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — slow query log, EXPLAIN, and performance_schema/pg_stat_statements.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — target queries use efficient plans and p95 latency improves.

    4. Click Check Solution once `systemctl is-active mysqld` returns active.'
