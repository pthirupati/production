title: Keep Only the Latest Event Per User (and Index It)
slug: mysql-dedup-row-number
technology: mysql
category: Build
description: 'CONTEXT: A team operating MySQL needs you to resolve `Keep Only the Latest Event Per User
  (and Index It)` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline MySQL instance with mysql client, InnoDB, grants,
  and slow query log. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An events table records many rows per user over time, and a "current status"
  view should keep only the most recent event per user. Implement the dedup with ROW_NUMBER(), and add
  the index that lets a single-user lookup use a SEARCH on the index instead of a full table SCAN.


  OBJECTIVE: Rank each user''s events newest-first with ROW_NUMBER() in a CTE; Keep only rank 1 to get
  one current row per user; Break ties deterministically when two events share a timestamp. Success means
  all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: High
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Rank each user's events newest-first with ROW_NUMBER() in a CTE
- Keep only rank 1 to get one current row per user
- Break ties deterministically when two events share a timestamp
- Add a (user_id, ts) index so a single-user lookup uses an index SEARCH, not a full SCAN
initial_state: An events table records many rows per user over time, and a "current status" view should
  keep only the most recent event per user. Implement the dedup with ROW_NUMBER(), and add the index that
  lets a single-user lookup use a SEARCH on the index instead of a full table SCAN.
solution_explanation: 'ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY ts DESC, id DESC) numbers each
  user''s events with

  the newest as 1; wrapping it in a CTE and filtering WHERE rn = 1 yields exactly one current row per

  user. Adding id DESC to the window''s ORDER BY makes ties (two events sharing a timestamp)

  deterministic — the later-inserted row wins. Separately, a composite index on (user_id, ts) lets the

  planner satisfy a "give me this user''s events newest-first" lookup with an index SEARCH (a B-tree

  seek to the user, then an ordered range) instead of reading and sorting the whole table — the

  difference between an O(log n) seek and an O(n) full scan as the table grows.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: implement
  instructions: "Implement solution(conn) so it:\n  1) Creates an index named idx_events_user_ts on events(user_id,\
    \ ts) if it does not exist, so a\n     per-user newest-first lookup can use an index SEARCH instead\
    \ of a full table SCAN.\n  2) Returns one row (user_id, status, ts) per user — the user's MOST RECENT\
    \ event — ordered by\n     user_id. When two events share the same ts, the one with the larger id\
    \ wins.\nUse ROW_NUMBER() in a CTE to rank and keep only the newest per user.\nClick Run to try it,\
    \ then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "import sqlite3\n\ndef solution(conn):\n    # TODO (1): create a composite index so a single-user,\
      \ newest-first\n    # lookup uses an index SEARCH instead of a full table SCAN:\n    #   CREATE\
      \ INDEX IF NOT EXISTS idx_events_user_ts ON events(user_id, ts)\n    #\n    # TODO (2): rank each\
      \ user's events newest-first with ROW_NUMBER() in a\n    # CTE (PARTITION BY user_id ORDER BY ts\
      \ DESC, id DESC), then keep rn = 1.\n    # Return (user_id, status, ts) ordered by user_id.\n  \
      \  #\n    # This stub returns every event (no dedup) and creates no index, so it\n    # is intentionally\
      \ wrong.\n    return conn.execute(\n        \"SELECT user_id, status, ts FROM events ORDER BY user_id\"\
      \n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: keeps the newest event per user
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ events (id INTEGER PRIMARY KEY, user_id INTEGER, status TEXT, ts TEXT);\"\n    \"INSERT INTO events\
      \ (id, user_id, status, ts) VALUES \"\n    \"(1,1,'signup','2024-01-01'),(2,1,'active','2024-02-01'),(3,1,'churned','2024-03-01'),\"\
      \n    \"(4,2,'signup','2024-01-15'),(5,2,'active','2024-02-15'),(6,3,'signup','2024-01-20');\"\n\
      )\nassert solution(conn) == [\n    (1,'churned','2024-03-01'),\n    (2,'active','2024-02-15'),\n\
      \    (3,'signup','2024-01-20'),\n], solution(conn)\n"
  - name: exactly one row per user
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ events (id INTEGER PRIMARY KEY, user_id INTEGER, status TEXT, ts TEXT);\"\n    \"INSERT INTO events\
      \ (id, user_id, status, ts) VALUES \"\n    \"(1,1,'signup','2024-01-01'),(2,1,'active','2024-02-01'),(3,1,'churned','2024-03-01'),\"\
      \n    \"(4,2,'signup','2024-01-15'),(5,2,'active','2024-02-15'),(6,3,'signup','2024-01-20');\"\n\
      )\nids = [r[0] for r in solution(conn)]\nassert ids == [1, 2, 3], ids\nassert len(ids) == len(set(ids)),\
      \ ids\n"
  hidden_tests:
  - name: creates the composite index
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ events (id INTEGER PRIMARY KEY, user_id INTEGER, status TEXT, ts TEXT);\"\n    \"INSERT INTO events\
      \ (id, user_id, status, ts) VALUES (1,1,'a','2024-01-01');\"\n)\nsolution(conn)\nnames = [r[0] for\
      \ r in conn.execute(\n    \"SELECT name FROM sqlite_master WHERE type='index' AND tbl_name='events'\
      \ AND sql IS NOT NULL\"\n).fetchall()]\nassert 'idx_events_user_ts' in names, names\n"
  - name: per-user lookup uses an index SEARCH not a full SCAN
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ events (id INTEGER PRIMARY KEY, user_id INTEGER, status TEXT, ts TEXT);\"\n    \"INSERT INTO events\
      \ (id, user_id, status, ts) VALUES \"\n    \"(1,1,'a','2024-01-01'),(2,1,'b','2024-02-01'),(3,2,'c','2024-01-15');\"\
      \n)\nsolution(conn)\nplan = conn.execute(\n    \"EXPLAIN QUERY PLAN SELECT status, ts FROM events\
      \ WHERE user_id = 1 ORDER BY ts DESC\"\n).fetchall()\ndetail = ' '.join(str(p[-1]) for p in plan)\n\
      assert 'idx_events_user_ts' in detail, detail\nassert 'SCAN events' not in detail, detail\n"
  - name: ties on timestamp broken by larger id
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ events (id INTEGER PRIMARY KEY, user_id INTEGER, status TEXT, ts TEXT);\"\n    \"INSERT INTO events\
      \ (id, user_id, status, ts) VALUES \"\n    \"(1,5,'old','2024-01-01'),(2,5,'new','2024-01-01');\"\
      \n)\nassert solution(conn) == [(5,'new','2024-01-01')], solution(conn)\n"
  - name: single event passes through
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ events (id INTEGER PRIMARY KEY, user_id INTEGER, status TEXT, ts TEXT);\"\n    \"INSERT INTO events\
      \ (id, user_id, status, ts) VALUES (1,9,'only','2024-06-01');\"\n)\nassert solution(conn) == [(9,'only','2024-06-01')],\
      \ solution(conn)\n"
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
