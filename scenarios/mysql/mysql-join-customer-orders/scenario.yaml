title: Join Customers to Their Orders
slug: mysql-join-customer-orders
technology: mysql
category: Fix
description: 'CONTEXT: A team operating MySQL needs you to resolve `Join Customers to Their Orders` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline MySQL instance with mysql client, InnoDB, grants,
  and slow query log. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A reporting query should pair every order with the name of the customer who
  placed it, but the starter forgot the join condition, so the database pairs every customer with every
  order (a cartesian product). Add the ON clause so each order shows only its real customer.


  OBJECTIVE: See how a missing ON clause produces a cartesian product; Join orders to customers on the
  matching key; Return one row per order with the correct customer name. Success means all hidden tests
  pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Low
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See how a missing ON clause produces a cartesian product
- Join orders to customers on the matching key
- Return one row per order with the correct customer name
initial_state: A reporting query should pair every order with the name of the customer who placed it,
  but the starter forgot the join condition, so the database pairs every customer with every order (a
  cartesian product). Add the ON clause so each order shows only its real customer.
solution_explanation: 'Listing two tables without a join predicate cross-joins them: every customer row
  is matched to

  every order row. Adding ON o.customer_id = c.id keeps only the pairs where the order actually

  belongs to that customer, giving one row per order.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Fix solution(conn) so it returns, for every order, a row of (customer_name, order_id,
    amount),

    ordered by customer name then order id. Only real customer/order pairs should appear.

    The starter cross-joins the tables — add the join condition.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "import sqlite3\n\ndef solution(conn):\n    # BUG: the tables are listed without a join condition,\
      \ so this\n    # produces a cartesian product (every customer paired with every order).\n    return\
      \ conn.execute(\n        \"\"\"\n        SELECT c.name, o.id AS order_id, o.amount\n        FROM\
      \ customers c, orders o\n        ORDER BY c.name, o.id\n        \"\"\"\n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: pairs each order with its own customer
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ customers (id INTEGER PRIMARY KEY, name TEXT);\"\n    \"CREATE TABLE orders (id INTEGER PRIMARY\
      \ KEY, customer_id INTEGER, amount REAL);\"\n    \"INSERT INTO customers (id, name) VALUES (1,'Ada'),(2,'Bo'),(3,'Cy');\"\
      \n    \"INSERT INTO orders (id, customer_id, amount) VALUES (10,1,50.0),(11,1,25.5),(12,2,99.0);\"\
      \n)\nassert solution(conn) == [('Ada', 10, 50.0), ('Ada', 11, 25.5), ('Bo', 12, 99.0)], solution(conn)\n"
  - name: customer with no orders is excluded
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ customers (id INTEGER PRIMARY KEY, name TEXT);\"\n    \"CREATE TABLE orders (id INTEGER PRIMARY\
      \ KEY, customer_id INTEGER, amount REAL);\"\n    \"INSERT INTO customers (id, name) VALUES (1,'Ada'),(2,'Bo'),(3,'Cy');\"\
      \n    \"INSERT INTO orders (id, customer_id, amount) VALUES (10,1,50.0),(11,1,25.5),(12,2,99.0);\"\
      \n)\nnames = [r[0] for r in solution(conn)]\nassert 'Cy' not in names, names\n"
  hidden_tests:
  - name: row count equals order count
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ customers (id INTEGER PRIMARY KEY, name TEXT);\"\n    \"CREATE TABLE orders (id INTEGER PRIMARY\
      \ KEY, customer_id INTEGER, amount REAL);\"\n    \"INSERT INTO customers (id, name) VALUES (1,'Ada'),(2,'Bo'),(3,'Cy');\"\
      \n    \"INSERT INTO orders (id, customer_id, amount) VALUES (10,1,50.0),(11,1,25.5),(12,2,99.0);\"\
      \n)\nassert len(solution(conn)) == 3, len(solution(conn))\n"
  - name: one customer with several orders
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ customers (id INTEGER PRIMARY KEY, name TEXT);\"\n    \"CREATE TABLE orders (id INTEGER PRIMARY\
      \ KEY, customer_id INTEGER, amount REAL);\"\n    \"INSERT INTO customers (id, name) VALUES (1,'Zoe');\"\
      \n    \"INSERT INTO orders (id, customer_id, amount) VALUES (5,1,10.0),(6,1,20.0),(7,1,30.0);\"\n\
      )\nassert solution(conn) == [('Zoe',5,10.0),('Zoe',6,20.0),('Zoe',7,30.0)], solution(conn)\n"
  - name: no orders yields empty result
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ customers (id INTEGER PRIMARY KEY, name TEXT);\"\n    \"CREATE TABLE orders (id INTEGER PRIMARY\
      \ KEY, customer_id INTEGER, amount REAL);\"\n    \"INSERT INTO customers (id, name) VALUES (1,'Solo');\"\
      \n)\nassert solution(conn) == [], solution(conn)\n"
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
