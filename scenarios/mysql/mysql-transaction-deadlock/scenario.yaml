coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Two sessions deadlock because they take row locks in opposite orders. Fix solution(conn)
    so it returns the order in which a session should lock the given row ids: always ascending, so every
    session agrees on a global order and a cycle becomes impossible. Duplicates must be collapsed. Return
    a list of ids.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn, row_ids):\n    # BUG: locks in the order the caller happened to supply,\
      \ which is exactly\n    # how two sessions end up waiting on each other.\n    return list(row_ids)\n"
    readonly: false
  visible_tests:
  - name: ids are locked in ascending order
    code: "import sqlite3\ndef _c():\n    return sqlite3.connect(':memory:')\nconn = _c()\nassert solution(conn,\
      \ [5,2,9]) == [2,5,9], solution(conn, [5,2,9])\n"
  - name: two sessions agree on the order
    code: "import sqlite3\ndef _c():\n    return sqlite3.connect(':memory:')\nconn = _c()\nassert solution(conn,\
      \ [3,1]) == solution(conn, [1,3]), 'orders must match'\n"
  hidden_tests:
  - name: duplicates are collapsed
    code: "import sqlite3\ndef _c():\n    return sqlite3.connect(':memory:')\nconn = _c()\nassert solution(conn,\
      \ [4,4,1]) == [1,4], solution(conn, [4,4,1])\n"
  - name: empty set returns empty
    code: "import sqlite3\ndef _c():\n    return sqlite3.connect(':memory:')\nconn = _c()\nassert solution(conn,\
      \ []) == [], solution(conn, [])\n"
  - name: already-sorted input is unchanged
    code: "import sqlite3\ndef _c():\n    return sqlite3.connect(':memory:')\nconn = _c()\nassert solution(conn,\
      \ [1,2,3]) == [1,2,3], solution(conn, [1,2,3])\n"
  - name: reversed input is fully reordered
    code: "import sqlite3\ndef _c():\n    return sqlite3.connect(':memory:')\nconn = _c()\nassert solution(conn,\
      \ [9,8,7,6]) == [6,7,8,9], solution(conn, [9,8,7,6])\n"
  timeout: 8
