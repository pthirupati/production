title: Slow Queries — Troubleshoot Lab
slug: academy-mysql-084-troubleshoot-slow-query-9
technology: mysql
category: Fix
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating MySQL needs you to resolve `mysql: Slow Queries — Troubleshooting
  Drill` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline MySQL instance with mysql client, InnoDB, grants,
  and slow query log. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The MySQL instance is degraded. Api timeouts correlate with database load
  spikes. Recent changes may exist around slow queries, but do not restart blindly — gather evidence first.
  Production alert: API timeouts correlate with database load spikes. You are on call for mysql and must
  troubleshoot slow queries methodically — triage symptoms, isolate root cause, apply the smallest safe
  fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: API timeouts correlate with database load spikes; Root cause
  is isolated with evidence, not guesswork; Service behavior returns to normal after the fix. Success
  means `systemctl is-active mysqld` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: API timeouts correlate with database load spikes'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The MySQL instance is degraded. Api timeouts correlate with database load spikes. Recent
  changes may exist around slow queries, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status mysqld` and `journalctl -u mysqld -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status mysqld` — note Active/Failed and the last log lines.

    2. Read `journalctl -u mysqld -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart mysqld` and confirm `systemctl is-active mysqld` succeeds.


    WHY: the grader checks real service state, not marker files.'
summary: Complete the slow queries — troubleshoot lab mysql lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
