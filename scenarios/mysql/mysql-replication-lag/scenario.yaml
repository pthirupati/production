coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'A replica is hours behind because parallel apply workers are misconfigured. Fix solution(conn)
    so it returns the worker count to configure: scale with the primary''s write concurrency but never
    exceed the replica''s cpu_count, and never go below 1. Read write_concurrency and cpu_count from cfg(key,
    value). A worker count of 0 means single-threaded apply, which is the bug - it must never be returned.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn):\n    # BUG: returns the configured value verbatim, including the 0 that\
      \ pins\n    # the replica to single-threaded apply and causes the lag.\n    return conn.execute(\n\
      \        \"SELECT value FROM cfg WHERE key='workers'\").fetchone()[0]\n"
    readonly: false
  visible_tests:
  - name: workers scale with write concurrency
    code: "import sqlite3\ndef _seed(workers, write_concurrency, cpu_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\"CREATE TABLE cfg (key TEXT PRIMARY KEY, value INTEGER);\")\n    conn.executemany(\"\
      INSERT INTO cfg VALUES (?,?)\", [\n        ('workers', workers), ('write_concurrency', write_concurrency),\n\
      \        ('cpu_count', cpu_count)])\n    return conn\nconn = _seed(workers=0, write_concurrency=4,\
      \ cpu_count=16)\nassert solution(conn) == 4, solution(conn)\n"
  - name: cpu count is the ceiling
    code: "import sqlite3\ndef _seed(workers, write_concurrency, cpu_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\"CREATE TABLE cfg (key TEXT PRIMARY KEY, value INTEGER);\")\n    conn.executemany(\"\
      INSERT INTO cfg VALUES (?,?)\", [\n        ('workers', workers), ('write_concurrency', write_concurrency),\n\
      \        ('cpu_count', cpu_count)])\n    return conn\nconn = _seed(workers=0, write_concurrency=64,\
      \ cpu_count=8)\nassert solution(conn) == 8, solution(conn)\n"
  hidden_tests:
  - name: never returns zero
    code: "import sqlite3\ndef _seed(workers, write_concurrency, cpu_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\"CREATE TABLE cfg (key TEXT PRIMARY KEY, value INTEGER);\")\n    conn.executemany(\"\
      INSERT INTO cfg VALUES (?,?)\", [\n        ('workers', workers), ('write_concurrency', write_concurrency),\n\
      \        ('cpu_count', cpu_count)])\n    return conn\nconn = _seed(workers=0, write_concurrency=0,\
      \ cpu_count=8)\nassert solution(conn) == 1, solution(conn)\n"
  - name: single cpu replica gets one worker
    code: "import sqlite3\ndef _seed(workers, write_concurrency, cpu_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\"CREATE TABLE cfg (key TEXT PRIMARY KEY, value INTEGER);\")\n    conn.executemany(\"\
      INSERT INTO cfg VALUES (?,?)\", [\n        ('workers', workers), ('write_concurrency', write_concurrency),\n\
      \        ('cpu_count', cpu_count)])\n    return conn\nconn = _seed(workers=0, write_concurrency=32,\
      \ cpu_count=1)\nassert solution(conn) == 1, solution(conn)\n"
  - name: stored workers value is not trusted
    code: "import sqlite3\ndef _seed(workers, write_concurrency, cpu_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\"CREATE TABLE cfg (key TEXT PRIMARY KEY, value INTEGER);\")\n    conn.executemany(\"\
      INSERT INTO cfg VALUES (?,?)\", [\n        ('workers', workers), ('write_concurrency', write_concurrency),\n\
      \        ('cpu_count', cpu_count)])\n    return conn\nconn = _seed(workers=99, write_concurrency=2,\
      \ cpu_count=8)\nassert solution(conn) == 2, solution(conn)\n"
  - name: result is always at least one
    code: "import sqlite3\ndef _seed(workers, write_concurrency, cpu_count):\n    conn = sqlite3.connect(':memory:')\n\
      \    conn.executescript(\"CREATE TABLE cfg (key TEXT PRIMARY KEY, value INTEGER);\")\n    conn.executemany(\"\
      INSERT INTO cfg VALUES (?,?)\", [\n        ('workers', workers), ('write_concurrency', write_concurrency),\n\
      \        ('cpu_count', cpu_count)])\n    return conn\nconn = _seed(workers=0, write_concurrency=0,\
      \ cpu_count=0)\nassert solution(conn) >= 1, solution(conn)\n"
  timeout: 8
