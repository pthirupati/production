technology: MySQL
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly MySQL lab introduces database indexes. You will
  explore B-tree indexes, selectivity, covering indexes, and plan impact on the MySQL
  instance. Read the environment first, then follow the guided steps — no prior production
  experience required.
objectives:
- Understand how database indexes work in this lab environment
- Identify the main status and configuration signals for database indexes
- Confirm you can read the current state confidently before changing anything
initial_state: The MySQL instance is online with a starter database indexes setup.
  Some pieces are intentionally incomplete so you can learn how they fit together.
  Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — EXPLAIN/EXPLAIN ANALYZE and index usage views.

    2. Write down what looks normal versus wrong or missing for database indexes.

    3. Recall the core idea: B-tree indexes, selectivity, covering indexes, and plan
    impact. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for database indexes.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — EXPLAIN/EXPLAIN ANALYZE and index usage views.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — plans use the intended index and latency drops.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-mysql-061-learn-indexes-7.conf`,
    then click Check Solution.'
