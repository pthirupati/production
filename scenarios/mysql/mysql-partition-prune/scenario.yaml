coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'A monthly partitioned logs table scans every partition. Fix solution(conn) so it returns
    the partition names the planner must actually read for a date range, sorted ascending. Partitions
    in part(part_name, month) are named by month as ''YYYY-MM''; include a partition only when its month
    falls within the start_month..end_month range inclusive. Compare months as strings - the ''YYYY-MM''
    format sorts correctly.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn, start_month, end_month):\n    # BUG: returns every partition, which is\
      \ the full scan the ticket is\n    # about - the range arguments are never applied.\n    return\
      \ sorted(r[0] for r in conn.execute(\"SELECT part_name FROM part\"))\n"
    readonly: false
  visible_tests:
  - name: only in-range partitions are read
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE part (part_name TEXT, month TEXT);\")\n    conn.executemany(\"INSERT INTO part VALUES\
      \ (?,?)\", rows)\n    return conn\nconn = _seed([('p2026_01','2026-01'),('p2026_02','2026-02'),('p2026_03','2026-03')])\n\
      assert solution(conn, '2026-02', '2026-03') == ['p2026_02','p2026_03'], solution(conn, '2026-02',\
      \ '2026-03')\n"
  - name: out-of-range partitions are pruned
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE part (part_name TEXT, month TEXT);\")\n    conn.executemany(\"INSERT INTO part VALUES\
      \ (?,?)\", rows)\n    return conn\nconn = _seed([('p2026_01','2026-01'),('p2026_02','2026-02')])\n\
      assert solution(conn, '2026-02', '2026-02') == ['p2026_02'], solution(conn, '2026-02', '2026-02')\n"
  hidden_tests:
  - name: range bounds are inclusive
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE part (part_name TEXT, month TEXT);\")\n    conn.executemany(\"INSERT INTO part VALUES\
      \ (?,?)\", rows)\n    return conn\nconn = _seed([('a','2026-01'),('b','2026-02'),('c','2026-03')])\n\
      assert solution(conn, '2026-01', '2026-03') == ['a','b','c'], solution(conn, '2026-01', '2026-03')\n"
  - name: range matching nothing prunes everything
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE part (part_name TEXT, month TEXT);\")\n    conn.executemany(\"INSERT INTO part VALUES\
      \ (?,?)\", rows)\n    return conn\nconn = _seed([('a','2026-01')])\nassert solution(conn, '2027-01',\
      \ '2027-12') == [], solution(conn, '2027-01', '2027-12')\n"
  - name: no partitions returns empty
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE part (part_name TEXT, month TEXT);\")\n    conn.executemany(\"INSERT INTO part VALUES\
      \ (?,?)\", rows)\n    return conn\nconn = _seed([])\nassert solution(conn, '2026-01', '2026-12')\
      \ == [], solution(conn, '2026-01', '2026-12')\n"
  - name: year boundary is handled by string order
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE part (part_name TEXT, month TEXT);\")\n    conn.executemany(\"INSERT INTO part VALUES\
      \ (?,?)\", rows)\n    return conn\nconn = _seed([('a','2025-12'),('b','2026-01')])\nassert solution(conn,\
      \ '2026-01', '2026-06') == ['b'], solution(conn, '2026-01', '2026-06')\n"
  timeout: 8
