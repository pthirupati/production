title: Total Revenue Per Category
slug: mysql-revenue-by-category
technology: mysql
category: MySQL
description: A finance dashboard needs total revenue grouped by product category, where revenue for a
  line item is price times quantity. The starter sums only the unit price and ignores quantity, so
  every multi-unit sale is undercounted. Fix the aggregate so revenue is summed correctly.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Low
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Group rows by category with GROUP BY
- Aggregate revenue as the sum of price times quantity
- Order categories from highest revenue to lowest
initial_state: A finance dashboard needs total revenue grouped by product category, where revenue for
  a line item is price times quantity. The starter sums only the unit price and ignores quantity, so
  every multi-unit sale is undercounted. Fix the aggregate so revenue is summed correctly.
solution_explanation: |
  Revenue for a line is price * quantity, so the aggregate must be SUM(price * quantity), not
  SUM(price). Summing only price treats every line as a single unit and undercounts any order with
  quantity greater than one. GROUP BY category collapses the lines per category; ORDER BY revenue
  DESC, category ASC gives a stable, dashboard-friendly ranking.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix solution(conn) so it returns (category, revenue) for each category, where revenue is the sum
    of price * quantity over that category's line items. Order by revenue descending, then category
    ascending. The starter forgot to multiply by quantity.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      import sqlite3

      def solution(conn):
          # BUG: revenue per line is price * quantity, but this sums only price,
          # so any line with quantity > 1 is undercounted.
          return conn.execute(
              """
              SELECT category, SUM(price) AS revenue
              FROM order_items
              GROUP BY category
              ORDER BY revenue DESC, category ASC
              """
          ).fetchall()
    readonly: false
  visible_tests:
  - name: revenue multiplies price by quantity
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE order_items (id INTEGER PRIMARY KEY, category TEXT, price REAL, quantity INTEGER);"
          "INSERT INTO order_items (id, category, price, quantity) VALUES "
          "(1,'Books',10.0,2),(2,'Books',5.0,1),(3,'Toys',20.0,3),(4,'Toys',20.0,1),(5,'Games',30.0,1);"
      )
      assert solution(conn) == [('Toys', 80.0), ('Games', 30.0), ('Books', 25.0)], solution(conn)
  - name: single line per category
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE order_items (id INTEGER PRIMARY KEY, category TEXT, price REAL, quantity INTEGER);"
          "INSERT INTO order_items (id, category, price, quantity) VALUES "
          "(1,'A',4.0,5),(2,'B',100.0,1);"
      )
      assert solution(conn) == [('B', 100.0), ('A', 20.0)], solution(conn)
  hidden_tests:
  - name: ties broken by category name
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE order_items (id INTEGER PRIMARY KEY, category TEXT, price REAL, quantity INTEGER);"
          "INSERT INTO order_items (id, category, price, quantity) VALUES "
          "(1,'Zeta',10.0,1),(2,'Alpha',10.0,1);"
      )
      assert solution(conn) == [('Alpha', 10.0), ('Zeta', 10.0)], solution(conn)
  - name: quantity actually matters
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE order_items (id INTEGER PRIMARY KEY, category TEXT, price REAL, quantity INTEGER);"
          "INSERT INTO order_items (id, category, price, quantity) VALUES "
          "(1,'Bulk',2.0,100);"
      )
      assert solution(conn) == [('Bulk', 200.0)], solution(conn)
  - name: every category appears exactly once
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE order_items (id INTEGER PRIMARY KEY, category TEXT, price REAL, quantity INTEGER);"
          "INSERT INTO order_items (id, category, price, quantity) VALUES "
          "(1,'X',1.0,1),(2,'X',1.0,1),(3,'Y',1.0,1);"
      )
      rows = solution(conn)
      cats = [r[0] for r in rows]
      assert sorted(cats) == ['X', 'Y'], cats
      assert len(cats) == len(set(cats)), cats
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Compare a category that has quantity 1 everywhere with one that has larger quantities — the larger one is undercounted.
- order: 2
  cost: 20
  content: The revenue of one line item is price * quantity, not just price. The aggregate must multiply before summing.
- order: 3
  cost: 30
  content: 'Change the aggregate to SUM(price * quantity) AS revenue.'
