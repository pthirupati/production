title: Total Revenue Per Category
slug: mysql-revenue-by-category
technology: mysql
category: Fix
description: 'CONTEXT: A team operating MySQL needs you to resolve `Total Revenue Per Category` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline MySQL instance with mysql client, InnoDB, grants,
  and slow query log. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A finance dashboard needs total revenue grouped by product category, where
  revenue for a line item is price times quantity. The starter sums only the unit price and ignores quantity,
  so every multi-unit sale is undercounted. Fix the aggregate so revenue is summed correctly.


  OBJECTIVE: Group rows by category with GROUP BY; Aggregate revenue as the sum of price times quantity;
  Order categories from highest revenue to lowest. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Low
time_limit: 900
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Group rows by category with GROUP BY
- Aggregate revenue as the sum of price times quantity
- Order categories from highest revenue to lowest
initial_state: A finance dashboard needs total revenue grouped by product category, where revenue for
  a line item is price times quantity. The starter sums only the unit price and ignores quantity, so every
  multi-unit sale is undercounted. Fix the aggregate so revenue is summed correctly.
solution_explanation: 'Revenue for a line is price * quantity, so the aggregate must be SUM(price * quantity),
  not

  SUM(price). Summing only price treats every line as a single unit and undercounts any order with

  quantity greater than one. GROUP BY category collapses the lines per category; ORDER BY revenue

  DESC, category ASC gives a stable, dashboard-friendly ranking.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Fix solution(conn) so it returns (category, revenue) for each category, where revenue
    is the sum

    of price * quantity over that category''s line items. Order by revenue descending, then category

    ascending. The starter forgot to multiply by quantity.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "import sqlite3\n\ndef solution(conn):\n    # BUG: revenue per line is price * quantity,\
      \ but this sums only price,\n    # so any line with quantity > 1 is undercounted.\n    return conn.execute(\n\
      \        \"\"\"\n        SELECT category, SUM(price) AS revenue\n        FROM order_items\n    \
      \    GROUP BY category\n        ORDER BY revenue DESC, category ASC\n        \"\"\"\n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: revenue multiplies price by quantity
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ order_items (id INTEGER PRIMARY KEY, category TEXT, price REAL, quantity INTEGER);\"\n    \"INSERT\
      \ INTO order_items (id, category, price, quantity) VALUES \"\n    \"(1,'Books',10.0,2),(2,'Books',5.0,1),(3,'Toys',20.0,3),(4,'Toys',20.0,1),(5,'Games',30.0,1);\"\
      \n)\nassert solution(conn) == [('Toys', 80.0), ('Games', 30.0), ('Books', 25.0)], solution(conn)\n"
  - name: single line per category
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ order_items (id INTEGER PRIMARY KEY, category TEXT, price REAL, quantity INTEGER);\"\n    \"INSERT\
      \ INTO order_items (id, category, price, quantity) VALUES \"\n    \"(1,'A',4.0,5),(2,'B',100.0,1);\"\
      \n)\nassert solution(conn) == [('B', 100.0), ('A', 20.0)], solution(conn)\n"
  hidden_tests:
  - name: ties broken by category name
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ order_items (id INTEGER PRIMARY KEY, category TEXT, price REAL, quantity INTEGER);\"\n    \"INSERT\
      \ INTO order_items (id, category, price, quantity) VALUES \"\n    \"(1,'Zeta',10.0,1),(2,'Alpha',10.0,1);\"\
      \n)\nassert solution(conn) == [('Alpha', 10.0), ('Zeta', 10.0)], solution(conn)\n"
  - name: quantity actually matters
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ order_items (id INTEGER PRIMARY KEY, category TEXT, price REAL, quantity INTEGER);\"\n    \"INSERT\
      \ INTO order_items (id, category, price, quantity) VALUES \"\n    \"(1,'Bulk',2.0,100);\"\n)\nassert\
      \ solution(conn) == [('Bulk', 200.0)], solution(conn)\n"
  - name: every category appears exactly once
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ order_items (id INTEGER PRIMARY KEY, category TEXT, price REAL, quantity INTEGER);\"\n    \"INSERT\
      \ INTO order_items (id, category, price, quantity) VALUES \"\n    \"(1,'X',1.0,1),(2,'X',1.0,1),(3,'Y',1.0,1);\"\
      \n)\nrows = solution(conn)\ncats = [r[0] for r in rows]\nassert sorted(cats) == ['X', 'Y'], cats\n\
      assert len(cats) == len(set(cats)), cats\n"
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status mysqld` and tail `/var/log/mysqld.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Read the error log for InnoDB or permission failures.

    2. Check disk space with `df -h`.

    3. Verify `my.cnf` for bad paths or bind-address.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix config or ownership under `/var/lib/mysql`.

    2. `systemctl restart mysqld`.

    3. Confirm `systemctl is-active mysqld` returns active.


    WHY: MySQL often fails silently until you read the error log.'
