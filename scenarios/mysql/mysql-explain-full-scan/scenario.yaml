coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'EXPLAIN shows type=ALL on a high-traffic query. Fix solution(conn) so it returns the
    access type MySQL would report for a lookup on the given column: return ''ref'' when an index exists
    whose FIRST column is the filtered column, otherwise ''ALL''. An index that merely contains the column
    in a later position cannot be used for this lookup, so it must still report ''ALL''. conn has idx(index_name,
    seq_in_index, column_name).

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn, column):\n    # BUG: any index merely mentioning the column counts, but\
      \ MySQL can only\n    # use an index whose leftmost column is the one being filtered.\n    hit =\
      \ conn.execute(\n        \"SELECT COUNT(*) FROM idx WHERE column_name = ?\", (column,)).fetchone()[0]\n\
      \    return 'ref' if hit else 'ALL'\n"
    readonly: false
  visible_tests:
  - name: leading column uses the index
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE idx (index_name TEXT, seq_in_index INTEGER, column_name TEXT);\")\n    conn.executemany(\"\
      INSERT INTO idx VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([('i1',1,'customer_id'),('i1',2,'created_at')])\n\
      assert solution(conn, 'customer_id') == 'ref', solution(conn, 'customer_id')\n"
  - name: non-leading column still scans
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE idx (index_name TEXT, seq_in_index INTEGER, column_name TEXT);\")\n    conn.executemany(\"\
      INSERT INTO idx VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([('i1',1,'customer_id'),('i1',2,'created_at')])\n\
      assert solution(conn, 'created_at') == 'ALL', solution(conn, 'created_at')\n"
  hidden_tests:
  - name: no indexes at all scans
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE idx (index_name TEXT, seq_in_index INTEGER, column_name TEXT);\")\n    conn.executemany(\"\
      INSERT INTO idx VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([])\nassert solution(conn,\
      \ 'customer_id') == 'ALL', solution(conn, 'customer_id')\n"
  - name: unrelated column scans
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE idx (index_name TEXT, seq_in_index INTEGER, column_name TEXT);\")\n    conn.executemany(\"\
      INSERT INTO idx VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([('i1',1,'customer_id')])\n\
      assert solution(conn, 'total') == 'ALL', solution(conn, 'total')\n"
  - name: a second index can provide the leading column
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE idx (index_name TEXT, seq_in_index INTEGER, column_name TEXT);\")\n    conn.executemany(\"\
      INSERT INTO idx VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([('i1',1,'customer_id'),('i2',1,'created_at')])\n\
      assert solution(conn, 'created_at') == 'ref', solution(conn, 'created_at')\n"
  - name: third-position column scans
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE idx (index_name TEXT, seq_in_index INTEGER, column_name TEXT);\")\n    conn.executemany(\"\
      INSERT INTO idx VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([('i1',1,'a'),('i1',2,'b'),('i1',3,'c')])\n\
      assert solution(conn, 'c') == 'ALL', solution(conn, 'c')\n"
  timeout: 8
