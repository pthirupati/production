- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: target queries use efficient plans and p95 latency improves.
    Document the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-mysql-024-troubleshoot-slow-query-3.conf`,
    and rerun Check Solution.'
