hints:
- order: 1
  cost: 10
  content: Inspect backup schedules, last success time, and destination free space.
- order: 2
  cost: 15
  content: Run or repair the backup job, then perform a controlled restore to a scratch
    location.
- order: 3
  cost: 20
  content: Compare restored data to source. Complete the lab via `# FIXED-OK` in `/opt/fixitlab/academy/academy-mysql-009-backup-charset.conf`.
