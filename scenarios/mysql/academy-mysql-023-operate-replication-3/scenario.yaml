description: 'Day-2 operations: perform a routine database replication task safely
  in MySQL. Follow change control — inspect, change, verify — while working with primary/replica
  topology, lag, failover, and consistency.'
objectives:
- Day-2 database replication work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The MySQL instance is healthy enough for scheduled work on database
  replication. Complete the maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — replication status views, `SHOW REPLICA STATUS`,
    or `pg_stat_replication`.

    2. Write down what looks normal versus wrong or missing for database replication.

    3. Recall the core idea: primary/replica topology, lag, failover, and consistency.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for database replication.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — replication status views, `SHOW REPLICA STATUS`,
    or `pg_stat_replication`.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup
    first if the change is risky.

    3. Verify the result — replication is streaming, lag is within SLO, and read routing
    works.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-mysql-023-operate-replication-3.conf`,
    then click Check Solution.'
