title: 'MySQL: Users And Grants — Build From Scratch'
slug: academy-mysql-092-build-users-grants-10
technology: MySQL
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Build users and grants from scratch in this MySQL lab. You start from
  a minimal environment and must produce a working configuration that demonstrates
  accounts, hosts, and privileges. Plan, implement, then prove it works.
objectives:
- A working users and grants setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The MySQL instance is ready but users and grants is not configured
  yet. Required tools may already be installed; your job is to create the configuration
  and bring the capability online.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `SELECT user,host FROM mysql.user` and `SHOW GRANTS`.

    2. Write down what looks normal versus wrong or missing for users and grants.

    3. Recall the core idea: accounts, hosts, and privileges. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for users and grants.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `SELECT user,host FROM mysql.user` and `SHOW GRANTS`.

    2. Create the smallest working slice of users and grants first, validate it, then
    add the remaining pieces one at a time.

    3. Verify the result — the account connects with correct privileges.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-mysql-092-build-users-grants-10.conf`,
    then click Check Solution.'
