title: 'MySQL: Users And Grants — Build From Scratch'
slug: academy-mysql-052-build-users-grants-6
technology: MySQL
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Service operations lab. The `mysqld` systemd unit is **failed/inactive** on this host — a
  realistic fault for Build From Scratch workflows that depend on it. Diagnose with `systemctl status
  mysqld` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active mysqld`.
objectives:
- The `mysqld` service is active (running)
- '`systemctl is-active mysqld` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `mysqld` service is not running (`systemctl is-active mysqld` → inactive/failed). Dependent
  Build From Scratch tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `SELECT user,host FROM mysql.user` and `SHOW GRANTS`.

    2. Write down what looks normal versus wrong or missing for users and grants.

    3. Recall the core idea: accounts, hosts, and privileges. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for users and grants.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `SELECT user,host FROM mysql.user` and `SHOW GRANTS`.

    2. Create the smallest working slice of users and grants first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — the account connects with correct privileges.

    4. Click Check Solution once `systemctl is-active mysqld` returns active.'
