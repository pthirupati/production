title: 'MySQL: Innodb — Automation Practice'
slug: academy-mysql-007-automation-innodb
technology: MySQL
category: Automation
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Service operations lab. The `mysqld` systemd unit is **failed/inactive** on this host — a
  realistic fault for Automation Practice workflows that depend on it. Diagnose with `systemctl status
  mysqld` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active mysqld`.
objectives:
- The `mysqld` service is active (running)
- '`systemctl is-active mysqld` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `mysqld` service is not running (`systemctl is-active mysqld` → inactive/failed). Dependent
  Automation Practice tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `SHOW ENGINE INNODB STATUS` and metrics.

    2. Write down what looks normal versus wrong or missing for InnoDB.

    3. Recall the core idea: buffer pool, redo log, and row locking. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for InnoDB.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `SHOW ENGINE INNODB STATUS` and metrics.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — InnoDB is tuned for the workload.

    4. Click Check Solution once `systemctl is-active mysqld` returns active.'
