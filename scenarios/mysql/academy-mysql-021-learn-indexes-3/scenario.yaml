title: 'MySQL: Database Indexes — Fundamentals Lab'
slug: academy-mysql-021-learn-indexes-3
technology: MySQL
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly MySQL lab introduces database indexes. You will
  explore B-tree indexes, selectivity, covering indexes, and plan impact on the MySQL
  instance. Read the environment first, then complete the guided steps — no prior
  production experience required.
objectives:
- Understand how database indexes work in this lab environment
- Identify the main status and configuration signals for database indexes
- Confirm you can read the current state confidently before changing anything
initial_state: The MySQL instance is online with a starter database indexes setup.
  Some pieces are intentionally incomplete so you can learn how the pieces fit together.
  Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: EXPLAIN/EXPLAIN ANALYZE and index usage views. Write
    down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — B-tree indexes, selectivity, covering indexes, and plan impact.
    Make one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-mysql-021-learn-indexes-3.conf`, then click
    Check Solution.
