description: 'CONTEXT: A team operating MySQL needs you to resolve `mysql: Innodb — Automation Practice`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline MySQL instance with mysql client, InnoDB, grants,
  and slow query log. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for InnoDB. Automate the boring parts
  without hiding important safety checks. Automation lab: remove toil around InnoDB. Codify repeatable
  steps for buffer pool, redo log, and row locking and prove the automation is idempotent.


  OBJECTIVE: Day-2 InnoDB work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `systemctl is-active mysqld` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 InnoDB work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for InnoDB. Automate the boring parts without hiding
  important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `SHOW ENGINE INNODB STATUS` and metrics.

    2. Write down what looks normal versus wrong or missing for InnoDB.

    3. Recall the core idea: buffer pool, redo log, and row locking. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status mysqld` — note Active/Failed and the last log lines.

    2. Read `journalctl -u mysqld -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `SHOW ENGINE INNODB STATUS` and metrics.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — InnoDB is tuned for the workload.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
