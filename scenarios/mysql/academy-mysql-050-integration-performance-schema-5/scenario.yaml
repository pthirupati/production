description: Service operations lab. The `mysqld` systemd unit is **failed/inactive** on this host — a
  realistic fault for Integration Lab workflows that depend on it. Diagnose with `systemctl status mysqld`
  and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active mysqld`.
objectives:
- The `mysqld` service is active (running)
- '`systemctl is-active mysqld` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `mysqld` service is not running (`systemctl is-active mysqld` → inactive/failed). Dependent
  Integration Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — performance_schema summary tables.

    2. Write down what looks normal versus wrong or missing for performance schema.

    3. Recall the core idea: instruments, consumers, and digests. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for performance schema.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — performance_schema summary tables.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — the slow path is identified from instrumentation.

    4. Click Check Solution once `systemctl is-active mysqld` returns active.'
cross_technology: true
