title: Fix the Customer Report That Drops Newcomers
slug: mysql-fix-inner-vs-left-join
technology: mysql
category: MySQL
description: A "total spend per customer" report must list every customer, including those who have
  not ordered yet (shown as 0). The starter uses an INNER JOIN, which silently drops any customer
  with no matching orders. Switch to a LEFT JOIN and handle the resulting NULLs.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See how an INNER JOIN hides customers with no orders
- Use a LEFT JOIN to keep every customer row
- Convert the NULL sum of a zero-order customer to 0 with COALESCE
initial_state: A "total spend per customer" report must list every customer, including those who have
  not ordered yet (shown as 0). The starter uses an INNER JOIN, which silently drops any customer with
  no matching orders. Switch to a LEFT JOIN and handle the resulting NULLs.
solution_explanation: |
  An INNER JOIN only emits rows where both sides match, so a customer with no orders disappears from
  the report entirely — a dangerous silent omission. A LEFT JOIN keeps every customer row and fills
  the order columns with NULL when there is no match. SUM over an all-NULL group is itself NULL, so
  COALESCE(SUM(o.amount), 0) turns a no-order customer's total into 0.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix solution(conn) so it returns (name, total_spent) for EVERY customer ordered by name.
    Customers with no orders must appear with a total of 0. The starter uses an INNER JOIN and
    drops them.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      import sqlite3

      def solution(conn):
          # BUG: INNER JOIN drops customers who have no orders. The report must
          # include every customer, with 0 for those who have not ordered yet.
          return conn.execute(
              """
              SELECT c.name, COALESCE(SUM(o.amount), 0) AS total_spent
              FROM customers c
              JOIN orders o ON o.customer_id = c.id
              GROUP BY c.id, c.name
              ORDER BY c.name
              """
          ).fetchall()
    readonly: false
  visible_tests:
  - name: zero-order customer appears with 0
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);"
          "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL);"
          "INSERT INTO customers (id, name) VALUES (1,'Ada'),(2,'Bo'),(3,'Cy');"
          "INSERT INTO orders (id, customer_id, amount) VALUES (10,1,50.0),(11,1,30.0),(12,3,20.0);"
      )
      assert solution(conn) == [('Ada', 80.0), ('Bo', 0), ('Cy', 20.0)], solution(conn)
  - name: every customer is present
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);"
          "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL);"
          "INSERT INTO customers (id, name) VALUES (1,'Ada'),(2,'Bo'),(3,'Cy');"
          "INSERT INTO orders (id, customer_id, amount) VALUES (10,1,50.0),(11,1,30.0),(12,3,20.0);"
      )
      assert len(solution(conn)) == 3, solution(conn)
  hidden_tests:
  - name: brand-new customer with no orders
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);"
          "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL);"
          "INSERT INTO customers (id, name) VALUES (1,'New');"
      )
      assert solution(conn) == [('New', 0)], solution(conn)
  - name: all customers have orders
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);"
          "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL);"
          "INSERT INTO customers (id, name) VALUES (1,'Ada'),(2,'Bo');"
          "INSERT INTO orders (id, customer_id, amount) VALUES (10,1,5.0),(11,2,7.0);"
      )
      assert solution(conn) == [('Ada', 5.0), ('Bo', 7.0)], solution(conn)
  - name: multiple orders summed per customer
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);"
          "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL);"
          "INSERT INTO customers (id, name) VALUES (1,'Big'),(2,'Empty');"
          "INSERT INTO orders (id, customer_id, amount) VALUES (10,1,1.0),(11,1,2.0),(12,1,3.0);"
      )
      assert solution(conn) == [('Big', 6.0), ('Empty', 0)], solution(conn)
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Add a customer who has no rows in orders. With the current query they vanish from the result entirely.
- order: 2
  cost: 20
  content: An INNER JOIN keeps only matching pairs. To keep every customer regardless of orders, you need a LEFT JOIN from customers.
- order: 3
  cost: 30
  content: 'Use LEFT JOIN orders o ON o.customer_id = c.id; SUM over no rows is NULL, so keep COALESCE(SUM(o.amount), 0).'
