title: Fix the Stateful Global Regex in isHex
slug: js-fix-regex-global-lastindex
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the Stateful Global Regex
  in isHex` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: isHex(s) should return whether s is a string of one or more hex digits, but
  it reuses a single regex literal declared with the global (g) flag and calls .test() on it. A global
  regex keeps lastIndex between calls, so repeated tests of the SAME string alternate true/false. Fix
  it so each call is independent (drop the g flag, or reset/avoid shared state).


  OBJECTIVE: Reproduce the alternating true/false on repeated calls; Understand that /g regexes carry
  lastIndex across .test(); Make every call independent and correct. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
