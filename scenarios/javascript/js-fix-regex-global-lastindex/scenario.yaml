solution_explanation: 'A global-flag regex remembers lastIndex between .test() calls, so it alternates
  results for the same input. Removing the g flag makes each match start from the beginning, so the test
  is stateless and correct.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix isHex(s): return true iff s is one or more hex digits (0-9a-fA-F). Repeated calls\
    \ with the same input must give the same answer.\n  isHex('1a2f') -> true (every time)\nClick Run\
    \ to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "const HEX = /^[0-9a-f]+$/gi; // global flag => stateful lastIndex\n\nfunction isHex(s) {\n\
      \  return HEX.test(s); // alternates true/false on repeated same input\n}\n"
    readonly: false
  visible_tests:
  - name: valid hex
    code: 'assert(isHex(''1a2f'') === true, ''should be hex'');

      '
  - name: stable on repeat
    code: 'assert(isHex(''1a2f'') === true && isHex(''1a2f'') === true && isHex(''1a2f'') === true, ''must
      not alternate'');

      '
  hidden_tests:
  - name: uppercase hex
    code: 'assert(isHex(''FF'') === true);

      '
  - name: non-hex
    code: 'assert(isHex(''xyz'') === false);

      '
  - name: empty is false
    code: 'assert(isHex('''') === false);

      '
  - name: repeated non-hex stable
    code: 'assert(isHex(''zz'') === false && isHex(''zz'') === false);

      '
  - name: mixed invalid
    code: 'assert(isHex(''1g'') === false);

      '
  timeout: 8
