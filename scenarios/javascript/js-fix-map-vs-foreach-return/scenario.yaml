  a single lab-primary node exposing modules, browser console, and Node tooling; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: doubleAll(nums) should return a new array with each value doubled, but it
  uses forEach (which returns undefined) instead of map, so the function returns undefined. Switch to
  map.

  OBJECTIVE: See the function return undefined; Use map to build and return the array; Double each element.
  Acceptance criteria: the change is minimal and reversible, and success means all hidden tests pass.

