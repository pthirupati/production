title: Fix doubleAll Returning undefined
slug: js-fix-map-vs-foreach-return
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix doubleAll Returning undefined`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: doubleAll(nums) should return a new array with each value doubled, but it
  uses forEach (which returns undefined) instead of map, so the function returns undefined. Switch to
  map.


  OBJECTIVE: See the function return undefined; Use map to build and return the array; Double each element.
  Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
