- Double each element
initial_state: doubleAll(nums) should return a new array with each value doubled, but it uses forEach
  (which returns undefined) instead of map, so the function returns undefined. Switch to map.
solution_explanation: 'forEach returns undefined and discards the callback results. map collects the transformed
  values into a new array, which we return.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix doubleAll(nums): return a new array of doubled values.\n  doubleAll([1,2,3]) -> [2,4,6]\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function doubleAll(nums) {\n  nums.forEach((n) => n * 2); // forEach returns undefined\n\
      }\n"
    readonly: false
  visible_tests:
  - name: doubles
    code: 'assert(JSON.stringify(doubleAll([1,2,3])) === JSON.stringify([2,4,6]), JSON.stringify(doubleAll([1,2,3])));

      '
  - name: empty
    code: 'assert(JSON.stringify(doubleAll([])) === JSON.stringify([]), JSON.stringify(doubleAll([])));

      '
  hidden_tests:
  - name: returns an array
    code: 'assert(Array.isArray(doubleAll([1])), ''should return an array'');

      '
  - name: negatives
    code: 'assert(JSON.stringify(doubleAll([-1, 0, 2])) === JSON.stringify([-2, 0, 4]), JSON.stringify(doubleAll([-1,
      0, 2])));

      '
  - name: does not mutate input
    code: 'const src = [1,2];

      doubleAll(src);

      assert(JSON.stringify(src) === JSON.stringify([1,2]));

      '
  timeout: 8
