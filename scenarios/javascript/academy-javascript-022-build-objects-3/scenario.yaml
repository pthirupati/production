tasks:
- id: task_1
  title: Objects — Build Lab
  description: Implement the objects exercise in the browser IDE and pass all tests.
  background: 'This javascript lab teaches systematic troubleshooting: observe, hypothesize,
    change, verify.'
  validation:
    type: script
