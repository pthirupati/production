solution:
  summary: Implement the function so visible and hidden tests pass in the coding IDE.
  files_changed:
  - solution.js
  commands_run: []
  reference_docs: javascript-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx`` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
coding_mode: true
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: 'Implement pick(obj, keys) → new object with only listed keys. Do
    not mutate obj.

    Click Run to try it, then Check Solution to grade.

    '
  files:
  - path: solution.js
    content: "function pick(obj, keys) {\n  // TODO\n}\n"
    readonly: false
  visible_tests:
  - name: basic
    code: assert(JSON.stringify(pick({a:1,b:2,c:3}, ['a','c'])) === JSON.stringify({a:1,c:3}));
  hidden_tests:
  - name: missing
    code: assert(JSON.stringify(pick({a:1}, ['a','z'])) === JSON.stringify({a:1}));
  - name: empty
    code: assert(JSON.stringify(pick({a:1}, [])) === JSON.stringify({}));
  - name: no-mutate
    code: const o={a:1,b:2}; pick(o,['a']); assert(o.b===2);
  timeout: 8
