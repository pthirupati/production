title: Fix sumArray Accumulator Start
slug: js-fix-sum-array-init
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix sumArray Accumulator Start`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: sumArray(nums) should add up all the numbers, but reduce is called without
  an initial value, so on an EMPTY array it throws ''Reduce of empty array with no initial value''. Provide
  the initial accumulator so empty returns 0 and totals stay correct.


  OBJECTIVE: Reproduce the empty-array reduce error; Pass 0 as the reduce initial value; Return correct
  sums including the empty case. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
