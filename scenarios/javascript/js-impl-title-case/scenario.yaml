title: Implement titleCase
slug: js-impl-title-case
category: Build
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Implement titleCase` during a
  realistic incident. The business impact is reduced service reliability until the underlying state is
  repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement titleCase(s): capitalize the first letter of each space-separated
  word and lowercase the rest. Single spaces between words. The stub is empty so tests fail.


  OBJECTIVE: Split on spaces into words; Capitalize the first letter, lowercase the rest of each word;
  Rejoin with single spaces. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Split on spaces into words
- Capitalize the first letter, lowercase the rest of each word
- Rejoin with single spaces
initial_state: 'Implement titleCase(s): capitalize the first letter of each space-separated word and lowercase
  the rest. Single spaces between words. The stub is empty so tests fail.'
solution_explanation: 'Splitting on spaces, transforming each word''s first letter up and the remainder
  down, then rejoining produces clean title case.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: "Implement titleCase(s).\n  titleCase('hello WORLD') -> 'Hello World'\nClick Run to try\
    \ it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function titleCase(s) {\n  // TODO: capitalize each word, lowercasing the rest\n}\n"
    readonly: false
  visible_tests:
  - name: mixed case
    code: 'assert(titleCase(''hello WORLD'') === ''Hello World'');

      '
  - name: single word
    code: 'assert(titleCase(''javaSCRIPT'') === ''Javascript'');

      '
  hidden_tests:
  - name: three words
    code: 'assert(titleCase(''the quick brown'') === ''The Quick Brown'');

      '
  - name: already title
    code: 'assert(titleCase(''Foo Bar'') === ''Foo Bar'');

      '
  - name: empty
    code: 'assert(titleCase('''') === '''');

      '
  - name: single letters
    code: 'assert(titleCase(''a b c'') === ''A B C'');

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.js`, read the instructions, and run the visible tests to see
    which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Capitalize the first letter, lowercase the rest of each word.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
