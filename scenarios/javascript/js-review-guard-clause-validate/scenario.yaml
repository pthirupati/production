objectives:
- Reject negative weights with a guard clause
- Return 0 for zero weight
- Compute the documented cost otherwise
initial_state: 'shippingCost(weight) returns a cost based on weight, but it has no validation: negative
  weights produce negative costs, and zero should be free. Refactor with guard clauses: weight < 0 throws
  a RangeError; weight === 0 returns 0; otherwise base 5 + 2 per kg. The tests pin these rules.'
solution_explanation: 'Guard clauses make the edge cases explicit: negatives are rejected and zero is
  free, leaving the formula for the normal path.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: review
  instructions: "Refactor shippingCost(weight): if weight < 0 throw RangeError; if weight === 0 return\
    \ 0; else return 5 + 2 * weight.\n  shippingCost(3) -> 11\nClick Run to try it, then Check Solution\
    \ to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function shippingCost(weight) {\n  return 5 + 2 * weight; // no validation; negative ->\
      \ negative cost; 0 not free\n}\n"
    readonly: false
  visible_tests:
  - name: normal weight
    code: 'assert(shippingCost(3) === 11);

      '
  - name: zero is free
    code: 'assert(shippingCost(0) === 0, shippingCost(0));

      '
  hidden_tests:
  - name: negative throws
    code: 'let threw = false;

      try { shippingCost(-1); } catch (e) { threw = e instanceof RangeError; }

      assert(threw, ''should throw RangeError on negative'');

      '
  - name: one kg
    code: 'assert(shippingCost(1) === 7);

      '
  - name: large weight
    code: 'assert(shippingCost(10) === 25);

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: refactor is not behaving as the scenario objectives
    require. This lab is about refactor — how refactor behaves in a JavaScript environment. Read the objectives
    and the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For refactor problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `solution.js`, read the instructions, and run the visible tests to see which assertion fails
    first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of refactor is at fault.

    2. Re-run the most relevant of modules, browser console, and Node tooling focused on just that part
    to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''refactor is not
    behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `solution.js` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.

    WHY: coding labs grade against hidden test cases, not marker files.'
