title: 'Refactor: Validate the Shipping Calculator'
slug: js-review-guard-clause-validate
category: JavaScript Development
description: 'shippingCost(weight) returns a cost based on weight, but it has no validation: negative
  weights produce negative costs, and zero should be free. Refactor with guard clauses: weight < 0 throws
  a RangeError; weight === 0 returns 0; otherwise base 5 + 2 per kg. The tests pin these rules.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Reject negative weights with a guard clause
- Return 0 for zero weight
- Compute the documented cost otherwise
initial_state: 'shippingCost(weight) returns a cost based on weight, but it has no validation: negative
  weights produce negative costs, and zero should be free. Refactor with guard clauses: weight < 0 throws
  a RangeError; weight === 0 returns 0; otherwise base 5 + 2 per kg. The tests pin these rules.'
solution_explanation: |
  Guard clauses make the edge cases explicit: negatives are rejected and zero is free, leaving the formula for the normal path.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: review
  instructions: |
    Refactor shippingCost(weight): if weight < 0 throw RangeError; if weight === 0 return 0; else return 5 + 2 * weight.
      shippingCost(3) -> 11
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function shippingCost(weight) {
        return 5 + 2 * weight; // no validation; negative -> negative cost; 0 not free
      }
    readonly: false
  visible_tests:
  - name: normal weight
    code: |
      assert(shippingCost(3) === 11);
  - name: zero is free
    code: |
      assert(shippingCost(0) === 0, shippingCost(0));
  hidden_tests:
  - name: negative throws
    code: |
      let threw = false;
      try { shippingCost(-1); } catch (e) { threw = e instanceof RangeError; }
      assert(threw, 'should throw RangeError on negative');
  - name: one kg
    code: |
      assert(shippingCost(1) === 7);
  - name: large weight
    code: |
      assert(shippingCost(10) === 25);
  timeout: 8
hints:
- order: 1
  cost: 10
  content: shippingCost(-1) returns 3, and shippingCost(0) returns 5 — both wrong.
- order: 2
  cost: 20
  content: Add guard clauses at the top for the negative and zero cases.
- order: 3
  cost: 30
  content: Throw RangeError for < 0, return 0 for === 0, else 5 + 2 * weight.
