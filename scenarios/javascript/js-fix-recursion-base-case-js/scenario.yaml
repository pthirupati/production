title: Fix the Recursive sumTo Base Case
slug: js-fix-recursion-base-case-js
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the Recursive sumTo Base
  Case` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: sumTo(n) recursively sums 1..n, but its base case is wrong — it stops at n
  === 1 returning 0, so the result is off by one (it drops the final 1). Also it overflows the stack for
  n === 0. Fix the base case to handle n <= 0 (return 0) and include 1.


  OBJECTIVE: See sums come out one short; Stop recursion at n <= 0; Include 1 in the total. Success means
  all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
