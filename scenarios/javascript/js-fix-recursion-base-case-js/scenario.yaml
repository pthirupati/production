- Include 1 in the total
initial_state: sumTo(n) recursively sums 1..n, but its base case is wrong — it stops at n === 1 returning
  0, so the result is off by one (it drops the final 1). Also it overflows the stack for n === 0. Fix
  the base case to handle n <= 0 (return 0) and include 1.
solution_explanation: 'Returning 0 at n === 1 drops the final 1 and never terminates for n <= 0. Basing
  out at n <= 0 includes 1 and handles non-positive inputs.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix sumTo(n): return 1 + 2 + ... + n (0 for n <= 0).\n  sumTo(5) -> 15, sumTo(0) -> 0\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function sumTo(n) {\n  if (n === 1) return 0; // bug: drops 1 and recurses forever for n<=0\n\
      \  return n + sumTo(n - 1);\n}\n"
    readonly: false
  visible_tests:
  - name: sum to 5
    code: 'assert(sumTo(5) === 15, sumTo(5));

      '
  - name: sum to 1
    code: 'assert(sumTo(1) === 1, sumTo(1));

      '
  hidden_tests:
  - name: sum to 0
    code: 'assert(sumTo(0) === 0);

      '
  - name: sum to 10
    code: 'assert(sumTo(10) === 55);

      '
  - name: sum to 3
    code: 'assert(sumTo(3) === 6);

      '
  - name: negative is 0
    code: 'assert(sumTo(-3) === 0);

      '
  timeout: 8
