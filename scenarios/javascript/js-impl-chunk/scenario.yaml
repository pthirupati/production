  visible_tests:
  - name: uneven
    code: |
      assert(JSON.stringify(chunk([1,2,3,4,5], 2)) === JSON.stringify([[1,2],[3,4],[5]]), JSON.stringify(chunk([1,2,3,4,5], 2)));
  - name: even
    code: |
