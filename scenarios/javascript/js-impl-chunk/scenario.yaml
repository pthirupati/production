  hidden_tests:
  - name: size three
    code: |
      assert(JSON.stringify(chunk([1,2,3,4,5,6,7], 3)) === JSON.stringify([[1,2,3],[4,5,6],[7]]), JSON.stringify(chunk([1,2,3,4,5,6,7], 3)));
  - name: size larger than array
    code: |
      assert(JSON.stringify(chunk([1,2], 5)) === JSON.stringify([[1,2]]), JSON.stringify(chunk([1,2], 5)));
  - name: empty
    code: |
      assert(JSON.stringify(chunk([], 3)) === JSON.stringify([]), JSON.stringify(chunk([], 3)));
  - name: does not mutate
    code: |
      const src = [1,2,3,4];
      chunk(src, 2);
      assert(JSON.stringify(src) === JSON.stringify([1,2,3,4]));
