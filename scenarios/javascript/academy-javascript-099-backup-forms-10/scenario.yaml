description: 'CONTEXT: A team operating JavaScript has raised a ticket for `Forms — Backup Lab`. A customer-facing
  workflow is degraded and the on-call engineer (you) must diagnose and resolve it. Business impact: reduced
  service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project. The architecture is
  a single lab-primary node exposing modules, browser console, and Node tooling; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for forms. Leadership wants
  proof that restore works — not just that scripts exit zero.


  OBJECTIVE: Backup coverage for forms is complete and restorable; Retention and encryption meet the stated
  policy; A restore drill proves data integrity. Acceptance criteria: the change is minimal and reversible,
  and success means `systemctl is-active node-app`` returns active.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant modules, browser console, and Node tooling), changing one thing at a time. Check
  your work continuously against the objective — success means `systemctl is-active node-app`` returns
  active.


  VERIFY: Re-run the same check the grader uses and confirm `systemctl is-active node-app` returns active.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for forms is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for forms. Leadership wants proof that restore
  works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: inputs do not update or invalid data submits.
    This lab is about forms — controlled inputs, validation, and submission. Read the objectives and the
    current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For forms problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Repair or run the backup job, then perform a controlled restore
    into a scratch location to prove it works.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status node-app` and `journalctl -u node-app -n 50 --no-pager` before changing
    anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status node-app` — note Active/Failed and the last log lines.

    2. Read `journalctl -u node-app -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart node-app` and confirm `systemctl is-active node-app` succeeds.


    WHY: the grader checks real service state, not marker files.'
