title: Fix the Numeric Sort (Lexicographic Bug)
slug: js-fix-array-sort-numeric
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the Numeric Sort (Lexicographic
  Bug)` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: sortNumbers(nums) should return the array sorted in ascending NUMERIC order,
  but it calls .sort() with no comparator, so JS sorts by string, putting 10 before 2. Provide a numeric
  comparator. Also, return a new array (don''t mutate the input).


  OBJECTIVE: See the lexicographic ordering bug (10 before 2); Provide an (a, b) => a - b comparator;
  Return a sorted copy without mutating input. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See the lexicographic ordering bug (10 before 2)
- Provide an (a, b) => a - b comparator
- Return a sorted copy without mutating input
initial_state: sortNumbers(nums) should return the array sorted in ascending NUMERIC order, but it calls
  .sort() with no comparator, so JS sorts by string, putting 10 before 2. Provide a numeric comparator.
  Also, return a new array (don't mutate the input).
solution_explanation: 'Default sort compares string representations. A numeric comparator orders by value,
  and spreading into a new array avoids mutating the input.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix sortNumbers(nums) to sort ascending numerically and return a NEW array (do not mutate\
    \ the input).\n  sortNumbers([10, 2, 1]) -> [1, 2, 10]\nClick Run to try it, then Check Solution to\
    \ grade against all tests.\n"
  files:
  - path: solution.js
    content: "function sortNumbers(nums) {\n  return nums.sort(); // lexicographic AND mutates input\n\
      }\n"
    readonly: false
  visible_tests:
  - name: numeric order
    code: 'assert(JSON.stringify(sortNumbers([10, 2, 1])) === JSON.stringify([1, 2, 10]), JSON.stringify(sortNumbers([10,
      2, 1])));

      '
  - name: already sorted
    code: 'assert(JSON.stringify(sortNumbers([1, 2, 3])) === JSON.stringify([1, 2, 3]), JSON.stringify(sortNumbers([1,
      2, 3])));

      '
  hidden_tests:
  - name: multi-digit
    code: 'assert(JSON.stringify(sortNumbers([100, 25, 9, 1000])) === JSON.stringify([9, 25, 100, 1000]),
      JSON.stringify(sortNumbers([100, 25, 9, 1000])));

      '
  - name: negatives
    code: 'assert(JSON.stringify(sortNumbers([3, -1, -10, 2])) === JSON.stringify([-10, -1, 2, 3]), JSON.stringify(sortNumbers([3,
      -1, -10, 2])));

      '
  - name: does not mutate input
    code: 'const src = [3, 1, 2];

      sortNumbers(src);

      assert(JSON.stringify(src) === JSON.stringify([3, 1, 2]), ''input mutated'');

      '
  - name: empty
    code: 'assert(JSON.stringify(sortNumbers([])) === JSON.stringify([]), JSON.stringify(sortNumbers([])));

      '
  timeout: 8
