title: Fix the Closure-in-Loop Capture Bug
slug: js-fix-closure-loop-var
category: JavaScript Development
description: makeCounters(n) should return an array of n functions where the i-th function returns i,
  but it declares the loop variable with `var`, so every closure captures the SAME final value of i. Fix
  the capture so each function returns its own index.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See every counter return the same number
- Give each iteration its own binding
- Make the i-th function return i
initial_state: makeCounters(n) should return an array of n functions where the i-th function returns i,
  but it declares the loop variable with `var`, so every closure captures the SAME final value of i. Fix
  the capture so each function returns its own index.
solution_explanation: |
  var creates a single shared binding, so all closures read the final i. let gives each loop iteration its own binding, capturing the right value.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: |
    Fix makeCounters(n): return an array of n functions; calling the i-th returns i (0-indexed).
      const fns = makeCounters(3); fns[0]() -> 0, fns[2]() -> 2
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function makeCounters(n) {
        const fns = [];
        for (var i = 0; i < n; i++) {  // var: shared binding
          fns.push(function () { return i; });
        }
        return fns;
      }
    readonly: false
  visible_tests:
  - name: each returns its index
    code: |
      const fns = makeCounters(3);
      assert(fns[0]() === 0 && fns[1]() === 1 && fns[2]() === 2);
  - name: count matches n
    code: |
      assert(makeCounters(5).length === 5);
  hidden_tests:
  - name: last function
    code: |
      const fns = makeCounters(4);
      assert(fns[3]() === 3, 'got ' + fns[3]());
  - name: all distinct
    code: |
      const fns = makeCounters(3);
      const vals = fns.map(f => f());
      assert(JSON.stringify(vals) === JSON.stringify([0,1,2]));
  - name: zero counters
    code: |
      assert(makeCounters(0).length === 0);
  timeout: 8
hints:
- order: 1
  cost: 10
  content: All counters return n (e.g. 3 for makeCounters(3)) — they share one i.
- order: 2
  cost: 20
  content: var is function-scoped, so every closure sees the same final i.
- order: 3
  cost: 30
  content: Declare the loop variable with let to get a fresh binding per iteration.
