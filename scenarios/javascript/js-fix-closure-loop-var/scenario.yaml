title: Fix the Closure-in-Loop Capture Bug
slug: js-fix-closure-loop-var
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the Closure-in-Loop Capture
  Bug` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: makeCounters(n) should return an array of n functions where the i-th function
  returns i, but it declares the loop variable with `var`, so every closure captures the SAME final value
  of i. Fix the capture so each function returns its own index.


  OBJECTIVE: See every counter return the same number; Give each iteration its own binding; Make the i-th
  function return i. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See every counter return the same number
- Give each iteration its own binding
- Make the i-th function return i
initial_state: makeCounters(n) should return an array of n functions where the i-th function returns i,
  but it declares the loop variable with `var`, so every closure captures the SAME final value of i. Fix
  the capture so each function returns its own index.
solution_explanation: 'var creates a single shared binding, so all closures read the final i. let gives
  each loop iteration its own binding, capturing the right value.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix makeCounters(n): return an array of n functions; calling the i-th returns i (0-indexed).\n\
    \  const fns = makeCounters(3); fns[0]() -> 0, fns[2]() -> 2\nClick Run to try it, then Check Solution\
    \ to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function makeCounters(n) {\n  const fns = [];\n  for (var i = 0; i < n; i++) {  // var:\
      \ shared binding\n    fns.push(function () { return i; });\n  }\n  return fns;\n}\n"
    readonly: false
  visible_tests:
  - name: each returns its index
    code: 'const fns = makeCounters(3);

      assert(fns[0]() === 0 && fns[1]() === 1 && fns[2]() === 2);

      '
  - name: count matches n
    code: 'assert(makeCounters(5).length === 5);

      '
  hidden_tests:
  - name: last function
    code: 'const fns = makeCounters(4);

      assert(fns[3]() === 3, ''got '' + fns[3]());

      '
  - name: all distinct
    code: 'const fns = makeCounters(3);

      const vals = fns.map(f => f());

      assert(JSON.stringify(vals) === JSON.stringify([0,1,2]));

      '
  - name: zero counters
    code: 'assert(makeCounters(0).length === 0);

      '
  timeout: 8
hints:
