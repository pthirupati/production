  - name: value containing equals
    code: 'assert(JSON.stringify(parseQueryString(''eq=a=b'')) === JSON.stringify({eq:''a=b''}), JSON.stringify(parseQueryString(''eq=a=b'')));

      '
  - name: decodes keys too
    code: 'assert(JSON.stringify(parseQueryString(''a%20b=c'')) === JSON.stringify({''a b'':''c''}), JSON.stringify(parseQueryString(''a%20b=c'')));

      '
  - name: skips empty segments
    code: 'assert(JSON.stringify(parseQueryString(''a=1&&b=2'')) === JSON.stringify({a:''1'', b:''2''}),
      JSON.stringify(parseQueryString(''a=1&&b=2'')));

      '
