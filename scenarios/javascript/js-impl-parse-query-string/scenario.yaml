title: Implement parseQueryString
slug: js-impl-parse-query-string
category: JavaScript Development
description: 'Implement parseQueryString(qs): parse a URL query string into an object. Accept an optional
  leading ''?''. Split on ''&'', then on the first ''=''. URL-decode keys and values (decodeURIComponent).
  A key with no ''='' maps to ''''. Ignore empty segments. The stub is empty so tests fail.'
