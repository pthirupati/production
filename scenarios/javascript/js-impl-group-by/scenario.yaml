is_free: true
dual_terminal: false
objectives:
- Compute a key per item via keyFn
- Accumulate items into per-key arrays
- Preserve order within each group
initial_state: 'Implement groupBy(items, keyFn): return an object mapping each key produced by keyFn to
  an array of the items with that key, preserving input order within each group. The stub is empty so
  tests fail.'
solution_explanation: 'Bucketing items into per-key arrays (initialized on first sight) and pushing in
  iteration order produces ordered groups keyed by keyFn.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: "Implement groupBy(items, keyFn) -> { key: [items...] }.\n  groupBy([1,2,3,4], n => n\
    \ % 2 === 0 ? 'even' : 'odd') -> {odd:[1,3], even:[2,4]}\nClick Run to try it, then Check Solution\
    \ to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function groupBy(items, keyFn) {\n  // TODO: return an object of key -> array of items\n\
      }\n"
    readonly: false
  visible_tests:
  - name: even/odd
    code: 'assert(JSON.stringify(groupBy([1,2,3,4], n => n % 2 === 0 ? ''even'' : ''odd'')) === JSON.stringify({odd:[1,3],
      even:[2,4]}), JSON.stringify(groupBy([1,2,3,4], n => n % 2 === 0 ? ''even'' : ''odd'')));

      '
  - name: single group
    code: 'assert(JSON.stringify(groupBy([2,4], () => ''all'')) === JSON.stringify({all:[2,4]}), JSON.stringify(groupBy([2,4],
      () => ''all'')));

      '
  hidden_tests:
  - name: by length
    code: 'assert(JSON.stringify(groupBy([''a'',''bb'',''cc'',''d''], s => s.length)) === JSON.stringify({1:[''a'',''d''],
      2:[''bb'',''cc'']}), JSON.stringify(groupBy([''a'',''bb'',''cc'',''d''], s => s.length)));

      '
  - name: empty
    code: 'assert(JSON.stringify(groupBy([], () => ''x'')) === JSON.stringify({}), JSON.stringify(groupBy([],
      () => ''x'')));

      '
  - name: order preserved within group
    code: 'assert(JSON.stringify(groupBy([10,20,11], n => n % 10)) === JSON.stringify({0:[10,20], 1:[11]}),
      JSON.stringify(groupBy([10,20,11], n => n % 10)));

      '
  timeout: 8
