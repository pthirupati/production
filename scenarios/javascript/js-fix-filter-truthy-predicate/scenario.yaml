title: Fix compact Dropping Valid Falsy-ish Values
slug: js-fix-filter-truthy-predicate
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix compact Dropping Valid Falsy-ish
  Values` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: compact(arr) should remove only null and undefined, keeping every other value
  (including 0, '''', false, NaN). It currently filters with the value itself as the predicate (`arr.filter(x
  => x)`), which also drops 0, '''', false, and NaN. Fix the predicate to reject only null/undefined.


  OBJECTIVE: See 0, '''', false, NaN wrongly removed; Keep all defined values, including falsy ones; Remove
  only null and undefined. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See 0, '', false, NaN wrongly removed
- Keep all defined values, including falsy ones
- Remove only null and undefined
initial_state: compact(arr) should remove only null and undefined, keeping every other value (including
  0, '', false, NaN). It currently filters with the value itself as the predicate (`arr.filter(x => x)`),
  which also drops 0, '', false, and NaN. Fix the predicate to reject only null/undefined.
solution_explanation: 'Using the value as the predicate drops every falsy value. Explicitly comparing
  against null and undefined keeps legitimate falsy values like 0, '''', false, and NaN.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix compact(arr): return a new array with only null and undefined removed; keep 0, '',\
    \ false, and NaN.\n  compact([0, null, 1, undefined, '']) -> [0, 1, '']\nClick Run to try it, then\
    \ Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function compact(arr) {\n  return arr.filter((x) => x); // also drops 0, '', false, NaN\n\
      }\n"
    readonly: false
  visible_tests:
  - name: keeps falsy, drops nullish
    code: 'assert(JSON.stringify(compact([0, null, 1, undefined, ''''])) === JSON.stringify([0, 1, '''']),
      JSON.stringify(compact([0, null, 1, undefined, ''''])));

      '
  - name: keeps false
    code: 'assert(JSON.stringify(compact([false, null])) === JSON.stringify([false]), JSON.stringify(compact([false,
      null])));

      '
  hidden_tests:
  - name: keeps zero
    code: 'assert(JSON.stringify(compact([0, 0, null])) === JSON.stringify([0, 0]), JSON.stringify(compact([0,
      0, null])));

      '
  - name: drops only nullish
    code: 'assert(JSON.stringify(compact([1, null, 2, undefined, 3])) === JSON.stringify([1, 2, 3]), JSON.stringify(compact([1,
      null, 2, undefined, 3])));

      '
  - name: keeps NaN
    code: 'const r = compact([NaN, null, 1]);

      assert(r.length === 2 && Number.isNaN(r[0]) && r[1] === 1, JSON.stringify(r));

      '
  - name: nothing to drop
    code: 'assert(JSON.stringify(compact([1, 2, 3])) === JSON.stringify([1, 2, 3]), JSON.stringify(compact([1,
      2, 3])));

      '
  - name: all nullish
    code: 'assert(JSON.stringify(compact([null, undefined])) === JSON.stringify([]), JSON.stringify(compact([null,
      undefined])));

      '
  timeout: 8
