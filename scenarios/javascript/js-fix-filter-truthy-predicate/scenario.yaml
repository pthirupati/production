solution_explanation: 'Using the value as the predicate drops every falsy value. Explicitly comparing
  against null and undefined keeps legitimate falsy values like 0, '''', false, and NaN.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix compact(arr): return a new array with only null and undefined removed; keep 0, '',\
    \ false, and NaN.\n  compact([0, null, 1, undefined, '']) -> [0, 1, '']\nClick Run to try it, then\
    \ Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function compact(arr) {\n  return arr.filter((x) => x); // also drops 0, '', false, NaN\n\
      }\n"
    readonly: false
  visible_tests:
  - name: keeps falsy, drops nullish
    code: 'assert(JSON.stringify(compact([0, null, 1, undefined, ''''])) === JSON.stringify([0, 1, '''']),
      JSON.stringify(compact([0, null, 1, undefined, ''''])));

      '
  - name: keeps false
    code: 'assert(JSON.stringify(compact([false, null])) === JSON.stringify([false]), JSON.stringify(compact([false,
      null])));

      '
  hidden_tests:
  - name: keeps zero
    code: 'assert(JSON.stringify(compact([0, 0, null])) === JSON.stringify([0, 0]), JSON.stringify(compact([0,
      0, null])));

      '
  - name: drops only nullish
    code: 'assert(JSON.stringify(compact([1, null, 2, undefined, 3])) === JSON.stringify([1, 2, 3]), JSON.stringify(compact([1,
      null, 2, undefined, 3])));

      '
  - name: keeps NaN
    code: 'const r = compact([NaN, null, 1]);

      assert(r.length === 2 && Number.isNaN(r[0]) && r[1] === 1, JSON.stringify(r));

      '
  - name: nothing to drop
    code: 'assert(JSON.stringify(compact([1, 2, 3])) === JSON.stringify([1, 2, 3]), JSON.stringify(compact([1,
      2, 3])));

      '
  - name: all nullish
    code: 'assert(JSON.stringify(compact([null, undefined])) === JSON.stringify([]), JSON.stringify(compact([null,
      undefined])));

      '
  timeout: 8
