coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: "Implement flattenDepth(arr, depth=1) -> array flattened up to `depth` levels.\n  flattenDepth([1,\
    \ [2, [3, [4]]]], 1) -> [1, 2, [3, [4]]]\n  flattenDepth([1, [2, [3, [4]]]], 2) -> [1, 2, 3, [4]]\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function flattenDepth(arr, depth = 1) {\n  // TODO: flatten up to `depth` levels (no flat(),\
      \ no mutation)\n}\n"
    readonly: false
  visible_tests:
  - name: depth one
    code: 'assert(JSON.stringify(flattenDepth([1, [2, [3, [4]]]], 1)) === JSON.stringify([1, 2, [3, [4]]]),
      JSON.stringify(flattenDepth([1, [2, [3, [4]]]], 1)));

      '
  - name: depth two
    code: 'assert(JSON.stringify(flattenDepth([1, [2, [3, [4]]]], 2)) === JSON.stringify([1, 2, 3, [4]]),
      JSON.stringify(flattenDepth([1, [2, [3, [4]]]], 2)));

      '
  hidden_tests:
  - name: default depth is one
    code: 'assert(JSON.stringify(flattenDepth([1, [2, [3]]])) === JSON.stringify([1, 2, [3]]), JSON.stringify(flattenDepth([1,
      [2, [3]]])));

      '
  - name: depth zero is unchanged
    code: 'assert(JSON.stringify(flattenDepth([1, [2, [3]]], 0)) === JSON.stringify([1, [2, [3]]]), JSON.stringify(flattenDepth([1,
      [2, [3]]], 0)));

      '
  - name: deep enough fully flattens
    code: 'assert(JSON.stringify(flattenDepth([1, [2, [3, [4]]]], 5)) === JSON.stringify([1, 2, 3, 4]),
      JSON.stringify(flattenDepth([1, [2, [3, [4]]]], 5)));

      '
  - name: already flat
    code: 'assert(JSON.stringify(flattenDepth([1, 2, 3], 3)) === JSON.stringify([1, 2, 3]), JSON.stringify(flattenDepth([1,
      2, 3], 3)));

      '
  - name: does not mutate input
    code: 'const src = [1, [2, [3]]];

      const snap = JSON.stringify(src);

      flattenDepth(src, 2);

      assert(JSON.stringify(src) === snap, ''input mutated'');

      '
  - name: mixed shapes
    code: 'assert(JSON.stringify(flattenDepth([[1, 2], [3, [4]]], 1)) === JSON.stringify([1, 2, 3, [4]]),
      JSON.stringify(flattenDepth([[1, 2], [3, [4]]], 1)));

      '
  timeout: 8
