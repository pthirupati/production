coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: 'Implement arraySum(arr) → number. Empty array → 0. Variant 4: ignore
    non-numbers by coercing with Number().

    Click Run to try it, then Check Solution to grade.

    '
  files:
  - path: solution.js
    content: "function arraySum(arr) {\n  // TODO\n}\n"
    readonly: false
  visible_tests:
  - name: basic
    code: assert(arraySum([1,2,3]) === 6, String(arraySum([1,2,3])));
  - name: single
    code: assert(arraySum([10]) === 10, String(arraySum([10])));
  hidden_tests:
  - name: empty
    code: assert(arraySum([]) === 0);
  - name: neg
    code: assert(arraySum([-1, 4, 1]) === 4);
  - name: s87_fn_defined
    code: assert(typeof arraySum === "function");
  - name: s87_idempotent
    code: const a=arraySum([]); const b=arraySum([]); assert(String(a)===String(b));
  timeout: 8
