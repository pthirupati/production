  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: "Implement deepClone(value) -> a deep copy. Nested arrays/objects are copied recursively\
    \ so the clone is fully independent.\n  const c = deepClone({a:[1,2]}); c.a.push(3); // original.a\
    \ stays [1,2]\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function deepClone(value) {\n  // TODO: return a deep copy of value (primitives, arrays,\
      \ plain objects)\n}\n"
    readonly: false
  visible_tests:
  - name: clones nested object
    code: 'const src = {a:1, b:{c:2}};

      const c = deepClone(src);

      assert(JSON.stringify(c) === JSON.stringify(src) && c !== src && c.b !== src.b, ''shallow or unequal'');

      '
  - name: primitive passthrough
    code: 'assert(deepClone(5) === 5 && deepClone(''x'') === ''x'' && deepClone(null) === null);

      '
  hidden_tests:
  - name: nested mutation does not leak
    code: 'const src = {a:[1,2]};

      const c = deepClone(src);

      c.a.push(3);

      assert(JSON.stringify(src.a) === JSON.stringify([1,2]), ''source mutated: '' + JSON.stringify(src.a));

      '
  - name: array of objects independent
    code: 'const src = [{n:1}, {n:2}];

      const c = deepClone(src);

      c[0].n = 99;

      assert(src[0].n === 1, ''source element mutated'');

      '
  - name: deep equality preserved
    code: 'const src = {a:{b:{c:[1,{d:2}]}}};

      assert(JSON.stringify(deepClone(src)) === JSON.stringify(src));

      '
  - name: empty structures
    code: 'assert(JSON.stringify(deepClone({})) === ''{}'' && JSON.stringify(deepClone([])) === ''[]'');

      '
  - name: top-level array copy is new
    code: 'const src = [1,2,3];

      const c = deepClone(src);

      assert(c !== src && JSON.stringify(c) === JSON.stringify(src));

      '
  timeout: 8
