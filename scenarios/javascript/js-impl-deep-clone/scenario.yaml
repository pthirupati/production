title: Implement deepClone
slug: js-impl-deep-clone
category: JavaScript Development
description: 'Implement deepClone(value): return a deep copy of a JSON-like value (primitives, arrays,
  plain objects, nested). Mutating the clone must not affect the original, at any depth. Do not use structuredClone.
  The stub is empty so tests fail.'
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Return primitives as-is
- Recursively copy arrays and plain objects
- Ensure nested mutations don't leak back to the source
initial_state: 'Implement deepClone(value): return a deep copy of a JSON-like value (primitives, arrays,
  plain objects, nested). Mutating the clone must not affect the original, at any depth. Do not use structuredClone.
  The stub is empty so tests fail.'
solution_explanation: |
  Primitives are returned as-is; arrays and plain objects are rebuilt with each element/value recursively cloned, producing a structure that shares no references with the original at any depth.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: |
    Implement deepClone(value) -> a deep copy. Nested arrays/objects are copied recursively so the clone is fully independent.
      const c = deepClone({a:[1,2]}); c.a.push(3); // original.a stays [1,2]
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function deepClone(value) {
        // TODO: return a deep copy of value (primitives, arrays, plain objects)
      }
    readonly: false
  visible_tests:
  - name: clones nested object
    code: |
      const src = {a:1, b:{c:2}};
      const c = deepClone(src);
      assert(JSON.stringify(c) === JSON.stringify(src) && c !== src && c.b !== src.b, 'shallow or unequal');
  - name: primitive passthrough
    code: |
      assert(deepClone(5) === 5 && deepClone('x') === 'x' && deepClone(null) === null);
  hidden_tests:
  - name: nested mutation does not leak
    code: |
      const src = {a:[1,2]};
      const c = deepClone(src);
      c.a.push(3);
      assert(JSON.stringify(src.a) === JSON.stringify([1,2]), 'source mutated: ' + JSON.stringify(src.a));
  - name: array of objects independent
    code: |
      const src = [{n:1}, {n:2}];
      const c = deepClone(src);
      c[0].n = 99;
      assert(src[0].n === 1, 'source element mutated');
  - name: deep equality preserved
    code: |
      const src = {a:{b:{c:[1,{d:2}]}}};
      assert(JSON.stringify(deepClone(src)) === JSON.stringify(src));
  - name: empty structures
    code: |
      assert(JSON.stringify(deepClone({})) === '{}' && JSON.stringify(deepClone([])) === '[]');
  - name: top-level array copy is new
    code: |
      const src = [1,2,3];
      const c = deepClone(src);
      assert(c !== src && JSON.stringify(c) === JSON.stringify(src));
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Primitives (and null) can be returned directly — there's nothing to copy.
- order: 2
  cost: 20
  content: For arrays, map each element through deepClone; for objects, rebuild key by key.
- order: 3
  cost: 30
  content: Recurse on every element/value so nested containers are also fresh copies.
