title: Implement debounce
slug: js-impl-debounce
category: Build
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Implement debounce` during a
  realistic incident. The business impact is reduced service reliability until the underlying state is
  repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement debounce(fn, delay): return a function that postpones calling fn
  until `delay` ms have passed since the LAST invocation; rapid repeated calls collapse into a single
  trailing call with the most recent arguments. Use setTimeout/clearTimeout. The stub is empty so tests
  fail.


  OBJECTIVE: Schedule the call with setTimeout after delay; Cancel the pending timer on each new call
  (clearTimeout); Fire once, with the latest arguments. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
