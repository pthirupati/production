initial_state: 'Implement debounce(fn, delay): return a function that postpones calling fn until `delay`
  ms have passed since the LAST invocation; rapid repeated calls collapse into a single trailing call
  with the most recent arguments. Use setTimeout/clearTimeout. The stub is empty so tests fail.'
solution_explanation: 'A closure holds the pending timer. Each call cancels the previous timer and schedules
  a fresh one, so only the final call in a burst survives and fires after `delay` ms with the most recent
  arguments.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: 'Implement debounce(fn, delay) -> debounced function. Only the final call in a burst runs,
    after `delay` ms of quiet, with the latest args.

    Use the global setTimeout/clearTimeout.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.js
    content: "function debounce(fn, delay) {\n  // TODO: return a function that defers fn until `delay`\
      \ ms after the last call\n}\n"
    readonly: false
  visible_tests:
  - name: defers until flush
    code: "const _oST=globalThis.setTimeout,_oCT=globalThis.clearTimeout;let _q=[];\nglobalThis.setTimeout=(cb)=>{const\
      \ id={};_q.push({id,cb});return id;};\nglobalThis.clearTimeout=(id)=>{_q=_q.filter(e=>e.id!==id);};\n\
      const flush=()=>{const live=_q.slice();_q=[];live.forEach(e=>e.cb());};\ntry {\n  let calls=0; const\
      \ d=debounce(()=>{calls++;},100);\n  d(); d(); d();\n  assert(calls===0,'should not fire before\
      \ flush, got '+calls);\n  flush();\n  assert(calls===1,'should fire once after quiet, got '+calls);\n\
      } finally { globalThis.setTimeout=_oST; globalThis.clearTimeout=_oCT; }\n"
  - name: uses latest args
    code: "const _oST=globalThis.setTimeout,_oCT=globalThis.clearTimeout;let _q=[];\nglobalThis.setTimeout=(cb)=>{const\
      \ id={};_q.push({id,cb});return id;};\nglobalThis.clearTimeout=(id)=>{_q=_q.filter(e=>e.id!==id);};\n\
      const flush=()=>{const live=_q.slice();_q=[];live.forEach(e=>e.cb());};\ntry {\n  let last=null;\
      \ const d=debounce((x)=>{last=x;},50);\n  d(1); d(2); d(3); flush();\n  assert(last===3,'expected\
      \ latest arg 3, got '+last);\n} finally { globalThis.setTimeout=_oST; globalThis.clearTimeout=_oCT;\
      \ }\n"
  hidden_tests:
  - name: only one timer survives a burst
    code: "const _oST=globalThis.setTimeout,_oCT=globalThis.clearTimeout;let _q=[];\nglobalThis.setTimeout=(cb)=>{const\
      \ id={};_q.push({id,cb});return id;};\nglobalThis.clearTimeout=(id)=>{_q=_q.filter(e=>e.id!==id);};\n\
      try {\n  const d=debounce(()=>{},10); d(); d(); d(); d();\n  assert(_q.length===1,'expected 1 pending\
      \ timer, got '+_q.length);\n} finally { globalThis.setTimeout=_oST; globalThis.clearTimeout=_oCT;\
      \ }\n"
  - name: separate bursts each fire
    code: "const _oST=globalThis.setTimeout,_oCT=globalThis.clearTimeout;let _q=[];\nglobalThis.setTimeout=(cb)=>{const\
      \ id={};_q.push({id,cb});return id;};\nglobalThis.clearTimeout=(id)=>{_q=_q.filter(e=>e.id!==id);};\n\
      const flush=()=>{const live=_q.slice();_q=[];live.forEach(e=>e.cb());};\ntry {\n  let calls=0; const\
      \ d=debounce(()=>{calls++;},10);\n  d(); flush(); d(); flush();\n  assert(calls===2,'expected 2\
      \ calls across bursts, got '+calls);\n} finally { globalThis.setTimeout=_oST; globalThis.clearTimeout=_oCT;\
      \ }\n"
  - name: returns a function
    code: 'assert(typeof debounce(()=>{},10)===''function'');

      '
  - name: forwards multiple args
    code: "const _oST=globalThis.setTimeout,_oCT=globalThis.clearTimeout;let _q=[];\nglobalThis.setTimeout=(cb)=>{const\
      \ id={};_q.push({id,cb});return id;};\nglobalThis.clearTimeout=(id)=>{_q=_q.filter(e=>e.id!==id);};\n\
      const flush=()=>{const live=_q.slice();_q=[];live.forEach(e=>e.cb());};\ntry {\n  let sum=0; const\
      \ d=debounce((a,b)=>{sum=a+b;},10);\n  d(2,3); flush();\n  assert(sum===5,'expected 5, got '+sum);\n\
      } finally { globalThis.setTimeout=_oST; globalThis.clearTimeout=_oCT; }\n"
  timeout: 8
