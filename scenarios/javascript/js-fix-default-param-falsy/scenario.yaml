title: Fix the Falsy Default in greet
slug: js-fix-default-param-falsy
category: JavaScript Development
description: greet(name, greeting) defaults greeting to 'Hello' using `greeting || 'Hello'`, but that
  also overrides a deliberately empty string ''. The intent is to default only when greeting is undefined.
  Fix it using the nullish-coalescing operator (??) or a default parameter.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See an empty-string greeting get replaced
- Default only for undefined, not all falsy values
- Preserve an explicit empty greeting
initial_state: greet(name, greeting) defaults greeting to 'Hello' using `greeting || 'Hello'`, but that
  also overrides a deliberately empty string ''. The intent is to default only when greeting is undefined.
  Fix it using the nullish-coalescing operator (??) or a default parameter.
solution_explanation: |
  The || operator replaces every falsy value, including ''. Nullish coalescing (??) defaults only for null/undefined, preserving an empty string.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: |
    Fix greet(name, greeting): return `${greeting} ${name}`. greeting defaults to 'Hello' only when it is undefined; an explicit '' must be kept.
      greet('Sam') -> 'Hello Sam'; greet('Sam', '') -> ' Sam'
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function greet(name, greeting) {
        greeting = greeting || 'Hello'; // overrides '' too
        return greeting + ' ' + name;
      }
    readonly: false
  visible_tests:
  - name: default greeting
    code: |
      assert(greet('Sam') === 'Hello Sam');
  - name: explicit empty kept
    code: |
      assert(greet('Sam', '') === ' Sam', JSON.stringify(greet('Sam', '')));
  hidden_tests:
  - name: custom greeting
    code: |
      assert(greet('Sam', 'Hi') === 'Hi Sam');
  - name: undefined defaults
    code: |
      assert(greet('Lee', undefined) === 'Hello Lee');
  - name: null defaults
    code: |
      assert(greet('Lee', null) === 'Hello Lee');
  timeout: 8
hints:
- order: 1
  cost: 10
  content: greet('Sam', '') returns 'Hello Sam', but the empty greeting should be kept.
- order: 2
  cost: 20
  content: '|| treats '''' as falsy and replaces it; ?? only replaces null/undefined.'
- order: 3
  cost: 30
  content: Use greeting ?? 'Hello'.
