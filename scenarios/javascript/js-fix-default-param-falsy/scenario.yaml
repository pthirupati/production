title: Fix the Falsy Default in greet
slug: js-fix-default-param-falsy
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the Falsy Default in greet`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: greet(name, greeting) defaults greeting to ''Hello'' using `greeting || ''Hello''`,
  but that also overrides a deliberately empty string ''''. The intent is to default only when greeting
  is undefined. Fix it using the nullish-coalescing operator (??) or a default parameter.


  OBJECTIVE: See an empty-string greeting get replaced; Default only for undefined, not all falsy values;
  Preserve an explicit empty greeting. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See an empty-string greeting get replaced
- Default only for undefined, not all falsy values
- Preserve an explicit empty greeting
initial_state: greet(name, greeting) defaults greeting to 'Hello' using `greeting || 'Hello'`, but that
  also overrides a deliberately empty string ''. The intent is to default only when greeting is undefined.
  Fix it using the nullish-coalescing operator (??) or a default parameter.
solution_explanation: 'The || operator replaces every falsy value, including ''''. Nullish coalescing
  (??) defaults only for null/undefined, preserving an empty string.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix greet(name, greeting): return `${greeting} ${name}`. greeting defaults to 'Hello'\
    \ only when it is undefined; an explicit '' must be kept.\n  greet('Sam') -> 'Hello Sam'; greet('Sam',\
    \ '') -> ' Sam'\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function greet(name, greeting) {\n  greeting = greeting || 'Hello'; // overrides '' too\n\
      \  return greeting + ' ' + name;\n}\n"
    readonly: false
  visible_tests:
  - name: default greeting
    code: 'assert(greet(''Sam'') === ''Hello Sam'');

      '
  - name: explicit empty kept
    code: 'assert(greet(''Sam'', '''') === '' Sam'', JSON.stringify(greet(''Sam'', '''')));

      '
  hidden_tests:
  - name: custom greeting
    code: 'assert(greet(''Sam'', ''Hi'') === ''Hi Sam'');

      '
  - name: undefined defaults
    code: 'assert(greet(''Lee'', undefined) === ''Hello Lee'');

      '
  - name: null defaults
    code: 'assert(greet(''Lee'', null) === ''Hello Lee'');

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.js`, read the instructions, and run the visible tests to see
