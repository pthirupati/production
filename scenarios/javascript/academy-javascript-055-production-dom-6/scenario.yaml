hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — DevTools elements and event listeners.

    2. Write down what looks normal versus wrong or missing for the DOM.

    3. Recall the core idea: selection, events, and updates. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for the DOM.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — DevTools elements and event listeners.

    2. Apply production standards for the DOM: resource limits, monitoring, access
    controls, and a written rollback step.

    3. Verify the result — DOM updates and events behave as intended.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-javascript-055-production-dom-6.conf`,
    then click Check Solution.'
