title: Fix the Money Rounding Bug
slug: js-fix-floating-point-rounding
category: JavaScript Development
description: roundMoney(x) should round a number to 2 decimal places, but it uses Math.round(x) which
  rounds to the nearest integer, dropping the cents. Fix it to round to 2 decimals and return a number.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See cents disappear (1.005 -> 1)
- Scale by 100 before rounding, then divide back
- Return a number rounded to 2 decimals
initial_state: roundMoney(x) should round a number to 2 decimal places, but it uses Math.round(x) which
  rounds to the nearest integer, dropping the cents. Fix it to round to 2 decimals and return a number.
solution_explanation: |
  Math.round alone rounds to an integer. Scaling by 100, rounding, then dividing rounds to two decimals.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: |
    Fix roundMoney(x) to round to 2 decimal places.
      roundMoney(1.005) -> 1.01 (approx), roundMoney(2.345) -> 2.35
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function roundMoney(x) {
        return Math.round(x); // rounds to whole number, loses cents
      }
    readonly: false
  visible_tests:
  - name: two decimals
    code: |
      assert(roundMoney(2.345) === 2.35, roundMoney(2.345));
  - name: already rounded
    code: |
      assert(roundMoney(3.10) === 3.1);
  hidden_tests:
  - name: rounds down
    code: |
      assert(roundMoney(1.234) === 1.23);
  - name: rounds up
    code: |
      assert(roundMoney(1.236) === 1.24);
  - name: whole number
    code: |
      assert(roundMoney(5) === 5);
  - name: keeps cents
    code: |
      assert(roundMoney(9.99) === 9.99);
  timeout: 8
hints:
- order: 1
  cost: 10
  content: roundMoney(2.345) returns 2 — Math.round goes to the nearest integer.
- order: 2
  cost: 20
  content: Multiply by 100 first so the cents become whole numbers.
- order: 3
  cost: 30
  content: Return Math.round(x * 100) / 100.
