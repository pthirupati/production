initial_state: 'toBase10(str) parses a decimal numeric string, but it calls parseInt(str) without a radix.
  For inputs with leading zeros this is fragile, and the intent is explicit base-10 parsing. Also it returns
  NaN silently for bad input where it should throw. Fix: always pass radix 10 and throw a RangeError on
  non-numeric input.'
solution_explanation: 'Specifying radix 10 makes parsing unambiguous, and checking for NaN turns silent
  bad input into an explicit RangeError.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix toBase10(str): return the base-10 integer value. Use radix 10 explicitly. If the\
    \ result is NaN, throw a RangeError('not a number').\n  toBase10('010') -> 10, toBase10('42') -> 42\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function toBase10(str) {\n  return parseInt(str); // no radix; returns NaN silently on bad\
      \ input\n}\n"
    readonly: false
  visible_tests:
  - name: plain number
    code: 'assert(toBase10(''42'') === 42);

      '
  - name: leading zeros decimal
    code: 'assert(toBase10(''010'') === 10, toBase10(''010''));

      '
  hidden_tests:
  - name: negative
    code: 'assert(toBase10(''-7'') === -7);

      '
  - name: trailing text parses prefix
    code: 'assert(toBase10(''15px'') === 15);

      '
  - name: throws on non-numeric
    code: 'let threw = false;

      try { toBase10(''abc''); } catch (e) { threw = e instanceof RangeError; }

      assert(threw, ''should throw RangeError'');

      '
  - name: zero
    code: 'assert(toBase10(''0'') === 0);

      '
  timeout: 8
