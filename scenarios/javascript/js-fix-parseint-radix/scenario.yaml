title: Fix parseInt Radix in toBase10
slug: js-fix-parseint-radix
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix parseInt Radix in toBase10`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: toBase10(str) parses a decimal numeric string, but it calls parseInt(str)
  without a radix. For inputs with leading zeros this is fragile, and the intent is explicit base-10 parsing.
  Also it returns NaN silently for bad input where it should throw. Fix: always pass radix 10 and throw
  a RangeError on non-numeric input.


  OBJECTIVE: Always specify radix 10 to parseInt; Parse leading-zero strings as decimal (not octal-ish);
  Throw on input that does not parse. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
