solution_explanation: 'String.replace with a string target replaces only the first match. Splitting on
  the word and joining with ''***'' replaces every occurrence.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix censor(text, word): replace every occurrence of word with '***'.\n  censor('bad bad\
    \ wolf', 'bad') -> '*** *** wolf'\nAssume word contains no regex special characters.\nClick Run to\
    \ try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function censor(text, word) {\n  return text.replace(word, '***'); // replaces only the\
      \ first match\n}\n"
    readonly: false
  visible_tests:
  - name: replaces all
    code: 'assert(censor(''bad bad wolf'', ''bad'') === ''*** *** wolf'', censor(''bad bad wolf'', ''bad''));

      '
  - name: single occurrence
    code: 'assert(censor(''a bad day'', ''bad'') === ''a *** day'');

      '
  hidden_tests:
  - name: three occurrences
    code: 'assert(censor(''no no no'', ''no'') === ''*** *** ***'');

      '
  - name: word absent unchanged
    code: 'assert(censor(''clean text'', ''bad'') === ''clean text'');

      '
  - name: adjacent occurrences
    code: 'assert(censor(''xx'', ''x'') === ''******'');

      '
  timeout: 8
