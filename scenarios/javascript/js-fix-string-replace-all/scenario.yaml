title: Fix replace Only Hitting the First Match
slug: js-fix-string-replace-all
category: JavaScript Development
description: censor(text, word) should replace EVERY occurrence of word with '***', but it uses String.replace
  with a plain string, which replaces only the first match. Replace all occurrences.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See only the first occurrence replaced
- Replace all matches (replaceAll or a global regex split/join)
- Leave text without the word unchanged
initial_state: censor(text, word) should replace EVERY occurrence of word with '***', but it uses String.replace
  with a plain string, which replaces only the first match. Replace all occurrences.
solution_explanation: |
  String.replace with a string target replaces only the first match. Splitting on the word and joining with '***' replaces every occurrence.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: |
    Fix censor(text, word): replace every occurrence of word with '***'.
      censor('bad bad wolf', 'bad') -> '*** *** wolf'
    Assume word contains no regex special characters.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function censor(text, word) {
        return text.replace(word, '***'); // replaces only the first match
      }
    readonly: false
  visible_tests:
  - name: replaces all
    code: |
      assert(censor('bad bad wolf', 'bad') === '*** *** wolf', censor('bad bad wolf', 'bad'));
  - name: single occurrence
    code: |
      assert(censor('a bad day', 'bad') === 'a *** day');
  hidden_tests:
  - name: three occurrences
    code: |
      assert(censor('no no no', 'no') === '*** *** ***');
  - name: word absent unchanged
    code: |
      assert(censor('clean text', 'bad') === 'clean text');
  - name: adjacent occurrences
    code: |
      assert(censor('xx', 'x') === '******');
  timeout: 8
hints:
- order: 1
  cost: 10
  content: censor('bad bad wolf', 'bad') leaves the second 'bad' — replace only hits the first.
- order: 2
  cost: 20
  content: split(word).join('***') replaces every occurrence; so does replaceAll.
- order: 3
  cost: 30
  content: Return text.split(word).join('***').
