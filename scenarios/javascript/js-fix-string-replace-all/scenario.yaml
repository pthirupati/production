title: Fix replace Only Hitting the First Match
slug: js-fix-string-replace-all
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix replace Only Hitting the
  First Match` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: censor(text, word) should replace EVERY occurrence of word with ''***'', but
  it uses String.replace with a plain string, which replaces only the first match. Replace all occurrences.


  OBJECTIVE: See only the first occurrence replaced; Replace all matches (replaceAll or a global regex
  split/join); Leave text without the word unchanged. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See only the first occurrence replaced
- Replace all matches (replaceAll or a global regex split/join)
- Leave text without the word unchanged
initial_state: censor(text, word) should replace EVERY occurrence of word with '***', but it uses String.replace
  with a plain string, which replaces only the first match. Replace all occurrences.
solution_explanation: 'String.replace with a string target replaces only the first match. Splitting on
  the word and joining with ''***'' replaces every occurrence.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix censor(text, word): replace every occurrence of word with '***'.\n  censor('bad bad\
    \ wolf', 'bad') -> '*** *** wolf'\nAssume word contains no regex special characters.\nClick Run to\
    \ try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function censor(text, word) {\n  return text.replace(word, '***'); // replaces only the\
      \ first match\n}\n"
    readonly: false
  visible_tests:
  - name: replaces all
    code: 'assert(censor(''bad bad wolf'', ''bad'') === ''*** *** wolf'', censor(''bad bad wolf'', ''bad''));

      '
  - name: single occurrence
    code: 'assert(censor(''a bad day'', ''bad'') === ''a *** day'');

      '
  hidden_tests:
  - name: three occurrences
    code: 'assert(censor(''no no no'', ''no'') === ''*** *** ***'');

      '
  - name: word absent unchanged
    code: 'assert(censor(''clean text'', ''bad'') === ''clean text'');

      '
  - name: adjacent occurrences
    code: 'assert(censor(''xx'', ''x'') === ''******'');

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.js`, read the instructions, and run the visible tests to see
    which assertion fails first.'
- order: 2
