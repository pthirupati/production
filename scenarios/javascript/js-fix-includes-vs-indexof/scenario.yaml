title: Fix the Truthiness Bug with indexOf
slug: js-fix-includes-vs-indexof
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the Truthiness Bug with indexOf`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: hasValue(arr, x) should return whether x is in the array, but it returns `arr.indexOf(x)`
  (a number) and treats it as a boolean — and index 0 is falsy, so a match at position 0 wrongly reports
  false. Fix it to return a real boolean.


  OBJECTIVE: See a match at index 0 report false; Compare indexOf against -1, or use includes; Return
  a strict boolean. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
