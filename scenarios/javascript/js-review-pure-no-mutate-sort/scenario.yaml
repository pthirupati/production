objectives:
- Recognize the in-place sort side effect
- Sort a copy instead of the original
- Return ascending-sorted values without mutating input
initial_state: sortedCopy(arr) is supposed to return a sorted COPY, leaving the input untouched, but it
  sorts arr in place and returns it, so callers see their array reordered. Refactor it to sort a copy.
  The hidden test pins the no-mutation contract.
solution_explanation: 'Array.sort mutates its receiver. Spreading into a new array first sorts a copy
  and leaves the caller''s array intact.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: review
  instructions: "Refactor sortedCopy(arr): return a new ascending-sorted array; do NOT mutate the input.\n\
    \  sortedCopy([3,1,2]) -> [1,2,3], original stays [3,1,2]\nClick Run to try it, then Check Solution\
    \ to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function sortedCopy(arr) {\n  return arr.sort((a, b) => a - b); // sorts in place, mutates\
      \ input\n}\n"
    readonly: false
  visible_tests:
  - name: sorts ascending
    code: 'assert(JSON.stringify(sortedCopy([3,1,2])) === JSON.stringify([1,2,3]), JSON.stringify(sortedCopy([3,1,2])));

      '
  - name: already sorted
    code: 'assert(JSON.stringify(sortedCopy([1,2,3])) === JSON.stringify([1,2,3]), JSON.stringify(sortedCopy([1,2,3])));

      '
  hidden_tests:
  - name: does not mutate input
    code: 'const src = [3, 1, 2];

      sortedCopy(src);

      assert(JSON.stringify(src) === JSON.stringify([3, 1, 2]), ''input mutated'');

      '
  - name: returns a new array
    code: 'const src = [2, 1];

      const out = sortedCopy(src);

      assert(out !== src);

      '
  - name: negatives
    code: 'assert(JSON.stringify(sortedCopy([0, -5, 3, -1])) === JSON.stringify([-5, -1, 0, 3]), JSON.stringify(sortedCopy([0,
      -5, 3, -1])));

      '
  timeout: 8
