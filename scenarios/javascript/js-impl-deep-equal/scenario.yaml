  - name: nested equal
    code: 'assert(deepEqual({x:[1,2]}, {x:[1,2]}) === true);

      '
  - name: different value
    code: 'assert(deepEqual({x:1}, {x:2}) === false);

      '
  hidden_tests:
  - name: key order irrelevant
    code: 'assert(deepEqual({a:1,b:2}, {b:2,a:1}) === true);

      '
  - name: array order matters
    code: 'assert(deepEqual([1,2], [2,1]) === false);

      '
  - name: primitives
    code: 'assert(deepEqual(3, 3) === true && deepEqual(''a'', ''b'') === false);

      '
  - name: nested deep
    code: 'assert(deepEqual({a:{b:{c:[1]}}}, {a:{b:{c:[1]}}}) === true);

      '
  - name: missing key
    code: 'assert(deepEqual({a:1}, {a:1,b:2}) === false);

      '
  - name: array vs object
    code: 'assert(deepEqual([], {}) === false);

      '
