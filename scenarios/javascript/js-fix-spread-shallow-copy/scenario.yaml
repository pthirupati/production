title: Fix the Object Mutation in updateUser
slug: js-fix-spread-shallow-copy
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the Object Mutation in updateUser`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: updateUser(user, patch) should return a NEW object with patch applied, leaving
  the original user unchanged, but it mutates user with Object.assign(user, patch). Fix it to copy first
  so the input is not mutated and patch overrides.


  OBJECTIVE: See the original user object get mutated; Build a new object via spread/assign-into-empty;
  Apply patch on top so it overrides. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See the original user object get mutated
- Build a new object via spread/assign-into-empty
- Apply patch on top so it overrides
initial_state: updateUser(user, patch) should return a NEW object with patch applied, leaving the original
  user unchanged, but it mutates user with Object.assign(user, patch). Fix it to copy first so the input
  is not mutated and patch overrides.
solution_explanation: 'Object.assign(user, patch) mutates user. Spreading into a new object literal copies
  user, then patch overrides, leaving the input intact.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix updateUser(user, patch): return a NEW object combining user and patch (patch wins),\
    \ WITHOUT mutating user.\n  updateUser({a:1,b:2}, {b:9}) -> {a:1, b:9}\nClick Run to try it, then\
    \ Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function updateUser(user, patch) {\n  return Object.assign(user, patch); // mutates user\n\
      }\n"
    readonly: false
  visible_tests:
  - name: patch overrides
    code: 'assert(JSON.stringify(updateUser({a:1,b:2}, {b:9})) === JSON.stringify({a:1,b:9}), JSON.stringify(updateUser({a:1,b:2},
      {b:9})));

      '
  - name: adds new key
    code: 'assert(JSON.stringify(updateUser({a:1}, {c:3})) === JSON.stringify({a:1,c:3}), JSON.stringify(updateUser({a:1},
      {c:3})));

      '
  hidden_tests:
  - name: does not mutate user
    code: 'const u = {a:1,b:2};

      updateUser(u, {b:9});

      assert(JSON.stringify(u) === JSON.stringify({a:1,b:2}), ''user mutated'');

      '
  - name: returns a new object
    code: 'const u = {a:1};

      const r = updateUser(u, {});

      assert(r !== u);

      '
  - name: empty patch copies
    code: 'assert(JSON.stringify(updateUser({x:5}, {})) === JSON.stringify({x:5}), JSON.stringify(updateUser({x:5},
      {})));

      '
  timeout: 8
hints:
