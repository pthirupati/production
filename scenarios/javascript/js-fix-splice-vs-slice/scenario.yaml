title: Fix takeFirst Mutating the Input
slug: js-fix-splice-vs-slice
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix takeFirst Mutating the Input`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: takeFirst(arr, k) should return the first k elements WITHOUT modifying the
  input, but it uses splice, which removes elements from the original array. Use slice instead so the
  input is untouched.


  OBJECTIVE: See the input array get shortened; Use slice (non-mutating) instead of splice; Return the
  first k elements as a copy. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See the input array get shortened
- Use slice (non-mutating) instead of splice
- Return the first k elements as a copy
initial_state: takeFirst(arr, k) should return the first k elements WITHOUT modifying the input, but it
  uses splice, which removes elements from the original array. Use slice instead so the input is untouched.
solution_explanation: 'splice mutates by removing elements. slice returns a shallow copy of the requested
  range and leaves the source array intact.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix takeFirst(arr, k): return the first k elements as a NEW array, leaving arr unchanged.\n\
    \  takeFirst([1,2,3,4], 2) -> [1,2]\nClick Run to try it, then Check Solution to grade against all\
    \ tests.\n"
  files:
  - path: solution.js
    content: "function takeFirst(arr, k) {\n  return arr.splice(0, k); // splice mutates arr\n}\n"
    readonly: false
  visible_tests:
  - name: first two
    code: 'assert(JSON.stringify(takeFirst([1,2,3,4], 2)) === JSON.stringify([1,2]), JSON.stringify(takeFirst([1,2,3,4],
      2)));

      '
  - name: k zero
    code: 'assert(JSON.stringify(takeFirst([1,2], 0)) === JSON.stringify([]), JSON.stringify(takeFirst([1,2],
      0)));

      '
  hidden_tests:
  - name: does not mutate input
    code: 'const src = [1,2,3,4];

      takeFirst(src, 2);

      assert(JSON.stringify(src) === JSON.stringify([1,2,3,4]), ''input mutated'');

      '
  - name: k larger than length
    code: 'assert(JSON.stringify(takeFirst([1,2], 5)) === JSON.stringify([1,2]), JSON.stringify(takeFirst([1,2],
      5)));

      '
  - name: empty array
    code: 'assert(JSON.stringify(takeFirst([], 3)) === JSON.stringify([]), JSON.stringify(takeFirst([],
      3)));

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.js`, read the instructions, and run the visible tests to see
