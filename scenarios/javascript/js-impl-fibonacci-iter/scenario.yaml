title: Implement Fibonacci (Iterative)
slug: js-impl-fibonacci-iter
category: Build
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Implement Fibonacci (Iterative)`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement fib(n): the n-th Fibonacci number, 0-indexed (0,1,1,2,3,5,...).
  It must be efficient (no exponential recursion) so large n is fast. The stub is empty so tests fail.


  OBJECTIVE: Return the correct base cases; Iterate to avoid exponential recursion; Compute large n quickly.
  Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
