  visible_tests:
  - name: base cases
    code: 'assert(fib(0) === 0 && fib(1) === 1);

      '
  - name: fib(10)
    code: 'assert(fib(10) === 55);

      '
  hidden_tests:
  - name: fib(2)
    code: 'assert(fib(2) === 1);

      '
  - name: fib(20)
    code: 'assert(fib(20) === 6765);

      '
  - name: fib(30) fast
    code: 'assert(fib(30) === 832040);

      '
  - name: sequence prefix
    code: 'assert(JSON.stringify([0,1,2,3,4,5,6].map(fib)) === JSON.stringify([0,1,1,2,3,5,8]), JSON.stringify([0,1,2,3,4,5,6].map(fib)));

      '
  timeout: 8
