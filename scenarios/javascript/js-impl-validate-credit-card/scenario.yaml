title: Implement the Luhn Checksum
slug: js-impl-validate-credit-card
category: Build
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Implement the Luhn Checksum`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement luhnValid(digits): given a string of digits, return true if it passes
  the Luhn checksum (used for credit-card numbers). The stub is empty so tests fail. Non-digit characters
  should make it false.


  OBJECTIVE: Double every second digit from the right; Subtract 9 from doubled values over 9; Return true
  only when the total is a multiple of 10. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
