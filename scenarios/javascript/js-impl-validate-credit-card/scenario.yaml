  visible_tests:
  - name: valid number
    code: 'assert(luhnValid(''4539148803436467'') === true);

      '
  - name: invalid number
    code: 'assert(luhnValid(''1234567812345678'') === false);

      '
  hidden_tests:
  - name: simple valid
    code: 'assert(luhnValid(''79927398713'') === true);

      '
  - name: off by one invalid
    code: 'assert(luhnValid(''79927398710'') === false);

      '
  - name: non-digit rejected
    code: 'assert(luhnValid(''1234a'') === false);

      '
  - name: empty rejected
    code: 'assert(luhnValid('''') === false);

      '
  timeout: 8
