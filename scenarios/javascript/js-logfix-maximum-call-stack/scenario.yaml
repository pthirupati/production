title: 'Log Analysis: Fix the Maximum Call Stack Error'
slug: js-logfix-maximum-call-stack
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Log Analysis: Fix the Maximum
  Call Stack Error` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The log shows `RangeError: Maximum call stack size exceeded` from countdown()
  because it recurses without ever hitting a base case (it decrements but never stops at 0). Add the base
  case so it terminates and returns the list of values from n down to 1.


  OBJECTIVE: Read the stack-overflow error and find the missing base case; Stop recursion at n <= 0; Return
  the countdown array. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Read the stack-overflow error and find the missing base case
- Stop recursion at n <= 0
- Return the countdown array
initial_state: 'The log shows `RangeError: Maximum call stack size exceeded` from countdown() because
  it recurses without ever hitting a base case (it decrements but never stops at 0). Add the base case
  so it terminates and returns the list of values from n down to 1.'
solution_explanation: 'Without a base case the recursion descends forever. Returning [] for n <= 0 terminates
  it and builds the countdown array.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: logfix
  instructions: "Fix countdown(n): return [n, n-1, ..., 1] (empty for n <= 0). The log shows infinite\
    \ recursion.\n  countdown(3) -> [3, 2, 1]\nClick Run to try it, then Check Solution to grade against\
    \ all tests.\n"
  files:
  - path: solution.js
    content: "// Production log:\n//   RangeError: Maximum call stack size exceeded\n//     at countdown\
      \ (count.js:2)\n\nfunction countdown(n) {\n  return [n, ...countdown(n - 1)]; // never stops\n}\n"
    readonly: false
  visible_tests:
  - name: countdown 3
    code: 'assert(JSON.stringify(countdown(3)) === JSON.stringify([3, 2, 1]), JSON.stringify(countdown(3)));

      '
  - name: countdown 1
    code: 'assert(JSON.stringify(countdown(1)) === JSON.stringify([1]), JSON.stringify(countdown(1)));

      '
  hidden_tests:
  - name: countdown 0 empty
    code: 'assert(JSON.stringify(countdown(0)) === JSON.stringify([]), JSON.stringify(countdown(0)));

      '
  - name: countdown 5
    code: 'assert(JSON.stringify(countdown(5)) === JSON.stringify([5, 4, 3, 2, 1]), JSON.stringify(countdown(5)));

      '
  - name: negative empty
    code: 'assert(JSON.stringify(countdown(-2)) === JSON.stringify([]), JSON.stringify(countdown(-2)));

      '
  - name: does not overflow
    code: 'let ok = true;

      try { countdown(4); } catch (e) { ok = false; }

      assert(ok);

      '
  timeout: 8
