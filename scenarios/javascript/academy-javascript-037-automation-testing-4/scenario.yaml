description: 'CONTEXT: A team operating JavaScript needs you to resolve `javascript: Testing — Automation
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for testing. Automate the boring parts
  without hiding important safety checks. Automation lab: remove toil around testing. Codify repeatable
  steps for unit tests, fixtures, and assertions and prove the automation is idempotent.


  OBJECTIVE: Day-2 testing work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `systemctl is-active nginx` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 testing work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for testing. Automate the boring parts without hiding
  important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — test files and `pytest -q` output.

    2. Write down what looks normal versus wrong or missing for testing.

    3. Recall the core idea: unit tests, fixtures, and assertions. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — test files and `pytest -q` output.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — tests cover the change and pass.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
