  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: 'Implement throttle(fn, interval) -> throttled function. The first call runs fn right
    away; calls during the next `interval` ms are dropped; after the window the next call runs again.

    Use the global setTimeout.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.js
    content: "function throttle(fn, interval) {\n  // TODO: run fn on the leading edge, then ignore calls\
      \ for `interval` ms\n}\n"
    readonly: false
  visible_tests:
  - name: fires immediately, then blocks
    code: "const _oST=globalThis.setTimeout;let _q=[];\nglobalThis.setTimeout=(cb)=>{_q.push(cb);return\
      \ {};};\nconst flush=()=>{const live=_q.slice();_q=[];live.forEach(cb=>cb());};\ntry {\n  let calls=0;\
      \ const t=throttle(()=>{calls++;},100);\n  t(); t(); t();\n  assert(calls===1,'leading call only,\
      \ got '+calls);\n  flush();\n  t();\n  assert(calls===2,'fires again after window, got '+calls);\n\
      } finally { globalThis.setTimeout=_oST; }\n"
  - name: returns a function
    code: 'assert(typeof throttle(()=>{},10)===''function'');

      '
  hidden_tests:
  - name: first arg used on leading call
    code: "const _oST=globalThis.setTimeout;let _q=[];\nglobalThis.setTimeout=(cb)=>{_q.push(cb);return\
      \ {};};\ntry {\n  let seen=null; const t=throttle((x)=>{seen=x;},50);\n  t('a'); t('b');\n  assert(seen==='a','leading\
      \ arg should be a, got '+seen);\n} finally { globalThis.setTimeout=_oST; }\n"
  - name: blocks every call within the window
    code: "const _oST=globalThis.setTimeout;let _q=[];\nglobalThis.setTimeout=(cb)=>{_q.push(cb);return\
      \ {};};\ntry {\n  let calls=0; const t=throttle(()=>{calls++;},100);\n  for (let i=0;i<10;i++) t();\n\
      \  assert(calls===1,'only one call in window, got '+calls);\n} finally { globalThis.setTimeout=_oST;\
      \ }\n"
  - name: multiple windows
    code: "const _oST=globalThis.setTimeout;let _q=[];\nglobalThis.setTimeout=(cb)=>{_q.push(cb);return\
      \ {};};\nconst flush=()=>{const live=_q.slice();_q=[];live.forEach(cb=>cb());};\ntry {\n  let calls=0;\
      \ const t=throttle(()=>{calls++;},10);\n  t(); flush(); t(); flush(); t();\n  assert(calls===3,'expected\
      \ 3 across windows, got '+calls);\n} finally { globalThis.setTimeout=_oST; }\n"
  - name: forwards multiple args on leading call
    code: "const _oST=globalThis.setTimeout;let _q=[];\nglobalThis.setTimeout=(cb)=>{_q.push(cb);return\
      \ {};};\ntry {\n  let sum=0; const t=throttle((a,b)=>{sum=a+b;},10);\n  t(4,5); t(1,1);\n  assert(sum===9,'expected\
      \ 9 from leading call, got '+sum);\n} finally { globalThis.setTimeout=_oST; }\n"
  timeout: 8
