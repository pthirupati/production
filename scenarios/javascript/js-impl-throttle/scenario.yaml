title: Implement throttle (Leading Edge)
slug: js-impl-throttle
category: Build
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Implement throttle (Leading Edge)`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement throttle(fn, interval): return a function that calls fn immediately
  on the first invocation, then ignores further calls until `interval` ms have elapsed (leading-edge throttling).
  Use setTimeout to re-open the gate. The stub is empty so tests fail.


  OBJECTIVE: Call fn immediately on the leading edge; Block calls during the cooldown window; Re-open
  after `interval` ms via setTimeout. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
