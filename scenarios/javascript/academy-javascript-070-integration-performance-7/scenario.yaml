description: 'Integration lab: connect performance with an adjacent platform in the
  JavaScript Development stack. Validate authentication, data handoff, and failure
  behavior for render cost, memoization, and profiling.'
objectives:
- performance is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for performance.
  Downstream consumers are waiting on this integration path.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the profiler and re-render counts.

    2. Write down what looks normal versus wrong or missing for performance.

    3. Recall the core idea: render cost, memoization, and profiling. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for performance.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the profiler and re-render counts.

    2. Configure credentials and networking, then drive one happy-path transaction
    end to end across both systems.

    3. Verify the result — unnecessary work is removed and the UI is smooth.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-javascript-070-integration-performance-7.conf`,
    then click Check Solution.'
