      assert(binarySearch([5], 9) === -1);
  - name: below range
    code: |
      assert(binarySearch([10,20,30], 5) === -1);
  - name: all positions
    code: |
      const a = [1,2,3,4,5,6,7,8];
      let ok = true;
      for (let i = 0; i < a.length; i++) { if (binarySearch(a, a[i]) !== i) ok = false; }
      assert(ok, 'wrong index somewhere');
