  instructions: "Implement wordFrequency(text) -> { word: count }. Lowercase words; strip leading/trailing\
    \ .,!? ; split on whitespace; ignore empty tokens.\n  wordFrequency('Cat cat, dog.') -> {cat:2, dog:1}\n\
    Click Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function wordFrequency(text) {\n  // TODO: return a map of normalized word -> count\n}\n"
    readonly: false
  visible_tests:
  - name: counts and normalizes
    code: 'assert(JSON.stringify(wordFrequency(''Cat cat, dog.'')) === JSON.stringify({cat:2, dog:1}),
      JSON.stringify(wordFrequency(''Cat cat, dog.'')));

      '
  - name: single
    code: 'assert(JSON.stringify(wordFrequency(''hello'')) === JSON.stringify({hello:1}), JSON.stringify(wordFrequency(''hello'')));

      '
  hidden_tests:
  - name: punctuation stripped
    code: 'assert(JSON.stringify(wordFrequency(''hi! hi? hi.'')) === JSON.stringify({hi:3}), JSON.stringify(wordFrequency(''hi!
      hi? hi.'')));

      '
  - name: case folded
    code: 'assert(JSON.stringify(wordFrequency(''The THE the'')) === JSON.stringify({the:3}), JSON.stringify(wordFrequency(''The
      THE the'')));

      '
  - name: extra spaces
    code: 'assert(JSON.stringify(wordFrequency(''a   a  b'')) === JSON.stringify({a:2, b:1}), JSON.stringify(wordFrequency(''a   a  b'')));

      '
  - name: empty text
    code: 'assert(JSON.stringify(wordFrequency('''')) === JSON.stringify({}), JSON.stringify(wordFrequency('''')));

      '
  timeout: 8
