description: 'CONTEXT: A team operating JavaScript needs you to resolve `Implement wordFrequency` during
  a realistic incident. The business impact is reduced service reliability until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Implement wordFrequency(text): return an object mapping each lowercased word
  to its count. Words are separated by whitespace; trim surrounding punctuation (.,!?). The stub is empty
  so tests fail.


  OBJECTIVE: Split on whitespace and lowercase; Strip surrounding punctuation from words; Count occurrences
  into an object. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
