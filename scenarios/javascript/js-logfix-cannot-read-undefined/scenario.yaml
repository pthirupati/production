title: 'Log Analysis: Fix ''Cannot read properties of undefined'
slug: js-logfix-cannot-read-undefined
category: Fix
description: 'CONTEXT: A team operating JavaScript has raised a ticket for `Log Analysis: Fix ''Cannot
  read properties of undefined`. A customer-facing workflow is degraded and the on-call engineer (you)
  must diagnose and resolve it. Business impact: reduced service reliability and blocked users until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project. The architecture is
  a single lab-primary node exposing modules, browser console, and Node tooling; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Production logged: `TypeError: Cannot read properties of undefined (reading
  ''city'')` in getCity(). The user object may lack an `address`. Use optional chaining (or guards) to
  return the city or a fallback ''unknown'' without crashing.


  OBJECTIVE: Read the TypeError and find the unsafe nested access; Use optional chaining / guards for
  the missing address; Return ''unknown'' when the path is absent. Acceptance criteria: the change is
  minimal and reversible, and success means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant modules, browser console, and Node tooling), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
