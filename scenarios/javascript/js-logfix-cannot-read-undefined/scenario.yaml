coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: logfix
  instructions: 'Fix getCity(user): return user.address.city, or ''unknown'' if address (or city) is missing.
    The log shows it crashes when address is undefined.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.js
    content: "// Production log:\n//   TypeError: Cannot read properties of undefined (reading 'city')\n\
      //     at getCity (user.js:2)\n\nfunction getCity(user) {\n  return user.address.city; // crashes\
      \ when address is undefined\n}\n"
    readonly: false
  visible_tests:
  - name: has address
    code: 'assert(getCity({ address: { city: ''NYC'' } }) === ''NYC'');

      '
  - name: missing address
    code: 'assert(getCity({}) === ''unknown'', getCity({}));

      '
  hidden_tests:
  - name: missing city
    code: 'assert(getCity({ address: {} }) === ''unknown'');

      '
  - name: null user
    code: 'assert(getCity(null) === ''unknown'');

      '
  - name: does not throw on undefined
    code: 'assert(getCity(undefined) === ''unknown'');

      '
  - name: real city returned
    code: 'assert(getCity({ address: { city: ''Paris'' } }) === ''Paris'');

      '
  timeout: 8
