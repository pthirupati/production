description: 'CONTEXT: A team operating JavaScript needs you to resolve `Log Analysis: Fix ''Cannot read
  properties of undefined` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Production logged: `TypeError: Cannot read properties of undefined (reading
  ''city'')` in getCity(). The user object may lack an `address`. Use optional chaining (or guards) to
  return the city or a fallback ''unknown'' without crashing.


  OBJECTIVE: Read the TypeError and find the unsafe nested access; Use optional chaining / guards for
  the missing address; Return ''unknown'' when the path is absent. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
