description: 'CONTEXT: Complete the bundling coding exercise in the browser IDE.


  ENVIRONMENT: FixitLab JavaScript/React practice IDE — edit solution.js, Run visible
  tests, then Check Solution.


  SYMPTOM / STARTING STATE: Coding challenge: bundling. The stub in solution.js is
  incomplete so tests fail until you implement it.


  OBJECTIVE: Implement the required function so all visible and hidden tests pass.


  VERIFY: Check Solution passes all hidden tests.

  '
objectives:
- Implement the required function in solution.js
- Pass visible tests with Run
- Pass Check Solution (hidden tests)
initial_state: 'Coding challenge: bundling. The stub in solution.js is incomplete
  so tests fail until you implement it.'
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: the build is bloated or
    breaks at runtime. This lab is about bundling — build config, code splitting,
    and assets. Read the objectives and the current state, and note precisely what
    looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For bundling problems the reliable method is:
    (1) reproduce/observe the failure, (2) narrow from the whole system down to the
    one component that owns the symptom, (3) change exactly one thing, (4) re-check.
    Add or fix the exporter / dashboard / alert with clear names, labels, and a sensible
    threshold.'
- order: 3
  cost: 25
  content: WHICH TOOL — use the IDE Run button on visible tests first; read the failing
    assertion message carefully.
- order: 4
  cost: 40
  content: NARROW DOWN — implement the smallest change that satisfies one failing
    test, then re-run.
- order: 5
  cost: 60
  content: NEAR-SOLUTION — finish the function so all visible tests pass, then Check
    Solution.
