title: Fix the Loose-Equality Bug in isZero
slug: js-fix-equality-loose-vs-strict
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the Loose-Equality Bug in
  isZero` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: isZero(x) should return true ONLY for the number 0, but it uses loose equality
  (==), so '''', false, ''0'', and [] all coerce to 0 and wrongly return true. Switch to strict equality
  and a type check.


  OBJECTIVE: See coercion make non-numbers look like zero; Use strict equality (===); Return true only
  for the actual number 0. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See coercion make non-numbers look like zero
- Use strict equality (===)
- Return true only for the actual number 0
initial_state: isZero(x) should return true ONLY for the number 0, but it uses loose equality (==), so
  '', false, '0', and [] all coerce to 0 and wrongly return true. Switch to strict equality and a type
  check.
solution_explanation: 'Loose == coerces operands, so many falsy values equal 0. Strict === compares type
  and value, matching only the number 0.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: 'Fix isZero(x) to return true only when x is the number 0 (not '''', not false, not ''0'').

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.js
    content: "function isZero(x) {\n  return x == 0; // loose equality coerces '', false, [], '0'\n}\n"
    readonly: false
  visible_tests:
  - name: number zero
    code: 'assert(isZero(0) === true);

      '
  - name: empty string is not zero
    code: 'assert(isZero('''') === false, "'''' should not be zero");

      '
  hidden_tests:
  - name: false is not zero
    code: 'assert(isZero(false) === false);

      '
  - name: string zero is not number zero
    code: 'assert(isZero(''0'') === false);

      '
  - name: empty array is not zero
    code: 'assert(isZero([]) === false);

      '
  - name: nonzero number
    code: 'assert(isZero(5) === false);

      '
  - name: still true for 0
    code: 'assert(isZero(0) === true);

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.js`, read the instructions, and run the visible tests to see
    which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Return true only for the actual number 0.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
