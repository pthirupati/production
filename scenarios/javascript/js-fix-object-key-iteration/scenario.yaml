title: Fix sumValues Iterating Keys Not Values
slug: js-fix-object-key-iteration
category: JavaScript Development
description: sumValues(obj) should sum the numeric VALUES of an object, but it sums Object.keys (the keys),
  producing NaN/string concatenation. Iterate the values instead.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See it operate on keys, not values
- Iterate Object.values
- Return the numeric sum
initial_state: sumValues(obj) should sum the numeric VALUES of an object, but it sums Object.keys (the
  keys), producing NaN/string concatenation. Iterate the values instead.
solution_explanation: |
  Reducing over Object.keys adds the property names. Object.values yields the values, which reduce sums numerically.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: |
    Fix sumValues(obj): return the sum of the object's numeric values.
      sumValues({a:1, b:2, c:3}) -> 6
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function sumValues(obj) {
        return Object.keys(obj).reduce((acc, k) => acc + k, 0); // adds keys
      }
    readonly: false
  visible_tests:
  - name: basic
    code: |
      assert(sumValues({a:1, b:2, c:3}) === 6);
  - name: empty object
    code: |
      assert(sumValues({}) === 0);
  hidden_tests:
  - name: single
    code: |
      assert(sumValues({x: 42}) === 42);
  - name: negatives
    code: |
      assert(sumValues({a: -5, b: 5}) === 0);
  - name: is a number
    code: |
      assert(typeof sumValues({a: 1}) === 'number' && sumValues({a:1}) === 1);
  timeout: 8
hints:
- order: 1
  cost: 10
  content: sumValues({a:1}) currently does 0 + 'a' = '0a' — it's adding keys.
- order: 2
  cost: 20
  content: Object.values(obj) gives the values; Object.keys gives the keys.
- order: 3
  cost: 30
  content: Reduce over Object.values(obj).
