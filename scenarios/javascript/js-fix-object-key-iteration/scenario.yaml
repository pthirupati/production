title: Fix sumValues Iterating Keys Not Values
slug: js-fix-object-key-iteration
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix sumValues Iterating Keys
  Not Values` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: sumValues(obj) should sum the numeric VALUES of an object, but it sums Object.keys
  (the keys), producing NaN/string concatenation. Iterate the values instead.


  OBJECTIVE: See it operate on keys, not values; Iterate Object.values; Return the numeric sum. Success
  means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See it operate on keys, not values
- Iterate Object.values
- Return the numeric sum
initial_state: sumValues(obj) should sum the numeric VALUES of an object, but it sums Object.keys (the
  keys), producing NaN/string concatenation. Iterate the values instead.
solution_explanation: 'Reducing over Object.keys adds the property names. Object.values yields the values,
  which reduce sums numerically.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix sumValues(obj): return the sum of the object's numeric values.\n  sumValues({a:1,\
    \ b:2, c:3}) -> 6\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "function sumValues(obj) {\n  return Object.keys(obj).reduce((acc, k) => acc + k, 0); //\
      \ adds keys\n}\n"
    readonly: false
  visible_tests:
  - name: basic
    code: 'assert(sumValues({a:1, b:2, c:3}) === 6);

      '
  - name: empty object
    code: 'assert(sumValues({}) === 0);

      '
  hidden_tests:
  - name: single
    code: 'assert(sumValues({x: 42}) === 42);

      '
  - name: negatives
    code: 'assert(sumValues({a: -5, b: 5}) === 0);

      '
  - name: is a number
    code: 'assert(typeof sumValues({a: 1}) === ''number'' && sumValues({a:1}) === 1);

      '
  timeout: 8
