coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: impl
  instructions: 'Implement class EventEmitter with on(event, handler), off(event, handler), emit(event,
    ...args). Handlers fire in registration order.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.js
    content: "class EventEmitter {\n  // TODO: implement on, off, emit\n}\n"
    readonly: false
  visible_tests:
  - name: on and emit
    code: 'const e = new EventEmitter();

      let got = 0;

      e.on(''tick'', (n) => { got = n; });

      e.emit(''tick'', 42);

      assert(got === 42);

      '
  - name: multiple handlers in order
    code: 'const e = new EventEmitter();

      const seen = [];

      e.on(''x'', () => seen.push(1));

      e.on(''x'', () => seen.push(2));

      e.emit(''x'');

      assert(JSON.stringify(seen) === JSON.stringify([1, 2]));

      '
  hidden_tests:
  - name: off removes a handler
    code: 'const e = new EventEmitter();

      let calls = 0;

      const h = () => { calls++; };

      e.on(''a'', h);

      e.off(''a'', h);

      e.emit(''a'');

      assert(calls === 0, ''calls='' + calls);

      '
  - name: off keeps other handlers
    code: 'const e = new EventEmitter();

      const seen = [];

      const h1 = () => seen.push(1);

      const h2 = () => seen.push(2);

      e.on(''a'', h1);

      e.on(''a'', h2);

      e.off(''a'', h1);

      e.emit(''a'');

      assert(JSON.stringify(seen) === JSON.stringify([2]));

      '
  - name: emit with multiple args
    code: 'const e = new EventEmitter();

      let sum = 0;

      e.on(''add'', (a, b) => { sum = a + b; });

      e.emit(''add'', 3, 4);

      assert(sum === 7);

      '
  - name: emit unknown event is a no-op
    code: 'const e = new EventEmitter();

      e.emit(''nope'');

      assert(true);

      '
  timeout: 8
