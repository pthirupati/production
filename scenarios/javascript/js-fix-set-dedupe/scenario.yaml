title: Fix unique Losing Order / Not Deduping
slug: js-fix-set-dedupe
category: JavaScript Development
description: unique(arr) should remove duplicates while preserving first-seen order, but the current filter
  compares each element to the WRONG index (indexOf vs the loop index is inverted), so it removes the
  wrong items. Fix the dedupe to keep first occurrences in order.
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See wrong elements removed
- Keep an element only at its first index
- Preserve order
initial_state: unique(arr) should remove duplicates while preserving first-seen order, but the current
  filter compares each element to the WRONG index (indexOf vs the loop index is inverted), so it removes
  the wrong items. Fix the dedupe to keep first occurrences in order.
solution_explanation: |
  lastIndexOf keeps the final occurrence, reordering output. Filtering where indexOf(v) === i keeps each element at its first position, preserving order.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: |
    Fix unique(arr): return a new array with duplicates removed, preserving first-seen order.
      unique([3,1,3,2,1]) -> [3,1,2]
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function unique(arr) {
        return arr.filter((v, i) => arr.lastIndexOf(v) === i); // keeps LAST occurrence
      }
    readonly: false
  visible_tests:
  - name: preserves first-seen order
    code: |
      assert(JSON.stringify(unique([3,1,3,2,1])) === JSON.stringify([3,1,2]), JSON.stringify(unique([3,1,3,2,1])));
  - name: already unique
    code: |
      assert(JSON.stringify(unique([1,2,3])) === JSON.stringify([1,2,3]), JSON.stringify(unique([1,2,3])));
  hidden_tests:
  - name: keeps first not last
    code: |
      assert(JSON.stringify(unique([1,2,1])) === JSON.stringify([1,2]), JSON.stringify(unique([1,2,1])));
  - name: strings
    code: |
      assert(JSON.stringify(unique(['b','a','b','c'])) === JSON.stringify(['b','a','c']), JSON.stringify(unique(['b','a','b','c'])));
  - name: empty
    code: |
      assert(JSON.stringify(unique([])) === JSON.stringify([]), JSON.stringify(unique([])));
  - name: all same
    code: |
      assert(JSON.stringify(unique([5,5,5])) === JSON.stringify([5]), JSON.stringify(unique([5,5,5])));
  timeout: 8
hints:
- order: 1
  cost: 10
  content: unique([1,2,1]) returns [2,1] instead of [1,2] — it keeps the LAST occurrence.
- order: 2
  cost: 20
  content: To keep the FIRST occurrence, an element survives only at its indexOf position.
- order: 3
  cost: 30
  content: Use arr.indexOf(v) === i (not lastIndexOf).
