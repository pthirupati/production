title: Fix the Hoisting Bug in buildLabels
slug: js-fix-hoisting-tdz
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the Hoisting Bug in buildLabels`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: buildLabels(items) should return [''#0: a'', ''#1: b'', ...], but the helper
  result variable is USED before it is declared with const, and the loop reads `label` outside its block.
  Function-declaration hoisting masks the intent and the labels come out wrong/undefined. Fix the declaration
  order and scoping so each label is built correctly.


  OBJECTIVE: See undefined / wrong values from use-before-declare; Declare variables before use, in the
  right scope; Return the correctly numbered labels. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
