title: 'Log Analysis: Fix the Accidental Assignment in an if'
slug: js-logfix-assignment-in-condition
category: JavaScript Development
description: 'QA reported that classify(n) labels EVERYTHING ''special'', even normal numbers. The log
  shows the branch always taken. The bug: the if condition uses assignment (=) instead of comparison (===),
  so it assigns 0 to a variable and the truthiness is wrong. Fix the comparison so only n === 0 is ''special''.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Read the log and spot the always-true branch
- Replace assignment (=) with comparison (===)
- Label only 0 as 'special'
initial_state: 'QA reported that classify(n) labels EVERYTHING ''special'', even normal numbers. The log
  shows the branch always taken. The bug: the if condition uses assignment (=) instead of comparison (===),
  so it assigns 0 to a variable and the truthiness is wrong. Fix the comparison so only n === 0 is ''special''.'
solution_explanation: |
  A single = assigns instead of compares, so the condition's value was the assigned operand, not a comparison. Using n === 0 tests the actual value and labels only zero as special.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: logfix
  instructions: |
    Fix classify(n): return 'special' when n === 0, otherwise 'normal'. The log shows the branch is always taken because of an accidental assignment.
      classify(0) -> 'special'; classify(5) -> 'normal'
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      // QA log:
      //   classify(5) -> 'special'  (expected 'normal')
      //   classify(9) -> 'special'  (expected 'normal')
      //   every input takes the 'special' branch

      function classify(n) {
        let flag = 1;
        if (flag = 0) {            // assignment, not comparison
          return 'normal';
        }
        return 'special';
      }
    readonly: false
  visible_tests:
  - name: zero is special
    code: |
      assert(classify(0) === 'special', classify(0));
  - name: nonzero is normal
    code: |
      assert(classify(5) === 'normal', classify(5));
  hidden_tests:
  - name: negative is normal
    code: |
      assert(classify(-3) === 'normal');
  - name: large is normal
    code: |
      assert(classify(1000) === 'normal');
  - name: one is normal
    code: |
      assert(classify(1) === 'normal');
  - name: zero stays special
    code: |
      assert(classify(0) === 'special');
  timeout: 8
hints:
- order: 1
  cost: 10
  content: The log shows every input is 'special' — the if branch never runs as intended.
- order: 2
  cost: 20
  content: '`if (flag = 0)` assigns 0 (falsy) and evaluates to 0, so the branch is always skipped.'
- order: 3
  cost: 30
  content: 'Compare n to 0 with ===: `if (n === 0) return ''special'';` else ''normal''.'
