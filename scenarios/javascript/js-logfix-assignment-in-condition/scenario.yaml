title: 'Log Analysis: Fix the Accidental Assignment in an if'
slug: js-logfix-assignment-in-condition
category: Fix
description: 'CONTEXT: A team operating JavaScript has raised a ticket for `Log Analysis: Fix the Accidental
  Assignment in an if`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project. The architecture is
  a single lab-primary node exposing modules, browser console, and Node tooling; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: QA reported that classify(n) labels EVERYTHING ''special'', even normal numbers.
  The log shows the branch always taken. The bug: the if condition uses assignment (=) instead of comparison
  (===), so it assigns 0 to a variable and the truthiness is wrong. Fix the comparison so only n === 0
  is ''special''.


  OBJECTIVE: Read the log and spot the always-true branch; Replace assignment (=) with comparison (===);
  Label only 0 as ''special''. Acceptance criteria: the change is minimal and reversible, and success
  means all hidden tests pass.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant modules, browser console, and Node tooling), changing one thing at a time. Check
  your work continuously against the objective — success means all hidden tests pass.


  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Read the log and spot the always-true branch
- Replace assignment (=) with comparison (===)
- Label only 0 as 'special'
initial_state: 'QA reported that classify(n) labels EVERYTHING ''special'', even normal numbers. The log
  shows the branch always taken. The bug: the if condition uses assignment (=) instead of comparison (===),
  so it assigns 0 to a variable and the truthiness is wrong. Fix the comparison so only n === 0 is ''special''.'
solution_explanation: 'A single = assigns instead of compares, so the condition''s value was the assigned
  operand, not a comparison. Using n === 0 tests the actual value and labels only zero as special.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: logfix
  instructions: "Fix classify(n): return 'special' when n === 0, otherwise 'normal'. The log shows the\
    \ branch is always taken because of an accidental assignment.\n  classify(0) -> 'special'; classify(5)\
    \ -> 'normal'\nClick Run to try it, then Check Solution to grade against all tests.\n"
  files:
  - path: solution.js
    content: "// QA log:\n//   classify(5) -> 'special'  (expected 'normal')\n//   classify(9) -> 'special'\
      \  (expected 'normal')\n//   every input takes the 'special' branch\n\nfunction classify(n) {\n\
      \  let flag = 1;\n  if (flag = 0) {            // assignment, not comparison\n    return 'normal';\n\
      \  }\n  return 'special';\n}\n"
    readonly: false
  visible_tests:
  - name: zero is special
    code: 'assert(classify(0) === ''special'', classify(0));

      '
  - name: nonzero is normal
    code: 'assert(classify(5) === ''normal'', classify(5));

      '
  hidden_tests:
  - name: negative is normal
    code: 'assert(classify(-3) === ''normal'');

      '
  - name: large is normal
    code: 'assert(classify(1000) === ''normal'');

      '
  - name: one is normal
    code: 'assert(classify(1) === ''normal'');

      '
  - name: zero stays special
    code: 'assert(classify(0) === ''special'');

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: log analysis is not behaving as the scenario
    objectives require. This lab is about log analysis — how log analysis behaves in a JavaScript environment.
    Read the objectives and the current state, and note precisely what looks wrong versus healthy before
    you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For log analysis problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just
    the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Open `solution.js`, read the instructions, and run the visible tests to see which assertion fails
    first.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. From the evidence above, decide which single part of log analysis is at fault.

    2. Re-run the most relevant of modules, browser console, and Node tooling focused on just that part
    to confirm it.

    3. State a one-line hypothesis: the smallest change that would move the state from ''log analysis
    is not behaving as the scenario objectives require'' toward ''all hidden tests pass''.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Edit `solution.js` with the smallest correct change.

    2. Re-run visible tests, then Check Solution (includes hidden tests).

    3. Confirm every test passes.


    WHY: coding labs grade against hidden test cases, not marker files.'
