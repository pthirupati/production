    code: 'assert(JSON.stringify(range(3, 7)) === JSON.stringify([3,4,5,6]), JSON.stringify(range(3, 7)));

      '
  - name: empty when start equals end
    code: 'assert(JSON.stringify(range(4, 4)) === JSON.stringify([]), JSON.stringify(range(4, 4)));

      '
  - name: step three
    code: 'assert(JSON.stringify(range(1, 10, 3)) === JSON.stringify([1,4,7]), JSON.stringify(range(1,
      10, 3)));

      '
  - name: excludes end
    code: 'assert(range(0, 5).indexOf(5) === -1);

      '
