title: 'Refactor: Fix countBy Aggregation'
slug: js-review-array-reduce-clarity
category: JavaScript Development
description: countBy(items, keyFn) should return an object mapping each key to the NUMBER of items with
  that key, but it stores the last item instead of a count. Refactor it to accumulate counts. The tests
  pin the count contract.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- See values are items, not counts
- Increment a numeric counter per key
- Return the correct frequency object
initial_state: countBy(items, keyFn) should return an object mapping each key to the NUMBER of items with
  that key, but it stores the last item instead of a count. Refactor it to accumulate counts. The tests
  pin the count contract.
solution_explanation: |
  Assigning the item overwrites with a value, not a tally. Initializing to 0 and incrementing accumulates the count per key.
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: review
  instructions: |
    Fix countBy(items, keyFn): return { key: count }.
      countBy([1,2,3,4], n => n % 2 ? 'odd' : 'even') -> {odd:2, even:2}
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.js
    content: |
      function countBy(items, keyFn) {
        const out = {};
        for (const item of items) {
          out[keyFn(item)] = item; // bug: stores the item, not a count
        }
        return out;
      }
    readonly: false
  visible_tests:
  - name: odd/even counts
    code: |
      assert(JSON.stringify(countBy([1,2,3,4], n => n % 2 ? 'odd' : 'even')) === JSON.stringify({odd:2, even:2}), JSON.stringify(countBy([1,2,3,4], n => n % 2 ? 'odd' : 'even')));
  - name: single key
    code: |
      assert(JSON.stringify(countBy([2,4,6], () => 'all')) === JSON.stringify({all:3}), JSON.stringify(countBy([2,4,6], () => 'all')));
  hidden_tests:
  - name: by length
    code: |
      assert(JSON.stringify(countBy(['a','bb','cc'], s => s.length)) === JSON.stringify({1:1, 2:2}), JSON.stringify(countBy(['a','bb','cc'], s => s.length)));
  - name: empty
    code: |
      assert(JSON.stringify(countBy([], () => 'x')) === JSON.stringify({}), JSON.stringify(countBy([], () => 'x')));
  - name: values are numbers
    code: |
      const r = countBy([1,1,1], () => 'k');
      assert(r.k === 3 && typeof r.k === 'number');
  timeout: 8
hints:
- order: 1
  cost: 10
  content: 'countBy([1,3], () => ''odd'') returns {odd: 3} — it stored the item, not a count.'
- order: 2
  cost: 20
  content: Each key should map to a running integer count.
- order: 3
  cost: 30
  content: Use out[key] = (out[key] || 0) + 1.
