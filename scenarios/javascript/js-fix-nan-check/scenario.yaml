title: Fix the NaN Check in isInvalid
slug: js-fix-nan-check
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the NaN Check in isInvalid`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: isInvalid(x) should return true when x is NaN, but it compares `x === NaN`,
  which is ALWAYS false because NaN is not equal to itself. Use the correct NaN test.


  OBJECTIVE: Understand NaN !== NaN; Use Number.isNaN to detect NaN; Return false for all valid numbers.
  Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1500
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Understand NaN !== NaN
- Use Number.isNaN to detect NaN
- Return false for all valid numbers
initial_state: isInvalid(x) should return true when x is NaN, but it compares `x === NaN`, which is ALWAYS
  false because NaN is not equal to itself. Use the correct NaN test.
solution_explanation: 'NaN compares unequal to everything, including itself, so === NaN never works. Number.isNaN(x)
  reliably detects the NaN value without coercion.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: 'Fix isInvalid(x): return true only when x is the NaN value.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.js
    content: "function isInvalid(x) {\n  return x === NaN; // always false: NaN !== NaN\n}\n"
    readonly: false
  visible_tests:
  - name: detects NaN
    code: 'assert(isInvalid(NaN) === true, ''should detect NaN'');

      '
  - name: number is valid
    code: 'assert(isInvalid(5) === false);

      '
  hidden_tests:
  - name: zero is valid
    code: 'assert(isInvalid(0) === false);

      '
  - name: computed NaN
    code: 'assert(isInvalid(0 / 0) === true);

      '
  - name: string is not NaN value
    code: 'assert(isInvalid(''abc'') === false);

      '
  - name: Infinity is not NaN
    code: 'assert(isInvalid(Infinity) === false);

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open `solution.js`, read the instructions, and run the visible tests to see
    which assertion fails first.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Click Run and read the traceback — note line number and actual vs expected values.

    2. Reproduce the failure with the smallest input from a visible test.

    3. Compare your implementation to the bug described in the lab prompt.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Return false for all valid numbers.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
