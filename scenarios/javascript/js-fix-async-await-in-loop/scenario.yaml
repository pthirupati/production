initial_state: runAll(tasks) should run each thunk and return an array of their results in order, but
  it uses `forEach(async ...)` — forEach ignores the returned promises, so the function returns undefined
  and nothing is collected. Each task here is SYNCHRONOUS (returns a value), so the fix is to collect
  results with map and return the array. The stub returns undefined.
solution_explanation: 'forEach evaluates each task but discards the return values and yields undefined.
  map collects each result into a new array, returned in order.

  '
coding_spec:
  language: javascript
  entrypoint: solution.js
  kind: fix
  instructions: "Fix runAll(tasks): call each task (a zero-arg function) and return an array of the results,\
    \ in order.\n  runAll([() => 1, () => 2]) -> [1, 2]\nClick Run to try it, then Check Solution to grade\
    \ against all tests.\n"
  files:
  - path: solution.js
    content: "function runAll(tasks) {\n  const out = [];\n  tasks.forEach((task) => { task(); }); //\
      \ results discarded; returns undefined\n}\n"
    readonly: false
  visible_tests:
  - name: collects results
    code: 'assert(JSON.stringify(runAll([() => 1, () => 2])) === JSON.stringify([1, 2]), JSON.stringify(runAll([()
      => 1, () => 2])));

      '
  - name: returns an array
    code: 'assert(Array.isArray(runAll([() => ''x''])), ''should return an array'');

      '
  hidden_tests:
  - name: order preserved
    code: 'assert(JSON.stringify(runAll([() => ''a'', () => ''b'', () => ''c''])) === JSON.stringify([''a'',''b'',''c'']),
      JSON.stringify(runAll([() => ''a'', () => ''b'', () => ''c''])));

      '
  - name: empty
    code: 'assert(JSON.stringify(runAll([])) === JSON.stringify([]), JSON.stringify(runAll([])));

      '
  - name: computes values
    code: 'const r = runAll([() => 2 + 2, () => 3 * 3]);

      assert(r[0] === 4 && r[1] === 9, JSON.stringify(r));

      '
  - name: not undefined
    code: 'assert(runAll([() => 1]) !== undefined, ''forEach returns undefined'');

      '
  timeout: 8
