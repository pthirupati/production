title: Fix the Sequential await Inside forEach
slug: js-fix-async-await-in-loop
category: Fix
description: 'CONTEXT: A team operating JavaScript needs you to resolve `Fix the Sequential await Inside
  forEach` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline JavaScript practice project with modules, browser
  console, and Node tooling. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: runAll(tasks) should run each thunk and return an array of their results in
  order, but it uses `forEach(async ...)` — forEach ignores the returned promises, so the function returns
  undefined and nothing is collected. Each task here is SYNCHRONOUS (returns a value), so the fix is to
  collect results with map and return the array. The stub returns undefined.


  OBJECTIVE: See forEach swallow the per-item results; Collect each task''s result into an array; Return
  the results in input order. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
