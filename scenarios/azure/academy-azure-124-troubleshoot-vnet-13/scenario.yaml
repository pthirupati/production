description: Service operations lab. The `rsyslog` systemd unit is **failed/inactive** on this host —
  a realistic fault for Troubleshooting Drill workflows that depend on it. Diagnose with `systemctl status
  rsyslog` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active rsyslog`.
objectives:
- The `rsyslog` service is active (running)
- '`systemctl is-active rsyslog`` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `rsyslog` service is not running (`systemctl is-active rsyslog` → inactive/failed).
  Dependent Troubleshooting Drill tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: Vnet is misconfigured and dependent workflows
    are failing. This lab is about Vnet — how vnet fits into Azure cloud operations. Read the objectives
    and the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Vnet problems the reliable method is: (1) reproduce/observe the
    failure, (2) narrow from the whole system down to the one component that owns the symptom, (3) change
    exactly one thing, (4) re-check. Fix the underlying misconfiguration you identified (not just the
    noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Inspect the planted azure Lab Server fault: `/opt/azure/config` and `az account show`. Do not chase
    unrelated nginx/rsyslog units.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm the azure config under /opt/azure/ is broken.

    2. Repair credentials/project/region (or OpenStack clouds.yaml).

    3. Re-check with the cloud CLI until the profile is healthy.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix the broken azure configuration on this Lab Server.

    2. Apply the documented remediation (config + FIXED-OK where required).

    3. Click Check Solution once cloud Lab Server health check passes (`systemctl is-failed` finds no
    failed units / config repaired).'
