    specs: Standard_B2s (2 vCPU / 4 GiB) with a pending 128GB managed disk to attach
  pre_installed:
  - azure-portal
  credentials:
  - user: admin@fixitlab.onmicrosoft.com
    password: lab123
tasks:
- id: task_1
  title: Attach disk-data-unattached to vm-web01
  description: Attach the unattached managed disk to vm-web01 from the Azure Portal and confirm it
    shows State = Attached.
  background: 'This lab teaches the standard Azure managed-disk workflow: disks and VMs are separate
    resources, and a disk provisioned ahead of time must be explicitly attached before the guest can
    see it.'
  validation:
    type: custom_script
    script: check.sh
    error_message: Validation did not pass. Attach disk-data-unattached to vm-web01 from the Azure
      Portal Disks blade.
solution:
  summary: Attach disk-data-unattached to vm-web01 from either the VM's Disks blade or the Disks blade
    directly.
  files_changed: []
  commands_run:
  - 'Azure Portal: Disks -> disk-data-unattached -> Attach -> vm-web01'
  reference_docs: azure-fundamentals
consoles:
