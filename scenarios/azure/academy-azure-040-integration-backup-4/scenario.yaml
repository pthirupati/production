description: 'CONTEXT: A team operating Azure cloud operations has raised a ticket for `Microsoft Azure:
  Backup Workflows — Integration Lab`. A customer-facing workflow is degraded and the on-call engineer
  (you) must diagnose and resolve it. Business impact: reduced service reliability and blocked users until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Azure practice subscription. The architecture is
  a single lab-primary node exposing Portal, Azure CLI, VMs, disks, NSGs, and resource groups; treat it
  as the production host for this incident. All tools run locally — no paid APIs or external cloud calls
  are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for backup workflows.
  Downstream consumers are waiting on this integration path. Integration lab: connect backup workflows
  with an adjacent platform in the Microsoft Azure stack. Validate authentication, data handoff, and failure
  behavior for full/incremental backups, retention, encryption, and restore drills.


  OBJECTIVE: backup workflows is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Acceptance criteria: the
  change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant Portal, Azure CLI, VMs, disks, NSGs, and resource groups), changing one thing at
  a time. Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
