tasks:
- id: task_1
  title: Open inbound SSH on nsg-web
  description: Add an inbound NSG rule allowing TCP/22 at a priority below the deny-all catch-all, and
    confirm SSH reachability returns.
  background: 'This lab teaches real Azure NSG rule evaluation: rules are processed in priority order,
    lowest number first, and the first match wins — a missing allow rule silently falls through to the
    deny-all baseline every subnet gets by default.'
  validation:
    type: custom_script
    script: check.sh
    error_message: Validation did not pass. Add an inbound rule on nsg-web allowing TCP/22 at a priority
      below 4096.
solution:
  summary: Add an inbound rule (AllowSSH, TCP/22, priority 110, Allow) to nsg-web.
