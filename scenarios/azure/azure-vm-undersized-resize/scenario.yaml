title: Azure VM Undersized for Its Workload — Resize Before the Next Deploy
slug: azure-vm-undersized-resize
technology: azure
category: Fix
difficulty: easy
lab_mode: simulation
simulation_type: azure
infrastructure_type: docker
time_limit: 600
max_score: 100
is_free: true
jira_priority: High
dual_terminal: true
description: 'CONTEXT: The application team paged on-call because vm-web01 keeps getting OOM-killed
  during the nightly batch job and `top` shows sustained CPU saturation. The ticket says the VM was
  provisioned months ago on a burstable size that never got revisited as traffic grew.


  ENVIRONMENT: You are working in the Azure Portal against the FixitLab Enterprise Subscription. vm-web01
  lives in rg-fixitlab-prod / vnet-prod / snet-web. The SAME vm-web01 is also the host you SSH into over
  the lab terminal for this session — whatever size you pick in the portal is what `nproc` and `free -h`
  report on that terminal, exactly like a real Azure VM.


  SYMPTOM / STARTING STATE: vm-web01 is running on Standard_B1s (1 vCPU / 1 GiB RAM) — a burstable-tier
  size meant for light, intermittent load, not a nightly batch job. Running `nproc` and `free -h` on the
  terminal confirms only 1 core and ~1GiB are available to the guest right now.


  IMPACT: Every night the batch job OOM-kills and the on-call gets paged again. This will keep happening
  until the VM is resized to a size with more vCPU and RAM headroom.


  OBJECTIVE: In the Azure Portal, resize vm-web01 to a size with more vCPU and RAM (Standard_D2s_v5 or
  larger), then confirm on the lab terminal that `nproc` and `free -h` now report the new, larger
  vCPU/RAM allocation.'
initial_state: Azure Portal showing vm-web01 on Standard_B1s (1 vCPU / 1 GiB). Terminal `nproc` reports
  1 and `free -h` reports ~1GiB total.
objectives:
- Sign in to the Azure Portal
- Open Virtual machines and select vm-web01
- Resize vm-web01 to a size with more vCPU and RAM (Standard_D2s_v5 or larger)
- Confirm on the lab terminal that nproc and free -h now report the new size
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why: Before touching anything, run `nproc` and `free -h` on the
    lab terminal and note the current vCPU/RAM. Then open the Azure Portal, go to Virtual machines ->
    vm-web01 -> Overview, and confirm the "Size" field matches what the terminal is reporting.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method: An OOM-killed nightly job on sustained CPU saturation
    is a capacity problem, not a configuration bug — the fix is resizing the VM to a size with more
    vCPU/RAM, not tuning the application. Azure lets you resize in place from the VM''s "Size" blade.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s): In the portal, open vm-web01 -> Size (left nav under
    Settings) -> pick a size with more vCPU/RAM (e.g. Standard_D2s_v5: 2 vCPU / 8 GiB) -> Resize. On the
    terminal, `nproc` and `free -h` (or `cat /proc/cpuinfo` / `cat /proc/meminfo`) will show the new
    allocation the next time you run them — the guest and the portal are the SAME server for this lab.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem: Any size strictly larger than Standard_B1s clears the
    "undersized" condition — Standard_D2s_v5 (2 vCPU / 8 GiB) is a safe, realistic pick for a web/batch
    workload. Don''t resize any other VM; there is only one VM in this subscription.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it): Open vm-web01 -> Size -> select
    Standard_D2s_v5 (or larger) -> click Resize -> wait for the "Resize completed" event. Then on the
    terminal run `nproc` (expect 2 or more) and `free -h` (expect several GiB total). WHY: the grader
    checks that the session''s Azure VM size actually changed AND that the guest hardware reflects it —
    picking a size in the dropdown without clicking Resize does not count.'
summary: Resize the undersized Azure VM before the next nightly batch job OOM-kills it again, and confirm
  the new vCPU/RAM inside the guest.
