hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: azure VM undersized for its workload - resize
    before the is not behaving as the scenario objectives require. This lab is about azure VM undersized
