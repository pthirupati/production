description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `SDK Cannot Reach the OTLP Receiver` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: The instrumented app logs `connection refused` exporting to the Collector. The Collector is running, but the OTLP gRPC receiver listens on 4317 while the app exports to 4318 (HTTP) — protocol/port mismatch.

  OBJECTIVE: The app's OTLP exporter targets the HTTP port (4318) while the Collector only enables the gRPC receiver on 4317 (or vice versa). Enable the matching OTLP receiver protocol/port on the Collector (or repoint the exporter) so the endpoints agree, then restart. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The SDK exporter connects to the OTLP receiver without connection refused'
- 'The protocol/port mismatch is confirmed as root cause'
- 'Spans start arriving at the Collector after the endpoints match'
initial_state: |-
  The instrumented app logs `connection refused` exporting to the Collector. The Collector is running, but the OTLP gRPC receiver listens on 4317 while the app exports to 4318 (HTTP) — protocol/port mismatch.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /otel/collector/config.yaml`
        2. `ss -ltnp | grep -E '4317|4318'`
        3. `curl -sv localhost:4318/v1/traces`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `ss -ltnp | grep -E '4317|4318'` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The app's OTLP exporter targets the HTTP port (4318) while the Collector only enables the gRPC receiver on 4317 (or vice versa). Enable the matching OTLP receiver protocol/port on the Collector (or repoint the exporter) so the endpoints agree, then restart.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
