tasks:
- id: task_1
  title: 'SDK Cannot Reach the OTLP Receiver'
  description: |-
    Restore healthy behavior for SDK Cannot Reach the OTLP Receiver by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This opentelemetry lab teaches the difference between OTLP/gRPC (4317) and OTLP/HTTP (4318) receivers and why endpoint mismatches cause connection refused through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/otel-otlp-receiver-wrong-port.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The app's OTLP exporter targets the HTTP port (4318) while the Collector only enables the gRPC receiver on 4317 (or vice versa). Enable the matching OTLP receiver protocol/port on the Collector (or repoint the exporter) so the endpoints agree, then restart.
  files_changed: []
  commands_run:
  - 'cat /otel/collector/config.yaml'
  - 'ss -ltnp | grep -E ''4317|4318'''
  - 'curl -sv localhost:4318/v1/traces'
  reference_docs: opentelemetry-fundamentals
