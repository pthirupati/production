    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `env | grep OTEL_TRACES_SAMPLER` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The downstream SDK uses a plain `TraceIDRatioBased` sampler instead of `ParentBased(...)`, so it re-decides sampling and ignores the parent's sampled flag, splitting the trace. Switch the sampler to ParentBased so it honors the upstream decision and the whole request stays in one sampled trace.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
