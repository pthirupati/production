description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Broken Sampling Decision Across a Service Hop` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: A trace is sampled at the frontend but its downstream service starts a brand-new unsampled trace, so you only ever see half the request path. The downstream SDK uses a standalone ratio sampler that ignores the incoming sampled flag.

  OBJECTIVE: The downstream SDK uses a plain `TraceIDRatioBased` sampler instead of `ParentBased(...)`, so it re-decides sampling and ignores the parent's sampled flag, splitting the trace. Switch the sampler to ParentBased so it honors the upstream decision and the whole request stays in one sampled trace. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Downstream spans honor the upstream sampling decision'
- 'The non-parent-based sampler is confirmed as root cause'
- 'The full request path appears in one trace after the sampler is fixed'
