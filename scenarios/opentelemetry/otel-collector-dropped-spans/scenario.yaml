description: 'CONTEXT: A platform team operating opentelemetry needs you to resolve `Collector Pipeline
  Silently Drops Spans` during a realistic delivery incident. The business impact is a stalled or unsafe
  release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline observability lab with an OpenTelemetry Collector,
  an instrumented demo service, and a local trace/metric backend under /otel. All components run locally;
  no SaaS observability vendor or paid APIs are required.


  SYMPTOM / STARTING STATE: Traces stopped appearing in the backend even though the app is emitting spans.
  The Collector is up, but `otelcol_processor_dropped_spans` is climbing. The traces pipeline references
  a processor that is defined but never wired into the pipeline''s processor list correctly.


  OBJECTIVE: The `service.pipelines.traces` block omits (or misorders) a required processor / points the
  pipeline at an exporter that isn''t defined, so the memory_limiter sheds load and spans are dropped.
  Fix the pipeline wiring in the Collector config so receivers→processors→exporters are all defined and
  referenced, then reload. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The traces pipeline correctly wires defined receivers, processors, and exporters
- otelcol_processor_dropped_spans stops climbing (spans reach the exporter)
- The pipeline-wiring root cause is confirmed via otelcol validate + metrics
initial_state: Traces stopped appearing in the backend even though the app is emitting spans. The Collector
  is up, but `otelcol_processor_dropped_spans` is climbing. The traces pipeline references a processor
  that is defined but never wired into the pipeline's processor list correctly.
