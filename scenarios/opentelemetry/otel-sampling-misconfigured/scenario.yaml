tasks:
- id: task_1
  title: Tail Sampling Drops the Traces You Need
  description: Restore healthy behavior for Tail Sampling Drops the Traces You Need by reproducing the
    diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix,
    and validating the outcome with the checker.
  background: 'This opentelemetry lab teaches head vs tail sampling, why blanket probabilistic sampling
    loses the important traces, and policy-based tail sampling for errors/latency through systematic troubleshooting:
    observe, hypothesize, change, verify.'
  validation:
    type: custom_script
    script: check.sh
    error_message: The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root
      cause, and apply the documented remediation so /opt/fixitlab/academy/otel-sampling-misconfigured.conf
      carries the FIXED-OK marker.
solution:
  summary: The sampling policy keeps a flat 1% of ALL traces with no rule to always keep errors/slow spans,
    so diagnostic traces are lost. Remediate by adding tail-sampling policies that always keep traces
    with error status and latency over a threshold, keeping probabilistic sampling only for the healthy
    baseline.
  files_changed: []
  commands_run:
  - cat /otel/collector/config.yaml
  - curl -s localhost:8888/metrics | grep sampling
  - cat /otel/collector/sampling_policies.yaml
  reference_docs: opentelemetry-fundamentals
