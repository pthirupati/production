    \ the failing object.\n    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. The sampling policy keeps a flat 1% of ALL traces with no\
    \ rule to always keep errors/slow spans, so diagnostic traces are lost. Remediate by adding tail-sampling\
    \ policies that always keep traces with error status and latency over a threshold, keeping probabilistic\
    \ sampling only for the healthy baseline.\n    2. Change one thing at a time so you can roll back\
    \ if the hypothesis was wrong.\n    3. Verify the objective is met, then click Check Solution (graded\
    \ on real state, not a marker file)."
