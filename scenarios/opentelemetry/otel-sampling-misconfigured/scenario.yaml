description: 'CONTEXT: A platform team operating opentelemetry needs you to resolve `Tail Sampling Drops
  the Traces You Need` during a realistic delivery incident. The business impact is a stalled or unsafe
  release until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline observability lab with an OpenTelemetry Collector,
  an instrumented demo service, and a local trace/metric backend under /otel. All components run locally;
  no SaaS observability vendor or paid APIs are required.


  SYMPTOM / STARTING STATE: Errors are happening in production but the traces for failed requests are
  almost never in the backend. The tail_sampling processor is configured with only a probabilistic 1%
  policy, so error and high-latency traces are sampled away with everything else — exactly the traces
  on-call needs.


  OBJECTIVE: The sampling policy keeps a flat 1% of ALL traces with no rule to always keep errors/slow
  spans, so diagnostic traces are lost. Remediate by adding tail-sampling policies that always keep traces
  with error status and latency over a threshold, keeping probabilistic sampling only for the healthy
  baseline. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- Tail-sampling policies always keep error and high-latency traces
- Failed-request traces reliably appear in the backend
- Baseline probabilistic sampling is preserved for healthy traffic (not disabled)
initial_state: Errors are happening in production but the traces for failed requests are almost never
  in the backend. The tail_sampling processor is configured with only a probabilistic 1% policy, so error
  and high-latency traces are sampled away with everything else — exactly the traces on-call needs.
