description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Memory Limiter Refuses All Data` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: The Collector logs `data refused due to high memory usage` continuously and no telemetry reaches the backend. `otelcol_processor_refused_spans` climbs steadily even though the host has plenty of free RAM.

  OBJECTIVE: The `memory_limiter` processor's `limit_mib` is set far below the Collector's actual working set (or below GOMEMLIMIT), so it trips immediately and refuses everything. Raise `limit_mib`/`spike_limit_mib` to match the container memory limit so the limiter protects rather than starves the pipeline. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'otelcol_processor_refused_spans stops climbing'
- 'The too-low memory_limiter limit_mib is confirmed as root cause'
- 'Telemetry flows to the backend after the limiter is right-sized'
initial_state: |-
  The Collector logs `data refused due to high memory usage` continuously and no telemetry reaches the backend. `otelcol_processor_refused_spans` climbs steadily even though the host has plenty of free RAM.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /otel/collector/config.yaml`
        2. `curl -s localhost:8888/metrics | grep refused`
        3. `otelcol validate --config /otel/collector/config.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `curl -s localhost:8888/metrics | grep refused` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The `memory_limiter` processor's `limit_mib` is set far below the Collector's actual working set (or below GOMEMLIMIT), so it trips immediately and refuses everything. Raise `limit_mib`/`spike_limit_mib` to match the container memory limit so the limiter protects rather than starves the pipeline.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
