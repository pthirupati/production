tasks:
- id: task_1
  title: 'Memory Limiter Refuses All Data'
  description: |-
    Restore healthy behavior for Memory Limiter Refuses All Data by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This opentelemetry lab teaches how the memory_limiter processor sheds load to prevent OOM and why a misconfigured limit refuses all data through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/otel-collector-memorylimiter-refusing.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The `memory_limiter` processor's `limit_mib` is set far below the Collector's actual working set (or below GOMEMLIMIT), so it trips immediately and refuses everything. Raise `limit_mib`/`spike_limit_mib` to match the container memory limit so the limiter protects rather than starves the pipeline.
  files_changed: []
  commands_run:
  - 'cat /otel/collector/config.yaml'
  - 'curl -s localhost:8888/metrics | grep refused'
  - 'otelcol validate --config /otel/collector/config.yaml'
  reference_docs: opentelemetry-fundamentals
