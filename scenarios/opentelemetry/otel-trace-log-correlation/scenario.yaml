    \    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. The logging setup does not inject the active trace context\
    \ (trace_id/span_id) into log records, and the Collector's log pipeline does not carry those fields,\
