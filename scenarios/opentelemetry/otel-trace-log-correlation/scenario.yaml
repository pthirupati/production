solution:
  summary: The logging setup does not inject the active trace context (trace_id/span_id) into log records,
    and the Collector's log pipeline does not carry those fields, so logs and traces can't be joined.
    Remediate by injecting trace_id/span_id into the log format (and preserving them through the log pipeline)
    so a span links to its logs.
  files_changed: []
  commands_run:
  - cat /otel/service/logging.yaml
  - tail -n 5 /otel/service/app.log
  - cat /otel/collector/config.yaml
  reference_docs: opentelemetry-fundamentals
