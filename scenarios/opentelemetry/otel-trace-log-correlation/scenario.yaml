description: 'CONTEXT: A platform team operating opentelemetry needs you to resolve `Logs Not Correlated
  to Traces` during a realistic delivery incident. The business impact is a stalled or unsafe release
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline observability lab with an OpenTelemetry Collector,
  an instrumented demo service, and a local trace/metric backend under /otel. All components run locally;
  no SaaS observability vendor or paid APIs are required.


  SYMPTOM / STARTING STATE: An on-call engineer has a slow trace but cannot jump to the matching logs:
  the service''s log lines carry no trace_id/span_id, so there is no way to pivot from a span to the exact
  log entries for that request. Trace↔log correlation is broken.


  OBJECTIVE: The logging setup does not inject the active trace context (trace_id/span_id) into log records,
  and the Collector''s log pipeline does not carry those fields, so logs and traces can''t be joined.
  Remediate by injecting trace_id/span_id into the log format (and preserving them through the log pipeline)
  so a span links to its logs. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- Log records include the active trace_id and span_id
- An engineer can pivot from a span to its exact log lines
- The missing-correlation root cause is fixed in the log format, not worked around manually
initial_state: 'An on-call engineer has a slow trace but cannot jump to the matching logs: the service''s
  log lines carry no trace_id/span_id, so there is no way to pivot from a span to the exact log entries
  for that request. Trace↔log correlation is broken.'
