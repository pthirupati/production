tasks:
- id: task_1
  title: 'Every Span Shows service.name Unknown'
  description: |-
    Restore healthy behavior for Every Span Shows service.name Unknown by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This opentelemetry lab teaches how resource attributes like service.name identify telemetry and how SDK Resource and the Collector resource processor set them through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/otel-resource-detection-missing-servicename.conf carries the FIXED-OK marker.
solution:
  summary: |-
    Neither the SDK (`OTEL_SERVICE_NAME`/Resource) nor a Collector `resource` processor sets `service.name`, so telemetry defaults to unknown_service. Set service.name at the source (env/Resource) or add a `resource` processor that inserts it, then reload so spans carry a real service identity.
  files_changed: []
  commands_run:
  - 'cat /otel/collector/config.yaml'
  - 'curl -s localhost:8888/metrics | grep received_spans'
  - 'env | grep OTEL_'
  reference_docs: opentelemetry-fundamentals
