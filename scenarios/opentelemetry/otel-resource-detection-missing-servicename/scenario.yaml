description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Every Span Shows service.name Unknown` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: Traces arrive but group under `unknown_service` in the backend, so you cannot tell which service emitted them. The SDK never sets a `service.name` resource attribute and no resource processor supplies one.

  OBJECTIVE: Neither the SDK (`OTEL_SERVICE_NAME`/Resource) nor a Collector `resource` processor sets `service.name`, so telemetry defaults to unknown_service. Set service.name at the source (env/Resource) or add a `resource` processor that inserts it, then reload so spans carry a real service identity. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Spans carry a correct service.name resource attribute'
- 'The missing service.name resource is confirmed as root cause'
- 'Traces group under the real service instead of unknown_service'
initial_state: |-
  Traces arrive but group under `unknown_service` in the backend, so you cannot tell which service emitted them. The SDK never sets a `service.name` resource attribute and no resource processor supplies one.
