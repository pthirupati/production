description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `spanmetrics Connector Produces No RED Metrics` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: The service dashboard's request-rate and error-rate panels are empty. The spanmetrics connector is defined but the traces pipeline does not export to it, and no metrics pipeline receives from it, so no RED metrics are generated.

  OBJECTIVE: The spanmetrics connector is configured but not wired as an exporter in the traces pipeline and a receiver in a metrics pipeline, so it never produces metrics from spans. Wire the connector into both pipelines (traces → connector → metrics) so RED metrics are derived and exported, then reload. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'RED metrics are generated from spans by the connector'
- 'The unwired spanmetrics connector is confirmed as root cause'
- 'The dashboard''s rate/error panels populate after wiring'
initial_state: |-
  The service dashboard's request-rate and error-rate panels are empty. The spanmetrics connector is defined but the traces pipeline does not export to it, and no metrics pipeline receives from it, so no RED metrics are generated.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /otel/collector/config.yaml`
        2. `curl -s localhost:8888/metrics | grep calls_total`
        3. `otelcol validate --config /otel/collector/config.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `curl -s localhost:8888/metrics | grep calls_total` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The spanmetrics connector is configured but not wired as an exporter in the traces pipeline and a receiver in a metrics pipeline, so it never produces metrics from spans. Wire the connector into both pipelines (traces → connector → metrics) so RED metrics are derived and exported, then reload.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
