description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Spans Leak PII in HTTP Attributes` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: A security review found raw email addresses and auth tokens in `http.request.header.authorization` and `url.query` span attributes shipped to the backend. No redaction is configured in the pipeline.

  OBJECTIVE: The pipeline has no `attributes`/`redaction` processor, so sensitive headers and query params flow to the backend verbatim. Add an attributes processor that deletes/hashes the sensitive keys (authorization, tokens, email) before export, then reload so PII is scrubbed at the Collector. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Sensitive attributes are removed or hashed before export'
- 'The missing redaction processor is confirmed as the leak cause'
- 'Exported spans no longer contain raw PII'
initial_state: |-
  A security review found raw email addresses and auth tokens in `http.request.header.authorization` and `url.query` span attributes shipped to the backend. No redaction is configured in the pipeline.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /otel/collector/config.yaml`
        2. `curl -s localhost:8888/metrics | grep received_spans`
        3. `otelcol validate --config /otel/collector/config.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `curl -s localhost:8888/metrics | grep received_spans` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The pipeline has no `attributes`/`redaction` processor, so sensitive headers and query params flow to the backend verbatim. Add an attributes processor that deletes/hashes the sensitive keys (authorization, tokens, email) before export, then reload so PII is scrubbed at the Collector.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
