description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Collector Crash-Loops on Invalid Config` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: The Collector will not start: it logs `cannot unmarshal … invalid keys` and exits. A recent edit introduced a bad indentation / unknown key under the exporters section, so config parsing fails before any pipeline runs.

  OBJECTIVE: The Collector config has a YAML structure error (bad indentation or an unknown key), so `otelcol validate` fails and the process exits at startup. Fix the malformed key/indentation so the config validates, then restart so the pipelines load. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'otelcol validate reports the config as valid'
- 'The malformed YAML key/indentation is confirmed as the crash cause'
- 'The Collector starts and serves its pipelines after the fix'
initial_state: |-
  The Collector will not start: it logs `cannot unmarshal … invalid keys` and exits. A recent edit introduced a bad indentation / unknown key under the exporters section, so config parsing fails before any pipeline runs.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `otelcol validate --config /otel/collector/config.yaml`
        2. `journalctl -u otelcol --no-pager | tail -30`
        3. `cat /otel/collector/config.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `otelcol validate --config /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `journalctl -u otelcol --no-pager | tail -30` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Collector config has a YAML structure error (bad indentation or an unknown key), so `otelcol validate` fails and the process exits at startup. Fix the malformed key/indentation so the config validates, then restart so the pipelines load.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
