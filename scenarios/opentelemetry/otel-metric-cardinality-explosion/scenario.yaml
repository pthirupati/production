    \ carefully.\n    2. Cross-check with `curl -s localhost:8888/metrics | grep otelcol_exporter_queue_size`\
    \ to isolate the failing object.\n    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. A per-request unbounded attribute (e.g. full path `/order/12345`,\
    \ or user_id) is used as a metric dimension, so every distinct value creates a new series. Remediate\
    \ by removing/aggregating the high-cardinality label (route templating via a metric attributes processor,\
