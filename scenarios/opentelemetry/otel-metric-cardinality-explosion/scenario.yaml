description: 'CONTEXT: A platform team operating opentelemetry needs you to resolve `Metric Cardinality
  Explosion` during a realistic delivery incident. The business impact is a stalled or unsafe release
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline observability lab with an OpenTelemetry Collector,
  an instrumented demo service, and a local trace/metric backend under /otel. All components run locally;
  no SaaS observability vendor or paid APIs are required.


  SYMPTOM / STARTING STATE: The metrics backend is OOMing and the Collector''s memory climbs relentlessly.
  `http_server_duration` has millions of series because a high-cardinality attribute (raw URL path with
  IDs, or user_id) is attached as a metric label, multiplying time series without bound.


  OBJECTIVE: A per-request unbounded attribute (e.g. full path `/order/12345`, or user_id) is used as
  a metric dimension, so every distinct value creates a new series. Remediate by removing/aggregating
  the high-cardinality label (route templating via a metric attributes processor, or dropping the attribute)
  so series count is bounded. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The unbounded high-cardinality attribute is removed or templated on metrics
- http_server_duration series count is bounded (no per-ID explosion)
- The offending label is confirmed as root cause, not throttled blindly
initial_state: The metrics backend is OOMing and the Collector's memory climbs relentlessly. `http_server_duration`
  has millions of series because a high-cardinality attribute (raw URL path with IDs, or user_id) is attached
  as a metric label, multiplying time series without bound.
