      cause, and apply the documented remediation so /opt/fixitlab/academy/otel-metric-cardinality-explosion.conf
      carries the FIXED-OK marker.
solution:
  summary: A per-request unbounded attribute (e.g. full path `/order/12345`, or user_id) is used as a
    metric dimension, so every distinct value creates a new series. Remediate by removing/aggregating
    the high-cardinality label (route templating via a metric attributes processor, or dropping the attribute)
    so series count is bounded.
  files_changed: []
  commands_run:
  - cat /otel/collector/config.yaml
  - curl -s localhost:8888/metrics | grep otelcol_exporter_queue_size
  - cat /otel/service/metrics_attributes.yaml
  reference_docs: opentelemetry-fundamentals
