solution:
  summary: |-
    The `batch` processor has an oversized `timeout` and `send_batch_size`, so spans are held far too long before flushing. Tune the batch processor to a small timeout (e.g. 1–5s) and a reasonable batch size so telemetry exports promptly without stalling in the buffer.
  files_changed: []
  commands_run:
  - 'cat /otel/collector/config.yaml'
  - 'curl -s localhost:8888/metrics | grep batch'
  - 'otelcol validate --config /otel/collector/config.yaml'
  reference_docs: opentelemetry-fundamentals
