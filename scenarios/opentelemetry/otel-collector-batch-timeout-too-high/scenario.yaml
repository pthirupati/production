description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Batch Processor Delays Every Export` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: Traces appear in the backend 30–60s after they happen. The Collector is healthy but the batch processor's `timeout` is set to 60s and `send_batch_size` is huge, so spans sit buffered long before export.

  OBJECTIVE: The `batch` processor has an oversized `timeout` and `send_batch_size`, so spans are held far too long before flushing. Tune the batch processor to a small timeout (e.g. 1–5s) and a reasonable batch size so telemetry exports promptly without stalling in the buffer. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Spans reach the backend within a few seconds of being emitted'
- 'The oversized batch timeout/size is confirmed as the delay source'
- 'Export latency drops after the batch processor is tuned'
initial_state: |-
  Traces appear in the backend 30–60s after they happen. The Collector is healthy but the batch processor's `timeout` is set to 60s and `send_batch_size` is huge, so spans sit buffered long before export.
