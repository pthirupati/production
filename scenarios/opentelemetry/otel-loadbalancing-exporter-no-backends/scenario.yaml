description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Load-Balancing Exporter Has No Backends` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: A gateway Collector using the loadbalancing exporter drops all traces with `no backends available`. The DNS resolver points at a headless service that currently resolves to zero endpoints, so there is nowhere to route spans.

  OBJECTIVE: The loadbalancing exporter's DNS resolver targets a service with no resolvable endpoints (wrong name or empty backend set), so trace-ID routing has no destinations. Point the resolver at the correct backend service name (or a static list) so endpoints resolve and spans route consistently by trace ID. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The loadbalancing exporter resolves at least one backend'
- 'The empty/misnamed resolver target is confirmed as root cause'
- 'Spans route to backends by trace ID after resolution is fixed'
initial_state: |-
