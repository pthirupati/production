description: 'CONTEXT: A platform team operating opentelemetry needs you to resolve `Broken Trace: Context
  Not Propagated` during a realistic delivery incident. The business impact is a stalled or unsafe release
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline observability lab with an OpenTelemetry Collector,
  an instrumented demo service, and a local trace/metric backend under /otel. All components run locally;
  no SaaS observability vendor or paid APIs are required.


  SYMPTOM / STARTING STATE: A single user request produces two disconnected traces instead of one: the
  frontend span and the backend span have different trace IDs. The distributed trace is broken at the
  service boundary and you cannot follow a request end to end.


  OBJECTIVE: The outbound HTTP client is not injecting the W3C `traceparent` header (propagator not configured
  / not installed), so the downstream service starts a brand-new trace. Fix context propagation by enabling
  the W3C TraceContext propagator on the client so traceparent is injected and the child span joins the
  parent trace. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The outbound client injects the W3C traceparent header
- A single request produces one connected trace across frontend and backend
- The missing-propagator root cause is confirmed (not masked by span linking)
initial_state: 'A single user request produces two disconnected traces instead of one: the frontend span
  and the backend span have different trace IDs. The distributed trace is broken at the service boundary
  and you cannot follow a request end to end.'
