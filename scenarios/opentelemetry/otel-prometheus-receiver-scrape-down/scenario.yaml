solution:
  summary: |-
    The prometheus receiver's scrape_config target port does not match where the exporter actually listens, so scrapes fail and no metrics enter the pipeline. Correct the scrape target host:port to the real exporter endpoint, then reload so scrapes succeed.
  files_changed: []
  commands_run:
  - 'cat /otel/collector/config.yaml'
  - 'curl -s localhost:8888/metrics | grep scrape'
  - 'curl -s localhost:9101/metrics | head'
  reference_docs: opentelemetry-fundamentals
