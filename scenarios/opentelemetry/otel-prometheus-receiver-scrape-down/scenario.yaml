  title: 'Prometheus Receiver Scrapes Nothing'
  description: |-
    Restore healthy behavior for Prometheus Receiver Scrapes Nothing by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This opentelemetry lab teaches how the Collector's prometheus receiver scrapes exporters via scrape_configs and why a wrong target yields down scrapes through systematic troubleshooting: observe, hypothesize, change, verify.
