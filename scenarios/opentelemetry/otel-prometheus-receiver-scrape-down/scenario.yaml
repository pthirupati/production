description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Prometheus Receiver Scrapes Nothing` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: Host metrics stopped flowing through the Collector. The prometheus receiver is enabled but its scrape target points at `localhost:9100` while node-exporter runs on 9101, so every scrape is `down`.

  OBJECTIVE: The prometheus receiver's scrape_config target port does not match where the exporter actually listens, so scrapes fail and no metrics enter the pipeline. Correct the scrape target host:port to the real exporter endpoint, then reload so scrapes succeed. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The prometheus receiver scrape target reports up=1'
- 'The wrong scrape target port is confirmed as root cause'
- 'Host metrics flow through the Collector after the target is fixed'
initial_state: |-
  Host metrics stopped flowing through the Collector. The prometheus receiver is enabled but its scrape target points at `localhost:9100` while node-exporter runs on 9101, so every scrape is `down`.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /otel/collector/config.yaml`
        2. `curl -s localhost:8888/metrics | grep scrape`
        3. `curl -s localhost:9101/metrics | head`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `curl -s localhost:8888/metrics | grep scrape` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The prometheus receiver's scrape_config target port does not match where the exporter actually listens, so scrapes fail and no metrics enter the pipeline. Correct the scrape target host:port to the real exporter endpoint, then reload so scrapes succeed.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
