description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Baggage Dropped Across the Request Path` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: A `tenant.id` set as baggage at the edge is missing on downstream spans, so per-tenant analysis is impossible. The global propagator is set to `tracecontext` only, so the baggage header is never sent or read.

  OBJECTIVE: The SDK propagators list includes `tracecontext` but omits `baggage`, so the W3C baggage header is neither injected nor extracted across hops. Configure the composite propagator to include baggage (tracecontext,baggage) so tenant context flows end to end. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Baggage set at the edge appears on downstream spans'
- 'The missing baggage propagator is confirmed as root cause'
- 'tenant.id propagates across the full request path after the fix'
initial_state: |-
  A `tenant.id` set as baggage at the edge is missing on downstream spans, so per-tenant analysis is impossible. The global propagator is set to `tracecontext` only, so the baggage header is never sent or read.
