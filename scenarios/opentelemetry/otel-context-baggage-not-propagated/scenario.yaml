  title: 'Baggage Dropped Across the Request Path'
  description: |-
    Restore healthy behavior for Baggage Dropped Across the Request Path by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This opentelemetry lab teaches how W3C baggage propagation carries application context across services and why the baggage propagator must be enabled explicitly through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
