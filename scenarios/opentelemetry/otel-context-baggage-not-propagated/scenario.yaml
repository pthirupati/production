      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/otel-context-baggage-not-propagated.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The SDK propagators list includes `tracecontext` but omits `baggage`, so the W3C baggage header is neither injected nor extracted across hops. Configure the composite propagator to include baggage (tracecontext,baggage) so tenant context flows end to end.
  files_changed: []
  commands_run:
  - 'cat /otel/collector/config.yaml'
  - 'env | grep OTEL_PROPAGATORS'
  - 'curl -s localhost:8888/metrics | grep received_spans'
  reference_docs: opentelemetry-fundamentals
