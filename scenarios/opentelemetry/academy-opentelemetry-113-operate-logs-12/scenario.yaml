hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: logs are missing or fill the disk. This lab
    is about container logs — log drivers, rotation, and stdout/stderr capture. Read the objectives and
    the current state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For container logs problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Execute the maintenance in small, reversible steps, taking
    a snapshot or backup first if the change is risky.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `docker ps -a` and `docker logs <container>` for the failing container.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. `docker ps -a` — note Exited status and exit code.

    2. `docker logs <name>` for the startup error.

    3. Inspect the Dockerfile or `docker run` flags if the image is wrong.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix image, port mapping, volume, or env configuration.

    2. `docker start <name>` or re-run with corrected flags.

    3. Confirm `bash check.sh` shows the container Up.


    WHY: the checker validates the container is actually running.'
