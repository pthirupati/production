tasks:
- id: task_1
  title: 'Exporter Sending Queue Overflows'
  description: |-
    Restore healthy behavior for Exporter Sending Queue Overflows by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This opentelemetry lab teaches how the exporter sending queue buffers against backend latency and why an undersized queue drops telemetry under load through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
