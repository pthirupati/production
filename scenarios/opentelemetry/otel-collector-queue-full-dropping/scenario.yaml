    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/otel-collector-queue-full-dropping.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The exporter's `sending_queue` is undersized (small `queue_size`, low `num_consumers`) for the ingest rate while the backend has latency, so the queue overflows and drops. Enlarge the sending queue and consumer count (and enable persistent queue if needed) so bursts are buffered instead of dropped.
  files_changed: []
  commands_run:
  - 'cat /otel/collector/config.yaml'
  - 'curl -s localhost:8888/metrics | grep enqueue_failed'
  - 'otelcol validate --config /otel/collector/config.yaml'
  reference_docs: opentelemetry-fundamentals
