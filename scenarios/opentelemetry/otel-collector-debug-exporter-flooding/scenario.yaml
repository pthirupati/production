tasks:
- id: task_1
  title: 'Debug Exporter Floods Logs and Stalls Export'
  description: |-
    Restore healthy behavior for Debug Exporter Floods Logs and Stalls Export by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This opentelemetry lab teaches how the debug exporter's verbosity affects Collector logging and why it must not sit in production pipelines through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/otel-collector-debug-exporter-flooding.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The `debug` exporter with detailed verbosity is wired into the production pipeline, so every span is serialized to logs, flooding disk and slowing export. Remove the debug exporter from the production pipeline (or drop it to normal/basic verbosity in dev only), then reload.
  files_changed: []
  commands_run:
  - 'cat /otel/collector/config.yaml'
  - 'du -sh /var/log/otelcol* 2>/dev/null; journalctl -u otelcol --no-pager | tail -20'
  - 'otelcol validate --config /otel/collector/config.yaml'
  reference_docs: opentelemetry-fundamentals
