description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Debug Exporter Floods Logs and Stalls Export` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: The Collector's own logs balloon to gigabytes and export throughput drops. Someone left the `debug` exporter with `verbosity: detailed` wired into the production traces pipeline, printing every span to stdout.

  OBJECTIVE: The `debug` exporter with detailed verbosity is wired into the production pipeline, so every span is serialized to logs, flooding disk and slowing export. Remove the debug exporter from the production pipeline (or drop it to normal/basic verbosity in dev only), then reload. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The production pipeline no longer logs every span'
- 'The detailed debug exporter is confirmed as the log-flood cause'
- 'Export throughput recovers after the debug exporter is removed'
initial_state: |-
  The Collector's own logs balloon to gigabytes and export throughput drops. Someone left the `debug` exporter with `verbosity: detailed` wired into the production traces pipeline, printing every span to stdout.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /otel/collector/config.yaml`
        2. `du -sh /var/log/otelcol* 2>/dev/null; journalctl -u otelcol --no-pager | tail -20`
        3. `otelcol validate --config /otel/collector/config.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `du -sh /var/log/otelcol* 2>/dev/null; journalctl -u otelcol --no-pager | tail -20` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The `debug` exporter with detailed verbosity is wired into the production pipeline, so every span is serialized to logs, flooding disk and slowing export. Remove the debug exporter from the production pipeline (or drop it to normal/basic verbosity in dev only), then reload.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
