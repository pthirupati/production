description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Transform Processor OTTL Statement Errors` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: The Collector logs `failed to execute statement … unable to run` on every batch and drops the affected telemetry. A transform processor statement references a field with the wrong context/path, so OTTL evaluation errors out.

  OBJECTIVE: A `transform` processor OTTL statement uses an invalid path or wrong context (e.g. referencing a span field in a metric context), so evaluation errors and telemetry is dropped. Correct the OTTL statement's context and field path so it evaluates cleanly, then reload. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The transform processor executes without OTTL errors'
- 'The bad OTTL context/path is confirmed as root cause'
- 'Telemetry passes through the transform after the statement is fixed'
initial_state: |-
  The Collector logs `failed to execute statement … unable to run` on every batch and drops the affected telemetry. A transform processor statement references a field with the wrong context/path, so OTTL evaluation errors out.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /otel/collector/config.yaml`
        2. `journalctl -u otelcol --no-pager | tail -30`
        3. `otelcol validate --config /otel/collector/config.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `journalctl -u otelcol --no-pager | tail -30` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. A `transform` processor OTTL statement uses an invalid path or wrong context (e.g. referencing a span field in a metric context), so evaluation errors and telemetry is dropped. Correct the OTTL statement's context and field path so it evaluates cleanly, then reload.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
