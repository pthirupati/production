tasks:
- id: task_1
  title: 'Orchestrator Kills Collector on Failed Health Check'
  description: |-
    Restore healthy behavior for Orchestrator Kills Collector on Failed Health Check by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This opentelemetry lab teaches how the health_check extension exposes Collector liveness and why an unreferenced extension causes restart loops through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/otel-collector-extension-healthcheck-down.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The health_check extension is missing from `service.extensions` (or bound to a non-probed port), so the liveness probe fails and the supervisor kills the Collector. Enable and reference the health_check extension on the probed endpoint so liveness passes and the Collector stops restarting.
  files_changed: []
  commands_run:
  - 'cat /otel/collector/config.yaml'
  - 'curl -s localhost:13133/'
  - 'otelcol validate --config /otel/collector/config.yaml'
  reference_docs: opentelemetry-fundamentals
