description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Orchestrator Kills Collector on Failed Health Check` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: The Collector is restarted every minute by its supervisor. The liveness probe hits `/` on port 13133 but the health_check extension is either not enabled or bound to a different port, so the probe always fails.

  OBJECTIVE: The health_check extension is missing from `service.extensions` (or bound to a non-probed port), so the liveness probe fails and the supervisor kills the Collector. Enable and reference the health_check extension on the probed endpoint so liveness passes and the Collector stops restarting. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The health_check endpoint returns healthy on the probed port'
- 'The disabled/misbound health_check extension is confirmed as root cause'
- 'The Collector stops crash-restarting once liveness passes'
initial_state: |-
  The Collector is restarted every minute by its supervisor. The liveness probe hits `/` on port 13133 but the health_check extension is either not enabled or bound to a different port, so the probe always fails.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /otel/collector/config.yaml`
        2. `curl -s localhost:13133/`
        3. `otelcol validate --config /otel/collector/config.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `curl -s localhost:13133/` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The health_check extension is missing from `service.extensions` (or bound to a non-probed port), so the liveness probe fails and the supervisor kills the Collector. Enable and reference the health_check extension on the probed endpoint so liveness passes and the Collector stops restarting.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
