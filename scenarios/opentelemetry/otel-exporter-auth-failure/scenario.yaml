description: 'CONTEXT: A platform team operating opentelemetry needs you to resolve `OTLP Exporter Authentication
  Failing` during a realistic delivery incident. The business impact is a stalled or unsafe release until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline observability lab with an OpenTelemetry Collector,
  an instrumented demo service, and a local trace/metric backend under /otel. All components run locally;
  no SaaS observability vendor or paid APIs are required.


  SYMPTOM / STARTING STATE: The Collector cannot ship data: logs show `Permanent error: rpc error: code
  = Unauthenticated` from the OTLP exporter. Telemetry queues up and is dropped when the queue fills.
  The backend endpoint is reachable, but every export is rejected as unauthenticated.


  OBJECTIVE: The OTLP exporter is sending a missing/expired API token in its `headers` (or the auth extension
  references the wrong credential), so the backend returns Unauthenticated. Fix the exporter auth (correct
  the Authorization header / auth extension credential) so exports are accepted and the queue drains.
  Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The OTLP exporter presents valid credentials (correct header/auth extension)
- Exports succeed (no more Unauthenticated errors; the queue drains)
- The credential misconfiguration root cause is confirmed from Collector logs
initial_state: 'The Collector cannot ship data: logs show `Permanent error: rpc error: code = Unauthenticated`
