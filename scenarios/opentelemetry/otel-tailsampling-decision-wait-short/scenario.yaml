description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Tail Sampling Decides Before Traces Complete` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: Error traces are sampled with only the root span present — child spans are missing. The tail_sampling processor's `decision_wait` is 1s but many traces take 5–8s, so the decision fires before all spans arrive.

  OBJECTIVE: The tail_sampling `decision_wait` is shorter than the real trace duration, so the processor decides and evicts before late child spans arrive, producing partial traces. Increase decision_wait to exceed typical end-to-end latency (and size num_traces) so sampling sees complete traces before deciding. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Sampled error traces include their child spans'
- 'The too-short decision_wait is confirmed as root cause'
- 'Complete traces are retained after decision_wait is widened'
initial_state: |-
  Error traces are sampled with only the root span present — child spans are missing. The tail_sampling processor's `decision_wait` is 1s but many traces take 5–8s, so the decision fires before all spans arrive.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /otel/collector/config.yaml`
        2. `curl -s localhost:8888/metrics | grep -E 'sampling|count_traces'`
        3. `otelcol validate --config /otel/collector/config.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `curl -s localhost:8888/metrics | grep -E 'sampling|count_traces'` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The tail_sampling `decision_wait` is shorter than the real trace duration, so the processor decides and evicts before late child spans arrive, producing partial traces. Increase decision_wait to exceed typical end-to-end latency (and size num_traces) so sampling sees complete traces before deciding.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
