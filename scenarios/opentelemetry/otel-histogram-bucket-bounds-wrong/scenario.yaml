description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Latency Histogram Buckets Hide the p99` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: Dashboards show request latency p99 flat at the top bucket even during incidents. The explicit-bucket histogram's boundaries top out at 100ms, so all real multi-second latencies collapse into the +Inf bucket.

  OBJECTIVE: The histogram's explicit bucket boundaries end far below the real latency range, so high percentiles are indistinguishable in the overflow bucket. Set bucket boundaries that span the true latency distribution (via a view / metrics processor) so p95/p99 are computed accurately. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The latency histogram resolves p95/p99 instead of pinning to +Inf'
- 'The too-small bucket boundaries are confirmed as root cause'
- 'Percentiles reflect real latency after boundaries are widened'
initial_state: |-
