        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The histogram's explicit bucket boundaries end far below the real latency range, so high percentiles are indistinguishable in the overflow bucket. Set bucket boundaries that span the true latency distribution (via a view / metrics processor) so p95/p99 are computed accurately.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
