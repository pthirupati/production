tasks:
- id: task_1
  title: 'OTLP Export Fails TLS Verification'
  description: |-
    Restore healthy behavior for OTLP Export Fails TLS Verification by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This opentelemetry lab teaches how OTLP exporter TLS verification works and why trusting a private CA is the correct fix instead of insecure mode through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/otel-exporter-tls-cert-invalid.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The Collector's OTLP exporter TLS block does not reference the backend's CA bundle (`ca_file`), so certificate verification fails. Add the correct `tls.ca_file` (or the proper cert/key pair) so the exporter trusts the backend, then reload — do not disable verification with `insecure: true`.
  files_changed: []
  commands_run:
  - 'cat /otel/collector/config.yaml'
  - 'openssl s_client -connect backend:4317 -showcerts </dev/null'
  - 'otelcol validate --config /otel/collector/config.yaml'
  reference_docs: opentelemetry-fundamentals
