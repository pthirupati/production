description: |-
  CONTEXT: A platform team operating opentelemetry needs you to resolve `Filter Processor Drops Every Span` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline observability lab with an OpenTelemetry Collector, an instrumented demo service, and a local trace/metric backend under /otel. All components run locally; no SaaS observability vendor or paid APIs are required.

  SYMPTOM / STARTING STATE: After a config change to reduce noise, the backend shows zero traces. The Collector is healthy but a filter processor's OTTL condition is inverted, so it matches (and drops) all spans instead of just health-check noise.

  OBJECTIVE: The `filter` processor's OTTL span condition is inverted (or too broad), so it drops every span rather than only health-check traffic. Rewrite the condition to match only the noise you intend to drop (e.g. specific URL paths), then reload so real traces pass through. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Real application spans reach the backend again'
- 'The inverted filter condition is confirmed as the drop cause'
- 'Only intended noise is filtered after the OTTL condition is corrected'
initial_state: |-
  After a config change to reduce noise, the backend shows zero traces. The Collector is healthy but a filter processor's OTTL condition is inverted, so it matches (and drops) all spans instead of just health-check noise.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `cat /otel/collector/config.yaml`
        2. `curl -s localhost:8888/metrics | grep -E 'received_spans|filtered'`
        3. `otelcol validate --config /otel/collector/config.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `cat /otel/collector/config.yaml` and read the status/error carefully.
        2. Cross-check with `curl -s localhost:8888/metrics | grep -E 'received_spans|filtered'` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The `filter` processor's OTTL span condition is inverted (or too broad), so it drops every span rather than only health-check traffic. Rewrite the condition to match only the noise you intend to drop (e.g. specific URL paths), then reload so real traces pass through.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
