description: 'Automation lab: remove toil around service discovery. Codify repeatable
  steps for SD configs, relabeling, and target labels and prove the automation is
  idempotent.'
objectives:
- Day-2 service discovery work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for service discovery. Automate
  the boring parts without hiding important safety checks.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — SD config and discovered targets.

    2. Write down what looks normal versus wrong or missing for service discovery.

    3. Recall the core idea: SD configs, relabeling, and target labels. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for service discovery.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — SD config and discovered targets.

    2. Implement the automation with dry-run / check mode, then run it twice — the
    second run must report no changes.

    3. Verify the result — discovery finds and labels targets correctly.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-prometheus-077-automation-service-discovery-8.conf`,
    then click Check Solution.'
