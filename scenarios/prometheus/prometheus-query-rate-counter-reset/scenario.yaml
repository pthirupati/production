title: rate() on a gauge not a counter
slug: prometheus-query-rate-counter-reset
category: Prometheus Observability
description: rate() is applied to a gauge, producing nonsense. Use the in-app Prometheus simulator to
  investigate, then apply the documented fix to /etc/prometheus/rules/recording.yml from the terminal
  and verify with Check Solution.
difficulty: medium
lab_mode: simulation
simulation_type: prometheus
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: false
dual_terminal: false
objectives:
- Open the Prometheus simulator from the lab toolbar and sign in (lab_prometheus / lab_prometheus@123)
- Diagnose the fault — rate() is applied to a gauge, producing nonsense.
- Edit /etc/prometheus/rules/recording.yml in the terminal to apply the documented remediation
- Run Check Solution to confirm the configuration is corrected
initial_state: rate() is applied to a gauge, producing nonsense. The Prometheus simulator renders the
  broken state; the configuration file /etc/prometheus/rules/recording.yml must be corrected.
hints:
- order: 1
  cost: 10
  content: Open the Prometheus simulator (toolbar -> Open Prometheus). Inspect the affected area. rate()
    is applied to a gauge, producing nonsense.
- order: 2
  cost: 15
  content: The root cause is in /etc/prometheus/rules/recording.yml. Compare it against a known-good Prometheus
    configuration.
- order: 3
  cost: 20
  content: Correct /etc/prometheus/rules/recording.yml and append the success remediation marker, then
    run Check Solution. In a real cluster you would reload Prometheus (SIGHUP / restart) after editing.
