technology: Prometheus Monitoring
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: true
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly Prometheus Monitoring lab introduces Prometheus
  scrape config. You will explore jobs, relabeling, TLS, and honor_labels on the Prometheus
  stack. Read the environment first, then complete the guided steps — no prior production
  experience required.
objectives:
- Understand how Prometheus scrape config work in this lab environment
- Identify the main status and configuration signals for Prometheus scrape config
- Confirm you can read the current state confidently before changing anything
initial_state: The Prometheus stack is online with a starter Prometheus scrape config
  setup. Some pieces are intentionally incomplete so you can learn how the pieces
  fit together. Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: prometheus.yml, `promtool check config`, and targets
    UI. Write down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — jobs, relabeling, TLS, and honor_labels. Make one small, reversible
    change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-prometheus-001-learn-scrape-config.conf`, then
    click Check Solution.
