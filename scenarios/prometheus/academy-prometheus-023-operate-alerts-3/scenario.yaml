title: Alert Rules — Operate Lab
slug: academy-prometheus-023-operate-alerts-3
technology: prometheus
category: Build
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating Prometheus monitoring needs you to resolve `prometheus: Alert
  Rules — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Prometheus stack with scrape configs, PromQL, rules,
  and Alertmanager. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Prometheus stack is healthy enough for scheduled work on alert rules.
  Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine alert
  rules task safely in prometheus. Follow change control — inspect, change, verify — while working with
  expressions, for-duration, and labels.


  OBJECTIVE: Day-2 alert rules work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `systemctl is-active nginx` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 alert rules work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The Prometheus stack is healthy enough for scheduled work on alert rules. Complete the
  maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open Prometheus → Status → Targets and note which job is DOWN and the last
    scrape error message.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check `up` and `scrape_duration_seconds` for the failing target.

    2. Inspect `/etc/prometheus/prometheus.yml` for wrong host, port, or scheme.

    3. `curl` the exporter endpoint from the lab host to test connectivity.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the scrape target or relabel rule in prometheus.yml.

    2. Reload or restart Prometheus.

    3. Confirm the target is UP and Check Solution passes.


    WHY: Prometheus only collects metrics from correctly configured targets.'
summary: Complete the alert rules — operate lab prometheus lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic prometheus literacy
tags:
- do
- hands-on
