title: Blackbox not checking TLS expiry
slug: prometheus-blackbox-tls-expiry
category: Prometheus Observability
description: TLS module doesn't export probe_ssl_earliest_cert_expiry. Use the in-app Prometheus simulator
  to investigate, then apply the documented fix to /etc/prometheus/blackbox.yml from the terminal and
  verify with Check Solution.
difficulty: easy
lab_mode: simulation
simulation_type: prometheus
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: false
dual_terminal: false
objectives:
- Open the Prometheus simulator from the lab toolbar and sign in (lab_prometheus / lab_prometheus@123)
- Diagnose the fault — TLS module doesn't export probe_ssl_earliest_cert_expiry.
- Edit /etc/prometheus/blackbox.yml in the terminal to apply the documented remediation
- Run Check Solution to confirm the configuration is corrected
initial_state: TLS module doesn't export probe_ssl_earliest_cert_expiry. The Prometheus simulator renders
  the broken state; the configuration file /etc/prometheus/blackbox.yml must be corrected.
hints:
- order: 1
  cost: 10
  content: Open the Prometheus simulator (toolbar -> Open Prometheus). Inspect the affected area. TLS
    module doesn't export probe_ssl_earliest_cert_expiry.
- order: 2
  cost: 15
  content: The root cause is in /etc/prometheus/blackbox.yml. Compare it against a known-good Prometheus
    configuration.
- order: 3
  cost: 20
  content: Correct /etc/prometheus/blackbox.yml and append the success remediation marker, then run Check
    Solution. In a real cluster you would reload Prometheus (SIGHUP / restart) after editing.
