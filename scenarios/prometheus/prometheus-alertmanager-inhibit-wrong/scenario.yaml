title: Alertmanager inhibit rule suppresses all
slug: prometheus-alertmanager-inhibit-wrong
category: Prometheus Observability
description: An inhibit rule is too broad and suppresses everything. Use the in-app Prometheus simulator
  to investigate, then apply the documented fix to /etc/prometheus/alertmanager.yml from the terminal
  and verify with Check Solution.
difficulty: hard
lab_mode: simulation
simulation_type: prometheus
jira_priority: High
time_limit: 1200
max_score: 100
is_free: false
dual_terminal: false
objectives:
- Open the Prometheus simulator from the lab toolbar and sign in (lab_prometheus / lab_prometheus@123)
- Diagnose the fault — An inhibit rule is too broad and suppresses everything.
- Edit /etc/prometheus/alertmanager.yml in the terminal to apply the documented remediation
- Run Check Solution to confirm the configuration is corrected
initial_state: An inhibit rule is too broad and suppresses everything. The Prometheus simulator renders
  the broken state; the configuration file /etc/prometheus/alertmanager.yml must be corrected.
hints:
- order: 1
  cost: 10
  content: Open the Prometheus simulator (toolbar -> Open Prometheus). Inspect the affected area. An inhibit
    rule is too broad and suppresses everything.
- order: 2
  cost: 15
  content: The root cause is in /etc/prometheus/alertmanager.yml. Compare it against a known-good Prometheus
    configuration.
- order: 3
  cost: 20
  content: Correct /etc/prometheus/alertmanager.yml and append the success remediation marker, then run
    Check Solution. In a real cluster you would reload Prometheus (SIGHUP / restart) after editing.
