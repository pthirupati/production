description: Service operations lab. The `crond` systemd unit is **failed/inactive** on this host — a
  realistic fault for Build From Scratch workflows that depend on it. Diagnose with `systemctl status
  crond` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active crond`.
objectives:
- The `crond` service is active (running)
- '`systemctl is-active crond` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `crond` service is not running (`systemctl is-active crond` → inactive/failed). Dependent
  Build From Scratch tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — Prometheus graph UI, `promtool query instant`, and rule files.

    2. Write down what looks normal versus wrong or missing for PromQL queries.

    3. Recall the core idea: metric selectors, rates, aggregations, and alert expressions. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for PromQL queries.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — Prometheus graph UI, `promtool query instant`, and rule files.

    2. Create the smallest working slice of PromQL queries first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — expressions return sensible series for the intended window.

    4. Click Check Solution once `systemctl is-active crond` returns active.'
