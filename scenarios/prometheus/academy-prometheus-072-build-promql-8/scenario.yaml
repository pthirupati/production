    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — Prometheus graph UI, `promtool query instant`,
    and rule files.

    2. Create the smallest working slice of PromQL queries first, validate it, then
