description: 'CONTEXT: A team operating Prometheus monitoring needs you to resolve `prometheus: Recording
  Rules — Troubleshooting Drill` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Prometheus stack with scrape configs, PromQL, rules,
  and Alertmanager. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Prometheus stack is degraded. Dashboards are slow on expensive queries.
  Recent changes may exist around recording rules, but do not restart blindly — gather evidence first.
  Production alert: dashboards are slow on expensive queries. You are on call for prometheus and must
  troubleshoot recording rules methodically — triage symptoms, isolate root cause, apply the smallest
  safe fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: dashboards are slow on expensive queries; Root cause is isolated
  with evidence, not guesswork; Service behavior returns to normal after the fix. Success means `systemctl
  is-active crond` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: dashboards are slow on expensive queries'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Prometheus stack is degraded. Dashboards are slow on expensive queries. Recent changes
  may exist around recording rules, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status crond` and `journalctl -u crond -n 50 --no-pager`
    before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart crond` and confirm `systemctl is-active crond` succeeds.


    WHY: the grader checks real service state, not marker files.'
