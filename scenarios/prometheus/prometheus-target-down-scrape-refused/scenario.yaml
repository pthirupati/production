hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: scrape target DOWN — connection refused is not
    behaving as the scenario objectives require. This lab is about scrape target DOWN — connection refused
    — how scrape target DOWN — connection refused behaves in a Prometheus monitoring environment. Read
    the objectives and the current state, and note precisely what looks wrong versus healthy before you
    form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For scrape target DOWN — connection refused problems the reliable
    method is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Create the smallest working slice
    of scrape target DOWN — connection refused first, validate it, then add the remaining pieces one at
    a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    1. Inspect the current state with `curl -I http://localhost:9090/-/healthy` and the service error
    log.

    2. Each command above tells you something specific — status/health, recent errors, and the effective
    configuration. Read them in that order.

    3. Compare what you see to the objectives; the gap points at the fault.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Check `up` and `scrape_duration_seconds` for the failing target.

    2. Inspect `/etc/prometheus/prometheus.yml` for wrong host, port, or scheme.

    3. `curl` the exporter endpoint from the lab host to test connectivity.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the smallest reversible change your hypothesis points to. Create the smallest working slice
    of scrape target DOWN — connection refused first, validate it, then add the remaining pieces one at
    a time.

    2. Re-run `curl -I http://localhost:9090/-/healthy` and confirm HTTP 200 from http://localhost:9090/-/healthy.

    3. If it still fails, the hypothesis was wrong — go back to the evidence, do not stack changes.


    WHY: the grader validates real system state, not marker files — a fix only counts when the subsystem
    is actually healthy.'
