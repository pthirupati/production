title: Scrape target DOWN — connection refused
slug: prometheus-target-down-scrape-refused
category: Build
description: 'CONTEXT: A team operating Prometheus monitoring needs you to resolve `Scrape target DOWN
  — connection refused` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Prometheus stack with scrape configs, PromQL, rules,
  and Alertmanager. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: node-exporter target is DOWN (up==0); the scrape config points at the wrong
  port. The Prometheus simulator renders the broken state; the configuration file /etc/prometheus/prometheus.yml
  must be corrected. node-exporter target is DOWN (up==0); the scrape config points at the wrong port.
  Use the in-app Prometheus simulator to investigate, then apply the documented fix to /etc/prometheus/prometheus.yml
  from the terminal and verify with Check Solution.


  OBJECTIVE: Open the Prometheus simulator from the lab toolbar and sign in (lab_prometheus / lab_prometheus@123);
  Diagnose the fault — node-exporter target is DOWN (up==0); the scrape config points at the wrong port.;
  Edit /etc/prometheus/prometheus.yml in the terminal to apply the documented remediation. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
