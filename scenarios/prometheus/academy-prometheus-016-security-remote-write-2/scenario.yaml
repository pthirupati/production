title: Remote Write — Security Lab
slug: academy-prometheus-016-security-remote-write-2
technology: prometheus
category: Harden
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating Prometheus monitoring needs you to resolve `prometheus: Remote
  Write — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Prometheus stack with scrape configs, PromQL, rules,
  and Alertmanager. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around remote write. Assume
  an auditor or pen test is next week — tighten controls with evidence. Security review: harden remote
  write on this prometheus system. Close unsafe defaults, enforce least privilege, and ensure long-term
  storage and queue tuning cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to remote write are removed or constrained; Access follows least
  privilege and is auditable; Security checks pass without breaking required functionality. Success means
  `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to remote write are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around remote write. Assume an auditor
  or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open Prometheus → Status → Targets and note which job is DOWN and the last
    scrape error message.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check `up` and `scrape_duration_seconds` for the failing target.

    2. Inspect `/etc/prometheus/prometheus.yml` for wrong host, port, or scheme.

    3. `curl` the exporter endpoint from the lab host to test connectivity.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the scrape target or relabel rule in prometheus.yml.

    2. Reload or restart Prometheus.

    3. Confirm the target is UP and Check Solution passes.


    WHY: Prometheus only collects metrics from correctly configured targets.'
summary: Complete the remote write — security lab prometheus lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic prometheus literacy
tags:
- fix
- hands-on
- prometheus
linked_tutorial: prometheus-fundamentals
what_you_will_learn:
- Unsafe defaults related to remote write are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
environment:
  nodes:
  - role: primary
    os: FixitLab Prometheus stack
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - bash
  - coreutils
  - journalctl
  - prometheus
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Remote Write — Security Lab
  description: Restore healthy behavior for Remote Write — Security Lab by investigating the failure,
    applying the smallest safe fix, and validating the outcome.
  background: 'This prometheus lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: service_active
    command: systemctl is-active nginx
    expected_status: active
    error_message: The nginx service is not active yet. Check `systemctl status nginx` and `journalctl
      -u nginx -n 50`.
solution:
  summary: The root cause is an unhealthy `nginx` service; repair it and verify active state.
  files_changed: []
  commands_run:
  - systemctl is-active nginx
  reference_docs: prometheus-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
