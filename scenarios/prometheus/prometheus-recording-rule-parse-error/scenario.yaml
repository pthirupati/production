title: Recording rule parse error
slug: prometheus-recording-rule-parse-error
category: Fix
description: 'CONTEXT: A team operating Prometheus monitoring needs you to resolve `Recording rule parse
  error` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Prometheus stack with scrape configs, PromQL, rules,
  and Alertmanager. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A recording rule has a PromQL parse error and won''t load. The Prometheus
  simulator renders the broken state; the configuration file /etc/prometheus/rules/recording.yml must
  be corrected. A recording rule has a PromQL parse error and won''t load. Use the in-app Prometheus simulator
  to investigate, then apply the documented fix to /etc/prometheus/rules/recording.yml from the terminal
  and verify with Check Solution.


  OBJECTIVE: Open the Prometheus simulator from the lab toolbar and sign in (lab_prometheus / lab_prometheus@123);
  Diagnose the fault — A recording rule has a PromQL parse error and won''t load.; Edit /etc/prometheus/rules/recording.yml
  in the terminal to apply the documented remediation. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
