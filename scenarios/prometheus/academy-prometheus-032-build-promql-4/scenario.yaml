description: 'CONTEXT: A team operating Prometheus monitoring needs you to resolve `prometheus: Promql
  Queries — Build From Scratch` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Prometheus stack with scrape configs, PromQL, rules,
  and Alertmanager. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Prometheus stack is ready but PromQL queries is not configured yet. Required
  tools may already be installed; your job is to create the configuration and bring the capability online.
  Build PromQL queries from scratch in this prometheus lab. You start from a minimal environment and must
  produce a working configuration that demonstrates metric selectors, rates, aggregations, and alert expressions.
  Plan, implement, then prove it works.


  OBJECTIVE: A working PromQL queries setup must exist by the end of this lab; Configuration should follow
  team conventions and be easy to audit; The result should pass validation without manual cleanup. Success
  means `systemctl is-active crond` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working PromQL queries setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The Prometheus stack is ready but PromQL queries is not configured yet. Required tools
  may already be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — Prometheus graph UI, `promtool query instant`, and rule files.

    2. Write down what looks normal versus wrong or missing for PromQL queries.

    3. Recall the core idea: metric selectors, rates, aggregations, and alert expressions. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — Prometheus graph UI, `promtool query instant`, and rule files.

    2. Create the smallest working slice of PromQL queries first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — expressions return sensible series for the intended window.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
