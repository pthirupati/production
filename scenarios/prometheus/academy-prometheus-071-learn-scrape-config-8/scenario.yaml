title: Scrape Config — Learn Lab
slug: academy-prometheus-071-learn-scrape-config-8
technology: prometheus
category: Learn
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: 'CONTEXT: A team operating Prometheus monitoring needs you to resolve `prometheus: Scrape
  Config — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Prometheus stack with scrape configs, PromQL, rules,
  and Alertmanager. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Prometheus stack is online with a starter scrape config setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
  This beginner-friendly prometheus lab introduces scrape config. You will explore jobs, targets, and
  relabeling on the Prometheus stack. Read the environment first, then follow the guided steps — no prior
  production experience required.


  OBJECTIVE: Understand how scrape config work in this lab environment; Identify the main status and configuration
  signals for scrape config; Confirm you can read the current state confidently before changing anything.
  Success means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how scrape config work in this lab environment
- Identify the main status and configuration signals for scrape config
- Confirm you can read the current state confidently before changing anything
initial_state: The Prometheus stack is online with a starter scrape config setup. Some pieces are intentionally
  incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Open Prometheus → Status → Targets and note which job is DOWN and the last
    scrape error message.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check `up` and `scrape_duration_seconds` for the failing target.

    2. Inspect `/etc/prometheus/prometheus.yml` for wrong host, port, or scheme.

    3. `curl` the exporter endpoint from the lab host to test connectivity.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Correct the scrape target or relabel rule in prometheus.yml.

    2. Reload or restart Prometheus.

    3. Confirm the target is UP and Check Solution passes.


    WHY: Prometheus only collects metrics from correctly configured targets.'
summary: Complete the scrape config — learn lab prometheus lab and verify success with the checker
estimated_minutes: 15
xp_reward: 100
