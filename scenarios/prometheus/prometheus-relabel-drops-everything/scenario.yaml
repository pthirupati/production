title: relabel_configs drop all targets
slug: prometheus-relabel-drops-everything
category: Prometheus Observability
description: A keep relabel rule matches nothing, dropping every target. Use the in-app Prometheus simulator
  to investigate, then apply the documented fix to /etc/prometheus/prometheus.yml from the terminal and
  verify with Check Solution.
difficulty: hard
lab_mode: simulation
simulation_type: prometheus
jira_priority: High
time_limit: 1200
max_score: 100
is_free: false
dual_terminal: false
objectives:
- Open the Prometheus simulator from the lab toolbar and sign in (lab_prometheus / lab_prometheus@123)
- Diagnose the fault — A keep relabel rule matches nothing, dropping every target.
- Edit /etc/prometheus/prometheus.yml in the terminal to apply the documented remediation
- Run Check Solution to confirm the configuration is corrected
initial_state: A keep relabel rule matches nothing, dropping every target. The Prometheus simulator renders
  the broken state; the configuration file /etc/prometheus/prometheus.yml must be corrected.
hints:
- order: 1
  cost: 10
  content: Open the Prometheus simulator (toolbar -> Open Prometheus). Inspect the affected area. A keep
    relabel rule matches nothing, dropping every target.
- order: 2
  cost: 15
  content: The root cause is in /etc/prometheus/prometheus.yml. Compare it against a known-good Prometheus
    configuration.
- order: 3
  cost: 20
  content: Correct /etc/prometheus/prometheus.yml and append the success remediation marker, then run
    Check Solution. In a real cluster you would reload Prometheus (SIGHUP / restart) after editing.
