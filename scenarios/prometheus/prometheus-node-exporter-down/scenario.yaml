title: node_exporter service implied down
slug: prometheus-node-exporter-down
category: Build
description: 'CONTEXT: A team operating Prometheus monitoring has raised a ticket for `node_exporter service
  implied down`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Prometheus stack. The architecture is a single lab-primary
  node exposing scrape configs, PromQL, rules, and Alertmanager; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The node_exporter job is DOWN; fix the target/port. The Prometheus console
  renders the broken state; the configuration file /etc/prometheus/prometheus.yml must be corrected.


  OBJECTIVE: Open the Prometheus console from the lab toolbar and sign in (lab_prometheus / lab_prometheus@123);
  Diagnose the fault — The node_exporter job is DOWN; fix the target/port.; Edit /etc/prometheus/prometheus.yml
  in the terminal to apply the documented remediation. Acceptance criteria: the change is minimal and
  reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant scrape configs, PromQL, rules, and Alertmanager), changing one thing at a time. Check
  your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
