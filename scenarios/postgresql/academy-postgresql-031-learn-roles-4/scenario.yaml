title: 'PostgreSQL: Ansible Roles — Fundamentals Lab'
slug: academy-postgresql-031-learn-roles-4
technology: PostgreSQL
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly PostgreSQL lab introduces Ansible roles. You will
  explore role layout, defaults/vars, tasks, handlers, and dependencies on the PostgreSQL
  cluster. Read the environment first, then follow the guided steps — no prior production
  experience required.
objectives:
- Understand how Ansible roles work in this lab environment
- Identify the main status and configuration signals for Ansible roles
- Confirm you can read the current state confidently before changing anything
initial_state: The PostgreSQL cluster is online with a starter Ansible roles setup.
  Some pieces are intentionally incomplete so you can learn how they fit together.
  Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — roles/ tree, `ansible-galaxy list`, and role variable
    precedence.

    2. Write down what looks normal versus wrong or missing for Ansible roles.

    3. Recall the core idea: role layout, defaults/vars, tasks, handlers, and dependencies.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Ansible roles.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — roles/ tree, `ansible-galaxy list`, and role variable
    precedence.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — role applies idempotently with the expected variables per
    group.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-postgresql-031-learn-roles-4.conf`,
    then click Check Solution.'
