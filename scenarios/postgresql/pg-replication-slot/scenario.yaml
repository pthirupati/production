coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Disk is filling because an inactive replication slot pins WAL forever. Fix solution(conn)
    so it returns the slot names that are safe to drop, sorted ascending. A slot is safe to drop only
    when it is inactive (active = 0) AND its retained_bytes exceeds the threshold argument. Active slots
    are never dropped no matter how much WAL they retain. conn has slots(slot_name, active, retained_bytes).

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn, threshold):\n    # BUG: drops purely on retained size, which would kill\
      \ a healthy,\n    # actively-streaming replica's slot.\n    return [r[0] for r in conn.execute(\n\
      \        \"SELECT slot_name FROM slots WHERE retained_bytes > ? ORDER BY slot_name\",\n        (threshold,))]\n"
    readonly: false
  visible_tests:
  - name: inactive bloated slot is dropped
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE slots (slot_name TEXT, active INTEGER, retained_bytes INTEGER);\")\n   \
      \ conn.executemany(\"INSERT INTO slots VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([('dead',0,900),('live',1,50)])\n\
      assert solution(conn, 100) == ['dead'], solution(conn, 100)\n"
  - name: active slot is never dropped
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE slots (slot_name TEXT, active INTEGER, retained_bytes INTEGER);\")\n   \
      \ conn.executemany(\"INSERT INTO slots VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([('live',1,5000)])\n\
      assert solution(conn, 100) == [], solution(conn, 100)\n"
  hidden_tests:
  - name: no slots returns empty
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE slots (slot_name TEXT, active INTEGER, retained_bytes INTEGER);\")\n   \
      \ conn.executemany(\"INSERT INTO slots VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([])\n\
      assert solution(conn, 10) == [], solution(conn, 10)\n"
  - name: inactive but small slot is kept
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE slots (slot_name TEXT, active INTEGER, retained_bytes INTEGER);\")\n   \
      \ conn.executemany(\"INSERT INTO slots VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([('small',0,10)])\n\
      assert solution(conn, 100) == [], solution(conn, 100)\n"
  - name: threshold is strict, not inclusive
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE slots (slot_name TEXT, active INTEGER, retained_bytes INTEGER);\")\n   \
      \ conn.executemany(\"INSERT INTO slots VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([('edge',0,100)])\n\
      assert solution(conn, 100) == [], solution(conn, 100)\n"
  - name: results are sorted
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE slots (slot_name TEXT, active INTEGER, retained_bytes INTEGER);\")\n   \
      \ conn.executemany(\"INSERT INTO slots VALUES (?,?,?)\", rows)\n    return conn\nconn = _seed([('zulu',0,500),('alpha',0,500)])\n\
      assert solution(conn, 100) == ['alpha','zulu'], solution(conn, 100)\n"
  timeout: 8
