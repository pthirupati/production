description: 'CONTEXT: A team operating PostgreSQL needs you to resolve `postgresql: Vacuum And Bloat
  — Troubleshooting Drill` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PostgreSQL cluster with psql, pg_hba.conf, roles,
  and WAL. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The PostgreSQL cluster is degraded. Tables bloat and queries slow over time.
  Recent changes may exist around vacuum and bloat, but do not restart blindly — gather evidence first.
  Production alert: tables bloat and queries slow over time. You are on call for postgresql and must troubleshoot
  vacuum and bloat methodically — triage symptoms, isolate root cause, apply the smallest safe fix, and
  confirm recovery.


  OBJECTIVE: The incident symptom is clear: tables bloat and queries slow over time; Root cause is isolated
  with evidence, not guesswork; Service behavior returns to normal after the fix. Success means `systemctl
  is-active postgresql` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: tables bloat and queries slow over time'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The PostgreSQL cluster is degraded. Tables bloat and queries slow over time. Recent changes
  may exist around vacuum and bloat, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `pg_stat_user_tables` and autovacuum settings.

    2. Write down what looks normal versus wrong or missing for vacuum and bloat.

    3. Recall the core idea: autovacuum, dead tuples, and bloat. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status postgresql` — note Active/Failed and the last log lines.

    2. Read `journalctl -u postgresql -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `pg_stat_user_tables` and autovacuum settings.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — vacuum keeps bloat and stats healthy.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
