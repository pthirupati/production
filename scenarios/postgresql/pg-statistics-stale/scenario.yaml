coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'After a bulk load the planner still uses row counts from before the load. Fix solution(conn)
    so it returns the join strategy as ''nested_loop'' or ''hash_join'' based on the CURRENT row count.
    Count the rows actually in `events` rather than trusting the cached estimate in stats(relname, est_rows).
    Use nested_loop only when the real count is below 100, otherwise hash_join.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn):\n    # BUG: trusts the stale cached estimate, which still says the table\
      \ is\n    # tiny after a bulk load.\n    est = conn.execute(\"SELECT est_rows FROM stats WHERE relname='events'\"\
      ).fetchone()[0]\n    return 'nested_loop' if est < 100 else 'hash_join'\n"
    readonly: false
  visible_tests:
  - name: bulk-loaded table switches to hash join
    code: "import sqlite3\ndef _seed(n_rows, est):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE events (id INTEGER PRIMARY KEY);\"\n        \"CREATE TABLE stats (relname\
      \ TEXT, est_rows INTEGER);\")\n    conn.executemany(\"INSERT INTO events VALUES (?)\", [(i,) for\
      \ i in range(1, n_rows + 1)])\n    conn.execute(\"INSERT INTO stats VALUES ('events', ?)\", (est,))\n\
      \    return conn\nconn = _seed(500, est=10)\nassert solution(conn) == 'hash_join', solution(conn)\n"
  - name: genuinely small table keeps nested loop
    code: "import sqlite3\ndef _seed(n_rows, est):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE events (id INTEGER PRIMARY KEY);\"\n        \"CREATE TABLE stats (relname\
      \ TEXT, est_rows INTEGER);\")\n    conn.executemany(\"INSERT INTO events VALUES (?)\", [(i,) for\
      \ i in range(1, n_rows + 1)])\n    conn.execute(\"INSERT INTO stats VALUES ('events', ?)\", (est,))\n\
      \    return conn\nconn = _seed(5, est=5)\nassert solution(conn) == 'nested_loop', solution(conn)\n"
  hidden_tests:
  - name: empty table uses nested loop
    code: "import sqlite3\ndef _seed(n_rows, est):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE events (id INTEGER PRIMARY KEY);\"\n        \"CREATE TABLE stats (relname\
      \ TEXT, est_rows INTEGER);\")\n    conn.executemany(\"INSERT INTO events VALUES (?)\", [(i,) for\
      \ i in range(1, n_rows + 1)])\n    conn.execute(\"INSERT INTO stats VALUES ('events', ?)\", (est,))\n\
      \    return conn\nconn = _seed(0, est=99999)\nassert solution(conn) == 'nested_loop', solution(conn)\n"
  - name: threshold boundary at 100 is hash join
    code: "import sqlite3\ndef _seed(n_rows, est):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE events (id INTEGER PRIMARY KEY);\"\n        \"CREATE TABLE stats (relname\
      \ TEXT, est_rows INTEGER);\")\n    conn.executemany(\"INSERT INTO events VALUES (?)\", [(i,) for\
      \ i in range(1, n_rows + 1)])\n    conn.execute(\"INSERT INTO stats VALUES ('events', ?)\", (est,))\n\
      \    return conn\nconn = _seed(100, est=1)\nassert solution(conn) == 'hash_join', solution(conn)\n"
  - name: just below threshold is nested loop
    code: "import sqlite3\ndef _seed(n_rows, est):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE events (id INTEGER PRIMARY KEY);\"\n        \"CREATE TABLE stats (relname\
      \ TEXT, est_rows INTEGER);\")\n    conn.executemany(\"INSERT INTO events VALUES (?)\", [(i,) for\
      \ i in range(1, n_rows + 1)])\n    conn.execute(\"INSERT INTO stats VALUES ('events', ?)\", (est,))\n\
      \    return conn\nconn = _seed(99, est=1)\nassert solution(conn) == 'nested_loop', solution(conn)\n"
  - name: a stale high estimate does not force hash join
    code: "import sqlite3\ndef _seed(n_rows, est):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE events (id INTEGER PRIMARY KEY);\"\n        \"CREATE TABLE stats (relname\
      \ TEXT, est_rows INTEGER);\")\n    conn.executemany(\"INSERT INTO events VALUES (?)\", [(i,) for\
      \ i in range(1, n_rows + 1)])\n    conn.execute(\"INSERT INTO stats VALUES ('events', ?)\", (est,))\n\
      \    return conn\nconn = _seed(3, est=100000)\nassert solution(conn) == 'nested_loop', solution(conn)\n"
