title: NULL-Safe Mismatch Detection
slug: pg-null-safe-customer-match
technology: postgresql
category: Fix
description: 'CONTEXT: A team operating PostgreSQL needs you to resolve `NULL-Safe Mismatch Detection`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PostgreSQL cluster with psql, pg_hba.conf, roles,
  and WAL. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A logistics audit must flag shipments whose assigned warehouse differs from
  where the order shipped, but `assigned_wh <> shipped_wh` drops rows where one side is NULL because NULL
  comparisons are UNKNOWN. Make the comparison NULL-safe. A logistics audit must flag shipments whose
  assigned warehouse differs from where the order actually shipped. The query uses `assigned_wh <> shipped_wh`,
  but in SQL any comparison with NULL yields UNKNOWN (not true), so rows where exactly one side is NULL
  are silently dropped — the very rows an audit cares about. Make the comparison NULL-safe so a one-sided
  NULL counts as a mismatch and two NULLs count as a match.


  OBJECTIVE: Understand that `<>` against NULL returns UNKNOWN, not true; Use a NULL-safe distinctness
  test so one-sided NULLs are caught; Treat two NULLs as equal and return the right mismatched ids. Success
  means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
