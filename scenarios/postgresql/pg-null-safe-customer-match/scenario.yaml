initial_state: A logistics audit must flag shipments whose assigned warehouse differs from where the order
  shipped, but `assigned_wh <> shipped_wh` drops rows where one side is NULL because NULL comparisons
  are UNKNOWN. Make the comparison NULL-safe.
solution_explanation: 'Three-valued logic means `assigned_wh <> shipped_wh` is UNKNOWN whenever either
  side is NULL, and WHERE

  only keeps rows that are TRUE — so one-sided-NULL mismatches vanish. The fix is a NULL-safe distinctness

  operator. In standard SQL that is `IS DISTINCT FROM`; SQLite spells the same idea as `IS NOT`. Both

  treat NULL as a comparable value: one NULL vs a non-NULL is "distinct" (a mismatch), and NULL vs NULL
  is

  "not distinct" (a match).

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Fix solution(conn). It must return the ids (as tuples) of shipments where assigned_wh
    differs from

    shipped_wh, using NULL-safe comparison: if exactly one of the two columns is NULL the row IS a

    mismatch; if BOTH are NULL the row is a match (not returned). Order by id ascending.

    The conn argument is a fresh sqlite3 connection with a `shipments(id, assigned_wh, shipped_wh)` table.

    Hint: SQLite''s NULL-safe inequality is `IS NOT` (the analogue of standard SQL `IS DISTINCT FROM`).

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "import sqlite3\n\ndef solution(conn):\n    # BUG: `<>` with a NULL operand evaluates to\
      \ UNKNOWN, so rows where\n    # exactly one side is NULL are dropped instead of flagged as mismatches.\n\
      \    return conn.execute(\n        \"\"\"\n        SELECT id\n        FROM shipments\n        WHERE\
      \ assigned_wh <> shipped_wh\n        ORDER BY id\n        \"\"\"\n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: one-sided NULLs are flagged
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ shipments (id INTEGER PRIMARY KEY, assigned_wh TEXT, shipped_wh TEXT);\"\n    \"INSERT INTO shipments\
      \ (id, assigned_wh, shipped_wh) VALUES \"\n    \"(1,'A','A'),(2,'A','B'),(3,NULL,'A'),(4,'A',NULL),(5,NULL,NULL);\"\
      \n)\nassert solution(conn) == [(2,), (3,), (4,)], solution(conn)\n"
  - name: two NULLs count as a match
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ shipments (id INTEGER PRIMARY KEY, assigned_wh TEXT, shipped_wh TEXT);\"\n    \"INSERT INTO shipments\
      \ (id, assigned_wh, shipped_wh) VALUES \"\n    \"(1,'A','A'),(2,'A','B'),(3,NULL,'A'),(4,'A',NULL),(5,NULL,NULL);\"\
      \n)\nassert (5,) not in solution(conn), solution(conn)\n"
  hidden_tests:
  - name: all matching rows return nothing
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ shipments (id INTEGER PRIMARY KEY, assigned_wh TEXT, shipped_wh TEXT);\"\n    \"INSERT INTO shipments\
      \ VALUES (1,'X','X'),(2,NULL,NULL);\"\n)\nassert solution(conn) == [], solution(conn)\n"
  - name: every row a one-sided NULL
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ shipments (id INTEGER PRIMARY KEY, assigned_wh TEXT, shipped_wh TEXT);\"\n    \"INSERT INTO shipments\
      \ VALUES (10,NULL,'Q'),(11,'Q',NULL);\"\n)\nassert solution(conn) == [(10,), (11,)], solution(conn)\n"
  - name: result ordered by id
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ shipments (id INTEGER PRIMARY KEY, assigned_wh TEXT, shipped_wh TEXT);\"\n    \"INSERT INTO shipments\
      \ VALUES (3,'a','b'),(1,'c','d'),(2,NULL,'z');\"\n)\nassert solution(conn) == [(1,), (2,), (3,)],\
      \ solution(conn)\n"
  timeout: 8
