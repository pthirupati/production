  content: 'Orient yourself before changing anything:

    1. Inspect the current state — EXPLAIN/EXPLAIN ANALYZE and index usage views.

    2. Write down what looks normal versus wrong or missing for database indexes.

    3. Recall the core idea: B-tree indexes, selectivity, covering indexes, and plan
    impact. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for database indexes.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — EXPLAIN/EXPLAIN ANALYZE and index usage views.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup
    first if the change is risky.

    3. Verify the result — plans use the intended index and latency drops.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-postgresql-053-operate-indexes-6.conf`,
