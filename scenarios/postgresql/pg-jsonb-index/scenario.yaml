coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Metadata search scans the whole JSONB column. Fix solution(conn) so it returns the ids
    of docs whose metadata contains the given key with the given value, ordered by id. The metadata column
    holds a JSON object as text; a doc matches only when the key is present AND its value equals the target
    exactly. Use the json module - a substring match on the raw text is what makes the current version
    wrong.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "import json\n\ndef solution(conn, key, value):\n    # BUG: substring match on raw JSON text,\
      \ so it matches the key name\n    # appearing anywhere and cannot tell 'active' from 'inactive'.\n\
      \    out = []\n    for rid, meta in conn.execute(\"SELECT id, metadata FROM docs ORDER BY id\"):\n\
      \        if value in meta:\n            out.append(rid)\n    return out\n"
    readonly: false
  visible_tests:
  - name: exact key/value match is found
    code: "import sqlite3, json\ndef _meta(**kw):\n    return json.dumps(kw)\ndef _seed(rows):\n    conn\
      \ = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE docs (id INTEGER PRIMARY\
      \ KEY, metadata TEXT);\")\n    conn.executemany(\"INSERT INTO docs VALUES (?,?)\", rows)\n    return\
      \ conn\nconn = _seed([(1, _meta(status='active')), (2, _meta(status='archived'))])\nassert solution(conn,\
      \ 'status', 'active') == [1], solution(conn, 'status', 'active')\n"
  - name: non-matching value is excluded
    code: "import sqlite3, json\ndef _meta(**kw):\n    return json.dumps(kw)\ndef _seed(rows):\n    conn\
      \ = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE docs (id INTEGER PRIMARY\
      \ KEY, metadata TEXT);\")\n    conn.executemany(\"INSERT INTO docs VALUES (?,?)\", rows)\n    return\
      \ conn\nconn = _seed([(1, _meta(status='archived'))])\nassert solution(conn, 'status', 'active')\
      \ == [], solution(conn, 'status', 'active')\n"
  hidden_tests:
  - name: substring values do not falsely match
    code: "import sqlite3, json\ndef _meta(**kw):\n    return json.dumps(kw)\ndef _seed(rows):\n    conn\
      \ = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE docs (id INTEGER PRIMARY\
      \ KEY, metadata TEXT);\")\n    conn.executemany(\"INSERT INTO docs VALUES (?,?)\", rows)\n    return\
      \ conn\nconn = _seed([(1, _meta(status='inactive'))])\nassert solution(conn, 'status', 'active')\
      \ == [], solution(conn, 'status', 'active')\n"
  - name: value under a different key does not match
    code: "import sqlite3, json\ndef _meta(**kw):\n    return json.dumps(kw)\ndef _seed(rows):\n    conn\
      \ = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE docs (id INTEGER PRIMARY\
      \ KEY, metadata TEXT);\")\n    conn.executemany(\"INSERT INTO docs VALUES (?,?)\", rows)\n    return\
      \ conn\nconn = _seed([(1, _meta(other='active'))])\nassert solution(conn, 'status', 'active') ==\
      \ [], solution(conn, 'status', 'active')\n"
  - name: empty table returns nothing
    code: "import sqlite3, json\ndef _meta(**kw):\n    return json.dumps(kw)\ndef _seed(rows):\n    conn\
      \ = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE docs (id INTEGER PRIMARY\
      \ KEY, metadata TEXT);\")\n    conn.executemany(\"INSERT INTO docs VALUES (?,?)\", rows)\n    return\
      \ conn\nconn = _seed([])\nassert solution(conn, 'status', 'active') == [], solution(conn, 'status',\
      \ 'active')\n"
  - name: multiple matches come back ordered
    code: "import sqlite3, json\ndef _meta(**kw):\n    return json.dumps(kw)\ndef _seed(rows):\n    conn\
      \ = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE docs (id INTEGER PRIMARY\
      \ KEY, metadata TEXT);\")\n    conn.executemany(\"INSERT INTO docs VALUES (?,?)\", rows)\n    return\
      \ conn\nconn = _seed([(5, _meta(status='active')), (2, _meta(status='active'))])\nassert solution(conn,\
      \ 'status', 'active') == [2, 5], solution(conn, 'status', 'active')\n"
  timeout: 8
