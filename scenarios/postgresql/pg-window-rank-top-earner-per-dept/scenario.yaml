title: Top Earner Per Department (Window RANK with Ties)
slug: pg-window-rank-top-earner-per-dept
technology: postgresql
category: Build
description: 'CONTEXT: A team operating PostgreSQL needs you to resolve `Top Earner Per Department (Window
  RANK with Ties)` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PostgreSQL cluster with psql, pg_hba.conf, roles,
  and WAL. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An HR report should return the top-paid employee(s) per department including
  all ties, but it uses ROW_NUMBER() which assigns 1 to only one of several tied rows. Switch to a ranking
  function whose ties share the same rank. An HR report should return the highest-paid employee in each
  department, and when several employees tie for top pay it must return ALL of them. The query uses `ROW_NUMBER()
  OVER (PARTITION BY dept ORDER BY salary DESC)` and keeps row number 1 — but ROW_NUMBER arbitrarily breaks
  ties, so only one of several equally-paid top earners survives. Switch to a ranking function whose ties
  share rank 1.


  OBJECTIVE: Partition a window by department to rank within each group; See why ROW_NUMBER drops tied
  top earners; Use RANK so all rows tied for the maximum share rank 1. Success means all hidden tests
  pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Partition a window by department to rank within each group
- See why ROW_NUMBER drops tied top earners
- Use RANK so all rows tied for the maximum share rank 1
initial_state: An HR report should return the top-paid employee(s) per department including all ties,
  but it uses ROW_NUMBER() which assigns 1 to only one of several tied rows. Switch to a ranking function
  whose ties share the same rank.
solution_explanation: 'ROW_NUMBER() assigns a strictly distinct number to every row in a partition, so
  among employees tied for

  the highest salary exactly one gets number 1 and the rest are silently demoted. RANK() instead gives

  every row tied at the top the same value (1), then skips ahead — which is exactly the "include all ties"

  semantics the report wants. Partitioning by dept evaluates the window independently per department,
  so a

  low-paying department still surfaces its own top earner.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Fix solution(conn). It must return (dept, name, salary) for the highest-paid employee
    in each

    department; if several employees tie for the top salary in a department, return ALL of them. Order

    the result by dept ASC, then name ASC.

    The conn argument is a fresh sqlite3 connection with an `employees(id, dept, name, salary)` table.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "import sqlite3\n\ndef solution(conn):\n    # BUG: ROW_NUMBER() gives a unique number per\
      \ row, so when several\n    # employees tie for the top salary only ONE of them gets number 1 and\n\
      \    # the other tied top earners are dropped. RANK() lets ties share 1.\n    return conn.execute(\n\
      \        \"\"\"\n        WITH ranked AS (\n            SELECT dept, name, salary,\n            \
      \       ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk\n            FROM employees\n\
      \        )\n        SELECT dept, name, salary\n        FROM ranked\n        WHERE rnk = 1\n    \
      \    ORDER BY dept ASC, name ASC\n        \"\"\"\n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: tied top earners both returned
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ employees (id INTEGER PRIMARY KEY, dept TEXT, name TEXT, salary INTEGER);\"\n    \"INSERT INTO\
      \ employees (dept, name, salary) VALUES \"\n    \"('eng','Ada',120),('eng','Linus',150),('eng','Grace',150),\"\
      \n    \"('sales','Tom',90),('sales','Sue',70),('ops','Mia',60);\"\n)\nassert solution(conn) == [\n\
      \    ('eng', 'Grace', 150), ('eng', 'Linus', 150),\n    ('ops', 'Mia', 60),\n    ('sales', 'Tom',\
      \ 90),\n], solution(conn)\n"
  - name: single top earner per non-tied dept
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ employees (id INTEGER PRIMARY KEY, dept TEXT, name TEXT, salary INTEGER);\"\n    \"INSERT INTO\
      \ employees (dept, name, salary) VALUES \"\n    \"('eng','Ada',120),('eng','Linus',150),('eng','Grace',150),\"\
      \n    \"('sales','Tom',90),('sales','Sue',70),('ops','Mia',60);\"\n)\nassert [r for r in solution(conn)\
      \ if r[0] == 'sales'] == [('sales', 'Tom', 90)], solution(conn)\n"
  hidden_tests:
  - name: no ties, single dept
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ employees (id INTEGER PRIMARY KEY, dept TEXT, name TEXT, salary INTEGER);\"\n    \"INSERT INTO\
      \ employees (dept,name,salary) VALUES ('a','x',10),('a','y',20),('a','z',15);\"\n)\nassert solution(conn)\
      \ == [('a', 'y', 20)], solution(conn)\n"
  - name: entire department tied returns everyone
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ employees (id INTEGER PRIMARY KEY, dept TEXT, name TEXT, salary INTEGER);\"\n    \"INSERT INTO\
      \ employees (dept,name,salary) VALUES ('a','x',50),('a','y',50),('a','z',50);\"\n)\nassert solution(conn)\
      \ == [('a','x',50),('a','y',50),('a','z',50)], solution(conn)\n"
  - name: ranked per dept, not globally
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ employees (id INTEGER PRIMARY KEY, dept TEXT, name TEXT, salary INTEGER);\"\n    \"INSERT INTO\
      \ employees (dept,name,salary) VALUES ('big','rich',1000),('small','poor',1);\"\n)\nassert solution(conn)\
      \ == [('big','rich',1000),('small','poor',1)], solution(conn)\n"
  - name: empty table
    code: 'import sqlite3

      conn = sqlite3.connect('':memory:'')

      conn.executescript("CREATE TABLE employees (id INTEGER PRIMARY KEY, dept TEXT, name TEXT, salary
      INTEGER);")

      assert solution(conn) == [], solution(conn)

      '
  timeout: 8
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `systemctl status postgresql` and `pg_isready` for connection state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Check service status and `/var/log/postgresql/` logs.

    2. Verify `pg_hba.conf` and `postgresql.conf` for listen addresses.

    3. Test with `psql -U postgres -c ''SELECT 1''`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix auth rules, data directory permissions, or port conflict.

    2. `systemctl restart postgresql`.

    3. Confirm `pg_isready` reports accepting connections.


    WHY: the database must accept connections, not just start.'
