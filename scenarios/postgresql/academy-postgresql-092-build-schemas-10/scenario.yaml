title: 'PostgreSQL: Schemas — Build From Scratch'
slug: academy-postgresql-092-build-schemas-10
technology: PostgreSQL
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Build schemas from scratch in this PostgreSQL lab. You start from a minimal
  environment and must produce a working configuration that demonstrates search_path,
  ownership, and isolation. Plan, implement, then prove it works.
objectives:
- A working schemas setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The PostgreSQL cluster is ready but schemas is not configured yet.
  Required tools may already be installed; your job is to create the configuration
  and bring the capability online.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — schema list and search_path.

    2. Write down what looks normal versus wrong or missing for schemas.

    3. Recall the core idea: search_path, ownership, and isolation. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for schemas.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — schema list and search_path.

    2. Create the smallest working slice of schemas first, validate it, then add the
    remaining pieces one at a time.

    3. Verify the result — objects live in and resolve from the right schema.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-postgresql-092-build-schemas-10.conf`,
    then click Check Solution.'
