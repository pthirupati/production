scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: High
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Recognize a JOIN fan-out: a 1-to-many join multiplies the parent rows
- See how SUM over fanned-out rows inflates the total
- Count each order amount once while still requiring at least one line item
initial_state: A per-customer revenue report joins orders to order_items and does SUM(orders.amount),
  but the one-to-many join fans each order out once per item, multiplying its amount. Restructure so each
  order is counted once while still excluding orders with no items.
solution_explanation: 'Joining a parent table to a one-to-many child duplicates each parent row once per
  matching child. When

  you then SUM a parent column, every duplicate is added again — an order with 3 items contributes its

  amount 3 times. The clean fix decouples the two concerns: SUM the order amounts directly from `orders`

  (one row per order), and express "has at least one line item" as an EXISTS subquery (a semi-join) rather

  than a real JOIN, so the membership test never multiplies rows.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Fix solution(conn). It must return (customer_id, total_revenue) for each customer, where
    total_revenue

    is the SUM of that customer''s order amounts, counting each order exactly once. Only include orders
    that

    have at least one row in order_items (orders with no line items are excluded). Order by customer_id.

    The conn argument is a fresh sqlite3 connection with `orders(id, customer_id, amount)` and

    `order_items(id, order_id, sku)`.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "import sqlite3\n\ndef solution(conn):\n    # BUG: joining orders to its one-to-many order_items\
      \ fans each order\n    # out once per item, so SUM(o.amount) counts an order's amount once\n   \
      \ # per line item instead of once per order.\n    return conn.execute(\n        \"\"\"\n       \
      \ SELECT o.customer_id, SUM(o.amount) AS total_revenue\n        FROM orders o\n        JOIN order_items\
      \ i ON i.order_id = o.id\n        GROUP BY o.customer_id\n        ORDER BY o.customer_id\n     \
      \   \"\"\"\n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: amount counted once despite many items
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount INTEGER);\"\n    \"CREATE TABLE order_items\
      \ (id INTEGER PRIMARY KEY, order_id INTEGER, sku TEXT);\"\n    \"INSERT INTO orders VALUES (1,100,50),(2,100,30),(3,200,80);\"\
      \n    \"INSERT INTO order_items VALUES (1,1,'a'),(2,1,'b'),(3,1,'c'),(4,2,'d'),(5,3,'e'),(6,3,'f');\"\
      \n)\nassert solution(conn) == [(100, 80), (200, 80)], solution(conn)\n"
  - name: customer total not inflated
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount INTEGER);\"\n    \"CREATE TABLE order_items\
      \ (id INTEGER PRIMARY KEY, order_id INTEGER, sku TEXT);\"\n    \"INSERT INTO orders VALUES (1,100,50),(2,100,30),(3,200,80);\"\
      \n    \"INSERT INTO order_items VALUES (1,1,'a'),(2,1,'b'),(3,1,'c'),(4,2,'d'),(5,3,'e'),(6,3,'f');\"\
      \n)\nassert dict(solution(conn))[100] == 80, solution(conn)\n"
  hidden_tests:
  - name: order with no items is excluded
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount INTEGER);\"\n    \"CREATE TABLE order_items\
      \ (id INTEGER PRIMARY KEY, order_id INTEGER, sku TEXT);\"\n    \"INSERT INTO orders VALUES (1,5,40),(2,5,10);\"\
      \n    \"INSERT INTO order_items VALUES (1,1,'x'),(2,1,'y');\"\n)\nassert solution(conn) == [(5,\
      \ 40)], solution(conn)\n"
  - name: heavy fan-out still counts once
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount INTEGER);\"\n    \"CREATE TABLE order_items\
      \ (id INTEGER PRIMARY KEY, order_id INTEGER, sku TEXT);\"\n    \"INSERT INTO orders VALUES (1,7,100);\"\
      \n    \"INSERT INTO order_items VALUES (1,1,'a'),(2,1,'b'),(3,1,'c'),(4,1,'d'),(5,1,'e');\"\n)\n\
      assert solution(conn) == [(7, 100)], solution(conn)\n"
  - name: multiple customers and orders
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount INTEGER);\"\n    \"CREATE TABLE order_items\
      \ (id INTEGER PRIMARY KEY, order_id INTEGER, sku TEXT);\"\n    \"INSERT INTO orders VALUES (1,1,10),(2,1,20),(3,2,5);\"\
      \n    \"INSERT INTO order_items VALUES (1,1,'a'),(2,1,'b'),(3,2,'c'),(4,3,'d'),(5,3,'e');\"\n)\n\
      assert solution(conn) == [(1, 30), (2, 5)], solution(conn)\n"
  timeout: 8
