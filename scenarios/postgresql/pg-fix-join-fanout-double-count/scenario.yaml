title: Fix the Revenue That Double-Counts on a JOIN
slug: pg-fix-join-fanout-double-count
technology: postgresql
category: PostgreSQL Development
description: A per-customer revenue report joins `orders` to `order_items` so it can ignore orders with no
  line items, then does `SUM(orders.amount)`. But joining to a one-to-many child fans each order row out
  once per item, so an order with 3 items has its amount summed 3 times. The totals are inflated. Restructure
  the query so each order's amount is counted exactly once while still excluding item-less orders.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: High
time_limit: 1200
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Recognize a JOIN fan-out: a 1-to-many join multiplies the parent rows
- See how SUM over fanned-out rows inflates the total
- Count each order amount once while still requiring at least one line item
initial_state: A per-customer revenue report joins orders to order_items and does SUM(orders.amount), but
  the one-to-many join fans each order out once per item, multiplying its amount. Restructure so each order
  is counted once while still excluding orders with no items.
solution_explanation: |
  Joining a parent table to a one-to-many child duplicates each parent row once per matching child. When
  you then SUM a parent column, every duplicate is added again — an order with 3 items contributes its
  amount 3 times. The clean fix decouples the two concerns: SUM the order amounts directly from `orders`
  (one row per order), and express "has at least one line item" as an EXISTS subquery (a semi-join) rather
  than a real JOIN, so the membership test never multiplies rows.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix solution(conn). It must return (customer_id, total_revenue) for each customer, where total_revenue
    is the SUM of that customer's order amounts, counting each order exactly once. Only include orders that
    have at least one row in order_items (orders with no line items are excluded). Order by customer_id.
    The conn argument is a fresh sqlite3 connection with `orders(id, customer_id, amount)` and
    `order_items(id, order_id, sku)`.
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      import sqlite3

      def solution(conn):
          # BUG: joining orders to its one-to-many order_items fans each order
          # out once per item, so SUM(o.amount) counts an order's amount once
          # per line item instead of once per order.
          return conn.execute(
              """
              SELECT o.customer_id, SUM(o.amount) AS total_revenue
              FROM orders o
              JOIN order_items i ON i.order_id = o.id
              GROUP BY o.customer_id
              ORDER BY o.customer_id
              """
          ).fetchall()
    readonly: false
  visible_tests:
  - name: amount counted once despite many items
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount INTEGER);"
          "CREATE TABLE order_items (id INTEGER PRIMARY KEY, order_id INTEGER, sku TEXT);"
          "INSERT INTO orders VALUES (1,100,50),(2,100,30),(3,200,80);"
          "INSERT INTO order_items VALUES (1,1,'a'),(2,1,'b'),(3,1,'c'),(4,2,'d'),(5,3,'e'),(6,3,'f');"
      )
      assert solution(conn) == [(100, 80), (200, 80)], solution(conn)
  - name: customer total not inflated
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount INTEGER);"
          "CREATE TABLE order_items (id INTEGER PRIMARY KEY, order_id INTEGER, sku TEXT);"
          "INSERT INTO orders VALUES (1,100,50),(2,100,30),(3,200,80);"
          "INSERT INTO order_items VALUES (1,1,'a'),(2,1,'b'),(3,1,'c'),(4,2,'d'),(5,3,'e'),(6,3,'f');"
      )
      assert dict(solution(conn))[100] == 80, solution(conn)
  hidden_tests:
  - name: order with no items is excluded
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount INTEGER);"
          "CREATE TABLE order_items (id INTEGER PRIMARY KEY, order_id INTEGER, sku TEXT);"
          "INSERT INTO orders VALUES (1,5,40),(2,5,10);"
          "INSERT INTO order_items VALUES (1,1,'x'),(2,1,'y');"
      )
      assert solution(conn) == [(5, 40)], solution(conn)
  - name: heavy fan-out still counts once
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount INTEGER);"
          "CREATE TABLE order_items (id INTEGER PRIMARY KEY, order_id INTEGER, sku TEXT);"
          "INSERT INTO orders VALUES (1,7,100);"
          "INSERT INTO order_items VALUES (1,1,'a'),(2,1,'b'),(3,1,'c'),(4,1,'d'),(5,1,'e');"
      )
      assert solution(conn) == [(7, 100)], solution(conn)
  - name: multiple customers and orders
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount INTEGER);"
          "CREATE TABLE order_items (id INTEGER PRIMARY KEY, order_id INTEGER, sku TEXT);"
          "INSERT INTO orders VALUES (1,1,10),(2,1,20),(3,2,5);"
          "INSERT INTO order_items VALUES (1,1,'a'),(2,1,'b'),(3,2,'c'),(4,3,'d'),(5,3,'e');"
      )
      assert solution(conn) == [(1, 30), (2, 5)], solution(conn)
  timeout: 8
hints:
- order: 1
  cost: 10
  content: Run the buggy query on an order with several items — its amount appears in the total once per
    item. The JOIN is duplicating the order row.
- order: 2
  cost: 20
  content: You need the order rows themselves (one per order), not the fanned-out join. Aggregate straight
    from `orders`, and test "has items" without multiplying rows.
- order: 3
  cost: 30
  content: 'SUM amounts from orders alone, and replace the JOIN with `WHERE EXISTS (SELECT 1 FROM
    order_items i WHERE i.order_id = o.id)`.'
