title: Fix the Revenue That Double-Counts on a JOIN
slug: pg-fix-join-fanout-double-count
technology: postgresql
category: Build
description: 'CONTEXT: A team operating PostgreSQL has raised a ticket for `Fix the Revenue That Double-Counts
  on a JOIN`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline PostgreSQL cluster. The architecture is a single
  lab-primary node exposing psql, pg_hba.conf, roles, and WAL; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: A per-customer revenue report joins orders to order_items and does SUM(orders.amount),
  but the one-to-many join fans each order out once per item, multiplying its amount. Restructure so each
  order is counted once while still excluding orders with no items.

  OBJECTIVE: {''Recognize a JOIN fan-out'': ''a 1-to-many join multiplies the parent rows''}; See how
  SUM over fanned-out rows inflates the total; Count each order amount once while still requiring at least
  one line item. Acceptance criteria: the change is minimal and reversible, and success means all hidden
  tests pass.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant psql, pg_hba.conf, roles, and WAL), changing one thing at a time. Check your work
  continuously against the objective — success means all hidden tests pass.

  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
