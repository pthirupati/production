description: 'CONTEXT: A team operating PostgreSQL needs you to resolve `postgresql: Pg_Hba Authentication
  — Automation Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PostgreSQL cluster with psql, pg_hba.conf, roles,
  and WAL. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for pg_hba authentication. Automate the
  boring parts without hiding important safety checks. Automation lab: remove toil around pg_hba authentication.
  Codify repeatable steps for host-based auth rules and methods and prove the automation is idempotent.


  OBJECTIVE: Day-2 pg_hba authentication work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  postgresql` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 pg_hba authentication work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for pg_hba authentication. Automate the boring parts
  without hiding important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with `systemctl status postgresql` and `journalctl -u postgresql -n 50
    --no-pager` before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status postgresql` — note Active/Failed and the last log lines.

    2. Read `journalctl -u postgresql -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart postgresql` and confirm `systemctl is-active postgresql` succeeds.


    WHY: the grader checks real service state, not marker files.'
