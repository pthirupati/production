title: Fix the Aggregate Filter (WHERE vs HAVING)
slug: pg-fix-having-aggregate-filter
technology: postgresql
category: Fix
description: 'CONTEXT: A team operating PostgreSQL has raised a ticket for `Fix the Aggregate Filter (WHERE
  vs HAVING)`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and
  resolve it. Business impact: reduced service reliability and blocked users until the underlying state
  is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline PostgreSQL cluster. The architecture is a single
  lab-primary node exposing psql, pg_hba.conf, roles, and WAL; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: A sales report should list only categories whose TOTAL quantity sold is at
  least 10, but the query filters with `WHERE SUM(quantity) >= 10`. Aggregates cannot be used in WHERE,
  so the query is wrong. Move the aggregate condition into HAVING.

  OBJECTIVE: See why an aggregate cannot live in a WHERE clause; Move the SUM() condition into HAVING
  so it runs after grouping; Return categories meeting the per-group threshold, correctly ordered. Acceptance
  criteria: the change is minimal and reversible, and success means all hidden tests pass.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant psql, pg_hba.conf, roles, and WAL), changing one thing at a time. Check your work
  continuously against the objective — success means all hidden tests pass.

  VERIFY: Re-run the same check the grader uses and confirm all hidden tests pass. Capture the before/after
  output as evidence. Success criteria: the objective''s healthy state holds on a repeat check, not just
  once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
