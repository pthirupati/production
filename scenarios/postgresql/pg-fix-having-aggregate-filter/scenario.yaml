initial_state: A sales report should list only categories whose TOTAL quantity sold is at least 10, but
  the query filters with `WHERE SUM(quantity) >= 10`. Aggregates cannot be used in WHERE, so the query
  is wrong. Move the aggregate condition into HAVING.
solution_explanation: 'WHERE filters individual rows before they are grouped, so it has no access to a
  per-group SUM().

  HAVING is the row-group filter: it runs after GROUP BY collapses rows into groups, so SUM(quantity)

  is defined there. Replacing `WHERE SUM(quantity) >= 10` with `HAVING SUM(quantity) >= 10` keeps only

  the groups whose total clears the threshold.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Fix solution(conn). It must return one row per category whose TOTAL quantity sold (SUM
    of quantity)

    is at least 10, as tuples (category, total_qty), ordered by total_qty DESC then category ASC.

    The current query tries to filter the SUM in a WHERE clause, which is illegal for aggregates.

    The conn argument is a fresh sqlite3 connection with a `sales(id, category, quantity)` table.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "import sqlite3\n\ndef solution(conn):\n    # BUG: SUM(quantity) is an aggregate and cannot\
      \ be used in WHERE,\n    # which is evaluated per-row before grouping happens.\n    return conn.execute(\n\
      \        \"\"\"\n        SELECT category, SUM(quantity) AS total_qty\n        FROM sales\n     \
      \   WHERE SUM(quantity) >= 10\n        GROUP BY category\n        ORDER BY total_qty DESC, category\
      \ ASC\n        \"\"\"\n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: rolls up and filters by total
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ sales (id INTEGER PRIMARY KEY, category TEXT, quantity INTEGER);\"\n    \"INSERT INTO sales (category,\
      \ quantity) VALUES \"\n    \"('books',4),('books',7),('toys',3),('toys',2),\"\n    \"('games',12),('food',5),('food',5),('food',1);\"\
      \n)\nassert solution(conn) == [('games', 12), ('books', 11), ('food', 11)], solution(conn)\n"
  - name: below-threshold group excluded
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ sales (id INTEGER PRIMARY KEY, category TEXT, quantity INTEGER);\"\n    \"INSERT INTO sales (category,\
      \ quantity) VALUES \"\n    \"('books',4),('books',7),('toys',3),('toys',2),\"\n    \"('games',12),('food',5),('food',5),('food',1);\"\
      \n)\nassert ('toys', 5) not in solution(conn), solution(conn)\n"
  hidden_tests:
  - name: empty table returns nothing
    code: 'import sqlite3

      conn = sqlite3.connect('':memory:'')

      conn.executescript("CREATE TABLE sales (id INTEGER PRIMARY KEY, category TEXT, quantity INTEGER);")

      assert solution(conn) == [], solution(conn)

      '
  - name: boundary value (exactly 10) is kept
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ sales (id INTEGER PRIMARY KEY, category TEXT, quantity INTEGER);\"\n    \"INSERT INTO sales (category,\
      \ quantity) VALUES ('a',6),('a',4),('b',9);\"\n)\nassert solution(conn) == [('a', 10)], solution(conn)\n"
  - name: tie broken by category ascending
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ sales (id INTEGER PRIMARY KEY, category TEXT, quantity INTEGER);\"\n    \"INSERT INTO sales (category,\
      \ quantity) VALUES ('zeta',10),('alpha',10);\"\n)\nassert solution(conn) == [('alpha', 10), ('zeta',\
      \ 10)], solution(conn)\n"
  timeout: 8
