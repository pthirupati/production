title: Fix the Aggregate Filter (WHERE vs HAVING)
slug: pg-fix-having-aggregate-filter
technology: postgresql
category: Fix
description: 'CONTEXT: A team operating PostgreSQL needs you to resolve `Fix the Aggregate Filter (WHERE
  vs HAVING)` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PostgreSQL cluster with psql, pg_hba.conf, roles,
  and WAL. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A sales report should list only categories whose TOTAL quantity sold is at
  least 10, but the query filters with `WHERE SUM(quantity) >= 10`. Aggregates cannot be used in WHERE,
  so the query is wrong. Move the aggregate condition into HAVING. A sales report should list only categories
  whose TOTAL quantity sold is at least 10, but the query filters with `WHERE SUM(quantity) >= 10`. Aggregates
  cannot be used in WHERE — it is evaluated per row, before grouping — so the query errors or filters
  the wrong thing. Move the aggregate condition into a HAVING clause that runs after GROUP BY.


  OBJECTIVE: See why an aggregate cannot live in a WHERE clause; Move the SUM() condition into HAVING
  so it runs after grouping; Return categories meeting the per-group threshold, correctly ordered. Success
  means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: easy
scenario_type: fix
