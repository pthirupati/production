title: 'PostgreSQL: Postgresql Vacuum — Troubleshooting Drill'
slug: academy-postgresql-054-troubleshoot-vacuum-6
technology: PostgreSQL
category: Troubleshooting
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: transactions fail near xmin horizon or bloat grows.
  You are on call for PostgreSQL and must troubleshoot PostgreSQL VACUUM methodically
  — triage symptoms, find root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: transactions fail near xmin horizon or bloat grows'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The PostgreSQL cluster is degraded. Transactions fail near xmin horizon
  or bloat grows. Recent changes may exist around PostgreSQL VACUUM, but do not restart
  blindly — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Triage: `pg_stat_user_tables`, `pgstattuple`, and logs. Capture timestamps,
    error messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: vacuum keeps tables healthy with acceptable bloat. Document
    the fix, add `# FIXED-OK` to `/opt/fixitlab/academy/academy-postgresql-054-troubleshoot-vacuum-6.conf`,
    and rerun Check Solution.'
