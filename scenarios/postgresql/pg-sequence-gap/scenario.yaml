    WHY: coding labs grade against hidden test cases, not marker files.'
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'Inserts fail because the `orders_id_seq` row in `seq` has fallen behind the table: it
    still hands out an id that already exists in `orders`. Fix solution(conn) so it repairs the sequence
    and returns the next id that is safe to insert (one more than the largest existing id, or 1 when the
    table is empty). It must also persist that value into seq.next_val for name=''orders_id_seq''. conn
    is a fresh sqlite3 connection with orders(id, name) and seq(name, next_val).

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn):\n    # BUG: reads the stored counter without checking it against the\
      \ real\n    # table, so an exhausted/behind sequence keeps returning a taken id.\n    return conn.execute(\n\
      \        \"SELECT next_val FROM seq WHERE name='orders_id_seq'\"\n    ).fetchone()[0]\n"
    readonly: false
  visible_tests:
  - name: next id clears the existing rows
    code: "import sqlite3\ndef _seed(rows, seq_val):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE orders (id INTEGER PRIMARY KEY, name TEXT);\"\n        \"CREATE TABLE seq\
      \ (name TEXT PRIMARY KEY, next_val INTEGER);\"\n    )\n    conn.executemany(\"INSERT INTO orders\
      \ (id, name) VALUES (?,?)\", rows)\n    conn.execute(\"INSERT INTO seq VALUES ('orders_id_seq',\
      \ ?)\", (seq_val,))\n    return conn\nconn = _seed([(1,'a'),(2,'b'),(7,'c')], 3)\nassert solution(conn)\
      \ == 8, solution(conn)\n"
  - name: repair is persisted to the seq table
    code: "import sqlite3\ndef _seed(rows, seq_val):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE orders (id INTEGER PRIMARY KEY, name TEXT);\"\n        \"CREATE TABLE seq\
      \ (name TEXT PRIMARY KEY, next_val INTEGER);\"\n    )\n    conn.executemany(\"INSERT INTO orders\
      \ (id, name) VALUES (?,?)\", rows)\n    conn.execute(\"INSERT INTO seq VALUES ('orders_id_seq',\
      \ ?)\", (seq_val,))\n    return conn\nconn = _seed([(1,'a'),(2,'b'),(7,'c')], 3)\nsolution(conn)\n\
      stored = conn.execute(\"SELECT next_val FROM seq WHERE name='orders_id_seq'\").fetchone()[0]\nassert\
      \ stored == 8, stored\n"
  hidden_tests:
  - name: empty table restarts at 1
    code: "import sqlite3\ndef _seed(rows, seq_val):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE orders (id INTEGER PRIMARY KEY, name TEXT);\"\n        \"CREATE TABLE seq\
      \ (name TEXT PRIMARY KEY, next_val INTEGER);\"\n    )\n    conn.executemany(\"INSERT INTO orders\
      \ (id, name) VALUES (?,?)\", rows)\n    conn.execute(\"INSERT INTO seq VALUES ('orders_id_seq',\
      \ ?)\", (seq_val,))\n    return conn\nconn = _seed([], 99)\nassert solution(conn) == 1, solution(conn)\n"
  - name: already-healthy sequence is left correct
    code: "import sqlite3\ndef _seed(rows, seq_val):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE orders (id INTEGER PRIMARY KEY, name TEXT);\"\n        \"CREATE TABLE seq\
      \ (name TEXT PRIMARY KEY, next_val INTEGER);\"\n    )\n    conn.executemany(\"INSERT INTO orders\
      \ (id, name) VALUES (?,?)\", rows)\n    conn.execute(\"INSERT INTO seq VALUES ('orders_id_seq',\
      \ ?)\", (seq_val,))\n    return conn\nconn = _seed([(1,'a'),(2,'b')], 3)\nassert solution(conn)\
      \ == 3, solution(conn)\n"
  - name: a single high id is respected
    code: "import sqlite3\ndef _seed(rows, seq_val):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE orders (id INTEGER PRIMARY KEY, name TEXT);\"\n        \"CREATE TABLE seq\
      \ (name TEXT PRIMARY KEY, next_val INTEGER);\"\n    )\n    conn.executemany(\"INSERT INTO orders\
      \ (id, name) VALUES (?,?)\", rows)\n    conn.execute(\"INSERT INTO seq VALUES ('orders_id_seq',\
      \ ?)\", (seq_val,))\n    return conn\nconn = _seed([(500,'x')], 2)\nassert solution(conn) == 501,\
      \ solution(conn)\n"
  - name: does not simply echo the stored counter
    code: "import sqlite3\ndef _seed(rows, seq_val):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\n\
      \        \"CREATE TABLE orders (id INTEGER PRIMARY KEY, name TEXT);\"\n        \"CREATE TABLE seq\
      \ (name TEXT PRIMARY KEY, next_val INTEGER);\"\n    )\n    conn.executemany(\"INSERT INTO orders\
      \ (id, name) VALUES (?,?)\", rows)\n    conn.execute(\"INSERT INTO seq VALUES ('orders_id_seq',\
      \ ?)\", (seq_val,))\n    return conn\nconn = _seed([(10,'a')], 4)\nassert solution(conn) == 11,\
      \ solution(conn)\n"
  timeout: 8
