title: 'PostgreSQL: Extensions — Observability Practice'
slug: academy-postgresql-098-observability-extensions-10
technology: PostgreSQL
category: Observability
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: database
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Observability task: make extensions visible in logs, metrics, or traces.
  On-call should answer ''what is broken?'' quickly using signals from installing
  and using PostgreSQL extensions.'
objectives:
- Day-2 extensions work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but extensions lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `\dx` and extension objects.

    2. Write down what looks normal versus wrong or missing for extensions.

    3. Recall the core idea: installing and using PostgreSQL extensions. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for extensions.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `\dx` and extension objects.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a
    sensible threshold.

    3. Verify the result — the extension is installed and usable.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-postgresql-098-observability-extensions-10.conf`,
    then click Check Solution.'
