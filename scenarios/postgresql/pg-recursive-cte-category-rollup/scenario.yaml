title: Merge Counts and Roll Them Up a Category Tree
slug: pg-recursive-cte-category-rollup
technology: postgresql
category: Fix
description: 'CONTEXT: A team operating PostgreSQL needs you to resolve `Merge Counts and Roll Them Up
  a Category Tree` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PostgreSQL cluster with psql, pg_hba.conf, roles,
  and WAL. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A category tree must merge fresh counts from an `incoming` table then report,
  per category, its own count plus all descendants''. The starter uses a plain INSERT that collides on
  existing ids and a flat sum that ignores descendants. Fix the UPSERT and add a recursive subtree rollup.
  A catalog stores categories in a self-referencing tree (each row points at its parent_id) and a nightly
  `incoming` table carries fresh direct product counts per category. Two things are broken. First, the
  merge uses a plain INSERT that collides on the primary key for categories that already exist, so it
  errors instead of updating them. Second, the rollup only reports each category''s own direct_count instead
  of its own count plus every descendant''s. Fix the merge to be a proper UPSERT and compute a true recursive
  subtree rollup.


  OBJECTIVE: Express an idempotent UPSERT (INSERT ... ON CONFLICT DO UPDATE) for existing rows; Insert
  genuinely new categories without clobbering existing parent links; Walk a self-referencing tree with
  a recursive CTE. Success means all hidden tests pass.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
