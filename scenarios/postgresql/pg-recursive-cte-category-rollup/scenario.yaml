title: Merge Counts and Roll Them Up a Category Tree
slug: pg-recursive-cte-category-rollup
technology: postgresql
category: PostgreSQL Development
description: A catalog stores categories in a self-referencing tree (each row points at its parent_id) and
  a nightly `incoming` table carries fresh direct product counts per category. Two things are broken. First,
  the merge uses a plain INSERT that collides on the primary key for categories that already exist, so it
  errors instead of updating them. Second, the rollup only reports each category's own direct_count instead
  of its own count plus every descendant's. Fix the merge to be a proper UPSERT and compute a true recursive
  subtree rollup.
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: python
coding_mode: true
jira_priority: High
time_limit: 1800
max_score: 100
is_free: true
dual_terminal: false
objectives:
- Express an idempotent UPSERT (INSERT ... ON CONFLICT DO UPDATE) for existing rows
- Insert genuinely new categories without clobbering existing parent links
- Walk a self-referencing tree with a recursive CTE
- Roll each category's count up to include all of its descendants
initial_state: A category tree must merge fresh counts from an `incoming` table then report, per category,
  its own count plus all descendants'. The starter uses a plain INSERT that collides on existing ids and a
  flat sum that ignores descendants. Fix the UPSERT and add a recursive subtree rollup.
solution_explanation: |
  Two independent fixes. (1) Merge: a plain INSERT violates the primary key for categories that already
  exist. INSERT ... ON CONFLICT(id) DO UPDATE SET direct_count = excluded.direct_count makes the write
  idempotent — existing rows are updated in place (keeping their parent_id), and only truly new ids are
  inserted. Splitting the statement into "ids that already exist" (upsert, preserving parent_id) and "ids
  that do not" (insert as a new root) avoids ever overwriting a known parent link with NULL.
  (2) Rollup: a flat SUM(direct_count) GROUP BY id only sees one row. To total a whole subtree you need a
  recursive CTE that, starting from each category as its own root, repeatedly joins children via
  parent_id = node_id, then SUMs direct_count over every node reached from each root.
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: |
    Fix solution(conn). It must do two steps against the given connection:
      1. Merge the `incoming(id, direct_count)` rows into `categories(id, parent_id, direct_count)`.
         For an id that already exists, UPDATE its direct_count (keep its parent_id). For a new id,
         INSERT it as a root (parent_id NULL). Do not create duplicate rows and do not error on conflict.
      2. Return (id, total_count) for EVERY category, where total_count is that category's own
         direct_count PLUS the direct_count of all its descendants (children, grandchildren, ...).
         Order by id ascending.
    The conn argument is a fresh sqlite3 connection. `categories` has a PRIMARY KEY on id.
    Calling solution twice on the same connection must give the same answer (it is idempotent).
    Click Run to try it, then Check Solution to grade against all tests.
  files:
  - path: solution.py
    content: |
      import sqlite3

      def solution(conn):
          # BUG 1: a plain INSERT collides on the primary key for categories that
          # already exist, raising IntegrityError instead of updating them.
          conn.execute(
              """
              INSERT INTO categories (id, parent_id, direct_count)
              SELECT i.id, NULL, i.direct_count
              FROM incoming i
              """
          )

          # BUG 2: this sums only each category's OWN direct_count; it never walks
          # the tree, so parents do not include their descendants' counts.
          return conn.execute(
              """
              SELECT id, SUM(direct_count) AS total_count
              FROM categories
              GROUP BY id
              ORDER BY id
              """
          ).fetchall()
    readonly: false
  visible_tests:
  - name: counts roll up the tree
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);"
          "CREATE TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);"
          "INSERT INTO categories (id, parent_id, direct_count) VALUES (1,NULL,0),(2,1,0),(3,1,0),(4,2,0);"
          "INSERT INTO incoming (id, direct_count) VALUES (1,5),(2,3),(3,7),(4,2);"
      )
      assert solution(conn) == [(1, 17), (2, 5), (3, 7), (4, 2)], solution(conn)
  - name: upsert updates in place without duplicating
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);"
          "CREATE TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);"
          "INSERT INTO categories (id, parent_id, direct_count) VALUES (1,NULL,0),(2,1,0),(3,1,0),(4,2,0);"
          "INSERT INTO incoming (id, direct_count) VALUES (2,3);"
      )
      solution(conn)
      assert conn.execute("SELECT COUNT(*) FROM categories WHERE id=2").fetchone()[0] == 1
      assert conn.execute("SELECT parent_id FROM categories WHERE id=2").fetchone()[0] == 1
  hidden_tests:
  - name: deeper subtree with a new leaf
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);"
          "CREATE TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);"
          "INSERT INTO categories (id, parent_id, direct_count) VALUES (1,NULL,0),(2,1,0),(3,1,0),(4,2,0),(5,4,0);"
          "INSERT INTO incoming (id, direct_count) VALUES (1,1),(2,1),(3,1),(4,1),(5,9);"
      )
      assert solution(conn) == [(1, 13), (2, 11), (3, 1), (4, 10), (5, 9)], solution(conn)
  - name: categories absent from incoming keep their count
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);"
          "CREATE TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);"
          "INSERT INTO categories VALUES (1,NULL,4),(2,1,6);"
          "INSERT INTO incoming VALUES (2,10);"
      )
      assert solution(conn) == [(1, 14), (2, 10)], solution(conn)
  - name: brand-new root category from incoming
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);"
          "CREATE TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);"
          "INSERT INTO categories VALUES (1,NULL,2);"
          "INSERT INTO incoming VALUES (1,2),(99,8);"
      )
      assert solution(conn) == [(1, 2), (99, 8)], solution(conn)
  - name: single-node tree
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);"
          "CREATE TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);"
          "INSERT INTO categories VALUES (1,NULL,0);"
          "INSERT INTO incoming VALUES (1,42);"
      )
      assert solution(conn) == [(1, 42)], solution(conn)
  - name: idempotent on repeated calls
    code: |
      import sqlite3
      conn = sqlite3.connect(':memory:')
      conn.executescript(
          "CREATE TABLE categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);"
          "CREATE TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);"
          "INSERT INTO categories (id, parent_id, direct_count) VALUES (1,NULL,0),(2,1,0),(3,1,0),(4,2,0);"
          "INSERT INTO incoming (id, direct_count) VALUES (1,5),(2,3),(3,7),(4,2);"
      )
      first = solution(conn)
      second = solution(conn)
      assert first == second == [(1, 17), (2, 5), (3, 7), (4, 2)], (first, second)
  timeout: 8
hints:
- order: 1
  cost: 10
  content: The merge crashes because a plain INSERT hits the primary key of categories that already exist.
    You need an upsert — INSERT ... ON CONFLICT(id) DO UPDATE — and a separate insert for genuinely new ids.
- order: 2
  cost: 20
  content: A flat SUM over one row can never include descendants. Use a recursive CTE that starts from each
    category as its own subtree root and repeatedly joins children on parent_id = node_id.
- order: 3
  cost: 30
  content: 'Upsert existing ids with `ON CONFLICT(id) DO UPDATE SET direct_count = excluded.direct_count`
    (preserving parent_id), insert new ids as roots, then roll up with `WITH RECURSIVE subtree(root_id,
    node_id) AS (SELECT id, id FROM categories UNION ALL SELECT s.root_id, c.id FROM subtree s JOIN
    categories c ON c.parent_id = s.node_id)` and SUM direct_count grouped by root_id.'
