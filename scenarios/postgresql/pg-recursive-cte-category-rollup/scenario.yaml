objectives:
- Express an idempotent UPSERT (INSERT ... ON CONFLICT DO UPDATE) for existing rows
- Insert genuinely new categories without clobbering existing parent links
- Walk a self-referencing tree with a recursive CTE
- Roll each category's count up to include all of its descendants
initial_state: A category tree must merge fresh counts from an `incoming` table then report, per category,
  its own count plus all descendants'. The starter uses a plain INSERT that collides on existing ids and
  a flat sum that ignores descendants. Fix the UPSERT and add a recursive subtree rollup.
solution_explanation: 'Two independent fixes. (1) Merge: a plain INSERT violates the primary key for categories
  that already

  exist. INSERT ... ON CONFLICT(id) DO UPDATE SET direct_count = excluded.direct_count makes the write

  idempotent — existing rows are updated in place (keeping their parent_id), and only truly new ids are

  inserted. Splitting the statement into "ids that already exist" (upsert, preserving parent_id) and "ids

  that do not" (insert as a new root) avoids ever overwriting a known parent link with NULL.

  (2) Rollup: a flat SUM(direct_count) GROUP BY id only sees one row. To total a whole subtree you need
  a

  recursive CTE that, starting from each category as its own root, repeatedly joins children via

  parent_id = node_id, then SUMs direct_count over every node reached from each root.

  '
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: "Fix solution(conn). It must do two steps against the given connection:\n  1. Merge the\
    \ `incoming(id, direct_count)` rows into `categories(id, parent_id, direct_count)`.\n     For an id\
    \ that already exists, UPDATE its direct_count (keep its parent_id). For a new id,\n     INSERT it\
    \ as a root (parent_id NULL). Do not create duplicate rows and do not error on conflict.\n  2. Return\
    \ (id, total_count) for EVERY category, where total_count is that category's own\n     direct_count\
    \ PLUS the direct_count of all its descendants (children, grandchildren, ...).\n     Order by id ascending.\n\
    The conn argument is a fresh sqlite3 connection. `categories` has a PRIMARY KEY on id.\nCalling solution\
    \ twice on the same connection must give the same answer (it is idempotent).\nClick Run to try it,\
    \ then Check Solution to grade against all tests.\n"
  files:
  - path: solution.py
    content: "import sqlite3\n\ndef solution(conn):\n    # BUG 1: a plain INSERT collides on the primary\
      \ key for categories that\n    # already exist, raising IntegrityError instead of updating them.\n\
      \    conn.execute(\n        \"\"\"\n        INSERT INTO categories (id, parent_id, direct_count)\n\
      \        SELECT i.id, NULL, i.direct_count\n        FROM incoming i\n        \"\"\"\n    )\n\n \
      \   # BUG 2: this sums only each category's OWN direct_count; it never walks\n    # the tree, so\
      \ parents do not include their descendants' counts.\n    return conn.execute(\n        \"\"\"\n\
      \        SELECT id, SUM(direct_count) AS total_count\n        FROM categories\n        GROUP BY\
      \ id\n        ORDER BY id\n        \"\"\"\n    ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: counts roll up the tree
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);\"\n    \"CREATE\
      \ TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);\"\n    \"INSERT INTO categories\
      \ (id, parent_id, direct_count) VALUES (1,NULL,0),(2,1,0),(3,1,0),(4,2,0);\"\n    \"INSERT INTO\
      \ incoming (id, direct_count) VALUES (1,5),(2,3),(3,7),(4,2);\"\n)\nassert solution(conn) == [(1,\
      \ 17), (2, 5), (3, 7), (4, 2)], solution(conn)\n"
  - name: upsert updates in place without duplicating
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);\"\n    \"CREATE\
      \ TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);\"\n    \"INSERT INTO categories\
      \ (id, parent_id, direct_count) VALUES (1,NULL,0),(2,1,0),(3,1,0),(4,2,0);\"\n    \"INSERT INTO\
      \ incoming (id, direct_count) VALUES (2,3);\"\n)\nsolution(conn)\nassert conn.execute(\"SELECT COUNT(*)\
      \ FROM categories WHERE id=2\").fetchone()[0] == 1\nassert conn.execute(\"SELECT parent_id FROM\
      \ categories WHERE id=2\").fetchone()[0] == 1\n"
  hidden_tests:
  - name: deeper subtree with a new leaf
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);\"\n    \"CREATE\
      \ TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);\"\n    \"INSERT INTO categories\
      \ (id, parent_id, direct_count) VALUES (1,NULL,0),(2,1,0),(3,1,0),(4,2,0),(5,4,0);\"\n    \"INSERT\
      \ INTO incoming (id, direct_count) VALUES (1,1),(2,1),(3,1),(4,1),(5,9);\"\n)\nassert solution(conn)\
      \ == [(1, 13), (2, 11), (3, 1), (4, 10), (5, 9)], solution(conn)\n"
  - name: categories absent from incoming keep their count
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);\"\n    \"CREATE\
      \ TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);\"\n    \"INSERT INTO categories\
      \ VALUES (1,NULL,4),(2,1,6);\"\n    \"INSERT INTO incoming VALUES (2,10);\"\n)\nassert solution(conn)\
      \ == [(1, 14), (2, 10)], solution(conn)\n"
  - name: brand-new root category from incoming
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);\"\n    \"CREATE\
      \ TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);\"\n    \"INSERT INTO categories\
      \ VALUES (1,NULL,2);\"\n    \"INSERT INTO incoming VALUES (1,2),(99,8);\"\n)\nassert solution(conn)\
      \ == [(1, 2), (99, 8)], solution(conn)\n"
  - name: single-node tree
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);\"\n    \"CREATE\
      \ TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);\"\n    \"INSERT INTO categories\
      \ VALUES (1,NULL,0);\"\n    \"INSERT INTO incoming VALUES (1,42);\"\n)\nassert solution(conn) ==\
      \ [(1, 42)], solution(conn)\n"
  - name: idempotent on repeated calls
    code: "import sqlite3\nconn = sqlite3.connect(':memory:')\nconn.executescript(\n    \"CREATE TABLE\
      \ categories (id INTEGER PRIMARY KEY, parent_id INTEGER, direct_count INTEGER);\"\n    \"CREATE\
      \ TABLE incoming (id INTEGER PRIMARY KEY, direct_count INTEGER);\"\n    \"INSERT INTO categories\
      \ (id, parent_id, direct_count) VALUES (1,NULL,0),(2,1,0),(3,1,0),(4,2,0);\"\n    \"INSERT INTO\
      \ incoming (id, direct_count) VALUES (1,5),(2,3),(3,7),(4,2);\"\n)\nfirst = solution(conn)\nsecond\
      \ = solution(conn)\nassert first == second == [(1, 17), (2, 5), (3, 7), (4, 2)], (first, second)\n"
  timeout: 8
