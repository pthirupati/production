    WHY: coding labs grade against hidden test cases, not marker files.'
coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'A query fails because the uuid-ossp extension is not installed. Fix solution(conn) so
    it makes the feature work without assuming the extension exists: return the list of (id, external_ref)
    tuples from `records` ordered by id, generating a deterministic external_ref for any row whose external_ref
    IS NULL using the provided fallback_ref(id) helper. Rows that already have a ref keep it.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn):\n    # BUG: assumes uuid_generate_v4() (uuid-ossp) is available, so\
      \ every row\n    # with a NULL ref blows up instead of falling back.\n    return conn.execute(\n\
      \        \"SELECT id, COALESCE(external_ref, uuid_generate_v4()) FROM records ORDER BY id\"\n  \
      \  ).fetchall()\n"
    readonly: false
  visible_tests:
  - name: missing refs are backfilled
    code: "import sqlite3\ndef fallback_ref(row_id):\n    return 'rec-%08d' % row_id\ndef _seed(rows):\n\
      \    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE records (id INTEGER\
      \ PRIMARY KEY, external_ref TEXT);\")\n    conn.executemany(\"INSERT INTO records VALUES (?,?)\"\
      , rows)\n    return conn\nconn = _seed([(1,'ref-a'),(2,None)])\nassert solution(conn) == [(1,'ref-a'),(2,fallback_ref(2))],\
      \ solution(conn)\n"
  - name: existing refs are preserved
    code: "import sqlite3\ndef fallback_ref(row_id):\n    return 'rec-%08d' % row_id\ndef _seed(rows):\n\
      \    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE records (id INTEGER\
      \ PRIMARY KEY, external_ref TEXT);\")\n    conn.executemany(\"INSERT INTO records VALUES (?,?)\"\
      , rows)\n    return conn\nconn = _seed([(1,'keep-me'),(2,'also-keep')])\nassert solution(conn) ==\
      \ [(1,'keep-me'),(2,'also-keep')], solution(conn)\n"
  hidden_tests:
  - name: empty table returns nothing
    code: "import sqlite3\ndef fallback_ref(row_id):\n    return 'rec-%08d' % row_id\ndef _seed(rows):\n\
      \    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE records (id INTEGER\
      \ PRIMARY KEY, external_ref TEXT);\")\n    conn.executemany(\"INSERT INTO records VALUES (?,?)\"\
      , rows)\n    return conn\nconn = _seed([])\nassert solution(conn) == [], solution(conn)\n"
  - name: all-null table is fully backfilled
    code: "import sqlite3\ndef fallback_ref(row_id):\n    return 'rec-%08d' % row_id\ndef _seed(rows):\n\
      \    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE records (id INTEGER\
      \ PRIMARY KEY, external_ref TEXT);\")\n    conn.executemany(\"INSERT INTO records VALUES (?,?)\"\
      , rows)\n    return conn\nconn = _seed([(3,None),(1,None)])\nassert solution(conn) == [(1,fallback_ref(1)),(3,fallback_ref(3))],\
      \ solution(conn)\n"
  - name: fallback is deterministic across calls
    code: "import sqlite3\ndef fallback_ref(row_id):\n    return 'rec-%08d' % row_id\ndef _seed(rows):\n\
      \    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE records (id INTEGER\
      \ PRIMARY KEY, external_ref TEXT);\")\n    conn.executemany(\"INSERT INTO records VALUES (?,?)\"\
      , rows)\n    return conn\nconn = _seed([(5,None)])\nassert solution(conn) == solution(conn), 'refs\
      \ must be stable'\n"
  - name: results are ordered by id
    code: "import sqlite3\ndef fallback_ref(row_id):\n    return 'rec-%08d' % row_id\ndef _seed(rows):\n\
      \    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"CREATE TABLE records (id INTEGER\
      \ PRIMARY KEY, external_ref TEXT);\")\n    conn.executemany(\"INSERT INTO records VALUES (?,?)\"\
      , rows)\n    return conn\nconn = _seed([(9,'z'),(2,'b'),(4,None)])\nassert [r[0] for r in solution(conn)]\
      \ == [2,4,9], solution(conn)\n"
  timeout: 8
