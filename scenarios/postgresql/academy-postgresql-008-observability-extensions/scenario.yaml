initial_state: The system runs, but extensions lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 10
  content: 'Find existing signals: `\dx` and extension objects. Identify what is missing
    for fast triage.'
- order: 2
  cost: 15
  content: Add or fix exporters/dashboards/alerts with clear names, labels, and thresholds.
- order: 3
  cost: 20
  content: Trigger a test event and confirm it appears where on-call looks. Complete
    via `/opt/fixitlab/academy/academy-postgresql-008-observability-extensions.conf`.
