description: 'CONTEXT: A team operating PostgreSQL needs you to resolve `postgresql: Ansible Roles — Fundamentals
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline PostgreSQL cluster with psql, pg_hba.conf, roles,
  and WAL. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The PostgreSQL cluster is online with a starter Ansible roles setup. Some
  pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus
  on observation. This beginner-friendly postgresql lab introduces Ansible roles. You will explore role
  layout, defaults/vars, tasks, handlers, and dependencies on the PostgreSQL cluster. Read the environment
  first, then follow the guided steps — no prior production experience required.


  OBJECTIVE: Understand how Ansible roles work in this lab environment; Identify the main status and configuration
  signals for Ansible roles; Confirm you can read the current state confidently before changing anything.
  Success means `systemctl is-active postgresql` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how Ansible roles work in this lab environment
- Identify the main status and configuration signals for Ansible roles
- Confirm you can read the current state confidently before changing anything
initial_state: The PostgreSQL cluster is online with a starter Ansible roles setup. Some pieces are intentionally
  incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — roles/ tree, `ansible-galaxy list`, and role variable precedence.

    2. Write down what looks normal versus wrong or missing for Ansible roles.

    3. Recall the core idea: role layout, defaults/vars, tasks, handlers, and dependencies. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status postgresql` — note Active/Failed and the last log lines.

    2. Read `journalctl -u postgresql -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — roles/ tree, `ansible-galaxy list`, and role variable precedence.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — role applies idempotently with the expected variables per group.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
