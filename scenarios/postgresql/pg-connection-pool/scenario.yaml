coding_spec:
  language: python
  entrypoint: solution.py
  kind: fix
  instructions: 'The app exhausts max_connections during spikes. Fix solution(conn) so it returns the
    pool size each app should get, as a dict of {app_name: size}. Divide the budget argument evenly (integer
    division) across the apps in `apps`, but never give an app more than its declared peak_need, and never
    less than 1. Any capacity freed by capping an app stays unused — do not redistribute it.

    Click Run to try it, then Check Solution to grade against all tests.

    '
  files:
  - path: solution.py
    content: "def solution(conn, budget):\n    # BUG: hands every app the full even share, ignoring peak_need,\
      \ so a\n    # low-traffic app reserves connections it never uses.\n    names = [r[0] for r in conn.execute(\"\
      SELECT app_name FROM apps ORDER BY app_name\")]\n    share = budget // len(names)\n    return {n:\
      \ share for n in names}\n"
    readonly: false
  visible_tests:
  - name: even split respects each app's peak
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE apps (app_name TEXT, peak_need INTEGER);\")\n    conn.executemany(\"INSERT INTO apps\
      \ VALUES (?,?)\", rows)\n    return conn\nconn = _seed([('api',50),('cron',2)])\nassert solution(conn,\
      \ 20) == {'api':10,'cron':2}, solution(conn, 20)\n"
  - name: uncapped apps get the plain share
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE apps (app_name TEXT, peak_need INTEGER);\")\n    conn.executemany(\"INSERT INTO apps\
      \ VALUES (?,?)\", rows)\n    return conn\nconn = _seed([('api',100),('web',100)])\nassert solution(conn,\
      \ 30) == {'api':15,'web':15}, solution(conn, 30)\n"
  hidden_tests:
  - name: freed capacity is not redistributed
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE apps (app_name TEXT, peak_need INTEGER);\")\n    conn.executemany(\"INSERT INTO apps\
      \ VALUES (?,?)\", rows)\n    return conn\nconn = _seed([('api',100),('cron',1)])\nassert solution(conn,\
      \ 20) == {'api':10,'cron':1}, solution(conn, 20)\n"
  - name: every app keeps at least one connection
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE apps (app_name TEXT, peak_need INTEGER);\")\n    conn.executemany(\"INSERT INTO apps\
      \ VALUES (?,?)\", rows)\n    return conn\nconn = _seed([('a',9),('b',9),('c',9),('d',9)])\nassert\
      \ solution(conn, 2) == {'a':1,'b':1,'c':1,'d':1}, solution(conn, 2)\n"
  - name: single app takes the whole budget up to its peak
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE apps (app_name TEXT, peak_need INTEGER);\")\n    conn.executemany(\"INSERT INTO apps\
      \ VALUES (?,?)\", rows)\n    return conn\nconn = _seed([('solo',5)])\nassert solution(conn, 40)\
      \ == {'solo':5}, solution(conn, 40)\n"
  - name: share is floor division
    code: "import sqlite3\ndef _seed(rows):\n    conn = sqlite3.connect(':memory:')\n    conn.executescript(\"\
      CREATE TABLE apps (app_name TEXT, peak_need INTEGER);\")\n    conn.executemany(\"INSERT INTO apps\
      \ VALUES (?,?)\", rows)\n    return conn\nconn = _seed([('a',100),('b',100),('c',100)])\nassert\
      \ solution(conn, 10) == {'a':3,'b':3,'c':3}, solution(conn, 10)\n"
  timeout: 8
