- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `flux get kustomizations`
        2. `kubectl -n flux-system get secret sops-age`
        3. `kubectl -n flux-system get kustomization secrets -o yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `flux get kustomizations` and read the status/error carefully.
        2. Cross-check with `kubectl -n flux-system get secret sops-age` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Kustomization references SOPS decryption but the `sops-age` secret holding the private age key is missing (or not referenced in `spec.decryption`), so kustomize-controller cannot decrypt. Create/reference the age key secret under `spec.decryption.secretRef` so the controller decrypts and applies the secrets.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
