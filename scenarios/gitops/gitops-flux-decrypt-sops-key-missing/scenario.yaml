description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Flux Cannot Decrypt SOPS-Encrypted Secrets` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: The `secrets` Kustomization fails with `failed to decrypt … no key could decrypt the data`. The manifests are SOPS-encrypted but the age key the controller needs is not mounted.

  OBJECTIVE: The Kustomization references SOPS decryption but the `sops-age` secret holding the private age key is missing (or not referenced in `spec.decryption`), so kustomize-controller cannot decrypt. Create/reference the age key secret under `spec.decryption.secretRef` so the controller decrypts and applies the secrets. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The secrets Kustomization decrypts and applies successfully'
- 'The missing SOPS age key is confirmed as the decrypt failure cause'
- 'Encrypted values render into real Kubernetes Secrets after the key is provided'
initial_state: |-
  The `secrets` Kustomization fails with `failed to decrypt … no key could decrypt the data`. The manifests are SOPS-encrypted but the age key the controller needs is not mounted.
