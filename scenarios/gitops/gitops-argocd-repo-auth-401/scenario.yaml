tasks:
- id: task_1
  title: 'ArgoCD Cannot Authenticate to Git Repo'
  description: |-
    Restore healthy behavior for ArgoCD Cannot Authenticate to Git Repo by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This gitops lab teaches how ArgoCD stores per-repo credentials, why repo-server auth failures surface as ComparisonError, and how token rotation breaks GitOps fetches through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/gitops-argocd-repo-auth-401.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The `repo-creds` secret in the argocd namespace holds a stale Git deploy token that was rotated, so ArgoCD's repo-server gets a 401 and can never render the desired state. Update the credential secret with the current token (or re-add the repo via `argocd repo add` with valid creds) and refresh the Application.
  files_changed: []
  commands_run:
  - 'argocd app get billing-api'
  - 'kubectl -n argocd logs deploy/argocd-repo-server --tail=50'
  - 'kubectl -n argocd get secret repo-creds -o yaml'
  reference_docs: gitops-fundamentals
