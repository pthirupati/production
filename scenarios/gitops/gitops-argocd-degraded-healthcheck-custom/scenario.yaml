description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Custom Health Check Marks a Healthy App Degraded` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: A perfectly running `queue-worker` shows Degraded in ArgoCD. The workload is a custom CRD; a Lua health check in argocd-cm returns `Degraded` for any status it does not explicitly recognize.

  OBJECTIVE: The custom resource health Lua script in `argocd-cm` has an overly strict default branch that returns Degraded for a status string it should treat as Healthy. Correct the Lua health check to map the CR's real healthy status to `Healthy`, then refresh so the app reports its true state. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'queue-worker reports Healthy instead of Degraded'
- 'The overly strict custom Lua health check is confirmed as root cause'
- 'The corrected health check maps the CR''s healthy status correctly'
initial_state: |-
  A perfectly running `queue-worker` shows Degraded in ArgoCD. The workload is a custom CRD; a Lua health check in argocd-cm returns `Degraded` for any status it does not explicitly recognize.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd app get queue-worker`
        2. `kubectl -n argocd get cm argocd-cm -o yaml`
        3. `kubectl get queueworker queue-worker -o yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app get queue-worker` and read the status/error carefully.
        2. Cross-check with `kubectl -n argocd get cm argocd-cm -o yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The custom resource health Lua script in `argocd-cm` has an overly strict default branch that returns Degraded for a status string it should treat as Healthy. Correct the Lua health check to map the CR's real healthy status to `Healthy`, then refresh so the app reports its true state.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
