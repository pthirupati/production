solution:
  summary: |-
    The custom resource health Lua script in `argocd-cm` has an overly strict default branch that returns Degraded for a status string it should treat as Healthy. Correct the Lua health check to map the CR's real healthy status to `Healthy`, then refresh so the app reports its true state.
  files_changed: []
  commands_run:
  - 'argocd app get queue-worker'
  - 'kubectl -n argocd get cm argocd-cm -o yaml'
  - 'kubectl get queueworker queue-worker -o yaml'
  reference_docs: gitops-fundamentals
