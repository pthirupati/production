description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Sync Hooks Run in the Wrong Order` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: A database migration Job runs AFTER the app rolls out, so the new pods crash querying a column that does not exist yet. The migration is annotated as a PreSync hook but still executes late.

  OBJECTIVE: The migration Job and the app manifests share the same (or wrong) sync-wave / hook weight, so ArgoCD does not guarantee the migration finishes first. Set the migration as `PreSync` with a lower `argocd.argoproj.io/sync-wave` than the Deployment so it completes before the rollout, then sync. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The migration Job completes before the app Deployment rolls out'
- 'The wrong hook weight / sync-wave ordering is confirmed as root cause'
- 'New pods start cleanly because the schema is migrated first'
initial_state: |-
  A database migration Job runs AFTER the app rolls out, so the new pods crash querying a column that does not exist yet. The migration is annotated as a PreSync hook but still executes late.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd app get shop-api`
        2. `kubectl get job db-migrate -o yaml`
        3. `kubectl get deploy shop-api -o yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app get shop-api` and read the status/error carefully.
        2. Cross-check with `kubectl get job db-migrate -o yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The migration Job and the app manifests share the same (or wrong) sync-wave / hook weight, so ArgoCD does not guarantee the migration finishes first. Set the migration as `PreSync` with a lower `argocd.argoproj.io/sync-wave` than the Deployment so it completes before the rollout, then sync.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
