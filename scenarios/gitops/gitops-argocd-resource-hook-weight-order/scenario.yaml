tasks:
- id: task_1
  title: 'Sync Hooks Run in the Wrong Order'
  description: |-
    Restore healthy behavior for Sync Hooks Run in the Wrong Order by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This gitops lab teaches how ArgoCD PreSync hooks and sync-waves order resource application and why bad ordering breaks migrations through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/gitops-argocd-resource-hook-weight-order.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The migration Job and the app manifests share the same (or wrong) sync-wave / hook weight, so ArgoCD does not guarantee the migration finishes first. Set the migration as `PreSync` with a lower `argocd.argoproj.io/sync-wave` than the Deployment so it completes before the rollout, then sync.
  files_changed: []
  commands_run:
  - 'argocd app get shop-api'
  - 'kubectl get job db-migrate -o yaml'
  - 'kubectl get deploy shop-api -o yaml'
  reference_docs: gitops-fundamentals
