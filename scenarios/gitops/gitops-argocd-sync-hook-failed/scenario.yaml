    \ the entire sync. Fix the hook (correct the secret key / migration args) so the Job completes, then\
    \ re-run the sync so the wave proceeds.\n    2. Change one thing at a time so you can roll back if\
    \ the hypothesis was wrong.\n    3. Verify the objective is met, then click Check Solution (graded\
    \ on real state, not a marker file)."
