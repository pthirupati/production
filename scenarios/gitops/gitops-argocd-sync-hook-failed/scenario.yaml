    \    2. Cross-check with `kubectl logs job/db-migrate -n orders` to isolate the failing object.\n\
    \    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. The PreSync migration Job references a database secret key\
