solution:
  summary: The PreSync migration Job references a database secret key that was renamed, so the migration
    container crashes and the hook Job reports Failed, which blocks the entire sync. Fix the hook (correct
    the secret key / migration args) so the Job completes, then re-run the sync so the wave proceeds.
  files_changed: []
  commands_run:
  - argocd app get orders-api
  - kubectl logs job/db-migrate -n orders
  - kubectl get job db-migrate -n orders -o yaml
  reference_docs: gitops-fundamentals
