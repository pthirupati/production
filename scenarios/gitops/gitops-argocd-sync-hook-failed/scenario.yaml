description: 'CONTEXT: A platform team operating gitops needs you to resolve `ArgoCD Sync Blocked by Failed
  PreSync Hook` during a realistic delivery incident. The business impact is a stalled or unsafe release
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GitOps practice cluster with ArgoCD/Flux controllers,
  Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally;
  no external Git host or paid APIs are required.


  SYMPTOM / STARTING STATE: A release of `orders-api` is stuck: ArgoCD sync status shows the operation
  as Failed. The sync wave halts at a PreSync hook Job `db-migrate` that exits non-zero. Because the hook
  failed, ArgoCD aborts the sync and the new ReplicaSet is never rolled out.


  OBJECTIVE: The PreSync migration Job references a database secret key that was renamed, so the migration
  container crashes and the hook Job reports Failed, which blocks the entire sync. Fix the hook (correct
  the secret key / migration args) so the Job completes, then re-run the sync so the wave proceeds. Success
  is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The db-migrate PreSync hook Job completes successfully
- The orders-api sync operation finishes and the new ReplicaSet rolls out
- The root cause in the hook (bad secret key/migration args) is corrected, not bypassed
initial_state: 'A release of `orders-api` is stuck: ArgoCD sync status shows the operation as Failed.
