description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `ArgoCD Helm App Fails on Missing Values File` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: The `redis-cache` Application errors with `open values-prod.yaml: no such file or directory` during manifest generation. The chart renders fine locally but ArgoCD cannot find the referenced values file.

  OBJECTIVE: The Application's Helm source references `valueFiles: [values-prod.yaml]` at a path that no longer exists after the values file was renamed/moved in Git. Point `spec.source.helm.valueFiles` at the correct path in the repo, then refresh so manifest generation succeeds. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'redis-cache generates manifests without a missing-values error'
- 'The wrong valueFiles path is confirmed via the Application source spec'
- 'The Application computes a diff after the values path is corrected'
initial_state: |-
  The `redis-cache` Application errors with `open values-prod.yaml: no such file or directory` during manifest generation. The chart renders fine locally but ArgoCD cannot find the referenced values file.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd app get redis-cache`
        2. `kubectl -n argocd get application redis-cache -o yaml`
        3. `git -C /gitops ls-files | grep values`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app get redis-cache` and read the status/error carefully.
        2. Cross-check with `kubectl -n argocd get application redis-cache -o yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Application's Helm source references `valueFiles: [values-prod.yaml]` at a path that no longer exists after the values file was renamed/moved in Git. Point `spec.source.helm.valueFiles` at the correct path in the repo, then refresh so manifest generation succeeds.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
