hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: Notifications is misconfigured and dependent
    workflows are failing. This lab is about Notifications — how notifications fits into GitOps delivery.
    Read the objectives and the current state, and note precisely what looks wrong versus healthy before
    you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Notifications problems the reliable method is: (1) reproduce/observe
    the failure, (2) narrow from the whole system down to the one component that owns the symptom, (3)
    change exactly one thing, (4) re-check. Repair or run the backup job, then perform a controlled restore
    into a scratch location to prove it works.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Inspect GitOps state: `cat /opt/gitops/application.yaml` and `cat /opt/gitops/flux-kustomization.yaml`.
    Look for OutOfSync / Ready=False.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Confirm sync/health status in the Application manifest.

    2. Check `syncPolicy` and source path/repoURL.

    3. Compare with the Flux Kustomization Ready condition.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Repair `/opt/gitops/application.yaml` so sync is healthy (Synced/Healthy).

    2. Fix Flux reconciliation errors in `/opt/gitops/flux-kustomization.yaml`.

    3. Click Check Solution once the documented remediation is applied (grader: `grep -q FIXED-OK /opt/fixitlab/academy/academy-gitops-019-backup-notifications-2.conf`
    succeeds after the documented fix).'
