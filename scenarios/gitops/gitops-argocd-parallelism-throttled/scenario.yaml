description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Reconciliation Lags Under Repo-Server Throttling` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: After onboarding 300 Applications, syncs take 20+ minutes and the repo-server is pegged. Apps sit `Refreshing` for a long time; the manifest cache is thrashing because repo-server parallelism is set to 1.

  OBJECTIVE: The repo-server `--parallelismlimit` (and app-controller status/operation processors) are too low for the fleet size, serializing manifest generation. Raise the repo-server parallelism and controller processor counts to match the workload so refreshes and syncs keep up. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Applications stop lingering in the Refreshing state'
- 'The low repo-server parallelism limit is confirmed as the bottleneck'
- 'Reconciliation throughput recovers after processors are scaled'
initial_state: |-
  After onboarding 300 Applications, syncs take 20+ minutes and the repo-server is pegged. Apps sit `Refreshing` for a long time; the manifest cache is thrashing because repo-server parallelism is set to 1.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl -n argocd get deploy argocd-repo-server -o yaml`
        2. `kubectl -n argocd logs deploy/argocd-repo-server --tail=50`
        3. `argocd app list --output wide`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl -n argocd get deploy argocd-repo-server -o yaml` and read the status/error carefully.
        2. Cross-check with `kubectl -n argocd logs deploy/argocd-repo-server --tail=50` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The repo-server `--parallelismlimit` (and app-controller status/operation processors) are too low for the fleet size, serializing manifest generation. Raise the repo-server parallelism and controller processor counts to match the workload so refreshes and syncs keep up.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
