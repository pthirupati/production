  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app diff api-gateway` and read the status/error carefully.
        2. Cross-check with `kubectl get deploy api-gateway -o yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. A mutating admission webhook (sidecar injector) adds fields ArgoCD then treats as drift, causing perpetual OutOfSync. Add the injected fields to the Application's `ignoreDifferences` (jsonPointers/managedFieldsManagers) so ArgoCD ignores the webhook-owned mutations and the app stays Synced.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
