tasks:
- id: task_1
  title: 'Perpetual OutOfSync From a Mutating Webhook'
  description: |-
    Restore healthy behavior for Perpetual OutOfSync From a Mutating Webhook by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This gitops lab teaches how ArgoCD ignoreDifferences and managed-field ownership prevent false drift from mutating admission webhooks through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/gitops-argocd-diff-ignores-managed-fields.conf carries the FIXED-OK marker.
solution:
  summary: |-
    A mutating admission webhook (sidecar injector) adds fields ArgoCD then treats as drift, causing perpetual OutOfSync. Add the injected fields to the Application's `ignoreDifferences` (jsonPointers/managedFieldsManagers) so ArgoCD ignores the webhook-owned mutations and the app stays Synced.
  files_changed: []
  commands_run:
  - 'argocd app diff api-gateway'
  - 'kubectl get deploy api-gateway -o yaml'
  - 'kubectl get mutatingwebhookconfigurations'
  reference_docs: gitops-fundamentals
