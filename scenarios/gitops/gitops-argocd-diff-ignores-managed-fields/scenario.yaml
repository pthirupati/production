description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Perpetual OutOfSync From a Mutating Webhook` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: The `api-gateway` Application flips to OutOfSync seconds after every sync. `argocd app diff` shows a `sidecar.istio.io/status` annotation and an injected container that Git does not declare — a mutating webhook adds them at admission.

  OBJECTIVE: A mutating admission webhook (sidecar injector) adds fields ArgoCD then treats as drift, causing perpetual OutOfSync. Add the injected fields to the Application's `ignoreDifferences` (jsonPointers/managedFieldsManagers) so ArgoCD ignores the webhook-owned mutations and the app stays Synced. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'api-gateway stops flapping between Synced and OutOfSync'
- 'The mutating-webhook-injected fields are identified as the drift source'
- 'ignoreDifferences is scoped to only the webhook-owned fields'
initial_state: |-
  The `api-gateway` Application flips to OutOfSync seconds after every sync. `argocd app diff` shows a `sidecar.istio.io/status` annotation and an injected container that Git does not declare — a mutating webhook adds them at admission.
