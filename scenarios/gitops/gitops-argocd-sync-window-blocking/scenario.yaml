description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Sync Window Is Blocking Every Sync` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: Deploys stopped going out overnight. `payments-web` is OutOfSync but auto-sync never fires; the UI shows `blocked by sync window`. An on-call engineer added a deny window last week that accidentally covers 24x7.

  OBJECTIVE: An AppProject sync window with `kind: deny` and an overly broad cron/duration matches all hours, so ArgoCD refuses every automated and manual sync. Correct the window's schedule/duration (or scope it to the intended maintenance hours) so syncs are allowed again, then trigger a sync. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Automated syncs are no longer blocked by the sync window'
- 'The overly broad deny window is identified as root cause via argocd proj windows list'
- 'payments-web reconciles to Synced once the window is corrected'
initial_state: |-
  Deploys stopped going out overnight. `payments-web` is OutOfSync but auto-sync never fires; the UI shows `blocked by sync window`. An on-call engineer added a deny window last week that accidentally covers 24x7.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd app get payments-web`
        2. `argocd proj windows list default`
        3. `kubectl -n argocd get appproject default -o yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app get payments-web` and read the status/error carefully.
        2. Cross-check with `argocd proj windows list default` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. An AppProject sync window with `kind: deny` and an overly broad cron/duration matches all hours, so ArgoCD refuses every automated and manual sync. Correct the window's schedule/duration (or scope it to the intended maintenance hours) so syncs are allowed again, then trigger a sync.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
