description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Kustomize Overlay Targets the Wrong Namespace` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: The `staging` overlay deploys into `default` instead of `staging`. Objects land in the wrong namespace and RBAC then denies the app's service account, so pods cannot read their config.

  OBJECTIVE: The Kustomize overlay is missing the `namespace:` transformer (or sets it to the base value), so rendered manifests inherit `default`. Set `namespace: staging` in the overlay kustomization.yaml so every resource is namespaced correctly, then re-sync. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Rendered manifests land in the staging namespace'
- 'The missing Kustomize namespace transformer is confirmed via kustomize build'
- 'The service account regains access after the namespace is corrected'
initial_state: |-
  The `staging` overlay deploys into `default` instead of `staging`. Objects land in the wrong namespace and RBAC then denies the app's service account, so pods cannot read their config.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kustomize build overlays/staging`
        2. `kubectl get all -n staging`
        3. `cat overlays/staging/kustomization.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kustomize build overlays/staging` and read the status/error carefully.
        2. Cross-check with `kubectl get all -n staging` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Kustomize overlay is missing the `namespace:` transformer (or sets it to the base value), so rendered manifests inherit `default`. Set `namespace: staging` in the overlay kustomization.yaml so every resource is namespaced correctly, then re-sync.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
