description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Flux Kustomizations Deadlocked on dependsOn` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: Two Kustomizations, `infra` and `apps`, both sit in `dependency not ready`. Neither reconciles: `infra` lists `apps` under dependsOn and `apps` lists `infra`, forming a cycle. Nothing progresses.

  OBJECTIVE: A circular `dependsOn` (infra→apps and apps→infra) deadlocks Flux — each waits for the other to be Ready. Break the cycle so dependencies form a DAG (apps dependsOn infra, not the reverse), then reconcile so both apply in order. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Both Kustomizations leave the dependency-not-ready state'
- 'The circular dependsOn is confirmed as the deadlock cause'
- 'Reconciliation proceeds in dependency order after the cycle is broken'
initial_state: |-
  Two Kustomizations, `infra` and `apps`, both sit in `dependency not ready`. Neither reconciles: `infra` lists `apps` under dependsOn and `apps` lists `infra`, forming a cycle. Nothing progresses.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `flux get kustomizations`
        2. `kubectl -n flux-system get kustomization infra apps -o yaml`
        3. `flux logs --kind=Kustomization`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `flux get kustomizations` and read the status/error carefully.
        2. Cross-check with `kubectl -n flux-system get kustomization infra apps -o yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. A circular `dependsOn` (infra→apps and apps→infra) deadlocks Flux — each waits for the other to be Ready. Break the cycle so dependencies form a DAG (apps dependsOn infra, not the reverse), then reconcile so both apply in order.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
