description: 'CONTEXT: A team operating GitOps delivery has raised a ticket for `Gitops: Progressive Delivery
  — Security Practice`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GitOps practice cluster. The architecture is a single
  lab-primary node exposing Git repos, sync agents, and declarative workloads; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around Progressive Delivery.
  Assume an auditor or pen test is next week — tighten controls with evidence. Security review: harden
  Progressive Delivery on this Gitops system. Close unsafe defaults, enforce least privilege, and ensure
  how progressive delivery fits into GitOps delivery cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to Progressive Delivery are removed or constrained; Access follows
  least privilege and is auditable; Security checks pass without breaking required functionality. Acceptance
  criteria: the change is minimal and reversible, and success means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant Git repos, sync agents, and declarative workloads), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to Progressive Delivery are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
