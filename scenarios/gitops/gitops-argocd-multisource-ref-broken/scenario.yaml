  title: 'Multi-Source App Cannot Resolve a $values Ref'
  description: |-
    Restore healthy behavior for Multi-Source App Cannot Resolve a $values Ref by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This gitops lab teaches how ArgoCD multi-source Applications share values across sources via named $refs and why a name mismatch breaks generation through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
