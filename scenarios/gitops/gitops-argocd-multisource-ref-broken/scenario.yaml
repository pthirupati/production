description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Multi-Source App Cannot Resolve a $values Ref` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: A multi-source Application fails with `$values/env/prod.yaml: value files reference not found`. One source provides the chart, another provides values via a `$ref`, but the ref name does not match.

  OBJECTIVE: In a multi-source Application the values source `ref` name (e.g. `values`) does not match the `$values` prefix used in `valueFiles`, so ArgoCD cannot resolve the cross-source values reference. Align the `ref` name with the `$values/...` path so the chart source can read the values source, then refresh. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The multi-source values $ref resolves during generation'
- 'The mismatched ref name is confirmed as root cause'
- 'The Application renders manifests with the referenced values'
initial_state: |-
  A multi-source Application fails with `$values/env/prod.yaml: value files reference not found`. One source provides the chart, another provides values via a `$ref`, but the ref name does not match.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd app get platform-chart`
        2. `kubectl -n argocd get application platform-chart -o yaml`
        3. `git -C /gitops show HEAD:env/prod.yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app get platform-chart` and read the status/error carefully.
        2. Cross-check with `kubectl -n argocd get application platform-chart -o yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. In a multi-source Application the values source `ref` name (e.g. `values`) does not match the `$values` prefix used in `valueFiles`, so ArgoCD cannot resolve the cross-source values reference. Align the `ref` name with the `$values/...` path so the chart source can read the values source, then refresh.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
