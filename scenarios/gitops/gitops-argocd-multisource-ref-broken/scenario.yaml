    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/gitops-argocd-multisource-ref-broken.conf carries the FIXED-OK marker.
solution:
  summary: |-
    In a multi-source Application the values source `ref` name (e.g. `values`) does not match the `$values` prefix used in `valueFiles`, so ArgoCD cannot resolve the cross-source values reference. Align the `ref` name with the `$values/...` path so the chart source can read the values source, then refresh.
  files_changed: []
  commands_run:
  - 'argocd app get platform-chart'
  - 'kubectl -n argocd get application platform-chart -o yaml'
  - 'git -C /gitops show HEAD:env/prod.yaml'
  reference_docs: gitops-fundamentals
