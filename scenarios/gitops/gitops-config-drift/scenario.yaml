description: 'CONTEXT: A team operating gitops has raised a ticket for `Self-Heal Fights Live Config Drift`.
  A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve it.
  Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline FixitLab lab environment. The architecture is a
  single lab-primary node exposing CLI and configuration files; treat it as the production host for this
  incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An on-call engineer patched a live ConfigMap during an incident with `kubectl
  edit`. ArgoCD self-heal keeps reverting it every few minutes, so the hotfix disappears and the team
  is confused about why the change won''t ''stick''. The Application flaps between Synced and OutOfSync.


  OBJECTIVE: The intended config change is promoted into the Git source of truth; web-frontend reaches
  a stable Synced state with no self-heal flapping; The team understands self-heal reverted live edits
  by design (root cause confirmed). Acceptance criteria: the change is minimal and reversible, and success
  means `check.sh` exits successfully.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant CLI and configuration files), changing one thing at a time. Check your work continuously
  against the objective — success means `check.sh` exits successfully.


  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- The intended config change is promoted into the Git source of truth
- web-frontend reaches a stable Synced state with no self-heal flapping
- The team understands self-heal reverted live edits by design (root cause confirmed)
initial_state: An on-call engineer patched a live ConfigMap during an incident with `kubectl edit`. ArgoCD
  self-heal keeps reverting it every few minutes, so the hotfix disappears and the team is confused about
  why the change won't 'stick'. The Application flaps between Synced and OutOfSync.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: Self-Heal fights live config drift is not behaving
    as the scenario objectives require. This lab is about Self-Heal fights live config drift — how Self-Heal
    fights live config drift behaves in a GitOps delivery environment. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For Self-Heal fights live config drift problems the reliable method
    is: (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component
    that owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not in Running state.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
