tasks:
- id: task_1
  title: Self-Heal Fights Live Config Drift
  description: Restore healthy behavior for Self-Heal Fights Live Config Drift by reproducing the diagnosis
    from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating
    the outcome with the checker.
  background: 'This gitops lab teaches that GitOps drift is resolved by changing Git, not the cluster,
    and how self-heal enforces the single source of truth through systematic troubleshooting: observe,
    hypothesize, change, verify.'
  validation:
    type: custom_script
    script: check.sh
    error_message: The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root
      cause, and apply the documented remediation so /opt/fixitlab/academy/gitops-config-drift.conf carries
      the FIXED-OK marker.
solution:
  summary: 'Self-heal is doing exactly its job: reverting live edits to match Git. The correct GitOps
    remediation is to commit the intended change to the Git source (promote the hotfix into the manifests)
    so desired state and live state agree — then the drift stops because Git IS the change.'
  files_changed: []
  commands_run:
  - argocd app history web-frontend
  - argocd app diff web-frontend
  - kubectl get configmap web-frontend-config -n web -o yaml
  reference_docs: gitops-fundamentals
