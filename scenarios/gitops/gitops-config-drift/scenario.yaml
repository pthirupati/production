description: 'CONTEXT: A platform team operating gitops needs you to resolve `Self-Heal Fights Live Config
  Drift` during a realistic delivery incident. The business impact is a stalled or unsafe release until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GitOps practice cluster with ArgoCD/Flux controllers,
  Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally;
  no external Git host or paid APIs are required.


  SYMPTOM / STARTING STATE: An on-call engineer patched a live ConfigMap during an incident with `kubectl
  edit`. ArgoCD self-heal keeps reverting it every few minutes, so the hotfix disappears and the team
  is confused about why the change won''t ''stick''. The Application flaps between Synced and OutOfSync.


  OBJECTIVE: Self-heal is doing exactly its job: reverting live edits to match Git. The correct GitOps
  remediation is to commit the intended change to the Git source (promote the hotfix into the manifests)
  so desired state and live state agree — then the drift stops because Git IS the change. Success is graded
  on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The intended config change is promoted into the Git source of truth
- web-frontend reaches a stable Synced state with no self-heal flapping
- The team understands self-heal reverted live edits by design (root cause confirmed)
initial_state: An on-call engineer patched a live ConfigMap during an incident with `kubectl edit`. ArgoCD
  self-heal keeps reverting it every few minutes, so the hotfix disappears and the team is confused about
  why the change won't 'stick'. The Application flaps between Synced and OutOfSync.
hints:
- order: 1
  cost: 0
  content: "Where to look — orient before changing anything:\n    1. `argocd app history web-frontend`\n\
    \    2. `argocd app diff web-frontend`\n    3. `kubectl get configmap web-frontend-config -n web -o\
    \ yaml`\n    Write down what looks healthy versus wrong. Form one hypothesis before you touch anything."
- order: 2
  cost: 25
  content: "Diagnostic steps:\n    1. Re-run `argocd app history web-frontend` and read the status/error\
    \ carefully.\n    2. Cross-check with `argocd app diff web-frontend` to isolate the failing object.\n\
    \    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. Self-heal is doing exactly its job: reverting live edits\
    \ to match Git. The correct GitOps remediation is to commit the intended change to the Git source\
    \ (promote the hotfix into the manifests) so desired state and live state agree — then the drift stops\
    \ because Git IS the change.\n    2. Change one thing at a time so you can roll back if the hypothesis\
    \ was wrong.\n    3. Verify the objective is met, then click Check Solution (graded on real state,\
    \ not a marker file)."
