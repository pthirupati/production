description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Destination Cluster Token Expired` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: Every Application targeting the `prod-eu` cluster shows `Unauthorized` in the controller logs. The cluster is registered but its bearer token in the ArgoCD cluster secret has expired.

  OBJECTIVE: The `prod-eu` cluster secret in the argocd namespace holds an expired service-account bearer token, so the application-controller gets 401 against the target API server. Rotate the cluster credential (re-run `argocd cluster add` or refresh the token in the cluster secret) so the controller can apply again. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Applications targeting prod-eu stop returning Unauthorized'
- 'The expired cluster bearer token is confirmed as root cause'
- 'The controller resumes applying manifests to prod-eu'
initial_state: |-
  Every Application targeting the `prod-eu` cluster shows `Unauthorized` in the controller logs. The cluster is registered but its bearer token in the ArgoCD cluster secret has expired.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd cluster list`
        2. `kubectl -n argocd logs deploy/argocd-application-controller --tail=50`
        3. `kubectl -n argocd get secret -l argocd.argoproj.io/secret-type=cluster`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd cluster list` and read the status/error carefully.
        2. Cross-check with `kubectl -n argocd logs deploy/argocd-application-controller --tail=50` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The `prod-eu` cluster secret in the argocd namespace holds an expired service-account bearer token, so the application-controller gets 401 against the target API server. Rotate the cluster credential (re-run `argocd cluster add` or refresh the token in the cluster secret) so the controller can apply again.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
