description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Sync-Failure Notifications Never Fire` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: A failed production sync went unnoticed for hours — the team expected an alert. The argocd-notifications controller is running but no message was sent because the subscription annotation is missing on the Application.

  OBJECTIVE: The notifications controller has a trigger/template configured but the target Application lacks the `notifications.argoproj.io/subscribe.on-sync-failed` annotation, so no event is delivered. Add the subscription annotation to the Application so on-sync-failed events reach the configured channel. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The Application is subscribed to on-sync-failed notifications'
- 'The missing subscription annotation is confirmed as root cause'
- 'A sync failure now produces a delivered notification'
initial_state: |-
  A failed production sync went unnoticed for hours — the team expected an alert. The argocd-notifications controller is running but no message was sent because the subscription annotation is missing on the Application.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `kubectl -n argocd get cm argocd-notifications-cm -o yaml`
        2. `kubectl -n argocd logs deploy/argocd-notifications-controller --tail=50`
        3. `kubectl -n argocd get application prod-api -o yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `kubectl -n argocd get cm argocd-notifications-cm -o yaml` and read the status/error carefully.
        2. Cross-check with `kubectl -n argocd logs deploy/argocd-notifications-controller --tail=50` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The notifications controller has a trigger/template configured but the target Application lacks the `notifications.argoproj.io/subscribe.on-sync-failed` annotation, so no event is delivered. Add the subscription annotation to the Application so on-sync-failed events reach the configured channel.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
