tasks:
- id: task_1
  title: 'Sync-Failure Notifications Never Fire'
  description: |-
    Restore healthy behavior for Sync-Failure Notifications Never Fire by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This gitops lab teaches how argocd-notifications binds triggers and templates to Applications via subscribe annotations and why unsubscribed apps stay silent through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/gitops-argocd-notifications-silent.conf carries the FIXED-OK marker.
solution:
  summary: |-
    The notifications controller has a trigger/template configured but the target Application lacks the `notifications.argoproj.io/subscribe.on-sync-failed` annotation, so no event is delivered. Add the subscription annotation to the Application so on-sync-failed events reach the configured channel.
  files_changed: []
  commands_run:
  - 'kubectl -n argocd get cm argocd-notifications-cm -o yaml'
  - 'kubectl -n argocd logs deploy/argocd-notifications-controller --tail=50'
  - 'kubectl -n argocd get application prod-api -o yaml'
  reference_docs: gitops-fundamentals
