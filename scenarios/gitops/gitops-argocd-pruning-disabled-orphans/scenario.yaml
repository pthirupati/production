description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Deleted Manifests Leave Orphaned Resources` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: A ConfigMap and Service were removed from Git two releases ago, but they still exist in the cluster. `argocd app diff catalog` shows the live-only extras, yet the Application stays Synced and never removes them.

  OBJECTIVE: The Application's automated sync has `prune: false`, so ArgoCD applies Git additions but never deletes resources removed from Git, leaving orphans. Enable prune on the sync policy (automated.prune=true) and sync so the orphaned Service/ConfigMap are garbage-collected. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'Resources deleted from Git are pruned from the cluster'
- 'The prune:false sync policy is confirmed as the root cause'
- 'catalog reports no live-only extras after the sync'
initial_state: |-
  A ConfigMap and Service were removed from Git two releases ago, but they still exist in the cluster. `argocd app diff catalog` shows the live-only extras, yet the Application stays Synced and never removes them.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd app diff catalog`
        2. `argocd app get catalog -o yaml`
        3. `kubectl get cm,svc -n catalog`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app diff catalog` and read the status/error carefully.
        2. Cross-check with `argocd app get catalog -o yaml` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Application's automated sync has `prune: false`, so ArgoCD applies Git additions but never deletes resources removed from Git, leaving orphans. Enable prune on the sync policy (automated.prune=true) and sync so the orphaned Service/ConfigMap are garbage-collected.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
