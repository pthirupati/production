description: 'CONTEXT: A platform team operating gitops needs you to resolve `ArgoCD Application Stuck
  OutOfSync` during a realistic delivery incident. The business impact is a stalled or unsafe release
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GitOps practice cluster with ArgoCD/Flux controllers,
  Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally;
  no external Git host or paid APIs are required.


  SYMPTOM / STARTING STATE: The `payments-web` ArgoCD Application shows health Healthy but sync status
  OutOfSync and never converges. `argocd app diff payments-web` reports a live Deployment with `replicas:
  2` while Git declares `replicas: 4`. Auto-sync is disabled, so the controller detects drift but will
  not act on it.


  OBJECTIVE: Someone hand-scaled the Deployment with `kubectl scale`, creating drift from the Git-declared
  desired state, and auto-sync is off so ArgoCD reports OutOfSync but does not reconcile. The fix is to
  bring live state back to Git — run `argocd app sync payments-web` (and enable automated sync + self-heal
  so manual edits are reverted going forward). Success is graded on the real repaired state, not a manual
  marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The payments-web Application reconciles back to Sync status Synced
- Root cause (out-of-band kubectl edit vs Git desired state) is confirmed with argocd app diff
- Automated sync with self-heal is enabled so future manual drift is reverted
