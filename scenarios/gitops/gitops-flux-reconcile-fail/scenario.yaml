description: 'CONTEXT: A platform team operating gitops needs you to resolve `Flux Kustomization Reconciliation
  Failing` during a realistic delivery incident. The business impact is a stalled or unsafe release until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GitOps practice cluster with ArgoCD/Flux controllers,
  Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally;
  no external Git host or paid APIs are required.


  SYMPTOM / STARTING STATE: The Flux `apps` Kustomization reports Ready=False with `build failed: accumulating
  resources`. `flux get kustomizations` shows it stuck, and dependent workloads never update. The GitRepository
  source itself is Ready, so the fetch works but the build does not.


  OBJECTIVE: The kustomization.yaml references a resource file that was renamed/removed in Git, so `kustomize
  build` fails and Flux cannot apply anything. Fix the kustomization resource list so the build succeeds,
  then let Flux reconcile (or force it with `flux reconcile kustomization apps`). Success is graded on
  the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The apps Kustomization builds cleanly (kustomize build succeeds)
- flux get kustomizations shows apps Ready=True and reconciled
- The missing/renamed resource root cause is fixed in Git, not force-applied
initial_state: 'The Flux `apps` Kustomization reports Ready=False with `build failed: accumulating resources`.
  `flux get kustomizations` shows it stuck, and dependent workloads never update. The GitRepository source
  itself is Ready, so the fetch works but the build does not.'
