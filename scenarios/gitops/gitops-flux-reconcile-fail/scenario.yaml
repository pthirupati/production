    \    2. Cross-check with `flux logs --kind=Kustomization --name=apps` to isolate the failing object.\n\
    \    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. The kustomization.yaml references a resource file that was\
    \ renamed/removed in Git, so `kustomize build` fails and Flux cannot apply anything. Fix the kustomization\
    \ resource list so the build succeeds, then let Flux reconcile (or force it with `flux reconcile kustomization\
    \ apps`).\n    2. Change one thing at a time so you can roll back if the hypothesis was wrong.\n \
    \   3. Verify the objective is met, then click Check Solution (graded on real state, not a marker\
    \ file)."
