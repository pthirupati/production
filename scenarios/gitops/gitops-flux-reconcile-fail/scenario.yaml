solution:
  summary: The kustomization.yaml references a resource file that was renamed/removed in Git, so `kustomize
    build` fails and Flux cannot apply anything. Fix the kustomization resource list so the build succeeds,
    then let Flux reconcile (or force it with `flux reconcile kustomization apps`).
  files_changed: []
  commands_run:
  - flux get kustomizations
  - flux logs --kind=Kustomization --name=apps
  - kubectl describe kustomization apps -n flux-system
  reference_docs: gitops-fundamentals
