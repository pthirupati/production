description: 'CONTEXT: A platform team operating gitops needs you to resolve `App-of-Apps Root Fails to
  Render Children` during a realistic delivery incident. The business impact is a stalled or unsafe release
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GitOps practice cluster with ArgoCD/Flux controllers,
  Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally;
  no external Git host or paid APIs are required.


  SYMPTOM / STARTING STATE: The `platform-root` App-of-Apps Application syncs green but none of its child
  Applications (monitoring, ingress, cert-manager) appear in ArgoCD. The root points at a directory of
  child Application manifests, yet the child set is empty and the platform never bootstraps.


  OBJECTIVE: The root Application''s `spec.source.path` points at the wrong directory (or `directory.recurse`
  is false), so ArgoCD renders zero child Application manifests — a green-but-empty root. Correct the
  source path (and enable recurse) so the child Applications are generated and adopted. Success is graded
  on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The platform-root source path/recurse correctly renders the child Application manifests
- All expected child Applications (monitoring, ingress, cert-manager) appear and sync
- The empty-render root cause is confirmed via argocd app manifests, not guessed
initial_state: The `platform-root` App-of-Apps Application syncs green but none of its child Applications
  (monitoring, ingress, cert-manager) appear in ArgoCD. The root points at a directory of child Application
  manifests, yet the child set is empty and the platform never bootstraps.
