    \ down what looks healthy versus wrong. Form one hypothesis before you touch anything."
- order: 2
  cost: 25
  content: "Diagnostic steps:\n    1. Re-run `argocd app get platform-root` and read the status/error\
    \ carefully.\n    2. Cross-check with `kubectl get applications -n argocd` to isolate the failing\
    \ object.\n    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. The root Application's `spec.source.path` points at the\
    \ wrong directory (or `directory.recurse` is false), so ArgoCD renders zero child Application manifests\
    \ — a green-but-empty root. Correct the source path (and enable recurse) so the child Applications\
    \ are generated and adopted.\n    2. Change one thing at a time so you can roll back if the hypothesis\
    \ was wrong.\n    3. Verify the objective is met, then click Check Solution (graded on real state,\
    \ not a marker file)."
