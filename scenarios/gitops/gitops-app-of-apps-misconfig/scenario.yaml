solution:
  summary: The root Application's `spec.source.path` points at the wrong directory (or `directory.recurse`
    is false), so ArgoCD renders zero child Application manifests — a green-but-empty root. Correct the
    source path (and enable recurse) so the child Applications are generated and adopted.
  files_changed: []
  commands_run:
  - argocd app get platform-root
  - kubectl get applications -n argocd
  - argocd app manifests platform-root
  reference_docs: gitops-fundamentals
