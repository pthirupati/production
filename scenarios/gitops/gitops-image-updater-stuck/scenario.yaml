tasks:
- id: task_1
  title: ArgoCD Image Updater Not Promoting Tags
  description: Restore healthy behavior for ArgoCD Image Updater Not Promoting Tags by reproducing the
    diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix,
    and validating the outcome with the checker.
  background: 'This gitops lab teaches automated image promotion, semver/newest-build update strategies,
    and how a constraint mismatch silently blocks rollout through systematic troubleshooting: observe,
    hypothesize, change, verify.'
