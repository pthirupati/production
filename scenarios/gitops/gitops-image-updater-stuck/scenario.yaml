    script: check.sh
    error_message: The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root
      cause, and apply the documented remediation so /opt/fixitlab/academy/gitops-image-updater-stuck.conf
      carries the FIXED-OK marker.
solution:
  summary: 'The Image Updater annotation uses an update strategy/constraint (e.g. `update-strategy: semver`
    with a range that excludes 2.3.1, or a mismatched image alias) that filters out the new tag, so no
    promotion happens. Correct the update strategy/constraint annotation so the new tag is selected and
    written back to Git.'
  files_changed: []
  commands_run:
  - kubectl logs deploy/argocd-image-updater -n argocd
  - argocd app get checkout-svc -o yaml
  - kubectl get application checkout-svc -n argocd -o jsonpath='{.metadata.annotations}'
  reference_docs: gitops-fundamentals
