description: 'CONTEXT: A platform team operating gitops needs you to resolve `ArgoCD Image Updater Not
  Promoting Tags` during a realistic delivery incident. The business impact is a stalled or unsafe release
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline GitOps practice cluster with ArgoCD/Flux controllers,
  Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally;
  no external Git host or paid APIs are required.


  SYMPTOM / STARTING STATE: A new `checkout-svc` image `v2.3.1` was pushed to the registry hours ago,
  but ArgoCD Image Updater never wrote the new tag back and the Application still runs `v2.3.0`. Image
  Updater logs show it evaluated the image but selected no candidate.


  OBJECTIVE: The Image Updater annotation uses an update strategy/constraint (e.g. `update-strategy: semver`
  with a range that excludes 2.3.1, or a mismatched image alias) that filters out the new tag, so no promotion
  happens. Correct the update strategy/constraint annotation so the new tag is selected and written back
  to Git. Success is graded on the real repaired state, not a manual marker.


  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files
  — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check
  Solution.'
objectives:
- The Image Updater annotation/strategy correctly matches the new tag
- checkout-svc is promoted to v2.3.1 and the write-back commits to Git
- The constraint-mismatch root cause is confirmed from Image Updater logs
initial_state: A new `checkout-svc` image `v2.3.1` was pushed to the registry hours ago, but ArgoCD Image
  Updater never wrote the new tag back and the Application still runs `v2.3.0`. Image Updater logs show
  it evaluated the image but selected no candidate.
hints:
- order: 1
  cost: 0
  content: "Where to look — orient before changing anything:\n    1. `kubectl logs deploy/argocd-image-updater\
    \ -n argocd`\n    2. `argocd app get checkout-svc -o yaml`\n    3. `kubectl get application checkout-svc\
    \ -n argocd -o jsonpath='{.metadata.annotations}'`\n    Write down what looks healthy versus wrong.\
    \ Form one hypothesis before you touch anything."
- order: 2
  cost: 25
  content: "Diagnostic steps:\n    1. Re-run `kubectl logs deploy/argocd-image-updater -n argocd` and\
    \ read the status/error carefully.\n    2. Cross-check with `argocd app get checkout-svc -o yaml`\
    \ to isolate the failing object.\n    3. State the single root cause in one sentence before you act."
- order: 3
  cost: 50
  content: "Exact fix + verification:\n    1. The Image Updater annotation uses an update strategy/constraint\
    \ (e.g. `update-strategy: semver` with a range that excludes 2.3.1, or a mismatched image alias) that\
    \ filters out the new tag, so no promotion happens. Correct the update strategy/constraint annotation\
    \ so the new tag is selected and written back to Git.\n    2. Change one thing at a time so you can\
    \ roll back if the hypothesis was wrong.\n    3. Verify the objective is met, then click Check Solution\
    \ (graded on real state, not a marker file)."
