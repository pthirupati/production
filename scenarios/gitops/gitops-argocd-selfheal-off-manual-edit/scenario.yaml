description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Manual Edit Survives Because Self-Heal Is Off` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: Someone `kubectl edit`ed a Deployment's image to a hotfix tag. ArgoCD shows the app OutOfSync but the manual image change persists across reconciles because the live edit is never reverted.

  OBJECTIVE: Automated sync is enabled but `selfHeal` is false, so ArgoCD reports drift from a manual edit yet does not revert it. Enable `automated.selfHeal=true` so out-of-band changes are reverted to the Git-declared state, then sync. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The out-of-band image edit is reverted to the Git-declared tag'
- 'selfHeal:false is confirmed as the reason the manual edit survived'
- 'The Application returns to Synced and stays there after edits'
initial_state: |-
  Someone `kubectl edit`ed a Deployment's image to a hotfix tag. ArgoCD shows the app OutOfSync but the manual image change persists across reconciles because the live edit is never reverted.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd app get web-frontend`
        2. `argocd app diff web-frontend`
        3. `kubectl get deploy web-frontend -o jsonpath='{.spec.template.spec.containers[0].image}'`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app get web-frontend` and read the status/error carefully.
        2. Cross-check with `argocd app diff web-frontend` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. Automated sync is enabled but `selfHeal` is false, so ArgoCD reports drift from a manual edit yet does not revert it. Enable `automated.selfHeal=true` so out-of-band changes are reverted to the Git-declared state, then sync.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
