tasks:
- id: task_1
  title: 'Manual Edit Survives Because Self-Heal Is Off'
  description: |-
    Restore healthy behavior for Manual Edit Survives Because Self-Heal Is Off by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This gitops lab teaches the difference between automated sync and self-heal in ArgoCD and why self-heal is required to reject manual drift through systematic troubleshooting: observe, hypothesize, change, verify.
  validation:
    type: custom_script
    script: check.sh
    error_message: |-
      The scenario objective is not yet satisfied. Re-read hint tier 2, confirm the root cause, and apply the documented remediation so /opt/fixitlab/academy/gitops-argocd-selfheal-off-manual-edit.conf carries the FIXED-OK marker.
solution:
  summary: |-
    Automated sync is enabled but `selfHeal` is false, so ArgoCD reports drift from a manual edit yet does not revert it. Enable `automated.selfHeal=true` so out-of-band changes are reverted to the Git-declared state, then sync.
  files_changed: []
  commands_run:
  - 'argocd app get web-frontend'
  - 'argocd app diff web-frontend'
  - 'kubectl get deploy web-frontend -o jsonpath=''{.spec.template.spec.containers[0].image}'''
  reference_docs: gitops-fundamentals
