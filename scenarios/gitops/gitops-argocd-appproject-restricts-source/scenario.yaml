description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `AppProject Rejects the Application's Source Repo` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: A new Application `analytics` refuses to sync with `application repo … is not permitted in project 'team-a'`. The repo is correct but the AppProject's allowed sourceRepos list does not include it.

  OBJECTIVE: The AppProject `team-a` restricts `sourceRepos` and the analytics repo URL is not in the allow-list, so ArgoCD blocks the sync as a policy violation. Add the repo URL (or an appropriate glob) to the project's sourceRepos so the Application is permitted, then sync. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The analytics Application is permitted to sync under its project'
- 'The restrictive sourceRepos allow-list is confirmed as root cause'
- 'The Application reconciles once the repo is whitelisted'
initial_state: |-
  A new Application `analytics` refuses to sync with `application repo … is not permitted in project 'team-a'`. The repo is correct but the AppProject's allowed sourceRepos list does not include it.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd app get analytics`
        2. `argocd proj get team-a`
        3. `kubectl -n argocd get appproject team-a -o yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app get analytics` and read the status/error carefully.
        2. Cross-check with `argocd proj get team-a` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The AppProject `team-a` restricts `sourceRepos` and the analytics repo URL is not in the allow-list, so ArgoCD blocks the sync as a policy violation. Add the repo URL (or an appropriate glob) to the project's sourceRepos so the Application is permitted, then sync.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
