description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Flux Image Automation Finds No Matching Tags` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: `flux get image policy` shows the `frontend` ImagePolicy with `no image found` and the Git repo is never updated with a new tag. The registry has `1.4.2` but the policy's semver range excludes it.

  OBJECTIVE: The ImagePolicy semver/filter range does not match the tags actually published to the registry (e.g. a `>=2.0.0` range while only `1.x` exists), so automation selects nothing. Correct the ImagePolicy filter/range to match the published tags so the image-reflector picks a version and the image-automation writes it to Git. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The frontend ImagePolicy selects the latest matching tag'
- 'The mismatched semver range is confirmed via flux get image policy'
- 'Image automation writes the promoted tag back to Git'
initial_state: |-
  `flux get image policy` shows the `frontend` ImagePolicy with `no image found` and the Git repo is never updated with a new tag. The registry has `1.4.2` but the policy's semver range excludes it.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `flux get image policy`
        2. `flux get image repository`
        3. `kubectl -n flux-system get imagepolicy frontend -o yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `flux get image policy` and read the status/error carefully.
        2. Cross-check with `flux get image repository` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The ImagePolicy semver/filter range does not match the tags actually published to the registry (e.g. a `>=2.0.0` range while only `1.x` exists), so automation selects nothing. Correct the ImagePolicy filter/range to match the published tags so the image-reflector picks a version and the image-automation writes it to Git.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
