  description: |-
    Restore healthy behavior for Flux Image Automation Finds No Matching Tags by reproducing the diagnosis from the symptom, isolating the root cause with evidence, applying the smallest safe fix, and validating the outcome with the checker.
  background: |-
    This gitops lab teaches how Flux image-reflector and image-automation select tags via ImagePolicy filters and why a bad range stalls promotion through systematic troubleshooting: observe, hypothesize, change, verify.
