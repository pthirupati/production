solution:
  summary: |-
    The ImagePolicy semver/filter range does not match the tags actually published to the registry (e.g. a `>=2.0.0` range while only `1.x` exists), so automation selects nothing. Correct the ImagePolicy filter/range to match the published tags so the image-reflector picks a version and the image-automation writes it to Git.
  files_changed: []
  commands_run:
  - 'flux get image policy'
  - 'flux get image repository'
  - 'kubectl -n flux-system get imagepolicy frontend -o yaml'
  reference_docs: gitops-fundamentals
