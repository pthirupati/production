description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Sync Fails Because a CRD Is Not Yet Installed` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: The `monitoring` Application fails with `the server could not find the requested resource (ServiceMonitor)`. The manifests declare a ServiceMonitor but the Prometheus-operator CRDs are not installed yet.

  OBJECTIVE: The Application applies a ServiceMonitor before its CRD exists, so the API server rejects the unknown kind. Order CRDs first via a sync-wave (install the operator/CRDs ahead of the CR) or enable `SkipDryRunOnMissingResource`, then sync so the CRD lands before its custom resources. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'The ServiceMonitor applies without an unknown-resource error'
- 'The missing CRD ordering is confirmed as the root cause'
- 'monitoring reaches Synced after CRDs are applied first'
initial_state: |-
  The `monitoring` Application fails with `the server could not find the requested resource (ServiceMonitor)`. The manifests declare a ServiceMonitor but the Prometheus-operator CRDs are not installed yet.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd app get monitoring`
        2. `kubectl get crd | grep servicemonitor`
        3. `kubectl -n argocd get application monitoring -o yaml`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app get monitoring` and read the status/error carefully.
        2. Cross-check with `kubectl get crd | grep servicemonitor` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Application applies a ServiceMonitor before its CRD exists, so the API server rejects the unknown kind. Order CRDs first via a sync-wave (install the operator/CRDs ahead of the CR) or enable `SkipDryRunOnMissingResource`, then sync so the CRD lands before its custom resources.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
