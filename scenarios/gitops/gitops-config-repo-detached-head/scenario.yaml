description: |-
  CONTEXT: A platform team operating gitops needs you to resolve `Reconcile Pinned to a Stale Detached Commit` during a realistic delivery incident. The business impact is a stalled or unsafe release until the underlying state is repaired.

  ENVIRONMENT: You are working in FixitLab's offline GitOps practice cluster with ArgoCD/Flux controllers, Application/Kustomization manifests, and a Git source repo under /gitops. All controllers run locally; no external Git host or paid APIs are required.

  SYMPTOM / STARTING STATE: New commits to `main` never deploy. The Application's `targetRevision` is a fixed commit SHA from three weeks ago, so ArgoCD keeps reconciling the old state and ignores every push to the branch.

  OBJECTIVE: The Application `spec.source.targetRevision` is pinned to a stale commit SHA instead of a tracking branch, so it never sees new commits. Set targetRevision back to the intended branch (e.g. `main`) — or bump the pin to the current SHA — so reconciliation follows the branch again. Success is graded on the real repaired state, not a manual marker.

  WHAT TO AVOID: Do not suppress the signal, disable the policy/gate, or fake completion with marker files — reproduce the diagnosis, then apply the smallest fix that satisfies the objective and re-run Check Solution.
objectives:
- 'New commits to the tracked branch are reconciled again'
- 'The stale pinned targetRevision is confirmed as root cause'
- 'The Application converges to the current HEAD after the revision is fixed'
initial_state: |-
  New commits to `main` never deploy. The Application's `targetRevision` is a fixed commit SHA from three weeks ago, so ArgoCD keeps reconciling the old state and ignores every push to the branch.
hints:
- order: 1
  cost: 0
  content: |-
    Where to look — orient before changing anything:
        1. `argocd app get catalog-svc`
        2. `kubectl -n argocd get application catalog-svc -o jsonpath='{.spec.source.targetRevision}'`
        3. `git -C /gitops log --oneline -5 main`
        Write down what looks healthy versus wrong. Form one hypothesis before you touch anything.
- order: 2
  cost: 25
  content: |-
    Diagnostic steps:
        1. Re-run `argocd app get catalog-svc` and read the status/error carefully.
        2. Cross-check with `kubectl -n argocd get application catalog-svc -o jsonpath='{.spec.source.targetRevision}'` to isolate the failing object.
        3. State the single root cause in one sentence before you act.
- order: 3
  cost: 50
  content: |-
    Exact fix + verification:
        1. The Application `spec.source.targetRevision` is pinned to a stale commit SHA instead of a tracking branch, so it never sees new commits. Set targetRevision back to the intended branch (e.g. `main`) — or bump the pin to the current SHA — so reconciliation follows the branch again.
        2. Change one thing at a time so you can roll back if the hypothesis was wrong.
        3. Verify the objective is met, then click Check Solution (graded on real state, not a marker file).
