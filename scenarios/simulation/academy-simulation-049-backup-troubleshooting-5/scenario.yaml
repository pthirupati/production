description: Backup and recovery drill for troubleshooting labs. Ensure backups run
  on schedule, retention is correct, and you can restore broken-state design and RCA
  within the lab RTO.
objectives:
- Backup coverage for troubleshooting labs is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for troubleshooting
  labs. Leadership wants proof that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the injected fault and signals.

    2. Write down what looks normal versus wrong or missing for troubleshooting labs.

    3. Recall the core idea: broken-state design and RCA. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for troubleshooting
    labs.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the injected fault and signals.

    2. Repair or run the backup job, then perform a controlled restore into a scratch
    location to prove it works.

    3. Verify the result — the fault is diagnosable and fixable.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-simulation-049-backup-troubleshooting-5.conf`,
    then click Check Solution.'
