title: 'Simulation Labs: Validation — Build From Scratch'
slug: academy-simulation-072-build-validation-8
technology: Simulation Labs
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Build validation from scratch in this Simulation Labs lab. You start
  from a minimal environment and must produce a working configuration that demonstrates
  holdout, cross-validation, and metrics. Plan, implement, then prove it works.
objectives:
- A working validation setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The simulation sandbox is ready but validation is not configured yet.
  Required tools may already be installed; your job is to create the configuration
  and bring the capability online.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — validation metrics and confusion matrix.

    2. Write down what looks normal versus wrong or missing for validation.

    3. Recall the core idea: holdout, cross-validation, and metrics. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for validation.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — validation metrics and confusion matrix.

    2. Create the smallest working slice of validation first, validate it, then add
    the remaining pieces one at a time.

    3. Verify the result — validation reflects real performance.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-simulation-072-build-validation-8.conf`,
    then click Check Solution.'
