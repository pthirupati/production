title: Gui Simulation - Troubleshooting Drill
slug: academy-simulation-024-troubleshoot-gui-3
technology: simulation
category: Fix
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: The FixitLab platform team uses this lab to teach how local simulation engines
  model real operational failures. A learner is asked to restore a troubleshoot gui workflow after the
  backing simulation state becomes unhealthy.


  ENVIRONMENT: You are working in an offline, RHEL-like FixitLab simulation shell. The host is `sim-primary`,
  core Linux tools are installed, and the lab checker reads the in-memory service state directly through
  the local simulation engine.


  SYMPTOM / STARTING STATE: The `nginx` service is not running (`systemctl is-active nginx` → inactive/failed).
  Dependent Troubleshooting Drill tasks cannot succeed until the unit is healthy again. Commands that
  depend on the simulated service cannot reach the expected healthy state.


  OBJECTIVE: Restore the service-backed simulation workflow so `systemctl is-active nginx` returns active.
  The fix must be observable through normal system commands and must not depend on a manual completion
  marker.


  WHAT TO AVOID: Do not write marker files, skip the diagnostic step, or make broad unrelated changes;
  repair only the failing service state needed for this scenario.'
objectives:
- The `nginx` service is active (running)
- '`systemctl is-active nginx` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `nginx` service is not running (`systemctl is-active nginx` → inactive/failed). Dependent
  Troubleshooting Drill tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with the service layer. The workflow depends on `nginx`, so first decide
    whether the service is stopped, failed, or healthy before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status nginx` and read the Active line.

    2. Run `journalctl -u nginx -n 50` and look for the latest startup error.

    3. If the unit is simply inactive or failed without a persistent config error, restart it and re-check.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run `sudo systemctl start nginx`.

    2. If this is a guided fundamentals lab, run `sudo systemctl enable nginx` so the state survives a
    reboot.

    3. Verify with `systemctl is-active nginx` returns active.


    WHY: the simulation engine validates real service state. A marker file or note is ignored.'
summary: Diagnose and restore a troubleshoot gui simulation workflow, then prove the real state is healthy.
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic Linux terminal navigation
- Reading systemd service status
tags:
- real-validation
- simulation
- systemd
- troubleshoot
linked_tutorial: simulation-labs-fundamentals
what_you_will_learn:
- Recognize the unhealthy simulation signal for troubleshoot gui
- Use command output and logs to diagnose nginx
- Apply a minimal operational fix without relying on marker files
- Verify the repaired state with the same command the grader uses
environment:
  nodes:
  - role: primary
    os: FixitLab RHEL-like simulation
    hostname: sim-primary
    ip: 127.0.0.1
    specs: local in-memory simulation
  pre_installed:
  - bash
  - systemctl
  - journalctl
  - coreutils
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Gui Simulation - Troubleshooting Drill
  description: Restore the troubleshoot gui simulation workflow by diagnosing the failed service state,
    applying the smallest safe fix, and proving the service is healthy.
  background: FixitLab simulation labs model real operating-system state. The checker reads that state
    directly, so the lab only passes when the system itself is repaired.
  validation:
    type: service_active
    command: systemctl is-active nginx
    expected_status: active
    error_message: The nginx service is not active yet. Check `systemctl status nginx` and `journalctl
      -u nginx -n 50` for the remaining blocker.
solution:
  summary: The root cause is an inactive/failed `nginx` service; start it and verify active state.
  files_changed: []
  commands_run:
  - systemctl status nginx
  - journalctl -u nginx -n 50
  - systemctl start nginx
  - systemctl is-active nginx
  reference_docs: 'linked tutorial: simulation-labs-fundamentals'
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect the failing state
    instruction: Check whether the backing service for Gui Simulation - Troubleshooting Drill is active.
    command: systemctl status nginx
    expected_output: Healthy output after the fix
    explanation: The Active line tells you whether the workflow is blocked by service state.
    next_on: command_success
  - step: 2
    title: Gather supporting evidence
    instruction: Use a second command to confirm the failure mode before changing state.
    command: journalctl -u nginx -n 50
    expected_output: Output points at the same root cause
    explanation: A second signal prevents guessing and makes the fix explainable.
    next_on: command_success
  - step: 3
    title: Verify the repaired state
    instruction: Run the same healthy-state command used by the grader.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx` returns active'
    explanation: Validation is based on real service state, not a marker file.
    next_on: command_success
