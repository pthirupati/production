title: 'RHEL Simulation: IPMI Power Control'
slug: sim-rhel-baremetal-ipmi
technology: Simulation
category: Bare Metal
difficulty: easy
time_limit: 600
max_score: 100
lab_mode: simulation
simulation_type: baremetal
infrastructure_type: simulation
jira_priority: Low
is_free: true
description: Practice out-of-band power management on a simulated HPE bare-metal host using ipmitool from
  RHEL. The goal is to query the chassis power state through the BMC, perform a controlled power cycle,
  and confirm the server comes back on — the core workflow for recovering an unresponsive physical host
  without console access.
objectives:
- Check chassis power status with ipmitool
- Perform a power cycle
- Verify power is on after cycle
initial_state: Simulated HPE DL380 bare-metal host with IPMI tooling available on RHEL. You manage chassis
  power through the BMC; the host can be queried and cycled via ipmitool.
hints:
- order: 1
  cost: 10
  content: 'Check the current chassis power state: `ipmitool power status` (or `ipmitool chassis power
    status`).'
- order: 2
  cost: 15
  content: 'Perform a controlled power cycle: `ipmitool power cycle`. Use `ipmitool chassis power on`
    if it was off.'
- order: 3
  cost: 20
  content: Re-query `ipmitool power status` and confirm it reports "on" after the cycle completes.
