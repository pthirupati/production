title: Secure simulation scheduling (lab 25)
slug: simulation-lab-25
technology: simulation
category: Simulation
description: Service operations lab. The `crond` systemd unit is **failed/inactive** on this host — a
  realistic fault for Secure simulation scheduling (lab 25). Diagnose with `systemctl status crond` and
  the journal, apply the smallest reliable fix, then verify with `systemctl is-active crond`. Graded against
  the real service state — no completion markers.
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
coding_mode: false
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: false
dual_terminal: false
objectives:
- The `crond` service is active (running)
- '`systemctl is-active crond` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `crond` service is not running (`systemctl is-active crond` → inactive/failed). Dependent
  tasks cannot succeed until the unit is healthy.
hints:
- order: 1
  cost: 10
  content: 'Where to look: a dependent service has stopped. Start broad with `systemctl --failed`, then
    inspect the specific unit with `systemctl status crond`. Do not change anything yet — confirm which
    unit is down and why.'
- order: 2
  cost: 20
  content: 'Diagnostic steps:

    1. `systemctl status crond` — read the Active: line and the last log lines.

    2. `journalctl -u crond -n 50` — look for the error that stopped it.

    3. Decide on the smallest change that restores the unit (usually a restart once the underlying cause
    is understood).'
- order: 3
  cost: 20
  content: 'Exact fix + verification:

    1. `sudo systemctl start crond` (use `restart` if it is in a failed state).

    2. `sudo systemctl enable crond` so it survives a reboot.

    3. Click Check Solution once `systemctl is-active crond` returns active.

    WHY: the unit was left inactive/failed; starting it restores the dependent workflow. Validation reads
    the real service state, so there is nothing to fake.'
