title: Validation — Build Lab
slug: academy-simulation-022-build-validation-3
technology: simulation
category: Build
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: 'CONTEXT: A team operating FixitLab simulation needs you to resolve `simulation: Validation
  — Build From Scratch` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline simulation sandbox with terminal state, validation
  hooks, and lab authoring markers. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The simulation sandbox is ready but validation is not configured yet. Required
  tools may already be installed; your job is to create the configuration and bring the capability online.
  Build validation from scratch in this simulation lab. You start from a minimal environment and must
  produce a working configuration that demonstrates holdout, cross-validation, and metrics. Plan, implement,
  then prove it works.


  OBJECTIVE: A working validation setup must exist by the end of this lab; Configuration should follow
  team conventions and be easy to audit; The result should pass validation without manual cleanup. Success
  means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working validation setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The simulation sandbox is ready but validation is not configured yet. Required tools may
  already be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Where to look: A working validation setup must exist by the end of this lab'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Configuration should follow team conventions and be easy to audit

    2. The result should pass validation without manual cleanup'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. The result should pass validation without manual cleanup.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
summary: Complete the validation — build lab simulation lab and verify success with the checker
estimated_minutes: 15
xp_reward: 100
