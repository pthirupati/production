title: Run Simulated Patch Cycle
slug: run-patch-cycle-do
technology: simulation
category: Build
difficulty: easy
scenario_type: do
time_limit: 900
max_score: 100
infrastructure_type: docker
lab_mode: docker
jira_priority: Low
is_free: false
description: 'CONTEXT: The FixitLab platform team uses this lab to teach how local simulation engines
  model real operational failures. A learner is asked to restore a run patch cycle do workflow after the
  backing simulation state becomes unhealthy.


  ENVIRONMENT: You are working in an offline, RHEL-like FixitLab simulation shell. The host is `sim-primary`,
  core Linux tools are installed, and the lab checker reads the in-memory service state directly through
  the local simulation engine.


  SYMPTOM / STARTING STATE: RHEL host that needs patching. No pre/post checks have been run yet; you will
  drive the full precheck -> dnf update -> reboot -> postcheck cycle. Commands that depend on the simulated
  service cannot reach the expected healthy state.


  OBJECTIVE: Restore the service-backed simulation workflow so `check.sh` completes the precheck, update,
  reboot, and postcheck sequence. The fix must be observable through normal system commands and must not
  depend on a manual completion marker.


  WHAT TO AVOID: Do not write marker files, skip the diagnostic step, or make broad unrelated changes;
  repair only the failing service state needed for this scenario.'
objectives:
- Run a precheck baseline (current kernel, disk space, running services)
- Apply updates with dnf update and reboot into the new kernel
- Run a postcheck confirming the new kernel booted and services are healthy
initial_state: RHEL host that needs patching. No pre/post checks have been run yet; you will drive the
  full precheck -> dnf update -> reboot -> postcheck cycle.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `/opt/fixitlab/precheck.sh`.

    2. Apply updates with `dnf update -y`.

    3. Reboot and compare `uname -r`, then run postcheck.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run `/opt/fixitlab/precheck.sh`.

    2. Run `sudo dnf update -y` and reboot.

    3. Run `/opt/fixitlab/postcheck.sh`.

    4. Verify with `check.sh` completes the precheck, update, reboot, and postcheck sequence.


    WHY: the checker follows the complete patch lifecycle.'
summary: Complete the run simulated patch cycle simulation lab and verify success with the checker
estimated_minutes: 15
xp_reward: 100
