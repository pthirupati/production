title: Run Simulated Patch Cycle
slug: run-patch-cycle-do
technology: simulation
category: Build
difficulty: easy
scenario_type: do
time_limit: 900
max_score: 100
infrastructure_type: docker
lab_mode: docker
jira_priority: Low
is_free: false
description: 'CONTEXT: The FixitLab platform team uses this lab to teach how local simulation engines
  model real operational failures. A learner is asked to restore a run patch cycle do workflow after the
  backing simulation state becomes unhealthy.


  ENVIRONMENT: You are working in an offline, RHEL-like FixitLab simulation shell. The host is `sim-primary`,
  core Linux tools are installed, and the lab checker reads the in-memory service state directly through
  the local simulation engine.


  SYMPTOM / STARTING STATE: RHEL host that needs patching. No pre/post checks have been run yet; you will
  drive the full precheck -> dnf update -> reboot -> postcheck cycle. Commands that depend on the simulated
  service cannot reach the expected healthy state.


  OBJECTIVE: Restore the service-backed simulation workflow so `check.sh` completes the precheck, update,
  reboot, and postcheck sequence. The fix must be observable through normal system commands and must not
  depend on a manual completion marker.


  WHAT TO AVOID: Do not write marker files, skip the diagnostic step, or make broad unrelated changes;
  repair only the failing service state needed for this scenario.'
objectives:
- Run a precheck baseline (current kernel, disk space, running services)
- Apply updates with dnf update and reboot into the new kernel
- Run a postcheck confirming the new kernel booted and services are healthy
initial_state: RHEL host that needs patching. No pre/post checks have been run yet; you will drive the
  full precheck -> dnf update -> reboot -> postcheck cycle.
hints:
- order: 1
  cost: 0
  content: 'Where to look: This is an ordered change workflow. Start with precheck output before applying
    updates.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `/opt/fixitlab/precheck.sh`.

    2. Apply updates with `dnf update -y`.

    3. Reboot and compare `uname -r`, then run postcheck.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run `/opt/fixitlab/precheck.sh`.

    2. Run `sudo dnf update -y` and reboot.

    3. Run `/opt/fixitlab/postcheck.sh`.

    4. Verify with `check.sh` completes the precheck, update, reboot, and postcheck sequence.


    WHY: the checker follows the complete patch lifecycle.'
summary: Diagnose and restore a run patch cycle do simulation workflow, then prove the real state is healthy.
estimated_minutes: 15
xp_reward: 100
prerequisites:
- Basic Linux terminal navigation
- Reading systemd service status
tags:
- real-validation
- run
- simulation
- systemd
linked_tutorial: simulation-labs-fundamentals
what_you_will_learn:
- Recognize the unhealthy simulation signal for run patch cycle do
- Use command output and logs to diagnose patch cycle
- Apply a minimal operational fix without relying on marker files
- Verify the repaired state with the same command the grader uses
environment:
  nodes:
  - role: primary
    os: FixitLab RHEL-like simulation
    hostname: sim-primary
    ip: 127.0.0.1
    specs: local in-memory simulation
  pre_installed:
  - bash
  - systemctl
  - journalctl
  - coreutils
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Run Simulated Patch Cycle
  description: Restore the run patch cycle do simulation workflow by diagnosing the failed service state,
    applying the smallest safe fix, and proving the service is healthy.
  background: FixitLab simulation labs model real operating-system state. The checker reads that state
    directly, so the lab only passes when the system itself is repaired.
  validation:
    type: custom_script
    script: check.sh
    error_message: The patch cycle is incomplete. Run precheck, apply updates, reboot, and run postcheck.
solution:
  summary: The root cause is an incomplete patch cycle; run precheck, update, reboot, and postcheck in
    order.
  files_changed: []
  commands_run:
  - /opt/fixitlab/precheck.sh
  - dnf update -y
  - reboot
  - uname -r
  - /opt/fixitlab/postcheck.sh
  reference_docs: 'linked tutorial: simulation-labs-fundamentals'
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect the failing state
    instruction: Check whether the backing service for Run Simulated Patch Cycle is active.
    command: /opt/fixitlab/precheck.sh
    expected_output: Healthy output after the fix
    explanation: 'Run the patch workflow in order: precheck, update, reboot, postcheck.'
    next_on: command_success
  - step: 2
    title: Gather supporting evidence
    instruction: Use a second command to confirm the failure mode before changing state.
    command: uname -r
    expected_output: Output points at the same root cause
    explanation: A second signal prevents guessing and makes the fix explainable.
    next_on: command_success
  - step: 3
    title: Verify the repaired state
    instruction: Run the same healthy-state command used by the grader.
    command: /opt/fixitlab/postcheck.sh
    expected_output: '`check.sh` completes the precheck, update, reboot, and postcheck sequence'
    explanation: Validation is based on real service state, not a marker file.
    next_on: command_success
