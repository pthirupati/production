description: 'CONTEXT: The FixitLab platform team uses this lab to teach how local simulation engines
  model real operational failures. A learner is asked to restore a rhel mysql dual workflow after the
  backing simulation state becomes unhealthy.


  ENVIRONMENT: You are working in an offline, RHEL-like FixitLab simulation shell. The host is `sim-primary`,
  core Linux tools are installed, and the lab checker reads the in-memory service state directly through
  the local simulation engine.


  SYMPTOM / STARTING STATE: Dual-terminal lab. primary (10.0.0.10): mysqld is inactive. ssh_client: used
  to run `mysqladmin ping -h 10.0.0.10` against the server. Remote connections currently fail. Commands
  that depend on the simulated service cannot reach the expected healthy state.


  OBJECTIVE: Restore the service-backed simulation workflow so `systemctl is-active mysqld` returns active.
  The fix must be observable through normal system commands and must not depend on a manual completion
  marker.


  WHAT TO AVOID: Do not write marker files, skip the diagnostic step, or make broad unrelated changes;
  repair only the failing service state needed for this scenario.'
objectives:
- From the SSH client, confirm mysqladmin ping fails while mysqld is down
- Start mysqld on the server console
- Verify the remote mysqladmin ping from the client now succeeds
initial_state: 'Dual-terminal lab. primary (10.0.0.10): mysqld is inactive. ssh_client: used to run `mysqladmin
  ping -h 10.0.0.10` against the server. Remote connections currently fail.'
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with the service layer. The workflow depends on `mysqld`, so first decide
    whether the service is stopped, failed, or healthy before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status mysqld` and read the Active line.

    2. Run `journalctl -u mysqld -n 50` and look for the latest startup error.

    3. If the unit is simply inactive or failed without a persistent config error, restart it and re-check.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run `sudo systemctl start mysqld`.

    2. If this is a guided fundamentals lab, run `sudo systemctl enable mysqld` so the state survives
    a reboot.

    3. Verify with `systemctl is-active mysqld` returns active.


    WHY: the simulation engine validates real service state. A marker file or note is ignored.'
summary: Diagnose and restore a rhel mysql dual simulation workflow, then prove the real state is healthy.
