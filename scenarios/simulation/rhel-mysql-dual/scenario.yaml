title: 'RHEL Simulation: MySQL Down (Dual Terminal)'
slug: sim-rhel-mysql-dual
technology: Simulation
category: Database Administration
difficulty: easy
time_limit: 900
max_score: 100
lab_mode: simulation
simulation_type: database
dual_terminal: true
infrastructure_type: simulation
jira_priority: Medium
is_free: false
description: MySQL is stopped on the database server (10.0.0.10), so remote clients can't reach it. Using
  the dual-terminal setup, confirm from the SSH client pane that `mysqladmin ping` fails, then start mysqld
  from the server console and verify the remote ping now succeeds — restoring database connectivity for
  clients.
objectives:
- From the SSH client, confirm mysqladmin ping fails while mysqld is down
- Start mysqld on the server console
- Verify the remote mysqladmin ping from the client now succeeds
initial_state: 'Dual-terminal lab. primary (10.0.0.10): mysqld is inactive. ssh_client: used to run `mysqladmin
  ping -h 10.0.0.10` against the server. Remote connections currently fail.'
hints:
- order: 1
  cost: 10
  content: 'SSH Client pane: `mysqladmin ping -h 10.0.0.10` — expect "connect ... failed" because the
    server''s mysqld is down.'
- order: 2
  cost: 15
  content: 'Server console: inspect it first — `systemctl status mysqld` and `journalctl -u mysqld -n
    20` to confirm it''s simply stopped (not failing).'
- order: 3
  cost: 20
  content: 'Server console: `systemctl start mysqld`. Back in the SSH Client, retry `mysqladmin ping -h
    10.0.0.10` — it now returns "mysqld is alive".'
