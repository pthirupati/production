title: 'Simulation Labs: Validation — Build From Scratch'
slug: academy-simulation-032-build-validation-4
technology: Simulation Labs
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Service operations lab. The `nginx` systemd unit is **failed/inactive** on this host — a
  realistic fault for Build From Scratch workflows that depend on it. Diagnose with `systemctl status
  nginx` and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active nginx`.
objectives:
- The `nginx` service is active (running)
- '`systemctl is-active nginx` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `nginx` service is not running (`systemctl is-active nginx` → inactive/failed). Dependent
  Build From Scratch tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — validation metrics and confusion matrix.

    2. Write down what looks normal versus wrong or missing for validation.

    3. Recall the core idea: holdout, cross-validation, and metrics. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for validation.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — validation metrics and confusion matrix.

    2. Create the smallest working slice of validation first, validate it, then add the remaining pieces
    one at a time.

    3. Verify the result — validation reflects real performance.

    4. Click Check Solution once `systemctl is-active nginx` returns active.'
