title: Configure simulation networking (lab 34)
slug: simulation-lab-34
technology: simulation
category: Fix
description: 'CONTEXT: The FixitLab platform team uses this lab to teach how local simulation engines
  model real operational failures. A learner is asked to restore a configure simulation networking (lab
  34) workflow after the backing simulation state becomes unhealthy.


  ENVIRONMENT: You are working in an offline, RHEL-like FixitLab simulation shell. The host is `sim-primary`,
  core Linux tools are installed, and the lab checker reads the in-memory service state directly through
  the local simulation engine.


  SYMPTOM / STARTING STATE: The `crond` service is not running (`systemctl is-active crond` → inactive/failed).
  Dependent tasks cannot succeed until the unit is healthy. Commands that depend on the simulated service
  cannot reach the expected healthy state.


  OBJECTIVE: Restore the service-backed simulation workflow so `systemctl is-active crond` returns active.
  The fix must be observable through normal system commands and must not depend on a manual completion
  marker.


  WHAT TO AVOID: Do not write marker files, skip the diagnostic step, or make broad unrelated changes;
  repair only the failing service state needed for this scenario.'
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
coding_mode: false
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: false
dual_terminal: false
objectives:
- The `crond` service is active (running)
- '`systemctl is-active crond` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `crond` service is not running (`systemctl is-active crond` → inactive/failed). Dependent
  tasks cannot succeed until the unit is healthy.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with the service layer. The workflow depends on `crond`, so first decide
    whether the service is stopped, failed, or healthy before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status crond` and read the Active line.

    2. Run `journalctl -u crond -n 50` and look for the latest startup error.

    3. If the unit is simply inactive or failed without a persistent config error, restart it and re-check.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run `sudo systemctl start crond`.

    2. If this is a guided fundamentals lab, run `sudo systemctl enable crond` so the state survives a
    reboot.

    3. Verify with `systemctl is-active crond` returns active.


    WHY: the simulation engine validates real service state. A marker file or note is ignored.'
summary: Diagnose and restore a configure simulation networking (lab 34) simulation workflow, then prove
  the real state is healthy.
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic Linux terminal navigation
- Reading systemd service status
tags:
- configure
- real-validation
- simulation
- systemd
linked_tutorial: simulation-labs-fundamentals
what_you_will_learn:
- Recognize the unhealthy simulation signal for configure simulation networking (lab 34)
- Use command output and logs to diagnose crond
- Apply a minimal operational fix without relying on marker files
- Verify the repaired state with the same command the grader uses
environment:
  nodes:
  - role: primary
    os: FixitLab RHEL-like simulation
    hostname: sim-primary
    ip: 127.0.0.1
    specs: local in-memory simulation
  pre_installed:
  - bash
  - systemctl
  - journalctl
  - coreutils
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Configure simulation networking (lab 34)
  description: Restore the configure simulation networking (lab 34) simulation workflow by diagnosing
    the failed service state, applying the smallest safe fix, and proving the service is healthy.
  background: FixitLab simulation labs model real operating-system state. The checker reads that state
    directly, so the lab only passes when the system itself is repaired.
  validation:
    type: service_active
    command: systemctl is-active crond
    expected_status: active
    error_message: The crond service is not active yet. Check `systemctl status crond` and `journalctl
      -u crond -n 50` for the remaining blocker.
solution:
  summary: The root cause is an inactive/failed `crond` service; start it and verify active state.
  files_changed: []
  commands_run:
  - systemctl status crond
  - journalctl -u crond -n 50
  - systemctl start crond
  - systemctl is-active crond
  reference_docs: 'linked tutorial: simulation-labs-fundamentals'
