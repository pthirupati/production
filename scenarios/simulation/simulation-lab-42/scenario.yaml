title: Automate simulation performance (lab 42)
slug: simulation-lab-42
technology: simulation
category: Fix
description: 'CONTEXT: The FixitLab platform team uses this lab to teach how local simulation engines
  model real operational failures. A learner is asked to restore a automate simulation performance (lab
  42) workflow after the backing simulation state becomes unhealthy.


  ENVIRONMENT: You are working in an offline, RHEL-like FixitLab simulation shell. The host is `sim-primary`,
  core Linux tools are installed, and the lab checker reads the in-memory service state directly through
  the local simulation engine.


  SYMPTOM / STARTING STATE: The `nginx` service is not running (`systemctl is-active nginx` → inactive/failed).
  Dependent tasks cannot succeed until the unit is healthy. Commands that depend on the simulated service
  cannot reach the expected healthy state.


  OBJECTIVE: Restore the service-backed simulation workflow so `systemctl is-active nginx` returns active.
  The fix must be observable through normal system commands and must not depend on a manual completion
  marker.


  WHAT TO AVOID: Do not write marker files, skip the diagnostic step, or make broad unrelated changes;
  repair only the failing service state needed for this scenario.'
difficulty: easy
scenario_type: fix
lab_mode: simulation
simulation_type: generic
coding_mode: false
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: false
dual_terminal: false
objectives:
- The `nginx` service is active (running)
- '`systemctl is-active nginx` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `nginx` service is not running (`systemctl is-active nginx` → inactive/failed). Dependent
  tasks cannot succeed until the unit is healthy.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with the service layer. The workflow depends on `nginx`, so first decide
    whether the service is stopped, failed, or healthy before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status nginx` and read the Active line.

    2. Run `journalctl -u nginx -n 50` and look for the latest startup error.

    3. If the unit is simply inactive or failed without a persistent config error, restart it and re-check.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run `sudo systemctl start nginx`.

    2. If this is a guided fundamentals lab, run `sudo systemctl enable nginx` so the state survives a
    reboot.

    3. Verify with `systemctl is-active nginx` returns active.


    WHY: the simulation engine validates real service state. A marker file or note is ignored.'
summary: Complete the automate simulation performance (lab 42) simulation lab and verify success with
  the checker
estimated_minutes: 20
xp_reward: 100
