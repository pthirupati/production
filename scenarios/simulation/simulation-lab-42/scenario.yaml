tasks:
- id: task_1
  title: Automate simulation performance (lab 42)
  description: Restore healthy behavior for Automate simulation performance (lab 42) by investigating
    the failure, applying the smallest safe fix, and validating the outcome.
  background: 'This simulation lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
