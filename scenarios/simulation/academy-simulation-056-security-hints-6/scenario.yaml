description: 'Security review: harden hint authoring on this Simulation Labs system.
  Close unsafe defaults, enforce least privilege, and ensure progressive, non-spoiler
  hints cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to hint authoring are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around hint authoring.
  Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the hint tiers and costs.

    2. Write down what looks normal versus wrong or missing for hint authoring.

    3. Recall the core idea: progressive, non-spoiler hints. Form one hypothesis before
    you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for hint authoring.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the hint tiers and costs.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit
    access the workload actually needs.

    3. Verify the result — hints guide without spoiling.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-simulation-056-security-hints-6.conf`,
    then click Check Solution.'
