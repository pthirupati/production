title: Repair simulation permissions (lab 17)
slug: simulation-lab-17
technology: simulation
category: Simulation
description: Service operations lab. The `nginx` systemd unit is **failed/inactive** on this host — a
  realistic fault for Repair simulation permissions (lab 17). Diagnose with `systemctl status nginx` and
  the journal, apply the smallest reliable fix, then verify with `systemctl is-active nginx`. Graded against
  the real service state — no completion markers.
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: generic
coding_mode: false
jira_priority: Medium
time_limit: 1200
max_score: 100
is_free: false
dual_terminal: false
objectives:
- The `nginx` service is active (running)
- '`systemctl is-active nginx` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `nginx` service is not running (`systemctl is-active nginx` → inactive/failed). Dependent
  tasks cannot succeed until the unit is healthy.
hints:
- order: 1
  cost: 10
  content: 'Where to look: a dependent service has stopped. Start broad with `systemctl --failed`, then
    inspect the specific unit with `systemctl status nginx`. Do not change anything yet — confirm which
    unit is down and why.'
- order: 2
  cost: 20
  content: 'Diagnostic steps:

    1. `systemctl status nginx` — read the Active: line and the last log lines.

    2. `journalctl -u nginx -n 50` — look for the error that stopped it.

    3. Decide on the smallest change that restores the unit (usually a restart once the underlying cause
    is understood).'
- order: 3
  cost: 20
  content: 'Exact fix + verification:

    1. `sudo systemctl start nginx` (use `restart` if it is in a failed state).

    2. `sudo systemctl enable nginx` so it survives a reboot.

    3. Click Check Solution once `systemctl is-active nginx` returns active.

    WHY: the unit was left inactive/failed; starting it restores the dependent workflow. Validation reads
    the real service state, so there is nothing to fake.'
