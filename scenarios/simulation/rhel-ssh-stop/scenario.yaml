tasks:
- id: task_1
  title: 'RHEL Simulation: SSH Service Down'
  description: Restore the rhel ssh stop simulation workflow by diagnosing the failed service state, applying
    the smallest safe fix, and proving the service is healthy.
  background: FixitLab simulation labs model real operating-system state. The checker reads that state
    directly, so the lab only passes when the system itself is repaired.
  validation:
    type: service_active
    command: systemctl is-active sshd
    expected_status: active
    error_message: The sshd service is not active yet. Check `systemctl status sshd` and `journalctl -u
      sshd -n 50` for the remaining blocker.
solution:
  summary: The root cause is an inactive/failed `sshd` service; start it and verify active state.
  files_changed: []
  commands_run:
  - systemctl status sshd
  - journalctl -u sshd -n 50
  - systemctl start sshd
  - systemctl is-active sshd
  reference_docs: 'linked tutorial: simulation-labs-fundamentals'
