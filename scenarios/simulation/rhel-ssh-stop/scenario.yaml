title: 'RHEL Simulation: SSH Service Down'
slug: sim-rhel-ssh-stop
technology: simulation
category: Fix
difficulty: easy
time_limit: 900
max_score: 100
lab_mode: simulation
simulation_type: rhel
dual_terminal: true
infrastructure_type: simulation
jira_priority: Medium
is_free: false
description: "CONTEXT: The FixitLab platform team uses this lab to teach how local simulation engines\
  \ model real operational failures. A learner is asked to restore a rhel ssh stop workflow after the\
  \ backing simulation state becomes unhealthy.\n\nENVIRONMENT: You are working in an offline, RHEL-like\
  \ FixitLab simulation shell. The host is `sim-primary`, core Linux tools are installed, and the lab\
  \ checker reads the in-memory service state directly through the local simulation engine.\n\nSYMPTOM\
  \ / STARTING STATE: primary (10.0.0.10): root console, sshd inactive\nssh_client (10.0.0.5): use ssh\
  \ root@10.0.0.10 to test remote access\n Commands that depend on the simulated service cannot reach\
  \ the expected healthy state.\n\nOBJECTIVE: Restore the service-backed simulation workflow so `systemctl\
  \ is-active sshd` returns active. The fix must be observable through normal system commands and must\
  \ not depend on a manual completion marker.\n\nWHAT TO AVOID: Do not write marker files, skip the diagnostic\
  \ step, or make broad unrelated changes; repair only the failing service state needed for this scenario."
objectives:
- Diagnose SSH connection refused from the SSH client terminal
- Start sshd on the server (primary console): systemctl start sshd
- Verify SSH login succeeds from the client terminal
initial_state: 'primary (10.0.0.10): root console, sshd inactive

  ssh_client (10.0.0.5): use ssh root@10.0.0.10 to test remote access

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with the service layer. The workflow depends on `sshd`, so first decide
    whether the service is stopped, failed, or healthy before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status sshd` and read the Active line.

    2. Run `journalctl -u sshd -n 50` and look for the latest startup error.

    3. If the unit is simply inactive or failed without a persistent config error, restart it and re-check.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run `sudo systemctl start sshd`.

    2. If this is a guided fundamentals lab, run `sudo systemctl enable sshd` so the state survives a
    reboot.

    3. Verify with `systemctl is-active sshd` returns active.


    WHY: the simulation engine validates real service state. A marker file or note is ignored.'
summary: Diagnose and restore a rhel ssh stop simulation workflow, then prove the real state is healthy.
estimated_minutes: 15
xp_reward: 100
prerequisites:
- Basic Linux terminal navigation
- Reading systemd service status
tags:
- real-validation
- rhel
- simulation
- systemd
linked_tutorial: simulation-labs-fundamentals
what_you_will_learn:
