title: Cross-Technology Labs — Production Lab
slug: academy-simulation-005-production-cross-tech
technology: simulation
category: Project
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating FixitLab simulation needs you to resolve `simulation: Cross-Technology
  Labs — Production Readiness` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline simulation sandbox with terminal state, validation
  hooks, and lab authoring markers. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but cross-technology labs is not production ready
  — missing guardrails, runbooks, or capacity checks. Production readiness for cross-technology labs.
  Harden, document, and validate linking tools (e.g. VMware ↔ AWX) so the change is safe to run during
  a maintenance window.


  OBJECTIVE: Day-2 cross-technology labs work completes safely in this environment; Changes are verified
  with before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 cross-technology labs work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but cross-technology labs is not production ready — missing
  guardrails, runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. The system remains stable for dependent teams.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
summary: Complete the cross-technology labs — production lab simulation lab and verify success with the
  checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic Linux terminal navigation
- Reading systemd service status
tags:
- fix
- hands-on
- production
- real-validation
- simulation
- systemd
linked_tutorial: simulation-fundamentals
what_you_will_learn:
- Day-2 cross-technology labs work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
environment:
  nodes:
  - role: primary
    os: FixitLab simulation sandbox
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - bash
  - coreutils
  - journalctl
  - simulation
  - systemctl
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Cross-Technology Labs — Production Lab
  description: Restore healthy behavior for Cross-Technology Labs — Production Lab by investigating the
    failure, applying the smallest safe fix, and validating the outcome.
  background: 'This simulation lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: service_active
    command: systemctl is-active nginx
    expected_status: active
    error_message: The nginx service is not active yet. Check `systemctl status nginx` and `journalctl
      -u nginx -n 50`.
solution:
  summary: The root cause is an inactive/failed `nginx` service; start it and verify active state.
  files_changed: []
  commands_run:
  - systemctl is-active nginx
  reference_docs: simulation-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: systemctl is-active nginx
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: systemctl is-active nginx
    expected_output: '`systemctl is-active nginx` returns active'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
