jira_priority: Low
is_free: false
description: 'CONTEXT: The FixitLab platform team uses this lab to teach how local simulation engines
  model real operational failures. A learner is asked to restore a rhel firewalld dual workflow after
  the backing simulation state becomes unhealthy.


  ENVIRONMENT: You are working in an offline, RHEL-like FixitLab simulation shell. The host is `sim-primary`,
  core Linux tools are installed, and the lab checker reads the in-memory service state directly through
  the local simulation engine.


  SYMPTOM / STARTING STATE: Dual-terminal lab. primary (10.0.0.10): nginx is active but firewalld blocks
  port 80. ssh_client: used to `curl http://10.0.0.10` to test connectivity from outside. Commands that
  depend on the simulated service cannot reach the expected healthy state.


  OBJECTIVE: Restore the service-backed simulation workflow so `firewall-cmd --list-ports` includes `80/tcp`
  and nginx responds. The fix must be observable through normal system commands and must not depend on
  a manual completion marker.


  WHAT TO AVOID: Do not write marker files, skip the diagnostic step, or make broad unrelated changes;
  repair only the failing service state needed for this scenario.'
objectives:
- From the SSH client, confirm curl to the server is refused while the port is blocked
- Allow HTTP through firewalld on the server console
- Verify the remote curl now returns 200
initial_state: 'Dual-terminal lab. primary (10.0.0.10): nginx is active but firewalld blocks port 80.
  ssh_client: used to `curl http://10.0.0.10` to test connectivity from outside.'
hints:
- order: 1
  cost: 0
  content: 'Where to look: The service can be healthy while the network path is blocked. Check firewalld
    before changing nginx.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `firewall-cmd --list-ports`.

    2. Test HTTP from the client side.

    3. If port 80 is missing, the firewall is the blocker.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run `sudo firewall-cmd --permanent --add-service=http`.

    2. Run `sudo firewall-cmd --reload`.

    3. Verify with `firewall-cmd --list-ports` includes `80/tcp` and nginx responds.


    WHY: the checker validates the actual firewall port state.'
summary: Diagnose and restore a rhel firewalld dual simulation workflow, then prove the real state is
  healthy.
estimated_minutes: 15
xp_reward: 100
