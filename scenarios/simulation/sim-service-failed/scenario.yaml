- The `crond` service is active (running)
- '`systemctl is-active crond` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `crond` service is not running (`systemctl is-active crond` → inactive/failed). Dependent
  tasks cannot succeed until the unit is healthy.
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: restart failed systemd service is not behaving
    as the scenario objectives require. This lab is about restart failed systemd service — how restart
    failed systemd service behaves in a FixitLab simulation environment. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For restart failed systemd service problems the reliable method is:
    (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component that
    owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Start with `systemctl status crond` and `journalctl -u crond -n 50 --no-pager` before changing anything.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix (config, unit override, or missing directory).

    2. Run `systemctl daemon-reload` if you edited a unit file.

    3. Run `systemctl restart crond` and confirm `systemctl is-active crond` succeeds.


    WHY: the grader checks real service state, not marker files.'
