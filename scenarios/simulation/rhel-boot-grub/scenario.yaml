technology: simulation
time_limit: 900
title: 'RHEL Simulation: GRUB Boot & Rescue'
summary: Diagnose and restore a rhel boot grub simulation workflow, then prove the real state is healthy.
estimated_minutes: 15
xp_reward: 100
