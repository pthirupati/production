tasks:
- id: task_1
  title: 'RHEL Simulation: GRUB Boot & Rescue'
  description: Restore the rhel boot grub simulation workflow by diagnosing the failed service state,
    applying the smallest safe fix, and proving the service is healthy.
  background: FixitLab simulation labs model real operating-system state. The checker reads that state
    directly, so the lab only passes when the system itself is repaired.
  validation:
    type: command_output
    command: grub2-mkconfig -o /boot/grub2/grub.cfg
    expected_output: done
    error_message: The bootloader repair has not completed. Regenerate the grub configuration and re-check
      boot state.
solution:
  summary: The root cause is an incomplete bootloader configuration; regenerate grub config and verify
    boot health.
  files_changed: []
  commands_run:
  - grub2-mkconfig -o /boot/grub2/grub.cfg
  reference_docs: 'linked tutorial: simulation-labs-fundamentals'
