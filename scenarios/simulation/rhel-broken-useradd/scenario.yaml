description: 'CONTEXT: The FixitLab platform team uses this lab to teach how local simulation engines
  model real operational failures. A learner is asked to restore a rhel broken useradd workflow after
  the backing simulation state becomes unhealthy.


  ENVIRONMENT: You are working in an offline, RHEL-like FixitLab simulation shell. The host is `sim-primary`,
  core Linux tools are installed, and the lab checker reads the in-memory service state directly through
  the local simulation engine.


  SYMPTOM / STARTING STATE: Simulated RHEL 9 server whose /etc/passwd has a corrupt line (e.g. missing
  UID/GID fields), which blocks creating new users until the passwd database is clean. Commands that depend
  on the simulated service cannot reach the expected healthy state.


  OBJECTIVE: Restore the service-backed simulation workflow so `check.sh` exits successfully. The fix
  must be observable through normal system commands and must not depend on a manual completion marker.


  WHAT TO AVOID: Do not write marker files, skip the diagnostic step, or make broad unrelated changes;
  repair only the failing service state needed for this scenario.'
objectives:
- Identify the malformed passwd entry
- Remove or fix the corrupt line
- Run pwck to verify account files
- Create user appuser with useradd -m
initial_state: Simulated RHEL 9 server whose /etc/passwd has a corrupt line (e.g. missing UID/GID fields),
  which blocks creating new users until the passwd database is clean.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with the service layer. The workflow depends on `target service`, so
    first decide whether the service is stopped, failed, or healthy before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status target service` and read the Active line.

    2. Run `journalctl -u target service -n 50` and look for the latest startup error.

    3. If the unit is simply inactive or failed without a persistent config error, restart it and re-check.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run `sudo systemctl start target service`.

    2. If this is a guided fundamentals lab, run `sudo systemctl enable target service` so the state survives
    a reboot.

    3. Verify with `check.sh` exits successfully.


    WHY: the simulation engine validates real service state. A marker file or note is ignored.'
