description: 'CONTEXT: A team operating FixitLab simulation needs you to resolve `simulation: Terraform
  State — Daily Operations` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline simulation sandbox with terminal state, validation
  hooks, and lab authoring markers. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The simulation sandbox is healthy enough for scheduled work on Terraform state.
  Complete the maintenance task without unnecessary downtime. Day-2 operations: perform a routine Terraform
  state task safely in simulation. Follow change control — inspect, change, verify — while working with
  local vs remote state, locking, drift, and resource addressing.


  OBJECTIVE: Day-2 Terraform state work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `systemctl is-active
  crond` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 Terraform state work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The simulation sandbox is healthy enough for scheduled work on Terraform state. Complete
  the maintenance task without unnecessary downtime.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `terraform state list`, `terraform show`, and backend config.

    2. Write down what looks normal versus wrong or missing for Terraform state.

    3. Recall the core idea: local vs remote state, locking, drift, and resource addressing. Form one
    hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `systemctl status crond` — note Active/Failed and the last log lines.

    2. Read `journalctl -u crond -n 50` for the root error.

    3. Form a hypothesis about the smallest config or permission fix.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `terraform state list`, `terraform show`, and backend config.

    2. Execute the maintenance in small, reversible steps, taking a snapshot or backup first if the change
    is risky.

    3. Verify the result — state accurately reflects deployed resources.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
