title: 'Simulation Labs: Terminal Simulation — Fundamentals Lab'
slug: academy-simulation-001-learn-terminal
technology: Simulation Labs
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: generic
time_limit: 900
max_score: 100
is_free: true
infrastructure_type: docker
jira_priority: Low
description: Service operations lab. The `nginx` systemd unit is **failed/inactive** on this host — a
  realistic fault for Fundamentals Lab workflows that depend on it. Diagnose with `systemctl status nginx`
  and journal logs, apply the smallest reliable fix, then verify with `systemctl is-active nginx`.
objectives:
- The `nginx` service is active (running)
- '`systemctl is-active nginx` returns active'
- The fix survives a status re-check (no marker files)
initial_state: The `nginx` service is not running (`systemctl is-active nginx` → inactive/failed). Dependent
  Fundamentals Lab tasks cannot succeed until the unit is healthy again.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — the simulated terminal and state.

    2. Write down what looks normal versus wrong or missing for terminal simulation.

    3. Recall the core idea: command parsing and state changes. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for terminal simulation.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — the simulated terminal and state.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — commands update state as expected.

    4. Click Check Solution once `systemctl is-active nginx` returns active.'
