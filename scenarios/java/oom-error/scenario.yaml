jira_priority: Critical
is_free: false
description: |
  The pod is OOMKilled (exit 137) even though the JVM never logs an OutOfMemoryError. The JVM is not container-aware and sizes the heap from host memory, so RSS exceeds the container memory limit and the kernel kills it. Make the JVM respect the cgroup limit and leave headroom for non-heap memory.
objectives:
  - "Confirm the kill is OOMKilled (137) by the kernel, not a JVM heap OOM"
  - "Make the JVM honor the container memory limit"
  - "Leave headroom for metaspace/threads/direct buffers (cap heap %)"
  - "Verify RSS stays under the limit and the pod stops being killed"
initial_state: |
  JVM flags at /app/jvm.options pin a large fixed -Xmx ignoring the cgroup limit; the container is OOMKilled with exit 137.
hints:
  - order: 1
    cost: 10
    content: "Pod status OOMKilled / exit 137 with no Java OOM = RSS exceeded the cgroup limit."
  - order: 2
    cost: 15
    content: "Drop the fixed -Xmx and use -XX:MaxRAMPercentage=70 so the heap tracks the limit."
  - order: 3
    cost: 20
    content: "Leave ~25-30% for non-heap; re-test and confirm RSS stays under the limit."
