description: 'CONTEXT: A team operating Java applications needs you to resolve `Container OOMKilled —
  JVM Heap Larger Than the cgroup Limit` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: JVM flags at /app/jvm.options pin a large fixed -Xmx ignoring the cgroup limit;
  the container is OOMKilled with exit 137. The pod is OOMKilled (exit 137) even though the JVM never
  logs an OutOfMemoryError. The JVM is not container-aware and sizes the heap from host memory, so RSS
  exceeds the container memory limit and the kernel kills it. Make the JVM respect the cgroup limit and
  leave headroom for non-heap memory.


  OBJECTIVE: Confirm the kill is OOMKilled (137) by the kernel, not a JVM heap OOM; Make the JVM honor
  the container memory limit; Leave headroom for metaspace/threads/direct buffers (cap heap %). Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the kill is OOMKilled (137) by the kernel, not a JVM heap OOM
- Make the JVM honor the container memory limit
- Leave headroom for metaspace/threads/direct buffers (cap heap %)
- Verify RSS stays under the limit and the pod stops being killed
initial_state: 'JVM flags at /app/jvm.options pin a large fixed -Xmx ignoring the cgroup limit; the container
  is OOMKilled with exit 137.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
