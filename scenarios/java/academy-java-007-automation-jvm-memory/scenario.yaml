description: 'CONTEXT: A team operating Java applications needs you to resolve `java: Jvm Memory — Automation
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for JVM memory. Automate the boring parts
  without hiding important safety checks. Automation lab: remove toil around JVM memory. Codify repeatable
  steps for heap, GC, and OutOfMemory diagnosis and prove the automation is idempotent.


  OBJECTIVE: Day-2 JVM memory work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `systemctl is-active nginx` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
