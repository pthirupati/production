hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — GC logs, heap dumps, and `jstat`.

    2. Write down what looks normal versus wrong or missing for JVM memory.

    3. Recall the core idea: heap, GC, and OutOfMemory diagnosis. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — GC logs, heap dumps, and `jstat`.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — heap usage is stable under load.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
