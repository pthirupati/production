description: 'CONTEXT: A team operating Java applications needs you to resolve `@Transactional Not Rolling
  Back on a Checked Exception` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: PaymentService at /app/src/main/java/com/example/service/PaymentService.java
  is @Transactional but throws a checked exception and self-invokes, so no rollback occurs. A multi-step
  operation leaves the database half-updated after a failure: @Transactional does not roll back because
  Spring only rolls back on runtime exceptions by default and the service throws a checked exception (also,
  the method is called from within the same bean, bypassing the proxy). Make the rollback semantics correct
  so partial writes never persist.


  OBJECTIVE: Reproduce a partial commit when the operation fails midway; Configure rollback for the checked
  exception (rollbackFor); Ensure the transactional method is invoked through the proxy. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce a partial commit when the operation fails midway
- Configure rollback for the checked exception (rollbackFor)
- Ensure the transactional method is invoked through the proxy
- Verify a failure rolls the whole operation back
