description: 'CONTEXT: A team operating Java applications needs you to resolve `Spring Circular Bean Dependency
  Aborts Startup` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: BeanConfig at /app/src/main/java/com/example/config/BeanConfig.java wires
  two beans that constructor-inject each other; startup reports a bean cycle. Startup fails with ''The
  dependencies of some of the beans in the application context form a cycle''. Two singletons inject each
  other by constructor, which Spring cannot resolve. Break the cycle by redesigning the dependency (extract
  a third bean, use setter/@Lazy injection, or an event) so the context refreshes.


  OBJECTIVE: Read the startup error and identify the two beans in the cycle; Decide how to break the cycle
  (extract, @Lazy, or events); Apply the fix so neither bean hard-requires the other at construction.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Read the startup error and identify the two beans in the cycle
- Decide how to break the cycle (extract, @Lazy, or events)
- Apply the fix so neither bean hard-requires the other at construction
- Confirm the context starts without the cycle error
