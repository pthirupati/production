slug: actuator-health-failing
title: "Spring Boot Actuator Health Endpoint Returning DOWN"
technology: Java
category: "Spring Boot"
difficulty: medium
time_limit: 900
max_score: 100
lab_mode: simulation
simulation_type: java
infrastructure_type: simulation
jira_priority: High
is_free: false
description: |
  The Kubernetes liveness probe is failing because GET /actuator/health returns HTTP 503 with status DOWN, so the pod restarts in a loop. A custom health indicator for a decommissioned 'legacyPaymentService' and a misconfigured datasource health check are both forcing the aggregate status to DOWN.
objectives:
  - "Call /actuator/health with show-details to see each component status"
  - "Identify which health indicator is forcing the DOWN status"
  - "Disable the defunct indicator or repair the datasource health check"
  - "Confirm /actuator/health returns status UP with HTTP 200"
initial_state: |
  Spring Boot app on port 8080. GET /actuator/health returns 503 DOWN. Config at /app/src/main/resources/application.yml has a legacyPaymentService health indicator pointing at a retired endpoint.
hints:
  - order: 1
    cost: 10
    content: "Enable details: management.endpoint.health.show-details: always, then curl http://localhost:8080/actuator/health | python3 -m json.tool to see the DOWN component."
  - order: 2
    cost: 15
    content: "Disable the dead indicator: management.health.legacyPaymentService.enabled: false, or remove its @Component bean."
  - order: 3
    cost: 20
    content: "Fix spring.datasource.url to the correct DB host, restart, and confirm the aggregate health is UP."
