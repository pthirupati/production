description: 'CONTEXT: A team operating Java applications needs you to resolve `Flaky JUnit Test Failing
  Intermittently in CI` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Test at /app/src/test/java/com/example/OrderServiceTest.java shares a static
  field across tests and sleeps on a timing assumption, so it fails intermittently. A JUnit test passes
  locally but fails randomly in CI. The flakiness comes from a hidden dependency on test-execution order
  and wall-clock time (a shared static field plus a Thread.sleep race). Make the test deterministic so
  it passes reliably regardless of ordering or timing.


  OBJECTIVE: Reproduce the intermittent failure and find the non-deterministic dependency; Remove shared
  mutable state / order coupling between tests; Replace timing races with deterministic synchronization
  or a fixed clock. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the intermittent failure and find the non-deterministic dependency
- Remove shared mutable state / order coupling between tests
- Replace timing races with deterministic synchronization or a fixed clock
- Run the suite repeatedly and confirm it is stable
