description: 'CONTEXT: A team operating Java applications needs you to resolve `LazyInitializationException
  Outside the Session` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml disables open-session-in-view
  and the controller touches a lazy field after the tx ends, throwing LazyInitializationException. Serializing
  an entity in the controller throws ''LazyInitializationException: could not initialize proxy - no Session''.
  A lazy association is accessed after the transaction/session closed. Fix it the right way — fetch what
  you need inside the transaction (DTO projection or entity graph) rather than papering over it with open-session-in-view.


  OBJECTIVE: Reproduce the LazyInitializationException on the response path; Identify the lazy association
  touched after the session closed; Load the needed data within the transaction (DTO/JOIN FETCH/@EntityGraph).
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the LazyInitializationException on the response path
- Identify the lazy association touched after the session closed
- Load the needed data within the transaction (DTO/JOIN FETCH/@EntityGraph)
- Verify the response serializes without the exception
