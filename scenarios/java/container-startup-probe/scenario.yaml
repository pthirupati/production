slug: container-startup-probe
title: "Spring Boot Pod Killed by an Aggressive Startup Probe"
technology: Java
category: "Spring Boot"
difficulty: medium
time_limit: 900
max_score: 100
lab_mode: simulation
simulation_type: java
infrastructure_type: simulation
jira_priority: High
is_free: false
description: |
  A Spring Boot service takes ~40s to warm up (Flyway migrations + cache priming), but the Kubernetes startupProbe gives it only 10s before the kubelet kills and restarts the container — a permanent CrashLoopBackOff. Tune the probe to allow the real startup time using the Actuator readiness group.
objectives:
  - "Read the deployment's startupProbe and compare its budget to real boot time"
  - "Increase failureThreshold/periodSeconds to cover the warm-up window"
  - "Point the probe at /actuator/health/readiness"
  - "Confirm the pod reaches Ready instead of CrashLoopBackOff"
initial_state: |
  Deployment manifest at /app/k8s/deployment.yaml sets a startupProbe with failureThreshold 3 and periodSeconds 3 (~9s) while the app needs ~40s to boot.
hints:
  - order: 1
    cost: 10
    content: "kubectl describe pod shows 'Startup probe failed' then Killing — the budget is too small."
  - order: 2
    cost: 15
    content: "Expose readiness: management.endpoint.health.probes.enabled=true and probe /actuator/health/readiness."
  - order: 3
    cost: 20
    content: "Set failureThreshold 30, periodSeconds 5 (150s budget) so a slow boot still passes."
