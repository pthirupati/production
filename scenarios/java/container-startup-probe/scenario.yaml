description: 'CONTEXT: A team operating Java applications needs you to resolve `Spring Boot Pod Killed
  by an Aggressive Startup Probe` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Deployment manifest at /app/k8s/deployment.yaml sets a startupProbe with failureThreshold
  3 and periodSeconds 3 (~9s) while the app needs ~40s to boot. A Spring Boot service takes ~40s to warm
  up (Flyway migrations + cache priming), but the Kubernetes startupProbe gives it only 10s before the
  kubelet kills and restarts the container — a permanent CrashLoopBackOff. Tune the probe to allow the
  real startup time using the Actuator readiness group.


  OBJECTIVE: Read the deployment''s startupProbe and compare its budget to real boot time; Increase failureThreshold/periodSeconds
  to cover the warm-up window; Point the probe at /actuator/health/readiness. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Read the deployment's startupProbe and compare its budget to real boot time
- Increase failureThreshold/periodSeconds to cover the warm-up window
- Point the probe at /actuator/health/readiness
- Confirm the pod reaches Ready instead of CrashLoopBackOff
initial_state: 'Deployment manifest at /app/k8s/deployment.yaml sets a startupProbe with failureThreshold
  3 and periodSeconds 3 (~9s) while the app needs ~40s to boot.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `kubectl get pods -A` and `kubectl describe pod <name>` for any pod not
    in Running state.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. `kubectl get pods` — note CrashLoopBackOff, ImagePullBackOff, or Pending.

    2. `kubectl describe pod <name>` — read Events at the bottom.

    3. `kubectl logs <name> [--previous]` if the container restarted.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix the root cause (image name, env var, volume mount, or probe).

    2. `kubectl apply -f` the corrected manifest or delete the pod to recreate.

    3. Confirm `kubectl get pods` shows every pod Running.


    WHY: Kubernetes only reports healthy when the workload actually runs.'
