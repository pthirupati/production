description: 'CONTEXT: A team operating Java applications needs you to resolve `Jackson Infinite Recursion
  on a Bidirectional Relationship` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Order at /app/src/main/java/com/example/model/Order.java references LineItem
  which references Order; Jackson recurses infinitely. Returning an entity from a REST controller throws
  ''Infinite recursion (StackOverflowError)'' because a bidirectional JPA relationship (Order <-> LineItem)
  serializes back and forth forever. Break the serialization cycle with @JsonManagedReference/@JsonBackReference
  or @JsonIgnore (or use a DTO).


  OBJECTIVE: Reproduce the StackOverflowError on the JSON response; Identify the bidirectional relationship
  causing the loop; Annotate one side to break the serialization cycle. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
