description: 'CONTEXT: A team operating Java applications needs you to resolve `Logback Without Rolling
  Policy Fills the Disk` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: logback-spring.xml at /app/src/main/resources/ uses a plain FileAppender with
  no rolling policy; the log file never rotates. The application log grows without bound because the Logback
  file appender has no rolling policy, eventually filling the disk and taking the service down. Add a
  SizeAndTimeBasedRollingPolicy with sensible max file size, history, and total cap so logs rotate and
  old files are purged.


  OBJECTIVE: Confirm the single log file grows unbounded; Switch to a RollingFileAppender with a rolling
  policy; Set max file size, max history, and total size cap. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the single log file grows unbounded
- Switch to a RollingFileAppender with a rolling policy
- Set max file size, max history, and total size cap
- Verify logs rotate and disk usage is bounded
initial_state: 'logback-spring.xml at /app/src/main/resources/ uses a plain FileAppender with no rolling
  policy; the log file never rotates.

  '
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `df -h` and `du -xh /var /tmp /home | sort -h | tail -20` for large paths.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Find which mount is 100% — often `/` or `/var`.

    2. `journalctl --disk-usage` and old logs under `/var/log`.

    3. Look for core dumps, temp files, or oversized application data.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Remove or rotate the largest safe files (logs, caches, old packages).

    2. `df -h` should show free space on the affected mount.

    3. Retry the command that failed with ''No space left on device''.


    WHY: many services fail cryptically when disk is full.'
