description: 'CONTEXT: A team operating Java applications has raised a ticket for `Logback Without Rolling
  Policy Fills the Disk`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose
  and resolve it. Business impact: reduced service reliability and blocked users until the underlying
  state is repaired.

  ENVIRONMENT: You are working in FixitLab''s offline Java project. The architecture is a single lab-primary
  node exposing Maven/Gradle, JVM logs, and Spring configuration; treat it as the production host for
  this incident. All tools run locally — no paid APIs or external cloud calls are required.

  SYMPTOM / STARTING STATE: logback-spring.xml at /app/src/main/resources/ uses a plain FileAppender with
  no rolling policy; the log file never rotates.

  OBJECTIVE: Confirm the single log file grows unbounded; Switch to a RollingFileAppender with a rolling
  policy; Set max file size, max history, and total size cap. Acceptance criteria: the change is minimal
  and reversible, and success means `check.sh` exits successfully.

  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant Maven/Gradle, JVM logs, and Spring configuration), changing one thing at a time.
  Check your work continuously against the objective — success means `check.sh` exits successfully.

  VERIFY: Re-run the same check the grader uses and confirm `check.sh` exits successfully. Capture the
  before/after output as evidence. Success criteria: the objective''s healthy state holds on a repeat
  check, not just once.

  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.

  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the single log file grows unbounded
- Switch to a RollingFileAppender with a rolling policy
- Set max file size, max history, and total size cap
- Verify logs rotate and disk usage is bounded
