title: Maven Build Failure
slug: sim-java-maven-fail
category: Java Development
difficulty: medium
description: '`mvn package` fails because a declared dependency can''t be resolved from any configured
  repository ("Could not resolve dependencies ... Failure to find"). The pom.xml has a wrong groupId/artifactId/version
  (or a missing repository), so Maven can''t download it. Correct the dependency coordinates so the build
  resolves and packages.'
initial_state: Simulated RHEL 9 server with a Maven project whose pom.xml declares a dependency that doesn't
  exist in any repo, so `mvn package` fails at dependency resolution.
lab_mode: simulation
simulation_type: java
is_free: false
jira_priority: Medium
max_score: 100
time_limit: 900
dual_terminal: false
requires_companion_hosts: false
objectives:
- Run the build and read which dependency fails to resolve
- Identify the wrong coordinates (groupId/artifactId/version) in pom.xml
- Fix the dependency so mvn package builds successfully
hints:
- order: 1
  cost: 10
  content: 'Build to see the failure: `mvn package` reports "Failure to find <group>:<artifact>:<version>".
    Inspect the tree/effective pom: `mvn dependency:tree`.'
- order: 2
  cost: 15
  content: Open pom.xml and compare the failing dependency's groupId/artifactId/version against the real
    coordinates (check Maven Central). A typo or non-existent version is the cause.
- order: 3
  cost: 20
  content: Correct the coordinates (and add the right `<repository>` if it's not on Central), then `mvn
    package` — dependency resolution succeeds and the JAR is built under target/.
