description: |
  mvn package fails: a dependency cannot be resolved or the POM has an invalid element, so the reactor never reaches the package phase. Read the Maven error, repair the POM (coordinates, version, or repository), and get a clean BUILD SUCCESS with an artifact under target/.
objectives:
  - "Run mvn package and read the first BUILD FAILURE cause"
  - "Fix the unresolved dependency or invalid POM element"
  - "Re-run until BUILD SUCCESS"
  - "Confirm the artifact exists under target/"
initial_state: |
  Maven POM at /app/pom.xml has an unresolvable dependency / invalid element; mvn package exits with BUILD FAILURE.
hints:
  - order: 1
    cost: 10
    content: "mvn package -e shows whether it is a resolution error or a malformed POM element."
  - order: 2
    cost: 15
    content: "Correct the dependency coordinates/version (or add the right repository)."
  - order: 3
    cost: 20
    content: "Re-run mvn package; on BUILD SUCCESS confirm ls target/*.jar."
