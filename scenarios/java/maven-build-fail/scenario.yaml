description: 'CONTEXT: A team operating Java applications needs you to resolve `Maven Build Failing —
  Unresolved Dependency / Bad POM` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Maven POM at /app/pom.xml has an unresolvable dependency / invalid element;
  mvn package exits with BUILD FAILURE. mvn package fails: a dependency cannot be resolved or the POM
  has an invalid element, so the reactor never reaches the package phase. Read the Maven error, repair
  the POM (coordinates, version, or repository), and get a clean BUILD SUCCESS with an artifact under
  target/.


  OBJECTIVE: Run mvn package and read the first BUILD FAILURE cause; Fix the unresolved dependency or
  invalid POM element; Re-run until BUILD SUCCESS. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Run mvn package and read the first BUILD FAILURE cause
- Fix the unresolved dependency or invalid POM element
- Re-run until BUILD SUCCESS
- Confirm the artifact exists under target/
