description: 'CONTEXT: A team operating Java applications needs you to resolve `JaCoCo Coverage Report
  Missing — Build Gate Fails` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Maven POM at /app/pom.xml lacks a working jacoco-maven-plugin binding; mvn
  test produces no coverage report and the gate fails. The CI coverage gate fails because no JaCoCo report
  is produced: the jacoco-maven-plugin is either missing or its prepare-agent/report executions are not
  bound to the build lifecycle, so target/site/jacoco/jacoco.xml never appears. Wire the plugin correctly
  so coverage is measured and the report is generated.


  OBJECTIVE: Confirm no jacoco.xml is generated after the test phase; Add/repair the jacoco-maven-plugin
  with prepare-agent and report executions; Bind the executions to the correct lifecycle phases. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm no jacoco.xml is generated after the test phase
- Add/repair the jacoco-maven-plugin with prepare-agent and report executions
- Bind the executions to the correct lifecycle phases
- Verify target/site/jacoco/jacoco.xml is produced
