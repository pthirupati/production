slug: jvm-heap-oom
title: "OutOfMemoryError: Java Heap Space Under Load"
technology: Java
category: "JVM Performance"
difficulty: hard
time_limit: 1200
max_score: 100
lab_mode: simulation
simulation_type: java
infrastructure_type: simulation
jira_priority: Critical
is_free: false
description: |
  The service dies with java.lang.OutOfMemoryError: Java heap space under load. A request handler accumulates objects in an unbounded collection (a leak) while the max heap is also too small for the working set. Capture a heap dump to find the dominator, fix the leak, and right-size -Xmx.
objectives:
  - "Reproduce the OOM and capture a heap dump on OutOfMemoryError"
  - "Identify the dominant retained object set (the leak)"
  - "Bound the leaking collection / cache so it cannot grow without limit"
  - "Set an appropriate -Xmx and confirm the service is stable under load"
initial_state: |
  JVM flags at /app/jvm.options set -Xmx256m with no heap-dump-on-OOM; the app retains request objects in an unbounded list and OOMs under load.
hints:
  - order: 1
    cost: 10
    content: "Add -XX:+HeapDumpOnOutOfMemoryError and analyze the dump (jhat/Eclipse MAT)."
  - order: 2
    cost: 15
    content: "Bound the offending cache/list (size cap or eviction) so it cannot grow forever."
  - order: 3
    cost: 20
    content: "Set a realistic -Xmx (e.g. -Xmx1g) for the working set and re-test under load."
