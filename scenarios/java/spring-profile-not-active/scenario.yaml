description: 'CONTEXT: A team operating Java applications needs you to resolve `Wrong Spring Profile Active
  in Production` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: application.yml at /app/src/main/resources/ does not set spring.profiles.active,
  so the app uses dev defaults in production. Production is accidentally running with development settings
  (H2 in-memory DB, debug logging, permissive CORS) because no production profile is activated, so Spring
  falls back to defaults. Make the prod profile active and ensure prod-specific properties (datasource,
  logging) take effect.


  OBJECTIVE: Confirm the app booted with dev/default settings in prod; Set the active profile to prod
  (config or env); Ensure application-prod.yml properties override the defaults. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the app booted with dev/default settings in prod
- Set the active profile to prod (config or env)
- Ensure application-prod.yml properties override the defaults
- Verify the prod datasource and logging are in effect
