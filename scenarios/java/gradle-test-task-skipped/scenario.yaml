description: 'CONTEXT: A team operating Java applications needs you to resolve `Gradle ''test'' Task Skipped
  — JUnit Platform Not Wired` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: build.gradle at /app/ never calls useJUnitPlatform() and lacks junit-jupiter;
  ./gradlew test reports NO-SOURCE and runs nothing. The Gradle build is green but the test task is NO-SOURCE
  / skipped, so no JUnit tests ever run and regressions ship. The build never calls useJUnitPlatform()
  and the junit-jupiter test dependencies are missing, so Gradle finds nothing to execute. Wire the test
  task to the JUnit 5 platform so the suite actually runs.


  OBJECTIVE: Confirm the test task is skipped / runs zero tests; Add test { useJUnitPlatform() } to the
  build; Add the junit-jupiter testImplementation/testRuntimeOnly dependencies. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the test task is skipped / runs zero tests
- Add test { useJUnitPlatform() } to the build
- Add the junit-jupiter testImplementation/testRuntimeOnly dependencies
- Verify the real test count executes on ./gradlew test
