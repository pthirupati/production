description: 'CONTEXT: A team operating Java applications needs you to resolve `Unresolved ${} Property
  Placeholder Crashes Startup` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: application.yml at /app/src/main/resources/ references ${APP_API_KEY} with
  no value and no default; startup fails to resolve the placeholder. Startup aborts with ''Could not resolve
  placeholder ...'' because a configuration value references an environment variable / property that is
  never provided and has no default. Spring cannot resolve the ${} placeholder, so binding fails. Provide
  the value or a sensible default so the placeholder resolves.


  OBJECTIVE: Read the startup error naming the unresolved placeholder; Decide whether to supply the value
  or give it a default; Provide the property/env var or a ${name:default} fallback. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Read the startup error naming the unresolved placeholder
- Decide whether to supply the value or give it a default
- Provide the property/env var or a ${name:default} fallback
- Confirm the context starts with the placeholder resolved
