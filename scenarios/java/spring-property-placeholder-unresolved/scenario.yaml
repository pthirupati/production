description: |
  Startup aborts with 'Could not resolve placeholder ...' because a configuration value references an environment variable / property that is never provided and has no default. Spring cannot resolve the ${} placeholder, so binding fails. Provide the value or a sensible default so the placeholder resolves.
objectives:
