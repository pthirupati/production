description: 'CONTEXT: A team operating Java applications needs you to resolve `javac Compilation Error
  Blocking the Build` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Java source at /app/src/main/java/com/example/App.java does not compile; javac
  prints an error and exits non-zero. The project will not compile: javac reports an error (a missing
  semicolon, an unresolved symbol, or an incompatible type). Until the source compiles, nothing downstream
  — tests, packaging, deploy — can run. Read the compiler error, fix the offending source, and get a clean
  compile.


  OBJECTIVE: Run the compile and read the first javac error with its file and line; Open the offending
  source file and correct the syntax/type error; Recompile until javac reports no errors. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Run the compile and read the first javac error with its file and line
- Open the offending source file and correct the syntax/type error
- Recompile until javac reports no errors
- Confirm the .class output is produced
