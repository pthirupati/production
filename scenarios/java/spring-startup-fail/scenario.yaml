description: |
  Spring Boot fails to start with 'Web server failed to start. Port 8080 was already in use.' Another process holds the configured port, so the embedded server cannot bind. Either free the port or move the app to a free port via configuration, then confirm a clean startup.
objectives:
  - "Confirm the bind failure is a port-in-use conflict"
  - "Identify what holds the port (or choose a free one)"
  - "Free the port or set server.port to an available value"
  - "Verify the app starts and serves on the chosen port"
initial_state: |
  Config at /app/src/main/resources/application.properties pins server.port=8080 which is already bound; startup aborts with 'Port 8080 was already in use'.
hints:
  - order: 1
    cost: 10
    content: "The message names the port; ss -tlnp | grep 8080 shows who holds it."
  - order: 2
    cost: 15
    content: "Stop the conflicting process, or set server.port to a free port in application.properties."
  - order: 3
    cost: 20
    content: "Restart and confirm 'Tomcat started on port(s)' with no bind error."
