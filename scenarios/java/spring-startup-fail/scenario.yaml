description: 'CONTEXT: A team operating Java applications needs you to resolve `Spring Boot Port Already
  in Use — Startup Aborts` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.properties pins server.port=8080
  which is already bound; startup aborts with ''Port 8080 was already in use''. Spring Boot fails to start
  with ''Web server failed to start. Port 8080 was already in use.'' Another process holds the configured
  port, so the embedded server cannot bind. Either free the port or move the app to a free port via configuration,
  then confirm a clean startup.


  OBJECTIVE: Confirm the bind failure is a port-in-use conflict; Identify what holds the port (or choose
  a free one); Free the port or set server.port to an available value. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the bind failure is a port-in-use conflict
- Identify what holds the port (or choose a free one)
- Free the port or set server.port to an available value
- Verify the app starts and serves on the chosen port
