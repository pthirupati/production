title: 'Java Development: Junit — Troubleshooting Drill'
slug: academy-java-024-troubleshoot-junit-3
technology: Java Development
category: Troubleshooting
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: java
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: regressions ship without test coverage. You are on
  call for Java Development and must troubleshoot JUnit methodically — triage symptoms,
  find root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: regressions ship without test coverage'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Java project is degraded. Regressions ship without test coverage.
  Recent changes may exist around JUnit, but do not restart blindly — gather evidence
  first.
hints:
- order: 1
  cost: 10
  content: 'Triage: test classes and surefire reports. Capture timestamps, error messages,
    and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: tests cover the change and pass. Document the fix, add
    `# FIXED-OK` to `/opt/fixitlab/academy/academy-java-024-troubleshoot-junit-3.conf`,
    and rerun Check Solution.'
