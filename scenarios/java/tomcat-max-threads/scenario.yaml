  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For tomcat thread pool maxed out — requests queue
    and time out problems the reliable method is: (1) reproduce/observe the failure,
    (2) narrow from the whole system down to the one component that owns the symptom,
    (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

