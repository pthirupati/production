description: 'CONTEXT: A team operating Java applications needs you to resolve `Tomcat Thread Pool Maxed
  Out — Requests Queue and Time Out` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml sets server.tomcat.threads.max
  very low with a large accept-count; requests queue and time out under load. Under moderate load requests
  queue and eventually time out. The embedded Tomcat max-threads is set very low while the accept queue
  is large, so connections are accepted but starved of worker threads. Size the connector threads and
  queue to the workload so requests are served instead of timing out.


  OBJECTIVE: Confirm requests are queuing/timing out, not failing fast; Inspect the Tomcat max-threads
  and accept-count settings; Right-size threads (and queue) for the concurrency. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
