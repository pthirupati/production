description: |
  Under moderate load requests queue and eventually time out. The embedded Tomcat max-threads is set very low while the accept queue is large, so connections are accepted but starved of worker threads. Size the connector threads and queue to the workload so requests are served instead of timing out.
objectives:
  - "Confirm requests are queuing/timing out, not failing fast"
  - "Inspect the Tomcat max-threads and accept-count settings"
  - "Right-size threads (and queue) for the concurrency"
  - "Verify throughput recovers and timeouts stop"
initial_state: |
  Config at /app/src/main/resources/application.yml sets server.tomcat.threads.max very low with a large accept-count; requests queue and time out under load.
hints:
  - order: 1
    cost: 10
    content: "Accepted-but-waiting connections + timeouts = too few worker threads."
  - order: 2
    cost: 15
    content: "Raise server.tomcat.threads.max to match expected concurrency."
  - order: 3
    cost: 20
    content: "Keep accept-count modest so excess load is rejected fast instead of queuing forever."
