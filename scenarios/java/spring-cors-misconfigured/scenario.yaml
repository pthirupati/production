description: 'CONTEXT: A team operating Java applications needs you to resolve `CORS Misconfiguration
  Blocks the Frontend` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: WebConfig at /app/src/main/java/com/example/config/WebConfig.java does not
  allow the frontend origin; preflight and CORS requests fail. The browser blocks API calls with ''No
  ''Access-Control-Allow-Origin'' header is present'' (and preflight OPTIONS fail). The Spring CORS configuration
  omits the frontend origin and the required methods/headers, and credentials are mishandled. Configure
  CORS correctly so the SPA can call the API without weakening it to a wildcard-with-credentials.


  OBJECTIVE: Reproduce the CORS/preflight failure from the browser; Add the frontend origin and allowed
  methods/headers; Handle credentials correctly (no wildcard origin with credentials). Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the CORS/preflight failure from the browser
- Add the frontend origin and allowed methods/headers
- Handle credentials correctly (no wildcard origin with credentials)
- Verify cross-origin requests succeed
