description: 'Security review: harden JDBC on this Java Development system. Close
  unsafe defaults, enforce least privilege, and ensure connections, statements, and
  pooling cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to JDBC are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around JDBC. Assume
  an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Baseline current exposure: datasource config and SQL logs. Note world-readable
    files, open ports, or excessive roles.'
- order: 2
  cost: 15
  content: Apply least privilege incrementally. Prefer explicit allows over broad
    wildcards.
- order: 3
  cost: 20
  content: Re-test legitimate workflows after hardening. Finish with `# FIXED-OK`
    in `/opt/fixitlab/academy/academy-java-046-security-jdbc-5.conf` and Check Solution.
