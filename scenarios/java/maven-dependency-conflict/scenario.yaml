description: |
  A Maven build is failing with: NoSuchMethodError: 'void com.fasterxml.jackson.
  databind.ObjectMapper.registerModule()'. Two transitive dependencies are pulling
  in different incompatible versions of jackson-databind (2.12.x vs 2.15.x).
  The version conflict causes a runtime classpath resolution problem. Engineers must
  use mvn dependency:tree to diagnose the conflict and pin the correct version.
objectives:
  - Run mvn dependency:tree to visualize the conflicting dependency versions
  - Identify which two transitive dependencies are pulling in different versions
  - Add an explicit version declaration in the pom.xml dependencyManagement section
  - Verify mvn clean install completes without errors
initial_state: |
  Simulated build server. Maven project at /opt/project/.
  pom.xml exists with multiple Spring and Jackson dependencies.
  Running mvn clean install produces a NoSuchMethodError at runtime.
hints:
  - order: 1
    cost: 10
    content: "Run: cd /opt/project && mvn dependency:tree | grep jackson to see all
      jackson-databind version pulls. Look for lines with 'omitted for conflict'."
  - order: 2
    cost: 15
    content: "In pom.xml, add a dependencyManagement section (or update the existing
      one) to pin jackson-databind to 2.15.2:
      <dependencyManagement><dependencies>
        <dependency>
          <groupId>com.fasterxml.jackson.core</groupId>
          <artifactId>jackson-databind</artifactId>
          <version>2.15.2</version>
        </dependency>
      </dependencies></dependencyManagement>"
  - order: 3
    cost: 20
    content: "After updating pom.xml, run: mvn dependency:tree | grep jackson again
      to confirm all references now resolve to 2.15.2. Then run: mvn clean install
      to verify the build passes."
