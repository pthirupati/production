description: 'CONTEXT: A team operating Java applications needs you to resolve `Maven Dependency Convergence
  Conflict (Jar Hell)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: POM at /app/pom.xml lets two transitive paths bring different versions of
  one library; the app hits NoSuchMethodError at runtime. The app throws NoSuchMethodError/LinkageError
  at runtime because two transitive dependencies pull conflicting versions of the same library onto the
  classpath. Use the dependency tree to find the divergence and pin a single converged version (or exclude
  the bad transitive) so the classpath is consistent.


  OBJECTIVE: Reproduce the runtime LinkageError / NoSuchMethodError; Use mvn dependency:tree to locate
  the conflicting versions; Pin one version via dependencyManagement or exclude the bad transitive. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the runtime LinkageError / NoSuchMethodError
- Use mvn dependency:tree to locate the conflicting versions
- Pin one version via dependencyManagement or exclude the bad transitive
- Confirm the conflict is resolved and the app runs
