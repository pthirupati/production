description: |
  The app throws NoSuchMethodError/LinkageError at runtime because two transitive dependencies pull conflicting versions of the same library onto the classpath. Use the dependency tree to find the divergence and pin a single converged version (or exclude the bad transitive) so the classpath is consistent.
objectives:
  - "Reproduce the runtime LinkageError / NoSuchMethodError"
  - "Use mvn dependency:tree to locate the conflicting versions"
  - "Pin one version via dependencyManagement or exclude the bad transitive"
  - "Confirm the conflict is resolved and the app runs"
initial_state: |
  POM at /app/pom.xml lets two transitive paths bring different versions of one library; the app hits NoSuchMethodError at runtime.
hints:
  - order: 1
    cost: 10
    content: "mvn dependency:tree -Dverbose shows the 'omitted for conflict' duplicate versions."
  - order: 2
    cost: 15
    content: "Pin the version in <dependencyManagement> so every path converges on it."
  - order: 3
    cost: 20
    content: "Or add an <exclusion> on the offending transitive dep; re-run the tree to verify."
