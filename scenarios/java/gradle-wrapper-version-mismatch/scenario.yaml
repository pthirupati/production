  - "Update distributionUrl in gradle-wrapper.properties to a compatible version"
  - "Re-run ./gradlew --version to confirm the new distribution"
  - "Verify the build succeeds with the aligned wrapper"
initial_state: |
  gradle-wrapper.properties at /app/gradle/wrapper/ pins an old Gradle distribution that the configured plugins reject.
