description: 'CONTEXT: A team operating Java applications needs you to resolve `Gradle Wrapper Version
  Mismatch Breaks the Build` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: gradle-wrapper.properties at /app/gradle/wrapper/ pins an old Gradle distribution
  that the configured plugins reject. The build fails because the Gradle wrapper pins a distribution version
  incompatible with the project''s plugins (e.g. an old Gradle with a newer Android/Spring plugin), producing
  ''Unsupported class file major version'' or ''requires Gradle X''. Align the wrapper distributionUrl
  to a supported Gradle version so the build runs.


  OBJECTIVE: Read the build error naming the required vs configured Gradle version; Update distributionUrl
  in gradle-wrapper.properties to a compatible version; Re-run ./gradlew --version to confirm the new
  distribution. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Read the build error naming the required vs configured Gradle version
- Update distributionUrl in gradle-wrapper.properties to a compatible version
- Re-run ./gradlew --version to confirm the new distribution
- Verify the build succeeds with the aligned wrapper
