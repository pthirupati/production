description: |
  The build fails because the Gradle wrapper pins a distribution version incompatible with the project's plugins (e.g. an old Gradle with a newer Android/Spring plugin), producing 'Unsupported class file major version' or 'requires Gradle X'. Align the wrapper distributionUrl to a supported Gradle version so the build runs.
objectives:
