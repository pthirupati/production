description: 'CONTEXT: A team operating Java applications needs you to resolve `ClassNotFoundException
  - Missing JAR on the Runtime` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: RHEL 9 server with a Java app. Dependency JARs are in lib/. The launch script
  /app/run-app.sh omits a JAR, so runtime throws ClassNotFoundException. A Java application fails at runtime
  with java.lang.ClassNotFoundException (or NoClassDefFoundError). A required class lives in a JAR under
  lib/ that is not on the runtime classpath, so the JVM cannot load it when that code path runs. Identify
  the missing dependency JAR and launch the app with a correct -cp.


  OBJECTIVE: Reproduce the ClassNotFoundException and read the missing class name; Locate the JAR under
  lib/ that provides the missing class; Add that JAR to the runtime classpath in the launch command. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the ClassNotFoundException and read the missing class name
- Locate the JAR under lib/ that provides the missing class
- Add that JAR to the runtime classpath in the launch command
- Run the app so the class resolves and it starts cleanly
