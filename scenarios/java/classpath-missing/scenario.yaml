description: |
  A Java application fails at runtime with java.lang.ClassNotFoundException (or NoClassDefFoundError). A required class lives in a JAR under lib/ that is not on the runtime classpath, so the JVM cannot load it when that code path runs. Identify the missing dependency JAR and launch the app with a correct -cp.
objectives:
  - "Reproduce the ClassNotFoundException and read the missing class name"
  - "Locate the JAR under lib/ that provides the missing class"
  - "Add that JAR to the runtime classpath in the launch command"
  - "Run the app so the class resolves and it starts cleanly"
initial_state: |
  RHEL 9 server with a Java app. Dependency JARs are in lib/. The launch script /app/run-app.sh omits a JAR, so runtime throws ClassNotFoundException.
hints:
  - order: 1
    cost: 10
    content: "java -cp app.jar Main throws ClassNotFoundException — note the fully-qualified class."
  - order: 2
    cost: 15
    content: "Find the JAR: for j in lib/*.jar; do unzip -l \"$j\" | grep -q TheClass && echo \"$j\"; done."
  - order: 3
    cost: 20
    content: "Launch with every JAR on the classpath: java -cp 'app.jar:lib/*' com.example.Main."
