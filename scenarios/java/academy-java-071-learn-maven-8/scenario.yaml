title: 'Java Development: Maven Builds — Fundamentals Lab'
slug: academy-java-071-learn-maven-8
technology: Java Development
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: java
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly Java Development lab introduces Maven builds.
  You will explore POM structure, dependencies, plugins, and lifecycle phases on the
  Java project. Read the environment first, then follow the guided steps — no prior
  production experience required.
objectives:
- Understand how Maven builds work in this lab environment
- Identify the main status and configuration signals for Maven builds
- Confirm you can read the current state confidently before changing anything
initial_state: The Java project is online with a starter Maven builds setup. Some
  pieces are intentionally incomplete so you can learn how they fit together. Nothing
  is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `mvn -q dependency:tree`, surefire reports, and
    pom.xml.

    2. Write down what looks normal versus wrong or missing for Maven builds.

    3. Recall the core idea: POM structure, dependencies, plugins, and lifecycle phases.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Maven builds.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `mvn -q dependency:tree`, surefire reports, and
    pom.xml.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — `mvn verify` succeeds and artifacts are produced in target/.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-java-071-learn-maven-8.conf`,
    then click Check Solution.'
