description: |
  A Spring AMQP consumer stops making progress: the queue shows a growing 'unacked' count and processing stalls. A poison message throws on every redelivery and, with manual acks never sent plus no prefetch limit, the channel is blocked. Fix the ack mode, add a prefetch limit, and route poison messages to a dead-letter queue.
objectives:
  - "Confirm messages are stuck in unacked and the consumer is blocked"
  - "Set a sane prefetch (basic.qos) so one consumer cannot hog the channel"
  - "Acknowledge or reject messages correctly (no infinite redelivery)"
  - "Route poison messages to a DLQ and confirm the queue drains"
initial_state: |
  Consumer config at /app/src/main/resources/application.yml uses manual acks but never acks, has no prefetch, and no DLQ; unacked messages pile up.
hints:
  - order: 1
    cost: 10
    content: "RabbitMQ UI shows high 'Unacked' — the consumer holds messages without acking."
  - order: 2
    cost: 15
    content: "Set spring.rabbitmq.listener.simple.prefetch and ensure ack/nack is actually sent."
  - order: 3
    cost: 20
    content: "Configure a dead-letter exchange/queue so a poison message stops re-blocking the channel."
