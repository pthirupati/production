description: 'CONTEXT: A team operating Java applications needs you to resolve `OutOfMemoryError: Direct
  Buffer Memory (Off-Heap Leak)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: JVM flags at /app/jvm.options leave direct memory unbounded; an NIO path leaks
  direct buffers until ''OutOfMemoryError: Direct buffer memory''. A high-throughput NIO/Netty service
  crashes with ''OutOfMemoryError: Direct buffer memory''. Direct (off-heap) ByteBuffers are allocated
  but not released promptly and MaxDirectMemorySize is unbounded, so native memory grows until allocation
  fails. Bound direct memory and fix the buffer lifecycle.


  OBJECTIVE: Confirm the OOM is ''Direct buffer memory'', not heap; Set -XX:MaxDirectMemorySize so off-heap
  usage is bounded; Ensure direct buffers are released/pooled correctly. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the OOM is 'Direct buffer memory', not heap
- Set -XX:MaxDirectMemorySize so off-heap usage is bounded
- Ensure direct buffers are released/pooled correctly
- Verify off-heap memory stabilizes under load
