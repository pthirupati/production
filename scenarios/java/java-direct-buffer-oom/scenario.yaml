description: |
  A high-throughput NIO/Netty service crashes with 'OutOfMemoryError: Direct buffer memory'. Direct (off-heap) ByteBuffers are allocated but not released promptly and MaxDirectMemorySize is unbounded, so native memory grows until allocation fails. Bound direct memory and fix the buffer lifecycle.
objectives:
  - "Confirm the OOM is 'Direct buffer memory', not heap"
  - "Set -XX:MaxDirectMemorySize so off-heap usage is bounded"
  - "Ensure direct buffers are released/pooled correctly"
  - "Verify off-heap memory stabilizes under load"
initial_state: |
  JVM flags at /app/jvm.options leave direct memory unbounded; an NIO path leaks direct buffers until 'OutOfMemoryError: Direct buffer memory'.
hints:
  - order: 1
    cost: 10
    content: "The OOM names 'Direct buffer memory' — this is native/off-heap, not the Java heap."
  - order: 2
    cost: 15
    content: "Set -XX:MaxDirectMemorySize=256m so the leak fails fast and is visible."
  - order: 3
    cost: 20
    content: "Release buffers (ReferenceCountUtil.release / pooled allocator) instead of relying on GC."
