  instructions: 'Implement formatLog(level, msg) → `[LEVEL] msg` with level uppercased.

    Click Run to try it, then Check Solution to grade.

    '
  files:
  - path: solution.js
    content: "function formatLog(level, msg) {\n  // TODO\n}\n"
    readonly: false
  visible_tests:
  - name: info
    code: assert(formatLog('info', 'hi') === '[INFO] hi');
  hidden_tests:
  - name: err
    code: assert(formatLog('error', 'x') === '[ERROR] x');
  - name: n
    code: assert(formatLog('debug', 'n7') === '[DEBUG] n7');
  - name: s89_case_2
    code: assert(typeof formatLog === "function" || typeof formatLog !== "undefined");
  - name: s89_case_3
    code: assert(true);
