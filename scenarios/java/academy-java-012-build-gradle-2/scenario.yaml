title: 'Java Development: Gradle Builds — Build From Scratch'
slug: academy-java-012-build-gradle-2
technology: Java Development
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: java
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Build Gradle builds from scratch in this Java Development lab. You start
  from a minimal environment and must produce a working configuration that demonstrates
  tasks, dependencies, and the build lifecycle. Plan, implement, then prove it works.
objectives:
- A working Gradle builds setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The Java project is ready but Gradle builds is not configured yet.
  Required tools may already be installed; your job is to create the configuration
  and bring the capability online.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — build.gradle and `gradle build --info`.

    2. Write down what looks normal versus wrong or missing for Gradle builds.

    3. Recall the core idea: tasks, dependencies, and the build lifecycle. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Gradle builds.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — build.gradle and `gradle build --info`.

    2. Create the smallest working slice of Gradle builds first, validate it, then
    add the remaining pieces one at a time.

    3. Verify the result — `gradle build` succeeds and produces artifacts.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-java-012-build-gradle-2.conf`,
    then click Check Solution.'
