description: 'CONTEXT: A team operating Java applications needs you to resolve `Expired CA in Truststore
  Breaks Outbound TLS` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml points at a truststore whose
  CA has expired; outbound TLS fails CertificateExpiredException. Outbound HTTPS suddenly fails with ''java.security.cert.CertificateExpiredException''
  / ''NotAfter'' during handshake validation. A CA certificate in the application truststore has expired
  (or the pinned leaf rotated), so the chain no longer validates. Refresh the truststore with the current
  CA so TLS works again.


  OBJECTIVE: Reproduce the handshake failure and confirm it is certificate expiry; Identify the expired
  CA/cert in the truststore; Import the renewed CA and remove the expired entry. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the handshake failure and confirm it is certificate expiry
- Identify the expired CA/cert in the truststore
- Import the renewed CA and remove the expired entry
- Verify the outbound TLS handshake succeeds
