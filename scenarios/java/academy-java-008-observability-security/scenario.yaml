title: 'Java Development: Application Security — Observability Practice'
slug: academy-java-008-observability-security
technology: Java Development
category: Observability
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: java
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Observability task: make application security visible in logs, metrics,
  or traces. On-call should answer ''what is broken?'' quickly using signals from
  input validation, headers, and authz.'
objectives:
- Day-2 application security work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but application security lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — request handling and security headers.

    2. Write down what looks normal versus wrong or missing for application security.

    3. Recall the core idea: input validation, headers, and authz. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for application security.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — request handling and security headers.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a
    sensible threshold.

    3. Verify the result — inputs are validated and headers are set.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-java-008-observability-security.conf`,
    then click Check Solution.'
