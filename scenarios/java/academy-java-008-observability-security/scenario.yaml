description: 'Observability task: make application security visible in logs, metrics,
  or traces. On-call should answer ''what is broken?'' quickly using signals from
  input validation, headers, and authz.'
objectives:
- Day-2 application security work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but application security lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 10
  content: 'Find existing signals: request handling and security headers. Identify
    what is missing for fast triage.'
- order: 2
  cost: 15
  content: Add or fix exporters/dashboards/alerts with clear names, labels, and thresholds.
- order: 3
  cost: 20
  content: Trigger a test event and confirm it appears where on-call looks. Complete
    via `/opt/fixitlab/academy/academy-java-008-observability-security.conf`.
