description: 'CONTEXT: A team operating Java applications needs you to resolve `Maven Surefire Runs Zero
  Tests (Green But Untested)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: POM at /app/pom.xml has a surefire include pattern that misses the test classes
  and no junit-jupiter engine; mvn test runs 0 tests. CI reports BUILD SUCCESS but ''Tests run: 0'' —
  the test suite never executes, so regressions ship unnoticed. The surefire plugin''s include pattern
  does not match the JUnit 5 test class naming, and the JUnit platform engine is missing. Fix the surefire
  configuration so tests actually run.


  OBJECTIVE: Confirm surefire reports zero tests run despite tests existing; Align surefire <includes>
  with the test class naming; Ensure the JUnit platform/engine dependency is present. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm surefire reports zero tests run despite tests existing
- Align surefire <includes> with the test class naming
- Ensure the JUnit platform/engine dependency is present
- Verify the real test count is now executed
