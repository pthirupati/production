slug: jpa-n-plus-1
title: "Hibernate N+1 Query Problem — API Response Time 10x Slower"
technology: Java
category: Database
difficulty: hard
time_limit: 1500
max_score: 100
lab_mode: simulation
simulation_type: java
infrastructure_type: simulation
jira_priority: High
is_free: false
description: |
  A REST endpoint GET /api/orders that returns a list of orders with their associated
  items is taking 8-12 seconds with 200 orders. Enabling Hibernate SQL logging reveals
  201 SELECT queries being fired: 1 for orders, then 1 additional query per order to
  fetch items. This classic N+1 problem occurs because the Order.items collection is
  LAZY-loaded. Engineers must fix this using JOIN FETCH or @BatchSize.
objectives:
  - Enable Hibernate SQL logging and count the queries fired per request
  - Identify the LAZY-loaded association causing N+1 queries
  - Fix with either a JOIN FETCH JPQL query or @BatchSize(size=25) on the collection
  - Verify the request now fires 1-2 queries instead of N+1
initial_state: |
  Simulated server. Spring Boot app with JPA/Hibernate. Postgres backend.
  Source at /opt/app/src/main/java/com/app/.
  OrderRepository.java has a findAll() call. Order.java has @OneToMany LAZY items.
hints:
  - order: 1
    cost: 10
    content: "Enable SQL logging in application.yml:
      spring.jpa.show-sql: true
      spring.jpa.properties.hibernate.format_sql: true
      Then call the endpoint and count the SELECT statements in the log."
  - order: 2
    cost: 15
    content: "In OrderRepository.java, replace the findAll() call with a custom query:
      @Query(\"SELECT o FROM Order o JOIN FETCH o.items\")
      List<Order> findAllWithItems();
      This loads everything in a single JOIN query."
  - order: 3
    cost: 20
    content: "Alternatively, in Order.java annotate the collection:
      @BatchSize(size = 25)
      @OneToMany(mappedBy = \"order\", fetch = FetchType.LAZY)
      private List<OrderItem> items;
      Hibernate will batch the lazy loads into groups of 25, reducing N queries to N/25."
