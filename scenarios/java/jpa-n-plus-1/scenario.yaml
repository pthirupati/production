description: 'CONTEXT: A team operating Java applications needs you to resolve `JPA N+1 Query Storm Hammering
  the Database` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml has SQL logging off; the
  order-list path lazily loads line items, producing an N+1 query storm. Listing orders triggers hundreds
  of SQL queries: one for the orders plus one per order for its line items (the classic N+1 problem from
  lazy associations). The database is saturated and the endpoint is slow. Fetch the association eagerly
  for this query path with a JOIN FETCH / entity graph and enable SQL logging to prove it.


  OBJECTIVE: Enable SQL logging and confirm 1 + N queries per list call; Identify the lazily-loaded association
  causing the per-row queries; Use JOIN FETCH or an @EntityGraph to batch the load. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Enable SQL logging and confirm 1 + N queries per list call
- Identify the lazily-loaded association causing the per-row queries
- Use JOIN FETCH or an @EntityGraph to batch the load
- Verify the list endpoint now issues a small constant number of queries
