slug: jpa-n-plus-1
title: "JPA N+1 Query Storm Hammering the Database"
technology: Java
category: "Spring Data JPA"
difficulty: hard
time_limit: 1200
max_score: 100
lab_mode: simulation
simulation_type: java
infrastructure_type: simulation
jira_priority: High
is_free: false
description: |
  Listing orders triggers hundreds of SQL queries: one for the orders plus one per order for its line items (the classic N+1 problem from lazy associations). The database is saturated and the endpoint is slow. Fetch the association eagerly for this query path with a JOIN FETCH / entity graph and enable SQL logging to prove it.
objectives:
  - "Enable SQL logging and confirm 1 + N queries per list call"
  - "Identify the lazily-loaded association causing the per-row queries"
  - "Use JOIN FETCH or an @EntityGraph to batch the load"
  - "Verify the list endpoint now issues a small constant number of queries"
initial_state: |
  Config at /app/src/main/resources/application.yml has SQL logging off; the order-list path lazily loads line items, producing an N+1 query storm.
hints:
  - order: 1
    cost: 10
    content: "Turn on spring.jpa.show-sql / hibernate SQL logging and count the queries per request."
  - order: 2
    cost: 15
    content: "Add a query with 'JOIN FETCH o.lineItems' or annotate the repo method @EntityGraph."
  - order: 3
    cost: 20
    content: "Or set hibernate.default_batch_fetch_size to batch lazy loads; confirm queries drop."
