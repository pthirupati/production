description: 'CONTEXT: A team operating Java applications needs you to resolve `JDBC Connection Leak Exhausts
  the Pool` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: ReportDao at /app/src/main/java/com/example/repo/ReportDao.java closes JDBC
  resources only on success, leaking a connection on every error. Over hours the connection pool drains
  to zero and the app hangs acquiring connections. A DAO opens a JDBC Connection/Statement/ResultSet but
  only closes them on the happy path, so any exception leaks a connection permanently. Make resource handling
  leak-proof with try-with-resources so connections always return to the pool.


  OBJECTIVE: Observe the pool''s active count climb and never recover; Find the DAO path that leaks connections
  on exceptions; Convert to try-with-resources so resources always close. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Observe the pool's active count climb and never recover
- Find the DAO path that leaks connections on exceptions
- Convert to try-with-resources so resources always close
- Verify active connections return to baseline after load
