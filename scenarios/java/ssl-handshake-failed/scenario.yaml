slug: ssl-handshake-failed
title: "SSL Handshake Failure — Untrusted Certificate Chain"
technology: Java
category: "Java Security"
difficulty: hard
time_limit: 1200
max_score: 100
lab_mode: simulation
simulation_type: java
infrastructure_type: simulation
jira_priority: High
is_free: false
description: |
  An outbound HTTPS call fails with 'PKIX path building failed: unable to find valid certification path to requested target'. The remote endpoint presents a certificate signed by a CA that is not in the JVM/app truststore. Add the trusted CA to a proper truststore and point the app at it (without disabling verification).
objectives:
  - "Reproduce the PKIX handshake failure on the outbound call"
  - "Identify the missing CA / intermediate in the presented chain"
  - "Import the CA into a truststore and configure the app to use it"
  - "Verify the HTTPS call succeeds with verification still enabled"
initial_state: |
  Config at /app/src/main/resources/application.yml points at a truststore that does not contain the remote CA; the HTTPS call fails PKIX path building.
hints:
  - order: 1
    cost: 10
    content: "openssl s_client -connect host:443 -showcerts dumps the chain the server presents."
  - order: 2
    cost: 15
    content: "Import the CA: keytool -importcert -keystore truststore.jks -alias remote-ca -file ca.pem."
  - order: 3
    cost: 20
    content: "Point javax.net.ssl.trustStore at it — never set a trust-all manager in prod."
