description: 'CONTEXT: A team operating Java applications needs you to resolve `SSL Handshake Failure
  — Untrusted Certificate Chain` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml points at a truststore that
  does not contain the remote CA; the HTTPS call fails PKIX path building. An outbound HTTPS call fails
  with ''PKIX path building failed: unable to find valid certification path to requested target''. The
  remote endpoint presents a certificate signed by a CA that is not in the JVM/app truststore. Add the
  trusted CA to a proper truststore and point the app at it (without disabling verification).


  OBJECTIVE: Reproduce the PKIX handshake failure on the outbound call; Identify the missing CA / intermediate
  in the presented chain; Import the CA into a truststore and configure the app to use it. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the PKIX handshake failure on the outbound call
- Identify the missing CA / intermediate in the presented chain
- Import the CA into a truststore and configure the app to use it
- Verify the HTTPS call succeeds with verification still enabled
