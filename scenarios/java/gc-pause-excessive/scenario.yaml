description: 'CONTEXT: A team operating Java applications needs you to resolve `Excessive GC Pauses Causing
  Request Latency Spikes` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: JVM flags at /app/jvm.options select -XX:+UseParallelGC with -Xmx512m; GC
  logs show frequent multi-second Full GC pauses under load. A service shows multi-second p99 latency
  spikes that correlate with full GC pauses. The JVM is running the throughput (Parallel) collector with
  an undersized heap, so stop-the-world full collections stall every request. Switch to a low-pause collector
  (G1/ZGC) and right-size the heap to flatten the pause profile.


  OBJECTIVE: Enable GC logging and confirm long stop-the-world full GC pauses; Select a low-pause collector
  appropriate for the heap size; Set a sane max heap and a pause-time goal in jvm.options. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Enable GC logging and confirm long stop-the-world full GC pauses
- Select a low-pause collector appropriate for the heap size
- Set a sane max heap and a pause-time goal in jvm.options
- Verify p99 latency no longer correlates with GC pauses
