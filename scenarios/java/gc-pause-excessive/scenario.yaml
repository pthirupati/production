slug: gc-pause-excessive
title: "Excessive GC Pauses Causing Request Latency Spikes"
technology: Java
category: "JVM Performance"
difficulty: hard
time_limit: 1200
max_score: 100
lab_mode: simulation
simulation_type: java
infrastructure_type: simulation
jira_priority: High
is_free: false
description: |
  A service shows multi-second p99 latency spikes that correlate with full GC pauses. The JVM is running the throughput (Parallel) collector with an undersized heap, so stop-the-world full collections stall every request. Switch to a low-pause collector (G1/ZGC) and right-size the heap to flatten the pause profile.
objectives:
  - "Enable GC logging and confirm long stop-the-world full GC pauses"
  - "Select a low-pause collector appropriate for the heap size"
  - "Set a sane max heap and a pause-time goal in jvm.options"
  - "Verify p99 latency no longer correlates with GC pauses"
initial_state: |
  JVM flags at /app/jvm.options select -XX:+UseParallelGC with -Xmx512m; GC logs show frequent multi-second Full GC pauses under load.
hints:
  - order: 1
    cost: 10
    content: "Add -Xlog:gc*:file=gc.log and look for long 'Pause Full' events."
  - order: 2
    cost: 15
    content: "Use -XX:+UseG1GC with -XX:MaxGCPauseMillis=200 for a low-pause profile."
  - order: 3
    cost: 20
    content: "Right-size the heap (e.g. -Xms2g -Xmx2g) so the collector is not thrashing."
