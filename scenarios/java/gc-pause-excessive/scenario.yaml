---
slug: gc-pause-excessive
title: "Excessive GC Pauses — P99 Latency Spikes Over 2 Seconds"
technology: Java
category: JVM Tuning
difficulty: hard
time_limit: 1800
max_score: 100
lab_mode: simulation
simulation_type: java
infrastructure_type: simulation
jira_priority: High
is_free: false
description: |
  A low-latency order-processing service is experiencing P99 latency spikes every
  few minutes. GC logs show stop-the-world Full GC pauses of 600ms-2s. The service
  is running with the default GC (G1GC) but with settings tuned for throughput rather
  than low latency. Engineers must analyze GC logs, switch to ZGC or tune G1GC
  pause targets, and verify pause times drop below 200ms.
objectives:
  - Analyze /opt/app/logs/gc.log and identify the pause time pattern
  - Switch from G1GC default to ZGC or tune G1GC with -XX:MaxGCPauseMillis=200
  - Add GC logging flags to capture pause duration metrics
  - Verify P99 GC pause time is under 200ms after the change
initial_state: |
  Simulated server. Application running with: -XX:+UseG1GC -Xmx4g -Xms4g.
  GC log at /opt/app/logs/gc.log shows frequent Full GC events.
  JVM startup config is at /opt/app/start.sh.
hints:
  - order: 1
    cost: 10
    content: "Run: grep 'Pause Full' /opt/app/logs/gc.log | tail -20 to see recent
      Full GC pause durations. Look for values >500ms."
  - order: 2
    cost: 15
    content: "For ZGC, change the startup flags to: -XX:+UseZGC -Xmx4g -Xms4g
      -Xlog:gc*:file=/opt/app/logs/gc.log:time,uptime:filecount=5,filesize=20m
      ZGC targets sub-millisecond pauses."
  - order: 3
    cost: 20
    content: "Alternatively tune G1GC: add -XX:MaxGCPauseMillis=200 and
      -XX:G1HeapRegionSize=16m. Also check for large object allocations
      causing humongous object regions with: grep 'Humongous' /opt/app/logs/gc.log"
