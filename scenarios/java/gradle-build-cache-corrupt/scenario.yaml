description: |
  Gradle builds fail intermittently with cache/lock errors ('Could not unpack', 'Timeout waiting to lock', corrupt cache entries) after a build was killed mid-write. The shared build cache and daemon state are poisoned. Clear the corrupt cache safely and re-enable a healthy cache configuration.
objectives:
  - "Reproduce the cache/lock failure and identify the poisoned cache dir"
  - "Stop running daemons and clear the corrupt cache safely"
  - "Restore a valid build cache configuration in gradle.properties"
  - "Run a clean build that succeeds and re-populates the cache"
initial_state: |
  Gradle config at /root/.gradle/gradle.properties enables the build cache but the cache is corrupt; builds fail with unpack/lock errors.
hints:
  - order: 1
    cost: 10
    content: "Read the failure — 'Could not unpack' / 'Timeout waiting to lock' points at the cache."
  - order: 2
    cost: 15
    content: "Stop daemons (gradle --stop) and remove the poisoned ~/.gradle/caches entries."
  - order: 3
    cost: 20
    content: "Keep org.gradle.caching=true but on a clean cache; re-run ./gradlew build."
