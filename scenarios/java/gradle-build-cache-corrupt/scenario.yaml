description: |
  A Gradle 8.x build has started failing with cryptic errors: "Could not resolve
  com.example:library:1.2.3" and "error: zip file is empty" on the :compileJava task.
  The project was building fine yesterday. The Gradle local build cache and dependency
  cache have become corrupted, likely due to a disk-full event that interrupted a
  previous build. Engineers must clean the corrupt cache and rebuild from scratch.
objectives:
  - Reproduce the build failure and read the full error output
  - Identify the corrupt cache entries causing the failure
  - Clean the Gradle build cache and local dependency cache
  - Run a clean build to verify all tasks pass
initial_state: |
  Simulated build server. Gradle project at /opt/project/.
  Gradle wrapper at /opt/project/gradlew. Build cache in ~/.gradle/caches/.
  Running ./gradlew build fails with zip/corrupt file errors.
hints:
  - order: 1
    cost: 10
    content: "Run: cd /opt/project && ./gradlew build --stacktrace 2>&1 | head -50
      to see the full error. Look for 'zip file is empty' or 'corrupt' in the output."
  - order: 2
    cost: 15
    content: "Clean the project build directory and Gradle caches:
      ./gradlew clean
      rm -rf ~/.gradle/caches/
      rm -rf ~/.gradle/build-cache/
      This removes all cached artifacts."
  - order: 3
    cost: 20
    content: "After clearing caches, run: ./gradlew build --refresh-dependencies
      The --refresh-dependencies flag forces Gradle to re-download all dependencies
      instead of using any cached versions. This ensures a clean resolution."
