description: 'CONTEXT: A team operating Java applications needs you to resolve `Corrupt Gradle Build Cache
  Failing the Build` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Gradle config at /root/.gradle/gradle.properties enables the build cache but
  the cache is corrupt; builds fail with unpack/lock errors. Gradle builds fail intermittently with cache/lock
  errors (''Could not unpack'', ''Timeout waiting to lock'', corrupt cache entries) after a build was
  killed mid-write. The shared build cache and daemon state are poisoned. Clear the corrupt cache safely
  and re-enable a healthy cache configuration.


  OBJECTIVE: Reproduce the cache/lock failure and identify the poisoned cache dir; Stop running daemons
  and clear the corrupt cache safely; Restore a valid build cache configuration in gradle.properties.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the cache/lock failure and identify the poisoned cache dir
- Stop running daemons and clear the corrupt cache safely
- Restore a valid build cache configuration in gradle.properties
- Run a clean build that succeeds and re-populates the cache
