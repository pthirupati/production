title: 'Java Development: Junit — Troubleshooting Drill'
slug: academy-java-084-troubleshoot-junit-9
technology: Java Development
category: Troubleshooting
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: java
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: regressions ship without test coverage. You are on
  call for Java Development and must troubleshoot JUnit methodically — triage symptoms,
  isolate root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: regressions ship without test coverage'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Java project is degraded. Regressions ship without test coverage.
  Recent changes may exist around JUnit, but do not restart blindly — gather evidence
  first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — test classes and surefire reports.

    2. Write down what looks normal versus wrong or missing for JUnit.

    3. Recall the core idea: tests, assertions, and lifecycle. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for JUnit.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — test classes and surefire reports.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — tests cover the change and pass.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-java-084-troubleshoot-junit-9.conf`,
    then click Check Solution.'
