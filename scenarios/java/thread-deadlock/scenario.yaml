description: 'CONTEXT: A team operating Java applications needs you to resolve `Thread Pool Starvation
  From a Synchronized Bottleneck` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Code at /app/src/main/java/com/example/CacheManager.java holds a synchronized
  lock across a slow refresh; worker threads block en masse. The request thread pool is exhausted and
  latency climbs to timeouts. A coarse synchronized block around a cache refresh serializes every request
  behind one slow I/O call, so all worker threads pile up waiting on the same monitor. Narrow the critical
  section (or use a concurrent structure) so threads stop starving.


  OBJECTIVE: Capture a thread dump and see many threads BLOCKED on one monitor; Locate the over-broad
  synchronized region doing slow work under the lock; Move slow I/O out of the lock / use a concurrent
  cache. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Capture a thread dump and see many threads BLOCKED on one monitor
- Locate the over-broad synchronized region doing slow work under the lock
- Move slow I/O out of the lock / use a concurrent cache
- Verify threads are no longer blocked and latency recovers
