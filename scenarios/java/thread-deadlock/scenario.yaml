description: |
  The request thread pool is exhausted and latency climbs to timeouts. A coarse synchronized block around a cache refresh serializes every request behind one slow I/O call, so all worker threads pile up waiting on the same monitor. Narrow the critical section (or use a concurrent structure) so threads stop starving.
objectives:
  - "Capture a thread dump and see many threads BLOCKED on one monitor"
  - "Locate the over-broad synchronized region doing slow work under the lock"
  - "Move slow I/O out of the lock / use a concurrent cache"
  - "Verify threads are no longer blocked and latency recovers"
initial_state: |
  Code at /app/src/main/java/com/example/CacheManager.java holds a synchronized lock across a slow refresh; worker threads block en masse.
hints:
  - order: 1
    cost: 10
    content: "jstack shows N threads BLOCKED waiting to lock the same <CacheManager> monitor."
  - order: 2
    cost: 15
    content: "Do the slow load OUTSIDE the lock; only synchronize the brief map update."
  - order: 3
    cost: 20
    content: "Better: use ConcurrentHashMap.computeIfAbsent / a loading cache to avoid the global lock."
