description: 'CONTEXT: A team operating Java applications needs you to resolve `TLSv1.0/1.1 Still Enabled
  — Harden the TLS Protocols` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml leaves server.ssl.enabled-protocols
  unset; the connector still allows TLSv1.0/1.1. A security scan flags the service for negotiating deprecated
  TLSv1.0/1.1 and weak cipher suites. The connector does not pin enabled-protocols, so the JVM accepts
  legacy protocols. Restrict the server to TLSv1.2/1.3 and a strong cipher list so the handshake rejects
  downgrades.


  OBJECTIVE: Confirm the server still negotiates TLSv1.0/1.1; Pin enabled-protocols to TLSv1.2 and TLSv1.3
  only; Restrict to strong cipher suites. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the server still negotiates TLSv1.0/1.1
- Pin enabled-protocols to TLSv1.2 and TLSv1.3 only
- Restrict to strong cipher suites
- Verify a TLSv1.0 handshake is now refused
