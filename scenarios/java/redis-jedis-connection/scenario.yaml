description: |
  Under load the app throws 'JedisException: Could not get a resource from the pool'. Connections are borrowed from the Jedis pool but never returned (missing try-with-resources) and the pool max is tiny, so it exhausts. Fix the leak and size the pool so Redis access is reliable under concurrency.
objectives:
  - "Reproduce the pool-exhaustion exception under load"
  - "Find the code path that borrows but never returns a Jedis resource"
  - "Ensure every borrow is returned (try-with-resources/finally)"
  - "Right-size the pool max and verify no exhaustion under load"
initial_state: |
  Config at /app/src/main/resources/application.yml sets a max pool of 2 and the code leaks borrowed connections; the pool exhausts under load.
hints:
  - order: 1
    cost: 10
    content: "'Could not get a resource from the pool' = leaked connections or an undersized pool."
  - order: 2
    cost: 15
    content: "Wrap jedisPool.getResource() in try-with-resources so it is always returned."
  - order: 3
    cost: 20
    content: "Raise jedis max-active to match concurrency and re-test under load."
