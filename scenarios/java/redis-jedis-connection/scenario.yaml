description: 'CONTEXT: A team operating Java applications needs you to resolve `Jedis Pool Exhausted —
  Could Not Get a Connection` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml sets a max pool of 2 and
  the code leaks borrowed connections; the pool exhausts under load. Under load the app throws ''JedisException:
  Could not get a resource from the pool''. Connections are borrowed from the Jedis pool but never returned
  (missing try-with-resources) and the pool max is tiny, so it exhausts. Fix the leak and size the pool
  so Redis access is reliable under concurrency.


  OBJECTIVE: Reproduce the pool-exhaustion exception under load; Find the code path that borrows but never
  returns a Jedis resource; Ensure every borrow is returned (try-with-resources/finally). Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
