description: 'CONTEXT: A team operating Java applications needs you to resolve `Scheduled Job Never Fires
  (@Scheduled Not Enabled)` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: CleanupJob at /app/src/main/java/com/example/jobs/CleanupJob.java has @Scheduled
  but the app lacks @EnableScheduling and the cron string is invalid. A nightly cleanup never runs: the
  @Scheduled method exists but the application never enabled scheduling (@EnableScheduling is missing)
  and the cron expression is malformed, so the task is silently ignored. Enable scheduling and fix the
  cron so the job fires on time.


  OBJECTIVE: Confirm the @Scheduled task never executes; Enable scheduling on a configuration class; Correct
  the cron expression to the intended schedule. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
