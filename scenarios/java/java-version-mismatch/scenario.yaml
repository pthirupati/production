description: 'CONTEXT: A team operating Java applications needs you to resolve `UnsupportedClassVersionError
  — Compiled for a Newer JDK` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: POM at /app/pom.xml sets maven.compiler.release above the JRE used to run
  the app, producing UnsupportedClassVersionError at startup. The app crashes at startup with ''UnsupportedClassVersionError:
  ... has been compiled by a more recent version of the Java Runtime (class file version 61.0), this version
  of the Java Runtime only recognizes class file versions up to 55.0''. The build targets a newer bytecode
  level than the runtime JRE. Align the compiler release with the runtime.


  OBJECTIVE: Decode the class file version error to source/target JDK levels; Set the Maven compiler release
  to match the runtime JRE; Rebuild so bytecode targets the supported version. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Decode the class file version error to source/target JDK levels
- Set the Maven compiler release to match the runtime JRE
- Rebuild so bytecode targets the supported version
- Verify the app starts without the version error
