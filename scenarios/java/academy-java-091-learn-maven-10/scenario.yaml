technology: Java Development
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: java
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly Java Development lab introduces Maven builds.
  You will explore POM structure, dependencies, plugins, and lifecycle phases on the
  Java project. Read the environment first, then complete the guided steps — no prior
  production experience required.
objectives:
- Understand how Maven builds work in this lab environment
- Identify the main status and configuration signals for Maven builds
- Confirm you can read the current state confidently before changing anything
initial_state: The Java project is online with a starter Maven builds setup. Some
  pieces are intentionally incomplete so you can learn how the pieces fit together.
  Nothing is on fire yet — focus on observation and understanding.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself: `mvn -q dependency:tree`, surefire reports, and pom.xml.
    Write down what looks normal vs missing.'
- order: 2
  cost: 15
  content: Core idea — POM structure, dependencies, plugins, and lifecycle phases.
    Make one small, reversible change at a time and re-check status.
- order: 3
  cost: 20
  content: When the lab objective is done, record completion by adding `# FIXED-OK`
    to `/opt/fixitlab/academy/academy-java-091-learn-maven-10.conf`, then click Check
    Solution.
