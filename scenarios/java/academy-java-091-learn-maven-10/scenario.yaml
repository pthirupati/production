description: 'CONTEXT: A team operating Java applications needs you to resolve `java: Maven Builds — Fundamentals
  Lab` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Java project is online with a starter Maven builds setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
  This beginner-friendly java lab introduces Maven builds. You will explore POM structure, dependencies,
  plugins, and lifecycle phases on the Java project. Read the environment first, then follow the guided
  steps — no prior production experience required.


  OBJECTIVE: Understand how Maven builds work in this lab environment; Identify the main status and configuration
  signals for Maven builds; Confirm you can read the current state confidently before changing anything.
  Success means `systemctl is-active nginx` returns active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how Maven builds work in this lab environment
- Identify the main status and configuration signals for Maven builds
- Confirm you can read the current state confidently before changing anything
initial_state: The Java project is online with a starter Maven builds setup. Some pieces are intentionally
  incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `mvn -q dependency:tree`, surefire reports, and pom.xml.

    2. Write down what looks normal versus wrong or missing for Maven builds.

    3. Recall the core idea: POM structure, dependencies, plugins, and lifecycle phases. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify the main status and configuration signals for Maven builds

    2. Confirm you can read the current state confidently before changing anything'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `mvn -q dependency:tree`, surefire reports, and pom.xml.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — `mvn verify` succeeds and artifacts are produced in target/.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
