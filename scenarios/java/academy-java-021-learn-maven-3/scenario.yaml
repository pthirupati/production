    code: assert(parseMavenCoord('only:two') === null);
  - name: n
    code: assert(parseMavenCoord('g:a:3.0').version === '3.0');
  - name: s89_case_2
    code: assert(typeof parseMavenCoord === "function" || typeof parseMavenCoord !== "undefined");
  - name: s89_case_3
