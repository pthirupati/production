    Click Run to try it, then Check Solution to grade.

    '
  files:
  - path: solution.js
    content: "function parseMavenCoord(s) {\n  // TODO\n}\n"
    readonly: false
  visible_tests:
  - name: basic
    code: const p=parseMavenCoord('com.acme:app:1.0.0'); assert(p && p.group==='com.acme'
      && p.artifact==='app' && p.version==='1.0.0');
  hidden_tests:
