description: 'CONTEXT: A team operating Java applications needs you to resolve `TLS Keystore Password
  Wrong — Server Won''t Start HTTPS` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml sets the wrong key-store-password;
  the TLS connector fails with ''keystore password was incorrect''. Enabling HTTPS fails at startup with
  ''keystore password was incorrect'' / ''Cannot recover key''. The configured key-store-password (or
  key-password) does not match the keystore, so the connector cannot load the private key. Correct the
  keystore/key passwords (and type) so the TLS connector starts.


  OBJECTIVE: Reproduce the keystore password failure at startup; Verify the keystore type and the correct
  passwords; Set matching key-store-password / key-password. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the keystore password failure at startup
- Verify the keystore type and the correct passwords
- Set matching key-store-password / key-password
- Confirm the HTTPS connector starts and serves TLS
