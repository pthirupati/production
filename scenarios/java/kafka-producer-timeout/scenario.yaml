description: |
  The Kafka producer fails with 'TimeoutException: Expiring records' / 'Failed to update metadata'. The bootstrap servers list points at a stale broker address and the request/delivery timeouts are too aggressive for the network path. Correct the bootstrap config and timeouts so records are delivered reliably.
objectives:
  - "Reproduce the producer TimeoutException and read the broker it tried"
  - "Fix bootstrap.servers to reachable, correct broker addresses"
  - "Tune delivery/request timeouts and retries appropriately"
  - "Confirm sends succeed and records land on the topic"
initial_state: |
  Producer config at /app/src/main/resources/application.yml points bootstrap.servers at a decommissioned broker and uses very short timeouts; send() times out.
hints:
  - order: 1
    cost: 10
    content: "Logs show 'Failed to update metadata' — the broker address is wrong/unreachable."
  - order: 2
    cost: 15
    content: "Set spring.kafka.bootstrap-servers to the live brokers and verify with kafka-topics."
  - order: 3
    cost: 20
    content: "Raise delivery.timeout.ms / request.timeout.ms and set retries so transient blips recover."
