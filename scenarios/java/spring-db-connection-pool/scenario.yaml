description: 'CONTEXT: A team operating Java applications needs you to resolve `HikariCP Pool Exhausted
  — Connection Is Not Available` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml sets Hikari maximum-pool-size
  to 1; under load requests time out waiting for a connection. Requests fail with ''HikariPool-1 - Connection
  is not available, request timed out''. The Hikari maximum-pool-size is far too small for the concurrency
  and a slow query holds connections, so the pool starves. Size the pool and connection timeout correctly
  and address the long-held connection so the app stops timing out.


  OBJECTIVE: Reproduce the Hikari connection-timeout under load; Right-size maximum-pool-size for the
  real concurrency; Set a sane connection-timeout and detect leaks. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the Hikari connection-timeout under load
- Right-size maximum-pool-size for the real concurrency
- Set a sane connection-timeout and detect leaks
- Verify requests stop timing out under load
