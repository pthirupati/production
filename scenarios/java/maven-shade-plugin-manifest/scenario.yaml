description: 'CONTEXT: A team operating Java applications needs you to resolve `Shaded Uber-JAR Has No
  Main-Class Manifest` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: POM at /app/pom.xml configures maven-shade-plugin without a manifest transformer;
  the uber-jar has no Main-Class. java -jar app.jar fails with ''no main manifest attribute, in app.jar''.
  The maven-shade-plugin builds an uber-jar but no ManifestResourceTransformer sets Main-Class, so the
  JAR is not runnable. Configure the shade transformer (and service-file merging) so the packaged JAR
  launches.


  OBJECTIVE: Reproduce ''no main manifest attribute'' running the JAR; Add the ManifestResourceTransformer
  with the Main-Class; Merge service files (ServicesResourceTransformer) to avoid SPI breakage. Success
  means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
