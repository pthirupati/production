description: 'CONTEXT: A team operating Java applications needs you to resolve `OutOfMemoryError: Metaspace
  From Classloader Leak` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: JVM flags at /app/jvm.options leave Metaspace unbounded; repeated redeploys
  leak classloaders until ''OutOfMemoryError: Metaspace''. After repeated hot redeploys the JVM throws
  java.lang.OutOfMemoryError: Metaspace. Old application classloaders are never collected (a classloader
  leak), so loaded class metadata accumulates in Metaspace. Cap Metaspace to surface the leak early and
  address the retained classloaders.


  OBJECTIVE: Confirm the OOM is Metaspace (not heap) and that class count keeps rising; Set a Metaspace
  size cap so the leak is bounded and visible; Identify the retained classloaders / static references
  pinning old classes. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm the OOM is Metaspace (not heap) and that class count keeps rising
- Set a Metaspace size cap so the leak is bounded and visible
- Identify the retained classloaders / static references pinning old classes
- Verify Metaspace stabilizes across redeploys
