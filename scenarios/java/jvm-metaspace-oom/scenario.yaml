jira_priority: High
is_free: false
description: |
  After repeated hot redeploys the JVM throws java.lang.OutOfMemoryError: Metaspace. Old application classloaders are never collected (a classloader leak), so loaded class metadata accumulates in Metaspace. Cap Metaspace to surface the leak early and address the retained classloaders.
objectives:
  - "Confirm the OOM is Metaspace (not heap) and that class count keeps rising"
  - "Set a Metaspace size cap so the leak is bounded and visible"
  - "Identify the retained classloaders / static references pinning old classes"
  - "Verify Metaspace stabilizes across redeploys"
initial_state: |
  JVM flags at /app/jvm.options leave Metaspace unbounded; repeated redeploys leak classloaders until 'OutOfMemoryError: Metaspace'.
hints:
  - order: 1
    cost: 10
    content: "jcmd <pid> GC.class_stats / VM.metaspace shows class metadata climbing each redeploy."
  - order: 2
    cost: 15
    content: "Add -XX:MaxMetaspaceSize=256m so the leak fails fast instead of swallowing all memory."
  - order: 3
    cost: 20
    content: "Find static refs / thread-locals pinning old classloaders and release them on shutdown."
