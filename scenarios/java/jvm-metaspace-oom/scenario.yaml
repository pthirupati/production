slug: jvm-metaspace-oom
title: "Metaspace OOM — ClassLoader Leak Exhausting Native Memory"
technology: Java
category: JVM Tuning
difficulty: hard
time_limit: 1500
max_score: 100
lab_mode: simulation
simulation_type: java
infrastructure_type: simulation
jira_priority: Critical
is_free: false
description: |
  A Java EE application running on OpenJDK 17 is crashing every 4-6 hours with:
  java.lang.OutOfMemoryError: Metaspace. A memory analysis reveals a custom
  ClassLoader is loading duplicate classes on each web request without being garbage
  collected. The Metaspace limit is also unconfigured, allowing unbounded growth.
  Engineers must diagnose the leak with jstat, cap Metaspace, and fix the ClassLoader.
objectives:
  - Use jstat -gcmetacapacity <pid> to observe Metaspace growth over time
  - Identify the leaking ClassLoader class in the heap dump
  - Add -XX:MaxMetaspaceSize=256m to cap Metaspace and force earlier GC
  - Patch the ClassLoader to reuse instances instead of creating per-request
initial_state: |
  Simulated server. The application PID is available at /var/run/app.pid.
  A heap dump is available at /opt/app/heapdump.hprof for offline analysis.
  jstat and jmap are installed and on PATH.
hints:
  - order: 1
    cost: 10
    content: "Run: jstat -gcmetacapacity $(cat /var/run/app.pid) 1000 20 to watch
      Metaspace consumption grow. Compare MCMX and MC columns."
  - order: 2
    cost: 15
    content: "Use jmap -histo:live $(cat /var/run/app.pid) | head -30 to list object
      counts. Look for many instances of your custom ClassLoader class."
  - order: 3
    cost: 20
    content: "Add -XX:MaxMetaspaceSize=256m to /opt/app/start.sh. This alone will
      trigger GC sooner but the root cause is the ClassLoader leak in
      /opt/app/src/RequestClassLoader.java — change it to a singleton."
