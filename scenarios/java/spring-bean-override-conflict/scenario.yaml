  - "Decide which bean should win and why"
  - "Rename/qualify or mark @Primary to disambiguate"
  - "Confirm the context starts with one unambiguous bean"
initial_state: |
  Config at /app/src/main/resources/application.yml plus a second @Configuration declare the same bean name; startup fails because overriding is disabled.
hints:
  - order: 1
