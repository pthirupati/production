description: 'CONTEXT: A team operating Java applications needs you to resolve `Duplicate Bean Definition
  — Overriding Disabled` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml plus a second @Configuration
  declare the same bean name; startup fails because overriding is disabled. Startup fails with ''A bean
  with that name has already been defined and overriding is disabled'' (Spring Boot 2.1+ default). Two
  configurations declare the same bean name. Decide the correct resolution — rename/qualify the bean or
  mark the intended one @Primary — rather than blindly re-enabling overriding.


  OBJECTIVE: Read the error and find the two conflicting bean definitions; Decide which bean should win
  and why; Rename/qualify or mark @Primary to disambiguate. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Read the error and find the two conflicting bean definitions
- Decide which bean should win and why
- Rename/qualify or mark @Primary to disambiguate
- Confirm the context starts with one unambiguous bean
