description: |
  Startup fails with 'A bean with that name has already been defined and overriding is disabled' (Spring Boot 2.1+ default). Two configurations declare the same bean name. Decide the correct resolution — rename/qualify the bean or mark the intended one @Primary — rather than blindly re-enabling overriding.
objectives:
