description: 'CONTEXT: A team operating Java applications needs you to resolve `JWT Validation Failing
  — Clock Skew and Short Expiry` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml sets a 30s JWT TTL and zero
  allowed clock skew; valid tokens are rejected as expired. Authenticated calls intermittently return
  401 with ''JWT expired''. Two issues combine: the access-token TTL is far too short for normal session
  length, and there is no allowed clock skew between the issuer and the resource server whose clocks differ
  by a few seconds. Tune the token lifetime and add a small skew allowance.


  OBJECTIVE: Reproduce the 401 and confirm the failure is token expiry/validation; Increase the access-token
  TTL to a sane value; Allow a small clock-skew window during validation. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Reproduce the 401 and confirm the failure is token expiry/validation
- Increase the access-token TTL to a sane value
- Allow a small clock-skew window during validation
- Verify authenticated calls stop failing intermittently
