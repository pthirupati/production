description: |
  Authenticated calls intermittently return 401 with 'JWT expired'. Two issues combine: the access-token TTL is far too short for normal session length, and there is no allowed clock skew between the issuer and the resource server whose clocks differ by a few seconds. Tune the token lifetime and add a small skew allowance.
objectives:
  - "Reproduce the 401 and confirm the failure is token expiry/validation"
  - "Increase the access-token TTL to a sane value"
  - "Allow a small clock-skew window during validation"
  - "Verify authenticated calls stop failing intermittently"
initial_state: |
  Config at /app/src/main/resources/application.yml sets a 30s JWT TTL and zero allowed clock skew; valid tokens are rejected as expired.
hints:
  - order: 1
    cost: 10
    content: "Decode the JWT exp claim and compare to server time — the window is tiny."
  - order: 2
    cost: 15
    content: "Raise the access-token validity (e.g. 15m) and refresh via the refresh token."
  - order: 3
    cost: 20
    content: "Allow ~30s clock skew in the JWT decoder so minor NTP drift does not 401."
