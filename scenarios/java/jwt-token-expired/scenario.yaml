jira_priority: High
is_free: false
description: |
  Users are being logged out within minutes of logging in. The Spring Security filter
  is throwing io.jsonwebtoken.ExpiredJwtException on tokens that should be valid for
  24 hours. Investigation reveals the JWT expiry is configured as 3600 (seconds)
  but is being interpreted as milliseconds in the token generation code, making
  tokens expire in ~1 hour. Additionally, the server clock is 5 minutes ahead of
  the issuing service, triggering premature expiration.
objectives:
  - Reproduce the ExpiredJwtException by decoding a recently issued token at jwt.io
  - Identify the unit mismatch in the token generation code
  - Fix the expiry calculation to correctly use milliseconds or seconds as expected
  - Sync the server clock or add a clockSkew allowance to the JWT validator
initial_state: |
  Simulated server. Spring Boot app at /opt/app/. JWT config in application.yml.
  jwt.expiry-ms is set to 3600 but code treats it as milliseconds (expires in 3.6s).
  JwtUtil.java is at /opt/app/src/main/java/com/app/security/JwtUtil.java.
hints:
  - order: 1
    cost: 10
    content: "Decode a token: curl http://localhost:8080/api/auth/login -d '{...}'
      Copy the token and paste at https://jwt.io to see the 'exp' claim.
      If exp-iat is only a few seconds, the unit is wrong."
  - order: 2
    cost: 15
    content: "In JwtUtil.java, find the token builder. Change:
      .setExpiration(new Date(System.currentTimeMillis() + jwtExpiryMs))
      Ensure jwtExpiryMs is actually in milliseconds — change application.yml
      jwt.expiry-ms from 3600 to 86400000 (24 hours in ms)."
  - order: 3
    cost: 20
    content: "To handle clock skew, add an allowance in the JWT parser:
      Jwts.parserBuilder()
        .setAllowedClockSkewSeconds(300) // allow 5 min skew
        .setSigningKey(secretKey)
        .build()
      Also run: timedatectl status to check if NTP sync is enabled on the server."
