description: 'CONTEXT: A team operating Java applications needs you to resolve `java: Rest Apis — Backup
  and Recovery` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for REST APIs. Leadership wants
  proof that restore works — not just that scripts exit zero. Backup and recovery drill for REST APIs.
  Ensure backups run on schedule, retention is correct, and you can restore controllers, status codes,
  and validation within the lab RTO.


  OBJECTIVE: Backup coverage for REST APIs is complete and restorable; Retention and encryption meet the
  stated policy; A restore drill proves data integrity. Success means `systemctl is-active nginx` returns
  active.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for REST APIs is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for REST APIs. Leadership wants proof that
  restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Test the config to get the exact file and line: `nginx -t`. It prints the offending
    directive (e.g. unknown directive "listn").'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Run `nginx -t` and `systemctl status nginx` for config vs service errors.

    2. Open the cited file under `/etc/nginx/`.

    3. Compare listen/upstream/proxy directives to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. A restore drill proves data integrity.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
