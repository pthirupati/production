description: 'CONTEXT: A team operating Java applications needs you to resolve `Gradle Transitive Version
  Conflict (Runtime LinkageError)` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: build.gradle at /app/ lets two transitive paths bring different versions of
  one library; the app hits NoSuchMethodError at runtime. The app compiles but throws NoSuchMethodError
  at runtime: two dependencies pull conflicting versions of the same library and Gradle''s default resolution
  picked an incompatible one. Use the dependency report to find the divergence and force a single consistent
  version (or a platform/BOM constraint).


  OBJECTIVE: Reproduce the runtime LinkageError / NoSuchMethodError; Run the Gradle dependencies report
  to find the conflict; Force/constrain a single version (resolutionStrategy or platform). Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
