description: 'CONTEXT: A team operating Java applications needs you to resolve `Build Java Maven Project`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Java Maven project where pom.xml needs fixing before it will build; `mvn package`
  currently fails. Build task: get a Java Maven project building. The pom.xml is incomplete/broken (missing
  or wrong elements), so `mvn package` fails. Repair the POM so dependencies resolve and the project compiles,
  tests, and packages cleanly.


  OBJECTIVE: Run mvn package and identify what the POM is missing or has wrong; Fix the pom.xml (coordinates,
  plugins, or dependencies); Build successfully so the artifact is produced under target/. Success means
  `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
