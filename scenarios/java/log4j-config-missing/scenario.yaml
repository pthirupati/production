slug: log4j-config-missing
title: "Missing Log4j2 Configuration — App Logs Nothing"
technology: Java
category: "Logging"
difficulty: easy
time_limit: 600
max_score: 100
lab_mode: simulation
simulation_type: java
infrastructure_type: simulation
jira_priority: Medium
is_free: false
description: |
  The application emits the Log4j2 'status logger' warning 'No log4j2 configuration file found' and produces no application logs, so operators are blind during incidents. Add a valid log4j2.xml on the classpath with a console (and rolling file) appender at the right level so logs flow again.
objectives:
  - "Confirm Log4j2 is using its default no-config fallback"
  - "Add a valid log4j2.xml under src/main/resources"
  - "Configure an appender and root logger level"
  - "Verify application logs are emitted at the expected level"
initial_state: |
  There is no usable /app/src/main/resources/log4j2.xml; Log4j2 warns about a missing config and only errors leak to stderr.
hints:
  - order: 1
    cost: 10
    content: "The 'No log4j2 configuration file found' status line means it is on defaults."
  - order: 2
    cost: 15
    content: "Create log4j2.xml with a Console appender and a Root logger level=info."
  - order: 3
    cost: 20
    content: "Put it on the classpath (src/main/resources) and confirm INFO logs now appear."
