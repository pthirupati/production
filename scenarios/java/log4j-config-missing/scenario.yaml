description: 'CONTEXT: A team operating Java applications needs you to resolve `Missing Log4j2 Configuration
  — App Logs Nothing` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: There is no usable /app/src/main/resources/log4j2.xml; Log4j2 warns about
  a missing config and only errors leak to stderr. The application emits the Log4j2 ''status logger''
  warning ''No log4j2 configuration file found'' and produces no application logs, so operators are blind
  during incidents. Add a valid log4j2.xml on the classpath with a console (and rolling file) appender
  at the right level so logs flow again.


  OBJECTIVE: Confirm Log4j2 is using its default no-config fallback; Add a valid log4j2.xml under src/main/resources;
  Configure an appender and root logger level. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Confirm Log4j2 is using its default no-config fallback
- Add a valid log4j2.xml under src/main/resources
- Configure an appender and root logger level
- Verify application logs are emitted at the expected level
