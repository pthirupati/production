description: 'CONTEXT: A team operating Java applications needs you to resolve `Actuator Endpoints Exposed
  Without Auth` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Config at /app/src/main/resources/application.yml sets exposure include=''*''
  with no auth; /actuator/env and /actuator/heapdump are public. All Spring Boot Actuator endpoints are
  exposed over HTTP without authentication, including /actuator/env and /actuator/heapdump, leaking secrets
  and enabling abuse. Lock the management surface down: expose only the safe endpoints, require auth on
  the rest, and stop dumping sensitive data.


  OBJECTIVE: Enumerate the exposed actuator endpoints and the sensitive ones; Restrict management.endpoints.web.exposure
  to the minimum needed; Require authentication for sensitive endpoints. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Enumerate the exposed actuator endpoints and the sensitive ones
- Restrict management.endpoints.web.exposure to the minimum needed
- Require authentication for sensitive endpoints
- Verify env/heapdump are no longer anonymously reachable
