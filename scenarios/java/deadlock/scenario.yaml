description: 'CONTEXT: A team operating Java applications needs you to resolve `JVM Thread Deadlock Between
  Two Locks` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Java project with Maven/Gradle, JVM logs, and Spring
  configuration. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Service code at /app/src/main/java/com/example/TransferService.java locks
  accountA then accountB on one path and accountB then accountA on another. Two worker threads each hold
  one lock and wait for the other, producing a classic lock-ordering deadlock — throughput drops to zero
  and a thread dump shows ''Found one Java-level deadlock''. Fix the lock-acquisition order so both threads
  always take the locks in the same global order.


  OBJECTIVE: Capture a thread dump and confirm the deadlock and the two locks involved; Identify the two
  code paths that acquire the locks in opposite order; Impose a single consistent global lock ordering.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Capture a thread dump and confirm the deadlock and the two locks involved
- Identify the two code paths that acquire the locks in opposite order
- Impose a single consistent global lock ordering
- Verify a fresh thread dump shows no deadlock and work resumes
