description: |
  Two worker threads each hold one lock and wait for the other, producing a classic lock-ordering deadlock — throughput drops to zero and a thread dump shows 'Found one Java-level deadlock'. Fix the lock-acquisition order so both threads always take the locks in the same global order.
objectives:
  - "Capture a thread dump and confirm the deadlock and the two locks involved"
  - "Identify the two code paths that acquire the locks in opposite order"
  - "Impose a single consistent global lock ordering"
  - "Verify a fresh thread dump shows no deadlock and work resumes"
initial_state: |
  Service code at /app/src/main/java/com/example/TransferService.java locks accountA then accountB on one path and accountB then accountA on another.
hints:
  - order: 1
    cost: 10
    content: "jstack <pid> prints 'Found one Java-level deadlock' and names both threads and locks."
  - order: 2
    cost: 15
    content: "The two methods take the two locks in opposite order — that is the cycle."
  - order: 3
    cost: 20
    content: "Always lock in a fixed order (e.g. by account id) so no cycle can form."
