title: 'Ansible Automation: Facts — Automation Practice'
slug: academy-ansible-047-automation-facts-5
technology: Ansible Automation
category: Automation
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: ansible
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Ansible control-node lab. Managed hosts in `webservers` are unreachable over SSH — `ansible
  webservers -m ping` fails. Establish key-based access and verify SUCCESS/pong.
objectives:
- All webservers hosts answer ansible ping with SUCCESS
- Key-based SSH works without a password prompt
- '`ansible webservers -m ping` returns SUCCESS for every host'
initial_state: '`ansible webservers -m ping` fails with unreachable/permission errors until SSH keys are
  distributed.'
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ansible -m setup` and fact usage in templates.

    2. Write down what looks normal versus wrong or missing for facts.

    3. Recall the core idea: gathered facts, custom facts, and caching. Form one hypothesis before you
    act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for facts.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `ansible -m setup` and fact usage in templates.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — facts resolve to current host values.

    4. Click Check Solution once `ansible webservers -m ping` returns SUCCESS for every host.'
