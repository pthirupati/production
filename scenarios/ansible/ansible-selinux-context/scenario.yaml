dual_terminal: false
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible SELinux Context
  Not Set` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An Ansible play that fails to set the right SELinux context. An app is denied
  by SELinux because the Ansible sefcontext task is wrong.


  OBJECTIVE: Confirm the issue: SELinux denials on the path; Apply the documented fix in /home/ansible/sefcontext.yml;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: An Ansible play that fails to set the right SELinux context.
objectives:
- 'Confirm the issue: SELinux denials on the path'
- Apply the documented fix in /home/ansible/sefcontext.yml
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ausearch -m avc -ts recent` or `grep AVC /var/log/audit/audit.log`.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Identify which binary/path SELinux denied.

    2. Run `ls -Z` on the affected file and compare context.

    3. Check if a boolean needs toggling: `getsebool -a | grep <service>`.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Apply the correct context with `semanage fcontext` + `restorecon`, or set the boolean.

    2. Retry the failing command.

    3. Confirm no new AVC denials and the service works.


    WHY: permissive fixes hide denials; targeted policy fixes last.'
