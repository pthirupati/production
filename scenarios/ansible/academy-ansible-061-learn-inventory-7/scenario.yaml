technology: ansible
category: Learn
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: ansible
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `ansible: Ansible Inventory
  — Fundamentals Lab` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Ansible control node is online with a starter Ansible inventory setup.
  Some pieces are intentionally incomplete so you can learn how they fit together. Nothing is on fire
  — focus on observation. This beginner-friendly ansible lab introduces Ansible inventory. You will explore
  hosts, groups, variables, and connection settings on the Ansible control node. Read the environment
  first, then follow the guided steps — no prior production experience required.


  OBJECTIVE: Understand how Ansible inventory work in this lab environment; Identify the main status and
  configuration signals for Ansible inventory; Confirm you can read the current state confidently before
  changing anything. Success means `ansible webservers -m ping` includes `SUCCESS`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Understand how Ansible inventory work in this lab environment
- Identify the main status and configuration signals for Ansible inventory
- Confirm you can read the current state confidently before changing anything
initial_state: The Ansible control node is online with a starter Ansible inventory setup. Some pieces
  are intentionally incomplete so you can learn how they fit together. Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ansible-inventory --graph` and group/host vars files.

    2. Write down what looks normal versus wrong or missing for Ansible inventory.

    3. Recall the core idea: hosts, groups, variables, and connection settings. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `ansible-inventory --graph` and group/host vars files.

    2. Make one small, reversible change toward the objective, re-reading status after each step so you
    understand cause and effect.

    3. Verify the result — inventory groups and vars match the intended environment.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
summary: Complete the ansible inventory — learn lab ansible lab and verify success with the checker
