description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Create AWX Job Template
  from Project` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: AWX with a synced project but no job template for the new site playbook. After
  syncing the ansible-playbooks project, create a new job template and prepare it for launch.


  OBJECTIVE: Sign in to AWX; Create a new job template from the synced project; Verify the template appears
  under Job Templates. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
