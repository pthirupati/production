dual_terminal: false
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible Command Missing
  Environment` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An Ansible task missing the environment block. A command fails because a required
  environment variable isn''t passed via environment:.


  OBJECTIVE: Confirm the issue: Command errors on missing env; Apply the documented fix in /home/ansible/env.yml;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: An Ansible task missing the environment block.
