title: Configure Ansible Inventory Host
slug: configure-ansible-inventory
technology: ansible
category: Build
difficulty: easy
scenario_type: do
time_limit: 900
max_score: 100
infrastructure_type: docker
lab_mode: docker
jira_priority: Low
is_free: false
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Configure Ansible Inventory
  Host` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Ansible control node with a default/empty inventory. No managed webserver
  host is defined yet. Build task: register a new webserver host in the Ansible inventory and confirm
  Ansible can see it. Starting from an empty inventory, add the host under an appropriate group with its
  connection details, then verify it appears via ansible-inventory and responds to a ping.


  OBJECTIVE: Add a webserver host (with ansible_host/user) under a [webservers] group in the inventory;
  List the inventory and confirm the host and group are present; Verify Ansible can reach the host with
  the ping module. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Add a webserver host (with ansible_host/user) under a [webservers] group in the inventory
- List the inventory and confirm the host and group are present
- Verify Ansible can reach the host with the ping module
initial_state: Ansible control node with a default/empty inventory. No managed webserver host is defined
  yet.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ansible webservers -m ping -vvv` to see SSH and inventory errors.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix inventory, SSH key, or `ansible_user` in group_vars.

    2. Re-run `ansible webservers -m ping`.

    3. Confirm every host returns SUCCESS.


    WHY: Ansible cannot manage hosts it cannot reach.'
summary: Complete the configure ansible inventory host ansible lab and verify success with the checker
estimated_minutes: 15
xp_reward: 100
prerequisites:
- Basic ansible literacy
tags:
