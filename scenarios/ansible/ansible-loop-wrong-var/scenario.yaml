description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible Loop Iterating
  Wrong Variable` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An Ansible play whose loop references the wrong variable, so the task produces
  no effect. A play loops over the wrong variable and creates nothing useful. Fix the loop to iterate
  the intended list and confirm the play is corrected.


  OBJECTIVE: Confirm the loop iterates the wrong data; Fix the loop variable; Verify the play is corrected.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
