description: Backup and recovery drill for AWX / Tower. Ensure backups run on schedule,
  retention is correct, and you can restore job templates, inventories, credentials,
  and projects within the lab RTO.
objectives:
- Backup coverage for AWX / Tower is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for AWX / Tower. Leadership
  wants proof that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — AWX job output, project sync status, and inventory
    sources.

    2. Write down what looks normal versus wrong or missing for AWX / Tower.

    3. Recall the core idea: job templates, inventories, credentials, and projects.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for AWX / Tower.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — AWX job output, project sync status, and inventory
    sources.

    2. Repair or run the backup job, then perform a controlled restore into a scratch
    location to prove it works.

    3. Verify the result — the project syncs and the job template runs green.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-ansible-029-backup-awx-3.conf`,
    then click Check Solution.'
