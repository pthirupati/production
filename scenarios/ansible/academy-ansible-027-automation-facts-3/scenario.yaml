description: 'Automation lab: remove toil around facts. Codify repeatable steps for
  gathered facts, custom facts, and caching and prove the automation is idempotent.'
objectives:
- Day-2 facts work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for facts. Automate the boring
  parts without hiding important safety checks.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ansible -m setup` and fact usage in templates.

    2. Write down what looks normal versus wrong or missing for facts.

    3. Recall the core idea: gathered facts, custom facts, and caching. Form one hypothesis
    before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for facts.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `ansible -m setup` and fact usage in templates.

    2. Implement the automation with dry-run / check mode, then run it twice — the
    second run must report no changes.

    3. Verify the result — facts resolve to current host values.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-ansible-027-automation-facts-3.conf`,
    then click Check Solution.'
