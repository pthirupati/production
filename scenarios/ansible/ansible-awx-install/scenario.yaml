slug: ansible-awx-install
title: Install Ansible AWX Operator
technology: ansible
category: Build
difficulty: medium
scenario_type: do
time_limit: 1200
max_score: 100
lab_mode: simulation
simulation_type: ansible-awx
infrastructure_type: simulation
is_free: false
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Install Ansible AWX Operator`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Kubernetes cluster with AWX operator manifest staged but not applied. AWX
  web UI is not yet available. Build lab: install the Ansible AWX operator on the training cluster and
  verify the web UI is reachable. Use the AWX simulator to complete the operator install, then confirm
  the dashboard loads.


  OBJECTIVE: Open the AWX simulator from the lab toolbar and sign in; Run the AWX operator install action;
  Verify the dashboard shows AWX as installed with no blocking errors. Success means `check.sh` exits
  successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Open the AWX simulator from the lab toolbar and sign in
- Run the AWX operator install action
- Verify the dashboard shows AWX as installed with no blocking errors
initial_state: Kubernetes cluster with AWX operator manifest staged but not applied. AWX web UI is not
  yet available.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ansible-playbook site.yml -vv` (or the scenario playbook) and read the
    first FAILED task — note host, task name, and error message.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Re-run with `-vvv` on the failing host only (`--limit <host>`).

    2. Check inventory, SSH connectivity, and `ansible.cfg` privilege settings.

    3. Compare the failed module output to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Verify the dashboard shows AWX as installed with no blocking errors.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
summary: Complete the install ansible awx operator ansible lab and verify success with the checker
