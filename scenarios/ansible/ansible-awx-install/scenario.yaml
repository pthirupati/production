slug: ansible-awx-install
title: Install Ansible AWX Operator
technology: Ansible
category: AWX / Tower
difficulty: medium
scenario_type: do
time_limit: 1200
max_score: 100
lab_mode: simulation
simulation_type: ansible-awx
infrastructure_type: simulation
is_free: false
description: >-
  Build lab: install the Ansible AWX operator on the training cluster and verify the web UI is reachable.
  Use the AWX simulator to complete the operator install, then confirm the dashboard loads.
objectives:
  - Open the AWX simulator from the lab toolbar and sign in
  - Run the AWX operator install action
  - Verify the dashboard shows AWX as installed with no blocking errors
initial_state: Kubernetes cluster with AWX operator manifest staged but not applied. AWX web UI is not yet available.
hints:
  - order: 1
    cost: 10
    content: Click **Open AWX** in the lab toolbar, then **Sign In** with the training admin account.
  - order: 2
    cost: 15
    content: On the Dashboard, click **Install AWX** to apply the operator and wait for success.
  - order: 3
    cost: 20
    content: Click **Check** in the lab toolbar to validate the install completed.
