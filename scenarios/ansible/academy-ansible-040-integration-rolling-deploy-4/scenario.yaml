title: 'Ansible Automation: Rolling Deploys — Integration Lab'
slug: academy-ansible-040-integration-rolling-deploy-4
technology: Ansible Automation
category: Cross-Technology
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: ansible
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: Ansible control-node lab. Managed hosts in `webservers` are unreachable over SSH — `ansible
  webservers -m ping` fails. Establish key-based access and verify SUCCESS/pong.
objectives:
- All webservers hosts answer ansible ping with SUCCESS
- Key-based SSH works without a password prompt
- '`ansible webservers -m ping` returns SUCCESS for every host'
initial_state: '`ansible webservers -m ping` fails with unreachable/permission errors until SSH keys are
  distributed.'
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `serial:` settings and per-batch results.

    2. Write down what looks normal versus wrong or missing for rolling deploys.

    3. Recall the core idea: serial, max-fail, and health gating. Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for rolling deploys.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `serial:` settings and per-batch results.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — the rollout proceeds in batches and halts on failure.

    4. Click Check Solution once `ansible webservers -m ping` returns SUCCESS for every host.'
cross_technology: true
