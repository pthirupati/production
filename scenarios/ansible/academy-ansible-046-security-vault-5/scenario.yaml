title: 'Ansible Automation: Ansible Vault — Security Practice'
slug: academy-ansible-046-security-vault-5
technology: Ansible Automation
category: Security
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: ansible
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Security review: harden Ansible Vault on this Ansible Automation system.
  Close unsafe defaults, enforce least privilege, and ensure encrypting vars/files,
  vault IDs, and rotation cannot be abused — without breaking legitimate use.'
objectives:
- Unsafe defaults related to Ansible Vault are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around Ansible
  Vault. Assume an auditor or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 10
  content: 'Baseline current exposure: `ansible-vault view`, password files, and CI
    secrets. Note world-readable files, open ports, or excessive roles.'
- order: 2
  cost: 15
  content: Apply least privilege incrementally. Prefer explicit allows over broad
    wildcards.
- order: 3
  cost: 20
  content: Re-test legitimate workflows after hardening. Finish with `# FIXED-OK`
    in `/opt/fixitlab/academy/academy-ansible-046-security-vault-5.conf` and Check
    Solution.
