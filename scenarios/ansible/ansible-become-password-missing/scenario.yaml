title: Ansible Privilege Escalation Failing
slug: ansible-become-password-missing
technology: ansible
category: Fix
difficulty: medium
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible Privilege Escalation
  Failing` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An Ansible control node whose playbook enables become but lacks a working
  escalation method. An Ansible play fails on privileged tasks because become is enabled but no become
  method/password is configured. Fix the play/escalation config and confirm it is corrected.


  OBJECTIVE: Confirm privileged tasks fail on become; Configure become correctly; Verify the playbook
  is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: An Ansible control node whose playbook enables become but lacks a working escalation method.
objectives:
- Confirm privileged tasks fail on become
- Configure become correctly
- Verify the playbook is corrected
hints:
