slug: ansible-tower-ha-setup
title: Ansible Tower HA and Instance Groups
technology: ansible
category: Build
difficulty: hard
scenario_type: do
time_limit: 1500
max_score: 100
lab_mode: simulation
simulation_type: ansible-awx
infrastructure_type: simulation
is_free: false
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible Tower HA and
  Instance Groups` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Tower cluster with mixed project sync states and a pending patch rollout.
  Configure Tower-style HA readiness: sync projects, ensure credentials are attached, and run patch jobs
  across both Production and Staging inventories.


  OBJECTIVE: Sign in to AWX / Tower; Sync all projects and fix any errors; Launch Patch Linux against
  Production successfully. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Sign in to AWX / Tower
- Sync all projects and fix any errors
- Launch Patch Linux against Production successfully
initial_state: Tower cluster with mixed project sync states and a pending patch rollout.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ansible-playbook site.yml -vv` (or the scenario playbook) and read the
    first FAILED task — note host, task name, and error message.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Re-run with `-vvv` on the failing host only (`--limit <host>`).

    2. Check inventory, SSH connectivity, and `ansible.cfg` privilege settings.

    3. Compare the failed module output to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Launch Patch Linux against Production successfully.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
summary: Complete the ansible tower ha and instance groups ansible lab and verify success with the checker
estimated_minutes: 25
xp_reward: 100
prerequisites:
- Basic ansible literacy
tags:
