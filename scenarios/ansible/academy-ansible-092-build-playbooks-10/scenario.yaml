title: 'Ansible Automation: Ansible Playbooks — Build From Scratch'
slug: academy-ansible-092-build-playbooks-10
technology: Ansible Automation
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: ansible
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Build Ansible playbooks from scratch in this Ansible Automation lab.
  You start from a minimal environment and must produce a working configuration that
  demonstrates plays, tasks, handlers, idempotency, and check mode. Plan, implement,
  then prove it works.
objectives:
- A working Ansible playbooks setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The Ansible control node is ready but Ansible playbooks is not configured
  yet. Required tools may already be installed; your job is to create the configuration
  and bring the capability online.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ansible-playbook --syntax-check`, `--check`, and
    task output.

    2. Write down what looks normal versus wrong or missing for Ansible playbooks.

    3. Recall the core idea: plays, tasks, handlers, idempotency, and check mode.
    Form one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Ansible playbooks.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `ansible-playbook --syntax-check`, `--check`,
    and task output.

    2. Create the smallest working slice of Ansible playbooks first, validate it,
    then add the remaining pieces one at a time.

    3. Verify the result — a second run reports no unexpected changes.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-ansible-092-build-playbooks-10.conf`,
    then click Check Solution.'
