title: 'Ansible Automation: Ansible Playbooks — Build From Scratch'
slug: academy-ansible-092-build-playbooks-10
technology: Ansible Automation
category: Build Lab
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: ansible
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: Ansible control-node troubleshooting. The managed hosts in the `webservers` group are unreachable
  over SSH from the control node, so every play fails at the connection stage. Establish key-based SSH
  access to the inventory hosts so Ansible can reach them. Verify with `ansible webservers -m ping` (every
  host should return SUCCESS / pong).
objectives:
- All hosts in the webservers group are reachable from the control node
- Key-based SSH authentication works without a password prompt
- ansible webservers -m ping returns SUCCESS for every host
initial_state: The Ansible control node cannot authenticate to the managed hosts in the `webservers` group
  — `ansible webservers -m ping` fails with unreachable/permission-denied errors.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ansible webservers -m ping` and check `ansible-inventory --list` to
    see the target hosts.

    2. Write down what looks normal versus wrong or missing.

    3. Form one hypothesis about the root cause before you change anything.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture command output before the change so you can prove it worked afterward.'
- order: 3
  cost: 20
  content: 'Guided walkthrough:

    1. Re-check the current state — Confirm the failure: `ansible webservers -m ping` and check `ansible-inventory
    --list` to see the target hosts.

    2. The inventory is correct — the problem is SSH authentication to the managed nodes.

    3. Verify the result — Distribute your key with `ssh-copy-id` to each managed host (e.g. `ssh-copy-id
    root@web1`), then re-run `ansible webservers -m ping` and Check Solution.

    4. Click Check Solution once every objective is met.'
