description: 'CONTEXT: A team operating Ansible automation needs you to resolve `ansible: Conditionals
  — Observability Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The system runs, but conditionals lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality. Observability task: make conditionals visible in logs,
  metrics, or traces. On-call should answer ''what is broken?'' quickly using signals from when clauses,
  loops, and idempotent guards.


  OBJECTIVE: Day-2 conditionals work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `ansible webservers -m ping` includes
  `SUCCESS`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 conditionals work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but conditionals lacks useful telemetry. Dashboards/alerts are blank or
  noisy — improve signal quality.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — task `when:` lines and run output.

    2. Write down what looks normal versus wrong or missing for conditionals.

    3. Recall the core idea: when clauses, loops, and idempotent guards. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — task `when:` lines and run output.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a sensible threshold.

    3. Verify the result — tasks run only when needed and a re-run is clean.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
