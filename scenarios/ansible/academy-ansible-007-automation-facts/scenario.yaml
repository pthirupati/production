title: Facts — Automation Lab
slug: academy-ansible-007-automation-facts
technology: ansible
category: Optimize
difficulty: medium
scenario_type: do
lab_mode: simulation
simulation_type: ansible
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `ansible: Facts — Automation
  Practice` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Operators still perform manual steps for facts. Automate the boring parts
  without hiding important safety checks. Automation lab: remove toil around facts. Codify repeatable
  steps for gathered facts, custom facts, and caching and prove the automation is idempotent.


  OBJECTIVE: Day-2 facts work completes safely in this environment; Changes are verified with before/after
  checks; The system remains stable for dependent teams. Success means `ansible webservers -m ping` includes
  `SUCCESS`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 facts work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: Operators still perform manual steps for facts. Automate the boring parts without hiding
  important safety checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ansible -m setup` and fact usage in templates.

    2. Write down what looks normal versus wrong or missing for facts.

    3. Recall the core idea: gathered facts, custom facts, and caching. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `ansible -m setup` and fact usage in templates.

    2. Implement the automation with dry-run / check mode, then run it twice — the second run must report
    no changes.

    3. Verify the result — facts resolve to current host values.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
summary: Complete the facts — automation lab ansible lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic ansible literacy
tags:
- ansible
- do
- hands-on
linked_tutorial: ansible-fundamentals
what_you_will_learn:
- Day-2 facts work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
environment:
  nodes:
  - role: primary
    os: FixitLab Ansible control node
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - ansible
  - ansible-playbook
  - bash
  - coreutils
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Facts — Automation Lab
  description: Restore healthy behavior for Facts — Automation Lab by investigating the failure, applying
    the smallest safe fix, and validating the outcome.
  background: 'This ansible lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: command_output
    command: ansible webservers -m ping
    expected_output: SUCCESS
    error_message: Ansible hosts are still unreachable. Verify SSH keys and inventory.
solution:
  summary: Identify the misconfiguration affecting this ansible lab and apply the minimal fix.
  files_changed: []
  commands_run:
  - ansible webservers -m ping
  reference_docs: ansible-fundamentals
guided_mode:
  enabled: true
  steps:
  - step: 1
    title: Inspect current state
    instruction: Run a read-only diagnostic before changing anything.
    command: ansible webservers -m ping
    expected_output: Output shows the current failure mode
    explanation: Evidence-first troubleshooting avoids guessing.
    next_on: command_success
  - step: 2
    title: Apply the minimal fix
    instruction: Make one reversible change aligned with the objectives.
    command: '# your fix command here'
    expected_output: State moves toward the objective
    explanation: Small changes make rollback easy if the hypothesis was wrong.
    next_on: command_success
  - step: 3
    title: Verify with the grader
    instruction: Run the same verification the checker uses.
    command: ansible webservers -m ping
    expected_output: '`ansible webservers -m ping` includes `SUCCESS`'
    explanation: The lab passes only when real state is healthy.
    next_on: command_success
