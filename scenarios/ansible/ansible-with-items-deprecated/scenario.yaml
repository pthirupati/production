description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible Deprecated Loop
  Syntax Breaks` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An Ansible play using outdated loop syntax that now fails. A play errors on
  a newer Ansible because it uses removed with_ loop syntax incorrectly.


  OBJECTIVE: Confirm the issue: Loop syntax errors on newer Ansible; Apply the documented fix in /home/ansible/legacy-loop.yml;
  Verify the configuration is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: An Ansible play using outdated loop syntax that now fails.
objectives:
- 'Confirm the issue: Loop syntax errors on newer Ansible'
- Apply the documented fix in /home/ansible/legacy-loop.yml
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the Ansible control node. For Ansible Deprecated
    Loop Syntax Breaks, inspect `ansible webservers -m ping` output before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with `ansible webservers -m ping` output.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Verify the configuration is corrected.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
