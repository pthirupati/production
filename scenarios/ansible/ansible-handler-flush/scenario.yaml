description: 'CONTEXT: A team operating Ansible automation has raised a ticket for `Ansible Handlers Run
  Too Late`. A customer-facing workflow is degraded and the on-call engineer (you) must diagnose and resolve
  it. Business impact: reduced service reliability and blocked users until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node. The architecture is a single
  lab-primary node exposing inventory, playbooks, roles, and ansible-playbook; treat it as the production
  host for this incident. All tools run locally — no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An Ansible play needing an explicit handler flush.


  OBJECTIVE: Confirm the issue: Handlers run after dependent tasks; Apply the documented fix in /home/ansible/flush.yml;
  Verify the configuration is corrected. Acceptance criteria: the change is minimal and reversible, and
  success means `ansible webservers -m ping` includes `SUCCESS`.


  WORK TO DO: Required tooling is pre-installed; if a command is missing, note it and use the equivalent
  already on the host. Make the smallest configuration change that moves the system toward the objective
  (edit the relevant inventory, playbooks, roles, and ansible-playbook), changing one thing at a time.
  Check your work continuously against the objective — success means `ansible webservers -m ping` includes
  `SUCCESS`.


  VERIFY: Re-run the same check the grader uses and confirm `ansible webservers -m ping` includes `SUCCESS`.
  Capture the before/after output as evidence. Success criteria: the objective''s healthy state holds
  on a repeat check, not just once.


  ROLLBACK: If a change makes things worse, revert that single change immediately (restore the original
  config file / undo the edit / restart the affected component) and re-observe before trying another hypothesis.
  Never stack unverified changes.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: An Ansible play needing an explicit handler flush.
objectives:
- 'Confirm the issue: Handlers run after dependent tasks'
- Apply the documented fix in /home/ansible/flush.yml
- Verify the configuration is corrected
hints:
- order: 1
  cost: 0
  content: 'ORIENT — what to observe and why:

    Do not touch anything yet. First observe the symptom: ansible handlers run too late is not behaving
    as the scenario objectives require. This lab is about ansible handlers run too late — how ansible
    handlers run too late behaves in a Ansible automation environment. Read the objectives and the current
    state, and note precisely what looks wrong versus healthy before you form any theory.'
- order: 2
  cost: 10
  content: 'APPROACH — the troubleshooting method:

    Work from evidence, not guesses. For ansible handlers run too late problems the reliable method is:
    (1) reproduce/observe the failure, (2) narrow from the whole system down to the one component that
    owns the symptom, (3) change exactly one thing, (4) re-check. Fix the underlying misconfiguration
    you identified (not just the noisy log line), changing one thing at a time.'
- order: 3
  cost: 25
  content: 'WHICH TOOL — the diagnostic command(s):

    Run `ansible-playbook site.yml -vv` (or the scenario playbook) and read the first FAILED task — note
    host, task name, and error message.'
- order: 4
  cost: 40
  content: 'NARROW DOWN — isolate the subsystem:

    1. Re-run with `-vvv` on the failing host only (`--limit <host>`).

    2. Check inventory, SSH connectivity, and `ansible.cfg` privilege settings.

    3. Compare the failed module output to the scenario objectives.'
- order: 5
  cost: 60
  content: 'NEAR-SOLUTION — the fix shape + verify (you still apply it):

    1. Apply the minimal fix on the failing host (config, service, or variable).

    2. Re-run the playbook to a clean PLAY RECAP (failed=0).

    3. Confirm `ansible webservers -m ping` succeeds.


    WHY: Ansible labs grade real playbook outcomes, not marker files.'
