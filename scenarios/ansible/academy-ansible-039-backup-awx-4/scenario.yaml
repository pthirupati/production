tasks:
- id: task_1
  title: Awx / Tower — Backup Lab
  description: Restore healthy behavior for Awx / Tower — Backup Lab by investigating the failure, applying
    the smallest safe fix, and validating the outcome.
  background: 'This ansible lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
