description: 'CONTEXT: A team operating Ansible automation needs you to resolve `ansible: Awx / Tower
  — Backup and Recovery` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Backup jobs exist but reliability is uncertain for AWX / Tower. Leadership
  wants proof that restore works — not just that scripts exit zero. Backup and recovery drill for AWX
  / Tower. Ensure backups run on schedule, retention is correct, and you can restore job templates, inventories,
  credentials, and projects within the lab RTO.


  OBJECTIVE: Backup coverage for AWX / Tower is complete and restorable; Retention and encryption meet
  the stated policy; A restore drill proves data integrity. Success means `ansible webservers -m ping`
  includes `SUCCESS`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Backup coverage for AWX / Tower is complete and restorable
- Retention and encryption meet the stated policy
- A restore drill proves data integrity
initial_state: Backup jobs exist but reliability is uncertain for AWX / Tower. Leadership wants proof
  that restore works — not just that scripts exit zero.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ansible webservers -m ping -vvv` to see SSH and inventory errors.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix inventory, SSH key, or `ansible_user` in group_vars.

    2. Re-run `ansible webservers -m ping`.

    3. Confirm every host returns SUCCESS.


    WHY: Ansible cannot manage hosts it cannot reach.'
summary: Complete the awx / tower — backup lab ansible lab and verify success with the checker
