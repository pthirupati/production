title: Ansible Galaxy Role Not Installed
slug: ansible-galaxy-role-missing
technology: ansible
category: Fix
difficulty: easy
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible Galaxy Role Not
  Installed` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An Ansible project whose requirements.yml omits a required role, so the play
  errors on a missing role. A playbook fails because a required Galaxy role isn''t pinned/installed via
  requirements.yml. Fix requirements and confirm it is corrected.


  OBJECTIVE: Confirm the play fails on a missing role; Add/pin the role in requirements.yml; Verify requirements
  is corrected. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: An Ansible project whose requirements.yml omits a required role, so the play errors on
  a missing role.
objectives:
- Confirm the play fails on a missing role
- Add/pin the role in requirements.yml
- Verify requirements is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Start with read-only discovery on the Ansible control node. For Ansible Galaxy
    Role Not Installed, inspect `ansible webservers -m ping` output before changing anything.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Gather evidence with `ansible webservers -m ping` output.

    2. Compare current output to the scenario objectives.

    3. Form a single hypothesis about the smallest fix that would restore healthy state.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Verify requirements is corrected.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
