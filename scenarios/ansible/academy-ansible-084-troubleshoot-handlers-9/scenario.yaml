title: 'Ansible Automation: Handlers — Troubleshooting Drill'
slug: academy-ansible-084-troubleshoot-handlers-9
technology: Ansible Automation
category: Troubleshooting
difficulty: hard
scenario_type: fix
lab_mode: simulation
simulation_type: ansible
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: a service is not restarted after a config change.
  You are on call for Ansible Automation and must troubleshoot handlers methodically
  — triage symptoms, isolate root cause, apply the smallest safe fix, and confirm
  recovery.'
objectives:
- 'The incident symptom is clear: a service is not restarted after a config change'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Ansible control node is degraded. A service is not restarted after
  a config change. Recent changes may exist around handlers, but do not restart blindly
  — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — playbook notify lines and `--diff` output.

    2. Write down what looks normal versus wrong or missing for handlers.

    3. Recall the core idea: notify/handler flow and run-once semantics. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for handlers.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — playbook notify lines and `--diff` output.

    2. Fix the underlying misconfiguration you identified (not just the noisy log
    line), changing one thing at a time.

    3. Verify the result — handlers fire exactly when notified.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-ansible-084-troubleshoot-handlers-9.conf`,
    then click Check Solution.'
