title: Ansible Misclassifies Command Failure
slug: ansible-failed-when-wrong
technology: Ansible
category: Error Handling
difficulty: medium
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: A command that returns non-zero on success is marked failed because failed_when is wrong.
initial_state: An Ansible task with an incorrect failed_when.
objectives:
- 'Confirm the issue: Successful command marked failed'
- Apply the documented fix in /home/ansible/failwhen.yml
- Verify the configuration is corrected
hints:
- order: 1
  cost: 10
  content: Successful command marked failed
- order: 2
  cost: 15
  content: Set a correct failed_when expression.
- order: 3
  cost: 20
  content: /home/ansible/failwhen.yml carries the corrected configuration.
