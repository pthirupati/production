description: 'CONTEXT: A team operating Ansible automation needs you to resolve `RHEL Simulation: Ansible
  SSH Key Failure` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated ansible-control node with inventory at /etc/ansible/hosts. web1
  is reachable over SSH key auth; web2 rejects publickey authentication because the control node''s key
  isn''t authorized there. The Ansible control node cannot reach managed host web2 over SSH — `ansible
  webservers -m ping` returns web2 UNREACHABLE with a publickey/permission-denied error, while web1 succeeds.
  The control node''s public key is not installed in web2''s authorized_keys. Distribute the key to web2
  and confirm all hosts ping.


  OBJECTIVE: Run the ping and identify that web2 is UNREACHABLE on publickey auth; Install the control
  node''s public key into web2''s authorized_keys; Verify every host in the group responds to the Ansible
  ping. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Run the ping and identify that web2 is UNREACHABLE on publickey auth
- Install the control node's public key into web2's authorized_keys
- Verify every host in the group responds to the Ansible ping
initial_state: Simulated ansible-control node with inventory at /etc/ansible/hosts. web1 is reachable
  over SSH key auth; web2 rejects publickey authentication because the control node's key isn't authorized
  there.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ansible webservers -m ping -vvv` to see SSH and inventory errors.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix inventory, SSH key, or `ansible_user` in group_vars.

    2. Re-run `ansible webservers -m ping`.

    3. Confirm every host returns SUCCESS.


    WHY: Ansible cannot manage hosts it cannot reach.'
summary: 'Complete the rhel simulation: ansible ssh key failure ansible lab and verify success with the
