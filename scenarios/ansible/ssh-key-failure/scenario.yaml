category: Fix
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible SSH Key Failure`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Ansible control node. web2 is unreachable over SSH (publickey auth
  fails) while the other webservers respond. The control node''s key has not been copied to web2. Managed
  host web2 is UNREACHABLE to Ansible because SSH key-based authentication isn''t set up for it — the
  control node''s public key is missing from web2''s authorized_keys, so the ping module fails with a
  publickey error. Distribute the key to web2 and confirm Ansible can reach all webservers.


  OBJECTIVE: Identify that web2 fails Ansible''s ping on publickey authentication; Copy the control node''s
  SSH key to web2; Verify all webservers respond to ansible -m ping. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: medium
dual_terminal: true
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ansible webservers -m ping -vvv` to see SSH and inventory errors.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix inventory, SSH key, or `ansible_user` in group_vars.

    2. Re-run `ansible webservers -m ping`.

    3. Confirm every host returns SUCCESS.


    WHY: Ansible cannot manage hosts it cannot reach.'
