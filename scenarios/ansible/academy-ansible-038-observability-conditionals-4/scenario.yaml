description: 'Observability task: make conditionals visible in logs, metrics, or traces.
  On-call should answer ''what is broken?'' quickly using signals from when clauses,
  loops, and idempotent guards.'
objectives:
- Day-2 conditionals work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: The system runs, but conditionals lacks useful telemetry. Dashboards/alerts
  are blank or noisy — improve signal quality.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — task `when:` lines and run output.

    2. Write down what looks normal versus wrong or missing for conditionals.

    3. Recall the core idea: when clauses, loops, and idempotent guards. Form one
    hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for conditionals.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — task `when:` lines and run output.

    2. Add or fix the exporter / dashboard / alert with clear names, labels, and a
    sensible threshold.

    3. Verify the result — tasks run only when needed and a re-run is clean.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-ansible-038-observability-conditionals-4.conf`,
    then click Check Solution.'
