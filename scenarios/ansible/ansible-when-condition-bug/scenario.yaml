- Fix the when condition
- Verify the play is corrected
environment:
  nodes:
  - role: primary
    os: FixitLab Ansible control node
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - ansible
