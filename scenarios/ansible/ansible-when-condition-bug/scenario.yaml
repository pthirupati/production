title: Ansible when Condition Always False
slug: ansible-when-condition-bug
technology: ansible
category: Fix
difficulty: medium
lab_mode: simulation
simulation_type: generic
time_limit: 1200
max_score: 100
is_free: true
jira_priority: High
dual_terminal: false
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible when Condition
  Always False` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An Ansible play whose when condition never evaluates true, skipping a required
  task. A critical task is always skipped because its when condition compares the wrong fact. Fix the
  conditional and confirm the play is corrected.


  OBJECTIVE: Confirm the task is always skipped; Fix the when condition; Verify the play is corrected.
  Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: An Ansible play whose when condition never evaluates true, skipping a required task.
objectives:
- Confirm the task is always skipped
- Fix the when condition
- Verify the play is corrected
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ansible webservers -m ping -vvv` to see SSH and inventory errors.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Fix inventory, SSH key, or `ansible_user` in group_vars.

    2. Re-run `ansible webservers -m ping`.

    3. Confirm every host returns SUCCESS.


    WHY: Ansible cannot manage hosts it cannot reach.'
summary: Complete the ansible when condition always false ansible lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic ansible literacy
tags:
- ansible
