difficulty: medium
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible → Kubernetes:
  Deploy Playbook Can''t Reach the` during a realistic incident. The business impact is reduced service
  reliability until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: An Ansible control node. /home/ansible/k8s-deploy.yml references a missing

  kubeconfig, the wrong namespace, and a removed apiVersion, so the

  kubernetes.core.k8s tasks fail before touching the cluster. CROSS-TECHNOLOGY task (Ansible -> Kubernetes).
  The release playbook

  /home/ansible/k8s-deploy.yml uses the kubernetes.core.k8s module to roll out the

  `api` Deployment, but every run fails at the first k8s task. The playbook points

  at a kubeconfig path that does not exist on the control node, targets the wrong

  namespace, and pins an apiVersion the cluster no longer serves. Fix the Ansible

  side of the handoff so the playbook can apply manifests to the cluster.


  OBJECTIVE: Run the playbook and read the k8s module error (bad kubeconfig path / namespace / apiVersion);
  Correct /home/ansible/k8s-deploy.yml so it uses the real kubeconfig, the right namespace, and a served
  apiVersion; Confirm the playbook is corrected so `ansible-playbook k8s-deploy.yml` would apply to the
  cluster. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
