title: Syntax Error in Ansible Playbook
slug: ansible-playbook-syntax-error
difficulty: easy
category: Fix
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Syntax Error in Ansible
  Playbook` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated control node. Running ansible-playbook site.yml returns a YAML syntax
  error and the play does not start. Managed hosts are reachable. Running an Ansible playbook fails immediately
  with a YAML parse error. The playbook has incorrect indentation, a missing colon, and a duplicate key
  that confuse the YAML parser. You must read the error output, locate the offending lines, and correct
  the syntax before the playbook can be executed.


  OBJECTIVE: Run ansible-playbook --syntax-check to get the exact error location; Fix all YAML syntax
  issues in the playbook; Confirm ansible-playbook site.yml runs without parse errors. Success means `check.sh`
  exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated control node. Running ansible-playbook site.yml returns a YAML syntax error
  and the play does not start. Managed hosts are reachable.

  '
objectives:
- Run ansible-playbook --syntax-check to get the exact error location
- Fix all YAML syntax issues in the playbook
- Confirm ansible-playbook site.yml runs without parse errors
