title: 'Ansible Automation: Handlers — Troubleshooting Drill'
slug: academy-ansible-044-troubleshoot-handlers-5
technology: Ansible Automation
category: Troubleshooting
difficulty: medium
scenario_type: fix
lab_mode: simulation
simulation_type: ansible
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'Production alert: a service is not restarted after a config change.
  You are on call for Ansible Automation and must troubleshoot handlers methodically
  — triage symptoms, find root cause, apply the smallest safe fix, and confirm recovery.'
objectives:
- 'The incident symptom is clear: a service is not restarted after a config change'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Ansible control node is degraded. A service is not restarted after
  a config change. Recent changes may exist around handlers, but do not restart blindly
  — gather evidence first.
hints:
- order: 1
  cost: 10
  content: 'Triage: playbook notify lines and `--diff` output. Capture timestamps,
    error messages, and what still works.'
- order: 2
  cost: 15
  content: Separate symptom from cause. Fix the underlying misconfiguration, not only
    the noisy log line.
- order: 3
  cost: 20
  content: 'Verify recovery: handlers fire exactly when notified. Document the fix,
    add `# FIXED-OK` to `/opt/fixitlab/academy/academy-ansible-044-troubleshoot-handlers-5.conf`,
    and rerun Check Solution.'
