title: Variable Not Defined Error
slug: ansible-variable-undefined
difficulty: medium
category: Fix
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Variable Not Defined
  Error` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated control node. Playbook deploy.yml fails on the "Configure nginx"
  task with an undefined variable error. Other tasks have already run. A playbook fails mid-run with "AnsibleUndefinedVariable:
  ''app_port'' is undefined". The variable is declared in group_vars but is misspelled in the task and
  missing from host_vars for one host. You must locate all usages, fix the variable name, and add the
  missing host override before the playbook will complete.


  OBJECTIVE: Read the error to identify the exact variable name and task that failed; Fix the variable
  reference in the task and add the missing host_vars entry; Run the playbook again and confirm it completes
  without variable errors. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
initial_state: 'Simulated control node. Playbook deploy.yml fails on the "Configure nginx" task with an
  undefined variable error. Other tasks have already run.

  '
objectives:
- Read the error to identify the exact variable name and task that failed
- Fix the variable reference in the task and add the missing host_vars entry
- Run the playbook again and confirm it completes without variable errors
lab_mode: simulation
simulation_type: ansible
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Read the error to identify the exact variable name and task that failed'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Fix the variable reference in the task and add the missing host_vars entry

    2. Run the playbook again and confirm it completes without variable errors'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Run the playbook again and confirm it completes without variable errors.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: Medium
technology: ansible
summary: Complete the variable not defined error ansible lab and verify success with the checker
estimated_minutes: 15
xp_reward: 100
prerequisites:
- Basic ansible literacy
tags:
- ansible
- fix
- hands-on
linked_tutorial: ansible-fundamentals
