environment:
  nodes:
  - role: primary
    os: FixitLab Ansible control node
    hostname: lab-primary
    ip: 127.0.0.1
    specs: local offline simulation
  pre_installed:
  - ansible
  - ansible-playbook
  - bash
  - coreutils
  credentials:
  - user: root
    password: lab123
tasks:
- id: task_1
  title: Variable Not Defined Error
  description: Restore healthy behavior for Variable Not Defined Error by investigating the failure, applying
    the smallest safe fix, and validating the outcome.
  background: 'This ansible lab teaches systematic troubleshooting: observe, hypothesize, change, verify.'
  validation:
    type: command_output
    command: ansible webservers -m ping
    expected_output: SUCCESS
    error_message: Ansible hosts are still unreachable. Verify SSH keys and inventory.
solution:
  summary: Identify the misconfiguration affecting this ansible lab and apply the minimal fix.
  files_changed: []
