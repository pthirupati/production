description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Sync Failing AWX Project
  from SCM` during a realistic incident. The business impact is reduced service reliability until the
  underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: AWX with one project in error state (tower-config). Dependent templates cannot
  launch. The tower-config Git project failed its last SCM sync, blocking job templates. Diagnose in AWX
  and re-sync the project so templates can launch again.


  OBJECTIVE: Sign in to AWX and open Projects; Sync the failing tower-config project until status is successful;
  Confirm job templates are no longer blocked. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Sign in to AWX and open Projects
- Sync the failing tower-config project until status is successful
- Confirm job templates are no longer blocked
initial_state: AWX with one project in error state (tower-config). Dependent templates cannot launch.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ansible-playbook site.yml -vv` (or the scenario playbook) and read the
    first FAILED task — note host, task name, and error message.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Re-run with `-vvv` on the failing host only (`--limit <host>`).

    2. Check inventory, SSH connectivity, and `ansible.cfg` privilege settings.

    3. Compare the failed module output to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Confirm job templates are no longer blocked.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
