description: 'CONTEXT: A team operating Ansible automation needs you to resolve `ansible: Ansible Playbooks
  — Build From Scratch` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Ansible control node is ready but Ansible playbooks is not configured
  yet. Required tools may already be installed; your job is to create the configuration and bring the
  capability online. Build Ansible playbooks from scratch in this ansible lab. You start from a minimal
  environment and must produce a working configuration that demonstrates plays, tasks, handlers, idempotency,
  and check mode. Plan, implement, then prove it works.


  OBJECTIVE: A working Ansible playbooks setup must exist by the end of this lab; Configuration should
  follow team conventions and be easy to audit; The result should pass validation without manual cleanup.
  Success means `ansible webservers -m ping` includes `SUCCESS`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- A working Ansible playbooks setup must exist by the end of this lab
- Configuration should follow team conventions and be easy to audit
- The result should pass validation without manual cleanup
initial_state: The Ansible control node is ready but Ansible playbooks is not configured yet. Required
  tools may already be installed; your job is to create the configuration and bring the capability online.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ansible-playbook --syntax-check`, `--check`, and task output.

    2. Write down what looks normal versus wrong or missing for Ansible playbooks.

    3. Recall the core idea: plays, tasks, handlers, idempotency, and check mode. Form one hypothesis
    before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `ansible-playbook --syntax-check`, `--check`, and task output.

    2. Create the smallest working slice of Ansible playbooks first, validate it, then add the remaining
    pieces one at a time.

    3. Verify the result — a second run reports no unexpected changes.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
summary: Complete the ansible playbooks — build lab ansible lab and verify success with the checker
