title: 'Ansible Automation: Ansible Inventory — Fundamentals Lab'
slug: academy-ansible-051-learn-inventory-6
technology: Ansible Automation
category: Core Skills
difficulty: easy
scenario_type: do
lab_mode: simulation
simulation_type: ansible
time_limit: 900
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Low
description: This beginner-friendly Ansible Automation lab introduces Ansible inventory.
  You will explore hosts, groups, variables, and connection settings on the Ansible
  control node. Read the environment first, then follow the guided steps — no prior
  production experience required.
objectives:
- Understand how Ansible inventory work in this lab environment
- Identify the main status and configuration signals for Ansible inventory
- Confirm you can read the current state confidently before changing anything
initial_state: The Ansible control node is online with a starter Ansible inventory
  setup. Some pieces are intentionally incomplete so you can learn how they fit together.
  Nothing is on fire — focus on observation.
hints:
- order: 1
  cost: 10
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ansible-inventory --graph` and group/host vars
    files.

    2. Write down what looks normal versus wrong or missing for Ansible inventory.

    3. Recall the core idea: hosts, groups, variables, and connection settings. Form
    one hypothesis before you act.'
- order: 2
  cost: 15
  content: 'Plan your approach (still no spoilers):

    1. Confirm the exact gap between current and desired state for Ansible inventory.

    2. Decide the single smallest change that moves you toward the objective.

    3. Capture evidence (command output / status) before the change so you can prove
    it worked afterward.'
- order: 3
  cost: 25
  content: 'Guided walkthrough:

    1. Re-check the current state — `ansible-inventory --graph` and group/host vars
    files.

    2. Make one small, reversible change toward the objective, re-reading status after
    each step so you understand cause and effect.

    3. Verify the result — inventory groups and vars match the intended environment.

    4. Record completion: add `# FIXED-OK` to `/opt/fixitlab/academy/academy-ansible-051-learn-inventory-6.conf`,
    then click Check Solution.'
