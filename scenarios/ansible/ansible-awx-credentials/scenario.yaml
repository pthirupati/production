description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Attach Machine Credential
  to AWX Template` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: AWX with Machine credential defined but not linked to the failing job template.
  A job template fails because the Machine SSH credential is not attached. Fix credential assignment in
  AWX so launches can authenticate to managed hosts.


  OBJECTIVE: Open AWX Credentials section; Attach the Machine credential to the failing template; Validate
  the template can launch. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Open AWX Credentials section
- Attach the Machine credential to the failing template
- Validate the template can launch
initial_state: AWX with Machine credential defined but not linked to the failing job template.
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run `ansible-playbook site.yml -vv` (or the scenario playbook) and read the
    first FAILED task — note host, task name, and error message.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Re-run with `-vvv` on the failing host only (`--limit <host>`).

    2. Check inventory, SSH connectivity, and `ansible.cfg` privilege settings.

    3. Compare the failed module output to the scenario objectives.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Validate the template can launch.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
