category: Fix
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Ansible Playbook Failure`
  during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Simulated Ansible control node with an inventory including web1 and web2.
  Running ansible-playbook site.yml fails on web2 (a task errors there); web1 completes successfully.
  An Ansible playbook run fails on host web2 during execution. A task (typically starting or enabling
  a service) returns a non-zero result on that host while the others succeed, so the play aborts. Read
  the failed task output, fix the underlying problem on web2, and re-run the playbook to a clean PLAY
  RECAP.


  OBJECTIVE: Run the playbook and identify the exact failed task and host (web2); Fix the underlying cause
  on web2 (e.g. the failing service or its config); Re-run the playbook and confirm web2 shows ok/changed
  with failed=0. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
difficulty: hard
dual_terminal: false
hints:
- order: 1
  cost: 0
  content: 'Where to look: Run the playbook and identify the exact failed task and host (web2)'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Fix the underlying cause on web2 (e.g. the failing service or its config)

    2. Re-run the playbook and confirm web2 shows ok/changed with failed=0'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-run the playbook and confirm web2 shows ok/changed with failed=0.

    2. Re-run the lab checker (`check.sh` or Check Solution).

    3. Confirm every scenario objective is satisfied.


    WHY: the grader validates real state — marker files are ignored.'
