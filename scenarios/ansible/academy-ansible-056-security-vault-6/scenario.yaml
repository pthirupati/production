description: 'CONTEXT: A team operating Ansible automation needs you to resolve `ansible: Ansible Vault
  — Security Practice` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The environment is functional but overly permissive around Ansible Vault.
  Assume an auditor or pen test is next week — tighten controls with evidence. Security review: harden
  Ansible Vault on this ansible system. Close unsafe defaults, enforce least privilege, and ensure encrypting
  secrets and decrypt at runtime cannot be abused — without breaking legitimate use.


  OBJECTIVE: Unsafe defaults related to Ansible Vault are removed or constrained; Access follows least
  privilege and is auditable; Security checks pass without breaking required functionality. Success means
  `ansible webservers -m ping` includes `SUCCESS`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Unsafe defaults related to Ansible Vault are removed or constrained
- Access follows least privilege and is auditable
- Security checks pass without breaking required functionality
initial_state: The environment is functional but overly permissive around Ansible Vault. Assume an auditor
  or pen test is next week — tighten controls with evidence.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `ansible-vault view` and vault-id config.

    2. Write down what looks normal versus wrong or missing for Ansible Vault.

    3. Recall the core idea: encrypting secrets and decrypt at runtime. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `ansible-vault view` and vault-id config.

    2. Apply least privilege: remove the unsafe default, then grant only the explicit access the workload
    actually needs.

    3. Verify the result — secrets are encrypted and plays decrypt them at runtime.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
