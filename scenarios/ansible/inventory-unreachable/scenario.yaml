title: Hosts Unreachable in Inventory
slug: ansible-inventory-unreachable
difficulty: medium
category: Ansible Automation
description: 'Ansible reports all hosts as UNREACHABLE when the playbook runs. The inventory file specifies
  incorrect SSH usernames and a wrong private key path. Additionally, the ansible_host addresses have
  a typo in one subnet octet. All three must be corrected for Ansible to connect to the managed nodes.

  '
initial_state: 'Simulated control node with inventory file pointing at three managed hosts. Running ansible
  all -m ping returns UNREACHABLE for all hosts.

  '
objectives:
- Run ansible all -m ping -vvv to inspect the exact SSH connection attempt details
- Correct the ansible_user, ansible_ssh_private_key_file, and ansible_host values
- Confirm all hosts respond to ansible all -m ping with pong
lab_mode: simulation
simulation_type: ansible
time_limit: 900
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: Run `ansible all -m ping -vvv` to see the exact SSH command and failure (wrong user, wrong
    key path, or connection refused to a wrong IP).
- order: 2
  cost: 15
  content: 'Inspect the inventory variables for typos: `ansible_user`, `ansible_ssh_private_key_file`,
    and `ansible_host`. One host''s ansible_host has a wrong subnet octet.'
- order: 3
  cost: 20
  content: Correct ansible_user, fix the key path to the real private key, and fix the typo'd ansible_host
    octet. Re-run `ansible all -m ping` — every host returns "pong".
requires_companion_hosts: true
dual_terminal: false
jira_priority: Medium
