description: 'CONTEXT: A team operating Ansible automation needs you to resolve `Launch and Fix Failed
  AWX Job Template` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: AWX with a failed Deploy App template run and a project sync error. The Deploy
  App job template is failing after a bad project sync. Fix the underlying issue and re-launch the template
  until the job succeeds.


  OBJECTIVE: Sync the failing project if needed; Launch the Deploy App job template; Confirm the job completes
  successfully. Success means `check.sh` exits successfully.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Sync the failing project if needed
- Launch the Deploy App job template
- Confirm the job completes successfully
initial_state: AWX with a failed Deploy App template run and a project sync error.
