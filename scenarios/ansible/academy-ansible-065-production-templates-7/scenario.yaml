description: 'CONTEXT: A team operating Ansible automation needs you to resolve `ansible: Jinja2 Templates
  — Production Readiness` during a realistic incident. The business impact is reduced service reliability
  until the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: A feature fix works in dev, but Jinja2 templates is not production ready —
  missing guardrails, runbooks, or capacity checks. Production readiness for Jinja2 templates. Harden,
  document, and validate variables, filters, and conditionals in templates so the change is safe to run
  during a maintenance window.


  OBJECTIVE: Day-2 Jinja2 templates work completes safely in this environment; Changes are verified with
  before/after checks; The system remains stable for dependent teams. Success means `ansible webservers
  -m ping` includes `SUCCESS`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- Day-2 Jinja2 templates work completes safely in this environment
- Changes are verified with before/after checks
- The system remains stable for dependent teams
initial_state: A feature fix works in dev, but Jinja2 templates is not production ready — missing guardrails,
  runbooks, or capacity checks.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — template files, `--check --diff`, and rendered output.

    2. Write down what looks normal versus wrong or missing for Jinja2 templates.

    3. Recall the core idea: variables, filters, and conditionals in templates. Form one hypothesis before
    you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — template files, `--check --diff`, and rendered output.

    2. Apply production standards for Jinja2 templates: resource limits, monitoring, access controls,
    and a written rollback step.

    3. Verify the result — the rendered file matches the intended config.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
