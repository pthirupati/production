description: 'CONTEXT: A team operating Ansible automation needs you to resolve `ansible: Handlers — Troubleshooting
  Drill` during a realistic incident. The business impact is reduced service reliability until the underlying
  state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: The Ansible control node is degraded. A service is not restarted after a config
  change. Recent changes may exist around handlers, but do not restart blindly — gather evidence first.
  Production alert: a service is not restarted after a config change. You are on call for ansible and
  must troubleshoot handlers methodically — triage symptoms, isolate root cause, apply the smallest safe
  fix, and confirm recovery.


  OBJECTIVE: The incident symptom is clear: a service is not restarted after a config change; Root cause
  is isolated with evidence, not guesswork; Service behavior returns to normal after the fix. Success
  means `ansible webservers -m ping` includes `SUCCESS`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- 'The incident symptom is clear: a service is not restarted after a config change'
- Root cause is isolated with evidence, not guesswork
- Service behavior returns to normal after the fix
initial_state: The Ansible control node is degraded. A service is not restarted after a config change.
  Recent changes may exist around handlers, but do not restart blindly — gather evidence first.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — playbook notify lines and `--diff` output.

    2. Write down what looks normal versus wrong or missing for handlers.

    3. Recall the core idea: notify/handler flow and run-once semantics. Form one hypothesis before you
    act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — playbook notify lines and `--diff` output.

    2. Fix the underlying misconfiguration you identified (not just the noisy log line), changing one
    thing at a time.

    3. Verify the result — handlers fire exactly when notified.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
