title: Handler Not Triggered After Task
slug: ansible-handler-not-notified
difficulty: hard
category: Ansible Automation
description: 'A playbook deploys a new nginx configuration file but the nginx service is never reloaded
  — the handler is defined but never triggered. The notify directive is misspelled (case mismatch), the
  handler name has a leading space, and the task is marked changed_when: false, preventing the notification.
  All three issues must be fixed.

  '
initial_state: 'Simulated control node. Playbook deploys nginx.conf but after the run the old configuration
  is still active. No "RUNNING HANDLER" line appears in the output.

  '
objectives:
- Inspect the playbook to find why the handler is not being notified
- Fix the notify name, handler name formatting, and changed_when setting
- Verify the handler runs (nginx reloads) on the next playbook execution
lab_mode: simulation
simulation_type: ansible
time_limit: 1200
max_score: 100
is_free: false
hints:
- order: 1
  cost: 10
  content: 'Run the playbook and note there is no "RUNNING HANDLER" line: `ansible-playbook site.yml`.
    Inspect the handler and the task''s notify string — they must match exactly.'
- order: 2
  cost: 20
  content: 'Handler names are case-sensitive and whitespace-sensitive: a notify of "reload nginx" won''t
    match a handler named "Reload nginx" or " reload nginx". Also, `changed_when: false` on the task means
    it never reports changed, so it never notifies.'
- order: 3
  cost: 30
  content: 'Fix all three: make the notify string match the handler name exactly, remove the leading space
    in the handler name, and drop the `changed_when: false` (or set it correctly). Re-run — you now see
    "RUNNING HANDLER [reload nginx]" and nginx reloads.'
requires_companion_hosts: false
dual_terminal: false
jira_priority: High
