title: Rolling Deploys — Integration Lab
slug: academy-ansible-020-integration-rolling-deploy-2
technology: ansible
category: Project
difficulty: hard
scenario_type: do
lab_mode: simulation
simulation_type: ansible
time_limit: 1200
max_score: 100
is_free: false
infrastructure_type: docker
jira_priority: Medium
description: 'CONTEXT: A team operating Ansible automation needs you to resolve `ansible: Rolling Deploys
  — Integration Lab` during a realistic incident. The business impact is reduced service reliability until
  the underlying state is repaired.


  ENVIRONMENT: You are working in FixitLab''s offline Ansible control node with inventory, playbooks,
  roles, and ansible-playbook. All tools run locally; no paid APIs or external cloud calls are required.


  SYMPTOM / STARTING STATE: Two systems are deployed but not fully wired together for rolling deploys.
  Downstream consumers are waiting on this integration path. Integration lab: connect rolling deploys
  with an adjacent platform in the ansible stack. Validate authentication, data handoff, and failure behavior
  for serial, max-fail, and health gating.


  OBJECTIVE: rolling deploys is connected to the adjacent system successfully; Handoff points are authenticated
  and observable; End-to-end workflow completes without manual intervention. Success means `ansible webservers
  -m ping` includes `SUCCESS`.


  WHAT TO AVOID: Do not apply broad destructive changes, skip evidence gathering, or fake completion with
  marker files — the checker validates real system state.'
objectives:
- rolling deploys is connected to the adjacent system successfully
- Handoff points are authenticated and observable
- End-to-end workflow completes without manual intervention
initial_state: Two systems are deployed but not fully wired together for rolling deploys. Downstream consumers
  are waiting on this integration path.
hints:
- order: 1
  cost: 0
  content: 'Orient yourself before changing anything:

    1. Inspect the current state — `serial:` settings and per-batch results.

    2. Write down what looks normal versus wrong or missing for rolling deploys.

    3. Recall the core idea: serial, max-fail, and health gating. Form one hypothesis before you act.'
- order: 2
  cost: 25
  content: 'Diagnostic steps:

    1. Verify `inventory` hostnames resolve and SSH keys work.

    2. Check `ansible.cfg` for remote_user and privilege escalation.

    3. Test manual `ssh user@host` from the control node.'
- order: 3
  cost: 50
  content: 'Exact fix + verification:

    1. Re-check the current state — `serial:` settings and per-batch results.

    2. Configure credentials and networking, then drive one happy-path transaction end to end across both
    systems.

    3. Verify the result — the rollout proceeds in batches and halts on failure.

    4. Click Check Solution once the objective is met (graded on real state, not a marker file).'
cross_technology: true
summary: Complete the rolling deploys — integration lab ansible lab and verify success with the checker
estimated_minutes: 20
xp_reward: 100
prerequisites:
- Basic ansible literacy
tags:
- ansible
