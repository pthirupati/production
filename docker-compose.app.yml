# FixitLab — D2 App droplet (four-droplet topology)
# Private droplet: backend (Django/ASGI) + all Celery workers + beat.
# VMware / IDE / devops simulations run INSIDE the backend process (no extra service).
# Reuses service definitions from docker-compose.prod.yml.
#
# Usage on D2:
#   COMPOSE_FILE=docker-compose.app.yml ./scripts/platform-start.sh
#   docker compose -f docker-compose.app.yml --env-file .env.production up -d
#
# Connectivity (all via .env.production, wired by scripts/ci-wire-cluster-env.py):
#   - Postgres/pgBouncer  → D3 private IP   (POSTGRES_HOST / PGBOUNCER_HOST)
#   - Redis / RabbitMQ    → D1 private IP   (REDIS_HOST / CELERY_BROKER_URL)
#   - Vault               → http://<D1>:8200 (VAULT_ADDR)
#   - Lab Docker engine   → ssh://root@<D4> (DOCKER_SOCKET / DOCKER_HOST)
#
# Backend exposes 8000 on the VPC private interface so the D1 gateway upstream
# (backend_pool → {{APP_PRIVATE_IP}}:8000) can reach it. The DO firewall
# (scripts/ci-setup-firewalls.sh) restricts 8000 to the D1 private IP only.

services:

  backend:
    build: ./backend
    # Pinned image name: the local build tag AND (when IMAGE_TAG is a pushed Docker Hub
    # SHA + the deploy passes --pull) the image pulled instead of rebuilt on D2.
    #
    # The `:-latest` default is deliberately NOT `:?`. Audit O5 reads it as "a deploy
    # without IMAGE_TAG silently ships a stale image", but that is only true on the
    # PULL path. The droplet deploy sets IMAGE_TAG="" on purpose
    # (.github/workflows/production.yml) and platform-start.sh then runs
    # `up -d --build`, which rebuilds and re-tags :latest from source in the same
    # command — so :latest there is this commit's build, not a stale one. Making the
    # tag required would break that primary path. The stale-image risk is confined to
    # PULL_IMAGES=1 with an empty IMAGE_TAG; that combination is guarded in
    # scripts/ci-cluster-deploy.sh, which falls back to an on-node build instead.
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-backend:${IMAGE_TAG:-latest}
    container_name: fixitlab-backend-1
    env_file:
      - .env.production
    environment:
      TERMINAL_MAX_WS_PER_USER: ${TERMINAL_MAX_WS_PER_USER:-20}
      # Heavy tutorial seed runs in platform-start.sh after health — not at boot.
      SKIP_STARTUP_TUTORIAL_SEED: "1"
      # Remote lab Docker engine on D4 (set by ci-wire-cluster-env.py)
      # Django sandbox_runner reads DOCKER_SOCKET (not only DOCKER_HOST).
      DOCKER_SOCKET: ${DOCKER_SOCKET:-unix:///var/run/docker.sock}
      DOCKER_HOST: ${DOCKER_SOCKET:-unix:///var/run/docker.sock}
      SANDBOX_DOCKER: ${SANDBOX_DOCKER:-1}
      # Identify this node to the fleet monitor so it attaches its live host
      # metrics to the right card, and reads its own system containers from the
      # LOCAL daemon (mounted below) rather than the remote labs engine.
      CLUSTER_ROLE: ${CLUSTER_ROLE:-app}
      MONITORING_NODE_NAME: ${MONITORING_NODE_NAME:-app}
      MONITORING_LOCAL_DOCKER_SOCKET: unix:///var/run/docker.sock
      # Lets the fleet monitor read the 4-droplet topology (see ./infra mount).
      CLUSTER_TOPOLOGY_FILE: ${CLUSTER_TOPOLOGY_FILE:-/app/infra/digitalocean/cluster.json}
    ports:
      # Bind 8000 to THIS droplet's VPC address, not 0.0.0.0. The DO cloud firewall
      # (scripts/ci-setup-firewalls.sh) already restricts source to D1, but that is a
      # control-plane rule: if it is dropped/misapplied the port is on every interface
      # including the public one. Binding the host IP makes the kernel the second
      # control, so both have to fail.
      #
      # `:?` not `:-`: measured with `docker compose config`, an UNSET or EMPTY prefix
      # does not error — compose emits the port with no host_ip, i.e. silently back on
      # 0.0.0.0. A default would therefore un-harden this on exactly the runs where the
      # env is broken. APP_PRIVATE_IP is written into .env.production by
      # ci-wire-cluster-env.py and compose reads it via --env-file, so a missing value
      # means the cluster env never landed — fail the deploy loudly instead.
      - "${APP_PRIVATE_IP:?APP_PRIVATE_IP must be set (cluster env not wired) — required to bind 8000 to the VPC interface}:8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # SSH identity for remote Docker on D4 (created by ci-setup-labs-ssh.sh)
      - ./deploy/labs_ssh:/root/.ssh:ro
      - ./scripts:/scripts
      - ./scenarios:/scenarios:ro
      # Cluster topology (cluster.json) so the fleet monitor sees all 4 droplets.
      - ./infra:/app/infra:ro
      # Local D2 Docker socket — lets admin monitoring enumerate THIS node's own
      # system containers (backend / celery) even though DOCKER_HOST points at
      # the remote labs engine. Read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Add the backend to the host's docker group so it can READ the mounted
    # /var/run/docker.sock for admin monitoring even if the image ever runs as a
    # non-root user (the :ro mount only makes the socket file read-only, not the
    # Docker API — group membership is what grants access to the socket). The
    # host's docker gid is `getent group docker | cut -d: -f3` (Debian default
    # 999); wire DOCKER_GID through .env.production (see ci-wire-cluster-env.py).
    # Harmless for the current root user; required the moment a USER is added.
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health/'); assert r.status==200"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s
    deploy:
      resources:
        limits:
          # 5G so the unit-test process (run via exec, with celery paused by the CI
          # job to free host RAM) doesn't hit the cgroup limit and OOM (status 137).
          memory: 5G
        reservations:
          memory: 512M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    build: ./backend
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-backend:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info --concurrency=8 -Q default,notifications -n default@%h
    env_file:
      - .env.production
    environment:
      # Django sandbox_runner reads DOCKER_SOCKET (not only DOCKER_HOST).
      DOCKER_SOCKET: ${DOCKER_SOCKET:-unix:///var/run/docker.sock}
      DOCKER_HOST: ${DOCKER_SOCKET:-unix:///var/run/docker.sock}
      SANDBOX_DOCKER: ${SANDBOX_DOCKER:-1}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./deploy/labs_ssh:/root/.ssh:ro
      - ./scripts:/scripts
      - ./scenarios:/scenarios:ro
      # Cluster topology (cluster.json) so the fleet monitor sees all 4 droplets.
      - ./infra:/app/infra:ro
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q 'pong'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_provisioning:
    build: ./backend
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-backend:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info --concurrency=10 -Q provisioning -n provisioning@%h
    env_file:
      - .env.production
    environment:
      # Django sandbox_runner reads DOCKER_SOCKET (not only DOCKER_HOST).
      DOCKER_SOCKET: ${DOCKER_SOCKET:-unix:///var/run/docker.sock}
      DOCKER_HOST: ${DOCKER_SOCKET:-unix:///var/run/docker.sock}
      SANDBOX_DOCKER: ${SANDBOX_DOCKER:-1}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./deploy/labs_ssh:/root/.ssh:ro
      - ./scripts:/scripts
      - ./scenarios:/scenarios:ro
      # Cluster topology (cluster.json) so the fleet monitor sees all 4 droplets.
      - ./infra:/app/infra:ro
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q 'pong'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_maintenance:
    build: ./backend
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-backend:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info --concurrency=2 -Q maintenance -n maintenance@%h
    env_file:
      - .env.production
    environment:
      # Django sandbox_runner reads DOCKER_SOCKET (not only DOCKER_HOST).
      DOCKER_SOCKET: ${DOCKER_SOCKET:-unix:///var/run/docker.sock}
      DOCKER_HOST: ${DOCKER_SOCKET:-unix:///var/run/docker.sock}
      SANDBOX_DOCKER: ${SANDBOX_DOCKER:-1}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./deploy/labs_ssh:/root/.ssh:ro
      - ./scripts:/scripts
      - ./scenarios:/scenarios:ro
      # Cluster topology (cluster.json) so the fleet monitor sees all 4 droplets.
      - ./infra:/app/infra:ro
    networks:
      - fixitlab_net
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q 'pong'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat:
    build: ./backend
    image: ${FIXITLAB_IMAGE_NS:-fixitlab}/fixitlab-backend:${IMAGE_TAG:-latest}
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid
    env_file:
      - .env.production
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - fixitlab_net
    # Audit Z5-15. The pidfile half proves the PROCESS is alive; the heartbeat half
    # proves it is still SCHEDULING. Previously only the former was checked, so a
    # wedged-but-running beat meant no expiry cleanup, no orphan cleanup and no
    # retention sweep, with zero alerts.
    #
    # NOT the schedule-file mtime, which is the obvious alternative: measured, it
    # does not advance when the next task is an hour away, so it would report a
    # healthy beat as dead and restart-loop it.
    #
    # 200s = three missed 60s beats: quick enough to catch a wedge, loose enough
    # that one slow tick under load does not restart a healthy scheduler.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) 2>/dev/null && test -f /tmp/celerybeat-heartbeat && [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/celerybeat-heartbeat) )) -lt 200 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  static_volume:
    name: fixitlab_static
  media_volume:
    name: fixitlab_media

networks:
  fixitlab_net:
    # External — pre-created per node by ci-bootstrap-cluster.sh so Vault can attach
    # before the app stack comes up. Marking it external avoids the compose
    # "network exists but has incorrect label" conflict on the shared bridge.
    external: true
    name: fixitlab_net
