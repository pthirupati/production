<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FixitLab story — Break things. Fix them. Get hired.">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .disp{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
      .body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
      .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
    </style>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d78ff"/><stop offset="0.5" stop-color="#b266e0"/><stop offset="1" stop-color="#49b5ff"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d78ff" stop-opacity="0.5"/><stop offset="1" stop-color="#6d78ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b266e0" stop-opacity="0.45"/><stop offset="1" stop-color="#b266e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d78ff" stop-opacity="0.5"/><stop offset="1" stop-color="#b266e0" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="#080a16"/>
  <circle cx="180" cy="380" r="520" fill="url(#orbCyan)"/>
  <circle cx="940" cy="1560" r="560" fill="url(#orbPurple)"/>

  <!-- Logo -->
  <g transform="translate(360,360)">
    <rect width="80" height="80" rx="20" fill="url(#brand)"/>
    <text x="40" y="55" text-anchor="middle" class="mono" font-size="42" font-weight="700" fill="#080a16">&gt;_</text>
    <text x="102" y="42" class="disp" font-size="42" font-weight="800" fill="#ffffff">Fixit</text>
    <text x="210" y="42" class="disp" font-size="42" font-weight="800" fill="url(#brand)">Lab</text>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(330,500)">
    <rect width="420" height="46" rx="23" fill="#6d78ff" fill-opacity="0.14" stroke="#6d78ff" stroke-opacity="0.35"/>
    <circle cx="30" cy="23" r="5" fill="#56e0b0"/>
    <text x="210" y="30" text-anchor="middle" class="body" font-size="16" font-weight="600" fill="#9fa8ff" letter-spacing="1.5">LIVE CLOUD LABS · AI INTERVIEWS</text>
  </g>

  <!-- Headline -->
  <text x="540" y="700" text-anchor="middle" class="disp" font-size="92" font-weight="800" fill="#ffffff">Break things.</text>
  <text x="540" y="800" text-anchor="middle" class="disp" font-size="92" font-weight="800" fill="#ffffff">Fix them.</text>
  <text x="540" y="900" text-anchor="middle" class="disp" font-size="92" font-weight="800" fill="url(#brand)">Get hired.</text>

  <!-- Feature list -->
  <g transform="translate(210,1010)" class="body" font-size="26" font-weight="500" fill="#cdd5f4">
    <g transform="translate(0,0)"><circle cx="14" cy="14" r="14" fill="#49b5ff" fill-opacity="0.18"/><text x="11" y="20" class="body" font-size="18" fill="#8fd0ff">✓</text><text x="44" y="22">Fix It · Build It · Hack It challenges</text></g>
    <g transform="translate(0,64)"><circle cx="14" cy="14" r="14" fill="#b266e0" fill-opacity="0.18"/><text x="11" y="20" class="body" font-size="18" fill="#d6a8ee">✓</text><text x="44" y="22">AI voice mock interviews + certs</text></g>
    <g transform="translate(0,128)"><circle cx="14" cy="14" r="14" fill="#56e0b0" fill-opacity="0.18"/><text x="11" y="20" class="body" font-size="18" fill="#7fe8c6">✓</text><text x="44" y="22">Real terminals · Docker · AWS · DO</text></g>
    <g transform="translate(0,192)"><circle cx="14" cy="14" r="14" fill="#feb155" fill-opacity="0.18"/><text x="11" y="20" class="body" font-size="18" fill="#ffcd8a">✓</text><text x="44" y="22">RHCSA · CKA certification prep</text></g>
  </g>

  <!-- Terminal mock -->
  <g transform="translate(150,1306)">
    <rect width="780" height="240" rx="18" fill="#0d1024" stroke="url(#cardEdge)" stroke-width="1.5"/>
    <rect width="780" height="48" rx="18" fill="#141833"/><rect y="30" width="780" height="18" fill="#141833"/>
    <circle cx="30" cy="24" r="7" fill="#ec6a5e"/><circle cx="56" cy="24" r="7" fill="#feb155"/><circle cx="82" cy="24" r="7" fill="#56e0b0"/>
    <text x="390" y="29" text-anchor="middle" class="mono" font-size="14" fill="#7d86ad">root@fixit-lab: ~/incident</text>
    <g class="mono" font-size="18">
      <text x="28" y="98" fill="#56e0b0">$ <tspan fill="#cdd5f4">systemctl restart api</tspan></text>
      <text x="28" y="134" fill="#ec6a5e">● failed → diagnosing…</text>
      <text x="28" y="170" fill="#56e0b0">$ <tspan fill="#cdd5f4">./check-solution</tspan></text>
    </g>
    <g transform="translate(28,186)">
      <rect width="724" height="42" rx="10" fill="#56e0b0" fill-opacity="0.12" stroke="#56e0b0" stroke-opacity="0.4"/>
      <text x="18" y="28" class="body" font-size="17" font-weight="600" fill="#7fe8c6">✓ Solved in 02:41 — +180 pts</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(290,1620)">
    <rect width="500" height="76" rx="38" fill="url(#brand)"/>
    <text x="250" y="50" text-anchor="middle" class="body" font-size="26" font-weight="600" fill="#080a16">Start free today →</text>
  </g>
  <text x="540" y="1748" text-anchor="middle" class="body" font-size="20" fill="#7d86ad">21+ technologies · 360+ scenarios · 10k+ engineers</text>
</svg>
