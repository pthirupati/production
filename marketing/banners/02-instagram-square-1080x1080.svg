<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FixitLab — Break things. Fix them. Get hired.">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .disp{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
      .body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
      .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
    </style>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d78ff"/><stop offset="0.5" stop-color="#b266e0"/><stop offset="1" stop-color="#49b5ff"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d78ff" stop-opacity="0.5"/><stop offset="1" stop-color="#6d78ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b266e0" stop-opacity="0.45"/><stop offset="1" stop-color="#b266e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d78ff" stop-opacity="0.5"/><stop offset="1" stop-color="#b266e0" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="#080a16"/>
  <circle cx="180" cy="160" r="420" fill="url(#orbCyan)"/>
  <circle cx="960" cy="980" r="460" fill="url(#orbPurple)"/>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 270 H1080 M0 540 H1080 M0 810 H1080 M270 0 V1080 M540 0 V1080 M810 0 V1080"/>
  </g>

  <!-- Logo -->
  <g transform="translate(390,96)">
    <rect width="72" height="72" rx="18" fill="url(#brand)"/>
    <text x="36" y="50" text-anchor="middle" class="mono" font-size="38" font-weight="700" fill="#080a16">&gt;_</text>
    <text x="92" y="38" class="disp" font-size="38" font-weight="800" fill="#ffffff">Fixit</text>
    <text x="190" y="38" class="disp" font-size="38" font-weight="800" fill="url(#brand)">Lab</text>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(355,228)">
    <rect width="370" height="40" rx="20" fill="#6d78ff" fill-opacity="0.14" stroke="#6d78ff" stroke-opacity="0.35"/>
    <circle cx="26" cy="20" r="4.5" fill="#56e0b0"/>
    <text x="185" y="26" text-anchor="middle" class="body" font-size="15" font-weight="600" fill="#9fa8ff" letter-spacing="1.5">HANDS-ON DEVOPS &amp; SRE TRAINING</text>
  </g>

  <!-- Headline -->
  <text x="540" y="380" text-anchor="middle" class="disp" font-size="78" font-weight="800" fill="#ffffff">Break things.</text>
  <text x="540" y="466" text-anchor="middle" class="disp" font-size="78" font-weight="800" fill="#ffffff">Fix them.</text>
  <text x="540" y="552" text-anchor="middle" class="disp" font-size="78" font-weight="800" fill="url(#brand)">Get hired.</text>

  <text x="540" y="616" text-anchor="middle" class="body" font-size="23" fill="#aeb6d4">Live cloud labs · AI mock interviews · cert prep</text>

  <!-- Terminal mock -->
  <g transform="translate(150,672)">
    <rect width="780" height="246" rx="18" fill="#0d1024" stroke="url(#cardEdge)" stroke-width="1.5"/>
    <rect width="780" height="48" rx="18" fill="#141833"/>
    <rect y="30" width="780" height="18" fill="#141833"/>
    <circle cx="30" cy="24" r="7" fill="#ec6a5e"/><circle cx="56" cy="24" r="7" fill="#feb155"/><circle cx="82" cy="24" r="7" fill="#56e0b0"/>
    <text x="390" y="29" text-anchor="middle" class="mono" font-size="14" fill="#7d86ad">root@fixit-lab: ~/incident</text>
    <g class="mono" font-size="17">
      <text x="28" y="96" fill="#56e0b0">$ <tspan fill="#cdd5f4">systemctl restart api</tspan></text>
      <text x="28" y="130" fill="#ec6a5e">● failed → diagnosing root cause…</text>
      <text x="28" y="164" fill="#56e0b0">$ <tspan fill="#cdd5f4">fuser -k 8080/tcp &amp;&amp; ./check</tspan></text>
    </g>
    <g transform="translate(28,184)">
      <rect width="724" height="44" rx="10" fill="#56e0b0" fill-opacity="0.12" stroke="#56e0b0" stroke-opacity="0.4"/>
      <text x="18" y="29" class="body" font-size="17" font-weight="600" fill="#7fe8c6">✓ Solved in 02:41 — +180 pts · streak ×4</text>
    </g>
  </g>

  <!-- Stats -->
  <g class="disp" text-anchor="middle">
    <text x="270" y="990" font-size="34" font-weight="800" fill="#ffffff">21+</text>
    <text x="270" y="1018" class="body" font-size="15" fill="#7d86ad">technologies</text>
    <text x="540" y="990" font-size="34" font-weight="800" fill="#ffffff">360+</text>
    <text x="540" y="1018" class="body" font-size="15" fill="#7d86ad">scenarios</text>
    <text x="810" y="990" font-size="34" font-weight="800" fill="#ffffff">10k+</text>
    <text x="810" y="1018" class="body" font-size="15" fill="#7d86ad">engineers</text>
  </g>
</svg>
