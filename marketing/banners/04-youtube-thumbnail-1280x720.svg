<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FixitLab YouTube thumbnail">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800;900&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .disp{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
      .body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
      .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
    </style>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d78ff"/><stop offset="0.5" stop-color="#b266e0"/><stop offset="1" stop-color="#49b5ff"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d78ff" stop-opacity="0.55"/><stop offset="1" stop-color="#6d78ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b266e0" stop-opacity="0.5"/><stop offset="1" stop-color="#b266e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d78ff" stop-opacity="0.6"/><stop offset="1" stop-color="#b266e0" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#080a16"/>
  <circle cx="160" cy="120" r="380" fill="url(#orbCyan)"/>
  <circle cx="1180" cy="660" r="420" fill="url(#orbPurple)"/>

  <!-- Logo -->
  <g transform="translate(64,56)">
    <rect width="54" height="54" rx="14" fill="url(#brand)"/>
    <text x="27" y="37" text-anchor="middle" class="mono" font-size="28" font-weight="700" fill="#080a16">&gt;_</text>
    <text x="70" y="36" class="disp" font-size="32" font-weight="800" fill="#ffffff">FixitLab</text>
  </g>

  <!-- Big headline -->
  <text x="60" y="280" class="disp" font-size="96" font-weight="900" fill="#ffffff">BREAK IT.</text>
  <text x="60" y="380" class="disp" font-size="96" font-weight="900" fill="#ffffff">FIX IT.</text>
  <text x="60" y="480" class="disp" font-size="96" font-weight="900" fill="url(#brand)">GET HIRED.</text>

  <!-- Yellow highlight badge -->
  <g transform="translate(64,520)">
    <rect width="520" height="56" rx="12" fill="#feb155"/>
    <text x="260" y="38" text-anchor="middle" class="disp" font-size="28" font-weight="800" fill="#080a16">LIVE LABS + AI INTERVIEWS</text>
  </g>

  <!-- Terminal mock (right) -->
  <g transform="translate(780,150)">
    <rect width="440" height="320" rx="16" fill="#0d1024" stroke="url(#cardEdge)" stroke-width="2"/>
    <rect width="440" height="46" rx="16" fill="#141833"/><rect y="28" width="440" height="18" fill="#141833"/>
    <circle cx="28" cy="23" r="7" fill="#ec6a5e"/><circle cx="54" cy="23" r="7" fill="#feb155"/><circle cx="80" cy="23" r="7" fill="#56e0b0"/>
    <g class="mono" font-size="18">
      <text x="26" y="96" fill="#ec6a5e">● service FAILED</text>
      <text x="26" y="134" fill="#56e0b0">$ <tspan fill="#cdd5f4">diagnose &amp; fix…</tspan></text>
      <text x="26" y="172" fill="#49b5ff">→ root cause found</text>
      <text x="26" y="210" fill="#56e0b0">$ <tspan fill="#cdd5f4">./check-solution</tspan></text>
    </g>
    <g transform="translate(26,236)">
      <rect width="388" height="60" rx="12" fill="#56e0b0" fill-opacity="0.15" stroke="#56e0b0" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="194" y="38" text-anchor="middle" class="disp" font-size="22" font-weight="800" fill="#7fe8c6">✓ SOLVED +180</text>
    </g>
  </g>
  <text x="1000" y="560" text-anchor="middle" class="body" font-size="22" font-weight="600" fill="#aeb6d4">Real terminals · zero setup</text>
</svg>
