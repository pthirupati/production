<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FixitLab YouTube channel banner">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .disp{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
      .body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
      .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
    </style>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d78ff"/><stop offset="0.5" stop-color="#b266e0"/><stop offset="1" stop-color="#49b5ff"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d78ff" stop-opacity="0.4"/><stop offset="1" stop-color="#6d78ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b266e0" stop-opacity="0.38"/><stop offset="1" stop-color="#b266e0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="1440" fill="#080a16"/>
  <circle cx="700" cy="500" r="640" fill="url(#orbCyan)"/>
  <circle cx="1860" cy="980" r="680" fill="url(#orbPurple)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 480 H2560 M0 960 H2560 M640 0 V1440 M1280 0 V1440 M1920 0 V1440"/>
  </g>

  <!-- Safe area content centered (visible on all devices ~1546x423 around center 1280,720) -->
  <g transform="translate(820,560)">
    <rect width="88" height="88" rx="22" fill="url(#brand)"/>
    <text x="44" y="60" text-anchor="middle" class="mono" font-size="46" font-weight="700" fill="#080a16">&gt;_</text>
    <text x="112" y="50" class="disp" font-size="60" font-weight="800" fill="#ffffff">Fixit</text>
    <text x="270" y="50" class="disp" font-size="60" font-weight="800" fill="url(#brand)">Lab</text>
  </g>

  <text x="1280" y="760" text-anchor="middle" class="disp" font-size="56" font-weight="800" fill="#ffffff">Break things. Fix them. <tspan fill="url(#brand)">Get hired.</tspan></text>
  <text x="1280" y="820" text-anchor="middle" class="body" font-size="28" fill="#aeb6d4">Live cloud labs · AI mock interviews · DevOps &amp; SRE incident-response practice</text>

  <!-- pills -->
  <g transform="translate(900,860)" class="body" font-size="22" font-weight="600">
    <g><rect width="220" height="50" rx="25" fill="#49b5ff" fill-opacity="0.1" stroke="#49b5ff" stroke-opacity="0.3"/><text x="110" y="32" text-anchor="middle" fill="#8fd0ff">Fix · Build · Hack</text></g>
    <g transform="translate(240,0)"><rect width="230" height="50" rx="25" fill="#b266e0" fill-opacity="0.1" stroke="#b266e0" stroke-opacity="0.3"/><text x="115" y="32" text-anchor="middle" fill="#d6a8ee">AI Voice Interviews</text></g>
    <g transform="translate(490,0)"><rect width="270" height="50" rx="25" fill="#56e0b0" fill-opacity="0.1" stroke="#56e0b0" stroke-opacity="0.3"/><text x="135" y="32" text-anchor="middle" fill="#7fe8c6">21+ techs · 360+ labs</text></g>
  </g>
</svg>
